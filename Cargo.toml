[package]
name = "io-harness"
version = "0.44.0"
edition = "2021"
# `libsqlite3-sys` 0.38.1 sets the floor from 0.23.0 on: its build script — and
# `rusqlite` 0.40's own source — call the std `cfg_select!` macro, stabilised in
# 1.95.0. Neither crate publishes a `rust-version`, so cargo cannot catch it at
# resolve time; it fails inside the dependency's build script with
# `cannot find macro cfg_select in this scope`, which reads like a toolchain bug
# and is not one. Checked by hand rather than assumed: 1.93 and 1.94 both fail,
# 1.95 builds. This is the same shape as the rmcp 2.2.0 problem below, and the
# same lesson — an undeclared floor is still a floor.
#
# The previous floor was 1.88, set by rmcp's let-chains: on 2.2.0 it published no
# rust-version of its own so a 1.87 build failed inside the dependency; 3.0.0
# declares 1.88 itself, which is the same number arrived at honestly. The other
# floors are lower: process-wrap (via rmcp's child-process transport) needs 1.87,
# reqwest 0.13 needs 1.85. 0.8.0 and 0.8.1 declared 1.87 by counting only
# process-wrap.
rust-version = "1.95"
authors = ["Aakash Pawar"]
license = "Apache-2.0"
# One sentence a human reads. This field was a comma-separated inventory of
# every release, which reached 1041 characters at 0.11.0 and was refused by
# crates.io against its 1000-character cap. The inventory belongs in the README
# and the guide pages, which is where 0.16.0 put it.
description = "An embeddable agent runtime for Rust: any task, any provider, in your own process. Run commands, edit files and search a repository under a layered permission boundary on files, commands and network; gate the result on the project's own test command in any language, or on nothing at all; and keep a full SQLite trace of every step, refusal and budget draw. With an execution sandbox, contained sub-agents, an MCP client, and durable resume for unattended runs."
repository = "https://github.com/initorigin/io-harness"
readme = "README.md"
keywords = ["agent", "ai", "llm", "mcp", "harness"]
categories = ["asynchronous", "api-bindings"]
# Workspace/planning state and local credentials are not part of the crate.
#
# `.env` is here for the reason the other two are not: a publish is
# irreversible, and the belt-and-braces case is worth the line. `cargo package`
# lists files through git in a git checkout, so an ignored `.env` would not be
# packaged anyway — but "would not be" rests on this staying a git checkout with
# that ignore rule, and a leaked registry token cannot be unleaked.
#
# docs/ is deliberately NOT excluded: the crate root and the README link the
# guide pages, and a package that ships the links without the pages is worse
# than one that ships neither.
#
# The four crates under `tests/fixtures/` are excluded because each is a
# separate cargo package with its own manifest, and one of them deliberately
# fails to resolve. They exist to be run from a git checkout by CI, never from
# the published package. The fixtures they *produce* — the 0.22.0- and
# 0.29.0-written databases under `tests/fixtures/store-0.22.0/` and
# `tests/fixtures/store-0.29.0/` — are NOT excluded, because the two
# cross-version test files read them and `cargo package` verifies the tests
# compile.
exclude = [
    ".ultraship",
    ".env",
    ".github",
    "tests/fixtures/gen-0.22.0",
    "tests/fixtures/gen-0.29.0",
    "tests/fixtures/links-consumer",
    "tests/fixtures/throughput-0.22.0",
]

# docs.rs is the page this crate is mostly read on, and the default build hides
# the documents and media surface entirely. Build it with everything on, and set
# the `docsrs` cfg so the crate root can turn on feature labelling — without it a
# reader sees an item and no indication that it needs a feature to exist.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# `docsrs` is set by docs.rs and by nothing else, so declare it rather than let
# rustc warn about an unexpected cfg on every build. This release requires a
# warning-free `cargo doc`, and a warning introduced to remove a warning would
# be a poor trade.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "process", "sync"] }
# 0.13 (not 0.12) because rmcp requires it, and the streamable-HTTP MCP
# transport only accepts a Client of the same version — one reqwest, one TLS
# stack. Still true on rmcp 3.0.0, which is why that bump needed no reqwest
# change.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `fallible_uint` is new in 0.38.0 and carries the `u64`/`usize` `ToSql` and
# `FromSql` impls that were unconditional up to 0.37. The token counters and the
# budget ledger in `state.rs` are `u64`, so this feature is what keeps their
# conversions the checked ones they already were — `ToSqlConversionFailure` above
# `i64::MAX` on write, `FromSqlError::OutOfRange` on a negative read — rather than
# a hand-written cast that would silently wrap.
rusqlite = { version = "0.40.1", features = ["bundled", "fallible_uint"] }
thiserror = "2"
tracing = "0.1"
# Execution-based verification compiles the produced file in a throwaway dir.
tempfile = "3"
# grep tool: regex matching, and glob->regex for the find tool's patterns.
regex = "1"
# 0.19.0's config file. Parsing only — nothing here writes TOML back out, so the
# `display` half of the crate is not compiled. This is the first dependency
# added to the default build since 0.1.0, and the `cargo tree` constraint moved
# from 401 lines to accommodate it rather than the other way round.
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
# MCP client only — no server mode, no macros. Stdio servers over the child-process
# transport, remote servers over streamable HTTP with our own (no-redirect) Client.
# Documents (0.14.0), all optional and all behind the `documents` feature. The
# default build's dependency tree is unchanged — a consumer who does not ask for
# documents pays nothing for them, which is the standing dependency discipline
# this crate has kept since 0.1.0.
#
# Spreadsheets take three crates rather than one because the three operations are
# genuinely separate: calamine reads and cannot write, rust_xlsxwriter writes new
# files and explicitly cannot modify an existing one, and umya-spreadsheet is the
# only one that round-trips an existing workbook. Nothing here binds a C or C++
# library, so no runner needs a system package.
docx-rs = { version = "0.4", optional = true }
# PowerPoint is read-only here and deliberately has no dedicated crate: a .pptx is
# a zip of XML, and pulling the text out of ppt/slides/*.xml is a short piece of
# code over two dependencies this tree can already justify. The alternative was a
# ten-day-old extraction crate, and the vetting rule that removed OCR applies to
# convenience too.
zip = { version = "8", optional = true, default-features = false, features = ["deflate"] }
quick-xml = { version = "0.41", optional = true }
lopdf = { version = "0.44", optional = true }
pdf-extract = { version = "0.12", optional = true }
rxing = { version = "0.9", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }
calamine = { version = "0.36", optional = true }
rust_xlsxwriter = { version = "0.97", optional = true }
umya-spreadsheet = { version = "3.0", optional = true }

rmcp = { version = "3.0.0", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }

# Sandbox backends: setrlimit (CPU cap), kill, and signal constants on unix; the
# macOS/Linux native backends and the portable floor's rlimit caps use it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Windows Job Object backend (0.24.0), and the only new dependency in this
# release. Target-gated for the same reason `libc` above is: a macOS or Linux
# build must not resolve it at all, so `cargo tree` on those hosts does not name
# it and no unix consumer pays a line for a crate it cannot call. This is the
# same discipline the optional document features keep — the difference is that a
# `cfg(windows)` gate is enforced by cargo rather than by a feature flag someone
# has to remember not to set.
#
# 0.61 is the version already in the lock file as a transitive dependency of
# tokio/mio and reqwest's TLS stack on Windows, so asking for it by name adds a
# dependency *edge*, not a dependency: the Windows graph compiles exactly one
# `windows-sys`, with the union of everyone's features.
#
# Five features and no umbrella, because windows-sys generates one module per
# feature and every one asked for is bindings compiled on the Windows runner:
#
# - `Win32_System_JobObjects` — the job itself: CreateJobObjectW,
#   SetInformationJobObject, AssignProcessToJobObject, QueryInformationJobObject.
# - `Win32_Foundation` — HANDLE, INVALID_HANDLE_VALUE and CloseHandle. Closing
#   the job handle is what kills the tree, so this one is load-bearing.
# - `Win32_Security` — not used for security here at all: CreateJobObjectW takes
#   a `*const SECURITY_ATTRIBUTES` and windows-sys gates the *symbol* behind the
#   feature that defines that type. We pass null. The feature buys the
#   declaration, nothing else.
# - `Win32_System_Threading` — CREATE_SUSPENDED, OpenThread and ResumeThread,
#   which are how the child is held still until it is inside the job; also
#   IO_COUNTERS, a member of JOBOBJECT_EXTENDED_LIMIT_INFORMATION.
# - `Win32_System_Diagnostics_ToolHelp` — the thread snapshot used to find the
#   suspended child's initial thread. std closes the thread handle
#   `CreateProcess` returned before it hands back a `Child`, so the snapshot is
#   the only documented route back to it. See `src/sandbox/windows.rs`.
# 0.26.0 adds two more features and no new crate — the AppContainer half:
#
# - `Win32_Security_Isolation` — CreateAppContainerProfile,
#   DeleteAppContainerProfile and DeriveAppContainerSidFromAppContainerName, the
#   three `userenv.dll` entry points that make a container exist and give it a
#   SID. This is the one feature the release could not have been built without.
# - `Win32_Security_Authorization` — GetNamedSecurityInfoW, SetEntriesInAclW and
#   SetNamedSecurityInfoW. An AppContainer is default-deny for reads, so a path
#   the payload may touch is a path something granted with an explicit ACE, and
#   these are what write one.
#
# `Win32_Security` above already covers SECURITY_CAPABILITIES, PSID and FreeSid,
# and `Win32_System_Threading` already covers CreateProcessW, STARTUPINFOEXW and
# the ProcThreadAttribute list — the feature was pulled in for CREATE_SUSPENDED
# in 0.24.0 and happens to carry the whole extended-startup surface with it.
#
# Both are additive on Windows only and neither moves `cargo tree` on macOS or
# Linux, where this dependency is not resolved at all.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
hyper = { version = "1.11.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio", "service", "server"] }
# The server half of rmcp, for examples/mcp_fixture_server.rs — the deterministic
# MCP server the tests drive. Dev-only: the crate itself ships client-side only.
rmcp = { version = "3.0.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync"] }

[dependencies.base64]
# The image half only. Already compiled in every build as a transitive
# dependency of reqwest, so enabling the feature costs a `cargo tree` line and
# no build time; declaring it optional is what keeps it off the default tree.
version = "0.23"
optional = true

[features]
# The crate's first feature section (0.14.0). Per-format features so a consumer
# who wants spreadsheets does not compile a PDF stack, and an umbrella so the
# common case is one word.
default = []
media = ["dep:base64"]
documents = ["xlsx", "docx", "pptx", "pdf", "barcode"]
docx = ["dep:docx-rs"]
pptx = ["dep:zip", "dep:quick-xml"]
pdf = ["dep:lopdf", "dep:pdf-extract"]
barcode = ["dep:rxing", "dep:image"]
xlsx = ["dep:calamine", "dep:rust_xlsxwriter", "dep:umya-spreadsheet"]

# The one example that calls the document API directly. Declared so that
# `cargo build --all-targets` on the default build skips it instead of failing
# on a module the default build does not contain. Every other example is still
# auto-discovered.
[[example]]
name = "documents_live"
required-features = ["documents"]

# 0.15.0's live run. `barcode` is here only for the `image` crate, which the
# example uses to write its PNG fixture — the image capability itself never
# decodes an image, it encodes and forwards one.
[[example]]
name = "media_git_live"
required-features = ["media", "barcode"]
