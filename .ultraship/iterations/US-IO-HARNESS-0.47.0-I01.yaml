id: US-IO-HARNESS-0.47.0-I01
timestamp: 2026-08-10 13:05:00+00:00
category:
- release-level
- portfolio-level
trigger: 'The Windows half of 0.47.0 cannot be verified from this development host, and ten CI rounds
  on `windows-latest` were spent discovering that rather than finishing it. Owner decision on 2026-08-10:
  take Windows access confinement out of this release entirely and schedule it after 0.58.0, on hardware
  where it can be debugged interactively.

  '
evidence:
- 'Ten matrix rounds on `windows-latest`, each ~25-40 minutes, ending at 11 failures of 1109. The failure
  count moved 36 → 13 → 16 → 15 → 10 → 11; it did not converge.

  '
- 'Three separate root causes were found and fixed and none of them finished the job. The ACEs the module
  wrote carried generic rights (`GENERIC_ALL`), which `SetEntriesInAclW` stores verbatim and an access
  check never matches, so every grant since 0.26.0 was inert. A grant skip read the directory''s own ACE
  and so observed another process''s still-propagating tree walk. And both `aclapi` write entry points
  enumerate the whole subtree below the target, so granting an ancestor of `%TEMP%` walked the user profile
  and timed both Windows legs out at forty minutes having failed no test.

  '
- 'The remaining failure is a decline: the container cannot grant `CARGO_HOME`, so `run_contained` returns
  `None` and the Job Object executes the command with no access boundary. The crate''s own gate then passes
  while proving nothing, which is why the release added a backend assertion to catch exactly that.

  '
- 'The reason the decline persists is not yet known, and the next step is a `last_decline()` string that
  only a Windows machine can read quickly. Each further attempt from here costs a full matrix round to
  learn one fact.

  '
- 'The Linux half is green and has been green on every round: `contained (ubuntu, userns restricted)`,
  both `ubuntu-latest` legs, both `macos-latest` legs, the doctest legs, `msrv`, `lint`, `examples`, `docs.rs
  (nightly)`, the cross-version leg and CodeQL.

  '
before:
  scope:
  - Linux containment chain — Landlock, bubblewrap, the existing namespace backend, the floor
  - A seccomp deny-list beside the Landlock ruleset
  - Windows access confinement — AppContainer selected by `select`, with the derived grant set
  - Three additive `Backend` variants including `WindowsAppContainer`
  assumptions:
  - 'The Windows grant set is a configuration problem now that 0.46.0 derives the run''s own writable
    roots, and the AppContainer module proven in 0.26.0 needs only to be wired.

    '
  implementation: '`WindowsSandbox::run` attempts `job::run_contained` before the Job Object, and `backend()`
    reports `WindowsAppContainer` when a profile can be created.

    '
change:
  summary: '0.47.0 becomes the Linux containment release. Windows access confinement — the selection,
    the grant set, and every claim that a Windows run enforces files or network — is deferred whole to
    0.59.0. The `sandbox::appcontainer` module stays in the tree, built and unit-tested and selected by
    nothing, which is exactly the state it was in from 0.26.0 to this release.


    **What stays in the tree, and why that is not scope.** The AppContainer module keeps the three corrections
    this release paid for — specific rights rather than generic ones in an ACE, a tree grant that continues
    past a locked descendant, and a directory-only grant that does not enumerate the directory — plus
    the capability table that reads back what a container actually permits on the host it runs on. None
    of it is reachable from `select`, so none of it is a claim this release makes. It is the starting
    point 0.59.0 inherits, and it is a better one than 0.26.0 left: the faults above are found and fixed
    rather than waiting to be re-found.

    **What 0.59.0 has to answer first.** Why granting `CARGO_HOME` to the container SID fails on `windows-latest`,
    and whether `cmd.exe` refusing to start a batch file named by an absolute path inside an AppContainer
    is a property of the platform or of this spawn. Both are recorded in the 0.59.0 roadmap entry so the
    next attempt starts from evidence rather than from the beginning.'
  added: []
  removed:
  - Windows access confinement, selected
  - The Windows grant set derived from the run's resolved facts
  - The Windows egress answer via the empty capability array
  - F7, F8 and F9 — the Windows acceptance criteria
  deferred:
  - Windows access confinement, in full, to 0.59.0
  replaced:
  - 'F10 loses its Windows arm and keeps its Linux one: every degradation completes the run and reports
    the weaker backend.

    '
