  resource_effect: >
    Small and contained. Roughly twenty-five lines in `src/pricing.rs` plus a table-driven test, one
    parser branch in `src/provider/catalog.rs`, one optional key in `src/config.rs`, and one line in
    `docs/public-api.txt` with its worked example. It adds no dependency and no store schema, so
