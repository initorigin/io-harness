approval:
  source: user
  reference: >
    Requested by the owner in session on 2026-08-01, mid-development: "some models provide different
    pricing for 200k context window and 1M context. can we research and manage this as well". The
    research was performed against the live catalogue before the change was accepted, and the
    magnitude and uniformity above are what justified taking it into this release rather than
    deferring it.
