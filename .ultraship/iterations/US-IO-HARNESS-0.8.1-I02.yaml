id: US-IO-HARNESS-0.8.1-I02
timestamp: '2026-07-25T00:00:00Z'
category:
  - implementation-level
trigger: >
  The F7 live run — the last task of the release, and the only evidence in it produced by a real
  model rather than by the suite — failed. The two-crate structure both I01 and the original
  hardening depended on made an ordinary honest implementation unpassable. The release was one
  step from complete and its central fix was rejecting correct code.
evidence:
  - >
    The run: `cargo run --example edit_file` against openai/gpt-5.6-luna, contract "Create a Rust
    function `hello` that returns the u32 value 42", gate `RustTestPasses` with
    `#[test] fn t() { assert_eq!(hello(), 42); }`. Outcome `StepCapReached { steps: 4 }`. The file
    at exhaustion contained `fn hello() -> u32 { 42 }` — a correct implementation. The agent wrote
    a correct answer, was told it failed, and rewrote it three more times until the step cap.
  - >
    Cause, isolated immediately after against the same build, no model involved:
    `RustTestPasses` on `fn hello() -> u32 { 42 }` returned Ok(false);
    the same gate on `pub fn hello() -> u32 { 42 }` returned Ok(true).
    The gate had begun requiring `pub`.
  - >
    The mechanism: privacy is a wall BETWEEN crates. Compiling the criterion as a separate crate
    depending on the subject — the fix for shadowing — made every private item in the subject
    invisible to the criterion. In 0.8.0 the two were one crate and a private `fn hello` was in
    scope. The hardening had silently narrowed "a passing implementation" to "and it must be pub",
    which no caller asked for, no documentation stated, and no agent can infer from the task text.
  - >
    Not caught by the suite because every offline test wrote `pub fn hello`. The tests were written
    against the new structure and inherited its assumption. This is precisely the class of defect
    F7 exists to catch and the reason the release carries a live-run criterion at all: 186 offline
    tests passed against a build that could not pass an idiomatic private function.
  - >
    The replacement structure, verified across all five cases with rustc directly before
    implementing: the criterion becomes a child module of the subject's own crate, opening with
    explicit `use ::core::{assert, assert_eq, ...}` and `use super::*`.
    honest private fn -> passes. honest pub fn -> passes. wrong answer -> fails.
    subject defining `macro_rules! assert_eq`, exported or not -> E0659 "ambiguous name", so the
    criterion does not compile and the gate fails. `#![cfg(any())]` subject -> "running 0 tests",
    which this structure alone does NOT catch.
  - >
    The deletion attack is therefore handled separately, by the probe I01 built for the
    compile-only path: the subject is compiled alone with a reserved probe item appended, and a
    second crate type-checks a reference to it. A subject that strips its own items strips the
    probe. This runs BEFORE the criterion is appended, so the trace now names `subject-emptied`
    rather than the downstream `criterion-compile` — a more accurate attribution than the two-crate
    build produced.
  - >
    Re-run after the fix, same model and contract: `Success { steps: 1 }`, file contents
    `fn hello() -> u32 { 42 }`. The implementation the previous build rejected four times passed in
    one step. Both runs stored in evidence/0.8.1/live_run.txt.
before:
  scope:
    - >
      "Harden RustTestPasses so the subject file cannot shadow the names its criterion depends on"
      and the same for WorkspaceTestPasses — unchanged by this iteration. The required property is
      what it was; only the mechanism delivering it moved.
    - >
      The two-crate split recorded as the resolved answer to the release's open question "what is the
      mechanism", and as the delivered basis for F8.
  assumptions:
    - >
      Isolating the subject in its own crate is a pure hardening: it removes what the subject can
      reach into the criterion, and takes nothing away from an honest subject.
    - >
      The offline suite is sufficient to establish that the tightened boundary does not cost an
      honest pass; the live run is confirmation of something already known.
  implementation: >
    `RustTestPasses` and `WorkspaceTestPasses` compiled the subject as its own crate
    (`--crate-type lib --crate-name subject`) and the caller's `test_src` as a separate crate
    importing it through `extern crate subject; use subject::*;` with the prelude macros
    re-imported explicitly. Three spawns: subject, criterion, run.
change:
  summary: >
    Revert the two-crate structure on the test-gate path and stop both attacks by other means. The
    criterion returns to being part of the subject's crate — a child module, so `use super::*`
    reaches private items exactly as 0.8.0 did — with shadowing stopped inside that module by
    explicit prelude re-imports (a shadowing subject now produces an E0659 ambiguity rather than a
    capture), and deletion stopped before it by the probe already built for the compile-only gates.
    The release's stated property is unchanged and still holds; only the mechanism moved.
  added:
    - >
      `a_private_implementation_still_passes_the_gate` (tests/verify_gate.rs), pinning the
      regression for both RustTestPasses and WorkspaceTestPasses so no future hardening can
      reintroduce a `pub` requirement without a test failing.
    - >
      The probe step on the test-gate path, taking it from 3 spawns to 4. It is what catches the
      crate-level-attribute vector now that subject and criterion share a crate again.
  removed:
    - >
      `CRITERION_PREAMBLE` and the separate-criterion-crate compile. `test_build_args` no longer
      takes an rlib to link against.
  deferred: []
  replaced:
    - >
      The assumption that crate isolation costs an honest subject nothing, replaced by: crate
      isolation also isolates privacy, and a verification gate must not narrow what counts as a
      correct implementation. Any structural defence has to be checked against an honest private
      implementation, not only against the attack.
    - >
      The trace phase recorded for a self-deleting subject on the test path, from
      `criterion-compile` to `subject-emptied`. The latter names the cause rather than the symptom.
impact:
  products:
    - io-harness
    - io-cli
  versions:
    - 0.8.1
  tasks:
    - US-IO-HARNESS-0.8.1-T02
    - US-IO-HARNESS-0.8.1-T03
    - US-IO-HARNESS-0.8.1-T06
    - US-IO-HARNESS-0.8.1-T10
  dependencies:
    - >
      io-cli exposes these gates as `rust-test:`. The reverted build would have required every
      io-cli user's implementation to be `pub`; the shipped one does not. No io-cli change is
      needed, which is the point.
  resource_effect: >
    Contained, but not free. One function arm, two constants, one argv builder, and one test
    rewritten, plus the four documentation surfaces that described the two-crate structure as
    shipped (lib.rs, verify.rs, README, CHANGELOG) and the NF5 latency figures, which had to be
    re-measured because the spawn count changed from 3 to 4. The test gate now costs ~381 ms
    against 0.8.0's ~290 ms, where the reverted build cost less — the correct structure is the
    slower one. No API change, no MSRV movement, still a patch release.
versioning:
  previous_target: 0.8.1
  new_target: 0.8.1
  consequence: no-version-change
approval:
  source: user
  reference: >
    The owner supplied OPENROUTER_API_KEY for the F7 live run in session 2026-07-25. The revert
    followed directly from that run's result: the release could not be completed as built, because
    F7 is an acceptance criterion and the run failed it.
