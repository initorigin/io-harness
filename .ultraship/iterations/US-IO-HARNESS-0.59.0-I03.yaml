id: US-IO-HARNESS-0.59.0-I03
timestamp: 2026-08-15T19:40:00Z
category:
  - implementation-level
  - release-level
trigger: >
  Part of this release's egress plan cannot be built, and the measurement that says so is
  unambiguous. Every contained command on macOS and Linux has taken the run's own loopback proxy
  since 0.48.0, which is what makes a per-host policy enforceable under containment. A process
  inside an AppContainer cannot reach a loopback listener at all, under any capability set, and
  cannot reach the host's own network address either. So per-host egress has no mechanism on this
  platform under access confinement, and the release records that rather than implying a parity it
  did not deliver.

  **This is about contained commands and not about the browser.** The browser is spawned by the
  harness itself and is not placed inside the container on any platform, so it reaches the run's
  proxy on Windows exactly as it does elsewhere. That criterion stands and is tested; this record
  does not retire it.
evidence:
  - >
    **Measured on `windows-latest`, image `win25-vs2026 20260810.198.2`, with the uncontained
    control beside every arm.** A listener owned by the test process answers `reached` on
    `127.0.0.1` and, separately, on every interface. Inside the container, `curl` to the loopback
    address times out with **no capability, with `internetClient`, with
    `privateNetworkClientServer`, and with both** — four arms, one outcome. The same request to the
    machine's own address on the network (`10.1.0.104`) times out under all three capability sets
    that could plausibly permit it. Outside the container, both succeed immediately.
  - >
    **The failure is a timeout rather than a refusal, which is itself the diagnosis.** A refused
    connection answers at once; a dropped one waits out the clock. The container is not being told
    no by the listener, it is not reaching it.
  - >
    **The capability array is working, so the loopback result is not an artefact of a broken
    boundary.** In the same round, an outbound request to a real host fails to resolve with no
    capability and returns HTTP 200 with `internetClient`. This is the first time in the module's
    life that the permitting direction has been applied at all — until this release the spawn
    passed a capability count of zero unconditionally — so the two directions are now both
    demonstrated, and loopback is denied while the internet is reachable.
  - >
    **The alternatives are excluded rather than untried.** A loopback exemption
    (`CheckNetIsolation`) is machine-wide, needs administrator rights and is already out of scope: a
    library that edits a machine's network-isolation policy so its own tests pass has done something
    worse than the problem it solved. Binding the proxy to a non-loopback address does not help,
    because the host's own address is refused the same way. A named-pipe transport for the proxy
    would not be a proxy a browser's `--proxy-server` can name.
  - >
    **Left as it was, this is worse than the gap it was meant to close.** A contained run that
    permits egress would have had its commands pointed at a proxy they cannot reach, so every
    outbound request would hang until its own timeout instead of being scoped. That is not a
    narrower boundary, it is a broken one.
before:
  scope:
    - >
      "A contained browser on Windows takes the run's own egress proxy, verified on this platform
      specifically."
    - >
      "Egress denial ships ahead of filesystem confinement, at roughly a tenth of the risk, because
      an empty capability array denies the network with no grant-set discovery at all."
  assumptions:
    - >
      That 0.48.0's loopback proxy is portable to any backend that can deny egress, since it was
      built as the mechanism that makes a per-host policy enforceable under containment on every
      platform.
    - >
      That the network half and the filesystem half of this release could land separately, the
      network one first.
  implementation: >
    Select the AppContainer, deny egress with an empty capability array, and route a contained
    command's permitted traffic through the run's loopback proxy exactly as the other two platforms
    do.
change:
  summary: >
    Under Windows access confinement, egress is a **capability**, not a route. A run whose policy
    permits any egress gets `internetClient` and reaches the network; a run that denies egress gets
    an empty capability array and reaches nothing. The run's loopback proxy is **not** given to a
    contained command on this platform, because it cannot be reached — and a contained Windows run
    therefore does not enforce the policy's per-host rules, which the platform table, the contract
    and the agent's own boundary section state plainly rather than leaving to be discovered.

    The second half of the change is an ordering correction. The two halves are not separable: an
    empty capability array only binds a process that is already inside a container, and being
    inside one is the entire grant-set problem. There is no egress-only landing, so the release has
    two steps where the plan had three, and the fallback scope is the browser half alone.
  added:
    - >
      "A stated platform limit: per-host egress is not enforced under Windows access confinement,
      with the measurement behind it"
    - >
      "A refusal rather than a degradation when a requested boundary cannot be applied, which is
      what makes the limit readable instead of silent"
  removed:
    - "The loopback proxy for contained commands on Windows"
    - >
      "The claim that a *contained command* on Windows can be scoped to named hosts — the mechanism
      that would do it cannot be reached from inside the container"
  deferred:
    - >
      "Per-host egress on Windows under containment. It needs a mechanism that is not a loopback
      listener; nothing in this release invents one."
  replaced:
    - >
      "The landing order's step 1 and step 2 as separate steps — they are one step, because the
      capability array has no effect outside a container"
impact:
  products:
    - io-harness
  versions:
    - 0.59.0
  tasks: []
  dependencies: []
  resource_effect: >
    Removes work rather than adding it: there is no proxy plumbing to write for this backend and no
    per-host egress tests to make pass on it. Adds a documentation obligation — three platform
    tables, the contract's egress row, and the sentence the agent itself is told about its
    boundary — and one negative test asserting that a contained Windows command is given no proxy,
    so the absence is pinned rather than incidental.
versioning:
  previous_target: 0.59.0
  new_target: 0.59.0
  consequence: no-version-change
approval:
  source: agent
  reference: >
    Taken on the measurement rather than referred, because the criterion it retires was proved
    impossible rather than judged unwise, and because the alternative — shipping a contained run
    pointed at a proxy it cannot reach — is a broken boundary rather than a narrower one. Flagged
    to the owner in session on 2026-08-15 with the numbers below. Diagnostic rounds on `diag/0.59.0-windows-egress`, runs 31899519525, 31900139126 and
    31900687971, artifacts retained. The third round was confounded by a defect in the module the
    probe itself found — the grant memo was keyed without the container SID, so every arm after the
    first ran in a container that had been told its workspace grant was already done — and the
    fourth round was taken after that key was fixed. The conclusion rests on the fourth.
canonical_updates:
