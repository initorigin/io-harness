id: US-IO-HARNESS-0.48.0-I03
timestamp: 2026-08-10T16:29:02Z
category:
  - release-level
  - portfolio-level
  - architecture-level
trigger: >
  Field evidence from an embedder driving `Session::turn` over a TUI, with four findings attached
  and a ruling requested on which belong in 0.48.0 and which must become their own release.
evidence:
  - >
    **The system block and the user block contradict each other on the classifying step, and the
    model resolves it out loud.** The operator typed "Hi"; the turn was correctly `TurnKind::Reply`
    with zero steps; the reply text was "its a Hi reply to give and no run so just simply answer".
    Reproducible across turns and models. Verified in this tree rather than taken on report:
    `CONVERSATIONAL_ENDING` says "write that answer and call no tool", while
    `workspace_user_prompt` (`src/run.rs:11986`) is unconditional at both call sites
    (`src/run.rs:4450` and `src/run.rs:6064`) and emits "(nothing yet — start by grepping or
    finding)" (`:11997`) and "Call a tool to make progress toward the success criterion" (`:12013`).
    `extras.classify` already exists at `src/session.rs:785`, so the condition the fix needs is
    computed today.
  - >
    **The provider request cannot express a conversation.** `CompletionRequest` carries one `system`
    string and one `user` string (`src/provider/mod.rs:467`, confirmed); both wires emit exactly one
    user message and no assistant turn. Prior turns are flattened to prose and tool results become
    bracketed text, so the crate parses `tool_calls` off a response and discards the protocol on the
    way back in — no `tool_use`, no `tool_result`, no id correlation. Off-distribution for every
    model this crate targets, and the upstream cause of three limits later roadmap entries plan
    around rather than remove.
  - >
    **Task framing is the only framing**, because `Session::default_contract` is
    `TaskContract::workspace` — the same mismatch as the first finding, in the system block.
  - >
    **`SystemPrompt::Builtin` has no behavioural content.** 0.45.0 shipped `Builtin | Append |
    Replace` and planned a `Preset` half it did not ship, leaving an embedder to write a full agent
    prompt or take three sentences naming four tools.
  - >
    **The roadmap contains no sequencing note.** The premise offered for renumbering
    0.49.0–0.59.0 — that the roadmap records everything from 0.49.0 on as free to move — is not in
    the file: `roadmap.yaml` has three top-level keys, `product`, `status` and `versions`, and no
    such prose anywhere. Checked before acting on it.
  - >
    **0.47.0's record is immutable and names 0.59.0.** It states that Windows access confinement
    "is 0.59.0 now, and the record is `US-IO-HARNESS-0.47.0-I01`". A full renumber would move that
    work to 0.60.0 while a published, SHA-pinned record went on claiming 0.59.0, and iterate may not
    rewrite a released record to agree.
before:
  scope:
    - 0.48.0 — contained handles, declared modes, per-host egress
    - 0.49.0 — inter-agent messaging (outline)
  assumptions:
    - >
      That the classifying turn introduced in 0.37.0 was asked one coherent question. It was given
      its own system prompt and the matching user prompt was never written.
    - >
      That the single-string `CompletionRequest` was a shape later releases could build on. Three
      planned entries work around it instead.
  implementation: >
    `workspace_user_prompt` sent unconditionally on every step of every turn; one user string per
    request on both wires.
change:
  summary: >
    Finding 1 rides 0.48.0 as a stated correction with its own criterion, F10, and its own task.
    Findings 2, 3 and 4 become a new 0.49.0 — the provider request carries role-tagged turns with
    id-correlated tool results, task framing stops being the only framing, and `SystemPrompt::Preset`
    lands — with Findings 2 and 3 as that release's fallback scope, so `Preset` is the first thing
    shed under pressure. Inter-agent messaging moves whole from 0.49.0 to 0.60.0.
  added:
    - "0.48.0 — F10, and the scope item for the conversational user prompt"
    - "0.49.0 — a new release: role-tagged turns, turn framing, SystemPrompt::Preset"
  removed: []
  deferred:
    - "Inter-agent messaging, 0.49.0 → 0.60.0, unchanged apart from its number"
  replaced: []
impact:
  products:
    - io-harness
  versions:
    - 0.48.0
    - 0.49.0
    - 0.60.0
  tasks:
    - US-IO-HARNESS-0.48.0-T10
  dependencies: []
  resource_effect: >
    0.48.0 grows by one small task — fifteen lines against a condition already computed, plus its
    tests. The new 0.49.0 is a large breaking release and is planned, not started.
versioning:
  previous_target: 0.48.0
  new_target: 0.48.0
  consequence: no-version-change
approval:
  source: user
  reference: >
    Owner asked for the ruling in session on 2026-08-10 with a recommended disposition, then chose
    "move messaging only" over a full renumber once shown that the sequencing note the renumber
    rested on does not exist and that 0.47.0's immutable record names 0.59.0, and chose to bundle
    `SystemPrompt::Preset` into the new release with Findings 2 and 3 as its fallback scope.
