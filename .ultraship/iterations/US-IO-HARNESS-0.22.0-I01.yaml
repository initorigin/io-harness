id: US-IO-HARNESS-0.22.0-I01
timestamp: '2026-07-30T17:16:49Z'
category:
  - implementation-level
  - release-level
trigger: >
  Four things the three vendors actually do turned out to differ from what the contract assumed
  when it was written, and each of them changes a sentence the contract states as a checkable fact
  rather than a preference. None reduces the release's scope; all four make the contract describe
  what shipped instead of what was expected to ship.
evidence:
  - >
    A failed provider-executed call cannot be expressed by a citation list. Anthropic returns
    `web_search_tool_result` whose `content` is either an array of results or a
    `web_search_tool_result_error` object carrying an `error_code`; the OpenAI wire carries an
    `error` object on a chunk of an otherwise successful 200 stream. Both are invisible in
    `citations`, which is empty for a failed search and equally empty for one that found nothing.
    `CompletionResponse` therefore gained a SECOND field — `server_tools: Vec<ServerToolCall>` —
    where NF2 anticipated one. Proven by `a_search_that_failed_inside_a_200_is_recorded_as_a_failure`
    (src/provider/anthropic.rs) and `an_error_object_in_a_200_stream_is_a_failed_call`
    (src/provider/openai_wire.rs), whose whole point is telling the two apart.
  - >
    The three vendors do not accept the same declaration. Anthropic takes search, fetch, `max_uses`
    and a domain filter. OpenAI's Chat Completions takes `web_search_options` with an allow-list
    only — no fetch tool, no block-list. OpenRouter's `web` plugin takes neither list and has no
    fetch. F1 as written asked for one declaration carrying all of it to reach all three, which is
    not a body any of the two OpenAI-wire vendors will accept. The implementation refuses the
    unsupported combinations with `Error::Config` before anything is sent
    (`openai_wire::ensure_web_supported`), rather than silently dropping the parts a vendor cannot
    carry — the release's own first risk is a boundary the caller believes in and nobody enforces.
    Pinned by `a_declaration_a_vendor_cannot_carry_is_refused_by_name`.
  - >
    `Usage::server_tool_requests` moves on Anthropic and on neither of the other two. Anthropic
    reports `usage.server_tool_use.web_search_requests` and the accumulator reads it; the OpenAI
    wire's usage object carries no such member today, which `src/provider/openai_wire.rs` already
    said in a comment written in 0.18.0. The live run confirmed it: a real OpenRouter run searched,
    cited two sources and left a `server_tool_calls` row, with the counter still reading zero
    (`evidence/0.22.0/live-web-search.txt`). The crate records the zero it was told rather than
    deriving a count it was not given.
  - >
    A spawned child inherited nothing. `spawn_child` builds its child's `TaskContract` from scratch,
    so a tree whose root declared web access spawned children that could not search — the failure
    being a research sub-agent answering from memory on the one task that needed the current answer.
    The fix carries the ROOT contract's declaration through the `Tree`, alongside the toolbox, the
    skills catalogue and the agent roster, and never reads one from the spawn arguments. Pinned by
    `a_spawned_child_inherits_the_declaration_and_cannot_ask_for_its_own` (tests/web.rs), whose
    spawn call asks for `evil.test` and is ignored.
before:
  scope:
    - >
      NF2 — three breaks: `CompletionRequest::web`, `CompletionResponse::citations`,
      `EventKind::ServerToolUsed`.
    - >
      F1 — one `WebAccess` with search, fetch, `max_uses` and both domain lists reaching all three
      vendors in their own shapes.
    - >
      F8 and OP5 — the meter moves: a non-zero `server_tool_requests`, live.
    - >
      The tree: "one declaration governs the whole tree" was written into the scope but not into any
      acceptance criterion, and the code did not do it.
  assumptions:
    - >
      That a failed provider-executed call could be represented alongside the citations it did not
      produce.
    - >
      That the three vendors' web surfaces were the same capability spelled three ways.
    - >
      That every vendor reports the per-request counter 0.18.0 built the column for.
  implementation: >
    Complete and green for everything else: the declaration, the three translations, citations, the
    two tables, the observer event, the `pause_turn` fix, the policy projection, `[web]` in
    `io.toml`, and the accounting path. `cargo test` passes on the default and `--all-features`
    builds, both clippy legs are clean, and `cargo tree` is still 407 lines.
change:
  summary: >
    Correct four contract statements to what the vendors do, and add the tree-inheritance rule the
    scope implied but no criterion checked. No scope is removed and no work is deferred; the release
    ships more than the contract asked for, not less.
  added:
    - >
      `CompletionResponse::server_tools: Vec<ServerToolCall>` and the public `ServerToolCall` type,
      because a failure inside a 200 has nowhere else to live. NF2 now names four added items across
      three break sites rather than three items; each is additive and fixed by
      `..Default::default()` or a `_` arm, so the migration story is unchanged.
    - >
      A stated vendor capability matrix, and refusal as its enforcement: a declaration a vendor
      cannot carry is an `Error::Config` before the request is sent. F1 now asserts each vendor's
      own supported subset plus the refusals, rather than one declaration reaching all three intact.
    - >
      F13 — a spawned child inherits the root's declaration and cannot ask for its own. The rule the
      scope described, now checkable.
  removed: []
  deferred:
    - >
      Per-child narrowing of web access — an `AgentDef` field. Already excluded by the contract and
      already pointed at 0.23.0; this iteration does not change that, and the guide now states the
      limitation.
  replaced:
    - >
      F8's and OP5's claim that the meter moves, which is true on Anthropic and false on the other
      two. Both now read: the run leaves a `server_tool_calls` row on every provider, and a non-zero
      `server_tool_requests` where the vendor reports one. The live evidence was obtained on
      OpenRouter, the only vendor with working credentials in this environment, so the live half of
      OP5 shows a search, two citations and a recorded call with a vendor-reported count of zero.
