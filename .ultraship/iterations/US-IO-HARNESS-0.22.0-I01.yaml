      A live non-zero `server_tool_requests` needs an Anthropic key. The `.env` in this workspace
      carries placeholders for `ANTHROPIC_API_KEY` and `OPENAI_API_KEY`, so only the OpenRouter path
      could be exercised live. This is an environment limitation, recorded rather than worked
      around, and it belongs in the release record's `known_limitations`.
  resource_effect: >
    Small and already spent. The refusal path, the second response field and the tree inheritance
    are implemented, tested and documented; this record makes the contract agree with them.
