  reference: >
    Recorded under the owner's standing authorisation to run the release flow without an approval gate
    (2026-07-26, reaffirmed: "dont ask me for PRs and merges. go on without permissions"), and marked
    `agent` rather than `user` because it was decided in-session with no one asked. It touches neither
    the version, nor the product definition, nor what the release delivers: every criterion survives with
