id: US-IO-HARNESS-0.60.3-I01
timestamp: 2026-08-16 22:10:00+00:00
category:
- release-level
- implementation-level
trigger: >
  The contract states that all three defects are "present in both loops" and specifies F1, F2 and F4
  as end-to-end assertions over a contained classifying turn. Writing T01's helpers showed there is no
  public entry point that can produce one: a contained session turn cannot carry a caller's contract at
  all, so it can never carry a plan gate, a preset, a `Replace`, an `Append`, instructions or extra
  tools. The composition sites are wrong exactly as described; their reachability through the tree loop
  is not.
evidence:
- >
  **Both contained entry points discard the caller's contract.** `Session::turn_contained`
  (`src/session.rs:582-603`) and `Session::turn_contained_observed` (`src/session.rs:652-677`) take
  `text: impl Into<String>` and build `self.default_contract(text)`, which is
  `TaskContract::workspace(text, self.root.clone())` (`src/session.rs:731-733`) — `SystemPrompt::Builtin`,
  `plan_gate: None`. They are the only two callers of `drive` that pass `Some(containment)`
  (`src/session.rs:599`, `src/session.rs:670`), which is the only shape that reaches the tree loop as a
  turn.
- >
  **So the tree loop's `planning` flag is always false on a classifying turn.** `src/run.rs:7166-7168`
  computes it from `contract.plan_gate.is_some()`, and the contract is the default one. F1's tree half
  and F2's tree half are therefore latent: the composition at `src/run.rs:7254-7255` is wrong, and no
  caller can currently make it fire.
- >
  **And `contract.prompt` is always `Builtin` on a contained turn**, so `compose`'s replacing arm
  (`src/run.rs:14804-14810`) is never reached with a `Preset` over `CONVERSATION_TREE_PROMPT`. F4 as
  written — "a preset on a classifying contained turn still carries `spawn_agent`" — is not reachable
  through the public API and cannot be asserted end to end.
- >
  **The flat loop is fully reachable and every claim about it holds.** `Session::turn_bounded`
  (`src/session.rs:470`) takes the caller's contract, `drive` sets
  `extras.classify = matches!(contract.verify, Verification::None)` (`src/session.rs:785`) with no
  reference to the plan gate, and the flat loop reads `planning` from that same contract
  (`src/run.rs:4453`). A plan-gated classifying turn, and a preset on a classifying turn, are both one
  call away.
- >
  **`src/run.rs` already has a unit-test module** at `src/run.rs:16354-16355` (`#[cfg(test)] mod tests`
  with `use super::*`), carrying four tests including one written after a sabotage. The tree loop's
  composition is reachable there directly, at the level the defect actually lives.
before:
  scope:
  - >
    F1, F2 and F4 asserted end to end over both loops, via plan-gated and policy-bearing variants of
    `tests/prompt.rs`'s `conversational_system` and `tree_system` helpers.
  assumptions:
  - >
    That a contained session turn composes from a caller-supplied contract, as the flat one does — the
    unexamined half of "it is present in both loops".
  implementation: >
    Four new assertions in `tests/prompt.rs`, two of them over a contained classifying turn built from a
    contract carrying a plan gate or a preset.
change:
  summary: >
    Keep the fix at the shared composition site — `conversational_opening` and `compose` are one
    definition each, so both loops are corrected by the same diff, and the tree loop's latent defect is
    closed rather than left for the entry point that will one day reach it. Change only where each claim
    is asserted: end to end in `tests/prompt.rs` for the flat loop, which a caller can reach today, and
    as unit tests in `src/run.rs`'s existing `mod tests` for the tree loop, which no caller can. F4 is
    restated at that level rather than dropped. Nothing is deferred and no scope is removed; what moves
    is the level an assertion is written at, and the contract stops claiming a reachability that does not
    exist. The entry-point gap itself — a contained turn cannot carry a contract — is recorded as a new
    roadmap entry rather than fixed here, because giving `turn_contained` a contract-taking form is a new
    public API and therefore a minor.
  added:
  - >
    Unit assertions in `src/run.rs`'s `mod tests` covering the tree loop's composition — the conditional
    directive, the in-force boundary, and a preset over `CONVERSATION_TREE_PROMPT` and `TREE_PROMPT`.
  - >
    A statement in the contract that the tree-loop defects are latent, with the reason, so the release
    record does not claim to have closed a reachable defect it could not have reached.
  - >
    Roadmap entry 0.66.0 (`hypothesis`) — a contained session turn takes the caller's contract, which is
    what makes the tree loop's classifying path reachable at all.
  removed: []
  deferred:
  - >
    Making a contained classifying turn reachable from a caller's contract. Destination: roadmap entry
    0.66.0.
  replaced:
  - >
    F4's end-to-end shape, replaced by a unit assertion over `compose` at the same site. The claim is
    unchanged; the level it is checked at is the only level it can be checked at.
  - >
    F1 and F2's "both loops, end to end" shape, replaced by "end to end on the flat loop, unit-level on
    the tree loop".
