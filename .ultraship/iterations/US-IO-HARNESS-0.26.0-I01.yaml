id: US-IO-HARNESS-0.26.0-I01
timestamp: 2026-08-01T00:00:00Z
category:
  - product-level
  - portfolio-level
trigger: >
  The owner asked for the provider list to be extended to the major hosted vendors and to local
  models, and `product.yaml` forbade exactly that in two places. The rule could not simply be
  ignored: it is product truth, and a release contract written against a constraint the product
  still declares would be a contract nobody could validate.
evidence:
  - >
    `product.yaml` carried the constraint "Exactly three providers — Anthropic, OpenAI, OpenRouter.
    No fourth without a fresh decision." and the non-goal "Google Gemini and local or
    OpenAI-compatible providers". Both are blocking, and the constraint names its own exit
    condition — a fresh decision — which is what this record is.
  - >
    `src/provider/openai.rs` (159 lines) and `src/provider/openrouter.rs` (161 lines) are the same
    file apart from four strings: `ENDPOINT`, the `name()` literal, the `WebFlavor` variant, and the
    two environment variable names. Both delegate to `openai_wire`, which is 442 lines of
    implementation shared between them. The marginal cost of an OpenAI-shaped vendor is therefore a
    constant, not a module — which is the evidence that the "three" was never the load-bearing part
    of the constraint.
  - >
    The endpoint is a `const` copied into a `String` field at construction and reachable only
    through `#[cfg(test)] pub(crate) fn at(...)` (`openai.rs:79`, `openrouter.rs:76`,
    `anthropic.rs:99`), each commented "the endpoint is not configurable in the public API". So a
    local model at `http://localhost:11434/v1` is unreachable today by any means, including by an
    out-of-tree `Provider` impl, because `openai_wire` is `pub(crate)` (`provider/mod.rs:9`) and
    re-implementing it means writing 442 lines against a correct version three files away.
  - >
    Vendor divergence was researched against primary sources rather than assumed, and it is real
    but bounded: Zhipu emits `finish_reason` values outside the OpenAI set (`sensitive`,
    `network_error`, `model_context_window_exceeded`); Groq returns 400 on `messages[].name`;
    Mistral requires tool-call ids matching `^[a-zA-Z0-9]{9}$` and names its schema field
    `schema_definition`; DeepSeek returns 400 when `reasoning_content` is not replayed on a request
    carrying tools; Ollama accepts and silently drops `tool_choice`; vLLM and SGLang emit no tool
    calls unless started with a server-side parser flag a client cannot set. The crate already
    parses `finish_reason` as an open `String` and does not use `deny_unknown_fields` on responses,
    so none of these is a blocker — each is a fact the contract must state.
  - >
    Dependency cost was measured, not estimated, against this crate's actual default tree
    (131 unique crates). An OpenAI-shaped vendor over a configurable base URL costs zero crates.
    `aws-sigv4` costs 33 net-new; `jsonwebtoken` with a signing backend costs 13 to 54. That
    measurement is what turns the constraint from a count into a dependency rule.
before:
  scope:
    - 0.26.0 — Windows AppContainer and the Job Object handle routing
    - 0.27.0 — config is the truth
    - 0.28.0 — hooks, formatter-on-write, file snapshot and rewind
    - The roadmap ended at 0.28.0; no provider work appeared anywhere on it.
  assumptions:
    - Exactly three providers — Anthropic, OpenAI, OpenRouter. No fourth without a fresh decision.
    - Google Gemini and local or OpenAI-compatible providers are a non-goal.
    - >
      An application wanting another vendor writes its own `Provider` impl, since the trait is
      externally implementable.
  implementation: >
    Three provider modules, each hardcoding its vendor endpoint as a `const` copied into a private
    `String` field, reachable only through a `#[cfg(test)]` constructor. Two of the three are the
    same file apart from four strings, both delegating to `openai_wire`, which is `pub(crate)` and
    therefore unavailable to the out-of-tree impl the assumption above depends on.
change:
  summary: >
    Replace the provider-count constraint with a dependency-shaped one, drop the blanket non-goal on
    Gemini and OpenAI-compatible providers, and add 0.29.0 to the roadmap to build them. The
    existing order of 0.26.0, 0.27.0 and 0.28.0 is untouched.
  added:
    - >
      Constraint: a provider may be added only when it costs no new runtime dependency and no
      signing or token stack — an OpenAI-shaped body reached by a base URL and an API key string.
    - >
      Non-goal, replacing the blanket one: a vendor whose wire is not OpenAI-shaped and whose auth
      this crate would have to mint — Bedrock's SigV4 path, Vertex's service-account JWT, Gemini's
      native `interactions` API. Each stays reachable by an application that mints the token itself.
    - >
      Roadmap entry 0.29.0 — one `Compatible` provider carrying a base URL and an auth style, with
      vendor presets behind named constructors, over the existing `openai_wire`.
    - >
      A clause on 0.27.0 requiring its provider spec to be `#[non_exhaustive]` from the first line,
      so 0.29.0 adding a variant is additive rather than a break.
  removed:
    - Exactly three providers — Anthropic, OpenAI, OpenRouter. No fourth without a fresh decision.
    - Google Gemini and local or OpenAI-compatible providers
  deferred:
    - >
      Azure OpenAI. It costs one auth-style variant and no dependency, so it is excluded on demand
      rather than on cost, and the 0.29.0 shape admits it later without a break. Destination: the
      0.29.0 entry states it as an argued exclusion.
    - >
      AWS Bedrock and Google Vertex as built-ins. Destination: the replacement non-goal in
      `product.yaml`, which also records that both are reachable today through a caller-supplied
      bearer token.
  replaced:
    - >
      The requirement line "Providers — OpenRouter, Anthropic, and OpenAI, via own HTTP+SSE client,
      with fallback between them" now also names OpenAI-shaped endpoints reached by base URL and
      key, hosted or local.
impact:
  products:
    - io-harness
  versions:
    - 0.27.0
    - 0.29.0
  tasks: []
  dependencies: []
  resource_effect: >
    Adds one release to the roadmap. No net-new runtime dependency in any of it, by constraint —
    the default `cargo tree` is expected to be unchanged at 402 lines after 0.29.0, and that is
    checkable rather than asserted.
versioning:
  previous_target: 0.28.0
  new_target: 0.29.0
  consequence: reorder
approval:
  source: user
  reference: >
    Owner decision 2026-08-01, in session. Asked for the provider extension including local models;
    chose to amend both the constraint and the non-goal; chose to leave 0.26.0, 0.27.0 and 0.28.0
    in their existing order and add 0.29.0 rather than displace Windows AppContainer; chose the
    single-`Compatible`-type shape over a struct per vendor; selected tier-1 hosted, local runtimes
    and the Chinese providers, and excluded Azure.
canonical_updates:
  - products/io-harness/product.yaml
  - products/io-harness/roadmap.yaml
