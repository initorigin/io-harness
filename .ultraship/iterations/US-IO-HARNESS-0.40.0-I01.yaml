id: US-IO-HARNESS-0.40.0-I01
timestamp: 2026-08-07T00:00:00Z
category:
  - release-level
  - product-level
trigger: >
  The owner asked, during 0.40.0's completion phase, for two things the contract did not
  carry: every io-cli link removed from this repository with the product marked "Not built",
  and the README and guides brought up to what the crate actually does through 0.40.0 rather
  than through the release each section was written in.
evidence:
  - >
    README.md carries two io-cli links — line 106, inside the "Who it is for" paragraph, and
    line 398, the product table row, which reads "Released". They are the only two io-cli URLs
    in the repository outside CHANGELOG.md and the UltraShip views; `grep -rn` for
    `github.com/initorigin/io-cli` and `crates.io/crates/io-cli` returns exactly those two.
  - >
    README.md:401 states that io-cli "is the crate embedded by something other than its own
    author, which is the only evidence a library like this one can offer that its API survives
    contact with a second program". That sentence is an argument built on the row above it; a
    status change that leaves it standing produces a page that contradicts itself two lines apart
    — the exact defect N5 exists to catch, reached from a different direction.
  - >
    README.md:141 tells a reader that a command "runs with your process's privileges and is
    **not** sandboxed". `src/lib.rs:70` says the same. Both were true when written and this
    release is the one that makes them incomplete: containment is now available and opt-in. The
    release already corrects `src/lib.rs:279` and `src/tools/exec.rs` under N5, and these two are
    the same claim in the two files N5 does not name.
  - >
    README.md:375's platform table still reads "Linux | Native, namespaces and rlimits". The
    identical row in docs/CONTRACT.md:131 was corrected to "mount and network namespaces plus
    rlimits" by this release's documentation commit. One table was updated and its twin was not.
  - >
    Stated once and then acted on, because it is a fact the owner is entitled to overrule and this
    record should not pretend it was never raised: io-cli is published on crates.io and its
    repository is public. "Not built" is a decision about what this README claims, not a claim
    about the registry, and nothing here yanks, unpublishes or otherwise touches that crate. The
    README's own precedent for the wording is io-studio's row.
  - >
    CHANGELOG.md and `.ultraship/views/` also name io-cli, and neither is edited. The changelog is
    a historical record of what each release said at the time, and the views are generated from
    sealed release records — rewriting either to match a decision taken today is the thing
    `iterate` prohibits, wearing a documentation costume.
  - >
    Nine of the README's capability paragraphs narrate the release they arrived in — "since
    0.34.0", "(0.34.0)", "0.33.0's", "0.17.0's". `tests/readme.rs` already forbids a
    version-named heading and forbids `src/lib.rs` narrating releases; the landing page carrying
    the same narration in its body is the same defect below the checker's line.
before:
  scope:
    - >
      Documentation in 0.40.0 was bounded by N5 and N6: the per-platform enforcement table, the
      correction of `src/lib.rs:279`, the six honest costs, and the guide prose for the new field.
  assumptions:
    - >
      That the rest of README.md and the guides were current, so this release needed to touch only
      the sections its own feature changed.
    - >
      That io-cli's README row was true. It has said "Released" since 0.36.1, which corrected it
      from "In development" against the registry.
  implementation: >
    A documentation pass scoped to the sections the contained-exec feature touched.
change:
  summary: >
    Add a documentation deliverable to 0.40.0 as two new non-functional criteria: N7 removes every
    io-cli link and states the product as not built, and N8 brings README.md and the guide surface
    up to the whole of what the crate does through 0.40.0. One new task, US-IO-HARNESS-0.40.0-T08,
    carries both. No functional criterion changes and no code behaviour changes.
  added:
    - N7 — no io-cli link anywhere, and the product table says what is true.
    - N8 — the README and the guides describe the crate as it is at 0.40.0.
    - US-IO-HARNESS-0.40.0-T08
  removed: []
  deferred: []
  replaced: []
impact:
  products:
    - io-harness
  versions:
    - 0.40.0
  tasks:
    - US-IO-HARNESS-0.40.0-T08
  dependencies: []
  resource_effect: >
    Documentation only. It adds one task after every implementation task is done, and it re-runs
    the gates that read documentation — `readme`, `docs_drift`, `guide_pages`, `public_api` — plus
    `cargo fmt`, `clippy` and the nightly docs command, because `src/lib.rs` is edited. The release
    stays a minor with zero breaks; nothing here touches the public API, the store or a signature.
versioning:
  previous_target: 0.40.0
  new_target: 0.40.0
  consequence: no-version-change
approval:
  source: user
  reference: >
    The owner asked for both changes in session on 2026-08-07, during 0.40.0's completion phase,
    in two consecutive messages: remove the io-cli links and mark it "Not built", then "properly,
    fully update the docs and readme based on all that the harness is capable of with all version
    till 0.40.0".
canonical_updates:
  - products/io-harness/releases/0.40.0.yaml
  - products/io-harness/execution/tasks.yaml
