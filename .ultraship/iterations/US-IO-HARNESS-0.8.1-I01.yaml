id: US-IO-HARNESS-0.8.1-I01
timestamp: '2026-07-25T04:19:27Z'
category:
  - release-level
  - implementation-level
trigger: >
  The 0.8.1 contract predicted that `CompilesRust` and `EachCompilesRust` needed no change,
  because they "carry no caller-supplied criterion for the subject to shadow". Performing the
  review that scope entry requires falsified the prediction: both are defeatable by the file
  under verification, by a mechanism the contract did not anticipate. A second vector against
  the two gates the release does fix was also found while reproducing the recorded one, and is
  named by no acceptance criterion even though the delivered fix already closes it.
evidence:
  - >
    `CompilesRust` passes code that does not type-check. Deterministic, no model involved, using
    the harness's exact metadata-compile flags: a subject of `#![cfg(any())]` followed by
    `pub fn hello() -> u32 { "not a u32" }` compiles clean and rustc exits 0. The crate-level
    `cfg` strips the item BEFORE it is type-checked, so the body is never examined and the
    mismatched return type is never seen. The gate reports a pass.
  - >
    The mechanism is not "shadowing a criterion" — which is why the contract's reasoning missed
    it. `CompilesRust` has no caller-supplied criterion, and that is exactly what the contract
    relied on. The attack is on the crate itself: the subject controls its own crate root, so it
    can delete the very items the gate exists to compile. Nothing needs to be shadowed.
  - >
    `EachCompilesRust` reads each listed file and passes it through the same `compile_source(src,
    None, guard)` path (src/verify.rs), so it shares the weakness by construction. The same
    single-file subject defeats it once per file.
  - >
    The second vector against the fixed gates: a subject beginning `#![cfg(any())]` deleted the
    whole crate INCLUDING the appended criterion, and the resulting test binary reported "test
    result: ok. 0 passed; 0 failed" and exited 0 — which the gate read as a pass. Reproduced
    against the pre-fix implementation for both `RustTestPasses` and `WorkspaceTestPasses`. It
    requires no knowledge of macros at all, so it is strictly cheaper to find than the recorded
    I01 bypass.
  - >
    The remedy first identified — compiling a harness-authored root whose body is
    `include!("subject.rs")`, so rustc rejects the construct outright with "an inner attribute is
    not permitted in this context" — was VERIFIED AND THEN REJECTED during implementation. It
    rejects *every* crate-level inner attribute, not only the destructive ones: an honest file
    opening `#![allow(dead_code)]` fails to compile under it, and F9 requires that a file which
    genuinely compiles still passes. Recorded because it is the obvious fix and the next reader
    will reach for it.
  - >
    The remedy actually shipped, verified against both cases before implementation: append a
    reserved probe item to the subject, compile the subject as its own crate, then type-check a
    second crate that REFERENCES the probe. A subject that deletes its own items deletes the probe
    with them, and the reference fails to resolve; a subject carrying a legitimate crate-level
    attribute keeps its items and passes. This reuses the two-crate structure the release already
    built for the test gates rather than introducing a third mechanism.
  - >
    SUPERSEDED BY US-IO-HARNESS-0.8.1-I02, in part. The probe mechanism above shipped and is
    correct. The two-crate structure it was said to reuse did NOT ship: the F7 live run showed it
    made an honest private implementation unpassable, and it was reverted. The probe outlived it
    and now runs on both paths — it is what catches the crate-level-attribute vector on the test
    gates too, since subject and criterion share a crate again.
  - >
    The two-crate fix delivered for `RustTestPasses` and `WorkspaceTestPasses` closes the second
    vector for free — the subject's inner attributes stay in the subject's crate and cannot reach
    the criterion's — and this is pinned by a passing test
    (`a_subject_cannot_delete_the_criterion_with_a_crate_level_cfg`, tests/verify_gate.rs). The
    delivered behaviour is already correct; only the contract is silent about it.
    SUPERSEDED BY I02: the vector is still closed and the test still passes, but by the probe
    rather than by crate separation.
before:
  scope:
    - >
      "CompilesRust and EachCompilesRust reviewed against the same question and the finding
      recorded either way. They carry no caller-supplied criterion for the subject to shadow, so no
      change is expected; the release states that conclusion rather than leaving it implied."
    - >
      Hardening RustTestPasses and WorkspaceTestPasses against a subject that shadows the names its
      criterion depends on. The property was stated in terms of shadowing only.
  assumptions:
    - >
      A gate with no caller-supplied criterion cannot be defeated by the file it verifies, because
      there is nothing for that file to shadow.
    - >
      The attack surface is macro and path resolution — what the subject can REDEFINE inside a
      shared crate.
  implementation: >
    `CompilesRust` and `EachCompilesRust` write the subject to lib.rs and compile it with
    `rustc --edition 2021 --crate-type lib --emit metadata`, with the subject as the crate root.
    `RustTestPasses` and `WorkspaceTestPasses` were hardened during develop by compiling the
    subject as its own crate and the criterion against it; the crate-level-attribute vector this
    closes is covered by a test but named by no acceptance criterion.
change:
  summary: >
    Correct the falsified assumption and fold the resulting fix into 0.8.1 rather than shipping a
    release that documents a hole it found and could close. `CompilesRust` and `EachCompilesRust`
    are hardened by compiling a harness-authored crate root that includes the subject, so the file
    under verification can no longer carry crate-level attributes. Two acceptance criteria are
    added: F8 names the crate-level-attribute vector against the execution gates (already
    delivered, previously unnamed), and F9 requires the compile-only gates to reject a subject that
    deletes itself. The release's stated property widens from "the subject cannot shadow what the
    criterion names" to "the subject cannot control the crate it is compiled in" — which is the
    real invariant, and the one both vectors violate.
  added:
    - >
      F8 — a crate-level attribute in the subject cannot delete the criterion. Covers
      RustTestPasses and WorkspaceTestPasses. Already satisfied by the delivered two-crate fix;
      this names it.
    - >
      F9 — CompilesRust and EachCompilesRust reject a subject that removes its own items with a
      crate-level attribute, so a file whose body does not type-check cannot pass a compile gate.
    - >
      Implementation: on the compile-only path, a reserved probe item is appended to the subject
      and a second crate type-checks a reference to it, so a subject that strips its own items
      fails while one carrying a legitimate crate-level attribute still passes. The `include!`
      root first proposed for this was rejected during implementation — see evidence.
    - >
      A fourth `gate_phase_failed` phase, `subject-emptied`, distinguishing "the file compiled but
      its items were stripped" from the three phases the test gates already record.
  removed: []
  deferred: []
  replaced:
    - >
      The scope entry predicting no change to CompilesRust and EachCompilesRust, replaced by one
      that states what the review actually found and requires the fix.
    - >
      The assumption that a gate without a caller-supplied criterion is safe, replaced by the
      broader invariant: the subject must not control the crate it is compiled in. Shadowing is one
      consequence of violating it; self-deletion is another.
impact:
  products:
    - io-harness
    - io-cli
  versions:
    - 0.8.1
  tasks:
    - US-IO-HARNESS-0.8.1-T02
    - US-IO-HARNESS-0.8.1-T03
    - US-IO-HARNESS-0.8.1-T06
    - US-IO-HARNESS-0.8.1-T08
  dependencies:
    - >
      io-cli exposes these gates to its users as `rust-test:` and inherits the correction. Its
      consumer-side obligation not to present a passing gate as proof of correctness is already
      recorded in US-IO-CLI-0.2.0-I01; no new obligation is created here, but the compile-only
      gates it may expose become honest in the same upgrade.
  resource_effect: >
    Small and bounded, and this held. The change touched one arm of one function
    (`compile_source`'s `None` branch) plus two argv builders, and reused the two-crate structure
    the release already built for the test gates. No new dependency, no MSRV movement, no public
    API change beyond the additive `SandboxEvent::gate_phase_failed` — so the release stayed a
    patch and F5 was unaffected. One cost the estimate missed: the compile-only gate now spawns
    rustc twice rather than once, the same doubling the test gates took, so NF5's figure covers
    both paths.
    The larger cost was not this iteration's to see: the structure being reused was itself wrong,
    and I02 reverted it after the live run. The probe survived that revert unchanged, so the work
    recorded here held — it was the foundation under it that moved.
