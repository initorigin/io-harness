  reference: >
    Approved in session 2026-07-25. Develop stopped rather than widening scope on its own: the
    finding, its evidence, the verified remedy, and the choice between folding it into 0.8.1 or
    letting it ride to 0.9.0 as a stated limitation were presented, and the owner answered "yes,
    run iterate" — taking the fix into 0.8.1.
