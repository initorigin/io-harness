id: US-IO-HARNESS-0.42.0-I01
timestamp: 2026-08-08T16:55:04Z
category:
- implementation-level
trigger: >
  The contract names `prepare_read` as the one place the `before_tool` gate must sit, on the stated
  grounds that it is the serial policy phase every dispatch call site shares. It is not. Reading the
  loop while threading the approval context through it showed `prepare_read` is reached by the
  read-only paths only, so the gate as specified could not stop the very call F5 refuses.
evidence:
- >
  `prepare_read` (`src/run.rs:7203`) has exactly three callers: `read_batch`'s per-call loop
  (`src/run.rs:7317`), `dispatch`'s `GREP_TOOL | FIND_TOOL | READ_FILE_TOOL` arm (`:7565`), and
  `dispatch`'s registered-tool arm (`:9509`). All three are read paths.
- >
  `write_file`, `edit_file`, `exec`, `shell`, `shell_start` and the git built-ins are dispatched by
  their own arms of `dispatch` and never enter `prepare_read`. A gate placed there would be silent
  for every one of them.
- >
  F5 refuses a `write_file` from an `io.local.toml` table and asserts the file is byte-identical
  afterwards. Under the contract's stated placement that criterion could not pass — the hook would
  never be consulted for that call.
before:
  scope:
  - A model as the `Approver`, with the rule, the layer and the goal.
  - A `before_tool` lifecycle hook from `io.toml` that refuses a call.
  - A review criterion answered against the change rather than the outcome.
  implementation: >
    One insertion in `prepare_read`, described in the contract as covering "the flat loop, the tree
    loop, the serial path and 0.41.0's concurrent batch".
  assumptions:
  - Every tool call passes through `prepare_read`.
  - 0.41.0's batch and the serial dispatch share one policy phase for all tools rather than for reads.
change:
  summary: >
    Move the gate to one helper called from two places — the head of `dispatch`, which every
    non-batched call passes through, and `read_batch`'s per-call loop, which is where 0.41.0's
    concurrent reads are prepared. Same one-definition, two-call-sites shape the release already uses
    for `approval_context`, and no call is consulted twice: a read dispatched through `dispatch`'s
    read arm is checked at the head, a read in a batch is checked in the batch.
  added: []
  removed: []
  deferred: []
  replaced:
  - The `scope.included` bullet placing the gate in `prepare_read`.
  - The `resource_profile.likely_cost_drivers` bullet about editing `prepare_read`.
  - The fallback-pressure risk, which named the same function.
  - >
    The same claim where it also appeared in `outcome.user_can`, found while sealing the record and
    corrected before the pin — the prose and the scope carried one error between them, and fixing
    only the scope would have left the outcome saying something the code does not do.
impact:
  products:
  - io-harness
  versions:
  - 0.42.0
  tasks:
  - US-IO-HARNESS-0.42.0-T05
  dependencies: []
  resource_effect: >
    Neutral. Two insertions instead of one, each smaller than the single one would have been, and the
    delicate constraint the cost driver named — not disturbing 0.41.0's pause collapse, pending-approval
    row or call-order fold — is now avoided rather than managed, because neither insertion is inside
    the function that holds them.
versioning:
  previous_target: 0.42.0
  new_target: 0.42.0
  consequence: no-version-change
approval:
  source: user
  reference: >
    Approved in session 2026-08-08, choosing "record it, gate at both sites" over narrowing the hook to
    read-only tools or dropping the hook half to the fallback scope.
