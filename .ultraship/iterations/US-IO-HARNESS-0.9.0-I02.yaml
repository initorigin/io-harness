id: US-IO-HARNESS-0.9.0-I02
timestamp: 2026-07-26T06:40:00Z
category:
  - release-level
  - architecture-level
trigger: >
  NF4 asserts a three-OS matrix and an MSRV that neither existed nor held. The repository has never
  had a CI workflow — `git log --all -- .github/workflows` is empty on every branch and the repo has
  never had an Actions run — so "the crate still builds on macOS, Linux, and Windows" had never been
  checked once, on any release, while being claimed since 0.8.0. Building the matrix to satisfy the
  criterion is what disproved it.
evidence:
  - >
    MSRV: `cargo +1.87 build --all-targets` fails inside rmcp 2.2.0, which uses let-chains
    (stabilised in 1.88) and publishes no `rust-version` of its own, so cargo had nothing to check
    when resolving. rmcp has been pinned at 2.2.0 since 0.8.0 (`git show 381163f:Cargo.lock`), so
    0.8.0 and 0.8.1 are on crates.io declaring a floor of 1.87 that they do not hold. `cargo +1.88
    build --all-targets` succeeds.
  - >
    First CI run (30190204224), macOS: green — the full 225-test suite, clippy and fmt.
  - >
    First CI run, Linux: 9 lib-test failures. 7 in `verify::tests` where `passes_guarded(...)`
    returns false, so the 0.3.0 execution-based verification gate does not work on Linux at all. 2 in
    `sandbox::tests`, where the caps do not fire: `cpu_cap_kills_a_busy_loop_and_names_the_cpu_cap`
    observes `SandboxOutcome { backend: PortableFloor, exit_code: None, cap_hit: None }` against an
    expected `Some(Cpu)`, and the memory cap fails the same way.
  - >
    First CI run, Windows: `cargo build --all-targets` succeeded and `cargo test` then ran without
    terminating until the job was cancelled at ~20 minutes, against a six-hour default timeout — the
    behaviour expected when a resource cap never fires and a capped process is therefore never
    killed.
  - >
    Read directly from the source, not inferred from the hang: `src/sandbox/windows.rs` computes
    `let _job = JobLimits::from(spec.limits)` and immediately drops it, then calls `run_capped` with
    an empty configure closure. No Win32 API is called anywhere in the crate. There is no job object,
    no restricted token, and no enforced cap — while the module doc claims "a Job Object with
    kill-on-close plus memory / active-process / CPU limits, and a restricted token", and every run
    reports `Backend::WindowsJobObject` into the trace. `JobLimits` is unit-tested as pure data,
    which is exactly why 225 passing tests never caught it.
  - >
    The 0.6.0 roadmap entry promises "a real native backend per platform (macOS sandbox-exec, Linux
    namespaces+seccomp, Windows Job Objects) over a portable floor ... so the same harness isolates
    code the same way on mac, linux, and windows". For Windows that is not true, and on Linux the
    caps do not fire.
  - >
    clippy is not platform-neutral either: `-D warnings` fails on Linux over the `libc::RLIMIT_*`
    casts in `src/sandbox.rs`, which are load-bearing on macOS (the constants are `c_int`) and
    redundant on Linux (already `u32`).
before:
  scope:
    - >
      NF4 as written: "MSRV stays at 1.87 and the crate still builds on macOS, Linux, and Windows.
      `cargo clippy --all-targets -- -D warnings` and `cargo fmt --check` are clean."
    - >
      delivery.environment as written: "crates.io, plus the repository's GitHub Actions matrix
      (macOS, Linux, Windows)."
  implementation: >
    No CI of any kind. NF4 was to be satisfied by a matrix that was assumed to exist, against an
    MSRV nobody had built, on two platforms nobody had compiled. The Windows sandbox backend
    reported Backend::WindowsJobObject for a run that creates no job object.
  assumptions:
    - The repository has a GitHub Actions matrix covering macOS, Linux, and Windows.
    - The crate builds and passes its suite on all three platforms.
    - The declared MSRV of 1.87 is the true floor.
    - The Windows sandbox backend enforces the caps its `Backend` label claims.
change:
  summary: >
    Amend NF4 to what is true and checkable now: the MSRV is 1.88, the three-OS matrix is built by
    this release rather than assumed by it, and the platform claim is scoped to macOS — the only
    platform whose suite passes — with the Linux and Windows failures named as known limitations
    rather than implied away. Correct the false `Backend::WindowsJobObject` label in the same
    release, because it is a security claim rather than a feature. Defer the cross-platform fixes
    themselves to a new corrective release, 0.9.1.
  added:
    - >
      `.github/workflows/ci.yml` — the three-OS matrix, a lint job, and an MSRV job that reads
      `rust-version` out of Cargo.toml so the declared floor and the proven floor cannot drift apart
      again. Every job is capped at 20 minutes.
    - >
      A corrective 0.9.1 on the roadmap for cross-platform correctness, ahead of 0.10.0.
  removed: []
  deferred:
    - The 7 Linux `verify::tests` failures → 0.9.1.
    - The 2 Linux `sandbox::tests` cap failures → 0.9.1.
    - The Windows job-object implementation and the hanging Windows suite → 0.9.1.
  replaced:
    - >
      NF4's "MSRV stays at 1.87" → 1.88, with the rmcp let-chains floor named so the number has a
      reason attached.
    - >
      NF4's "the crate still builds on macOS, Linux, and Windows" → the matrix exists and runs on
      all three; macOS is green; Linux and Windows are built and their failures are recorded as
      known limitations of 0.9.0 rather than claimed as passing.
    - >
      `delivery.environment`'s "the repository's GitHub Actions matrix" → the matrix this release
      adds, since it did not previously exist.
impact:
  products:
    - io-harness
  versions:
    - 0.9.0
    - 0.9.1
  tasks:
    - US-IO-HARNESS-0.9.0-T07
  dependencies: []
  resource_effect: >
    Slightly increases 0.9.0 — one workflow, the MSRV correction, and the Windows label fix — and
    creates 0.9.1 (a defect fix against the already-released 0.3.0 verify and 0.6.0 sandbox pillars,
    so a patch release rather than scope taken out of 0.9.0), whose size is not yet known because neither Linux failure has been root-caused.
    It does not touch the tool-layer and skills work, which is complete: F1-F11, NF1-NF3, and
    O1-O3 are all satisfied and green on macOS.
versioning:
  previous_target: 0.9.0
  new_target: 0.9.0
  consequence: no-version-change
approval:
  source: user
  reference: >
    Confirmed in session 2026-07-26. The owner chose to ship 0.9.0 and fix cross-platform
    correctness in a dedicated release, and separately chose to correct the false Windows backend
    label inside 0.9.0 rather than defer it, on the grounds that it is a published security claim
    and not a feature.
