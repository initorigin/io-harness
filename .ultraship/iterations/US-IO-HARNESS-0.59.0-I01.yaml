id: US-IO-HARNESS-0.59.0-I01
timestamp: 2026-08-15T05:14:45Z
category:
  - release-level
  - portfolio-level
trigger: >
  The owner asked what the Windows entries in the roadmap actually block, and what the options are
  for closing them given that the development host cannot run the platform — the same constraint
  that split 0.47.0. The review that answered it found a second Windows gap that no roadmap entry
  schedules, and the owner ruled it into 0.59.0.
evidence:
  - >
    **0.59.0 is the only planned release that mentions Windows.** `roadmap.yaml` has four entries at
    `status: planned` — 0.57.0, 0.58.0, 0.59.0 and 0.60.0 — and every occurrence of "Windows" past
    the 0.59.0 block belongs to that block, except one line inside 0.60.0 that exists only to explain
    why the 0.49.0 → 0.60.0 move went around 0.59.0 rather than renumbering it. Checked rather than
    assumed: 0.60.0 is inter-agent messaging, not Windows work.
  - >
    **`docs/CONTRACT.md:146` carries a scheduling promise with no entry behind it.** It states the
    browser is unsupported on Windows because "the pipe transport needs two inherited descriptors at
    fixed numbers, which the standard library does not expose", and calls this "planned work, not an
    accident". No entry in `roadmap.yaml` schedules it. A claim published to callers with nothing in
    the plan to discharge it.
  - >
    **The refusal names its own release, and that is now false.** `src/browser.rs:893` is a single
    `#[cfg(windows)] launch` returning `fail(...)`, whose message ends "Tracked as its own release"
    (`src/browser.rs:906`). The fold-in decision makes that string untrue, so it changes in 0.59.0
    whichever way the transport lands.
  - >
    **The contract overstates the surface.** `CONTRACT.md:146` says "Every entry point there returns
    a typed configuration error". There is one — the `#[cfg(windows)] launch` above. Read at the
    source before writing this record, per the pattern that caught a wrong roadmap premise in each of
    0.54.0, 0.55.0 and 0.56.0.
  - >
    **The two gaps are the same spawn problem.** The unix transport holds both pipe ends above 10
    with `F_DUPFD` so the dup targets cannot collide, then `dup2`s them onto descriptors 3 and 4
    inside `pre_exec` using only async-signal-safe calls (`src/browser.rs:959-967`). Windows has no
    standard-library analogue, and the attribute that would supply one sits on the same
    `STARTUPINFOEX` as `PROC_THREAD_ATTRIBUTE_SECURITY_CAPABILITIES`, which the access half of
    0.59.0 already builds.
  - >
    **The constraint that split 0.47.0 is being removed.** 0.47.0's Windows half was taken out whole
    because ten `windows-latest` matrix rounds could not converge from a host that cannot run the
    platform (`US-IO-HARNESS-0.47.0-I01`). The owner is standing up a local Windows 11 ARM64 VM under
    UTM. Both of 0.59.0's open questions — the `CARGO_HOME` decline and the `cmd.exe` absolute-path
    refusal — are diagnostic rather than design questions, and both are architecture-independent.
  - >
    **No released record needs rewriting for this, and nothing may be renumbered.** 0.53.0 shipped
    the browser hole deliberately and its record stands; `docs/CONTRACT.md:146` is working-tree
    documentation, corrected by 0.59.0 rather than edited here. 0.47.0's immutable record names
    0.59.0 as the Windows access half, and 0.60.0 already moved once specifically to avoid
    disturbing that, so this change adds scope to 0.59.0 and touches no version number anywhere.
before:
  scope:
    - 0.59.0 — Windows access confinement (AppContainer) only
    - Browser-on-Windows — unscheduled; a CONTRACT claim with no roadmap entry
  assumptions:
    - >
      That the browser's Windows transport would be given a release of its own. Asserted in shipped
      code at `src/browser.rs:906` and never entered in the roadmap.
    - >
      That the two Windows gaps were unrelated pieces of work. They are one spawn path needing two
      attributes on the same `STARTUPINFOEX`.
  implementation: >
    `Sandbox::select` chooses the Job Object on Windows and `sandbox::appcontainer` is unselected
    behind `allow(dead_code)`; `browser::launch` has a Windows arm that refuses outright.
change:
  summary: >
    Fold browser-on-Windows into 0.59.0. The release becomes the one that makes the whole Windows
    column true rather than only the sandbox row: the AppContainer selected with a grant set derived
    from the run's resolved facts, an empty capability array as the egress denial, and the browser's
    two transport handles inherited at the numbers the child expects. The halves land in risk order
    — browser transport, then egress, then filesystem confinement opt-in — and the cut line is fixed
    in advance: if the grant set has not converged when the rest is ready, the browser and egress
    halves ship and the filesystem half moves, never the reverse. Nothing is deferred by this record
    and so nothing needs a destination — the cut line is conditional and forward-looking, and
    exercising it would be a plan change of its own, requiring its own iteration record naming the
    version the filesystem half moves to.
  added:
    - "0.59.0 — the browser's Windows pipe transport"
    - "0.59.0 — a stated landing order and a pre-agreed cut line between the halves"
  removed: []
  deferred: []
  replaced: []
impact:
  products:
    - io-harness
  versions:
    - 0.59.0
  tasks: []
  dependencies: []
  resource_effect: >
    0.59.0 grows by one bounded subsystem whose scope cannot expand — a known API against a known
    child expectation — while saving a second Windows matrix-round budget and a second pass at
    standing up the platform. The release's unbounded part is unchanged and is still the grant set.
    Net risk is concentrated rather than increased, which is why the cut line is recorded here and
    not left to be decided under deadline.
versioning:
  previous_target: 0.59.0
  new_target: 0.59.0
  consequence: no-version-change
approval:
  source: user
  reference: >
    Owner asked in session on 2026-08-15 for the Windows roadmap work to be analysed, was shown that
    0.60.0 is not Windows and that browser-on-Windows was unscheduled, and ruled it into 0.59.0. The
    recommendation put to them was the opposite — a separate entry, on the grounds that 0.59.0
    already carries an unbounded discovery problem and two open questions, and that growing a second
    platform subsystem mid-flight is how 0.47.0 came apart. The owner chose to fold it in. That
    argument is not discarded: it is why the halves are independently shippable and why the cut line
    above is part of this record.
canonical_updates:
  - products/io-harness/roadmap.yaml
