id: US-IO-HARNESS-0.24.0-I01
timestamp: 2026-07-31T12:01:04Z
category:
- release-level
- architecture-level
trigger: >
  Four places where implementation evidence contradicted the contract, found while building
  0.24.0. Three are corrections to criteria that describe something this repository or this
  platform does not do; the fourth is the scope decision the release-fit assessment said would
  arrive, arriving in a different shape than the fallback anticipated.
evidence:
- >
  **The `#[non_exhaustive]` rider cannot be applied to `CompletionRequest` and
  `CompletionResponse` without new public API.** Measured rather than argued: applying the
  attribute produces 11 instances of `error[E0639]: cannot create non-exhaustive struct using
  struct expression` across 10 files under `tests/`, which is a separate crate and therefore
  exactly what an external consumer experiences. Functional-update syntax
  (`..Default::default()`) is blocked as well, which the contract's authors did not appear to
  expect. `Provider::complete` must *return* a `CompletionResponse`, so the attribute leaves the
  crate's primary extension point constructible only by `default()`-then-assign or through a
  builder API the contract does not specify.
- >
  **F11's doctest clause is false of this repository.** It requires that the README's first
  example and `docs/guide/permissions.md`'s first example "both compile as doctests". Neither
  does: there is no `#![doc = include_str!("../README.md")]` anywhere in the crate, and
  `cargo test --doc` compiles only `///` and `//!` comments under `src/`. The markdown fences are
  checked as *text* by `tests/readme.rs`, `tests/guide_pages.rs` and `tests/docs_drift.rs`.
  Making the clause true would mean pulling the README into the crate root, which changes how the
  crate documents itself and is not in this release's scope.
- >
  **F9's memory clause does not describe what a Job Object does.** It requires that "a child
  exceeding the job's memory limit is terminated by the job".
  `JOB_OBJECT_LIMIT_PROCESS_MEMORY` makes the offending *allocation fail*; it does not terminate
  the process. A payload over the cap is never permitted to hold the memory and typically dies of
  its own failed allocation. Literal termination on a memory limit would need a job completion
  port and a thread parked on it for the lifetime of every run.
- >
  **The recorded `fallback_scope` no longer describes a reachable state.** It says process
  handles and the Windows Job Object "drop TOGETHER into 0.25.0, because they are one piece of
  machinery". The Job Object is built, tested to the limit a macOS host allows, and reports
  `Backend::WindowsJobObject`; process handles are not started. The stated coupling ran one way
  only — handles are incorrect on Windows without a job — and the reverse is not true: a job with
  nothing long-running to contain still bounds every sandboxed run, which it did not before.
before:
  scope:
  - The `shell` tool, its parser and its refusal set
  - '`list_dir`'
  - Process handles — `shell_start`, `shell_poll`, `shell_kill` — and their store tables
  - Resume semantics for handles, orphaning every handle recorded by a previous process
  - The Windows Job Object, resource half
  - The positioning fix on `TaskContract::workspace`
  - '`#[non_exhaustive]` on `CompletionRequest`, `CompletionResponse`, `EventKind` and `Backend`'
  assumptions:
  - >
    That `#[non_exhaustive]` is a one-line change on a struct whose consumers would be unaffected,
    because the contract described the rider as costing nothing at "the cheapest moment this will
    ever be".
  - That the README and guide examples are compiled doctests in this crate.
  - That a Windows job object terminates a process which exceeds its memory limit.
  - >
    That process handles and the Job Object would necessarily rise or fall together, so a
    fallback could name them as one unit.
  implementation: >
    One release carrying a shell parser, a process-handle registry crossing the checkpoint
    boundary, a Win32 containment subsystem, and four public API breaks.
change:
  summary: >
    Defer process handles to 0.25.0, keeping everything else in 0.24.0. Drop the two provider
    structs from the `#[non_exhaustive]` rider and add `Cap` to it. Correct F9 and F11 to state
    what the platform and the repository actually do.
  added:
  - >
    `#[non_exhaustive]` on `Cap`, which was not in the original rider. This release adds
    `Cap::Processes` to it, so it is subject to exactly the argument the rider makes about the
    other enums, and marking it now is free where marking it later is a second break.
  removed:
  - >
    `#[non_exhaustive]` on `CompletionRequest` and `CompletionResponse`. The attribute is
    unambiguously right for an enum, where it costs a consumer one wildcard arm and protects them
    from every future variant. For these two structs it does the opposite: it permanently removes
    struct-literal construction from the type a custom `Provider` must return, in exchange for
    avoiding a break whose fix is mechanical. The intent, and the fact that a future field
    addition is therefore still a break, goes into `docs/CONTRACT.md` so a consumer is told rather
    than surprised.
  - >
    F11's clause "and both compile as doctests". The requirement that both examples lead with
    `Session` stands and is met.
  deferred:
  - >
    Process handles: the `shell_start`, `shell_poll` and `shell_kill` tools, the store tables
    behind them, the per-run cap on live handles, and the unconditional orphaning of any handle
    recorded by a previous process. Destination: 0.25.0.
  - >
    Acceptance criteria F5 and F7 in full, and the handle-specific half of F6, move to 0.25.0 with
    the work they describe.
  replaced:
  - >
    F9's memory clause, from "a child exceeding the job's memory limit is terminated by the job"
    to the allocation-failure semantics the Win32 API actually provides. This is a correction
    toward what can be proven, not a weakening: the criterion still requires the cap to be
    demonstrably effective and still requires it to be distinguishable from a wall-clock timeout.
  - >
    `scope.fallback_scope`, restated so that the remaining fallback is process handles alone. The
    Job Object is no longer part of it, because it is built.
impact:
  products:
  - io-harness
  versions:
  - 0.24.0
  - 0.25.0
  tasks:
  - US-IO-HARNESS-0.24.0-T05
  - US-IO-HARNESS-0.24.0-T06
  - US-IO-HARNESS-0.24.0-T07
  dependencies: []
  resource_effect: >
    Removes the largest and riskiest remaining subsystem from 0.24.0 — a process registry that
    crosses the checkpoint boundary, where PID reuse makes the naive implementation dangerous
    rather than merely wrong. 0.25.0 grows correspondingly and now carries three themes rather
    than two, which is a fit question to face at its own planning rather than here.
versioning:
  previous_target: 0.24.0
  new_target: 0.24.0
  consequence: no-version-change
approval:
  source: user
  reference: >
    Owner decided both open questions in session on 2026-07-31, presented with the measured
    evidence above and the alternatives. Ship 0.24.0 without process handles, moving them alone to
    0.25.0 rather than taking the recorded fallback that would also have reverted the Job Object.
    Drop `CompletionRequest` and `CompletionResponse` from the `#[non_exhaustive]` rider rather
    than adding a builder API the contract does not specify.
