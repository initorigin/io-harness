  dependencies: []
  resource_effect: >
    Removes work rather than adding it. The rejected alternative — keeping the attribute and adding
    the `new` plus six `with_*` methods that would make the type constructible again — is seven new
    public items, a rewrite of eight construction sites, and a migration note telling every downstream
    caller to stop using the form the documentation has recommended for twenty-nine releases. That is
    its own release and was declined.
versioning:
  previous_target: 0.44.0
  new_target: 0.44.0
  consequence: no-version-change
approval:
  source: user
  reference: >
    Asked in session 2026-08-09 with both options and their downstream compile consequences shown
    side by side; the owner chose "field only, no attribute".
