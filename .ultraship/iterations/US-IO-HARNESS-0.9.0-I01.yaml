id: US-IO-HARNESS-0.9.0-I01
timestamp: '2026-07-26T00:00:00Z'
category:
  - release-level
  - portfolio-level
trigger: >
  The product owner restated the definition of a complete harness as twelve named capabilities —
  task contract, context construction, tool layer, orchestration loop, state and memory,
  verification, permissions and guardrails, recovery and retry, stop conditions and budgets,
  observability and tracing, evaluation, and human approval — and asked that the crate be built out
  until all twelve hold. An audit of the shipped 0.8.1 source against that list found five of the
  twelve partial or absent, while the roadmap spent its next three planned releases (0.10.0 office
  documents, 0.11.0 media and git, 0.12.0 public documentation contract) on capabilities outside
  the twelve. The ordering, not the content, is what is wrong.
evidence:
  - >
    Context construction is the weakest pillar and is not on the roadmap at all. src/run.rs:950
    declares `let mut observations = String::new()`; every tool result, every no-tool-call message,
    and every composed child result is appended to it (src/run.rs:983, 1000, 1024) and the whole
    accumulated string is re-sent verbatim as the user prompt on every subsequent turn
    (src/run.rs:960 -> workspace_user_prompt, src/run.rs:1692). Nothing bounds it, summarises it,
    drops superseded entries, or re-reads a file that changed after it was observed. `tail(&observations,
    OBS_READ_CAP)` at src/run.rs:1047 caps only what is written to the trace, not what is sent to
    the model. A long run therefore spends a growing share of every request re-sending stale
    observations until the token budget stops it — the budget is enforced, but it is being spent on
    repetition.
  - >
    Recovery and retry is one mechanism, not a layer. src/run.rs:1597 `complete_with_retry` re-calls
    the same provider up to `max_retries` times and then escalates. There is no fallback provider
    despite three being implemented (src/provider/{openrouter,anthropic,openai}.rs), no detection of
    a stalled agent that is spending steps without changing the workspace, and no replan path — a
    model that repeats an ineffective tool call runs to `StepCapReached`, which the 0.8.1 live run
    recorded happening four steps in a row (iterations/US-IO-HARNESS-0.8.1-I02, first run).
  - >
    Observability has durable depth but no live surface. The trace is complete in rusqlite
    (src/state.rs, 1637 lines) and readable after the fact, and `tracing` emits spans, but the public
    API in src/lib.rs exports no way to subscribe to a run in progress. io-cli (ratatui) and
    io-studio (Tauri) both need to render steps, tool calls, approvals, and spend as they happen;
    against 0.8.1 each would have to poll the SQLite file.
  - >
    State and memory covers within-run progress only. `Store` persists steps, agent events, budget
    draws, and checkpoints keyed by `run_id`; nothing survives a run as recallable knowledge, so two
    runs over the same workspace share no learned facts.
  - >
    Evaluation has no surface in the crate. io-eval is a separate repository that depends on this
    one; there is no deterministic replay, no recorded-fixture provider, and no per-run outcome
    record shaped for scoring, so io-eval must reconstruct all of it from the raw trace schema and
    would break on any schema change.
  - >
    The seven pillars that do hold are load-bearing and shipped: TaskContract (src/contract.rs),
    the loop (src/run.rs:926), Verification (src/verify.rs, hardened in 0.8.1), Policy with four acts
    (src/policy.rs), Approver with durable defer (src/approve.rs), budgets and the shared Ledger
    (src/containment.rs), and the tool layer's built-ins plus the MCP client (src/tools/, src/mcp.rs).
    Nothing in this iteration reopens them.
before:
  scope:
    - '0.9.0 — in-process typed tools and skills (outline)'
    - '0.10.0 — Office and PDF documents, OCR, barcode (outline)'
    - '0.11.0 — image/video passthrough and git repository work (hypothesis)'
    - '0.12.0 — documented public contract, deprecation cycle, per-item examples (hypothesis)'
  assumptions:
    - >
      The twelve capabilities listed in docs/CAPABILITIES.md were treated as delivered once the
      first release touching each shipped. Context construction and evaluation were listed there
      from 0.1.0 without ever having been the subject of a release.
    - >
      Breadth of file formats and media is worth more to the downstream products than depth in the
      engine, so document and media support outrank engine work in the ordering.
  implementation: >
    Roadmap ordering only. No shipped code is affected by this iteration.
change:
  summary: >
    Reorder the roadmap so the five open engine pillars close before the format and media
    extras. 0.9.0 is unchanged and stays next. Three new pillar releases take 0.10.0, 0.11.0, and
    0.12.0; the three extras that held those numbers shift to 0.13.0, 0.14.0, and 0.15.0 with their
    outcomes unchanged. Nothing is dropped and nothing is merged — this is a resequencing.
  added:
    - >
      0.10.0 — Context construction and durable memory. Budget-aware assembly of what the model
      sees each turn, compaction of superseded observations, re-read of observations invalidated by
      later writes, per-result size caps at the point of construction rather than at the trace, and
      a durable memory an agent writes to and recalls across runs over the same workspace.
    - >
      0.11.0 — Resilience. Provider fallback across the three implemented providers, stall
      detection for an agent making no workspace progress, a bounded replan on stall, and an
      escalation policy that distinguishes a retryable transport failure from a terminal one.
    - >
      0.12.0 — Observability and evaluation. A live event stream the embedding application
      subscribes to, a stable exported trace shape, and the evaluation surface io-eval needs:
      deterministic replay from a recorded provider, and a per-run outcome record carrying success,
      steps, spend, and latency.
  removed: []
  deferred:
    - 'Office and PDF documents, OCR, barcode — from 0.10.0 to 0.13.0.'
    - 'Image and video passthrough, git repository work — from 0.11.0 to 0.14.0.'
    - 'Documented public contract and deprecation cycle — from 0.12.0 to 0.15.0.'
  replaced:
    - >
      The assumption that docs/CAPABILITIES.md listing a capability means the capability is
      delivered. That file is a statement of intent for the product; delivery is what a release
      contract accepted. It is being corrected to mark which of the twelve are shipped and which
      have a release number.
impact:
  products:
    - io-harness
    - io-cli
    - io-studio
    - io-eval
  versions:
    - 0.9.0
    - 0.10.0
    - 0.11.0
    - 0.12.0
    - 0.13.0
    - 0.14.0
    - 0.15.0
  tasks: []
  dependencies:
    - >
      io-eval depends on this crate and currently has no supported surface to evaluate through.
      Moving the evaluation pillar to 0.12.0 from nowhere gives it one; until then it reads the
      rusqlite schema directly and is coupled to an internal detail.
    - >
      io-cli and io-studio both need the 0.12.0 live event stream to render a run in progress.
      Ordering it ahead of document and media support means the applications can be built on a
      supported surface rather than polling the store.
  resource_effect: >
    Adds three releases of engine work ahead of three releases of format work that keep their
    scope. Total planned work is unchanged in content and larger only by the three new entries;
    the deferred entries are not re-estimated.
versioning:
  previous_target: 0.9.0
  new_target: 0.9.0
  consequence: reorder
approval:
  source: user
  reference: >
    Product owner goal statement, session 2026-07-26: the twelve capabilities were enumerated as the
    definition of the harness, with the instruction to build until the full harness is complete and
    that application work (io-cli, io-studio) follows on the resulting SDK.
canonical_updates:
  - products/io-harness/roadmap.yaml
  - ../docs/CAPABILITIES.md
