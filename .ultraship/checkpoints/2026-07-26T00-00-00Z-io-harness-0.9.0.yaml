active_hypotheses:
  - >
    A skill body read must be gated on an ABSOLUTE path, because the skills directory is normally
    outside the workspace root. `gate()` currently sends Read/Write through
    `Workspace::check_path`, which returns Deny for anything resolving outside the root — so
    `read_skill` would be refused unconditionally if wired naively, and F10 would pass for the wrong
    reason. Planned fix: extend the `check` closure already added in `gate()` so an absolute target
    is decided by `ws.policy().check(...)` directly. Verified safe: `Workspace::resolve` rejects
    absolute paths outright (src/tools/workspace.rs:124) and both `read_file` and `write_file` go
    through it, so the gate is not the only containment guard and relaxing it for absolute paths
    cannot open a workspace escape. Confirm that with a test before relying on it.
  - >
    F11's negative control needs a task that fails for the intended reason. Unverified.
