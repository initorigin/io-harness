active_hypotheses:
  - >
    **The SBPL rule permitting the loopback proxy is not matching, and that is the one thing
    blocking the release's central claim.** Everything either side of it is proven: the proxy binds
    and decides (its own tests pass), the run starts one when the policy names hosts, the address
    reaches `RunSpec` and the macOS profile, and `run_capped` sets `HTTP_PROXY` for every backend.
    But `curl` exits 7 and **no `dial` row is written at all**, so the connection is being refused
    before it reaches the proxy — which points at the profile rather than at the proxy or the
    environment. Tried and failed: `(allow network-outbound (remote ip "localhost:PORT"))` and the
    same with `remote tcp`. Next: check whether the trailing `(allow file-write* …)` lines after the
    `net` block re-order precedence in a way that matters, try `(remote ip "127.0.0.1:PORT")` and
    `(remote ip "localhost:*")`, and read what `sandbox-exec` reports with the profile alone from a
    shell before driving it through a run — the failing test is parked with `#[ignore]` and reads
    `-- --ignored`.
  - >
    **The Linux half has not been exercised at all.** `landlock::plan` gains `net_ports` and its
    pure test passes, but no Linux host has run it. F8's decision table does not exist yet, and the
    rung preference — a per-host run must not be given a namespace rung that cannot reach the
    host's loopback — is specified and unimplemented. Expect this to be CI-discovered, as the
    contract's cost drivers say.
  - >
    **A handle live when the run ends writes no `destroy` row.** The registry kills it on drop and
    there is no step left to record on, which is the position `record_handle_ended` is already in.
    Stated in the code and owed a `known_limitations` line at completion.
