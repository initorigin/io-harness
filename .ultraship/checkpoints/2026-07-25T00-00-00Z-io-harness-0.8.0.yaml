active_hypotheses:
  - >
    F9's wording says a server whose binary does not start is "handled by the 0.2.0 retry/recovery
    path". The implementation instead fails the run with a typed `Error::Mcp` at session
    construction, because connecting happens before step 1 and because silently running without a
    tool the operator configured is the worse failure. In-call failures (timeout, dead transport, a
    tool reporting its own error) DO go to the model as observations. Either F9 should be read as
    "typed error, traced, no panic" — which the implementation meets — or connection needs to become
    lazy so a start failure lands inside a step. This is a plan question for the owner, not a coding
    decision to take quietly.
  - >
    F4's "unlisted host under default deny" is currently proven only for an explicitly denied host,
    because the only connection a run opens today is the provider's own, and the provider layer
    allows that by design (F8). The unlisted-host case needs the MCP HTTP transport to be reachable,
    so it moves to T08's test rather than being claimed early. The no-socket-opened assertion itself
    is already real: tests/net.rs counts accepts on a live TcpListener.
