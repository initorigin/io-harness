id: io-harness
name: IO Harness
classification: platform
vision: >
  An embeddable agent runtime for Rust. Any task, any provider, in your process — with a permission
  boundary, a sandbox, and a durable trace you own. What the agent is asked to do is the caller's
  business; what it is allowed to do, what it costs, and what it leaves behind are the harness's.
users:
  - The initorigin author building io-cli and io-studio on top of the crate
  - (later) external Rust developers embedding an agent in their own program
problems:
  - Existing harnesses are tied to one vendor, one app, or one language, and hide the loop,
    verification, budgets, and guardrails you need to trust an agent on long or sensitive work.
  - No single embeddable core gives you the orchestration loop, tools, verification, and
    provider-agnosticism together as a library.
  - >
    The comparable open harnesses each drop one of the properties that makes an agent trustworthy
    to run unattended. pi ships no permission system at all and tells you to use a container;
    opencode and Claude Code gate tools with glob config but keep no durable per-step checkpoint;
    none of them records a refusal against the rule and layer that produced it, and none carries a
    spend ceiling shared across a tree of agents.
  - >
    A harness whose entry point demands a checkable success criterion can only be pointed at
    bounded, checkable work. Most real work — diagnose this outage, get this deployment healthy,
    build this application — has no such criterion at the moment it is asked for.
outcomes:
  - One Rust crate that any initorigin app imports to run an agent that observes, reasons, acts,
    verifies, and stops — safely and observably.
  - >
    An operator can point the same harness at a Rust refactor, a production incident, or a
    greenfield application and get the same boundary, the same trace, and the same accounting from
    all three.
  - >
    A run's full cost is reconstructable afterwards from raw stored counts — per model, per call,
    including cache and non-token provider charges — without the crate having decided how to
    display any of it.
requirements:
  - Task contract — goal, constraints, expected output, success criteria
  - Context construction — feed the model only relevant, current, trusted info
  - Tool layer — narrow, typed actions the agent invokes
  - Orchestration loop — observe, reason, act, check, stop
  - State and memory — progress, intermediate results, decisions (rusqlite)
  - Verification layer — tests, schemas, read-backs confirm task done
  - >
    Verification is optional and language-agnostic. A criterion may run any caller-supplied command
    and assert its exit status, or a run may declare no criterion at all and stop when the agent is
    done. Requiring a criterion is what confined the harness to Rust-shaped tasks.
  - Permissions and guardrails — what the agent may access, change, send, spend
  - Recovery and retry — retries, fallbacks, replanning, escalation
  - Stop conditions and budgets — cap steps, time, cost, retries, risky actions
  - Observability and tracing — record prompts, decisions, tool calls, cost
  - Human approval layer — review before sensitive or irreversible actions
  - Providers — OpenRouter, Anthropic, and OpenAI, via own HTTP+SSE client, with fallback between them
  - Agent composition — spawn and nest many agents (100+) with shared context
  - Long-running autonomous tasks — 24h+ with no user input
  - Ephemeral local code-exec sandboxes — write, run, capture, destroy
  - Built-in tool suite — filesystem, git, grep, find
  - >
    Command execution — a fixed-argv `exec` tool authorized by the same `Act::Exec` check as every
    other tool. The model supplies arguments, never a subcommand, a flag, or a shell string, so the
    toolchain of any language is reachable and shell metacharacter injection has no surface.
  - >
    Partial-file edit — exact-match string replacement that fails on zero or multiple matches,
    beside the existing whole-file write.
  - >
    Project and toolchain detection as shipped data — a marker file maps to default build, test,
    lint, format, and run commands, overridable by the operator. This, plus command execution and a
    command-shaped verification criterion, is what "supports the major languages and frameworks"
    means for a harness; per-language Rust modules are explicitly not the mechanism.
  - Office and document tools — Word/Excel/PowerPoint/PDF create/edit/delete,
    PDF watermark, PDF form fill, barcode/QR read
  - Media — image passthrough when the model supports it
  - Extensibility — MCP (rmcp), plugins, skills
  - >
    Full run accounting — input, output, cache-read, cache-write, and reasoning tokens; the model
    that served each call; per-call API latency and time to first token; provider server-tool
    request counts; and lines added and removed per edit. Raw counts are stored and cost is derived
    on read against a pricing table held as data, so a price correction repairs the whole history
    and a stale price can never corrupt the trace.
  - >
    One configuration file, owned by this crate — layered from defaults through user, project, and
    local scopes, projected onto the existing typed API rather than parallel to it, and consumed by
    io-cli and io-studio instead of reimplemented in each.
  - >
    Session layer — a durable conversation tree above the run loop, with multi-turn input, mid-turn
    steering, and token-level streaming to an observer.
  - >
    Agency primitives — a todo tool, a tool that asks the operator a question about intent (distinct
    from the approval path, which asks about permission), named agent definitions, and slash-command
    prompt templates.
  - >
    Provider-executed web search and fetch — declared and configured by the harness across all three
    providers, with the policy's network allow-rules projected onto each provider's own domain
    filter.
constraints:
  - Rust crate; async on tokio; state in rusqlite; own HTTP+SSE provider client
  - Embeddable in-process library first; daemon/client mode added later
  - Apache 2.0
  - Runs locally on the developer's machine; no hosted service in scope
  - Exactly three providers — Anthropic, OpenAI, OpenRouter. No fourth without a fresh decision.
  - Credentials are API keys read from the environment. No OAuth, no subscription authentication.
  - >
    No system package on any CI runner. This has already removed OCR and PDF-viewer verification
    from scope and it continues to bind.
  - Stay 0.x. A breaking change is a minor bump; a 1.0.0 is not planned.
public_contract: >
  A versioned Rust crate API (SemVer), enumerated in docs/public-api.txt and stated in
  docs/CONTRACT.md. No network API; daemon/IPC contract deferred.
deployment_context: >
  Local, single-user, single-tenant. Operated by the developer embedding the crate. No server to run.
success_measures:
  - io-cli (or a test binary) drives io-harness through one real task that
    edits a file, and the verification layer confirms the file meets the spec.
  - >
    The same harness completes a task in a non-Rust project — running that project's own test
    command as the gate — with no Rust-specific code on the path.
  - >
    A finished run's cost is reconstructable per model from stored counts alone, including cache
    reads, cache writes, and any per-request provider charge.
  - >
    io-cli and io-studio read the same configuration file and neither contains a config parser.
non_goals:
  - io-cli, io-studio, io-eval apps themselves — separate products and repos
  - Hosted or cloud service, multi-tenant, or web API
  - Building or fine-tuning models
  - GUI (that is io-studio)
  - Daemon/client mode in the first release
  - Google Gemini and local or OpenAI-compatible providers
  - OAuth and subscription authentication
  - >
    A client-side web search or fetch implementation. All three configured providers execute both
    server-side; building our own would duplicate them and discard their citations.
  - >
    Per-language Rust modules. Language support is command execution plus a data-driven toolchain
    table plus a command-shaped verification criterion — not thirty parsers to maintain.
  - OCR, PowerPoint authoring, and video (cut 2026-07-27; do not re-propose without a fresh argument)
mvp_boundary: >
  A developer hands io-harness one task contract to modify a file to meet a
  stated spec; the harness runs the orchestration loop using the filesystem
  tool and the OpenRouter provider, the verification layer confirms the file
  meets the spec, and it stops — all in one process, no sandbox, no sub-agents.
assumptions:
  - First consumer is the author's own io-cli/io-studio, not external users.
  - >
    The boundary above describes the first release, which shipped as 0.1.0. It is kept as the record
    of where that release stopped, not as a statement about the current product.
  - OpenRouter was the first provider; Anthropic and OpenAI followed.
  - Each initorigin repo runs its own UltraShip workspace; io-eval, io-studio,
    io-cli, and website are planned separately in their own repos.
  - >
    The differentiator is the combination of a traced permission boundary, durable per-step resume,
    an execution sandbox, and a spend ceiling shared across an agent tree. A 2026-07-28 audit of
    opencode, pi, Claude Code, and Codex found no comparable harness carrying all four. This
    replaces the earlier assumption that provider-agnosticism plus composition plus skills was the
    differentiator — all three are table stakes in that field.
  - >
    Execution-based verification bounds what it proves. It shows the stated
    criterion was satisfied, not that the artifact is correct. RustTestPasses
    (and by inspection WorkspaceTestPasses) compiles the subject file and the
    caller's test source as one crate, so the subject can shadow macros the test
    relies on — a file defining `#[macro_export] macro_rules! assert` makes
    `assert!(false)` report ok under the harness's own `rustc --edition 2021
    --test`. `Verification::describe` also puts the test source verbatim in the
    agent's prompt, which is how an agent found this unprompted during io-cli
    0.1.0's live runs. Wrapping the subject in a module does not fix it;
    fully-qualified paths such as `::core::assert!` do resist it. Hardening is
    UNSCHEDULED — no version is assigned. See
    iterations/US-IO-HARNESS-0.8.0-I01, which the next plan should act on.
  - >
    A provider-executed web search or fetch is outside the permission boundary: the provider dials
    the URL, so `Act::Net` never sees it. Projecting the policy's allow-rules onto each provider's
    domain-filter parameter is a declaration enforced by the provider, not by this crate, and must
    be documented as such rather than presented as enforcement.
  - >
    Anthropic requires web-search result blocks to be echoed back byte-identical, including their
    `encrypted_content`. The 0.10.0 context assembler compacts and re-assembles observations every
    turn, which is exactly the modification that is rejected. Server-tool result blocks will have to
    be opaque, never-compacted ledger entries. Unverified against a live run.
