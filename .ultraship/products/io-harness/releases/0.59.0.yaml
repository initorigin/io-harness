  **Answered, 2026-08-15: no.** A process inside an AppContainer cannot reach a loopback listener
  under any capability set — none, `internetClient`, `privateNetworkClientServer`, both — and
  cannot reach the host's own network address either, while the same requests succeed immediately
  outside the container and an outbound request to a real host succeeds inside it with
  `internetClient`. So 0.48.0's per-host egress has no mechanism on this platform under access
  confinement: egress here is a capability, all or nothing, and the tables say so.
  `US-IO-HARNESS-0.59.0-I03`.
- >
  **Answered, 2026-08-15: they are not separable.** The capability array binds a process that is
  already inside a container, and being inside one is the whole grant-set problem. There is no
  egress-only landing, so the release has two steps where the plan had three and the fallback scope
  is the browser half alone. `US-IO-HARNESS-0.59.0-I03`.
