product: io-harness
version: 0.35.0
release_type: minor

outcome:
  user_can: >
    Point the harness at a directory and have everything in it — skills, prompt templates, an agent
    roster, MCP servers, lifecycle hooks and deny rules — arrive as one named bundle, with every
    piece of it traceable back to the bundle it came from.

    Six capabilities already have a discovery path each, and they share nothing. `with_skills` takes
    one directory. `Templates::discover` takes another. `[[agent]]`, `[[mcp]]` and `[[hook]]` are
    arrays in `io.toml`. Policy layers are a stack the application assembles. Distributing a
    coherent set of them — "the Rust review bundle": its skills, its reviewer agent, its MCP server,
    its deny rules — means an operator hand-copying six things into five places and keeping them in
    step by hand. Nothing packages them, and once they are in place nothing records that any of them
    came from somewhere other than the operator.

    0.35.0 makes a directory a capability bundle. A `plugin.toml` at its root declares what it
    contributes; a `[[plugin]]` entry in any configuration scope names it by path;
    `Config::plugins()` loads every declared one and hands back a `Plugins` that a `TaskContract`
    carries. One directory, one line of configuration, six kinds of contribution.

    Because a bundle is a *stranger's* directory, it arrives under the rule 0.28.0 wrote for
    `[[hook]]` — what a cloned repository can hand you is not what your own machine can. A plugin
    declared in the committed, cloned `io.toml` contributes skills, templates, agents and deny rules
    and may not contribute a hook or an MCP server, because both name a program to run on this
    machine; the same plugin declared in `io.local.toml` or the user file contributes all six.
    `${cmd:}` is refused inside a manifest in every scope. Plugin-supplied policy may only narrow: a
    layer of deny rules is a contribution, an `allow` rule or a `[policy.defaults]` block is a
    refusal to load.

    And every contribution carries its plugin. A skill, an agent, a policy layer and an MCP server
    id are all namespaced `<plugin>__<name>` as they are loaded, so the plugin's identity is already
    in the strings the trace has always recorded: a refusal names the plugin's layer, an MCP call
    names the plugin's server, a spawned child's tokens are billed under the plugin's agent. No new
    table, no new column, no second attribution mechanism to keep in step with the first.

    A plugin that fails to load — no manifest, unparseable TOML, an unknown key, a bad id, a
    duplicate id, a contribution its declaring scope may not make — is dropped, recorded on
    `Plugins::dropped()` with the reason, reported as `EventKind::PluginDropped`, and the run
    proceeds with every plugin that did load. There is no error path out of loading at all.

  business_value: >
    The gap this closes is distribution, and it is the one gap that makes every other capability
    harder to use than it should be.

    Every capability the crate has added since 0.14.0 is configured one at a time by the operator who
    wants it. That is right for the first user of a feature and wrong for the tenth: a team that has
    worked out which skills, which reviewer agent, which MCP server and which deny rules make their
    Rust reviews good has no way to hand that to the next team but a README with six manual steps.
    The cost is not the copying, it is the drift — five of the six steps get done, and the sixth is
    discovered three weeks later as a run that could write somewhere it should not.

    Attribution is the half that matters once bundles exist at all. The moment a run's capabilities
    come from more than one author, "which of these introduced the thing that just refused / just
    spent / just called out to a server" becomes the first question asked and today has no answer:
    a layer is named whatever its author typed, an MCP server id is whatever the file said. Making
    the plugin part of the name means the answer is already in every row the crate has been writing
    since 0.4.0, rather than being a feature that has to be queried for.

    And dropping rather than failing is what makes a bundle safe to try. A run that dies because one
    of four plugins has a typo is a run whose operator uninstalls all four. The failure mode of a
    packaging format is that it makes the thing it packages *less* reliable than doing it by hand;
    the only defence is that a broken bundle costs exactly itself.

  evidence_of_value: >
    Executed, in the technique the last five releases used: a pair that must differ, a negative
    control that must not, and one sabotage per arm of every two-armed claim.

    Contributions reaching a run are proven by presence *and* absence over the same tree — the same
    workspace run with the `[[plugin]]` line and without it, asserting the skill catalogue, the
    agent roster, the MCP server list and the policy layer stack, so a test that would pass on a
    loader that discovered nothing fails.

    The trust rule is proven in both directions rather than one: the identical plugin directory
    declared from `io.toml` is dropped naming the key, and declared from `io.local.toml` loads and
    its hook runs. The discriminating assertion on the refused arm is that the plugin contributes
    **nothing at all** — not that the hook is absent — because a loader that dropped the hook and
    kept the skills would satisfy the weaker claim while leaving a stranger's file half-applied.

    Narrowing-only policy is proven by effect, not by error text: a manifest whose layer carries
    `allow_write` is dropped, and the write that rule would have permitted is still refused. A
    loader that reported the error after merging the layer fails that assertion and passes every
    other one.

    Attribution is proven against the rows the crate already writes: the `PolicyEvent` for a refusal
    decided by a plugin layer must read `<plugin>__<layer>` in its `layer` column, and the `McpEvent`
    for a call into a plugin server must read `<plugin>__<server>` in its `server` column. Asserting
    the string, not merely that a refusal or a call happened, is what makes the test discriminating —
    every deny rule refuses.

    Isolation is proven with a majority of broken plugins: four declared, three of them broken in
    four different ways, one valid. The run completes, `dropped()` names three with distinct reasons,
    three `PluginDropped` events reach the observer, and the valid one's contributions are all
    present. The control is the same four with every manifest fixed, under which `dropped()` is
    empty — a loader that dropped everything would otherwise pass the first half.

scope:
  included:
  - >
    `plugin.toml` — the manifest. `name` (the plugin's id, required), optional `description` and
    `version` which are documentation and nothing else, and the contributions: `skills` and
    `templates` naming directories relative to the plugin root, `[[agent]]`, `[[mcp]]`, `[[hook]]`
    and `[policy]` reusing the **same serde types** `io.toml` already deserializes, so a manifest is
    the configuration file's vocabulary rather than a second one. `deny_unknown_fields` throughout,
    for the reason `io.toml` has it: a section that silently does nothing is a setting an operator
    believes in.
  - >
    `[[plugin]] path = "..."` in any configuration scope, and `plugin` added to `APPENDING` so a
    project's bundles and an individual's own are both loaded rather than the narrower scope
    silently deleting the wider one — the rule `policy.layers` and `[[agent]]` already follow. The
    declaring **scope** is captured per entry as the scopes are read, because the merge that
    concatenates the arrays cannot say afterwards which file contributed which element, and the
    trust rule needs exactly that.
  - >
    `plugin::Plugins` — `Config::plugins()` returns it and it is **infallible**. Every failure is a
    `plugin::Dropped { id, path, error }` on `Plugins::dropped()`, so "a plugin that fails to load is
    dropped and reported, never fatal" is a property of the type rather than a discipline the caller
    has to keep. Plus `Plugins::get`/`iter`/`len`/`is_empty`/`names`, and `plugin::Plugin` carrying
    its id, its root and what it contributed.
  - >
    `Plugins::apply_to(TaskContract) -> TaskContract` — the one call that merges every contribution
    into a contract, in the shape `Config::apply_to` already has, and `Plugins::templates()` for the
    half that is rendered before a run exists and never reaches a contract at all.
  - >
    **The one break: `TaskContract` gains `#[non_exhaustive]` and a `plugins` field**, with
    `with_plugins`. The field is unavoidable — `skills` is a single `Option<PathBuf>` and a run whose
    skills come from a contract directory *and* three bundles needs more than one path — and
    `#[non_exhaustive]` is added in the same release for the 0.34.0 reason: both are the same break
    for an external struct literal, and paying it once now makes every later contract field free.
  - >
    Namespacing as attribution. As each contribution is loaded its name becomes `<plugin>__<name>`:
    skills, agents, policy layers and MCP server ids. `mcp__<plugin>__<server>__<tool>` still parses,
    because `bare_name` strips a *known* server id rather than splitting on `__`. A plugin id is
    validated `[a-z0-9][a-z0-9-]{0,31}` — lower-case, no `__`, bounded — which makes a collision
    between two bundles structurally impossible and keeps the namespaced tool name inside the 64
    characters a vendor allows.
  - >
    The trust rule, extended rather than re-invented. A plugin declared in the **project** scope
    contributes no `[[hook]]` and no `[[mcp]]`: both name a program this machine will run, and
    `io.toml` is the file a `git clone` delivers. Declared in `io.local.toml` or the user file it
    contributes both. `${cmd:}` is refused inside a manifest in **every** scope, because a manifest
    is a third party's file wherever it was named from.
  - >
    Narrowing-only plugin policy. A `[policy]` block in a manifest may carry layers of **deny** rules
    and nothing else: an `allow_*` rule or a `[policy.defaults]` block drops the plugin naming the
    offending key. A bundle may take capability away and may never hand it out.
  - >
    `EventKind::PluginLoaded { plugin, contributions }` and `EventKind::PluginDropped { plugin, why }`
    — free, `EventKind` has been `#[non_exhaustive]` since 0.24.0 — with their `EVENT_NAMES` entries
    and their round trip through `every_kind()` and the source-reading census 0.28.0 made a test.
  - >
    Documentation as part of the release: a `docs/guide/plugins.md` page and its `docs/CAPABILITIES.md`
    entry, the honest limits below in `docs/CONTRACT.md`, `README.md`, `CHANGELOG.md` with the
    `*Migration:*` note the one break owes, `docs/public-api.txt` edited by hand, and a worked example
    on every added public item.
  excluded:
  - >
    Fetching, installing, updating or resolving a plugin from anywhere. A `[[plugin]]` names a
    directory that already exists on this machine. Marketplace and install UX is app-level by a
    standing product constraint, and a crate that downloads a bundle is the crate-side HTTP fetch
    this product removed from the roadmap in 0.30.0 wearing a new name.
  - >
    Signing, checksums or any verification that a directory is the one its author published. Nothing
    here makes a plugin trustworthy; the trust rule bounds what an *untrusted* one may contribute,
    which is a different and achievable claim. Stated plainly rather than implied.
  - >
    Plugin-supplied Rust code, tools or providers — no dynamic loading, ever. A `Tool` is an
    in-process trait implementation the application registers, and `dlopen` would make every safety
    property of this crate a function of a directory. A plugin contributes data.
  - >
    A `plugins` table in the store. Attribution is carried by the namespaced names in the rows the
    crate already writes, so a second record of the same fact would be a migration, a cross-version
    guard and a synchronisation problem bought for nothing. `CHECKPOINT_FORMAT` does not move and no
    schema changes.
  - >
    Inter-plugin dependencies, load ordering, version constraints between bundles, or a plugin
    requiring a minimum crate version. `version` in a manifest is documentation. A resolver is a
    release of its own and nobody has asked for one.
  - >
    Enabling or disabling a loaded plugin at run time, and per-run selection of a subset. The
    configuration scopes already decide what is loaded, and a second override would give the same
    question two answers.
  - >
    Relaxing the standing `[[mcp]]` gap in `io.toml` itself. A project-scoped `io.toml` may still
    name an MCP command directly, exactly as it could in 0.34.0; that is documented and untouched.
    New surface starts closed, existing surface is not narrowed under a release nobody asked to
    break.
  fallback_scope:
  - >
    The manifest, `[[plugin]]`, `Plugins` with drop-not-fatal loading, namespaced attribution, and
    the four contributions that name no program to run: **skills, templates, agents and deny-only
    policy**. That is still the roadmap's own headline — a directory is a capability bundle, every
    contribution carries its plugin, a broken bundle is dropped — and it drops `[[hook]]` and
    `[[mcp]]` contribution, which is the half whose whole design cost is the trust rule.

acceptance:
  functional:
  - >
    **F1 — a bundle's contributions reach a run, and their absence is asserted too.** One plugin
    directory contributing a skill, a template, an agent, an MCP server and a deny layer, declared
    from `io.local.toml`. The run's discovered skill catalogue, the contract's agent roster, its MCP
    server list and its policy layer stack each contain the contribution under its namespaced name.
    The control is the identical tree with the `[[plugin]]` entry removed: all five are absent, and
    every other assertion in the test is unchanged. A loader that discovered nothing passes the
    second half only.
  - >
    **F2 — a refusal names the plugin that introduced the rule.** A plugin layer denying
    `secrets/**`; the run attempts the write. The discriminating assertion is the stored
    `PolicyEvent.layer` for that refusal, which must equal `<plugin>__<layer>` — not that a refusal
    occurred, because every deny rule refuses. The control is the same layer declared by the
    application instead of the plugin, whose event carries the bare layer name, proving the prefix
    is written by the loader and not by the policy.
  - >
    **F3 — an MCP call and a spawned child are attributed the same way.** A plugin-contributed MCP
    server is called: the stored `McpEvent.server` reads `<plugin>__<server>` and the tool the model
    was offered is `mcp__<plugin>__<server>__<tool>`, and `bare_name` round-trips it back to the
    server-side name — a namespacing scheme that broke the existing strip would fail here rather
    than in production. A plugin-contributed agent is spawned: its run row and its ledger entry name
    `<plugin>__<agent>`, so the tokens it spent are attributable to the bundle.
  - >
    **F4 — the trust rule, both arms, whole-plugin.** The same plugin directory, whose manifest
    declares a `[[hook]]`, is declared once from `io.toml` and once from `io.local.toml`. From
    `io.toml` it is dropped, `Dropped::error` names the `hook` key and the scope, and the
    discriminating assertion is that **none** of its other contributions is present — no skill, no
    agent, no layer — because a half-applied stranger's manifest is the failure this rule exists to
    prevent. From `io.local.toml` it loads and the hook fires on a real event. The same pair is run
    for `[[mcp]]`. Trap 51 applies: one sabotage per arm.
  - >
    **F5 — plugin policy may only narrow, asserted by effect.** A manifest whose layer carries an
    `allow_write` for a path the application's policy denies. The plugin is dropped naming the rule,
    **and the write is still refused** — the assertion is the run's outcome and the stored refusal,
    not the error text. A loader that validated after merging the layer fails this and passes an
    error-text assertion. The same pair for a manifest carrying `[policy.defaults]`.
  - >
    **F6 — a broken bundle costs exactly itself.** Four plugins declared: one valid, one with no
    `plugin.toml`, one whose TOML does not parse, one whose manifest carries an unknown key. The run
    reaches its normal outcome, `Plugins::dropped()` has exactly three entries whose errors name
    three different causes, exactly three `EventKind::PluginDropped` events reach the observer, and
    every contribution of the valid one is present. The control is the same four directories with
    every manifest repaired: `dropped()` is empty and four `PluginLoaded` events fire. A duplicate
    id and a malformed id (`Rust_Review`, `a__b`, 33 characters) are asserted the same way, each
    dropping only its own plugin.
  - >
    **F7 — namespacing makes collision impossible rather than unlikely.** Two plugins each
    contributing a skill named `review`, plus a contract-level skills directory that also holds
    `review`. All three are offered, under `a__review`, `b__review` and `review`;
    `Skills::discover`'s duplicate-name refusal does not fire; and the catalogue the model is handed
    contains all three names. The negative control is the same tree with namespacing removed, under
    which the run fails on the duplicate — the failure proving the property is load-bearing.
  - >
    **F8 — `${cmd:}` is refused in a manifest from every scope.** A manifest carrying `${cmd:...}`
    in any value is dropped whether it was declared from the user file, `io.local.toml` or
    `io.toml`, with the error naming the substitution. Asserted for all three scopes, because the
    rule that makes this different from `io.toml`'s own `${cmd:}` rule is precisely that it does not
    depend on the scope.
  - >
    **F9 — cross-version compatibility, both directions, with nothing to migrate.** No table, column
    or index is added, so `tests/cross_version.rs`'s `ADDED_SINCE_0_22_0` list is **unchanged** —
    asserted rather than assumed, since a release that quietly added a table and forgot the list is
    exactly what that guard exists to catch. A database written by the pinned 0.29.0 generator opens,
    resumes and replays under 0.35.0; a 0.35.0 store is read by that binary. `CHECKPOINT_FORMAT`
    stays 7.
  non_functional:
  - >
    **N1 — no new dependency.** `cargo tree` on macOS and Linux still reads 402 lines. A manifest is
    parsed by the `toml` and `serde` already present, into the `AgentDef`, `McpServer`, `Hook` and
    `Layer` types already deserialized from `io.toml`.
  - >
    **N2 — the break is exactly one, and it is stated as loudly as it is small.** `TaskContract`
    gains `#[non_exhaustive]` and one field. An external struct literal or exhaustive destructuring
    stops compiling; every `TaskContract::new`, `TaskContract::workspace` and `with_*` call site is
    untouched, which is how every documented caller builds one. `CompletionRequest` and
    `CompletionResponse` are not touched, so no `E0639` is owed. `tests/changelog.rs` finds the
    `*Migration:*` note under a `**BREAKING` entry and `tests/public_api.rs` passes against a
    hand-edited `docs/public-api.txt`.
  - >
    **N3 — plugin loading is bounded by what was declared and the run loop never touches it.**
    Discovery is one manifest read plus one directory listing per skills or templates directory, per
    declared plugin, performed once by the caller before the run starts — the same shape
    `Config::discover` and `Skills::discover` already have. The assertion is a source-reading test in
    the shape 0.33.0 used for its ownership boundary: no function reachable from the per-step loop in
    `src/run.rs` calls into `plugin::`, with a splice-in control that makes the test fail when such a
    call is added. A configuration declaring no plugin performs no plugin I/O at all, asserted by a
    plugins directory that does not exist and a run that neither fails nor drops anything.
  - >
    **N4 — every added public item carries a worked example**, enforced by the existing
    `every_public_item_has_a_worked_example` surface test: `Plugins`, `Plugin`, `Dropped`,
    `Config::plugins`, `Plugins::apply_to`, `Plugins::templates`, `Plugins::dropped`,
    `TaskContract::with_plugins` and the manifest's own module documentation.
  - >
    **N5 — the honest limits are where a reader finds them.** `docs/CONTRACT.md` states: a plugin is
    a directory the operator chose to point at and the crate verifies nothing about its origin; a
    hook or MCP server contributed from a trusted scope runs a program with this process's
    privileges and is not sandboxed by the fact that a plugin declared it; namespacing changes the
    names a model sees, so a prompt naming a skill by its bare name after it moves into a bundle
    stops matching; and the standing `[[mcp]]` gap in `io.toml` itself is unchanged.
  - >
    **N6 — `[[hook]]`'s existing project-scope refusal is untouched.** The 0.28.0 rule that a
    project-scoped `io.toml` may declare no `[[hook]]` at all, inside a `[profile]` too, still holds
    with the same error, asserted by the pre-existing tests passing unchanged. This release adds a
    rule beside it and weakens nothing.
  operational:
  - >
    **O1 — the three-OS matrix is green** on the commit being released, including the MSRV 1.95 job,
    with no test skipped silently on Windows. A manifest path is joined from components rather than
    from a slash-bearing literal, and any source-reading test normalises line endings.
  - >
    **O2 — docs.rs builds**, proven by running the nightly job's exact command
    (`RUSTDOCFLAGS="--cfg docsrs -D warnings" cargo +nightly doc --all-features --no-deps`) before
    the release PR is opened, never inferred from a stable `cargo doc`. It has caught something in
    three consecutive releases.
  - >
    **O3 — `cargo package --locked` succeeds** and the packaged crate compiles, run after a
    `cargo clean`, because `target/` and this volume have collided in every release since 0.25.0.
    Every local build and test runs with `CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0`.

delivery:
  target_mode: published
  environment: >
    crates.io as `io-harness` 0.35.0, GitHub at initorigin/io-harness with the tag `v0.35.0` and a
    Release titled `io-harness 0.35.0`, and docs.rs.
  deployment_method: >
    The standing flow. All work on `feat/0.35.0` off `develop`, committed incrementally as it lands,
    including the sealed UltraShip release record and the hand-appended lock pin. PR into `develop`,
    merged with the PR button. Release PR `develop` into `main`, merged the same way. The GitHub
    Release is cut by `release.yml` — `gh workflow run release.yml --ref main -f version=0.35.0` —
    which takes its notes verbatim from the changelog. `cargo publish --locked` by hand afterwards,
    always last, after both merges and the Release exist. `develop` synced to `main` fast-forward
    only at the end. No branch is deleted.
  migrations:
  - >
    **No store change at all.** No table, no column, no index; `CHECKPOINT_FORMAT` stays 7 and
    `ADDED_SINCE_0_22_0` is unchanged. Attribution rides the names already written into
    `policy_events`, `mcp_events`, the run rows and the ledger.
  - >
    One public break: `TaskContract` becomes `#[non_exhaustive]` and gains `plugins`. No item is
    removed, no signature changes, and a caller that builds contracts through `new`/`workspace` and
    the `with_*` builders — which is every documented caller — recompiles untouched.
  - >
    A configuration that declares no `[[plugin]]` behaves exactly as it did in 0.34.0, byte for byte
    in the prompt: no namespacing is applied to anything the application registered itself.
  observability:
  - >
    `EventKind::PluginLoaded { plugin, contributions }` and `EventKind::PluginDropped { plugin, why }`
    reach every `Observer`, and therefore every attached process through 0.33.0's `Broadcast`, with
    no change to `attach`.
  - >
    `Plugins::dropped()` is the durable-enough half for a caller that wants to fail loudly on its
    own terms: the crate never fails for it, and an application that wants a broken bundle to be
    fatal writes one `if`.
  - >
    Attribution is in the existing trace: `PolicyEvent.layer`, `McpEvent.server`, the namespaced
    tool name, and the agent name on a spawned run's rows and ledger entries.
  rollback: >
    A published version cannot be recalled; the forward fix is 0.35.1 and `cargo yank --version
    0.35.0` is the escape hatch, leaving 0.34.0 as what `cargo install` resolves. A consumer
    reverting to 0.34.0 keeps every database — nothing about the schema changed — and loses plugin
    loading; their `[[plugin]]` entries become an unknown key, which `deny_unknown_fields` reports
    by name rather than ignoring. The one break reverses by deleting a field initialiser. No stored
    format has to be rewritten to go back.

dependencies:
  products: []
  services:
  - >
    None at runtime. A plugin is a directory on the machine the run is on. crates.io and GitHub
    Actions for the release itself, as every version.
  human_approvals:
  - >
    The owner has pre-authorised the PR, both merges, the Release and the publish for this version.
    Nothing here needs a second decision.

resource_profile:
  complexity: medium
  uncertainty: medium
  likely_cost_drivers:
  - >
    Namespacing touches five call sites in four modules — skills, agents, policy layers, MCP server
    ids — and each has an existing test suite that must keep passing unchanged for a run that
    declares no plugin. The MCP one is the delicate one: `bare_name` strips a known server id rather
    than splitting, which is why the scheme works, and a test must prove that rather than assume it.
  - >
    Per-entry declaring scope is not available after the merge. `Config::discover` has to record it
    as each scope is read, which is the same place 0.30.0's `record_origins` had to run and for the
    same reason.
  - >
    Four negative controls designed before the code, not after: the no-`[[plugin]]` arm of F1, the
    application-declared layer of F2, the repaired-manifest arm of F6, and the namespacing-removed
    arm of F7.
  - >
    `src/contract.rs`, `src/config.rs`, `src/run.rs`, `src/policy.rs`, `src/mcp.rs`, `src/skills.rs`
    and `src/agent.rs` are all edited, plus a new `src/plugin.rs`. `src/run.rs` is over 9,500 lines
    and `src/config.rs` over 1,800.
  preferred_tools:
  - >
    `tempfile` directories built by a helper that writes a whole plugin tree in one call, so the
    seven functional criteria do not each hand-assemble one. The existing scripted provider and
    stub MCP server from the test modules. `CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0` on
    every local build — 19 GiB to 159 MiB — and `df -h .` before and between build steps; the volume
    has 20 GiB free at the start of this release.
  constraints:
  - >
    No new runtime dependency; MSRV 1.95; edition 2021; every version stays 0.x and a break is a
    minor bump.
  - >
    A project-scoped file may narrow and may never widen. This release extends that rule to a new
    surface and weakens no part of it: `[[hook]]` stays refused whole in a project-scoped `io.toml`,
    `${cmd:}` stays refused there, and the four widening keys are untouched.
  - >
    Installing, fetching or verifying a bundle is app-level and stays out, as does anything that
    would make a directory able to contribute executable Rust.

risks:
- >
  **A half-applied stranger's manifest.** The natural implementation validates each contribution as
  it merges, which leaves a refused plugin's skills and agents already installed when the hook is
  rejected. Mitigated structurally — every check runs before any contribution is merged — and by
  F4's assertion that a dropped plugin contributes *nothing*, which is what fails if merging happens
  first.
- >
  **Attribution that is written by the test rather than by the loader.** A namespacing test that
  builds the expected string the same way the code does is a tautology. Mitigated by F2's control:
  the same layer declared by the application carries the bare name, so the prefix is observed to
  come from the loader.
- >
  **Namespacing breaking MCP tool naming on the wire.** `mcp__<plugin>__<server>__<tool>` is longer
  and holds more separators than anything the crate has emitted. Mitigated by the bounded id
  (`[a-z0-9][a-z0-9-]{0,31}`), by `bare_name` stripping a known id rather than splitting on `__`,
  and by F3 asserting the round trip rather than the format string.
- >
  **A drop that hides a real misconfiguration.** "Never fatal" is exactly how an operator ends up
  running for a week without the deny rules they believe are loaded. Mitigated by reporting on two
  channels — `Plugins::dropped()` and `EventKind::PluginDropped` — by putting the reason in both,
  and by documenting that an application wanting a broken bundle to be fatal writes one `if`.
- >
  **A plugin skill that shadows the operator's own.** Mitigated by namespacing every contributed
  name, so a bundle cannot occupy a name the operator already uses; F7 asserts the three-way case
  and its control shows the run failing without the property.
- >
  **Disk, again.** `target/` has taken this volume to zero in three separate releases and
  rust-analyzer rebuilds into the same tree. Mitigated operationally: debuginfo off by default
  locally, `df -h .` before and between build steps, separate `cargo test` invocations, and
  `cargo clean` between the full suite and packaging.

known_limitations:
- >
  Nothing here verifies that a plugin directory is what its author published. There is no signature,
  no checksum and no provenance. The trust rule bounds what an untrusted bundle may *contribute*,
  which is a different claim and the only one the crate can honestly make.
- >
  A hook or MCP server contributed by a plugin declared in a trusted scope runs a program with this
  process's privileges. Being introduced by a plugin neither sandboxes it nor changes the policy
  that governs it.
- >
  Namespacing changes the names a model sees. A prompt or a skill that referred to another skill by
  its bare name stops matching once that skill moves into a bundle. The crate cannot rewrite prose,
  so this is documented rather than handled.
- >
  The standing `[[mcp]]` gap is untouched: a project-scoped `io.toml` may still name an MCP command
  directly, and an unknown key inside an `[[mcp]]` table is still accepted because serde refuses
  `flatten` beside `deny_unknown_fields`. A plugin's `[[mcp]]` is refused at project scope, so the
  new surface is stricter than the old one — deliberately, and stated rather than smoothed over.
- >
  `version` in a manifest is documentation. Nothing resolves it, checks it against the crate, or
  compares two bundles that contribute the same thing.
- >
  **Inherited and unresolved: 0.30.0's N2 wording.** "The aggregates do not scale with the trace"
  over-claims — counting every row is the answer. Raised rather than read as satisfied, and
  untouched by this release.

open_questions:
- >
  Whether a plugin should be able to contribute a `[[provider]]`. It is data like everything else
  here, and it is also the one contribution that decides where a run's text is sent and whose key
  pays for it — which reads like a widening even from a trusted scope. Left out until someone asks,
  and the answer is likely a scope rule rather than a refusal.
- >
  Whether `Plugins::dropped()` being non-empty should have a first-class way to be fatal — a
  `require_all` on the contract rather than the caller's own `if`. One `if` is honest today; a flag
  becomes right the moment a bundle carries deny rules a run depends on.
- >
  Whether the namespace separator should eventually be configurable or shortened. `__` is chosen
  because MCP already uses it and it is safe in a vendor's tool-name grammar; it is also four
  characters of every name a model reads. Worth measuring before changing.

status: planned
