mode: published
delivered: 'A long unattended run now survives the failures that used to end it, and the caller learns
  which one happened. The audit for this release found three failures worse than the roadmap assumed and
  all three are closed: `net::http_client()` had no request timeout at all, so a server that accepted
  a connection and then stopped writing hung a run forever — producing no step, so 0.7.0''s checkpointing
  never fired, the time budget (checked only at the top of a step) was never reached, and the 0.5.0 ledger
  saw no draw; both stream parsers skipped un-parseable lines, so a wholly malformed response returned
  `Ok(CompletionResponse::default())` and the loops read it as "the model chose not to call a tool"; and
  `"escalated"` was absent from `terminal_outcome` while `finish_run` filed it as a plain completion,
  so a run that escalated at 3am was silently re-run by whatever resumed it.

  The two the roadmap named are closed too. `Error::Provider(String)` becomes a structured variant carrying
  a `ProviderErrorKind`, the HTTP status and the server''s `Retry-After`, so a 429 and a 401 are no longer
  the same value retried with equal eagerness; retries now wait, doubling to a ceiling, honouring `Retry-After`
  above it, and refusing to sleep past the run''s own time budget. `Fallback` is itself a `Provider`,
  so it needs no new entry point and nests for three, and it falls through only on a failure another provider
  might not have.

  An agent that stops getting anywhere is stopped for it. A stall needs both halves — nothing changed
  in the workspace, and a tool call this window already saw — resting on a new `Wrote` signal, since `write_file`
  never read the old content and a byte-identical rewrite was indistinguishable from an edit. A live run
  proved it: 20-step cap, told once at step 4, stopped at step 11.

  Recovery and retry is the eleventh of the twelve pillars. Only observability and evaluation remains.

  '
