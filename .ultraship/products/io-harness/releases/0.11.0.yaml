known_limitations:
- 'The record is sealed before the crates.io upload, which follows the two merges and the GitHub Release.
  `mode: published` states the authorized target.

  '
- 'Stall detection is a heuristic over two signals, not a proof. It reads whether a write changed the
  file''s bytes and whether a tool call repeated. An agent making real progress the harness cannot see
  — reasoning, or work inside a registered tool whose effects are outside the workspace — could in principle
  be flagged, which is why the window is configurable and can be set to 0.

  '
- 'The stall signature is the joined tool-call text, so two calls that differ only in an irrelevant argument
  read as different work and reset nothing. An agent that varies a padding argument while achieving nothing
  would not be caught.

  '
- '`with_stall_policy` is inert for a single-file run, which has one tool and one file. Documented on
  the builder rather than silently accepted.

  '
- 'The request deadline is 600s by default. Long enough that no realistic single completion reaches it
  — a full 8192-token stream at a sluggish 15 tokens/second is about nine minutes — but a caller running
  a slower model or a much longer output should raise it. A hung socket is caught by any finite deadline,
  so the default is deliberately generous rather than tight.

  '
- 'Backoff is deterministic, with no jitter. Many clients retrying in lockstep after a shared outage would
  synchronise; jitter needs a randomness dependency this release does not take, and would make the wait
  assertions untestable without loosening them until they assert nothing.

  '
- 'Falling over swaps the model mid-run and the harness cannot see whether the replacement is as capable,
  as well tuned, or even the same size. The provider that answered is recorded per step so an operator
  can tell, but nothing verifies equivalence, and a run that fell over may behave differently from one
  that did not.

  '
- 'Nothing tracks a provider''s health across runs. A provider that failed every call last run starts
  the next one trusted; a circuit breaker needs a store surface and an expiry policy and is a different
  feature from surviving the failure in front of you.

  '
- 'Honouring `Retry-After` is not rate-limit management. There is no token bucket and no quota model,
  so a run that is being throttled will keep asking and keep waiting.

  '
- '`Retry-After` handles delta-seconds and IMF-fixdate only. RFC 850 and asctime dates degrade to "no
  hint" rather than to a wrong wait, marked `ponytail:` with the upgrade path named.

  '
- 'The malformed kind fires only when NOTHING in a stream parsed. A provider that emits a valid but truncated
  response — half the tool call, then a clean end — is still `Ok`, and looks to the loop like a model
  that changed its mind.

  '
- 'Windows containment is still the portable floor with a wall-clock cap only, and `Backend::WindowsJobObject`
  remains a public variant nothing constructs on the enforcement path. Unchanged since 0.9.1; it needs
  a `windows-sys` binding and its own release.

  '
- 'Every Windows claim in this record rests on CI run 30202128038. Nobody on this project has a Windows
  machine, and this release is the second time in three releases that CI found a real Windows-specific
  behaviour nothing local could see.

  '
