product: io-harness
version: 0.22.0
status: released
release_type: minor
outcome:
  user_can: >
    Give an agent access to current information without writing a scraper. One `WebAccess`
    declaration on the task contract — or a `[web]` table in `io.toml` — turns on provider-executed
    web search and web fetch, and the harness translates it into whichever of the three providers is
    running: Anthropic's `web_search`/`web_fetch` server tools, OpenAI's `web_search_options`, or
    OpenRouter's `web` plugin. The provider runs the search, so the answer comes back with the
    provider's own citations, which the harness records in the store alongside the run that earned
    them. The same declaration carries the boundary: the policy's network allow- and deny-rules are
    projected onto each vendor's own domain filter, so an operator states a domain boundary once and
    it governs both the sockets this crate opens and the ones the provider opens on its behalf.
  business_value: >
    Every release so far has made the agent better at the repository in front of it and left it
    unable to look anything up. A model whose training ended months ago writing against a library
    that moved on is the single most common way a run produces confident, wrong work — and the crate
    has no answer for it today beyond a human pasting documentation into the goal string.

    The obvious answer is a fetch tool: an HTTP client, an HTML-to-text converter, a robots policy, a
    redirect policy, a content-size policy, and a scraper that starts rotting the day it ships. All
    three providers already execute search and fetch server-side, bill it per request, and return
    their own citations. Declaring theirs costs a body key per vendor and a parser per response
    shape; writing ours costs a subsystem and at least two new dependencies in a crate whose default
    `cargo tree` is a number this project tracks release over release.

    It also closes the accounting loop 0.18.0 opened deliberately. `Usage::server_tool_requests` has
    been parsed, stored, and priced since then, and has read zero on every run ever made, because
    nothing declared a tool the provider executes. This is the release that makes the meter move —
    and the meter existing first is why the money is visible from the first request rather than after
    a surprise invoice.

    io-cli and io-studio both need "look it up" to be a switch rather than a tool the embedder writes.
    If the harness does not own the projection, each writes its own per-vendor body keys over the same
    three providers and they diverge — the same failure 0.19.0 exists to have prevented for
    configuration and 0.21.0 for agent definitions.
  evidence_of_value: >
    A live run against a real provider answers a question whose answer is newer than any model's
    training cut-off, and the citations behind that answer are read back from SQLite after the
    process that made the run is gone, beside the `server_tool_calls` row for the search that found
    them. Where the vendor reports a per-request counter — Anthropic does; the OpenAI wire does not
    — the same run's `provider_calls` row carries the first non-zero `server_tool_requests` in the
    crate's history, and the per-request charge `pricing.rs` has been able to compute since 0.18.0
    finally has an input. A declaration a vendor cannot carry is refused by name before a request is
    sent, rather than trimmed to fit. And a search that fails inside an HTTP 200 — the shape all
    three vendors use — appears in the trace as a failure rather than as a search that found nothing.
scope:
  included:
  - >
    `WebAccess`, one vendor-neutral declaration in a new `src/web.rs`:
    `WebAccess { search: bool, fetch: bool, max_uses: Option<u32>, allowed_domains: Vec<String>,
    blocked_domains: Vec<String> }`, with `WebAccess::search()` and `WebAccess::fetch()` constructors
    and builder methods that read like the rest of the crate. It describes what the model may reach,
    never how a vendor spells it. `Default` is everything off, so the type existing changes no run.
  - >
    `CompletionRequest` gains `web: Option<WebAccess>`, `TaskContract::with_web` carries it into a
    run, and `[web]` in `io.toml` projects onto it through the existing config layering — defaults,
    user, project, local — so a project can turn search on for its collaborators and an individual
    can turn it off locally without editing a shared file. `None` is what every caller before 0.22.0
    meant, and a run that sets nothing sends a body byte-identical to the one 0.21.0 sent.
  - >
    Three translations, one per provider, each written against that vendor's own documented shape and
    each pinned by a body test rather than by a live call. Anthropic: a `web_search_20250305` and/or
    `web_fetch_20250910` entry in `tools`, carrying `max_uses`, `allowed_domains` and
    `blocked_domains`, with the `web-fetch-2025-09-10` beta header sent only when fetch is asked for.
    OpenAI: `web_search_options` on the Chat Completions body with the domain filter in the shape that
    API takes. OpenRouter: a `plugins` entry with the `web` id and its `max_results`. The two
    OpenAI-wire providers share `openai_wire::body` today and their web keys differ, so the shared
    builder keeps building the shared body and each provider adds its own key — which is the existing
    split between `openai_wire` and the two thin providers, not a new one.
  - >
    Citations, because an answer with no source is the thing this release exists to avoid. A new
    `Citation { url, title: Option<String>, cited_text: Option<String> }`, a
    `CompletionResponse::citations: Vec<Citation>` filled from each vendor's own shape — Anthropic's
    `citations` on a text block, the OpenAI wire's `annotations` with `url_citation`, and
    OpenRouter's annotations, which are the same shape — and a new `citations` table keyed by run and
    step so a UI or an operator reconstructs "where did that come from" from SQLite alone.
  - >
    A stated vendor capability matrix, enforced by refusal. Anthropic carries search, fetch, a cap
    and a domain filter; OpenAI's Chat Completions carries search with an allow-list and has neither
    fetch nor a block-list; OpenRouter's `web` plugin carries search with a result cap and no domain
    filter at all. A declaration a vendor cannot carry is an `Error::Config` naming the provider and
    the missing capability, sent nowhere — because a boundary silently dropped on the way to the
    wire is worse than one never declared, and this release's first stated risk is exactly that.
  - >
    One declaration governs the whole tree. The root contract's `WebAccess` is carried on the
    `Tree` beside the toolbox, the skills catalogue and the agent roster, and copied onto every
    spawned child. The spawn arguments — which the model writes — are never read for it, so a child
    can neither gain web access its root lacked nor lose the access its root had.
  - >
    A `server_tool_calls` table recording each provider-executed request the response reports: the
    provider, the tool, the query or URL where the vendor discloses it, and whether it succeeded.
    Created with `CREATE TABLE IF NOT EXISTS` like every table added since 0.13.0, so
    `CHECKPOINT_FORMAT` stays 7 and a 0.21.0 database opens unchanged.
  - >
    A failed server-side search is a failure in the trace. All three vendors return an error *object*
    inside an HTTP 200 — Anthropic a `web_search_tool_result_error` with an `error_code`, the OpenAI
    wire an error member on the annotation or search block — and the naive parse reads every one of
    them as "the search found nothing", which is the quiet failure the roadmap names. The parser
    records the error code on the `server_tool_calls` row, marks the call failed, and the run loop
    hands the model an observation saying the search failed and why, so it can retry or proceed
    knowingly rather than answering from memory while believing it searched.
  - >
    `pause_turn` is not an ending. A long search turn comes back with Anthropic's `pause_turn` stop
    reason, which today would reach the run loop as an ordinary finish and end a run mid-thought. The
    loop treats it as a continuation: the partial text becomes an observation, the step is charged for
    what it cost, and the next step proceeds — the same shape a text-only step already has. What the
    crate does *not* do is echo the vendor's partial assistant blocks back verbatim; the request shape
    has been one flattened user turn since 0.1.0 and this release does not change it, so a paused turn
    resumes as a fresh request that may repeat a search it already paid for. That is a real cost and
    it is written into `known_limitations` and `CONTRACT.md` rather than papered over.
  - >
    `WebAccess::from_policy(&Policy)`: the projection that makes one declaration govern both
    boundaries. The policy's `Act::Net` allow-rules become the vendor's `allowed_domains` and its
    deny-rules become `blocked_domains`, with the host taken from a `host:port` rule and a `*`
    wildcard rule projecting to no filter at all — because an allow-everything rule that projected to
    an empty allow-list would read to the vendor as "allow nothing", which is the inversion that would
    make this feature fail closed and silently. A rule the vendor's filter cannot express is an
    `Error::Config` at declaration time, not a boundary quietly dropped on the wire.
  - >
    The contract is honest about who enforces it. The provider dials the URL, so `Act::Net` never sees
    it and `check(Act::Net, ...)` is never consulted for a provider-executed fetch. `docs/CONTRACT.md`
    says that in the same words it already uses for a stdio MCP server: the harness *declares* a
    boundary the provider *enforces*, the declaration is recorded in the trace, and a reader who needs
    the boundary enforced in this process must not turn this on.
  - >
    One new `EventKind` variant — `ServerToolUsed { provider, tool, ok }` — through the `Observer`
    channel the crate already has, emitted where `Refused` and `ApprovalRequested` are, so a UI renders
    "it is searching" and "the search failed" without a second callback path. One variant covers
    search and fetch, success and failure, because four variants would be four `match` arms for one
    fact.
  - >
    Accounting closes. `Usage::server_tool_requests` reaches the ledger from a real run, `pricing.rs`'s
    `per_server_tool_request` charges it, and `docs/guide/accounting.md` loses the sentence saying the
    counter is always zero. A test asserts a run with two searches costs the per-request charge twice
    on top of its tokens.
  - >
    Documentation: `docs/guide/web.md` covering the declaration, the three vendor projections, the
    policy projection, citations, and what the boundary does and does not cover, with a worked example
    each; a worked example on every added public item; `docs/public-api.txt` updated by hand;
    `CHANGELOG.md` carrying all three breaks with migration snippets; `docs/CONTRACT.md` amended with
    who enforces the domain filter, what a citation is and is not, and the paused-turn limitation.
  - >
    A live example kept as evidence: a real run against a real provider that asks a question requiring
    current information, asserts the answer carries at least one citation, asserts
    `server_tool_requests` is non-zero in `provider_calls`, and asserts the cost includes the
    per-request charge — each asserted by the example itself, so a regression fails it rather than
    printing output nobody reads.
  excluded:
  - >
    An LSP client. The roadmap said "in the same release if it fits" and it does not: a language server
    is a second subprocess lifecycle, a second JSON-RPC framing, and a per-language discovery problem,
    none of which shares a line with a body key and a citation parser. It moves to 0.23.0 whole rather
    than landing half-built here.
  - >
    A fetch tool this crate executes. No HTTP client for arbitrary URLs, no HTML-to-text converter, no
    robots.txt handling, no redirect or content-size policy, no crawler. The whole argument for
    provider-executed tools is that this subsystem does not get written; a crate-side fetcher would be
    the maintenance burden this release is choosing against, and it would be the one place `Act::Net`
    genuinely applies.
  - >
    Caching or deduplicating search results. Two identical searches in one run cost two requests. A
    cache is a correctness question (how stale may an answer be?) that belongs to whoever is paying,
    not to the harness.
  - >
    Echoing a vendor's encrypted server-tool content back on a later request. The crate sends one
    flattened user turn and has since 0.1.0; changing that is a context-assembler release, not this
    one. The consequence — a paused turn may repeat a search — is documented rather than hidden.
  - >
    Any interpretation of what was found. No summarisation of results, no ranking, no scoring, no
    filtering of citations by trust. The provider's answer and the provider's citations reach the trace
    as they arrived.
  - >
    A per-agent web declaration on `AgentDef`. A definition may only narrow, and narrowing web access
    per child is a fourth narrowing mechanism to design; the run's declaration governs the tree.
    0.23.0 may revisit it with a live reason.
  - >
    Provider-executed tools beyond search and fetch — code execution, computer use, file search. Each
    has its own permission story and none of them is what a coding agent looking something up needs.
  - >
    Any new dependency. Three body keys, three response parsers and two tables in the `rusqlite`
    already present, so the default `cargo tree` stays at the 407 lines this release inherits from
    `develop`.
  - >
    The carried `CONTRACT.md` defects: `resume_tree` not calling `record_run_policy`,
    `SandboxLimits::max_processes` enforced by nothing, no Linux seccomp filter,
    `Containment::max_total_cost` inert. None is in a module this release touches.
  fallback_scope:
  - >
    Web **search** only, on all three providers, with citations, the `citations` and
    `server_tool_calls` tables, the policy projection, the failure-inside-a-200 parse and the
    `pause_turn` fix. Web fetch, and with it the Anthropic beta header and the second tool entry, drop
    out.

    Still coherent, and still the release the roadmap describes: the agent can reach current
    information and the answer carries sources. What it loses is reading a specific URL the operator
    names, which is the smaller half of the feature — search is what a model reaches for unprompted,
    fetch is what a human asks for by hand. Dropping it also drops the only vendor-beta surface in the
    release, which makes the fallback the more durable of the two.
acceptance:
  functional:
  - >
    F1 — a declaration reaches each vendor in that vendor's own shape, and a declaration a vendor
    cannot carry is refused rather than trimmed. A `WebAccess` with search, fetch, `max_uses` and
    both domain lists produces an Anthropic body carrying a `web_search_20250305` and a
    `web_fetch_20250910` tool entry with those fields; a search-only declaration with an allow-list
    produces an OpenAI body carrying `web_search_options` with that filter; a search-only
    declaration with a cap produces an OpenRouter body carrying the `web` plugin with its
    `max_results`. Asked for what it does not have — fetch on either OpenAI-wire vendor, a
    block-list on OpenAI, any domain list on OpenRouter — the provider returns an `Error::Config`
    naming itself and what it cannot do, before a request is sent. Asserted against the built bodies
    and the refusals, not a live call. The negative control is `web: None`, which produces bodies
    byte-identical to 0.21.0's for all three.
  - >
    F2 — the Anthropic fetch beta header is sent when fetch is asked for and not otherwise. A request
    with `fetch: true` carries `anthropic-beta: web-fetch-2025-09-10`; a search-only request carries
    no beta header at all.
  - >
    F3 — citations survive to SQLite. A scripted response carrying each vendor's citation shape
    produces `CompletionResponse::citations` with the url, title and cited text, rows in the
    `citations` table keyed by run and step, and the same rows readable from a fresh `Store` over the
    same file after the writing process is gone. The negative control is an answer with no citations,
    which produces no rows rather than one empty row.
  - >
    F4 — a failed search is a failure, not an empty result. A 200 response carrying a
    `web_search_tool_result_error` with `error_code: max_uses_exceeded` produces a `server_tool_calls`
    row marked failed with that code, an observation to the model naming the failure, and an
    `EventKind::ServerToolUsed { ok: false }`. The negative control is a successful search with zero
    results, which is recorded as a successful call — the two are different facts and the trace tells
    them apart. This test fails on 0.21.0's parser, which has no concept of either.
  - >
    F5 — a paused turn continues. A response with `stop_reason: "pause_turn"` and partial text does not
    end the run: the text becomes an observation, the step's usage is drawn from the ledger once, and
    the loop takes another step. The negative control is `end_turn`, which ends the run as it does
    today. Asserted through the real loop against a scripted provider.
  - >
    F6 — the policy projects onto the vendor filter. A policy allowing `docs.rs:443` and
    `crates.io:443` and denying `*.example.com` yields a `WebAccess::from_policy` whose
    `allowed_domains` are the two hosts without their ports and whose `blocked_domains` carry the
    denied pattern. A policy allowing `*` yields no allow-list rather than an empty one — the
    inversion that would silently allow nothing — and a rule the filter cannot express is an
    `Error::Config` naming the rule.
  - >
    F7 — `[web]` reaches a run from configuration. An `io.toml` carrying `[web]` with search, fetch,
    `max_uses` and both domain lists projects onto a `WebAccess` equal to the programmatic one, an
    unknown key inside `[web]` is an error naming the key and the file, and a local scope turning
    `search` off overrides a project scope that turned it on — the existing layering, asserted for the
    new table rather than assumed.
  - >
    F8 — the meter moves where the vendor reports one, and the money is charged. A run whose
    responses report two `server_tool_requests` is priced at the per-request charge twice on top of
    its tokens, the `provider_calls` rows carry the count, and `Store` reads it back. The negative
    control is the identical run reporting zero, which is charged for tokens alone. This is the
    first non-zero `server_tool_requests` in the crate's history and the test says so. The counter
    is the vendor's: Anthropic reports it and the crate reads it; the OpenAI wire reports no such
    member today, so a run that demonstrably searched there records a zero rather than a count this
    crate derived for itself. The `server_tool_calls` row is the vendor-independent record that the
    call happened.
  - >
    F13 — a spawned child inherits the root's declaration and cannot ask for its own. A tree whose
    root declared web access spawns a child whose every request carries that same declaration, read
    from the requests the provider actually received; a spawn call whose arguments ask for web
    access, or for a wider domain list, changes nothing — the spawn tool never reads one, exactly as
    it never reads a toolbox, a skills directory or an agent roster from the model.
  - >
    F9 — an out-of-tree provider is unaffected. A `Provider` implementation written before 0.22.0 that
    ignores `request.web` compiles and runs unchanged, its responses carry no citations, and the run
    completes — a provider that cannot search is honestly non-searching, not an error.
  - >
    F10 — the observer sees it. A run that searches emits `ServerToolUsed` with the provider name, the
    tool and `ok: true` in the same place `Refused` is emitted, and a failing search emits the same
    variant with `ok: false`. A consumer that matches `_` is unaffected, which is what the changelog's
    migration snippet says.
  non_functional:
  - >
    NF1 — no store format bump and no new dependency. `CHECKPOINT_FORMAT` stays 7, `citations` and
    `server_tool_calls` are `CREATE TABLE IF NOT EXISTS`, the diff carries no `ALTER TABLE`, a 0.21.0
    database opens, resumes and is queried against 0.22.0 unchanged, and the default `cargo tree` line
    count is still the 407 lines inherited from `develop`.
  - >
    NF2 — exactly three break sites, each marked, and no others. `CompletionRequest` gains
    `web: Option<WebAccess>`; `CompletionResponse` gains both `citations: Vec<Citation>` and
    `server_tools: Vec<ServerToolCall>`, because a call that failed inside an HTTP 200 cannot be
    represented by the citations it did not produce; `EventKind` gains `ServerToolUsed`. Nothing is
    removed or renamed, no existing signature changes, and every other item in `docs/public-api.txt`
    keeps its meaning. Each break is fixed by `..Default::default()` or a `_` arm, and the changelog
    carries a migration snippet for each.
  - >
    NF3 — a run that uses none of this behaves exactly as it did. A 0.21.0-shaped run with `web: None`
    produces the identical event sequence, the identical step count, the identical outcome and — for
    all three providers — a byte-identical request body, proven by comparing the built body against the
    literal 0.21.0 shape rather than against itself.
  - >
    NF4 — the full suite passes on macOS, Linux and Windows with the Windows leg's `timeout-minutes`
    unchanged at 40. Every new test is offline: bodies are asserted as JSON and responses are scripted,
    so nothing in CI depends on a vendor being up, on a key existing, or on what a search returns
    today.
  - >
    NF5 — `cargo fmt --check`, `cargo clippy --all-targets -- -D warnings`,
    `cargo clippy --all-targets --all-features -- -D warnings` and `cargo doc --all-features` all pass
    with zero warnings.
  - >
    NF6 — no key, no host and no query is logged that was not already. Citations hold URLs the model
    was given and the run recorded; the API key never enters a `server_tool_calls` row; and a query is
    stored only where the vendor discloses it in the response, never reconstructed from the prompt.
  operational:
  - >
    OP1 — `docs/public-api.txt` is updated by hand, `tests/public_api.rs` passes against the live
    surface, and every added public item carries a fenced worked example, enforced by the existing docs
    test.
  - >
    OP2 — `docs/guide/web.md` exists, is listed in `tests/guide_pages.rs` with its limits block, and is
    linked from `README.md`, `docs/CAPABILITIES.md` and the crate root.
  - >
    OP3 — `docs/CONTRACT.md` states, in its own voice: a provider-executed fetch is dialled by the
    provider, so `Act::Net` never sees it and the domain filter is enforced by the vendor, not by this
    process; a citation is what the provider returned and is not verified by the crate; a paused turn
    resumes as a fresh request and may repeat a search; and the 0.18.0 sentence saying
    `server_tool_requests` is always zero is **removed**, because this release makes it non-zero.
  - >
    OP4 — `CHANGELOG.md` carries all three breaks with migration snippets and the new capability in the
    user-facing voice the changelog test enforces.
  - >
    OP5 — a live run against a real provider is performed by hand before the release is cut and its
    output kept as evidence: a question answered from current information, at least one citation read
    back from SQLite, and a `server_tool_calls` row for the call that produced it — plus a non-zero
    `server_tool_requests` where the vendor reports one, which of the three is Anthropic alone. The
    suite proves the translation; only a live run proves a vendor accepts the body this crate builds.
delivery:
  target_mode: published
  environment: >
    crates.io as `io-harness` 0.22.0, GitHub at initorigin/io-harness with the tag `v0.22.0` and a
    Release titled `io-harness 0.22.0`, and docs.rs, whose build is checked by the nightly CI job.
  deployment_method: >
    The standing flow, unchanged. All work on `feat/0.22.0` off `develop`, including the sealed
    UltraShip release record. PR into `develop`, merged with the PR button. Release PR `develop` into
    `main`, merged the same way. GitHub Release cut from the tag with notes from the changelog.
    `cargo publish` last, after both merges and the Release exist. `develop` synced to `main`
    fast-forward only at the end. No branch is deleted. `git fetch --tags` after the Release, since
    `gh release create` makes the tag on the remote only.
  migrations:
  - >
    `CompletionRequest` gains `web: Option<WebAccess>`. A struct literal that lists every field stops
    compiling; adding `..Default::default()` or `web: None` fixes it, and `None` is the behaviour every
    existing caller already has.
  - >
    `CompletionResponse` gains `citations: Vec<Citation>`. Same shape, same fix; an empty vector is
    what every provider written before this release produces.
  - >
    `EventKind` gains `ServerToolUsed`, so an exhaustive `match` needs an arm or a `_` — the same shape
    as 0.21.0's three variants, and the changelog says so.
  - >
    No store migration and no checkpoint-format bump. Two tables are created on open; a 0.21.0 database
    gains them and is otherwise untouched, and 0.21.0 reading a 0.22.0 database ignores tables it does
    not know.
  - >
    No new dependency, so a consumer auditing the tree has nothing new to audit.
  observability:
  - >
    Every provider-executed request is a row: which provider ran it, which tool, whether it succeeded,
    and the vendor's own error code when it did not. A run that searched four times and failed once is
    reconstructable from SQLite alone.
  - >
    Citations are rows keyed by run and step, so "where did this claim come from" is answerable after
    the process is gone, and a UI renders sources without keeping its own copy.
  - >
    `provider_calls.server_tool_requests` stops being zero, so the accounting tables 0.18.0 added report
    the money they were built for, and the ledger's cost includes the per-request charge.
  - >
    The declared domain filter is recorded with the run's policy, so an audit can see what boundary was
    handed to the vendor — separately from what this process enforced, because they are enforced by
    different parties.
  rollback: >
    A published version cannot be recalled. The forward fix is 0.22.1; `cargo yank --version 0.22.0` is
    the escape hatch and leaves 0.21.0 as what `cargo install` resolves. Nothing in the checkpoint
    format changes and no existing table is altered, so a consumer who reverts to 0.21.0 keeps their
    databases and their in-flight runs; the two new tables are simply inert to 0.21.0. The three source
    breaks are two struct-literal fields and a `match` arm, each of which reverts as easily as it
    applied. Turning the feature off at runtime needs no revert at all: `web: None`, or `[web]` absent,
    is the 0.21.0 behaviour exactly.
dependencies:
  products: []
  services:
  - GitHub Actions runners for macOS, Linux and Windows
  - A real provider account with web search enabled, for the live run that is OP5
  - crates.io, for publication
  - docs.rs, for the rendered API reference
  human_approvals:
  - Owner approval to merge to `main`, cut the Release, and publish, per the standing override.
resource_profile:
  complexity: medium
  uncertainty: medium
  likely_cost_drivers:
  - >
    Three vendor shapes that agree on nothing. Anthropic puts a server tool in `tools` with a dated
    type string and gates fetch behind a beta header; OpenAI puts `web_search_options` at the top level
    of the Chat Completions body; OpenRouter puts a `plugins` array there. The two OpenAI-wire providers
    share one body builder today, so the shared builder has to stay shared while the two web keys stay
    apart.
  - >
    The response side is three more shapes: Anthropic's citations hang off text blocks and its results
    arrive as `web_search_tool_result` blocks the accumulator currently ignores by index; the OpenAI
    wire carries `annotations` on the message. The accumulator is a `BTreeMap` keyed by block index and
    a new block type has to enter it without disturbing how tool calls are reassembled.
  - >
    Failure inside a 200 is the defect the roadmap warns about and it is easy to write the naive parse
    by accident. Every vendor's error object needs a test with the vendor's own literal payload.
  - >
    The policy projection has one genuinely subtle case — an allow-everything rule must project to *no*
    filter, not an empty allow-list — and getting it backwards fails closed and silently, which is the
    worst failure shape available here.
  - >
    Every added public item needs a worked example that compiles, and a web example needs a provider, so
    the doc tests lean on the scripted-provider pattern the crate already uses.
  preferred_tools:
  - The existing `openai_wire::body` split between the shared builder and the two thin providers
  - The Anthropic `Accumulator`, extended with a block type rather than replaced
  - The existing config layering and its unknown-key error, for `[web]`
  - The `pricing.rs` `per_server_tool_request` field, which has been waiting since 0.18.0
  - The existing `Observer` channel; no second callback path
  constraints:
  - CHECKPOINT_FORMAT stays 7; new tables only, nothing altered
  - No new dependency; the default `cargo tree` stays at 407 lines
  - Exactly three breaks, each with a migration note
  - Every new test is offline — no live vendor call in CI
  - No crate-side HTTP fetch of model-chosen URLs
  - Stay 0.x
risks:
- >
  A boundary that reads as enforced and is not. An operator who sets `allowed_domains` will believe this
  process is stopping the others, and it is not — the vendor is. If that sentence is not in
  `CONTRACT.md`, the guide and the type's own documentation, the release ships a false sense of
  containment, which is worse than shipping no filter at all.
- >
  The projection inverting. Allow-everything projecting to an empty allow-list would read to a vendor as
  allow-nothing, and the failure is silent: searches simply return nothing and the model answers from
  memory. F6 pins it and it is called out in the code where it is decided.
- >
  A vendor shape moving under a dated type string. `web_search_20250305` and the fetch beta are versioned
  by the vendor and will be superseded. The mitigation is that the string is one constant per vendor with
  a body test naming it, so the change is a one-line edit and a test that fails honestly rather than a
  request that fails in production.
- >
  Cost surprise. Provider-executed requests are billed per request and a model that likes searching can
  make several per step. The mitigation is that `max_uses` is in the declaration from the start, the
  ledger charges the requests, and the guide leads with the price rather than burying it.
- >
  The paused turn repeating work. A `pause_turn` that resumes as a fresh request may pay for the same
  search twice. It is the honest consequence of the flattened request shape, it is documented, and the
  alternative — echoing encrypted vendor blocks — is a context-assembler change this release is right to
  refuse.
open_questions:
- >
  Whether `WebAccess::from_policy` should be applied automatically by the run loop when a contract
  declares web access, or stay an explicit call the caller makes. Automatic is safer by default; explicit
  keeps one declaration from silently changing when a policy layer is added. Decided during development
  and stated in `CONTRACT.md` either way.
- >
  Whether a citation should be recorded per step or per provider call. Per call is more precise when a
  paused turn spans two calls; per step is what every other trace table keys on. Decided during
  development against what the live run needs to read back.
- >
  Whether OpenAI's web search should be refused on a model that does not support it, or sent and left to
  the vendor's error. Refusing needs a model allow-list this crate would have to maintain; sending costs
  one request and returns a vendor error the trace already records honestly. Leaning to the latter,
  decided during development.
released_at: '2026-07-30T17:40:00Z'
mode: published
delivered: >
  Provider-executed web search and fetch, declared once and translated per vendor. `WebAccess` on a
  `TaskContract` — or a `[web]` table in `io.toml` — puts an Anthropic `web_search_20250305` /
  `web_fetch_20250910` server tool, an OpenAI `web_search_options`, or an OpenRouter `web` plugin on
  the wire, with the beta header Anthropic's fetch needs and only when it needs it. What a vendor
  cannot carry is refused by name before a request is sent rather than trimmed to fit. The sources a
  provider cited land in a new `citations` table and the calls it ran — including the ones that
  failed inside an HTTP 200, with the vendor's own error code — land in a new `server_tool_calls`
  table, both readable from SQLite after the process is gone, both emitted through one new
  `EventKind::ServerToolUsed`. A failed search reaches the model as an observation instead of reading
  as a search that found nothing; a `pause_turn` stop reason is a continuation instead of ending an
  unverified run mid-search; `WebAccess::from_policy` projects the policy's `Act::Net` rules onto the
  vendor's domain filter, with an allow-everything rule projecting to no filter rather than to an
  empty one; and a spawned child inherits the root's declaration while the spawn arguments the model
  writes are never read for it. `CHECKPOINT_FORMAT` stays 7, the two tables are additive, and the
  default `cargo tree` is still 407 lines.
