known_limitations:
- >
  `Usage::server_tool_requests` is the vendor's counter, and only Anthropic reports one. The OpenAI
  wire carries no such member today, so a run that demonstrably searched on OpenAI or OpenRouter
  records a zero. The crate records the zero it was told rather than deriving a count it was not
  given, and the `server_tool_calls` row is the vendor-independent record that the call happened.
- >
  The live evidence was obtained on OpenRouter, the only vendor with working credentials in this
  workspace — `.env` holds placeholders for `ANTHROPIC_API_KEY` and `OPENAI_API_KEY`. So the live run
  proves the OpenRouter body, plugin and annotation parse end to end; the Anthropic path, including
  the dated server-tool types, the beta header and the `web_search_tool_result_error` parse, is
  proven by its wire tests and not by a live call. A first Anthropic run is the first thing to do
  when a key is available.
- >
  A paused turn resumes as a fresh request. The crate sends one flattened user turn and does not echo
  the vendor's partial assistant blocks back, so a provider may repeat — and re-charge for — a search
  it already ran. `WebAccess::max_uses` is the only lever against it.
- >
  The domain filter is enforced by the vendor, not by this process. The provider dials the URL, so
  `Act::Net` never sees it, no approver is consulted, and a caller who needs the boundary enforced
  in-process must leave this off. Stated in `docs/CONTRACT.md`, in the guide, and on the type.
- >
  A citation is what the provider returned. This crate does not fetch the url, check that the page
  exists, or verify that it says what the model claimed.
- >
  No per-child narrowing of web access. A spawned child inherits the root's declaration exactly;
  `AgentDef` has no field for it, so "the researcher may search, the writer may not" is not
  expressible in one tree today. Candidate for 0.23.0.
- >
  `max_uses` means three different things across the three vendors: uses on Anthropic, results on
  OpenRouter (`max_results`), and nothing at all on OpenAI, whose Chat Completions body carries no
  cap field. Documented in the guide rather than normalised, because normalising it would mean
  inventing a bound the vendor does not enforce.
- >
  This record was sealed on `feat/0.22.0` before the crates.io upload, which follows the
  `develop` → `main` merge and the GitHub Release. `mode: published` states the authorized target and
  the flow makes it true.
