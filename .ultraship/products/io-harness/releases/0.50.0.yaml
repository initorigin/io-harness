product: io-harness
version: 0.50.0
status: planned
release_type: minor

outcome:
  user_can: >
    Fan an agent out across a workspace and get back what the children actually found, without one
    slow child holding the whole tree. A parent states, per spawn, whether it waits: a blocking
    child is today's behaviour and stays the default; a **detached** child lets the parent keep
    working and reports at a later step; and a spawn carrying a wall clock **moves to the background**
    when it crosses it rather than blocking to the end. Every child, in all three shapes, now returns
    a report a model can act on instead of a discriminant.

    **What a child returns today is one line, and it says almost nothing.** `compose_child`
    (`src/run.rs:7219-7224`) folds `[child 7 "<goal>" -> Success { steps: 4 }]` into the parent's
    ledger — a `Debug`-printed `RunOutcome` and a step count, because `RunOutcome::Success` carries
    no text at all (`src/run.rs:216-218`). The child's own conclusion exists: a completion with no
    tool call becomes `[step N] (no tool call) <what it said>` in the **child's** ledger
    (`src/run.rs:6319-6331`). It is simply never handed back. So a parent that spawns four agents to
    investigate four subsystems learns that four runs succeeded and nothing they concluded, and the
    only way for a finding to reach the parent is for the child to write it to a file the parent then
    reads — which is why `verify_file` is a required argument of a tool whose stated purpose is
    delegation.

    **And a child blocks its parent completely.** Every spawn call in a step is driven by one
    `buffered` stream and awaited before the step can end (`src/run.rs:6475-6509`), and
    `spawn_child` awaits `run_agent` inline (`src/run.rs:7087-7096`). A child that runs for twenty
    steps against a slow provider is twenty steps the parent spends doing nothing, and a child that
    parks on a long build holds its tier's slot, its parent, and every sibling behind it in the
    ordered fold.

    **The roadmap's third shape does not need to be built, and saying so is part of this release.**
    The entry named a *forked* child "whose tool output never enters the parent's context at all".
    That is what every child has always been: a child runs `run_agent` over its **own** ledger at its
    own depth, and not one of its observations is ever pushed into the parent's. There is no context
    saving left to win there — the saving is already banked, and what was missing was the value: the
    conclusion. The correction is recorded in the roadmap entry rather than quietly absorbed.

  business_value: >
    **A fan-out that returns nothing is a feature nobody can use twice.** `SPAWN_TOOL` has existed
    since 0.5.0 and the tree has been given a queue (0.32.0), worktrees (0.36.0), per-tier
    concurrency, adoption on resume, and containment (0.39.0) — every one of those makes children
    *safe to run*, and none of them makes a child's answer *reach anybody*. The one thing an
    embedder wants from delegation is the finding; today they have to build a file protocol on the
    side to get it, which is why `verify_contains` is doing double duty as a return channel.

    **Blocking is what stops the tree scaling in wall clock rather than in tokens.** The concurrency
    cap already lets siblings run at once, so the loss is not parallelism between children — it is
    that the *parent* is idle for the whole fan-out and cannot read, plan, or start the next piece of
    work while it waits. On a tree of any depth that idle time multiplies: a parent at depth 1 is
    blocked by its children while itself blocking its own parent.

    **And a stuck child is currently unbounded from the parent's side.** `Containment` has a
    tree-wide `max_total_duration` (`src/containment.rs:117-120`) which halts the *whole tree*, and a
    child contract can carry `max_steps` — but there is nothing between "this child gets 20 steps"
    and "kill everything", and steps are not time. A child that spends forty minutes in one `exec` is
    inside every cap the crate has. `background_after` is the missing middle: the parent stops
    waiting, the child keeps going, and neither is killed.

    **The cost of doing it is unusually low, and that is a consequence of what is already there.**
    The queue, the per-tier slots, the `spawns` rows, adoption on resume and `Store::children`
    (`src/state.rs:4649-4652`) were all built for a blocking tree and every one of them is exactly
    what a detached child needs. This release is expected to add **no table, no column, no index**
    and **no compile break**: the knobs land on `TaskContract`, which has been `#[non_exhaustive]`
    since 0.35.0, and the events on `EventKind`, which has been `#[non_exhaustive]` since 0.24.0.

  evidence_of_value: >
    Executed in the technique the last nineteen releases used: a discriminating assertion per claim,
    negative controls that must not move, one sabotage per arm of every two-armed claim, and a
    sabotage that fails nothing reported as a finding rather than propped up.

    **The report is proven by content, not by shape.** Asserting that a composed observation is
    longer than it used to be would pass for a build that pretty-prints the same discriminant. The
    criterion asserts that a **string the child said and nothing else in the run said** appears in
    the parent's ledger, with a control that the same string does not appear when the child is run
    under today's composition.

    **Detachment is proven by ordering, which is the only thing that can distinguish it.** A
    detached child is asserted to have its report arrive at a **strictly later step** than the step
    that spawned it, while the parent is asserted to have taken steps in between — because "the
    parent did not wait" and "the child finished instantly" are indistinguishable from a report
    alone. The blocking control asserts the opposite in the same test file: the report is in the
    spawning step's own observations.

    **Backgrounding is proven with a clock the test owns**, not with a real slow child: the child's
    provider parks on a controllable future, the wall clock is milliseconds, and the assertion is
    that the parent's step ends with a "moved to the background" observation **and** that the child
    later completes and reports — because a `background_after` implemented by dropping the child's
    future would pass the first half and silently kill the work. That drop is the failure mode this
    criterion exists to catch, and it is the one a `tokio::time::timeout` would ship by accident.

    **Determinism is protected by a negative control rather than by intent.** 0.12.0 replaced
    `buffer_unordered` with `buffered` precisely so a tree's trace is reproducible
    (`src/run.rs:6487-6501`), and detachment gives that up for the calls that use it. The criterion
    is that a run using **no** detached spawn produces a byte-identical trace to this build's, and
    that the ordering rule for detached reports is itself deterministic given which children have
    finished.

    **And the boundary claim is asserted as an absence.** 0.48.0's rule — everything a run starts is
    inside the boundary — must survive: a parent that returns while a child it detached is still
    running would be a process leak the crate has never had. The parent is asserted to drain, and the
    sabotage that removes the drain must fail a named test.

scope:
  included:
  - >
    **`spawn_agent` gains two optional arguments and neither changes an existing call.** `wait`
    (boolean, default `true`) and `background_after_secs` (integer, optional) on the tool schema at
    `src/run.rs:12536-12556`. A call that omits both is today's spawn and takes today's path through
    `spawn_child`; the arguments are read exactly where `max_steps` and `deny_write` are read
    (`src/run.rs:6929`, `:6877`). `wait: false` with a `background_after_secs` is a contradiction and
    is answered the way every other malformed spawn is — a typed error observation naming the
    conflict, no child, and the parent adapts (`src/run.rs:6831-6836` is the established shape).
  - >
    **A child returns a `ChildReport`, and `compose_child` stops printing a discriminant.** The
    report carries the child's run id, its goal, its outcome, its steps, its tokens, and **its
    conclusion** — the text of its last completion that carried no tool call, which is the child's
    own answer. Composed into the parent's ledger as an `ObsKind::Child` observation bounded by
    `entry_cap` exactly as today (`src/run.rs:6515-6520`), so a talkative child cannot flood a
    parent: the bound that already governs every observation governs this one.
  - >
    **The conclusion is read from one helper with two sources, because a resumed tree has no
    in-memory child.** For a child this process ran, the text is carried out of `run_agent` directly
    — `run_agent` is crate-internal (`src/run.rs:5908-5920`) so widening its return type from
    `RunOutcome` to a small internal struct costs no public surface. For a child **adopted** on
    resume and found already terminal (`src/run.rs:6946-6949`), it is read back from that child's
    `ledger_observations` rows (`src/state.rs:4530-4540`) by the same helper. One helper, two
    sources, asserted to agree — two independent renderings of a child's answer is the drift
    `NO_TOOL_CALL`'s own doc comment exists to prevent.
  - >
    **A detached child goes into an in-flight set the parent's own loop drives.** `&Store` is
    `Send` and not `Sync` and `run_agent` borrows the whole `Tree`, so a detached child **cannot**
    become a `tokio::spawn`ed task — 0.41.0 settled this shape and it settles this one. The child is
    a future in a `FuturesUnordered` held by the parent's loop, polled concurrently with the parent's
    own provider call, on the same task. `futures_util` is already a dependency and already imported
    at this site (`src/run.rs:6476`), so `cargo tree` does not move. The future **owns** the child's
    contract and policy — an `async move` capturing them and borrowing inside, which is 0.41.0's
    "own what you need" precedent — because those are locals of `spawn_child` today and a borrowed
    future cannot outlive its frame.
  - >
    **A detached child's report is folded at the next step boundary, in spawn order.** Before the
    parent composes its next completion, every child that has finished since the last boundary
    contributes its report as an observation, ordered by the step and call index that spawned it and
    not by completion order — so two children finishing in either order produce the same ledger. The
    parent's next prompt therefore contains the findings, which is the whole point of the report.
  - >
    **`background_after_secs` races the child against a sleep and keeps the loser.** The parent waits
    on the child and on a `tokio::time::sleep` together; if the sleep wins, the **child's own future
    is moved into the in-flight set** and the parent's step ends with a "moved to the background"
    observation naming the child and the elapsed clock. It is explicitly not `tokio::time::timeout`,
    which drops the future and kills the child. Detached and backgrounded children share one set and
    one fold — the only difference between them is whether the parent waited first.
  - >
    **A tree never returns while a child it started is running.** Before the parent's loop returns
    any outcome, it drains the in-flight set and folds every remaining report, so 0.48.0's rule —
    everything a run starts is inside the boundary — holds for children as it does for processes. The
    slot each child holds is released by its own future finishing, exactly as today
    (`src/run.rs:7102`), so a drained tree also has an empty ledger tally.
  - >
    **A detached child is re-adopted on resume, with no new query and no DDL.** A step that detaches
    a child commits (unlike a step paused **by** a child, `src/run.rs:6546-6562`), so the replay does
    not re-enter `spawn_child` for it. Instead, before its first step, a resumed parent walks
    `Store::children` (`src/state.rs:4649-4652`), skips every child `terminal_outcome`
    (`src/run.rs:3466`) reports as finished, and re-adopts the rest into its in-flight set through
    the existing adopt path — the same `find_spawn` row, the same `last_step + 1` restart
    (`src/run.rs:7023-7029`), the same slot. A finished one is folded as a report immediately.
  - >
    **`TaskContract` gains the operator's half of the two knobs**, both optional and both free on an
    already-`#[non_exhaustive]` struct (`src/contract.rs:186-188`): a default wall clock applied to
    any spawn that names none, and a switch that refuses detachment outright for embedders who want
    the deterministic trace 0.12.0 guarantees. The operator's setting **narrows** the model's, never
    widens it — the same direction every spawn argument already travels (`src/run.rs:6932-6935`).
  - >
    **Three additive `EventKind` variants**, free on an enum `#[non_exhaustive]` since 0.24.0
    (`src/observe.rs:568-571`): a child detached, a child moved to the background with the clock it
    crossed, and a child's report collected at a step. Each carries the child's run id and is emitted
    at the **parent's** depth, which is where `Spawned` and `SpawnRefused` are already attributed
    (`src/run.rs:7055-7066`) and why `depth` keeps meaning "who emitted this". No variant carries a
    field named like the envelope's.
  - >
    **The reporting surfaces, updated in this release and not the next one.** `docs/CONTRACT.md`
    gains what a child returns, what the three shapes are, what a detached run gives up about
    reproducibility, and what happens to an in-flight child across a resume. `src/lib.rs`'s tree
    prose (`:102-106`), the README, and `CHANGELOG.md` agree with it, and `tests/docs_drift.rs` and
    `tests/changelog.rs` pass.
  excluded:
  - >
    **A separate `agent_poll` / `agent_collect` tool pair.** The `shell_start`/`shell_poll`/
    `shell_kill` handle idiom (`src/tools/mod.rs:88`, `src/run.rs:9329-9560`) is the obvious
    precedent and is deliberately not copied: a report that arrives on its own at the next step needs
    no protocol for the model to learn, and a polling tool would add two tool schemas to every tree
    prompt — which 0.38.0's cacheable prefix pays for on every request of every run. If a parent
    genuinely needs to block on a specific child, it can spawn that one with `wait: true`.
  - >
    **Killing a child from the parent.** There is no `agent_kill` this release. A backgrounded child
    runs to its own caps; the tree's `max_total_duration` and the child's `max_steps` are what stop
    it. Adding a kill path means deciding what a half-finished child's workspace writes mean, which
    is its own release.
  - >
    **Any store, schema or event-table change.** No table, column or index; `CHECKPOINT_FORMAT` stays
    at 7. Everything a detached child needs across a restart is already durable: the `spawns` row,
    the child's `runs` row, and its `ledger_observations`.
  - >
    **Any change to `Containment`.** It is not `#[non_exhaustive]`, it has no builder, and it is
    built by struct literal in the crate's own doctest (`src/run.rs:5334`), so a field there is a
    compile break for every caller — and the knobs this release needs are per-contract anyway, not
    per-tree. The tree-wide `max_total_duration` keeps meaning exactly what it means.
  - >
    **Changing what a blocking spawn does, by one byte.** A call with neither new argument produces
    the same requests, the same slot behaviour, the same ordering and the same trace as this build —
    except that its composed observation now carries the child's conclusion, which is the release.
  - >
    **Persisting the report as structured data.** It is composed into the parent's ledger as text,
    like every other observation, and read back on resume from the child's own rows. A `reports`
    table would be durable state the crate does not need to answer any question it is asked.
  - >
    **Reasoning content, media or tool structure in a report.** A child's conclusion is its last
    text. What it looked at stays in its own trace, where an operator reads it by run id.
  fallback_scope:
  - >
    **A child returns its conclusion, in today's blocking shape.** The `ChildReport`, the two-source
    helper, the bound, and the documentation. This is a coherent release on its own and it is the
    half that makes delegation useful at all: a fan-out that answers is worth shipping without
    concurrency, and a fan-out that does not answer is not worth shipping with it.
  - >
    Dropped under pressure, in this order: `background_after_secs` first (it is the same machinery as
    detachment plus a race, so it is the cheapest to defer once detachment exists, and a stuck child
    is bounded today by `max_steps` and the tree clock), then the `TaskContract` operator knobs (the
    tool arguments alone are a complete feature), then detachment itself — under which the release is
    the fallback above, and each dropped piece stays in the roadmap as named work rather than being
    quietly lost.

acceptance:
  functional:
  - >
    **F1 — a child's conclusion reaches its parent.** A child whose final completion says a marker
    string produces a parent observation containing that string, and the parent's next
    `CompletionRequest` contains it. The marker is produced by the child's provider only, so nothing
    else in the run can have written it. Asserted together with the report's other fields — the
    child's run id, its outcome and its step count are all still present, because the release adds to
    what the parent learns and removes nothing. Sabotage: restore `compose_child`'s `{outcome:?}`
    line, under which the marker assertion fails and every other criterion here still passes.
  - >
    **F2 — an adopted child's conclusion is read from the store and is the same text.** A tree
    interrupted mid-flight and resumed, whose child had already reached a terminal outcome, composes
    a report whose conclusion is byte-identical to the one the in-process path produced for the same
    child. Asserted as equality between the two renderings rather than against a literal, because two
    sources of one fact drifting is the failure this criterion exists to catch. Sabotage: have the
    store path return the run's goal instead of its last untooled text, under which the equality
    fails and only this fails.
  - >
    **F3 — a detached child does not block its parent, and its report arrives later.** A parent that
    spawns with `wait: false` commits the spawning step **without** the child's report, takes at
    least one further step, and receives the report at a strictly later step. Asserted as three
    facts together — the report is absent from step *n*, the parent's step count advanced, and the
    report is present at step *m > n* — because any one alone passes for a build that merely
    reordered the fold. Sabotage: await the detached child inline, under which the "absent from step
    *n*" assertion fails and the blocking control (F4) still passes.
  - >
    **F4 — a blocking spawn is unchanged, and this is the negative control the release rests on.** A
    spawn with neither new argument folds its report into **its own** step, in the model's call
    order, with the tree's trace — `steps.decision` and `steps.result` for every step — byte-identical
    to this build's apart from the conclusion text F1 adds. Two children whose completion order is
    forced to differ from their call order produce the same trace either way, which is 0.12.0's
    determinism claim asserted again because this release touches that stream. Sabotage: make
    `wait: false` the default, under which this fails and F3 still passes.
  - >
    **F5 — a wall clock moves a child to the background and does not kill it.** A spawn carrying
    `background_after_secs` whose child is parked past that clock ends the parent's step with a
    "moved to the background" observation naming the child, **and** the child subsequently completes
    and delivers its report to a later step. Both halves are asserted, because an implementation
    built on `tokio::time::timeout` passes the first and silently drops the child. Sabotage: replace
    the race with `timeout`, under which the second half fails and only this fails; and separately,
    set the clock past the child's own duration, under which the child must report in its own step
    and no background observation is emitted.
  - >
    **F6 — a tree never returns with a child still running.** A parent that detaches a child and then
    reaches its own ending — verification passed, step cap, or a stall — drains before it returns:
    the returned outcome is accompanied by every detached child in a terminal state, the tier's
    `Fleet` tally reports zero working, and every report is in the trace. Sabotage: return without
    draining, under which the terminal-state assertion fails and only this fails.
  - >
    **F7 — an in-flight detached child survives a process death and is re-adopted.** A tree killed
    while a detached child is mid-run, then resumed, re-adopts that child from its own last committed
    step (not from step 1, and not as a second child), completes it, and folds its report. Asserted
    on the child's run id being the same row and its step count continuing rather than restarting —
    the same properties the existing adopt-on-resume tests assert for a blocking child. Sabotage:
    skip the re-adoption walk on resume, under which the child is never completed and F6's drain
    finds nothing to drain, failing this and not F6's own test.
  - >
    **F8 — the operator's knobs narrow and never widen.** A `TaskContract` that refuses detachment
    turns a `wait: false` call into a blocking spawn with a stated observation, not into an error and
    not into a silent detachment; a contract default wall clock applies to a spawn naming none and is
    **not** raised by a spawn naming a longer one. Asserted in both directions. Sabotage: let the
    model's `background_after_secs` override the contract's, under which the narrowing assertion
    fails and only this fails.
  - >
    **F9 — a malformed spawn is a typed observation, not a failure.** `wait: false` together with
    `background_after_secs` produces an error observation naming the conflict, no child is created,
    no slot is taken, no `spawns` row is written, and the parent's run continues. Asserted as an
    absence (no new row, no ledger movement) and a presence (the observation) together. Sabotage:
    treat the conflict as the detached case, under which the absence assertion fails and only this
    fails.
  non_functional:
  - >
    **N1 — no new dependency.** `cargo tree` for the default feature set is unchanged at **402**
    crates on macOS and Linux. `FuturesUnordered` and `select` come from `futures_util`, which is
    already a dependency and already imported at the spawn site (`src/run.rs:6476`).
  - >
    **N2 — MSRV unmoved.** The crate builds on 1.95 with the toolchain gate CI already runs.
  - >
    **N3 — zero compile breaks, and it is asserted rather than intended.** `TaskContract` is
    `#[non_exhaustive]` with builders (`src/contract.rs:186-188`) and `EventKind` has been
    `#[non_exhaustive]` since 0.24.0, so both additions are free; `Containment`, `RunOutcome`,
    `RunResult`, `CompletionRequest`, `ToolCall` and every `Provider` method are untouched. Proven by
    the cross-version fixture generator, which is an out-of-tree crate compiled against this build.
    `docs/public-api.txt` gains **the enumerated crate-root additions only** — stated as "the
    enumerated additions" rather than as a line count, because that checker enumerates crate-root
    re-exports and a criterion promising a number has been met in a different form in four of the
    last eleven releases.
  - >
    **N4 — no durable state moves.** `git diff main -- src/state.rs` shows **no DDL**: no table,
    column or index, and `CHECKPOINT_FORMAT` unmoved at 7. `Store::children` and `find_spawn` are
    read paths that already exist and are called, not altered.
  - >
    **N5 — the parent works while a detached child runs, measured.** With a child parked for a
    stated interval, the parent's completed step count over that interval is recorded for a blocking
    spawn and for a detached one, in the release record. This is the release's own number: it must
    be greater than zero for the detached arm and zero for the blocking arm, and a figure that says
    otherwise is a feature that did not ship rather than a test to adjust.
  - >
    **N6 — a run that detaches nothing is byte-identical in trace to this build.** Every existing
    tree suite — `tests/subagents.rs`, `tests/agents.rs`, `tests/checkpoint.rs`,
    `tests/session_fanout.rs`, `tests/custom_tools.rs` — passes unchanged apart from assertions that
    quote the composed child line, each of which is updated with a sentence saying the composition
    deliberately changed. 0.32.0's queue, 0.36.0's worktrees, 0.39.0's contained turns and 0.41.0's
    read batch are unaffected.
  - >
    **N7 — the tree prompt does not grow a protocol.** `spawn_agent` gains two optional properties
    and no tool is added, so the tool catalogue's shape — and therefore 0.38.0's cacheable system
    prefix — moves by the schema's own bytes and nothing else. Asserted by the composed system prompt
    differing from this build's only inside the `spawn_agent` schema.
  operational:
  - >
    **O1 — the full suite passes on all three platforms**, on the standing CI matrix including
    0.47.0's `contained (ubuntu, userns restricted)` leg. Concurrency changes are exactly the kind
    that pass on one host and fail on a loaded runner, so a green macOS gate is not evidence here.
  - >
    **O2 — cross-version is unaffected and proven so.** No DDL, so a 0.49.0 store and a 0.50.0 store
    are the same store in both directions, asserted by the existing cross-version suites.
  - >
    **O3 — no test gates on a wall clock it does not own.** F5's clock is the test's own
    (milliseconds, against a provider the test parks deliberately) and F3's ordering is asserted on
    step numbers rather than on elapsed time. A criterion that would fail on a busy runner is a flake
    this repository has paid for seven times, and the standing rule applies: assert the structure,
    record the timing.
  - >
    **O4 — the documentation surfaces agree with the code, in the same release.**
    `docs/CONTRACT.md`, `src/lib.rs`, the README and `CHANGELOG.md` describe what a child returns,
    the three shapes, the reproducibility a detached spawn gives up, and what a resume does with an
    in-flight child. `tests/docs_drift.rs` and `tests/changelog.rs` pass.

delivery:
  target_mode: published
  environment: >
    crates.io as `io-harness` 0.50.0, GitHub at initorigin/io-harness with the tag `v0.50.0` and a
    Release titled `io-harness 0.50.0`, and docs.rs.
  deployment_method: >
    The standing flow. All work on `feat/0.50.0` off `develop`, committed incrementally as it lands,
    including the sealed UltraShip release record and the hand-appended lock pin. PR into `develop`,
    merged with the PR button. `develop`'s head **and tree** checked against the tree the gates ran
    on immediately before the release PR is opened. Release PR `develop` into `main`, merged the same
    way. The GitHub Release is cut by `release.yml` —
    `gh workflow run release.yml --ref main -f version=0.50.0` — which takes its notes verbatim from
    the changelog. `cargo publish --locked` by hand afterwards, always last, after both merges and
    the Release exist, with the registry token sourced from the repo-local `.env` in the same shell
    invocation. `develop` synced to `main` fast-forward only at the end. No branch is deleted.
  migrations:
  - >
    **No store migration at all.** No table, column or index is created or altered,
    `CHECKPOINT_FORMAT` is unmoved at 7, and a 0.49.0 store and a 0.50.0 store are the same store in
    both directions.
  - >
    **No compile break.** Every public type this release touches is either `#[non_exhaustive]` with
    builders or untouched. An embedder upgrades by changing nothing.
  - >
    **One behaviour change with no opt-out, and it is the release.** A parent's composed child
    observation now carries the child's conclusion instead of a `Debug`-printed outcome. An embedder
    asserting on the exact text of that line will see it; the changelog states the old and new shapes
    so the fix is a one-line edit rather than a discovery.
  - >
    **A run that opts into detachment gives up step-for-step trace reproducibility** for the calls
    that use it, and the changelog says so in those words. A run that does not is unchanged, which is
    what N6 asserts.
  observability:
  - >
    Three additive `EventKind` variants — detached, backgrounded (carrying the clock it crossed), and
    a report collected — each emitted at the parent's depth beside the existing `Spawned`,
    `SpawnRefused` and `Fleet` events. An observer that ignores them is unaffected; one that reads
    them can render a fan-out that is no longer synchronous.
  - >
    `EventKind::Fleet`'s tally keeps meaning exactly what it means: a detached child holds its tier's
    slot until it finishes, so `working` counts it and a drained tree reports zero.
  rollback: >
    A published version cannot be recalled; the forward fix is 0.50.1 and `cargo yank --version
    0.50.0` is the escape hatch, leaving 0.49.0 as what `cargo install` resolves. Reverting the
    behaviour needs no downgrade and no flag: a caller that spawns without the new arguments — which
    is every caller that existed before this release — gets the blocking, ordered, reproducible tree
    it had, which is exactly what F4 asserts. The one thing that cannot be opted out of is the
    conclusion in the composed line, and that is stated in the changelog as a behaviour change rather
    than hidden behind a switch.

dependencies:
  products: []
  services:
  - >
    crates.io and GitHub Actions for the release itself, as every version.
  - >
    **No live provider call is required.** Every claim here is about this crate's own loop, ordering
    and store, and is proven against a scripted provider. N5's measurement is a step count against a
    parked fixture, not a vendor's counter.
  human_approvals:
  - >
    **The roadmap entry's "forked child" is not built, because the code shows it already exists.**
    Decided at specification time, 2026-08-12, and recorded in the roadmap entry itself rather than
    absorbed silently. The context saving it promised is already banked; the conclusion it promised
    is what this release ships.
  - >
    **Detachment is concurrency on the parent's own task, never a spawned task.** Decided at
    specification time, 2026-08-12, and forced by `rusqlite::Connection` being `Send` and not `Sync`.
  - >
    **No `agent_poll`/`agent_kill` tool pair.** Decided at specification time, 2026-08-12: a report
    that arrives by itself needs no protocol, and every added tool schema is paid for on every
    request of every tree run.
  - >
    **`delivery.target_mode` is `published`.** Decided at specification time, 2026-08-12.
  - >
    The PR, both merges, the Release and the publish are pre-authorised for this version under the
    standing flow.

resource_profile:
  complexity: medium
  uncertainty: medium
  likely_cost_drivers:
  - >
    **Lifetimes at the detachment point are the whole difficulty.** `run_agent` returns
    `Pin<Box<dyn Future + 'f>>` borrowing the `Tree`, and the child's contract and policy are locals
    of `spawn_child` (`src/run.rs:6923-6935`, `:6887`). Holding that future across the parent's steps
    means the future must own them. This is expected to be one restructuring of `spawn_child` into a
    "prepare, then a future that owns its inputs" pair, and it is where the compile rounds will go.
  - >
    **The step loop has one commit point with a stated argument attached to it** (`src/run.rs:6546-
    6575`), and the fold of a detached report has to reach it without adding a second, quieter commit
    path. The existing `paused_by_child` reasoning is the shape to extend, not to work around.
  - >
    **Concurrency tests are where flakes are bought.** Every ordering claim is asserted on step
    numbers and terminal states rather than on elapsed time, and F5's only real clock is the test's
    own — this is deliberate and it costs test-design effort up front.
  - >
    **The existing tree suites quote the composed child line.** Each assertion that changes is a
    decision to be stated in the record with its sentence, not a sweep — a test changed because the
    behaviour deliberately changed is legitimate, and doing it without the sentence is not.
  preferred_tools:
  - >
    `tests/subagents.rs` and `tests/agents.rs` for the tree claims — that is where every spawn
    assertion already lives — plus a scripted provider that can park a child deliberately, which
    `tests/` already builds for the pause and cancel suites.
  - >
    `cargo test --doc` for the doctests, and `src/run.rs`'s own `#[cfg(test)]` module for the
    composition helper's two sources.
  constraints:
  - >
    **No new runtime dependency.** `cargo tree` flat at 402.
  - >
    **MSRV 1.95, edition 2021, Apache-2.0.** Unchanged.
  - >
    **Every version stays 0.x.x.** No 1.0.0 is planned or implied by this release.
  - >
    **`&Store` cannot cross a task boundary.** `rusqlite::Connection` is `Send` and not `Sync`, which
    decided 0.41.0's read batch and decides this release's detachment shape. Anything proposing a
    detached child as an independent task is refused by the type system before it is refused here.
  - >
    **`docs/CONTRACT.md`, the README, the changelog and the crate-root prose are checked-in
    surfaces.** They change in this release, not in the next one.

risks:
- >
  **A detached child that nobody drains becomes a leak, and the type system will not catch it.** The
  in-flight set lives in the parent's loop, and every early return from that loop — verification
  passed, step cap, stall, budget ceiling, an `Err` propagating — is a place a child can be
  abandoned. Mitigation: the drain sits at the single return boundary rather than at each exit, F6
  asserts it, and the sabotage that removes it must fail a named test. The `Err` path is the one to
  check by hand, because a test asserting a happy-path drain says nothing about it.
- >
  **`background_after` implemented with `tokio::time::timeout` silently kills the work.** It is the
  obvious spelling and it is wrong: dropping the future cancels the child mid-step, leaving its run
  row `running` forever — indistinguishable from a crashed process. Mitigation: F5 asserts the second
  half (the child later reports) and names `timeout` as its sabotage.
- >
  **Two renderings of a child's conclusion drift.** The in-process path and the store path answer the
  same question from different data, and a change to one that misses the other is invisible to any
  test reading only one. Mitigation: one helper with two sources, and F2 asserts equality between
  them rather than each against a literal.
- >
  **A detached child makes a tree's trace non-reproducible, and that could leak into runs that did
  not ask for it.** Mitigation: `wait` defaults to `true`, F4 is a byte-identity control on the
  blocking path, the fold order for detached reports is spawn order rather than completion order, and
  `TaskContract` carries a switch an operator can use to refuse detachment outright.
- >
  **The slot accounting can drift once a slot outlives its `spawn_child` frame.** Today `drop(slot)`
  sits before every return (`src/run.rs:7097-7103`) precisely so no exit leaks one; moving the child
  into a future moves that guarantee with it. Mitigation: the slot is owned by the same future that
  owns the contract, so it is released exactly when the child ends, and F6 asserts the tier tally is
  zero after a drain.

open_questions:
- >
  **Should a parent be told, in its prompt, which children are still in flight?** A model that
  detached three children and cannot see that they are outstanding may finish early. The plan does
  not add a standing prompt section for it: the report arriving is the signal, and the drain means
  nothing is lost. If implementation shows a parent routinely ending while children run, a one-line
  ledger note naming the outstanding children is the smallest fix and is an iteration, not a
  redesign.
- >
  **Does the fold need to force a step?** A parent whose ending coincides with an outstanding child
  drains and returns without the model ever reading that report. The report is in the trace and in
  the store, so nothing is lost to an operator — but it is lost to the agent. Granting one more step
  when a drained report arrives is the alternative, and it interacts with the step cap in a way that
  wants evidence rather than a guess at plan time.
- >
  **What should `background_after_secs` measure from — the spawn, or the child's first provider
  call?** The plan measures from the spawn, which is simplest and is what a parent means. A child
  that spends its clock waiting in the tier queue would then be backgrounded having done nothing,
  which is arguably correct (the parent has waited that long either way) and arguably not. If the
  queue wait turns out to dominate in practice, measuring from admission is a one-line change and an
  iteration.
