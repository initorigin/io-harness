known_limitations:
  - >
    The record is sealed on `feat/0.16.2` before the crates.io upload, which follows the two merges
    and the GitHub Release. `mode: published` states the authorized target; the flow makes it true.
    O1 — the docs.rs build succeeding and the page rendering — can only be checked after the upload,
    since docs.rs builds from the published crate.
  - >
    Nothing in this repository can catch the next occurrence. The failing configuration is one no
    local or CI command builds, which is the whole reason two releases shipped the defect, and this
    release deliberately adds no nightly `--cfg docsrs` job to fix that: a workflow change has its
    own failure modes and its own matrix cost, and it does not belong in the release that exists to
    unbreak the page. It is the first thing the next release should carry.
  - >
    `doc_cfg` is itself an unstable feature and can be renamed or removed exactly as `doc_auto_cfg`
    was. Nothing about this fix makes the crate durable against that; it makes it correct against
    today's nightly.
  - >
    The CI matrix was not waited on, at the owner's instruction and on the stated grounds that this
    is a one-line change. The trade is narrower here than it was for 0.16.1: the edited line is
    inside a cfg that no configuration CI builds ever sets, so the matrix could not exercise it even
    if it ran. Every claim above rests on a local macOS run on stable, plus the nightly docs build.
  - >
    0.16.0 and 0.16.1 stay without documentation on docs.rs permanently. Neither was yanked — both
    build, both pass their suites, and both are what a consumer is running; only their doc pages are
    missing, and yanking would be a disproportionate response the owner has not authorized.
  - >
    Everything 0.16.0 and 0.16.1 carried is carried still. The four defects documented in
    `docs/CONTRACT.md` — the reserved tool-name gap, `resume_tree` not recording its policy,
    `SandboxLimits::max_processes` enforced by nothing, and no Linux seccomp filter — are untouched,
    because each is a behaviour change and none belongs in a patch.
supersedes: 0.16.1
next_recommended_version: null
immutable: true
