product: io-harness
version: 0.49.0
status: released
release_type: minor

outcome:
  user_can: >
    Embed this crate and have the model receive the shape it was post-trained on: a role-tagged
    conversation whose assistant turns carry native tool-call blocks and whose results come back as
    correlated tool-result blocks — instead of one user message narrating the assistant's own past
    actions in the third person.

    **The request cannot express a conversation today.** `CompletionRequest` carries one `system`
    string and one `user` string (`src/provider/mod.rs:469`, `:471`), and both wires hard-code a
    single `role: "user"` entry addressed by literal index — `anthropic.rs:166-168` and
    `openai_wire.rs:46-49`, `:69`, `:75`. So the crate parses `tool_calls` off a response
    (`anthropic.rs:477-484`, `openai_wire.rs:485-499`) and then discards the protocol on the way back
    in: the result of that call is re-rendered as bracketed prose inside the next user blob
    (`src/run.rs:7826` and its fifteen siblings), and no `tool_use` or `tool_result` block with a
    correlated id is ever sent. A session's prior turns get the same treatment — `Session::seed`
    (`src/session.rs:868-891`) flattens each one to `[earlier turn] you answered: …`.

    The failure this produces is not an error and there is nothing in a log to find. It is degraded
    instruction following: restating plans, narrating intent instead of acting, and losing that a
    tool has already been called — because a single user message describing the assistant's own
    history is off the distribution every model this crate targets was trained on. **This release
    makes a turn a turn**: an ordered `Vec<Message>` the assembler emits, which each wire maps onto
    its own block types one to one.

    **Task framing stops being the only framing.** `Session::default_contract`
    (`src/session.rs:729-733`) is `TaskContract::workspace(text, root)`, so the operator's typed text
    becomes a contract **goal** and a greeting is structurally a task with a success criterion — and
    the built-in prompt opens "You are an agent working across a repository to meet a stated
    specification" (`src/run.rs:12086`) whatever was typed. It is the same mismatch 0.48.0's `I03`
    fixed in the user block, one level up in the system block, and it largely dissolves once a turn
    is a turn rather than a goal.

    **And `SystemPrompt::Builtin` gains the half 0.45.0 planned and did not ship.** The enum landed
    as `Builtin | Append | Replace` (`src/contract.rs:39-55`), so an embedder who wants a shaped
    agent has two options: write a whole agent prompt from scratch, or accept three sentences naming
    four tools with no tone, no output format and no length rule. `SystemPrompt::Preset` is opt-in
    **by name** and `Builtin` stays the default — 0.45.0's argument that a library must not install
    opinions into someone else's product is not reopened, and an opt-in preset is the opposite of
    installing one.

  business_value: >
    **This is the upstream cause of three limits later entries plan around rather than remove.**
    0.44.0's second cache breakpoint is a byte offset into a user message the assembler rewrites
    every step (`src/provider/mod.rs:521-564`), and it is only safe because `PrefixGuard`
    (`src/run.rs:11027-11062`) refuses to mark a prefix it has not already seen twice; with real
    messages, everything before a boundary is immutable by construction rather than by a guard.
    0.43.0's summarising compaction has no message boundaries to summarise *between* and folds a
    prose blob. And reasoning-content replay is inexpressible in this shape at all — the roadmap
    already records that DeepSeek returns 400 if `reasoning_content` is dropped from a request
    carrying tools, so the connected-vendor release cannot support that vendor until a request can
    hold an assistant turn to put it in.

    **The cost of not doing it compounds with every release that ships against the flat shape.**
    Both wire bodies address `messages[0]` and `messages[1]` by literal index today; every feature
    that touches a request — caching, media, web, effort — has been written against a two-element
    array. Each one added while the shape is wrong is another site to move later, and the count only
    goes up.

    **The break is the point, and it is bounded by a deliberate shim.** `CompletionRequest` is not
    `#[non_exhaustive]` on purpose (`src/provider/mod.rs:450-465`), so its ergonomic is
    `CompletionRequest { system, user, ..Default::default() }` and an added field costs only the
    exhaustive literals — the same break `media` (0.15.0), `model` (0.21.0), `web` (0.22.0),
    `effort` (0.31.0) and `cache_boundary` (0.44.0) each were. `user` is **kept and derived**, and
    that is what keeps the blast radius honest rather than heroic: this repository reads
    `request.user` in **54** places across **20** test files, and **77** files carry an
    `impl Provider for`. An out-of-tree provider that reads `user` and ignores `messages` keeps
    receiving exactly the body it received in 0.48.0 and is honestly non-conversational, in the
    established shape of every "a provider that ignores this field keeps working" field on this type.

  evidence_of_value: >
    Executed in the technique the last eighteen releases used: a discriminating assertion per claim,
    negative controls that must not move, one sabotage per arm of every two-armed claim, and a
    sabotage that fails nothing reported as a finding rather than propped up.

    **The central claim is proven on the wire bytes, not on the neutral request.** Asserting that
    `CompletionRequest::messages` has three entries would pass for a wire that builds the same
    one-message body it always did from them. Every mapping criterion asserts the JSON the wire
    actually sends: `content[]` entries of type `tool_use` with an `id` on the Anthropic body and
    `tool_result` blocks whose `tool_use_id` matches it, `tool_calls[].id` on an assistant message
    and `role: "tool"` messages whose `tool_call_id` matches it on the OpenAI body.

    **The shim is proven by byte-identity against locked strings, in both directions.** A request
    with no messages must produce a body byte-identical to 0.48.0's on all four flavours, and the
    derived `user` must be byte-identical to the string 0.48.0 assembled — `tests/prompt.rs` already
    locks composed prompts as byte-exact constants (`V0440_SINGLE`, `prompt.rs:234`) and this release
    locks the assembled user body the same way. Without both, "collapses to today's body exactly" is
    an intention rather than a fact.

    **Correlation is proven by a mismatch failing.** An id minted for a tool-use block and an id
    carried on its result are asserted to be *the same string*, and the sabotage that changes one of
    them is required to fail a named test — because a transcript where every block carries a
    plausible-looking id that correlates with nothing is exactly the failure a vendor rejects with a
    400 and a reader cannot see.

    **And prompt caching is asserted to still work, not assumed to.** 0.44.0's measured result —
    13,093 of a 13,113-token prompt served from cache — is the number this release must not lose.
    The boundary moves from a byte offset to a message index, and the criterion asserts the marker
    lands on the same content it landed on before, with `PrefixGuard`'s see-it-twice rule intact.

scope:
  included:
  - >
    **`CompletionRequest` gains `messages: Vec<Message>`, and it is what the wires read.** Non-empty
    means the request is a conversation; empty means it is a 0.48.0 request and every wire sends
    exactly the body it sent before. The field is `#[serde(default, skip_serializing_if =
    "Vec::is_empty")]` like every optional field on this type since 0.21.0, so a serialized request
    with no messages is byte-identical to a 0.48.0 one — which is what keeps `Replay`'s cassette key
    (`src/provider/replay.rs:68-69`) valid for a legacy caller.
  - >
    **`Message` is an enum, not a role plus a bag of blocks.** Three variants covering exactly what
    this crate produces: a user turn carrying text, an assistant turn carrying optional text and the
    calls it made, and a batch of tool results. The results are a **batch** and not one message each
    because the Anthropic wire requires every `tool_result` answering one assistant turn to arrive in
    a single user message, and because 0.41.0 dispatches a maximal run of read-only calls together —
    so a step with four parallel reads is one assistant turn and one results message, in the model's
    own call order, which is the order 0.41.0 already folds them back in.
  - >
    **The crate mints its own tool-call ids, and this is the decision that makes the release
    small.** A vendor correlates a `tool_use` id with a `tool_result` id **within one request**, and
    this crate builds that request in full on every step — so the id the vendor originally issued is
    never needed again. `ToolCall` (`src/provider/mod.rs:651-657`) therefore gains **no field**, and
    the **199** `ToolCall { … }` literals across **73** files in this repository are untouched, as is
    every such literal in an embedder's mock. Ids are minted deterministically from the step and the
    call's index in it, so the same transcript re-assembles to the same bytes — which is what a cache
    prefix requires — and they are **nine characters, alphanumeric**, because that is the strictest
    id rule any vendor in the roadmap states (Mistral) and a format that satisfies all of them costs
    nothing to choose now.
  - >
    **The assembler emits messages beside the text it already emits.** `Assembled`
    (`src/context.rs:516-539`) gains a `messages` field; `text` stays exactly what it is and stays
    the source of the derived `user`. The five assembly rules — supersession, invalidation, re-read,
    newest-first fitting, chronological emission (`src/context.rs:588-733`) — are unchanged and
    operate on the same ledger; what changes is that the emission step produces a sequence rather
    than one concatenation. An observation that is a tool result becomes a result block; everything
    else — the memory block, the elision lines, the steering entries — stays user text, because that
    is what it is.
  - >
    **`user` is derived, byte-for-byte, and is not deleted this release.** The run loop fills it with
    the exact string 0.48.0 assembled, so the 54 reads in this repository, the doctests at
    `src/provider/mod.rs:426-443` and `:554-559`, and every out-of-tree `Provider` keep working
    unchanged. It is documented as **derived from `messages` and retained for one release**, in the
    same words the crate uses for every other compatibility affordance, with its removal named as a
    later version rather than left implied.
  - >
    **Both wires map one to one, and neither grows a translation layer.** The Anthropic body
    (`anthropic.rs:137-170`) builds its `messages` array from `request.messages`: an assistant turn
    becomes `content[]` entries of type `text` and `tool_use` carrying `id`, `name` and `input`; a
    results batch becomes one user message of `tool_result` blocks carrying `tool_use_id` and
    `content`. The OpenAI body (`openai_wire.rs:42-77`) builds an assistant message carrying
    `tool_calls[]` with `id`, `type: "function"` and `function.name`/`function.arguments`, and one
    `role: "tool"` message per result carrying `tool_call_id`. The `system` block, the tool schemas,
    `web_key`, `effort_key` and the media parts are untouched in both.
  - >
    **The two cache markers survive the reshape, and the second one is re-expressed.**
    `cache_boundary` is a byte offset into `user` (`src/provider/mod.rs:521-564`) and has no meaning
    once the transcript is a sequence, so the request gains `cache_through: Option<usize>` — the
    number of leading `messages` the caller states are byte-stable — and the wires mark the last
    content block of that message. `cache_boundary` is **retained and documented as applying to the
    derived `user` path only**, ignored when `messages` is non-empty; overloading one field with two
    meanings was considered and rejected as the kind of cleverness a reader decodes at 3am.
    `frozen_prefix` (`src/run.rs:10994-11002`) becomes a message index instead of a byte search, and
    `PrefixGuard` (`:11027-11062`) and `EventKind::CacheMarked` are unchanged — a prefix is still
    marked only after it has been seen twice.
  - >
    **A session's prior turns become real turns, with no schema change.** `Session::seed`
    (`src/session.rs:868-891`) reads `turns.prompt` and `turns.reply`, which are already the two
    halves of a conversation; they become a user message and an assistant message instead of two
    `[earlier turn] …` strings. The same per-entry cap bounds them, so a long conversation is still
    compacted by the assembler rather than by a rule of that module's own.
  - >
    **A conversation is framed as a conversation.** `TaskContract::conversation(root)` is added
    beside `TaskContract::workspace`, and `Session::default_contract` uses it: no success criterion,
    and the operator's words are the first user **message** rather than the contract's `goal`. The
    system block for such a turn does not open "You are an agent working across a repository to meet
    a stated specification". 0.48.0's `I03` fix — one question on a classifying turn instead of two
    that disagree — is preserved exactly and asserted as a negative control, because this release
    touches the same call sites.
  - >
    **`SystemPrompt::Preset`, opt-in by name.** One additive variant on an already
    `#[non_exhaustive]` enum (`src/contract.rs:39-55`), carrying a small named `Preset` enum, and
    `Builtin` stays the default and stays byte-identical. A preset replaces the base description
    exactly where `Replace` does in `compose` (`src/run.rs:11722-11751`), so it composes with
    `Append`, the skill catalogue, the boundary section and the ending in the order already fixed
    there. The set is deliberately small and each one states what it is for; a catalogue of tones is
    not what 0.45.0 declined to ship, and neither is this.
  - >
    **`Replay`'s miss message stops reading a field that may be empty.**
    `src/provider/replay.rs:143-147` formats a miss from `request.system.len()` and the first 120
    characters of `request.user`; with a conversation it reports on the shim rather than on what was
    sent. It reports the message count and the last user text instead.
  - >
    **The stale docstring at `src/provider/mod.rs:580-583` is corrected in this release.** It names
    `web_key`, `effort_key` and `cached_system` as the per-vendor body differences; `cached_user`
    (0.44.0) made that three into four and nobody updated the sentence. Correcting the line this
    release falsifies is a scope item because 0.45.0 paid for finding one of those at sealing time.
  - >
    **The reporting surfaces, updated to describe what now happens.** `docs/CONTRACT.md` (the
    caching section at `:827-894`, the `CompletionRequest` break note at `:1605-1621`, and a new
    section on what a message is and what the derived `user` is for), the crate-root prose in
    `src/lib.rs`, the README, and `CHANGELOG.md` with a migration note for every break named below.
  excluded:
  - >
    **Persisting structured turns, and therefore any resume-side reconstruction.** A resumed run
    restores its ledger from `ledger_observations` (`src/state.rs:2954-2961`), which holds text and
    not tool-call structure. Rebuilding assistant turns from `steps.tool_call` — a rendered string —
    would be a parser against a format nothing guarantees, and storing the structure would be a
    schema change. So a resumed run carries its **pre-resume** history exactly as 0.48.0 carried it,
    as prose in the first user message, and is role-tagged from the resume point forward. This is
    not a regression — it is today's behaviour for that segment — and it is stated in
    `known_limitations` rather than left for a reader to notice.
  - >
    **Any store, schema or event change.** No table, column or index; `CHECKPOINT_FORMAT` stays at
    7. This falls out of the minted-id decision rather than being an aspiration: nothing new needs
    to be durable.
  - >
    **Reasoning-content replay.** `CompletionResponse::reasoning` (`src/provider/mod.rs:827-828`) is
    still never persisted and never re-sent. This release makes replay *expressible* — an assistant
    message is a place to put it — and deliberately does not ship it, because the vendor that
    requires it is a connected-provider release's problem and shipping the carrier and the payload
    together would put two unrelated breaks in one version.
  - >
    **Deleting `user`.** It is derived and retained for one release. Deleting it in the same version
    that adds `messages` would make the reshape and the removal one break that cannot be adopted in
    two steps.
  - >
    **Multi-turn *tool* history for a session's prior turns.** A prior turn's tool calls are not
    replayed as blocks — they were not replayed as anything before, and `turns` holds only the
    prompt and the reply. The prior turn becomes a user message and an assistant message; its
    internal steps stay where they are.
  - >
    **Any change to `Policy`, the sandbox, the store, the tool set, or `Provider`'s method set.** No
    trait method is added, defaulted or otherwise: an out-of-tree provider compiles unchanged and
    reads `user` as before.
  fallback_scope:
  - >
    **The request can express a conversation, and both wires send one.** `Message`, the `messages`
    field, the derived `user`, the two wire mappings, minted ids, and `cache_through`. This is a
    coherent release on its own: it is the one that puts the model back on the distribution it was
    trained on, which is the whole outcome, and everything else here is a consequence of having done
    it.
  - >
    Dropped under pressure, in this order: `SystemPrompt::Preset` first (it is additive, opt-in, and
    nothing depends on it), then the conversational contract framing (a turn being a turn already
    removes most of the mismatch), then the session-seed change (prior turns keep their bracketed
    prose while the current turn is role-tagged), and last the `cache_through` marker — under which
    a conversation is sent unmarked and the caching claim reverts to 0.38.0's system breakpoint
    alone, stated plainly rather than quietly lost. Each stays in the roadmap as named work.

acceptance:
  functional:
  - >
    **F1 — a multi-step run sends a role-tagged transcript.** A run driven to three steps produces a
    request whose `messages` are, in order: a user turn, an assistant turn carrying the calls it
    made, a results batch, an assistant turn, a results batch. Asserted on the captured
    `CompletionRequest` **and** on the body each wire builds from it, because the first alone would
    pass for a wire that flattens them again. Sabotage: have the loop send an empty `messages` and
    fill only `user`, which is today's behaviour, under which this fails and every negative control
    still passes.
  - >
    **F2 — the Anthropic body carries native blocks with correlated ids.** The assistant message's
    `content[]` holds one `tool_use` entry per call with `id`, `name` and `input`; the next user
    message holds one `tool_result` entry per result whose `tool_use_id` **equals** the id on the
    call it answers, asserted as string equality between the two extracted values rather than
    against a literal. Sabotage: mint the result's id independently of the call's, under which the
    two stop matching and only this fails.
  - >
    **F3 — the OpenAI body carries native blocks with correlated ids.** The assistant message
    carries `tool_calls[]` with `id`, `type: "function"` and `function.name`/`function.arguments`,
    and one `role: "tool"` message per result whose `tool_call_id` equals it. The same string-
    equality assertion as F2. Sabotage: emit the results as a plain user message, which is what the
    wire does today, under which the `role: "tool"` assertion fails and only this fails.
  - >
    **F4 — an empty `messages` sends the body that has always been sent.** For all four flavours —
    `Anthropic`, `OpenRouter`, `OpenAi`, `Compatible` — a request with no messages produces a body
    byte-identical to the one 0.48.0 produced, asserted against the locked expected bodies the wire
    test modules already carry (`anthropic.rs:740`, `:771`, `:849`, `:895`; `openai_wire.rs:689`,
    `:733`, `:753`, `:806`, `:846`, `:868`). This is the negative control the whole compatibility
    claim rests on. Sabotage: emit a one-element `messages` array whenever `user` is non-empty,
    under which every one of those tests fails and nothing else does.
  - >
    **F5 — the derived `user` is byte-identical to what 0.48.0 assembled.** Locked as a byte-exact
    constant in the shape `tests/prompt.rs` already uses (`V0440_SINGLE`, `prompt.rs:234`): the same
    run under the same fixture produces the same `user` string it produced before this release,
    character for character, while `messages` is populated beside it. Sabotage: derive `user` by
    joining the messages with a separator instead of reusing the assembled text, under which the
    locked string fails and only this fails.
  - >
    **F6 — a session's prior turns are turns.** A second turn in a session sends the first turn's
    prompt as a user message and its reply as an assistant message; the strings
    `[earlier turn] the operator asked:` and `[earlier turn] you answered:` appear **nowhere** in
    the request. Asserted as an absence and a presence together, because either alone passes for a
    build that sends both. Sabotage: restore `Session::seed`'s bracketed strings, under which the
    absence assertion fails and only this fails.
  - >
    **F7 — the transcript cache marker still lands, on the same content.** A run that has compacted
    marks the message carrying the folded summary and nothing after it: `cache_through` names that
    index, the wire marks the last content block of that message, exactly one such marker exists
    besides the system one, and `EventKind::CacheMarked` fires on the transition and not per step.
    `PrefixGuard`'s rule is asserted intact — a prefix seen once is **not** marked. Sabotage: mark
    on first sight, under which the guard test fails and only that fails; and separately, mark the
    message after the summary, under which the marked content assertion fails and only that fails.
  - >
    **F8 — a conversational turn is not framed as a task, and 0.48.0's `I03` fix is untouched.** A
    turn under `Session::turn` sends a system block that does not contain "working across a
    repository to meet a stated specification" and a first user message that is the operator's words
    — while the negative controls hold: a turn under an explicit `TaskContract::workspace` sends the
    workspace prompt byte-identically, and step 2 of a promoted turn is byte-identical to what this
    build sends today, which is 0.48.0's own F10 control asserted again here because this release
    touches those call sites. Sabotage: route the conversational turn back through
    `TaskContract::workspace`, under which the framing assertion fails and only this fails.
  - >
    **F9 — a preset is opt-in and `Builtin` does not move.** With no `with_system_prompt` call the
    composed system block is byte-identical to this build's; with `SystemPrompt::Preset(p)` the
    base description is that preset's text and everything `compose` appends after it — the skill
    catalogue, the appended text, the framed sections, the ending — is in the same order and the
    same bytes as under `Replace`. Sabotage: make a preset the default, under which the byte-
    identity control fails and only this fails.
  - >
    **F10 — parallel calls in one step are one assistant turn and one results batch, in call
    order.** A step whose completion carries four read-only calls — 0.41.0's batch path — produces
    exactly one assistant message with four `tool_use` blocks and exactly one results message with
    four `tool_result` blocks, correlated pairwise, **in the model's call order and not in
    completion order**, which is the ordering 0.41.0 already guarantees for the folded text.
    Sabotage: emit one results message per call, under which the count assertion fails and only this
    fails; and separately, fold in completion order, under which the ordering assertion fails.
  non_functional:
  - >
    **N1 — no new dependency.** `cargo tree` for the default feature set is unchanged at **402**
    crates on macOS and Linux. Messages are `serde_json` values built by hand, exactly as both wire
    bodies are built today.
  - >
    **N2 — MSRV unmoved.** The crate builds on 1.95 with the toolchain gate CI already runs.
  - >
    **N3 — the break is exactly what is named, and nothing more.** The compile breaks are: an
    exhaustive struct literal of `CompletionRequest` outside this crate (two new fields, the
    documented cost of the type not being `#[non_exhaustive]`) and an exhaustive literal of
    `Assembled`. `SystemPrompt` is already `#[non_exhaustive]`, so its new variant is free; no trait
    method is added or changed, so every `impl Provider` compiles unchanged; `ToolCall`,
    `CompletionResponse`, `ToolSpec` and `Usage` are untouched. `docs/public-api.txt` gains the new
    crate-root items and **the count is stated at plan time as "the enumerated additions only"**,
    because the checker enumerates crate-root re-exports rather than fields or variants and a
    criterion promising a line count has been met in a different form in four of the last ten
    releases.
  - >
    **N4 — no durable state moves.** `git diff main -- src/state.rs` shows **no DDL**: no table,
    column or index, and `CHECKPOINT_FORMAT` unmoved at 7. This is a consequence of minting ids
    rather than storing them, and it is asserted rather than assumed.
  - >
    **N5 — prompt caching does not regress, and the number is re-measured.** A live run through
    OpenRouter against a pinned model repeats 0.44.0's measurement — system breakpoint alone, then
    system plus transcript — and the cache-read figure is recorded in the release record beside
    0.44.0's 13,093 of 13,113. A reshape that quietly stops caching would cost money and fail no
    test, which is why this is a criterion and not a hope.
  - >
    **N6 — 0.41.0's batch, 0.42.0's gate, 0.43.0's fold, 0.44.0's boundary, 0.45.0's prompt,
    0.46.0's default, 0.47.0's chain and 0.48.0's containment are unaffected.** Their suites pass
    unchanged. Specifically: the composed system prompt is still byte-identical across the steps of
    a run and still composed once, and 0.43.0's context-overflow retry still folds and re-asks once
    per step with the messages rebuilt from the folded ledger.
  operational:
  - >
    **O1 — the full suite passes on all three platforms**, on the standing CI matrix including
    0.47.0's `contained (ubuntu, userns restricted)` leg.
  - >
    **O2 — cross-version is unaffected and proven so.** No DDL, so a 0.48.0 store and a 0.49.0 store
    are the same store in both directions, asserted by the existing cross-version suites.
  - >
    **O3 — recorded cassettes are handled explicitly, not discovered.** `Replay` keys on the
    serialized request (`src/provider/replay.rs:68-69`), so a cassette recorded before this release
    misses against a request that now carries messages. Every cassette in the repository is
    re-recorded or its fixture is shown to send no messages, and the changelog tells an embedder
    that their own recordings need the same. A silent miss reported as "no recorded response" is
    the failure this criterion exists to prevent.
  - >
    **O4 — the documentation surfaces agree with the code, in the same release.**
    `docs/CONTRACT.md` describes what a message is, what the derived `user` is for and when it goes,
    which marker applies on which path, and the corrected per-vendor-difference count.
    `src/lib.rs`, the README and `CHANGELOG.md` agree, and `tests/docs_drift.rs` and
    `tests/changelog.rs` pass.

delivery:
  target_mode: published
  environment: >
    crates.io as `io-harness` 0.49.0, GitHub at initorigin/io-harness with the tag `v0.49.0` and a
    Release titled `io-harness 0.49.0`, and docs.rs.
  deployment_method: >
    The standing flow. All work on `feat/0.49.0` off `develop`, committed incrementally as it lands,
    including the sealed UltraShip release record and the hand-appended lock pin. PR into `develop`,
    merged with the PR button. `develop`'s head and tree checked against the tree the gates ran on
    immediately before the release PR is opened. Release PR `develop` into `main`, merged the same
    way. The GitHub Release is cut by `release.yml` —
    `gh workflow run release.yml --ref main -f version=0.49.0` — which takes its notes verbatim from
    the changelog. `cargo publish --locked` by hand afterwards, always last, after both merges and
    the Release exist, with the registry token sourced from the repo-local `.env` in the same shell
    invocation. `develop` synced to `main` fast-forward only at the end. No branch is deleted.
  migrations:
  - >
    **No store migration at all.** No table, column or index is created or altered,
    `CHECKPOINT_FORMAT` is unmoved at 7, and a 0.48.0 store and a 0.49.0 store are the same store in
    both directions.
  - >
    **The compile break: two new fields on `CompletionRequest` and one on `Assembled`.** An
    exhaustive struct literal of either stops compiling; `..Default::default()` keeps working, which
    is what the type's own documentation has advised since 0.15.0 and what every construction site
    in this repository already uses. The remedy is one line per site.
  - >
    **The behaviour change, and it is the release.** A request the crate's own loop builds now
    carries a role-tagged conversation with native tool blocks where it previously carried one user
    message of prose. A built-in provider sends the new shape; an out-of-tree provider that reads
    `user` receives the same prose it received in 0.48.0 and is unaffected. A model's *answers* will
    differ — that is the outcome, not a side effect — and any embedder asserting on exact model
    output will see it.
  - >
    **Recorded `Replay` cassettes must be re-recorded.** The cassette key is the serialized request,
    which now carries messages for any run driven by this crate's loop. A stale cassette misses
    rather than returning something wrong, so the failure is loud; the changelog says so and names
    re-recording as the fix.
  - >
    **`CompletionRequest::user` is derived and deprecated in prose, not in code.** It is retained
    for one release, documented as derived, and its removal is named as a later version. No
    `#[deprecated]` attribute this release: a warning on a field 54 sites in this repository read
    would be noise before the replacement has shipped once.
  observability:
  - >
    `EventKind::CacheMarked { through_step, prefix_bytes }` is unchanged in shape and still fires on
    the transition rather than per step; `prefix_bytes` now measures the marked messages' bytes,
    which is the same quantity it always reported about the marked prefix.
  - >
    No new event, no new table and no new column. The request shape is visible where it has always
    been visible — in `provider_calls` and in a `Record`ed cassette — and a trace reader learns
    nothing new to read them.
  rollback: >
    A published version cannot be recalled; the forward fix is 0.49.1 and `cargo yank --version
    0.49.0` is the escape hatch, leaving 0.48.0 as what `cargo install` resolves. Reverting the
    behaviour needs no downgrade: a caller constructing its own `CompletionRequest` and leaving
    `messages` empty gets 0.48.0's body from every built-in wire, byte for byte, which is exactly
    what F4 asserts. There is no runtime switch on the crate's own loop, deliberately — a knob that
    sends the old shape would be a way to ask for this release and quietly not get it.

dependencies:
  products: []
  services:
  - >
    crates.io and GitHub Actions for the release itself, as every version.
  - >
    **One live provider call is required, for N5 only.** The caching measurement is a claim about a
    vendor's own counter and cannot be made against a fixture. Every other claim here is about bytes
    this crate builds and is proven from a captured request or a constructed body, with no network.
  - >
    **A pinned model for N5.** 0.38.0's trap applies: read the answering model from
    `CompletionResponse::model` rather than from the environment variable, because an OpenAI-family
    model caches by itself and would produce a confident false pass.
  human_approvals:
  - >
    **The reshape ships as one release rather than a carrier version and a consumer version.**
    Decided at specification time, 2026-08-11, with the fallback scope on record as the escape.
  - >
    **`user` is kept and derived for one release rather than removed now.** Decided at
    specification time, 2026-08-11.
  - >
    **The crate mints its own tool-call ids rather than storing the vendor's.** Decided at
    specification time, 2026-08-11. This is what removes the schema change and the 199-site
    `ToolCall` break, and it rests on ids being correlated within a request rather than across
    requests.
  - >
    **`delivery.target_mode` is `published`.** Decided at specification time, 2026-08-11.
  - >
    The PR, both merges, the Release and the publish are pre-authorised for this version under the
    standing flow.

resource_profile:
  complexity: large
  uncertainty: high
  likely_cost_drivers:
  - >
    **Both wire bodies are addressed by literal index today** (`anthropic.rs:166-168`;
    `openai_wire.rs:46-49`, `:69`, `:75`), and four features write into those positions — `web_key`,
    `effort_key`, `cached_system`, `cached_user`. Rebuilding the array while keeping all four
    working and their tests byte-identical is the largest single piece of work here.
  - >
    **The assembler produces one string today and every consumer expects one string.**
    `Assembled.text` feeds the user prompt, the boundary search, the overflow retry and the tests.
    Emitting a sequence beside it without changing what the string contains is the constraint that
    makes F5 assertable, and it is easy to break by accident.
  - >
    **The test surface is wide and mostly indirect.** 64 files under `tests/` reference
    `CompletionRequest` and 20 read `request.user`; `tests/prompt.rs` alone is 1,195 lines of
    byte-exact prompt locks. Most should not need to change — that is what the shim is for — and any
    that does is a decision to be stated, not a sweep.
  - >
    **A live caching measurement costs a real call and can mislead.** Budget for the pinned model,
    the two-call baseline shape 0.44.0 used, and reading the answering model off the response.
  preferred_tools:
  - >
    `cargo nextest` for the suite, `cargo test --doc` for the doctests, and the wire files' own
    `#[cfg(test)]` modules for every body assertion — that is where all body-shape tests already
    live and no file under `tests/` asserts a wire body.
  - >
    A captured-request fixture for the neutral claims and a constructed body for the wire claims,
    never a live vendor for anything but N5.
  constraints:
  - >
    **No new runtime dependency.** `cargo tree` flat at 402.
  - >
    **MSRV 1.95, edition 2021, Apache-2.0.** Unchanged.
  - >
    **Every version stays 0.x.x.** A break is a minor bump here; no 1.0.0 is planned or implied by
    this release.
  - >
    **`Turn` is already a public crate-root type** (`src/state.rs:1358`, a session-turn row), so the
    roadmap's `Vec<Turn>` phrasing cannot be taken literally. The new type is `Message`; `Message`,
    `Role`, `Block` and `Content` are all free at the crate root today.
  - >
    **`docs/CONTRACT.md` is a checked-in surface**, and so are the README, the changelog and the
    crate-root prose. They change in this release, not in the next one.

risks:
- >
  **The derived `user` and the emitted messages drift apart.** They are two renderings of one
  ledger, and a change to one that misses the other would send a conversation that disagrees with
  its own shim — invisible to any test that reads only one of them. Mitigations: both are derived
  from the same emission pass rather than built independently; F5 locks the string byte-exactly and
  F1 asserts the sequence, so a drift fails one of them.
- >
  **A vendor rejects a transcript this crate builds.** An assistant turn with a tool call that has
  no matching result, a result with no matching call, or an empty assistant message are all 400s on
  at least one wire. Mitigations: the results batch is emitted in the same pass as the assistant
  turn that owns it, so one cannot exist without the other; F2 and F3 assert the correlation as
  string equality; and the ids are minted to the strictest known format rather than the loosest.
- >
  **Prompt caching quietly stops working.** The marker moves from a byte offset to a message index,
  and a marker on the wrong block costs money while failing nothing. Mitigations: F7 asserts the
  marked content and the guard's see-it-twice rule, and N5 re-measures the live number rather than
  reasoning about it.
- >
  **A model's behaviour changes in a way an embedder's own tests assert against.** That is the
  release's purpose and it is still a break in practice. Mitigation: the changelog names it as a
  behaviour change in the migration note, beside the `Replay` re-recording note, rather than listing
  only the compile breaks.
- >
  **The reshape is large enough to want to carry passengers.** Reasoning replay, deleting `user`,
  persisting structured turns and a preset catalogue are all adjacent and all excluded. Mitigation:
  each is named in `excluded` with the version or the condition it belongs to, and the fallback
  scope is drawn so that shedding work is a decision rather than a rewrite.

open_questions:
- >
  Whether `cache_boundary` should be `#[deprecated]` in this release or only documented as applying
  to the derived path. The contract's position is documented-only: a deprecation warning on a field
  the crate's own doctests set would be noise before the replacement has been used once in the wild.
- >
  Whether a resumed run should eventually reconstruct its pre-resume transcript structurally, which
  needs the tool calls to be durable and is therefore a schema change. Excluded here; the honest
  interim is that a resumed run's earlier history is prose, which is what it has always been.
- >
  Whether the assistant turn should carry `reasoning` when a vendor requires it, or whether that
  belongs entirely to the connected-provider release. Deferred there; this release only makes the
  place to put it exist.
- >
  How many presets, and which. The contract commits to "small and each one states what it is for"
  rather than to a list, because the argument 0.45.0 settled is about opinions being opt-in, not
  about a particular tone existing.
- >
  Whether the crate should ever send a message sequence to an out-of-tree provider by way of a
  defaulted trait method rather than a field. Not attempted: adding a method to an externally
  implementable trait is a break for the one extension point this crate has, and a field an
  implementor may ignore is the shape every other request-side capability here already uses.
released_at: 2026-08-11T18:20:00Z
mode: published
delivered: >
  A turn is a turn. `CompletionRequest` carries an ordered `messages` transcript — user turns,
  assistant turns holding the calls the model made, and batches of results answering them — and each
  built-in wire maps it onto that vendor's own block types one to one: `tool_use` and `tool_result`
  on Anthropic, `tool_calls` and `role: "tool"` messages on the OpenAI wire. Through 0.48.0 the
  crate parsed the tool protocol off a response and then discarded it on the way back in, so a run's
  own history reached the model as prose narrating the assistant's past actions in the third person
  — off the distribution every model this crate targets was post-trained on, producing no error and
  nothing in a log, only degraded instruction following.

  Two consequences ship with it. A session's earlier turns arrive as their own user and assistant
  messages instead of `[earlier turn] you answered: …` inside somebody else's, and a classifying
  turn is no longer told it has a specification to meet and a success criterion to satisfy when it
  carries `Verification::None` — the same mismatch 0.48.0's `I03` fixed one block lower down. Plus
  `SystemPrompt::Preset`, opt-in by name, for an embedder who wants a shaped agent without writing a
  whole prompt.

  **The decision that kept the release small is that the ids are minted rather than remembered.** A
  vendor correlates a `tool_use` id with the `tool_result` answering it inside one request, and this
  crate rebuilds the whole request every step, so the id the vendor issued is never needed again.
  `ToolCall` gained no field — 199 literals across 73 files untouched — and `src/state.rs` has no
  DDL at all.
