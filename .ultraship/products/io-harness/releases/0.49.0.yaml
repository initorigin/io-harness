known_limitations:
- >
  **The record is sealed before the crates.io upload**, which follows the `develop` → `main` merge
  and the GitHub Release. `mode: published` states the authorized target; the flow makes it true.
- >
  **A resumed run's pre-resume history is prose, exactly as it was in 0.48.0.** The ledger a resume
  restores holds observation text and no tool-call structure, and nothing durable was added, so the
  steps a resumed run did not itself drive stay in the first user message. Everything from the
  resume point on is role-tagged. Reconstructing them structurally needs the calls to be durable and
  is a schema change this release excluded.
- >
  **A step whose results do not line up with the calls it made is sent as prose too.** Correlating
  them positionally would answer the wrong call, so the loop falls back rather than guessing. It is
  not silent — `messages` is empty or short and a reader can see it.
- >
  **`CompletionRequest::user` is retained for one release and is derived.** It will be removed in a
  later version. Until then a request has two renderings of one emission, and only the fact that
  both come from the same pass keeps them from disagreeing.
- >
  **On the OpenAI wire only a `role: "user"` message is ever marked.** An assistant message's
  content is `null` whenever the turn was a bare tool call, and whether that wire carries a
  `cache_control` on a `role: "tool"` message through to the vendor behind it is not something this
  crate can assert. Marking less costs a smaller cache hit; marking something the vendor drops would
  cost a cache write on every step. So a boundary falling on a results batch marks the user message
  before it, and the transcript's marked span is asserted against the byte offset rather than
  assumed.
- >
  **A CRITERION MET IN A DIFFERENT FORM, stated rather than glossed.** The scope named a
  `TaskContract::conversation(root)` constructor beside `TaskContract::workspace`. It was **not
  added**: that constructor already defaults to `Verification::None` (`src/contract.rs:470`) and the
  operator's words already reach the model as the first user text through
  `conversational_user_prompt`, so the new one would have been byte-identical to the old — a synonym
  rather than an affordance. The substance of the item, that a conversation is not framed as a
  specification, landed where it is actually read: the classifying turn's system block.
- >
  **A SECOND CRITERION MET IN A DIFFERENT FORM.** O3 required every cassette in the repository to be
  re-recorded. None needed it and none exists to re-record — the checked-in fixtures are store
  databases, and every recording in the suite is made in-test. What the criterion was for, that a
  stale recording must not silently miss, is delivered by `Replay`'s key excluding the transcript
  and is asserted in both directions.
- >
  **A session turn's flat prompt changed wording.** The seed's `[earlier turn] the operator asked:`
  and `[earlier turn] you answered:` became `[operator]` and `[agent]`, because the attribution
  moved into the message's role. A program parsing the old wording out of a prompt will not find it.
  Two existing tests changed with it, each carrying the sentence saying why.
- >
  **The single-file loop sends no transcript.** It drives one tool over one file and has no
  observation ledger to build one from, so it is byte-identical to 0.48.0 on the wire. Not a
  regression and not a gap this release set out to close.
- >
  **Reasoning replay is expressible now and is still not shipped.** An assistant message is a place
  to put `CompletionResponse::reasoning`, which remains never persisted and never re-sent. The
  vendor that requires it belongs to a later release, and shipping the carrier and the payload
  together would have put two unrelated breaks in one version.
