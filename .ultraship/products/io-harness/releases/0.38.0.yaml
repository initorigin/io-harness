product: io-harness
version: 0.38.0
status: planned
release_type: minor

outcome:
  user_can: >
    Run a long session, or a long run, without paying full price for the part of the request that
    never changes.

    Every completion this crate makes carries the same three things ahead of anything the model has
    not seen before: the system instructions, the skill catalogue folded into them, and the JSON
    schema of every tool on offer. `src/run.rs:3834` builds that block once per turn and
    `src/run.rs:5415` hands the identical string to every step of the loop, so a twenty-step run
    sends it twenty times and a fifty-turn session sends it fifty times. The vendors have offered to
    serve a repeated prefix from their own cache for two years, at roughly a tenth of the price of
    reading it fresh; this crate has read the counters back since 0.18.0
    (`Usage::cache_read_tokens`, `src/provider/mod.rs:616`) and prices them since the same release
    (`src/pricing.rs:280`). What it has never done is ask. Nothing in the codebase writes
    `cache_control`, so the counter is structurally zero and the pricing path for it has never
    executed against a real invoice.

    0.38.0 asks. The Anthropic body marks the end of its `system` block as a cache breakpoint, and
    because that wire orders the request tools first and system second, one marker covers both the
    tool schemas and the instructions. The OpenRouter body carries the same marker in the shape that
    wire spells it. Nothing else about either request moves.

    What an operator sees is the counter they already have. `cache_read_tokens` on the run summary
    stops being zero from the second call of a run onward, the derived cost of a long session falls,
    and not one line of the conversation is dropped to achieve it — this is the opposite of
    compaction, which buys the same money by sending the model less.

    What does not change: no public item is added, removed or altered, no table is created or
    migrated, `CHECKPOINT_FORMAT` does not move, and a request that reaches OpenAI or any
    OpenAI-shaped endpoint through `Compatible` is byte-identical to the one 0.37.0 sent.

  business_value: >
    The crate's own accounting says this is the largest unclaimed saving it has. A run's request is
    the fixed block plus what the run has observed, and `ContextBudget` already caps the second half
    at 24,000 tokens by default (`src/context.rs:210`) precisely because it grows. The first half
    does not grow and is never free: it is re-read, and re-billed, on every single call the crate
    makes. The crate's own price table puts a cached read at a tenth of a fresh one and a cache
    write at 1.25× (`src/pricing.rs:353`), so the block pays for itself on its second use —
    1.25 + 0.1 against 2.0 — and every use after that is a ninety-percent discount on that part of
    the request.

    There is a second reason and it is about the product's own claim. `product.yaml` states as a
    success measure that "a finished run's cost is reconstructable per model from stored counts
    alone, including cache reads, cache writes, and any per-request provider charge". The columns
    exist, the pricing arithmetic exists, and the reconciliation of Anthropic's cache accounting
    against the OpenAI wire's was written and commented in 0.18.0
    (`src/provider/anthropic.rs:633`). None of it has ever run against a non-zero number, because
    the crate never asks for a cache. A capability that is fully built, fully priced and never
    exercised is not a capability; this release is what turns three releases of accounting work into
    a figure on an invoice.

    The consumer this matters to first is io-cli, whose transcript is a session and whose sessions
    are long by construction. It cannot fix this itself: the request body is built inside
    `src/provider/`, an embedder never sees it, and there is no field on `CompletionRequest` that
    would let one ask. As with 0.37.0's greeting list, the gap is in the library and only the
    library can close it.

  evidence_of_value: >
    Executed, in the technique the last eight releases used: a pair that must differ, a negative
    control that must not, one sabotage per arm of every two-armed claim, and a sabotage that fails
    nothing reported as a finding rather than propped up.

    The request claim is proven on the body, where it is deterministic. The Anthropic body carries
    exactly one breakpoint and it sits at the end of `system`; the OpenAI and `Compatible` bodies
    carry none and are asserted equal to the 0.37.0 body key for key, which is the negative control
    that stops the marker leaking to a vendor that would reject it.

    The saving claim is proven live, because a body test cannot prove a vendor honoured anything.
    Two consecutive completions are made through OpenRouter — the one provider in this checkout with
    real credentials — against a model whose vendor caches, with a system block deliberately over
    the vendor's minimum cacheable length. The discriminating assertion is on the second call:
    `cache_read_tokens` greater than zero, and greater than the first call's. The control is the
    identical pair with the marker suppressed, which must report zero on both — an implementation
    that emitted the marker and was ignored, and one that never emitted it, are indistinguishable
    without that arm.

    The accounting claim is proven where the money is, not where the counter is. The live pair's
    stored `provider_calls` rows are priced through the existing table and the cached tokens are
    charged at the cache rate rather than the input rate, which is the first time
    `src/pricing.rs:280` has ever executed against a non-zero cache count.

    And the no-change claim is proven by absence, asserted rather than described:
    `docs/public-api.txt` is byte-identical, `ADDED_SINCE_0_22_0` is unchanged,
    `CHECKPOINT_FORMAT` is asserted unmoved, and the cross-version job passes both directions with
    no new name fed to it.

scope:
  included:
  - >
    **One cache breakpoint on the Anthropic body, at the end of `system`.**
    `src/provider/anthropic.rs:144` sends `"system": request.system` as a bare string; it becomes a
    one-element array of a text block carrying `cache_control: {"type": "ephemeral"}`. Anthropic
    orders a request's cacheable prefix tools-then-system-then-messages, so a single breakpoint after
    `system` covers **both** the tool schemas and the instructions. One marker, not two: a change to
    the tool list invalidates everything after it in that order anyway, so a second breakpoint on the
    last tool would buy a cache entry that can never outlive the one after it.
  - >
    **The same marker on the OpenRouter body, in the shape that wire spells it.**
    `src/provider/openai_wire.rs:47` sends `{"role": "system", "content": request.system}`; for
    `WebFlavor::OpenRouter` the content becomes an array of one text part carrying the same
    `cache_control` object. This follows the exact precedent of `web_key` (0.22.0) and `effort_key`
    (0.31.0) at `src/provider/openai_wire.rs:55` and `:61` — a per-vendor difference resolved inside
    the shared body builder, absent entirely when it does not apply, so the shared body stays shared.
  - >
    **OpenAI and `Compatible` send nothing, and their bodies stay byte-identical.** Both reach
    `openai_wire::body` with `WebFlavor::OpenAi` (`src/provider/openai.rs:153`,
    `src/provider/compatible.rs:355`). OpenAI caches a repeated prefix automatically with no
    request-side control, so there is nothing to ask for; `Compatible` is 21 endpoints this crate
    does not control, and an unknown body key is a 400 on an unknown number of them. New surface
    starts closed — 0.35.0's design answer, applied again.
  - >
    **No public API change of any kind.** No new type, no new field on `CompletionRequest` or
    `CompletionResponse`, no new `EventKind` variant, no new `Provider` method. The marker is
    computed from what the request already carries, inside the body builder that already exists.
    `docs/public-api.txt` is byte-identical after this release, which is the assertion, not the
    aspiration.
  - >
    **No store change.** No table, no column, no index, `CHECKPOINT_FORMAT` unmoved,
    `ADDED_SINCE_0_22_0` unchanged. The counters this release makes non-zero
    (`provider_calls.cache_read_tokens`, `.cache_write_tokens`) have been columns since 0.18.0
    (`src/state.rs:2935`).
  - >
    **The honest limits, in `docs/CONTRACT.md` rather than discovered by an operator.** A prefix
    below the vendor's minimum cacheable length is not cached and the marker is inert — silently, by
    the vendor, with no error. The entry expires on the vendor's own clock and a miss is invisible in
    the response. A prefix used exactly once costs 1.25× rather than 1.0×, which is the accepted cost
    and is named with its break-even. OpenAI and `Compatible` send no marker. What the vendor
    actually did is readable only in `Usage::cache_read_tokens`, which is why this release changes no
    other observable.
  - >
    **Documentation as part of the release:** `docs/guide/providers.md` gains the caching section
    with the break-even arithmetic and the per-vendor table; `docs/CONTRACT.md` gains N3's bound;
    `CHANGELOG.md` gains the entry, with **no** `*Migration:*` note because nothing breaks;
    `README.md` where it describes what a request carries. **No new guide page and therefore no
    `GUIDES`/`CAPABILITIES.md` bookkeeping** — providers already have a page, which is the 0.31.0,
    0.36.0 and 0.37.0 precedent.
  - >
    **The 0.41.0 roadmap entry and its iteration record ride this release's branch.**
    `US-IO-HARNESS-0.41.0-I01` and the roadmap entry it added were written before this release opened
    and are uncommitted on `develop`. They are carried on `feat/0.38.0` and committed with it, the
    same way 0.37.0's plan output rode `feat/0.37.0`. They change no code and no released version.
  excluded:
  - >
    **A breakpoint anywhere in the observation log, and this is the release's main scope decision.**
    `src/context.rs:413` re-derives what the model sees on every turn: a later observation of the
    same kind and target supersedes an earlier one, a write invalidates an earlier read of that path,
    an invalidated read is re-read at assembly time and its text replaced, and what does not fit the
    ceiling is turned into a stub. Earlier bytes therefore change between turns by design. A cache
    breakpoint requires a byte-identical prefix, so marking the transcript would miss on nearly every
    turn and bill each miss as a cache **write** at 1.25× — it would cost money rather than save it.
    This is not a deferral for effort reasons; it is that the assembler and prefix caching want
    opposite things, and reconciling them is a release about the assembler.
  - >
    **A field on `CompletionRequest` naming a stable boundary inside `user`.** There is a genuinely
    stable head — `workspace_user_prompt` (`src/run.rs:9927`) emits goal, constraints, criterion and
    project before the observations — but it is a few hundred tokens against the thousands in the
    tool schemas and skill catalogue already covered, and a provider cannot see the boundary in an
    opaque `String`. Naming it would cost a public field for a marginal extension of a prefix that is
    already cached. Recorded in `open_questions` rather than dropped.
  - >
    **Any switch, flag or config key to turn caching off.** It would be a knob for a case nobody has
    reported, on a change whose worst outcome is a one-time 25% surcharge on one block. An operator
    whose endpoint rejects the key already has the answer: `Compatible` never sends it.
  - >
    **An extended cache lifetime.** Longer-lived cache entries are a vendor beta, a header, and a
    different write price. The default lifetime already covers a run's steps and a conversation's
    turns; anything longer is a decision about how long an operator's thinking pause is, which is not
    this crate's to make.
  - >
    **Making the context assembler prefix-stable.** The real remaining saving and a different
    release. Named in `open_questions` so it is not lost.
  - >
    **Any change to how usage is read back.** The parsers at `src/provider/anthropic.rs:658` and
    `src/provider/openai_wire.rs:307` already read the cache counters and are not touched. If the
    live evidence shows a counter this crate reads as zero where the vendor charged for a write, that
    is stated as a limitation, not fixed by inference — inferring it would invent a number the
    invoice does not contain, which is the rule that comment already states.
  fallback_scope:
  - >
    The Anthropic breakpoint alone, with `openai_wire` untouched in every flavour. The headline still
    holds in full — the fixed block stops being re-billed on the vendor that charges most for it,
    `cache_read_tokens` stops being zero, and the accounting path executes against a real number —
    and what drops is the OpenRouter shape, which is the half whose wire behaviour this crate does
    not own. Live evidence would then need an Anthropic key, which this checkout does not have, so
    the fallback also converts F4 from live to a recorded blocker rather than pretending otherwise.

acceptance:
  functional:
  - >
    **F1 — the Anthropic body carries exactly one breakpoint, in the right place.** A body test on a
    request with a system string, a user string and two tools. Assertions: `body["system"]` is an
    array of one object whose `type` is `text`, whose `text` equals `request.system` unchanged, and
    which carries `cache_control.type == "ephemeral"`; the `tools` array carries **no**
    `cache_control` on any entry; the count of `cache_control` occurrences anywhere in the body is
    exactly **one**. The last assertion is the one that matters — it fails both the implementation
    that marks nothing and the one that marks everything it can reach.
  - >
    **F2 — the OpenAI and `Compatible` bodies did not move.** The body built by
    `openai_wire::body(model, &request, WebFlavor::OpenAi)` is asserted equal, as a whole JSON value,
    to the body 0.37.0 built for the same request — the top-level key set is already pinned this way
    at `src/provider/openai_wire.rs:740`, and this extends it to the message contents. `"content"`
    for the system message is asserted to still be a bare string, not a parts array. **This is the
    negative control for F3**: an implementation that marks the shared body unconditionally passes
    F3 and fails here, and it is the failure that would put an unknown key in front of 21 endpoints.
  - >
    **F3 — the OpenRouter body carries the marker in that wire's shape.** Same request,
    `WebFlavor::OpenRouter`. Assertions: the system message's `content` is an array of one part whose
    `type` is `text`, whose `text` equals `request.system` unchanged, carrying
    `cache_control.type == "ephemeral"`; the user message's content is untouched; and — the
    discriminating pair with F2 — the two flavours' bodies differ **only** in that one value, asserted
    by comparing them with the system message removed from both.
  - >
    **F4 — the vendor honours it, measured live, with the control that makes the measurement mean
    something.** Through OpenRouter, against a model whose vendor caches, with a system block
    deliberately over the vendor's minimum cacheable length: two consecutive completions with an
    identical system block. Assertions on the second: `cache_read_tokens` greater than zero and
    covering the bulk of the block. **The control is the identical pair with the marker suppressed**,
    which must report zero on both calls — without it, a run against an OpenAI-family model that
    caches automatically would "prove" a marker that was never read. The model that actually answered
    is recorded from `CompletionResponse::model` rather than assumed from the slug requested, and
    both runs' raw counts go into the record as measured numbers. This is a live check, so it is an
    `examples/` fixture with `required-features`, in the shape `documents_live` and `media_git_live`
    already use — never a test the three-OS matrix runs, and never a wall-clock assertion.
  - >
    **F5 — the cached tokens are priced as cached.** F4's stored `provider_calls` rows are read back
    through `Store::provider_calls` and priced through `src/pricing.rs` against a table entry with
    distinct input and `cache_read` rates. Assertion: the derived cost of the second call is strictly
    below the first, and equals the figure computed by hand from the stored counts. The sabotage sets
    the table's `cache_read` equal to its `input`, under which the two costs match and this named test
    fails — which proves the assertion reads the cache rate rather than merely reading a smaller
    number.
  - >
    **F6 — nothing else moved, asserted rather than assumed.** `docs/public-api.txt` is byte-identical
    to 0.37.0's and `tests/public_api.rs` passes; `ADDED_SINCE_0_22_0` is unchanged and
    `tests/cross_version.rs` passes in both directions against the pinned 0.29.0 generator;
    `CHECKPOINT_FORMAT` is asserted unmoved; `tests/changelog.rs` finds no `**BREAKING` entry for
    this version.
  non_functional:
  - >
    **N1 — no new dependency.** `cargo tree` on macOS and Linux still reads **402** lines. The marker
    is two `serde_json` objects built where the body is already built.
  - >
    **N2 — zero breaks, and the assertion is the byte-identical `docs/public-api.txt`.** No public
    type gains a field, no signature moves, no item is removed. `CompletionRequest` and
    `CompletionResponse` are untouched, which matters more than it looks: verified at
    `src/provider/mod.rs:450` and `:675`, **neither carries `#[non_exhaustive]`** — they are plain
    `Default`-deriving structs, so an exhaustive struct literal or exhaustive destructuring outside
    this crate compiles today and would break the moment either gained a field, with an ordinary
    missing-field error rather than the `E0639` a non-exhaustive type would raise. Leaving both alone
    is therefore what makes this release cost a consumer nothing, and any implementation that reaches
    for a field on the request has turned a zero-break release into a breaking one.
  - >
    **N3 — the honest limits are where a reader finds them.** `docs/CONTRACT.md` states: a prefix
    below the vendor's minimum cacheable length is silently not cached and the marker is inert; a
    cache entry expires on the vendor's clock and a miss is reported only as the absence of
    `cache_read_tokens`; a prefix used exactly once is billed at the write premium rather than the
    input rate, with the break-even stated from the crate's own price table (1.25 + 0.1 against 2.0,
    so from the second use); OpenAI and `Compatible` send no marker and rely on whatever the endpoint
    does by itself; and this crate declares a cache, it does not operate one.
  - >
    **N4 — a counter this crate cannot see is stated, not inferred.** `openai_wire` sets
    `cache_write_tokens` to zero by construction (`src/provider/openai_wire.rs:310`) because that
    wire reports no write counter. If F4's live evidence shows OpenRouter charging a write premium
    the crate records as zero, the resulting under-report of a cached run's cost is written into
    `known_limitations` with the measured figures and into `docs/CONTRACT.md` — it is not closed by
    estimating the write from the prompt length.
  - >
    **N5 — the request is unchanged for everything that does not ask.** A body built for OpenAI, for
    `Compatible`, or by any `Provider` implemented outside this crate is what 0.37.0 built, which F2
    asserts for the two in-tree cases and which holds for the out-of-tree case because no trait
    method and no request field changed.
  operational:
  - >
    **O1 — the three-OS matrix is green** on the commit being released, including the MSRV 1.95 job,
    with no test skipped silently on Windows and no live fixture on the matrix path. Any
    source-reading test normalises line endings, and no path is joined from a slash-bearing literal.
  - >
    **O2 — docs.rs builds**, proven by running the nightly job's exact command
    (`RUSTDOCFLAGS="--cfg docsrs -D warnings" cargo +nightly doc --all-features --no-deps`) before
    the release PR is opened, never inferred from a stable `cargo doc`. It has caught something in
    four of the last five releases.
  - >
    **O3 — `cargo package --locked` succeeds** on a clean tree and the packaged crate compiles, run
    after a `cargo clean`. Every local build and test runs with `CARGO_PROFILE_DEV_DEBUG=0
    CARGO_PROFILE_TEST_DEBUG=0`, with `df -h .` before and between build steps, and
    `cargo build --all-features --examples` before any `--lib --tests` run or sabotage.

delivery:
  target_mode: published
  environment: >
    crates.io as `io-harness` 0.38.0, GitHub at initorigin/io-harness with the tag `v0.38.0` and a
    Release titled `io-harness 0.38.0`, and docs.rs.
  deployment_method: >
    The standing flow. All work on `feat/0.38.0` off `develop`, committed incrementally as it lands,
    including the sealed UltraShip release record, the hand-appended lock pin, and the carried
    0.41.0 roadmap entry with its iteration record. PR into `develop`, merged with the PR button.
    `develop`'s head is checked against the tree the gates ran on immediately before the release PR
    is opened — 0.37.0 was interrupted by two Dependabot merges landing above the feature merge, and
    two more (`base64` 0.23.0, `rust_xlsxwriter` 0.97.0) are already on `develop` above `main` at the
    time this contract is written. Release PR `develop` into `main`, merged the same way. The GitHub
    Release is cut by `release.yml` — `gh workflow run release.yml --ref main -f version=0.38.0` —
    which takes its notes verbatim from the changelog. `cargo publish --locked` by hand afterwards,
    always last, after both merges and the Release exist. `develop` synced to `main` fast-forward
    only at the end. No branch is deleted.
  migrations:
  - >
    None. No table is created or altered, no index is added, no column is added, `CHECKPOINT_FORMAT`
    is unmoved, and `ADDED_SINCE_0_22_0` gains no name. A 0.38.0 store and a 0.37.0 store are the
    same store.
  - >
    No public break. No item is added, removed or altered; `docs/public-api.txt` is byte-identical.
  - >
    One behaviour change that is not a compile break and must be read as one: requests to Anthropic
    and to OpenRouter carry a body key they did not carry before, and the first call of a run against
    those vendors is billed at the cache-write rate for the fixed block rather than the input rate.
    An operator comparing a single-call invoice line against 0.37.0 will find it ~25% higher on that
    block; from the second call it is ~90% lower. Stated in the changelog as loudly as the saving.
  observability:
  - >
    `Usage::cache_read_tokens` and `Usage::cache_write_tokens` stop being structurally zero on the
    two vendors that are asked. No new event, no new query and no new field: the figures surface
    through `Store::run_summary` and `Store::provider_calls` exactly where they already do, which is
    the point — an operator sees the effect where they already look.
  - >
    The derived cost of a run reflects the cache rates through the existing `src/pricing.rs` path,
    which this release is the first to execute against a non-zero cache count.
  rollback: >
    A published version cannot be recalled; the forward fix is 0.38.1 and `cargo yank --version
    0.38.0` is the escape hatch, leaving 0.37.0 as what `cargo install` resolves. Reverting is
    unusually cheap here: there is no schema change, no public API change and no stored artefact
    whose shape depends on this release, so a consumer pinning back to 0.37.0 keeps every database,
    every checkpoint and every ledger row untouched and loses only the marker on two vendors' request
    bodies. Cached prefixes held by a vendor expire on their own clock and require no action.

dependencies:
  products: []
  services:
  - >
    crates.io and GitHub Actions for the release itself, as every version.
  - >
    OpenRouter, with the real credentials this checkout holds, for F4's and F5's live evidence. It is
    the only provider here with a working key — the Anthropic and OpenAI entries in `.env` are empty
    placeholders — so the live arm runs through OpenRouter against a model whose vendor caches, and
    the model that actually answered is recorded rather than assumed.
  human_approvals:
  - >
    The owner has pre-authorised the PR, both merges, the Release and the publish for this version.
    Nothing here needs a second decision.

resource_profile:
  complexity: small
  uncertainty: medium
  likely_cost_drivers:
  - >
    The code is small and lands in two files that already have the exact precedent for it —
    `web_key` and `effort_key` in `src/provider/openai_wire.rs` are per-vendor body differences
    resolved in the shared builder, and this is a third. The body tests are cheap and deterministic.
  - >
    The uncertainty is entirely on the wire, not in the crate. What a vendor requires for a prefix to
    be cacheable — the minimum length, where a breakpoint may sit, how the OpenRouter translation
    treats a marker on a system part — is knowable only by making real calls and reading the counters
    back. Budget for the live fixture and for at least one round where the marker is emitted, accepted
    and produces zero cached tokens because the prefix was too short.
  - >
    Two negative controls designed before the code, not after: F2's byte-identical OpenAI body, and
    F4's marker-suppressed live pair. F5's sabotage (cache rate set equal to input rate) is the third.
  - >
    No public item is added, so none of trap 62's three-files-per-item cost applies and
    `docs/public-api.txt` is not touched at all.
  preferred_tools:
  - >
    The existing body tests in `src/provider/anthropic.rs` and `src/provider/openai_wire.rs`, which
    already assert exact JSON shapes for the web and effort keys. An `examples/` fixture with
    `required-features` for the live arm, in the `documents_live` / `media_git_live` shape.
    `CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0` on every local build — 19 GiB to 159 MiB —
    `df -h .` before and between build steps, and `cargo build --all-features --examples` before any
    `--lib --tests` run or sabotage.
  constraints:
  - >
    No new runtime dependency; MSRV 1.95; edition 2021; every version stays 0.x.
  - >
    No public API change. If the implementation reaches for a field on `CompletionRequest`, the
    design is wrong for this release — the marker is derivable from what the request already carries,
    and anything that is not is the excluded transcript half.
  - >
    No marker on `WebFlavor::OpenAi`, ever, in this release. That flavour serves both OpenAI and 21
    endpoints reached through `Compatible`, and an unknown body key in front of an endpoint this
    crate does not control is a 400 nobody asked for.

risks:
- >
  **Marking a prefix that is not stable costs money instead of saving it.** A cache write is billed
  above a fresh read, so a breakpoint that misses is strictly worse than no breakpoint. This is the
  reason the transcript is excluded on evidence from `src/context.rs:413` rather than on effort, and
  the reason the one breakpoint sits at the end of a block built from static text plus a skill
  catalogue that does not change within a run.
- >
  **A prefix too short to cache makes the whole release invisible.** Vendors do not cache below a
  minimum length and report nothing when they decline; the marker is accepted, the counter stays
  zero, and everything looks implemented. Mitigated by F4 asserting a non-zero counter on a
  deliberately over-minimum block, by its marker-suppressed control, and by stating the minimum in
  `docs/CONTRACT.md` so an operator with a small system prompt knows why they see nothing.
- >
  **The live evidence silently measuring the wrong thing.** OpenRouter routes a slug to whatever it
  chooses, and an OpenAI-family model caches automatically — so a live pair could report cached
  tokens that owe nothing to this release. Mitigated by recording `CompletionResponse::model` from
  the response rather than trusting the request, and by the suppressed-marker control, which must
  report zero on a model where the marker is what did the work.
- >
  **An unknown body key rejected by an endpoint.** The failure mode is a 400 on every call, which is
  total for the operator who hits it. Mitigated structurally rather than by handling: the marker is
  sent only to the two wires whose vendors document it, and F2 is the test that keeps it away from
  the rest.
- >
  **Under-reported cost through OpenRouter.** That wire reports no cache-write counter and the parser
  records zero by construction, so a cached run's derived cost may sit below the invoice for the
  first call. Mitigated by N4 — measure it in F4 and state it with figures — and explicitly not by
  inferring the write from the prompt length.
- >
  **Disk, again.** `target/` has taken this volume to zero in four separate releases and
  rust-analyzer rebuilds into the same tree. Mitigated operationally: debuginfo off by default
  locally, `df -h .` before and between build steps, separate `cargo test` invocations, and
  `cargo clean` between the full suite and packaging.

open_questions:
- >
  Whether the context assembler should be made prefix-stable so the transcript can be cached too.
  That is the larger half of the saving and it is a genuine design conflict: supersession,
  invalidation and re-reading exist to keep the model's view current, and a stable prefix wants the
  opposite. A shape worth considering is an append-only settled head with the volatile part after it,
  which would make one more breakpoint useful — but it changes what the model sees, so it is a
  release with its own evidence, not an addition to this one.
- >
  Whether `CompletionRequest` should eventually name the stable boundary inside `user`, so a provider
  can extend the breakpoint past the goal block. Worth a public field only if the answer to the
  question above is yes; on its own it buys a few hundred tokens.
- >
  Whether an extended cache lifetime is worth its beta header and its higher write price for a
  conversation with human-length pauses between turns. Measurable once the counters are non-zero,
  which this release is what makes possible.
- >
  Whether the crate should report, in any form, that it *asked* for a cache — distinct from what the
  vendor did. Today the only signal is the counter, so "the marker was sent and ignored" and "the
  marker was never sent" look the same to an operator reading a trace. Left open because the honest
  answer may be that the body is the trace, and the record provider already captures it.
