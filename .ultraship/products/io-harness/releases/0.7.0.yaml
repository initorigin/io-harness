known_limitations:
  - >-
    NF5 concurrency has no dedicated 100+-agent timing test asserting non-serialization. Each agent
    commits its own step independently (per-agent unchecked_transaction, no new global lock over the
    0.5.0 single-connection model), and the existing subagents fan-out suite now runs green with
    checkpointing default on — but "checkpointing does not serialize the fan-out" is proven indirectly,
    not by a dedicated concurrency benchmark.
  - >-
    resume_tree_with_decision re-checks the approved write against the tree (root) policy, not the
    resumed child's narrowed policy (not reconstructed at the decision point; marked with a ponytail
    comment). A policy deny still blocks, and a remembered-allow cannot defeat a deny beneath it, but a
    child-specific deny of an action the tree policy allows is not re-enforced on that one performed
    write.
  - >-
    The live example run happened to solve in a single step, so it demonstrates durable-store +
    idempotent-resume across a real process boundary rather than a live mid-run crash-and-continue. The
    mid-run continue path is proven deterministically and offline by the real-SIGKILL resume test; a
    live provider run that is genuinely interrupted mid-task is not part of this release's evidence.
  - >-
    The literal 24h+ wall-clock unattended run is out of scope by design (contract excluded scope). The
    horizon is proven by the real-SIGKILL resume test plus a 250-step long unattended run that
    checkpoints throughout; a real multi-hour run is not executed here.
  - >-
    Resume is single-machine only — checkpoints are the local rusqlite store and resume runs on the
    same host (product.yaml: local, single-user). No distributed or cross-machine checkpoint/handoff.
  - >-
    The crate ships the durable-run mechanism and the trace; there is no daemon, scheduler, or watchdog
    that re-invokes the process after a crash — who restarts the process (a shell, io-cli, io-studio,
    systemd) is the caller's job, per the embeddable-library / no-daemon constraint.
