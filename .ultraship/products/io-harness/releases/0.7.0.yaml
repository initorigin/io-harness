product: io-harness
version: 0.7.0
status: released
release_type: minor
outcome:
  user_can: >
    A developer starts a long task and walks away. The harness runs unattended for a long horizon
    (24h+) with no user input, and it survives a crash or a full process restart without losing or
    corrupting the run. After every completed step of every agent, the harness durably checkpoints —
    the agent's loop position, its intermediate results, its draw against the 0.5.0 aggregate budget,
    and any pending policy decision — in one transactional rusqlite commit before the next step
    begins. On restart the harness reopens the store, reconstructs the whole 0.5.0 agent tree
    (parents, children, nesting, shared workspace, shared trace) from the checkpoint, and every agent
    continues exactly where it stopped.

    Resume is idempotent by construction. A completed step is never re-run, the aggregate budget
    (agent count, tokens, cost, time) is never double-charged for work already done, and an
    irreversible action already applied — a file edit committed, an approval already consumed — is
    not applied a second time. A crash loses at most the one step that was in flight, and that step
    replays cleanly because nothing about it was committed. The 0.6.0 sandboxes are ephemeral and die
    with the process; on resume they are re-created per run as before, and an execution that was in
    flight at crash time is simply re-run inside a fresh sandbox — safe precisely because the sandbox
    is per-run and its result was never checkpointed.

    Human approval spans the restart. When the 0.4.0 policy marks an action sensitive, the whole tree
    pauses, the pending action is persisted, and the process can exit entirely; when the human's
    decision arrives — minutes or hours later, in the same process or a fresh one — the tree resumes
    from the persisted pending action and continues. Unattended does not mean unsupervised: the run
    stops for a human exactly when policy demands and only then.

    Every checkpoint, every resume, and every "step skipped because already done" is recorded in the
    rusqlite trace alongside the 0.2.0–0.6.0 records, so an operator can open the store after a
    24h-with-two-crashes run and reconstruct the whole history — what ran, what was checkpointed,
    where each crash happened, and what replayed — from the store alone.
  business_value: >
    This is the release that makes io-harness trustworthy to leave running. The vision is a harness
    that runs an agent reliably from a typed contract to a verified result, including 0.5.0's 100+
    concurrent agents and 0.6.0's isolation — but a run you cannot walk away from is not autonomous,
    it is supervised. Every prior release bounded a single sitting: 0.2.0 made state resumable in
    principle, 0.4.0 paused for a human, 0.5.0 fanned out a tree, 0.6.0 isolated the code. None of
    them survives the developer closing the laptop, the machine rebooting, or the process being
    killed at hour 9 of a 24h task. Without durable whole-tree checkpoint-and-resume, a long run is
    one power blip away from starting over — and starting over on a partially-applied tree risks
    doing irreversible work twice.

    Durable, idempotent, after-every-step checkpointing is the specific shape the product needs. It
    is what lets the shared engine every initorigin app builds on promise "hand it a big task and
    leave" instead of "babysit it." It composes with, rather than replaces, everything before it: the
    0.4.0 approval that pauses the tree now also survives a restart; the 0.5.0 aggregate budget is now
    enforced correctly across restarts instead of being reset or double-counted; the 0.6.0 sandbox
    stays ephemeral because resume re-creates it. It is also the last core-reliability release before
    0.8.0's extensibility (MCP/plugins/skills) — you do not want an arbitrary MCP server or plugin
    running inside a run that cannot checkpoint and cannot recover.
  evidence_of_value: >
    A real crash test kills the harness process with SIGKILL partway through a multi-step run, starts
    a fresh process against the same rusqlite store, and asserts the run resumes and reaches the same
    verified success it would have reached uninterrupted — no completed step re-run, the produced
    artifact correct, the trace showing the crash point and the resume. A double-charge test asserts
    the aggregate budget after a crash-and-resume equals the budget of the same run with no crash, to
    the token/step/cost, proving no work is billed twice. An idempotency test crashes immediately
    after a file edit is applied but before its step commits, resumes, and asserts the edit is present
    exactly once (not doubled, not lost). A tree test crashes a run with a parent and several
    children in flight and asserts every agent resumes at its own checkpoint and the tree completes.
    An approval-across-restart test pauses the tree on a sensitive action, exits the process, starts a
    new process, delivers the decision, and asserts the tree resumes from the persisted pending
    action. A time-scaled long-run test drives the loop through a large number of unattended steps
    (clock advanced/compressed, no user input) and asserts it sustains the loop, checkpoints
    throughout, and stops only on completion or a policy pause — standing in for the literal 24h
    wall-clock, which is explicitly noted as not live-run. The unchanged 0.1.0–0.6.0 suite stays
    green with checkpointing on by default, and an example binary drives one live unattended run
    against OpenRouter that is killed mid-run and resumed to a verified result.
scope:
  included:
    - >
      Durable step-level checkpoint — after every completed step of every agent, the harness commits
      that agent's checkpoint (loop position/phase, intermediate results, budget draw, and any
      pending policy decision) to rusqlite in one transaction, before the next step begins. The
      commit is the step's completion marker: a step is "done" iff its checkpoint is committed, so a
      crash can never leave a half-done step recorded as done.
    - >
      Whole-tree resume — on construction against an existing store with an unfinished run, the
      harness reconstructs the entire 0.5.0 tree (every agent, parent/child edges, nesting depth,
      shared workspace handle, shared trace, and the aggregate budget already drawn) from the
      checkpoints and continues each agent from its own last checkpoint. Resume is the default when an
      unfinished run is found; a fresh run is the default when none is.
    - >
      Idempotent replay — resuming re-runs at most the single in-flight step per agent and nothing
      already committed. A completed step is skipped (and the skip recorded), the aggregate budget is
      restored from the checkpoint rather than recomputed or re-drawn, and an irreversible effect
      already committed (a file write, an approval consumed) is not repeated. The unit of idempotency
      is the step + its transactional commit.
    - >
      Crash-consistency boundary — a crash at any point resumes to a consistent tree: either the
      in-flight step never committed (it replays from its pre-step checkpoint) or it committed (it is
      skipped). There is no third state. Guaranteed by making the step result, the budget draw, and
      the trace record for that step one rusqlite transaction, so they are all-or-nothing.
    - >
      Approval that survives a restart — the 0.4.0 pause-persist-resume path is extended so a pending
      sensitive action is durable across a full process exit: the tree pauses, the pending action is
      checkpointed, the process may exit, and `resume_with_decision` on a fresh process against the
      same store resumes the whole tree from the persisted pending action. The 0.4.0 in-process
      Approver path is unchanged for callers who stay resident.
    - >
      Sandbox re-creation on resume — 0.6.0 sandboxes stay ephemeral and are never checkpointed. An
      execution in flight at crash time is re-run inside a fresh sandbox on resume, which is safe
      because its result was never committed; a completed sandboxed step is skipped like any other
      completed step. The sandbox boundary and default-deny network are unchanged.
    - >
      Aggregate-budget durability — the 0.5.0 whole-tree spend ceiling (agent count, tokens, cost,
      time) is checkpointed with each step and restored on resume, so a 24h run across restarts
      enforces one continuous ceiling rather than resetting it each process. Wall-clock/time budget
      accounts for real elapsed time across restarts, not just in-process uptime.
    - >
      Checkpoint/resume trace records — the rusqlite schema gains checkpoint, resume, and
      step-skipped events (tied to the agent/run they belong to), plus a durable run/pause status, so
      an operator reconstructs a multi-crash run's history from a reopened store. Additive only (new
      events/columns and/or tables), so a 0.6.0 database migrates in place and a 0.6.0 binary still
      reads a migrated database.
    - >
      Typed resume failure semantics — a resume that finds an incompatible or corrupt checkpoint
      returns a typed error the caller handles, never a panic and never a silent half-resume; a
      partially-written checkpoint (crash mid-commit) is rejected atomically by the transaction and
      the prior consistent checkpoint stands. Matches 0.4.0/0.6.0 typed-result-not-panic discipline.
    - >
      Public crate API additions under SemVer, backward compatible with 0.6.0 — existing `run_with`,
      `resume`, `resume_with_decision`, `Policy`, `Approver`, `Containment`, `Sandbox`,
      `SandboxConfig` keep their signatures and behaviour; new surface (a durable-run/resume entry
      point and a checkpoint/run-status type) is additive, and an existing 0.6.0 call still compiles
      and reaches the same verified success with checkpointing default on.
    - >
      Tests — the SIGKILL crash-and-resume test, the no-double-charge budget test, the
      edit-applied-exactly-once idempotency test, the tree-crash-and-resume test, the
      approval-across-process-restart test, the time-scaled long-unattended-run test, a
      corrupt/incompatible-checkpoint typed-failure test, and the unchanged 0.1.0–0.6.0 suite green
      with checkpointing default on.
    - >
      Updated README and crate docs covering durable checkpointing (after every step, transactional),
      whole-tree resume, the idempotency and crash-consistency guarantees and their boundary,
      approval across restart, sandbox re-creation on resume, and the accelerated-plus-crash evidence
      model (with the literal-24h note), plus a runnable example, packaged for 0.7.0.
    - >
      An example binary (as `examples/sandbox_run` did for 0.6.0) driving one live unattended run
      against OpenRouter that is killed mid-run and resumed in a fresh process to a verified result,
      showing checkpoints written, the crash point, and the skipped-completed-steps on resume.
    - >
      Published to crates.io — 0.7.0 is tagged as a git Release first and then uploaded with
      `cargo publish` (registry token in env), continuing the published target adopted at 0.6.0.
  excluded:
    - >
      A literal 24h+ wall-clock live run as gating evidence — impractical to run inside one build
      session and gated on real API spend and elapsed time. The 24h horizon is proven by a
      time-scaled long unattended run plus a real crash-and-resume test; the literal wall-clock run is
      noted as not live-run, a decided deferral rather than a hidden claim.
    - >
      Distributed / multi-machine checkpointing or handoff of a running tree between hosts — the run
      checkpoints to the local rusqlite store and resumes on the same machine, per product.yaml
      (local, single-user, single-tenant, no hosted service). Cross-machine resume is out of scope by
      design.
    - >
      A daemon/scheduler that runs the harness as a background service, cron, or watchdog that
      auto-restarts it — the crate provides durable checkpoint + resume-on-next-construction; who
      re-invokes the process (a shell, io-cli, io-studio, systemd) is the caller's job, consistent
      with the embeddable-library, no-daemon constraint.
    - >
      Sub-step / mid-step checkpointing (snapshotting a single long step partway through so it does
      not replay at all). The unit is the completed step; a crash replays at most one in-flight step.
      Finer granularity is deliberately not built — replaying one idempotent step is the simpler
      correct guarantee.
    - >
      Network egress allow-list, MCP/plugins/skills, and office/document/media tools — 0.8.0. Those
      are the next release and are why 0.7.0's reliability floor lands first.
    - >
      Encryption or redaction of the checkpoint store beyond the existing 0.4.0/0.6.0 trace discipline
      — checkpoints record loop state, ids, budget counters, and pending-action metadata, never file
      contents or API keys, same as prior releases; at-rest encryption of the rusqlite file is not in
      scope.
    - Any resume UI, progress dashboard, or interactive control of a running/paused tree — io-cli and io-studio own presentation; the crate ships the mechanism and the trace.
    - Daemon/client mode and any network API — deferred per product.yaml.
  fallback_scope:
    - >
      Durable step-level checkpoint to rusqlite (transactional: step result + budget draw + trace
      record committed together) and whole-tree resume-on-next-construction for a single-agent and a
      small tree — the core "crash then resume to the same verified success" guarantee, which never
      drops.
    - >
      Idempotent replay: a completed step is skipped, the aggregate budget is restored not
      re-charged, and an already-applied file edit is present exactly once after resume — proven by
      the crash-and-resume test, the no-double-charge test, and the edit-exactly-once test.
    - >
      Approval that survives a full process restart — pause, persist pending action, exit, new
      process, `resume_with_decision`, tree continues.
    - Checkpoint/resume/step-skipped events and durable run status in the rusqlite trace, additive migration keeping 0.6.0 databases readable.
    - The time-scaled long-unattended-run test standing in for the 24h horizon.
    - >
      (drop in this order if the release runs long — first the time-scaled long-run test narrows to a
      shorter sustained loop (still unattended, still checkpointing, just fewer steps); then the
      large-tree crash test narrows to a small-tree crash test, keeping single-agent and small-tree
      crash-resume real. The transactional after-every-step checkpoint, idempotent replay, and
      approval-across-restart never drop — they are the release. Publishing to crates.io is the last
      thing to drop: if it must, 0.7.0 lands release-ready like 0.1.0–0.5.0 with the git Release still
      cut and the publish held.)
acceptance:
  functional:
    - >-
      The harness process is killed with SIGKILL partway through a multi-step run; a fresh process
      constructed against the same rusqlite store resumes the run and reaches the same verified
      success the uninterrupted run reaches — the produced artifact is correct and no completed step
      is re-run.
    - >-
      After a crash-and-resume, the aggregate budget (steps, tokens, cost, time) equals the budget of
      the same run with no crash — proving no step's spend is charged twice.
    - >-
      A crash immediately after a file edit is applied but before that step's checkpoint commits
      resumes with the edit present exactly once — not doubled, not lost — proving the step is the
      idempotency unit and the transactional commit is the completion marker.
    - >-
      A run with a parent and several children in flight is crashed and resumed; every agent continues
      from its own checkpoint and the whole tree completes, proving resume reconstructs the 0.5.0 tree
      and not just a single agent.
    - >-
      A sensitive action pauses the whole tree; the process exits entirely; a new process delivers the
      decision via `resume_with_decision`; the tree resumes from the persisted pending action and
      continues — proving 0.4.0 approval survives a full restart.
    - >-
      A sandboxed execution in flight at crash time is re-run inside a fresh 0.6.0 sandbox on resume
      and the run still reaches verified success, while a completed sandboxed step is skipped — proving
      ephemeral sandboxes are re-created, never resumed, and never double-executed once committed.
    - >-
      A time-scaled long unattended run drives the loop through a large number of steps with no user
      input (clock advanced), checkpoints throughout, and stops only on completion or a policy pause —
      standing in for the 24h horizon.
    - >-
      A resume against a corrupt or version-incompatible checkpoint returns a typed error the caller
      handles; the run does not panic and does not half-resume, and a crash mid-commit leaves the
      prior consistent checkpoint intact.
    - >-
      Every checkpoint, resume, and skipped-because-already-done event is recorded so a multi-crash
      run's full history (what ran, where each crash happened, what replayed) is reconstructable from a
      reopened store alone.
    - >-
      A 0.6.0 caller's existing code compiles unchanged and reaches the same verified success with
      checkpointing default on, proving the durable-run surface is additive.
  non_functional:
    - >-
      The step checkpoint (step result, budget draw, trace record) is written as one rusqlite
      transaction, so a crash leaves either a fully-committed step or none of it — never a partial
      step recorded as done. A test asserts atomicity by crashing mid-commit and checking the prior
      checkpoint stands.
    - >-
      Resume is idempotent by construction: re-running the same resume twice from the same store
      yields the same completed run and the same budget, so a resume that itself crashes and is retried
      does not compound.
    - >-
      The new durable-run/resume entry point and the checkpoint/run-status type are part of the
      documented public API under SemVer; existing 0.6.0 callers compile unchanged and no rusqlite- or
      OS-specific type leaks into the public signatures.
    - >-
      Checkpoints record loop state, agent ids, budget counters, and pending-action metadata only —
      never file contents or API keys — consistent with the 0.4.0 and 0.6.0 trace discipline.
    - >-
      After-every-step checkpointing does not serialize the 0.5.0 concurrent fan-out — each agent
      commits its own checkpoint independently and 100+ agents do not contend on a single global write
      lock to make progress; a concurrency test asserts fan-out stays bounded with checkpointing on.
    - >-
      The wall-clock/time component of the aggregate budget accounts for real elapsed time across a
      restart (checkpointed timestamp based), not just the current process's uptime, so a 24h ceiling
      is not silently reset by a restart.
  operational:
    - >-
      `cargo test` passes, including the SIGKILL crash-and-resume test, the no-double-charge budget
      test, the edit-exactly-once idempotency test, the tree-crash-and-resume test, the
      approval-across-restart test, the sandbox-recreated-on-resume test, the time-scaled long-run
      test, the corrupt-checkpoint typed-failure test, and the unchanged 0.1.0–0.6.0 suite with
      checkpointing default on.
    - '`cargo clippy --all-targets` reports zero warnings on the macOS build host.'
    - '`cargo publish --dry-run` succeeds with complete crate metadata for 0.7.0.'
    - >-
      README and crate docs document durable step-level checkpointing, whole-tree resume, the
      idempotency and crash-consistency guarantees and their boundary, approval across restart, and
      the accelerated-plus-crash evidence model with the literal-24h note, with a runnable example.
    - >-
      An example binary drives one live unattended run against OpenRouter that is killed mid-run and
      resumed in a fresh process to a verified result, showing checkpoints, the crash point, and
      skipped completed steps on resume.
    - >-
      0.7.0 is tagged as a git Release and then published to crates.io with `cargo publish`; the
      uploaded crate matches the release-ready artifact and the published version resolves from
      crates.io.
delivery:
  target_mode: published
  environment: >
    developer's local macOS machine for build, test, live-run, and packaging; crates.io as the
    publication target. Checkpoints are written to the local rusqlite store; resume is same-machine
    per product.yaml (local, single-user).
  deployment_method: >
    Built and packaged locally — `cargo test`, `cargo clippy --all-targets`, `cargo build --release`,
    and `cargo publish --dry-run` all green with complete 0.7.0 crate metadata — then a git Release is
    cut (tag + GitHub Release, per the repo's release convention) and the crate is uploaded to
    crates.io with `cargo publish` using the registry token available in the environment. Git release
    first, publish second.
  migrations:
    - >
      Extend the rusqlite schema with durable checkpoint state and checkpoint/resume/step-skipped
      events plus a durable run/pause status, tied to the run/agent they belong to. Additive only (new
      tables/columns and/or events), no rewrites, so a 0.6.0 database migrates in place and a 0.6.0
      binary still reads a migrated database. The checkpoint write path itself is the migration's
      main runtime user.
  observability:
    - Every step checkpoint recorded to rusqlite and emitted via tracing — run/agent id, step index, and budget draw at that step.
    - Every resume recorded — which run, from which checkpoint per agent, and how many steps were skipped as already-done.
    - Every skipped-because-already-committed step recorded, so replay is auditable and not silent.
    - The durable run/pause status (running, paused-for-approval with the pending action, completed, failed) recorded and queryable from the store.
    - >
      The full history of a multi-crash run — steps, checkpoints, crash points (inferred from the last
      checkpoint before a resume), pauses, and resumes — reconstructable from the store alone after
      the run.
  rollback: >
    Before publish, rollback is `git revert` of the 0.7.0 branch — the change lives on `feat/0.7.0`
    until the develop→main release. The rusqlite migration is additive (new tables/columns/events
    only), so it needs no down-migration and a 0.6.0 binary still reads a migrated database. At the
    library level a caller reverts by dropping back to the 0.6.0 crate version; checkpointing is the
    new default but a 0.6.0-style single-sitting run is still reachable, so the change is additive.
    Because 0.7.0 is published to crates.io, a post-publish fix is a forward patch release (0.7.1),
    never an unpublish — crates.io versions are immutable once uploaded, so the rollback-after-publish
    path is roll-forward, and `cargo yank` stops new resolutions of a bad 0.7.0 without breaking
    existing lockfiles.
dependencies:
  products: []
  services:
    - OpenRouter API (model inference for the live unattended crash-and-resume example run)
    - crates.io (publication target for 0.7.0)
  human_approvals:
    - Owner confirms 0.7.0 crate version metadata before packaging.
    - >
      Owner signs off the durable-run/resume public API surface and the checkpoint/run-status type
      names before packaging — like `Policy` (0.4.0), `Containment` (0.5.0), and `SandboxConfig`
      (0.6.0), a durable-run entry point and status type io-cli and io-studio adopt become a
      cross-repo contract, and renaming one later breaks both.
    - >
      Owner approves the git Release and the crates.io publish — publishing is public and irreversible
      (a version cannot be re-uploaded), so it is a deliberate human gate, not an automated step.
resource_profile:
  complexity: large
  uncertainty: high
  likely_cost_drivers:
    - >
      Crash-consistency across a concurrent tree — making the step result, the aggregate budget draw,
      and the trace record one atomic rusqlite transaction for every agent, so a crash at any
      interleaving of 100+ concurrent agents resumes to a consistent tree with no partial step counted
      as done. Getting the transaction boundary and the "commit is the completion marker" invariant
      right is the core risk.
    - >
      Idempotent replay of the in-flight step — proving a step that touched the filesystem or consumed
      an approval is not repeated on resume, which requires the effect to be either fully committed
      (skip it) or not committed at all (replay it), never in between.
    - >
      Whole-tree reconstruction from checkpoints — rebuilding the 0.5.0 parent/child/nesting graph,
      shared workspace, shared trace, and the already-drawn aggregate budget from the store so every
      agent resumes at its own point, not just the root.
    - >
      Extending 0.4.0 pause-persist-resume to survive a full process exit and be delivered by a fresh
      process, without regressing the in-process Approver path.
    - >
      Sandbox re-creation semantics on resume — ensuring an in-flight 0.6.0 sandboxed exec re-runs
      safely in a fresh sandbox and a committed one is skipped, with no double-execution of
      model-produced code.
    - >
      Proving the 24h horizon honestly without a literal 24h run — a time-scaled long run plus a real
      crash test that together stand in for wall-clock, designed so the substitution is defensible and
      not a fake.
    - >
      After-every-step checkpoint write cost not serializing the 0.5.0 fan-out — per-agent independent
      commits rather than a global write lock, so durability does not undo concurrency.
  preferred_tools:
    - Rust, tokio (process lifecycle, timeouts, cancellation), rusqlite (transactions for atomic checkpoints), serde, tracing; existing own HTTP + SSE provider client.
    - rusqlite transactions / WAL for atomic step commits and crash-consistent reads on resume.
    - Process-kill testing (SIGKILL of a child harness process) to prove real crash-resume, not a simulated in-process reset.
    - cargo (build, test, clippy, publish); git + GitHub Release for the release step.
  constraints:
    - Rust crate; async on tokio; state in rusqlite; own HTTP + SSE provider client.
    - Embeddable in-process library only; no daemon/client mode; checkpoint + resume-on-construction, the caller re-invokes the process.
    - Local, single-machine resume; no distributed or cross-machine checkpointing.
    - Apache 2.0; runs locally, single-user, no hosted service.
risks:
  - >
    A checkpoint that is not truly atomic is the whole release failing silently — a crash mid-commit
    that leaves a partial step recorded as done would resume into a corrupt tree that skips work it
    never did. Mitigation: the step result, budget draw, and trace record are one rusqlite
    transaction, and a crash-mid-commit test asserts the prior consistent checkpoint stands and the
    partial write is rolled back atomically.
  - >
    An in-flight step with an irreversible effect replayed on resume could double-apply it — a file
    written twice, an approval consumed twice. Mitigation: the effect and its step commit are in the
    same transaction, so the effect is either committed (step skipped) or not (step replays cleanly);
    the edit-exactly-once test proves it on the file path.
  - >
    Resume that reconstructs only the root and not the whole tree would silently lose in-flight
    children under 0.5.0 fan-out. Mitigation: the tree-crash-and-resume test crashes with children in
    flight and asserts every agent resumes at its own checkpoint and the tree completes.
  - >
    The aggregate budget reset or double-counted across a restart would break the 0.5.0 spend ceiling
    over a 24h run. Mitigation: the budget is checkpointed and restored, wall-clock time is
    elapsed-based across restarts, and the no-double-charge test asserts the post-crash budget equals
    the uninterrupted budget.
  - >
    Proving "24h+ unattended" without a literal 24h run risks an evidence gap that reads as a claim
    it did not earn. Mitigation: the horizon is proven by a time-scaled long run plus a real
    crash-resume test, and the literal wall-clock run is explicitly named in excluded scope as not
    live-run, so the substitution is a decided deferral, not a hidden assumption.
  - >
    After-every-step checkpointing reintroducing a global write bottleneck under 100+ concurrent
    agents would undo 0.5.0's concurrency. Mitigation: per-agent independent commits (WAL), and a
    concurrency test asserts checkpointed fan-out stays bounded and does not serialize.
  - >
    The durable-run/resume API and the run-status type become a cross-repo serde/contract surface the
    moment io-cli and io-studio adopt them, like `Policy`/`Containment`/`SandboxConfig` — a rename
    later is a coordinated break. Owner sign-off on the names before packaging is the mitigation.
  - >
    Publishing is irreversible. A bad 0.7.0 on crates.io cannot be re-uploaded; the fix is a forward
    0.7.1 and `cargo yank`. Owner-approved git-release-then-publish and a passing dry-run before the
    real publish are the guard.
open_questions:
  - >
    Should a step's irreversible effect (a file edit) be applied inside the same rusqlite transaction
    that commits the checkpoint, or applied first and then recorded? Proposed: record the intent in
    the transaction and make the effect idempotent on replay (apply-if-not-present), since a
    filesystem write cannot literally join a rusqlite transaction — so the guarantee is "committed
    checkpoint implies effect already applied, replay re-applies idempotently," proven by the
    edit-exactly-once test.
  - >
    Is checkpointing every single step the right default, or should very fast steps batch to reduce
    write amplification? Proposed: after-every-step by default (strongest guarantee, matches the
    approved decision), with the write kept cheap via WAL and per-agent commits; batching is a later
    optimization only if write cost is shown to matter, not a 0.7.0 concern.
  - >
    On resume, should an in-flight sandboxed exec always re-run, or should a still-alive detached
    process from the previous run ever be reattached? Proposed: always re-run in a fresh sandbox —
    0.6.0 sandboxes are ephemeral and killed on process exit, so there is nothing to reattach, and
    re-running an uncommitted step is the simpler correct model.
  - >
    How is the 24h time budget measured across restarts — cumulative in-process time, or wall-clock
    from the run's first checkpoint? Proposed: wall-clock elapsed from the first checkpoint's stored
    timestamp, so a run that was paused-and-exited for hours still counts toward (or is correctly
    excluded from, if paused) its time ceiling per a documented rule, rather than a restart silently
    resetting the clock.
released_at: '2026-07-24T19:15:23Z'
mode: published
delivered: >
  Durable, unattended runs. After every completed step the harness commits that step's trace row and
  a checkpoint event in one rusqlite transaction, so the committed checkpoint is the step's completion
  marker — a crash leaves a whole step or none of it. On restart `resume` (single/workspace) and the
  new `resume_tree` (a whole 0.5.0 tree) reconstruct the run from the store and continue every agent
  from its own last committed step: completed steps are skipped (a `skipped` event recorded), the
  shared `Ledger` budget is restored from durable tree totals via `Ledger::from_state` (never reset or
  double-charged), and the time budget counts real wall-clock elapsed from a stored `started_at`, not
  process uptime. Replay is idempotent — an already-applied edit is re-observed and overwritten exactly
  once (effect committed before the checkpoint), and re-running a resume is a no-op via a terminal
  short-circuit. `spawn_child` became spawn-or-adopt: on replay a parent adopts the child it already
  spawned (persisted `spawns` table, keyed parent+step+goal) and resumes it from its own checkpoint
  rather than duplicating it. A 0.4.0 approval survives a full process exit via
  `resume_tree_with_decision` (an agent paused by a child leaves that step uncommitted so the parent
  replays and re-adopts the paused child). Ephemeral 0.6.0 sandboxes are never checkpointed — an exec
  in flight at crash re-runs in a fresh sandbox. New public surface is SemVer-additive and 0.6.0
  callers compile unchanged: `resume_tree`, `resume_tree_with_decision`, `RunStatus` +
  `Store::run_status`, `CheckpointEvent`, `Error::Resume`, `Ledger::from_state`, `CHECKPOINT_FORMAT`.
  A resume against a newer-format or missing checkpoint is a typed `Error::Resume`, never a panic.
  Additive rusqlite migration (`checkpoint_events` + `spawns` tables, `status`/`started_at` columns,
  `PRAGMA user_version` stamp) — a 0.6.0 database migrates in place. Built, tested, documented,
  packaged, and PUBLISHED to crates.io (v0.7.0 resolves), tagged as the git Release `io-harness 0.7.0`.
