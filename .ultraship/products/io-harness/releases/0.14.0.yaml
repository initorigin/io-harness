product: io-harness
version: 0.14.0
status: planned
release_type: minor
outcome:
  user_can: >
    A developer runs a task over real documents, and the documents are governed by the same rules as
    source files.

    The agent reads a real `.xlsx`, changes cells in it, and writes it back with the rest of the
    workbook intact. It reads a `.docx` and generates a new one. It generates a PDF, extracts the
    text from an existing one, stamps a watermark across its pages, and fills its AcroForm fields.
    It decodes a barcode or QR code out of an image. It reads the text out of a `.pptx`.

    Every one of those actions passes the 0.4.0 path policy on the actual path it touches, runs
    under the 0.6.0 sandbox where a sandbox applies, and can be gated by a criterion that
    understands what a document is.

    That last part is the release rather than a caveat, and it decides the whole shape. A document
    capability shipped as registered `Tool` implementations would sit outside the path rules: a
    registered tool is authorised once, by an `Act::Exec` check on its name (src/run.rs:3046-3060),
    and the crate says so plainly in the README — the policy "governs whether it is *called*; it
    does not govern what it does once running — no sandbox, no path scoping, and no egress control
    applies inside it." That bound is honest and correct for a caller's own tool. It is the wrong
    bound for a capability whose entire job is reading and writing files in the user's workspace: a
    `docx_write` tool taking a path from the model would write wherever the model said, and
    `deny_write("secrets/*")` would not stop it. That is the same shape as the defect 0.13.0 just
    closed — a boundary the caller believes is enforced and is not — so this release does not
    reintroduce it one layer up.

    Two things have to exist underneath before any of it is safe. `Workspace` has no byte-level IO:
    `read_file` and `write_file` are `String`-based (src/tools/workspace.rs:243, :256), and every
    format here is binary. And no existing `Verification` variant can check a document — all seven
    are text or Rust oriented, so `FileContains` on a `.docx` matches against zip bytes and passes
    or fails for reasons unrelated to the document. A document release that cannot verify its own
    output has no stop condition.
  business_value: >
    This is the first release of the breadth half of the roadmap. Twelve pillars of engine are done
    and 0.13.0 closed the last correctness defect in them; what remains is what the agent can
    actually touch. Documents are the widest gap between "an agent that edits code" and "an agent
    that does someone's work", and they are the capability most often assumed present.

    The reason to do it now, and the reason to do it as built-ins, is that the alternative is
    already available and quietly worse. 0.9.0 made the crate extensible in-process: any consumer
    can write a `docx_write` tool today and register it. io-cli and io-studio are both being built
    now and either could. What they would get is a document tool outside the path policy, in a
    product whose entire pitch is that an unattended agent is safe to leave running. Shipping the
    capability properly, once, in the crate that owns the permission model, is the difference
    between documents being a governed capability and documents being the hole every consumer
    independently opens.

    The scope cuts are the other half of the value. The outline this release inherited promised
    Office, PDF, OCR and barcode. OCR and PowerPoint are gone — cut from the roadmap outright by
    the owner on 2026-07-27, and independently unshippable on the evidence. Finding that out during
    planning rather than during development is the whole point of having planned. OCR would degrade the five-leg CI matrix that 0.9.1 exists to protect — the
    Tesseract path needs a from-source vcpkg C++ build on the Windows runner, and the pure-Rust
    path raises the MSRV floor, downloads models at runtime, and reads Latin script only.
    PowerPoint authoring rests on a 46-star single-maintainer pre-0.3 crate. Shipping either would
    mean a release note that is true only in the sense that the code exists.
  evidence_of_value: >
    For the boundary, which is the release's subject: an agent under a policy denying
    `secrets/**` asked to write a spreadsheet to `secrets/out.xlsx` is refused, with the refusal in
    the trace naming the real path — not the tool. And its negative control, the assertion that
    makes the first one mean something: the same run under a permissive policy writes the file, so
    the test measures the boundary rather than a write that would have failed anyway. Both for a
    read and a write, since a document tool that reads `secrets/key.txt` to "extract its text" is
    the same hole facing the other way.

    For each capability, a round trip through a real file rather than a fixture the test also
    wrote: a spreadsheet with several sheets and formatting, read, one cell changed, written back,
    then re-read to assert both that the change landed and that a sheet the agent never touched is
    still there and still correct. That second half is the one that matters — a "preserving edit"
    that quietly drops what it did not model is worse than a refusal to edit.

    For the verification criterion: a document criterion that passes on a `.docx` whose extracted
    text contains the needle, fails on one where it does not, and — the control — fails on a
    `.docx` whose raw zip bytes happen to contain the needle while its text does not. Without that
    third case the criterion is `FileContains` with extra steps.

    For the dependency decision: the default `cargo build` dependency tree is asserted unchanged
    from 0.13.0, so a consumer who does not want documents pays nothing for them. The msrv leg
    passes with the feature enabled.

    And one live run against a real provider: an agent given a real spreadsheet and a goal stated
    in business terms rather than in tool names, under a policy, producing a file a human opens.
scope:
  included:
  - >
    Byte-level workspace IO under the path policy. `Workspace::read_bytes` and
    `Workspace::write_bytes`, checked by the same `check_path` every text read and write goes
    through (src/tools/workspace.rs:117), returning the same `Wrote` outcome. Everything below
    routes through these; nothing below opens a file itself. This is the piece that makes the
    capability governable, and it is useful on its own to any caller handling binary files.
  - >
    Document tools as built-ins, not registered `Tool` implementations. Dispatched in the same
    `match` as `read_file`/`grep`/`write_file`, each gated on `Act::Read` or `Act::Write` against
    the path the model named, so a refusal names the file rather than the tool and a child's
    narrowed policy applies to documents exactly as it applies to source.
  - >
    Excel, the full capability: read a workbook's cells, generate a new one, and edit an existing
    one preserving the sheets and formatting the agent did not touch. This is the only one of the
    four where all three are solidly available in maintained pure-Rust crates, and it is the
    release's anchor.
  - >
    Word, read and generate. Read the text and structure of a `.docx`; produce a new one. Editing a
    `.docx` in place is explicitly NOT claimed — see excluded, and say so in the docs rather than
    letting a user infer it from the presence of the other two.
  - >
    PDF: generate a new document, extract the text of an existing one, stamp a watermark across its
    pages, and fill AcroForm fields. Form filling includes regenerating field appearance streams or
    setting `NeedAppearances`, without which many viewers render a filled field blank — the classic
    trap, and the difference between "the value is in the file" and "the user can see it".
  - >
    Barcode and QR decoding from an image in the workspace: the 1D and 2D symbologies a maintained
    pure-Rust ZXing port already covers.
  - >
    PowerPoint text extraction, read only. Getting the text out of a deck is genuinely easy —
    several maintained pure-Rust extractors exist and none of them writes — so reading is kept while
    authoring stays cut. Conditional on the same vetting every other dependency gets (N3): the
    leading extractor is recent, and if it fails the maintenance or licence check at development
    time this drops rather than being accommodated. It is the one capability here whose removal
    costs the release nothing structural.
  - >
    A document-aware `Verification` variant, so a document task has a real stop condition. It must
    gate on extracted text rather than on file bytes.
  - >
    All document dependencies behind an opt-in Cargo feature, so the default build's dependency
    tree is unchanged. The crate has no `[features]` section today; this release adds the first one.
    The alternative is imposing an Office and PDF dependency tree on every consumer of a crate whose
    dependency discipline has been a standing constraint since 0.1.0.
  - >
    An MSRV policy decision, recorded rather than discovered. Several of the candidate crates sit
    exactly at this crate's 1.88 floor and have been raising it every few minors, so the msrv leg
    will start failing on routine dependency updates. Either the leg pins versions or the floor
    moves deliberately; both are answers, drifting into it is not.
  - >
    Documentation of what each capability does and does not do, in the doc comment where a caller
    meets it — specifically that Word is generate-and-read, that PowerPoint is read-only, and
    that PDF text extraction is best-effort on reading order.
  excluded:
  - >
    OCR, entirely — and off the roadmap, not deferred. The owner cut it on 2026-07-27, so no planned
    release schedules it. The evidence independently supported cutting it from this one: the
    Tesseract binding needs a system package on all three runners, worst on Windows where it means
    vcpkg with user-wide integration and a slow from-source C++ build plus libclang for bindgen,
    and language data distributed to every user; the pure-Rust alternative requires MSRV 1.89
    against this crate's 1.88 floor, fetches its models over the network on first use, and
    recognises Latin script only. Either would make the five-leg matrix that 0.9.1 exists to protect
    slower and more fragile.
  - >
    Creating or editing PowerPoint — off the roadmap rather than deferred, per the owner on
    2026-07-27, who then kept reading on the grounds that it is easy. Authoring is independently
    unshippable: no mature Rust crate exists, the one credible option is a 46-star single-maintainer
    pre-0.3 project, and the alternative is writing an OOXML slide layer by hand. So `.pptx` is
    read-only here, and no write path for it appears in the public surface.
  - >
    Editing a Word document in place, preserving what was not touched. The mature crate's read is
    the weaker half of its round trip and drops OOXML it does not model on re-serialise, which for
    an agent editing a user's real document is data loss presented as an edit. Doing it properly
    means adopting a schema-generated OOXML DOM and writing the editing layer on top — a release of
    its own, not a line item in this one.
  - >
    High-fidelity PDF rendering and rasterisation. That path means binding Google's Pdfium, which is
    a per-OS binary this crate would have to tell users to install and a redistribution question
    besides.
  - >
    Any change to the `Tool` trait or to how registered tools are authorised. The documented bound
    stays exactly as it is; this release does not weaken it and does not extend it. If a caller's own
    document tool wants path scoping, the answer is that the built-ins have it.
  - >
    Image and video passthrough to providers, and git. That is 0.15.0.
  - >
    The README structural rewrite and the `docs/` guide pages. That is 0.16.0. Documentation here is
    confined to the surface this release adds.
  - >
    The Windows Job Object, still deferred, still needing a `windows-sys` dependency scoped to
    `[target.'cfg(windows)'.dependencies]` and its own release.
  fallback_scope:
  - >
    Spreadsheets end to end, plus the foundations. `Workspace` byte IO, built-in document tools with
    real per-path gates, the document-aware verification criterion, the opt-in feature, and Excel
    read / generate / preserving-edit. That is a coherent release on its own — an agent does a real
    piece of spreadsheet work under a policy, verified — and it is the subset with the healthiest
    dependencies. Word, PDF and barcode fall to 0.15.0 if they have to. The foundations are not
    cuttable: without them the capability is ungoverned, which is the one outcome worse than not
    shipping it.
acceptance:
  functional:
  - >
    F1 — a document write is refused by the path policy on the path it targets. An agent under a
    policy denying `secrets/**`, asked to write a spreadsheet to `secrets/out.xlsx`, is refused; no
    file is created; the refusal is in the trace with the act, the real path, and the rule that
    refused it. Asserted for a write and, separately, for a read of a denied path.
  - >
    F2 — the negative control for F1. The same run under a permissive policy writes the file and
    reads the denied path successfully, so F1 is measuring the boundary rather than an operation
    that would have failed regardless. This is an acceptance criterion, not a nicety: the release
    exists to make documents governed, and a governance test that cannot fail proves nothing.
  - >
    F3 — a spreadsheet edit preserves what it did not touch. A workbook with at least two sheets
    and some formatting is read, one cell on one sheet is changed, and it is written back; re-reading
    it asserts the new value AND that the untouched sheet's cells and its formatting survive. The
    fixture must be a file the test did not itself generate, or it only proves the library
    round-trips its own output.
  - >
    F4 — Word: a generated `.docx` opens and its text reads back as written, and an existing
    `.docx` is read for its text and structure. No in-place edit is attempted, and attempting one is
    not silently approximated by generate-and-replace.
  - >
    F5 — PDF generate and extract: a generated PDF's text extracts back to what was written, and the
    text of a real existing PDF is extracted. Reading order is asserted loosely, as best-effort,
    because the extraction crate's quality does not support a strict claim and the docs say so.
  - >
    F6 — PDF watermark: every page of a multi-page PDF carries the stamp after watermarking, and
    the document's existing content is still present and still extractable. A watermark that
    flattened the original would pass a naive "the stamp is there" check.
  - >
    F7 — PDF form fill: a filled AcroForm field holds its value AND renders it. Asserted on the
    appearance stream or `NeedAppearances`, not only on the field's `/V`, because a value a viewer
    shows blank is not a filled form.
  - >
    F8 — barcode and QR decode: a QR code and at least one 1D symbology decode to their known
    payloads from images in the workspace, and an image containing no code returns a clean "nothing
    found" rather than an error that ends the run.
  - >
    F9 — PowerPoint text extraction returns the text of a real deck, and no write path for `.pptx`
    exists in the public surface.
  - >
    F10 — the document verification criterion passes when the extracted text contains the needle,
    fails when it does not, and FAILS on a document whose raw bytes contain the needle while its
    extracted text does not. Without the third case it is `FileContains` wearing a costume.
  - >
    F11 — a document tool failure is an observation, not a run failure. A corrupt or truncated file
    returns an error the model can read and adapt to, the same treatment a malformed regex gets from
    `grep`, and the run continues.
  non_functional:
  - >
    N1 — the default build is unchanged. `cargo tree` for a default `cargo build` is asserted equal
    to 0.13.0's, so a consumer who does not enable the feature pays nothing. `cargo build`,
    `cargo test`, clippy and the docs build all pass both with the feature off and with it on.
  - >
    N2 — the msrv leg passes with the feature enabled, at whatever floor the recorded MSRV policy
    sets. If the floor moves, it moves deliberately, is stated in `Cargo.toml` and the CHANGELOG,
    and is not discovered by a red CI run.
  - >
    N3 — no system package, on any of the three runners. If a candidate crate turns out to need one,
    that capability is cut rather than accommodated — this is the constraint that removed OCR and it
    applies to anything else that trips it.
  - >
    N4 — five-leg CI green, with the document tests running on all three OSes. Path handling and
    line endings both reach these formats, so a Linux-only pass would not be evidence.
  - >
    N5 — no existing public item is renamed or removed; every addition is additive. Captured as a
    public-surface diff using the corrected method recorded in 0.13.0's evidence.
  - >
    N6 — a document read of a large file is bounded by the same context caps as any other
    observation, so a 200-page PDF cannot blow the prompt budget that 0.10.0 exists to hold.
  operational:
  - >
    O1 — each capability's doc comment states its limits where a caller meets them: Word is
    generate-and-read, PowerPoint is read-only, PDF extraction is best-effort on reading order,
    spreadsheet preserving-edit is not guaranteed for chart and drawing heavy workbooks.
  - >
    O2 — the CHANGELOG says what was cut and why. A reader who remembers the roadmap promised OCR
    and PowerPoint should find the reason in the release notes, not infer an oversight.
  - >
    O3 — the feature is discoverable: named in the README and in the crate docs, with the one line a
    consumer needs to enable it.
  - >
    O4 — the live-run transcript, the public-surface diff and the default-dependency-tree comparison
    are stored under `evidence/0.14.0/`.
delivery:
  target_mode: published
  environment: >
    crates.io, plus the three-OS GitHub Actions matrix (ubuntu-latest, macos-latest,
    windows-latest) with the msrv and lint jobs.
  deployment_method: >
    The initorigin release flow with the owner's 2026-07-26 override in effect: all work including
    the sealed completion record on `feat/0.14.0`, PR to `develop`, release PR `develop` to `main`,
    a GitHub Release titled `io-harness 0.14.0` with notes taken verbatim from the CHANGELOG, then
    `cargo publish` last.
  migrations:
  - >
    No schema change is expected. If one proves necessary it is additive only: `CREATE TABLE IF NOT
    EXISTS` in `Store::from_conn`, `CHECKPOINT_FORMAT` left at 7, no existing table reshaped.
  - >
    A consumer upgrades by changing the version. Nothing in the default build changes; the document
    capability is opt-in through the new feature.
  - >
    If the MSRV policy moves the floor, that is a migration for consumers on an older toolchain and
    is called out in the CHANGELOG with the reason.
  observability:
  - >
    Document actions appear in the existing trace and event surfaces as the file operations they
    are, gated and recorded on the real path — so an operator auditing what an agent touched sees
    documents alongside source rather than as an opaque tool call.
  rollback: >
    `cargo yank --vers 0.14.0`, leaving 0.13.0 as what a fresh `cargo add` resolves to. A consumer
    rolling back loses the document tools and the byte-level workspace IO; nothing in their store or
    their existing runs is affected, since the release adds no schema and changes no existing
    behaviour. Rolling back is cleaner than most releases here precisely because the capability is
    additive and opt-in.
dependencies:
  products:
  - >
    io-cli and io-studio follow this release rather than constrain it. Either could write its own
    document tool today under 0.9.0's `Toolbox`; the argument for shipping it here is that theirs
    would be outside the path policy and this one is not.
  - >
    io-eval does not exist yet, so no consumer is broken by the additions.
  services:
  - >
    A provider API key for the live-run evidence only. Every functional criterion runs against
    fixture documents.
  - >
    GitHub Actions for the three-OS matrix, which is load-bearing here: these formats are where
    path and line-ending differences actually bite.
  human_approvals:
  - >
    None. The owner's 2026-07-26 override authorizes the PRs, both merges, the GitHub Release and
    `cargo publish` without a review stop.
resource_profile:
  complexity: large
  uncertainty: medium
  likely_cost_drivers:
  - >
    Five formats, each with its own crate, its own failure modes and its own fixtures. The breadth
    is the cost; no single piece is hard.
  - >
    Fixtures are real work and are easy to get wrong. A fixture the test also generated proves the
    library round-trips its own output and nothing more, so F3 and F4 need real files produced by
    real applications, committed and kept small.
  - >
    PDF form filling's appearance streams. Setting the value is easy; making a viewer render it is
    the part that eats a day, and F7 is written to make skipping it visible.
  - >
    Preserving-edit fidelity is a judgement call of the same kind as 0.10.0's compaction rules —
    the library hedges on charts, drawings and OLE objects, so the release has to decide what it
    claims and pin it with a test rather than discovering the limit in a user's workbook.
  - >
    The first `[features]` section in the crate doubles the build matrix locally: everything has to
    pass with the feature off and on, and the off case is the one that will be forgotten.
  - >
    Dependency vetting is part of the work, not a preliminary. The research for this contract found
    several crates with marketing-grade descriptions, download counts out of line with their
    traction, and dozens of releases in weeks. Anything entering the tree gets checked for
    maintenance signal, licence and MSRV before it is adopted.
  preferred_tools:
  - '`Workspace::check_path` (src/tools/workspace.rs:117) and the built-in dispatch arms in
    src/run.rs as the templates: a document tool should be indistinguishable from `read_file` in how
    it is authorised.'
  - The dependency assessment taken for this contract, which covers each capability's leading
    crates with versions, dates, licences, MSRV and maintenance signal. It is the map; re-deriving
    it during development is waste, though anything adopted still gets verified at its current
    version.
  - '`Verification` (src/verify.rs) as the shape the document criterion joins, and 0.8.1''s work on
    what a passing gate does and does not prove as the standard for how honestly to describe it.'
  - rustc/cargo, clippy, rustfmt, `cargo tree` for the default-build assertion, and the three-OS
    matrix via `gh run view`.
  constraints:
  - >
    Document tools are built-ins with per-path gates. Not registered `Tool` implementations, and not
    a new authorisation concept — the gate they use is the one `read_file` and `write_file` already
    use.
  - >
    The documented bound on registered tools is not weakened, extended or restated as if it had
    changed. It is correct; this release simply does not rely on it.
  - >
    No system package on any runner. A capability that needs one is cut, not accommodated.
  - >
    Every document dependency is opt-in behind the feature, and the default dependency tree is
    asserted unchanged.
  - >
    Additive only: no public item renamed or removed, no existing behaviour changed, no schema
    reshaped, `CHECKPOINT_FORMAT` stays 7.
  - >
    Claims match capability. Where a library hedges, the crate hedges in the same place and in the
    doc comment, rather than in a changelog entry nobody re-reads.
  - >
    Minor semantics on a 0.x crate. The crate stays pre-1.0 and no 1.0.0 is planned or implied.
risks:
- >
  The document tools end up outside the path policy anyway — through a helper that opens a file
  directly, or a library API that takes a path instead of bytes. This is the release's worst failure
  mode, because it would ship the exact defect class 0.13.0 closed while appearing to be a feature
  release. Mitigation: byte-level workspace IO lands first and is the only way in; F1 and F2 are
  acceptance criteria with the negative control; and a review pass specifically greps the new code
  for direct filesystem access.
- >
  A "preserving edit" quietly drops what it did not model, and the damage is to a user's real
  document. Mitigation: F3 asserts the untouched sheet survives, the fixture is a real file rather
  than one the test generated, and whatever the library hedges on is hedged in the doc comment
  rather than assumed away.
- >
  A dependency turns out to be less healthy than it looked, or needs a system package once actually
  built on Windows. Mitigation: N3 makes that an automatic cut rather than a negotiation, and the
  fallback scope is already drawn around the healthiest subset.
- >
  The msrv leg starts failing on routine dependency updates, because several candidates sit exactly
  at the floor and keep raising it. Mitigation: the MSRV policy is a scope item decided in this
  release rather than a surprise in the next one.
- >
  Scope creep back toward OCR or PowerPoint, on the grounds that they were promised. Mitigation: the
  owner cut both from the roadmap outright rather than deferring them, the exclusions carry that
  decision alongside the evidence, and the CHANGELOG is required to say what was cut and why.
open_questions:
- >
  One feature or several? A single `documents` feature is simpler to explain and to test; per-format
  features (`xlsx`, `docx`, `pdf`, `barcode`) let a consumer who wants only spreadsheets avoid a PDF
  dependency tree. The expectation is one umbrella feature composed of per-format features, giving
  both, but it is decided in development against what the dependency trees actually look like.
- >
  Does the document criterion extend `Verification` or sit beside it? Extending it is the smaller
  change and keeps one stop-condition concept, but `Verification`'s existing variants are text and
  Rust oriented and a document variant only works when the feature is on — a conditional enum
  variant is a real design wrinkle. Decide first, before either is written.
- >
  How much does the agent see of a document it reads? Extracted text is the obvious answer and the
  bounded one, but a spreadsheet is not prose and rendering a sheet as text is a choice with real
  consequences for what the model can do with it. Settle the rendering per format against the 0.10.0
  context budget, the way 0.10.0 settled observation rendering.
- >
  Where do fixture documents live and how big are they? They have to be real files rather than
  generated ones for F3 and F4 to mean anything, and they are binary blobs in a git repository.
  Decide the size ceiling before adding the first one.
