known_limitations:
- >
  **The record is sealed before the crates.io upload.** `mode: published` states the authorized
  target; the sequence makes it true — this record rides the `feat/0.60.3` branch into develop, then
  develop merges to main, then the tag cuts the Release, then `cargo publish` runs last. The
  published byte size and the release URL belong in the final report, not in a later amendment to a
  sealed record.
- >
  **A6 is a sabotage that failed nothing, and it is a real gap in a checker rather than in this
  release.** Making `Preset::manner` `pub` — a genuine addition to the public surface — left
  `tests/public_api.rs` green. `docs/public-api.txt` enumerates the items re-exported from
  `src/lib.rs` (`enum Preset src/contract.rs`) and never their inherent methods, so a new `pub fn` on
  an existing public type does not move the snapshot at all. Nothing in this release is affected —
  `manner` is `pub(crate)`, verified in the source and by the unchanged snapshot — but N1's evidence
  is honestly "the diff and the source", not "the snapshot would have caught it". Pre-existing since
  the checker was written; recorded here because this is where it was found.
- >
  **The tree loop's F2 unit assertion could not fail before the fix.** The pre-fix
  `conversational_opening` took one boundary and had no second value to choose wrongly between, so
  the assertion could not be expressed against it. It was written after the fix, asserts the
  selection in both directions, and dies under sabotage arm A2. Its failing-first evidence is the
  flat loop's end-to-end assertion, which did fail. Stated rather than glossed: a test written after
  the code is weaker evidence than one written before it, whatever it asserts now.
- >
  **The `--all-features` suite ran on CI, not locally.** Every other gate above ran on this macOS
  host. The all-features leg is handed to the PR matrix, which runs it on three platforms in
  parallel — the standing arrangement since 0.53.0, restated here rather than left implicit.
- >
  **Three of the defects this release fixes are unreachable on the tree loop** and stay that way
  until 0.66.0 gives a contained session turn a contract. Fixed at the shared composition site
  regardless, because leaving a known-wrong composition in place until its entry point arrives is how
  0.37.0's half-written classification survived eleven releases.
- >
  **One composed prompt string changes.** A caller who selected `SystemPrompt::Preset` and snapshots
  composed system prompts will see "You may edit several files." present where the old preset bodies
  omitted it. Named in the CHANGELOG under Changed, asserted byte for byte by F6, and stated in
  `migrations`. No other `SystemPrompt` variant's output moves.
- >
  **`docs/STYLE.md` is enforced by nothing.** It documents a register the prose already follows, and
  the file says so itself. A checker for prose this small would reject good sentences more often than
  it caught bad ones — which is a judgement, not a measurement.
