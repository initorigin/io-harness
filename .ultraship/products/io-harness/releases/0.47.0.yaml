known_limitations:
- >
  **The record is sealed before the crates.io upload**, which follows the `develop` → `main` merge
  and the GitHub Release. `mode: published` states the authorized target; the flow makes it true.
- >
  **Windows enforces no filesystem or network boundary**, and this release does not change that in
  either direction. `ExecMode` is routed and reported on that platform and enforces nothing for the
  filesystem, exactly as in 0.46.0. The access half is 0.59.0
  (`US-IO-HARNESS-0.47.0-I01`), and `docs/CONTRACT.md`, the README, `src/lib.rs` and the changelog
  all say resource containment only.
- >
  **Three acceptance criteria were removed rather than met**: F7, F8 and F9 were the Windows arms
  and went with the deferral. F10 and F11 were renumbered F7 and F8, and F7 lost its Windows arm
  and kept its Linux one. Stated here rather than left for a reader to notice the criteria list
  and the roadmap disagreeing.
- >
  **`sandbox::appcontainer` ships compiled, unit-tested and selected by nothing**, carrying
  `allow(dead_code)` as it did from 0.26.0 until this release. It keeps three corrections this
  release paid for — an ACE must carry specific rights rather than generic ones, a tree grant must
  survive a descendant another process holds open, and a directory-only grant must not enumerate
  the directory — so 0.59.0 starts from them rather than re-finding them.
- >
  **`shell_start`'s backgrounded handles are still uncontained**, which is 0.48.0's, and the
  limitation stays stated in `docs/CONTRACT.md` until then.
- >
  **A workspace located inside the system temporary directory is not confined** on any unix
  backend, because every one of them grants that directory writable so a toolchain can open a
  temporary file. Found by the CI matrix in this release and documented rather than worked around.
supersedes: 0.46.0
next_recommended_version: 0.48.0
