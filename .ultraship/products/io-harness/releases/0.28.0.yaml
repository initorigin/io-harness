product: io-harness
version: 0.28.0
release_type: minor
status: planned
outcome:
  user_can: >
    Shape a run from `io.toml` instead of from Rust. `[[hook]]` declares what should happen when the
    run does something: a path to append the event stream to is an audit log, an argv to run is a
    notification or a formatter, and that same argv with one more key is a local policy check that
    can stop the run. Each is a table in a file rather than an `impl Observer` in someone's binary,
    and each reaches the run through the observer channel this crate has had since 0.12.0 —
    `Config::hooks()` hands back one `Observer` and the caller installs it exactly as it installs
    its own, so nothing in the run loop changes and nothing is loaded that the caller did not load.

    And a file the agent changed can be put back the way it was. Both write paths already read the
    previous contents before writing, to measure the edit (`src/run.rs:5229-5236`, `:7185`); this
    release keeps the first one it sees per file, in the store the crate already keeps, and
    `rewind` restores a path to what it was before this run first touched it — deleting a file the
    run created, because "the way it was" for a file that did not exist is not existing. The record
    is a row rather than a field on a struct, so it survives a kill and a resume, which is the class
    of thing 0.12.0 and 0.25.0 were both caught by.

    `[[hook]]` is refused in the project scope, whole. 0.27.0 refused `${cmd:}` in the file a
    `git clone` delivers because parsing a file must not be able to run a command; a hook that runs
    an argv is that primitive arriving one release later, and a hook that appends to a path the file
    names is a write to a path a stranger chose. `io.local.toml` and the user file are the stated
    alternative, in the same words `${cmd:}` already uses. The 0.27.0 rule is applied here, not
    weakened and not re-argued.
  business_value: >
    Every consumer that wants to watch a run today writes Rust. `Observer` is a trait
    (`src/observe.rs:682`) and the only implementation the crate ships is `Ignore`
    (`src/observe.rs:723`), so an audit log, a desktop notification, a formatter and a
    "refuse to continue if this script says no" are each a struct, an `impl`, a build, and a binary
    to redeploy. That is the correct shape for io-studio, which is a Rust program. It is the wrong
    shape for the operator io-cli serves, who has an `io.toml` and a shell script and no reason to
    own a compiler. 0.27.0 made the file the whole configuration; this is the release that lets the
    file change what a run *does* rather than only what it is allowed to do.

    Rewind is the other half of the same sentence, from the other end. The crate has been able to
    edit a real repository since 0.3.0 and to commit to it since 0.15.0, and it has never been able
    to undo one edit. `git checkout` is the answer for a clean tree and no answer at all for the
    workspace an operator was already working in, which is the workspace they point an agent at
    first. The information has been read and discarded on every write since 0.18.0 added line
    counting — the cost of keeping it is a row, and the cost of not keeping it is that the honest
    advice for trying this crate on real work stays "commit first".

    Both are cheap for the same structural reason and that is the argument for one release rather
    than two: neither invents a mechanism. Hooks are a projection onto `Observer`, which exists;
    rewind is a projection onto the pre-write read, which exists. What they share is the event and
    edit surface, and a mistake in the census of that surface reaches both.
  evidence_of_value: >
    An `io.local.toml` carrying three `[[hook]]` tables — an append, a run, and a run that cancels —
    driving a real run through `run_observed`, with the audit file holding one JSON line per event
    that matched a filter and none that did not, the notified command having received the event on
    its stdin, and the cancelling one having ended the run. That is the operator's whole story in
    one fixture, and it is the code an operator writes rather than the code we wish they would.

    For rewind, a run that creates one file and rewrites another, killed, resumed from a reopened
    store, and rewound: the created file gone, the rewritten one holding its original bytes, and a
    third file the run never touched reported as not recorded and left alone. The kill and the
    reopen are the criterion, not decoration — an in-memory undo would pass every other assertion
    in that list.
scope:
  included:
  - >
    **`[[hook]]`, an array of tables at the top level**, beside `[[mcp]]`, `[[agent]]` and
    `[[provider]]` (`src/config.rs:205`, `:213`, `:227`). Each table names which events it wants and
    one thing to do. It projects to `Config::hooks()` returning a `Hooks` — empty where the file has
    no table, which is the rule every accessor in this module already holds (`src/config.rs:483`) —
    and `Hooks` implements `Observer`, so the caller passes it to `run_observed`,
    `resume_observed`, or any of the tree forms exactly as it passes its own.
  - >
    **Two actions and no more.** `append = "audit.jsonl"` writes one JSON line per matching event,
    which is `serde_json` over a `RunEvent` that has been `Serialize` since 0.12.0 and needs no
    format invented for it. `run = ["notify-send", "done"]` spawns a fixed argv with the event JSON
    on stdin. A TOML array and never a string, so there is no split rule to get wrong and no shell
    anywhere — the discipline `${cmd:}` and the `exec` tool already hold.
  - >
    **A flat table with `deny_unknown_fields`, not a tagged enum.** `[[mcp]]` is the standing
    warning: `McpServer` uses `#[serde(flatten)]`, serde refuses `flatten` beside
    `deny_unknown_fields`, and a misspelled key inside one of those tables is therefore accepted
    (`src/config.rs:205-207`). A `kind`-tagged hook would need the same flatten for its common keys
    and would inherit the same hole. So `append` and `run` are two optional fields of one strict
    struct, with exactly-one enforced in code and reported naming the table's index.
  - >
    **`on`, and a census that makes it real.** `on = ["refused", "finished"]` names events by the
    wire tags `#[serde(tag = "event", rename_all = "snake_case")]` already produces
    (`src/observe.rs:288-290`); absent means every event. A name the crate does not emit is an error
    naming it and listing what it does emit, which requires a complete list of the variants — so
    `EVENT_NAMES` lands in `src/observe.rs` as the one census, `pub(crate)` because config is its
    only caller and a public const would be a semver commitment nobody has asked for.
  - >
    **The 0.25.0 defect, closed here because this release rests on it.** `every_kind()`
    (`src/observe.rs:808`) matches on the items of its own vector, which proves the arms exhaustive
    and never proves the vector complete; `TodoWrote`, `QuestionAsked` and `QuestionAnswered` have
    been absent from it, and therefore round-trip-untested, since 0.21.0. The fix is not adding
    three lines: it is `EVENT_NAMES` proven complete by a source read of `pub enum EventKind`, and
    `every_kind()`'s serialized tags asserted equal to it. A variant added later fails both.
  - >
    **A bounded executing hook.** `timeout_ms`, defaulted, enforced by spawning and polling
    `try_wait` to a deadline and killing the child past it — `std::process::Command`, no dependency,
    and no `tokio` inside a synchronous trait method. A hook that fails — non-zero exit, killed by
    the timeout, absent from `PATH`, or an append whose write failed — is a failure, and
    `on_failure` decides what a failure means.
  - >
    **`on_failure = "continue" | "cancel"`, defaulting to `continue`.** This is the whole of "a
    local policy check": `Observer::event` already returns `Flow` (`src/observe.rs:123`, `:689`) and
    `Flow::Cancel` already ends a run, so a hook that can stop one costs a key and not a mechanism.
    It applies to both actions rather than only to `run`, because one rule with no special case is
    easier to state than two.
  - >
    **`[[hook]]` refused in `Scope::Project`, whole.** Not the executing kind only. An `append` hook
    names a path the file chose, and a cloned repository choosing where this process writes is the
    same hazard by a shorter route. Refused naming the file and the scope with the alternative in
    the message, in the shape `refuse_widening` and the `${cmd:}` refusal already use
    (`src/config.rs:1195`, `:1383`) — including inside a `[profile]`, which is the path
    `refuse_widening` already walks and the one a rule of this kind forgets first.
  - >
    **Snapshots: one row per file per run, written at the first edit.** A new `snapshots` table,
    `INSERT` guarded by `WHERE NOT EXISTS` so a second edit to the same path does not move the
    restore point and storage stays bounded by the number of files a run touched rather than by the
    number of edits it made. Three recorded states, because the caller must be able to tell them
    apart: the previous text, the file was absent, and nothing was kept with the reason — a file
    over the size cap or one that is not UTF-8. A new table and deliberately **not** a
    `CHECKPOINT_FORMAT` bump (`src/state.rs:107`), for the reason 0.25.0 recorded: bumping it would
    make `check_resumable` refuse every 0.27.0 store over a table a 0.27.0 binary never queries.
  - >
    **`rewind`, a free function at the crate root** beside `run` and `resume`, taking the workspace
    and the store and returning a `Rewind` with four answers: restored, removed, nothing was kept
    and why, and this run never touched that path. Four rather than two for the reason
    `diagnostics::Outcome` has four (`src/tools/diagnostics.rs:66-90`): collapsing "not kept" into
    "not recorded" would tell a caller a file was untouched when the run had rewritten it. It writes
    through `Workspace::write_file` (`src/tools/workspace.rs:429`) and deletes only after
    `check_path(Act::Write, …)` (`:180`), so an undo obeys the same path policy the edit did.
  - >
    **The pre-write read made honest.** Today it is
    `.ok().and_then(read_to_string).unwrap_or_default()` (`src/run.rs:5229-5236`), which reports a
    binary or unreadable file as an empty one — harmless for a line count, and data loss for a
    rewind that would then truncate it. One read produces both the string `Edit::measure` wants
    (`src/state.rs:1809`) and the snapshot state, with every existing line count unchanged.
  - >
    Every test obligation this repository enforces rather than requests.
    `tests/config.rs::EVERY_KEY` (`:232`) gains `[[hook]]` and every key inside it, with
    `f7_every_key_reaches_a_typed_field` (`:351`) asserting each reaches a typed field and its
    negative-control twin (`:478`) extended. A strictness test for the new table modelled on
    `an_unknown_key_inside_the_web_table_is_rejected_naming_it` (`:1178`). `EVERY_KEY` already lives
    in `io.local.toml` since 0.27.0, which is where a hook table has to be anyway.
  - >
    Every documentation surface, in this release. A new `docs/guide/hooks.md` with a "The limits,
    stated plainly" block, named in `tests/guide_pages.rs::GUIDES`, in `docs/CAPABILITIES.md` and in
    the README's guide table. `docs/guide/configuration.md` gains a `### [[hook]]` section and its
    limits block (`:422`) grows. `docs/guide/durable-runs.md` gains a rewind section, because a
    restore point that survives a crash is a durability property before it is an editing one.
    `docs/CONTRACT.md`'s configuration block updated for the third exception to the scope rules, and
    its observability section for the fact that an observer can now come from a file.
    `docs/public-api.txt` hand-edited in sorted position for `Hooks`, `Rewind` and `rewind`, each
    with a worked example. `CHANGELOG.md`, Added first because nothing here breaks.
  excluded:
  - >
    **A formatter as a second pass at the edit site.** 0.25.0's diagnostics pass runs after a
    successful edit and attaches what it found (`src/tools/diagnostics.rs:162`), and the obvious
    move is to put a formatter beside it. It is the wrong place, for a reason that is a property of
    the code rather than a preference: that pass **reads**, and a formatter **writes**. A formatter
    there would leave the model reading `[wrote src/x.rs] (412 chars)` about bytes that are no
    longer on disk, and would run after `Wrote::moved_the_workspace` (`src/tools/workspace.rs:53`)
    was already computed — the signal 0.11.0's stall detection rests on. A formatter is therefore a
    hook: `on = ["step"]`, `run = ["cargo", "fmt"]`, three lines in a file, which is exactly what
    the roadmap's own sentence promised. The guide carries that example rather than a paragraph
    explaining its absence.
  - >
    **A `format_on_write` key, and a `FORMATTERS` table beside `CHECKERS`.** Follows from the
    above. It would also need a per-file formatter argv per ecosystem that `src/toolchain.rs` does
    not carry — `Toolchain::format` (`:83`) is the project-wide command, `cargo fmt` and
    `mix format` and `npm run format`, none of which takes a path the way a per-edit formatter would
    need. Inventing that table is a maintenance surface bought to replace three lines of TOML.
  - >
    **An undo tool the agent can call.** Rewind is the operator's, reached from Rust or from
    whatever io-cli exposes. Giving the model an undo is a new tool name, a new entry in
    `RESERVED_TOOL_NAMES`, prompt surface in every run, and a loop nobody wants: write, undo, write.
    The outcome sentence is about a file being put back, and it does not say by whom.
  - >
    **Per-edit undo, and a rewind to an arbitrary step.** One restore point per file per run, taken
    at the first edit. That is what "put it back the way it was" means and it is what bounds the
    storage; a per-edit history is a different feature with a different name, and nothing has asked
    for it.
  - >
    **Rewinding a whole tree from the parent.** A sub-agent runs under its own `run_id`, so its
    snapshots are its own. `Store::spawns` already enumerates the children and a caller who wants
    the tree walks it. A tree-wide rewind is an ordering question — two children that edited the
    same file — and inventing an answer to it before anyone has the problem is how a wrong answer
    gets frozen.
  - >
    **A hook on anything that is not an event.** No `pre_run`, no `post_edit`, no lifecycle of its
    own. The events the channel emits are the lifecycle, they are already documented, already
    serialized and already tested, and a second vocabulary beside them would need its own census —
    which is precisely the defect this release is closing.
  - >
    **A shell, a working directory, an environment, or template substitution in a hook's argv.**
    The event is on stdin; a script that wants a field parses it. Every one of those is a key that
    can be added later on evidence, and each is a new way for a file to describe a process.
  - >
    **A timeout on `${cmd:}`.** Still the standing 0.27.0 limitation, still argued there, and
    deliberately not fixed by proximity just because this release writes a bounded wait ten lines
    away. `Config::discover` is the caller's own call before any run exists; a hook fires inside a
    run loop. The two are not the same hazard and one bound does not follow from the other.
  - >
    Wrapping `rusqlite::Error` out of the public API, and wiring `[toolchain]` into this crate's own
    run loop. Both standing, both still right, both still not this release.
  fallback_scope:
  - >
    **Trigger A — rewind cannot be shown to survive a resume, and the release drops it.** Named as:
    either the F8 control failing — a `Store` reopened at the same path not returning the snapshot
    written before it was closed — or a resume path being found that starts a *new* `run_id` for the
    same workspace, which would make "before this run first touched it" name a different run after a
    crash and turn rewind into a restore to the wrong bytes. Checked by reading how `resume` and
    `resume_tree` obtain their run id **before** the table is written, not after. If it trips,
    0.28.0 ships hooks and the event census alone, rewind moves to a later version with an UltraShip
    iteration recording the resume path that defeated it, and no `snapshots` table is created — a
    table shipped and then abandoned is worse than one never shipped, because it is state a later
    release has to keep opening. The release stays coherent: "an operator shapes a run from the file
    they already have" is a complete sentence, and it is the half the roadmap entry leads with.
  - >
    **Trigger B — an executing hook cannot be bounded, and the `run` action drops.** Named as: the
    spawn-and-poll wait failing to kill a child that outlives its deadline on any platform in the
    matrix, proven by a hook that sleeps past `timeout_ms` and is *not* reported as a failure, after
    one round of correcting the wait. Not "seems racy". If it trips, `[[hook]]` ships with `append`
    only: an audit log needs no bound, is one `writeln!`, and is the use the outcome names first.
    `run`, `on_failure` and `timeout_ms` move to a later version with an iteration recording the
    platform that could not be bounded, and `docs/guide/hooks.md` says the file can watch a run and
    cannot yet act on one — which is a smaller claim and a true one.
acceptance:
  functional:
  - >
    F1 — a hook declared in a file fires on the events it names and on no others. An
    `io.local.toml` with `on = ["refused", "finished"]` and an `append` path, installed through
    `run_observed`, leaves an audit file holding one JSON line per matching event and no line for
    any other. **Two negative controls, and the criterion is worthless without both:** a hook with
    **no** `on` key receives every event, asserted by the set of tags in its file being equal to the
    set the run emitted rather than merely non-empty; and a hook naming one event that the run never
    reaches produces an empty file rather than no file, so "the filter matched nothing" stays
    distinguishable from "the hook never ran".
  - >
    F2 — an event name this crate does not emit is refused at load, naming it. `on = ["finshed"]`
    fails the load naming the key and the misspelling, in the shape every other strictness error in
    the module uses (`src/config.rs:1178` is the pattern). **The negative control is every name in
    `EVENT_NAMES` accepted in a single `on` list**, so a rule that refused anything it did not
    recognise from a hand-typed subset is caught here rather than by the first operator who hooked
    `todo_wrote`.
  - >
    F3 — the event census is a census, and the 0.25.0 defect is closed. Three assertions, and each
    one is load-bearing for the one after it. `EVENT_NAMES` is proven complete by reading
    `pub enum EventKind` out of `src/observe.rs` and comparing the snake_cased variant names against
    it — the source-assertion style `tests/public_api.rs` and 0.27.0's F2 already use, because
    `#[non_exhaustive]` and `strum` are each unavailable for the reasons those releases recorded.
    `every_kind()`'s serialized tags are then asserted **equal to** `EVENT_NAMES` rather than
    contained in it, which is the exact assertion `src/observe.rs:808` has been missing since
    0.21.0. And `TodoWrote`, `QuestionAsked` and `QuestionAnswered` round-trip, which they have
    never done. **The negative control is the completeness helper run against `EVENT_NAMES` with one
    entry removed, which must report exactly that name** — a helper that always answers "complete"
    is the failure mode that produced the defect in the first place, and it must be seen answering
    no.
  - >
    F4 — an executing hook runs a fixed argv with no shell, is handed the event, and is bounded. A
    `run` hook receives the event JSON on stdin and the JSON parses to the event that fired. A hook
    whose argv contains `;`, `&&` or `$(…)` receives them as **arguments** — asserted by the child
    echoing its own argv back, not by asserting the absence of a shell. A hook that sleeps past
    `timeout_ms` is killed and reported as a failure. **The negative control is the same command
    inside the timeout, which must complete and not be reported as a failure**, so "bounded" is not
    satisfied by an implementation that kills everything. Written cross-platform by naming each
    platform's own sleep and echo rather than by skipping on Windows, which is the lesson 0.27.0's
    F4 paid for.
  - >
    F5 — a hook can stop a run, and by default cannot. A `run` hook with `on_failure = "cancel"`
    whose command exits non-zero ends the run, asserted on the run's outcome rather than on the
    event stream. **The negative control is the byte-identical hook with `on_failure` absent**,
    after which the run reaches its own ending — so the default is proven to be the safe one, and a
    notification that happens to fail is proven not to be a kill switch.
  - >
    F6 — `[[hook]]` is refused in the project scope, whole, and the refusal is about hooks. A
    `[[hook]]` in `io.toml` fails the load naming the key, the file and the scope, and the same
    inside `[profile.x]` fails too — the path `refuse_widening` (`src/config.rs:1195`) already walks
    and the one a rule like this forgets. **Two negative controls:** the byte-identical table in
    `io.local.toml` loads and produces a working hook, and an unrelated key in the same project
    `io.toml` still loads, so the test cannot pass on an implementation that refused the project
    scope wholesale — which is the shape 0.27.0's F4 control exists to catch and the same mistake is
    available here.
  - >
    F7 — a file the agent changed is put back the way it was, including one it created. After a run
    that rewrites one file and creates another, `rewind` restores the first to its original bytes
    and removes the second, reporting `Restored` and `Removed` respectively. **Three negative
    controls:** a path the run never touched is `NotRecorded` and is **not modified**, asserted on
    the file's contents and not only on the return value; a second edit to the same path does not
    move the restore point, so rewinding after two edits yields the bytes from before the first; and
    a file whose prior contents were not kept — over the cap, or not UTF-8 — is `NotKept` with a
    reason and is left exactly as it is, never truncated, which is the one way this feature could
    destroy something.
  - >
    F8 — a rewind survives a crash and a resume. A store written by one process, dropped, and
    reopened at the same path still rewinds to the pre-run bytes, and the run id a resume continues
    under is the one the snapshots were written against. Asserted through a reopened `Store` rather
    than a reused handle, because an in-memory restore point passes every other assertion in F7.
    **The negative control is a snapshot written under a different `run_id` in the same store, which
    must not be reachable from the first run's rewind** — so "durable" is not satisfied by a lookup
    that ignores which run asked.
  - >
    F9 — every new key reaches a typed field, and the new table rejects what it does not know.
    `tests/config.rs::EVERY_KEY` (`:232`) names `[[hook]]` and every key inside it and
    `f7_every_key_reaches_a_typed_field` (`:351`) asserts each lands. **The negative control is its
    existing twin** `f7_a_key_removed_from_that_file_leaves_exactly_that_field_at_its_default`
    (`:478`), extended to one new key so the fixture proves the field is read rather than defaulted.
    Plus a strictness test modelled on `an_unknown_key_inside_the_web_table_is_rejected_naming_it`
    (`:1178`), and one asserting that a hook table with **neither** `append` nor `run`, or with
    **both**, is refused naming the table's index.
  non_functional:
  - >
    NF1 — the full suite passes on macOS, Linux and Windows with no test skipped, ignored or made
    conditional. The standing exception is
    `skills::discovery_over_a_32_skill_directory_is_under_50ms`, a wall-clock assertion that fails
    intermittently on the Windows runner under load and is re-run rather than investigated.
  - >
    NF2 — **no new dependency, on any platform.** `cargo tree` on the default feature set reads 402
    lines after this release as before it. A hook is `std::process::Command` and `std::fs`; the
    event line is `serde_json`, already a dependency and already what serializes a `RunEvent`; the
    snapshot is a `rusqlite` row. The bounded wait is `try_wait` and `std::thread::sleep`, not a
    timer crate, and not `tokio` — `Observer::event` is synchronous and reaching for a runtime
    inside it is how a nested-runtime panic gets shipped.
  - >
    NF3 — **`CHECKPOINT_FORMAT` stays 7 and a 0.27.0 store still opens, resumes and replays.**
    `snapshots` is a new table, which is additive, and bumping the format would make
    `check_resumable` (`src/state.rs:3329`) refuse every existing store over a table an older binary
    never queries — the reasoning 0.25.0 recorded and the property `tests/cross_version.rs` exists
    to hold. Proven by the existing cross-version suite passing unchanged, not by argument.
  - >
    NF4 — `cargo doc` is warning-free, docs.rs builds with all features, `cargo fmt --check` is
    clean, and `cargo clippy --all-targets -- -D warnings` is clean on every platform in the matrix.
    Doc examples use literals rather than `${env:HOME}`, which is unset on `windows-latest` and cost
    0.27.0 a CI round.
  operational:
  - >
    OP1 — `docs/public-api.txt` is hand-edited in sorted position for `Hooks`, `Rewind` and
    `rewind`, and each carries a doc comment with a worked example. `tests/public_api.rs` fails
    otherwise, and there is deliberately no `--bless`. No other name is added: `EVENT_NAMES` is
    `pub(crate)` and the snapshot row is not public, because the caller's question is "put it back",
    not "show me the row".
  - >
    OP2 — `docs/CONTRACT.md` updated **from the code**, in two places rather than one. The
    configuration block gains `[[hook]]` as the third scope-dependent refusal beside `${cmd:}` and
    the four widening keys, stated as a refusal of the whole array rather than of its executing half
    — a reader who infers the narrower rule will write a project file that does not load. The
    observability section gains the fact that an `Observer` can now come from a file, and that a
    hook is still the caller's to install. This is 0.25.0's, 0.26.0's and 0.27.0's OP2 recurring,
    and it recurs because the defect class is a document written from the plan rather than from the
    source.
  - >
    OP3 — `docs/guide/hooks.md` exists, is named in `tests/guide_pages.rs::GUIDES` with
    `limits_block: true`, is listed in `docs/CAPABILITIES.md` and in the README's guide table, and
    its "The limits, stated plainly" block states the five this release creates: a hook blocks the
    run loop while it runs, a hook is refused in the project scope, an `append` hook opens its file
    per event, a hook's failure is only fatal when the operator asked for it, and a hook receives
    events and grants nothing — the boundary is still the `Policy` the caller loaded.
  - >
    OP4 — `docs/guide/configuration.md` gains a `### [[hook]]` section and its limits block (`:422`)
    grows; `docs/guide/durable-runs.md` gains a rewind section stating what one restore point per
    file per run does and does not offer. The formatter example lives in `hooks.md` as three lines
    of TOML, which is the release's own claim about formatters and the cheapest possible way to
    make it.
  - >
    OP5 — `cargo package --locked` exits 0 and the tarball is verified by **listing** rather than by
    trusting the `exclude` list: no `.env`, no `.ultraship`, no `.github`. MSRV 1.95 re-checked in
    both directions rather than read off the manifest, which is the lesson 0.23.0 paid for.
    `df -h .` is read before packaging and before publishing, because a full disk on this machine
    surfaces as a linker error and reads like a toolchain bug.
delivery:
  target_mode: published
  environment: >
    crates.io as `io-harness` 0.28.0, GitHub at initorigin/io-harness with the tag `v0.28.0` and a
    Release titled `io-harness 0.28.0`, and docs.rs, whose build is checked by the nightly CI job.
  deployment_method: >
    The standing flow. All work on `feat/0.28.0` off `develop`, including the sealed UltraShip
    release record. PR into `develop`, merged with the PR button. Release PR `develop` into `main`,
    merged the same way. The GitHub Release is cut by `release.yml` — `gh workflow run release.yml
    --ref main -f version=0.28.0` — which refuses any ref but `main`, a version the manifest does
    not declare, an existing tag, or a version with no changelog section, and takes its notes
    verbatim from the changelog. `cargo publish --locked` by hand afterwards, always last, after
    both merges and the Release exist. `develop` synced to `main` fast-forward only at the end. No
    branch is deleted.
  migrations:
  - >
    Nothing breaks. `[[hook]]` is a new optional table, `Config::hooks()`, `rewind`, `Rewind` and
    `Hooks` are new names, and `EventKind` is `#[non_exhaustive]` and gains no variant. A file, a
    program and a database written for 0.27.0 all behave exactly as they did.
  - >
    `snapshots` is a new table created by `CREATE TABLE IF NOT EXISTS` on open, so an existing store
    gains it on first use with no migration step and `CHECKPOINT_FORMAT` stays 7. A run that
    happened before this release has no snapshot rows, so `rewind` on it is `NotRecorded` — the
    honest answer, and the reason `NotRecorded` is a variant rather than an empty restore.
  - >
    A project-scoped `io.toml` that carries `[[hook]]` fails the load naming the key. No such file
    can exist today, because the table does not, so this is a rule stated ahead of the first file
    rather than a break.
  observability:
  - >
    A hook that failed is traced at warn level with the hook's index, its action and the reason,
    and never with the event's contents, which may carry a goal or a tool argument. An operator
    whose notification stopped arriving has one line to find; an operator whose audit log stopped
    being written has the same line.
  - >
    `Config::sources()` (`src/config.rs:368`) already reports which files were merged and in which
    order, which is the existing answer to "why is my hook not firing" once the scope refusal has
    been read.
  - >
    A snapshot is written on the same path as `record_edit` and, like it, a store that cannot take
    the row is logged and swallowed (`src/run.rs:7195`). A rewind that finds nothing then reports
    `NotRecorded` rather than claiming the file was untouched — the failure is visible at the moment
    it matters rather than at the moment it happened.
  rollback: >
    A published version cannot be recalled; the forward fix is 0.28.1 and `cargo yank --version
    0.28.0` is the escape hatch, leaving 0.27.0 as what `cargo install` resolves. A consumer
    reverting to 0.27.0 keeps every database — this release changes no schema version and no stored
    format, and a 0.27.0 binary never queries `snapshots` — and loses `[[hook]]`, which a 0.27.0
    loader rejects as an unknown key rather than ignoring, so the revert is loud rather than silent.
    The one file edit a revert forces is deleting the `[[hook]]` tables, and a file with none of
    them is valid under both versions.
dependencies:
  products: []
  services:
  - GitHub Actions runners for macOS, Linux and Windows
  - crates.io, for publication
  - docs.rs, for the rendered API reference
  human_approvals:
  - Owner approval to merge to `main`, cut the Release, and publish, per the standing override.
resource_profile:
  complexity: medium
  uncertainty: medium
  likely_cost_drivers:
  - >
    Two features that share only a surface. Hooks live in `src/config.rs` and `src/observe.rs`;
    rewind lives in `src/state.rs`, `src/run.rs` and `src/tools/workspace.rs`. What they share is
    the census of what a run emits and edits, which is why one of them fixing that census pays for
    the other — and why the fallback triggers cut one whole feature each rather than trimming both.
  - >
    Spawning a child from inside a synchronous trait method called from an async run loop. The
    bound must not reach for `tokio`, must not block a runtime thread indefinitely, and must kill
    on all three platforms. It is the single riskiest ten lines in the release, which is why
    Trigger B is written against it specifically.
  - >
    The pre-write read is on the hot path of every edit and is currently three chained combinators
    that lose information. Replacing it correctly means every existing line-count assertion in
    `tests/edit_file.rs`, `tests/edit_tool.rs` and `tests/accounting.rs` must be unchanged, and that
    is a property to verify rather than to assume.
  - >
    The documentation is a new page plus edits to four existing surfaces, and `tests/guide_pages.rs`
    and `tests/readme.rs` both fail on a page that is added without being wired in — which is the
    intended cost, not a surprise.
  preferred_tools:
  - The existing `Observer` trait and `Flow` (`src/observe.rs:682`, `:123`), so a hook needs no new
    channel and no change to any run loop
  - The existing `Serialize` on `RunEvent` (`src/observe.rs:197`), so the audit line needs no format
  - The existing scope refusal shape (`src/config.rs:1195`, `:1383`), so `[[hook]]` is refused the
    way `${cmd:}` already is
  - The existing pre-write read at `src/run.rs:5229-5236` and `record_edit` (`:7185`), so a snapshot
    costs a row and not a second read
  - '`Workspace::write_file` and `check_path` (`src/tools/workspace.rs:429`, `:180`), so a rewind
    obeys the policy the edit obeyed'
  - '`std::process::Command` with `try_wait`, so a bounded hook needs no timer crate and no runtime'
  constraints:
  - No new dependency on any platform; `cargo tree` stays 402 on the default feature set
  - '`CHECKPOINT_FORMAT` stays 7; new tables only, and an 0.27.0 store still resumes'
  - No new `TaskContract` field, no new `Scope` variant, no new `EventKind` variant
  - No shell anywhere; a hook's argv is an array and stays an array
  - Nothing is loaded implicitly; `Config::hooks()` is installed by the caller like every other
    observer
  - Stay 0.x
risks:
- >
  **A hook is a synchronous side effect inside the run loop, and that is the sharpest thing in the
  release.** `Observer::event` returns `Flow` and blocks until it does; an operator who hooks
  `token` — emitted per streamed token — with a `run` action has attached a process spawn to every
  token. The mitigation is the default timeout, the warn-level trace, and the guide saying which
  events are hot in the same paragraph as the feature rather than in a footnote. It is not
  mitigated by a queue: an asynchronous hook cannot return `Flow::Cancel` in time to stop anything,
  which would delete the policy-check half of the feature.
- >
  **The census fix is a text parse of this crate's own source and text parses rot.** A variant
  declared across two lines, or a doc comment containing something that looks like a variant, would
  break it. The mitigation is that it is the same technique `tests/public_api.rs` has run since
  0.16.0 over a much larger surface, and that its negative control asserts it can report a missing
  name rather than only that it currently reports none.
- >
  **Rewind is the one feature in this crate that deletes a file.** A wrong `Removed` destroys work.
  The mitigation is the shape of the record: `Removed` happens only where a row says the file was
  absent before the run wrote it, `NotRecorded` and `NotKept` change nothing at all, and F7's third
  control asserts the not-kept case leaves the file byte-identical rather than truncated. The
  residual risk is a file created by the run and then edited by a human before the rewind, which the
  crate cannot see; the guide states it.
- >
  **The trust rule claiming more than it delivers, again.** Refusing `[[hook]]` in `io.toml` does
  not make a cloned repository safe, for the reasons 0.27.0 already recorded: `[[mcp]]` still names
  a command and `[toolchain]` still names an argv. The documentation must say which array and no
  more, in the same words, or the crate accumulates a reputation for a guarantee it never made.
- >
  **Scope, honestly.** Two features and one defect. They do not share a module, which is the
  argument against one release, and they do share the surface each is defined against — the events
  a run emits and the edits it makes — which is the argument for it. The two triggers cut one
  feature whole rather than trimming both, because a release that ships one of these completely is
  better than one that ships two at four-fifths.
open_questions:
- >
  Whether an `append` hook's path is resolved relative to the config file that declared it or to the
  discovery root. The file's own directory is what `${file:}` already does and is the answer a
  reader of one file would guess; the discovery root is what an operator with a user-scope file
  probably means. Decided in development against what a user-scope hook writing a per-project audit
  log actually needs.
- >
  Whether `on_failure = "cancel"` on an `append` hook is meaningful or should be refused. One rule
  with no special case is cheaper to state, and an audit log whose write fails is arguably exactly
  the thing an operator would want to stop a run for. Decided against whether the failure modes of a
  file write are ones a run should die on.
- >
  Whether the size cap on a snapshot is a constant or a key. A constant is the module's house style
  for every other bound of this kind; a key is one more thing in `EVERY_KEY`. Decided against
  whether any plausible workspace has text files a rewind would want and the cap would refuse.
- >
  Whether `rewind` takes a path or rewinds every path the run touched. One path is the smaller
  surface and composes with `Store::edits`; all paths is what an operator asking "undo it" means.
  Decided against what the return type has to say when half the paths are `NotKept`.
