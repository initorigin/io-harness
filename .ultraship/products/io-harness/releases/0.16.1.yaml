product: io-harness
version: 0.16.1
status: released
release_type: patch
outcome:
  user_can: >
    A developer who reads the io-harness README to the end can tell which initorigin products exist
    and which of them they can go and look at. Today they cannot. The "Part of initorigin" table
    lists five repositories as if all five were things a reader could open: four are private, and
    two of those — `io-eval` and `website` — have not been built at all. Every link but
    `io-harness`'s own returns a 404 to anyone who is not the owner, and a reader has no way to tell
    an unbuilt product from a private one from a shipped one, because the table has no status.

    After this release the table lists the three products this crate is actually for — io-harness,
    io-cli, io-studio — with a status column saying where each one stands, and it links only
    io-harness, because that is the only repository a reader can open. io-cli and io-studio are
    named without links and marked as in development, which is true and is also the reason there is
    no link. `io-eval` and `website` are removed rather than marked, because a roadmap entry is not
    a product and the README is not the place to keep one.

    Separately, a contributor copying `.env.example` is no longer told to obtain a crates.io publish
    token. `CARGO_REGISTRY_TOKEN` is the maintainer's publishing credential, not a prerequisite for
    building or testing the crate, and its presence in the template implies a permission a
    contributor neither has nor needs.

    Nothing a caller wrote against 0.16.0 changes. No public item is added, renamed, or removed, no
    behaviour differs, and a 0.16.0 contract compiles and behaves identically.
  business_value: >
    0.16.0's entire thesis was that the documentation is part of the contract — it shipped five
    checkers to enforce claims the prose makes, precisely because a claim with nothing checking it
    rots. The product table is a claim the release did not check and did not correct: it was carried
    forward unchanged from the release-history README that 0.16.0 replaced, and it is the only part
    of the file that still describes an intention rather than a fact.

    The cost of leaving it is specific, not cosmetic. The README is the crates.io landing page for a
    published crate. A prospective user who clicks `io-eval` or `io-studio` and gets a 404 learns
    that this project links to things that do not exist — which is exactly the inference 0.16.0 was
    written to prevent, arrived at from the last section instead of the first. Naming two unbuilt
    products alongside two real ones also inflates what the project claims to be, which is the
    opposite of the honest-limitations posture the crate keeps everywhere else.

    It is deliberately a patch. There is no code in it, so a consumer can take it without reading
    anything, and holding a documentation correction back until the next minor would leave the wrong
    page live on crates.io for as long as that takes.
  evidence_of_value: >
    The rendered README on crates.io and GitHub for 0.16.1 showing the three-product table with its
    status column, every link in it resolving for an anonymous visitor, and no reference anywhere in
    the repository that contradicts it — established by a repository-wide search for the removed
    product names, not by having looked at the one file that was edited.

    For the template: `.env.example` containing no publishing credential, and the test suite and the
    documented contributor setup still working from it unchanged, which is what proves the variable
    was never a prerequisite.
scope:
  included:
    - >
      Rewrite the README's "Part of initorigin" table. Three rows — io-harness, io-cli, io-studio —
      with a status column. io-harness is `Released` and keeps its link. io-cli and io-studio are in
      development and are named WITHOUT a link, because their repositories are private and a link to
      a private repository is a 404 to every reader who is not the owner. `io-eval` and `website` are
      removed from the table entirely rather than listed as unbuilt.
    - >
      A sentence under the table saying plainly that io-harness is the only public repository today
      and that the other two open when they release, so the absence of a link reads as a stated fact
      rather than as an oversight.
    - >
      A repository-wide search for anything else the change contradicts — `io-eval`, `website`, and
      links to the private repositories — across README.md, `src/lib.rs` (the docs.rs landing page,
      which 0.16.0's `readme` checker holds to the same standard), the twelve guide pages,
      docs/CAPABILITIES.md, docs/CONTRACT.md, CONTRIBUTING.md, and the Cargo.toml metadata. Anything
      found that presents an unbuilt or private product as available is corrected the same way.
      Sealed UltraShip release records and past CHANGELOG entries are explicitly NOT rewritten: they
      are historical statements about what was true when they were written.
    - >
      Remove `CARGO_REGISTRY_TOKEN` and its comment from `.env.example`. No CHANGELOG entry for this
      one — it is a maintainer-only credential removed from a contributor template, not a
      user-facing change, and announcing it in release notes would be noise about a variable no
      consumer of the crate ever sets.
    - >
      The version bump to 0.16.1 in Cargo.toml and Cargo.lock, and a CHANGELOG `[0.16.1]` section
      covering the README correction, stating explicitly that there are no breaking changes and no
      code change.
    - >
      The full release flow through to crates.io: the sealed completion record on `feat/0.16.1`, PR
      to `develop`, release PR to `main`, the GitHub Release, then `cargo publish`.
  excluded:
    - >
      Any code change. This is a patch with no `src/` edit other than a documentation comment if the
      search finds one — no new public item, no behaviour change, nothing a 0.16.0 caller could come
      to depend on.
    - >
      The four defects the 0.16.0 audit found and documented in `docs/CONTRACT.md` — the reserved
      tool-name gap, `resume_tree` not recording its policy, `SandboxLimits::max_processes` being
      enforced by nothing, and the absent Linux seccomp filter. Each is a behaviour change and each
      needs a release that can carry a break. None of them belong in a documentation patch.
    - >
      Rewriting `io-eval` or `website` out of the sealed release records, the roadmap's earlier
      entries, or `product.yaml`. Those describe the product's intent and its history, both of which
      still include those products; only the README's public-facing table claims they are available
      today.
    - >
      Any change to the five checkers 0.16.0 shipped, or a new checker for the product table. The
      table's contents change when a product's status changes, which is not often and is not
      mechanically derivable from anything in this repository — a checker for it would assert a fact
      it cannot verify.
    - >
      Adding io-cli or io-studio crates.io links in place of the repository links. io-cli is
      published, but this release's whole point is that the README should not imply a reader can go
      and look at a product that is still in development.
  fallback_scope:
    - >
      The README table alone — three rows, status column, io-harness linked and the other two not —
      plus the version bump and the CHANGELOG entry, shipped as 0.16.1. This is still a coherent
      release: the wrong page on crates.io is the reason the release exists, and it is fixed. The
      `.env.example` cleanup and the repository-wide sweep would then ride the next release.
acceptance:
  functional:
    - >
      F1 — the README's product table has exactly three rows (io-harness, io-cli, io-studio), carries
      a status column, and contains no occurrence of `io-eval` or `website`.
    - >
      F2 — the only link in that table is io-harness's. Neither io-cli nor io-studio is a markdown
      link to any URL, and the table is followed by a sentence stating that io-harness is the only
      public repository today.
    - >
      F3 — a repository-wide grep for `io-eval`, `initorigin/website`, `initorigin/io-cli` and
      `initorigin/io-studio` returns hits only in files that are historical by design: CHANGELOG.md's
      past entries, the sealed `.ultraship/products/io-harness/releases/*.yaml` records, and
      `product.yaml`/`roadmap.yaml`. No hit in README.md, `src/lib.rs`, `docs/`, CONTRIBUTING.md, or
      Cargo.toml.
    - >
      F4 — `.env.example` contains no `CARGO_REGISTRY_TOKEN` line and no comment referring to a
      publish token, and every remaining variable in it is one a contributor running the suite
      actually sets.
    - >
      F5 — CHANGELOG.md has a `[0.16.1]` section that describes the README correction, states there
      are no breaking changes, and does NOT mention the `.env.example` change.
  non_functional:
    - >
      NF1 — no public API change. `git diff origin/main -- src/ | grep -E "^[-+]\s*pub "` is empty
      for the whole branch, and `tests/public_api.rs` passes against the unchanged snapshot.
    - >
      NF2 — the five 0.16.0 checkers stay green with no test edited to accommodate the change:
      `readme`, `public_api`, `docs_drift`, `changelog`, and `guide_pages`. `readme` is the one this
      release could plausibly break, since it asserts properties of the file being edited; it must
      pass unmodified.
    - >
      NF3 — `cargo test`, `cargo clippy --all-targets -- -D warnings`, and `cargo fmt --check` all
      exit 0, MSRV stays 1.88, and the default `cargo tree` stays at 401 lines.
    - >
      NF4 — `cargo package` succeeds and the crate description stays under the crates.io
      1000-character cap. The packaged `.crate` is inspected for a `.env`, a secret-shaped path, or
      any file the `exclude` list should have caught.
  operational:
    - >
      O1 — the rendered README on crates.io for 0.16.1 shows the corrected table, and every link in
      it resolves for a logged-out visitor. Checked after publishing, from the published page rather
      than from the local file.
    - >
      O2 — the release trail is the standard one and readable without this session: feat branch with
      the sealed record, two merged PRs, a GitHub Release titled `io-harness 0.16.1` with notes taken
      from the CHANGELOG, then the crates.io upload.
delivery:
  target_mode: published
  environment: crates.io, plus the three-OS GitHub Actions matrix.
  deployment_method: >
    The initorigin release flow with the 2026-07-26 owner override in effect: all work including the
    sealed completion record on `feat/0.16.1`, PR to `develop`, release PR `develop` to `main`, a
    GitHub Release titled `io-harness 0.16.1` with notes from the CHANGELOG, then `cargo publish`
    last. The owner has additionally authorized not waiting on the CI matrix for this release, on the
    stated grounds that it carries no code change; the local suite is still run in full before the
    first merge, so the release is not unverified — only unqueued.
  migrations:
    - >
      None. No schema change, no public API change, no configuration change. A consumer upgrades by
      changing the version number, and a consumer who does not upgrade loses nothing but a corrected
      README.
  observability:
    - >
      The rendered crates.io page after publishing, which is the artifact this release exists to fix
      and the only place its effect is visible. Nothing in the crate's runtime behaviour changes, so
      the trace and the `tracing` spans have nothing to say about it.
  rollback: >
    `cargo yank --vers 0.16.1`, leaving 0.16.0 as what `cargo add` and `cargo install` resolve to —
    which returns a consumer to the exact code they are on today, since the two versions differ by
    no code at all. Yanking is an owner-approved action, and for a documentation patch the far more
    likely correction is a forward 0.16.2.
dependencies:
  products:
    - >
      io-cli and io-studio are the two products this release describes. Neither is blocked by it and
      neither changes; the release only stops the README from claiming a reader can open their
      repositories.
  services:
    - >
      crates.io for the upload, and GitHub for the Release. The three-OS matrix will run on the merge
      but is not gated on for this release, per the owner's instruction and the absence of any code
      change.
  human_approvals:
    - >
      The status wording and the decision to drop `io-eval` and `website` from the table are the
      owner's, and were given directly: remove those two, add a status column, io-harness released,
      io-cli and io-studio in development with no links.
    - >
      The crates.io publish itself is irreversible and stays the owner-approved gate it has been
      since 0.6.0.
resource_profile:
  complexity: small
  uncertainty: low
  likely_cost_drivers:
    - >
      The repository-wide sweep, not the table. The table is a five-minute edit; finding everything
      else that contradicts it is the part that can be done badly, and doing it badly is how a
      documentation release ends up half-applied.
    - >
      `tests/readme.rs` asserts properties of the exact file being edited. It should be unaffected —
      the change touches neither the first screen nor any heading — but it has to be run rather than
      assumed, and it is the one place this release could fail unexpectedly.
  preferred_tools:
    - grep over the whole working tree, for the sweep.
    - cargo test, clippy, fmt, and `cargo package` as the gates.
    - gh for the PRs and the Release; cargo publish for the upload.
  constraints:
    - >
      Patch semantics: no public API change, so nothing here may be delivered by touching `src/`
      beyond a documentation comment. If the sweep finds something that needs a code change to fix,
      it is recorded and deferred rather than smuggled into a patch.
    - >
      Sealed release records are immutable. The sweep corrects the living documentation and leaves
      the history alone.
    - >
      Stay 0.x. This is a patch on a pre-1.0 crate and makes no compatibility promise beyond the one
      0.16.0 already made.
risks:
  - >
    The sweep is done shallowly — the README is fixed, `src/lib.rs` is not — and the crate's docs.rs
    landing page keeps contradicting the crates.io one. Mitigation: F3 makes the criterion a
    repository-wide grep with a named allowlist of historical files, not an inspection of the file
    that was edited.
  - >
    A future reader takes the removal of `io-eval` and `website` from the README as a decision to
    cancel them. Mitigation: they stay in `product.yaml` and the roadmap, which is where the
    product's intent lives; only the public availability claim is withdrawn, and the CHANGELOG entry
    says which of the two things it is doing.
  - >
    The `.env.example` removal breaks a contributor or CI path that reads the variable from the
    template. Mitigation: F4 requires the remaining variables to be the ones the suite actually uses,
    and the publish path reads `CARGO_REGISTRY_TOKEN` from the gitignored `.env`, which is unchanged.
  - >
    Skipping the CI wait hides a real failure. Mitigation: the full local suite plus clippy, fmt and
    `cargo package` run before the first merge, and the change carries no code — the matrix exists to
    catch platform-specific behaviour, and there is none here to differ.
open_questions:
  - >
    None material. The status wording, the two removals, and the no-links decision were all specified
    by the owner; the only judgement left is how the accompanying sentence is phrased, which does not
    change what the release delivers.

released_at: '2026-07-28T08:15:00Z'
mode: published
delivered: >
  The README's last section now describes the initorigin products as they are rather than as they
  were intended to be. Three rows — io-harness, io-cli, io-studio — a Status column, and exactly one
  link, io-harness's, because it is the only public repository. io-cli and io-studio are named
  without links and marked "In development"; `io-eval` and `website` are gone from the page, since
  neither has been built and a roadmap entry is not a product. A sentence under the table states the
  reason there is one link, so the absence reads as a decision rather than an oversight.

  This was the one section 0.16.0 carried forward unchanged from the release-history README it
  replaced, and the only claim on that page none of its five checkers inspects. For a release whose
  whole thesis was that the documentation is part of the contract, four links returning 404 to every
  reader who is not the owner is the same class of defect as a wrong return value — reached from the
  last screen instead of the first.

  `.env.example` no longer asks a contributor for a crates.io publish token. It is the maintainer's
  credential and is read from the gitignored `.env`; its presence in the public template implied a
  permission a contributor neither has nor needs. Deliberately not in the changelog: no consumer of
  the crate ever sets it.

  No code changed. No public item was added, renamed, or removed, and a 0.16.0 caller upgrades by
  changing the version number.
evidence:
  tests:
    - >
      cargo test — 603 passed, 0 failed across every target including the 116 doctests. Full output
      at evidence/0.16.1/tests-default.txt.
    - >
      The five checkers 0.16.0 shipped all pass with no test file edited to accommodate this change,
      which is what makes them evidence rather than decoration: changelog 5/5, docs_drift 10/10,
      guide_pages 7/7, public_api 9/9, readme 8/8. `readme` is the one that inspects the file this
      release edits — it asserts the first screen and that no heading names a release, and the
      product table is neither.
    - >
      F1/F2 — the README table has three rows and a Status column, contains no occurrence of
      `io-eval` or `website`, and carries exactly one markdown link (io-harness's), followed by the
      sentence naming io-harness as the only public repository today.
    - >
      F3 — a repository-wide grep for `io-eval`, `initorigin/website`, `initorigin/io-cli` and
      `initorigin/io-studio` over README.md, src/, docs/, CONTRIBUTING.md, Cargo.toml, SECURITY.md,
      CODE_OF_CONDUCT.md, NOTICE, examples/, tests/ and .github/ returns exactly one hit:
      src/state.rs:1507, a `//` implementation comment on why `runs.finished_at` exists. It is not a
      doc comment, renders on no page, and states a design rationale rather than an availability
      claim, so it was deliberately left. Every other hit in the repository is in a file that is
      historical by design.
    - >
      F4 — `.env.example` carries no `CARGO_REGISTRY_TOKEN` and no publish-token comment; the six
      remaining variables are the three provider key/model pairs the suite and examples read.
      F5 — CHANGELOG.md has a `[0.16.1]` section describing the README correction, opening by stating
      there is no breaking change and no code change, and making no mention of `.env.example`.
  builds:
    - cargo clippy --all-targets -- -D warnings — exit 0 (evidence/0.16.1/clippy.txt).
    - cargo fmt --check — exit 0 (evidence/0.16.1/fmt.txt).
    - >
      NF1 — `git diff origin/main -- src/ | grep -E "^[-+]\s*pub "` is empty for the whole branch, and
      the public-surface snapshot is untouched. NF3 — default `cargo tree` is 401 lines, the standing
      constraint, unchanged.
    - >
      cargo package — io-harness-0.16.1.crate, 577 KB, 118 files (evidence/0.16.1/package-list.txt).
      Inspected: no `.env`, no `.ultraship/`, no `.github/`, no secret-shaped path. `.env.example`
      ships as intended and now carries no credential. Cargo.toml description is 290 characters,
      against the crates.io 1000-character cap that refused 0.11.0.
    - >
      Secrets gate — `.env` is gitignored and untracked, and the branch diff contains no
      secret-shaped assignment.
  reviews: []
  deployments: []
  health_checks: []
known_limitations:
  - >
    The record is sealed on `feat/0.16.1` before the crates.io upload, which follows the two merges
    and the GitHub Release. `mode: published` states the authorized target; the flow makes it true.
  - >
    The CI matrix was not waited on, at the owner's instruction and on the stated grounds that this
    is a text change. That is a deliberate, narrow trade: every claim above rests on a local macOS
    run, and the Linux and Windows legs will report after the merge rather than before it. It is safe
    here only because the release contains no code whose platform behaviour could differ — the same
    decision on a release with a `src/` change would not be.
  - >
    Nothing checks the product table. The five 0.16.0 checkers enforce the rest of the README, and
    this release deliberately adds no sixth: a product's status is not derivable from anything in
    this repository, so a checker for it would assert a fact it cannot verify. The table stays
    correct by someone remembering to update it when io-cli or io-studio ships — which is exactly the
    failure mode that produced this release, now with one fewer wrong row to inherit.
  - >
    `src/state.rs:1507` still names io-eval, as an implementation comment about why a schema field
    exists. Judged out of scope rather than missed: it makes no availability claim and appears on no
    rendered page.
  - >
    Everything 0.16.0 carried is carried still. The four defects its audit found and documented in
    `docs/CONTRACT.md` — the reserved tool-name gap, `resume_tree` not recording its policy,
    `SandboxLimits::max_processes` enforced by nothing, and no Linux seccomp filter — are all
    untouched, because each is a behaviour change and none belongs in a documentation patch.
supersedes: 0.16.0
next_recommended_version: null
immutable: true
