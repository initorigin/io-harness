known_limitations:
- >
  **The record is sealed before the crates.io upload.** `target_mode` is `published` and the
  publish is the last step of the standing flow, after the feat merge, the release merge and the
  GitHub Release. The record states the authorized target; the flow makes it true.
- >
  **THE LIVE RUN FOUND THREE DEFECTS THE FIXTURE COULD NOT, and that is the release's argument for
  keeping it.** (1) The client never advertised `window.workDoneProgress`, so `rust-analyzer` sent
  no `$/progress` at all and the crate had no way to tell "still indexing" from "no references".
  (2) A semantic request answered during start-up comes back **empty, not as an error**:
  `documentSymbol`, which needs only the syntax tree, answered correctly while `definition`,
  `references` and `hover` all returned nothing — precisely the silent empty this release promises
  never to produce. (3) `lsp_symbols` with a `query` and no path matched the empty string against
  every server's `extensions` list and reported that no server answered, while five other tools
  were being answered by one.
- >
  **An empty answer still cannot always be told from an unready one.** The protocol has no
  readiness signal. The crate tracks the work a server announces and retries an empty answer until
  that work settles, bounded by the server's own `timeout_secs`; a server that announces nothing
  about a start-up phase can still answer "nothing" when it means "not yet". Stated in
  `docs/CONTRACT.md` rather than left to be discovered.
- >
  **The settle window is a constant, not a knob.** `SETTLE` is 1.5 seconds in `src/lsp.rs` — the
  width of the gap between two of a server's start-up jobs, measured against a real
  `rust-analyzer` (`Fetching`, then `Building CrateGraph`, then `Roots Scanned`). A server that
  reports its start-up in coarser pieces needs it larger and nothing configures it.
- >
  **A language server runs at the harness's own privilege.** Like an `[[mcp]]` stdio server, and
  unlike a command run through `exec` or `shell`, it is not placed inside the run's execution
  sandbox. The roadmap entry said the argv is checked "under the run's sandbox mode"; what shipped
  is the `Act::Exec` check, which is the half that decides whether the process exists at all.
- >
  **A server indexes the whole root it is pointed at, including files a `deny_read` rule covers.**
  What this crate does about that is refuse to carry those locations into the model's context and
  say how many it dropped. What it cannot do is stop the server process reading them.
- >
  **`EventKind::LspStarted`'s middle field is `root`, not `backend_root`.** The contract named
  `backend_root`; the value is the workspace root the server was told to index and there is no
  backend to name. Renamed at implementation time rather than shipped under a misleading name. It
  is also emitted the first time the run **observes** a server usable — the first navigation call
  — rather than from the handshake task, because a `&Store` cannot cross a task boundary and
  `ready_ms` must be the number that was measured.
- >
  **`authorize_spawn` was made `pub(crate)` in `src/mcp.rs` rather than moved to a new module.**
  The contract said "moved to a shared location". One function does not earn a module, and moving
  it into `src/run.rs` would put a policy-event writer in a 14,000-line file. The property the
  contract wanted — one check, called by both sessions, unchanged — holds.
- >
  **The contract said nine run entry points; there are eight.** `McpSession::connect` appears at
  eight sites in `src/run.rs`, and `LspSession` is wired at all eight through one `lsp_for`
  helper. Counted from the source at implementation time.
- >
  **A sabotage that failed nothing, reported as a finding rather than propped up.** F5's first
  form asserted only that the fixture had not written its marker file, and a build that spawns
  first and checks second still passed it: the child is dropped with `kill_on_drop` on the way out
  and can be killed before it is ever scheduled. An assertion that depends on winning a race is
  not an assertion. Replaced by one no scheduling decision can change — for a command that does
  not exist, the gate's answer is `Error::Refused` and the spawn's answer is `Error::Lsp`.
- >
  **The live path is proven by an example, not by a test.** `examples/lsp_live.rs` is run by hand,
  following `documents_live` and `media_git_live`: a real server's index is minutes on a real
  repository and a CI gate that waits minutes is a gate someone eventually deletes. Its output is
  stored under `evidence/0.52.0/lsp-live-run.txt` rather than enforced by the suite.
- >
  **O1's three-platform matrix could not run locally.** These numbers are the macOS leg; the Linux
  and Windows legs run on the release PR, and a hand-written wire protocol is exactly the code
  that passes on the host that wrote the fixture.
- >
  **Completion, signature help, code lens, semantic tokens and call hierarchy are not offered**,
  and neither are push diagnostics. Excluded at specification time and unchanged.
