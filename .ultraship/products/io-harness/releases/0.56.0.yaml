known_limitations:
- >
  **A recall is a carriage, not a use.** Nothing observable says whether the model read a line of
  the memory block, so the evidence eviction ranks by is "this entry was in the prompt of a run",
  which is the strongest signal this crate can see. The guide says so plainly rather than letting
  the word "recall" imply more.
- >
  **The recall aggregate is unbounded in time.** An entry carried heavily a year ago and useless
  since is protected by history it can no longer earn. A window would be a second untunable
  constant; it is recorded in `open_questions` as the first thing to revisit if the order proves
  sticky.
- >
  **`docs/public-api.txt` gained three lines where N2 predicted two.** The third is `MemoryForget`,
  the `forget` return type, which the contract described in prose without counting it as a public
  item.
- >
  **A capped write is linear in `max_entries`** — about 73 ms at 4,096 entries. Flat in the size of
  the recall table, which is what the index buys, but not free, and the guide says so where an
  operator is deciding whether to raise the cap.
- >
  **A restored-after-`forget` entry carries the withdrawing run's attribution.** `memory_snapshots`
  holds the value, the kind and the step, not the id of the run that originally wrote the entry, and
  that row died with it. `pinned` restores as 0, which is not a guess: a pinned entry cannot be
  forgotten.
- >
  **Two sabotage arms survived their first run, and both were the test being wrong rather than the
  guard being unnecessary.** S4 removed the guard keeping the just-written key out of the candidate
  set and failed nothing, because the existing arm writes into a store where nothing has been
  recalled — the new key is then the newest zero-recall entry and sorts last either way. The guard
  is load-bearing only when every other entry carries evidence, which the added test constructs. S9
  made a `forget` of an absent key report a removal and failed nothing, because the test counted
  trace rows and neither arm writes one for an absent key; asserting the message instead exposed
  something real in the product, not the test — the absent answer wore the same `[forget <key>]`
  prefix a removal wears, and now reads `[forget: nothing to forget]`.
- >
  **The N5 measurement found a defect that review did not.** Its first run reported 0.069, 0.143 and
  0.068 ms — flat across an eightfold growth in input, which is a bug report. The cap comparison was
  `chars <= limits.max_chars as i64`, and the measurement's `max_chars: usize::MAX` wraps to `-1`
  there, so the loop's exit condition could never hold and every write evicted the whole workspace
  down to the key it had just written. Exact for this crate's own 16,000 and catastrophic for the
  first large number an operator writes — reachable only because this release makes the caps
  settable. The comparison is `u128` now, with a guard and a 3-character control.
- >
  **One defect was found by re-reading new code rather than by any gate.** The memory block charged
  for both scope headings unconditionally, so a caller with no global notes — every caller until one
  is written — would have had its own block shrunk by a heading the prompt never contains. Its test
  carries a control that fails if the ceiling is generous enough for the assertion to hold for the
  wrong reason.
- >
  **Three tests fail under full-suite parallelism on this machine and pass serially**:
  `a_handle_takes_the_cpu_cap_a_foreground_stage_takes`,
  `a_handle_that_exits_on_its_own_stops_reading_as_running` and
  `killing_a_handle_kills_a_grandchild_whose_parent_already_exited`. All three race a clock or a
  process reaper, none touches anything this release changed, and the serial re-run is recorded
  above. This is the ninth instance of the standing "never gate a test on a clock" trap.
- >
  **Nothing promotes a workspace fact to the global scope automatically, and nothing seeds the
  global scope from `io.toml`.** Both were excluded deliberately; a config-declared note would be a
  fourth writer with its own precedence question against the store, the pin and the workspace
  override.
- >
  **The record was sealed before the crates.io upload**, which follows the two merges and the GitHub
  Release under the standing flow.
