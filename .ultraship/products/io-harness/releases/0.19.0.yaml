known_limitations:
- >
  This record is sealed on `feat/0.19.0` before the crates.io upload, which is the standing flow: the
  record states the authorized target and the flow makes it true. The upload follows the
  develop -> main merge and the GitHub Release, and is the last step.
- >
  **NF4 — the three-OS suite is proven by CI on the PR, not from this machine.** Everything above was
  run on macOS. The Windows leg matters more than usual this release: `config::user_path` resolves
  `%APPDATA%\io\io.toml` there and `$XDG_CONFIG_HOME`/`$HOME` everywhere else, and only CI exercises
  the Windows branch. The open question about that path is resolved in favour of `%APPDATA%`.
- >
  **The `[toolchain]` override does not reach this crate's own run loop.** `run` detects the
  ecosystem for itself; `Config::toolchain(detected)` gives the embedding application the merged
  value. Wiring it into the loop needs a new `TaskContract` field, which is a break, and this release
  carries none — so an operator who overrides `test` in `io.toml` changes what io-cli or io-studio
  would show, not what the harness's own prompt says. Stated in the guide and in CONTRACT.md.
- >
  **An unknown key inside a `[[mcp]]` table is not rejected.** `McpServer` is `#[serde(flatten)]`-based
  and serde refuses `flatten` beside `deny_unknown_fields`. Every other section rejects what it does
  not know; that one accepts and ignores it.
- >
  **`${` always begins a substitution and there is no escape**, so a literal `${` in a value — in a
  glob pattern, say — is not expressible. An unknown prefix is an error rather than a passthrough,
  which is the trade: a typo cannot reach a policy rule as text.
- >
  **`${file:...}` is not restricted to the config file's own directory.** This resolves the contract's
  open question in the permissive direction: it resolves any path relative to that directory,
  `../` included. Restricting it would bound what a collaborator's committed project file can read
  from a teammate's disk, which is a real difference — but a project file is already code review's
  problem, and a restriction that stops `${file:~/.secrets/token}` would break the ordinary case it
  exists for. Stated in the guide.
- >
  **A config file is not a security boundary against the agent, and the guarantee is narrower than it
  reads.** What holds is that the file is read once, by the caller, before the run, so a config the
  agent writes mid-run cannot widen the boundary of the run in progress. What does not hold is
  anything about the *next* load: an agent that can write the workspace root can leave an `io.toml`
  there, and the caller's next `Config::discover` will read it.
- >
  **`Config` derives `Debug`, and a substituted secret is in it.** The crate never logs or traces a
  config value — that is now tested — but a caller who debug-prints a `Config` prints whatever
  `${env:...}` resolved to. Redacting was not done: a config a caller cannot inspect is a config
  nobody can debug.
- >
  **The live run recorded no refusal.** The model declined to attempt the denied write, so the
  boundary's live proof is that the secret is untouched and that the policy read from the file
  answers `Deny` — refusal-under-a-config-derived-policy through the real loop is proven offline by
  F3, against a scripted provider that does attempt it.
- >
  **The default dependency tree grows for the first time since 0.1.0.** 401 to 413 lines. Stated in
  the changelog rather than discovered by a consumer, but a consumer who audits dependencies has five
  more crates to audit.
- >
  Carried unchanged from 0.18.0 and untouched by this release, as `scope.excluded` requires:
  `resume_tree` still does not call `record_run_policy`; `SandboxLimits::max_processes` is enforced by
  nothing on any platform; the Linux backend installs no seccomp filter; `Containment::max_total_cost`
  is inert; `server_tool_requests` is zero everywhere until 0.22.0; the crate ships no prices;
  `git_status` lacks `-z`; `fill_form` has never been opened in a real viewer; the Windows Job Object
  is unimplemented; `pdf::read_text`'s `catch_unwind` is a no-op under `panic = "abort"`; and
  `TEST_BINARY` is inert.
