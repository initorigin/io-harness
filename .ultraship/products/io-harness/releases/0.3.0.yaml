product: io-harness
version: 0.3.0
status: released
release_type: minor

outcome:
  user_can: >
    A developer hands io-harness a task that spans a whole repository — the agent
    greps and finds across many files to locate what to change, then edits several
    files in one run — and chooses which provider runs it: OpenRouter (from 0.1.0),
    Anthropic, or OpenAI, selected without any change to the task contract. The
    0.2.0 loop, budgets, retry/recovery, trace, resume, and execution-based
    verification all still apply across the multi-file, cross-provider run.
  business_value: >
    Moves io-harness from single-file toy tasks to real repository work io-cli and
    io-studio actually need — find-then-edit-many is the shape of most agent coding
    tasks — while proving the provider-agnostic thesis with two more vendors behind
    the same surface, so no consumer is locked to OpenRouter.
  evidence_of_value: >
    An integration test drives one task that greps a multi-file fixture repo, edits
    several files, and verifies all of them; the same task is run once per provider
    (OpenRouter, Anthropic, OpenAI) through the identical task contract and each
    reaches a verified success.

scope:
  included:
    - grep tool — typed regex/substring search across the workspace returning file+line matches
    - find tool — typed path/name/glob search across the workspace returning matching paths
    - Multi-file edits in one run — the filesystem tool and loop read, edit, and verify several files, not just one
    - Verification across multiple artifacts — the execution-based gate compiles/tests the set of edited files, not a single file
    - Anthropic provider via the own HTTP + SSE client, behind the existing provider-agnostic surface
    - OpenAI provider via the own HTTP + SSE client, behind the existing provider-agnostic surface
    - Provider selection at run construction — choose OpenRouter, Anthropic, or OpenAI without changing the task contract; per-provider auth/model config from environment
    - Tool-call and streaming parsing adapted per provider (OpenRouter, Anthropic, OpenAI wire formats) with no vendor type in the public API
    - rusqlite trace records which provider ran and per-file tool calls/edits across the multi-file run
    - Public crate API additions under SemVer, backward compatible with 0.2.0 callers
    - Tests — multi-file find-then-edit integration test, and the same contract passing on each of the three providers
    - Updated README and crate docs (grep/find tools, multi-file edits, provider selection), packaged and published for 0.3.0
  excluded:
    - office/document and media tools (0.6.0)
    - Permissions, guardrails, human approval (0.4.0)
    - Sub-agents, ephemeral sandboxes, 24h+ autonomy (0.5.0)
    - MCP, plugins, skills (0.6.0)
    - git tool beyond grep/find over the working tree (commit/diff/branch deferred; only read-side search this release)
    - Providers beyond OpenRouter, Anthropic, OpenAI
    - Daemon/client mode and any network API
  fallback_scope:
    - grep and find tools over the workspace
    - Multi-file edits in one run with verification across the edited set
    - Anthropic provider via the own HTTP + SSE client, selectable at run construction
    - Multi-file find-then-edit integration test, run on OpenRouter and Anthropic

acceptance:
  functional:
    - Given a task over a multi-file fixture repo, the agent uses the grep tool to locate matches by regex/substring and receives file+line results it can act on.
    - The find tool locates files by path/name/glob across the workspace and returns matching paths.
    - The harness edits several distinct files in a single run and the execution-based gate verifies the full set — the run only succeeds when every edited file meets its spec.
    - The same task contract runs to verified success under OpenRouter, Anthropic, and OpenAI, selected only at run construction with no change to the contract itself.
    - The Anthropic and OpenAI providers send requests and stream responses over the own HTTP + SSE client, and the harness parses tool calls from each vendor's wire format.
    - The rusqlite trace records which provider ran and the per-file tool calls and edits of the multi-file run.
  non_functional:
    - Provider selection and the grep/find tools are part of the documented public API under SemVer; existing 0.2.0 callers still compile, or a documented migration is provided.
    - No Anthropic-, OpenAI-, or OpenRouter-specific type appears in the public task-contract, tool, verification, or trace API (provider-agnostic surface preserved).
    - Each provider's API key is read from configuration/environment, never hard-coded or logged.
    - grep and find operate only within the configured workspace root and do not traverse outside it.
  operational:
    - "`cargo test` passes, including the multi-file find-then-edit integration test and the three-provider parity test."
    - "`cargo publish --dry-run` succeeds with complete crate metadata for 0.3.0."
    - README documents the grep and find tools, multi-file edits, and selecting each of the three providers, with an example.
    - "(published mode) `cargo publish` uploads 0.3.0 to crates.io and it is installable via `cargo add io-harness`."

delivery:
  target_mode: published
  environment: crates.io registry; developer's local machine for the run itself
  deployment_method: cargo publish to crates.io after cargo test and cargo publish --dry-run pass, with CARGO_REGISTRY_TOKEN present
  migrations:
    - Extend the rusqlite trace schema to record the provider used and per-file tool calls/edits for multi-file runs; additive only, so a 0.2.0 database migrates in place and a 0.2.0 binary still reads a migrated database.
  observability:
    - Trace records the selected provider and per-file tool calls/edits across the multi-file run, via tracing and rusqlite
    - grep/find invocations (pattern, match count) recorded per step
  rollback: >
    A published crates.io version cannot be deleted, only yanked. Roll back with
    `cargo yank --version 0.3.0` so new builds fall back to 0.2.0; ship the forward
    fix as 0.3.1. The rusqlite migration is additive (new columns/tables only), so
    it needs no down-migration and a 0.2.0 binary still reads a migrated database.
    Before publish, the change lives only on the local branch and is reverted with git.

dependencies:
  products: []
  services:
    - OpenRouter API (model inference)
    - Anthropic API (model inference)
    - OpenAI API (model inference)
    - crates.io registry (publish target)
  human_approvals:
    - Owner runs `cargo publish` with a crates.io token; CARGO_REGISTRY_TOKEN must be available for the published target_mode
    - Owner provides Anthropic and OpenAI API keys for the three-provider parity test
    - Owner confirms 0.3.0 crate version metadata before publish

resource_profile:
  complexity: large
  uncertainty: medium
  likely_cost_drivers:
    - Three provider wire formats (OpenRouter, Anthropic, OpenAI) — request shape, SSE streaming, and tool-call parsing differ per vendor, all behind one agnostic surface
    - Multi-file edit orchestration — tracking, verifying, and stopping across a set of files without partial-success ambiguity
    - Execution-based verification over multiple artifacts — compiling/testing an edited set rather than a single file
    - Keeping the public API vendor-free while three concrete providers plug in
  preferred_tools:
    - Rust, tokio, rusqlite, serde, tracing; own HTTP + SSE client (reqwest/hyper) per provider
  constraints:
    - Rust crate; async on tokio; state in rusqlite; own HTTP + SSE provider client
    - Embeddable in-process library only; no daemon/client mode
    - Apache 2.0; runs locally, no hosted service

risks:
  - Anthropic and OpenAI tool-call/streaming formats diverge enough from OpenRouter that the agnostic surface leaks a vendor abstraction or needs per-provider special-casing in the loop.
  - Multi-file edits leave the run in a partial state — some files edited and verified, others not — with no clean success/fail outcome.
  - Execution-based verification over several files is ambiguous about which file failed, masking a real failure or reporting a false one.
  - grep/find over a large workspace is slow or escapes the workspace root, reading files it should not.
  - Anthropic/OpenAI keys or quota are unavailable at test time, so three-provider parity cannot be proven and the release falls back to Anthropic-only.
  - Adding provider selection and new tools to the public API breaks 0.2.0 callers if not designed backward compatible.

open_questions:
  - Are Anthropic and OpenAI API keys/quota available now for the three-provider parity test, or does the release fall back to the Anthropic-only fallback_scope?
  - Multi-file verification granularity — one gate over the whole edited set, or per-file gates aggregated into the run result?
  - Does provider selection also carry a per-provider default model (as OPENROUTER_MODEL did), and is it required from the caller or shipped with a default?
  - grep/find scope — working tree only, or also honoring ignore files (.gitignore) so the agent does not search build output?
  - Is any git action (diff/status) needed to make multi-file edits reviewable, or is that firmly deferred past 0.3.0?

released_at: "2026-07-24T00:00:00Z"
mode: release-ready
delivered: >
  A developer hands io-harness a repository task: the agent greps and finds
  across a workspace, reads what it found, and edits several files in one run,
  verified together (WorkspaceTestPasses compiles the edited set with a test, so
  a partially-correct set fails). Two more providers ship behind the same
  Provider trait — Anthropic (/v1/messages stream) and OpenAI (OpenAI-style
  stream shared with OpenRouter) — selected only by which one is constructed and
  passed to run; the trace records which provider ran. The 0.2.0 single-file
  loop, budgets, retry, trace, resume, and execution-based verify are unchanged
  and still pass. Built, tested, and packaged (release-ready); crates.io publish
  deferred to the release/merge stage by owner decision.
evidence:
  tests:
    - "cargo test — 22 unit + 9 integration (0.2.0, unchanged) + 3 multi_file + 1 parity + 1 doctest = 36 passed, 0 failed."
    - "multi_file: agent_finds_then_edits_several_files_and_the_set_verifies (Success{steps:5}, trace records find/grep/write per file); run_fails_when_one_of_the_edited_files_is_wrong (b=99 -> StepCapReached{4}); write_outside_the_workspace_is_refused_not_crashing_the_run."
    - "parity: the_same_contract_verifies_under_every_provider_and_records_which_ran — identical TaskContract -> Success{steps:1} through Provider impls named openrouter/anthropic/openai; store.provider(run_id) matches each."
    - "provider units: anthropic accumulates tool_use from input_json_delta + input/output token usage; openai_wire accumulates tool-call fragments; body builders map system/tools per vendor."
    - "state: migrates_a_pre_0_3_runs_table_adding_provider, provider_is_recorded_and_read_back; verify: each_compiles_rust_fails_if_any_file_fails, workspace_test_passes_only_when_files_work_together."
  builds:
    - "cargo clippy --all-targets — 0 warnings, 0 errors."
    - "cargo build --release — Finished release profile, exit 0."
    - "cargo package --allow-dirty — Packaged io-harness v0.3.0, 36 files, verify-compiled, exit 0. cargo publish --dry-run — packaged + verified, upload aborted (dry run)."
  reviews: []
  deployments: []
  health_checks:
    - "cargo run --example edit_repo, live OpenRouter (openai/gpt-5.6-luna): agent grep -> read src/a.rs + src/b.rs -> wrote both (a=21, b=21) -> WorkspaceTestPasses passed -> Success{steps:3}; provider recorded \"openrouter\". Live end-to-end proof of the multi-file workspace loop."
known_limitations:
  - "mode is release-ready, not published: 0.3.0 is built/tested/packaged but not yet uploaded to crates.io; publish deferred to the release/merge stage (owner decision). cargo publish --dry-run passes and CARGO_REGISTRY_TOKEN is available."
  - "Live provider proof is OpenRouter-only — the sole live key. The Anthropic and OpenAI request-build and stream-parse are unit-tested offline against synthetic wire fixtures; neither has been run against its live API. Cross-vendor live parity is unproven (matches the contract's Anthropic-only fallback and the logged key/quota risk)."
  - "Agent working memory is an observation log folded into the user turn, not native multi-turn message history; long read_file/grep results are truncated to the last 4000 chars in that log."
  - "grep/find honor a fixed ignore list (.git, target, node_modules), not .gitignore; the walk is synchronous std::fs (fine for local repos, not tuned for huge trees)."
  - "Multi-file execution-based verification is Rust-only (EachCompilesRust / WorkspaceTestPasses); other languages have no multi-file gate."
  - "Workspace resume reuses the files on disk as state and restarts the observation log; the Anthropic request caps max_tokens at a fixed 8192."
  - "Execution-based verification still compiles model-produced code locally with no sandbox (sandboxes are 0.5.0), inherited from 0.2.0."
supersedes: null
next_recommended_version: 0.4.0
immutable: true
