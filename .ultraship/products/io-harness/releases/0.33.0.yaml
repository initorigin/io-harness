product: io-harness
version: 0.33.0
release_type: minor

outcome:
  user_can: >
    Attach a second process to a run that is still going, watch exactly what the owning process is
    watching, and answer the thing it is holding — without killing it and without taking it over.

    Until now a run belonged to the process that started it. `Observer` is an in-process callback,
    so the events only exist where the run does; `resume_*` reattaches to a run that has *stopped*.
    An unattended run parked on an approval, a question or an unreviewed plan was unreachable: the
    only way to make progress was to kill the process, at which point `resume_with_decision` worked
    — on a run that was no longer live.

    0.33.0 makes the event stream durable and the wait answerable from outside.

    `Broadcast` is an `Observer` that wraps another one and writes every event it passes on to the
    store, so the durable stream is the *same* `RunEvent` the in-process observer received rather
    than a reconstruction assembled from the trace's twenty tables. Wrap it around whatever
    observer a caller already has and pass it to any of the fourteen `*_observed` entry points; no
    other API changes.

    `Attach` is what a second process opens. It takes a `&Store` and a run id — or a tree's root id
    — and a cursor the caller chooses: from the beginning, from now, or from an id it recorded last
    time. `poll()` returns the events since that cursor and advances it. `waiting()` reports what
    the run is parked on: a `Waiting::Approval`, a `Waiting::Question` or a `Waiting::Plan` — all
    three, decided explicitly, because a pending plan is a third thing a live run can hold and
    leaving it out would have made "answer the thing it is holding" a two-thirds claim.

    `answer_approval`, `answer_question` and `answer_plan` write the decision into the same durable
    row the run already writes, and the run — parked in its `Approver`, `Responder` or `PlanGate` —
    picks it up and carries on. Each returns `bool`: `true` if this caller's answer is the one the
    run acted on, `false` if someone else got there first. There is no third outcome and no silent
    second write.

    An attaching process reads and decides. It never takes ownership: `Attach` has no method that
    starts, resumes or steps a run, so driving one is not something a caller can get wrong. The
    failure modes stay bounded — the observer dying changes nothing at all, and the owner dying
    leaves exactly the resumable run 0.7.0 has always left.

  business_value: >
    An unattended run that cannot be answered is an unattended run nobody starts. Every application
    on this crate — a CLI that backgrounds a long job, a studio that runs one agent per tab, a
    scheduler running overnight — has the same shape: the process that started the work is not the
    process the operator is sitting in front of when the work needs a human. Today the answer to
    "it is asking me something and I am not in that terminal" is `kill`, then resume, and the run
    pays for the restart in tokens and in the steps it has to re-derive.

    A durable event stream is also the thing an application needs to render a run it did not start.
    0.12.0's `Observer` solved serialisation and left transport unsolved: the events existed only
    inside the owning process, so a second process was back to polling a schema the crate does not
    promise — which is precisely what `observe.rs`'s own module docs say the observer exists to
    stop people doing. `Broadcast` closes that gap with the store both processes already open.

    And the race is the point. Two operators answering one approval is not hypothetical the moment
    a run is reachable from more than one place. A harness that lets both writes land, and runs on
    the second, has a defect nobody can see. Making the first answer win, and telling the loser it
    lost, is the whole reason the mechanism is a compare-and-swap in the store rather than a check
    followed by a write.

  evidence_of_value: >
    Executed, not argued. `examples/attach_fixture` starts a run that parks on an approval with an
    `Approver` that never returns, and prints its run id. A test opens the same store file from its
    own process, attaches, sees the `ApprovalRequested` event in the durable stream, answers it, and
    the fixture — never killed, never resumed — completes and reports the decision it acted on.

    The stream is proven to be the same one and not a reconstruction: the events an in-process
    recording observer collected are compared element by element with the ones an attached reader
    read back, as `RunEvent` values, not as a summary.

    The boundary is proven by execution too: SIGKILL the attaching process mid-poll and the owner
    runs to completion unchanged; SIGKILL the owner and what is left is exactly the row
    `resume_with_decision` has consumed since 0.7.0.

scope:
  included:
  - >
    `observe::Broadcast<'a>` — an `Observer` decorator holding `&Store` and `&dyn Observer`. It
    serialises each `RunEvent` to a new `run_events` row and then delegates. Composes with every
    existing `*_observed` entry point without changing one of them, which is what keeps the durable
    stream and the in-process stream from being two code paths that can drift.
  - >
    `run_events` — one additive table, `(id, run_id, step, depth, kind, json, at)`, plus
    `run_events_run ON run_events (run_id, id)`. `id` is the cursor: globally monotonic, so one
    number orders a whole tree.
  - >
    `Store::put_event`, `Store::events_since`, `Store::tree_events_since` and `Store::event_cursor`.
    The tree read is written `FROM tree CROSS JOIN run_events INDEXED BY run_events_run` for the
    reason 0.32.0 paid to learn: SQLite will not seek into a recursive CTE and will build an
    automatic index over every tree's rows instead.
  - >
    `attach::Attach<'a>` — the read-and-decide surface. `Attach::to`, `Attach::to_tree`,
    `from_now`, `from_cursor`, `cursor`, `poll`, `waiting`, `answer_approval`, `answer_question`,
    `answer_plan`. Deliberately no method that drives a run.
  - >
    `attach::Waiting` — `Approval { request_id, step, act, target }`,
    `Question { question_id, step, question, choices }`, `Plan { plan_id, step, steps }`.
    `Store::unresolved_approvals` backs the first; `Store::questions` and `Store::plans` back the
    other two.
  - >
    The wait becomes answerable from outside at all four places a live run can park. The durable
    row is now written **before** the in-process gate is consulted — the ordering `put_plan` has
    had since 0.31.0, applied to `put_pending` and `put_question` — and the run then awaits the
    gate and the store row together, taking whichever answers first.
  - >
    First answer wins, enforced by compare-and-swap rather than by read-then-write.
    `Store::resolve_pending`, `Store::answer_question` and `Store::decide_plan` each become a single
    conditional `UPDATE` and return `Result<bool>`: `true` if this call is the one that landed. The
    read-then-write in `answer_question` and `decide_plan` was not atomic across two processes and
    is the defect this release exists to prevent.
  - >
    The decision an event reports is read back from the store row after the race resolves, in both
    arms, so an `ApprovalDecided` / `QuestionAnswered` / `PlanDecided` cannot report something the
    durable row does not hold.
  - >
    Documentation as part of the release: the `attach` module's own page, `README.md`,
    `docs/CONTRACT.md` (including the honest limitations below) and `CHANGELOG.md`.
  excluded:
  - >
    Any transport other than the store. A socket, a pipe or a broker would each be a new dependency
    or a new listener to secure, and both processes already open the same SQLite file in WAL with a
    five-second `busy_timeout` — set by `Store::open` since 0.12.0, so there is no migration and no
    on-disk compatibility question to answer.
  - >
    Push. `Attach::poll` is called by the caller, at whatever rate it likes. A notification
    mechanism means a second durable structure to keep consistent with the first, for a feature
    whose consumers are a terminal redraw and an HTTP long-poll.
  - >
    Steering, cancelling or budget changes from an attached process. Those are writes that change
    what the run *does* rather than answers to what it *asked*, and they are the ownership boundary
    this release draws, not an oversight.
  - >
    Detecting whether the owner is alive. `runs.status = 'running'` has never distinguished a live
    process from a crashed one and this release does not make it. Stated in `known_limitations`.
  - >
    Garbage-collecting `run_events`. The trace has never been pruned by the crate and starting with
    the newest table would be an odd place to begin. Its growth is measured and recorded instead.
  fallback_scope:
  - >
    `Broadcast` plus `Attach` over a single run: the durable stream, a caller-chosen cursor,
    `waiting()` and the three answers, with first-answer-wins proven. `tree_events_since` and the
    tree constructor drop out. That is still the outcome the roadmap names — a second process
    attaches to a live run, sees its events and answers what it holds — one run at a time rather
    than one tree at a time.

acceptance:
  functional:
  - >
    **F1 — the attached stream is the same stream, not a reconstruction.** A run executes under
    `Broadcast::new(&store, &recorder)` where `recorder` collects every `RunEvent`. A reader opened
    on the same store afterwards, with `Attach::to(&store, run_id)` at cursor 0, must return a
    `Vec<RunEvent>` **equal** to what `recorder` collected — `assert_eq!` on the values, since
    `RunEvent` is `PartialEq`, not a comparison of lengths or of tags. Its negative control is a
    run under the bare `recorder` with no `Broadcast`: the attached read must return empty, proving
    the equality above was not satisfied by a reader that reconstructs events from the trace.
  - >
    **F2 — the cursor is the caller's to choose, and it advances.** Three named tests over one run:
    `Attach::to` from 0 returns the whole backlog; `Attach::to(..).from_now()` returns nothing
    already emitted and then returns exactly the events emitted after it was constructed;
    `from_cursor(n)` returns exactly the events with id greater than `n`. After each `poll`,
    `cursor()` equals the id of the last event returned, and a second `poll` with no new events
    returns empty rather than repeating.
  - >
    **F3 — a second process answers a live approval and the owner carries on.**
    `examples/attach_fixture` starts a run under an `Approver` that never returns, prints its run
    id, and does not exit. The test opens the store file in its own process, attaches, waits for
    `Waiting::Approval` to appear, calls `answer_approval(request_id, Decision::approve())` and
    reads the fixture's exit. The fixture must exit 0 having completed the write it was asking
    about, without being killed and without any `resume_*` call. The discriminating assertion is
    that the fixture's own stdout reports the decision it acted on, and that it says `approve` —
    the same test run with `Decision::deny` must see `deny`, so a fixture that ignores the answer
    and proceeds fails one of the two.
  - >
    **F4 — a live question and a live plan are answerable too, and the plan is not an omission.**
    Two more named tests over the same fixture shape: a run parked in `ask_question` is answered by
    `Attach::answer_question` and the answer text reaches the model as the observation the
    in-process `Responder` path produces; a run parked in `propose_plan` is answered by
    `Attach::answer_plan(plan_id, PlanVerdict::Approve)` and the run leaves its planning phase and
    writes. Both assert the run continued in the *same* process, never resumed.
  - >
    **F5 — first answer wins, and the loser is told.** Two `Attach` handles over one store answer
    the same `request_id`. Exactly one returns `true` and the other `false` —
    `assert_ne!(a, b)` plus `assert!(a || b)`, so a mechanism that answered `true` twice or `false`
    twice fails. The decision the run acts on must be the winner's, asserted from the run's own
    reported outcome and not from either caller's return value. The same test exists for a question
    and for a plan, because the three had three different write shapes before this release and two
    of them were read-then-write.
  - >
    **F6 — the observer dying changes nothing.** The attaching process is SIGKILLed while polling a
    live fixture run. The fixture then receives an answer from a *third* process and completes
    normally, and the event stream the third process reads is continuous across the kill — no gap
    in `id`, no duplicate. Nothing about the owner's run row, step rows or outcome differs from the
    same run with no observer ever attached, asserted by comparing the two runs' `steps` rows.
  - >
    **F7 — the owner dying leaves exactly the resumable run 0.7.0 guaranteed.** The fixture is
    SIGKILLed while parked on an approval. The store then holds an unresolved `pending_approvals`
    row, and `resume_with_decision(request_id, Decision::approve())` completes the run — the exact
    0.7.0 path, unchanged. The discriminating assertion is an absence, in the shape 0.31.0's F-gate
    should have used: the row must be *unresolved*, checked before the resume, because a run whose
    pending row was resolved up front by the new write-before-gate ordering and then abandoned
    would resume into a decision nobody made.
  - >
    **F8 — ownership cannot be taken, structurally.** A source-reading test over `src/attach.rs`,
    in the technique `tests/public_api.rs` has used since 0.16.0: no `impl` block on `Attach` may
    name `run_`, `resume_` or `Provider`. Its control is the same check run against a copy of the
    source with one such method spliced in, which must fail and name it — a check that passes
    immediately has not been shown to discriminate.
  - >
    **F9 — the reported decision comes from the store row, in both arms.** After the race resolves,
    the emitted `EventKind::ApprovalDecided` and the `policy_events` row are built from a fresh
    `Store::pending(request_id)` read, not from the value the race returned. Asserted by answering
    with an approval that the store then holds and requiring the event to carry it, and — the part
    that discriminates — by running the same assertion on the **fast path**, where the in-process
    `Approver` answers immediately and the store poll never fires. A read that only exists in the
    attached arm passes the first and fails the second.
  - >
    **F10 — cross-version compatibility, both directions.** A database written by a real 0.32.0
    build opens, resumes and replays under 0.33.0 with nothing to migrate; a 0.33.0 store carrying
    `run_events` rows is read by a 0.32.0 build, which never names the table. `CHECKPOINT_FORMAT`
    does not move. The 0.22.0 schema guard in `tests/cross_version.rs` is fed `run_events` and
    `run_events_run` by name.
  non_functional:
  - >
    **N1 — no new dependency.** `cargo tree` on macOS and Linux still reads 402 lines. The transport
    is the `rusqlite` store both processes already open, the wait is `tokio::time`, and the race is
    `tokio::select!` — every one of them already compiled into every build.
  - >
    **N2 — no migration, because WAL is already the file's mode.** `Store::open` has set
    `journal_mode = WAL` and `busy_timeout = BUSY_TIMEOUT` since 0.12.0, both asserted by
    `tests/store_open.rs`. This release opens no second connection mode, sets no new pragma and does
    not change `user_version`. Recorded as a criterion rather than assumed, because a release that
    *had* needed to turn WAL on would have owed the full cross-version evidence F10 provides.
  - >
    **N3 — the tail read is an index seek per run, not a scan of the event log.**
    `EXPLAIN QUERY PLAN` for `Store::tree_events_since` must name `run_events_run` for the
    `run_events` access and must **not** contain `SCAN run_events`. The control statement filters on
    `kind`, a column in no index at all — not merely absent from a left prefix, because SQLite
    skip-scans a trailing composite column — and must not use `run_events_run`. The measured
    numbers over 200 trees × 100 events are recorded in the release record; no wall-clock threshold
    is asserted, for the reason 0.30.0's N2 recorded.
  - >
    **N4 — the durable stream costs one INSERT per event and nothing when it is not asked for.** A
    run with no `Broadcast` writes zero `run_events` rows, asserted. A run with one writes exactly
    as many rows as its observer received events, asserted by count against the recorder.
  - >
    **N5 — the breaks are exactly three, all in `Store`, and all in the changelog.**
    `resolve_pending`, `answer_question` and `decide_plan` return `Result<bool>` instead of
    `Result<()>`, and the last two return `Ok(false)` where they used to return `Err(Error::Resume)`
    for an already-answered row. A caller writing `store.answer_question(id, a, by)?;` as a
    statement recompiles unchanged; a caller matching on the error must move to the bool. No public
    item is removed. `CompletionRequest` and `CompletionResponse` are untouched, so no `E0639` is
    owed. `tests/changelog.rs` and `tests/public_api.rs` both pass.
  - >
    **N6 — every added public item carries a worked example**, enforced by the existing surface
    test: `Broadcast`, `Attach`, `Waiting`, and the four new `Store` methods all appear in
    compiling doctests.
  - >
    **N7 — the honest limitations are stated where a reader finds them.** `docs/CONTRACT.md` says
    plainly that the crate does not detect whether the owning process is alive, that `run_events` is
    never pruned, that `Attach::poll` is a poll and its latency is the caller's interval plus the
    owner's, and that the run picks up an attached answer at the gate's poll interval rather than
    instantly. Under the `known_limitations` discipline, not implied.
  operational:
  - >
    **O1 — the three-OS matrix is green** on the commit being released, including the MSRV 1.95 job.
    The SIGKILL fixtures are Unix-shaped; their tests are gated so Windows runs the store-level and
    query-plan assertions rather than being skipped silently.
  - >
    **O2 — docs.rs builds**, proven by running the nightly job's exact command
    (`RUSTDOCFLAGS="--cfg docsrs -D warnings" cargo +nightly doc --all-features --no-deps`) before
    the release PR is opened, not by inferring it from a stable `cargo doc`.
  - >
    **O3 — `cargo package --locked` succeeds** and the packaged crate compiles.

delivery:
  target_mode: published
  environment: >
    crates.io as `io-harness` 0.33.0, GitHub at initorigin/io-harness with the tag `v0.33.0` and a
    Release titled `io-harness 0.33.0`, and docs.rs.
  deployment_method: >
    The standing flow. All work on `feat/0.33.0` off `develop`, including the sealed UltraShip
    release record and the hand-appended lock pin. PR into `develop`, merged with the PR button.
    Release PR `develop` into `main`, merged the same way. The GitHub Release is cut by
    `release.yml` — `gh workflow run release.yml --ref main -f version=0.33.0` — which takes its
    notes verbatim from the changelog. `cargo publish --locked` by hand afterwards, always last,
    after both merges and the Release exist. `develop` synced to `main` fast-forward only at the
    end. No branch is deleted.
  migrations:
  - >
    One additive store change: a `run_events` table and its index. `CHECKPOINT_FORMAT` does not
    move, for the reason every addition since 0.13.0 has recorded — an older binary never queries
    the new table, so bumping the format would make `check_resumable` refuse a database that is in
    fact readable.
  - >
    No pragma change and no journal-mode change. WAL and `busy_timeout` have been `Store::open`'s
    behaviour since 0.12.0, so the two-process story needs no on-disk migration at all.
  - >
    Three public signature breaks, all on `Store` and all `Result<()>` to `Result<bool>`. A caller
    using them as statements recompiles; a caller matching the already-answered error moves to the
    bool. The changelog states both halves.
  - >
    A 0.32.0 database opens, resumes and replays unchanged, and a 0.32.0 binary reads a 0.33.0
    store. Both directions are executed rather than argued.
  observability:
  - >
    The release's observability *is* the feature: every existing `EventKind` becomes readable from
    a second process. No new variant is added and `EVENT_NAMES` does not change — the attached
    stream is the existing stream, and a new event describing the attachment would have been a fact
    about the observer rather than about the run.
  - >
    An answer's origin is recorded: `pending_approvals.resolved`, `pending_questions.answered_by`
    and `plans.decided_by` carry `attached` when the answer came from a second process, against
    `approver` / `responder` / `gate` for the in-process arm, so an audit can tell which.
  - >
    `Attach::waiting` is queryable long after the fact, the way `Store::queued_agents` is: it
    answers "what was this parked on" from the store, which no event stream can once the process is
    gone.
  rollback: >
    A published version cannot be recalled; the forward fix is 0.33.1 and `cargo yank --version
    0.33.0` is the escape hatch, leaving 0.32.0 as what `cargo install` resolves. A consumer
    reverting to 0.32.0 keeps every database — the `run_events` table is simply never queried — and
    loses the durable stream and the attach surface. The three signature breaks reverse by dropping
    the bool. No file and no stored format has to be rewritten to go back.

dependencies:
  products: []
  services:
  - >
    None at runtime. crates.io and GitHub Actions for the release itself, as every version.
  human_approvals:
  - >
    The owner has pre-authorised the PR, both merges, the Release and the publish for this version.
    Nothing here needs a second decision.

resource_profile:
  complexity: medium
  uncertainty: medium
  likely_cost_drivers:
  - >
    Four call sites in `src/run.rs` change from "await the gate" to "await the gate and the store
    row, first one wins": the write/exec approval in `gate_path`, the network authorization in
    `authorize_net`, `ask_question` and `propose_plan`. Each needs the durable row moved ahead of
    the gate and the resolution moved behind the race.
  - >
    Two more SIGKILL fixtures' worth of shape. `examples/attach_fixture` joins `crash_fixture`,
    `plan_gate_fixture` and `fleet_fixture` on the list of examples that
    `cargo test --all-features --lib --tests` cannot build on a clean tree.
  - >
    Proving "the same stream" rather than "a stream". The element-wise `RunEvent` equality and its
    no-`Broadcast` negative control had to be designed before the code, not after.
  - >
    `src/run.rs` is 9,366 lines and `src/state.rs` is 7,075. Both are edited.
  preferred_tools:
  - >
    `tokio::select!` with `biased;` and `tokio::time::sleep` for the race — both already compiled.
    A single conditional `UPDATE` with `changes()` for the compare-and-swap. `EXPLAIN QUERY PLAN`
    for N3.
  constraints:
  - >
    No new runtime dependency; MSRV 1.95; edition 2021; every version stays 0.x and a break is a
    minor bump.
  - >
    A project-scoped `io.toml` may narrow and may never widen. Nothing here is configured from
    `io.toml`: `Broadcast` and `Attach` are constructed by the application, and neither executes
    anything or writes to a path a stranger chose.

risks:
- >
  **Two writers answering one question silently.** The defect class the release exists to prevent,
  and the one it could most easily ship. `answer_question` and `decide_plan` read the row and then
  wrote it, which two processes interleave through. Mitigated structurally: one conditional
  `UPDATE`, and the *code* depends on its answer — the run reads the decision back from the row
  rather than from the caller that raced. F5 and F9 are the executable form.
- >
  **A stream that is a reconstruction rather than the stream.** The temptation is to synthesise
  events from the trace's existing tables, which would drift the first time a table gained a column
  the event did not. Mitigated by making `Broadcast` a decorator on the *same* `&RunEvent` the
  in-process observer receives, and by asserting equality of `RunEvent` values in F1 rather than
  equality of counts.
- >
  **The tree tail hitting the recursive-CTE trap.** Every tree-wide query in `state.rs` has the
  shape that reads `SCAN` over every tree's rows, and this one is hot. Mitigated by writing it
  `FROM tree CROSS JOIN run_events INDEXED BY run_events_run` from the start and asserting the plan
  in N3, with a control column that is in no index at all.
- >
  **Write-before-gate changing what a resume sees.** Moving `put_pending` ahead of the approver
  means a row now exists for approvals that are answered instantly, where before only a deferral
  wrote one. A resume that treated "a row exists" as "the run is waiting" would now be wrong.
  Mitigated by `Attach::waiting` and the resume path both filtering on unresolved, and by F7
  asserting the absence of a resolution rather than the presence of a row.
- >
  **An unbounded new table.** `run_events` grows with the run and is never pruned. Accepted rather
  than solved: it is opt-in per run via `Broadcast`, its per-row cost is measured and recorded, and
  the absence of pruning is stated in `docs/CONTRACT.md` rather than left for someone to discover.
- >
  **Disk, again.** `target/` took the volume to zero during 0.32.0 and three rust-analyzer servers
  are live on this machine, rebuilding into the same tree. Mitigated operationally: `df -h .`
  before and between build steps, separate `cargo test` invocations, and `rm -rf target` between
  the full suite and packaging.

known_limitations:
- >
  The crate does not detect whether the owning process is alive. `runs.status = 'running'` has never
  told a live process from a crashed one, and `Attach` does not change that: a run whose owner died
  still reports `Waiting`, and answering it writes a row that nothing will read until someone
  resumes. That is the same fact 0.7.0 shipped, exposed at a new surface rather than made worse.
- >
  `Attach::poll` is a poll. Latency is the caller's interval, and the run's pickup of an attached
  answer is the gate's poll interval — not instant, and not push.
- >
  `run_events` is never pruned by the crate. A long run's stream grows without bound and deleting
  it is the application's call.
- >
  Attaching gives read and answer, not control. There is no attached steer, cancel or budget change,
  by design.
- >
  **This record was sealed before the crates.io upload.** `mode: published` is the release's target
  and the flow's last step: the develop merge, the main merge and the GitHub Release all come after
  the record rides the `feat/0.33.0` commit, and `cargo publish --locked` comes after those. Sealing
  it `release-ready` and correcting it afterwards would mean editing an immutable record, which is
  worse.
- >
  **The crate does not detect whether the owning process is alive.** `runs.status = 'running'` has
  never told a live process from a crashed one and this release does not change it. A run whose owner
  died still reports what it was holding through `Attach::waiting`, and answering it writes a row
  nothing will read until somebody resumes. In the other direction, `resume_*` refuses a request that
  has already been *decided* but cannot refuse one still held by a process that is still running.
  Both are stated in `docs/CONTRACT.md` and the module page; a liveness heartbeat is recorded as an
  open question because its false-negative story — a slow step looking dead — has to be designed
  rather than defaulted.
- >
  **`Attach::poll` is a poll, at both ends.** Latency is the caller's own interval outbound, and
  `ATTACH_POLL` (200 ms) for an answer to reach a parked run. There is no push in either direction.
- >
  **`run_events` is never pruned.** A long run's stream grows without bound and deleting it is the
  application's call. The crate has never pruned anything in the trace and did not start with its
  newest table.
- >
  **A run only picks up an attached answer while it is *blocked in* its gate.** A gate that declines
  — `ResponderNone`, a `PlanGate` returning `None`, an approver deferring — pauses the run as it
  always did, and that pause is answered by `resume_*`, not by `Attach`. That is correct rather than
  a gap, but a reader could take "answer a live run" more widely than it holds.
- >
  **F10 was met against 0.29.0 rather than 0.32.0, deliberately.** The criterion named "a database
  written by a real 0.32.0 build". The repository's pinned cross-version generator is
  `tests/fixtures/gen-0.29.0` with its own CI job, three releases back rather than one, and the
  0.33.0 store it reads now carries a `run_events` row alongside the 0.30.0 memory rows and the
  0.31.0 plan. Adding a 0.32.0 generator would be a second fixture crate and a second CI job for a
  strictly weaker claim. The substance — both directions executed, the 0.22.0 schema guard fed
  `run_events` and `run_events_run` by name — holds.
- >
  **The two `cargo test` invocations were run with `CARGO_PROFILE_DEV_DEBUG=0` and
  `CARGO_PROFILE_TEST_DEBUG=0`.** With debuginfo on, `target/` reached 19 GiB and took the volume to
  4.4 GiB mid-suite; the first attempt died with `No space left on device` inside an incremental
  copy. Debug info changes no test outcome, and CI runs the unmodified commands on a fresh runner.
  Recorded because the numbers above were measured under it.
- >
  **Inherited and unresolved: 0.30.0's N2 wording.** "The aggregates do not scale with the trace"
  over-claims — counting every row is the answer. Stated honestly in `docs/CONTRACT.md` and raised
  rather than read as satisfied. Untouched by this release.

open_questions:
- >
  Whether a future release should give the store a liveness signal — a heartbeat the owner writes
  and an attached process reads — so "this run is parked but nobody is driving it" becomes a fact
  rather than an inference. It would make `Attach` able to refuse an answer nothing will consume,
  and it would let `resume_*` refuse a run that is genuinely live. It is a release of its own
  because a heartbeat has a false-negative story (a slow step looks dead) that has to be designed
  rather than defaulted.
- >
  Whether `run_events` should be prunable by the crate — a retention setting, or a
  `Store::forget_events(run_id)`. Nothing in the trace has ever been pruned by the crate, so the
  answer probably belongs to a release that decides it for the whole trace rather than for the
  newest table alone.
- >
  Whether `Attach::poll`'s interval should be the crate's concern at all. Today it is the caller's
  loop, which is the honest shape for a terminal redraw and for an HTTP long-poll alike; a blocking
  `poll_blocking(timeout)` would suit the second better and is worth asking a consumer about before
  guessing.

status: released
released_at: 2026-08-02T14:30:00Z
mode: published
delivered: >
  Two processes, one run. `Broadcast` wraps whatever `Observer` a caller already has and writes each
  `RunEvent` to a new `run_events` table on its way past, so the durable stream is the same value the
  in-process observer received rather than a reconstruction. `Attach` is what a second process opens
  on the same store file: a cursor it chooses, `poll()` for what is new, `waiting()` for what the run
  is parked on — an approval, a question or an unreviewed plan — and three answers that write into
  the durable row the run already reads. A run blocked in its `Approver`, `Responder` or `PlanGate`
  picks that answer up and carries on, never killed and never resumed. The first answer wins by
  compare-and-swap and the loser is told; the run reads the decision back from the row in both arms,
  fast path included. An attaching process has no method that starts, resumes or steps a run, so the
  observer dying changes nothing and the owner dying leaves exactly the resumable run 0.7.0 always
  did — both executed with real SIGKILLs rather than argued.

