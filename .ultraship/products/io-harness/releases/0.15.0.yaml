known_limitations:
- >
  Commit idempotency across a resume rests on git's own semantics rather than on a durable marker
  taken around the commit. A replayed `git_add` finds the file unmodified and stages nothing, so the
  replayed `git_commit` finds nothing staged and makes no commit. It is asserted by a test that
  replays the identical add-and-commit after a resume, and it holds — but the mechanism belongs to
  git, not to this crate's checkpointing, and a future git built-in that is not naturally idempotent
  would not inherit it.
- >
  `git_status` uses `--porcelain=v1` without `-z`, so its output is newline-separated. A path
  containing a literal newline would be rendered ambiguously to the model. This is a display concern
  and not a boundary one — the path gate and the argv builder both handle such a path correctly, and
  a test asserts a path with a newline survives as one argv element — but the report the model reads
  would be wrong about it.
- >
  `resume_from_stored_policy` covers the single-file and workspace loops. `resume_tree` has no
  stored-policy form, so a crashed agent tree still requires the caller to supply the policy.
- >
  A viewed image rides exactly one request and is then dropped. That is deliberate — it is a tool
  result, not a permanent part of the conversation — but a model that needs to look again spends
  another step, and nothing tells it that in advance beyond the tool description.
- >
  The crate never decodes an image. The media type comes from the file extension and the bytes are
  forwarded unparsed, so a corrupt file named `.png` reaches the vendor and comes back as an HTTP
  400. Parsing it here would mean an image decoder in the default path of a crate that has one only
  behind the barcode feature.
- >
  A run under a narrow write policy must allow `.git` or its commits are refused. The refusal is
  correct and traced, but the only signal is the refusal itself; there is no earlier or clearer
  error, and the requirement is documented rather than checked at configuration time.
- >
  Git is local only, by design: no push, fetch, clone or remote, and no branch, merge or tag either.
  Commits land on the branch that is checked out. A caller who wants the agent on its own branch
  checks one out before starting the run.
- >
  The live run used one provider, one model, one image and one repository. It exercises both halves
  end to end under a permissive policy; the refusals and their controls are covered by tests rather
  than by a live model.
- >
  `fill_form` now generates real appearance streams for text fields, which closes 0.14.0's weakest
  claim at the level it can be closed without rasterising: the stream draws the value and the test
  asserts on the decoded bytes. It has still never been opened in a real PDF viewer, because proving
  that means Pdfium, which is a per-OS binary this release's no-system-package constraint forbids.
  Checkboxes and radios keep their existing state-selection behaviour; choice fields are drawn as
  plain text, single-line and left-aligned, and quadding, multiline and comb fields are not honoured.
- >
  MCP images are attached only when the tool did not report an error, on the grounds that an image
  arriving with a failure is not something anyone asked to see. That is a judgement, and a server
  that reports an error alongside a diagnostic screenshot loses the screenshot.
- >
  `CompletionRequest` gaining a field is source-breaking for a caller using an exhaustive struct
  literal. Under 0.x that is a minor bump, which is what this is, and the type now derives `Default`
  and documents `..Default::default()`, so this is the last time a field addition breaks it.
- >
  Carried forward again, all three unrelated to this release's subject: the Windows Job Object is
  still unimplemented and still needs `windows-sys` under `[target.'cfg(windows)'.dependencies]` and
  its own release; `pdf::read_text`'s `catch_unwind` guard is still a no-op under a `panic = "abort"`
  profile; and the tree still carries no binary document fixtures written by a real application.
- >
  The record is sealed before the crates.io upload, which follows the develop->main merge and the
  GitHub Release per the repo's release order. `mode: published` states the authorized target; the
  flow makes it true.
