  - >
    OP5 — a live session against OpenRouter, evidence/0.20.0/live-run-session.txt. Turn 1 streamed
    13 deltas and the step's text reached the observer before that step committed; turn 2's
    mid-turn operator message reached the model at step 2 of 6 and left a `steered` row in the
    trace; a branch from turn 1 answered the other question with the path asserted as
    root -> branch and the abandoned turn intact; and the session reopened in a second connection
    from its id alone recalled its own first prompt. The example asserts each of those itself, so a
    regression fails the run rather than printing output nobody checks.
known_limitations:
- >
  This record is sealed on `feat/0.20.0` before the crates.io upload, which is the standing flow:
  the record states the authorized target and the flow makes it true. The upload follows the
  develop -> main merge and the GitHub Release, and is the last step.
- >
  **NF4 — the three-OS suite is proven by CI on the PR, not from this machine.** Everything above
  was run on macOS. The session tests are store- and channel-bound, which is where the Windows leg
  historically disagrees.
- >
  **The live steer was delivered, not obeyed.** Turn 2 of the live session carried the operator's
  message into the very next request and recorded it, and then the model looped on `find` and
  `read_file` until the stall detector stopped it, writing neither file. What this crate guarantees
  is delivery at the next step boundary; whether a model changes course on being told to is the
  model's business, so the example asserts the delivery and prints the rest. That a steer *changes
  what the agent does next* is proven offline by F8 against a provider scripted to branch on it.
- >
  **A turn resumed directly does not move the session's head.** A turn is a run, so
  `resume_with(contract, provider, store, run_id, policy, approver)` continues one — but the
  session bookkeeping (`finish_turn`, the head) happens in `Session::turn*`, so a turn resumed
  outside the session keeps `outcome: null` in the tree and the head stays where it was. There is
  no `Session::resume_turn`. This resolves the contract's third open question in the narrow
  direction: what is promised is resumability by run id, not a session-level resume.
- >
  **No `turn_bounded_steered`.** Steering is available on the unbounded turn only. A caller who
  wants both a verification gate and a mid-turn steer has to reach for `turn_steered` and enforce
  the criterion themselves. Four turn methods already cover the cases asked for; a fifth
  combination waits for someone to want it.
- >
  **`EventKind::Token` carries no delta index.** This resolves the contract's second open question:
  the `RunEvent` already carries `run_id`, `step` and `depth`, and an index would be another field
  to keep true. A consumer therefore cannot detect a dropped event from the event itself — what
  holds is that the crate's own path does not drop one, asserted by concatenation equality in F5.
- >
  **A session turn cannot spawn sub-agents.** This resolves the contract's first open question:
  there is no `turn_tree`, because a conversation whose turn is a tree raises the question of which
  agent the operator is steering — which is 0.21.0's subject.
- >
  **A streamed delta is provisional and a `Fallback` mid-stream shows it.** If the primary provider
  streams and then fails, its deltas were already emitted and the secondary's answer arrives whole,
  so an operator sees partial text followed by different complete text. Stated in CONTRACT.md and
  in the guide rather than smoothed over.
- >
  **An interrupt is indistinguishable from an observer's cancel in the trace.** Both record
  `cancelled`, deliberately — it is the same path, which is what makes an interrupt resumable and
  whole-stepped. A steered *message* does leave its own `steered` row; the interrupt does not.
- >
  **A session has no aggregate budget, and one session takes one driver.** Every turn is a fresh
  run with its own ceilings, so `max_steps` on one turn does not bound the next and a
  conversation-wide limit is the caller's to enforce per turn. Two processes taking turns on the
  same session id concurrently is unsupported and undefended beyond SQLite's busy timeout.
- >
  **`Session::history` is linear per hop over the session's turns**, so walking the path is
  quadratic in the number of turns in the tree. Bounded in practice by how long a conversation gets
  and by the one query it costs; a recursive CTE is the upgrade if a session ever holds thousands.
- >
  **A refused git built-in ends the run** — found while running the live session, recorded in
  docs/CONTRACT.md, and NOT fixed here because this release touches no tool. A policy denying
  `Act::Exec` for `git` turns a speculative `git status` into `Error::Refused` out of the run loop
  instead of an observation the model adapts to. The live example allows `git*` for that reason.
  It belongs to the next release that touches the tool layer.
- >
  Carried unchanged from 0.19.0 and untouched by this release, as `scope.excluded` requires:
  `resume_tree` still does not call `record_run_policy`; `SandboxLimits::max_processes` is enforced
  by nothing on any platform; the Linux backend installs no seccomp filter;
  `Containment::max_total_cost` is inert; `server_tool_requests` is zero everywhere until 0.22.0;
  the crate ships no prices; the `[toolchain]` config override does not reach this crate's own run
  loop; an unknown key inside a `[[mcp]]` table is not rejected; `git_status` lacks `-z`;
  `fill_form` has never been opened in a real viewer; the Windows Job Object is unimplemented;
  `pdf::read_text`'s `catch_unwind` is a no-op under `panic = "abort"`; and `TEST_BINARY` is inert.
