    emits zero `Token` events and the identical 0.19.0 sequence, with the same provider through a
    session turn as the control; a `complete`-only provider yields one delta carrying the whole
    text; a turn with no observer never enters the streaming path at all.
  - >
    F8, F9, F10, NF6 — tests/session_steering.rs, 4 tests. A steer changes the next step's action
    with the unsteered turn as the control; an interrupt raised on the first committed step ends the
