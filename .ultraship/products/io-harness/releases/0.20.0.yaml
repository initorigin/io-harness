    A session's first two turns reach its third across a second `Store` over the same file, with a
    different session over the same root as the negative control; a turn's run row, summary,
    `run_status` and rule-and-layer-attributed refusal are a run's; a branch carries turn 1 and not
    turn 2, turn 2 keeps its reply and its run, and both heads return their own path; an unbounded
    turn ends `Finished` while a bounded one reports `Success` only when its command passes, and the
    bound does not outlive its turn.
  - >
    F5, F6, F7, NF3 — tests/session_streaming.rs, 4 tests. The deltas concatenate to exactly the
    response's final text in order; every delta of a step is observed before that step commits and
