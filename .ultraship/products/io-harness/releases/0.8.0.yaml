product: io-harness
version: 0.8.0
status: released
release_type: minor
outcome:
  user_can: >
    A developer configures one or more MCP servers and hands the harness a task. The harness connects
    to each server over rmcp, discovers its tools, namespaces them so they cannot collide with the
    built-ins, and offers them to the model alongside `write_file`, `read_file`, `grep`, and `find`.
    The agent invokes an MCP tool the same way it invokes a built-in — the result comes back into the
    same observe/reason/act/verify/stop loop, counts against the same 0.5.0 budget, and lands in the
    same rusqlite trace. The crate becomes extensible without a fork: a capability the harness does
    not ship is added by pointing it at a server, not by patching it.

    Because those servers are the first callers in the product that can dial an arbitrary host,
    network egress stops being ungoverned. The 0.4.0 permission model gains a network action, so an
    outbound call has a target (`host` or `host:port`) that the existing layered, deny-by-default
    policy decides on exactly as it already decides paths and binaries: allow it, refuse it, or pause
    the run for a human. Refusals are refusals — the connection is never opened — and every verdict,
    with the layer that produced it, is in the trace. A 0.5.0 child inherits its parent's network
    rules and can only narrow them, so a sub-agent can never reach a host its parent cannot. A
    network action marked `Ask` pauses under the 0.7.0 durable path, so the decision can arrive after
    a restart.

    The provider's own host is governed by the same mechanism rather than exempt from it: the harness
    contributes the configured provider host as one named, visible policy layer, so a run under a
    deny-all-network base still works and an operator can see in the trace exactly why that one host
    was allowed.
  business_value: >
    Extensibility is one of the three claimed differentiators in product.yaml (provider-agnosticism
    plus composition plus extensibility), and it is the last one unbuilt. MCP is the widest available
    tool ecosystem, so supporting it as a client is the cheapest possible route from "four built-in
    tools" to "any tool a server offers" — io-cli and io-studio inherit that reach without either
    repo implementing tools of its own. Landing egress policy in the same release closes the
    permission model's remaining hole: 0.4.0 governs what an agent may read, change, and execute, but
    "send" — named in the product's own guardrails requirement — has been ungoverned since 0.1.0, and
    it becomes materially dangerous the moment an agent can invoke a tool from a third-party server.
    Shipping the capability and its containment together means the harness never has a version where
    an agent can reach the network freely.
  evidence_of_value: >
    A live run against a real MCP server and a real provider, under a policy whose network default is
    Deny, in which the agent uses an MCP-provided tool to complete a task and the trace shows every
    network verdict with its deciding layer. Plus a refusal run: the same task with the server's host
    denied, where the run refuses rather than connects, and the refusal is attributable in the trace.
    The two runs together are the proof that the capability works and that its boundary holds.
scope:
  included:
    - >
      MCP client over rmcp — the harness connects to configured MCP servers as a client, using the
      official Rust SDK rather than a hand-rolled protocol implementation. Two transports: stdio (the
      harness spawns the server process) and streamable HTTP (the harness dials a URL). Connection
      lifecycle — connect, initialize, list tools, call tool, shut down — is managed by the harness
      and tied to the run.
    - >
      MCP tool exposure into the loop — discovered tools are converted to the harness's tool
      representation and offered to the model with the built-ins, under a namespaced name
      (`mcp__<server>__<tool>`) so a server can never shadow `write_file`, `read_file`, `grep`, or
      `find`. Their JSON Schemas flow through to the provider's tool definitions unchanged, and their
      results flow back into the loop as ordinary tool results.
    - >
      A network act in the permission model — `Act` gains a network variant whose target is a host or
      `host:port`, matched by the same glob matcher that already matches paths and binary names, so
      `*.example.com` and `api.openai.com:443` are expressible. `Defaults` gains a network default,
      and the deny-by-default base denies network. Everything else about the model is unchanged:
      rules, layers, `merge`, `explain`, `Verdict`, and `Effect` ordering (Allow < Ask < Deny, with
      Deny absolute across layers) all apply to network exactly as they apply to reads and writes.
    - >
      Enforcement at the one place a connection is opened — every outbound HTTP or socket connection
      the harness makes on the agent's behalf is checked before it is opened: the provider client
      (OpenRouter, Anthropic, OpenAI), the streamable-HTTP MCP transport, and any harness-initiated
      fetch. A Deny verdict returns a typed error and no connection is attempted; an Ask verdict goes
      to the 0.4.0 approval gate.
    - >
      Provider-host layer — the harness contributes the configured provider's host as a single named
      policy layer ("provider") merged under the caller's layers, so a run under a network-deny base
      reaches its model without the caller hand-listing hosts, and the allowance is visible in
      `explain` and in the trace rather than being a hidden exemption. A caller's explicit Deny of
      that host still wins, because Deny is absolute — denying your own provider is a legal, if
      useless, configuration, and it fails as a refusal rather than a hang.
    - >
      MCP server launch and invocation under existing acts — spawning a stdio MCP server is an
      `Act::Exec` check on the server binary, so an operator's existing exec policy already governs
      which servers may start. Invoking a discovered MCP tool is checked as `Act::Exec` against its
      namespaced tool name, so a policy can allow a server generally while denying one of its tools.
    - >
      Containment of network under 0.5.0 — `Policy::contain` treats network rules like every other
      act, so a spawned child inherits its parent's network rules and can only narrow them. A child
      task contract cannot grant itself a host the parent denies, and the existing containment
      refusal path reports the attempt.
    - >
      Durable network approval under 0.7.0 — an `Ask` verdict on a network action pauses the tree,
      persists the pending action (host and the tool or component requesting it), and resumes on the
      human decision, including across a full process restart. The in-process `Approver` path is
      unchanged for callers who stay resident.
    - >
      MCP failure handling under 0.2.0 recovery — a server that fails to start, dies mid-run, returns
      a tool error, or exceeds a call timeout produces a typed error the loop treats as a failed step,
      subject to the existing retry and recovery path. A dead server never panics the harness and
      never silently drops the tool from the model's view without a trace record.
    - >
      Trace and schema — the rusqlite schema gains MCP and network events (server connected and
      disconnected with transport, tools discovered, each MCP tool call with latency and outcome, each
      network verdict with target, effect, and the deciding layer). Additive only — new
      tables/columns/events — so a 0.7.0 database migrates in place and a 0.7.0 binary still reads a
      migrated database.
    - >
      Public API additions, serde-stable — an MCP server configuration type (transport, command or
      URL, environment, timeouts) and the network act/default additions are `Serialize`/`Deserialize`
      like `Policy` already is, because io-cli and io-studio will express both in their own config
      files. Existing entry points (`run_with`, `resume`, `resume_with_decision`) keep their
      signatures; MCP servers are configured additively.
    - >
      Tests — a stdio MCP server fixture and an HTTP MCP server fixture driven end to end; a
      namespace-collision test; deny/allow/ask network verdict tests including the layer attribution;
      a refused-connection test asserting no socket is opened; a containment test proving a child
      cannot widen network; a durable network-approval-across-restart test; an MCP-server-death
      recovery test; and a serde round-trip of a policy carrying network rules.
    - >
      Documentation — README and rustdoc gain a worked example of connecting an MCP server under a
      deny-by-default egress policy, and the network act is documented alongside read/write/exec with
      its target format spelled out.
    - >
      Release and publication — 0.8.0 crate metadata updated (description reflects MCP and egress),
      CHANGELOG entry, git Release, then `cargo publish` to crates.io.
  excluded:
    - >
      MCP server mode — exposing the harness's own tools over MCP so other clients drive it. That is
      the inverse direction, it edges into the daemon/client mode product.yaml defers, and nothing in
      0.8.0 needs it.
    - >
      MCP resources, prompts, sampling, roots, and elicitation. Tools are the primitive the agent loop
      consumes; the rest are a later release if a real caller wants them.
    - >
      OAuth and interactive authorization flows for MCP servers. Static credentials passed through
      configuration (headers, environment) are in; a browser-based auth dance is not.
    - Plugins and skills — in-process extensibility is 0.9.0.
    - Office, document, OCR, and barcode tools (0.10.0); media passthrough and the git tool (0.11.0).
    - >
      Byte-count, rate, and bandwidth limits on egress. 0.8.0 decides *whether* a host may be reached,
      not how much may flow to it; volume ceilings would belong with the 0.5.0 budget model.
    - >
      Payload inspection, TLS pinning, proxy enforcement, and DNS-level interception. Policy is
      enforced in-process at the connection point, which governs what the harness itself opens.
    - >
      Governing the network a stdio MCP server makes on its own behalf once running. Its process is
      not the harness's process; the harness governs whether it may start (exec) and which of its
      tools may be called, and this limit is documented rather than implied away.
    - >
      Running MCP servers inside the 0.6.0 sandbox. A configured server is operator-chosen software,
      not model-produced code; the sandbox stays scoped to model-produced execution.
  fallback_scope:
    - >
      MCP client over rmcp with the stdio transport only — connect, discover, namespace, invoke,
      results into the loop, failures recovered.
    - >
      The network act in the permission model, deny-by-default, layered, contained under 0.5.0, with
      the provider-host layer so a run still reaches its model, enforced at the provider client and
      any harness-initiated connection.
    - Trace records for MCP tool calls and network verdicts, and the additive schema migration.
    - Live run against a real stdio MCP server under a network-deny base policy, plus the refusal run.
    - >
      Dropped in this fallback: the streamable-HTTP MCP transport and the durable
      network-approval-across-restart path (network `Ask` still works in-process via the 0.4.0
      Approver). The outcome stays coherent — a developer extends the harness with MCP tools and the
      agent's network reach is governed — it is simply a local-server-only version of it.
acceptance:
  functional:
    - >
      F1 — with a stdio MCP server configured, a run discovers its tools, the model is offered them
      under `mcp__<server>__<tool>` names, the agent invokes one, and the result reaches the next loop
      step. Asserted by a test using a fixture server and by the live run.
    - >
      F2 — with a streamable-HTTP MCP server configured, the same holds end to end against a test HTTP
      server.
    - >
      F3 — a server advertising a tool named `write_file` does not shadow the built-in: both are
      callable, the built-in keeps its name, and the server's is reachable only under its namespaced
      name.
    - >
      F4 — under a policy whose network default is Deny, a connection to an unlisted host is refused:
      the call returns a typed error, no connection is opened (asserted against a listener that
      records connection attempts), and the refusal is in the trace with the deciding layer.
    - >
      F5 — a network rule with effect Ask routes to the approval gate: a Deny decision blocks the call
      and a run continues or fails per the existing gate semantics; an Allow decision performs it
      exactly once.
    - >
      F6 — a network Ask survives a full process restart: the tree pauses, the process exits, and
      `resume_with_decision` on a fresh process against the same store performs the approved call and
      completes the run.
    - >
      F7 — a 0.5.0 child inherits its parent's network rules; a child task contract that tries to
      allow a host its parent denies is refused by containment, and the refusal is recorded. A child
      that narrows (denies more) is honoured.
    - >
      F8 — a run under a base policy that denies all network still reaches its configured provider,
      via the named provider layer, and `explain` attributes the allowance to that layer. A caller
      rule that explicitly denies the provider host wins and the run fails as a refusal, not a hang.
    - >
      F9 — MCP server failure paths: a server whose binary does not start, a server killed mid-run,
      a tool returning an error, and a tool call exceeding its timeout each produce a typed error
      handled by the 0.2.0 retry/recovery path, with the failure in the trace and no panic.
    - >
      F10 — a `Policy` carrying network rules round-trips through serde unchanged, and an MCP server
      configuration round-trips through serde unchanged.
    - >
      F11 — a 0.7.0-era caller that configures no MCP servers compiles against 0.8.0 and reaches the
      same verified success, with network governed by whatever its policy says (permissive policies
      stay permissive).
  non_functional:
    - >
      NF1 — MCP is implemented via the rmcp crate. No hand-rolled JSON-RPC framing or protocol
      version negotiation in this repo.
    - >
      NF2 — the network check is a policy lookup on the existing matcher and introduces no new global
      lock. The 0.5.0 fan-out suite runs green with the network act enabled, so containment of egress
      does not serialize concurrent agents.
    - >
      NF3 — the public API additions (the network `Act` variant, the `Defaults` network field, the MCP
      configuration type names) are owner-signed-off before packaging, because io-cli and io-studio
      will serialize them and a rename is a coordinated cross-repo break.
    - >
      NF4 — `cargo test`, `cargo clippy --all-targets` (no warnings), and `cargo build --release` are
      green; every new public item has rustdoc; `cargo publish --dry-run` passes with complete 0.8.0
      metadata.
    - >
      NF5 — the crate compiles on macOS, Linux, and Windows. Stdio server spawning uses portable tokio
      process APIs; no unix-only path in the MCP layer.
    - >
      NF6 — adding a network variant to the public `Act` enum and a field to `Defaults` is a breaking
      change under strict SemVer and is taken deliberately in a 0.x minor, which cargo already treats
      as incompatible. It is stated in the CHANGELOG as a breaking change with the one-line migration,
      not glossed as additive.
  operational:
    - >
      O1 — the trace records, for each run: every MCP server connect and disconnect with its
      transport, the tool list discovered per server, each MCP tool call with latency and outcome, and
      each network verdict with target, effect, and deciding layer. All queryable from a reopened
      store.
    - >
      O2 — the rusqlite migration is additive; a database written by 0.7.0 opens and migrates in
      place, and a 0.7.0 binary still reads a migrated database. Asserted by a migration test.
    - >
      O3 — README and rustdoc carry a runnable example of a run with an MCP server under a
      deny-by-default egress policy, including what a refusal looks like.
    - >
      O4 — the live run and the refusal run are both executed against a real MCP server and a real
      provider, and their output is stored as release evidence.
    - >
      O5 — the documented limit is explicit: the harness governs the connections it opens, not the
      connections a running stdio server opens for itself.
delivery:
  target_mode: published
  environment: >
    Developer's local macOS machine for build, test, live run, and packaging; crates.io as the
    publication target. MCP servers run locally (stdio child processes) or as a local test HTTP
    server; the live run additionally reaches a real provider endpoint. State stays in the local
    rusqlite store, per product.yaml's local, single-user deployment context.
  deployment_method: >
    Built and packaged locally — `cargo test`, `cargo clippy --all-targets`, `cargo build --release`,
    and `cargo publish --dry-run` all green with complete 0.8.0 crate metadata — then a git Release is
    cut (tag + GitHub Release, per the repo's release convention) and the crate is uploaded to
    crates.io with `cargo publish` using the registry token available in the environment. Git release
    first, publish second.
  migrations:
    - >
      Extend the rusqlite schema with MCP events (server connect/disconnect with transport, tool
      discovery, tool call with latency and outcome) and network-verdict events (target, effect,
      deciding layer), tied to the run/agent they belong to. Additive only — new tables/columns and/or
      events, no rewrites — so a 0.7.0 database migrates in place and a 0.7.0 binary still reads a
      migrated database.
    - >
      Policy deserialization migration: a `Policy` serialized by 0.7.0 has no network rules and no
      network default. It must deserialize under 0.8.0 to the documented default rather than failing,
      and the chosen default (deny) must be stated in the CHANGELOG, since it changes behaviour for a
      caller who deserializes an old policy and then makes an outbound call.
  observability:
    - Every MCP server connect/disconnect recorded with transport and server id, and emitted via tracing.
    - Every tool discovery recorded — which server offered which tools, under which namespaced names.
    - Every MCP tool call recorded — namespaced name, latency, success or typed error.
    - Every network verdict recorded — target, act, effect, and the named layer that decided it, for allows, refusals, and asks alike.
    - Every network approval request and human decision recorded, including one delivered after a restart.
    - >
      The full network history of a run — what it tried to reach, what it was allowed to reach, and
      what it was refused — reconstructable from the store alone after the run.
  rollback: >
    Before publish, rollback is `git revert` of the 0.8.0 branch — the change lives on `feat/0.8.0`
    until the develop→main release. The rusqlite migration is additive, so it needs no down-migration
    and a 0.7.0 binary still reads a migrated database. At the library level a caller reverts by
    dropping back to the 0.7.0 crate version; because the network act changes a public enum, that
    revert is a real version pin rather than a no-op, which is why the break is documented in the
    CHANGELOG. Because 0.8.0 is published to crates.io, a post-publish fix is a forward patch release
    (0.8.1), never an unpublish — crates.io versions are immutable once uploaded — and `cargo yank`
    stops new resolutions of a bad 0.8.0 without breaking existing lockfiles.
dependencies:
  products: []
  services:
    - OpenRouter (or Anthropic/OpenAI) API — model inference for the live run and the refusal run.
    - A real MCP server for the live run (a published server binary run locally over stdio).
    - crates.io (publication target for 0.8.0).
  human_approvals:
    - Owner confirms 0.8.0 crate version metadata and the updated crate description before packaging.
    - >
      Owner signs off the public API additions before packaging — the network `Act` variant and its
      target format, the `Defaults` network field, and the MCP configuration type names. Like
      `Policy` (0.4.0), `Containment` (0.5.0), `SandboxConfig` (0.6.0), and the durable-run surface
      (0.7.0), these become a cross-repo serde contract for io-cli and io-studio the moment they are
      adopted.
    - >
      Owner decides the default network effect for a policy deserialized from a 0.7.0-era config,
      since it silently changes behaviour for existing configs either way.
    - >
      Owner approves the git Release and the crates.io publish — publishing is public and
      irreversible (a version cannot be re-uploaded), so it is a deliberate human gate, not an
      automated step.
resource_profile:
  complexity: large
  uncertainty: medium
  likely_cost_drivers:
    - >
      Integrating rmcp's client, transport, and lifecycle model into the harness's own tool
      representation and loop — the schema translation, the namespacing, and getting connection
      lifetime tied correctly to a run (and to a 0.5.0 tree where many agents share one server
      connection) is the bulk of the MCP work.
    - >
      Finding and covering every place the harness opens a connection so the network check cannot be
      bypassed. A check that misses one call path is a policy that looks enforced and is not; this is
      the correctness risk of the release, not the MCP plumbing.
    - >
      Threading a fourth act through a model built around three — `Act`, `Defaults`, `merge`,
      `contain`, `explain`, the trace, and every serde surface — without regressing the existing
      read/write/exec semantics that 0.4.0 and 0.5.0 tests pin.
    - >
      The provider-host layer's interaction with Deny-is-absolute: making a network-deny base usable
      by default while keeping an explicit caller deny authoritative, and making both legible in
      `explain`.
    - >
      Test fixtures for both transports — a stdio server fixture and an HTTP server fixture that are
      deterministic and hermetic, plus a connection-attempt listener that can prove a refused call
      opened no socket.
    - >
      MCP failure-mode coverage — server death, tool error, timeout, malformed schema — mapped onto
      the existing 0.2.0 retry/recovery path rather than a parallel error path.
    - >
      Cross-platform stdio server spawning, since 0.6.0's per-platform work showed process handling is
      where the three OSes diverge.
  preferred_tools:
    - Rust, tokio, rmcp (official Rust MCP SDK), serde, rusqlite, tracing; the existing own HTTP + SSE provider client.
    - The existing `Policy`/`Act`/`Effect`/`Layer` machinery and its glob matcher, extended rather than duplicated.
    - A local listener/proxy fixture to assert that a refused connection opens no socket.
    - cargo (build, test, clippy, publish); git + GitHub Release for the release step.
  constraints:
    - Rust crate; async on tokio; state in rusqlite; own HTTP + SSE provider client for model calls.
    - Embeddable in-process library only; MCP client only, no server mode, no daemon.
    - Enforcement is in-process at the connection point; no OS-level network sandboxing or proxying.
    - Apache 2.0; runs locally, single-user, no hosted service.
risks:
  - >
    A missed call path is the whole release failing quietly — if one place that opens a connection
    skips the check, the policy reads as enforced while an agent reaches an arbitrary host.
    Mitigation: connections are funnelled through a single checked entry point rather than checked at
    each call site, and the refused-connection test asserts against a real listener that no socket is
    opened, so a bypass shows up as a failed test rather than a passing one.
  - >
    Adding a variant to the public `Act` enum and a field to `Defaults` breaks downstream exhaustive
    matches and struct literals. Mitigation: taken deliberately in a 0.x minor (cargo treats it as
    incompatible anyway), stated as a breaking change in the CHANGELOG with the one-line migration,
    and owner-signed-off before packaging.
  - >
    A policy serialized by 0.7.0 has no network rules; deserializing it to deny silently breaks a
    caller's existing run, and deserializing it to allow silently leaves egress ungoverned for exactly
    the callers who upgraded to get it governed. Mitigation: the owner decides, the choice is
    documented in the CHANGELOG, and a serde test pins whichever is chosen.
  - >
    Denying network by default can deadlock a run against its own provider. Mitigation: the harness
    contributes the provider host as a named layer, F8 tests both that the run works under a
    deny-all base and that an explicit caller deny still wins and fails fast as a refusal rather than
    hanging.
  - >
    MCP tools are third-party and arrive with schemas the harness did not write — a malformed or
    hostile schema, an enormous result, or a tool that never returns could destabilise the loop.
    Mitigation: per-call timeouts, typed errors into the 0.2.0 recovery path, and F9 covering start
    failure, mid-run death, tool error, and timeout.
  - >
    Governing only the harness's own connections is a real boundary, not a complete one — a stdio MCP
    server can dial anywhere once running. Mitigation: it is named in excluded scope, tested for
    nothing it does not do, and documented as a limit (O5) so the release does not claim containment
    it has not built.
  - >
    A shared MCP connection across a 0.5.0 tree of 100+ agents could serialize the fan-out or leak a
    connection per agent. Mitigation: connection lifetime is tied to the run, not to each agent, and
    NF2 runs the existing fan-out suite green with the network act and MCP enabled.
  - >
    Publishing is irreversible. A bad 0.8.0 on crates.io cannot be re-uploaded; the fix is a forward
    0.8.1 and `cargo yank`. Owner-approved git-release-then-publish and a passing dry-run before the
    real publish are the guard.
open_questions:
  - >
    Should invoking an MCP tool be checked as `Act::Exec` against its namespaced name, or should tool
    invocation get its own act? Proposed: reuse `Act::Exec` — it already means "cause something
    outside the harness to run", the glob matcher already handles the namespaced name, and adding one
    act (network) is cheaper to get right than adding two.
  - >
    What is the exact target string for a network check — `host`, `host:port`, or a full URL?
    Proposed: `host` when no port is meaningful and `host:port` when one is, matched by the existing
    glob matcher against both forms the way paths already match full path or basename, so
    `api.openai.com` and `api.openai.com:443` both work without the caller guessing.
  - >
    Should a policy deserialized from a 0.7.0-era config default to network Deny or network Allow?
    Proposed: Deny, consistent with the deny-by-default model, with the break stated in the CHANGELOG
    — but this is the owner's call because it changes existing callers' behaviour either way.
  - >
    Is one MCP connection shared across a whole 0.5.0 agent tree, or one per agent? Proposed: one per
    run, shared by the tree, since servers are stateful processes and 100+ connections per run would
    be the concurrency problem 0.5.0 already solved once.
  - >
    Should MCP tool results be capped in size before entering context? Proposed: yes, a documented
    per-result cap with truncation recorded in the trace, since third-party tool output is the first
    unbounded input the harness has ever fed the model — but the cap value is a 0.8.0 decision to make
    during development, not now.
released_at: '2026-07-25T00:00:00Z'
mode: published
delivered: >
  A developer configures MCP servers on a task contract and the agent uses their tools beside the
  built-ins, namespaced `mcp__<server>__<tool>` so nothing shadows `write_file`. Both transports
  ship: stdio (the harness spawns the server) and streamable HTTP (it dials a URL). Tool calls carry
  a timeout, results are size-capped, failures come back as observations the model adapts to, and a
  server that never starts fails the run with a typed `Error::Mcp` rather than the run proceeding
  without a capability it was told it had.

  Egress is governed for the first time. `Act::Net` joins read, write, and exec in the same layered
  deny-first policy: an outbound connection has a `host:port` target, `allow_net`/`deny_net`/`ask_net`
  decide it, an `Ask` routes to the `Approver` and survives a full process restart, and a 0.5.0 child
  inherits its parent's network rules and can only narrow them. Every connection the harness opens —
  provider, HTTP MCP server, any harness fetch — passes one checked entry point before a socket
  exists, and a refusal opens no socket (asserted against a listener that counts accepts). A run under
  a network-deny base still reaches its model through a named `provider` layer, visible in the trace
  rather than exempt from it; an explicit deny of that host still wins and fails fast.

  Proven live: a real model and a real MCP server completing a task under a policy whose network
  default is Deny, then the same task against an MCP host no rule allows, refused before dialling.
evidence:
  tests:
    - >-
      cargo test — 172 passed, 0 failed, across 11 binaries (lib 92, mcp 12, net 8, policy 10,
      subagents 17, checkpoint 10, sandbox 9, multi_file 3, edit_file 8, parity 1, doc 2). Full
      output in evidence/0.8.0/tests.txt.
    - >-
      MCP end to end against a real server process (examples/mcp_fixture_server.rs) over both
      transports — stdio via child process, streamable HTTP via rmcp's StreamableHttpService on
      hyper, serving the same handler so the two cannot drift apart.
    - >-
      The no-socket proof is an observation, not an assumption: tests/net.rs and tests/mcp.rs count
      accepts on a live TcpListener and assert zero after a refusal.
  builds:
