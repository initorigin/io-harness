known_limitations:
  - >-
    This record was sealed on feat/0.8.0 before the crates.io upload, because the repo's release
    order puts publication last — after the feat→develop and develop→main merges and the GitHub
    Release. `mode: published` is the contract's authorized target and the sequence the owner
    directed, not a claim that the upload had already happened when the file was written.
  - >-
    F9 is met in substance but not as literally worded. The contract says a server whose binary does
    not start is "handled by the 0.2.0 retry/recovery path"; it instead fails the run with a typed
    Error::Mcp at session construction, because connecting happens before step 1, retrying a missing
    binary cannot make it appear, and proceeding without a configured capability is the worse
    failure. The other three legs — tool error, per-call timeout, and a server killed mid-run — do go
    through the loop as recoverable observations, each with its own test.
  - >-
    NF2 is proven indirectly. The whole pre-existing suite, including the 0.5.0 fan-out tests, runs
    green with the network act live, and the MCP session is shared by reference through Tree rather
    than per agent — but there is no dedicated timing benchmark asserting that egress checking does
    not serialize a 100-agent fan-out. Same shape of limitation 0.7.0 recorded for checkpointing.
  - >-
    The harness governs the connections it opens, not the connections a running stdio MCP server
    opens for itself. That server is a separate process: the harness decides whether it may start
    (an exec check on the binary) and which of its tools may be called (an exec check on the
    namespaced name), and nothing more. Isolating a server's own egress needs OS-level containment,
    which is not built here.
  - >-
    Calling an MCP tool needs a SECOND exec allowance, on the namespaced tool name, beyond the one
    that lets the server binary start. This is deliberate — it is what lets a policy admit a server
    and still refuse one of its tools — but it is easy to miss: the first live run connected the
    server, discovered its tools, offered them to the model, and refused every call. Documented in
    README and in examples/mcp_run.rs, but the failure mode is quiet.
  - >-
    MCP resources, prompts, sampling, roots, and elicitation are not supported — tools only. Neither
    is OAuth: static credentials pass through configuration (headers, environment), but there is no
    interactive authorization flow. Both are excluded scope, not defects.
  - >-
    Egress policy decides WHETHER a host may be reached, not how much may flow to it. There are no
    byte, rate, or bandwidth ceilings, no payload inspection, no TLS pinning, and no proxy or
    DNS-level enforcement — the check is in-process at the point the connection is opened.
  - >-
    Redirects are now disabled on every built-in provider's HTTP client, to close the
    checked-then-redirected hole. A provider endpoint that legitimately relies on a 3xx would now
    surface it as a non-success status rather than following it.
  - >-
    The live run used a single-agent workspace run. A live run of a 0.5.0 agent tree with MCP tools
    is not part of this release's evidence; the tree path is covered offline by the fan-out suite
    running green with the session wired in.
  - >-
    In the live run the model satisfied the criterion by writing "echo:" rather than the full server
    reply. The criterion passed as written, and that the tool's output does reach the next prompt is
    pinned separately by an offline sentinel test — but the live artefact is thinner than the goal
    text asked for.
  - >-
    MSRV rose from 1.75 to 1.87 and reqwest from 0.12 to 0.13, both forced by rmcp 2.2.0. Callers on
    an older toolchain cannot take 0.8.0.
supersedes: '0.7.0'
next_recommended_version: 0.9.0
immutable: true
