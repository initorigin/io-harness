known_limitations:
- >
  **This record is sealed before the crates.io upload.** The authorized mode is `published` and the
  flow makes it true: `feat/0.30.0` into `develop`, `develop` into `main`, the GitHub Release cut by
  `release.yml`, then `cargo publish --locked` by hand, last. The record states the target; it does
  not claim the upload has already happened.
- >
  **The gates ran before the record was written, and O1 and O2 cannot run locally at all.** The
  three-OS matrix including the MSRV job, and the docs.rs nightly build, execute on the pushed
  commit. This is stated rather than implied, and the record is not amended afterwards — an
  immutable record that gets edited makes `immutable: true` a wish.
- >
  **N2's wording over-claims and the measurement is what shows it.** "The aggregates do not scale
  with the trace" is not achievable for an aggregate over full history: counting every row is what
  the answer *is*. Measured on a debug build over an in-memory store, twenty times the runs cost
  roughly five times (runs_by_outcome) to twenty times (first_try) as long — at 20,000 finished
  runs, 1.8ms, 2.5ms, 7.6ms and 1.2ms. What is true, and is what the criterion's own second sentence
  asks for, is that each is one indexed query rather than a table scan, at roughly 90–380ns per run.
  Raised for the owner rather than read as satisfied; making it literally true needs materialised
  counters, which is a different release. `docs/CONTRACT.md` states the honest version.
- >
  **Gate failures group by phase, not by criterion.** The trace records which phase of the gate
  failed — `compile`, `criterion-compile`, `test-run` — and not the text of the criterion. Counted
  per failure rather than per run; "how many runs failed this phase" is a different question and is
  not answered rather than answered ambiguously.
- >
  **`Recovery` has no escalation count**, because nothing records an escalation as an event. When
  something does, it gets its own row rather than a place in the total.
- >
  **A pin binds a run, not the caller holding the store.** `memory_delete` and `memory_clear` have
  no pin guard, so a pinned entry is not tamper-proof against the embedding program — only against
  the agent. Found while documenting rather than while building, and written into
  `docs/CONTRACT.md` rather than quietly left as an implied promise.
- >
  **`first_try` counts a run whose gate never ran.** A contract with `Verification::None` that
  finishes successfully has no failed gate phase and is therefore a first-try pass. That is the
  honest reading of "succeeded with nothing failing", and it means the number is not a
  gate-pass-rate for a workspace that mixes verified and unverified runs.
- >
  **`MemoryEntry` gained two public fields.** It is a row this crate returns and nothing takes, so
  this is additive for every reader — but a caller who constructs one in a struct literal has to
  name `kind` and `pinned`. Two of this crate's own tests did, which is exactly the cost, and it is
  in `docs/CONTRACT.md` beside the same warning for the two provider structs.
- >
  **The backwards cross-version test is `#[ignore]` by default.** It needs the pinned 0.29.0
  generator built, which resolves `io-harness =0.29.0` from crates.io. A local `cargo test` reports
  it as ignored rather than silently passing; the `cross-version-0.29.0` CI job is what runs it, and
  that job also fails if the generator's pin ever drifts off `=0.29.0`.
- >
  **Provenance is a map built at load, not a per-key walk.** Decided against the merge code early:
  the known consumer renders a whole settings list, and a per-key walk would re-read the tables once
  per row. The cost is that every key a file set is held in memory for the life of the `Config`,
  which for a configuration file is nothing.
