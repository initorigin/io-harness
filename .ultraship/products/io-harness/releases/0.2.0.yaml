product: io-harness
version: 0.2.0
status: released
release_type: minor

outcome:
  user_can: >
    A developer hands io-harness a longer, multi-step task and can trust the run:
    step, time, and cost budgets are enforced and stop the run with the correct
    budget outcome when exceeded; a failed step is retried and then recovered or
    escalated instead of silently failing; every prompt, decision, and tool call
    is captured as a full trace in rusqlite so the run is auditable and can be
    resumed from where it stopped; and verification is execution-based — the gate
    compiles and/or runs a test against the produced artifact, so a task cannot
    pass with a substring stub the way the 0.1.0 FileContains gate could.
  business_value: >
    Turns the proven 0.1.0 loop into one io-cli and io-studio can trust for real
    work: budgets bound blast radius and spend, retry/recovery removes single-step
    brittleness, the trace makes runs debuggable, and execution-based verification
    closes the trust hole the 0.1.0 live run exposed (US-IO-HARNESS-0.2.0-I01),
    where a model passed by writing the literal match substring instead of working
    code.
  evidence_of_value: >
    An integration test drives a multi-step task under a budget and shows correct
    stop behaviour; a second test reproduces the I01 stub and shows it FAILS the
    execution-based gate while a correct compiling artifact PASSES; a run is
    interrupted and resumed from rusqlite to completion.

scope:
  included:
    - Step, time, and cost budgets enforced, each stopping the run with a distinct budget outcome
    - Retry and recovery of failed steps — retry to a limit, then fallback / replan / escalate
    - Execution-based verification variant — the gate compiles (cargo check) and/or runs a test against the produced artifact
    - Full run trace — prompts, decisions, tool calls, token/cost usage, stop reason — via tracing and persisted to rusqlite
    - Resumable runs — persist enough state that an interrupted run continues from where it stopped rather than restarting
    - rusqlite schema extended for budgets, retry attempts, trace entries, and resume checkpoints, migrating existing 0.1.0 databases in place
    - Public crate API additions under SemVer, backward compatible with 0.1.0 task-contract callers
    - Tests — including one proving the I01 substring stub fails execution-verify and a correct artifact passes, and one proving resume works
    - Updated README and crate docs, packaged for publish
  excluded:
    - git, grep, find, and office/media tools (0.3.0, 0.6.0)
    - Anthropic and OpenAI providers, and multi-file edits (0.3.0)
    - Permissions, guardrails, human approval (0.4.0)
    - Sub-agents, ephemeral sandboxes, 24h+ autonomy (0.5.0)
    - MCP, plugins, skills (0.6.0)
    - Daemon/client mode and any network API
  fallback_scope:
    - Execution-based verification variant (compile and/or test the produced artifact)
    - Step and time budget enforcement with distinct stop outcomes
    - Full run trace persisted to rusqlite

acceptance:
  functional:
    - Given a multi-step task with configured step, time, and cost budgets, the harness enforces each and stops with the distinct budget outcome for whichever is exceeded first.
    - A step that fails (tool error or failed verification) is retried up to the configured limit, then recovered via fallback/replan or escalated; each attempt is recorded in the trace.
    - Execution-based verification compiles and/or runs a test against the produced artifact; the I01 case — a non-compiling substring stub — FAILS the gate.
    - A task whose output compiles and passes its test PASSES the execution-based gate.
    - Every prompt, decision, tool call, token/cost usage, and outcome of a run is written to rusqlite and reconstructable as a full trace after the run.
    - An interrupted run resumes from persisted rusqlite state and continues to completion rather than restarting from step one.
  non_functional:
    - Budget, retry, and verification configuration are part of the documented public API under SemVer; existing 0.1.0 task-contract callers still compile, or a documented migration is provided.
    - No provider vendor type leaks into the public budget, verification, or trace API (provider-agnostic surface preserved).
    - Execution-based verification runs the produced artifact locally without network access and cleans up build artifacts it creates.
  operational:
    - "`cargo test` passes, including the I01-stub-fails-verify test, the correct-artifact-passes test, and the resume test."
    - "`cargo publish --dry-run` succeeds with complete crate metadata for 0.2.0."
    - README documents budgets, retry/recovery, the trace and resume model, and execution-based verification, each with an example.
    - "(published mode) `cargo publish` uploads 0.2.0 to crates.io and the version is installable via `cargo add io-harness`."

delivery:
  target_mode: published
  environment: crates.io registry; developer's local machine for the run itself
  deployment_method: cargo publish to crates.io after cargo test and cargo publish --dry-run pass, with CARGO_REGISTRY_TOKEN present
  migrations:
    - Extend the rusqlite schema with tables/columns for budgets, retry attempts, trace entries, and resume checkpoints; migrate existing 0.1.0 databases in place, creating anything absent. Additions only — a 0.1.0 binary keeps working against a migrated database.
  observability:
    - Full structured trace (prompts, decisions, tool calls, token/cost usage, stop reason) via tracing and persisted to rusqlite
    - Budget consumption and per-step retry attempts recorded per run
  rollback: >
    A published crates.io version cannot be deleted, only yanked. Roll back with
    `cargo yank --version 0.2.0` so new builds fall back to 0.1.0; ship the forward
    fix as 0.2.1. The rusqlite migration is additive (new tables/columns only), so
    it needs no down-migration and a 0.1.0 binary still reads a migrated database.
    Before publish, the change lives only on the local branch and is reverted with git.

dependencies:
  products: []
  services:
    - OpenRouter API (model inference)
    - crates.io registry (publish target)
  human_approvals:
    - Owner runs `cargo publish` with a crates.io token; CARGO_REGISTRY_TOKEN must be available for the published target_mode (it was not for 0.1.0)
    - Owner confirms 0.2.0 crate version metadata before publish

resource_profile:
  complexity: large
  uncertainty: medium
  likely_cost_drivers:
    - Retry/recovery and replanning that neither loops forever nor declares false success
    - The resumable-run state model in rusqlite — what to checkpoint and where to resume
    - Execution-based verification — safely compiling/testing model output locally (cargo check/test invocation, isolation, cleanup)
    - Cost-budget accounting from partial OpenRouter usage data, with no separate provider telemetry
  preferred_tools:
    - Rust, tokio, rusqlite, serde, tracing; std::process / cargo invocation for execution-based verification
  constraints:
    - Rust crate; async on tokio; state in rusqlite; own HTTP + SSE provider client
    - Embeddable in-process library only; no daemon/client mode
    - Apache 2.0; runs locally, no hosted service

risks:
  - Execution-based verification runs untrusted model-produced code locally with no sandbox (sandboxes are 0.5.0); a hostile or buggy artifact could affect the workspace.
  - Retry/recovery masks a genuinely failing task by retrying indefinitely or declaring false success after a fallback.
  - Resume from partial rusqlite state replays or skips a step and produces a different result than an uninterrupted run.
  - The cost budget cannot be enforced precisely if OpenRouter responses do not carry reliable token/cost usage.
  - Adding budget/verify/trace to the public API breaks 0.1.0 callers if the additions are not designed to be backward compatible.

open_questions:
  - Is CARGO_REGISTRY_TOKEN available now for the published target_mode, or does 0.2.0 fall back to release-ready as 0.1.0 did?
  - Execution-based verification with no sandbox — acceptable for 0.2.0, or gated behind an explicit opt-in until 0.5.0 sandboxes exist?
  - What counts as "cost" for the cost budget when OpenRouter usage data is partial — tokens only, or estimated dollars?
  - Resume granularity — checkpoint per step or per tool call?
  - Are default budget values shipped, or required from the caller like OPENROUTER_MODEL was in 0.1.0?

released_at: "2026-07-24T00:00:00Z"
mode: published
delivered: >
  A developer runs a longer, budgeted io-harness task and can trust it: step,
  time, and cost (token) budgets each stop the run with a distinct outcome; a
  failing provider/tool step is retried and then escalated with every attempt in
  the trace; each step's prompt, tool call, and token usage is persisted to
  rusqlite; an interrupted run resumes under its original id; and verification is
  execution-based — the produced file is compiled (and optionally tested) with
  rustc, so a substring stub cannot pass. Published to crates.io as 0.2.0.
evidence:
  tests:
    - "cargo test — 8 unit + 9 integration + 1 doctest, 18 passed, 0 failed."
    - "execution_verify_rejects_the_i01_stub_in_the_loop + execution_verify_accepts_a_compiling_file — the I01 substring stub fails CompilesRust, a compiling file passes."
    - "stops_at_time_budget → TimeBudgetExceeded{steps:1}; stops_at_cost_budget → CostBudgetExceeded{steps:2}; stops_at_step_cap_when_never_verified → StepCapReached{steps:3}."
    - "retries_then_succeeds_recording_each_attempt — 2 retries then success, all three attempts in the trace; escalates_after_exhausting_retries — run returns Err after the limit."
    - "resumes_an_interrupted_run_without_restarting — StepCapReached{2} then resume to Success{steps:3} under the same run_id, one 3-step trace."
    - "migrates_a_0_1_0_steps_table_in_place — a pre-0.2 steps table is ALTERed on open, old rows survive."
  builds:
    - "cargo clippy --all-targets — clean, no warnings."
    - "cargo build --release — Finished release profile, exit 0."
  reviews: []
  deployments:
    - "cargo publish --allow-dirty — Uploaded and Published io-harness v0.2.0 to registry crates-io; cargo search io-harness returns io-harness = \"0.2.0\" (indexed)."
  health_checks:
    - "cargo run --example edit_file, live model openai/gpt-5.6-luna, Verification::RustTestPasses — Success{steps:1}; model produced compiling `fn hello() -> u32 { 42 }` that passed the compile-and-test gate (live proof of the I01 fix)."
known_limitations:
  - "0.1.0 was never published to crates.io (it landed release-ready), so 0.2.0 is the crate's first version on the registry; a 0.1.0→0.2.0 upgrade was never exercised against crates.io itself."
  - "Execution-based verification runs model-produced code locally with no sandbox (sandboxes are 0.5.0); a hostile or buggy artifact could affect the workspace."
  - "The live model run covered one model (openai/gpt-5.6-luna) and one simple task; broader model and task coverage is unproven."
  - "The cost budget is counted in tokens, not currency — OpenRouter carries no reliable per-request price."
  - "Only Rust execution-based gates exist (CompilesRust, RustTestPasses); other languages fall back to content checks."
  - "Resume reuses the file on disk as the run's state; if the file is changed out of band between interruption and resume, resume continues from the changed file."
supersedes: null
next_recommended_version: 0.3.0
immutable: true
