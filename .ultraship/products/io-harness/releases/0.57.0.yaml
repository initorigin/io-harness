known_limitations:
- >
  **The fit is a greedy prefix, not a knapsack.** It stops at the first note that does not fit rather
  than continuing to pack smaller ones behind it, so one large note near the top of the ranking can
  cost several small relevant ones. This has been true since 0.10.0 and is unchanged here; it is more
  visible now that the walk order is relevance rather than age.
- >
  **A recall is a carriage, not a use.** Nothing observable says whether the model read a line of the
  memory block, so the evidence the second rank term reads is "this entry was in the prompt of a run".
  0.56.0 recorded this for eviction; this release adds a second consumer of the same signal.
- >
  **Token overlap is a weak notion of "about".** Two notes on one subject that share no vocabulary
  rank as unrelated. The measure is chosen because it is exact, local and replayable. The clock tail
  means a turn with no signal degrades to 0.56.0's behaviour rather than to noise.
- >
  **Ranking is recomputed every turn and is linear in entries** — about 1.1 ms at the default 64
  entries and about 120 ms at 4,096, on every turn. The upgrade path if a store that large becomes
  ordinary is to cache each entry's token set against its `created_at`, not to make the ranking
  approximate.
- >
  **Past the share, a run that reads new files may pay a cache write it would not have paid on
  0.56.0.** The selected set can move as the signals grow, and a moved prefix withholds the marker.
  O8 asserts the fitting case costs nothing and that a moving prefix can only withhold, never add.
- >
  **A spawned child does not inherit the root's `ContextBudget`.** A child's `TaskContract` is built
  fresh by the spawn, so it always assembles under the default 24,000 tokens however tightly the root
  was bounded. Pre-existing, found while sizing F7's fixture, and outside this release's scope.
- >
  **The elision line no longer says "older", which `scope.included` said would be unchanged.** The
  substance of that line was kept and one word that had become false was removed: the notes are
  elided for being about something else, not for being old.
- >
  **F13's parenthetical was wrong.** It claimed a float comparison would flip the exact-threshold
  case. It does not — an exactly-60% ratio divides to the same `f64` the literal parses to. The
  integer comparison is kept because there is then no rounding to reason about, and the boundary is
  asserted in both directions instead.
- >
  **0.56.0's eviction plan test claims ten thousand recall rows and builds 9,984.** Sixty-four keys
  over 156 steps. Found by the new plan test's own row-count guard; the new test asserts the count
  rather than leaving it as arithmetic in a loop bound. The sibling is left as it is.
- >
  **Three arms of the sabotage pass survived their first run and all three were test defects**, not
  superfluous guards — recorded in the evidence rather than quietly fixed.
- >
  **One handle test fails under full-suite parallelism on this machine and passes serially**:
  `a_handle_that_exits_on_its_own_stops_reading_as_running`. It races a process reaper, touches
  nothing this release changed, and is the tenth instance of the standing "never gate a test on a
  clock" trap.
