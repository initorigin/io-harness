product: io-harness
version: 0.57.0
status: released
release_type: minor

outcome:
  user_can: >
    The notes a turn is handed are the notes that turn needs, and a note that contradicts one
    already held is caught where it is written rather than after it has been believed.

    Recall today is ordered by recency and nothing else. `Store::memory_list` (`src/state.rs:6962`)
    returns `ORDER BY created_at ASC, id ASC`, and `render_notes` (`src/context.rs:888`) walks that
    slice with `.rev()`, so the newest notes fill the block's quarter-share of the turn and the rest
    are elided with a count. That is the right answer only while the whole store fits the share —
    which it does at the defaults, and stops doing the moment an operator raises the caps 0.56.0
    handed them. After this release **what survives the fit** is decided by what the turn is about:
    the words of the goal and the paths the run has already read or written, then how many separate
    runs have drawn on the entry, then the write clock as the tail. Nothing is scored by a model and
    nothing leaves the process — the ordering is a pure function of the store and the turn, so a
    replayed run selects the same notes it did the first time.

    **The rendered block stays chronological, and that is a deliberate correction to the roadmap
    entry's prose.** Relevance decides which notes are kept, not the order they are printed in.
    Reordering the printed block would rewrite the memory block on any step whose signals moved,
    and the memory block is a byte-prefix of the user turn that 0.44.0's second cache breakpoint is
    withheld over unless it repeats byte-identically — so a release that reordered the print would
    have quietly converted cache reads into cache writes on every marked wire. Selecting rather than
    reordering means that a store that fits its share renders **byte-for-byte what 0.56.0 rendered**,
    and only the over-cap regime — the regime this release exists for — sees any change at all.

    And `remember` stops being able to write a contradiction silently. It writes by key, so the same
    fact learned twice under two names leaves two entries that disagree, both carried, and the model
    acts on whichever it read last. On a write whose text closely matches an entry already stored in
    the same scope under a different key, the tool result names that key and quotes what it holds, so
    the model resolves it in the same turn — replace the old one, or drop the new one — instead of
    leaving a contradiction for a later run to trip over. The comparison is a normalised token
    overlap of the two texts, computed in this process, on the write path already running.
  business_value: >
    0.56.0 made the three memory caps an operator's numbers and stated the coupling it was handing
    them: the block gets a quarter of the turn's effective tokens, the whole store fits inside that
    share at the current caps, and past that point selection begins deciding what the model sees.
    Selection by recency is the wrong policy at that point — it hands a turn about the build system
    the four notes written yesterday and elides the one note about the build system — and it is the
    policy an operator reaches by taking exactly the option the previous release added. This release
    is the other half of that one: the caps became raisable, and now raising them is not a
    downgrade.

    The duplicate half addresses the failure that makes durable memory untrustworthy rather than
    merely bounded. A wrong note is recoverable — 0.56.0 shipped `forget`, and pinning has existed
    since 0.30.0. Two notes that disagree are not recoverable, because nothing in the run knows they
    disagree: both are carried, the model reads both, and which one it acts on depends on rendering
    order. Catching it at the write is the only moment the writer's own intent is still available to
    resolve it.
  evidence_of_value: >
    A store filled past its share with notes about many subjects hands a turn about one of them the
    notes about that subject, and elides the notes about the others — asserted directly, by building
    a store whose block cannot fit, running a turn whose goal names one subject, and reading which
    keys `Assembled::recalled_keys` names. On 0.56.0 the same store hands the same turn whichever
    notes were written most recently, and the assertion is written out both ways so the change is
    visible rather than claimed.

    A run that writes a note restating something the store already holds under another key is told
    which key, and what it holds, in the tool result of that same call. On 0.56.0 the call reports
    only `[remember <key>]` and both entries are carried by the next turn.

scope:
  included:
  - >
    **Recall selection ordered by the turn.** A crate-internal ranking, applied at `recall_scopes`
    (`src/run.rs:13224`) — the one choke point both the flat loop (`src/run.rs:4753`) and the tree
    loop (`src/run.rs:7037`) already pass through, so the sub-agent loop cannot be left behind the
    workspace loop. Three terms, in order: the number of distinct normalised tokens the entry's
    `key` and `value` share with the turn's signal set; the number of **distinct `run_id`s** in
    `memory_recalls` for that `(workspace, key)`; and, as the tail, today's `created_at, id` order.
  - >
    **The turn's signal set is the goal and the paths already touched.** The normalised tokens of
    `contract.goal`, plus the normalised tokens of every `Observation::target` in the run's
    `Ledger` — the path or subject a tool named, which the ledger already records and both call
    sites already hold. No new state, no new table, and nothing read from the workspace.
  - >
    **The tail rides a stable sort, not a comparator.** `MemoryEntry` carries `created_at` but not
    the row `id` (`memory_row`, `src/state.rs:1470`), and `memory_list` already returns
    `created_at ASC, id ASC`. Ranking therefore uses `slice::sort_by`, which is stable, so entries
    equal on the first two terms keep the order SQL delivered them in. No column is added to the
    struct and no query changes shape to carry one.
  - >
    **Selection changes; the printed order does not.** `render_notes` keeps choosing under the
    ceiling in best-first order and then prints the kept set in `created_at` order. The two
    scope headings, the elision line and its count, the `- {key}: {value}  (step {step})` line and
    the deliberate omission of `run_id` from it are all unchanged.
  - >
    **One new aggregate, answered from 0.56.0's index.** A `pub(crate) const` beside
    `MEMORY_CANDIDATES_SQL` (`src/state.rs:6895`) reading
    `SELECT key, COUNT(DISTINCT run_id) FROM memory_recalls WHERE workspace = ?1 GROUP BY key`,
    served by `memory_recalls_entry (workspace, key)`. One statement per scope per turn. No new
    table, no new column, no new index, no `CHECKPOINT_FORMAT` change.
  - >
    **A near-duplicate is reported at the write.** `Store::memory_similar(workspace, key, value)`
    returns the stored entry in that workspace whose value most overlaps `value` and whose key is
    **not** `key`, or `None`. Overlap is `|A ∩ B| / |A ∪ B|` over the two normalised token sets,
    compared against a fixed threshold by integer cross-multiplication rather than a float
    comparison, so the answer is exact.
  - >
    **The `remember` arm asks before it writes.** `src/run.rs:10113` consults `memory_similar` on
    the scope it is about to write to, and on a hit the tool result carries a second line naming
    that key and quoting its value, bounded, with the cut marked. The write still happens: the model
    is told what it now holds twice, and resolves it with `remember` or `forget` in the same turn.
    The line is part of the observation, so it is in the ledger and in the trace as well as in the
    model's next request.
  - >
    **One normalisation, used by both halves.** Lowercase, split on anything that is not
    alphanumeric, drop tokens shorter than three characters. Written once and called by the ranking
    and by the similarity check, so "what counts as a word here" cannot come to mean two things.
  - >
    Documentation for all of it in the checked-in surfaces, and the changelog entry.
  excluded:
  - >
    **Reordering the rendered block.** Stated in `outcome.user_can` as a correction to the roadmap
    entry, and the reason is 0.44.0's cache boundary: the memory block is a byte-prefix of the user
    turn, and a prefix that does not repeat byte-identically withholds the marker. Selection is the
    behaviour that was wanted; reordering the print was the spelling.
  - >
    **Any embedding, model call or similarity service.** The comparison is token overlap computed
    in-process. Nothing leaves the process and nothing is scored by a model — which is what lets the
    determinism criterion be an equality rather than a resemblance.
  - >
    **A stored score, a decay constant or a learned weight.** The rank is computed from the store
    and the turn at the moment of recall, as 0.56.0's eviction order is computed at the moment of
    eviction. A stored score is a second source of truth that drifts.
  - >
    **Cross-scope duplicate detection.** A workspace note that restates a global one is not a
    contradiction — it is the override the workspace scope exists for, and 0.56.0 made it the
    designed way to correct a wrong global note. The check therefore compares within the scope being
    written and says so.
  - >
    **Flagging a rewrite of the same key.** `remember` on a key that already exists is an
    intentional replacement and has been since 0.10.0. The check excludes the key being written.
  - >
    **Refusing, merging or rewriting on a near-duplicate.** The write lands and the model is told.
    A harness that refused a write because two strings overlapped would be guessing at intent, and a
    harness that merged them would be writing a fact nobody stated.
  - >
    **A tunable threshold.** One constant, stated in the method's own documentation. An operator key
    for it would be a number nobody can set without data this crate does not collect.
  - >
    **Changing what a recall row means, or writing a new kind of one.** `memory_recalls` keeps its
    per-step shape and its two writers.
  - >
    **Moving any default.** The three caps ship at 0.56.0's numbers.
  fallback_scope:
  - >
    Recall selection ordered by the turn, without the duplicate check. "The notes a turn is handed
    are the notes that turn needs" is a coherent release on its own, and it is the half that
    finishes what 0.56.0 started — raisable caps whose selection policy is no longer recency. The
    duplicate check moves to 0.58.0, where it costs nothing to defer: nothing else in that release
    touches the write path.

acceptance:
  functional:
  - >
    **F1 — a turn about one subject is handed the notes about that subject.** A store holds notes on
    several subjects, sized so the block cannot fit them all. A turn whose goal names one subject
    carries that subject's notes in `Assembled::recalled_keys`, and the notes of the other subjects
    are the ones elided. The same store and the same turn on 0.56.0's ordering carry the most
    recently written notes instead, and that control is written out in the test. Sabotage: return
    the entries in `memory_list` order, under which the recency set is carried and only F1 fails.
  - >
    **F2 — a path the run has already read counts as a signal.** With a goal that names nothing in
    the store, a run whose ledger holds an `Observation` targeting `src/state.rs` carries the note
    whose value mentions `src/state.rs` over a newer note that mentions nothing the run has touched.
    Asserted on the carried keys, from a ledger built directly rather than by driving a provider.
    Sabotage: build the signal set from the goal alone, under which the newer note is carried and
    only F2 fails.
  - >
    **F3 — draws break a signal tie, and the write clock breaks a draw tie.** Two entries with an
    identical overlap against the turn are separated by the number of distinct runs that carried
    them; two entries equal on both are separated by `created_at, id`, which is the order
    `memory_list` delivered. Both halves asserted in one test. Sabotage: drop the draws term, under
    which the pair orders by clock alone and only F3's first half fails.
  - >
    **F4 — one long run does not outvote many short ones.** The draws term is
    `COUNT(DISTINCT run_id)`, so an entry carried at two hundred steps of one run ranks below one
    carried at one step of each of three runs. This is 0.56.0's F2 asserted on the other side of the
    same table, and it exists because the obvious spelling of "how often has this been drawn on" is
    a row count. Sabotage: `COUNT(*)`, under which the 200-row entry wins and only F4 fails.
  - >
    **F5 — a store that fits its share renders byte-for-byte what 0.56.0 rendered.** With every note
    inside the block's quarter-share, the assembled text is identical to the text produced with the
    ranking disabled — asserted as a string equality of the whole memory block, not on the set of
    keys, because the caching claim in `outcome.user_can` is about bytes. Sabotage: sort the kept
    set by rank before printing, under which the block's line order moves and only F5 fails.
  - >
    **F6 — the same store and the same turn select the same notes twice.** Two consecutive
    assemblies over one store with one goal and one ledger produce equal `recalled_keys` and equal
    block text. A third assembly after one further note is written produces a selection that is
    still a pure function of the new store — asserted by computing it twice. Sabotage: seed the
    ranking with anything not derived from the store and the turn, under which the two runs differ
    and only F6 fails.
  - >
    **F7 — the ranking reaches the sub-agent loop.** A child agent spawned by a tree run recalls
    under the same ordering as the flat loop over the same store and the same goal — asserted by
    driving a spawn and reading the child's assembled block, not by asserting that one function has
    two callers. Sabotage: rank in `run_workspace_from` rather than in `recall_scopes`, under which
    the child falls back to recency and only F7 fails.
  - >
    **F8 — the draws aggregate is answered from an index.** `EXPLAIN QUERY PLAN` over the exact
    statement the crate runs, on a store holding 64 entries and 10,000 recall rows, names
    `memory_recalls_entry` and contains no `SCAN memory_recalls`. Asserted on the plan text of the
    `const` itself rather than a copy of it, as 0.56.0's F5 is. Sabotage: query by `run_id` instead,
    under which the plan shows a scan and only F8 fails.
  - >
    **F9 — a near-duplicate write names the key already held and what it holds.** A run writes
    `build-command: "cargo test --all-features"` and then, under a different key, a value restating
    it. The second call's tool result names the first key and contains its value; the observation
    recorded in the ledger contains the same text. Sabotage: report only that a duplicate exists
    without naming the key, under which the assertion on the key's presence fails and only F9 fails.
  - >
    **F10 — an unrelated note is not flagged, and a rewrite of the same key is not flagged.** A
    second note sharing no subject with anything stored produces the plain `[remember <key>]` result
    with no second line; rewriting an existing key with a value nearly identical to its own current
    value is a replacement and is not flagged either. Both halves asserted on the absence of the
    flag text, because an implementation that flags everything passes any test that only checks the
    positive case. Sabotage: drop the same-key exclusion, under which the rewrite is flagged and
    only F10's second half fails.
  - >
    **F11 — the write still lands, and the entry is bounded and quoted with its cut marked.** After
    a flagged write, `Store::memory_list` holds both entries: the harness reports and does not
    refuse. A flagged entry whose value exceeds the quoting bound is quoted truncated with the
    existing marker, so a 2,000-character note cannot push the turn's other observations out.
    Sabotage: refuse the write on a hit, under which the two-entry assertion fails and only F11
    fails.
  - >
    **F12 — the check is per scope.** A workspace write that restates a **global** note is not
    flagged, because the workspace overriding a global note is 0.56.0's designed correction path; a
    workspace write that restates another **workspace** note is. Both directions asserted, and the
    global-write side asserted too, so the rule is "within the scope being written" rather than
    "within the workspace bucket". Sabotage: compare against both scopes, under which the override
    case is flagged and only F12's first half fails.
  - >
    **F13 — the overlap measure is symmetric, exact and immune to word order.** Unit-level: the same
    two texts compared in either direction give the same answer; two texts with the same words in a
    different order are maximally similar; a text and its own copy with one word added is not; and
    the threshold comparison is made on integers, asserted by a pair whose float ratio lands on the
    threshold exactly. Sabotage: compare with `as f64` division, under which the exact-boundary case
    flips and only F13's last assertion fails.
  non_functional:
  - >
    **N1 — no new dependency.** `cargo tree` stays at **402** lines on the default build. This
    release is a sort, a token set, one SQL statement and one tool-arm branch.
  - >
    **N2 — the public surface addition is stated in advance.** `docs/public-api.txt` tracks
    crate-root re-exports. The prediction is **+0 lines**: `Store::memory_similar` is a method on an
    exported type and the threshold is a private constant documented on that method. Any difference
    is explained in the record rather than absorbed.
  - >
    **N3 — no schema change at all.** `git diff main -- src/state.rs` shows the new aggregate
    `const`, `memory_similar` and the shared normaliser, and **no new table, no new column, no new
    index and no `CHECKPOINT_FORMAT` change**. 0.56.0's `memory_recalls_entry` is what serves the
    aggregate; this release adds nothing to the file a 0.56.0 binary opens.
  - >
    **N4 — zero compile breaks.** `MemoryWrite` is not `#[non_exhaustive]` and is constructed by
    literal in `docs/guide/context-and-memory.md`, so no field is added to it — the duplicate is
    reported by a separate read method rather than on the write's return value. `recall_scopes` and
    `render_notes` are crate-internal. No existing signature changes shape.
  - >
    **N5 — the per-turn cost of ranking is measured and recorded, never asserted.** The time to rank
    one scope is measured at three store sizes — 64, 512 and 4,096 entries, each with a recall table
    proportional to the store and a ledger of 200 observations — on a named machine, in
    `docs/MEASUREMENTS.md` with the method. The shape to expect is linear in entries × signal
    tokens, stated as such; a timing that does not move when the input grows is a defect report and
    not a pass, which is the standing lesson of 0.56.0's N5.
  - >
    **N6 — the write path's added cost is measured at the caps an operator may set.** The time for
    one `remember` call including `memory_similar` is measured at the same three sizes and recorded
    beside N5. `memory_similar` reads at most `max_entries` rows, so the cost is bounded by a cap
    the operator chose and is stated in the guide where that decision is made.
  operational:
  - >
    **O1 — the three-platform matrix is green**, `--all-features` included.
  - >
    **O2 — nothing in the suite gates on a wall clock.** N5 and N6 are recorded, never asserted.
    Ledgers and recall tables are built by construction rather than by driving runs, so no test's
    cost scales with a provider.
  - >
    **O3 — `docs/CONTRACT.md` is amended in this release, by name.** Its memory section states that
    recall carries the newest notes that fit. That changes. The new rules — selection by the turn's
    signals then by draws then by the clock, the rendered order staying chronological and why, and
    the near-duplicate report — are written where the old sentences stood.
  - >
    **O4 — the cross-version gate runs.** `cargo build --manifest-path
    tests/fixtures/gen-0.29.0/Cargo.toml` then `cargo test --test cross_version_0_29_0 -- --ignored`.
    This release changes no schema, and the gate is what proves that rather than the diff being read.
  - >
    **O5 — the nightly rustdoc gate passes with `-D warnings`.**
    `RUSTDOCFLAGS="--cfg docsrs -D warnings" cargo +nightly doc --all-features --no-deps`, run before
    the release PR. It has found something in six of the last eight releases.
  - >
    **O6 — the checked-in doc surfaces are updated in this release.** `docs/guide/context-and-memory.md`
    (what decides which notes are carried, and that the printed order is chronological),
    `docs/guide/tools-and-skills.md` (`remember`'s duplicate report), `docs/guide/configuration.md`
    (the coupling paragraph 0.56.0 added, which now says what selection does past the share),
    `docs/CAPABILITIES.md`, `docs/MEASUREMENTS.md`, the README's memory description and the
    changelog. Every new public item carries a worked example; `cargo test --doc` and
    `tests/public_api.rs` pass.
  - >
    **O7 — clippy on all three feature polarities**, default, one feature on, and `--all-features`.
    0.54.0's four failures all appeared on the default polarity and not on `--all-features`.
  - >
    **O8 — the cache boundary is still taken on an unchanged store.** The guard that withholds
    0.44.0's marker until the candidate prefix repeats byte-identically is exercised over two steps
    of a run whose store did not change, and the marker is still sent. This is the operational half
    of F5 and it is what makes the "no caching regression" claim in `outcome.user_can` evidence
    rather than an argument.

delivery:
  target_mode: published
  environment: >
    crates.io as `io-harness` 0.57.0, GitHub at initorigin/io-harness with the tag `v0.57.0` and a
    Release titled `io-harness 0.57.0`, and docs.rs.
  deployment_method: >
    The standing flow. All work on `feat/0.57.0` off `develop`, committed incrementally as it lands,
    including the sealed UltraShip release record and the hand-appended lock pin. PR into `develop`,
    merged with the PR button. `develop`'s head and tree checked against the tree the gates ran on
    immediately before the release PR is opened — `git diff --quiet feat/0.57.0 develop` — because a
    Dependabot merge has landed above the feature merge twice in the last twenty releases. Release PR
    `develop` into `main`, merged the same way. The GitHub Release is cut by `release.yml` from a tag
    pushed alone, taking its notes verbatim from the changelog. `cargo publish --locked` by hand
    afterwards, always last, after both merges and the Release exist, with the registry token sourced
    from the repo-local `.env` in the same shell invocation. `develop` synced to `main`
    fast-forward only at the end. No branch is deleted.
  migrations:
  - >
    **None.** No table, no column, no index and no `CHECKPOINT_FORMAT` change. A 0.56.0 store and a
    0.57.0 store are the same file in both directions, and an operator does nothing.
  - >
    **One behaviour change an operator may notice, and only past the share.** Which notes are
    carried when the block cannot hold them all changes. A store whose notes all fit — every store
    at the default caps — assembles a byte-identical prompt, which F5 asserts.
  - >
    **One behaviour change a model will notice.** A `remember` whose text restates an entry already
    held returns a longer tool result. Nothing is refused and nothing is written differently.
  observability:
  - >
    The duplicate report is part of the observation the `remember` arm already records, so it is in
    the ledger, in the assembled prompt of the next turn, and in the trace, without a new event kind
    or a new row type. The context event for a write keeps its shape. Which notes a turn carried is
    already answered by `Store::memory_recalls` and by `ContextEvent::memory_recall`, both unchanged
    — the keys they name are simply now chosen by the turn rather than by the clock.
  rollback: >
    A published version cannot be recalled; the forward fix is 0.57.1 and `cargo yank --version
    0.57.0` is the escape hatch, leaving 0.56.0 as what `cargo install` resolves. Downgrading needs
    no migration whatsoever: this release adds nothing to the database. An operator who dislikes the
    new selection has no switch for it — that is the release — and the honest answer is 0.56.0 or a
    pin. An operator who wants the old behaviour in practice can have it by leaving the caps at
    their defaults, where the whole store fits the share and selection never runs.

dependencies:
  products: []
  services:
  - >
    crates.io and GitHub Actions for the release itself, as every version.
  - >
    **No live provider call is required.** Every claim is about this crate's store, its assembler and
    one tool arm, and is proven in-process against real SQLite stores and scripted providers.
  human_approvals:
  - >
    **Selection is by relevance; the printed order stays chronological.** Decided at specification
    time, 2026-08-15, against the roadmap entry's prose, which asked for the recall itself to be
    ordered by relevance. The reason is 0.44.0's cache boundary, and the cost of the prose version
    is a cache write on every marked wire on any step whose signals moved. Recorded as a correction
    rather than reworded to fit.
  - >
    **A near-duplicate is reported and never refused.** Decided at specification time, 2026-08-15.
    The write lands and the model resolves it in the same turn.
  - >
    **Both halves ship in this version.** `scope.fallback_scope` records selection alone as the
    smaller release if the plan stops fitting.
  - >
    **`delivery.target_mode` is `published`.** Decided at specification time, 2026-08-15.
  - >
    The PR, both merges, the Release and the publish are pre-authorised for this version under the
    standing flow.

resource_profile:
  complexity: medium
  uncertainty: medium
  likely_cost_drivers:
  - >
    **The byte-equality criterion is the hard one.** F5 asserts that a fitting store renders
    identically to 0.56.0, which forbids the obvious implementation — sort the slice, render it —
    and requires selection and printing to be separated inside `render_notes`. Getting that wrong
    passes every key-set assertion and fails only F5.
  - >
    **`MemoryEntry` has no `id`.** The tail term exists only as the order SQL delivered, so the sort
    must be stable and must not be preceded by anything that reorders the slice. A `sort_unstable_by`
    written by reflex is a defect that shows up as an intermittent F3.
  - >
    **Two recall call sites and a third path through the sub-agent loop**, exactly as 0.56.0 found.
    `src/run.rs:4753` and `src/run.rs:7037` both call `recall_scopes`; the signals must be built at
    both, and F7 is what proves the second one was not forgotten.
  - >
    **The signal set has to be cheap.** It is rebuilt per turn from a ledger that grows all run, so
    a naive rebuild is quadratic in steps. Build it once per turn into a set and measure it (N5).
  - >
    **Tokenisation decisions are where two implementations drift.** One normaliser, called by both
    halves, is in `scope.included` for that reason; two would let the ranking and the duplicate check
    disagree about what a word is.
  - >
    **`docs/CONTRACT.md`, the guide and the README describe recall as recency-ordered**, in more than
    one place, and 0.56.0 added a coupling paragraph that this release changes the conclusion of.
  preferred_tools:
  - >
    `src/context.rs`'s existing unit tests for the ranking, the byte-equality control and the
    normaliser — where `render_notes`'s tests already live.
  - >
    A new `tests/memory_recall.rs` for F1, F2, F6 and F7 — the assembled prompt and the spawn, which
    need the loop rather than the store.
  - >
    `tests/memory_scope.rs` (added in 0.56.0) for F9–F12, which already owns the `remember` arm and
    the two scopes.
  - >
    `EXPLAIN QUERY PLAN` through the same `Store` connection for F8, over the `const` the crate runs.
  constraints:
  - >
    **No new runtime dependency.** `cargo tree` flat at 402 on the default build.
  - >
    **MSRV 1.95, edition 2021, Apache-2.0.** Unchanged.
  - >
    **Every version stays 0.x.x.** No 1.0.0 is planned or implied.
  - >
    **No schema change of any kind**, and no `CHECKPOINT_FORMAT` bump. 0.56.0's index is what this
    release rests on.
  - >
    **Nothing is added to `MemoryWrite`.** It is not `#[non_exhaustive]` and is constructed by
    literal outside `src/`.
  - >
    **`docs/CONTRACT.md`, the README, the changelog, the guide pages and the crate-root prose are
    checked-in surfaces.** They change in this release, not the next one.

risks:
- >
  **The selection makes the block unstable across steps, and the cache marker is withheld.** In the
  over-cap regime the signal set grows as the run reads files, so the chosen set — and therefore the
  block's bytes — can move between steps, which is exactly what 0.44.0's guard withholds the second
  cache breakpoint over. Mitigation, and it is the release's central design decision: selection
  rather than reordering means a store that fits changes nothing at all, which F5 asserts on bytes
  and O8 asserts on the marker. The residual is real and is stated rather than denied — past the
  share, a run that reads new files may pay a cache write it would not have paid on 0.56.0, and an
  operator raising the caps is told so where they raise them.
- >
  **Token overlap is a weak notion of "about".** Two notes about the same subject that share no
  vocabulary rank as unrelated, and a note that happens to repeat a common word ranks as related. The
  measure is chosen because it is exact, local and replayable, not because it is the best available.
  Mitigation: the draws term and the clock tail mean a zero-signal turn behaves exactly as 0.56.0
  did, so a weak signal degrades toward today's policy rather than toward noise; and the guide says
  what the signal is rather than letting the word "relevance" imply more.
- >
  **A wrong entry outranks a right one because many runs carried it.** The draws term rewards an
  entry for having been in prompts, which 0.56.0 already stated is a carriage and not a use. An entry
  carried by fifty runs and never useful is protected by that history here as well as in eviction.
  Mitigation: signals outrank draws, so a turn about the subject still wins; `forget` exists; and the
  limitation is the same one 0.56.0 recorded, extended to a second consumer of the same table rather
  than newly introduced.
- >
  **The duplicate check misses the case it exists for.** The failure mode this release names is two
  notes stating the same fact in different words, which is precisely the case token overlap is worst
  at. Mitigation: F13 bounds what the measure does claim; the report is advisory and costs nothing
  when it is wrong; and the alternative — an embedding — is excluded for reasons that are about the
  crate's shape and not about quality.
- >
  **The duplicate check is noise.** A store of related notes may flag on many writes, and a model
  told about a near-duplicate on every call learns to ignore the line. Mitigation: the threshold is
  set high enough that a hit means a restatement rather than a neighbour, F10 asserts the negative
  case in both directions, and the report names one entry — the best match — rather than a list.
- >
  **A per-turn aggregate on the hot path.** The draws query runs once per scope per turn, on a table
  that grows by one row per carried key per step for the life of the store. Mitigation:
  `memory_recalls_entry`, F8 asserting the plan at 10,000 rows, and N5 recording the cost at three
  sizes.

open_questions:
- >
  **What the overlap threshold is.** The plan is a single high constant compared by integer
  cross-multiplication, chosen against a handful of real note pairs during implementation and stated
  in the method's documentation and in the record. F13 asserts the comparison is exact at the
  boundary rather than asserting the number.
- >
  **Whether the signal set should weight the goal above the paths.** The plan is one flat set: a
  token is a token, whether it came from the goal or from a path the run touched. Weighting is a
  second untunable constant, and the release can add one later if a live run shows path tokens
  drowning a short goal.
- >
  **How much of the ledger's targets to use.** The plan is all of them, since the ledger is already
  bounded by the run and the set is deduplicated. Revisit if N5 shows the rebuild is not flat enough
  in step count.
- >
  **Whether the duplicate report should also fire on `forget`.** The plan is no — a forget names a
  key and either finds it or does not, and there is no text to compare. Recorded because the
  symmetry is the first thing a reader asks about.
- >
  **Whether selection should be observable as its own trace row** — which notes lost, and to what.
  The plan is no: `ContextEvent::memory_recall` already names the carried keys, and what was not
  carried is the complement of a list the trace already holds.
delivered: >
  The notes a turn is handed are the notes that turn needs. Past the memory block's quarter-share of
  a turn — the regime 0.56.0's raisable caps created — the entries that survive the fit are ranked by
  how many normalised words they share with what the turn is about (the run's goal, and every path or
  subject a tool has already named in this run), then by how many separate runs have carried them,
  then by the order the store returned. An entry with no signal and no evidence keeps exactly the
  position it had, so a turn about nothing the store knows selects as 0.56.0 did.

  Relevance decides what is SELECTED, not the order it is printed in, and that is a correction to the
  roadmap entry made before any code was written. The memory block is a byte-prefix of the user turn
  and 0.44.0's second cache breakpoint is withheld unless that prefix repeats byte-identically, so
  reordering the print would have converted cache reads into cache writes on every marked wire, on
  every step whose signals moved, for a reordering the model gains nothing from. A store that fits its
  share therefore renders byte-identically however the turn moves.

  And `remember` stops writing a contradiction silently. On a write whose text closely restates an
  entry already held in the same scope under a different key, the tool result names that key and
  quotes what it holds, bounded. The write lands: it is a report, never a refusal. Rewriting the same
  key is not reported, and a workspace note restating a global one is not reported either — that is
  the override the second scope exists for.
