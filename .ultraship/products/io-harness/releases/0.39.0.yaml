known_limitations:
- >
  **This record was sealed before the merges, the GitHub Release and the crates.io upload**, which
  follow it in that order. `mode: published` states the release's target and what was actually done
  is reported with the merge. A record can never cite CI on the commit that contains it: the
  three-OS matrix runs on the pull request that carries this commit, so O1's evidence is stated in
  the merge and the final report rather than amended into a sealed record — the 0.29.0 precedent.
- >
  **N2 was met in a different form than its prose names, and this is the deviation.** The criterion
  said `docs/public-api.txt` gains exactly two lines. It gains none: `tests/public_api.rs`
  enumerates the items re-exported from `lib.rs`, and `Session::turn_contained` and
  `Session::turn_contained_observed` are inherent methods on the already-listed `struct Session`.
  The substance is stronger than the criterion asked — the crate root's surface is byte-identical —
  and both methods carry a worked doctest anyway. Adding lines by hand would have failed the
  checker, which compares the parse against the snapshot.
- >
  **A paused contained turn's row reports the pause, not the continuation, and it reads `running`
  rather than `awaiting_approval`.** `Session::drive` closes the turn with what `Store::run_summary`
  said when the turn returned, and a run parked on an approval has no summary outcome yet. F8
  asserts the value as measured rather than as first assumed, and `docs/CONTRACT.md` states it. The
  run is the record that moves; there is no session-side refresh, which was not scoped here.
- >
  **One sabotage failed nothing, and it is a finding rather than an omission.** S4 handed a child
  its parent's policy verbatim instead of `parent_policy.contain(&overlay)`, and every test still
  passed — with an identical policy the boundary genuinely still holds. What F4 discriminates is
  *widening*, which S4b (a permissive child) does fail. Inheritance-without-narrowing is not
  observable through this criterion, and the criterion is about the narrowing.
- >
  **The ledger is per turn, not per session**, by owner decision. A conversation has no single spend
  ceiling; its total is the sum of its turns'. Recorded in `docs/CONTRACT.md` and left in
  `open_questions`.
- >
  **A contained turn cannot be steered.** `turn_contained` and `turn_contained_observed` ship
  without a `turn_contained_steered`; an operator stops a fan-out with `Flow::Cancel` from the
  observer, honoured at the root's step boundary. Whether a mid-turn message should reach children
  in flight is an open question rather than an omission.
- >
  **No live provider exercised this release.** Every criterion is deterministic against fixture
  providers, which is what the contract specified — the fan-out's evidence is stored rows, outbound
  requests and refusals, none of which needs a vendor. No live smoke run was made.
