product: io-harness
version: 0.39.0
status: released
release_type: minor

outcome:
  user_can: >
    Ask for something wide inside a conversation, and have the conversation do it — without leaving
    the session for a one-shot run.

    Today a session turn cannot fan out, and the reason is structural rather than a missing feature.
    `SPAWN_TOOL` is offered by exactly one function, `tree_tools` (`src/run.rs:9950`), which is
    called by exactly one loop, `run_agent` (`src/run.rs:5276`), which is reachable from exactly one
    family of entry points, `run_tree` / `run_tree_observed` (`src/run.rs:4786`, `:4861`). Every
    `Session::turn*` method funnels through `Session::drive` (`src/session.rs:475`) into
    `run_with_extras` (`src/run.rs:1004`) and then into `run_workspace_from` (`src/run.rs:3792`),
    which is the flat loop and has never had the tool. A run is a tree or a turn and not both, and
    the crate's own documentation says so: "this is the only entry point that offers the spawn tool"
    (`src/run.rs:4733`).

    So an operator in a session who says *migrate these forty handlers* or *review these twelve
    files* gets one agent working through forty items in one context window, or they abandon the
    conversation, build a `TaskContract` by hand and call `run_tree` — at which point the work has no
    turn row, no place in the session tree, and no seat in the transcript the operator was reading.

    0.39.0 adds two methods, `Session::turn_contained` and `Session::turn_contained_observed`, which
    take a `&Containment` and drive the turn through the tree loop. The root agent of that turn is
    offered `spawn_agent`; its children inherit the session's policy and may only narrow it
    (`Policy::contain`); the whole fan-out draws on one shared `Ledger` no child contract can raise;
    and every spawn, refusal and draw is recorded under the turn's own run id, so
    `Store::agent_events`, `Store::spawns` and the observer stream reconstruct the fan-out under the
    turn the operator asked for. The turn is still a turn: one row in `session_turns`, one move of
    the session head, one entry in `Session::history`.

    What does not change: the five existing turn entry points are untouched and still never offer the
    spawn tool, so a session that does not ask for containment behaves exactly as it did in 0.38.0.
    No public item is removed or altered, no type gains a field, no table is created or migrated, and
    `CHECKPOINT_FORMAT` does not move.

  business_value: >
    The crate already owns every hard part of this and cannot reach it from the place operators
    actually work. Containment, the shared ledger, per-tier concurrency slots with a durable FIFO
    queue, policy narrowing through `Policy::contain`, spawn accounting, worktrees per child, and
    tree-wide resume have shipped across 0.5.0, 0.21.0, 0.31.0, 0.32.0 and 0.36.0 — roughly six
    releases of composition machinery, all of it addressable only from `run_tree`. The session layer
    that 0.20.0 built, that 0.37.0 taught to tell an answer from a run, and that io-cli renders as its
    transcript, is the one caller that cannot use any of it.

    That gap decides how an embedding application has to be written. io-cli's whole surface is a
    session; a user who asks it for something wide is served by one agent in one context, because the
    alternative — construct a contract, call `run_tree`, and reconcile a run that has no turn — means
    reporting work in a place the transcript cannot show. An app cannot close this itself: `run_agent`
    is private, `TurnExtras` is crate-internal, and the tool is registered inside a loop no public
    entry point outside `run_tree` reaches. As with 0.37.0's greeting list and 0.38.0's cache marker,
    the gap is in the library and only the library can close it.

    The cost of closing it is two additive methods and no break, which is the second half of the
    argument: this release makes six releases of existing machinery reachable from the caller that
    needed it, for a public surface of two functions.

  evidence_of_value: >
    Executed in the technique the last nine releases used: a discriminating pair, a negative control
    that must not move, one sabotage per arm of every two-armed claim, and a sabotage that fails
    nothing reported as a finding rather than propped up.

    The reachability claim is proven on the outbound request, not on a wiring diagram: the tool
    specs the provider is handed on a contained turn's first completion contain `spawn_agent`, and
    the specs handed to `Session::turn` on the same contract and policy do not. That pair is the
    release in one assertion, and the second half is the negative control that keeps the existing
    entry points where they were.

    The containment claim is proven where a boundary is either enforced or not: a child spawned
    inside a turn is recorded under the turn's run as its parent, draws from the turn's ledger until
    the shared ceiling refuses it, and is refused when its goal asks to write outside the session's
    policy. Each of those is asserted against stored rows and refusals rather than against the
    parent's narration of what happened, because a model's summary of its own children is not
    evidence.

    The turn claim is proven by an absence as much as a presence: after a contained turn that spawned
    three children, `Store::session_turns` returns exactly one turn, the session head names it, and
    `Session::history` renders one entry. A fan-out that leaked its children into the conversation
    tree would pass every positive assertion and fail these.

    The no-drift claim is proven by a source-reading test with a splice-in control, the shape 0.33.0
    and 0.35.0 both used: the seeding, classification and steer rules exist once each and both loops
    reach them through the same helper. Two loops that each re-implement a session rule is the defect
    this release is most likely to introduce, and it is the one a passing test suite would hide.

scope:
  included:
  - >
    **`Session::turn_contained` and `Session::turn_contained_observed`.** Both take the contract, the
    provider, the store, the policy, the approver and a `&Containment`; the second also takes an
    `&dyn Observer`. They mirror `run_tree` / `run_tree_observed` argument for argument, plus the
    session's own receiver, and they are the only two public items this release adds. Per-call rather
    than session-level by owner decision: a `Session::with_containment` would change what
    `Session::turn` does for a session that set it, which is a behaviour break of the 0.37.0 kind for
    a caller who never asked to fan out.
  - >
    **The turn reaches the tree loop, and the tree loop learns what a turn is.** `Session::drive`
    stays the one place a turn is recorded, closed and headed (`src/session.rs:475`); it gains a
    branch that builds the `Tree` and calls `run_agent` at depth 0 with the same `TurnExtras` the
    flat loop receives. The extras the tree loop must honour at the root are exactly the four the
    flat loop honours: the conversation seed pushed into the observation ledger before the first step
    (`src/run.rs:3890`), the classification of a first completion that stopped on text
    (`src/run.rs:3849`, `:3942`, `:4194`), the steer inbox drained at the step boundary
    (`src/run.rs:3983`), and streaming (`src/run.rs:4102`). At depth greater than zero every one of
    them is inert: a child is work, not conversation.
  - >
    **One helper per rule, called by both loops.** Each extras rule is extracted to a crate-internal
    helper that both `run_workspace_from` and `run_agent` call, rather than copied into the second
    loop. This is the 0.34.0 rule — "resolve it through ONE helper both call sites go through, or the
    two loops drift" — applied to the largest duplication opportunity the crate has yet had. The
    `NO_TOOL_CALL` constant (`src/run.rs:123`) already exists for this exact reason, and its doc
    comment names the symptom: a rule reworded in one place and silently lapsed in the other.
  - >
    **Children inherit the session's boundary and the turn's ledger, and nothing new decides either.**
    `Policy::contain` narrows, `Ledger::effective_token_budget` caps, `Ledger::try_admit` queues per
    tier, `max_total_agents` refuses. The ledger is built per turn from the `Containment` passed to
    that call — turn five gets the ceiling turn one got — by owner decision, matching `Containment`'s
    existing semantics and `resume_tree`'s durable-total restore, and requiring no session-scoped
    spend state.
  - >
    **The fan-out reports into the transcript the operator is already reading.** Children's events
    carry their own `run_id` and non-zero `depth` to the same observer the turn was given, which is
    what `run_tree_observed` already documents (`src/run.rs:4808`). `EventKind::Spawned`,
    `SpawnRefused`, `Fleet` and `SpendDraw` reach a session's observer for the first time. No new
    event variant: the events a fan-out produces are the ones a tree already produces.
  - >
    **A contained turn that pauses resumes through the tree resume it already needs.** A turn that
    stops `AwaitingApproval`, `AwaitingAnswer` or `AwaitingPlan` is continued with
    `resume_tree_with_decision` / `resume_tree_with_answer` / `resume_tree_with_plan_decision` on
    `TurnResult::run_id`, under the same run id and the same turn row. No new resume API, by owner
    decision. What this release owes is the criterion that proves it works and the documentation that
    says which resume a contained turn takes — plus an honest statement of what the turn row holds
    after a resume the session did not drive.
  - >
    **Documentation as part of the release:** `docs/guide/sessions.md` gains the fan-out section with
    the per-turn ledger and the resume routing; `docs/guide/composition.md` gains the pointer from
    the tree side; `docs/CONTRACT.md` gains N4's limits; `CHANGELOG.md` gains the entry with **no**
    `*Migration:*` note, because nothing breaks. `README.md` where it describes what a session turn
    is. **No new guide page and therefore no `GUIDES` / `CAPABILITIES.md` bookkeeping** — sessions
    and composition both already have pages, which is the 0.31.0, 0.36.0, 0.37.0 and 0.38.0
    precedent. Each of the two new public items carries its own worked example, which the
    `every_public_item_has_a_worked_example` gate requires, and `docs/public-api.txt` is updated by
    hand because there is deliberately no `--bless`.
  excluded:
  - >
    **Session-level containment (`Session::with_containment`), by owner decision.** One setting that
    makes every subsequent `turn` able to spawn is fewer call sites and a silent behaviour change for
    the four entry points that have never spawned. The per-call form says at the call site that this
    turn may fan out, which is the property worth having.
  - >
    **A session-wide ledger spanning turns, by owner decision.** A ceiling drawn down across a
    conversation needs durable session-scoped spend, a restore path, and a designed answer for a turn
    that begins against an already-halted ledger. That is a release about budgets, not about
    reachability. Recorded in `open_questions`.
  - >
    **`Session::resume_turn*`, by owner decision.** Routing a paused turn to the right resume is
    something a caller does from `TurnResult::run_id` in one line; wrapping it would cost four public
    methods to save one match.
  - >
    **The conversation seed reaching children.** A child is given its goal, its contract and its
    narrowed policy — not the transcript. Forty children each carrying the conversation is the
    multiplied version of the cost `ContextBudget` exists to bound, and a child that has read the
    conversation is one that can act on an instruction three turns old that the operator has since
    withdrawn. The parent composes the child's result back into its own next turn, which is the
    0.5.0 shape and stays it.
  - >
    **Children as turns in the conversation tree.** A child gets a run, not a `session_turns` row.
    `Session::history` is the path an operator said and was answered along; a fan-out's internals
    belong to the run tree, which already reconstructs them.
  - >
    **A steered contained turn (`turn_contained_steered`).** `Session::turn_steered` covers the flat
    path; the contained pair ships with the observer, whose `Flow::Cancel` is honoured at the root's
    step boundary and reaches the whole tree through the shared `Watch`. Whether an operator's
    mid-turn message should reach children in flight is a design question, not an omission, and is
    recorded in `open_questions`.
  - >
    **Any change to `run_tree`, `run_agent`'s spawn semantics, the queue, the tiers or the worktree
    rules.** This release makes an existing machine reachable from a new caller. Anything that
    changes what the machine does is a different release.
  - >
    **Any new `EventKind` variant, table, column or index.** The fan-out's observability already
    exists; the gap was who could see it.
  fallback_scope:
  - >
    The two methods, the tree loop reached from a session turn, the seed and the steer inbox honoured
    at the root — with **classification dropped for contained turns**, which are then always
    `TurnKind::Run` and documented as such. The headline still holds in full: an operator fans out
    inside a conversation, under the session's policy and one shared ledger, with the work reported
    into the transcript they are reading. What drops is the 0.37.0 reply shortcut on a turn the
    caller invoked specifically to ask for wide work, and with it the classification half of the
    shared-helper port. The limitation is then stated in `docs/CONTRACT.md` and the record rather
    than discovered.

acceptance:
  functional:
  - >
    **F1 — the contained turn is offered the spawn tool and the plain turn is not.** A recording
    provider captures the `ToolSpec` list of the first completion. `Session::turn_contained` on a
    contract with a workspace root: the list contains `spawn_agent` (`SPAWN_TOOL`,
    `src/run.rs:109`). **The negative control, on the same contract, the same policy and the same
    store:** `Session::turn`, `Session::turn_observed`, `Session::turn_steered`,
    `Session::turn_bounded` and `Session::turn_bounded_observed` each produce a list that does not
    contain it. This pair is the release; an implementation that offered the tool from `drive`
    unconditionally passes the first half and fails the second, and that failure is a session
    silently gaining the ability to spawn.
  - >
    **F2 — a child spawned inside a turn belongs to that turn's run.** A fixture provider whose first
    completion calls `spawn_agent` twice and whose second stops on text. Assertions against stored
    rows, not against the parent's narration: `Store::spawns` reports both children with
    `parent_run_id == TurnResult::run_id`; each child has its own `runs` row with `depth` 1 and its
    own steps; `Store::agent_events` reconstructs the tree from the turn's run id; the events the
    observer received carry the children's own run ids at depth 1.
  - >
    **F3 — the tree's ceilings hold inside a turn, and the refusal is the tree's.** Two arms, one
    sabotage each. **(a) Spend:** a `Containment` whose `max_total_tokens` is below what the fan-out
    needs halts the tree on the shared ledger — `Ledger::draw_tokens` returns `Draw::Halted` and the
    turn ends on the budget outcome rather than the children continuing on their own contracts'
    budgets. **(b) Count:** a `max_total_agents` of 1 refuses the second spawn with
    `EventKind::SpawnRefused { cap }` and the parent adapts rather than failing. The discriminating
    detail for (b) is that `max_concurrent_agents` must **queue** rather than refuse in the same
    fixture — the 0.32.0 distinction, asserted here because a turn is the first new caller of it.
  - >
    **F4 — a child cannot widen the session's boundary.** The session's policy allows writes under
    `docs/` only. A child whose goal names a write to `src/` is refused by the policy the child
    inherited through `Policy::contain`, the refusal is recorded as a `PolicyEvent` under the
    **child's** run id, and the file does not exist on disk afterwards. Asserted on the filesystem
    and the stored refusal, not on the child's reported outcome. Sabotage: hand the child
    `policy.clone()` instead of the contained one, under which the write lands and this named test
    fails.
  - >
    **F5 — the turn is still one turn.** After a contained turn that spawned three children:
    `Store::session_turns` returns exactly **one** row for the session; `Session::head` names it;
    `Session::history` renders one entry; `Store::turn_for_run(TurnResult::run_id)` returns that
    turn id; and `Store::turn_for_run(child_run_id)` returns `None` for every child. The last two
    assertions are the ones that fail an implementation that recorded a turn per agent.
  - >
    **F6 — a contained turn still classifies, and a reply spawns nothing.** With
    `Verification::None`, a fixture provider whose first completion stops on text: the turn is
    `TurnKind::Reply`, `runs.turn_kind` is `reply` (`src/run.rs:996`), `EventKind::Answered` is
    emitted once, no `steps` row is written, no child is spawned and `Store::spawns` is empty.
    Sabotage: remove the classification call from the tree loop's first step, under which the turn
    becomes a `Run` and this named test fails. **The second arm:** the same contract carrying a
    `Verification` other than `None` does **not** classify and drives the loop, which is the 0.37.0
    rule (`src/session.rs:498`) holding on the new path.
  - >
    **F7 — the conversation is seeded once, at the root, and children do not see it.** A two-turn
    session whose second turn is contained: the root agent's first request contains the prior turn's
    prompt and reply as observations (`src/session.rs:567`), and the spawned child's first request
    contains neither, while containing its own goal. Asserted on the outbound requests rather than on
    stored rows — the 0.31.0 rule that a "not in the context" claim is made against what was sent.
  - >
    **F8 — a paused contained turn resumes as a tree, under the same turn.** A fixture that stops
    `AwaitingApproval` mid-fan-out. `resume_tree_with_decision` on `TurnResult::run_id` with the same
    contract, policy, approver and containment continues the same run id, the children are re-adopted
    from their own checkpoints, and `Store::turn_for_run` still returns the original turn id with its
    `session_id` and `parent_turn_id` unchanged. What the turn **row** holds after a resume the
    session did not drive — the reply and outcome written when the turn paused — is asserted as it
    actually is and stated in `docs/CONTRACT.md` and the record's `known_limitations`, rather than
    claimed to update itself.
  non_functional:
  - >
    **N1 — no new dependency.** `cargo tree` on macOS and Linux still reads **402** lines. This
    release adds no crate; it calls functions that already exist.
  - >
    **N2 — zero breaks, and the assertion is the diff of `docs/public-api.txt`.** The file gains
    exactly two lines — `Session::turn_contained` and `Session::turn_contained_observed` — and loses
    none. No existing signature moves, no type gains a field, no type gains `#[non_exhaustive]`,
    `TurnResult` is untouched, and `tests/changelog.rs` finds no `**BREAKING` entry for this version.
    If the implementation needs a field on `TurnResult`, `TaskContract` or `Containment` to work, the
    design is wrong for this release.
  - >
    **N3 — no store change.** No table, no column, no index; `CHECKPOINT_FORMAT` unmoved at 7;
    `ADDED_SINCE_0_22_0` unchanged; `tests/cross_version.rs` and the pinned 0.29.0 generator job pass
    in both directions with no new name fed to the guard. Every row a fan-out inside a turn writes
    goes to tables `spawns`, `agent_queue`, `runs`, `steps` and `run_events` have held since 0.5.0,
    0.32.0 and 0.33.0.
  - >
    **N4 — the two loops do not drift, proven by a source-reading test with a splice-in control.**
    Each session rule — seeding, classification, steering — exists in exactly one crate-internal
    helper, and both `run_workspace_from` and `run_agent` reach it through a call rather than a copy.
    The test asserts the helper is named once per rule and called from both loops; the splice-in
    control (a second copy of the rule added to one loop) must fail it, which is what stops the test
    being decorative — 0.33.0's fact 70 is the precedent for why a grep alone proves nothing.
  - >
    **N5 — the existing entry points are byte-unchanged in behaviour.** `run`, `run_with`,
    `run_with_observed`, `run_tree`, `run_tree_observed` and the five `Session::turn*` methods drive
    exactly the loop they drove in 0.38.0 with exactly the extras they drove it with. F1's negative
    control covers the spawn half; the full session, session_reply, session_steering and
    session_streaming suites passing unmodified covers the rest. No test in those four files is
    edited to accommodate this release.
  - >
    **N6 — the honest limits are where a reader finds them.** `docs/CONTRACT.md` states: the ledger
    is per turn and not per session, so a conversation's total spend is the sum of its turns' and no
    single ceiling bounds it; a contained turn that pauses is resumed with the `resume_tree_*` family
    and the turn row reflects the pause rather than the continuation; children do not receive the
    conversation and cannot answer the operator; the worst-case concurrency is
    `max_concurrent_agents × depth`, which is 0.32.0's documented cost inherited unchanged; and an
    interrupt or cancel is honoured at the root's step boundary, at which point no child is in flight
    because children are awaited inside the step that spawned them.
  operational:
  - >
    **O1 — the three-OS matrix is green** on the commit being released, including the MSRV 1.95 job,
    with no test skipped silently on Windows, no live fixture on the matrix path, and no wall-clock
    assertion anywhere in the new tests. Any source-reading test normalises line endings, and no path
    is joined from a slash-bearing literal.
  - >
    **O2 — docs.rs builds**, proven by running the nightly job's exact command
    (`RUSTDOCFLAGS="--cfg docsrs -D warnings" cargo +nightly doc --all-features --no-deps`) before the
    release PR is opened, never inferred from a stable `cargo doc`. It has caught something in four of
    the last five releases, and this release adds two documented items with intra-doc links to
    `Containment`, `Policy` and the `resume_tree_*` family — the exact shape trap 28 fires on.
  - >
    **O3 — `cargo package --locked` succeeds** on a clean tree and the packaged crate compiles, run
    after a `cargo clean`. Every local build and test runs with `CARGO_PROFILE_DEV_DEBUG=0
    CARGO_PROFILE_TEST_DEBUG=0`, with `df -h .` before and between build steps, and
    `cargo build --all-features --examples` before any `--lib --tests` run or sabotage — the fixture
    binaries this release's tests depend on are in `examples/`, and 0.32.0's fact 17 is that a
    sabotaged library run against a stale fixture passes everything.
  - >
    **O4 — `develop`'s head is checked against the tree the gates ran on, immediately before the
    release PR is opened.** 0.37.0 was interrupted by two Dependabot merges landing above the feature
    merge, and the record described a tree without them. If anything has landed, every gate is re-run
    on the merged tree before the record is sealed.

delivery:
  target_mode: published
  environment: >
    crates.io as `io-harness` 0.39.0, GitHub at initorigin/io-harness with the tag `v0.39.0` and a
    Release titled `io-harness 0.39.0`, and docs.rs.
  deployment_method: >
    The standing flow. All work on `feat/0.39.0` off `develop`, committed incrementally as it lands,
    including the sealed UltraShip release record and the hand-appended lock pin. PR into `develop`,
    merged with the PR button. `develop`'s head checked against the tree the gates ran on immediately
    before the release PR is opened. Release PR `develop` into `main`, merged the same way. The
    GitHub Release is cut by `release.yml` — `gh workflow run release.yml --ref main -f
    version=0.39.0` — which takes its notes verbatim from the changelog. `cargo publish --locked` by
    hand afterwards, always last, after both merges and the Release exist, with the registry token
    sourced from the repo-local `.env` in the same shell invocation. `develop` synced to `main`
    fast-forward only at the end. No branch is deleted.
  migrations:
  - >
    None. No table is created or altered, no index is added, no column is added, `CHECKPOINT_FORMAT`
    is unmoved, and `ADDED_SINCE_0_22_0` gains no name. A 0.39.0 store and a 0.38.0 store are the
    same store.
  - >
    No public break. Two items are added and none is removed or altered; `docs/public-api.txt` grows
    by exactly two lines. A consumer that never calls the new methods compiles and behaves
    identically.
  - >
    One thing a reader must not misread: a session gains the *ability* to fan out, not the behaviour.
    `Session::turn` spawns nothing after this release, exactly as before. The changelog says so
    beside the addition.
  observability:
  - >
    `EventKind::Spawned`, `SpawnRefused`, `Fleet` and `SpendDraw` reach a session observer for the
    first time, carrying children's own run ids at non-zero depth. No new event and no new query:
    these are the events `run_tree_observed` has emitted since 0.5.0 and 0.32.0, now reaching a
    caller that could not previously produce them.
  - >
    A contained turn's fan-out is reconstructable after the process exits through
    `Store::agent_events`, `Store::spawns` and `Store::queued_agents` on `TurnResult::run_id`, and
    its cost through `Store::run_summary` per run in the tree.
  rollback: >
    A published version cannot be recalled; the forward fix is 0.39.1 and `cargo yank --version
    0.39.0` is the escape hatch, leaving 0.38.0 as what `cargo install` resolves. Reverting is cheap:
    there is no schema change, no public API removal and no stored artefact whose shape depends on
    this release, so a consumer pinning back to 0.38.0 keeps every database, checkpoint and ledger row
    and loses only the two methods. A session recorded by a 0.39.0 build reads correctly under 0.38.0
    — a contained turn's rows are ordinary run and spawn rows.

dependencies:
  products: []
  services:
  - >
    crates.io and GitHub Actions for the release itself, as every version.
  - >
    No live provider is required. Every criterion here is deterministic against fixture providers —
    the fan-out's evidence is stored rows, outbound requests and refusals, none of which needs a
    vendor. If a live smoke run is done anyway it is through OpenRouter, the only provider with real
    credentials in this checkout, and is recorded as a smoke run rather than as a criterion.
  human_approvals:
  - >
    The owner pre-authorised the PR, both merges, the Release and the publish for this version, and
    decided the three design questions this contract records: per-call containment over session-level,
    a per-turn ledger over a session-wide one, and routing a paused turn to the existing
    `resume_tree_*` family over a new `Session::resume_turn*`.

resource_profile:
  complexity: medium
  uncertainty: medium
  likely_cost_drivers:
  - >
    The single largest driver is **not** the new capability — it is keeping two loops from becoming
    two implementations of the same rules. `run_workspace_from` (`src/run.rs:3792`) and `run_agent`
    (`src/run.rs:5276`) are already near-parallel; this release adds four session rules to the second
    one, and doing that by copying is fast, passes every test, and is the defect N4 exists to catch.
    Budget for the extraction, not just for the call.
  - >
    Threading `TurnExtras` into `run_agent` touches a function that is already recursive, boxed and
    lifetime-heavy (`Pin<Box<dyn Future + 'f>>`, `src/run.rs:5288`). Expect lifetime rounds on the
    borrow of an inbox and a seed slice that must not reach the recursion.
  - >
    `Session::drive` is the single funnel for five entry points and must stay one funnel with a
    branch, not become two. The turn row, the head move and the `Answered` event are written once,
    after whichever loop ran.
  - >
    Two public items means trap 45's three-files cost twice: the worked doctest per item, the
    hand-edited `docs/public-api.txt`, and the guide prose. No new `EventKind`, so no census entry.
  - >
    Test-fixture cost: F2, F3, F6 and F8 need a provider fixture that spawns on demand and one that
    stops on text. `examples/fleet_fixture` and the `tests/subagents.rs` and `tests/fleet.rs`
    harnesses already do most of this; reuse them rather than standing up a third shape.
  preferred_tools:
  - >
    The existing suites this release must not disturb and can borrow from: `tests/session.rs`,
    `tests/session_reply.rs`, `tests/session_steering.rs`, `tests/session_streaming.rs`,
    `tests/subagents.rs`, `tests/fleet.rs`, `tests/policy.rs` and `tests/public_api.rs`.
  - >
    `CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0` on every local build — 19 GiB to 159 MiB —
    `df -h .` before and between build steps, separate `cargo test` invocations for default and
    all-features, and `cargo build --all-features --examples` before any `--lib --tests` run or
    sabotage.
  constraints:
  - >
    No new runtime dependency; MSRV 1.95; edition 2021; every version stays 0.x.
  - >
    Two public items, no more. No field on any existing type, no new `EventKind`, no new table.
  - >
    The five existing `Session::turn*` methods and the `run_tree*` family are not edited except where
    a shared helper replaces an inlined rule, and their behaviour is identical either way.
  - >
    A child never receives the conversation, and never becomes a turn.

risks:
- >
  **The two loops drift, and nothing fails.** Copying the seed, classify and steer rules into
  `run_agent` is the fastest way to make this release work and the way that guarantees the next
  reword of a session rule applies to half the callers. The symptom is silent and arrives releases
  later — `NO_TOOL_CALL`'s own doc comment (`src/run.rs:113`) describes exactly this failure from the
  last time it nearly happened. Mitigated by N4 and its splice-in control, and by doing the
  extraction before the feature rather than after.
- >
  **A session silently gaining the ability to spawn.** The cheapest wrong implementation registers
  the tool in `drive` or in the shared prompt builder, at which point every `Session::turn` in every
  embedding application can fan out under a containment nobody passed. Mitigated structurally — the
  tool comes from `tree_tools`, which only the tree loop calls — and asserted by F1's five-way
  negative control.
- >
  **A fan-out inside a conversation multiplying context cost.** Forty children each seeded with the
  transcript is the multiplied version of the problem `ContextBudget` bounds. Mitigated by excluding
  the seed from children by design and asserting it on the outbound requests in F7.
- >
  **The turn row and a tree resume disagreeing.** A paused contained turn is continued by a resume
  the session did not drive, so the turn's stored reply and outcome describe the pause. Mitigated by
  stating it in F8, `docs/CONTRACT.md` and `known_limitations` rather than by inventing a
  session-side refresh this release did not scope.
- >
  **A queued child outliving its turn's expectations.** `max_concurrent_agents` queues rather than
  refuses and the queue is durable (0.32.0), so a turn interrupted mid-fan-out can leave rows in
  `agent_queue` for a run the operator considers finished. Mitigated by asserting the interrupt path
  at the step boundary — where no child is in flight — and by stating what a cancelled tree leaves
  behind.
- >
  **Disk, again.** `target/` has taken this volume to zero in four separate releases and
  rust-analyzer rebuilds into the same tree. Mitigated operationally: debuginfo off by default
  locally, `df -h .` before and between build steps, separate `cargo test` invocations, and
  `cargo clean` between the full suite and packaging.

open_questions:
- >
  Whether a conversation should have one spend ceiling across its turns. The per-turn ledger is this
  release's decision and it is the honest one — it matches `Containment`'s existing semantics and
  needs no new durable state — but an operator who wants "this conversation may spend 2M tokens" has
  no way to say it. A session-scoped ledger needs a restore path and a designed answer for a turn
  that starts against an exhausted ceiling.
- >
  Whether an operator's mid-turn steer should reach children in flight. Today a message lands in the
  root's observation ledger at its next step boundary, by which point the children of the step it
  spawned have already been awaited. Reaching a running child means a per-child inbox and a decision
  about whether a child may be redirected by someone it never spoke to.
- >
  Whether a child's result should be visible in the transcript as something other than the parent's
  summary of it. `Session::history` renders one entry per turn; a fan-out of forty is currently
  narrated by the parent. A nested rendering is a presentation question an embedding application may
  answer better than this crate.
- >
  Whether `Session::turn_contained` should eventually accept a plan gate that covers the fan-out —
  the plan gate exists at depth 0 in the tree loop (`src/run.rs:5295`) and a contained turn is depth
  0, so the combination works today, but nothing has designed what a plan and a conversation mean
  together.

released_at: 2026-08-06T22:45:00Z
mode: published
delivered: >
  An operator asks for something wide inside a conversation and the conversation does it.
  `Session::turn_contained` and `Session::turn_contained_observed` take a `Containment` and drive
  the turn through the agent-tree loop, so the agent answering it is offered `spawn_agent` and
  decomposes the work into contained children — under the session's own policy narrowed per child
  through `Policy::contain`, one shared `Ledger` built for that turn, and the observer the operator
  is already reading. The turn stays one turn: one `session_turns` row, one `Session::history`
  entry, one move of the head, with the children as runs under the turn's own run id.

  The five turn entry points that predate this are untouched and still never offer the spawn tool,
  so a session that passes no `Containment` behaves exactly as it did in 0.38.0. Nothing public is
  removed, renamed or altered; no table, column or index is added; `CHECKPOINT_FORMAT` is unmoved
  at 7; and `docs/public-api.txt` is byte-identical.

