product: io-harness
version: 0.6.0
status: planned
release_type: minor
outcome:
  user_can: >
    A developer runs a task whose model-produced code no longer touches the host directly: every
    execution the harness performs — the execution-based verification gate that has compiled and run
    model output since 0.2.0, and any command an agent runs as a tool — happens inside an ephemeral
    local sandbox created for that one run, given an isolated working directory seeded from the task
    workspace, run under resource caps (CPU time, wall-clock, memory, process count, file
    descriptors), with network denied by default, and then torn down so nothing it wrote or spawned
    outlives it. Output (stdout, stderr, exit status, produced files copied back under policy) is
    captured and returned exactly as the un-sandboxed path returned it, so verification still passes
    or fails on real execution.

    The sandbox is both OS-native and OS-neutral. A single `Sandbox` trait has one real native
    backend per platform — macOS via a `sandbox-exec` profile plus rlimits, Linux via user+mount+
    net+pid namespaces with seccomp and rlimits over a tmpfs, Windows via a Job Object (kill-on-close,
    memory/CPU/active-process caps) with a restricted token — over a portable floor backend
    (fresh subprocess, ephemeral tempdir workspace, resource caps, network env stripped) that compiles
    and runs on all three so isolation is never absent on any OS the crate builds for. The crate
    selects the strongest backend available at runtime and records which one ran. A caller who wants
    the exact 0.5.0 behaviour can opt the sandbox off, but sandboxed execution is the new default for
    the verification gate and the agent command tool.

    Every sandbox lifecycle event — create, the exact argv and backend used, any resource cap hit,
    a denied network attempt where the backend can observe it, and destroy — is recorded in the
    rusqlite trace alongside the existing step, refusal, and spawn records, so an operator can audit
    where each piece of code ran and why it stopped. A sandbox that fails to start, exceeds a cap, or
    is denied an action returns a typed result the agent adapts to, exactly as an out-of-policy
    action does in 0.4.0 — it never panics or takes down the run or the tree.
  business_value: >
    This is the release that makes io-harness safe to actually run untrusted, model-produced code —
    the "compiles locally, no isolation" limitation carried since 0.2.0 and made sharper by 0.5.0,
    where a parent can fan out 100+ concurrent agents each compiling and running model output
    directly on the developer's machine. 0.4.0 bounded what the agent may touch through a permission
    policy and 0.5.0 bounded what a whole tree may spend and reach, but neither stops the code the
    model writes from doing whatever a host process can once it runs. Without a sandbox, every prior
    guarantee is only as strong as the model never emitting something hostile, which is not a
    guarantee at all. Per-run isolation is the missing containment layer that turns "we bound the
    agent's intent" into "we also bound the agent's code."

    OS-native-and-neutral is the specific shape the product needs, not a nicety. io-harness is the
    shared engine every initorigin app (io-cli, io-studio) and io-eval build on, and those apps run on
    whatever machine their user has — mac, linux, or windows. A sandbox that only worked on one OS
    would push each app to build its own isolation for the others, which is exactly the
    reinvent-per-app failure the shared crate exists to prevent. One `Sandbox` trait with a native
    backend per OS and a portable floor means a task isolates the same way everywhere, and it is also
    the foundation 0.7.0's 24h+ unattended runs stand on: you cannot leave an agent running overnight
    if the code it writes executes unsandboxed on the host.
  evidence_of_value: >
    Integration tests drive a real task through the execution-based verification gate with the sandbox
    on and assert the same verified success the un-sandboxed 0.2.0 path reached, proving isolation is
    transparent to verification. A resource-cap test runs a command that would exceed the CPU-time or
    memory cap and asserts it is killed and returns a typed cap-hit result, not a hang and not a host
    OOM. A network test runs code that attempts an outbound connection and asserts it is denied under
    the default-deny policy. A teardown test asserts the sandbox working directory and any process it
    spawned are gone after the run, and that produced files were copied back under policy before
    teardown. A trace test reopens the store and asserts create/exec/cap-hit/destroy records with the
    backend name are present. A backend-selection test asserts the macOS native backend is chosen on
    this build host and the portable floor is chosen when the native backend is disabled, and the
    Linux and Windows native backends are proven to compile under their `cfg` and pass their unit
    tests on the macOS build host even though they are not live-run here. The unchanged 0.1.0–0.5.0
    suite stays green with the sandbox default on, and an example binary drives one live sandboxed run
    end to end against OpenRouter.
scope:
  included:
    - >
      `Sandbox` trait — the one execution abstraction the harness runs every external command
      through: `run(argv, workdir, caps, net) -> SandboxOutcome` capturing stdout, stderr, exit
      status, produced-file set, the backend that ran, and any cap that was hit. The verification gate
      and the agent command tool call this, never `Command` directly, so there is exactly one place
      code leaves the harness.
    - >
      macOS native backend — runs the command under `sandbox-exec` with a generated profile that
      confines filesystem writes to the ephemeral workdir and denies network, plus `setrlimit` for
      CPU time, memory, process count, and file descriptors. This is the backend live-run and
      exercised by the example, since the build host is macOS.
    - >
      Linux native backend (`cfg(target_os = "linux")`) — user + mount + pid + net namespaces via
      `unshare`, the workdir on a private tmpfs, a seccomp filter, and rlimits. Compiled and
      unit-tested on the macOS build host under its cfg; not live-run here. Named as the Linux path
      io-cli/io-studio users on Linux get.
    - >
      Windows native backend (`cfg(target_os = "windows")`) — a Job Object with kill-on-job-close and
      memory / active-process / CPU limits, a restricted token, and the workdir under a per-run temp
      directory. Compiled and unit-tested under its cfg on the macOS build host; not live-run here.
    - >
      Portable floor backend — a fresh subprocess with `current_dir` set to an ephemeral tempdir
      workspace, resource caps applied where the OS allows, and network-relevant environment stripped.
      It compiles and runs on all three OSes and is the guaranteed-present isolation floor so no OS
      ever runs code with no sandbox at all. It is deliberately the weakest backend (filesystem-scoped
      + resource-capped, not a full syscall jail) and is documented as such.
    - >
      Backend selection — at construction the crate picks the strongest backend available on the
      running OS (native if present and permitted, else the portable floor), records the choice, and
      exposes it so a caller and the trace both know which ran. Selection is a decided ladder, not a
      guess: native-for-this-OS, then portable floor.
    - >
      Per-run lifecycle — create (allocate an isolated ephemeral working directory seeded from the
      task workspace under policy), run (the command under caps + default-deny network), capture
      (stdout/stderr/exit/produced files copied back under the 0.4.0 write policy), destroy (kill any
      surviving process, remove the working directory). Teardown is guaranteed even on error, so a
      failed or killed run leaks no directory and no orphan process.
    - >
      Resource caps — a `SandboxLimits` value carrying max CPU time, max wall-clock, max memory, max
      process/thread count, and max open file descriptors, applied by whichever backend runs. A cap
      hit kills the sandboxed process and returns a typed cap-hit outcome naming which cap; it is not a
      hang and not a host-level failure. Serde-serializable like `Policy`/`Containment` so io-cli and
      io-studio load it from config.
    - >
      Default-deny network — the sandbox denies outbound network by default on every backend (namespace
      net-isolation on Linux, profile deny on macOS, environment strip + best-effort on the portable
      floor and Windows). 0.6.0 ships deny-by-default only; a configurable egress allow-list is
      explicitly 0.8.0. A denied attempt is recorded where the backend can observe it.
    - >
      Sandboxed execution as the new default exec path — the verification gate (execution-based since
      0.2.0) and the agent command tool run inside the sandbox by default. A `SandboxConfig` (or its
      absence) lets a caller opt back to direct host execution for the exact 0.5.0 behaviour, so the
      change is additive and reversible, not forced.
    - >
      Sandbox trace records — the rusqlite schema gains sandbox lifecycle events: create, the argv and
      backend that ran, resource-cap hits with the cap named, denied network attempts where observable,
      and destroy, each tied to the agent/run it belongs to. Additive only (new events/columns), so a
      0.5.0 database migrates in place and a 0.5.0 binary still reads a migrated database.
    - >
      Typed failure semantics — a sandbox that fails to start, hits a cap, or denies an action returns
      a typed `SandboxOutcome` the calling agent adapts to as its tool/verify result; it never panics,
      never aborts the run, and in a 0.5.0 tree never takes down siblings. This matches 0.4.0's
      refusal-as-result and 0.5.0's spawn-refusal-as-result.
    - >
      Composition with 0.4.0 policy and 0.5.0 containment — the sandbox workdir is seeded and its
      copy-back is filtered through the existing write policy, and in a tree every child's execution is
      sandboxed under the same rules, so isolation stacks on top of permission and containment rather
      than replacing either.
    - >
      Public crate API additions under SemVer, backward compatible with 0.5.0 — `run_with`, `resume`,
      `resume_with_decision`, `Policy`, `Approver`, `Containment` unchanged; `Sandbox`,
      `SandboxLimits`, `SandboxConfig`, and `SandboxOutcome` are new, and an existing 0.5.0 call still
      compiles and (with the sandbox default on) reaches the same verified success.
    - >
      Tests — the sandbox-transparent verification test, resource-cap-kill tests (CPU time and memory),
      the network-deny test, the teardown/no-leak test, the copy-back-under-policy test, the
      backend-selection test (native on this host, floor when native disabled), Linux and Windows
      backend compile+unit tests under cfg on the macOS host, a graph/trace assertion test for sandbox
      events, and the unchanged 0.1.0–0.5.0 suite still green with the sandbox default on.
    - >
      Updated README and crate docs covering the `Sandbox` trait, each backend and what it does and
      does not isolate, the portable floor as the guaranteed minimum, backend selection, resource
      caps, default-deny network (with the allow-list deferral to 0.8.0 stated), and a runnable
      example, packaged for 0.6.0.
    - >
      An example binary (as `examples/subagents` did for 0.5.0) driving one live sandboxed run against
      OpenRouter where model-produced code is compiled/run inside the macOS native sandbox, a cap hit
      and the network denial are shown, and teardown leaves nothing behind.
    - >
      Published to crates.io — 0.6.0 is tagged as a git Release first and then uploaded with
      `cargo publish` (registry token in env), the first release in the roadmap taken all the way to
      published rather than release-ready.
  excluded:
    - >
      Configurable network egress allow-list — 0.6.0 is deny-by-default only. Letting a run reach a
      named host or domain is 0.8.0, landing with MCP/plugins, the first callers that need egress.
      Deny-by-default now, allow-list later, is the safe order.
    - >
      Remote, VM, or microVM isolation (e.g. firecracker, gVisor, a container daemon) — the sandbox is
      in-process on the host using OS-native primitives and a portable floor, per product.yaml (local,
      single-user, embeddable library, no hosted service). Heavier isolation is out of scope by design,
      not oversight.
    - >
      Live proof of the Linux and Windows native backends on real Linux/Windows hardware or CI — the
      build host is macOS, so those backends are compile-gated and unit-tested here but not live-run.
      A cross-OS CI matrix proving all three natively is deferred; named so the gap is a decided
      deferral, not a hidden assumption.
    - >
      24h+ unattended autonomy and whole-tree crash-resume — 0.7.0. The sandbox is a per-run boundary;
      checkpoint/resume of a long-running tree is the next release and depends on this one.
    - MCP/plugins/skills and office/document/media tools — 0.8.0, and they are what motivate the egress allow-list also deferred to 0.8.0.
    - >
      Sandboxing anything other than external command execution — in-process Rust harness logic, the
      provider HTTP client, and rusqlite are the trusted harness, not sandboxed. Only model-produced
      code and agent-run commands cross the sandbox boundary.
    - >
      Per-language or per-toolchain managed sandbox images — the sandbox runs whatever command the task
      or verification specifies (cargo, a shell command) under caps; it does not ship curated language
      runtimes or a base image. That is closer to the container path deliberately not taken.
    - Any sandbox UI or interactive shell into a running sandbox — io-cli and io-studio own presentation; the crate ships the mechanism and the trace.
    - Daemon/client mode and any network API — deferred per product.yaml.
  fallback_scope:
    - >
      The `Sandbox` trait and the portable floor backend running on all three OSes (mac, linux,
      windows) — fresh subprocess, ephemeral tempdir workspace, resource caps where the OS allows,
      network env stripped — so per-run isolation is present everywhere the crate builds.
    - >
      The macOS native backend (`sandbox-exec` + rlimits) live-run and exercised by the example, since
      the build host is macOS and this is the one native path that can be proven here.
    - >
      Per-run lifecycle (create/run/capture/destroy with guaranteed teardown), resource caps with typed
      cap-hit outcomes, and default-deny network — these are the core isolation guarantee and never
      drop.
    - Sandbox lifecycle events in the rusqlite trace (create, argv+backend, cap hit, destroy).
    - Sandboxed execution as the default for the verification gate and the agent command tool, opt-out to 0.5.0 behaviour.
    - The sandbox-transparent verification test, a resource-cap-kill test, the network-deny test, and the teardown/no-leak test.
    - >
      (drop in this order if the release runs long — first the Windows native backend to a
      compile-tested stub, then the Linux native backend to a compile-tested stub, keeping the portable
      floor real on both so those OSes still isolate, just not with their strongest primitive. macOS
      native and the portable-floor-everywhere guarantee never drop, because the build host can prove
      macOS live and the floor is what makes "isolation on every OS" true at all. Publishing to
      crates.io is the last thing to drop: if it must, 0.6.0 lands release-ready like 0.1.0–0.5.0 with
      the git Release still cut and the publish held for the merge stage.)
acceptance:
  functional:
    - >-
      A task driven through the execution-based verification gate with the sandbox on reaches the same
      verified success the un-sandboxed 0.2.0 path reaches, proving isolation is transparent to
      verification — stdout, exit status, and produced files are captured identically.
    - >-
      A sandboxed command that exceeds the CPU-time cap is killed and returns a typed cap-hit outcome
      naming the CPU cap, not a hang; a second test does the same for the memory cap.
    - >-
      Sandboxed code that attempts an outbound network connection is denied under default-deny and the
      command observes the failure, proving the network boundary is enforced by the sandbox, not the
      prompt.
    - >-
      After a run (successful, failed, or cap-killed), the sandbox working directory is gone and no
      process it spawned survives — a teardown test asserts no directory and no orphan process leak,
      including on the error path.
    - >-
      Files the sandboxed command produces are copied back to the task workspace only where the 0.4.0
      write policy allows, proving sandbox capture composes with the permission layer rather than
      bypassing it.
    - >-
      On the macOS build host the native `sandbox-exec` backend is selected and recorded; when the
      native backend is disabled by config, the portable floor is selected and recorded, proving the
      selection ladder is real and observable.
    - >-
      The Linux native backend and the Windows native backend compile under their `cfg` on the macOS
      build host and pass their backend unit tests, proving the OS-neutral surface holds even though
      those backends are not live-run here.
    - >-
      A sandbox that fails to start returns a typed failure outcome the calling agent adapts to; the
      run does not panic, and in a 0.5.0 tree the failure does not take down sibling agents — proven by
      a test injecting a start failure.
    - >-
      Every sandbox lifecycle event (create, argv + backend, cap hit, denied network where observable,
      destroy) is recorded so the run's execution history is reconstructable from a reopened store
      alone.
    - >-
      A 0.5.0 caller who opts the sandbox off gets the exact 0.5.0 direct-host execution behaviour and
      the same verified success, proving the sandbox is additive and reversible.
    - >-
      In a 0.5.0 tree, each child's execution runs inside its own sandbox under the same caps and
      default-deny network, proving isolation stacks on top of containment for every agent in the tree.
  non_functional:
    - >-
      `Sandbox`, `SandboxLimits`, `SandboxConfig`, and `SandboxOutcome` are part of the documented
      public API under SemVer; existing 0.5.0 callers still compile unchanged, and no OS-specific or
      provider-specific type leaks into the trait's signature — the surface is OS-neutral.
    - >-
      Isolation is enforced by the backend (OS primitive or subprocess boundary), never by the prompt
      — a test asserts network is denied and a cap is enforced even when the model-produced code tries
      to reach the network or spin unbounded work directly.
    - >-
      Teardown is guaranteed on every exit path (success, failure, panic-in-command, cap kill) via RAII
      or an equivalent drop guard, so a leaked working directory or orphan process is impossible by
      construction, not by the happy path remembering to clean up.
    - >-
      The portable floor is documented as the weakest backend — filesystem-scoped and resource-capped,
      not a full syscall jail — so a reader is never misled into trusting it as strongly as the Linux
      namespace backend; the strength of each backend is stated explicitly.
    - >-
      Trace and sandbox records never log file contents or API keys — agent ids, argv, backend names,
      cap names, and exit statuses only, consistent with 0.4.0 and 0.5.0.
    - >-
      Sandbox creation and teardown overhead per run is bounded and does not serialize the 0.5.0
      concurrent fan-out — each agent's sandbox is independent, so 100+ concurrent sandboxed runs do
      not contend on a shared sandbox lock.
  operational:
    - >-
      `cargo test` passes, including the sandbox-transparent verification test, the CPU and memory
      cap-kill tests, the network-deny test, the teardown/no-leak test, the copy-back-under-policy
      test, the backend-selection test, the Linux/Windows backend compile+unit tests under cfg, the
      sandbox trace test, and the unchanged 0.1.0–0.5.0 suite with the sandbox default on.
    - '`cargo clippy --all-targets` reports zero warnings on the macOS build host.'
    - '`cargo publish --dry-run` succeeds with complete crate metadata for 0.6.0.'
    - >-
      README and crate docs document the `Sandbox` trait, each backend and its isolation strength, the
      portable floor as the guaranteed minimum, backend selection, resource caps, and default-deny
      network with the allow-list deferral to 0.8.0, with a runnable example.
    - >-
      An example binary drives one live sandboxed run against OpenRouter on the macOS native backend
      showing a cap hit and the network denial, with teardown leaving nothing behind.
    - >-
      0.6.0 is tagged as a git Release and then published to crates.io with `cargo publish`; the
      uploaded crate matches the release-ready artifact and the published version resolves from
      crates.io.
delivery:
  target_mode: published
  environment: >
    developer's local macOS machine for build, test, live-run, and packaging; crates.io as the
    publication target. Linux and Windows native backends are compile-gated and unit-tested on the
    macOS host, not deployed to Linux/Windows hardware in this release.
  deployment_method: >
    Built and packaged locally — `cargo test`, `cargo clippy --all-targets`, `cargo build --release`,
    and `cargo publish --dry-run` all green with complete 0.6.0 crate metadata — then a git Release is
    cut (tag + GitHub Release, per the repo's release convention) and the crate is uploaded to
    crates.io with `cargo publish` using the registry token available in the environment. Git release
    first, publish second.
  migrations:
    - >
      Extend the rusqlite trace schema with sandbox lifecycle events — create, argv + backend, resource
      cap hits, denied network attempts, and destroy — tied to the run/agent they belong to. Additive
      only (new events/columns and/or a new table), no rewrites, so a 0.5.0 database migrates in place
      and a 0.5.0 binary still reads a migrated database.
  observability:
    - Every sandbox create/destroy recorded to rusqlite and emitted via tracing — run/agent id, backend selected, and workdir lifecycle.
    - Every command executed recorded with its argv and the backend that ran it, so an operator can audit exactly where each piece of code executed.
    - Every resource-cap hit recorded with the cap that was breached (CPU time, wall-clock, memory, process count, or file descriptors) and the run it belongs to.
    - Every denied network attempt recorded where the backend can observe it.
    - The per-run execution history (which backend, which caps, what it produced, when it was torn down) is reconstructable from the store alone after the run.
  rollback: >
    Before publish, rollback is `git revert` of the 0.6.0 branch — the change lives on `feat/0.6.0`
    until the develop→main release. The rusqlite migration is additive (new events/columns only), so
    it needs no down-migration and a 0.5.0 binary still reads a migrated database. At the library
    level a caller reverts by dropping back to the 0.5.0 crate version, or by opting the sandbox off to
    get 0.5.0 direct-host execution without downgrading. Because 0.6.0 is published to crates.io, a
    post-publish fix is a forward patch release (0.6.1), never an unpublish — crates.io versions are
    immutable once uploaded, so the rollback-after-publish path is roll-forward, and `cargo yank`
    stops new resolutions of a bad 0.6.0 without breaking existing lockfiles.
dependencies:
  products: []
  services:
    - OpenRouter API (model inference for the live sandboxed example run)
    - crates.io (publication target for 0.6.0)
  human_approvals:
    - Owner confirms 0.6.0 crate version metadata before packaging.
    - >
      Owner signs off the `SandboxLimits` / `SandboxConfig` serde field names before packaging — like
      `Policy` (0.4.0) and `Containment` (0.5.0) they become a cross-repo contract io-cli and io-studio
      config depends on, and renaming one later breaks both.
    - >
      Owner approves the git Release and the crates.io publish — publishing is public and irreversible
      (a version cannot be re-uploaded), so it is a deliberate human gate, not an automated step.
resource_profile:
  complexity: large
  uncertainty: high
  likely_cost_drivers:
    - >
      Three genuinely different native isolation mechanisms behind one trait — macOS sandbox-exec
      profiles, Linux namespaces + seccomp, Windows Job Objects + restricted tokens — each with its own
      failure modes, and only the macOS one live-testable on the build host. Getting the trait boundary
      right so the two un-live-run backends still compile and unit-test honestly is the core risk.
    - >
      Guaranteed teardown on every path (success, failure, cap kill, panic) with no leaked directory or
      orphan process, across three OSes with different process-group and kill semantics.
    - >
      Resource caps that actually kill rather than hang — mapping CPU time, memory, process count, and
      fds onto rlimits (POSIX) versus Job Object limits (Windows) — and returning a typed cap-hit
      instead of a stuck run.
    - >
      Keeping sandboxed execution transparent to the 0.2.0 verification gate — same stdout/exit/
      produced-file capture — so no existing test regresses when the default exec path moves inside the
      sandbox.
    - >
      Per-run sandbox overhead not serializing 0.5.0's 100+ concurrent fan-out — each agent's sandbox
      must be independent so isolation does not reintroduce a global bottleneck.
    - >
      The additive trace migration for sandbox events that keeps 0.5.0 databases readable, and the
      copy-back path filtered through the 0.4.0 write policy.
    - Taking the crate all the way to published on crates.io for the first time — real metadata, the git-release-then-publish sequence, and the irreversibility of an upload.
  preferred_tools:
    - Rust, tokio (process spawn/await, timeouts), rusqlite, serde, tracing; existing own HTTP + SSE provider client.
    - OS primitives — macOS `sandbox-exec` + `setrlimit`; Linux `unshare`/namespaces + seccomp (e.g. via `nix`/`libc`/`seccompiler`) + rlimits + tmpfs; Windows Job Objects + restricted token (e.g. via `windows`/`winapi`).
    - cargo (build, test, clippy, publish); git + GitHub Release for the release step.
  constraints:
    - Rust crate; async on tokio; state in rusqlite; own HTTP + SSE provider client.
    - Embeddable in-process library only; no daemon/client mode; sandbox is in-process on the host.
    - OS-native-and-neutral — one trait, a native backend per OS, a portable floor that runs on all three.
    - Apache 2.0; runs locally, single-user, no hosted service.
risks:
  - >
    Three native backends, one live-testable. macOS is proven on the build host; Linux and Windows are
    compile-gated and unit-tested but not run on real hardware, so a runtime bug in those backends
    could ship undetected. Mitigation: the portable floor is real on all three OSes so isolation is
    never absent, the native backends are behind cfg with their own unit tests, and live cross-OS proof
    is an explicit deferral called out in excluded scope — not a claimed guarantee.
  - >
    A teardown that misses an edge path is a silent leak — a leftover working directory or, worse, an
    orphan process still running model-produced code after the run "ended." This is why teardown is a
    drop-guard/RAII guarantee tested on the error and cap-kill paths, not just the happy path.
  - >
    A resource cap that throttles instead of killing turns a runaway into a hang, which under 0.5.0's
    fan-out becomes a stuck tree. Caps must kill and return a typed cap-hit; the CPU and memory cap
    tests assert a kill, not a slowdown.
  - >
    Default-deny network is only as good as the weakest backend's enforcement. Linux namespaces give a
    hard net boundary; the portable floor and Windows paths are weaker (env strip + best-effort). The
    strength difference is documented per backend so a caller does not over-trust the floor, and the
    allow-list that would need real per-host control is correctly deferred to 0.8.0 rather than faked
    here.
  - >
    Moving the default exec path inside the sandbox could regress the 0.2.0 verification gate if
    capture (stdout/exit/produced files) differs even slightly. The sandbox-transparent verification
    test and the unchanged 0.1.0–0.5.0 suite run with the sandbox default on to catch this.
  - >
    Sandbox overhead reintroducing a global bottleneck under 100+ concurrent agents. Each agent's
    sandbox must be independent; a shared sandbox lock would undo 0.5.0's concurrency. A concurrency
    test asserts sandboxed fan-out stays bounded and does not serialize.
  - >
    `SandboxLimits`/`SandboxConfig` become a cross-repo serde contract the moment io-cli and io-studio
    adopt them, like `Policy` (0.4.0) and `Containment` (0.5.0) — a field renamed later is a coordinated
    break. Owner sign-off on field names before packaging is the mitigation.
  - >
    Publishing is irreversible. A bad 0.6.0 on crates.io cannot be re-uploaded; the fix is a forward
    0.6.1 and `cargo yank`. The owner-approved git-release-then-publish gate, and dry-run passing
    before the real publish, are the guard against shipping a broken crate to a public, immutable
    registry.
open_questions:
  - >
    Does the Linux native backend require the crate to run without root, using unprivileged user
    namespaces, or is it acceptable to require user-namespace support (absent on some hardened kernels)?
    Proposed: use unprivileged user namespaces where available and fall back to the portable floor with
    a recorded downgrade where they are not, so isolation degrades gracefully rather than failing.
  - >
    Is copy-back of produced files from the sandbox workspace the right model, or should the sandbox
    write directly into the task workspace through a policy-checked mount/bind? Proposed: seed-in +
    copy-back-under-policy for 0.6.0 (simplest correct isolation), with a bind-mount optimization left
    for later if overhead matters.
  - >
    Should the default resource caps be conservative (small memory/CPU) and require the caller to raise
    them, or generous enough that ordinary cargo builds pass out of the box? Proposed: caps sized so a
    normal cargo test/build passes, documented, and tightenable via `SandboxLimits`, since a default
    that fails real builds would push callers to disable the sandbox entirely.
  - >
    On Windows and the portable floor, how strong is "network denied" in practice given neither has a
    namespace-level net boundary? Proposed: document it honestly as best-effort (env strip + no
    configured proxy) on those backends versus hard denial on Linux, and treat a real per-host egress
    boundary as 0.8.0 work, not a 0.6.0 claim.
