known_limitations:
- >
  **N3 was met in a different form, and this is stated rather than glossed.** The criterion says
  `docs/public-api.txt` diffs by exactly three lines. It diffs by exactly **one** —
  `enum ToolEffect src/tools/custom.rs`. The checker enumerates the names re-exported from
  `src/lib.rs`, so `Tool::effect` is a method on an already-listed trait and
  `TaskContract::max_parallel_reads` / `with_max_parallel_reads` are members of an already-listed
  struct, and neither adds a line. The substance of N3 holds in full: three items added, none
  removed or altered, and a consumer who never calls the new method and never sets the new field
  compiles unchanged. This is the same shape as 0.39.0's deviation; plan such a criterion as "the
  lines the file can see" next time.
- >
  **`view_image` is `Mutating`, and the contract's two lists did not settle it.** It is absent from
  the three named `ReadOnly` built-ins and absent from the enumerated `Mutating` ones, while the
  scope prose anticipated carrying its media back through the fold. It was left mutating: the
  explicit read-only set names three tools, no criterion mentions media, and the choice keeps
  `PendingMedia` unshared, which the scope itself gives as the goal. The consequence is that a
  completion mixing `view_image` with reads splits into two batches at the image.
- >
  **`list_dir` is `Mutating` too**, for the same reason — it reads the workspace and changes
  nothing, and it is outside the set this release measured. Widening to it costs nothing
  structurally and was not taken without evidence.
- >
  **The fold-order guarantee is proven by F6, not by F2.** F2 proves the two caps produce identical
  stored rows, which is what an embedder cares about; it cannot discriminate a fold that used
  completion order, because synchronous file reads finish in the order they were spawned. Anyone
  strengthening this later should keep F6's uneven settle, which is what makes the two orders
  different answers.
- >
  **The record was sealed before the crates.io upload**, which follows the `develop` → `main` merge
  and the GitHub Release. `mode: published` states the authorized target; the flow makes it true.
- >
  **A record can never cite CI on the commit that contains it.** The run above is on `cdeac4e`; the
  commit carrying this record has its own run, and that ordering is stated in the merge and the
  final report rather than amended in here — the 0.29.0 and 0.38.0 precedent.
- >
  **MCP tools stay `Mutating` and the open question is unanswered.** Whether `McpSession` can
  multiplex concurrent requests over one stdio transport, and whether servers in the wild tolerate
  it, is recorded for the release that widens the read-only set rather than guessed at here.
- >
  **Concurrency across steps or completions is untouched**, as is `max_concurrent_agents`. The unit
  is one completion's tool calls.

