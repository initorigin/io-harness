product: io-harness
version: 0.61.0
status: planned
release_type: minor
outcome:
  user_can: >
    A developer who registers a custom tool under a name the harness already answers is told so before
    the provider is called once, instead of watching their tool validate cleanly and then never run.


    **Eighteen names dispatch answers today and `RESERVED_TOOL_NAMES` does not hold them**
    (`src/tools/custom.rs:516-552`): `forget`, `check`, `patch_file`, `git_branch`, `git_worktree`,
    the five `lsp_*`, the six `browser_*`, `send_message` and `read_messages`. Counted against every
    `const *_TOOL: &str` in the crate, the arithmetic is exact — 53 built-in names exist, the reserved
    slice names 35. `Toolbox::validate` (`src/tools/custom.rs:447-482`) accepts a registered tool
    taking any of the eighteen, and the run then answers the model's call with the built-in, so the
    caller's tool is unreachable for the life of the process and nothing says so. The set exists to
    prevent exactly that; `src/tools/custom.rs:501-511` records the gap as open.


    **The roadmap entry's mechanism is right for sixteen of the eighteen and wrong for two, and the
    correction is in `roadmap.yaml`.** Sixteen are matched by a `dispatch` arm that precedes `name if
    custom.owns(name)` (`src/run.rs:13256`): `FORGET_TOOL` at 10825, `PATCH_FILE_TOOL` at 11568,
    `CHECK_TOOL` at 11672, the three-way and two single `lsp_*` arms at 11754/11767/11791,
    `is_browser_tool` at 11806 under `#[cfg(feature = "browser")]`, and `GIT_BRANCH_TOOL` /
    `GIT_WORKTREE_TOOL` inside the seven-name git arm at 12984-12985. `send_message` and
    `read_messages` are **not** dispatch arms: the tree loop intercepts them at `src/run.rs:7702`,
    before `dispatch` is called at all, and a flat run is not offered them — so a registered tool
    called `send_message` works today in a flat run and is shadowed in a tree. That is the
    `SPAWN_TOOL` situation exactly, which the const's own doc comment already carves out
    (`src/tools/custom.rs:513-515`) and which 0.17.0 settled by reserving the name in every run
    shape. The same answer applies here, and the release says so rather than implying all eighteen
    share one mechanism.


    **The six `browser_*` names are absent for a mechanical reason the entry does not state, and it
    decides the fix.** The consts themselves are `#[cfg(feature = "browser")]`
    (`src/tools/mod.rs:117-132`), so an unconditional slice literal in a default build cannot name
    them — the list was not merely un-updated, it was un-updatable in that shape. 0.17.0 met this
    exact wall and answered it by ungating the names while leaving the tools gated
    (`src/tools/mod.rs:244-259`: "This name and the document names below exist in **every** build,
    though the tools behind them do not… A name the harness owns is owned in all builds, so enabling
    a feature can never take a working tool away"). The six browser names are ungated here on that
    precedent, and the reserved set's own doc comment — which claims the feature-gated built-ins it
    names are reserved in every build — becomes true of every feature-gated built-in rather than of
    the ones that happened to be ungated.


    **This is the second time this crate has shipped this gap, and the shape of 0.17.0's fix is why.**
    0.17.0 closed it under `### Breaking changes` by hand-patching the list; every built-in added
    since reopened it by one name — the worktree tool (0.36.0), `patch_file` and `check` (0.51.0),
    LSP navigation (0.52.0), the browser (0.53.0), `forget` (0.56.0), the mailbox (0.60.0). A list
    patched by hand goes stale once per feature; the class closes only when adding a built-in without
    reserving its name fails a test.
  business_value: >
    The failure this closes is the worst kind a library can hand a caller: silent, permanent, and
    indistinguishable from the model choosing not to call the tool. An embedder who registers
    `check` gets a clean `validate`, a catalogue their model can see, and a tool that never once
    executes — the harness answers every call to that name with its own built-in. There is no error,
    no event and no log line to grep. The crate's stated position on exactly this
    (`src/tools/custom.rs:443-446`) is that a naming mistake must be "the difference between 'your
    config is wrong' and 'your agent silently stopped being able to write files'", and for eighteen
    names it currently is not.


    The compounding half is the invariant. This crate adds built-in tools most releases — six of the
    last ten did — and under a hand-maintained list every one of them reopens the defect by one name
    at the moment it ships, to be found by the next audit rather than by CI. After this release the
    author of the next built-in cannot merge it unreserved.
  evidence_of_value: >
    The functional criteria are the evidence: after this release each of the eighteen names is
    refused by `Toolbox::validate` with an `Error::Config` naming it, in a default build and in an
    all-features build alike, and the source-derived invariant test fails when any built-in name is
    dispatched or intercepted without appearing in the reserved set.


    The negative evidence matters as much. `the_0_16_2_reserved_set_accepted_git_status`
    (`tests/custom_tools.rs:358`) is 0.17.0's own negative control and stays green untouched; a
    control over names the harness does **not** own — a registered `browse`, `checker`, `lsp` or
    `my_tool` — must still validate, which is what says the set grew by exactly the names dispatch
    answers and not by a prefix rule that quietly forbids a caller's whole namespace.
scope:
  included:
  - >
    **The six `browser_*` name consts lose their `#[cfg(feature = "browser")]`**
    (`src/tools/mod.rs:117-132`), on the precedent `VIEW_IMAGE_TOOL` and the nine document names set
    in 0.17.0. The tools stay gated: the dispatch arm at `src/run.rs:11805-11806`, the spec builders
    in `src/tools/browser.rs` and everything behind them are untouched. Only the names become
    unconditional, which is what lets one slice literal own them in every build. The rustdoc on the
    six says so in the terms `VIEW_IMAGE_TOOL` already uses.
  - >
    **`RESERVED_TOOL_NAMES` becomes the whole set — 53 names.** It stays a `const … : &[&str] = &[…];`
    slice literal built from the name constants, because `tests/docs_drift.rs:1218-1231` parses that
    exact shape and panics by name if it stops being one. The eighteen are added in the order the
    existing entries follow.
  - >
    **The doc comment on the set stops describing an open defect and states the invariant.**
    `src/tools/custom.rs:485-515` currently carries "The set is not complete, and the 0.17.0 defect is
    open again for the names it omits" plus the eighteen. That paragraph is replaced by the rule the
    test enforces, the `SPAWN_TOOL` / mailbox carve-out is restated to cover all three intercepted
    names, and the claim that feature-gated built-ins are reserved in every build stays — now true
    without exception.
  - >
    **The invariant: one test that derives the built-in set from the source and fails when the
    reserved slice does not hold it.** Placed in `tests/custom_tools.rs` beside the existing shadowing
    tests, reading `src/` the way `tests/docs_drift.rs` already does. It resolves every `const
    *_TOOL: &str = "…"` in the crate, subtracts the names that are deliberately not reserved, and
    asserts the remainder is exactly what `RESERVED_TOOL_NAMES` holds — in both directions, so a name
    reserved that no longer exists fails too. It carries a floor assertion and a parse control: a
    regex that resolves nothing must fail loudly rather than pass vacuously, which is the 0.60.2
    windowing lesson applied before it is paid for again.
  - >
    **Per-family name slices where a dispatch arm already reads a list, and nowhere else.**
    `is_browser_tool` (`src/tools/browser.rs:426`) already exists so "the run loop and the tests read
    one list rather than two"; the reserved set reads that same list rather than restating six names.
    The five `lsp_*` names get the same treatment if and only if it removes a restatement — arms whose
    bodies are per-name work (`WRITE_FILE_TOOL`, `EXEC_TOOL`, each git command) are left exactly as
    they are. Collapsing arms that do different work behind a shared list would be a refactor this
    release did not ask for.
  - >
    **The documentation that currently describes the gap.** `docs/guide/tools-and-skills.md:79-87`
    says the set "does **not** yet hold every name dispatch answers: the `browser_*` and `lsp_*` tools
    are among eighteen…" — that paragraph goes, and the page keeps deferring to `RESERVED_TOOL_NAMES`
    rather than restating it, which `the_guide_reserved_name_claim_matches_the_source`
    (`tests/docs_drift.rs:1304`) enforces. `docs/CONTRACT.md:2653-2660` gains the 0.61.0 sentence
    beside 0.17.0's. `docs/CHANGELOG.md` names the behaviour change under the heading
    `docs/CHANGELOG_STRUCTURE.md` gives that class. `docs/CAPABILITIES.md` gains its 0.61.0 row.
  excluded:
  - >
    **Wrapping the three uncontained spawn sites** (`src/tools/diagnostics.rs:271`, `src/lsp.rs:321`,
    `src/browser.rs:856`), recorded by 0.60.2 as the same "a fix written as a list rather than an
    invariant reopens once per feature" shape. Real, and `src/` behaviour of a different kind; it is
    not a naming defect and does not belong in this release.
  - >
    **Any change to what a built-in does, what it is called, or which build compiles it.** No tool is
    renamed, no tool becomes unconditional, no catalogue changes. A model's offered tool list is
    byte-identical before and after for every configuration.
  - >
    **A public `is_reserved`/`reserved_names` accessor.** Tempting, because a caller who wanted to
    check a name before registering would use it. `RESERVED_TOOL_NAMES` stays `pub(crate)`; the
    typed `Error::Config` from `validate` already answers the question, and a public list is a public
    surface this release would have to keep forever.
  - >
    **An `mcp__`-style prefix rule for built-ins.** Reserving `browser_*` as a pattern would forbid a
    caller's `browser_history` — a name the harness does not own and has no claim on. The set names
    what dispatch answers, exactly.
  fallback_scope:
  - >
    The eighteen names added to `RESERVED_TOOL_NAMES`, with the six browser consts ungated so they can
    be named, and the parameterised refusal test over all eighteen. This alone closes the live defect
    for every name that exists today and is a coherent release.
  - >
    The source-derived invariant test is what stops it reopening, and is the reason this is not a
    patch-shaped list edit. It is dropped only if the derivation proves unable to distinguish a
    dispatched name from a name that merely exists — and if it is dropped, the release says so in the
    record and the class stays open, rather than a weaker test being presented as the invariant.
acceptance:
  functional:
  - >
    **F1 — every one of the eighteen is refused, by name, before the provider is called.** A test in
    `tests/custom_tools.rs` parameterised over all eighteen names registers a `Fixed` tool under each
    and asserts the run fails with `Error::Config` whose message contains that name, following the
    shape of `a_registered_tool_may_not_shadow_a_builtin` (`tests/custom_tools.rs:247-277`) and its
    0.17.0 sibling over `NAMES_0_16_2_MISSED` (286-341). It must fail on today's tree for all
    eighteen. Sabotage: remove any single name from `RESERVED_TOOL_NAMES`; F1 fails for that name and
    F2 fails, and no other test does.
  - >
    **F2 — the invariant: a built-in name that is not reserved fails the build's tests.** One test
    derives the built-in name set from `src/` — every `const *_TOOL: &str = "…"`, with the names that
    are deliberately excluded listed explicitly and each carrying its reason in a comment — and
    asserts set equality with the names `RESERVED_TOOL_NAMES` resolves to. Both directions: a
    dispatched name missing from the set fails, and a reserved name whose const no longer exists
    fails. Sabotage A: add a `const FAKE_TOOL: &str = "fake_tool";` to `src/tools/mod.rs` without
    reserving it — F2 fails and nothing else does. Sabotage B: delete a name from the reserved slice —
    F2 and F1 fail together.
  - >
    **F3 — the derivation cannot pass vacuously.** F2's parse asserts a floor (at least fifty names
    resolved from `src/`, at least fifty in the reserved set) and panics with a named message if
    either regex matches nothing, mirroring `reserved_tool_names`'s own
    `"RESERVED_TOOL_NAMES is no longer a slice literal"` panic (`tests/docs_drift.rs:1223`) and
    `the_guide_reserved_name_claim_matches_the_source`'s `reserved.len() >= 30` floor
    (`tests/docs_drift.rs:1307`). A separate unit assertion runs the resolver over a fixture string
    with CRLF line endings and asserts it resolves the same names, because a windowing checker that
    silently falls back is the defect 0.60.2 paid for.
  - >
    **F4 — the six browser names are reserved in a build that does not compile the browser.** The
    default feature set has no `browser`, so F1's browser rows already assert this — but only if the
    test is not itself gated. F4 is the explicit claim: `tests/custom_tools.rs` carries no `#[cfg(
    feature = "browser")]` on the browser rows, and the same six are refused under
    `--all-features` too. This is the property 0.17.0 named as the whole reason for ungating a name:
    "enabling a feature can never take away a tool that was working."
  - >
    **F5 — a name the harness does not own still validates.** A control registering `browse`,
    `checker`, `lsp`, `git`, `browser` and `my_tool` builds a `Toolbox` that passes `validate` and
    reaches the provider. Without it, "reserve everything that looks built-in" passes F1 and F2 and is
    wrong. `the_0_16_2_reserved_set_accepted_git_status` (`tests/custom_tools.rs:358`) stays green
    unedited as 0.17.0's own control.
  - >
    **F6 — the two intercepted names are refused for the same reason and by the same path.**
    `send_message` and `read_messages` are refused by `validate` in a **flat** run, where they are not
    offered and where a registered tool of that name works today. That is a behaviour change beyond
    "already broken, now loud", and the test states it: a flat run registering `send_message` fails
    with `Error::Config`, and the record names the precedent — `SPAWN_TOOL` has been reserved in every
    run shape since 0.17.0 for the identical reason.
  - >
    **F7 — the guide's claim matches the source again.**
    `the_guide_reserved_name_claim_matches_the_source` and its four fixture siblings
    (`tests/docs_drift.rs:1304-1380`) stay green, and the page no longer carries the sentence naming
    the eighteen-name gap. Sabotage: leave the stale paragraph in place and assert the docs gate
    catches it — if it does not, the gate reads the bullet and not the paragraph, which is a finding
    about the gate and is recorded as one.
  - >
    **F8 — every existing docs and API gate stays green, re-run after the version bump.**
    `tests/docs_drift.rs`, `tests/guide_pages.rs`, `tests/readme.rs`, `tests/public_api.rs`,
    `tests/cross_version.rs` and the changelog suite. Two have cost a CI round before and are checked
    **after** `Cargo.toml` reaches 0.61.0, never before: `readme_dependency_version_matches_cargo_toml`
    compares the README pin at major.minor, so `io-harness = "0.60"` must become `"0.61"`; and
    `the_capabilities_release_table_covers_every_released_version` needs the `docs/CAPABILITIES.md`
    row that can only be added once 0.61.0 is a released version.
  non_functional:
  - >
    **N1 — `docs/public-api.txt` does not move, and the reason is a known gap rather than a claim of
    safety.** That snapshot enumerates items re-exported from `src/lib.rs` (`tests/public_api.rs`),
    and the browser name consts are reached as `tools::BROWSER_*` rather than re-exported at the root,
    so ungating them adds nothing to the file. The addition is real all the same: `tools::
    BROWSER_NAVIGATE_TOOL` and its five siblings become nameable in a default build. This is the A6
    gap 0.60.3 recorded — the snapshot tracks re-exported names and not the module's own surface —
    hit a second time, and it is recorded as a `known_limitation` with the diff as its evidence, not
    hidden behind a green snapshot test.
  - >
    **N2 — no new dependency.** `cargo tree | wc -l` stays 402, the number every release since 0.50.0
    has reported.
  - >
    **N3 — no schema, no checkpoint format, no configuration key.** `CHECKPOINT_FORMAT` stays 7, no
    DDL, `tests/cross_version.rs` needs no `ADDED_SINCE_0_22_0` entry.
  - >
    **N4 — the model's offered catalogue is byte-identical.** No tool is added to or removed from any
    build's catalogue, so 0.38.0's cacheable system prefix is unmoved for every configuration. The
    prompt baselines in `tests/prompt.rs` stay green untouched, which is the evidence.
  - >
    **N5 — the version moves in exactly two files plus the README pin.** `Cargo.toml`, `Cargo.lock`,
    and `README.md`'s dependency snippet at major.minor (see F8).
  operational:
  - >
    **O1 — the suite is run and its numbers recorded against 0.60.3's.** 0.60.3 measured 89 binaries /
    1,874 passed / 0 failed / 6 ignored on the default features. This release adds tests and no
    behaviour path, so the binary count is expected unchanged and the test count up by the F1 rows;
    both numbers are recorded whatever they are.
  - >
    **O2 — the nightly rustdoc gate is run locally before the PR.** `RUSTDOCFLAGS` with
    `rustdoc::private_intra_doc_links` and the broken-link lints, on the installed nightly. It has
    caught something in eight of the last eleven releases, and this release edits rustdoc on seven
    constants and one const's doc block — links from a `pub` const to a `pub(crate)` item are exactly
    the class it catches, and `RESERVED_TOOL_NAMES` is `pub(crate)`.
  - >
    **O3 — the sabotage pass runs before the record is sealed**, one arm per functional criterion,
    each invoked so that the intended test binary actually runs. `cargo test --test custom_tools
    <filter>` and `cargo test --lib <filter>` are separate invocations: passing one filter to both
    binaries is what let 0.60.3 record a survival for a test that ran zero times. An arm that fails
    nothing is a finding about the test, not a superfluous guard.
  - >
    **O4 — CI is the authority.** The feature PR runs 19 checks and the release PR 35, across three
    platforms and both feature sets. A red job is classified by reading which **step** failed before
    any log is read; a failure in a file this release does not touch is checked against `git diff
    <green-commit> HEAD -- src/ tests/` being empty before it is rerun.
  - >
    **O5 — `df -h .` before any full build.** `target/` has stood at 26 G against 29 G free; disk is
    checked and `target/debug/deps`, `build` and `incremental` cleared before a full run, and
    `CARGO_PROFILE_DEV_DEBUG=0` is set.
delivery:
  target_mode: published
  environment: >
    crates.io for the crate, GitHub for the Release, docs.rs for the rendered rustdoc. No service, no
    deployment target, no migration — the artifact is a library.
  deployment_method: >
    One feature branch `feat/0.61.0` off develop, one PR into develop, merged with the PR button. The
    UltraShip record is sealed, the lock pinned and `ultraship validate` run to exit 0 **on that same
    feature branch, in that same PR**, before the merge — not on a later `chore/*-record` branch.
    `git diff --quiet feat/0.61.0 develop` is run immediately before the release PR, because a
    Dependabot merge landing on develop mid-release has happened twice. develop then merges to main by
    PR, and the tag `v0.61.0` is pushed on its own — pushing the tag is what cuts the GitHub Release,
    and creating the Release by hand ships it with no assets. `cargo publish` is run manually, last,
    after the Release exists, with the registry token sourced from the repo-local `.env`.
  migrations:
  - >
    **A program that registers a tool under one of the eighteen names stops compiling nothing and
    starts failing at run start.** It compiles exactly as before; the first run returns
    `Error::Config` naming the tool. For sixteen of the eighteen that program was already broken —
    the tool validated and never ran — and this makes it loud. For `send_message` and `read_messages`
    in a **flat** run it is a working configuration that now errors, which is why the release is a
    minor and why the CHANGELOG names those two separately. The remedy is one rename, and the error
    message states it.
  - >
    No schema, no checkpoint format, no configuration key, no public item removed. `tools::BROWSER_*`
    becomes nameable in builds without the `browser` feature; nothing that compiled stops compiling.
  observability:
  - >
    None added. The refusal is the existing `Error::Config` from `Toolbox::validate`, raised before the
    first completion, and it already names the offending tool and the whole reserved set.
  rollback: >
    Fixed forward as 0.61.1 rather than rolled back. `cargo yank` removes a version from resolution for
    new dependents and does not delete it. The GitHub Release and tag can be deleted; the crates.io
    publish cannot.
dependencies:
  products: []
  services:
  - crates.io, for the publish
  - GitHub Actions, for CI on the three platforms and for the Release the tag cuts
  - docs.rs, for the rendered rustdoc
  human_approvals:
  - >
    None beyond the owner's standing authorisation to run the flow end to end. The behaviour change is
    named in the record and in the CHANGELOG; it does not gate the merge.
resource_profile:
  complexity: small
  uncertainty: low
  likely_cost_drivers:
  - >
    **Deriving "every built-in name" from the source without hand-listing it again.** The whole point
    of the release is that a hand-maintained list goes stale, so the invariant test must not be one.
    The exclusion list it does carry — names that exist and are deliberately not reserved, if any —
    is the part to get right: every entry needs a reason in a comment, and an entry added later to
    silence a failure is the defect reopening in a new place.
  - >
    **`src/run.rs` is 16,811 lines** and the dispatch match spans 10,572-13,270. Confirming which
    names the arms actually answer — rather than which the roadmap says — is reading, and it already
    produced two corrections at planning time.
  - >
    **The full suite on a contended machine**, plus an `--all-features` run that must include the
    browser rows. The all-features suite goes to the PR matrix rather than being run locally where
    disk allows.
  preferred_tools:
  - '`tests/custom_tools.rs` as the pattern every new assertion follows — it already owns this class'
  - '`tests/docs_drift.rs:1207-1254` as the working example of resolving name constants out of `src/`'
  - Grep over `src/run.rs` for the dispatch arms and over `src/tools/mod.rs` for `const .*_TOOL`
  constraints:
  - >
    `RESERVED_TOOL_NAMES` stays a slice literal of name constants and stays `pub(crate)`.
    `tests/docs_drift.rs` panics by name if the first changes; the second is a public surface this
    release has no reason to add.
  - >
    No dispatch arm's behaviour changes. This release adds names to a set and adds tests. If closing
    the invariant appears to require restructuring dispatch, that is a finding for 0.63.0's facade,
    not an edit here.
  - >
    Nothing in this release may assert a duration or a timing.
risks:
- >
  **The invariant test's derivation is the release.** A regex over `src/` that resolves the wrong set
  — too few names, or names that are not tools — either passes vacuously or fails on something
  legitimate. F3 is written against exactly this: a floor, a named panic when the parse resolves
  nothing, and a CRLF fixture. The precedent is `tests/docs_drift.rs`, which has run this way since
  0.60.2, and the failure mode is the one 0.60.2 paid for — a checker that finds nothing and silently
  widens to the whole file, then passes for the wrong reason.
- >
  **Ungating six consts is a public-surface change no gate in this repository can see.**
  `docs/public-api.txt` tracks `lib.rs` re-exports only. It is recorded as a known limitation with the
  diff as evidence, exactly as 0.60.3 recorded A6, rather than being reported as "the snapshot did not
  move".
- >
  **`send_message` and `read_messages` break a configuration that works today** in a flat run. Named
  in `migrations`, in F6 and in the CHANGELOG, with the `SPAWN_TOOL` precedent stated. The alternative
  — reserving sixteen and leaving two — would make the set's rule "names dispatch answers, except when
  the interception happens in the tree loop", which is the kind of exception that reopens a class.
- >
  **A minor is treated as a routine list edit.** It publishes to crates.io irreversibly and it changes
  what `Toolbox::validate` accepts. The full suite, all three platforms, the nightly rustdoc gate and
  the sabotage pass run exactly as they do for a release that ships a feature.
open_questions:
- >
  **Whether the five `lsp_*` names get a shared slice like `is_browser_tool`'s.** The browser arm
  already reads one list, so the reserved set reading the same list removes a restatement at no cost.
  The LSP names are spread across three arms with different bodies (11754, 11767, 11791), so a shared
  slice there may add a layer rather than remove one. Decide by writing it: if the diff does not
  delete a restatement, do not make it.
- >
  **The exclusion list has exactly one entry, and it is a trap the naming regex walks into.**
  `const [A-Z0-9_]+_TOOL: &str = "…"` over `src/` resolves **54** constants; 53 are tool names and the
  fifty-fourth is `AT_BEFORE_TOOL` (`src/hooks.rs:61`, value `"before_tool"`) — a hook stage, not a
  tool, caught only because its identifier happens to end in `_TOOL`. `MCP_TOOL_PREFIX` and
  `NO_TOOL_CALL` do not match the shape and need no exclusion. So the invariant test carries one
  exclusion with its reason in a comment, and the open question is narrower than it looks: whether a
  future constant of that shape should be excluded by an allow-list entry or by tightening the regex
  to constants declared in the tool modules. Decide in implementation; an exclusion added later to
  silence a failure is the defect reopening in a new place, and the record names any entry added.
- >
  **Whether `READ_SKILL_TOOL`'s guarded arm (`read_skill` is dispatched only `if !skills.is_empty()`,
  `src/run.rs:12675`) means a registered `read_skill` runs in a run with no skills.** It is already
  reserved, so `validate` refuses it either way and no caller can reach the case — but the asymmetry
  is worth confirming in implementation, because it is the same "an arm that is sometimes absent"
  shape the eighteen came from.
