known_limitations:
- >
  **This record is sealed before the crates.io upload.** The authorized mode is `published` and the
  flow makes it true: `feat/0.31.0` into `develop`, `develop` into `main`, the GitHub Release cut by
  `release.yml`, then `cargo publish --locked` by hand, last. The record states the target; it does
  not claim the upload has already happened.
- >
  **The gates ran before this record was written, and O1 and O2 cannot run locally at all.** The
  three-OS matrix including the MSRV 1.95 job, and the docs.rs nightly build, execute on the pushed
  commit. Nothing written after the gates is compiled, linted or packaged: `.ultraship` is in
  `Cargo.toml`'s `exclude` list, so the sealed evidence is still true of the shipped tree. Stated
  rather than implied, and the record is not amended afterwards — an immutable record that gets
  edited makes `immutable: true` a wish.
- >
  **F9's boundary is 0.29.0 to 0.31.0, not 0.30.0 to 0.31.0.** The criterion named a 0.30.0 binary;
  the pinned generator already in the tree is 0.29.0, which lacks everything a 0.30.0 one lacks and
  more — 0.30.0's two `memory` columns and its `memory_recalls` table as well as this release's
  `plans` table. The claim executed is therefore strictly stronger than the one written, proven by
  the technique the criterion named, and it costs no second pinned crate to build and keep in sync.
  Recorded as a deviation rather than read as satisfied verbatim.
- >
  **The plan gate binds the agent, not the caller.** The `plan-gate` policy layer holds for the run's
  own loop. The embedding program holding the `Store` and the workspace is not the run and is
  refused nothing — the same distinction 0.30.0 drew for a pinned memory entry, and stated in
  `docs/CONTRACT.md` beside it.
- >
  **A read-shaped tool that quietly writes is outside every boundary this crate has.** The phase is
  an `Act::Write`/`Act::Exec` denial, and a registered `Tool` is checked as an exec — but the crate
  cannot see inside a caller's `invoke`. This is true in the phase and out of it; it is written down
  here because the phase's promise makes it easy to over-read.
- >
  **Reasoning text is live-only.** `EventKind::Reasoning` is the only place it appears. It is not
  written to the trace, so a run whose `Observer` was not attached can see what the thinking *cost*
  through `Usage::reasoning_tokens` and never what it *said*. Persisting it would grow the trace by
  the most verbose thing a model produces, for a value nobody has asked for.
- >
  **OpenAI returns no reasoning text.** `Effort` on `OpenAi` changes how the model behaves and leaves
  `CompletionResponse::reasoning` at `None`, because the Chat Completions API this crate speaks does
  not return it. Not a defect here, not worked around, and stated as a row in the contract's
  per-vendor table rather than discovered.
- >
  **`Compatible`'s effort key is unverified.** `reasoning_effort` is passed through to whatever
  endpoint the caller pointed at. An endpoint that does not know it may ignore it or reject the
  request; the crate does not check, in keeping with everything else on that provider.
- >
  **Anthropic's thinking budgets are three fixed numbers** — 1,024 / 4,096 / 16,384 — and
  `max_tokens` becomes `8192 + budget`. A caller who needs a specific budget rather than a tier
  cannot express one. That is the cost of a vendor-neutral knob, and it is the same trade
  `CompletionRequest::model` makes.
- >
  **Two processes resuming one run after a single approval are not guarded.** `Store::decide_plan`
  refuses a *second verdict* with `Error::Resume`, so a race to approve is caught. A race to resume
  is not, and never has been for any resume in this crate; `Store::check_resumable` is the only lock
  there is.
- >
  **Four public breaks.** `CompletionRequest` gains `effort`, `CompletionResponse` gains `reasoning`,
  `RunOutcome` gains two variants, and `EventKind` gains three (free, since it has been
  `#[non_exhaustive]` since 0.24.0). Each is in the changelog with a migration. A caller who followed
  the documented `..Default::default()` construction is unaffected; one who wrote an exhaustive
  struct literal or an exhaustive `match` on `RunOutcome` pays. This is the same cost 0.21.0 and
  0.22.0 charged for the same two provider types.
- >
  **The three open questions, answered by the implementation.** `Revise` *appends* rather than
  restarting the phase — the ledger keeps everything the agent already read, and re-reading the
  workspace to satisfy a tidier model would spend a run's budget on nothing. A second plan after an
  approval is *not* offered: the tool is withdrawn, because a second gate mid-run is a second way for
  an unattended run to stop. `Effort` is a **closed** enum: the three tiers are the vendors' shared
  vocabulary, and a fourth would be a vendor detail the projection absorbs rather than a tier a
  caller names.
- >
  **Inherited from 0.30.0 and still open:** the N2 wording there ("the aggregates do not scale with
  the trace") over-claims, and is stated honestly in `docs/CONTRACT.md`. This release does not
  re-claim it and does not touch those accessors.
