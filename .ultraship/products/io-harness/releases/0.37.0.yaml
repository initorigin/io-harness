known_limitations:
- >
  **This record was sealed before the crates.io upload.** The publish follows the develop-to-main
  merge and the GitHub Release, by hand, and is always last.
- >
  **The system-prompt wording was never put in front of a live vendor.** The contract's
  `resource_profile` expected "live runs against at least two vendors before the wording settles",
  and its risk register named that as the mitigation for the one genuinely uncertain part of this
  release. It did not happen: every arm of every criterion is driven by a scripted provider. What is
  proven is that the wording reaches the first completion and only the first, that a scripted
  completion which stops on text closes as a reply and one carrying a call promotes — that is, the
  machinery. What is **not** proven is how often a real model answers in prose where it should have
  acted. That is the release's accepted asymmetry and its size is unmeasured. It is stated in
  `docs/CONTRACT.md` under the same heading, so a reader meets it where they look for limits, and it
  is the first thing a 0.37.1 should measure.
- >
  **`EventKind::Answered` carries `turn_id` only, not `{ turn_id, run_id }` as the contract's prose
  named.** Stated rather than glossed: the kind is flattened into the event envelope, so a `run_id`
  field is a duplicate serde key and the variant would not round-trip — the same constraint
  `EventKind::Rewound` records in its own doc comment, and `every_variant_round_trips` is what would
  have caught it. Which run served the turn is the envelope's own `run_id`, where every other variant
  reads it from, so the criterion's substance — an attached process can tell an answer from a run,
  and knows which run, without reading the store — holds in full.
- >
  **F1's "snapshot row count is zero" is read through `rewind_run`, not off the `snapshots` table.**
  The store exposes no public listing of snapshots (`snapshot_paths` is `pub(crate)`), so rather
  than widen the public API for a test, the assertion is behavioural: a rewind of the reply's run
  puts **0** files back, and a rewind of the control arm — which writes a file — puts **1** back. The
  same fact, stated as a behaviour, with the control that makes the zero mean something.
- >
  **`cargo tree` was counted on macOS only.** The contract asked for macOS and Linux. The Linux legs
  of CI build and test the crate but do not count the tree, and no dependency edge in this release is
  platform-conditional — nothing was added at all. The number is 402 on this machine and the claim
  for Linux rests on the manifest being unchanged rather than on a second count.
- >
  **`Store::check_resumable` now refuses one run it did not refuse before**, and that is wider than
  "a reply". A session turn typed as a classifying turn and left `running` is refused whatever it
  *would* have become — including one killed after its first completion reached for a tool but
  before the row was corrected to `run`. That window is one completion long and holds no committed
  step, so the refusal costs a re-ask rather than work; but it is a behaviour change to a public
  method for a class of run slightly larger than the one the criterion named.
- >
  **A run that answers is still a `runs` row.** "How many runs did this session do" is answerable
  only by reading `turn_kind`, which is `pub(crate)`. That was deliberate — the fact reaches a caller
  as `TurnResult::kind`, and a second public reader is a second thing to keep true — but it means a
  reader with only a `Store` and a run id cannot ask the question. Recorded because the contract's
  own `business_value` names that query as one of the costs of the old behaviour.
- >
  **`turn_kind` is not read on any resume path except `check_resumable`.** A reply cannot be resumed,
  so nothing else needed it; if a later release makes a promoted turn distinguishable in the trace
  (an open question below), that is where it will be read.
- >
  **A pre-existing test flaked once on the release branch and is recorded rather than waved
  through.** `worktree::two_concurrent_children_with_their_own_worktrees_do_not_collide` — a
  0.36.0 test, untouched by this release — failed once on `test (macos-latest, default)` in run
  31064349963, finding **one** worktree where it expects two. That run's source is byte-identical
  to run 31063716477, where the same job passed: the only diff between the two commits is nine
  files under `.ultraship/`. It passed on re-run of the same job, and 8 of 8 locally (3 full
  `--test worktree` runs plus 5 of the single test). So it is a flake and not a regression, and it
  is not this release's. What it most likely indicates is real and belongs to 0.36.0's feature:
  two children running `git worktree add` concurrently in one repository contend for the index
  lock, and the loser's spawn fails rather than sharing the parent tree — which is the behaviour
  0.36.0 chose, seen from the outside as a missing worktree. Nobody has confirmed that cause. It
  is written here so the next person who sees it starts from evidence rather than from scratch.
- >
  Every `known_limitations` entry in `docs/CONTRACT.md` that predates this release was left standing.
  None was deleted on the strength of a release having probably fixed it.

