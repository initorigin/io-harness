product: io-harness
version: 0.37.0
status: released
release_type: minor

outcome:
  user_can: >
    Hold a conversation in which not every turn is work.

    `Session::turn` is the crate's conversational entry point and it has exactly one shape: build a
    `TaskContract`, open a run, drive the loop. `src/session.rs:474` writes the run row and the turn
    row *before the first completion is billed*, and `src/run.rs` then plans, offers the toolbox,
    checks the boundary, checkpoints each step and closes with an outcome. That is the right
    machinery for "migrate the forty handlers" and it is the whole machinery for "hi". An operator
    who says hello gets a run in their trace, a plan gate they may have to answer, a checkpoint on
    disk and a row in the ledger that says work happened. Nothing did.

    0.37.0 makes the turn's own first completion decide what the turn was. The completion is made
    the way it is made today — the workspace tools offered, the session's history seeded, the
    operator's text as the goal — and what comes back is read rather than assumed. A completion
    that stops on text is an answer: the turn closes as `TurnKind::Reply`, with no step, no gate, no
    checkpoint, no snapshot, no plan gate and no approver call. A completion carrying a tool call is
    work: the turn promotes to `TurnKind::Run` and the loop continues **from that same completion**,
    so the run's first step is the call that was already paid for and nothing is asked twice.

    The classification is therefore free, and it is the model's. There is no list of greetings in
    this crate and none is needed in the program embedding it — which is the point, because a list
    is a list in one language, matches `hi` and not `namaste`, and answers `hi, the login page is
    broken` correctly only by accident.

    What a reply remains: billed, drawn against the session's ledger, recorded with the usage of the
    call it made, present in the conversation the next turn reads, and reachable by `branch_from`
    like any other turn. What it stops being is a run that reports having done something.

  business_value: >
    The crate's conversational surface currently charges the price of unattended work for every
    sentence typed at it. That price is not only tokens: it is a plan gate an operator has to
    dismiss, a checkpoint on disk, a `runs` row that makes "how many runs did this session do"
    unanswerable, and — under a strict policy — an approval prompt raised because a diligent model
    reached for `read_file` to answer a question about itself.

    The first program built on this crate hit it immediately and fixed it in the only place it
    could: io-cli carries a twenty-two-entry list of English greetings, matched after stripping
    punctuation, and short-circuits before the engine is told. That fix is correct and it is a
    ceiling. It works in one language, in one of the crate's several entry points, and only for the
    program that wrote it — `io run "hi"`, any other client of the engine, and any other embedder of
    this crate all still open a run. A capability that every consumer has to re-implement, and can
    only re-implement badly, is a gap in the library rather than a gap in the application.

    The deeper reason to fix it here is that the crate has no cheap path at all. A `Session` turn is
    a run because that is the only thing the crate can do with a sentence, so an embedder wanting a
    conversational reply has to fabricate one outside the harness entirely — which is exactly what
    io-cli does: it hardcodes the reply text in TypeScript and never asks the model. The product's
    own claim is an embeddable agent runtime; a runtime that cannot answer a question without
    staging a production is not one, and every application built on it will keep growing the same
    workaround.

    The cost of getting it wrong is asymmetric and the asymmetry now falls on the model rather than
    on a lookup table: answering something that was meant as work costs the operator one retype;
    running something that was meant as a greeting plans it, checkpoints it, gates it and bills it.
    A model reading the sentence has strictly more to go on than a list of twenty-two strings.

  evidence_of_value: >
    Executed, in the technique the last seven releases used: a pair that must differ, a negative
    control that must not, one sabotage per arm of every two-armed claim, and a sabotage that fails
    nothing reported as a finding rather than propped up.

    The classification claim is proven by the pair. One scripted provider returns text and stops;
    the other returns a tool call on the same input in the same session. The discriminating
    assertions are the rows: zero `steps`, zero gate attempts, zero checkpoints and zero snapshots
    for the first, and a normal run for the second. An implementation that classified correctly and
    still opened the loop passes "the reply is right" and fails this.

    The free claim is proven by counting provider calls, which is the assertion that kills the
    obvious wrong implementation. Classify-with-a-cheap-call-then-re-ask produces the same
    `TurnKind` for every input in this suite and costs two completions where one was needed; the
    criterion counts calls, so it fails. The promoted arm is counted too: a two-step run makes two
    completions, not three, because the classifying completion **is** step one.

    The honesty claim is proven on the ledger rather than on the absence of rows. A reply is a
    provider call that cost money, so `run_summary` reports its tokens and the ledger records the
    draw; a "reply" that recorded nothing would satisfy every assertion about what is absent and is
    the failure this criterion exists to catch.

    The boundary claim is proven with an approver that panics if it is called at all and a policy
    whose defaults would ask about everything. A reply that reached the approver, selected a
    sandbox, or held a plan gate fails by panicking rather than by a soft assertion.

    And the criterion claim is proven in the direction that matters: a caller who declared a
    `Verification` is never handed an answer instead of a gate, even when the model stops on text.

scope:
  included:
  - >
    **The turn's first completion decides the turn.** `Session::drive` (`src/session.rs:474`) reads
    the first completion of the run it starts. Stopped on text with no tool call → the turn closes
    as a reply. Carrying a tool call → the loop proceeds unchanged, with that completion as step
    one. **Only the first completion of a turn can be a reply**: a later completion that stops on
    text is the loop finishing a run, which is what it has always been, and is untouched.
  - >
    **A completion carrying both text and a tool call is work.** A single completion may hold prose
    and a call together; the call decides. Stated here rather than discovered, because the opposite
    reading — prose present, therefore an answer — would swallow the work silently.
  - >
    `TurnKind` — a new public `#[non_exhaustive]` enum, `Reply` and `Run`, on `TurnResult`. This is
    what an embedder branches on instead of inferring from a step count, and it is what lets io-cli
    delete its greeting list rather than move it.
  - >
    **The one break: `TurnResult` gains `#[non_exhaustive]` and the `kind` field.** Paid for the
    reason 0.34.0, 0.35.0 and 0.36.0 paid it on `Verification`, `TaskContract` and `AgentDef` — both
    are the same break for an external struct literal or an exhaustive destructuring, and paying it
    once makes every later `TurnResult` field free. `TurnResult` is constructed only by this crate,
    so no call site inside it changes and no signature moves.
  - >
    **`run_id` stays non-optional and a reply still writes a run row**, typed as a reply. This is
    deliberate and it is the honesty half: the completion happened and was billed, so
    `Store::run_summary`, the per-call accounting rows, cost reconstruction and every existing
    reader keep working with no nullable id introduced anywhere. What the row records is that the
    turn was answered — not that a run finished work.
  - >
    **What a reply does not write**, asserted rather than described: no `steps` row, no gate
    attempt, no checkpoint, no file or memory snapshot, no spawn row, and no `pending_approvals`
    row. The plan-gate policy layer is never installed and no sandbox is selected.
  - >
    **What a reply does write**: the turn row and the run row as above, the per-call usage for the
    one completion, and the ledger draw for its tokens. A reply is bounded by the token ceiling like
    everything else and cannot be stopped by a step or wall-clock cap it never reaches.
  - >
    **A contract that carries a criterion is always work.** `turn_bounded` and
    `turn_bounded_observed` with a `Verification` never classify: a caller who declared how the turn
    is judged has said it is work, and handing back an answer instead of running the gate would be
    answering a different question. A bounded contract with no verification classifies like `turn`.
  - >
    **`run_with` and `run_with_observed` are untouched.** A `TaskContract` handed to the one-shot
    entry point is work by construction — that is what the entry point is for — and no classification
    is added to it. The change is confined to the five session entry points.
  - >
    **The system prompt for a turn's first completion permits answering.** Today's prompt tells the
    agent it is executing a task, which is why a diligent model reaches for a tool to answer a
    question about itself. This is a real behaviour change for every session turn and not only for
    greetings, and it is named here rather than left as an implementation detail.
  - >
    `EventKind::Answered { turn_id, run_id }` — free, `EventKind` has been `#[non_exhaustive]` since
    0.24.0 — emitted when a turn closes as a reply, so an attached process, a hook and the io-cli
    transcript can tell an answer from a run without reading the store. With its `EVENT_NAMES` entry
    and its round trip through `every_kind()` and the source-reading census.
  - >
    One additive column on `runs` naming what the turn was, fed to `tests/cross_version.rs`'s
    `ADDED_SINCE_0_22_0` by name. `CHECKPOINT_FORMAT` stays at its current value — no checkpoint
    layout changes, and bumping it would make `check_resumable` refuse every 0.36.x store over a
    column an older binary never reads.
  - >
    Documentation as part of the release: `docs/guide/sessions.md` gains the classification and its
    limits, `docs/CONTRACT.md` gains the exact bound (N5 below), plus `README.md`, `CHANGELOG.md`
    with the `*Migration:*` note the one break owes, `docs/public-api.txt` edited by hand, and a
    worked example on every added public item. **No new guide page and therefore no
    `GUIDES`/`CAPABILITIES.md` bookkeeping** — sessions already have a page, which is the 0.31.0 and
    0.36.0 precedent.
  excluded:
  - >
    A `Session::reply()` that forces an answer without asking the model. Considered and declined:
    it moves the decision back to the caller, which is where it is today and where it can only be a
    word list. Recorded in `open_questions` rather than dropped, because an embedder wanting a
    canned help response is a real want with a different answer.
  - >
    Any list of greetings, keywords, intents or phrases anywhere in this crate. If the classification
    needs a lookup table to work, it does not work — the table is the thing this release exists to
    delete, not to relocate.
  - >
    A second, cheaper model for classification. It would cost a call the design does not need, add a
    provider decision to a path that has none, and make the answer disagree with the model that
    would have written it.
  - >
    Classification for `run_with`. An unattended contract is work by declaration; a one-shot entry
    point that sometimes answers instead of running is a worse contract than one that always runs.
  - >
    Making a reply resumable. There is nothing to resume: a reply is one completion, and a process
    that dies during it loses one completion, which re-asking replaces at the same price. What is in
    scope is ensuring a dead reply is not *offered* as resumable work (F6).
  - >
    Changing what a later text-only completion means. A run whose fifth step stops on text is a run
    that finished, exactly as in 0.36.1. Only the first completion of a turn is read as a
    classification, and the loop's ending is not touched.
  - >
    Streaming a promotion as a distinct event. `EventKind::Token` deltas arrive during the first
    completion exactly as they do today; a consumer learns the turn's kind when the turn closes or
    when the first tool call reaches the observer. Inventing a third state for the window in between
    is a UI decision, and the UI can already see both edges.
  fallback_scope:
  - >
    The classification on `turn` and `turn_observed` only, with `turn_bounded` and
    `turn_bounded_observed` always opening a run regardless of their contract. `TurnKind`, the free
    classification, the absent gate/checkpoint/plan-gate/approver, the billing honesty and the
    event all ship. What drops is the bounded path and with it the criterion interaction — the half
    that has to reason about a caller-supplied contract. The roadmap's headline ("a conversation
    answers without opening a run") still holds in full, since the two unbounded entry points are
    the ones a conversation is held through.

acceptance:
  functional:
  - >
    **F1 — a turn that needs no tool leaves no work behind, and the control does.** One session, one
    input, two scripted providers. Arm A returns a completion that stops on text; arm B returns a
    completion carrying a `read_file` call and then finishes. Assertions for A: `TurnKind::Reply`,
    `TurnResult.reply` is the model's text, and for that run the `steps`, gate-attempt, checkpoint
    and snapshot row counts are each **zero**. Assertions for B: `TurnKind::Run`, `steps` greater
    than zero, and an ordinary outcome. **The control is arm B** — every assertion about absence is
    worth nothing unless the same assertions hold in the positive on the same fixture, so B is run
    and its counts recorded.
  - >
    **F2 — exactly one completion, either way.** The scripted provider counts calls. A turn that
    replies makes **one**. A turn that promotes and takes two steps makes **two**, not three,
    because the classifying completion is step one. The sabotage is the implementation this
    criterion exists to forbid: classify with a call, discard it, re-ask — which produces identical
    `TurnKind` values throughout the suite and must fail this named test on the count alone.
  - >
    **F3 — a reply is billed, and says so.** After F1's arm A: `Store::run_summary` reports the
    completion's tokens, the per-call accounting row exists with its model and its latency, and the
    session's ledger records the draw. The discriminating assertion is the ledger: a reply
    implemented by short-circuiting before the accounting passes every assertion in F1 and makes the
    crate's own cost reconstruction wrong. The control is a ledger with a token ceiling below the
    reply's cost, under which the reply is refused rather than served free.
  - >
    **F4 — a reply is part of the conversation.** Turn 1 replies; turn 2 is taken in the same
    session. Assertions: `history()` lists both turns, turn 2's seeded observations contain turn 1's
    prompt **and** its answer (the assembler's `[earlier turn] you answered:` entry), and
    `branch_from` on turn 1 succeeds and produces a turn whose parent is turn 1. The sabotage omits
    the reply from `finish_turn`, which passes F1 and F3 and fails here.
  - >
    **F5 — a declared criterion is never answered instead of run.** `turn_bounded` with
    `Verification::Command` and a scripted provider that stops on text on the first completion.
    Assertion: `TurnKind::Run`, the gate ran, and its attempt is recorded as `Passed`, `Failed` or
    `Errored` per 0.34.0. The control is the identical contract with no verification, which
    classifies as a reply.
  - >
    **F6 — a reply that died is not offered as resumable work.** A turn killed mid-completion.
    Assertions: `check_resumable` does not offer that run as work to continue, no half-written step
    is adopted, and taking the turn again is a new turn rather than a resume. A run row typed as a
    reply and left `running` by a kill is the shape this criterion pins down.
  - >
    **F7 — the boundary machinery is never reached by a reply.** F1's arm A is re-run with an
    `Approver` that panics on any call and a `Policy` whose defaults make every act ask. Assertions:
    the approver is not called, the `plan-gate` layer is absent from the turn's effective policy, no
    sandbox is selected, and no `pending_approvals` row is written. Panicking rather than asserting
    is deliberate — a soft assertion on a call that should never happen is a test that passes when
    the call is made once and swallowed.
  - >
    **F8 — cross-version, both directions, with the guard fed by name.** One additive column is
    added; `ADDED_SINCE_0_22_0` gains exactly that name and `tests/cross_version.rs` passes. A
    database written by the pinned 0.29.0 generator opens, resumes and replays under 0.37.0, and a
    0.37.0 store is read by that binary. `CHECKPOINT_FORMAT` is asserted unmoved rather than assumed.
  non_functional:
  - >
    **N1 — no new dependency.** `cargo tree` on macOS and Linux still reads **402** lines.
    Classification reads a completion the crate already has in hand.
  - >
    **N2 — the break is exactly one, and it is stated as loudly as it is small.** `TurnResult` gains
    `#[non_exhaustive]` and `kind`. An external struct literal or exhaustive destructuring stops
    compiling; every method returning a `TurnResult` keeps its signature, and `TurnResult` is
    constructed only inside this crate. `CompletionRequest`/`CompletionResponse` are not touched, so
    no `E0639` is owed. `tests/changelog.rs` finds the `*Migration:*` note under the one `**BREAKING`
    entry and `tests/public_api.rs` passes against a hand-edited `docs/public-api.txt`.
  - >
    **N3 — the one-shot path pays nothing.** `run_with` and `run_with_observed` reach no
    classification code, asserted by a source-reading test in the shape 0.33.0, 0.35.0 and 0.36.0
    used, with a splice-in control that makes it fail when such a call is added. A turn that promotes
    executes the same loop as 0.36.1 from step one onward, asserted by the step-row shape rather than
    by inspection.
  - >
    **N4 — every added public item carries a worked example**, enforced by the existing
    `every_public_item_has_a_worked_example` gate: `TurnKind`, `TurnResult::kind`, and
    `EventKind::Answered`.
  - >
    **N5 — the honest limits are where a reader finds them.** `docs/CONTRACT.md` states: only the
    first completion of a turn can be a reply; a model that answers in prose where it should have
    acted costs the operator one retype, which is the asymmetry this design accepts by choice; a
    completion carrying both prose and a tool call is work; a reply is billed and is not resumable;
    a contract carrying a criterion is never a reply; `run_with` never classifies; and the system
    prompt for a turn's first completion changed, which affects every session turn rather than only
    greetings.
  - >
    **N6 — a query whose cost grows with the trace is asserted by plan, not by clock.** Any read
    added on the turn-close path is `EXPLAIN QUERY PLAN`-asserted to use its index, with a control
    column in no index at all — trap 38's rule, not a column that happens not to be a left prefix —
    and the measured number is recorded. No wall-clock assertion is written.
  operational:
  - >
    **O1 — the three-OS matrix is green** on the commit being released, including the MSRV 1.95 job,
    with no test skipped silently on Windows. Any source-reading test normalises line endings, and
    no path is joined from a slash-bearing literal.
  - >
    **O2 — docs.rs builds**, proven by running the nightly job's exact command
    (`RUSTDOCFLAGS="--cfg docsrs -D warnings" cargo +nightly doc --all-features --no-deps`) before
    the release PR is opened, never inferred from a stable `cargo doc`. It has caught something in
    four of the last five releases.
  - >
    **O3 — `cargo package --locked` succeeds** on a clean tree and the packaged crate compiles, run
    after a `cargo clean`. Every local build and test runs with `CARGO_PROFILE_DEV_DEBUG=0
    CARGO_PROFILE_TEST_DEBUG=0`, with `df -h .` before and between build steps.

delivery:
  target_mode: published
  environment: >
    crates.io as `io-harness` 0.37.0, GitHub at initorigin/io-harness with the tag `v0.37.0` and a
    Release titled `io-harness 0.37.0`, and docs.rs.
  deployment_method: >
    The standing flow. All work on `feat/0.37.0` off `develop`, committed incrementally as it lands,
    including the sealed UltraShip release record and the hand-appended lock pin. PR into `develop`,
    merged with the PR button. Release PR `develop` into `main`, merged the same way. The GitHub
    Release is cut by `release.yml` — `gh workflow run release.yml --ref main -f version=0.37.0` —
    which takes its notes verbatim from the changelog. `cargo publish --locked` by hand afterwards,
    always last, after both merges and the Release exist. `develop` synced to `main` fast-forward
    only at the end. No branch is deleted.
  migrations:
  - >
    One additive column on `runs` naming what a turn was. No existing table is altered otherwise, no
    table is added, `CHECKPOINT_FORMAT` is unmoved, and the new name is added to
    `tests/cross_version.rs`'s `ADDED_SINCE_0_22_0`.
  - >
    One public break: `TurnResult` becomes `#[non_exhaustive]` and gains `kind`. No item is removed
    and no signature changes.
  - >
    A behaviour change that is not a compile break and must be read as one: a session turn whose
    model stops on text now closes without running the loop. An embedder that inferred "a turn
    happened, therefore work was attempted" from the existence of a `TurnResult` is reading
    something that was never guaranteed and now differs; `TurnKind` is the field that answers it.
  observability:
  - >
    `EventKind::Answered { turn_id, run_id }` reaches every `Observer`, and therefore every attached
    process through 0.33.0's `Broadcast`, with no change to `attach`.
  - >
    A reply's run row and its usage are readable through `Store::run_summary` and the per-call
    accounting exactly as a run's are, so "what did this session cost" needs no new query and gets
    no wrong answer.
  - >
    The absence of a step, a gate attempt and a checkpoint for a reply is itself the observable
    signal that no work was staged, and F1 asserts it rather than describing it.
  rollback: >
    A published version cannot be recalled; the forward fix is 0.37.1 and `cargo yank --version
    0.37.0` is the escape hatch, leaving 0.36.1 as what `cargo install` resolves. A consumer
    reverting to 0.36.1 keeps every database — the added column is additive and a 0.36.1 binary
    never names it — and loses `TurnKind` and the classification, so every turn opens a run again,
    which is 0.36.1's behaviour by definition. The one break reverses by deleting a field
    initialiser. No run, turn, checkpoint or ledger row written by 0.37.0 has to be rewritten to go
    back.

dependencies:
  products: []
  services:
  - >
    crates.io and GitHub Actions for the release itself, as every version.
  human_approvals:
  - >
    The owner has pre-authorised the PR, both merges, the Release and the publish for this version.
    Nothing here needs a second decision.

resource_profile:
  complexity: medium
  uncertainty: medium
  likely_cost_drivers:
  - >
    The change lands where `src/session.rs:474` meets `src/run.rs`, and `src/run.rs` is over 10,500
    lines. `drive` currently hands everything to `run_with_extras` and reads the store afterwards
    (`turn_for_run`, `last_message`, `run_summary`, `finish_turn`); classifying means the loop has to
    report what its first completion was without the session re-deriving it from rows — the same
    "built from the returned value, not from a second query" rule 0.32.0 and 0.36.0 paid for.
  - >
    The system-prompt change is the genuinely uncertain part. Permitting an answer without weakening
    the instruction to *do the work* is a wording problem with no compile-time check, and it affects
    every session turn rather than only the greetings. Expect live runs against at least two vendors
    before the wording settles, and expect the first attempt to over-answer.
  - >
    Five negative controls designed before the code, not after: F1's tool-calling arm, F2's
    re-ask sabotage, F3's ceiling arm, F5's no-verification arm, and F7's panicking approver.
  - >
    Three new public items across two surfaces means `docs/public-api.txt` by hand, a worked example
    each, and — for the new event — the `EVENT_NAMES` entry, `every_kind()` and the source-reading
    census in `src/observe.rs`. Trap 62's three files per item.
  preferred_tools:
  - >
    The existing scripted provider, extended to count calls, since F2 is a counting assertion. The
    existing crash fixture pattern for F6's kill. `CARGO_PROFILE_DEV_DEBUG=0
    CARGO_PROFILE_TEST_DEBUG=0` on every local build — 19 GiB to 159 MiB — `df -h .` before and
    between build steps, and `cargo build --all-features --examples` before any `--lib --tests` run
    or sabotage.
  constraints:
  - >
    No new runtime dependency; MSRV 1.95; edition 2021; every version stays 0.x and a break is a
    minor bump.
  - >
    No word list, in any form, anywhere in this crate. A constant, a regex, a match arm over
    literals or a shipped data file each defeat the release's own argument.
  - >
    A reply is billed. Any implementation that serves an answer without recording its usage makes
    the crate's cost reconstruction wrong, which is a `success_measure` in `product.yaml`.

risks:
- >
  **The two-call implementation.** The cheapest way to classify is a separate small completion, and
  it is wrong twice: it doubles the cost of every turn and it lets the classifier disagree with the
  model that would have answered. Mitigated by F2 counting provider calls in both arms, with the
  re-ask as a named sabotage — it is the one failure that produces perfectly correct `TurnKind`
  values throughout.
- >
  **A model that answers when it should have acted.** "I'll fix that for you" as prose, with no tool
  call, closes the turn as a reply and does nothing. This is the accepted cost of the design and its
  size depends entirely on the prompt wording. Mitigated by making it a retype rather than a
  silence — the turn's reply is on screen — by stating it in `docs/CONTRACT.md` under N5, and by
  live runs against two vendors before the wording is fixed. It is the reason `uncertainty` is
  medium rather than low.
- >
  **The prompt change leaking into work turns.** Permitting an answer is a change to the first
  completion of *every* session turn, so a prompt that over-permits makes real tasks stop at a plan
  in prose. Mitigated by scripted-provider criteria that pin the promoted arm's behaviour exactly
  (F1 arm B, F5), and by treating the wording as development work with live evidence rather than as
  a one-line edit.
- >
  **A reply that is quietly free.** Short-circuiting before the accounting is the obvious
  implementation of "no run happened" and it makes the ledger disagree with the invoice. Mitigated
  by F3 asserting the ledger draw and the per-call row, and by the ceiling arm, under which a reply
  must be refused rather than served.
- >
  **A half-run left by a killed reply.** The run row is written before the completion returns, so a
  kill mid-answer leaves a row whose kind is not yet known. Mitigated by F6 asserting
  `check_resumable` does not offer it as work — and it is the reason the run row is kept rather than
  deferred, since deferring it would leave a turn with no run id at all and force a nullable
  identifier through every downstream reader.
- >
  **Disk, again.** `target/` has taken this volume to zero in four separate releases and
  rust-analyzer rebuilds into the same tree. Mitigated operationally: debuginfo off by default
  locally, `df -h .` before and between build steps, separate `cargo test` invocations, and
  `cargo clean` between the full suite and packaging.

open_questions:
- >
  Whether an embedder should be able to force an answer without asking the model — the
  `Session::reply()` shape considered and excluded above. A program wanting a canned help response
  has a real want, but it is a want for a string it already has rather than for a call to a
  provider. Left until someone asks for it with a case a plain `println!` does not cover.
- >
  Whether `TurnKind` should eventually carry why a turn was classified as it was, rather than only
  what it was. A reason is what a UI would show beside an answer the operator thinks is wrong. A
  bool-shaped enum is what the behaviour needs; the reason can be added without a break once the
  enum is `#[non_exhaustive]`.
- >
  Whether a promoted turn should be distinguishable, in the trace, from a turn that was work from
  the first token. They are the same run and the distinction may be worth nothing — but if the
  prompt-wording risk above turns out to bite, the count of promotions is the measurement that would
  show it.

released_at: 2026-08-06T00:00:00Z
mode: published
delivered: >
  An embedder holds a conversation in which not every turn is work. "hi", "thanks" and "what can you
  do" cost one completion each and leave behind no step, no gate attempt, no checkpoint, no
  snapshot, no plan gate and no call to the approver — while the same entry point, given the same
  words followed by work, runs the full loop exactly as 0.36.1 did, from step one onward.

  The decision is the model's and it costs nothing extra. The turn's first completion is made with
  the workspace tools offered, the conversation seeded and the operator's text as the goal, and what
  the model does with it decides what the turn was: stopping on text is an answer, reaching for a
  tool promotes the turn and the loop continues from that same completion. A turn that answers makes
  one provider call; a turn that promotes and takes two steps makes two, not three.

  There is no word list in this crate, in any form. io-cli's twenty-two-entry table of English
  greetings — the workaround that motivated the release — can be deleted rather than relocated,
  because `TurnResult::kind` is the fact an embedder branches on.

