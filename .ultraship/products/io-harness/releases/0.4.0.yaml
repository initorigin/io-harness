product: io-harness
version: 0.4.0
status: released
release_type: minor
outcome:
  user_can: 'A developer runs io-harness on sensitive work under an explicit permission policy handed
    in at run construction. Deny-by-default path rules decide which files the agent may read and which
    it may write; a command policy decides which binaries the verification layer may execute. An action
    outside the policy is refused and recorded — the run continues or stops, but the action never happens.
    An action the policy marks sensitive stops for a human first, two ways the developer chooses between:
    an `Approver` the caller supplies and the loop awaits in-process, or a persisted pause — the run returns
    `AwaitingApproval`, the pending action survives a process restart in rusqlite, and `resume_with_decision`
    continues it once a human decides. Every refusal and every approve/deny is readable in the trace afterwards.
    The 0.1.0–0.3.0 loop, budgets, retry, multi-file workspace, provider choice, and execution-based verification
    are unchanged and still pass.

    '
  business_value: 'Turns io-harness from a harness you supervise into one you can point at work that matters.
    Today the only boundary is the workspace root and the model''s own good behaviour; nothing stops a
    plausible-looking edit to the wrong file and nothing pauses before an irreversible one. Policy plus
    approval is what io-cli needs to run outside a scratch fixture and what io-studio needs to put a confirm
    dialog in front of a user. The persisted pause is also the mechanism 0.5.0''s unattended 24h+ runs
    depend on — a run that cannot outlive the process that started it cannot wait for a human overnight.
    It is also the last shared thing both apps would otherwise build twice: io-cli and io-studio each
    keep their own config file but compose it over a shared base through the crate''s own merge, so a
    rule written once behaves identically in both and a user moving between terminal and GUI meets one
    boundary, not two that drifted apart. Composition rather than copying is what keeps them from drifting
    — two synchronised files diverge the moment one is edited.

    '
  evidence_of_value: 'Integration tests drive one workspace task under a restrictive policy and show the
    agent''s out-of-policy write refused while the in-policy edits still reach a verified success; a second
    test drives a task where a sensitive action is approved through an `Approver` and a third where it
    is denied, with opposite run outcomes. A fourth persists an `AwaitingApproval` pause, drops the in-memory
    run, reopens the store, and resumes to success via `resume_with_decision`. The trace is asserted to
    contain each refusal and each decision.

    '
scope:
  included:
  - Policy type — a `Policy` value constructed by the caller and passed at run construction, deny-by-default,
    carrying path rules, command rules, and which action classes are sensitive
  - Path read/write allow-deny — glob allow and deny lists governing `read_file`, `write_file`, `grep`,
    and `find`, evaluated per path with deny winning over allow
  - Enforcement in the tool layer, not the prompt — `tools::workspace` and `tools::fs` consult the policy
    before touching the filesystem, so a model that ignores its instructions still cannot act outside
    policy
  - Command execution policy — an allowed-binary list gating what `verify` may spawn (`rustc` and the
    compiled test binary today, per src/verify.rs); anything not listed is refused, and no arbitrary shell
    is introduced
  - Binary-name gating only, deliberately — every argv element in src/verify.rs:141-174 is harness-constructed
    (literal flags plus tempdir paths) and no model or caller output reaches argv, so argument-level rules
    would guard a path that does not exist. The full argv is recorded in the trace. Known ceiling — when
    0.6.0 plugins/MCP let a caller supply argv, the command policy must gate arguments too, because `rustc
    -o <path>` is a write past the path policy by another route.
  - Refused actions count against the step budget — the model call that produced the refused action already
    happened and its tokens were spent, so the budget must reflect it; this also bounds a model that retries
    a denied action, since `max_steps` stops the run and the trace shows the repeated refusals
  - Tiered defaults for a constructed policy, following Claude Code's read-only / file-modification /
    command tiers — reads (`read_file`, `grep`, `find`) inside the allow list need no approval; every
    write needs approval, including an overwrite of an in-allow-list file; command execution needs approval
    outside the harness's own verification spawns. A caller overrides any tier; these are what applies
    to tiers left unset.
  - Secret-path denies shipped in the default policy — `.env`, `*.pem`, `id_rsa`, `*.key` are denied on
    read even though reads are otherwise the permissive tier, following OpenCode's `.env` default. A read
    allow list alone does not protect secrets that live inside the workspace.
  - One `Approver` trait, three decisions — `Approve`, `Deny(reason)`, and `Defer`. The loop awaits the
    trait in-process, and the caller may hold that future open indefinitely; `Defer` is the escape hatch
    for when the process cannot stay alive that long. This follows the Agent SDK, where `canUseTool` may
    stay pending indefinitely and `defer` exists for decisions outliving the process — one surface, not
    two mechanisms.
  - Approve-with-changes — `Approve` may carry a modified action, so an approver can sanitise or redirect
    what runs (rewrite a path into a scratch directory, narrow a command) rather than facing a bare allow-or-refuse,
    matching the SDK's `updatedInput`
  - The modified action is re-evaluated against the policy before it runs, and a deny still refuses it.
    An approver may narrow or redirect within the policy; it cannot rewrite an action across a deny, because
    an approver that could would make deny-is-absolute untrue and turn approve-with-changes into the bypass
    for the whole boundary.
  - Approve-and-remember — `Approve` may carry rules to remember, applied as a run-scoped top layer of
    the merge stack so matching later actions stop prompting, matching Claude Code's `updatedPermissions`
    and OpenCode's `always`. Remembering is a new layer rather than a mutation of the policy, so deny-is-absolute
    holds unchanged and a remembered allow cannot defeat a base deny.
  - Remembered rules are returned on `RunResult` for the caller to persist if it chooses. The crate does
    not write config files — file locations are app-owned — so io-cli and io-studio decide whether an
    `always` outlives the run, exactly as the SDK hands back suggestions for the app to write.
  - '`Decision::Defer` stops the run with `RunOutcome::AwaitingApproval { request_id }` and writes the
    pending action to rusqlite, so it survives the process ending'
  - '`resume_with_decision(contract, provider, store, run_id, request_id, decision)` — continues a deferred
    run under its original id once a human approves or denies, reusing the 0.2.0 resume path'
  - Built-in approvers — `DenyAll`, `ApproveAll`, and a stdin/terminal prompt, so io-cli wires a prompt
    without writing one
  - Refusal never consults the approver — an out-of-policy action is refused outright and the `Approver`
    is not called, matching the SDK's evaluation order where deny rules block before the callback is reached.
    Only the sensitive-but-permitted tier prompts.
  - Path rules gate agent-invoked tools only — the harness's own I/O (rusqlite store, trace writes, verification
    tempdirs, config reads) is not path-gated, matching both harnesses, where every rule is keyed on a
    tool call and neither gates the tool's own internals. Verification is constrained by the command policy
    instead.
  - Serde representation of `Policy` — `Serialize` + `Deserialize`, so io-cli loads a policy from its
    config file and io-studio from its saved settings without either writing its own parser. A Rust-builder-only
    `Policy` would force both apps to hand-roll config-to-policy translation, which is the duplication
    this release exists to prevent.
  - Layered composition — `Policy::merge(base, overlay)` composes an ordered stack of policies into one
    effective policy, so each app keeps its own config file and both can additionally read a shared base.
    This is the sharing mechanism; file-copy synchronisation is not, because two copies drift the moment
    one is edited.
  - Merge precedence, following Claude Code's settings precedence — denies union across layers and are
    absolute, so an overlay can never re-allow what a lower layer denied; allows union, so an overlay
    can grant capability the base did not; sensitive-tier classifications tighten only. A layer can narrow
    the effective policy or add allowances, but cannot defeat a deny beneath it.
  - '`Policy::explain(path)` — returns the decision for a path plus the rule and layer that produced it,
    without performing any action. This is the enforcement check with its result exposed rather than consumed.
    The decision type already has to carry rule and layer because the trace records them, so exposing
    it as a query is reuse, not new machinery, and it means a user can answer why a path is refused without
    provoking a refusal.'
  - A documented recommended layering convention in the README — a user-level shared base, then a project-level
    shared layer, then the app's own overlay. The crate does not enforce or discover it; the convention
    exists so io-cli and io-studio do not each invent an incompatible stack, which is the only way a shared
    base fails in practice.
  - '`Approver` is object-safe and `Send + Sync`, so io-studio can hold a boxed channel-backed impl behind
    a GUI while io-cli uses the stdin built-in — the same trait serves an interactive terminal and an
    event-driven UI.'
  - Refusal semantics — a refused action returns a typed refusal to the agent as a tool result (so the
    model can adapt), it does not panic or abort the run; a denied sensitive action stops the run with
    its own outcome
  - Trace — every refusal (action, path/command, the rule that refused it, and which layer that rule came
    from) and every decision (approve/deny, which approver or which persisted request) recorded in rusqlite
    alongside the existing step trace
  - The trace records the requested action and the performed action separately whenever approve-with-changes
    altered it, and marks any action auto-approved by a remembered rule as such rather than as a fresh
    approval — an audit that cannot distinguish what was asked from what ran, or one human decision from
    the twenty it silenced, is not an audit
  - Public crate API additions under SemVer, backward compatible with 0.3.0 callers — an existing `run(&contract,
    &provider, &store)` call still compiles and behaves as today under a documented permissive default
    policy
  - Tests — policy unit tests (glob precedence, deny-over-allow, escape attempts), approve/deny integration
    tests, a persisted pause/restart/resume test, and the 0.3.0 suite unchanged and still green
  - Updated README and crate docs covering policy construction, layering and the recommended convention,
    `explain`, the approval decisions, and the permissive default, packaged for 0.4.0
  excluded:
  - Network egress policy — deferred to 0.6.0, where MCP servers and plugins are the first callers that
    can dial an arbitrary host; today the only egress is the crate's own provider client to a known base
    URL
  - Spend ceiling as policy — the step/time/token budgets stay on `TaskContract` where 0.2.0 put them;
    a policy-level ceiling a contract cannot raise belongs to 0.5.0, when sub-agents create contracts
    the operator did not write
  - Ephemeral sandboxes — policy constrains which binary runs, it does not isolate it; real isolation
    is 0.5.0
  - Sub-agents, nesting, 24h+ unattended autonomy (0.5.0)
  - MCP, plugins, skills, office/document and media tools (0.6.0)
  - Any approval UI — io-cli and io-studio own their own prompts; this release ships the trait, the built-ins,
    and the persisted pause they build on
  - Permission modes — the preset bundles both harnesses ship (`acceptEdits`, `plan`, `bypassPermissions`,
    `dontAsk`) are a UX layer over the same rules; a library caller composes a `Policy` directly, so modes
    wait until a consumer wants presets
  - Config file discovery, locations, and precedence order — which files exist, where they live, and what
    order they stack is each app's decision. The crate composes an ordered stack it is handed; it does
    not go looking for files.
  - Any sync command or sync UI — copying or reconciling one app's config into the other is app-side,
    and the layered base is what makes it mostly unnecessary. The crate provides composition, not synchronisation.
  - The adoption work inside io-cli and io-studio — they are separate products in separate repos per product.yaml
    non_goals, and each plans its own adoption in its own roadmap. 0.4.0 ships the shared surface those
    releases consume; it does not edit either app.
  - Any approval UI implementation — io-cli's terminal prompt beyond the shipped stdin built-in, and io-studio's
    dialog, are each app's own `Approver` impl
  - Multi-user or role-based permissions — single-user, single-tenant per product.yaml
  - Cryptographic signing or tamper-proofing of the decision trace
  - Daemon/client mode and any network API
  fallback_scope:
  - Path read/write allow-deny policy, deny-by-default, enforced in the tool layer
  - Command execution policy over what verification may spawn
  - '`Approver` trait with `Approve` / `Deny(reason)` plus `DenyAll` / `ApproveAll` / stdin built-ins,
    awaited in-process and allowed to stay pending'
  - Tiered defaults and the secret-path denies
  - Serde `Policy` plus `merge` with deny-is-absolute — this is what makes the policy shared, so it stays
    in the fallback even though the approval half narrows
  - Refusals and approve/deny decisions recorded in the trace
  - Policy and approve/deny integration tests over a workspace task
  - (drop in this order if the release runs long — first approve-and-remember, then approve-with-changes,
    then `Decision::Defer` with the persisted `AwaitingApproval` outcome and `resume_with_decision`. The
    two approval refinements go first because a plain approve/deny gate is already a complete boundary
    and they are the parts that reach back into the policy; `Defer` goes last because 0.5.0 needs it for
    unattended runs anyway. Each drop narrows one surface rather than deleting a mechanism.)
acceptance:
  functional:
  - Given a policy that allows writes under `src/**` and denies `secrets/**`, a workspace run that attempts
    to write `secrets/key.txt` does not modify that file, receives a typed refusal as its tool result,
    and still completes its in-policy edits to a verified success.
  - Deny beats allow — a path matched by both an allow glob and a deny glob is refused.
  - '`grep`, `find`, and `read_file` return no results from paths outside the read allow list, so a denied
    path cannot be exfiltrated into the model''s context.'
  - Path rules are evaluated on the resolved canonical path, so `..` traversal cannot reach outside the
    allow list.
  - A deny rule matches when either the symlink's own path or its resolved target matches, so a symlink
    inside the allow list pointing at a denied path is refused — following Claude Code's symlink rule,
    where a link in an allowed directory pointing at `~/.ssh/id_rsa` is blocked.
  - A sensitive action reaches the `Approver`, but an out-of-policy action does not — a refusal is returned
    without the approver being consulted, and a test asserts the approver was never called for it.
  - Verification refuses to spawn a binary absent from the command allow list, and the refusal is distinguishable
    in the result from a verification that ran and failed.
  - A sensitive action with an `ApproveAll` approver proceeds; the identical run with `DenyAll` does not
    perform the action and stops with a distinct outcome.
  - An `Approver` returning `Defer` stops the run with `RunOutcome::AwaitingApproval { request_id }` and
    the pending action is readable from the store after the process that created it has ended.
  - An `Approver` that does not resolve immediately keeps the run paused rather than timing out — a test
    holds the decision across an await and the run continues correctly once it resolves.
  - '`resume_with_decision` with an approval performs the pending action and continues the run to a verified
    success under the original `run_id`; with a denial it does not perform the action and closes the run.'
  - Reads inside the allow list proceed without consulting the approver, while every write consults it
    — including an overwrite of a file the path rules already allow.
  - A read of `.env` inside the workspace is denied under the default policy even though the surrounding
    directory is readable.
  - A `Policy` round-trips through serde — serialize, deserialize, and the result enforces identically
    to the original, proven by running the same refusal test against both.
  - A deny in a base layer is not re-allowed by an overlay that allows the same path — the merged policy
    still refuses, and a test asserts this specifically, since it is the rule that makes a shared base
    trustworthy.
  - An allow present only in an overlay grants that capability in the merged policy, so an app can extend
    a shared base without editing it.
  - Merging is deterministic and order-explicit — the same stack of layers always produces the same effective
    policy, and merging a layer with itself changes nothing.
  - An empty or absent overlay leaves the base policy unchanged, so an app that ships no config of its
    own still gets the shared base intact.
  - '`Policy::explain(path)` returns the same decision the tool layer would enforce for that path, proven
    by a test that asserts the two agree across allowed, denied, and sensitive paths — an explain that
    can disagree with enforcement is worse than none.'
  - '`Policy::explain` names the layer responsible, so a path denied by a base layer is explainable without
    running the agent.'
  - An approver that approves with a modified action causes the modified action to run, and the trace
    shows both the requested and the performed form.
  - An approver that rewrites an action onto a denied path does not cause that action to run — the modified
    action is refused by the policy exactly as the original would have been.
  - An approver that approves and remembers a rule stops being consulted for later actions matching that
    rule within the same run, and the trace marks those actions as auto-approved by the remembered rule.
  - A remembered allow does not override a base-layer deny — remembering a rule that conflicts with a
    deny leaves the deny in force.
  - Remembered rules are readable from `RunResult` after the run, so a caller can persist them; the crate
    itself writes no config file.
  - '`Approver` can be held as `Box<dyn Approver>` and used from a non-terminal caller, proven by a test
    approver backed by a channel rather than stdin.'
  - The rusqlite trace records each refusal with the action, the target path or command, the rule that
    refused it, and which layer that rule came from, and each decision with its approve/deny value and
    its source.
  - A refusal caused by a base layer is attributable to that layer in the trace, so a user whose own app
    config does not mention the path can still find out what refused it.
  - A 0.3.0 workspace run constructed without any policy still reaches the same verified success it did
    in 0.3.0, because the default policy applied when none is passed is permissive.
  - A refused action consumes a step — a run whose model repeatedly requests a denied write stops at `StepCapReached`
    rather than looping, and the trace shows one refusal record per consumed step.
  non_functional:
  - Policy, `Approver`, `Decision`, and `resume_with_decision` are part of the documented public API under
    SemVer; existing 0.3.0 callers still compile, or a documented migration is provided.
  - Enforcement lives in the tool and verification layers, never only in the system prompt — a test asserts
    refusal holds when the model requests an out-of-policy action directly.
  - No provider-specific type appears in the policy, approval, or trace API; the provider-agnostic surface
    is preserved.
  - The default policy applied when a caller passes none is permissive, preserving 0.3.0 behaviour — the
    boundary is opt-in. This is a decided trade-off, not an oversight, and the README states plainly that
    a caller who constructs no policy gets no enforcement.
  - The command policy gates the binary name; the trace records the full argv of every spawn, so argument-level
    enforcement can be added in 0.6.0 against a recorded baseline rather than a guess.
  - Refusal and decision records never log file contents or API keys — path, command, rule, and decision
    only.
  - '`Approver` is `Send + Sync` and awaited without blocking the tokio runtime.'
  operational:
  - '`cargo test` passes, including the policy units, approve/deny integration tests, the persisted pause/restart/resume
    test, and the unchanged 0.1.0–0.3.0 suite.'
  - '`cargo clippy --all-targets` reports zero warnings.'
  - '`cargo publish --dry-run` succeeds with complete crate metadata for 0.4.0.'
  - README and crate docs document policy construction, the approval decisions, the sensitive-action classes,
    and the permissive default, with a runnable example.
  - README documents the recommended layering convention (user base, project layer, app overlay) and states
    that the crate composes a stack it is handed rather than discovering files, so an adopting app knows
    what is its responsibility.
  - An example binary (as `examples/edit_repo` did for 0.3.0) drives one live run under a restrictive
    policy showing a refusal and an approval end to end.
delivery:
  target_mode: release-ready
  environment: developer's local machine; the crate is built, tested, and packaged, not uploaded
  deployment_method: 'Built and packaged locally — `cargo test`, `cargo clippy --all-targets`, `cargo
    build --release`, and `cargo publish --dry-run` all green, with the 0.4.0 crate metadata complete.
    Upload to crates.io stays deferred to the release/merge stage by owner decision, as it was for 0.1.0–0.3.0.

    '
  migrations:
  - Extend the rusqlite trace schema with refusal and decision records, and a pending-approval table for
    the persisted pause. Additive only — new tables and columns, no rewrites — so a 0.3.0 database migrates
    in place and a 0.3.0 binary still reads a migrated database.
  observability:
  - Every refusal recorded to rusqlite and emitted via tracing — action, target path or command, and the
    rule that refused it
  - Every approve/deny recorded with its source (which approver, or which persisted request id) and its
    run and step
  - Pending approvals readable from the store while a run is paused, so a caller can list what is waiting
    on a human
  rollback: 'Nothing is published, so rollback is `git revert` of the 0.4.0 branch before merge — the
    change lives only on `feat/0.4.0` until then. The rusqlite migration is additive (new tables and columns
    only), so it needs no down-migration and a 0.3.0 binary still reads a migrated database. At the library
    level, a caller reverts behaviour by dropping back to the 0.3.0 crate version, and no policy is enforced
    against callers who never construct one, since the default is documented as permissive.

    '
dependencies:
  products: []
  services:
  - OpenRouter API (model inference for the live example run)
  human_approvals:
  - Owner confirms 0.4.0 crate version metadata before packaging
  - Owner schedules the adoption releases in the io-cli and io-studio roadmaps, since 0.4.0's value is
    only realised once both consume the shared `Policy` rather than building their own
  - Owner signs off the serde field names before packaging — they become a cross-repo contract that io-cli
    and io-studio policy files depend on, and renaming one later breaks both
resource_profile:
  complexity: large
  uncertainty: medium
  likely_cost_drivers:
  - Two approval mechanisms in one release — an awaited in-process trait and a persisted pause/resume
    state machine — sharing one decision model without either becoming a special case of the other
  - Threading policy through the tool layer, the verification layer, and the loop without leaking it into
    the task contract or the public provider surface
  - Path resolution correctness — canonicalisation, `..` traversal, and symlinks are where permission
    systems actually fail
  - Merge semantics — getting deny-is-absolute right across layers, and keeping the merged result explainable
    enough that a refusal from a base layer is diagnosable
  - Approve-with-changes and approve-and-remember — each is small alone, but both interact with the policy
    rather than sitting beside it, so the re-evaluation path and the remembered-rule layer have to be
    right everywhere rather than on the paths the tests happen to cover
  - Persisting a pending action richly enough that resuming it in a later process performs exactly the
    action a human approved
  - Keeping 0.3.0 callers compiling and behaving identically while adding a policy argument to the run
    path
  preferred_tools:
  - Rust, tokio, rusqlite, serde, tracing; existing own HTTP + SSE provider client
  constraints:
  - Rust crate; async on tokio; state in rusqlite; own HTTP + SSE provider client
  - Embeddable in-process library only; no daemon/client mode
  - Apache 2.0; runs locally, single-user, no hosted service
risks:
- 'Scope — the release is still large, though smaller than first planned: folding the persisted pause
  into `Decision::Defer` on the one `Approver` trait removed a second parallel mechanism. If it still
  runs long, fallback_scope drops `Defer` and `resume_with_decision` to 0.5.0, leaving `Approve`/`Deny`
  on the same trait, so the fallback is a narrowing of one surface rather than the removal of a second
  one.'
- '`Defer` and the awaited path share a trait but not necessarily a code path — the deferred action must
  be persisted richly enough that resuming it performs exactly what an awaited approval would have performed.
  A test asserting the two produce identical filesystem outcomes for the same action is the guard.'
- Path enforcement is bypassed by canonicalisation gaps — `..`, symlinks, or a tool that resolves a path
  before the policy sees it — making the permission boundary look enforced while it is not.
- Enforcement lands in the system prompt for one code path instead of the tool layer, so a model that
  ignores instructions escapes the policy in exactly the case the policy exists for.
- A resumed approval performs a different action than the one the human saw, because the persisted pending
  action did not capture enough of the original context.
- Adding a policy argument to the run path breaks 0.3.0 callers. The permissive default is a decided trade-off;
  both apps are now committed to constructing a policy, so the opt-in default is a compatibility shim
  rather than the shipped experience.
- '`Policy` becomes a shared public contract across three repos the moment io-cli and io-studio adopt
  it, so a later change to its shape is a coordinated break, not a local one. This raises the SemVer stakes
  on getting the serde representation right in 0.4.0 — a field renamed in 0.5.0 invalidates every policy
  file both apps have written.'
- A merge bug is a silent permission hole rather than a visible failure. If an overlay can re-allow a
  denied path, a shared base stops meaning anything and nobody finds out until something is read or written
  that should not have been. This is why deny-is-absolute has its own acceptance criterion rather than
  being folded into general merge tests.
- Layering makes the effective policy something no single file shows. A user reading io-studio's config
  cannot see what the shared base denies, so a refusal looks inexplicable unless the trace names which
  layer refused and `explain` can answer the same question before a run — both are in scope for exactly
  this reason.
- '`explain` drifting from enforcement is worse than shipping no `explain` at all, because it would state
  a boundary that is not the one enforced. The mitigation is that both must resolve through the same evaluation
  function rather than two implementations that agree today.'
- 'Approve-with-changes is the most dangerous surface in the release: it is caller-supplied code that
  alters an action after the policy has already looked at it. If the re-evaluation is skipped on any path,
  an approver becomes a way around every deny in the stack. The re-check must live with the action, not
  with the approver call site, so a new call site cannot forget it.'
- Approve-and-remember quietly converts one human decision into unlimited future ones. A user who approves
  a write to `src/**` once may not realise they approved every subsequent write there for the rest of
  the run. Marking remembered auto-approvals distinctly in the trace is the mitigation, and how apps surface
  the remembered set at approval time matters more than anything the crate can enforce.
- The two features together let an approver approve a modified action and remember a rule matching the
  modified form, so the remembered rule may not match anything the model ever requested. Which form is
  remembered — requested or performed — must be decided explicitly rather than falling out of the implementation.
- Adoption is proven outside this repo. 0.4.0 is release-ready and cannot itself demonstrate that io-cli
  and io-studio consume the policy; the shared surface can look complete here and still turn out to be
  awkward for a GUI caller. The object-safety and channel-backed-approver tests are the closest in-repo
  proxy, not proof.
- Refusal-as-tool-result lets the model spend the whole step budget retrying a denied action. Refusals
  counting against the budget bounds this at `StepCapReached` rather than an infinite loop, but the run
  is still wasted; if this shows up in practice, a repeated-refusal early stop is the follow-up.
open_questions:
- When an approver both modifies an action and remembers a rule, is the rule remembered against the requested
  form or the performed one? Proposed the performed form, since that is what will actually recur, but
  it means the remembered rule may match nothing the model ever asked for.
- Is the model told when approve-with-changes altered its action? Claude Code does not tell it. Proposed
  the same here, since the loop re-reads the workspace each step and observes the real result anyway —
  but a model that believes it wrote path A while path B changed may waste steps before noticing.
- Do remembered rules survive a `Defer` and its `resume_with_decision`, or does a resumed run start with
  only the persisted layers? They are run-scoped in memory, so surviving means persisting them alongside
  the pending action.
released_at: '2026-07-24T00:00:00Z'
mode: release-ready
delivered: 'A developer runs io-harness on sensitive work under an explicit permission policy. A Policy
  is a stack of named layers evaluated deny-first across the whole stack, so an overlay adds capability
  but can never re-allow what a layer beneath it denied. Path rules govern read_file/write_file and filter
  grep/find so a denied path yields no results; they are evaluated on the resolved path, and a deny matches
  either a symlink''s own path or its target. A command policy gates what verification may spawn, with
  every spawn''s full argv traced. Enforcement lives in the tool and verification layers, not the prompt.
  Anything the policy marks Ask reaches one object-safe Approver trait with three decisions: Approve (optionally
  rewriting the action or remembering rules, both re-checked so neither can cross a deny), Deny, or Defer
  — which persists the pending action so a human can decide after the process exits, with resume_with_decision
  continuing the run under its original id and re-checking the policy. A denied action never reaches the
  approver and is reported to the model as an adaptable tool result. Every refusal and decision is in
  the rusqlite trace, attributed to the rule and layer. Policy is serde-serializable and composes via
  merge, so io-cli and io-studio can each keep their own config over one shared base. Built, tested, documented,
  and packaged (release-ready); crates.io publish deferred to the release/merge stage by owner decision,
  as for 0.1.0-0.3.0.'
