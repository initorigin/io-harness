known_limitations:
- Single-file mode is not policy-enforced. A policy only applies to workspace contracts (TaskContract::workspace).
  Passing a non-permissive policy with a single-file contract now returns an error rather than running
  unenforced — this was found by the completion gate, where it had been a silent no-op, and fixing it
  was release-blocking. Extending enforcement to the single-file loop is outstanding.
- 'A refused action can still waste a run. Refusals count against the step budget (a decided trade-off),
  so a model that repeatedly retries a denied action is bounded by the step cap but achieves nothing.
  Confirmed live: with no guidance the model retried a denied read on steps 2, 4, 7 and 8 and hit StepCapReached
  without doing the work. The mitigation today is a TaskContract constraint telling the model not to retry
  refused actions, which turned the same task into Success{steps:4}. A repeated-refusal early stop is
  the named follow-up.'
- Rules remembered before a Defer are not persisted with the pending action. They are returned on RunResult::remembered,
  so a caller can merge them into the policy it passes to resume_with_decision, but the crate does not
  do this for it — a caller that ignores the field silently loses them on resume.
- The model is not told when approve-with-changes altered its action (matching Claude Code's behaviour).
  The loop re-reads the workspace each step so it observes reality eventually, but it may waste a step
  believing it wrote a path it did not.
- The command policy gates the binary name only, not arguments. Sound today because every argv element
  is harness-constructed (src/verify.rs) and no model or caller output reaches it; the full argv is traced.
  Argument gating becomes required in 0.6.0 when plugins/MCP can supply argv.
- Which form is remembered when an approver both rewrites and remembers is the approver's choice — the
  crate applies exactly the rules handed to it and does not derive them from either the requested or the
  performed action.
- 'The default is permissive: a caller who passes no policy gets no enforcement. Deliberate for 0.3.0
  compatibility, but it means 0.4.0 ships a boundary nobody gets unless they opt in, and neither io-cli
  nor io-studio has adopted it yet — the release''s value is unrealised until they do.'
- 'Policy layering is composed, not discovered: the crate merges a stack it is handed and never reads
  a config file. Where the shared base lives, and in what precedence, is unsettled across io-cli and io-studio.'
- 'mode is release-ready, not published: 0.4.0 is built, tested, documented and packaged but not uploaded
  to crates.io; publish is deferred to the release/merge stage by owner decision, as for 0.1.0-0.3.0.
  cargo publish --dry-run passes and CARGO_REGISTRY_TOKEN is available.'
- Execution-based verification still compiles model-produced code locally with no sandbox (sandboxes are
  0.5.0), inherited from 0.2.0. The command policy constrains which binary runs, not what it may do.
- Policy glob matching compiles a regex per check and matches full relative path or basename; adequate
  for a handful of rules per tool call, not tuned for large rule sets.
