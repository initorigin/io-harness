product: io-harness
version: 0.44.0
status: planned
release_type: minor

outcome:
  user_can: >
    Run a long job and stop paying full price for the part of the request that never changes.

    **Today exactly one thing in a request is marked cacheable, and it is the smallest half.**
    0.38.0 put one breakpoint at the end of the `system` block — `src/provider/anthropic.rs:161` for
    Anthropic, `cached_system` (`src/provider/openai_wire.rs:84`) for OpenRouter — and covered the
    tool schemas and the instructions with it, because those vendors order a request's cacheable
    prefix tools-then-system. That block is a few thousand tokens and it is fixed for the life of a
    run. The transcript is the part that grows: on step sixty the observation section is most of what
    is sent and all of it is billed fresh, every step, forever.

    **0.38.0 left the transcript unmarked on purpose, and the reason has expired.**
    `context::assemble` (`src/context.rs:558`) supersedes, invalidates, re-reads and re-fits earlier
    observations on every turn, so the observation section was not a byte-stable prefix and marking
    it would have been billed as a cache *write* on nearly every turn — costing money instead of
    saving it. That reasoning is recorded in the function's own doc comment
    (`src/provider/openai_wire.rs:80`) and in 0.38.0's `known_limitations`. 0.43.0 changed the
    premise: when the ledger crosses `Compaction::at_share` the oldest observations become one
    model-written paragraph stored in `summaries` and replayed on resume, and everything from the top
    of the prompt through the end of that paragraph stops moving.

    **So a second breakpoint goes at the end of that frozen prefix.** The run loop computes where the
    prefix ends, hands the offset to the provider on the request, and the two vendors that take a
    request-side marker split the user turn into two content blocks with the marker on the first. A
    run that folds once and then works for forty more steps re-sends that prefix forty times and is
    charged the cache-read rate for it — a tenth of the input rate on the Anthropic table this crate
    already ships (`Price::cache_read`, `src/pricing.rs:95`).

    **And the marker is withheld unless the prefix has actually repeated.** "Immutable by
    construction" is not true of the whole prefix as the prompt is assembled today, and this release
    says so rather than assuming it: the memory block renders *ahead* of the summary
    (`src/context.rs:581`) and is re-read from the store on every turn by deliberate design
    (`src/run.rs:4295`), so a note the run writes about its own work moves the prefix underneath the
    summary. The loop therefore holds the previous step's candidate prefix and marks only when this
    step's is byte-identical to it. A note written mid-run drops the marker for one turn and it
    returns on the next. The crate never asks a vendor to cache a prefix it has not already seen
    twice, which makes "this release cannot cost money" a property of the mechanism rather than a
    hope about assembly.

    **What the reads cost is already where an operator looks, and this release proves it rather than
    building it.** `Usage::cache_read_tokens` has existed since 0.18.0
    (`src/provider/mod.rs:618`), both wires parse it from the vendor's own counters
    (`src/provider/anthropic.rs:628`, `src/provider/openai_wire.rs:340`), every completion lands a
    `provider_calls` row carrying it (`src/state.rs:2991`), and `Store::spend_by_run` /
    `spend_by_model` / `spend_by_day` (`src/state.rs:3921`–`:3934`) price it through
    `Price::cache_read`. Nothing new is needed for the money to show up. What is new is the *cause*:
    an operator whose run gets no transcript cache hits currently has no way to tell whether the
    marker was never offered, was withheld by the guard, or was offered and ignored. One additive
    event says which.

  business_value: >
    This is the release where 0.43.0 pays for itself twice. Compaction was sold on fidelity — a long
    run stops forgetting its own beginning — and it also, as a side effect nobody had to design for,
    manufactured the one thing prompt caching needs and this crate never had: a prefix that stops
    changing. Shipping the breakpoint is what converts that side effect into money.

    It cannot be done outside the crate, and the reason is structural rather than incidental. The
    breakpoint has to sit at a boundary only the run loop knows: the loop owns the `ContextLedger`,
    it is the only thing that knows a fold happened, and the prompt the boundary is an offset into is
    built by `workspace_user_prompt` (`src/run.rs:11139`) two frames below any embedder. An
    application that wanted this today would have to reimplement assembly, compaction and the prompt
    builder in order to reproduce the byte the marker goes after — at which point it has forked the
    library rather than used it.

    The saving is proportional to the thing that hurts most. A short run gains nothing, which is
    correct: the marker is not offered until a fold has happened, and a run that never folds never
    pays a write. A long run gains more the longer it goes, because the frozen prefix is re-sent once
    per step and grows with each fold. That is the opposite shape from the failure 0.43.0 fixed —
    where cost grew with length — and the two together mean a run's marginal step gets cheaper rather
    than more expensive as it goes.

    The price: one break, taken deliberately and paid once. `CompletionRequest` gains a field and
    `#[non_exhaustive]` in the same release — the move `Verification` (0.34.0), `TaskContract`
    (0.35.0), `AgentDef` (0.36.0), `TurnResult` (0.37.0) and `ProviderErrorKind` (0.43.0) each made.
    It is worth naming why this type has escaped it for forty-three releases: its own worked example
    says "never an exhaustive literal — `media` appeared in 0.15.0 and the next field will appear the
    same way, in a minor" (`src/provider/mod.rs:440`), and every in-tree caller obeys it — but an
    exhaustive struct literal outside the crate compiles today, so the field is a break whatever the
    doc advises, and `#[non_exhaustive]` is what makes the *next* request field free.
    Everything else is additive: one variant on an enum that has been `#[non_exhaustive]` since
    0.24.0. No table, no column, no index, no dependency, and `docs/public-api.txt` byte-identical.

  evidence_of_value: >
    Executed in the technique the last thirteen releases used: a discriminating assertion per claim,
    a negative control that must not move, one sabotage per arm of every two-armed claim, and a
    sabotage that fails nothing reported as a finding rather than propped up.

    The wire claims are proven from the JSON body, not from a description of it. Both vendors' body
    builders are already directly testable (`src/provider/anthropic.rs:763`,
    `src/provider/openai_wire.rs:705` assert 0.38.0's marker exactly this way), so the assertions are
    that the user content is two text blocks, that concatenating them is byte-identical to the
    `user` string that went in, and that `cache_control` is on the first and absent from the second.
    The concatenation assertion is the discriminating one: an implementation that split at the wrong
    byte, dropped the separator, or trimmed either half passes every "is there a marker" assertion
    and fails that one.

    The guard is proven by what is **not** sent. A fixture provider that records every request it
    receives, driven through a fold and then through a step on which a note is written: the request
    on the step after the fold carries no boundary (the prefix has been seen once), the step after
    that carries one, the step after the note carries none again, and the step after that carries one
    whose bytes differ from the first. Four steps, four different answers, and a marker that fires
    whenever a fold exists passes the first and fails the rest.

    The negative controls are the two that must not move, and both are byte-level. A request with no
    fold produces a body byte-identical to the one 0.43.0 sent — the same claim 0.38.0 made for
    `WebFlavor::OpenAi` and asserted rather than assumed. And `WebFlavor::OpenAi`, which fronts
    OpenAI and all 21 `Compatible` endpoints, sends no boundary in any circumstance whatsoever: new
    surface starts closed, and an unknown body key on an endpoint this crate does not control is a
    400 nobody asked for.

    The money is measured once, live, against a real vendor, because a request-shape change whose
    entire benefit is vendor-side is a change nobody has seen work until they have seen it work.
    0.38.0's method applies unchanged and its three traps are known: pin an **Anthropic** model
    through OpenRouter rather than the account's default, which is an OpenAI-family model that caches
    by itself and would produce a confident false pass; read what actually answered from
    `CompletionResponse::model` rather than from the slug that was asked for; and expect no
    cache-write counter back from OpenRouter, so the write is stated as unreported rather than
    inferred from prompt length. The control is the same endpoint and model reached through
    `Compatible`, which sends no marker at all — one key different, everything else identical.

    And the accounting half is proven by reading it back rather than by building it: after the live
    run, `Store::provider_calls` for that run carries non-zero `cache_read_tokens` on the steps after
    the boundary was marked, and `Store::spend_by_run` prices them through `Price::cache_read`. If
    that assertion needed new code, the release would have been mis-scoped.

scope:
  included:
  - >
    **`CompletionRequest::cache_boundary: Option<usize>`, and `#[non_exhaustive]` on
    `CompletionRequest`.** One break, paid once, in the release that needs the field. A byte offset
    into `user`: the end of the prefix the caller states is byte-stable across requests. `None` — the
    default, and every caller before 0.44.0 — sends the body 0.43.0 sent, byte for byte. It is a
    *request*, not a fact, in exactly the sense `model` (0.21.0), `web` (0.22.0) and `effort`
    (0.31.0) are: a `Provider` outside this crate that ignores it keeps working and is honestly
    non-caching, which is why it is a field on the request rather than a method on the trait.
  - >
    **An out-of-range or mid-character offset is ignored, not an error.** Past `user.len()`, or not
    on a UTF-8 character boundary, or zero-length, and the provider sends the single block it sends
    today. This is `max_parallel_reads`' shape (0.41.0, where `0` clamps rather than errors) and not
    `ensure_media_accepted`'s: nothing has gone wrong on the wire and nothing the caller believes in
    is being silently discarded — a boundary is an optimisation, and an optimisation that turns a
    working run into an `Err` is worse than the optimisation is worth.
  - >
    **The field is `#[serde(default, skip_serializing_if = "Option::is_none")]`, and that is
    load-bearing rather than tidy.** `CompletionRequest` is `Serialize`/`Deserialize`
    (`src/provider/mod.rs:450`) and `Replay` keys every lookup on
    `serde_json::to_string(request)` — the whole request as JSON, deliberately not a hash so a
    mismatch can be read (`src/provider/replay.rs:68`). A field that serialised as
    `"cache_boundary": null` would change the key of every request that does not use it and silently
    stop **every recorded cassette in the repository** from matching. Skipped-when-`None` keeps an
    unmarked request's key byte-identical to 0.43.0's; a marked request keys differently from an
    unmarked one for the same prompt, which is correct — the key is the exact request content, and
    the two requests are not the same request.
  - >
    **The boundary is computed by the run loop, as one crate-internal helper called from both
    assembly sites.** The flat workspace loop (`src/run.rs:4337`) and the tree loop
    (`src/run.rs:5898`) both build the turn's prompt through `workspace_user_prompt`
    (`src/run.rs:11139`); the helper runs immediately after, is handed the assembled text and the
    ledger, and returns the offset or `None`. One definition and two call sites, asserted by shape,
    because a rule added to one of two loops is a rule that lapses in the other — the constraint
    0.41.0, 0.42.0 and 0.43.0 each recorded. The single-file loop (`src/run.rs:3961`) has no ledger
    and therefore no fold, and is untouched.
  - >
    **The prefix ends at the end of the folded summary, located by its own text.** After a fold the
    summary is the ledger's first entry — an `ObsKind::Message` observation whose target is
    `"summary"`, carrying the exact string `compact_ledger` built (`src/run.rs:10533`) — and
    `assemble` emits a carried entry's text verbatim (`src/context.rs:685`). So the loop finds that
    string in the assembled prompt and the boundary is the byte after it. **No new field on
    `Assembled`**, which is deliberately not `#[non_exhaustive]` and would have been a second break
    for a value the loop can already derive. The search doubles as the correctness test it would
    otherwise need: a summary that assembly stubbed rather than carried is not found, and not being
    found is exactly the case where there is no frozen prefix to mark.
  - >
    **The repeat guard: mark only what has already been sent once.** Both loops hold the previous
    step's candidate prefix in run-scoped state and offer a boundary only when this step's candidate
    is byte-identical to it. Run-scoped rather than recomputed per step for the reason 0.34.0's
    `routed_model` is (trap 39): a rule applied to a freshly-built request cannot detect its own
    transition. The consequence is stated rather than hidden — the step on which a fold happens is
    never marked, the step after it is, and the marker is a turn behind the boundary for the whole
    life of the run. That turn is the price of never billing a cache write on a prefix that then
    changes.
  - >
    **Anthropic splits the user turn into two text blocks, and refuses the boundary when images are
    present.** `Anthropic::user_content` (`src/provider/anthropic.rs:229`) puts images **before**
    text, by Anthropic's own guidance for prompts that ask about an image — so on a request carrying
    media there is no text prefix to mark, and the boundary is ignored rather than moved. A
    text-only request becomes `[{text, cache_control}, {text}]`, giving the request its second
    breakpoint of the four Anthropic permits, the first still being the `system` block 0.38.0 marked.
  - >
    **OpenRouter splits the same way and keeps its images.** `openai_wire::user_content`
    (`src/provider/openai_wire.rs:217`) puts text **first**, so the two text blocks lead and the
    image blocks follow unchanged — the boundary is honoured on a media-carrying request here and
    not on Anthropic, and the difference is a property of the two wires rather than a policy this
    crate invents. Added in the shape `web_key`, `effort_key` and `cached_system` established: one
    per-vendor difference resolved in the shared body builder rather than in each provider.
  - >
    **`WebFlavor::OpenAi` sends nothing, in every circumstance.** OpenAI caches a repeated prefix by
    itself with no request-side control, and this flavour also fronts the 21 `Compatible` endpoints
    this crate does not control. Its body stays byte-identical to 0.43.0's and that is asserted, not
    assumed — the same negative control 0.38.0 wrote for the same reason.
  - >
    **`EventKind::CacheMarked { through_step, prefix_bytes }`.** `EventKind` is `#[non_exhaustive]`
    since 0.24.0 (`src/observe.rs:290`), so the variant is additive. Emitted when the marked prefix
    **changes** — the step it is first offered, and again whenever a later fold or a moved prefix
    makes the crate mark different bytes — and not once per step, for `Routed`'s reason. Withheld is
    the absence of the event: a run with no `CacheMarked` never marked anything, a run with three
    marked three different prefixes, and an operator reading `cache_read_tokens: 0` beside a
    `CacheMarked` knows the vendor ignored a marker the crate did send. Named `CacheMarked` rather
    than `Cached` because the crate cannot know at request-build time whether anything was cached;
    it knows what it asked for. Census in `src/observe.rs`'s test module and `EVENT_NAMES` updated
    in the same commit — the bookkeeping trap 45 records, and `through_step` rather than `run_id`
    for the one trap 77 records.
  - >
    **One live measurement, and its control.** Two consecutive requests over an identical frozen
    prefix through OpenRouter against a pinned **Anthropic** model, with the same endpoint and model
    reached through `Compatible` as the no-marker control. Recorded: `cache_read_tokens` on the
    second call of each, what `CompletionResponse::model` says actually answered, and the two priced
    through the shipped table. The write is stated as unreported rather than inferred, because
    OpenRouter returns no cache-write counter.
  - >
    **Documentation as part of the release.** `docs/CONTRACT.md` gains the guarantee in the terms an
    embedder needs it: where the second breakpoint goes, that it is offered only after a fold and
    only when the prefix has repeated, that a media-carrying request is unmarked on Anthropic and
    marked on OpenRouter, that OpenAI-flavoured bodies are unchanged, and that a prefix under the
    vendor's minimum cacheable length is silently not cached and the marker inert. The 0.38.0
    paragraph in `docs/CONTRACT.md` and the `cached_system` doc comment
    (`src/provider/openai_wire.rs:80`) both currently state that the transcript deliberately carries
    no breakpoint; **both are corrected in the same commit as the code**, which is the whole of trap
    "grep the contract for the claim you just changed". `CHANGELOG.md` gains the entry with a
    `*Migration:*` note for the `CompletionRequest` break. No new guide page, so no `GUIDES` /
    `CAPABILITIES.md` bookkeeping — the precedent since 0.31.0. Every new public item carries a
    worked doctest for the `every_public_item_has_a_worked_example` gate.
  excluded:
  - >
    **A breakpoint anywhere else in the transcript.** Not before the fold, not per observation, not
    at the end of the memory block, and not a third one after the newest kept observations. Each is
    a prefix this crate cannot show is stable, and 0.38.0's cost argument applies to every one of
    them unchanged: a marker on a moving prefix is billed as a write.
  - >
    **Making assembly prefix-stable in general.** Reordering the prompt so the memory block sits
    after the observations would make the frozen prefix stable far more often and it changes the
    prompt every embedder's model reads, for a benefit that belongs to caching alone. Memory-first
    is a deliberate decision (`src/context.rs:576`) about what an agent should read before its own
    run. If the guard proves to withhold the marker often enough to matter, that is a measurement
    this release produces and a decision a later one takes.
  - >
    **An off switch, or a knob to force the marker.** 0.38.0 shipped none for the system breakpoint
    and this adds none: `Compatible` remains the escape hatch that sends nothing, an out-of-tree
    `Provider` may ignore the field, and `Compaction { at_share: 1.0 }` already turns off the fold
    the boundary depends on. A knob is one line to add later and impossible to remove.
  - >
    **An extended cache TTL.** The vendors' longer-lived cache tiers are priced differently and
    chosen per request; nothing here needs one, and adding it would make this release two.
  - >
    **Any change to compaction.** `at_share`, `keep_recent`, the fold's trigger, the summariser's
    prompt, the `summaries` table and `restore_ledger`'s replay are all untouched. This release reads
    the boundary compaction already creates; it does not move it, and a fold's timing must not start
    being decided by what would cache well.
  - >
    **Any change to elision.** Supersession, invalidation, re-read, fit and the stub collapse are
    untouched. The boundary is computed from the text `assemble` produced, after it produced it.
  - >
    **Any new table, column, index, `CHECKPOINT_FORMAT` bump, or dependency.** This release writes
    nothing durable it did not already write.
  - >
    **Cache reporting beyond the one event.** No per-run cache summary type, no saving estimate, no
    "you would have saved N" line. The rows and `spend_by_*` have priced cache reads since 0.18.0 and
    an application that wants a headline number has the material.
  fallback_scope:
  - >
    **The breakpoint, the guard, and the live measurement — without `EventKind::CacheMarked`.** The
    money is the release and the money is saved by the first three; the event is the operator's
    explanation of *why*, which is real value and is separable. What is given up is stated in the
    record rather than discovered: an operator whose run shows no cache reads can tell that from
    `provider_calls` but cannot tell whether the marker was withheld or ignored, and finds out by
    reading the guard's rule in `docs/CONTRACT.md`. Shipping the event later costs nothing extra —
    the enum is `#[non_exhaustive]`, so it is additive whenever it lands.

acceptance:
  functional:
  - >
    **F1 — a marked request is two text blocks that reassemble exactly.** Anthropic's and
    OpenRouter's body builders, called directly with a `CompletionRequest` whose `cache_boundary` is
    `Some(n)`. Three assertions: `content` is an array of two `text` blocks; the first carries
    `cache_control: {"type":"ephemeral"}` and the second carries none; and **the two texts
    concatenated are byte-identical to `request.user`**. The third is the discriminating one.
    Sabotage: split with `trim()` on either half, under which the first two assertions pass and only
    the concatenation fails.
  - >
    **F2 — `None` is 0.43.0's body, byte for byte.** The same builders with `cache_boundary: None`,
    asserted against the serialised body 0.43.0 produced for the same request — the whole body, not
    the user field. Separately, an offset past `user.len()`, an offset landing inside a multi-byte
    character, and `Some(0)` each produce that same body and no error. Sabotage: treat an
    out-of-range offset as a clamp to the end, under which one block becomes two and this fails while
    F1 still passes.
  - >
    **F3 — the boundary is offered only after a fold, and only once the prefix has repeated.** A run
    driven past the compaction threshold over a fixture provider that records every request. The
    request on the step the fold happens carries `cache_boundary: None`; the next carries `Some(n)`;
    and `user[..n]` **ends with the summary's own text** and contains the memory block and the
    prompt header ahead of it. Sabotage: mark whenever the ledger holds a fold, under which the fold
    step is marked and only this fails.
  - >
    **F4 — a moved prefix withdraws the marker for exactly one step.** The same run, with a memory
    note written on a step after the marker started being offered: that step's request carries
    `None`, the step after it carries `Some(m)`, and `m != n` — the prefix that came back is a
    different one. Four steps, four different answers. Sabotage: compare the summary text instead of
    the whole candidate prefix, under which the note never withdraws the marker and the crate asks a
    vendor to cache bytes it has not sent.
  - >
    **F5 — `WebFlavor::OpenAi` never sends a boundary.** The shared body builder at that flavour,
    with `cache_boundary: Some(n)`, media present and absent, fold and no fold: the user message
    content is the bare string in every case and the whole body is byte-identical to 0.43.0's. The
    negative control that must not move, and the one that covers 21 endpoints this crate does not
    control. Sabotage: honour the boundary for every flavour, under which a `Compatible` endpoint
    receives a content shape nobody asked it for.
  - >
    **F6 — media decides the boundary per wire, and the two wires differ.** One request carrying an
    image and `cache_boundary: Some(n)`: Anthropic's body has images first and **one** text block
    with no `cache_control`; OpenRouter's has **two** marked-then-unmarked text blocks followed by
    the image blocks. Both assertions in one test, because the point is the difference. Sabotage:
    honour the boundary on Anthropic with media present, under which the marked block is not a prefix
    of the message and the cache entry can never be hit.
  - >
    **F7 — a real vendor honours it, measured once and controlled.** Two consecutive requests over an
    identical frozen prefix through OpenRouter against a pinned Anthropic model: the second reports
    non-zero `cache_read_tokens` covering materially more than the `system` block alone. The control
    — the same endpoint and model through `Compatible`, which sends no marker — reports zero on both
    calls. `CompletionResponse::model` is recorded on every call and is the Anthropic model that was
    pinned. If the vendor is unreachable at development time this becomes a `known_limitations` line
    naming what was not observed, never a silent pass.
  - >
    **F8 — `CacheMarked` fires on change and not per step.** Over the F3/F4 run: exactly two
    `CacheMarked` events for four marked steps across two distinct prefixes, each carrying the
    `through_step` it was marked at and `prefix_bytes` equal to the offset that was sent, and a run
    that never folds emits none. Sabotage: emit on every marked step, under which the count is four
    and only this fails — 0.34.0's `Routed` defect, reproduced deliberately.
  - >
    **F9 — an unmarked request keys exactly as it did on 0.43.0, and every recorded cassette still
    replays.** `replay::key` over a `cache_boundary: None` request is byte-identical to the string
    0.43.0 produced for it, and the repository's existing recorded exchanges are served by `Replay`
    unchanged. A marked request keys differently from the same prompt unmarked, and that difference
    is asserted rather than merely tolerated. Sabotage: drop `skip_serializing_if`, under which
    `"cache_boundary":null` enters every key and the existing cassettes stop matching — a failure
    that reaches tests nothing else in this release touches.
  non_functional:
  - >
    **N1 — no new dependency.** `cargo tree` for the default feature set has the same number of
    crates as 0.43.0 (**402**). Splitting a string needs `std`; the marker is `serde_json`, already
    there.
  - >
    **N2 — MSRV unmoved.** The crate builds on 1.95 with the toolchain gate CI already runs.
  - >
    **N3 — exactly one public break, and `docs/public-api.txt` is byte-identical.**
    `CompletionRequest` gains `cache_boundary` **and** `#[non_exhaustive]` together;
    `EventKind::CacheMarked` sits on an enum `#[non_exhaustive]` since 0.24.0. Neither adds a line
    the checker can see: it enumerates crate-root re-exports (`tests/docs_drift.rs`), and both
    `CompletionRequest` and `EventKind` are already listed — a field and a variant are members of
    already-listed items. **Byte-identical is the claim, stated at plan time**, because "met in a
    different form" has cost a `known_limitations` line in four of the last six releases (traps 114,
    the 0.41.0 N3 note, and 0.39.0's).
  - >
    **N4 — no durable state moves.** `git diff main -- src/state.rs` is **empty**: no table, column,
    index or reader, and `CHECKPOINT_FORMAT` unmoved at 7. The cache columns this release's value is
    measured in have existed since 0.18.0 (`src/state.rs:2991`) and are read, not written to.
  - >
    **N5 — a run that never folds is 0.43.0 exactly.** With compaction off (`at_share: 1.0`) and
    over a run too short to fold, every request the fixture provider receives carries
    `cache_boundary: None` and the assembled prompts are byte-identical to 0.43.0's for the same
    script. The cost of this release to a short run is zero, asserted rather than reasoned.
  - >
    **N6 — 0.41.0's batch, 0.42.0's gate and 0.43.0's fold are unaffected.** With the boundary on,
    three read-only tools still rendezvous inside the bound and are folded back in the model's call
    order, a `before_tool` hook is still consulted exactly once per call, and the fold still fires at
    `at_share` and writes exactly one `summaries` row. The boundary is computed after assembly and
    changes no decision any of the three makes. Asserted rather than assumed, because a helper
    inserted into both loops is exactly where a regression to any of them would hide.
  operational:
  - >
    **O1 — the full suite passes on all three platforms**, which the standing CI matrix already runs.
    Nothing here is process-spawning or path-shaped, so this is the routine bar; the `media` arm of
    the matrix is what covers F6.
  - >
    **O2 — cross-version is unaffected and proven so.** No DDL, so a 0.43.0 store and a 0.44.0 store
    are the same store; `ADDED_SINCE_0_22_0` and `COLUMNS_ADDED_SINCE_0_22_0`
    (`tests/cross_version.rs`) are **unchanged**, which is itself the assertion.
  - >
    **O3 — the documentation gates pass**: the nightly rustdoc gate, the two intra-doc link rules,
    and the checked-in doc surfaces (`docs/public-api.txt`, `CAPABILITIES.md`, the guide index,
    `CHANGELOG.md` including its `*Migration:*` note) consistent with the code in the same commit
    range. Specifically included: **no surviving sentence anywhere in the crate or the docs says the
    transcript carries no breakpoint.** Asserted by grep over `src/` and `docs/`, because two such
    sentences exist today and one of them is a doc comment on the function being changed.

delivery:
  target_mode: published
  environment: >
    crates.io as `io-harness` 0.44.0, GitHub at initorigin/io-harness with the tag `v0.44.0` and a
    Release titled `io-harness 0.44.0`, and docs.rs.
  deployment_method: >
    The standing flow. All work on `feat/0.44.0` off `develop`, committed incrementally as it lands,
    including the sealed UltraShip release record and the hand-appended lock pin. PR into `develop`,
    merged with the PR button. `develop`'s head and tree checked against the tree the gates ran on
    immediately before the release PR is opened. Release PR `develop` into `main`, merged the same
    way. The GitHub Release is cut by `release.yml` —
    `gh workflow run release.yml --ref main -f version=0.44.0` — which takes its notes verbatim from
    the changelog. `cargo publish --locked` by hand afterwards, always last, after both merges and
    the Release exist, with the registry token sourced from the repo-local `.env` in the same shell
    invocation. `develop` synced to `main` fast-forward only at the end. No branch is deleted.
  migrations:
  - >
    **No store migration at all.** No table, column or index is created or altered,
    `CHECKPOINT_FORMAT` is unmoved at 7, and a 0.43.0 store and a 0.44.0 store are the same store in
    both directions.
  - >
    One public break: `CompletionRequest` gains `cache_boundary: Option<usize>` **and**
    `#[non_exhaustive]`. A consumer constructing it with an exhaustive struct literal adds
    `..Default::default()`, which the type's own documentation has advised since 0.2.0; a consumer
    already doing so changes nothing. The changelog carries the `*Migration:*` note saying exactly
    that, and says why the two are paid in the same release — the type becoming `#[non_exhaustive]`
    is what makes the next request field free.
  - >
    One behaviour change with no compile consequence: a run that folds now sends a different request
    *shape* to Anthropic and OpenRouter — two content blocks where there was one — with byte-identical
    content. A vendor's minimum cacheable length applies, so on a short prefix the marker is inert
    and costs nothing. Stated in the changelog beside the addition.
  observability:
  - >
    A changed marked prefix emits `EventKind::CacheMarked { through_step, prefix_bytes }`. Additive;
    an observer that does not know the variant is unaffected, because the enum has been
    `#[non_exhaustive]` since 0.24.0. The absence of the event across a run is the signal that
    nothing was ever marked, and it is documented as such rather than left to be inferred.
  - >
    The saving appears where spend already does and through no new surface: `cache_read_tokens` on
    each `provider_calls` row (`src/state.rs:2991`), priced through `Price::cache_read` by
    `Store::spend_by_run` / `spend_by_model` / `spend_by_day`. Nothing about spend moves to a new
    place, which is the point.
  - >
    A withheld marker emits nothing. A per-step "not marked" event on a long run is one event per
    step for the common case, and the question it answers is answered instead by the documented rule
    plus the absence of `CacheMarked`.
  rollback: >
    A published version cannot be recalled; the forward fix is 0.44.1 and `cargo yank --version
    0.44.0` is the escape hatch, leaving 0.43.0 as what `cargo install` resolves. Reverting is
    unusually cheap and total: the boundary is inert unless a run folds, so `Compaction { at_share:
    1.0, ..Default::default() }` returns a suspect run to 0.43.0's exact wire without downgrading,
    and `Compatible` reaches any endpoint with no marker at all. A suspected caching defect is
    bisected with those two before anything is yanked.

dependencies:
  products: []
  services:
  - >
    crates.io and GitHub Actions for the release itself, as every version.
  - >
    **One live provider call is required, and this is the release where that is true.** F7 is a
    measurement against OpenRouter with a pinned Anthropic model and a `Compatible` control. Every
    other criterion is a fixture: recorded requests, serialised bodies and counters, none of which
    needs a vendor. The account's default `OPENROUTER_MODEL` is an OpenAI-family model and must
    **not** be used — it caches by itself and would produce a confident false pass.
  human_approvals:
  - >
    The marker fires **only when the candidate prefix repeated byte-identically since the previous
    step**, rather than whenever a fold exists. Chosen with its cost stated: the marker is always one
    turn behind the boundary, and the crate never bills a cache write on a prefix that then changes.
  - >
    The release ships **one additive event** (`EventKind::CacheMarked`) so that "why is this run
    getting no cache reads" is answerable without a wire trace. Chosen over relying on the
    accounting rows alone, which show the effect and never the cause.
  - >
    `CompletionRequest` takes the field **and** `#[non_exhaustive]` in the same release — one break,
    paid once, the move five previous releases made on five other types.
  - >
    The PR, both merges, the Release and the publish are pre-authorised for this version under the
    standing flow.

resource_profile:
  complexity: medium
  uncertainty: medium
  likely_cost_drivers:
  - >
    **The guard's state lives in two loops and its transitions are the whole feature.** The boundary
    itself is a `split_at`; what is worth building carefully is the four-step sequence F3 and F4
    assert — unmarked, marked, withdrawn, re-marked with different bytes. Write that test first and
    the implementation follows from it; write it last and the guard will be "marks when a fold
    exists" wearing a comparison.
  - >
    **Finding the summary in the assembled text is the load-bearing assumption and must be
    confirmed by call site.** It rests on `assemble` emitting a carried entry's text verbatim
    (`src/context.rs:685`) and on the fold's observation being entry zero. Confirm both by reading
    the code rather than by trusting this contract, and note that the collapse branch
    (`src/context.rs:722`) emits a count line whose number changes every step — a run in that state
    has no stable prefix and the guard should be seen to withhold the marker, not worked around.
  - >
    **Two body builders, two different image orders, and the difference is the point.** Budget time
    for reading both `user_content` functions rather than pattern-matching one; they were written to
    two vendors' guidance and the divergence is deliberate.
  - >
    **The live measurement carries three known traps and each has bitten before.** Pin the answering
    model and read it back from the response; expect no cache-write counter from OpenRouter; and
    keep the request small enough that a credit-limited account does not answer with a 402 — the
    OpenAI wire sends no `max_tokens`, so the vendor applies the model's own default.
  - >
    **Two sentences in the shipped documentation currently say the opposite of what this release
    does.** `src/provider/openai_wire.rs:80` and the 0.38.0 paragraph in `docs/CONTRACT.md` both
    state that the transcript deliberately carries no breakpoint. O3 greps for them; the cost is
    remembering that a doc comment on the function being edited is the easiest one to leave behind.
  preferred_tools:
  - >
    The existing body-builder tests (`src/provider/anthropic.rs:763`,
    `src/provider/openai_wire.rs:705`) as the model for F1, F2, F5 and F6. They already assert
    0.38.0's marker at exactly this altitude and in exactly this style.
  - >
    The recording fixture provider 0.42.0 and 0.43.0 both used for F3, F4 and F8. It records the
    `CompletionRequest` it was handed, which is the only place the boundary is observable. A second
    one would drift.
  - >
    `Compatible` pointed at OpenRouter's own base URL as F7's control — same endpoint, same model,
    one key different, no marker sent. Trap 106, and it is a ready-made control rather than a fixture
    to build.
  - >
    `Store::provider_calls` (`src/state.rs:3810`) and `Store::spend_by_run` (`src/state.rs:3934`) to
    read the live saving back. Both exist; neither is changed.
  constraints:
  - >
    No new dependency in the default build. MSRV stays 1.95.
  - >
    Exactly one public break, and it is `CompletionRequest`. `Assembled` (`src/context.rs:517`) is
    not `#[non_exhaustive]` and `Compaction` is deliberately not (`src/context.rs:379`); neither
    gains a field, which is what keeps the break count at one.
  - >
    `git diff main -- src/state.rs` is empty. No table, column, index or `CHECKPOINT_FORMAT` change.
  - >
    `docs/public-api.txt` is byte-identical.
  - >
    `WebFlavor::OpenAi` bodies — OpenAI's and all 21 `Compatible` endpoints' — are byte-identical to
    0.43.0's under every input.
  - >
    Nothing on the step path may change how compaction decides to fold, serialise 0.41.0's read
    batch, move a recorded artifact out of the model's call order, or change how often 0.42.0's
    `before_tool` hook is consulted.
  - >
    The crate never marks a prefix it has not already sent at least once.

risks:
- >
  **The guard may withhold the marker more often than expected, and the release would then be
  correct and worthless.** A run that writes memory notes frequently, or one whose stubs collapse
  (`src/context.rs:722`, where the emitted count changes every step), never presents the same prefix
  twice. Mitigation: F3 and F4 measure the transitions directly rather than asserting a rate, the
  live F7 shows the steady state on a run that does fold, and the honest answer if it withholds too
  often is a measurement this release produces and a decision — reordering the prompt, or excluding
  the memory block from the prefix — that a later one takes on evidence. The failure mode is lost
  saving, never lost money.
- >
  **A marked prefix that is not actually a prefix costs money instead of saving it.** If the split
  lands one byte off, or a block is trimmed, the vendor writes a cache entry that can never be hit
  and bills the write premium every turn. Mitigation: F1's concatenation assertion is byte-exact and
  is the release's single most important test; F6 covers the one wire where an image would silently
  put something ahead of the marked block.
- >
  **The vendor's minimum cacheable length makes the marker inert on a short prefix, silently.**
  Anthropic does not cache a prefix below its own floor and reports nothing about having declined.
  Mitigation: stated in `docs/CONTRACT.md` as a property rather than discovered from an invoice, and
  F7's live number is taken over a prefix comfortably above any published floor. This is 0.38.0's
  known limitation restated, not a new one.
- >
  **Two loops, one helper, and a guard whose state is per-loop.** If the run-scoped prefix is held in
  one loop and recomputed in the other, a flat run and a contained one cache differently and nothing
  fails. Mitigation: N6, plus the one-definition-two-call-sites shape assertion 0.41.0, 0.42.0 and
  0.43.0 each used — asserted by reading the source, not by trusting the diff.
- >
  **The live measurement depends on a third party and on an account's credit.** Mitigation: it is one
  criterion, its three traps are named in the cost drivers, and an unreachable vendor becomes a
  `known_limitations` line naming exactly what was not observed rather than a silent pass. Every
  structural claim is proven without a vendor.

open_questions:
- >
  How often the guard actually withholds the marker on a real long run. Worth recording during
  development as an observation — how many steps between the fold and the first mark, and how many
  withdrawals across a run that writes memory — rather than asserted as a criterion. It is the input
  to whether a later release should move the memory block out of the frozen prefix.
- >
  Whether the boundary should be re-offered after a *second* fold at the new summary, or held at the
  first. The plan is that it simply follows the current summary, since the guard makes a moved prefix
  safe; whether the resulting cache-write churn on a run that folds four or five times outweighs the
  reads is a question for a run long enough to show it, not for plan time.
- >
  Whether `cache_boundary` should eventually carry more than one offset, since Anthropic permits four
  breakpoints and this release uses two. Deferred: a second transcript breakpoint needs a second
  prefix this crate can show is stable, and it does not have one.
- >
  Whether an embedder will want to state a boundary of their own on a `CompletionRequest` they build
  directly. The field is public and takes one today, so the capability exists; whether the crate
  should document that as a supported use or as an implementation detail is a question for a caller
  who asks.
