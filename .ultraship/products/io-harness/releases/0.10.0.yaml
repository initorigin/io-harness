known_limitations:
- 'The record is sealed before the crates.io upload, which follows the two merges and the GitHub Release.
  `mode: published` states the authorized target.

  '
- 'The token figure the assembler enforces against is an ESTIMATE — four chars per token, computed in-crate,
  no tokenizer dependency. The trace records it beside the provider''s reported usage for the same request,
  and the live runs show the estimate running roughly 55-75% of what the provider charged for the whole
  request (which also carries the system prompt and tool schemas the estimate does not). The ceiling is
  therefore a bound on the observation section, not on the whole request.

  '
- 'Assembly bounds size and applies exactly two staleness rules. It does not promise the model sees everything
  relevant: an observation older than the current window is a stub, and a stub the model does not act
  on is information it does not have. The README says so.

  '
- 'A stale read is re-read on every subsequent turn, since history is immutable — so one `reread` trace
  row and one disk read per turn per stale path. Correct, and worth knowing before reading row counts.

  '
- 'Memory is a small keyed set the agent writes deliberately: 64 entries, 16,000 chars total, 2,000 chars
  per entry, oldest-first eviction. There is no retrieval, no ranking and no semantic recall, so a workspace
  with more to remember than that loses its oldest notes rather than its least useful ones.

  '
- 'A note one run writes is read by every later run over that workspace. Entries are attributed, bounded,
  rendered as the agent''s own notes rather than as directives, and listable and deletable through `Store`
  — but a wrong or planted note persists until someone removes it. This is the release''s main new trust
  surface and the README states it plainly.

  '
- 'Recency ordering for memory is millisecond-resolution, so two notes written in the same millisecond
  tie and fall back to insertion order. Deterministic and correct for the caps; a monotonic sequence column
  would be the fix if it ever matters.

  '
- 'Both 20-step live runs ended in `StepCapReached` with the model re-reading the same four files without
  writing. The observations were correct and current every turn, so this is a stalled agent rather than
  a context defect — precisely what 0.11.0''s stall detection and bounded replan are scoped to catch.
  Observed here rather than predicted.

  '
- 'Windows containment is still the portable floor with a wall-clock cap only; the Job Object needs a
  `windows-sys` binding and its own release. Unchanged from 0.9.1, and the manifest description — which
  still claimed "Windows Job Objects" as a shipped backend — was corrected in this release to say what
  Windows actually enforces.

  '
- 'The `Backend::WindowsJobObject` enum variant remains in the public API from 0.9.0 while nothing constructs
  it on the enforcement path. 0.9.1 made sure no trace claims it; removing the variant is a public break
  and belongs with the release that implements it.

  '
- 'The context section''s ceiling bounds observations and recalled notes. The task contract''s own goal,
  constraints and success criterion are always sent in full, by design — they are the task, not history
  — so a pathologically long goal string is not bounded by this release.

  '
