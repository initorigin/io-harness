known_limitations:
  - >-
    No execution sandbox — children still compile model-produced code directly on the host (the risk
    carried since 0.2.0), now multiplied by the fan-out factor. 0.5.0 bounds what the tree may touch and
    spend, not where code runs; per-run isolation is the very next release, 0.6.0.
  - >-
    No whole-tree crash-resume. 0.5.0 reuses 0.4.0's single-pending-action persistence; a process
    restart does not resume an in-flight fleet. Full tree checkpointing is 0.7.0.
  - >-
    Concurrent siblings share one workspace with last-write-wins — a decomposition that fans out onto
    overlapping files can corrupt state before 0.6.0's per-run sandbox brings real write isolation. The
    trace records both writes; the parent is expected to decompose to avoid collisions.
  - >-
    The aggregate ceiling overshoots slightly by design: when the tree budget is exhausted mid-flight,
    in-flight children finish their current step before stopping, so no child is left with a half-applied
    edit. The small overshoot is recorded honestly in the trace rather than prevented.
  - >-
    The spend ceiling is denominated in tokens as the hard, provider-agnostic ceiling; max_total_cost is
    an optional derived estimate only, and max_total_duration is optional wall-clock.
  - >-
    No per-agent provider or model selection — the whole tree runs under the provider given at root
    construction (deferred, not committed for 0.5.0).
  - >-
    No inter-agent coordination beyond parent<->child spawn and compose-back — no sibling messaging,
    shared mutable blackboard, or agent-to-agent RPC. Coordination is through the parent and the shared
    workspace only.
  - >-
    The aggregate budget ledger is a single shared lock — deliberately the one point of serialization,
    adequate for one-host in-process fan-out and not tuned for throughput beyond that.
  - >-
    mode is release-ready, not published: 0.5.0 is built, tested, documented, and packaged but not
    uploaded to crates.io; publish is deferred to the release/merge stage by owner decision, as for
    0.1.0-0.4.0. cargo publish --dry-run passes and CARGO_REGISTRY_TOKEN is available.
  - >-
    `Containment` field names are now a cross-repo serde contract the moment io-cli and io-studio adopt
    it, like `Policy` in 0.4.0; neither app has adopted it yet, so the composition value is unrealised
    until they do.
