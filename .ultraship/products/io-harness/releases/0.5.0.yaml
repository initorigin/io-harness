product: io-harness
version: 0.5.0
status: released
release_type: minor
outcome:
  user_can: >
    A developer hands io-harness one large task and a parent agent decomposes it at run time,
    spawning sub-agents on demand through a typed `spawn_agent` tool — up to a configured ceiling of
    100+ concurrently. Each child runs its own observe/reason/act/verify/stop loop (the 0.1.0–0.4.0
    loop, unchanged) over the same workspace root and writes into the same rusqlite trace, so the
    whole run is one auditable graph. A child receives a parent-supplied context brief and the shared
    workspace as its shared context; when it finishes, its outcome and a result summary compose back
    to the parent as the `spawn_agent` tool result, and the parent continues from there. A child may
    itself spawn children to a bounded nesting depth.

    The 0.4.0 `Policy` becomes the containment boundary. A child inherits its parent's effective
    policy and may only narrow it: child denies union with the parent's, and child allows are
    intersected with the parent's, so a child can never read, write, or execute anything its parent
    could not — deny-is-absolute now holds downward through the tree, not just across sibling layers.
    A new `Containment` value, handed in once at root construction, caps the whole tree with limits no
    spawned `TaskContract` can raise: maximum total agents, maximum concurrent agents, maximum nesting
    depth, and an aggregate spend ceiling (tokens, cost, wall-clock) drawn down by the entire tree
    together rather than per agent. A spawn that would exceed any cap is refused as a typed tool
    result the parent can adapt to, exactly as an out-of-policy action is in 0.4.0.

    Every spawn, every parent/child edge, every containment refusal, and every draw against the shared
    budget is recorded in rusqlite alongside the existing step, refusal, and decision trace, so the
    tree is reconstructable after the fact. A 0.4.0 single-agent run that never spawns still compiles
    and behaves exactly as it did, and the sensitive-action `Approver` from 0.4.0 serves the whole
    tree.
  business_value: >
    This is the release that turns io-harness from a single-agent harness into an agent-composition
    engine — the differentiator product.yaml names (provider-agnosticism plus agent composition plus
    extensibility, together). A single loop can only do work one step wide; large or parallelisable
    tasks — survey a hundred files, draft a hundred variants, fan out across a repository — need many
    agents a parent marshals on demand, which is exactly what io-cli's "run a big job" and io-studio's
    "watch a fleet work" both want and neither can build without a shared core. Doing composition here,
    once, is what stops both apps inventing incompatible spawning, budgeting, and containment models.

    Composition without containment is the dangerous version. A parent that can spawn 100 agents, each
    able to spawn 100 more, each free to widen its own permissions or set its own budget, is a runaway
    with no operator-held ceiling — the failure mode that makes people not trust an agent on real work.
    Making the 0.4.0 policy inherit-and-narrow-only, and putting a tree-wide spend ceiling above every
    task contract, is what lets a developer point a hundred agents at a task and still bound what the
    swarm can touch and what it can cost. It is also the foundation 0.7.0's 24h+ unattended runs stand
    on: a fleet you cannot bound is a fleet you cannot leave alone overnight.
  evidence_of_value: >
    Integration tests drive one parent contract that spawns several children over a shared workspace;
    the children's edits and the parent's compose-back reach a verified success, and the trace is
    asserted to contain the parent, each child, and the parent/child edges as one graph. A containment
    test shows a child attempting to widen its policy (allow a path the parent denies) being held to
    the parent's boundary, and a second shows a spawn beyond the agent-count cap refused while the
    in-budget children still complete. A spend-ceiling test runs a tree whose combined token draw
    crosses the aggregate ceiling and shows the tree stopped as a whole — not each agent at its own
    cap — with the halt attributed to the containment budget in the trace. A concurrency test spawns
    at or near the configured 100+ ceiling and asserts the run stays bounded by max-concurrent and
    completes. A 0.4.0 single-agent policy run is rerun unchanged and still reaches the same verified
    success.
scope:
  included:
    - >
      `spawn_agent` tool — a typed action the parent (and any nesting child) invokes to launch a
      sub-agent with its own goal, target file or workspace, verification, and optional
      narrowing constraints. Opt-in: the capability is present only when the root run is constructed
      with a `Containment`, so a 0.4.0 caller that constructs none gets no spawn tool and the exact
      0.4.0 surface.
    - >
      Child loop reuse — a child runs the existing observe/reason/act/verify/stop loop from
      `run.rs`, not a second implementation; spawning constructs a child `TaskContract` and runs the
      same loop under the shared store, workspace, provider, policy stack, and approver. Reuse is the
      point: a child that ran a different loop would need every 0.1.0–0.4.0 guarantee re-proven.
    - >
      Shared context — children share the workspace root and the single rusqlite `Store` (one trace
      for the whole tree), plus a parent-supplied context brief string passed at spawn. This is the
      "shared context" product.yaml requires, kept concrete: shared filesystem + shared trace + an
      explicit brief, not an implicit shared memory the parent cannot see or bound.
    - >
      Result compose-back — `spawn_agent` returns the child's `RunOutcome` and a result summary
      (produced paths, verified/failed, steps, spend used) to the parent as the tool result, so the
      parent's next model call reasons over what the child actually did rather than fire-and-forget.
    - >
      Concurrent fan-out to 100+ — a parent may request many children in one step; the harness runs
      them as bounded concurrent tokio tasks under `max_concurrent`, and a design target of 100+
      simultaneous agents is exercised by test. Spawns requested beyond `max_concurrent` queue;
      spawns beyond `max_total_agents` are refused.
    - >
      Bounded nesting — a child may spawn its own children; `max_depth` in `Containment` caps how
      deep, and a spawn past the depth cap is refused. Depth is counted from the root so a deep chain
      cannot evade the cap by resetting it.
    - >
      `Containment` value — handed in once at root construction, carrying `max_total_agents`,
      `max_concurrent`, `max_depth`, and an aggregate spend ceiling (`max_total_tokens`,
      optional `max_total_cost`, optional `max_total_duration`). Serde-serializable like `Policy`,
      so io-cli and io-studio load it from config rather than hand-building it.
    - >
      Containment merge — distinct from 0.4.0 layer merge. A child's effective policy is derived from
      the parent's by: denies union (child adds denies), allows intersect (a child allow grants
      nothing the parent lacked), sensitive-tier tightens only. Where 0.4.0's `Policy::merge` lets an
      overlay add allows, containment forbids it downward — a child cannot widen. This is the one new
      permission rule in the release and it has its own acceptance criteria.
    - >
      Tree-wide spend ceiling above the task contract — the aggregate budget is drawn down by the
      whole tree together and no spawned `TaskContract`'s `max_steps`/`max_tokens`/`max_duration` can
      raise it. A child contract may set a tighter per-child budget; it can never set a looser one
      than the tree has remaining. When the aggregate is exhausted, the tree halts and in-flight
      children stop at their next checkpoint — the halt is the tree's, not each agent hitting its own
      cap independently.
    - >
      Spawn refusal semantics — a spawn that would breach any containment cap (agents, concurrency
      queue-full-and-total-exceeded, depth, remaining budget, or a widened policy) returns a typed
      refusal to the requesting agent as its tool result, does not panic or abort the tree, and is
      recorded; the requesting agent can adapt, matching 0.4.0's refusal-as-tool-result.
    - >
      One approver for the tree — sensitive actions in any child route to the same `Approver` the
      root run was given (0.4.0 `Approve`/`Deny`/`Defer` unchanged), so containment and human approval
      compose rather than becoming two separate gates. A child's `Defer` persists and is resumable as
      in 0.4.0.
    - >
      Trace as a graph — the rusqlite schema gains agent nodes and parent/child edges: each run row
      carries a `parent_run_id` (null at the root), each spawn is a recorded event, each containment
      refusal and each budget draw is recorded with the agent it belongs to, so the whole tree is
      reconstructable and the aggregate spend is auditable after the fact.
    - >
      Deterministic aggregate accounting — the shared budget ledger is updated under a single lock so
      100 concurrent agents drawing on it cannot overspend past the ceiling through a race; the ledger
      is the one point of serialization and is deliberately simple.
    - >
      Public crate API additions under SemVer, backward compatible with 0.4.0 — `run_with`,
      `resume`, `resume_with_decision`, `Policy`, and `Approver` are unchanged; sub-agent support is
      a new root-construction path (e.g. a `run_tree`/`Containment`-carrying constructor) that a
      0.4.0 caller need not use, and an existing `run_with(...)` call still compiles and behaves as in
      0.4.0.
    - >
      Tests — containment merge units (allows intersect, denies union, no downward widening),
      spawn/compose-back integration over a shared workspace, agent-count and depth refusal tests, an
      aggregate spend-ceiling halt test, a concurrency test at the 100+ target, a graph-trace
      assertion test, and the unchanged 0.1.0–0.4.0 suite still green.
    - >
      Updated README and crate docs covering `spawn_agent`, `Containment` construction and its caps,
      the inherit-and-narrow containment rule versus 0.4.0 layer merge, the tree-wide spend ceiling,
      and a runnable example, packaged for 0.5.0.
    - >
      An example binary (as `examples/policy_run` did for 0.4.0) driving one live run where a parent
      spawns a handful of children over a shared workspace under a `Containment`, showing compose-back
      and one containment refusal end to end.
  excluded:
    - >
      Ephemeral local execution sandbox — children still run execution-based verification by
      compiling model-produced code directly on the host, the limitation carried since 0.2.0. Real
      per-run isolation is 0.6.0. This release bounds what the tree may touch and spend; it does not
      isolate where the code runs. Named as the sharpest known risk of running many agents.
    - >
      24h+ unattended autonomy and crash-resume of a whole tree — 0.5.0 reuses 0.4.0's single pending
      action persistence; full tree checkpointing so a restart resumes an in-flight fleet is 0.7.0.
    - Network egress policy and MCP/plugins/skills/office/media tools — 0.8.0.
    - >
      Inter-agent coordination beyond parent↔child spawn and compose-back — no sibling messaging,
      shared mutable blackboard, or agent-to-agent RPC. Coordination is through the parent and the
      shared workspace only. A richer coordination surface waits until a consumer needs it.
    - >
      Per-agent provider or model selection as a first-class feature — the tree runs under the
      provider given at root construction. If a child overriding the model falls out for free it may
      ship, but it is not a committed deliverable and gets no acceptance criteria.
    - >
      Distributed or multi-machine execution — the tree is in-process on one host, tokio tasks under
      one runtime, per product.yaml (local, single-user, single-tenant, embeddable library).
    - >
      Dynamic re-planning of the tree by the harness — decomposition is the parent model's job via
      `spawn_agent`; the harness runs and bounds the tree, it does not itself decide how to split a
      task.
    - Any spawn/fleet UI — io-cli and io-studio own how a fleet is displayed; the crate ships the mechanism and the graph trace they read.
    - Daemon/client mode and any network API — deferred per product.yaml.
    - Multi-user or role-based containment — single-user, single-tenant per product.yaml.
  fallback_scope:
    - >
      A parent spawns children sequentially (not concurrently), one level deep (no nesting), over the
      shared workspace and shared trace, with compose-back to the parent.
    - >
      Children inherit the parent policy under the containment merge (allows intersect, denies union)
      and cannot widen it — this is the release's core new guarantee and stays in the fallback.
    - A tree-wide aggregate spend ceiling above the task contract, halting the tree as a whole.
    - Spawn refusals (agent-count, depth, budget, widened policy) returned as typed tool results and recorded.
    - The one shared `Approver` serving the tree, unchanged from 0.4.0.
    - Parent/child edges and budget draws in the rusqlite trace as a graph.
    - Containment and compose-back integration tests over a shared-workspace task.
    - >
      (drop in this order if the release runs long — first the 100+ concurrency and its stress test,
      running children sequentially instead; then nesting past depth 1, keeping a single level of
      children. Concurrency goes first because sequential spawn already delivers a coherent "parent
      delegates contained sub-tasks" outcome and concurrency is a throughput property, not the
      boundary; nesting goes next because one level proves inherit-and-narrow just as well as many.
      The containment rule and the tree-wide ceiling never drop — they are why composition is safe,
      and 0.7.0's unattended runs depend on them.)
acceptance:
  functional:
    - >-
      A parent contract that spawns three children over a shared workspace reaches a verified
      success; each child's edit is present, the parent's compose-back used the children's results,
      and the trace contains the parent, all three children, and the parent/child edges.
    - >-
      `spawn_agent` returns the child's outcome and a result summary to the parent, proven by a test
      where the parent's success depends on a value only a child produced.
    - >-
      A child whose overlay allows a path the parent denies does not gain that path — a write the
      child attempts there is refused exactly as it would be for the parent, proving allows intersect
      downward.
    - >-
      A child whose overlay adds a deny the parent lacked is refused on that path, proving denies
      union downward and that a child may narrow.
    - >-
      A spawn beyond `max_total_agents` is refused as a typed tool result while the children spawned
      within the cap still complete to success; the refusal is in the trace attributed to the agent
      cap.
    - >-
      A spawn beyond `max_depth` is refused, and depth is counted from the root so a chain of children
      cannot reset it — a test drives a nesting chain to the cap and asserts the next spawn is refused.
    - >-
      A tree whose combined token draw crosses the aggregate `max_total_tokens` halts as a whole with
      the halt attributed to the containment budget, and no single child had individually exceeded its
      own contract budget — proving the ceiling is tree-wide, not per-agent.
    - >-
      A child `TaskContract` setting a larger `max_tokens` than the tree has remaining does not get
      the larger budget — the effective budget is the tree's remaining, proving a contract cannot
      raise the ceiling.
    - >-
      With `max_concurrent` set below the number of children requested in one step, no more than
      `max_concurrent` children run at once (asserted by an observed concurrency counter) and all
      requested children eventually complete.
    - >-
      A run configured at the 100+ concurrent target spawns and completes within its containment caps
      without deadlock or overspend, proving the fan-out target is real and bounded.
    - >-
      A sensitive action inside a child reaches the same `Approver` the root was given; `ApproveAll`
      lets it proceed and `DenyAll` stops that child, with the decision recorded against the child's
      run, proving one approver serves the tree.
    - >-
      A child that defers a sensitive action persists an `AwaitingApproval` pending action resumable
      by `resume_with_decision`, unchanged from 0.4.0.
    - >-
      Concurrent draws on the aggregate budget by many children do not overspend past the ceiling —
      a stress test with many small concurrent children asserts total recorded spend never exceeds
      `max_total_tokens`, proving the ledger race is closed.
    - >-
      A 0.4.0 single-agent run constructed without a `Containment` exposes no `spawn_agent` tool and
      reaches the same verified success it did in 0.4.0, proving sub-agents are opt-in and additive.
    - >-
      Every spawn, refusal, and budget draw is recorded so the tree is reconstructable from the store
      alone after the process ends — a test rebuilds the parent/child graph from a reopened store.
  non_functional:
    - >-
      `Containment`, the containment merge, and the sub-agent constructor are part of the documented
      public API under SemVer; existing 0.4.0 callers still compile unchanged, and the crate's
      provider-agnostic surface is preserved — no provider-specific type appears in the containment or
      trace API.
    - >-
      Containment enforcement lives in the harness (spawn path, tool layer, budget ledger), never in
      the prompt — a test asserts a child requesting a widened policy or an over-cap spawn is refused
      even when the model asks for it directly.
    - >-
      The containment rule is inherit-and-narrow only, downward through arbitrary depth: no child at
      any depth can hold an effective allow, or a looser budget, than the root granted. This is
      stated as an invariant and tested at depth > 1, not only parent→child.
    - >-
      The aggregate budget ledger is the single point of serialization for spend; it is a simple
      shared lock, documented as such, adequate for one-host in-process fan-out and not tuned for
      throughput beyond that.
    - >-
      Trace and refusal records never log file contents or API keys — agent ids, paths, commands,
      rules, layers, decisions, and token counts only, consistent with 0.4.0.
    - >-
      Concurrent children are awaited without blocking the tokio runtime, and a stuck or slow child
      is bounded by its own contract budget and by the tree's ceiling rather than hanging the tree.
  operational:
    - >-
      `cargo test` passes, including the containment merge units, spawn/compose-back integration, the
      agent-count/depth/budget refusal tests, the concurrency and overspend-race tests, the graph-trace
      test, and the unchanged 0.1.0–0.4.0 suite.
    - '`cargo clippy --all-targets` reports zero warnings.'
    - '`cargo publish --dry-run` succeeds with complete crate metadata for 0.5.0.'
    - >-
      README and crate docs document `spawn_agent`, `Containment` and every cap, the containment merge
      versus 0.4.0 layer merge, and the tree-wide spend ceiling, with a runnable example.
    - >-
      An example binary drives one live run where a parent spawns children over a shared workspace
      under a `Containment`, showing compose-back and one containment refusal end to end.
delivery:
  target_mode: release-ready
  environment: developer's local machine; the crate is built, tested, and packaged, not uploaded
  deployment_method: >
    Built and packaged locally — `cargo test`, `cargo clippy --all-targets`, `cargo build --release`,
    and `cargo publish --dry-run` all green, with the 0.5.0 crate metadata complete. Upload to
    crates.io stays deferred to the release/merge stage by owner decision, as for 0.1.0–0.4.0.
  migrations:
    - >
      Extend the rusqlite trace schema with a `parent_run_id` on runs (null at root), spawn-event
      records, containment-refusal records, and budget-draw records. Additive only — new columns and
      tables, no rewrites — so a 0.4.0 database migrates in place and a 0.4.0 binary still reads a
      migrated database.
  observability:
    - Every spawn recorded to rusqlite and emitted via tracing — parent agent, child agent, child goal, and depth.
    - Every containment refusal recorded with which cap it breached (agents, concurrency+total, depth, budget, or widened policy) and the requesting agent.
    - Every draw against the aggregate spend ceiling recorded with the agent and the running remaining budget, so the whole tree's cost is auditable live and after the fact.
    - The parent/child graph and aggregate spend are reconstructable from the store alone after the run.
  rollback: >
    Nothing is published, so rollback is `git revert` of the 0.5.0 branch before merge — the change
    lives only on `feat/0.5.0` until then. The rusqlite migration is additive (new columns and tables
    only), so it needs no down-migration and a 0.4.0 binary still reads a migrated database. At the
    library level, a caller reverts by dropping back to the 0.4.0 crate version; a caller who never
    constructs a `Containment` gets no sub-agent behaviour, so single-agent 0.4.0 usage is unaffected.
dependencies:
  products: []
  services:
    - OpenRouter API (model inference for the live example run)
  human_approvals:
    - Owner confirms 0.5.0 crate version metadata before packaging.
    - >
      Owner signs off the `Containment` serde field names before packaging — like `Policy` in 0.4.0
      they become a cross-repo contract io-cli and io-studio config depends on, and renaming one later
      breaks both.
    - >
      Owner confirms the 100+ concurrent-agent target for the stress test, since it sets the design
      point for the budget ledger and the tokio task fan-out.
resource_profile:
  complexity: large
  uncertainty: high
  likely_cost_drivers:
    - >
      Concurrency correctness at 100+ agents — a shared aggregate budget ledger drawn on by many
      tokio tasks without overspend, deadlock, or a slow child hanging the tree, is where a
      composition engine actually fails.
    - >
      The new containment merge (allows intersect, denies union, downward through arbitrary depth)
      sitting beside 0.4.0's layer merge (allows union) without the two being confused — a child that
      widens is a silent containment hole, so the two merges must be clearly separate code paths.
    - >
      Threading a tree-wide spend ceiling above per-contract budgets without letting a spawned
      contract raise it, and halting the whole tree cleanly when the aggregate is exhausted rather
      than each agent stopping independently.
    - >
      Reusing the single-agent loop for children without regressing any 0.1.0–0.4.0 guarantee, while
      adding the spawn path, compose-back, and shared store/workspace plumbing.
    - >
      Making the trace a real graph (parent/child edges, spawn and budget-draw events) that is
      reconstructable after the fact, and keeping it additive so 0.4.0 databases still open.
    - Keeping sub-agents strictly opt-in so a 0.4.0 caller's surface and behaviour are untouched.
  preferred_tools:
    - Rust, tokio (task fan-out, bounded concurrency), rusqlite, serde, tracing; existing own HTTP + SSE provider client.
  constraints:
    - Rust crate; async on tokio; state in rusqlite; own HTTP + SSE provider client.
    - Embeddable in-process library only; no daemon/client mode; in-process tree on one host.
    - Apache 2.0; runs locally, single-user, no hosted service.
risks:
  - >
    Scope — this is the largest release in the roadmap and its uncertainty is high. If it runs long,
    fallback_scope drops concurrency first (children run sequentially) and then nesting (one level),
    each a narrowing of one property rather than the removal of the containment boundary or the
    tree-wide ceiling, which never drop.
  - >
    A containment merge bug is a silent permission hole, not a visible failure — if a child can hold
    an effective allow the parent lacked, the whole boundary means nothing and nobody finds out until
    something is touched that should not have been. This is why allows-intersect-downward has its own
    acceptance criteria and is tested at depth > 1, and why containment merge must be a separate code
    path from 0.4.0's allow-union layer merge rather than a flag on it.
  - >
    Confusing the two merges is the specific trap: 0.4.0 overlays widen (allows union), containment
    narrows (allows intersect). A single merge function with a mode flag invites the wrong mode on a
    new call site. They are kept as distinct functions for this reason.
  - >
    The aggregate budget ledger is a shared-mutable-state race under 100+ concurrent draws. If the
    update is not serialized, the tree overspends past the ceiling — the exact operator guarantee the
    release exists to provide. The single-lock ledger and the concurrent-overspend stress test are the
    guard.
  - >
    Running many agents that compile model-produced code directly on the host, with no sandbox
    (0.6.0), multiplies the 0.2.0 execution risk by the fan-out factor. 0.5.0 bounds what the tree may
    touch and spend but not where code runs; this is called out as excluded so it is a decided
    deferral, not an oversight, and it is why the sandbox is the very next release.
  - >
    A spawned contract quietly raising its budget defeats the ceiling. The rule that a contract's
    budget can only tighten, never loosen, the tree's remaining is tested directly, because a swarm
    that can vote itself more money is not contained.
  - >
    A slow or stuck child hanging the whole tree. Each child is bounded by its own contract budget and
    by the tree ceiling, and children are awaited concurrently, so one child stalling does not block
    siblings — but this needs an explicit test, since it is the difference between a fleet and a
    deadlock.
  - >
    Depth counted per-hop instead of from the root would let a long chain evade `max_depth` by
    resetting depth at each spawn. Depth-from-root has its own acceptance criterion for exactly this.
  - >
    `Containment` becomes a cross-repo serde contract the moment io-cli and io-studio adopt it, like
    `Policy` in 0.4.0 — a field renamed later is a coordinated break. The owner sign-off on field
    names before packaging is the mitigation.
  - >
    Reusing the single-agent loop for children could regress a 0.1.0–0.4.0 guarantee if the shared
    store or workspace introduces interference between concurrent agents. The unchanged prior suite
    plus a shared-workspace concurrency test are the guard; if isolation between siblings' writes
    becomes necessary it points at 0.6.0's sandbox sooner.
open_questions:
  - >
    Do concurrent siblings writing the same workspace need write isolation, or is last-write-wins with
    the trace recording both acceptable for 0.5.0? Proposed acceptable for now (the parent decomposes
    to avoid collisions and the trace shows conflicts), with real isolation arriving as a side effect
    of 0.6.0's per-run sandbox — but a task that fans out onto overlapping files could corrupt state
    before then.
  - >
    When the aggregate ceiling is hit mid-flight, do in-flight children finish their current step or
    stop immediately? Proposed finish-current-step then stop, so no child is left with a half-applied
    edit, at the cost of a small overshoot past the ceiling that the trace records honestly.
  - >
    Is the spend ceiling denominated in tokens only, or also a currency cost derived from a per-model
    price? Proposed tokens as the hard ceiling (provider-agnostic, always available) with an optional
    cost ceiling when a price is supplied, since a token count is exact and a cost is a derived
    estimate.
  - >
    Should `max_concurrent` throttle spawns requested in one parent step (queue the overflow) or
    refuse them? Proposed queue up to `max_total_agents`, refuse only past the total — refusing a
    burst the parent legitimately wants would push scheduling into the model, which is the harness's
    job.
released_at: '2026-07-24T00:00:00Z'
mode: release-ready
delivered: >
  A developer hands io-harness one large task and a parent agent decomposes it at run time, spawning
  contained sub-agents on demand through a typed `spawn_agent` tool. Each child runs the same
  observe/reason/act/verify/stop loop from run.rs (not a second implementation) over the shared
  workspace root and the single rusqlite store, receives a parent-supplied context brief, and composes
  its RunOutcome plus a result summary back to the parent as the tool result. Children run as bounded
  concurrent tokio tasks under `max_concurrent` and may nest to `max_depth`, counted from the root. A
  `Containment` value handed in once at root construction caps the whole tree — max_total_agents,
  max_concurrent, max_depth, and an aggregate spend ceiling drawn down by the entire tree together —
  and no spawned TaskContract can raise it. The 0.4.0 Policy becomes the containment boundary: a child
  inherits its parent's effective policy and may only narrow it (denies union, allows intersect,
  sensitive tier tightens only), a separate code path from 0.4.0's widening layer merge, enforced in
  the harness and holding downward through arbitrary depth. A spawn breaching any cap returns a typed
  refusal the parent adapts to and is recorded, exactly as an out-of-policy action is in 0.4.0. One
  Approver serves the whole tree; a child Defer persists and resumes via resume_with_decision. Every
  spawn, parent/child edge, containment refusal, and budget draw is recorded in rusqlite (additive
  schema — a 0.4.0 database migrates in place), so the tree is a reconstructable graph. Sub-agents are
  opt-in: a 0.4.0 caller who constructs no Containment gets no spawn tool and the exact 0.4.0 surface
  and behaviour. Built, tested, documented, and packaged (release-ready); crates.io publish deferred to
  the release/merge stage by owner decision, as for 0.1.0-0.4.0.
evidence:
  tests:
