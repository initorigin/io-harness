known_limitations:
- >
  F5 is satisfied one step removed from its own wording. The criterion asks for the restored ledger
  to be asserted equal to the ledger an uninterrupted run held "on the ledger itself, not only on
  the resulting trace". There is no API that hands a caller a running run's in-memory `Ledger`, and
  exposing one to satisfy a test would be the wrong trade, so the assertion is made on the two
  surfaces that ledger produces: the observation section of the prompt the model was sent, and the
  durable rows. The prompt comparison is the one that carries the claim, and it was verified to fail
  when the restore is removed. The durable-row comparison alone is vacuous — it was written first,
  found to pass with the restore disabled, and kept only for what it does prove, which is that the
  watermark does not re-write what the restore just read.
- >
  F1's negative control is permanent rather than historical. The criterion described running the
  same scenario "through today's code path" to show the action performed. That path no longer
  exists after the fix, so the control is `resume_with` supplied with `Policy::permissive()`
  instead, which shows the same thing — the write lands when no boundary is supplied — and keeps
  working in every future release rather than only during this one.
- >
  The store cannot be observed in the state where the new tables are genuinely absent.
  `Store::from_conn` runs every `CREATE TABLE IF NOT EXISTS` before it returns, so a query against a
  missing table is unreachable through the public API. What the back-compatibility test proves is
  that a 0.12.0-shaped file — both tables dropped, verified absent through a raw connection first —
  opens, migrates and resumes. "Tolerates missing tables" is not a state the code can be in, and the
  CHANGELOG does not claim it.
- >
  The live run used one provider and one model (OpenRouter, openai/gpt-5.6-luna). It exercises the
  resume; the observer and recording paths are only incidental to it. A second provider would say
  more about portability and nothing more about this release's subject.
- >
  The record is sealed before the crates.io upload, which follows the develop->main merge and the
  GitHub Release per the repo's release order. `mode: published` states the authorized target; the
  flow makes it true.
- >
  The stored policy is written but there is no entry point that resumes from it without the caller
  supplying one. That was excluded deliberately — it would require deciding what happens when a
  stored policy and a passed policy disagree, and that question deserves a caller who has hit it.
- >
  The public surface diffs published for 0.11.0 and 0.12.0 were generated with a pattern that missed
  every indented item and every `async` entry point. Their conclusions stand — both were separately
  asserted to remove nothing — but their item counts are not comparable to this release's. Corrected
  method and the reasoning are recorded in evidence/0.13.0/public_surface_diff.md.
- >
  The Windows Job Object is still unimplemented; Windows containment remains the portable floor with
  a wall-clock cap only. It needs a `windows-sys` dependency scoped to
  `[target.'cfg(windows)'.dependencies]` and its own release.
