product: io-harness
version: 0.13.0
status: released
release_type: minor
outcome:
  user_can: >
    A developer who resumes an interrupted run gets the run they had, not a similar one.

    Resume today restores the durable half of a run — the step it reached, what it spent, how long
    it has been alive — and silently substitutes the rest. Two things go missing, and they are the
    same defect seen from two sides.

    The permission boundary. `resume` and `resume_observed` (src/run.rs:287-357) take no policy and
    no approver; in workspace mode they construct `Policy::permissive()` and pass `&ApproveAll`
    (src/run.rs:336, :346). A caller who started a run through `run_with` under a deny-by-default
    path policy, whose process then died, resumes into an agent with no boundary at all — same
    `run_id`, same goal, same trace, no policy. Nothing warns; the trace shows no refusals because
    nothing refused. There is no policy-preserving general resume to reach for instead:
    `resume_with_decision` (src/run.rs:368) does take a `policy` and an `approver`, but it demands a
    `request_id` and a pending `Decision`, so it serves only a run that paused for approval, not a
    run that crashed. `resume_tree` and `resume_tree_observed` (src/run.rs:1679, :1703) already take
    both — the flat workspace path is the one that does not, which is why this reads as an omission
    rather than a decision. The crate states the opposite principle sixty lines earlier: single-file
    mode refuses a policy loudly (src/run.rs:270-279) with the reason written out — "the caller would
    believe a boundary was enforced when nothing was checking. Refuse loudly instead." Resume does
    the thing that comment exists to prevent.

    The assembled context. The observation ledger the 0.10.0 context assembler builds
    (`context::Ledger`, src/context.rs:119, a `Vec<Observation>` of `step`/`kind`/`target`/`text`)
    lives in memory only, constructed fresh at src/run.rs:1242 in `run_workspace_from` and
    src/run.rs:1821 in `run_agent` — after `start_step` has already been resolved, so a resumed run
    starts blind by construction. It therefore re-derives its context from the workspace and asks the
    model a different question than the process before it would have. The agent usually recovers,
    which is why this survived five releases unnoticed; what it costs is that a resumed run is not
    comparable to an uninterrupted one, and 0.12.0's determinism work is the thing that finally made
    it visible (iterations/US-IO-HARNESS-0.12.0-I01, which cites the sites as :1183 and :1758 —
    correct when written, now :1242 and :1821).

    After this release: a resumed run carries the policy it was started under and the context it had.
    A policy-bearing resume exists for the flat workspace loop. A run that was started under a
    restrictive policy cannot be silently resumed without one — the bare `resume` refuses it rather
    than downgrading it. The ledger is durable and restored, so a 24-hour run that crashes at hour
    twenty continues with the context it had rather than a reconstruction. And a recorded case
    replays identically across an interruption in every loop rather than only the single-file one,
    which turns 0.12.0's honest refusal into a pass.
  business_value: >
    A permission boundary that a caller believes is enforced and is not is the most expensive kind of
    defect this crate can carry, because the failure is silent and the blast radius is the
    filesystem. Every other capability in the harness — sandboxing, path rules, command policy,
    approvals — exists to make an unattended agent safe to leave running. Resume is the feature that
    exists because those runs are long enough to be interrupted. The two meeting at a hole means the
    safety story only holds for runs that never crash, which is the opposite of the population it was
    built for. io-cli and io-studio are both being written against this crate now; a resume button is
    the obvious thing for either to grow, and it would ship the hole into two applications before
    anyone found it.

    Pulling this ahead of documents (now 0.14.0) is a deliberate ordering choice. Breadth over a
    boundary defect would have meant three more releases of Office, PDF, OCR, media and git tools —
    every one of them a new way for an agent to touch the world — layered on top of a resume that
    drops the rules governing exactly that. Fixing it first means every capability after it inherits
    a resume that holds.

    Merging the context-ledger fix (previously its own 0.16.0) into the same release is the second
    ordering choice, and it is about the code rather than the risk. Both halves are the same
    sentence — a resumed run should be the run it was — and both live in the same two entry points
    and the same two loops. Split across two releases they would mean editing `resume`, its observed
    twin, the workspace loop and the sub-agent loop twice, re-testing the resume matrix twice, and
    writing two migration notes for the same idea. One release touches resume once.

    There is also a smaller thing this closes. 0.12.0's replay shipped an honest boundary rather than
    a working one: a replayed workspace run that is interrupted refuses loudly because it cannot
    reproduce its own request. That refusal was the right call for 0.12.0 and it is a promise to fix,
    not a resting state — an evaluation harness that cannot survive an interruption cannot measure a
    24-hour run.
  evidence_of_value: >
    For the boundary: a run started under a deny-by-default policy, interrupted, and resumed through
    the policy-bearing entry point, where the agent then attempts the action the policy denies and is
    refused — with the refusal in the trace under the original `run_id`. The negative control is what
    makes it evidence rather than decoration: the same test run against today's `resume` must show
    the action PERFORMED, so the test is proven capable of detecting the defect it exists to prevent.

    For the downgrade: a run started under a restrictive policy and resumed through the bare
    `resume` fails with a typed error naming the run and the policy-bearing alternative, rather than
    running. And its complement — a run started permissively resumes through bare `resume`
    unchanged, so the refusal is scoped to runs that actually had a boundary and 0.7.0's resume
    contract still holds for everyone else.

    For the ledger: a recorded case driven to a step cap, resumed, and compared against the
    uninterrupted replay's canonical trace — asserted equal, for the workspace loop and the sub-agent
    loop, which is exactly the assertion
    `iterations/US-IO-HARNESS-0.12.0-I01` recorded as false and unfixable without checkpointing.
    `tests/determinism.rs` already contains the single-file version of this test passing and the
    workspace version documented as refusing; the release moves the second into the first's column.

    For the run being the same run: a resumed run's restored ledger asserted equal to the ledger the
    uninterrupted run held at the same step — the same observations in the same order, not merely a
    context of the same size.

    For the store: a 0.12.0 database opens under 0.13.0 and resumes, and a run checkpointed by 0.12.0
    (which has no persisted ledger and no persisted policy) resumes with the 0.12.0 behaviour and a
    recorded reason, rather than failing. `CHECKPOINT_FORMAT` stays 7 and is asserted to.

    And one live run against a real provider — the evidence 0.12.0 owed and never produced. A single
    workspace run under a real policy, killed mid-run and resumed, exercises the observer, the
    recording and the restored resume together on a path no fixture covers.
scope:
  included:
  - >
    A policy-bearing resume for the flat workspace loop. `resume_with` and `resume_with_observed`,
    taking `policy: &Policy` and `approver: &dyn Approver` in the positions `run_with` already uses
    (src/run.rs:200-218), so the pair reads as the resume twin of the run entry point. Additive: the
    existing `resume` and `resume_observed` keep their signatures and every 0.12.0 caller compiles
    unchanged. This is the house rule the crate already wrote down at src/lib.rs:250-253 — a new
    capability ships as a new named function, never as an added parameter — and it is why the fix is
    a new pair rather than a signature change. Both are added to the single `pub use run::{…}` at
    src/lib.rs:254-259, which is the crate's whole run surface.
  - >
    A persisted record of whether a run was started under a caller-enforced policy, so the bare
    `resume` can refuse rather than downgrade. `run_with_observed` already computes exactly this fact
    at src/run.rs:246 — `let caller_enforces = !policy.is_permissive()` — and currently uses it only
    to reject a policy in single-file mode. It becomes durable, and `resume` reads it.
  - >
    `resume` refuses a run that was started under a caller-enforced policy, with a typed error naming
    the run and pointing at `resume_with`. A run started permissively resumes exactly as it does
    today. This is the half that closes the hole for callers who never change their code — an
    additive `resume_with` alone would leave every existing `resume` call site silently permissive.
  - >
    The full policy is persisted, not just the boolean. `Policy` already derives `Serialize` and
    `Deserialize` (src/policy.rs:118), and its round-trip is already proven to enforce identically
    (src/policy.rs:539), so storing the whole thing costs the same as storing the flag. Nothing in
    the crate persists a `Policy` today; the closest is `spawns.deny_write` (src/state.rs:882,
    written :1470, read :1501), a JSON array of glob strings used to re-narrow a child at
    src/run.rs:2259-2261 — it carries no layers, effects, acts or defaults, and is not a precedent to
    copy. A stored policy is what lets a future release offer a resume that restores the original
    boundary without the caller re-supplying it, and it makes the trace answer "under what rules did
    this run actually execute" for an audit. This release does not add a restore-from-store entry
    point — the caller passes the policy — but it records the fact rather than throwing it away.
  - >
    `Layer` and `Defaults` are re-exported. src/lib.rs:244 exports `Act`, `Effect`, `Policy`, `Rule`
    and `Verdict` but not `Layer` or `Defaults`, so an external caller can serialize a `Policy` and
    cannot name the types inside it. Making a run's policy publicly readable (O3) without that is
    handing back a value nobody can destructure. Small, additive, and in scope because this release
    is the one that makes a stored policy a public fact.
  - >
    A durable observation ledger. `context::Ledger` gains a persisted representation and is restored
    at both construction sites (src/run.rs:1242, :1821) instead of starting empty, using the
    `context_events` pattern the store already established — a table, an event struct, a `record_*`
    writer, a `*_events(run_id)` reader (src/state.rs:934 for the schema, :1200/:1229 for the
    writer and reader). What is missing is narrower than it first appears and the release should say
    so: the ledger's *text* is already durable, because `text_for_step(step)` is written into
    `steps.result` at src/run.rs:1401 and :2041. What is not durable is the typed triple —
    `Observation.step`, `.kind`, `.target` (src/context.rs:92-101) — which is exactly what
    supersession needs (`target_is_the_subject`, src/context.rs:65). Reconstructing from
    `steps.result` would lose `kind` and `target` and produce a ledger that assembles differently.
  - >
    Serde derives on `context::Ledger`, `Observation` and `ObsKind` (src/context.rs:118, :91, :33) —
    none of the three has any today, and `src/context.rs` does not import serde at all. `ObsKind`
    already has a variant-to-string `label` (src/context.rs:74) with no inverse; whichever direction
    the table's `kind` column takes, the mapping must be total and pinned by a test, since a `kind`
    that fails to parse on restore is a silently shortened ledger.
  - >
    The ledger restore reaches both loops. The workspace loop and the sub-agent loop each build their
    own ledger; a fix that lands in one and not the other reproduces the defect at a different depth,
    where it is harder to see.
  - >
    Replay survives an interruption in every loop. 0.12.0's F10 shipped with its second half unmet;
    this release meets it and the refusal path it shipped instead becomes unreachable for the
    workspace and sub-agent loops — it stays as the honest behaviour for a request that genuinely was
    never recorded.
  - >
    The live-run evidence 0.12.0 owed. One real-provider workspace run, under a real policy, killed
    and resumed, with the transcript stored under evidence/0.13.0/.
  - >
    Documentation of the boundary that now exists: the resume entry points say what they preserve and
    what they do not, and the CHANGELOG carries a migration note for a caller who was relying on
    `resume` working on a policy-bearing run.
  excluded:
  - >
    A resume that restores the policy from the store and needs no policy argument. The stored policy
    makes it possible later; offering it now would mean deciding what happens when the stored policy
    and a passed policy disagree, and that question deserves a caller who has hit it. `resume_with`
    with an explicit argument is the shape that cannot be ambiguous.
  - >
    Any change to `resume_tree`, `resume_tree_observed`, `resume_with_decision` or
    `resume_tree_with_decision` beyond the ledger restore. All four already take a policy; their
    boundary is intact.
  - >
    Persisting the `Approver`. An approver is a live in-process decision-maker, not data; the caller
    supplies it on every entry point today and that stays true.
  - >
    Documents, Office, PDF and OCR. That is 0.14.0, and this release does not borrow from it.
  - >
    The README structural rewrite and the docs/ guide pages. That is 0.16.0. Doc changes here are
    confined to the resume surface this release changes.
  - >
    The Windows Job Object. Still deferred, still needs a `windows-sys` dependency scoped to
    `[target.'cfg(windows)'.dependencies]` and its own release.
  fallback_scope:
  - >
    The boundary half alone: `resume_with` plus its observed twin, the persisted caller-enforced
    fact, and `resume` refusing a policy-bearing run. That is a coherent release on its own — a
    developer can resume an interrupted run without losing the rules it ran under, and no caller can
    silently lose them. The ledger returns to its own version if it has to be cut, and the release is
    smaller, not broken.
acceptance:
  functional:
  - >
    F1 — a resumed run enforces the caller's policy. A workspace run started under a deny-by-default
    policy, interrupted, and resumed through `resume_with` refuses the denied action, records the
    refusal in the trace under the original `run_id`, and does not perform it. The negative control
    is an acceptance criterion, not an extra: the same scenario driven through today's code path must
    show the action performed, so the test is proven able to fail on exactly the defect it guards.
  - >
    F2 — the bare `resume` refuses a policy-bearing run. A run started through `run_with` under a
    non-permissive policy and resumed through `resume` returns a typed error that names the run and
    `resume_with`, performs no provider call, and leaves the run resumable. Asserted by the absence
    of a new step row and by a provider call counter at zero.
  - >
    F3 — the bare `resume` is unchanged for every run that had no boundary. A run started through
    `run`, `run_observed` or `run_with` with a permissive policy resumes through `resume` with a
    canonicalised trace byte-identical to 0.12.0's. 0.7.0's resume contract holds for everyone whose
    behaviour was already correct.
  - >
    F4 — the persisted policy round-trips. The policy a run was started under is recoverable from the
    store and equal to the one supplied, including its layers, for a layered policy and for a
    single-layer one. A permissive policy is stored as such and is distinguishable from no record at
    all.
  - >
    F5 — the ledger is restored, not re-derived. A resumed workspace run's ledger equals the ledger
    the uninterrupted run held at the same step: the same observations, in the same order. Asserted
    on the ledger itself, not only on the resulting trace, so a coincidental match cannot pass.
  - >
    F6 — the same holds for the sub-agent loop, at depth. A sub-agent run interrupted and resumed
    restores its own ledger, and the parent's ledger is unaffected by the child's restore.
  - >
    F7 — a recorded case replays identically across an interruption, in the workspace loop and the
    sub-agent loop. The canonicalised trace of the interrupted-then-resumed replay equals the
    uninterrupted replay's, which is 0.12.0's F10 second half, recorded as unmet in
    iterations/US-IO-HARNESS-0.12.0-I01. The single-file case that already passes must keep passing,
    asserted in the same test file.
  - >
    F8 — replay's refusal path stays honest where it is still correct. A replay asked for a request
    that genuinely was never recorded still fails loudly with 0.12.0's non-retryable error. The
    release removes the cause of the false refusals, not the refusal.
  - >
    F9 — every observation kind survives the round trip. All ten `ObsKind` variants
    (src/context.rs:34-54) persist and restore to an equal value, asserted variant by variant so
    adding an eleventh without extending the mapping fails the build or the test rather than
    shortening a ledger at runtime. A row whose kind does not parse is an error, not a skipped entry.
  non_functional:
  - >
    N1 — no schema break. `CHECKPOINT_FORMAT` stays 7, asserted by a test. Every new table is created
    with `CREATE TABLE IF NOT EXISTS` in `Store::from_conn`; no existing table is renamed, reshaped
    or has a column removed. A store written by 0.12.0 opens under 0.13.0 and every 0.12.0 test that
    reads the schema still passes.
  - >
    N2 — a 0.12.0 checkpoint still resumes. A run checkpointed by 0.12.0 has no persisted policy and
    no persisted ledger; resuming it under 0.13.0 behaves as 0.12.0 did — it does not refuse for a
    missing policy record, and it re-derives its context — and the degradation is recorded rather
    than silent. Absence must read as absence, never as "permissive" or "empty ledger asserted".
  - >
    N3 — the ledger persistence costs at most one write per step boundary, on the path that already
    commits a step. No new write on a step that does not commit, and no read of the ledger table
    outside resume.
  - >
    N4 — no new runtime dependency, and no new feature flag on an existing one.
  - >
    N5 — the additive API does not break a single existing caller. Every 0.12.0 entry point keeps its
    signature; the public-surface diff shows additions and no removals or changes, captured as
    evidence the way 0.10.0's was.
  - >
    N6 — five-leg CI green on the three-OS matrix plus msrv and lint, with the determinism leg
    included, since a trace comparison is the leg most sensitive to platform differences.
  operational:
  - >
    O1 — every resume entry point documents what it preserves and what it does not, in the doc
    comment, so the answer is at the call site rather than in the changelog. `resume`'s comment says
    it is for runs that had no policy and names `resume_with`.
  - >
    O2 — the CHANGELOG carries a migration note for the one behaviour that changes for an existing
    caller: `resume` on a policy-bearing run now errors. It names the fix (`resume_with`) and states
    why the error is the safer default.
  - >
    O3 — the persisted policy is readable for an audit: a finished run can answer what rules it ran
    under, from the crate's own API rather than by opening the SQLite file.
  - >
    O4 — the live-run transcript, the public-surface diff and the determinism comparison are stored
    under evidence/0.13.0/ in the shape previous releases used.
delivery:
  target_mode: published
  environment: >
    crates.io, plus the three-OS GitHub Actions matrix (ubuntu-latest, macos-latest, windows-latest)
    with the msrv and lint jobs.
  deployment_method: >
    The initorigin release flow with the owner's 2026-07-26 override in effect: all work including
    the sealed completion record on `feat/0.13.0`, PR to `develop`, release PR `develop` to `main`, a
    GitHub Release titled `io-harness 0.13.0` with notes taken verbatim from the CHANGELOG, then
    `cargo publish` last. The order is unchanged; the merges are performed without waiting for manual
    review.
  migrations:
  - >
    Additive only, in the shape the store already uses: a table for the run's policy record and a
    table for the ledger's durable events, both created idempotently in `Store::from_conn`, with
    `CHECKPOINT_FORMAT` left at 7 so a 0.12.0 store opens and a 0.12.0 checkpoint resumes. No
    existing table is renamed or reshaped.
  - >
    Rows written by 0.12.0 gain nothing retroactively. A run started by an older binary has no policy
    record and no ledger events; the read path reports that as absent and the resume path treats
    absent as 0.12.0 behaviour, which is the only interpretation that cannot invent a boundary that
    was never there.
  - >
    A behavioural migration for callers, not a data one: `resume` on a run that was started under a
    non-permissive policy now returns an error where it previously ran permissively. A caller
    upgrades by calling `resume_with` with the policy they already have. Documented in the CHANGELOG
    with the reason.
  observability:
  - >
    The policy record makes a run's rules part of the durable trace for the first time. A refusal was
    already recorded; the rules that produced it were not.
  - >
    The ledger's durable events are readable per run through the same `*_events(run_id)` shape as
    `context_events`, so what a resumed run restored is inspectable rather than inferred.
  - >
    A refused resume is a typed error and a `tracing` event, not a silent no-op, so an operator sees
    why a resume did not start.
  rollback: >
    `cargo yank --vers 0.13.0`, leaving 0.12.0 as what `cargo install` and a fresh `cargo add`
    resolve to. A consumer rolling back loses `resume_with` and gets the permissive resume back;
    their store keeps the two additive tables, which 0.12.0 ignores. The asymmetry to state plainly:
    rolling back re-opens the boundary hole, so a consumer who rolled back and resumes a
    policy-bearing run is unprotected again — the rollback is safe for the data and not for the
    guarantee. As with previous releases, roll back between runs rather than during one.
dependencies:
  products:
  - >
    io-cli and io-studio are both being rebuilt and neither is a blocker; this release changes the
    resume surface they will build against, which is the argument for landing it before they do.
  - >
    io-eval does not exist yet, so there is no consumer to break. The additive-only schema discipline
    is kept anyway: it costs nothing now and keeps the choice open.
  services:
  - >
    A provider API key, for the live-run evidence only — including the 0.12.0 live run this release
    absorbs. Every functional criterion runs against fixtures and recordings.
  - >
    GitHub Actions for the three-OS matrix. The determinism comparison is the leg most likely to
    differ across platforms.
  human_approvals:
  - >
    None. The owner's 2026-07-26 override authorizes the PRs, both merges, the GitHub Release and
    `cargo publish` without a review stop, and engineering decisions inside the release are made and
    recorded rather than referred.
resource_profile:
  complexity: medium
  uncertainty: medium
  likely_cost_drivers:
  - >
    Deciding what "the ledger" durably is. It is an in-memory accumulation of assembled observations,
    and its durable form is a design choice, not a serialisation chore: store the assembled result
    and a later change to the assembler makes old rows lie; store the inputs and the restore has to
    re-run assembly deterministically. Settle this against the 0.10.0 assembler BEFORE writing the
    table, the way 0.11.0 settled the error kind first.
  - >
    The resume test matrix is the real volume. Two loops, times interrupted and uninterrupted, times
    policy-bearing and permissive, times replay and live, plus the 0.12.0-checkpoint compatibility
    case. Most of the release's diff will be tests, and that is correct.
  - >
    The negative controls. F1 and F7 both require proving a test can fail on the defect, which means
    keeping the old path reachable long enough to assert against it.
  - >
    `resume` changing behaviour for one class of caller is the only public break, and getting its
    error message right — naming the run, the alternative, and why — is worth more attention than its
    size suggests. It is the message a developer meets at the moment their production resume stops
    working.
  preferred_tools:
  - '`context_events` end to end as the template for both new tables: the schema at src/state.rs:934,
    the `ContextEvent` struct at :618 with its named constructors, `record_context_event` at :1200,
    and `context_events(run_id)` at :1229 with its `ORDER BY id ASC`. The three verbatim comments at
    src/state.rs:907, :927 and :945 state the additive rule; :930 and :964 state why
    `CHECKPOINT_FORMAT` (src/state.rs:16, gated at :1524) must not move.'
  - '`run_with` / `run_with_observed` (src/run.rs:200-218) as the shape `resume_with` mirrors, and
    `resume_tree` (src/run.rs:1679) as proof that a policy-bearing resume signature already reads
    naturally in this crate. `caller_enforces` at src/run.rs:246 is the fact to make durable.'
  - '`#[serde(default = "deny")]` on `Defaults.net` (src/policy.rs:91, fallback at :96) as the
    established precedent for adding a field without breaking older stored JSON — the pattern to
    follow if the persisted policy ever grows.'
  - '`tests/determinism.rs`, which holds both ends of the ledger half: `:307` asserts a resumed
    replay reports divergence (the behaviour to replace) and `:375` asserts a single-file replay
    survives interrupt-and-resume (the behaviour to generalise).'
  - '`tests/checkpoint.rs` as the resume suite to extend — ten resume sites including a real SIGKILL
    at :168, a tree crash at :441 and a tree approval across restart at :520. Note the gaps this
    release must fill: no test anywhere asserts a policy across a plain `resume`, and
    `tests/context.rs` and `tests/memory.rs` contain no resume coverage at all.'
  - iterations/US-IO-HARNESS-0.12.0-I01, which is the audit for the ledger half. Re-deriving it is
    waste — but its `src/run.rs:1183`/`:1758` citations have drifted to `:1242`/`:1821`.
  - rustc/cargo, clippy, rustfmt, and the three-OS matrix via `gh run view`.
  constraints:
  - 'Additive schema only: `CREATE TABLE IF NOT EXISTS` in `Store::from_conn`, `CHECKPOINT_FORMAT`
    stays 7, no existing table renamed or reshaped.'
  - Reuse the `context_events` pattern rather than inventing new machinery.
  - No new runtime dependency.
  - >
    A run that never had a policy and is never interrupted must behave exactly as it does under
    0.12.0. This release changes what a resume preserves; it must not change what an ordinary run
    does.
  - >
    Absence in the store means absence. A 0.12.0 run with no policy record must never be read as
    "permissive" — the two are different facts and conflating them would invent a boundary decision
    that nobody made.
  - >
    Minor semantics on a 0.x crate: `resume`'s new error on a policy-bearing run is a permitted
    break, documented with a migration note, and it is the only public break this release takes. The
    crate stays pre-1.0 and no 1.0.0 is planned or implied.
  - >
    Scope discipline against 0.14.0 and 0.16.0: no document tooling, no README restructure.
risks:
- >
  The durable ledger is shaped as "whatever serialises easily" and a later change to the 0.10.0
  assembler silently invalidates every stored row, so a resumed run restores a context that is
  wrong rather than merely stale — which is worse than today's honest re-derivation. Mitigation:
  decide inputs-versus-assembled-result first and write the decision into the release, and make F5
  assert the restored ledger equals the uninterrupted one rather than merely being non-empty.
- >
  `resume` refusing a policy-bearing run breaks a caller in production who was, in effect, relying on
  the permissive downgrade to make their resume work at all. This is intended and it is still a
  break. Mitigation: F3 keeps every permissive caller working, the error names the exact fix, and the
  CHANGELOG migration note is an acceptance criterion (O2) rather than a courtesy.
- >
  The fix lands in the flat workspace loop and not the sub-agent loop, or the other way round, and
  the defect survives at a depth where nobody looks. Mitigation: F6 and F7 both require the sub-agent
  loop explicitly, and the ledger's two construction sites (src/run.rs:1183, :1758) are named in
  scope so neither can be forgotten.
- >
  Persisting a policy per run turns out to interact with the layered composition 0.4.0 built, so what
  is stored is not what was enforced. Mitigation: F4 asserts the round-trip on a layered policy
  specifically, not only on a flat one.
- >
  A `kind` string fails to parse on restore and the ledger comes back silently shorter than it was,
  which is the one failure mode worse than today's honest re-derivation because it looks like a
  successful restore. `ObsKind` has a `label` (src/context.rs:74) and no inverse, and
  `context_events.kind` is free text with no constraint (src/state.rs:934). Mitigation: the mapping
  is total and pinned by a test, and an unparseable row is an error rather than a skipped entry.
- >
  A naming collision on `Ledger`. `containment::Ledger` already owns the bare name at the crate root
  (src/lib.rs:233) while `context::Ledger` is reachable only as `io_harness::context::Ledger` and is
  imported into run.rs aliased as `ContextLedger` (src/run.rs:21). Mitigation: the durable type and
  any new export are named for the context ledger explicitly; do not root-export a second `Ledger`.
- >
  The release quietly grows into "make resume perfect" — restoring the sandbox, the MCP session, the
  provider fallback state. Mitigation: the excluded list is explicit and the fallback scope is the
  boundary half alone; anything discovered beyond policy and ledger is recorded as an iteration, not
  absorbed.
open_questions:
- >
  Does the durable ledger get its own table, or is it reconstructed from `steps.result`? The audit
  narrowed this: `text_for_step` is already written to `steps.result` at src/run.rs:1401 and :2041,
  so the text survives a crash and only the typed `(step, kind, target)` triple is lost.
  Reconstruction is therefore *nearly* possible and would add no table — but it would lose `kind` and
  `target`, which supersession reads (src/context.rs:65), so a reconstructed ledger would assemble
  differently from the one it replaced. The expectation is a table storing the `Observation` triple,
  with the text either stored alongside or joined from `steps.result`; settle it first, in
  development, against the 0.10.0 assembler. Whichever is chosen, F5 is the test that decides it,
  because it compares the restored ledger to the real one rather than to a plausible one.
- >
  Should the persisted policy be exposed as a public read (`Store::run_policy(run_id)`) in this
  release, or only written? O3 asks for it to be readable for an audit; the smaller alternative is to
  write it now and expose the reader when a consumer asks. Decide in development, defaulting to
  exposing it, since a fact recorded and unreadable from the API is the coupling 0.12.0's outcome
  record existed to remove.
- >
  Does `resume` refuse a policy-bearing run, or resume it under the stored policy? Refusal is
  specified here because it cannot be wrong — an explicit argument beats a rule about which of two
  policies wins. If development finds the stored policy is faithful enough to enforce directly, that
  is an iteration with evidence, not a quiet substitution.
released_at: 2026-07-27T02:35:00Z
mode: published
delivered: >
  A developer who resumes an interrupted run gets the run they had. `resume_with` and
  `resume_with_observed` resume under the caller's policy; the bare `resume` refuses a run that was
  started under a policy rather than continuing it permissively; the policy a run was started under
  is durable and readable; and the observation ledger is durable and restored in both the workspace
  and sub-agent loops, so a resumed run asks the model what the uninterrupted one would have.
  Proven live: a real model tried to read a denied path on a resume-driven step and was refused.
