known_limitations:
- >
  **This record was sealed before the crates.io upload.** `mode: published` is the release's target
  and the flow's last step: the develop merge, the main merge and the GitHub Release all come after
  the record rides the `feat/0.32.0` commit, and `cargo publish --locked` comes after those. Sealing
  it `release-ready` and correcting it later would mean editing an immutable record, which is worse.
- >
  **The concurrency ceiling is per tier, not per tree.** A tree of depth *d* can hold up to
  `max_concurrent_agents * d` agents working at once. That is the deadlock argument rather than an
  oversight — a parent holds a slot at its own tier and waits only on the tier below, so the wait
  graph cannot contain a cycle — but a reader who takes the field name as tree-global will be wrong.
  Stated on the field, in `docs/CONTRACT.md`, in the composition guide and in the changelog.
- >
  **The queue is FIFO and has no other policy.** No priority, no reordering, no way for an
  application to promote or cancel a waiting child, and no fairness rule between the parents feeding
  one tier. A queue with a policy is a scheduler and this is not one.
- >
  **A queued child is invisible everywhere except `Store::queued_agents`.** That is the other side of
  "never started, never charged": it has no run id, so `Store::children` will not list it,
  `Store::agent_events` has nothing to say about it, and it emits no events of its own until it is
  admitted.
- >
  **N2's control column was wrong as written and the substance was met another way.** The criterion
  named a control filtering on `goal` alone; `goal` is the index's last column and SQLite still uses
  the index for it, skip-scanning `ANY(parent_run_id) AND ANY(step) AND goal=?` — a full read wearing
  an index's name. The control is `queued_at`, which is in no index at all. The claim the criterion
  exists to make (a control that proves the check discriminates an index from a scan) holds; its
  example column did not.
- >
  **`Containment::max_total_cost` is still inert**, for the reason it has always been inert: there is
  no price telemetry, so any figure the harness compared against would be one it invented.
- >
  **The 0.30.0 N2 wording is still over-claimed and still not silently re-claimed.** Counting every
  row is what the aggregate answer is; the measured figures at 20k runs stand and materialised
  counters remain a different release.
supersedes: 0.31.0
next_recommended_version: 0.33.0
immutable: true
