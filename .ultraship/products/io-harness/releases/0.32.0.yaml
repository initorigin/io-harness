    Ten tests in `tests/fleet.rs`, ten unit tests across `src/containment.rs` and `src/state.rs`, and
    the 14 pre-existing `tests/subagents.rs` tests unchanged and green — including
    `concurrent_fanout_to_over_100_stays_bounded_and_completes`, whose 120-child fan-out now runs
