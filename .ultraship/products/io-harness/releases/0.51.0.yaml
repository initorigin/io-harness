  or renamed, and the count was not the claim.
- >
  **A fourth public addition the contract did not name: `Edit::with_hunk` is `pub`, not
  `pub(crate)`.** It was written crate-private and `Store::patch`'s own doctest could not call it —
  a doctest compiles as an external crate. Making it public is the coherent answer rather than a
  workaround: `Edit::measure` and `Store::record_edit` are already public, so a caller recording its
  own edit rows would otherwise be able to write a count and never a change, which makes
  `Store::patch` useless to them. It adds no line to `docs/public-api.txt`, which enumerates
  crate-root re-exports and not methods.
- >
  **F2's sabotage failed nothing on its first attempt, and the corpus was strengthened rather than
  the sabotage abandoned.** Measuring the line counts from the whole-file texts passed the original
  five-case corpus, because for a tidy whole-line edit the two measures agree — trimming the common
  head and tail of the fragment finds the same changed span as trimming them over the file. A
  brute-force search over 400,000 single-substring replacements found the class that diverges: a
  replacement that does not begin and end on a line boundary. Deleting a substring *inside* a line is
  (0 added, 1 removed) over the fragment and (1, 1) over the file. Two such cases joined the corpus
  and the sabotage then failed the named test and only it. **The honest consequence: for most edits
  the two measures coincide, so "the counts did not move" is a narrower claim than it sounds — it is
  exact, and it bites only on off-boundary replacements.**
- >
  **F3's first fixture was too weak to catch its own sabotage.** Every hunk replaced one line with
  one line, so a running-rewrite applier accumulated no drift and passed. The fixture now adds a line
  in its first hunk and removes one in its third, and the reason is written into the test's own doc
  comment so the next person does not weaken it back.
- >
  **The stored hunk is one head-and-tail-trimmed hunk per edit, not a minimal diff.** For an
  `edit_file` — one contiguous replacement by construction — it *is* the minimal diff. For a
  `write_file` that rewrote two distant regions of a file it is one hunk spanning both: a valid
  unified diff that reverse-applies exactly, and not the shortest one. A Myers or patience diff is a
  dependency or several hundred lines, and it buys shorter output rather than a capability.
- >
  **`patch_file` matches every hunk at its own recorded position, exactly, with no fuzz and no
  offset search.** A patch written against a file that has since moved by even one line is refused
  rather than relocated. That is deliberate on an all-or-nothing write path, and it means a model
  must write its patch against a current read. Real `git diff` output satisfies it; a
  hand-shifted patch does not.
- >
  **The `check` tool runs its checker outside the run's containment**, exactly as the automatic
  post-edit checker has since 0.46.0. It is policy-gated — which the automatic one is not — but it is
  not sandboxed, so `Act::Exec` is the whole of the boundary on it. Bringing both under
  `TaskContract::exec_sandbox` is its own change and was not made here.
- >
  **`rewind_step` is an operator-facing API and not a tool.** No model can call it, so nothing tells
  a model that the workspace moved under it. If it is ever exposed as a tool, the gate story and the
  question of re-running the checker after a revert both change.
- >
  **Walking a run back is the caller's loop, and there is no automatic ordering.** Reverting out of
  order reports `Reverted::Stale` and changes nothing, which is safe but silent about what to do
  next; the newest-first rule is documented at the function, in `docs/CONTRACT.md`, in the guide and
  in the changelog rather than enforced.
- >
  **O1 — the three-platform matrix has NOT run.** Every gate above is macOS. A hand-written
  unified-diff parser is precisely the code that passes on the host that wrote the fixture and fails
  on the one with different line endings, which is why the CRLF and final-newline cases are asserted
  explicitly and why the criterion says outright that a green macOS gate is not evidence here. The
  matrix runs on the release PR.
- >
  **One flake on the first `--all-features` run, and it is the ninth of a family already recorded.**
  `a_handle_takes_the_cpu_cap_a_foreground_stage_takes` — a 0.48.0 containment test — reported a
  spinning `awk` still `running` after the CPU cap should have ended it, on a machine that had just
  built the whole all-features tree. It passed alone (5 of 5) and in the default suite. Nothing in
  this release touches the handle or sandbox path. The suite was re-run with `--no-fail-fast` and was
  green.
- >
  **One ordering to state rather than gloss.** The nightly rustdoc gate's fix — a doc-comment link in
  `src/state.rs` — landed after the two suites had run. It cannot change behaviour, but rather than
  assert that, `cargo test --doc` was re-run against the shipped tree (425 passed, exit 0) and
  `cargo package` compiled the packaged crate from it.
