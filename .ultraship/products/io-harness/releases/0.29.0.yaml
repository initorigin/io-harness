    exactly those two. `f2_every_named_constructor_agrees_with_its_table_row` drives all 21
    constructors against the table, which is also what proves `Compatible::known`'s expect
    unreachable. `f2_an_unknown_preset_is_refused_naming_the_ones_that_exist` — "grok" surfaces
