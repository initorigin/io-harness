known_limitations:
- >
  **`Compatible` is not a compatibility layer, and every vendor behind it diverges somewhere.** The
  crate sends one wire and will not grow per-vendor branches — that is the structural claim the
  single type rests on. The divergences are stated in `docs/CONTRACT.md` rather than absorbed:
  Zhipu's out-of-set `finish_reason` values, Groq's 400 on `messages[].name`, Mistral's
  nine-character tool-call ids and `schema_definition` field, DeepSeek's 400 when `reasoning_content`
  is not replayed on a request carrying tools, and Ollama silently ignoring `tool_choice`.
- >
  **vLLM and SGLang emit no tool calls at all unless the server was started with a tool-call parser
  flag, and this is the failure mode that does not announce itself.** No status code, no warning and
  nothing in the trace distinguishes it from a model that chose to answer in prose. vLLM needs
  `--enable-auto-tool-choice` with a `--tool-call-parser`; SGLang needs its equivalent. Both are
  server launch arguments this crate cannot supply, cannot detect, and will not guess at.
- >
  **Nearly every vendor's `/models` returns identifiers and no prices.** That is why
  `ModelInfo::price` is an `Option` and why the reference catalogue exists at all. Perplexity serves
  no `/models` endpoint whatsoever, so `Compatible::perplexity(..).models()` returns the vendor's 404
  as a provider error rather than an empty list — reporting an empty catalogue there would say "this
  vendor serves no models", which is a different and false claim.
- >
  **A reference price is the aggregator's price, not the vendor's.** It tracks the vendor's rate and
  is not identical to it. `PriceSource::Reference(host)` is how an operator tells; a figure derived
  from it is close rather than authoritative, and the crate does not pretend otherwise.
- >
  **A model the reference does not carry stays unpriced.** Matching is an exact slug or one
  documented normalisation — drop a single leading `vendor/` segment, case-insensitively — and
  nothing else. An ambiguous normalisation resolves to nothing rather than to either candidate.
  `Spend::unpriced_calls` is where the gap surfaces, and it is a floor rather than a total.
- >
  **The catalogue is cached on the provider instance, not in the store, and this departs from the
  roadmap entry deliberately.** That entry said "cached in the store with the instant it was
  fetched". `Provider::models()` takes `&self` and nothing else, so reaching a `Store` from it would
  have meant putting the store into the provider trait — the one type this crate has kept out of it.
  The fetch instant is not lost by the choice: it lands on `PriceTable::as_of`, which already exists
  to carry exactly that claim. A second process re-reads one free keyless request.
- >
  **`Compatible` has no `from_env()`, unlike the three original providers.** Twenty-one vendor
  environment variable names would be twenty-one guesses made on the operator's behalf.
  `[[provider]]` with `api_key = "${env:GROQ_API_KEY}"` names the variable in the operator's own
  file and has resolved credentials from the environment since 0.19.0. The guide says so in one
  line, because the absence will otherwise read as an oversight.
- >
  **`Fallback::models()` returns an empty list.** Which of two vendors' catalogues a chain should
  report is a question with no right answer, and inventing one would freeze it. A caller who wants a
  chain's catalogue asks each provider.
- >
  **A preset's base URL is a default this crate ships, and a vendor that moves one makes it wrong
  until the next release.** Every one was verified against the live host at release time, but no test
  can dial them and none does. The mitigation is that `base_url` overrides any preset in one line of
  configuration, so a moved endpoint is an operator's edit rather than a release.
- >
  **A preset's local-runtime port is that project's documented default and nothing more.** A runtime
  started on another port is `Compatible::new` with the URL.
- >
  **`Auth` carries no Azure variant.** Azure OpenAI needs an `api-key` header, a deployment name in
  the path and an `api-version` query parameter. It is excluded on demand rather than on cost, and
  `Auth` is `#[non_exhaustive]` so it can arrive later without a break. Bedrock's SigV4 and Vertex's
  service-account JWT are likewise unreachable, though both are usable today by an application that
  mints a bearer token itself and passes it as the key.
- >
  **Price tiers are keyed on prompt length only.** `min_prompt_tokens` is the single selector the
  observed catalogue uses, and the highest floor a prompt reaches prices the whole request. A vendor
  pricing on some other axis — output length, time of day, committed throughput — is not
  representable, and would be a new selector rather than a new value.
- >
  **`${cmd:}` still has no timeout**, and `rusqlite::Error` is still in the public API. Both are
  standing limitations carried deliberately from earlier releases rather than fixed by proximity.
- >
  The record is sealed with `mode: published` before the crates.io upload, which follows the
  `develop` → `main` merge and the GitHub Release. The record states the authorised target; the flow
  makes it true.
