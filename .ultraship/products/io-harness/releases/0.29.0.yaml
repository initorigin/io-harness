    `f4_the_conversion_is_not_a_float_multiply` **failed**, correctly reporting that the table did
    not discriminate. Ten live catalogue values were then found where
    `(s.parse::<f64>()? * 1e12) as u64` truncates one micro-unit low — `0.00000003` is
    qwen/qwen3.7-flash's own prompt rate — and the control now asserts the disagreeing set equals
    `FLOAT_TRAPS` exactly and that `naive + 1 == exact` for each. A control that discriminates on
