  - >
    F3 — `provider::catalogue_default::a_provider_that_overrides_nothing_reports_an_empty_catalogue`
    implements `Provider` with `complete` and nothing else, exactly the shape the trait's own doc
    example ships. Its named control is
    `compatible::tests::f3_a_connected_provider_returns_a_non_empty_catalogue`, without which the
