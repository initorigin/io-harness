  - >
    F5 — exact slug, case-insensitive, plus the one normalisation, with three named controls:
    `f5_a_model_the_reference_does_not_carry_stays_none` (the roadmap's own `deepseek-v4-flash`
    example), `f5_an_ambiguous_normalisation_is_a_miss_not_a_first_wins` (both entries still
    reachable by exact slug), and `f5_normalisation_is_not_applied_in_the_other_direction`.
  - >
    F6 — `f6_a_reference_price_fills_a_gap_and_says_it_is_a_reference_price`, and
    `every_price_carries_its_provenance_and_the_two_cannot_disagree` asserts
    `price.is_some() == price_source.is_some()` across a whole parsed catalogue rather than on one
    row. The control is a model the reference does not carry, left `None` rather than guessed.
  - >
    F7 — `f7_the_reference_lookup_is_off_until_it_is_asked_for` uses a recording reference server: a
    provider that did not opt in leaves the log **empty** and reports one endpoint, and one that
    opted in reports two and dials it exactly once. An empty log is proof a return value cannot give.
  - >
    F8 — `tests/parity.rs` drives four providers under the identical contract, the fourth name
    produced by a real `Compatible::groq(..).name()` rather than typed in, with the three existing
    ones running unchanged in the same loop as the control.
    `f8_the_real_compatible_carries_the_trait_shape_the_loop_drives` passes a real provider through a
    helper declaring exactly `run`'s `P: Provider` bound, so trait fit is compiler-checked;
    `f8_a_compatible_pointed_at_no_preset_claims_no_vendor_label` rules out a label that is constant
