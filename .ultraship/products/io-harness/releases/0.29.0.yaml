product: io-harness
version: 0.29.0
release_type: minor
status: planned
outcome:
  user_can: >
    Run against any OpenAI-shaped endpoint by naming a base URL, a key and a model — so Groq, xAI,
    Mistral, DeepSeek, Together, Fireworks, Cerebras, Perplexity, Gemini through its compatibility
    endpoint, Moonshot, Zhipu, Qwen and MiniMax are reachable without writing a provider, and so are
    the runtimes a developer starts on their own machine: Ollama, llama.cpp, vLLM, LM Studio,
    LocalAI, Jan, SGLang and KoboldCpp. A model on the developer's laptop is the half that has no
    equivalent today, and it is the half that costs nothing per token.

    It is one type. `openai.rs` (159 lines) and `openrouter.rs` (161) are the same file apart from
    four strings — `ENDPOINT` (`src/provider/openai.rs:18`, `src/provider/openrouter.rs:18`), the
    `name()` literal, the `WebFlavor` variant, and two environment variable names — over an
    `openai_wire` that is already shared and already `pub(crate)` (`src/provider/mod.rs:9`). So
    `Compatible` carries a base URL and an auth style, with vendor presets behind named
    constructors, and reuses `openai_wire` verbatim. A vendor added later is a row in a table rather
    than a file.

    A connected provider also says what it can run. `Provider::models()` returns the vendor's own
    catalogue — ids, and per model whatever the vendor stated: context length, maximum output,
    whether it takes images or tools, and the price. It is a **defaulted** trait method returning an
    empty list, because adding a required method to the one externally-implementable trait this
    crate has would break it — `src/provider/mod.rs:674` ships a user-written `impl Provider` as its
    own doc example.

    And for the vendors that publish no prices, an opt-in reference catalogue fills the gap without
    a table anybody maintains: `https://openrouter.ai/api/v1/models`, no key, parsed into the same
    `ModelInfo`. Off by default, and when on its host appears in `Provider::endpoints()` under the
    same `Act::Net` rules as every other endpoint, so a policy that denies it refuses the run rather
    than skipping the lookup.
  business_value: >
    The crate's own tagline says "any task, any provider" and the second half has been false since
    0.3.0: three vendors, three files, and a fourth meaning a fork. The gap is not the wire format —
    thirteen hosted vendors and eight local runtimes all speak the one this crate already
    implements twice. The gap is that the endpoint is a `const` copied into a private `String`
    field, reachable only through a `#[cfg(test)] pub(crate) fn at(...)` that all three providers
    comment "the endpoint is not configurable in the public API" (`src/provider/openai.rs:79`,
    `src/provider/openrouter.rs:76`). Widening that one field is the release.

    "Write your own `Provider`" is not the answer today either, and for a reason in the code rather
    than in the documentation: `openai_wire` is `pub(crate)` (`src/provider/mod.rs:9`), so an
    out-of-tree implementer reimplements 797 lines of body building, SSE parsing and tool-call
    accumulation to change a hostname.

    The local half is a different argument and a stronger one. Every capability this crate has —
    the sandbox, the policy boundary, the durable trace, sub-agents, hooks — is worth more when a
    run costs nothing, because the honest advice for trying an agent runtime on real work stops
    being "get a key and set a budget". A developer with Ollama on their laptop can run the whole
    twelve-pillar harness for free, and that is the cheapest possible way for someone to find out
    whether this crate is for them.

    The catalogue is the resolution of a rule rather than an exception to it. `src/pricing.rs:13`
    refuses to ship a price list because a number compiled into this crate is stale the moment a
    vendor moves and the late upgrader gets a confident wrong answer. A number fetched from the
    vendor at run time has no shelf life, and it carries the vendor's own effective date rather than
    one a human typed into `as_of`.
  evidence_of_value: >
    A live, keyless `GET https://openrouter.ai/api/v1/models` parsed into `ModelInfo` and priced —
    the reference catalogue's whole story in one request, against the real host, from the machine
    that ships the release. Not a fixture: the fixtures prove the parser, and only the live call
    proves the shape the parser was written against is the shape the host serves.

    For the provider, the same `TaskContract` reaching verified success through `Compatible` beside
    the three built-ins in `tests/parity.rs`, and `Compatible` driven against a real local socket
    through the whole HTTP and SSE path — the harness at `src/provider/mod.rs:808`, which is why
    these tests live in `src/` and not in `tests/`.

    And an operator's own story: `[[provider]] kind = "compatible"` with a preset name and a model,
    in the file they already have, producing a spec `Config::provider_spec()` hands back.
scope:
  included:
  - >
    **One `Compatible` provider, not a struct per vendor.** A base URL, an auth style, a key, a
    model and a trace label, over `openai_wire` verbatim — the same `body`, the same
    `parse_stream_with`, the same `ensure_success`, so a divergence in the wire is fixed once for
    every vendor. Twenty structs would be twenty copies of a constructor and twenty lines in
    `docs/public-api.txt`, each needing a worked doc example, to express what a constant already
    expresses. `Compatible::with_timeout` mirrors the three existing providers rather than inventing
    a second spelling.
  - >
    **The full base URL stored, and the path appended.** Base URLs are not uniformly shaped: most
    end in `/v1`, Groq's in `/openai/v1`, Zhipu's in `/api/paas/v4`, Qwen's in `/compatible-mode/v1`.
    So the field is the base a vendor documents and the provider appends `/chat/completions` and
    `/models`, rather than a scheme-and-host with a shape guessed at.
  - >
    **A preset table plus named constructors.** `const PRESETS` carries `(name, base_url, auth)` for
    the thirteen hosted vendors and the eight local runtimes the outcome names; each named
    constructor is one line over it. The table is what makes a new vendor a row; the constructors
    are what makes a vendor name a compile error when it is misspelled rather than a runtime
    `Result`. Both, because they answer different questions.
  - >
    **`Auth`, two variants and `#[non_exhaustive]`.** `Bearer` for every hosted vendor here, `None`
    for a local runtime that wants no header at all — sending `Authorization: Bearer ` with an empty
    key is a wire difference some servers reject, so "no key" is stated rather than faked. Azure's
    `api-key` header is excluded on demand rather than cost, and `#[non_exhaustive]` is what lets it
    arrive later without a break — the same attribute, for the same reason, that 0.27.0 put on
    `ProviderSpec`.
  - >
    **`Provider::models()`, defaulted to `Ok(Vec::new())`.** The default is the entire point:
    `src/provider/mod.rs:674` ships a user-written `impl Provider` as a doc example and it must keep
    compiling, so a *required* method here would break the one extension point the crate has. It
    returns `Vec<ModelInfo>` and the honest empty list is what every provider that cannot answer
    returns.
  - >
    **`ModelInfo`, and every field an `Option` that means "the vendor did not say".** `id`, then
    `context_length`, `max_output_tokens`, `accepts_images`, `accepts_tools`, `price` and
    `price_source`. `price` is `Option<Price>` and `None` is never `Price::ZERO` — a zero reports a
    real spend as free, which is the exact confident wrong answer `src/pricing.rs:13` refuses to
    ship a price list to avoid, and `Spend::unpriced_calls` (`src/pricing.rs:199`) is the existing
    honest way the gap surfaces. A local runtime is the one place zero is *true* rather than
    unknown, and it is recorded as a stated zero with `PriceSource::Vendor`.
  - >
    **`PriceSource`, so a number's origin is recoverable.** `Vendor` where the vendor's own
    catalogue stated it, `Reference(host)` where it was taken from a named reference. A reference
    price is what the aggregator charges to serve that model, which tracks the vendor's rate and is
    not identical to it, and an operator reading a cost must be able to tell which they have. A
    number whose origin is unrecoverable is what makes an invoice unarguable.
  - >
    **No new price type.** `pricing::Price` already carries `input`, `output`, `cache_read`,
    `cache_write` and `per_server_tool_request` (`src/pricing.rs:86`) in micro-units per million
    tokens, and the reference catalogue's five pricing keys — `prompt`, `completion`,
    `input_cache_read`, `input_cache_write`, `web_search` — map onto them one for one. Verified
    against the live response, not assumed.
  - >
    **Exact decimal string to integer, with no `f64` on the path.** The catalogue states prices as
    decimal strings of dollars per token (`"0.0000002574"`). Micro-units per million tokens is that
    value shifted twelve places, and it is done by shifting the digit string — split on the point,
    pad or round the fraction to twelve places, parse once — rather than through a float. This is
    the one place in the release where a silent bug becomes a wrong invoice, so it is the one place
    that gets its own test and its own named negative control.
  - >
    **`Reference`, the catalogue reader.** A URL with `https://openrouter.ai/api/v1/models` as its
    default, so an internal mirror or an air-gapped copy is configuration rather than a code change.
    A minimal serde struct with `#[serde(default)]` and deliberately **no** `deny_unknown_fields`:
    the live response carries twenty top-level keys per model and will carry more.
  - >
    **Opt-in, and refused rather than skipped.** `Compatible::with_reference_prices` is the only way
    on. When it is set, `Provider::endpoints()` returns the reference host beside the chat endpoint,
    and `src/run.rs:4630` already authorises every URL `endpoints()` reports against the policy's
    `Act::Net` rules before the first step. So a denied reference host ends the run loudly through a
    boundary that exists, and this release writes no new one.
  - >
    **Matching: exact slug, one documented normalisation, and a miss stays `None`.** The reference
    says `deepseek/deepseek-chat` where a vendor's own API says `deepseek-chat`, so the one
    normalisation is dropping a single leading `vendor/` segment and comparing case-insensitively.
    Two reference entries that normalise to the same key make that key **ambiguous and it is
    dropped**, because an ambiguous match is a guess. A wrong match is a wrong invoice and is worse
    than the gap it filled.
  - >
    **`Compatible::price_table()`**, returning the existing `PriceTable` filled from the catalogue
    with the fetch date as its `as_of`. This is where "derived cost stops depending on a table an
    operator maintains by hand with a date they have to remember to update" becomes a method rather
    than a claim, and it needs no new type at all — `PriceTable::new` (`src/pricing.rs:129`) already
    requires exactly that date and for exactly this reason.
  - >
    **`ProviderSpec::Compatible`**, the variant 0.27.0's `#[non_exhaustive]`
    (`src/config.rs:287`) was put there for. `model`, optional `api_key`, `base_url` **xor**
    `preset`, optional `auth` and `name`, and `reference_prices` defaulting to false — exactly-one
    enforced in code and reported naming the entry's index, which is the shape `[[hook]]`'s
    `append`/`run` pair already uses. `Config::provider_spec()` and `Config::fallback_specs()`
    (`src/config.rs:643`, `:681`) carry it with no change to either.
  - >
    **Wire tests in `src/`, not `tests/`.** `Compatible::at` is `#[cfg(test)] pub(crate)` like its
    two siblings, so only a crate-internal test can point a provider at a local socket. They use the
    existing harness at `src/provider/mod.rs:808` — a raw `TcpListener` with `drain_request` (`:825`)
    and `stream_response` (`:858`) — promoted to `pub(crate)`, plus a four-line `json_response` for
    the catalogue's plain JSON body. There is no wiremock, httpmock or mockito in this repository and
    this release adds none.
  - >
    **`tests/parity.rs` extended**, because "the same contract through several providers" is what
    that file is for and `Compatible` is the fourth.
  - >
    Every documentation surface, in this release. A new `docs/guide/providers.md` with a "The
    limits, stated plainly" block, named in `tests/guide_pages.rs::GUIDES`, in `docs/CAPABILITIES.md`
    and in the README's guide table. `docs/guide/configuration.md` gains a `### [[provider]]`
    subsection for the new kind and its limits block grows. **`docs/CONTRACT.md` states the vendor
    divergences plainly** — that is this release's most important documentation obligation.
    README's "Providers, with fallback" paragraph, which names only three vendors today, is
    rewritten. `docs/public-api.txt` hand-edited in sorted position for every new name, each with a
    worked example. `CHANGELOG.md`, Added first, because nothing here breaks.
  - >
    Every test obligation this repository enforces rather than requests.
    `tests/config.rs::EVERY_KEY` (`:233`) gains a `kind = "compatible"` entry and every key inside
    it, with `f7_every_key_reaches_a_typed_field` (`:362`) asserting each reaches a typed field and
    its negative-control twin (`:525`) extended. A strictness test modelled on
    `an_unknown_key_inside_the_web_table_is_rejected_naming_it` (`:1242`).
  excluded:
  - >
    **AWS Bedrock's SigV4, Google Vertex's service-account JWT, and Gemini's native `interactions`
    API.** All three are reachable today by an application that mints a bearer token itself and
    passes it as the key, which is where OAuth has always belonged — and OAuth is app-level, not
    harness-level, by the standing scope boundary. Gemini is reachable here through its
    *compatibility* endpoint, which is what the preset table names.
  - >
    **Azure OpenAI.** The closest call: one auth-style variant, a deployment name in the path and an
    `api-version` query parameter, and no new dependency. It is left out on demand rather than on
    cost — no consumer has asked — and `#[non_exhaustive]` on `Auth` is what admits it later without
    a break. Excluded and argued rather than omitted.
  - >
    **A store cache for the catalogue, and this deviates from the roadmap entry deliberately.** That
    entry says "cached in the store with the instant it was fetched". `Provider::models()` takes
    `&self` and nothing else, so reaching a `Store` from it would mean putting the store into the
    provider trait — the one type this crate has kept out of it — or a second parallel API beside
    `models()`. The cache therefore lives on the provider instance, and the instant it was fetched
    lands on `PriceTable::as_of`, which is the field that already exists to carry precisely that
    claim and already refuses to be constructed without it. A second process re-reads one free
    keyless GET, which is the whole cost. Recorded here so the difference from the roadmap is
    visible rather than looking like an oversight.
  - >
    **`Compatible::from_env()`, and this also deviates deliberately.** The three existing providers
    each have one, so its absence will look inconsistent and the guide says why in one line:
    twenty-one vendor environment variable names are twenty-one guesses this crate would be making,
    and `[[provider]]` with `${env:GROQ_API_KEY}` has resolved a credential from the environment
    since 0.19.0 and names the variable in the operator's own file rather than in our source. A
    preset constructor takes the key; where the key comes from is the caller's.
  - >
    **`Fallback::models()` doing anything but returning the default empty list.** Which of two
    vendors' catalogues a chain reports is a question with no right answer, and inventing one
    freezes it. Recorded as a known limitation rather than guessed at.
  - >
    **A compatibility layer.** Every vendor here diverges from the OpenAI wire somewhere, and this
    release does not paper over the divergences — it states them. The crate already parses
    `finish_reason` as an open `String` (`src/provider/mod.rs:574`) and does not
    `deny_unknown_fields` on responses, so the divergences that matter are the ones a caller must be
    *told* about. A boundary the caller believes in and nobody enforces is worse than none.
  - >
    **Per-vendor request rewriting.** Not stripping `messages[].name` for Groq, not regenerating
    tool-call ids for Mistral, not replaying `reasoning_content` for DeepSeek. Each is a vendor-shaped
    branch inside the one body builder that every vendor shares, and the release's whole structural
    claim is that there is one wire and not twenty. They are documented in the contract, and any one
    of them becomes a change on evidence when a consumer meets it.
  - >
    **A `dyn Provider`.** `Provider::complete` is RPITIT and the trait is not dyn-compatible
    (`src/provider/fallback.rs:4-6`). `ProviderSpec` exists because of it and nothing here revisits
    it.
  - >
    **A new dependency, on any platform.** The parser is `serde_json`, the request is `reqwest`, the
    decimal shift is `std`. `cargo tree` reads 402 lines on the default feature set before this
    release and must read 402 after it.
  - >
    Wrapping `rusqlite::Error` out of the public API, and wiring `[toolchain]` into this crate's own
    run loop. Both standing, both still right, both still not this release.
  fallback_scope:
  - >
    **Trigger — the reference catalogue cannot be made honest, and the release ships `Compatible`
    alone.** Named as either of two observations, each checkable rather than felt. First: the
    normalisation cannot separate a match from a guess — concretely, the live catalogue is found to
    contain two entries normalising to one key for a model a preset vendor actually serves, and
    dropping the ambiguity leaves the feature matching too little to be worth the host it dials.
    Second: the opt-in egress cannot be shown to *refuse* — a policy denying the reference host
    producing a run that proceeds with prices missing rather than an error, after one round of
    correcting where `endpoints()` is consulted.

    If it trips, 0.29.0 ships the `Compatible` provider, its preset table, `Provider::models()` and
    the vendor-catalogue half of it — which is the half with no third host in it at all — and the
    reference catalogue, `PriceSource::Reference` and `Compatible::price_table` move to a later
    version with an UltraShip iteration recording which observation tripped. `ModelInfo::price_source`
    stays, with `Vendor` as its only reachable value, because provenance on a stated price is still
    worth having and removing the field later would be a break where narrowing its values is not.

    The release stays coherent: "a provider is a base URL, a key and a model name, and twenty-one
    vendors are reachable without writing one" is a complete sentence and is the half the roadmap
    entry leads with. What it loses is prices for the vendors that publish none, which
    `Spend::unpriced_calls` already reports honestly and has since 0.18.0.
acceptance:
  functional:
  - >
    F1 — one `Compatible` reaches a vendor's chat endpoint through the real HTTP and SSE path, and
    the preset decides the URL and the auth. A `Compatible` pointed at a local socket completes a
    streamed response with text and a tool call, asserted through `Compatible::at`, and the request
    the socket received carries `Authorization: Bearer <key>` and a path ending `/chat/completions`.
    **Two negative controls:** an `Auth::None` provider's request carries **no** `Authorization`
    header at all, asserted on the received head rather than on the constructor — so "auth style" is
    proven to reach the wire and not merely to be stored; and a base URL already ending in a path
    segment (`/openai/v1`, `/api/paas/v4`) produces that segment plus `/chat/completions` rather than
    a URL with the segment lost, which is the failure mode a scheme-and-host field would have had.
  - >
    F2 — every preset in the table names a distinct vendor with a well-formed absolute base, and the
    named constructors and the table cannot disagree. Each entry's `base_url` parses as an absolute
    `https`/`http` URL with a host, no entry's name repeats, and each of the twenty-one named
    constructors is asserted to produce the base and the auth style its table row states. **The
    negative control is the check run against a table with one row's base replaced by a relative
    path and another row duplicated, which must report exactly those two rows** — a validator that
    always answers "fine" is the failure mode, and it must be seen answering otherwise.
  - >
    F3 — `Provider::models()` defaults to an empty list, and the default is what keeps the crate's
    extension point open. A `Provider` implementation that overrides nothing but `complete` compiles
    and returns an empty catalogue — written as the minimal out-of-tree implementer, which is the
    exact shape `src/provider/mod.rs:674` documents. **The negative control is `Compatible::models()`
    against a socket serving a real catalogue body, returning a non-empty list** — without it the
    test passes against an implementation whose `models()` returns empty for everyone.
  - >
    F4 — a decimal price string becomes an exact integer, and no `f64` is on the path. `"0.0000002574"`
    becomes exactly `257_400` micro-units per million tokens, and a table of hand-computed cases
    covers a value with fewer fraction digits than the shift, one with more (rounded half-up at the
    twelfth place), `"0"`, an integer with no point, and a malformed string that yields `None` rather
    than a zero. **The named negative control is `f4_the_conversion_is_not_a_float_multiply`: the
    same inputs run through an `f64` multiply must produce a value that differs from the exact
    result for at least one case in the table**, so the test proves the implementation is not the
    float one rather than merely agreeing with it on easy inputs. A second control asserts a
    malformed price is `None` and never `Some(0)`.
  - >
    F5 — a reference price is matched exactly or by one documented normalisation, and a miss stays
    `None`. An exact slug matches; `deepseek/deepseek-chat` matches a vendor id of `deepseek-chat`
    by dropping the single leading segment, case-insensitively. **Three negative controls:** a
    vendor id the reference does not carry under either rule is `None` and never a nearest entry —
    asserted with the roadmap's own example, a reference carrying `deepseek/deepseek-chat` and a
    vendor asking for `deepseek-v4-flash`; two reference entries normalising to the same key make
    that key ambiguous and therefore `None`, not first-wins; and a two-segment vendor id is not
    matched against a one-segment reference entry by stripping in the other direction, because one
    normalisation means one.
  - >
    F6 — a price carries its provenance, and the two fields cannot disagree. A model priced from the
    vendor's own catalogue is `PriceSource::Vendor`; the same model filled from the reference is
    `PriceSource::Reference(host)` naming the host that was dialled. Across a whole parsed catalogue,
    `price.is_some()` and `price_source.is_some()` are asserted **equal for every entry**. **The
    negative control is a vendor catalogue with no pricing object at all** — every entry `None` on
    both, which is the state that must not be reported as a free model.
  - >
    F7 — the reference lookup is off by default, and when on its host is governed like every other
    endpoint. A `Compatible` built normally reports exactly one endpoint and makes no second request,
    asserted by a reference server that records whether it was ever connected to. With
    `with_reference_prices`, `endpoints()` reports both, and a run under a policy that denies the
    reference host **fails** rather than proceeding with prices missing — asserted on the run's error
    through the existing authorisation at `src/run.rs:4630`. **Two negative controls:** the
    byte-identical run under a policy that allows the host reaches its own ending, so the refusal is
    proven to be about the policy and not about the feature being broken; and the default-off
    provider under the same denying policy still runs, so the deny is proven to be about the second
    host and not about the provider's own.
  - >
    F8 — `Compatible` runs a real task contract to verified success, beside the three built-ins.
    `tests/parity.rs` gains it as a fourth provider under the same contract, and the trace records
    its name. **The negative control is the existing three still passing unchanged in the same loop**,
    which is what proves the addition is a fourth path and not a rewrite of the three.
  - >
    F9 — the config variant reaches a typed field, is exactly-one about its base, and rejects what it
    does not know. `EVERY_KEY` (`tests/config.rs:233`) gains a `kind = "compatible"` entry covering
    every key, and `f7_every_key_reaches_a_typed_field` (`:362`) asserts each lands. **The negative
    control is its existing twin** (`:525`), extended to one new key, so the fixture proves the field
    is read rather than defaulted. Plus: an entry with **neither** `base_url` nor `preset`, and one
    with **both**, are each refused naming the entry's index; an unknown `preset` name is refused
    listing the names that exist; and an unknown key inside the entry is rejected naming it, modelled
    on `an_unknown_key_inside_the_web_table_is_rejected_naming_it` (`:1242`).
  - >
    F10 — the live reference host serves the shape the parser was written against. A keyless
    `GET https://openrouter.ai/api/v1/models` from the release machine, parsed by the shipped parser,
    yielding a non-empty catalogue in which at least one model carries a price in every one of the
    five dimensions the mapping claims. Run once, at completion, and recorded as a health check with
    what it actually returned. It is not a unit test and does not gate CI — a network test in the
    suite is a flaky suite — but a parser written against a shape nobody checked is the failure this
    criterion exists to prevent, and `.env` carries real OpenRouter credentials, so the check is
    genuinely available rather than aspirational.
  non_functional:
  - >
    NF1 — the full suite passes on macOS, Linux and Windows with no test skipped, ignored or made
    conditional. The standing exception is `skills::discovery_over_a_32_skill_directory_is_under_50ms`,
    a wall-clock assertion that fails intermittently on the Windows runner under load and is re-run
    rather than investigated. No test in this release reaches the network.
  - >
    NF2 — **no new dependency, on any platform.** `cargo tree` on the default feature set reads 402
    lines after this release as before it. The provider is `reqwest` and `openai_wire`, both present;
    the catalogue parse is `serde_json`, present; the decimal shift is `std` string handling and
    `u64`. This is the constraint the product now states, so it is a criterion and it is checked
    rather than asserted.
  - >
    NF3 — **`CHECKPOINT_FORMAT` stays 7 and no store schema changes at all.** This release creates no
    table, which is the direct consequence of the catalogue being cached on the provider instance
    rather than in the store. `tests/cross_version.rs` passes unchanged, and it passes without
    anything being added to `ADDED_SINCE_0_22_0`.
  - >
    NF4 — `cargo doc` is warning-free, docs.rs builds with all features, `cargo fmt --check` is clean,
    and `cargo clippy --all-targets -- -D warnings` is clean on every platform in the matrix. Doc
    examples use literals rather than `${env:HOME}`, which is unset on `windows-latest` and cost
    0.27.0 a CI round. Any test that reads this crate's own source normalises line endings, because a
    Windows checkout is CRLF and that cost 0.28.0 a round.
  - >
    NF5 — no existing public item changes. `OpenRouter`, `Anthropic` and `OpenAi` keep every method
    and every behaviour; `Provider` gains one defaulted method and no required one; `ProviderSpec`
    gains one variant behind the `#[non_exhaustive]` 0.27.0 put there for it. A program written
    against 0.28.0 compiles and behaves identically.
  operational:
  - >
    OP1 — `docs/public-api.txt` is hand-edited in sorted position for every new crate-root name —
    `Compatible`, `Auth`, `ModelInfo`, `PriceSource` and `Reference` — and each carries a doc comment
    with a worked example, because `tests/public_api.rs` fails otherwise and there is deliberately no
    `--bless`. This is real work rather than a formality: five items, five examples that compile as
    doctests. The preset table is `pub(crate)` and adds no line; a named constructor is a method and
    adds none either.
  - >
    OP2 — **`docs/CONTRACT.md` states the vendor divergences plainly, from primary sources, and this
    is the release's most important documentation obligation.** A new section names each: Zhipu emits
    `finish_reason` values outside the OpenAI set (`sensitive`, `network_error`,
    `model_context_window_exceeded`) which this crate records verbatim because the field is an open
    `String`; Groq returns 400 on `messages[].name`; Mistral requires tool-call ids matching
    `^[a-zA-Z0-9]{9}$` and names its schema field `schema_definition`; DeepSeek returns 400 if
    `reasoning_content` is not replayed on a request carrying tools; Ollama accepts and silently
    drops `tool_choice`.

    **And the sentence that matters most: vLLM and SGLang emit no tool calls at all unless the
    server was started with a tool-call parser flag, which a client cannot set.** A caller who points
    `Compatible` at a vLLM server started without `--tool-call-parser` gets a run that quietly never
    calls a tool and never errors — the agent simply talks. That must be findable in the contract by
    someone searching for "vLLM" or "no tool calls", not discovered after an afternoon of debugging.
    It is stated in those words, in the section a reader reaches before writing the base URL.
  - >
    OP3 — `docs/guide/providers.md` exists, is named in `tests/guide_pages.rs::GUIDES` with
    `limits_block: true`, is listed in `docs/CAPABILITIES.md` and in the README's guide table, and its
    "The limits, stated plainly" block states what this release creates: that `Compatible` is one
    wire and not a compatibility layer, that a vendor catalogue mostly carries no prices, that a
    reference price is the aggregator's and not the vendor's, that a match that is not exact or the
    one normalisation stays unpriced rather than guessed, and that the reference lookup dials a host
    the caller did not name and is therefore off until asked for. It also carries the one line
    explaining why `Compatible` has no `from_env` and what to write instead.
  - >
    OP4 — README's "Providers, with fallback" paragraph (`README.md:156`) is rewritten. It names
    only OpenRouter, Anthropic and OpenAI today, while the tagline four lines above says "any
    provider" — this release is what makes that true and the paragraph is where a reader finds out.
    `docs/guide/configuration.md` gains a `### [[provider]]` subsection covering the new kind, and its
    limits block grows.
  - >
    OP5 — `cargo package --locked` exits 0 and the tarball is verified by **listing** rather than by
    trusting the `exclude` list: no `.env`, no `.ultraship`, no `.github`. MSRV 1.95 re-checked in
    both directions rather than read off the manifest, which is the lesson 0.23.0 paid for. `df -h .`
    is read before packaging and before publishing, because a full disk on this machine surfaces as
    `ld: cc failed` or an `ENOSPC` in a query-cache write and reads like a toolchain bug — 0.28.0 took
    `target/` to 23 GiB.
delivery:
  target_mode: published
  environment: >
    crates.io as `io-harness` 0.29.0, GitHub at initorigin/io-harness with the tag `v0.29.0` and a
    Release titled `io-harness 0.29.0`, and docs.rs, whose build is checked by the nightly CI job.
  deployment_method: >
    The standing flow. All work on `feat/0.29.0` off `develop`, including the sealed UltraShip
    release record. PR into `develop`, merged with the PR button. Release PR `develop` into `main`,
    merged the same way. The GitHub Release is cut by `release.yml` — `gh workflow run release.yml
    --ref main -f version=0.29.0` — which refuses any ref but `main`, a version the manifest does not
    declare, an existing tag, or a version with no changelog section, and takes its notes verbatim
    from the changelog. `cargo publish --locked` by hand afterwards, always last, after both merges
    and the Release exist. `develop` synced to `main` fast-forward only at the end. No branch is
    deleted.
  migrations:
  - >
    Nothing breaks. `Compatible`, `Auth`, `ModelInfo`, `PriceSource` and `Reference` are new names;
    `Provider::models()` is a defaulted method, so every out-of-tree implementation compiles
    unchanged; `ProviderSpec::Compatible` is a new variant behind the `#[non_exhaustive]` 0.27.0 added
    for exactly this, so a consumer already carries the `_ =>` arm it needs.
  - >
    No store schema change and no `CHECKPOINT_FORMAT` bump. This release creates no table, so a
    0.28.0 database opens, resumes and replays with nothing to migrate — and a 0.28.0 binary reads a
    0.29.0 store the same way.
  - >
    A configuration file gains one accepted `kind`. Every existing `[[provider]]` entry parses
    identically; a file written for 0.29.0 that uses `kind = "compatible"` is rejected by a 0.28.0
    loader as an unknown variant rather than ignored, which is the loud direction.
  observability:
  - >
    `Provider::name()` carries the preset's own label — `groq`, `ollama`, `zhipu` — so `runs.provider`
    and every `provider_calls` row say which vendor served, not `compatible`. A caller who supplied a
    bare base URL and no name gets `compatible`, which is honest about what is known.
  - >
    The reference host, when the lookup is on, appears in `Provider::endpoints()` and therefore in the
    policy trace like every other endpoint: an allowed egress is a `policy_events` row and a denied
    one is a refusal naming the host. An operator asking "what did this dial" reads the same table
    they already read.
  - >
    A model whose price could not be matched stays `None`, so `Spend::unpriced_calls`
    (`src/pricing.rs:199`) counts it and the group reports a floor rather than a total. The existing
    honest surface is the one this release feeds; it invents no second report.
  rollback: >
    A published version cannot be recalled; the forward fix is 0.29.1 and `cargo yank --version
    0.29.0` is the escape hatch, leaving 0.28.0 as what `cargo install` resolves. A consumer reverting
    to 0.28.0 keeps every database — this release changes no schema, no stored format and no
    checkpoint version — and loses `Compatible`, `Provider::models()` and `kind = "compatible"`. The
    last of those is loud rather than silent: a 0.28.0 loader rejects the unknown variant rather than
    ignoring the entry. The one file edit a revert forces is rewriting such an entry back to one of
    the three original kinds, and a file that never used the new kind is valid under both versions.
dependencies:
  products: []
  services:
  - GitHub Actions runners for macOS, Linux and Windows
  - crates.io, for publication
  - docs.rs, for the rendered API reference
  - >
    `openrouter.ai`, for the reference catalogue — read once at completion for the F10 health check,
    and at run time only by a caller who opted in. Not a build-time or test-time dependency.
  human_approvals:
  - Owner approval to merge to `main`, cut the Release, and publish, per the standing override.
resource_profile:
  complexity: medium
  uncertainty: medium
  likely_cost_drivers:
  - >
    Five new public names, each needing a line in `docs/public-api.txt` in sorted position and a doc
    comment with a worked example that compiles as a doctest. `tests/public_api.rs` enforces both and
    has no `--bless`. This is the largest single-release addition to the public surface since 0.24.0
    and it is deliberate work rather than overhead.
  - >
    The documentation is a new guide page plus edits to five existing surfaces, and
    `tests/guide_pages.rs` and `tests/readme.rs` both fail on a page added without being wired in —
    the intended cost, not a surprise. `docs/CONTRACT.md`'s divergence section is the piece with the
    most judgement in it and the least mechanical checking behind it.
  - >
    The decimal conversion is small and is the only place a defect becomes money. It gets a table of
    hand-computed cases and a control that proves the implementation is not the float one — which is
    a harder thing to test than correctness on easy inputs, and is the point.
  - >
    Twenty-one preset rows, each a vendor's documented base URL. They are data, so the cost is
    getting them right rather than writing them, and F2 is what converts "right" from a claim into a
    check. Four of them are not `/v1`-shaped, which is why the field is a full base.
  - >
    Parallel work across genuinely separable pieces — the provider and its presets, `models()`, the
    reference catalogue, the config wiring, the documentation — with the convergence files
    (`tests/config.rs::EVERY_KEY`, `CHANGELOG.md`, `docs/public-api.txt`, `docs/CONTRACT.md`, the
    release record) written once and serially. Concurrent full builds are what took `target/` to
    23 GiB during 0.28.0 and are not repeated.
  preferred_tools:
  - The existing `openai_wire` (`src/provider/mod.rs:9`), reused verbatim — no second wire
  - The existing `#[cfg(test)] pub(crate) fn at` shape and the socket harness at
    `src/provider/mod.rs:808`, so a new provider is tested the way the three already are
  - The existing `pricing::Price` and `PriceTable` (`src/pricing.rs:86`, `:129`), so the catalogue
    needs no price type and no second `as_of`
  - The existing `Provider::endpoints()` authorisation at `src/run.rs:4630`, so an opt-in second host
    is governed by a boundary that already exists
  - The existing `#[non_exhaustive] ProviderSpec` (`src/config.rs:287`), so the variant is additive
  - '`serde_json` with `#[serde(default)]` and no `deny_unknown_fields`, so a catalogue that grows a
    field does not break a parse'
  constraints:
  - No new dependency on any platform; `cargo tree` stays 402 on the default feature set
  - No store schema change; `CHECKPOINT_FORMAT` stays 7 and no table is created
  - No required method added to `Provider`; `models()` is defaulted or it is a break
  - '`ModelInfo::price` is never `Price::ZERO` for an unknown price, only for a stated one'
  - A price match is exact or one documented normalisation; a miss is `None` and never a guess
  - The reference lookup is off by default and appears in `endpoints()` when on
  - No vendor-shaped branch inside the shared body builder
  - MSRV stays 1.95; stay 0.x
risks:
- >
  **A wrong price is a wrong invoice, and it arrives silently.** Every other defect in this release
  shows up as a compile error or a failed request; a price that is off by a factor of ten reports a
  number an operator believes. The mitigations are structural rather than careful: `None` is never
  `ZERO`, provenance is a field rather than a convention, a match is exact or one normalisation, an
  ambiguous normalisation is dropped, and the decimal conversion never touches an `f64` and has a
  control that proves it. The residual risk is that the aggregator's price for a model differs from
  the vendor's own, which is *not* a defect and is exactly what `PriceSource::Reference` exists to
  say out loud.
- >
  **A third host dialled from inside a provider is an egress the caller did not ask for.** This crate
  authorises egress from `Provider::endpoints()` before a run starts, which is the whole reason that
  method exists and the reason `Fallback` overrides it to return both. A reference lookup that dialled
  without appearing there would walk straight through a deny-by-default boundary. The mitigation is
  that it is opt-in, that `endpoints()` reports it, and that F7's controls prove the denial is about
  the second host rather than about the feature failing — and the fallback trigger is written against
  exactly this observation.
- >
  **The divergences are researched facts today and vendor behaviour tomorrow.** Groq's 400 on
  `messages[].name` and vLLM's silent no-tool-calls are true of those services now. A contract that
  states them will age. The mitigation is that they are stated as observations with the behaviour
  named, not as a compatibility matrix this crate promises to maintain — and that the crate's actual
  posture, stated in the same section, is that it sends one wire and does not adapt per vendor.
- >
  **Twenty-one base URLs is twenty-one chances to be wrong, and a wrong one fails at run time in a
  caller's process rather than in CI.** No test can dial them. The mitigation is F2 — each is checked
  for shape, uniqueness and agreement with its named constructor — plus the fact that a base URL is
  overridable, so a vendor that moves is one line in a config file and not a release.
- >
  **Scope, honestly.** One provider type, one trait method, one catalogue reader, one config variant
  and a guide page is a wide release, and its pieces are genuinely separable, which is the argument
  for parallel work and also the way a release loses coherence. What binds them is one sentence — a
  provider is a base URL, a key and a model name, and it can say what it runs and what that costs —
  and the fallback trigger cuts the catalogue whole rather than trimming every piece, because a
  release that ships one half completely is better than one that ships both at four-fifths.
open_questions:
- >
  Whether `Compatible::models()` should call the vendor's `/models` at all for a preset known to
  return identifiers with no pricing, or go straight to the reference when it is enabled. Calling
  both is one extra request and yields the context lengths the vendor does state; calling only the
  reference is faster and loses them. Decided in development against what a local runtime actually
  returns, since that is the case where the vendor endpoint is the *only* source.
- >
  Whether the one normalisation should also handle a trailing vendor suffix — the reference's
  `:free` and `:nitro` variants — or whether those stay unmatched. Dropping a suffix is a second
  normalisation and the rule says one; leaving them means a caller pointing at a free-tier slug gets
  no price, which for a free tier is arguably the right answer anyway. Decided against whether any
  preset vendor's own API serves a slug carrying one.
- >
  Whether `reference_prices` belongs on `ProviderSpec::Compatible` at all, or whether opting into a
  second host should require Rust rather than a file. A file that can turn on an outbound request to
  a host it also names is close to the hazard 0.27.0 refused `${cmd:}` in the project scope for.
  Decided against whether the project-scope trust rule needs to cover it, which is the same question
  0.28.0 answered for `[[hook]]`.
- >
  Whether the preset table should carry a default model per vendor. It would make
  `Compatible::groq(key)` a one-argument call, and it would be a guessed model slug — the thing
  `OpenRouter::from_env` explicitly refuses to do (`src/provider/openrouter.rs:86-87`). Almost
  certainly no; recorded so the decision is visible rather than assumed.
