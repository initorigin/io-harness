product: io-harness
version: 0.17.0
status: released
release_type: minor
outcome:
  user_can: >
    Point the harness at a project in any language and have the agent do real work in it. It can run
    that project's own toolchain — `cargo test`, `npm install`, `go build`, `pytest`, `dotnet test`,
    `make` — through an `exec` tool authorized by the same permission check as every other tool; it
    can change a file by replacing an exact string instead of rewriting the whole thing; and the
    run's definition of done can be that project's own test command, or nothing at all when the task
    has no checkable criterion.
  business_value: >
    This is the release that makes the repositioning true in code rather than in prose. Before it,
    the type system required every run to name a `Verification`, and four of the five variants
    compile or run Rust — so "debug a production issue", "fix a deployment", or "build an
    application" could not be expressed, let alone executed, because there was no way to run a
    command and no way to say the work was done without a Rust gate. Every consumer this crate
    exists for — io-cli, io-studio, io-eval — is blocked on it, and so is any external Rust
    developer whose project is not itself Rust.
  evidence_of_value: >
    A live run against a non-Rust project completes end to end: the agent detects the toolchain,
    installs or builds through `exec`, edits a file with an exact-match replacement, and the run
    succeeds because that project's own test command exited zero. No Rust-specific code is on the
    path, and the same run under a policy that denies the test binary is refused with the rule and
    layer that refused it recorded in the trace.
scope:
  included:
  - >
    An `exec` tool taking a fixed argv array and no shell string. Every call is an `Act::Exec` check
    against the policy on the program and on the full argv, so an operator can allow `cargo *` and
    deny `rm *` with the rule syntax the policy already has. Fixed argv rather than a shell line is
    deliberate and follows the discipline the git built-ins already use: the model supplies
    arguments, never a subcommand, a flag, or a metacharacter, so there is no `;`, `&&`, `$( )`, or
    backtick to parse and therefore none to get wrong.
  - >
    `exec` runs in the workspace root with the embedding program's privileges, not inside the
    sandbox. Decided by the owner (US-IO-HARNESS-0.17.0-I02): the sandbox denies network egress and
    discards its working directory, which is right for a verification gate and makes `npm install`
    impossible. The sandbox stays what it is — the container for verification gates.
  - >
    Bounds on what `exec` may do to the run: a generous wall-clock timeout, overridable per
    contract, so a wedged command dies naming itself rather than consuming the run's whole time
    budget; a captured-output ceiling that keeps the head and the tail and elides the middle, with
    the elision stated in the result the model reads, because a build log's useful content is at
    both ends; and the working directory pinned to the contract's workspace root.
  - >
    An `edit_file` tool performing exact string replacement, failing with a typed error when the
    search string matches zero times or more than once, so a replacement is never applied to the
    wrong occurrence.
  - >
    `Verification::Command { argv, expect_exit }` — a criterion that runs a caller-supplied command
    inside the existing execution sandbox and asserts its exit status. One variant that covers every
    language the machine has a toolchain for.
  - >
    `Verification::None` — a run with no gate. An assistant turn carrying no tool call ends it with
    its own terminal outcome, distinguishable from a step cap, a stall, and a budget stop. No `done`
    tool is added, so an unverified run gains no tool surface over a verified one. This is what
    makes an open-ended task expressible.
  - >
    `CompilesRust`, `RustTestPasses`, and `WorkspaceTestPasses` re-expressed over `Command` so there
    is one execution path rather than two, with the old variants kept and `#[deprecated]` naming
    their replacement for at least one minor release.
  - >
    A project and toolchain table shipped as data in the crate: a marker file maps to that
    ecosystem's default build, test, lint, format, and run argv. At minimum Cargo, npm/pnpm/yarn/bun
    (resolved by lockfile), Go, Python (uv/poetry/pip), Maven, Gradle, .NET, Ruby, PHP, Elixir,
    Swift, CMake, Deno, and Make. Detection result is surfaced to the model in its context so it
    stops spending turns guessing the package manager.
  - >
    A public type for the toolchain table so 0.19.0's configuration file can deserialize operator
    overrides into it without the table's shape changing again.
  - >
    `RESERVED_TOOL_NAMES` corrected to name every built-in rather than the original seven. A
    registered `Tool` called `git_status` or `xlsx_read` currently passes `Toolbox::validate` and is
    then permanently unreachable because dispatch tests every built-in arm first — the exact silent
    shadowing the reserved set exists to prevent. Fixed here because tool dispatch is already being
    edited.
  - >
    A nightly `RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features --no-deps` job in CI.
    It is the only thing that would have caught the defect 0.16.2 had to fix, and its absence is
    recorded as a known limitation on that release.
  - >
    Documentation: guide pages for command execution and for language support, a worked example on
    every new public item, `docs/public-api.txt` updated by hand, `CHANGELOG.md` migration notes for
    both breaks, and `docs/CONTRACT.md` amended for the new boundary statements and the closed
    defect.
  excluded:
  - >
    A shell-string variant of `exec`. It is the whole injection surface and nothing in this release
    needs it. If a real task later requires a pipeline, it arrives as its own named tool with its
    own argument, not as a mode on this one.
  - >
    Running `exec` inside the ephemeral sandbox. The sandbox denies network egress by default and
    discards its working directory, which is correct for a verification gate and wrong for `npm
    install`. `exec` runs in the workspace with the embedding program's privileges, gated by the
    policy on argv — the same honest bound the crate already states for a registered `Tool`.
    Sandboxed execution as an opt-in is later work.
  - >
    Configuration. The toolchain table is shipped data and is not operator-overridable until 0.19.0
    puts a file under it. Writing the file format now would mean writing it twice, because its shape
    is determined by this release and the accounting release after it.
  - Any change to the store schema, the checkpoint format, or the 0.10.0 context assembler's rules.
  - >
    The three remaining `CONTRACT.md` defects — `resume_tree` not recording its policy,
    `SandboxLimits::max_processes` enforced by nothing, and no Linux seccomp filter. Each is a
    behaviour change in a module this release does not touch.
  - An LSP client, a web tool, a todo tool, and a question tool. Later versions own these.
  fallback_scope:
  - >
    `exec` with its policy check and its bounds, `edit_file`, `Verification::Command`,
    `Verification::None`, the deprecation cycle for the Rust-specific variants, the
    `RESERVED_TOOL_NAMES` fix, and their documentation. The toolchain detection table drops out.
    This is still a coherent release: every language works, because the agent can run any command
    and the gate can be any command — the operator or the goal text has to name the test command
    rather than the harness inferring it.
acceptance:
  functional:
  - >
    F1 — the agent can run a command. A workspace run whose goal requires building or testing invokes
    `exec` with a fixed argv, the command runs in the workspace root, and its exit status, stdout,
    and stderr reach the agent's next turn. Asserted end to end against a fixture project, not by
    unit-testing the tool in isolation.
  - >
    F2 — `exec` is authorized, not merely available. A run under a policy that denies the program is
    refused before the process is spawned, and the refusal is recorded in `policy_events` attributed
    to the rule and layer that produced it. The negative control is the same run under a policy that
    allows it, which executes — so F2 measures the boundary rather than a tool that never works.
  - >
    F3 — argv is matched whole, not just on the program name. A policy allowing `git log*` and
    denying `git push*` permits the first and refuses the second, with the refusal attributed. The
    negative control is a policy allowing both, under which both run.
  - >
    F4 — `exec` cannot reach a shell. A test asserts the tool's JSON schema accepts only an array of
    strings, and that an argument containing `;`, `&&`, `$(id)`, or a backtick is passed to the
    program as one literal argument rather than interpreted. The negative control is the same
    argument observed verbatim in the child's received `argv`.
  - >
    F5 — `exec` is bounded. A command that runs past the wall-clock timeout is killed and reported
    as a timeout naming the command, rather than hanging the run until the contract's time budget
    stops it. Output past the ceiling retains its head and its tail with the middle elided, and the
    result the model reads states that an elision happened and how much was dropped — asserted
    against a fixture whose first and last lines are both required to survive, so a tail-only or
    head-only cut fails the test.
  - >
    F6 — `edit_file` replaces one occurrence exactly. A replacement whose search string appears once
    succeeds and changes only that occurrence; a search string appearing zero times fails with a
    typed error naming the file; a search string appearing twice fails with a typed error stating
    the count and changes nothing on disk.
  - >
    F7 — `edit_file` is gated by the same `Act::Write` check as `write_file`, asserted by a refusal
    test with a negative control.
  - >
    F8 — `Verification::Command` passes and fails on exit status, asserted against **Node**. A
    criterion running `npm test` over a fixture package exits zero and yields `RunOutcome::Success`;
    the same criterion over a fixture whose test fails does not, and the gate's output reaches the
    trace. Node and npm are preinstalled on all three runner images, so no system package is
    installed and the standing constraint holds. This is what makes "any language" a measurement
    rather than a claim.
  - >
    F9 — `Verification::None` completes a run with no gate. An assistant turn carrying no tool call
    ends the run with a terminal outcome distinguishable from a step cap, a stall, and a budget
    stop, so an unattended run that simply finished is not later mistaken for one that ran out. The
    negative control is a run that hits the step cap, which must report the cap and not the
    finished outcome.
  - >
    F10 — the deprecated variants still work. A 0.16.2-era contract using `CompilesRust` or
    `RustTestPasses` compiles against 0.17.0, emits a deprecation warning naming its replacement,
    and produces the same outcome as before. The negative control is the same assertion against a
    build with the variants removed, which fails to compile.
  - >
    F11 — the toolchain table detects the project. Given a fixture per supported marker file, the
    detector names the ecosystem and the default test argv; given `package.json` beside each of the
    four lockfiles, it resolves the matching package manager. The negative control is a directory
    with no marker, for which it reports no detection rather than guessing Cargo.
  - >
    F12 — the detection reaches the model. A workspace run in a detected project carries the
    ecosystem and its default commands in the assembled context, asserted against the recorded
    prompt rather than against the assembler's internals.
  - >
    F13 — a registered tool can no longer shadow a built-in. `Toolbox::validate` refuses a tool named
    after any built-in, including the git, image, and document tools added since the reserved set was
    written. The negative control is the same assertion run against the 0.16.2 reserved set, which
    accepts `git_status` — that failure is what makes F13 a measurement of the fix.
  non_functional:
  - >
    NF1 — the default dependency tree does not grow. `cargo tree` on the default build stays at 401
    lines. The toolchain table is shipped as Rust data or as JSON parsed by the `serde_json` already
    in the tree, because adding a TOML parser here would break the standing constraint a release
    early, and the configuration release is where that dependency belongs.
  - >
    NF2 — no new system package on any CI runner. The suite runs on the toolchains GitHub's runners
    already provide and skips, with a stated reason, any ecosystem check whose toolchain is absent,
    rather than installing one.
  - >
    NF3 — the store is untouched. No table is added or altered, and `CHECKPOINT_FORMAT` stays 7, so
    a 0.16.2 database opens and resumes against 0.17.0 unchanged.
  - >
    NF4 — the full suite passes on macOS, Linux, and Windows. `exec` has a Windows path and its
    tests either run there or are skipped with a stated reason; the Windows leg's `timeout-minutes`
    stays at the 40 set in 0.16.0.
  - >
    NF5 — `cargo clippy --all-targets --all-features -- -D warnings` and `cargo fmt --check` pass,
    and `cargo doc --all-features` is warning-free.
  operational:
  - >
    OP1 — the nightly docs job runs `--cfg docsrs` on nightly and fails on a documentation error,
    proven by a deliberate failure in a scratch branch before the job is trusted. Exit zero is not
    the check; the rendered HTML must contain the feature labels.
  - >
    OP2 — `docs/public-api.txt` is updated by hand and `tests/public_api.rs` passes against the live
    surface. There is deliberately no regenerate flag.
  - >
    OP3 — `CHANGELOG.md` carries a migration note for each of the two breaks, with the old call on
    one side and the new call on the other, and the changelog checker passes.
  - >
    OP4 — `docs/CONTRACT.md` states what `exec` does and does not bound: that a command runs with the
    embedding program's privileges outside the sandbox, that the policy decides what may start and
    not what a started process then does, and that the tool-shadowing defect is closed. The
    limitations list is updated in both directions.
  - >
    OP5 — a live run against a real non-Rust project is performed by hand before the release is cut,
    and its trace is kept as evidence. The suite proves the mechanism; only a live run proves the
    claim in `outcome.evidence_of_value`.
delivery:
  target_mode: published
  environment: >
    crates.io as `io-harness` 0.17.0, GitHub at initorigin/io-harness with the tag `v0.17.0` and a
    Release titled `io-harness 0.17.0`, and docs.rs, whose build is now gated by a nightly CI job
    rather than discovered after publication.
  deployment_method: >
    The standing flow, unchanged. All work on `feat/0.17.0` off `develop`, including the sealed
    UltraShip release record. PR into `develop`, merged. Release PR `develop` into `main`, merged.
    GitHub Release cut from the tag with notes from the changelog. `cargo publish` last, after both
    merges and the Release exist. `develop` synced to `main` fast-forward only at the end. No branch
    is deleted. `git fetch --tags` after the Release, since `gh release create` makes the tag on the
    remote only.
  migrations:
  - >
    `Verification::CompilesRust`, `RustTestPasses`, and `WorkspaceTestPasses` keep working and warn.
    The migration note gives the replacement for each: a `Command` criterion with the equivalent
    argv. **They are removed in 0.18.0**, the minimum cycle the crate's contract allows — the note
    names that version, so a caller reading the warning knows exactly how long they have rather
    than being told "a future release".
  - >
    A caller who exhaustively matches on `Verification` must handle the two new variants. This is a
    break, it is marked as one against this version in the changelog, and the note says to add a
    `Command` arm and a `None` arm rather than a wildcard, so a future variant is caught by the
    compiler rather than silently absorbed.
  - >
    A caller who registered a tool named after a git, image, or document built-in now fails
    validation at run start instead of having that tool silently ignored. The note says so plainly:
    the tool never worked, and the change is that the failure is now visible.
  - No store migration. No checkpoint-format bump. A 0.16.2 database is read unchanged.
  observability:
  - >
    `exec` emits the tool-call and refusal records every other tool emits, so an operator auditing
    "what was this run allowed to run" finds command execution in `policy_events` beside file and
    network decisions rather than in a second place.
  - >
    A timeout and a truncation are reported in the tool result the model reads, not only in a log,
    because an agent that cannot tell a truncated output from a complete one will draw a wrong
    conclusion from it.
  - >
    The nightly docs job is the release's own observability for the one failure mode that is
    invisible until after publication and irreversible once there.
  rollback: >
    A published version cannot be recalled. The forward fix is 0.17.1 with the correction; `cargo
    yank --version 0.17.0` is the escape hatch and leaves 0.16.2 as what `cargo install` resolves.
    Nothing in this release changes the store or the checkpoint format, so a consumer who reverts to
    0.16.2 keeps their databases and their in-flight runs; only source that named a new item stops
    compiling.
dependencies:
  products: []
  services:
  - GitHub Actions runners for macOS, Linux, and Windows, with their preinstalled toolchains
  - crates.io, for publication
  - docs.rs, for the rendered API reference
  human_approvals:
  - >
    GRANTED 2026-07-29 — `exec` runs in the workspace with the embedding program's privileges rather
    than inside the sandbox. The widest thing this release grants, taken deliberately against `npm
    install` being impossible otherwise. Recorded in US-IO-HARNESS-0.17.0-I02.
  - Owner approval to merge to `main`, cut the Release, and publish, per the standing override.
resource_profile:
  complexity: large
  uncertainty: medium
  likely_cost_drivers:
  - >
    Cross-platform process execution. Spawning, timing out, killing a process tree, and capturing
    output behave differently on Windows than on unix, and the crate's existing Windows story is the
    portable floor — the sandbox's Job Object backend was designed and never implemented.
  - >
    Re-expressing three existing verification variants over one execution path without changing what
    any of them proves. The existing tests are the specification and all of them must still pass.
  - >
    The toolchain table's breadth. Fifteen-odd ecosystems, each needing a fixture and a detection
    test, and four package managers to resolve behind one marker file.
  - >
    Refusal tests with negative controls for every new gated action, which is the standing
    constraint and roughly doubles the test count for `exec` and `edit_file`.
  preferred_tools:
  - tokio::process for spawning, with the existing sandbox's kill and rlimit handling as prior art
  - The existing Policy, ExecGuard, and Sandbox types, extended rather than replaced
  - serde_json for the toolchain table, since it is already in the default tree
  constraints:
  - Additive `CREATE TABLE IF NOT EXISTS` in `Store::from_conn` only — and this release adds none
  - CHECKPOINT_FORMAT stays 7
  - No system package on any runner
  - Default `cargo tree` stays at 401 lines
  - A new capability ships as a new named function rather than an added parameter
  - Every refusal test carries a negative control
  - Stay 0.x
risks:
  - >
    `exec` is the widest capability the crate has ever granted. A policy an operator wrote for file
    access does not constrain command execution, and a permissive default would hand an agent the
    embedding program's full privileges. The mitigation is that `Act::Exec` already exists and is
    already deny-first, and that the guide page and `CONTRACT.md` state the bound in the same words
    used for registered tools and stdio MCP servers. The residual risk is an operator who does not
    read either.
  - >
    Killing a process tree on Windows without a Job Object may leave orphans. The sandbox has the
    same gap and reports the portable floor honestly rather than pretending; `exec` must do the
    same, and a timeout that leaves a child running is a defect to record rather than to hide.
  - >
    Re-expressing the Rust verification variants risks changing what they prove. 0.8.1 already
    hardened them against a subject shadowing a macro the criterion invokes, and that hardening must
    survive the refactor — the existing macro-shadowing test is the guard.
  - >
    The toolchain table will be wrong for someone on day one, because ecosystems disagree with
    themselves. It is shipped as data and made overridable in 0.19.0 for exactly this reason; the
    risk is the two-release gap in between, during which a wrong default can only be worked around
    in the goal text.
  - >
    Scope. This release changes tools, verification, dispatch, documentation, and CI at once. The
    fallback scope drops the toolchain table, which is the largest severable piece and the only one
    whose absence still leaves a coherent release.
open_questions:
  - >
    The numeric values behind the two `exec` bounds — how many seconds the default timeout is, and
    how many bytes the head and tail each keep. These are tuning against real cold builds rather
    than design decisions; the shapes are settled (US-IO-HARNESS-0.17.0-I02) and the numbers are
    chosen during development against measured builds, then stated in the guide page.
  - >
    Whether killing a process tree on Windows without a Job Object leaves orphaned grandchildren. The
    sandbox has the same gap and reports the portable floor honestly rather than pretending. This
    must be measured on the Windows runner, not assumed; if orphans survive, it is recorded as a
    known limitation on the release rather than papered over.
released_at: '2026-07-29T03:05:00Z'
mode: published
delivered: >
  Point the harness at a project in any language and the agent does real work in it. A live run
  against a JavaScript project it was told nothing about, recorded in
  evidence/0.17.0/live-run-node-project.txt, went: find the project, read its three files, install
  its dependency from the real npm registry through `exec`, run `npm test` and get exit 1, re-read
  the file, and fix the bug with a one-line `edit_file` replacement — six steps, 8,951 tokens,
  ending `Success` because the project's own `npm test` exited zero. No Rust is on that path
  anywhere, which is the whole claim. The same run under a policy denying the command is refused
  before anything is spawned, with the rule and the layer in the trace.
evidence:
  tests:
  - >
    `cargo test` (default), `cargo test --features documents --lib --tests`, and
    `cargo test --features media` — 104 suites, 1,940 assertions passing, 0 failing, 0 FAILED lines.
    Full output at evidence/0.17.0/tests.txt.
  - >
    F1-F5 and F12 — tests/exec_tool.rs, 12 tests. The command runs in the workspace root and its
    exit status reaches the FOLLOWING step's recorded prompt; a denied program is refused before a
    process is spawned, attributed to rule "rustc" in layer "ops"; `allow_exec("rustc --version*")`
    beside `deny_exec("rustc --print*")` permits one argv and refuses the other; the tool schema
    offers exactly one property, an array of strings; `a;b && c $(id) `whoami` | d > e.rs` arrives
    at the child byte-identical and creates no `e.rs`; a 30-second command under a 300ms ceiling is
    killed, named as a timeout, and the run returns in under 20 seconds.
  - >
    Each of those refusal criteria has its own negative control, and two of them are load-bearing
    rather than ceremonial: F3's control (a policy allowing both argvs) is what stops the test
    passing against an exec that refused everything after its first call, and F13's (the 0.16.2
    reserved set written out) is what makes the test a measurement of the fix rather than of
    `validate` in general.
  - >
    F6 and F7 — tests/edit_tool.rs, 8 tests. Zero matches and two matches both fail with a typed
    error and both assert the file on disk is still byte-identical to the original. A denied path is
    refused as act "write" by rule "secrets/*" in layer "ops" — the write rule, because an edit is a
    write — with the allowed path as the control.
  - >
    F8, F9 and F10 — tests/language_agnostic.rs, 9 tests. `npm test` over a Node fixture passes and
    fails on exit status, and the failing case records the command's own "expected 42" text as a
    `gate_output` sandbox event. `Verification::None` returns `Finished { steps: 2 }` and reports the
    same on resume, with a step-cap run as the control and a criterion-carrying run proving a quiet
    turn is still just an unproductive step. A 0.16.2-era `WorkspaceTestPasses` contract still
    compiles and still returns `Success { steps: 1 }`.
  - >
    F11 — src/toolchain.rs, 8 tests covering all seventeen markers, all four Node package managers,
    both Python runners, the two ordering rules, JSON round-trip, and the no-marker control that
    returns None rather than guessing Cargo.
  - >
    F13 — tests/custom_tools.rs. All twenty built-in names 0.16.2's reserved set omitted are now
    refused with an Error::Config naming the tool, before the provider is called once.
  builds:
  - >
    `cargo build --all-targets` exit 0; `cargo fmt --check` exit 0; `cargo clippy --all-targets
    -- -D warnings` and `cargo clippy --all-targets --all-features -- -D warnings` both exit 0;
    `cargo doc --all-features --no-deps` warning-free. evidence/0.17.0/build-and-lint.txt.
  - >
    NF1 — `cargo tree | wc -l` is 401 on the default build, the standing constraint, unchanged.
    NF3 — `CHECKPOINT_FORMAT` is still 7 at src/state.rs:74, and the diff from 6117c11 adds no
    CREATE TABLE and no ALTER TABLE; the one trace addition is a new `kind` value in the existing
    sandbox_events table.
  - >
    `cargo package` produced io-harness-0.17.0.crate, 126 files, 2.2 MiB (608.9 KiB compressed), and
    its verify build compiled the packaged sources standalone. evidence/0.17.0/package-verify.txt.
  - >
    scope.excluded verified still absent rather than assumed: the exec schema's only property is
    `argv` (no shell-string form), src/tools/exec.rs makes no code reference to Sandbox, RunSpec or
    SandboxConfig, no configuration parser is in Cargo.toml, src/context.rs and the sandbox modules
    are byte-identical to 0.16.2, `record_run_policy` is untouched, and no LSP, web, todo or
    question tool exists. evidence/0.17.0/scope-check.txt.
  reviews: []
  deployments:
  - >
    NF4 — GitHub Actions run 30417562388 on feat/0.17.0 at 130ae56: all six jobs green, including
    test (windows-latest) at 18m44s against the `timeout-minutes: 40` set in 0.16.0, plus
    test (ubuntu-latest), test (macos-latest), msrv, lint, and the new nightly docs job.
    evidence/0.17.0/ci.txt.
  health_checks:
  - >
    OP1 — the nightly docs job is proven to fail before it is trusted, in CI and not only locally.
    Run 30415978901 on the scratch branch feat/0.17.0-docs-job-control carries the 0.16.0 defect
    restored verbatim: every job succeeds except `docs.rs (nightly)`, which fails with error[E0557].
    Locally, evidence/0.17.0/docs-job-negative-control.txt records both halves against nightly
    1.99.0 — the removed feature name failing the doc step, and the gate deleted entirely producing
    exit 0 with no feature labels, which is why exit zero is not the check.
  - >
    OP5 — the live run against a real non-Rust project, evidence/0.17.0/live-run-node-project.txt.
    The gate is not gameable in it: test.js is denied by the policy, and the example asserts
    afterwards that the suite the run was judged against is byte-identical to the one it started
    with.
known_limitations:
- >
  This record is sealed on `feat/0.17.0` before the crates.io upload, which is the standing flow:
  the record states the authorized target and the flow makes it true. The upload follows the
  develop -> main merge and the GitHub Release, and is the last step.
- >
  **A command runs with the embedding program's privileges, outside the sandbox.** The widest
  capability this crate has ever granted, taken deliberately — the sandbox denies egress and
  discards its workdir, which would make `npm install` impossible. The policy decides what may
  start, not what a started process then does. A policy written for file access does not constrain
  command execution, and `cat secrets/prod.env` is a command rather than a read. Stated in
  CONTRACT.md and in the command-execution guide; the residual risk is an operator who reads
  neither.
- >
  **An exec timeout kills the direct child only.** A process that child started itself may outlive
  it, on every platform. This was the release's own open question about Windows and the answer is
  not Windows-specific: `kill_on_drop` reaches one process, and the crate has no Job Object backend
  to reach a tree with. It is recorded rather than papered over, and it is the same honest floor the
  sandbox already reports for its wall-clock kill.
- >
  **The toolchain table will be wrong for someone.** It was already wrong once, in this release's
  own live run: npm's install default was `npm ci`, which requires a lockfile the fixture did not
  have, and the agent's first move was to run it and watch it fail. Fixed to `npm install`, but the
  class remains — half of all `npm test` scripts do not run tests, and a Python project with a
  `pyproject.toml` may really be driven by a Makefile. It is data shown to the model rather than
  commands the harness runs, so a wrong entry costs a turn and cannot widen a boundary. Overridable
  in 0.19.0; until then the workaround is the goal text.
- >
  **Only the workspace root is examined for a marker.** A monorepo whose packages each carry their
  own `package.json` or `go.mod` gets one detection, for the root. A real case, deliberately not
  handled here; per-directory configuration is 0.19.0's.
- >
  **An allowed exec writes no `policy_events` row.** Refusals and approver decisions do; a silent
  allow does not, for exec no more and no less than for a read or a write. "What actually ran" is
  answered by `steps.tool_call`, not by `policy_events`. Both the guide and CONTRACT.md claimed
  otherwise in draft and were corrected when the live run's trace showed it.
- >
  **A consumer who skips 0.17.0 entirely meets the removal with no warning.** The three Rust
  verification variants are deprecated here and removed in 0.18.0, the minimum cycle, so an upgrade
  straight from 0.16.2 to 0.18.0 never sees the deprecation. The 0.18.0 changelog must say so
  plainly rather than assume a reader upgraded one minor at a time.
- >
  **`Verification::Command` runs inside the sandbox, so a gate cannot reach the network.** A
  criterion that needs to fetch dependencies will not work; the install belongs in the agent's own
  `exec` calls, where egress is available, and the gate belongs on the command that tests.
- >
  Carried unchanged from 0.16.2 and untouched by this release, as `scope.excluded` requires:
  `resume_tree` still does not call `record_run_policy`, so a tree resumed under a widened policy
  leaves an audit that understates what was permitted; `SandboxLimits::max_processes` is enforced by
  nothing on any platform; and the Linux backend installs no seccomp filter. Each needs a release
  that touches its module.
supersedes: 0.16.2
next_recommended_version: 0.18.0
immutable: true
