known_limitations:
- >
  **The record was sealed before the crates.io upload.** `mode: published` states the authorized
  target; the upload follows the feat→develop merge, the develop→main merge and the GitHub Release,
  and is done by hand and last.
- >
  **N4 was met in a different form, and the difference is its own number.** The criterion predicted
  `docs/public-api.txt` would gain exactly one line. It gains **five**: `struct AgentMessage`,
  `const ROOT_ADDRESS`, `const SEND_MESSAGE_TOOL`, `const READ_MESSAGES_TOOL`, `const
  DEFAULT_MAX_WAIT`. The prediction applied 0.59.0's lesson too literally — that file tracks every
  NAME re-exported from `src/lib.rs`, consts included (`SPAWN_TOOL` has been listed since 0.12.0),
  not root-level types only. The three tool and address constants are `pub` for exactly the reason
  `SPAWN_TOOL` is: an `Observer` matching on `EventKind::ToolCall` needs the string. The substance
  of the criterion — that the surface addition is small, additive and enumerated — holds; the
  number was wrong.
- >
  **`cargo test --all-features` did not run locally, and ran on CI instead.** A cold all-features
  build of 88 test binaries exhausted this machine's disk twice; the default suite, both lint
  polarities, the nightly rustdoc gate, the cross-version gate, the sabotage pass, the live run and
  the packaging all ran locally, and the all-features matrix runs on three platforms on the release
  PRs. Stated rather than implied.
- >
  **The derived address uses `#`, not the `-` the scope names.** `scope.included` says a child the
  parent did not name is called `<role>-<run id>`. It is `<role>#<run id>`, and the change is the
  reason the collision class is closed: an assigned address may not contain `#`, so a derived name
  and an assigned one cannot meet. Under a hyphen a parent could assign `searcher-7` and collide
  with a future run id, which would have needed a check about a number nobody has allocated yet.
  One character, decided during implementation, and the substance of the criterion is stronger for
  it.
- >
  **Per-agent egress, ordering across a tree, and delivery latency are not claimed.** A message is
  ordered by row id within one store, which is a total order; nothing here promises that two sends
  from two agents in the same wall-clock instant land in the order a human would have chosen.
- >
  **A tree spawned before 0.60.0 and resumed on it has children with no address.** Their `spawns`
  rows carry an empty `as_name`, so they cannot be addressed and what they send is attributed to a
  derived name. Only a resume across that version boundary reaches this.
- >
  **A wait is bounded but it is not free, and the deadlock question is answered only in the weak
  form.** An agent that waits holds its concurrency slot. The clock means a tree whose agents wait
  on one another spends its clocks and carries on rather than stopping; it does not mean the
  scheduler is aware of the dependency. The contract's open question stands, and the answer this
  release gives is "survivable", not "impossible".
- >
  **An empty `verify_contains` makes any run succeed immediately**, including one that wrote
  nothing: a missing file has read as empty since 0.1.0 and `"".contains("")` is true. Pre-existing
  and outside this release's scope; recorded because building the live instrument hit it.
