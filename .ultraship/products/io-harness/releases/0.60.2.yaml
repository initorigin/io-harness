known_limitations:
- >
  **O3 is met, and the record waited for it rather than claiming it.** The criterion asks for the
  corrected `TaskContract::exec_sandbox` documentation to be verified by reading the docs.rs
  rendering rather than the local file. docs.rs answered 404 and then redirected to the crate
  overview for some minutes after the publish while its build was queued; sealing was held until the
  page existed. Verified on
  `https://docs.rs/io-harness/0.60.2/io_harness/struct.TaskContract.html`: the phrase "not
  contained" does **not** appear anywhere in the rendered `exec_sandbox` documentation, and the
  replacement does — "The `shell_start` / `shell_poll` / `shell_kill` handles take the same
  containment every other spawn takes, per stage (0.48.0.)", followed by the restriction-lives-with-
  its-processes paragraph and the `max_wall_secs` exception. The rendered page is the artifact a
  caller actually reads, and it is the one that was checked.
- >
  **The F5 sweep corrected far more than the contract's first open question anticipated, and the
  question is answered here rather than silently.** That question set "more than a handful of stale
  claims" as the threshold for splitting the sweep into its own release. The sweep found nineteen.
  They were kept here because every one is a one-or-two-sentence replacement in the same class as the
  three the release was written for, none touches `src/` behaviour, and leaving twenty-two
  known-false statements standing in the file this release exists to correct would have been the
  worse outcome. The structural work the audit also wants is still excluded and is still a candidate
  entry of its own — which answers the contract's second open question the same way: not yet.
- >
  **The release found a real defect in `docs/CONTRACT.md` that it does not fix, and it is the most
  consequential thing on this page.** "Everything a run starts is contained (0.48.0)" declared a
  class closed; 0.51.0, 0.52.0 and 0.53.0 then each opened one. The post-edit checker and the `check`
  tool build their own uncontained `Exec` (`src/tools/diagnostics.rs:271` says so in a code comment),
  a language server named in `[[lsp]]` is spawned directly (`src/lsp.rs:321`), and on unix the
  browser child is spawned directly (`src/browser.rs:856`). None is wrapped by the backend
  `sandbox::select` chose, so on those three paths the filesystem boundary is the policy's alone. The
  documentation now says so; **wrapping them is behaviour under `src/` and therefore a later
  release**.
- >
  **`docs/CONTRACT.md:1961` states four timings for five aggregate queries, and always has.** `git
  show 3856084` shows the sentence has read that way since the 0.30.0 commit that wrote it — this is
  a defect in the original prose, not drift. The false "respectively" pairing is removed and no
  timing was re-measured, because this release's own constraints forbid asserting one. Which query
  the missing figure belongs to is unrecoverable.
- >
  **The `RESERVED_TOOL_NAMES` gap is documented and open.** Eighteen dispatched names are absent from
  the set, so a registered tool taking one of them still validates and is then unreachable. This
  release states that in all three places that were claiming otherwise; 0.61.0 closes it, and closing
  it is a break because it changes what `Toolbox::validate` accepts.
- >
  **Windows claims in the rewritten paragraph were not verified on Windows by this release.** They
  are taken from `docs/CONTRACT.md`'s own platform table, which 0.59.0 established across ten CI
  rounds. The sweep marks every Windows-only assertion `unverifiable` from this machine rather than
  claiming it was checked.
- >
  **`cargo test --all-features` ran on CI rather than locally**, which is this repository's standing
  arrangement for that one gate. It passed on all three platforms on PRs #177, #178 and #179, and in
  release.yml on the tagged commit.
- >
  **Four Windows CI failures across the release were classified as environmental and rerun, not
  investigated as defects.** Each was a single test of ~1,400 in a job whose own log carried
  `install-action: installation failed due to bash startup failure`
  (actions/partner-runner-images#169): `f4_an_executing_hook_gets_its_argv_whole_and_the_event_on_stdin`
  (a recorded trap), `a_plan_survives_a_real_sigkill_and_is_approved_by_a_second_process`,
  `what_the_container_actually_permits_on_this_host` (rustup answering os error 183 for a `.rustup`
  that already exists), and on Linux `two_concurrent_children_with_their_own_worktrees_do_not_collide`
  (open since 0.58.0). In each case `src/` and `tests/` were byte-identical to a commit that had
  passed that same job, which is what justified the rerun rather than an investigation. **A release
  that changes no `src/` behaviour cannot reach any of them.**
