    re-run AFTER the version bump — 45 + 10 + 5 + 9 + 8 green. Run in that order deliberately: the
    bump is what made 0.60.2 a released version, and that is what turned
    `the_capabilities_release_table_covers_every_released_version` red for a missing row. 0.57.0's
    lesson, paid again.
