product: io-harness
version: 0.55.0
status: released
release_type: minor

outcome:
  user_can: >
    An operator hands the harness a file and gets one of three honest answers instead of a silent
    wrong one: the file, a slice of the file they asked for by line number, or a refusal that names
    the file, what it is, and what to do next.

    On the image side the accepted set at the door widens while the set on the wire stays exactly
    the four every provider documents. A BMP from a scanner, a TIFF from a camera, an ICO, a TGA or
    a PNM is decoded in pure Rust and re-encoded to PNG before it reaches a provider, so
    `view_image` and `Media` accept it and the request carries a PNG. What this crate cannot decode
    without a dependency it does not carry — SVG, HEIC/HEIF, AVIF — is refused **by name**, with the
    reason and the one-line conversion that fixes it, rather than with the vendor's four-type list.

    On the read side `read_file` gains a type. A UTF-8 file reads as it always did. A UTF-16 file
    with a byte-order mark is decoded and the encoding is named in the observation. An image is
    named as an image and routed to `view_image`. A known document is named and routed to its own
    tool. Anything else is named as binary, with its size and its sniffed kind — where today it
    reads as an **empty file**, because `Workspace::read_file` is
    `std::fs::read_to_string(abs).unwrap_or_default()` (`src/tools/workspace.rs:419`) and a non-UTF-8
    file therefore arrives at the model indistinguishable from a file that does not exist.

    And a file too large to read is refused rather than shortened. Today it is cut to the
    per-observation cap with a marker in the text (`src/context.rs:459-480`, `src/tools/mod.rs:386`),
    which is honest and still not enough: what the model then holds has the shape of a successful
    read, and nothing downstream can tell a whole file from a tail of one. So a read whose content
    will not fit returns **no content at all** — an error naming the file, its size, the limit it
    exceeded, **which** of the two limits that was, and the two ways to proceed. Both ways exist:
    `read_file` takes `offset` and `limit` in lines, and the ceiling is an operator's key in
    `io.toml` rather than a number derived from how much budget happens to be left. A read that
    fitted when it happened and is later squeezed by a narrower budget share is replaced in the
    prompt by a stub that says to re-read a range, never served as a fragment.
  business_value: >
    Two defects with the same shape — a wrong answer wearing the costume of a right one — closed
    together, because both are the doorstep rather than the wire. A model that saw twelve thousand
    characters of a four-hundred-thousand-character file and reasons as though it saw the file
    burns the rest of the run on a false premise; a model handed an empty string for a binary
    concludes the file is empty and writes over it. Neither failure is visible in a trace, which is
    what makes them expensive: the run looks well-behaved all the way to the wrong result.

    The image half removes a class of refusal an operator cannot act on. "image/tiff is not one of
    image/jpeg, image/png, image/gif, image/webp" is a true sentence about a vendor's API that
    reads, at the doorstep, as this crate being unable to open a photograph.
  evidence_of_value: >
    A run over a repository containing a 400 KB source file, a UTF-16 log, a BMP screenshot and a
    stripped binary reaches a correct answer with no fabricated premise: the big file is refused
    with its size and re-read by range, the UTF-16 log is read as text with its encoding named, the
    BMP is attached as a PNG, and the binary is named as binary rather than read as empty. The same
    run on 0.54.0 attaches nothing, reads the binary as an empty file, and carries a truncated tail
    of the big file with no downstream signal that it is a tail.

scope:
  included:
  - >
    **A wide door and a narrow wire for images.** A new public constructor on `Media` (media
    feature) accepts every format this crate can decode and yields a `Media` whose wire media type
    is always one of `IMAGE_MEDIA_TYPES`. Pass-through for the four; decode-and-re-encode-to-PNG for
    BMP, TIFF, ICO, TGA and PNM. `Media::image` is **unchanged** — it stays the strict wire gate,
    with its four-type set and its doctest, because that set is a fact about providers rather than
    about this crate.
  - >
    **A refusal that names the format.** SVG, HEIC/HEIF and AVIF are recognised by extension and by
    magic bytes and refused with the format's own name, the reason this crate does not decode it,
    and a one-line conversion that produces a PNG. A PDF handed to `view_image` is routed to
    `pdf_read` rather than called an unsupported image.
  - >
    **`view_image` uses the wide door**, so the tool the model calls accepts what the constructor
    accepts, and the observation states the transcode when one happened: source type, decoded
    dimensions, encoded PNG bytes, digest.
  - >
    **`image` moves under the `media` feature.** It is already an optional dependency of this crate
    (`Cargo.toml:128`, `default-features = false`, `png` + `jpeg`, reached today only through
    `barcode`). This release enables `bmp`, `tiff`, `ico`, `tga` and `pnm` on it and makes `media`
    pull it. No new entry in `[dependencies]`, no C library, no `-sys` crate, and the default
    `cargo tree` is untouched.
  - >
    **A typed read.** `read_file` classifies before it decodes: UTF-8 (BOM stripped if present),
    UTF-16LE/BE by byte-order mark decoded through `String::from_utf16`, an image extension routed
    to `view_image`, a known document extension routed to its tool, and everything else named as
    binary with its byte size and sniffed kind. `Workspace::read_file` stops swallowing the decode
    failure: a non-UTF-8 file is an error, not an empty string.
  - >
    **A read is whole, asked-for, or refused.** A read whose text exceeds the effective ceiling
    produces **no content**: an error observation naming the path, the size in chars, the ceiling,
    which of the two ceilings bound it, and both remedies. `ObsKind::Read` stops being truncated by
    `bound`.
  - >
    **`read_file` takes `offset` and `limit` in lines** (1-based `offset`, `limit` counted in
    lines), and the observation header states the range and the file's total line count, so a slice
    is legible as a slice.
  - >
    **A stored read is whole or a stub.** In assembly, a `Read` entry that no longer fits its share
    is replaced by a one-line stub naming the path, the size and the range to re-read. Bounding is
    unchanged for every other kind — a command's output and a search's matches were never documents
    and a prefix of them is not a lie.
  - >
    **An operator ceiling.** `[run] max_read_chars` in `io.toml`, projected onto the typed API as
    `Contract::with_max_read_chars`, defaulting to today's budget-derived `entry_cap_chars` value so
    a caller who sets nothing keeps today's numbers. The refusal states which limit it hit, because
    the two call for different answers.
  - >
    Documentation for all of it in the checked-in surfaces, and the changelog entry.
  excluded:
  - >
    **Charset detection beyond a byte-order mark.** No statistical detector, no `chardetng`, no
    `encoding_rs`: both are new dependencies, and a guessed Latin-1 is another confident wrong
    answer of exactly the kind this release exists to remove. A UTF-16 file without a BOM is binary,
    and the refusal says so by name.
  - >
    **Rasterising SVG, HEIC/HEIF or AVIF.** A pure-Rust SVG renderer exists; it is a dependency
    tree, and the standing constraint forbids adding one. This is a deviation from the roadmap
    entry's prose, which explains the refused set as "needing a system C library" — true of HEIC and
    AVIF, not of SVG, which is refused on the dependency budget instead. Stated here rather than
    glossed; the refusal text says the real reason.
  - >
    **Widening `IMAGE_MEDIA_TYPES` or what `Media::image` accepts.** The wire set stays four. A
    release that widened it would put a type on a request that a vendor rejects with an HTTP 400
    reading like a transport failure — the sentence `src/provider/mod.rs:170-215` already gives as
    the reason for the gate.
  - >
    **Decoding documents inside `read_file`.** A known document is *named and routed*, not decoded:
    `xlsx_read`, `docx_read`, `pptx_read` and `pdf_read` already exist behind the `documents`
    feature, and duplicating them in the read path would create a second decoder to keep in step.
  - >
    **Re-encoding anything on the write side.** `write_file` and the edit tools are unchanged.
  - >
    **A new limit on grep, find, exec or MCP output.** Their bounding is unchanged and deliberately
    so.
  fallback_scope:
  - >
    The read half alone: typed classification, the whole-or-refused rule with `offset`/`limit`, the
    assembly stub, and `[run] max_read_chars`. It is a coherent release on its own — "a read is
    whole, a slice you asked for, or a refusal that says why" — and it carries the two silent-wrong
    -answer defects, which are the reason the version exists. The image widening moves to 0.56.0.

acceptance:
  functional:
  - >
    **F1 — a format the wire refuses is accepted at the door and arrives as a PNG.** For each of
    BMP, TIFF, ICO, TGA and PNM, a fixture image of known dimensions goes through the new `Media`
    constructor and yields a `Media` whose media type is `image/png`, whose bytes decode as a PNG of
    those same dimensions, and whose first eight bytes are the PNG signature. Asserted per format,
    not on one representative. Sabotage: pass the source bytes through with the media type rewritten
    to `image/png`, under which the signature and the decode assertions fail and only F1 fails.
  - >
    **F2 — the four wire types are passed through byte-identically.** A PNG, a JPEG, a GIF and a
    WebP through the same constructor come out with their own media type and **byte-identical**
    bytes — no decode, no re-encode, no digest change. A JPEG that survived a round trip through the
    decoder would be a silent quality loss on the common path. Sabotage: re-encode every input to
    PNG unconditionally, under which the JPEG and WebP byte-identity assertions fail and only F2
    fails.
  - >
    **F3 — an undecodable format is refused by its own name, with a remedy.** SVG, HEIC and AVIF
    inputs — each recognised both by extension and, where it has one, by magic bytes with a
    misleading extension — are refused with an `Error::Config` whose text contains the format's
    name, the reason, and a conversion command producing a PNG. The text does **not** consist of the
    four-type list alone. A PDF is refused with a message naming `pdf_read`. Asserted on substrings
    for each of the four. Sabotage: fall back to `Media::image`'s existing message for anything not
    decodable, under which the name-and-remedy assertions fail and only F3 fails.
  - >
    **F4 — `Media::image` is unchanged.** Its four-type set, its refusal text and its doctest are
    byte-identical to 0.54.0, asserted by `git diff` over the function in review and by the existing
    `tests/media.rs` cases passing unmodified. The new door is a second constructor, not a widened
    one.
  - >
    **F5 — `view_image` accepts what the constructor accepts and says what it did.** A `view_image`
    call on a BMP under a permitting policy attaches one `Media` of type `image/png` to the next
    request, and its observation names the source type, the PNG byte count and the digest. A
    `view_image` on an SVG produces F3's refusal through the tool, and attaches nothing. Sabotage:
    keep `view_image`'s extension pre-check as the only gate, under which the BMP is refused before
    the gate and only F5 fails.
  - >
    **F6 — a binary file is named as binary, not read as empty.** A file of bytes that are not valid
    UTF-8 produces an observation naming the path, the byte size and the sniffed kind, and
    containing **no file content**. `Workspace::read_file` on the same path returns `Err`. The
    control is the same file on 0.54.0, where the observation is an empty read — asserted here as a
    regression test with the old behaviour written out, so the fix cannot silently revert. Sabotage:
    restore `unwrap_or_default()`, under which the observation is empty and only F6 fails.
  - >
    **F7 — UTF-16 is decoded and named; UTF-16 without a BOM is binary.** A UTF-16LE file and a
    UTF-16BE file, each with a byte-order mark, read as their exact text with the encoding named in
    the observation header. The same content with the BOM removed is refused as binary, by name.
    Sabotage: decode UTF-16 by pairing bytes without checking the mark, under which the BOM-less
    case reads as text and only F7 fails.
  - >
    **F8 — an image or a document read by `read_file` is routed, not decoded.** `read_file` on a PNG
    names `view_image`; on an `.xlsx`, `.docx`, `.pptx` or `.pdf` it names that format's tool. The
    observation carries no content in either case. Under a build without the `documents` feature the
    document message still names the tool and says the feature is not compiled in, because a model
    told nothing retries the same call. Sabotage: fall through to the binary message for these
    extensions, under which the tool names are absent and only F8 fails.
  - >
    **F9 — a read that will not fit returns no content.** A file whose text exceeds the effective
    ceiling produces an error observation containing the path, the size in chars, the ceiling, and
    both remedies — and containing **none of the file's bytes**, asserted by searching the whole
    observation for a sentinel string placed at the file's head, its middle and its tail. Sabotage:
    keep `bound`'s tail-preserving behaviour for `ObsKind::Read`, under which the tail sentinel
    appears and only F9 fails.
  - >
    **F10 — the refusal names which ceiling it hit.** The same file is refused under a small
    `max_read_chars` with a run budget that would have allowed it, and refused again under the
    budget-derived ceiling with no `max_read_chars` set. The two texts differ and each names its own
    limit. Sabotage: report one message for both, under which the two assertions collide and only
    F10 fails.
  - >
    **F11 — a range read is served and legible as a range.** `read_file` with `offset` 10 and
    `limit` 5 on a 100-line file returns exactly lines 10 to 14, and the observation header states
    the range and the total line count. An `offset` past the end is an error naming the total,
    not an empty success. A range that still exceeds the ceiling is refused by F9's rule. Sabotage:
    treat `offset` as 0-based, under which the returned lines are off by one and only F11 fails.
  - >
    **F12 — a stored read is whole in the prompt or a stub, never a fragment.** An assembled prompt
    under a share too narrow for a read that fitted when it happened contains the stub — path, size,
    and the range to re-read — and **no** content from that read, asserted on the same three
    sentinels as F9. In the same assembly a `Grep` and an `Exec` entry are still bounded with their
    existing marker, which is the negative half of the claim. Sabotage: apply the stub rule to every
    `ObsKind`, under which the grep assertion fails and only F12 fails.
  - >
    **F13 — the ceiling is an operator key that travels the ordinary path.** `[run] max_read_chars`
    in an `io.toml` reaches `Contract` through `Config`, an unknown key beside it is still refused
    by `deny_unknown_fields`, a project-scoped file may narrow it and may not widen it, and a
    contract with nothing set behaves exactly as 0.54.0 did — asserted by an unset run and a set run
    over the same file. Sabotage: read the key straight from the config in the run loop instead of
    projecting it onto the contract, under which the typed-API assertion fails and only F13 fails.
  non_functional:
  - >
    **N1 — no new dependency, and the default tree is unmoved.** `cargo tree` is **402** lines. No
    new entry in `[dependencies]`. `cargo tree --features media` gains only `image` and its
    pure-Rust format crates; the exact added list is recorded in the record, and it contains no
    `-sys` crate and nothing requiring a C toolchain — asserted by the three-platform matrix
    building `--all-features` without a system package.
  - >
    **N2 — the public surface addition is stated in advance and met exactly.** `docs/public-api.txt`
    tracks crate-root re-exports. The prediction is **+1 line** for the new read-classification type
    if it is re-exported at the root, and **+0** otherwise; the new `Media` constructor,
    `Contract::with_max_read_chars` and the new `read_file` parameters add no line. Any difference
    is explained in the record rather than absorbed.
  - >
    **N3 — the read behaviour change is a break, and it is named.** `Workspace::read_file` returns
    `Err` where it returned `Ok("")`, and a read over the ceiling returns an error observation where
    it returned a truncated one. No signature changes and nothing fails to compile; what changes is
    behaviour, which is stated in `migrations` and in the changelog rather than left to be
    discovered.
  - >
    **N4 — no durable state.** `git diff main -- src/state.rs` is empty, `CHECKPOINT_FORMAT` is 7,
    and a 0.54.0 store and a 0.55.0 store are the same store in both directions.
  - >
    **N5 — transcoding is bounded before it is attempted.** A decode is refused before it allocates
    when the source's declared dimensions would exceed a stated pixel bound, and the re-encoded PNG
    is checked against `MAX_IMAGE_BYTES` with the same message the four-type path gives. A 40,000 ×
    40,000 BMP header is a refusal, not an out-of-memory. Measured and recorded, not clock-gated:
    the decode-and-re-encode time for each format's fixture on a named machine.
  operational:
  - >
    **O1 — the three-platform matrix is green**, `--all-features` included, with no system package
    installed on any runner. That is what makes the "pure Rust, no C library" claim in N1 evidence
    rather than an assertion.
  - >
    **O2 — nothing in the suite gates on a wall clock.** The transcode timings in N5 are recorded,
    never asserted. Bounds are sized for the Windows runner, roughly three times slower than the
    development machine.
  - >
    **O3 — `docs/CONTRACT.md` is amended in this release, by name.** The read-tool section and the
    observation-bounding section both describe truncation as what happens to an oversized read; both
    change, and the new rule — whole, asked-for range, or refusal, with the stub in assembly — is
    written where the old one stood. The media section gains the door-versus-wire distinction and
    the refused-by-name list. A release that changed this behaviour and left those sentences
    standing would be shipping a documented lie.
  - >
    **O4 — the checked-in doc surfaces are updated in this release.** The README's feature list,
    `docs/guide/tools-and-skills.md` (`read_file`'s type, its range, and the two ceilings),
    `docs/guide/configuration.md` (`max_read_chars`), `docs/CAPABILITIES.md`, `docs/MEASUREMENTS.md`
    (the transcode timings and the added-crate list) and the changelog entry. Every new public item
    carries a worked example. The doc tests and `tests/public_api.rs` pass.
  - >
    **O5 — the nightly rustdoc gate passes with `-D warnings`.** Run before the release PR:
    `RUSTDOCFLAGS="--cfg docsrs -D warnings" cargo +nightly doc --all-features --no-deps`. It has
    caught something in six of the last seven releases, and this release adds a feature-gated public
    constructor whose doc block links items that exist only under `media`.
  - >
    **O6 — the cross-version gate runs.** `cargo build --manifest-path
    tests/fixtures/gen-0.29.0/Cargo.toml` then `cargo test --test cross_version_0_29_0 -- --ignored`.
    It is the easy-to-forget gate whose generator is not built by default, and N4's
    store-compatibility claim is what it exists to check.
  - >
    **O7 — the three feature polarities are linted, not just the default one.** `cargo clippy
    --all-targets` on the default build, on `--features media`, and on `--all-features`. 0.53.0
    learned that a third polarity — one feature on, another off — is where the lint that CI catches
    and the local gate misses lives.

delivery:
  target_mode: published
  environment: >
    crates.io as `io-harness` 0.55.0, GitHub at initorigin/io-harness with the tag `v0.55.0` and a
    Release titled `io-harness 0.55.0`, and docs.rs.
  deployment_method: >
    The standing flow. All work on `feat/0.55.0` off `develop`, committed incrementally as it lands,
    including the sealed UltraShip release record and the hand-appended lock pin. PR into `develop`,
    merged with the PR button. `develop`'s head **and tree** checked against the tree the gates ran
    on immediately before the release PR is opened — `git diff --quiet feat/0.55.0 develop` —
    because a Dependabot merge has landed above the feature merge in two of the last nineteen
    releases. Release PR `develop` into `main`, merged the same way. The GitHub Release is cut by
    `release.yml` from a tag pushed alone, which takes its notes verbatim from the changelog.
    `cargo publish --locked` by hand afterwards, always last, after both merges and the Release
    exist, with the registry token sourced from the repo-local `.env` in the same shell invocation.
    `develop` synced to `main` fast-forward only at the end. No branch is deleted.
  migrations:
  - >
    **No store migration.** No table, column or index; `CHECKPOINT_FORMAT` unmoved at 7; a 0.54.0
    store and a 0.55.0 store are the same store in both directions. An operator does nothing.
  - >
    **Two behaviour changes an embedder may see, both deliberate.** `Workspace::read_file` returns
    `Err` for a file that is not valid UTF-8 where it returned `Ok(String::new())`; a caller that
    treated the empty string as "empty file" now sees the error it should have seen. And a read that
    exceeds the ceiling produces an error observation rather than a truncated one; a run that
    depended on getting the tail of a large file must ask for a range. Both are named in the
    changelog under a heading, not left in a bullet list.
  - >
    **One cost change.** The `media` feature now compiles `image` and five pure-Rust format
    decoders, and `browser` implies `media`. A consumer building `--features media` sees a longer
    first build. Nothing is added to the default build.
  observability:
  - >
    The refusal observations are the release's observability, and they are written to be read by an
    operator in a trace as well as by the model: the path, the size, the limit, which limit, and the
    remedy — one line each, no stack traces, no vendor text.
  - >
    A transcode says so in `view_image`'s observation — source type, dimensions, PNG bytes, digest —
    so a trace shows that the bytes on the wire are not the bytes on disk. A pass-through says
    nothing new, because nothing happened.
  - >
    No new `EventKind`, no new row, no new table. This release changes what an observation says, not
    what the trace records.
  rollback: >
    A published version cannot be recalled; the forward fix is 0.55.1 and `cargo yank --version
    0.55.0` is the escape hatch, leaving 0.54.0 as what `cargo install` resolves. Reverting the read
    behaviour needs no downgrade and no migration: `max_read_chars` set high restores a whole read
    for any file an operator chooses, and the range parameters are additive. The image widening is
    reachable only through a new constructor and through `view_image`, so a consumer that calls
    `Media::image` is on 0.54.0's exact path. There is no durable state, so a downgrade after a run
    is a downgrade rather than a migration.

dependencies:
  products: []
  services:
  - >
    crates.io and GitHub Actions for the release itself, as every version.
  - >
    **No live provider call is required.** Every claim is about this crate's doorstep — its
    decoders, its classification, its ceilings and its assembly — and is proven in-process against
    fixtures and scripted providers.
  human_approvals:
  - >
    **The wire set stays four; the door is a second constructor.** Decided at specification time,
    2026-08-14. `Media::image` is unchanged, including its doctest, because the four-type set is a
    fact about vendors rather than about this crate.
  - >
    **SVG, HEIC and AVIF are refused by name, and SVG is refused on the dependency budget rather
    than on a C library.** Decided at specification time, 2026-08-14. This is a stated deviation from
    the roadmap entry's prose and is recorded as such rather than reworded to fit.
  - >
    **Charset detection stops at the byte-order mark.** Decided at specification time, 2026-08-14. A
    guessed encoding is the same class of confident wrong answer this release exists to remove, and
    every detector is a new dependency.
  - >
    **`image` moves under `media` rather than behind a new feature.** Decided at specification time,
    2026-08-14. A cargo feature guarding one constructor is a knob nobody would set; the default
    build is what the no-new-dependency constraint protects, and it is untouched.
  - >
    **A read is refused whole rather than truncated, and only for `ObsKind::Read`.** Decided at
    specification time, 2026-08-14. A command's output and a search's matches were never documents,
    and a prefix of them is not a lie.
  - >
    **`delivery.target_mode` is `published`.** Decided at specification time, 2026-08-14.
  - >
    The PR, both merges, the Release and the publish are pre-authorised for this version under the
    standing flow.

resource_profile:
  complexity: medium
  uncertainty: medium
  likely_cost_drivers:
  - >
    **The ceiling is read in four places and they must agree.** `entry_cap_chars` is called from
    `src/session.rs:882`, `src/run.rs:4281`, `src/run.rs:4743`, `src/run.rs:7010` and
    `src/mcp.rs:748`, and `src/context.rs:643` calls it again inside assembly. An operator ceiling
    that reaches three of the six is a limit that moves depending on which path produced the read.
  - >
    **`bound` is shared by every observation kind** (`src/context.rs:452`), so changing what
    `ObsKind::Read` does is a change to a function four other kinds depend on. F12's negative half
    exists because the plausible mistake is applying the new rule to all of them.
  - >
    **The fixtures are real work.** A BMP, a TIFF, an ICO, a TGA, a PNM, a HEIC, an AVIF, an SVG, a
    UTF-16LE and BE pair, a BOM-less UTF-16 file and a non-UTF-8 binary all have to exist as bytes
    in the repository, small enough to check in, and each must be genuinely the format it claims —
    a hand-written stub that fails to decode proves nothing.
  - >
    **`read_file`'s classification changes what many existing tests observe.** Every test that reads
    a file through the tool and asserts on the observation header is in the blast radius, and the
    ones that assert on a truncation marker are the ones that must change meaning rather than
    wording.
  - >
    **The `media` feature's tree changes**, so any assertion in the suite or in CI that counts
    dependencies has to distinguish the default tree from the feature trees. N1's claim is
    specifically about the default one.
  preferred_tools:
  - >
    `tests/media.rs` for F1–F5, which already owns the four-type assertions and the fixture
    conventions.
  - >
    A new `tests/read_typing.rs` for F6–F8 and F11, and `tests/context.rs` for F9, F10 and F12,
    where assembly and the per-observation cap are already asserted.
  - >
    `tests/config.rs` for F13, which already covers the project-scope narrowing rule and
    `deny_unknown_fields`.
  - >
    `cargo test --doc` for the new constructor's worked example, which `tests/public_api.rs`
    requires.
  constraints:
  - >
    **No new runtime dependency.** `cargo tree` flat at 402 on the default build. Enabling further
    formats on an already-declared optional dependency is not a new dependency; adding a rasteriser
    would be.
  - >
    **MSRV 1.95, edition 2021, Apache-2.0.** Unchanged. `image` 0.25 and its format crates must
    build on 1.95 — checked, not assumed.
  - >
    **Every version stays 0.x.x.** No 1.0.0 is planned or implied by this release.
  - >
    **The trust rule extends and never weakens.** `max_read_chars` at project scope may narrow the
    ceiling and may never widen it, like every other budget key.
  - >
    **No durable state.** Nothing this release produces reaches the store beyond the observations
    every tool already writes.
  - >
    **`docs/CONTRACT.md`, the README, the changelog, the guide pages and the crate-root prose are
    checked-in surfaces.** They change in this release, not in the next one.

risks:
- >
  **A re-encode that silently degrades a common image.** Routing the four wire types through the
  decoder would re-encode a JPEG as a PNG, or worse, back to a JPEG at a different quality, and
  nothing in a trace would show it. Mitigation: F2 asserts byte-identity for all four, and its
  sabotage is the unconditional re-encode.
- >
  **A decoder used as an oracle for files outside the policy.** `view_image`'s existing extension
  pre-check runs before the gate and is safe only because it reads nothing. A classification that
  sniffs magic bytes must happen **after** the gate, or it becomes a way to probe for a file's
  existence and content type outside the boundary. Mitigation: the sniff is inside the gated branch
  by construction, and a test asserts a denied path produces the refusal with no read attempted.
- >
  **A decompression bomb.** A small TIFF or PNM header can declare an enormous image, and decoding
  it allocates before anything checks the result. Mitigation: N5's pixel bound is checked against
  the declared dimensions before decoding, and the encoded result is checked against
  `MAX_IMAGE_BYTES`.
- >
  **The whole-or-refused rule turns a working run into a stuck one.** An agent that used to get a
  tail now gets a refusal, and a model that does not take up the offered range simply retries the
  same call. Mitigation: the refusal names the range parameters and gives a concrete example call,
  the ceiling is an operator key that can be raised, and the fallback of the read half alone is the
  smaller release if this proves worse in a live run.
- >
  **A ceiling that still moves under the operator.** `max_read_chars` defaults to the budget-derived
  value, so an operator who sets nothing keeps today's drifting limit — which is the defect the
  roadmap entry names. Mitigation: the refusal states which ceiling bound it, so the drift is
  visible at the moment it matters, and the documentation says plainly that predictability requires
  setting the key.
- >
  **UTF-16 decoded from a BOM that is a coincidence.** Two bytes are a weak signal on a short file.
  Mitigation: the mark is required at offset zero, the remainder must be an even byte count and
  decode without replacement characters, and anything else is binary.

open_questions:
- >
  **Whether the read classification is re-exported at the crate root.** N2 predicts `+1` line in
  `docs/public-api.txt` if it is and `+0` if it is not. It is useful to an embedder that calls
  `Workspace` directly and dead weight to one that only runs the loop; settled during implementation
  by whether anything outside `run.rs` needs to match on it, and stated in the record either way.
- >
  **Whether `max_read_chars` counts chars or bytes.** Chars matches `entry_cap_chars` and the
  existing bound; bytes is what an operator reading `ls -l` has in front of them. The plan is chars,
  for continuity with the limit it defaults to, with the refusal stating both numbers so the
  operator never has to convert.
- >
  **Whether the assembly stub should carry a suggested range rather than only the size.** A stub
  that says "re-read lines 1–400" is more actionable and is also a guess about what the model
  wanted. The plan is size and path plus the parameter names, and to revisit it against what a live
  run actually does with the stub.
- >
  **Whether ICO, TGA and PNM earn their place.** BMP and TIFF are the formats the roadmap entry
  names and the ones an operator actually hands over; the other three are three lines of match arm
  each and one fixture each. They are included because the marginal cost is a fixture, and they are
  the first thing dropped if the fixtures prove awkward.
