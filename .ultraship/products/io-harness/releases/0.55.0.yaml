known_limitations:
- >
  **The all-features suite did not complete locally, and ran on CI instead.** `cargo test
  --all-features --no-fail-fast` reached 39 of its binaries — 995 passed, 0 failed — and then died
  with `no space left on device`: an all-features target for this crate is ~20 GB and this machine
  had 14 GiB after a clean, with a sibling repository's `target/` holding 37 GB. Nothing was failing
  when it stopped. The gate therefore runs on the release PR's three-platform matrix, which is the
  0.53.0 rule — a record may honestly say a gate ran on CI rather than locally, provided it says so.
  This entry says so.
- >
  **Document reads are still bounded to a tail.** `xlsx_read`, `docx_read`, `pptx_read` and
  `pdf_read` return a rendering of a file rather than the file, they were not in this release's
  `scope.included`, and they keep `bound`'s tail-preserving behaviour. The same argument that makes
  a truncated `read_file` a lie applies to them more weakly and not not at all; it is a candidate
  for a later version rather than an oversight.
- >
  **A `[profile]` block can still set `max_read_chars` outright at project scope.** The narrowing
  rule is applied where a scope's own table is merged, and `with_profile` overlays a profile after
  every scope has been folded together, so the scope its keys came from is no longer knowable there.
  A project-scoped profile therefore sets the key rather than only lowering it. The budget-derived
  ceiling still applies to every read regardless, so this cannot widen the effective boundary past
  what the run's budget allows — it is a gap in the narrowing rule, not in the ceiling.
- >
  **`view_image`'s transcode note carries the source type, the wire type, the PNG byte count and the
  digest — not the decoded dimensions** that `scope.included` mentioned. Reporting dimensions would
  have meant changing what `Media::attach` returns for one line of prose. Stated rather than
  glossed; F5, which is the criterion, asks for the source type, the byte count and the digest, and
  all three are there.
- >
  **S7's sabotage failed far more than the criterion predicted, and that is a finding.** Decoding
  UTF-16 without requiring a byte-order mark killed 10 tests rather than F7's one, because any
  even-length ASCII file then decodes into UTF-16 nonsense. The byte-order-mark check is load-bearing
  for every text read in the crate, not only for the UTF-16 ones.
- >
  **A sabotage script must assert its own edit applied.** S13's first attempt silently matched
  nothing — `cargo fmt` had joined the `merge(...)` call onto one line after the pattern was written
  — and the suite passed. A sabotage that did not apply is indistinguishable from a guard that
  protects nothing. The rerun asserted the pattern first and killed the named test.
- >
  **The record was sealed before the crates.io upload**, which follows the two merges and the GitHub
  Release under the standing flow.
- >
  **A charset detector is deliberately absent.** UTF-16 without a byte-order mark, and every
  single-byte legacy encoding, is `Binary` — named, with its size, rather than guessed at. Adding a
  detector is a new dependency and a new class of confident wrong answer.
