mode: published
delivered: >
  An operator hands the harness a file and gets one of three honest answers instead of a silent
  wrong one. `read_file` classifies before it decodes — text with the encoding it was decoded
  from, an image or a document named and routed to the tool that opens it, and anything else named
  as binary with its size and its sniffed kind. A read that will not fit returns no content at all,
  naming the path, the size, the ceiling, which of the two ceilings that was, and both ways
  forward; `offset` and `limit` in lines make the offered remedy real, and a stored read that is
  later squeezed becomes a stub rather than a fragment. `[run] max_read_chars` makes the ceiling a
  number an operator chose instead of one that moves as the run spends.

  On the image side the accepted set at the door widened while the set on the wire stayed exactly
  the four every provider documents. `Media::attach` passes those four through byte-identically and
  converts BMP, TIFF, ICO, TGA and PNM to PNG; SVG, HEIC and AVIF are refused by name, with the
  reason and a one-line conversion, and a PDF is routed to `pdf_read`.

  Two silent-wrong-answer defects are closed by it. A binary read used to return `Ok("")` — the
  same answer a file that does not exist gives — and an oversized read used to return a tail
  wearing the shape of a whole file.
