known_limitations:
- >
  **This record was sealed before the crates.io upload.** `mode: published` is the release's target
  and the flow's last step: the develop merge, the main merge and the GitHub Release all come after
  the record rides the `feat/0.36.0` commit, and `cargo publish --locked` comes after those. Sealing
  it `release-ready` and correcting it afterwards would mean editing an immutable record, which is
  worse.
- >
  **The worktree slug carries a fourth component the contract's prose did not name.** `included`
  derives the path from `<agent>-<parent_run_id>-<step>`, which is not unique for the shape F3
  actually names: two children of the same definition in the same step differ only in their goal.
  The slug therefore ends in an FNV-1a digest of the goal — the remaining part of the
  `(parent, step, goal)` key `find_spawn` adopts by. FNV is written out rather than
  `std::hash::DefaultHasher`, which is documented as unstable across releases; a slug that moved on
  rebuild would send a resumed spawn to a worktree that is not there.
- >
  **N3 is met in a different shape and the difference matters.** Its prose asks for "a source-reading
  test in the shape 0.33.0 and 0.35.0 used" — those grep for a *module path*, which cannot work here
  because `rewind_run` lives in `src/run.rs` beside the loop and there is no module boundary to grep
  for. What is asserted instead is the load-bearing half: no `*_TOOL` constant names a rewind, and
  outside doc comments `src/run.rs` holds exactly three lines mentioning one — the two definitions
  and the delegation — with a splice-in control that makes the count four. Trap 70 applies: that is
  what it proves, not "the loop does no rewind work".
- >
  **N4 lists two items the worked-example gate does not reach.** `GIT_BRANCH_TOOL` and
  `GIT_WORKTREE_TOOL` are `io_harness::tools::` constants rather than crate-root re-exports, so
  `every_public_item_has_a_worked_example` does not see them — and their five siblings carry prose
  and no example. They are documented to exactly that standard rather than being made the only two
  of seven with a doctest, which for a `&str` constant would assert its own spelling.
- >
  **F7 compares a row count that is legitimately zero.** Its prose names `run_events` among the
  tables that must not move. A run driven by `run_with` rather than an observed entry point writes
  no `run_events` rows at all — the durable stream is `Broadcast`'s, not the loop's — so that count
  is 0 before and after. It is still compared rather than dropped, and the "the run left a trace"
  assertion is made against `steps`.
- >
  **A worktree is visible to the parent, and this crate will not hide it.** The parent's own
  `git_status` reports `?? .worktrees/` — measured, not assumed — so a `git_add` naming `.` in the
  parent stages the children's trees. Writing to `.git/info/exclude` was considered and excluded: it
  is a write outside what the caller asked for and outside what the policy governs. The operator
  gets the one line instead.
- >
  **Nothing removes a worktree or deletes a branch**, so both accumulate until an operator clears
  them. Removing a worktree deletes the work a child was spawned to produce, which is not a decision
  this crate makes.
- >
  **A rewind bypasses the memory pin.** Restoring goes around `memory_write`, so an entry pinned
  *after* the run wrote it is still put back. The alternative is telling a caller a rewind happened
  when it had not.
- >
  **A rewind is one run, not a tree**, and is not transactional. A caller wanting a subtree loops
  over it; choosing an ordering over children whose written paths may overlap is a decision this
  crate does not make.
- >
  **A test failed once under disk pressure and passed twice afterwards.**
  `tests/handles.rs::a_handle_that_exits_on_its_own_stops_reading_as_running` failed in the first
  default-feature run on a volume at 11 GiB free with five rust-analyzer processes rebuilding into
  the same tree, then passed under `--all-features` and again on the re-run. It reads as a store
  assertion and is a wall-clock one: the exit is noticed by a poll that has to reach disk. This
  release touches no handle code. Recorded rather than quietly re-run.
- >
  **The local suites ran with `CARGO_PROFILE_DEV_DEBUG=0` and `CARGO_PROFILE_TEST_DEBUG=0`,** and
  `target/` was deleted three times during the release (4.6 GiB, 12 GiB and a 6.9 GiB `cargo clean`).
  The volume reached 4.5 GiB free at its lowest. Debug info changes no test outcome and CI runs the
  unmodified commands on a fresh runner; recorded because the numbers above were measured under it.
- >
  **Inherited and unresolved: 0.30.0's N2 wording.** "The aggregates do not scale with the trace"
  over-claims — counting every row is the answer. Raised rather than read as satisfied, and
  untouched by this release.
