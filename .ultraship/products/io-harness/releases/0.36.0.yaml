product: io-harness
version: 0.36.0
status: released
release_type: minor

outcome:
  user_can: >
    Give a run its own branch to land on and its own working tree to land in, and put back
    everything a run did — not only the files it wrote, but what it remembered and what it had
    queued — without losing the record that it happened.

    Git reaches this crate as five fixed-argv built-ins: `git_status`, `git_diff`, `git_log`,
    `git_add` and `git_commit`. The model supplies paths and a commit message and never a
    subcommand or a flag, so `push`, `fetch`, `reset`, `rebase`, `stash` and `checkout` are
    unreachable by construction rather than excluded by a rule someone maintains. The consequence
    nobody chose is that a run commits onto whatever branch it found: an agent asked to fix a test
    lands its commit on `main` because `main` is what was checked out, and a human reviewing the
    work has to move it themselves. The second consequence is that every agent in a tree shares one
    working tree, so two children editing the same file are one overwriting the other.

    0.36.0 adds two built-ins under the same construction. `git_branch` runs
    `git switch --create <name>` — it creates a branch at the current commit and moves onto it,
    which is the one shape of a checkout that cannot discard anything, so the forbidden list is not
    weakened to allow it. `git_worktree` runs `git worktree add -b <name> <path>` for a
    policy-checked path, giving a second working tree at its own branch. Both validate their branch
    name in this crate before a spawn, the way a path beginning with `-` has been refused since the
    first git built-in shipped.

    A child gets one without asking. An `AgentDef` with `worktree = true` is rooted at its own
    worktree under `.worktrees/`, on its own branch, created before the child starts and reused —
    not recreated — when a resumed tree adopts a child it already spawned. Two concurrent children
    of that definition write the same relative path and neither sees the other's file.

    And `rewind` widens from a path to a run. `rewind_run` puts back every file the run wrote, in
    the four verdicts 0.28.0 already distinguishes; restores every memory entry it wrote, to the
    value that was there before its *first* write to that key; and clears the spawn backlog the run
    left queued. What it does not do is erase the attempt: the steps, the events, the ledger and
    the spawn rows are untouched, and the rewind itself is a durable row naming exactly what it
    restored, removed and cleared. The trace holds both branches — the work and its undoing — so
    "what did this run do, and what is left of it" have separate answers.

    What it still cannot undo, it says rather than implies: a commit is not un-committed, a push is
    not recalled, a migration is not reversed, a provider call is not un-billed, and a worktree is
    never removed by this crate.

  business_value: >
    Both halves close the same gap: the crate can start work but cannot hand it back in a shape a
    human can accept or reject.

    A run that lands on the branch it found is a run whose output a reviewer must first
    disentangle. That is the difference between an agent an operator lets run unattended and one
    they watch — not because the work is worse, but because the blast radius of accepting it is the
    whole branch. A branch per run makes the review a diff and the rejection a deletion, which is
    the property that makes an unattended run affordable. It is also the last piece the crate owes
    a fleet: 0.32.0 made concurrent agents throttle instead of refuse, and left them all editing one
    working tree, so the concurrency it bought was usable only for work that did not overlap.

    Rewind's gap is narrower and sharper. 0.28.0 shipped a restore point per file, which answers
    "undo this edit" and silently does not answer "undo this run". A run that wrote three files,
    recorded two decisions in memory and queued four children leaves three of those five effects in
    place after the operator has restored every file — and the two that remain are the ones that
    change what the *next* run does. Memory is read into context, so a wrong fact a rewound run
    learned outlives the files it was learned from; a queue backlog is adopted on resume, so work
    the operator undid is re-admitted. Partial undo is worse than none, because it looks complete.

    Keeping the trace is what stops the fix becoming a different lie. An undo that deletes the rows
    makes the ledger disagree with the invoice and makes "this agent has tried this three times"
    unanswerable. The spend happened. The record of what was undone is the thing an operator is
    actually asking for when they ask what a run did.

  evidence_of_value: >
    Executed, in the technique the last six releases used: a pair that must differ, a negative
    control that must not, one sabotage per arm of every two-armed claim, and a sabotage that fails
    nothing reported as a finding rather than propped up.

    The branch claim is proven against a real repository, not a mock: a scripted provider drives
    `git_branch`, an edit, `git_add` and `git_commit`, and the discriminating assertion is that the
    branch the run *started* on is unmoved while the new branch carries the commit. A run that
    committed where it found itself passes every weaker assertion — the commit exists, the file
    changed — and fails this one.

    The collision claim is proven by executing the collision. Two children of a `worktree = true`
    definition write the same relative path concurrently and both files survive with different
    contents; the control is the identical tree with `worktree = false`, under which one child's
    write is lost. The property is worth nothing unless the control fails, so the control is run.

    The rewind claim is proven on the value, not the event. The memory half asserts the *previous
    value* of a key the run overwrote — a rewind that deleted the key, or restored the value the run
    wrote, satisfies "the entry changed" and fails this. The first-write guard is proven by a run
    that writes one key five times and rewinds to the value before write one, with the guard's
    removal failing that named test rather than a compile.

    The both-branches claim is proven by counting what must not move: after a rewind, the `steps`,
    `run_events`, `spawns` and ledger rows are identical to what they were before it, and one
    `rewinds` row names what went. A rewind implemented by deleting rows passes every restoration
    assertion and fails this one.

scope:
  included:
  - >
    `GIT_BRANCH_TOOL` (`git_branch`) — a sixth built-in, `git switch --create <name>`, built by the
    same `GitCmd` → `options`/`paths`/`config` construction as the five that exist. The name is
    model-supplied and is therefore validated in this crate before any spawn: non-empty, at most
    100 characters, `[A-Za-z0-9._/-]` only, no leading `-`, no `..`, no leading or trailing `/`, no
    `.lock` suffix. A refused name is an observation the agent can act on, in the shape the existing
    refusal of a path beginning with `-` already has.
  - >
    `GIT_WORKTREE_TOOL` (`git_worktree`) — `git worktree add -b <name> <path>`. The branch name goes
    through the same validation; the path goes through the same `Act::Write` resolution and check
    every model-supplied path in this crate goes through, so a worktree cannot be created anywhere
    the run may not write. A second working tree at its own branch, created from the current commit.
  - >
    **`switch --create` rather than `checkout -b`, and the forbidden list is not weakened.**
    `no_shape_can_write_or_reach_the_network` asserts that no argv this module builds contains
    `push`, `fetch`, `clone`, `remote`, `reset`, `checkout`, `rebase`, `stash`, `filter-branch` or
    `--force`, and it still does. `switch --create` cannot discard a working-tree change — it
    creates a ref at HEAD and moves onto it, carrying the tree — which is the argument for allowing
    it where `checkout` stays refused, and it is the argument that must be written down rather than
    left to the reader.
  - >
    `AgentDef.worktree: bool` — a child of that definition is rooted at its own worktree under
    `<root>/.worktrees/<agent>-<parent_run_id>-<step>`, on a branch of the same name, created before
    the child's first step. **Creation is idempotent by the same key the spawn is adopted by**: a
    resumed tree that re-plays a spawn finds the worktree and the branch it already made and reuses
    them, because re-creating them would fail and re-deriving them would discard the child's work.
    If the worktree cannot be created — no git, not a repository, the path refused by policy — the
    spawn fails with the reason as an observation and **no child starts**, because silently sharing
    the parent's tree is exactly the collision the flag was set to prevent.
  - >
    **The one break: `AgentDef` gains `#[non_exhaustive]` and the `worktree` field**, paid together
    for the reason 0.34.0 and 0.35.0 paid it on `Verification` and `TaskContract` — both are the
    same break for an external struct literal, and paying it once makes every later `AgentDef` field
    free. `AgentDef::new` and every builder call site is untouched; `#[serde(deny_unknown_fields)]`
    and `Default` are kept, so a roster in `io.toml` that names no `worktree` deserializes unchanged.
  - >
    `rewind_run(&Workspace, &Store, run_id) -> Result<Rewound>` — the whole run, beside the existing
    per-path `rewind`, which is untouched and keeps its signature and its four verdicts.
  - >
    `Rewound` — what the call did: `files: Vec<(String, Rewind)>` reusing the existing four-variant
    verdict rather than inventing a second vocabulary, `memory_restored: Vec<String>` and
    `memory_removed: Vec<String>` (a key the run overwrote versus one it created), and
    `queue_cleared: Vec<(u32, String)>` in the `(depth, goal)` shape `Store::queued_agents` already
    returns.
  - >
    A memory restore point, in the shape `snapshots` already has: one row per `(run, workspace, key)`
    written at the run's **first** write to that key, holding the previous value, kind and pinned
    flag or the fact that there was none. First-write and not last-write for the reason 0.28.0 chose
    it for files — it is what makes "the way it was" one operation rather than five — and guarded by
    a unique index so a second write cannot move it.
  - >
    A durable record of the rewind itself: one row naming the run, the time, and what was restored,
    removed and cleared, readable through `Store::rewinds(run_id)`. This is the whole of "the trace
    keeps both branches" — nothing in `steps`, `run_events`, `spawns` or the ledger is deleted or
    altered by a rewind, and what the rewind took away is written down before it is taken.
  - >
    `EventKind::Rewound { run_id, files, memory, queued }` — free, `EventKind` has been
    `#[non_exhaustive]` since 0.24.0 — built from the `Rewound` value the call is returning, never
    from a second query, per the rule 0.32.0 paid for. With its `EVENT_NAMES` entry and its round
    trip through `every_kind()` and the source-reading census.
  - >
    Two additive tables and their indexes, fed to `ADDED_SINCE_0_22_0` by name because there is
    deliberately no prefix rule. `CHECKPOINT_FORMAT` stays 7 — no checkpoint layout changes, and
    bumping it would make `check_resumable` refuse every 0.35.0 store over tables an older binary
    never queries.
  - >
    Documentation as part of the release: `docs/guide/images-and-git.md` gains the two built-ins and
    the per-child worktree, `docs/guide/durable-runs.md` gains `rewind_run` beside `rewind`,
    `docs/guide/context-and-memory.md` gains the memory restore point, plus `docs/CONTRACT.md`,
    `README.md`, `CHANGELOG.md` with the `*Migration:*` note the one break owes,
    `docs/public-api.txt` edited by hand, and a worked example on every added public item. **No new
    guide page and therefore no `GUIDES`/`CAPABILITIES.md` bookkeeping** — every addition belongs to
    a capability that already has a page, which is the 0.31.0 precedent.
  excluded:
  - >
    Any git operation that reaches the network or rewrites history. `push`, `fetch`, `clone`,
    `remote`, `reset`, `rebase`, `stash` and `filter-branch` stay unreachable, and `checkout` stays
    on the forbidden list. A run's branch is landed for a human to push, not pushed.
  - >
    Removing a worktree, deleting a branch, or merging one. `git worktree remove` deletes a child's
    working tree, which is the one thing in this design that can destroy work the crate was asked to
    produce; an operator removes it with the command git already gives them. Stated in
    `docs/CONTRACT.md` rather than left to be discovered as accumulating directories.
  - >
    Un-committing. `rewind_run` restores the working tree, memory and the queue; a commit the run
    made stays. Undoing it needs `reset` or a revert commit — the first is forbidden by construction
    and the second is a decision about history that belongs to whoever owns the branch.
  - >
    Rewinding a tree. `rewind_run` takes one run id and touches one run's snapshots, one run's
    memory writes and one run's queue rows. A caller who wants a subtree loops over it, which is
    honest about what "a rewind" means and avoids inventing an ordering over children whose files
    may overlap.
  - >
    Rewinding to an arbitrary step. The restore point is the state before the run's first write, the
    same definition and the same rows 0.28.0 chose. Per-step rewind needs a different storage shape
    — every version of every value rather than the first — and is a release of its own.
  - >
    Writing to `.git/info/exclude`, `.gitignore`, or any other repository metadata to hide the
    worktree directory from the parent's `git_status`. It is a write outside what the caller asked
    for and outside what the policy governs. What the parent's `git_status` actually reports once a
    worktree exists is measured during development and stated in `docs/CONTRACT.md`, with the
    one-line exclusion an operator can add themselves.
  - >
    A branch-name or worktree policy — `Act::Branch`, an allowed-prefix rule, a per-agent naming
    scheme. The name is validated for what git and an argv can carry, not for what an operator would
    prefer. A policy over branch names is a feature nobody has asked for.
  fallback_scope:
  - >
    The two built-ins and the whole of the rewind widening, **without** `AgentDef.worktree`. A run
    still lands as a branch, `git_worktree` still gives an agent a second working tree on request,
    and `rewind_run` still puts back files, memory and the queue with both branches in the trace.
    What drops is the per-child rooting — the half that touches the spawn path and the tree loop —
    and with it the release's only break, since `AgentDef` then gains no field. The roadmap's own
    headline ("a run lands as a branch, and can be put back") still holds; "concurrent agents stop
    colliding" becomes something an application arranges with `git_worktree` rather than something a
    definition declares.

acceptance:
  functional:
  - >
    **F1 — the two built-ins are fixed argv, and the forbidden surface is still unreachable.** Every
    `GitCmd` shape, including the two new ones, is asserted to produce a subcommand drawn from
    `status`, `diff`, `log`, `add`, `commit`, `switch`, `worktree` and nothing else, and
    `no_shape_can_write_or_reach_the_network` passes **unchanged** over the widened shape list — the
    pre-existing test, not a rewritten one, because a release that relaxed the list to fit its new
    argv is what that test exists to catch. The control is name validation: `-x`, `a..b`, `/lead`,
    `trail/`, `x.lock`, a 101-character name and an empty name are each refused before any spawn,
    and the same name with the offending part removed is accepted.
  - >
    **F2 — a run lands as a branch, and the branch it started on is unmoved.** A real git repository
    in a temporary directory with one commit on `main`. A scripted provider drives `git_branch`, an
    edit, `git_add` and `git_commit`. Assertions: `HEAD` is the new branch, the new branch's tip is
    a commit the run made, the file's change is in that commit, **and `main` still points at the
    commit it pointed at before the run** — the discriminating one, because a run that never
    switched satisfies every other assertion here. The commit is attributed to the run's `Identity`,
    which is the existing behaviour asserted to survive the branch.
  - >
    **F3 — two concurrent children do not collide, and the collision is executed as the control.**
    A tree whose roster holds one `worktree = true` definition, `max_concurrent_agents = 2`, two
    children spawned from it, each writing the same relative path with different contents. Assertions:
    each child's worktree exists at its own path under `.worktrees/`, each holds that child's
    content, the two contents differ, the parent's own working tree does not hold either, and each
    child's branch carries its own commit. **The control is the identical tree with
    `worktree = false`**, under which the two children write one file and one write is lost — the
    property is worth nothing unless the control fails, so the control is run and its outcome
    recorded. What the parent's `git_status` reports with the worktrees present is asserted to be
    whatever it is and written into `docs/CONTRACT.md`; it is not assumed.
  - >
    **F4 — an adopted child reuses its worktree rather than re-creating or re-deriving it.** A tree
    with a `worktree = true` child is killed mid-child and resumed. The resumed parent replays the
    spawn, finds the child by `(parent, step, goal)`, and the child continues in **the same
    worktree, on the same branch, with the files it had already written still there**. The
    discriminating assertion is a file the child wrote before the kill, present after the resume: a
    resume that re-created the worktree passes "the child finished" and fails this. A second
    creation attempt is asserted not to error the spawn.
  - >
    **F5 — one call puts back files, memory and the queue.** A run that writes two files (one it
    created, one it rewrote), writes two memory keys (one new, one overwriting an existing value
    written by an earlier run), and queues two children past the concurrency cap. `rewind_run`
    returns: the created file `Removed` and gone from disk, the rewritten file `Restored` with its
    original bytes, `memory_removed` naming the new key which `memory_get` no longer finds, and
    `memory_restored` naming the overwritten key **whose value is the one that was there before this
    run's first write** — the discriminating assertion, since deleting the key or leaving the run's
    value both satisfy "the entry changed". `queued_agents` for that run is empty and
    `queue_cleared` names the two goals. The control is the identical run with no `rewind_run` call,
    under which all six effects are still present.
  - >
    **F6 — the memory restore point is the first write, guarded.** A run writes one key five times.
    `rewind_run` restores the value that was there before write one. The sabotage removes the
    insert's uniqueness guard so the last write's predecessor wins, and it must fail this named test
    rather than a compile — trap 8's rule, and the same guard `record_snapshot` has for files.
  - >
    **F7 — the trace keeps both branches.** Before and after the rewind of F5, the row counts and
    contents of `steps`, `run_events`, `spawns` and the ledger for that run are identical, and
    `Store::rewinds(run_id)` returns exactly one row naming the two files, the two memory keys and
    the two cleared goals. One `EventKind::Rewound` reaches the observer, and its four numbers equal
    the `Rewound` value's own — **built from the returned value, not from a second query**, which the
    sabotage proves by making the two disagree. A rewind implemented by deleting rows passes F5
    entirely and fails this.
  - >
    **F8 — what rewind does not undo, executed rather than implied.** A run that made a commit is
    rewound: the commit is still reachable, `HEAD` is unmoved, no `reset` was spawned (asserted
    against the recorded argv of every git spawn in the run, which the trace already holds), and
    `Rewound` claims nothing about it. A file whose previous contents were over the 1 MiB cap comes
    back `NotKept` and is **byte-identical to what the run left**, not truncated and not restored.
  - >
    **F9 — cross-version, both directions, with the guard fed by name.** Two tables and their
    indexes are added; `ADDED_SINCE_0_22_0` gains exactly those four names and
    `tests/cross_version.rs` passes. A database written by the pinned 0.29.0 generator opens,
    resumes and replays under 0.36.0, and a 0.36.0 store is read by that binary.
    `CHECKPOINT_FORMAT` stays 7, asserted rather than assumed.
  non_functional:
  - >
    **N1 — no new dependency.** `cargo tree` on macOS and Linux still reads **402** lines. A
    worktree is a `git` spawn through the machinery that already spawns git; a restore point is two
    tables in the SQLite already there.
  - >
    **N2 — the break is exactly one, and it is stated as loudly as it is small.** `AgentDef` gains
    `#[non_exhaustive]` and `worktree`. An external struct literal or exhaustive destructuring stops
    compiling; `AgentDef::new` and every builder call site is untouched, and a roster deserialized
    from `io.toml` or a `plugin.toml` that names no `worktree` is unchanged.
    `CompletionRequest`/`CompletionResponse` and `TaskContract` are not touched, so no `E0639` is
    owed. `tests/changelog.rs` finds the `*Migration:*` note under the one `**BREAKING` entry and
    `tests/public_api.rs` passes against a hand-edited `docs/public-api.txt`.
  - >
    **N3 — the step loop does no rewind work, and a run that uses neither half pays for neither.**
    `rewind_run` is the caller's call, never a tool and never a step; asserted by a source-reading
    test in the shape 0.33.0 and 0.35.0 used, with a splice-in control that makes it fail when such
    a call is added. A run that sets no `worktree` creates no `.worktrees` directory and spawns no
    `git`. The one unconditional cost is stated rather than hidden: a memory write now also writes a
    restore-point row **the first time this run touches that key**, bounded by keys touched per run
    exactly as file snapshots are bounded by paths written per run, and measured.
  - >
    **N4 — every added public item carries a worked example**, enforced by the existing
    `every_public_item_has_a_worked_example` gate: `rewind_run`, `Rewound`, `Store::rewinds` and its
    row type, `GIT_BRANCH_TOOL`, `GIT_WORKTREE_TOOL`, `AgentDef::worktree`.
  - >
    **N5 — the honest limits are where a reader finds them.** `docs/CONTRACT.md` states: a commit is
    not un-committed and a push is not recalled; a migration, a provider call and anything else
    outside the workspace is not undone; the crate never removes a worktree or deletes a branch; a
    rewind is per run, not per tree; the parent's `git_status` reports the worktree directory (in
    whatever form F3 measured) and the operator's one-line exclusion is given; `git switch` needs
    git 2.23 and `git worktree` needs git 2.5, and an older git surfaces as the observation git
    itself prints rather than as a crate error.
  - >
    **N6 — a query whose cost grows with the trace is asserted by plan, not by clock.** The two
    reads a rewind makes (`memory_snapshots` by run, `agent_queue` by parent run) are `EXPLAIN
    QUERY PLAN`-asserted to use their index, with a control column in no index at all — trap 38's
    rule, not a column that happens not to be a left prefix — and the measured number is recorded.
    No wall-clock assertion is written.
  operational:
  - >
    **O1 — the three-OS matrix is green** on the commit being released, including the MSRV 1.95 job,
    with no test skipped silently on Windows. The git-dependent tests are the exposure: a worktree
    path is joined from components rather than from a slash-bearing literal, any source-reading test
    normalises line endings, and a test that reads git's output tolerates the line ending git
    produces on that platform.
  - >
    **O2 — docs.rs builds**, proven by running the nightly job's exact command
    (`RUSTDOCFLAGS="--cfg docsrs -D warnings" cargo +nightly doc --all-features --no-deps`) before
    the release PR is opened, never inferred from a stable `cargo doc`. It has caught something in
    four consecutive releases.
  - >
    **O3 — `cargo package --locked` succeeds** on a clean tree and the packaged crate compiles, run
    after a `cargo clean`, with `.worktrees` proven absent from the packaged file list. Every local
    build and test runs with `CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0`.

delivery:
  target_mode: published
  environment: >
    crates.io as `io-harness` 0.36.0, GitHub at initorigin/io-harness with the tag `v0.36.0` and a
    Release titled `io-harness 0.36.0`, and docs.rs.
  deployment_method: >
    The standing flow. All work on `feat/0.36.0` off `develop`, committed incrementally as it lands,
    including the sealed UltraShip release record and the hand-appended lock pin. PR into `develop`,
    merged with the PR button. Release PR `develop` into `main`, merged the same way. The GitHub
    Release is cut by `release.yml` — `gh workflow run release.yml --ref main -f version=0.36.0` —
    which takes its notes verbatim from the changelog. `cargo publish --locked` by hand afterwards,
    always last, after both merges and the Release exist. `develop` synced to `main` fast-forward
    only at the end. No branch is deleted.
  migrations:
  - >
    Two additive tables and their indexes: a memory restore point and a record of each rewind. No
    existing table is altered, no column is added to one, `CHECKPOINT_FORMAT` stays 7, and the four
    new names are added to `tests/cross_version.rs`'s `ADDED_SINCE_0_22_0`.
  - >
    One public break: `AgentDef` becomes `#[non_exhaustive]` and gains `worktree`. No item is
    removed, no signature changes, and every documented way of building an `AgentDef` recompiles
    untouched.
  - >
    A run that calls neither new built-in and declares no `worktree` behaves exactly as it did in
    0.35.0, with one addition that is unconditional and bounded: the first memory write to a key in
    a run also writes that key's restore point.
  observability:
  - >
    `EventKind::Rewound { run_id, files, memory, queued }` reaches every `Observer`, and therefore
    every attached process through 0.33.0's `Broadcast`, with no change to `attach`.
  - >
    `Store::rewinds(run_id)` is the durable half: what a rewind restored, removed and cleared,
    readable long after the process that did it is gone. The rows a rewind changed are named in it
    before they are changed.
  - >
    A worktree creation and a branch creation are ordinary governed git spawns, so they are already
    in the trace the way `git_commit` is — the argv, the exit status and the policy decision.
  rollback: >
    A published version cannot be recalled; the forward fix is 0.36.1 and `cargo yank --version
    0.36.0` is the escape hatch, leaving 0.35.0 as what `cargo install` resolves. A consumer
    reverting to 0.35.0 keeps every database — both new tables are additive and a 0.35.0 binary
    never names them — and loses `rewind_run`, the two built-ins and per-child worktrees; a
    `worktree = true` in a stored roster becomes an unknown field, which `deny_unknown_fields`
    reports by name rather than ignoring. The one break reverses by deleting a field initialiser.
    Worktrees and branches a 0.36.0 run created are ordinary git objects and survive the downgrade
    untouched; nothing has to be rewritten to go back.

dependencies:
  products: []
  services:
  - >
    `git` on the machine the run is on — already a dependency of the five existing built-ins, and
    already handled by `GitOutcome::Unavailable`, which turns a missing git into an observation
    rather than a failed run. This release raises the version the two new shapes need (2.23 for
    `switch`, 2.5 for `worktree`) and states it rather than probing for it.
  - >
    crates.io and GitHub Actions for the release itself, as every version.
  human_approvals:
  - >
    The owner has pre-authorised the PR, both merges, the Release and the publish for this version.
    Nothing here needs a second decision.

resource_profile:
  complexity: large
  uncertainty: medium
  likely_cost_drivers:
  - >
    Per-child worktrees touch the spawn path, which is the most load-bearing code in the crate:
    `spawn_child` in `src/run.rs` builds `TaskContract::workspace(goal, &tree.root)` with the root
    hard-coded, and rooting a child elsewhere has to survive adoption on resume, the FIFO queue's
    admission, and a policy whose rules are relative to a workspace root that is now the child's own.
    `src/run.rs` is over 9,500 lines.
  - >
    Every acceptance criterion for the git half needs a **real repository**, so the fixtures are
    `git init` in a tempdir plus a scripted provider, and the assertions read git's own output.
    Windows is the exposure: paths, line endings, and a `git worktree` whose behaviour under a
    CRLF checkout has never been exercised here.
  - >
    Four negative controls designed before the code, not after: F1's rejected branch names, F3's
    `worktree = false` collision, F5's no-rewind arm, and F7's delete-the-rows sabotage. Plus F6's
    guard removal, which is the subtle one.
  - >
    Six new public items across three surfaces means `docs/public-api.txt` by hand, a worked example
    each, and — for the new event — the `EVENT_NAMES` entry, `every_kind()` and the source-reading
    census in `src/observe.rs`. Trap 62's three files per item.
  preferred_tools:
  - >
    A helper that builds a git repository with one commit and returns the `Workspace`, so the git
    criteria do not each hand-assemble one. The existing scripted provider and the crash fixture
    pattern for F4's kill-and-resume. `CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0` on every
    local build — 19 GiB to 159 MiB — `df -h .` before and between build steps, and
    `cargo build --all-features --examples` before any `--lib --tests` run or sabotage.
  constraints:
  - >
    No new runtime dependency; MSRV 1.95; edition 2021; every version stays 0.x and a break is a
    minor bump.
  - >
    The git surface is fixed argv by construction, not by a maintained rule. Anything added here
    that took a model-supplied string as an *option* rather than as an operand would undo the
    property the whole module exists for.
  - >
    A write the policy cannot see is a claim the crate cannot make. Every path this release writes —
    a worktree, a restored file — goes through the same `Act::Write` resolution as every other, and
    nothing is written to repository metadata.

risks:
- >
  **`switch --create` read as a re-opened `checkout`.** The forbidden list is a test, and the
  cheapest way to make a new argv pass it is to edit the list. Mitigated by F1 asserting the
  pre-existing test passes unchanged, and by the reason being written down: `switch --create` makes
  a ref at HEAD and carries the tree, so there is no input under which it discards a change.
- >
  **A child rooted outside the tree it was contained in.** The child's policy rules are relative to
  a workspace root, and moving the root moves what every rule means. Mitigated by keeping the
  worktree **inside** the parent's root (`.worktrees/`), so every rule keeps its relative meaning and
  every write stays inside the governed tree, and by F3 asserting the parent's tree is untouched.
- >
  **A resumed tree that re-creates a worktree and discards the child's work.** This is the 0.32.0
  restored-versus-re-derived lesson in a new place: the cheap implementation creates unconditionally
  and fails, and the next-cheapest deletes and re-creates. Mitigated by F4, whose discriminating
  assertion is a file written *before* the kill and present after the resume.
- >
  **A rewind that looks complete and is not.** Restoring the files and leaving the memory is the
  failure this release exists to fix, and the same failure in miniature is restoring memory and
  leaving the queue. Mitigated by F5 asserting all three in one call and by `Rewound` naming each,
  so a caller reading the value can see what did not happen.
- >
  **An undo that quietly rewrites history.** Deleting the run's rows is the obvious implementation
  and it makes the ledger disagree with the invoice. Mitigated by F7's before-and-after count over
  four tables, which fails for exactly that implementation.
- >
  **Worktree directories accumulating inside a repository.** The crate never removes one, by
  decision. Mitigated by naming them deterministically so a resume reuses rather than adds, by
  measuring what the parent's `git_status` reports, and by stating the operator's cleanup command in
  `docs/CONTRACT.md` rather than leaving it to be found.
- >
  **Disk, again.** `target/` has taken this volume to zero in four separate releases and
  rust-analyzer rebuilds into the same tree. Mitigated operationally: debuginfo off by default
  locally, `df -h .` before and between build steps, separate `cargo test` invocations, and
  `cargo clean` between the full suite and packaging.

open_questions:
- >
  Whether a rewind should reach a whole tree. `rewind_run` takes one run, and a tree rewind needs an
  ordering over children whose written paths may overlap — which is a decision, not an omission.
  Left to a caller's loop until someone needs the crate to choose.
- >
  Whether `AgentDef.worktree` should eventually carry the branch prefix rather than being a `bool`.
  A bool is what the collision needs; a name is what a human reviewing six branches wants. Worth
  waiting for the second request rather than guessing the shape now.
- >
  Whether a run should be able to land on a branch without being asked — a contract-level
  `branch_per_run` rather than a tool the model calls. It is the same argument as the worktree flag
  one level up, and the answer probably follows whatever `worktree` turns out to be.

