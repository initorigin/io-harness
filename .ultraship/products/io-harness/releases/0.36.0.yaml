mode: published
delivered: >
  A run lands as a branch, and can be put back.

  `git_branch` renders `git switch --create=<name>` and `git_worktree` renders `git worktree add -b
  <name> -- <path>`, built by the same closed-set construction as the five built-ins that existed.
  `switch --create` is the one shape of a checkout that cannot discard a working-tree change — the
  ref starts at HEAD, git refuses a name that already exists, and the tree is carried rather than
  replaced — which is why it is reachable while `checkout`, `reset`, `rebase`, `stash`, `push`,
  `fetch`, `clone`, `remote` and `filter-branch` stay unreachable and the test holding that list
  passes **unchanged** rather than relaxed. A branch name is fused into `--create=<name>` where git
  offers that form, and validated by an ASCII allowlist where it does not.

  `AgentDef` gains `worktree`: a child of that definition is rooted at its own checkout under
  `.worktrees/`, on its own branch, created before its first step. Two concurrent children of one
  definition now both keep their writes; with the flag off, one of them loses. The path is derived
  from `(agent, parent run, step, goal)` — the key a spawn is adopted by — so a resumed tree
  continues in the worktree it already made rather than re-creating it and discarding the child's
  work. A worktree that cannot be made fails the spawn instead of falling back to the shared tree.

  `rewind_run` widens a rewind from a path to a run: every file it wrote with the four verdicts
  0.28.0 already distinguishes, every memory entry restored to the value before this run's **first**
  write to that key, and the spawn backlog it left queued. **Nothing in the trace is deleted** — the
  steps, the event stream, the spawn records and the ledger are untouched, and what the rewind took
  is written down before it goes, readable through `Store::rewinds` and reported as
  `EventKind::Rewound`.

  Two additive tables, `memory_snapshots` and `rewinds`. `CHECKPOINT_FORMAT` unmoved at 7, no
  existing table altered, `cargo tree` still 402.
