known_limitations:
- >
  This record is sealed on `feat/0.21.0` before the crates.io upload, which is the standing flow:
  the record states the authorized target and the flow makes it true. The upload follows the
  develop -> main merge and the GitHub Release, and is the last step.
- >
  **NF4 — the three-OS suite is proven by CI on the pull request, not from this machine.**
  Everything above was run on macOS. The question tests are store- and process-boundary-bound and
  the template tests read a directory, which are the two places the Windows leg historically
  disagrees. `skills::discovery_over_a_32_skill_directory_is_under_50ms` is a wall-clock assertion
  that fails intermittently on the Windows runner under load and passes on re-run.
- >
  **This record was re-sealed once, before publication, because CI found a defect after it was
  first sealed.** The Windows leg of PR #68 failed on
  `tests/template.rs::render_substitutes_placeholders_and_routes_the_remainder_to_arguments` and
  nowhere else: the GitHub Windows runner checks out with `core.autocrlf=true`, so every LF in
  `tests/fixtures/**` became CRLF, and that test compares a rendered template body byte for byte —
  which compares the fixture's bytes too. It is not the known flaky timing test and it was not a
  flake; it failed identically on both runs of the same commit. The parser is not at fault and was
  not touched: `src/skills.rs` returns a frontmatter body verbatim on purpose, pinned by its own
  `crlf_line_endings_parse` unit test, so a Windows user with a CRLF template legitimately gets CRLF
  in the rendered prompt. The fix is a `.gitattributes` marking `tests/fixtures/** text eol=lf`,
  which makes a fixture's bytes the same on every platform for CI and for anyone cloning on Windows,
  and covers the older `readme-0.15.0-headings.md` fixture that had the same latent exposure
  (commit 19806ae, with a CHANGELOG entry under Fixed). Every gate above was re-checked against the
  fixed tree and the three-OS matrix is green on it. The evidence figures are unchanged, because
  nothing in the crate changed. Recorded here rather than left out: the first seal predated a real
  defect, and a reader of this ledger is entitled to know that.
- >
  **The live run's two agent models are not the two the example documents.** Its defaults are
  anthropic/claude-haiku-4.5 and anthropic/claude-sonnet-4, and both were refused with HTTP 402 —
  the OpenRouter balance could afford 59,266 completion tokens and those models' 64,000-token
  ceiling costs more than that. The first attempt is kept as
  evidence/0.21.0/live-run-agency-attempt1-402.txt, where claims 1 and 2 had already passed. The
  recorded run used openai/gpt-4o-mini and openai/gpt-4o instead, which proves the same thing — two
  definitions, two model strings, read back from `provider_calls` — on a smaller balance. What was
  not exercised live is a per-agent model from a *different vendor* than the root's.
- >
  **The live run's `searcher` never attempted a write, so its `deny_write` was not exercised in
  anger.** It obeyed "do not modify any files" on its own, which is the model behaving well rather
  than the boundary being tested. That a definition's deny actually refuses is proven offline by
  tests/agents.rs against a provider scripted to try the write, with the child layer named in the
  attribution.
- >
  **A plan is the agent's stated intent, never a commitment.** Nothing checks that the agent did
  what its plan said, no outcome depends on a todo state, and a run whose plan is unfinished still
  reports whatever its verification and budgets dictate. In the live run the agent left item 2
  `active` and item 3 `pending` at the step cap while having already made the edit — an honest
  illustration of the limitation. A plan the harness policed would be a second verification layer
  competing with the one the crate has; the answer here is documentation, and it is the honest one.
- >
  **A `Responder` is the only answering channel, and there is no UI for it.** `StdinResponder` and
  `FixedResponder` ship; a TUI, an HTTP endpoint and a JSON event envelope do not, deliberately —
  io-cli and io-studio own their front ends. An answer is also an untyped `String`, optionally one of
  `choices`; nothing validates it against them.
- >
  **A question can only be asked of the operator.** No provider-side clarification round-trip, no
  question routed to another agent, and a parent cannot answer for its child — a child's question
  pauses the whole tree and reaches the human, which is the only answer path this release has.
- >
  **A definition names a model string, not a provider.** One run has one provider and one key; two
  definitions naming models from different vendors is a `provider::Fallback` question. The recorded
  `CompletionResponse::model` keeps saying what actually served each call, so a vendor silently
  substituting a model reads honestly in the trace rather than being hidden — but a definition
  asking for a model the account cannot reach fails the call, as the 402 above shows.
- >
  **There is still no run-level or turn-level model override.** `CompletionRequest::model` exists
  because named agents need it; exposing a model swap on `TaskContract` or on a session turn stays
  shut, as 0.20.0 left it.
- >
  **`AgentDef` narrows by `deny_write`/`deny_net` only.** The contract's second open question is
  resolved in the narrow direction: there is no per-agent tool allow-list, because it would be the
  one narrowing not proven by `Policy::contain`.
- >
  **A template renders text and can set nothing** — no policy, no budget, no toolbox, no model, no
  verification criterion — and its language is placeholder substitution plus `$ARGUMENTS`, nothing
  more. Discovery stays caller-side (the contract's third open question): a run cannot name a
  template by id in its trace, because a `TaskContract` field would have been a wider surface and a
  break.
- >
  **The stall window still does not survive a resume.** `Progress` is in-memory, so a resumed run
  starts its repetition counter and its unproductive window at zero, exactly as on 0.20.0. Making it
  durable is a checkpoint change and this release makes none. Repetition also resets with the window
  on a replan (the contract's fourth open question, resolved consistently with the existing
  "a replanned agent gets a clean window" rule), so an agent that resumes the same loop immediately
  after being told to stop needs the second window to catch it again.
- >
  Carried unchanged from 0.20.0 and untouched by this release, as `scope.excluded` requires:
  `resume_tree` still does not call `record_run_policy`; `SandboxLimits::max_processes` is enforced
  by nothing on any platform; the Linux backend installs no seccomp filter;
  `Containment::max_total_cost` is inert; `server_tool_requests` is zero everywhere until 0.22.0;
  the crate ships no prices; the `[toolchain]` config override does not reach this crate's own run
  loop; an unknown key inside a `[[mcp]]` table is not rejected; `git_status` lacks `-z`;
  `fill_form` has never been opened in a real viewer; the Windows Job Object is unimplemented;
  `pdf::read_text`'s `catch_unwind` is a no-op under `panic = "abort"`; `TEST_BINARY` is inert;
  there is no `Session::resume_turn`, no `turn_bounded_steered`, and `Session::history` is linear
  per hop.
