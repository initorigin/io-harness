product: io-harness
version: 0.21.0
status: released
release_type: minor
outcome:
  user_can: >
    Watch an agent plan, and be asked instead of guessed at. The agent keeps a visible multi-step
    todo list the operator reads from the trace while the run is still going, and when the operator's
    intent is genuinely ambiguous it asks a question and waits for the answer — either answered
    in-process by a `Responder` the caller supplies, or by pausing the run, persisting the question,
    and resuming once a human answers, exactly as an approval already does. A sub-agent is spawned by
    name from a definition that carries its role, its model and a narrowed boundary, instead of being
    hand-assembled from a JSON blob at the call site. And an operator starts a turn from a named
    prompt template with arguments rather than retyping the same instructions.
  business_value: >
    0.20.0 made a conversation possible; this release makes the agent on the other end of it legible.
    Today an operator can see what the agent *did* — every step, every refusal, every draw — but not
    what it *intends*, so a long run is unreadable until it ends. Today an ambiguous goal is resolved
    by the model guessing, because the only channel back to the human asks whether an action is
    permitted, never what was actually wanted; a wrong guess spends a whole run. Today every
    sub-agent is identical to its parent apart from a goal string, so "use the cheap model to search
    and the strong one to write" is unexpressible, which is the single biggest cost lever the crate
    has and it is not reachable. And today the harness's only durable ambiguity signal — the stall
    detector — is blind to an agent that repeats itself while incidentally writing something, which is
    the shape a looping agent actually takes.

    io-cli and io-studio both need a plan to render, a question to surface, and an agent roster to
    offer. If the harness does not own them, each builds its own over the same trace tables and they
    diverge — the failure 0.19.0 exists to have prevented for configuration and 0.20.0 for
    conversation.
  evidence_of_value: >
    A run's plan is readable from SQLite while the run is still in flight and afterwards, with each
    item's state and the order they were completed in. A question asked mid-run reaches a `Responder`
    and the answer changes what the agent does next, with the same run under a responder that answers
    differently as the control; the same question with no responder pauses the run, survives a process
    exit, and resumes on a human answer arriving in a second process. A tree spawned from two named
    definitions puts two different model strings on the wire, asserted from the recorded
    `provider_calls` rows and not from the configuration that asked for them. An agent that repeats an
    identical call three times while a write lands each time is stopped, where 0.20.0 ran it to the
    step cap. And the live 0.20.0 finding — a speculative `git status` under an exec-denying policy
    ending the whole run — costs one step and an observation instead.
scope:
  included:
  - >
    A `todo` tool and a durable plan. One tool, `todo_write`, taking the whole list and replacing it,
    so there is no item-id bookkeeping for a model to get wrong and no partial-update semantics to
    specify. Each item is a `TodoItem { text, state }` where state is `pending`, `active` or `done`.
    The list is written to a new `todos` table keyed by run id, created additively like every table
    since 0.13.0, so `CHECKPOINT_FORMAT` stays 7 and a 0.20.0 database opens unchanged. `Store::todos`
    reads it back, so an operator or a UI sees the plan mid-run without the program that drove it.
  - >
    A todo write is not an `Act`. It touches the harness's own store — not the workspace, not the
    network, not a binary — so it is not gated, and `docs/CONTRACT.md` says so in those words rather
    than leaving a reader to infer it from the absence of a rule. The three things a plan cannot do
    are the point: it cannot widen a boundary, it cannot spend, and it cannot be read back by the
    model as authorization for anything.
  - >
    A `question` tool that asks the operator about **intent**, and a second answering channel that
    mirrors the approval channel exactly rather than inventing a shape. `ask_question` takes a
    question, an optional `context` string and an optional `choices` list a UI can render as buttons.
    A new `Responder` trait — one method, `answer(&self, &Question) -> AnswerFuture`, `&self` plus
    `Send + Sync`, object-safe, alongside `Approver` in the run's argument list — answers in-process;
    `ResponderNone` declines. Shipped implementations: `StdinResponder` for a terminal and
    `FixedResponder` for a test.
  - >
    A question that nobody can answer in-process pauses the run instead of failing it.
    `RunOutcome::AwaitingAnswer { question_id, steps }`, a new `pending_questions` table, and
    `resume_with_answer(contract, provider, store, run_id, question_id, answer, policy, approver,
    responder)` — the same put/resolve/resume triangle `pending_approvals` already uses, so a question
    survives a process exit for the same reason a pending approval does. The tree variants
    (`resume_tree_with_answer`, `resume_tree_with_answer_observed`) follow, and a child's question
    pauses the whole tree exactly as a child's approval already does.
  - >
    A question is not an approval, and the crate keeps them apart everywhere. An approval asks whether
    an action is permitted and its answer can only narrow what happens; an answer to a question is
    *text the model reads*, delivered as an observation, and it authorizes nothing. Every tool call
    that follows an answer is checked against the same `Policy` by the same code, which is the rule
    0.20.0 established for steering, stated again here in the same words. `docs/CONTRACT.md` carries
    both sentences.
  - >
    Named agent definitions. An `AgentDef { name, role, model, max_steps, deny_write, deny_net,
    skills }` and an `Agents` registry, buildable programmatically (`Agents::with`) or loaded from
    configuration as `[[agent]]` tables in `io.toml`. `TaskContract::with_agents` carries the roster
    into a run. `spawn_agent` gains an optional `agent` argument naming a definition: the child gets
    that definition's role prepended to its system prompt, its model on the wire, and its
    `deny_write`/`deny_net` composed through the existing `Policy::contain` — so a definition can only
    ever narrow the parent's boundary, never widen it, and `contain` is the code that proves it rather
    than a new check that has to be trusted. An unknown agent name is a composed error observation,
    not a spawn.
  - >
    `CompletionRequest` gains `model: Option<String>` — the per-request override a per-agent model
    needs. `None` means "the provider's configured model", which is every existing call site.
    `OpenRouter`, `Anthropic`, `OpenAi` and `provider::Fallback` prefer the request's model over their
    own; all four already interpolate a model string into their body, so this changes which string,
    not how a body is built. The recorded `CompletionResponse::model` keeps saying what actually
    served the call, so a definition asking for a model the vendor silently substituted reads honestly
    in the trace.
  - >
    Prompt templates: `Template { name, description, body }` and `Templates::discover(dir)`, reusing
    the `skills` module's shape — a directory of `.md` files or `<dir>/SKILL.md`-style subdirectories,
    the same hand-rolled frontmatter parser, the same duplicate-name and count caps, the same
    description clamp. `Templates::render(name, args)` substitutes `{{name}}` placeholders and returns
    the text, and `$ARGUMENTS` receives everything unmatched. Rendering is a pure function of the
    template and the arguments: it returns a `String` the caller hands to `Session::turn` or
    `TaskContract::workspace`, so no run-loop path changes and a template can never smuggle a tool, a
    permission or a budget. `[run] templates = "..."` in `io.toml` points at the directory.
  - >
    Repetition detection, as the roadmap says, riding along on the 0.11.0 stall machinery.
    `StallPolicy` gains `repeat: u32` (default 3, `0` disables) with `#[serde(default)]`, so no
    existing configuration or struct-literal changes. `Progress::step` gains a consecutive-identical-
    signature counter that a workspace write does **not** reset: today `changed == true` clears
    everything, which is precisely why the 0.20.0 live run's looping agent had to be caught by the
    unproductive window instead. Three identical consecutive calls now produce the existing
    `Progressing::Replan`, then `Progressing::Stalled` — the same escalation, the same
    `replan_directive` text extended to name the repeated call, the same `context_events` rows, and no
    new outcome variant.
  - >
    The 0.20.0 live-run defect, fixed, because this is the release that touches the tool layer.
    A refused git built-in becomes an observation the model adapts to instead of `Error::Refused`
    leaving the run loop: `Git::run`'s exec refusal and `check_path`'s leading-`-` refusal are both
    caught in the dispatch arm and returned as `Dispatched::go(decision, obs)` with a `policy_events`
    row attributed to the rule and layer, which is what every other refusal in the crate already does.
    One fix point covers all five git built-ins. `docs/CONTRACT.md` loses the defect paragraph.
  - >
    Two new `EventKind` variants — `TodoWrote { items }` and `QuestionAsked { question }` /
    `QuestionAnswered { answer }` — through the `Observer` channel the crate already has, emitted from
    the same places `Refused` and `ApprovalRequested` are, so a UI renders a plan and a question
    without a second callback path.
  - >
    `RESERVED_TOOL_NAMES` gains the new tool names, so a caller's `Toolbox` cannot silently shadow a
    built-in — the existing `Toolbox::validate` rule, extended with the new entries rather than
    reasoned about.
  - >
    Documentation: `docs/guide/agency.md` covering the todo tool, the question tool, named agents and
    templates with a worked example each; a worked example on every added public item;
    `docs/public-api.txt` updated by hand; `CHANGELOG.md` carrying all three breaks with migration
    snippets; `docs/CONTRACT.md` amended with what a plan, a question, a definition and a template
    each guarantee and do not; and the removed git defect deleted from its limits section.
  - >
    A live example kept as evidence: a real run against a real provider that writes a plan, asks a
    question answered by a `Responder`, and spawns two named agents on two different models, asserting
    each of those itself so a regression fails the example rather than printing output nobody reads.
  excluded:
  - >
    Any interface for answering a question or rendering a plan beyond `StdinResponder`. No TUI, no
    HTTP endpoint, no JSON event envelope. io-cli and io-studio own their front ends; this release
    owns the API they call.
  - >
    Todo dependencies, priorities, owners, due dates, sub-items, or a per-item id a model must track.
    The whole list is replaced on every write. A plan is for reading, not for scheduling.
  - >
    A todo the harness enforces. Nothing checks that the agent did what its plan said, nothing stops a
    run whose plan is unfinished, and no outcome depends on a todo's state. A plan the harness policed
    would be a second verification layer competing with the one the crate already has.
  - >
    Typed or schema-validated answers. An answer is a string, optionally chosen from `choices`. A
    JSON-shaped answer is a tool the caller can register today.
  - >
    A question asked of anything but the operator. No provider-side clarification round-trip, no
    question routed to another agent, no question a parent answers on a child's behalf. A child's
    question pauses the tree and reaches the human, which is the only answer path this release has.
  - >
    Per-agent providers, per-agent API keys, per-agent vendors. A definition names a *model string*
    that the run's single provider puts on the wire. Two definitions naming models from different
    vendors is a `provider::Fallback` question, not this release's.
  - >
    A model override on `TaskContract` or on a session turn. The per-request field lands because
    named agents need it; exposing a run-level or turn-level model swap is a separate decision about
    whether a conversation may change models mid-thread, and 0.20.0 deliberately left that shut.
  - >
    Template conditionals, loops, includes, partials, or any other expression. Placeholder
    substitution and `$ARGUMENTS`, nothing more. A template language is a dependency and an injection
    surface; a `String` with holes in it is neither.
  - >
    A template that can set a policy, a budget, a toolbox, a model or a verification criterion.
    Rendering returns text. This is the same rule as "steering is text, never authorization", and it
    exists so a shared template directory is not a privilege-escalation path.
  - >
    Persisting the stall window across a resume. `Progress` stays in-memory, so a resumed run starts
    its window at zero, exactly as on 0.20.0. Making it durable is a checkpoint change and this
    release makes none.
  - >
    A fifth `Act` variant. A question and a todo are not actions against the world, and inventing
    `Act::Ask` would put a permission rule in front of a channel whose whole purpose is to ask a human
    something. `docs/CONTRACT.md` states that neither tool is gated and why.
  - >
    `Session::turn_tree`, provider-executed web search and fetch, and the LSP client (0.22.0). Named
    agents make the first of those more tempting and it stays shut: 0.20.0 resolved it on the grounds
    that a conversation whose turn is a tree raises which agent the operator is steering, and nothing
    here answers that.
  - >
    The carried `CONTRACT.md` defects other than the git one — `resume_tree` not calling
    `record_run_policy`, `SandboxLimits::max_processes` enforced by nothing, no Linux seccomp filter,
    `Containment::max_total_cost` inert. None is in a module this release touches. The git defect is
    in scope precisely because this release does touch the tool layer.
  - >
    Any new dependency. Templates reuse the skills frontmatter parser, questions reuse the approval
    tables' shape, and the plan is a table in the `rusqlite` already present, so the default
    `cargo tree` stays at the 407 lines this release inherits from `develop`.
  fallback_scope:
  - >
    The `todo` tool with its durable table and `Store::todos`; the `question` tool with `Responder`,
    the pause/persist/resume path and `RunOutcome::AwaitingAnswer`; repetition detection in
    `StallPolicy`/`Progress`; and the refused-git-built-in fix. Named agent definitions, the
    `CompletionRequest::model` override and prompt templates drop out.

    Still coherent, and still the release the roadmap describes: "the agent can plan and can ask."
    What it loses is agent *identity* — spawning by name with a role and a model — and the operator's
    repeatable way to start a turn. Both are additive surfaces that a later release can add without
    revisiting anything shipped here, and dropping them also drops the release's only hard break
    (`CompletionRequest`), which makes the fallback strictly gentler on consumers than the full
    version.
acceptance:
  functional:
  - >
    F1 — a plan is durable and readable mid-run. An agent's `todo_write` is in the `todos` table
    keyed by its run id before the next step commits, `Store::todos` returns the items in order with
    their states, and a second write replaces the list wholesale rather than merging. The plan is
    readable from a fresh `Store` over the same file after the process that wrote it is gone.
  - >
    F2 — a plan is inert. A run whose plan is never completed still reports the outcome its
    verification and budgets dictate; no `RunOutcome` and no refusal anywhere depends on a todo state;
    and a `todo_write` produces no `policy_events` row, because it is not gated. The negative control
    is a write to the workspace in the same run, which does produce one.
  - >
    F3 — a question is answered in-process and changes what the agent does. A run under a `Responder`
    that answers "the second file" acts on the second file; the same run, the same provider script and
    a `Responder` answering "the first file" acts on the first. Both answers reach the model as an
    observation, and both are recorded.
  - >
    F4 — a question with no answerer pauses the run and survives the process. `ResponderNone` yields
    `RunOutcome::AwaitingAnswer { question_id, steps }` with the question in `pending_questions` and
    `runs.status` not left at `running`; a fresh `Store` in a second connection reads the question,
    and `resume_with_answer` continues the same run from the same step with the answer as an
    observation. Asserted across a dropped store, not within one.
  - >
    F5 — an answer is text, never authorization. A run under a policy denying a write, asked what to
    do and answered "write the secret file", still refuses the write, attributed to the same rule and
    layer. The negative control is the same answer under a policy that allows it, where the write
    happens.
  - >
    F6 — a child's question pauses the tree. A spawned agent asking a question with no responder
    leaves the whole tree `AwaitingAnswer`, the parent uncommitted past that step, and
    `resume_tree_with_answer` resumes to completion with the ledger not double-charged — the same
    assertions the existing child-approval test makes, against the new path.
  - >
    F7 — a named agent gets its model on the wire. A tree spawning two definitions naming two
    different models produces two `provider_calls` rows carrying those two model strings, read back
    from the store rather than from the configuration that asked for them. The negative control is a
    spawn with no `agent` argument, which carries the provider's own configured model.
  - >
    F8 — a named agent gets its role and can only narrow the boundary. The child's system prompt
    contains its definition's role text; a definition setting `deny_write` produces a child that is
    refused a write the parent is allowed, attributed to the child layer; and a definition whose
    `deny_write`/`deny_net` are absent produces a child no wider than its parent — proven by a parent
    policy denying a path and a definition that says nothing about it, where the child is still
    refused. An unknown agent name yields an error observation and no child.
  - >
    F9 — `[[agent]]` reaches a run from configuration. An `io.toml` carrying two `[[agent]]` tables
    projects onto an `Agents` registry equal to the programmatic one, an unknown key inside an
    `[[agent]]` table is an error naming the key and the file, and the `[[agent]]` array accumulates
    across scopes the way `policy.layers` does rather than being replaced by the narrower scope.
  - >
    F10 — a template renders and nothing else. `Templates::discover` over a fixture directory finds
    the templates with their descriptions, `render` substitutes every `{{placeholder}}` and routes
    the remainder to `$ARGUMENTS`, an unknown template name is an error, and a placeholder with no
    argument is an error rather than an empty string — the rule 0.19.0 set for `${env:}`, applied
    here. The rendered string drives a real run through `TaskContract::workspace` unchanged.
  - >
    F11 — repetition is caught even when the workspace moves. An agent making the same call three
    times consecutively while a write lands on each step is replanned and then stalled, where the
    same script on 0.20.0's logic runs to the step cap. The negative control is three *different*
    calls each of which writes, which is progress and is left alone. Both asserted through the real
    loop against a scripted provider, with the `context_events` rows checked.
  - >
    F12 — a refused git built-in costs a step, not the run. Under a policy denying `Act::Exec` for
    `git`, a `git_status` call returns an observation naming the refusal, the run continues to its
    next step, and a `policy_events` row attributes the refusal to the rule and layer. The same holds
    for a path beginning with `-`. The negative control is the identical run under a policy allowing
    `git`, where the command runs. This test would have failed on 0.20.0.
  non_functional:
  - >
    NF1 — no store format bump and no new dependency. `CHECKPOINT_FORMAT` stays 7, `todos` and
    `pending_questions` are `CREATE TABLE IF NOT EXISTS`, the diff carries no `ALTER TABLE`, a 0.20.0
    database opens, resumes and is queried against 0.21.0 unchanged, and the default `cargo tree` line
    count is still the 407 lines inherited from `develop`.
  - >
    NF2 — exactly three breaks, each marked, and no others. `CompletionRequest` gains
    `model: Option<String>`; `RunOutcome` gains `AwaitingAnswer`; `EventKind` gains three variants.
    Nothing is removed or renamed, no existing signature changes except the run entry points that
    take a `Responder`, and every other item in `docs/public-api.txt` keeps its meaning. The changelog
    carries a migration snippet for each.
  - >
    NF3 — a run that uses none of this behaves exactly as it did. A 0.20.0-shaped run with no todo
    call, no question, no agents registry, no templates and `StallPolicy::default()` produces the
    identical event sequence, the identical step count and the identical outcome, and its
    `CompletionRequest`s carry `model: None`. `StallPolicy`'s new field defaults so an existing
    `io.toml` and an existing struct literal both keep working.
  - >
    NF4 — the full suite passes on macOS, Linux and Windows with the Windows leg's `timeout-minutes`
    unchanged at 40. The question tests are store- and process-boundary-bound, which is where the
    Windows leg historically disagrees, and the template tests read a directory, which is where its
    path handling does.
  - >
    NF5 — `cargo fmt --check`, `cargo clippy --all-targets -- -D warnings`,
    `cargo clippy --all-targets --all-features -- -D warnings` and `cargo doc --all-features` all
    pass with zero warnings.
  - >
    NF6 — a paused question never leaves `runs.status` at `running`, and an answered one is resolved
    exactly once. Answering an already-answered question is an error rather than a second resume, the
    way `resolve_pending` already behaves for approvals.
  operational:
  - >
    OP1 — `docs/public-api.txt` is updated by hand, `tests/public_api.rs` passes against the live
    surface, and every added public item carries a fenced worked example, enforced by the existing
    docs test.
  - >
    OP2 — `docs/guide/agency.md` exists, is listed in `tests/guide_pages.rs` with its limits block,
    and is linked from `README.md`, `docs/CAPABILITIES.md` and the crate root.
  - >
    OP3 — `docs/CONTRACT.md` states, in its own voice: a plan is not gated and is never enforced; an
    answer to a question is text and not authorization; a named definition can only narrow a
    boundary and a model string is a request the vendor may substitute; a template renders text and
    can set nothing; the stall window still does not survive a resume; and the refused-git-built-in
    paragraph is **removed**, because it is fixed here.
  - >
    OP4 — `CHANGELOG.md` carries all three breaks with migration snippets and the new capabilities in
    the user-facing voice the changelog test enforces.
  - >
    OP5 — a live run against a real provider is performed by hand before the release is cut and its
    output kept as evidence: a plan written and read back from SQLite, a question asked and answered
    by a `Responder` with the answer changing the next action, and two named agents spawned on two
    different models with the model strings read from `provider_calls`. The suite proves the
    mechanism; only a live run proves a model will use a todo tool and ask a question when it should.
delivery:
  target_mode: published
  environment: >
    crates.io as `io-harness` 0.21.0, GitHub at initorigin/io-harness with the tag `v0.21.0` and a
    Release titled `io-harness 0.21.0`, and docs.rs, whose build is checked by the nightly CI job.
  deployment_method: >
    The standing flow, unchanged. All work on `feat/0.21.0` off `develop`, including the sealed
    UltraShip release record. PR into `develop`, merged with the PR button. Release PR `develop` into
    `main`, merged the same way. GitHub Release cut from the tag with notes from the changelog.
    `cargo publish` last, after both merges and the Release exist. `develop` synced to `main`
    fast-forward only at the end. No branch is deleted. `git fetch --tags` after the Release, since
    `gh release create` makes the tag on the remote only.
  migrations:
  - >
    `CompletionRequest` gains `model: Option<String>`. A struct literal that lists every field stops
    compiling; adding `..Default::default()` or `model: None` fixes it, and `None` is the behaviour
    every existing caller already has. An out-of-tree `Provider` that ignores the field keeps working
    and is honestly non-selecting.
  - >
    `RunOutcome` gains `AwaitingAnswer { question_id, steps }`, so an exhaustive `match` needs an arm
    or a `_`. A run that never asks a question never produces it.
  - >
    `EventKind` gains `TodoWrote`, `QuestionAsked` and `QuestionAnswered`, so an exhaustive `match`
    needs arms or a `_` — the same shape as 0.20.0's `Token` break, and the changelog says so.
  - >
    The run entry points that can pause on a question take a `Responder`. `ResponderNone` is the
    drop-in that preserves 0.20.0 behaviour, and the changelog shows the one-line edit per call site.
  - >
    No store migration and no checkpoint-format bump. Two tables are created on open; a 0.20.0
    database gains them and is otherwise untouched, and 0.20.0 reading a 0.21.0 database ignores
    tables it does not know.
  - >
    No new dependency, so a consumer auditing the tree has nothing new to audit.
  observability:
  - >
    A plan is in the store, keyed by run id, with each item's text and state, so a UI or an operator
    reads the agent's intent mid-run and reconstructs it afterwards from SQLite alone.
  - >
    A question, its context, its choices, its answer and who answered it are in the store — an
    in-process `Responder` answer and a human answer after a pause are distinguishable, because
    "the machine decided" and "a person decided" are different facts about a run.
  - >
    A spawned child records the definition it was spawned from, and `provider_calls` keeps saying
    which model actually served each call, so a definition asking for one model and getting another
    is visible rather than assumed.
  - >
    A repetition-triggered replan and stall use the existing `context_events` rows and
    `EventKind::Replan`/`Stalled`, so a consumer that already renders a stall renders this one with no
    change.
  rollback: >
    A published version cannot be recalled. The forward fix is 0.21.1; `cargo yank --version 0.21.0`
    is the escape hatch and leaves 0.20.0 as what `cargo install` resolves. Nothing in the checkpoint
    format changes and no existing table is altered, so a consumer who reverts to 0.20.0 keeps their
    databases and their in-flight runs; the two new tables are simply inert to 0.20.0. The three
    source breaks are a struct-literal field, two `match` arms and a `ResponderNone` argument, each of
    which reverts as easily as it applied.
dependencies:
  products: []
  services:
  - GitHub Actions runners for macOS, Linux and Windows
  - A real provider account, for the live run that is OP5
  - crates.io, for publication
  - docs.rs, for the rendered API reference
  human_approvals:
  - Owner approval to merge to `main`, cut the Release, and publish, per the standing override.
resource_profile:
  complexity: large
  uncertainty: medium
  likely_cost_drivers:
  - >
    The question path touches the four resume entry points, their two observed variants and their two
    tree variants, and each already threads a policy and an approver. A `Responder` has to join that
    argument list without any of them growing a second meaning.
  - >
    `spawn_agent` is intercepted before dispatch (`src/run.rs:3317`) and its child is assembled in one
    function (`spawn_child`, `src/run.rs:3636`) that currently reads six JSON keys and forces the
    tree's root. A definition has to enter there without the child gaining a way to widen anything,
    and `Policy::contain` is the only mechanism allowed to decide it.
  - >
    A per-request model crosses the provider trait into three body builders and `Fallback`, each of
    which currently interpolates `self.model`. The precedence has to be identical in all four and the
    recorded `CompletionResponse::model` must keep reporting what served the call rather than what was
    asked for.
  - >
    `Progress::step` is nine lines that four tests in `src/resilience.rs` and seven in `tests/stall.rs`
    pin precisely. A second counter that a workspace write does not reset changes the meaning of
    `changed`, and every one of those tests has to stay true or be deliberately amended.
  - >
    Three breaks means three migration snippets that must compile, and 26 in-crate `CompletionRequest`
    struct literals across `src/`, `tests/` and `examples/` need the new field.
  - >
    Every added public item needs a worked example that compiles, and a question example needs a
    store, a provider and a responder, so the doc tests are heavier than usual.
  preferred_tools:
  - The existing approval triangle (`put_pending`/`pending`/`resolve_pending` plus `resume_with_decision`) as the template the question path copies
  - '`Policy::contain`, which already proves a child can only narrow — no new containment check'
  - The `skills` module's discovery and frontmatter parser, reused for templates
  - The existing `Progress`/`StallPolicy` types and their `context_events` rows
  - The existing `Observer` channel; no second callback path
  constraints:
  - CHECKPOINT_FORMAT stays 7; new tables only, nothing altered
  - No new dependency; the default `cargo tree` stays at 407 lines
  - Exactly three breaks, each with a migration note
  - A new capability ships as a new named function rather than an added parameter, except the `Responder` the question path requires
  - Every refusal test carries a negative control
  - No fifth `Act` variant
  - Stay 0.x
risks:
- >
  Scope. Agency is adjacent to a task manager, a chat UI, a template language, per-agent providers and
  a plan the harness enforces, and each is where this release could quietly become three. The excluded
  list is long on purpose and the fallback scope is the answer to schedule pressure.
- >
  A question becoming an approval by accident. If an answer can influence what is permitted — a
  responder whose text is read as a rule, a question that resolves a pending approval, a child whose
  parent answers for it — the crate acquires a second authorization path that no policy governs. F5
  proves it does not, and the guide and the contract say it in the same words the steering guide uses.
- >
  Three breaks in one release. `CompletionRequest` is the risky one: it is constructed by struct
  literal in 26 places in-crate and by every out-of-tree caller who builds a request directly. The
  mitigation is that the field is additive with a `None` that means today's behaviour, the migration is
  one line, and the fallback scope drops the break entirely.
- >
  Changing what `changed` means in the stall machinery. Eleven existing tests pin the current
  behaviour, and a second counter could make a productive agent look like a looping one — the failure
  that is worse than the one being fixed, because it stops good runs. F11's negative control is three
  different writing calls, which must be left alone.
- >
  A named definition reading as a grant. "Give the writer agent write access" is the natural thing to
  configure and it must be impossible: a definition may only deny. F8 proves a definition silent about
  a path the parent denies still yields a refused child.
- >
  A plan that lies. A todo list the model writes and then ignores is worse than no list, because an
  operator watching it believes it. This release's answer is that a plan is explicitly inert and
  documented as the agent's stated intent rather than a commitment the harness enforces — but it is a
  documentation answer, and it is the honest one.
open_questions:
- >
  Whether a question should also be answerable through the existing `Approver` by a caller who has
  one and does not want two traits. Reusing `Approver` collapses the two channels the release exists
  to keep apart, so the answer is probably no; decided during development, and stated in
  `CONTRACT.md` either way.
- >
  Whether `AgentDef` should carry a `tools` allow-list as well as `deny_write`/`deny_net`. Narrowing
  the toolbox by name is a natural third narrowing and the registry already knows the names, but it
  is a different mechanism from `Policy::contain` and would be the only narrowing not proven by it.
  Decided during development; if it costs more than a day it waits.
- >
  Whether a template directory should be discovered the way skills are (a `TaskContract` field, found
  at run start) or stay purely caller-side. Caller-side is the smaller surface and keeps rendering a
  pure function; a contract field would let a run name a template by id in its trace. Decided during
  development against what the live example needs.
- >
  Whether repetition should count identical calls across a replan or reset with the window. Resetting
  is consistent with the existing "a replanned agent gets a clean window" rule; not resetting catches
  an agent that resumes the same loop immediately after being told to stop. Decided during
  development against F11's script.
released_at: '2026-07-30T13:11:10Z'
mode: published
delivered: >
  The agent becomes legible. It writes down a plan an operator reads out of SQLite from another
  process while the run is still going, and when the goal is genuinely ambiguous it asks what was
  meant instead of guessing — answered in-process by a `Responder`, or by pausing the run, persisting
  the question and resuming in a later process on a human's answer, exactly as an approval already
  does. A question is not an approval anywhere in the crate: an answer is text delivered as an
  observation, and every tool call after it is re-checked against the same `Policy` by the same code.
  A sub-agent gets an identity — `AgentDef`/`Agents`, programmatic or from `[[agent]]` tables in
  `io.toml` — carrying a role, a model string and narrowings that can only ever pass through
  `Policy::contain`, so "search on the cheap model, write on the strong one" is finally expressible
  and a definition can never widen what its parent allowed. Prompt templates reuse the skills
  discovery and frontmatter parser to turn a named `.md` file plus arguments into a `String` the
  caller hands to a turn, and nothing else. Repetition detection rides the 0.11.0 stall machinery
  with a counter a workspace write does not reset, so the looping agent 0.20.0's live run had to run
  to its step cap is now replanned and then stalled. And the defect that live run exposed is fixed:
  a git built-in refused by the exec policy costs one step and an observation instead of ending the
  run. The live proof is a real OpenRouter run — a three-item plan read from a second connection
  mid-run, a question answered "beta.txt" with beta.txt the file that changed, and two named agents
  served by openai/gpt-4o-mini and openai/gpt-4o under a root on openai/gpt-5.6-luna, each asserted
  by the example itself.
