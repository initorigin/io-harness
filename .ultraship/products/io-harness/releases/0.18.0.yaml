product: io-harness
version: 0.18.0
status: released
release_type: minor
outcome:
  user_can: >
    Answer "what did that run cost, and which model spent it" from the trace alone. Every provider
    call the run makes is its own row carrying the model that served it, its input, output,
    cache-read, cache-write and reasoning tokens, its server-tool request count, its API latency and
    time to first token, and why the model stopped — so a step that retried once and then fell over
    to a second vendor is three rows on three models rather than one collapsed integer. Every edit
    a run makes records the lines it added and removed. Money is derived from a price table the
    operator can correct, and correcting one price repairs the whole history.
  business_value: >
    Cost is the first question anyone asks about an agent run and the crate could not answer it at
    any price. The model identifier was recorded nowhere at all — `runs.provider` names a vendor,
    not a model, and stops being true the moment a `Fallback` swaps mid-run; cache tokens were
    parsed by neither provider client even though a cached read is roughly a tenth the price of a
    fresh one; no provider call was ever timed, so "the run was slow" could not be attributed to the
    provider rather than to the tools; and `Containment::max_total_cost` has been documented inert
    since 0.2.0. io-eval exists to compare models against each other and has nothing to compare on
    but a single `tokens` integer per step; io-studio and io-cli cannot show a user what a run cost.
    Every consumer needs this and none of them should each invent their own schema over a trace the
    crate owns.
  evidence_of_value: >
    A live run against a real provider produces a per-call trace whose numbers reconcile with the
    vendor's own reported usage: the model slug the API answered with, cache-read tokens on the
    second turn where the first turn's prompt was cached, a measured TTFT smaller than the measured
    total latency, and a derived cost that changes when the price table is corrected and does not
    change when it is not. A run driven through a `Fallback` whose primary fails records two rows
    naming two different models for one step, which is the fact `runs.provider` cannot express.
scope:
  included:
  - >
    A `provider_calls` table in the store, additive `CREATE TABLE IF NOT EXISTS`, one row per
    `Provider::complete` invocation the run loop makes — attempt number included, so a retried step
    is several rows rather than an overwrite. Columns: run id, step, attempt, provider name, model
    id, the six token counts, server-tool requests, latency in milliseconds, TTFT in milliseconds,
    finish reason, and whether the call failed. Written by the run loop, which is the only place
    that knows an attempt happened, because `complete_with_retry` and not the provider owns the
    retry.
  - >
    `Usage` widened with `cache_read_tokens`, `cache_write_tokens`, `reasoning_tokens` and
    `server_tool_requests`, all `u64`, keeping the type `Copy` and keeping `total_tokens` as the
    provider's own reported figure rather than a re-derived sum. This is the break: a struct literal
    naming all three existing fields no longer compiles, and the type already documents
    `..Default::default()` as the forward-compatible construction.
  - >
    `CompletionResponse` gains the per-call facts a caller cannot observe from outside: the model
    that served the call, the finish reason, and the time to first token, which only the streaming
    client can measure. Same construction break, same `..Default::default()` answer, and the doc
    comment already says fields are added in minor releases.
  - >
    Both built-in provider clients parse what they already receive and throw away. Anthropic
    reports `cache_creation_input_tokens` and `cache_read_input_tokens` on `message_start` and a
    `stop_reason` on `message_delta`; the OpenAI-wire clients report
    `prompt_tokens_details.cached_tokens`, `completion_tokens_details.reasoning_tokens` and a
    `finish_reason`. Both already stream, so TTFT is the wall clock from request send to the first
    content-bearing chunk, measured where the stream is consumed rather than estimated.
  - >
    Server-tool request counters, because a provider-executed search is billed per request and a
    token-only schema under-reports money silently. Parsed where the provider reports it and left at
    zero where it does not — 0.22.0 is what makes the harness declare those tools, and this release
    is what makes the meter exist before the spending does.
  - >
    An `edits` table recording, per file change, the tool that made it, the path, and the lines
    added and removed — computed by the crate from the before and after content, for `write_file`
    and `edit_file` alike, so "how much did this run actually change" is a query rather than a diff
    an operator has to reconstruct.
  - >
    Pricing as data, not as code: a table of model id to input, output, cache-read, cache-write and
    server-tool-request prices, shipped with the crate as a starting point, publicly constructible
    and replaceable by the operator. Cost is derived at query time from the stored token counts and
    a supplied price table and is never written to the store, which is exactly the property that
    lets a corrected price repair history. Prices are stated per million tokens in a fixed-point
    integer unit, because a fraction of a cent in `f64` accumulates error over a million-row trace.
  - >
    A query surface returning grouped raw rows — by model, by day, by run — with derived cost
    alongside the token sums. The crate stops there. Streaks, favourite models, heat maps and every
    other rendering belong to the consuming app.
  - >
    Removal of `Verification::CompilesRust`, `RustTestPasses` and `WorkspaceTestPasses`, deprecated
    in 0.17.0 and removed here at the minimum cycle the crate's contract allows, leaving one
    execution path. The changelog note says plainly that a consumer upgrading 0.16.2 straight to
    0.18.0 meets the removal having never seen the deprecation warning.
  - >
    Documentation: a guide page on accounting that states what each number is and is not, a worked
    example on every new public item, `docs/public-api.txt` updated by hand, `CHANGELOG.md`
    migration notes for both breaks, and `docs/CONTRACT.md` amended with the new boundary statements
    — including that a token count is the provider's report and not the crate's measurement.
  excluded:
  - >
    Making `Containment::max_total_cost` live. Enforcing money mid-run means holding a price table
    inside the run loop and stopping on a derived figure whose inputs arrive one call late; the
    honest bound stays tokens, which the ledger already enforces exactly. The field stays documented
    inert and the accounting released here is what a later release would need to make it real.
  - >
    Storing a cost. A stored dollar figure is wrong the moment a price changes or a price was
    entered wrong, and it cannot be repaired without rewriting history. Derivation is the whole
    design.
  - >
    A configuration file for the price table. 0.19.0 owns configuration and will deserialize
    operator overrides into the type shipped here, the same way it will for `toolchain::Toolchain`.
    Writing the file format now would mean writing it twice.
  - >
    Any rendering: charts, streaks, leaderboards, per-day rollup views, a CLI. Grouped rows are the
    boundary.
  - >
    Provider-executed web search itself. This release counts the requests; 0.22.0 declares the
    tools.
  - >
    The three remaining `CONTRACT.md` defects — `resume_tree` not recording its policy,
    `SandboxLimits::max_processes` enforced by nothing, and no Linux seccomp filter. Each is a
    behaviour change in a module this release does not touch.
  - >
    Any change to the 0.10.0 context assembler, the sandbox, or the policy layer. `CHECKPOINT_FORMAT`
    stays 7.
  fallback_scope:
  - >
    The `provider_calls` table with model id, the widened `Usage`, both clients parsing cache,
    reasoning and finish reason, latency and TTFT, the price table with derived cost, the by-run and
    by-model grouping, and the removal of the three deprecated variants. The `edits` table and the
    server-tool counters drop out. Still coherent: an operator can answer what a run cost and which
    model spent it, which is the outcome — what they lose is how much the run changed and a meter
    for a capability the crate does not yet have.
acceptance:
  functional:
  - >
    F1 — one row per provider call. A run whose first attempt fails retryably and whose second
    succeeds writes two `provider_calls` rows for that step, with attempt 0 and attempt 1, the
    failure marked on the first. The negative control is a run with no retry, which writes exactly
    one row for the step — so the test measures per-attempt recording rather than row-writing in
    general.
  - >
    F2 — the model is recorded, not the vendor. A run through a `Fallback` whose primary fails
    records two rows for the step naming two different model ids, while `runs.provider` holds one
    label for the whole run. Asserted against the stored rows.
  - >
    F3 — cache and reasoning tokens survive the wire. Anthropic's `cache_creation_input_tokens` and
    `cache_read_input_tokens` and the OpenAI wire's `cached_tokens` and `reasoning_tokens` reach
    `Usage` unchanged from a recorded fixture response, with a fixture that reports none producing
    zeros rather than an error. Asserted against the accumulators, which is where the wire is parsed.
  - >
    F4 — `total_tokens` is still the provider's own figure. A fixture whose reported total disagrees
    with the sum of its parts is stored as reported, and the ledger draw is made from it, because
    re-deriving a total silently invents a number the vendor will not bill.
  - >
    F5 — latency and TTFT are measured and ordered. A scripted provider that delays its first chunk
    and then its last produces a TTFT strictly smaller than its total latency, and both are within a
    stated tolerance of the injected delays. The negative control is a non-streaming path, which
    records latency and leaves TTFT null rather than reporting zero — an unmeasured TTFT and an
    instant one are different facts.
  - >
    F6 — the finish reason reaches the trace. A fixture ending on a length cap and one ending on a
    tool call record different finish reasons, so an operator can tell a truncated turn from a
    complete one.
  - >
    F7 — server-tool requests are counted. A fixture reporting a server-tool request count stores
    it; one reporting none stores zero. Both providers.
  - >
    F8 — edits record lines added and removed. A `write_file` creating a new file records its line
    count added and zero removed; an `edit_file` replacing one line records one added and one
    removed; a replacement changing nothing records zero and zero. Asserted against the `edits`
    table after a run, not against a helper in isolation.
  - >
    F9 — cost is derived and repairable. The same trace queried under two price tables yields two
    different costs, and no cost column exists in the store to contradict either. Asserted by
    querying, correcting a price, and querying again on an unchanged database.
  - >
    F10 — cost arithmetic does not drift. A price table applied to a million-token trace produces
    the exact expected figure in the fixed-point unit, asserted against a hand-computed value, and
    an unknown model yields a stated-unknown cost rather than zero — a free model and an unpriced
    one are different facts.
  - >
    F11 — grouping returns raw rows. By model, by day and by run each return the token sums and the
    derived cost for a fixture trace spanning two models, two days and two runs, and the by-run
    figures sum to the by-model figures. No rendering, no ordering promise beyond the one documented.
  - >
    F12 — the deprecated variants are gone. A contract naming `Verification::CompilesRust` fails to
    compile against 0.18.0, and the equivalent `Command` criterion produces the same outcome the
    removed variant produced in 0.17.0 — asserted by the 0.17.0 tests for those variants, rewritten
    over `Command` and still passing, so the removal is proven not to have changed what they proved.
  non_functional:
  - >
    NF1 — the default dependency tree does not grow. `cargo tree` on the default build stays at 401
    lines. The price table is Rust data or JSON parsed by the `serde_json` already in the tree; the
    TOML dependency belongs to 0.19.0.
  - >
    NF2 — the store change is additive only. `CREATE TABLE IF NOT EXISTS` for `provider_calls` and
    `edits`, no `ALTER TABLE` on an existing table, no column dropped, and `CHECKPOINT_FORMAT` stays
    7 — so a 0.17.0 database opens, resumes and is queried against 0.18.0, and a 0.17.0 binary still
    opens a database 0.18.0 has written. Asserted in both directions.
  - >
    NF3 — the accounting is not on the critical path. Recording a call is one insert per provider
    call, not per token, and the timing instrumentation adds no await to the streaming loop. A run
    with the trace disabled behaves as before.
  - >
    NF4 — the full suite passes on macOS, Linux and Windows, with the Windows leg's `timeout-minutes`
    unchanged at 40.
  - >
    NF5 — `cargo clippy --all-targets --all-features -- -D warnings` and `cargo fmt --check` pass,
    and `cargo doc --all-features` is warning-free.
  operational:
  - >
    OP1 — `docs/public-api.txt` is updated by hand and `tests/public_api.rs` passes against the live
    surface, with the three removed variants gone from it.
  - >
    OP2 — `CHANGELOG.md` carries a migration note for each break, with the old call on one side and
    the new on the other, and states plainly that a 0.16.2 consumer meets the removal with no
    intervening deprecation warning. The changelog checker passes.
  - >
    OP3 — `docs/CONTRACT.md` states what the numbers are and are not: a token count is the
    provider's report and not the crate's measurement, a latency is the harness's own wall clock and
    includes its own request building, a TTFT is null where the path did not stream, and a cost is
    derived from a table the operator owns and is therefore only as right as that table.
  - >
    OP4 — the shipped price table names the date it was accurate as of, in the data, because a price
    table with no date is a claim with no expiry.
  - >
    OP5 — a live run against a real provider is performed by hand before the release is cut and its
    trace kept as evidence. The suite proves the mechanism against fixtures; only a live run proves
    the numbers reconcile with what a vendor actually reports.
delivery:
  target_mode: published
  environment: >
    crates.io as `io-harness` 0.18.0, GitHub at initorigin/io-harness with the tag `v0.18.0` and a
    Release titled `io-harness 0.18.0`, and docs.rs, whose build is gated by the nightly CI job
    added in 0.17.0.
  deployment_method: >
    The standing flow, unchanged. All work on `feat/0.18.0` off `develop`, including the sealed
    UltraShip release record. PR into `develop`, merged. Release PR `develop` into `main`, merged.
    GitHub Release cut from the tag with notes from the changelog. `cargo publish` last, after both
    merges and the Release exist. `develop` synced to `main` fast-forward only at the end. No branch
    is deleted. `git fetch --tags` after the Release, since `gh release create` makes the tag on the
    remote only.
  migrations:
  - >
    `Usage` gains four fields. A struct literal naming the three existing fields no longer compiles;
    the migration note gives `..Default::default()` as the fix, which is what the type has documented
    since 0.2.0. A caller reading `total_tokens` is unaffected.
  - >
    `CompletionResponse` gains three fields, with the same construction break and the same fix. A
    custom `Provider` implementation that built the response with `..Default::default()` needs no
    change and reports no model, which is recorded as unknown rather than as absent.
  - >
    `Verification::CompilesRust`, `RustTestPasses` and `WorkspaceTestPasses` are **removed**. The
    note gives the equivalent `Command` criterion argv for each. It must state that a consumer
    upgrading straight from 0.16.2 never saw the 0.17.0 deprecation warning, because a reader who
    upgraded one minor at a time is not the only reader.
  - >
    Store: two new tables, created on open. No existing table is altered, nothing is backfilled, and
    a run that predates this release has no `provider_calls` rows — a query over it returns nothing
    rather than zero, and the guide says so, because an unrecorded run and a free one are different
    facts. No checkpoint-format bump.
  observability:
  - >
    This release *is* observability, and the rule the crate already holds applies to it: the trace is
    authoritative and an event is a notification. Any accounting surfaced through `observe` reports
    the same facts the rows record, asserted rather than assumed.
  - >
    A failed provider call is recorded, not only a successful one. A run that spent three attempts
    getting one answer paid for the attempts that failed after the model produced tokens, and a
    trace that keeps only the winner understates the bill.
  rollback: >
    A published version cannot be recalled. The forward fix is 0.18.1; `cargo yank --version 0.18.0`
    is the escape hatch and leaves 0.17.0 as what `cargo install` resolves. The store change is
    additive and the checkpoint format is unchanged, so a consumer who reverts to 0.17.0 keeps their
    databases and their in-flight runs — the two new tables are simply never read again. Source that
    named a removed `Verification` variant or built a `Usage` by literal is what stops compiling, in
    both directions.
dependencies:
  products: []
  services:
  - GitHub Actions runners for macOS, Linux and Windows
  - A real provider account, for the live reconciliation run that is OP5
  - crates.io, for publication
  - docs.rs, for the rendered API reference
  human_approvals:
  - Owner approval to merge to `main`, cut the Release, and publish, per the standing override.
resource_profile:
  complexity: large
  uncertainty: medium
  likely_cost_drivers:
  - >
    Three provider wire formats reporting the same facts under different names, in streams, where
    the fields arrive on different events — Anthropic splits usage across `message_start` and
    `message_delta`, and the OpenAI wire puts it on a chunk whose `choices` array is empty.
  - >
    Measuring TTFT honestly. It has to be taken where the stream is consumed, must exclude nothing
    the caller would consider part of the wait, and must be null rather than zero on a path that
    never streamed.
  - >
    Fixed-point money arithmetic and its tests. Getting per-million-token prices, five price
    dimensions and integer rounding to produce a figure that matches a hand computation is fiddly and
    is exactly the part that must not be approximately right.
  - >
    Line counting for edits across the two writing tools, including a file with no trailing newline
    and a file that is not valid UTF-8.
  - >
    Removing three enum variants touches every test and example that used them; the 0.17.0 tests for
    those variants are the specification for what must still pass over `Command`.
  preferred_tools:
  - The existing rusqlite `Store`, extended with two additive tables
  - The existing streaming accumulators in `provider/anthropic.rs` and `provider/openai_wire.rs`
  - std `Instant` for latency and TTFT; serde_json for the price table, already in the tree
  constraints:
  - Additive `CREATE TABLE IF NOT EXISTS` in `Store::from_conn` only
  - CHECKPOINT_FORMAT stays 7
  - No system package on any runner
  - Default `cargo tree` stays at 401 lines
  - A new capability ships as a new named function rather than an added parameter
  - Every refusal test carries a negative control
  - Stay 0.x
risks:
  - >
    A number that looks authoritative and is not. A token count is the provider's report, a cost is
    derived from a table that goes stale the week it ships, and an operator who reads either as
    ground truth will make a wrong decision confidently. The mitigation is that the price table
    carries its own as-of date and `CONTRACT.md` states the provenance of every figure; the residual
    risk is a consumer that renders the number without the caveat.
  - >
    Two struct-widening breaks in one release, both hitting anyone who wrote a custom `Provider` —
    which is the crate's own recommended test technique and therefore common in consumers' code. The
    mitigation is that both types already document `..Default::default()`, and the changelog gives
    the one-line fix.
  - >
    Removing the Rust verification variants one minor after deprecating them is the shortest cycle
    the contract allows, and a consumer who upgraded 0.16.2 straight to 0.18.0 meets it with no
    warning. Taken deliberately, below 1.0, and the changelog states it rather than hoping the reader
    upgraded incrementally.
  - >
    Server-tool request counting is a meter for a capability the crate does not have until 0.22.0, so
    it will be zero everywhere in this release and cannot be proven against a real provider-executed
    search. It is proven against fixtures and its emptiness is stated, rather than being left out and
    then requiring a second `Usage` break later.
  - >
    Scope. Store, both provider clients, the run loop, two tools and a new query surface at once.
    The fallback scope drops the `edits` table and the server-tool counters, which are the two
    severable pieces whose absence still leaves the cost question answerable.
open_questions:
  - >
    Whether TTFT can be measured meaningfully on the `Fallback` path, where the first token of the
    call that eventually answered comes after a failed attempt's entire wait. Measured per call
    rather than per step, which is the answer this contract assumes; if a consumer needs the
    step-level figure it is a sum over rows, and the guide has to say which one it is showing.
  - >
    Whether the shipped price table should carry the three built-in vendors' current public prices or
    ship empty with the vendors' prices as a documented example. Shipping numbers makes the feature
    work out of the box and makes the crate wrong on a schedule it does not control. Decided during
    development, with the as-of date required either way.
released_at: '2026-07-29T19:30:00Z'
mode: published
delivered: >
  An operator can answer "what did that run cost, and which model spent it" from the trace alone.
  Every provider call is its own row — the model that served it, its six token counts, its
  server-tool requests, its latency and time to first token, its finish reason, and the failure
  where there was one — so a step that retried is several rows rather than one collapsed integer.
  Every file change records the lines it added and removed. Money is derived at read time from a
  price table the operator owns and is never stored, which is what makes correcting one price
  repair the whole history. Two live runs against a real provider are the proof: the first recorded
  three calls naming the model the API answered with, real reasoning-token counts, and a TTFT
  inside each call's own latency; the second, over the same prompts with the vendor's cache warm,
  recorded 4,913 cache-read tokens and derived 4,846 micro-units for the work the cold run derived
  18,606 for — the cache discount visible in money, from figures the vendor reported rather than
  any this crate invented.
evidence:
  tests:
  - >
    `cargo test` (default), `cargo test --features documents --lib --tests` and
    `cargo test --features media` — 107 suites, 1,979 assertions passing, 0 failing, no FAILED line
    anywhere. Full output at evidence/0.18.0/tests.txt.
  - >
    F1, F2, F5, F8, F9, F11 and NF2 — tests/accounting.rs, 10 tests through the real loop. A step
    that failed retryably and then answered is two rows, attempt 0 carrying `Server (HTTP 503)` and
    no usage and attempt 1 carrying the tokens; two models serving one run are two rows against one
    `runs.provider` label; a provider delayed 120ms records a latency at or above it with the
    provider's own 30ms TTFT strictly inside it; a write of a new file is (3, 0), a one-line edit is
    (1, 1) and a rewrite with identical content is (0, 0); the same unchanged trace under two price
    tables yields two costs; and by-run, by-day and by-model totals agree across two runs and two
    models.
  - >
    Each of those carries its own negative control, and three are load-bearing rather than
    ceremonial: the no-retry run (which is what makes F1 a measurement of per-attempt recording
    rather than of row-writing), the provider that measured nothing (which must record `ttft_ms`
    NULL rather than 0), and the price table missing one model (which must report two unpriced calls
    rather than costing them at zero).
  - >
    F3, F6, F7 and F4 — five accumulator tests across both wire formats. Anthropic's
    `cache_creation_input_tokens`, `cache_read_input_tokens`, `server_tool_use` and `stop_reason`,
    and the OpenAI wire's `cached_tokens`, `reasoning_tokens` and `finish_reason`, all reach `Usage`
    from fixture events; a stream reporting none of them yields zeros and `None`s rather than an
    error; and a chunk whose reported total (99) disagrees with the sum of its parts (12) is stored
    as 99, because re-deriving it would invent a number the vendor will not bill.
  - >
    F10 — src/pricing.rs, four tests. A five-dimension price table over a million-token trace
    produces the hand-computed figure exactly; an unpriced model is `None` rather than `Some(0)`;
    cache counters larger than the prompt saturate to zero fresh input instead of wrapping a `u64`;
    and rounding happens once at the end, half-up.
  - >
    F12 — the removed variants' own tests, rewritten over `Verification::Command` and still passing:
    a substring stub is rejected and real code accepted through a `rustc` argv, and a cargo fixture
    passes its own suite and then fails it. tests/language_agnostic.rs asserts the three variants are
    gone from src/verify.rs and that no `#[deprecated]` attribute remains anywhere, with a negative
    control that fails if the checker matches nothing.
  - >
    tests/verify_gate.rs was rewritten rather than deleted. Half of it tested a mechanism that no
    longer exists — a caller's criterion compiled into the subject's crate — so its replacement
    asserts the I01 macro-shadowing payload cannot defeat a criterion it does not share a crate
    with, with a passing control so the failure is the assertion and not the fixture.
  builds:
  - >
    `cargo build --all-targets` exit 0; `cargo fmt --check` exit 0; `cargo clippy --all-targets
    -- -D warnings` and `cargo clippy --all-targets --all-features -- -D warnings` both exit 0;
    `cargo doc --all-features --no-deps` warning-free. evidence/0.18.0/build-and-lint.txt.
  - >
    NF1 — `cargo tree | wc -l` is 401 on the default build, the standing constraint, unchanged: the
    price table is Rust data and the TOML dependency stays with 0.19.0.
    NF2 — `CHECKPOINT_FORMAT` is still 7 at src/state.rs:106, and the diff against 8827e46 adds no
    `ALTER TABLE` and exactly two `CREATE TABLE IF NOT EXISTS`.
  - >
    `cargo package` produced io-harness-0.18.0.crate, 130 files, 2.3 MiB (633.6 KiB compressed), and
    its verify build compiled the packaged sources standalone. evidence/0.18.0/package-verify.txt.
  - >
    scope.excluded verified still absent rather than assumed: no cost column exists in the schema,
    `Containment::max_total_cost` is still inert, no configuration or TOML parser is in Cargo.toml,
    src/context.rs and the sandbox modules are byte-identical to 0.17.0, `record_run_policy` is
    untouched so the `resume_tree` defect is carried rather than half-fixed, and no LSP, web, todo or
    question tool exists. evidence/0.18.0/scope-check.txt.
  reviews: []
  deployments: []
  health_checks:
  - >
    OP5 — two live runs against OpenRouter, evidence/0.18.0/live-run-accounting.txt. Every call
    records the model the API answered with, a finish reason, and real reasoning-token counts; every
    measured TTFT is inside its own call's latency; the warm-cache run records 4,913 cache-read
    tokens the cold run did not, and the same work derives at 4,846 micro-units instead of 18,606.
    The example asserts the TTFT/latency ordering itself, so a regression fails the run rather than
    printing a number nobody checked.
known_limitations:
- >
  This record is sealed on `feat/0.18.0` before the crates.io upload, which is the standing flow:
  the record states the authorized target and the flow makes it true. The upload follows the
  develop -> main merge and the GitHub Release, and is the last step.
- >
  **NF4 — the three-OS suite is proven by CI on the PR, not from this machine.** Everything above
  was run on macOS. The Linux and Windows legs run on the feat/0.18.0 PR, and two of this release's
  rewritten gate tests now shell out to `cargo test --offline` inside the sandbox, which is new
  behaviour on those two platforms rather than a rerun of something 0.17.0 already proved there.
- >
  **The crate ships no prices, so cost is zero out of the box.** This resolved the contract's open
  question in the direction it listed second. A crate cannot keep a vendor's price list accurate on
  its own release schedule, and a stale shipped number is a confident wrong answer; an operator must
  enter their own, and `PriceTable::new` requires the as-of date so the table cannot silently rot.
  The cost of the decision is that the feature does nothing until someone types a price in.
- >
  **A token count is the provider's report, not a measurement.** If a vendor's own figure is wrong,
  the trace is wrong in the same direction and this crate cannot tell. A latency, by contrast, is
  the harness's own wall clock and *includes* this crate's request building and stream consumption,
  so it sits slightly above what a vendor would call its own latency.
- >
  **`server_tool_requests` is zero everywhere.** It is a meter for a capability the crate does not
  have until 0.22.0, proven against fixtures and against nothing live. It ships now so that adding
  provider-executed search later is not a second widening of `Usage`.
- >
  **Cache-write tokens are never populated on the OpenAI wire, and reasoning tokens never on
  Anthropic.** Neither vendor reports the figure in question, and inferring it would invent money
  the invoice does not contain. Both were verified live: the OpenRouter runs recorded real
  `reasoning_tokens` and real `cache_read_tokens`, and zero cache-write throughout.
- >
  **Anthropic's cache path is proven against fixtures only.** The live evidence is OpenRouter, the
  one provider with credentials on this machine; `ANTHROPIC_API_KEY` and `OPENAI_API_KEY` are empty
  in `.env`. The Anthropic reconciliation — including that its prompt count now *includes* the
  cached tokens it reports separately — rests on its accumulator tests.
- >
  **A run older than 0.18.0 has no rows and nothing is backfilled.** The queries return empty rather
  than zero, which is the honest answer, but it means a store with history predating this release
  answers the cost question only for runs made after it.
- >
  **Lines added and removed are a size, not a patch.** `Edit::measure` trims the common head and
  tail; it is not a minimal diff, so a change that moves a block reports the whole block on both
  sides.
- >
  **Nothing spawns `TEST_BINARY` any more, and the constant remains.** Removing it would have been a
  break the contract did not plan, so a `deny_exec(TEST_BINARY)` rule now reads as a restriction and
  enforces nothing. Stated in CONTRACT.md and the verification guide, and asserted by a test.
- >
  Carried unchanged from 0.17.0 and untouched by this release, as `scope.excluded` requires:
  `resume_tree` still does not call `record_run_policy`, so a tree resumed under a widened policy
  leaves an audit that understates what was permitted; `SandboxLimits::max_processes` is enforced by
  nothing on any platform; the Linux backend installs no seccomp filter; `git_status` lacks `-z`;
  `fill_form` has never been opened in a real viewer; the Windows Job Object is unimplemented; and
  `pdf::read_text`'s `catch_unwind` is a no-op under `panic = "abort"`.
