  - version: 0.25.0
    outcome: >
      Long-running work stops being unrepresentable. A dev server, a log tail or a twenty-minute
      build is started through a process handle, polled for the output produced since the last poll,
      and killed — instead of blocking one step of the loop until a 900-second timeout decides for
      it. A handle recorded by a previous process is orphaned on resume and never re-attached,
      polled or signalled, because a recorded PID may since have been reused by something unrelated
      and signalling it is the one way this crate could damage something outside its workspace.
      Moved here from 0.24.0 by `US-IO-HARNESS-0.24.0-I01`. The Job Object they need shipped in
      0.24.0 — but on the sandbox path, and `src/tools/shell.rs` never reaches it, so this release
      routes the handle spawn into containment rather than inheriting it.

      And the agent stops paying a step to find out what it just broke. When an edit changes a file
      in a project whose toolchain the crate already detects, the project's own checker runs against
      it and its diagnostics come back attached to the edit — the exact rendered error, with line,
      span and code. Today a type error costs a step, a build and a provider call to discover.

      This is deliberately not the LSP client the roadmap named, and the change is on evidence.
      `publishDiagnostics` is a push notification with no completion signal, so a push server can
      only be waited on by guessing; the 3.17 pull model is implemented by rust-analyzer and an
      opt-in gopls and by none of typescript-language-server, pyright or clangd; and rust-analyzer's
      pull handler never consults flycheck, so it returns type-inference diagnostics but not
      borrow-check errors and not clippy — which is precisely what "the type error it just wrote"
      means. The compiler's own machine-readable output is what a language server forwards anyway,
      and taking it directly costs no new dependency and carries more. Goto-definition and
      find-references are the queries a language server genuinely answers better than a grep; when
      they are wanted they should be argued on their own terms, not smuggled in behind diagnostics.
