    status: released
  - version: 0.24.0
    outcome: >
      The agent gets hands, on every platform this crate claims. A real `shell` tool replaces the
      standing bound that the model may supply arguments but never a command line: the harness
      parses what the model wrote, walks the parse, and checks every sub-command's argv and every
      redirect target against the same `Act::Exec` and `Act::Write` rules a fixed argv has always
      been checked against — refusing what it cannot resolve statically rather than guessing at it.
      `cd infra && kubectl get pods | grep CrashLoop` becomes a thing an agent can do under a
      boundary that is checked rather than hoped for, and a private host — which 0.22.0's
      provider-executed web deliberately cannot reach — becomes reachable through the one path this
      process actually enforces. Long-running work stops being unrepresentable: a dev server, a log
      tail or a twenty-minute build starts, is polled, and is killed through process handles instead
      of blocking one step until a timeout.

      Windows gets the half of containment this release cannot avoid. The Job Object backend,
      designed in 0.6.0 and never implemented, lands here rather than in a release of its own:
      killing a process handle on Windows without a job leaks the grandchildren, so a shell that
      spawns a package manager that spawns a runtime leaves orphans behind. Job Objects are the
      mechanism for that, `JobLimits` already maps the limits onto their flags, and the containment
      that makes `shell_kill` correct is the one the sandbox has been missing — so the two are one
      piece of work, not two. A Windows run stops being bounded by the wall clock alone: memory, CPU
      and active process count become real, `Cap::Cpu` and `Cap::Memory` become claimable instead of
      warned about, and Windows becomes the first backend anywhere to enforce
      `SandboxLimits::max_processes`.

      What it deliberately does not become is "native" in the sense the other two rows of the
      platform table mean. A Job Object contains resources and nothing else — there is no filesystem
      facility and no network facility in one — where macOS confines writes to the workdir and
      denies outbound network, and Linux does the same through mount and network namespaces. So the
      table gains a row that says exactly that and no more: native resource containment, no
      filesystem or network boundary. The access half is AppContainer and it is 0.25.0's, because
      unlike the Job Object nothing in this release forces it, and a release already carrying a
      shell parser, process handles and an API break is the wrong place to add an unforced Win32
      access-control subsystem. `Backend::WindowsJobObject` may finally be named here, since a job
      now exists to name.

      And the entry point stops describing a product this no longer is. A task contract's criterion
      becomes optional at the constructor rather than mandatory and positional, and the durable
      conversation leads the documentation ahead of the one-shot run — because a harness whose
      primary signature demands a checkable success criterion reads as a verified-task runner no
      matter what its prose claims, and a shell is precisely the capability that makes uncheckable
      work real. It rides here so a consumer migrates once: this release already breaks.
