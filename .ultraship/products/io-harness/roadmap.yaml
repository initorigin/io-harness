    status: released
  - version: 0.28.0
    outcome: >
      An operator shapes a run without writing Rust. `[[hook]]` tables in `io.toml` fire on the
      events the observer channel already emits: an audit log is a path to append the event stream
      to, a notification and a formatter are an argv to run, and a local policy check is that same
      argv with the one extra key that lets a non-zero exit stop the run. Each is a table in a file
      rather than a trait implementation, and each reaches the run through the `Observer` the crate
      has had since 0.12.0 — `Config::hooks()` returns one, so nothing in the run loop changes and
      nothing is installed the caller did not install.

      And a file the agent changed can be put back the way it was. Every `write_file` and
      `edit_file` already reads the previous contents to measure the edit (`src/run.rs:7185`); this
      release keeps them, in the store the crate already keeps, so `rewind` restores a path to what
      it was before the run first touched it — including deleting a file the run created — and does
      so after a crash and a resume, because the record is durable rather than in memory. A new
      table, not a `CHECKPOINT_FORMAT` bump, for the reason 0.25.0 recorded: an older binary never
      queries it.

      The trust rule of 0.27.0 is applied rather than weakened. `[[hook]]` is refused in the project
      scope whole — not just the executing kind — because a hook that runs an argv is the `${cmd:}`
      primitive arriving one release later, and a hook that appends to a path the file names is a
      write to a path a cloned repository chose. `io.local.toml` and the user file are the stated
      alternative, exactly as they are for `${cmd:}`. A hook's argv is a TOML array, never a string
      split by a shell.

      A formatter is a hook and not a second pass at the edit site. Attaching a writer to the write
      path would leave the model reading `[wrote src/x.rs] (412 chars)` about bytes that are no
      longer on disk, and would corrupt the workspace-changed signal that 0.11.0's stall detection
      rests on. 0.25.0's diagnostics pass reads and may therefore run there; a formatter writes and
      may not.

      It also closes what 0.25.0 recorded: `every_kind()` in `src/observe.rs:808` proves its match
      arms exhaustive and never that its vector mentions every variant, so `TodoWrote`,
      `QuestionAsked` and `QuestionAnswered` have been round-trip-untested since 0.21.0. That is not
      a tidy-up here, it is load-bearing: a hook filter names an event by its wire tag, so an
      incomplete census is a filter an operator writes and that silently never fires.
    detail: specified
    status: released
  - version: 0.29.0
    outcome: >
      The model a run uses stops being a choice between three vendors. A provider is a base URL, a
      key and a model name, so the OpenAI-shaped endpoints — Groq, xAI, Mistral, DeepSeek, Together,
      Fireworks, Cerebras, Perplexity, Gemini through its compatibility endpoint, Moonshot, Zhipu,
      Qwen and MiniMax — and the runtimes a developer starts on their own machine — Ollama,
      llama.cpp, vLLM, LM Studio, LocalAI, Jan, SGLang, KoboldCpp — are all reachable without
      writing a provider. A model running on the developer's laptop is the half that has no
      equivalent today, and it is the half that costs nothing to run.

      It is one type, not twenty. `openai.rs` and `openrouter.rs` differ by four strings — an
      endpoint, a name, a web flavor and two environment variable names — over a wire module that is
      already shared and already `pub(crate)`. So the shape is a single `Compatible` provider
      carrying a base URL and an auth style, with a table of vendor presets behind named
      constructors, reusing `openai_wire` verbatim. Twenty structs would be twenty copies of a
      constructor and twenty entries in `docs/public-api.txt`, each needing a worked doc example, to
      express what a constant already expresses. A vendor added later is then a row in a table
      rather than a file, and the crate keeps its "no dependency per vendor" property by
      construction rather than by vigilance.

      What it deliberately is not is a compatibility layer. Every vendor here diverges from the
      OpenAI wire somewhere, and the divergences are known rather than guessed: Zhipu returns
      `finish_reason` values outside the OpenAI set, Groq rejects `messages[].name` outright,
      Mistral requires a nine-character alphanumeric tool-call id and names its schema field
      `schema_definition`, DeepSeek returns 400 if `reasoning_content` is dropped from a request
      carrying tools, Ollama ignores `tool_choice` entirely, and vLLM and SGLang emit no tool calls
      at all unless the server was started with a parser flag this crate cannot set. The crate
      already parses `finish_reason` as a string and already tolerates unknown response fields, so
      the divergences that matter are the ones a caller must be told about — and they are stated in
      the contract rather than papered over, because a boundary the caller believes in and nobody
      enforces is worse than none.

      A connected provider also says what it can run. `Provider::models()` returns the vendor's own
      catalogue — the model ids, and for each what the vendor was willing to state: context length,
      maximum output, whether it takes images or tools, and the price. It is a defaulted trait
      method returning an empty list, so an out-of-tree `Provider` keeps compiling; adding a
      *required* method to an externally-implementable trait would be a break for the one extension
      point this crate has.

      The price dimensions need no new type: `pricing::Price` already carries `input`, `output`,
      `cache_read`, `cache_write` and `per_server_tool_request`, in micro-units per million tokens,
      and a vendor's pricing object maps onto those five almost exactly. The catalogue therefore
      fills a `PriceTable` directly, and derived cost stops depending on a table an operator
      maintains by hand with an `as_of` date they have to remember to update.

      The hard part is that this is not uniformly available and the release must not pretend it is.
      `GET /v1/models` is near-universal but returns *identifiers* — OpenAI, Anthropic, Groq,
      DeepSeek, Mistral, Fireworks and every local runtime return no cost data whatsoever.
      OpenRouter is the outlier that makes the feature worth building: its catalogue carries
      per-token prompt, completion and cache pricing, context length and supported parameters for
      every model it serves. So `ModelInfo::price` is `Option<Price>`, and `None` means the vendor
      did not say — never `Price::ZERO`, which would report a real spend as free and is exactly the
      confident wrong answer `src/pricing.rs` already refuses to ship a price list to avoid.
      `Spend::unpriced_calls` is the existing, honest way that surfaces. A local runtime is the one
      place zero is true rather than unknown, and it is recorded as a stated zero.

      This does not contradict "the crate ships no prices" — it is the resolution of it. That rule
      exists because a number compiled into this crate is stale the moment a vendor moves and the
      late upgrader gets a wrong answer. A number fetched from the vendor at run time has no such
      shelf life, and it carries the vendor's own effective date rather than one a human typed.

      For the vendors that publish nothing, a **reference catalogue** fills the gap without a table
      anybody has to maintain. `https://openrouter.ai/api/v1/models` needs no API key, is free to
      read, and lists most models these vendors serve with per-token prompt, completion and cache
      pricing and a context length. One request, parsed into the same `ModelInfo` the provider path
      produces, cached in the store with the instant it was fetched. Nothing is baked into this
      repository: no price constants, no per-vendor mapping file, no list to update when a vendor
      moves a number. That is the whole argument for it — the maintenance cost is zero because the
      data never lives here, which is the same reason `src/pricing.rs` refuses to ship prices at
      all. The source is a URL with a default, so a different catalogue, an internal mirror or an
      air-gapped copy is configuration rather than a code change.

      Three bounds on it, each of which has to be built in rather than discovered later:

      A reference price is **not the vendor's price**. It is what the aggregator charges to serve
      that model, which tracks the vendor's rate closely and is not identical to it. So a price
      carries its provenance — stated by the vendor, or taken from a named reference — and an
      operator reading a cost can tell which they have. A number whose origin is unrecoverable is
      the thing that makes an invoice unarguable.

      Matching is a **heuristic across naming schemes**: the reference says `deepseek/deepseek-chat`
      where DeepSeek's own API says `deepseek-v4-flash`. Exact slug and one documented
      normalisation, and **a miss stays `None`** — never a nearest guess, because a wrong match is a
      wrong invoice and is worse than the gap it filled. `Spend::unpriced_calls` already reports the
      gap honestly.

      It is **an outbound request to a host the caller did not name**, and this crate authorises
      egress against `Provider::endpoints()` before a run starts. A provider silently dialling a
      third host would walk straight through that boundary. So the lookup is **opt-in**, and when it
      is on the reference host appears in `endpoints()` like every other endpoint, governed by the
      same `Act::Net` rules. Off by default, refused rather than skipped when the policy denies it.

      Excluded and argued rather than omitted: AWS Bedrock's SigV4 path, Google Vertex's
      service-account JWT, Gemini's native `interactions` API, and Azure's `api-key` header with its
      deployment-in-path and `api-version` query param. The first three are reachable today by an
      application that mints a bearer token itself and passes it as the key, which is where OAuth
      has always belonged. Azure is the closest call — it costs one auth-style variant and no
      dependency — and it is left out only because no consumer has asked for it; the shape admits it
      later without a break.

      Three mechanisms were decided when this entry was promoted to `specified`, and each departs
      from a sentence above rather than from its argument. The catalogue is cached on the provider
      instance rather than in the store, because `Provider::models()` takes `&self` and reaching a
      `Store` from it would put the store into the provider trait; the instant it was fetched lands
      on `PriceTable::as_of`, which is the field that already exists to carry exactly that claim.
      `Compatible` has no `from_env`, because twenty-one vendor variable names are twenty-one
      guesses and `[[provider]]` with `${env:GROQ_API_KEY}` has resolved credentials from the
      environment since 0.19.0. And `Fallback::models()` keeps the empty default, because which of
      two vendors' catalogues a chain reports is a question with no right answer.
    detail: specified
    status: released
  - version: 0.30.0
    outcome: >
      An operator can ask the store *why*. Three things the crate does are currently only answerable
      by re-deriving them by hand, and each is a question an embedding application has to answer on
      a screen.

      **Which layer set this setting.** `Config` merges four scopes and `Config::sources()`
      (src/config.rs:716) returns the files it read — not which of them decided any given key. So an
      application showing a settings list can say what the value is and cannot say where it came
      from, which is the half that matters when a project scope has narrowed something a user set.
      After this release a resolved key carries its origin.

      **Why a fact is remembered.** `MemoryEntry` (src/state.rs) carries key, value, run_id, step
      and created_at. It cannot distinguish a durable decision from an incidental fact, cannot be
      pinned by a human so a run stops re-litigating it, and does not record that this run recalled
      it — so an application listing what the agent knows about a workspace can only list it flat.
      The entry gains a kind, a pinned flag, and a recall record.

      **How often gates fail and what recovery caught.** 0.18.0 grouped raw rows for *cost*, by
      model, by day and by run, and stopped there deliberately. Nothing groups outcomes: the
      verified-first-try rate, which criterion fails most, and how many runs a fallback, a replan or
      a resume rescued are all derivable from the trace and none is queryable. Each is one grouped
      accessor beside the ones `pricing` already ships, in the same shape and with the same rule —
      the crate returns rows and renders nothing.

      It lands first among the seven because it is the smallest, it breaks nothing, and three
      application panels are false without it. A panel that shows a number nobody can source is
      worse than a panel that is missing.
    detail: specified
    status: released
  - version: 0.31.0
    outcome: >
      The agent proposes before it acts, and a caller can say how hard it is allowed to think.

      A **plan gate**: the agent produces a structured plan — ordered steps, each with the sub-agent
      that will own it — and the run pauses on it durably, the way an approval already pauses, until
      a human approves it, sends it back with a correction, or cancels. Nothing is written before
      the approval. This is not the todo tool of 0.21.0, which lets an agent hold a plan the
      operator can watch while it executes; it is a gate that executes nothing until an answer
      arrives, and it survives a restart while it waits.

      And **reasoning effort per role**. `AgentDef` carries a role, a model and a narrowed boundary;
      it cannot say how much thinking the model should do. The crate records `reasoning_tokens` in
      `Usage` and has no way to ask for them. A tier per role, projected onto whatever each vendor
      calls it, with the thinking the model produced reaching the observer as an event and staying
      out of the context assembled for the next turn — visible, and not paid for twice.

      The two ride together because they are the same moment: both change the request before the
      agent acts, and both are what a caller adjusts when a run is about to do something expensive.
    detail: specified
    status: released
  - version: 0.32.0
    outcome: >
      The fleet holds the ceiling instead of hitting it. `Containment` treats the agent cap as a
      total and refuses the spawn that crosses it (`SpawnRefusal::AgentCap`), so a hundred-agent
      task fails at its hundred-and-first child rather than running a hundred at a time until it is
      done. This release separates the two limits that were one: a **concurrency** cap that
      throttles — a spawn past it queues, and the queue drains as slots free — and a **total** cap,
      alongside the spend and time ceilings, that still refuses, because some limits are meant to
      stop a run and some are meant to shape it.

      Working, queued and done are counted per tier and reach the observer, so an application can
      show a fleet draining rather than a number that stopped moving. The queue is durable: a
      restart rebuilds it at the depth it had, and a queued child that never started is not charged.
    detail: specified
    status: released
  - version: 0.33.0
    outcome: >
      Two processes, one run. Today a run belongs to the process that started it: `resume`
      reattaches to a run that *stopped*, and there is no way to observe or answer one that is still
      going. An unattended run holding an approval is unreachable until it is killed.

      After this release a second process attaches to a live run, receives the same serialised
      events the owning process receives, and can answer the approval or the question it is holding.
      The run's own durable state stays the authority — an attaching process reads and decides, it
      does not take ownership — so the failure modes are bounded: the observer dying changes
      nothing, and the owner dying leaves exactly the resumable run it always did.
    detail: specified
    status: released
  - version: 0.34.0
    outcome: >
      A second model checks the first, and which model runs stops being fixed for the whole run.

      A **review criterion**: a `Verification` variant whose check is a model reading the change
      rather than a command exiting zero, and which refuses to run on the model that wrote it. Every
      criterion today is execution-based, which is the right default and cannot catch what compiles,
      passes and is still wrong.

      And **conditional routing**: escalate to a stronger model after repeated gate failures,
      downshift to a cheaper one when the change is small, and refuse to start at all when the
      primary provider is unreachable rather than quietly running an unattended job on the fallback.
      Roles and a fallback chain exist; what does not is a rule that changes either one during a
      run.

      Plus the smallest piece and the one an operator asks for first: **retry a single failed gate
      from its own checkpoint**, so a terminal transport failure on one gate does not cost the forty
      that passed.
    detail: specified
    status: released
  - version: 0.35.0
    outcome: >
      A directory is a capability bundle. Skills, hooks, MCP servers, agent definitions, prompt
      templates and policy each have a discovery path of their own; nothing packages them, and
      nothing records that a capability came from somewhere other than the operator.

      A plugin manifest declares what a directory contributes, discovered across the same three
      scopes configuration already uses, under the same trust rule 0.28.0 applied to `[[hook]]`:
      what a cloned repository can hand you is not what your own machine can. Plugin-supplied policy
      may only narrow. Every contribution carries its plugin as its origin in the trace, so a
      refusal or a spend draw can be attributed to the thing that introduced it. A plugin that fails
      to load is dropped and reported, never fatal — one broken bundle must not take a run with it.
    detail: specified
    status: released
  - version: 0.36.0
    outcome: >
      A run lands as a branch, and can be put back.

      Git is four fixed-argv built-ins — log, diff, stage, commit — and `checkout` is on the
      forbidden list, so a run commits onto whatever branch it found and parallel agents share one
      checkout. Branch and worktree join them, argv fixed by construction the way the existing four
      are, so a run ends as a branch to review and concurrent agents stop colliding on one working
      tree.

      And rewind widens. 0.28.0 keeps the previous contents of every path a run wrote and restores
      one; it does not restore what the run *learned* or what it had *queued*. Memory entries
      written after a checkpoint, and the spawn queue as it stood, come back with the files — and
      the trace keeps both branches rather than losing the one that was undone. What it still cannot
      undo — a commit already pushed, a migration already applied, a call already made — the crate
      states plainly rather than implying.
    detail: specified
    status: released
  - version: 0.36.1
    outcome: >
      A contributor gets a verdict in minutes, and a reader gets a page that is true.

      Every push waits about eighteen minutes for CI, and effectively all of it is one job: the
      Windows leg links the crate's own targets — one library, fifty-nine test binaries and
      thirty-five examples — then links the whole set a second time when the feature flip
      invalidates it, then compiles and links two hundred and fifty-one doctests. Thirty of those
      thirty-five examples are demonstrations no test executes, and they are linked on three
      operating systems, twice each. The two feature polarities and the doctests are independent
      questions run one after another in a single serial job.

      After this release the same evidence arrives in well under half the wall clock: the same three
      operating systems, the same two feature polarities, the same doctests, the same MSRV, lint,
      docs.rs, links-consumer and cross-version gates. Nothing is dropped and nothing is sampled —
      the work is reorganised, not reduced.

      And the front page stops misinforming the reader in the two places it costs most. The install
      snippet a reader copies from crates.io says `io-harness = "0.25"` against a crate that is
      eleven releases past it. The product table calls io-cli "In development" and unlinked, beside
      the sentence "io-harness is the only public repository today" — io-cli has been published to
      crates.io and public on GitHub since 2026-08-03. io-studio is described as in development and
      has no source at all. A reader gets a line that works, a truthful account of what each sibling
      product is and is not, and a README organised around what the crate is and how to start rather
      than around what accumulated. The dependency version joins the MSRV, the feature list and the
      relative links as a fact stated in `Cargo.toml` and checked against the prose, so the eleven
      releases of drift cannot happen a second time.

      The badges are rebuilt on the same rule. One of the five has its value typed into the URL,
      which is the install snippet's defect eleven lines higher in the same file; after this release
      every badge resolves what it claims from crates.io, docs.rs or GitHub Actions at render time,
      and the block gains the one thing a reader deciding whether to depend on this crate asks and
      cannot currently see — how many people already do. It gains no badge for coverage, benchmarks
      or unsafe-freedom, because this repository measures none of the three and a badge asserting
      what nothing checks is worse on a landing page than in a test.
    detail: specified
    status: released
  - version: 0.37.0
    outcome: >
      A conversation answers without opening a run. An embedder holds a session in which "hi",
      "thanks" or "what can you do" costs one completion and leaves behind no plan gate, no sandbox,
      no verification gate, no checkpoint and no step — while the same entry point, given the same
      words followed by work, runs the full loop exactly as it does today.

      The classification is the model's own and costs nothing extra: the turn's first completion is
      made with the workspace tools offered, and what the model does with them decides what the turn
      was. A completion that stops on text is an answer. A completion that reaches for a tool
      promotes the turn to a run and continues from that same completion, so neither shape pays for
      a second call. There is no word list, in this crate or in the program embedding it, and
      therefore nothing that only works in English.

      What a reply still is: billed, drawn against the session's ledger, recorded with its usage,
      readable in the trace as an answer rather than as work, and part of the conversation the next
      turn reads. What it is not is a run that reports having done something.
    detail: specified
    status: released
  - version: 0.38.0
    outcome: >
      A long conversation stops paying full price for its own history. Where a provider caches a
      request prefix, this crate marks the prefix that is stable across a session's turns — the
      instructions, the skills, the tool schemas, the settled part of the transcript — so the
      provider serves it from its cache instead of re-reading it. The counters that report what was
      served that way have existed since 0.18.0 and the accounting already prices them; what is
      missing is the request side, so today every turn of a fifty-turn conversation is billed as if
      it were the first.

      An operator sees the effect where they already look: `cache_read_tokens` on the run summary
      stops being zero, and the derived cost of a long session falls without a line of the
      conversation being dropped.

      What the release covers is the prefix that is genuinely stable: the instructions, the skill
      catalogue and the tool schemas, which are re-sent identically on every step of every run and
      every turn of every session. The transcript is deliberately not marked — the context assembler
      supersedes, invalidates, re-reads and re-fits earlier observations on each turn, so it is not
      a byte-stable prefix and marking it would buy cache *writes* rather than reads. Making the
      assembler prefix-stable is a larger change than this release.
    detail: specified
    status: released
  - version: 0.39.0
    outcome: >
      A conversation can fan out. An operator asks for something wide inside a session — migrate
      these forty handlers, review these twelve files — and the turn decomposes into contained
      children under the same session, the same shared ledger and the same inherit-and-narrow
      boundary, reporting into the same transcript. Today that requires leaving the conversation for
      a one-shot run, because the sub-agent tool is registered only inside the tree loop, which the
      conversation entry points cannot reach: a run is a tree or a turn and not both.
    detail: specified
    status: released
  - version: 0.40.0
    outcome: >
      The project's own commands can run contained. A caller asks for it on the contract, and from
      then on `exec` and `shell` execute under the same containment model-produced code already gets
      — resource caps that kill rather than throttle, filesystem writes confined to the workspace,
      and outbound network denied unless the policy grants it — instead of at the full privileges of
      the process that embedded the crate. The widest grant the crate makes stops being the one
      thing that cannot be brought inside its own boundary.

      The containment is opt-in and the default is unchanged, because the un-sandboxed default is a
      granted owner decision (`US-IO-HARNESS-0.17.0-I02`) taken on a real argument: the sandbox as
      0.6.0 built it discards its working directory, so `npm install` and `cargo build` cannot work
      inside it. This release answers the working-directory half rather than overruling it — a
      contained command is given the workspace root and its writes are confined there, so the tree
      the run is editing is the tree the command builds — and leaves the choice with the caller who
      knows whether their build reaches outside it.

      Linux is brought up to the claim rather than exempted from it. Today `unshare` gives a mount
      namespace that nothing is remounted into, so filesystem confinement is macOS-only and the
      crate's own documentation over-reads it; 0.40.0 binds the workdir so "writes are confined to
      the workspace" is true on both, or says plainly which platform enforces what.
    detail: specified
    status: released
  - version: 0.41.0
    outcome: >
      A read-heavy step stops costing one round trip per file. When a completion carries eight
      `read_file` calls, a `grep` and a `find`, the read-only calls run at once instead of one after
      another: the loop dispatches them concurrently under a cap the contract owns, and folds the
      results back in the order the model asked for them. Today `src/run.rs:4346` walks
      `response.tool_calls` in a single `for` loop and awaits each `dispatch` before starting the
      next, so a model that spent one completion asking for ten files pays ten sequential reads for
      it. Writes, `exec` and every mutating tool stay strictly serial, and a call the policy sends
      to an approver collapses its batch back to serial so a pause can never race work already in
      flight.
    detail: specified
    status: released
  - version: 0.42.0
    outcome: >
      An unattended run stops dying on a decision nobody is present to make. A model can be
      installed as the `Approver`: it reads the pending act, the rule and the layer that flagged it
      and the run's goal, then approves, denies, or escalates to the human who will read the trace
      tomorrow — never answering for a call the same model made, the rule `Verification::Review`
      already enforces. Beside it, an operator attaches a check to a named point in the tool
      lifecycle from `io.toml` rather than to an event stream, so a local rule that must stop a run
      before a tool executes is a table entry rather than a Rust impl. And the review criterion
      learns to read the change rather than the outcome: `Verification::Review` answers today from
      what the run produced, while what a reviewer of a code change actually reads is the change —
      so a rubric can be answered against the edits the run made, which is the form the criterion
      was always reaching for.
    detail: specified
    status: released
  - version: 0.43.0
    outcome: >
      A long conversation stops forgetting its own beginning, and a context overflow stops ending
      the run. Assembly today elides — it supersedes, invalidates and stubs earlier observations
      (`src/context.rs`) — and nothing in the crate summarises anything, so once elision has taken
      what it can the oldest turns are simply gone and a request that still will not fit is a
      terminal provider error. This release adds a summarising compaction: at a stated share of the
      window everything before the newest turns becomes one model-written summary of intent, files
      touched, decisions taken and open work; a context overflow is classified and answered by
      compacting and retrying once. The summary is a stored row bound to the step it covers, so a
      resumed, branched or replayed run reproduces it rather than paying to write it again. And
      because a compacted conversation is one whose full history now lives only in the store, an
      operator can export a session's transcript — every turn, in order, summary boundaries marked —
      as one readable artifact, so the thing compaction folded away is still reachable outside the
      model's context.

      And a turn can carry an image. `TaskContract::with_images` (`src/contract.rs:476`) has
      accepted one since the `media` feature shipped, but every session entry point takes a `&str`
      and nothing else — so the one path an operator would hand a screenshot to is the only one that
      cannot take it. A turn accepts images beside its text, through the attachment path a one-shot
      contract already uses.
    detail: specified
    status: released
  - version: 0.44.0
    outcome: >
      A long session stops paying full price for the part of the request that never changes. 0.38.0
      marked the system block and deliberately left the transcript unmarked, because assembly
      rewrites earlier observations every turn and a breakpoint there would bill as a cache write.
      0.43.0 removes that objection: everything before a compaction boundary is immutable by
      construction. So a second breakpoint goes at the end of the frozen prefix, the reads land in
      the accounting rows beside every other token, and the operator sees it where they already
      look.
    detail: specified
    status: planned
  - version: 0.45.0
    outcome: >
      The agent is told its boundary instead of discovering it by being refused. The system block
      carries the resolved policy — what may be read, written, executed and dialled — the sandbox
      mode in force, and the backend the host actually gave, including a degraded floor. A refusal
      the model could have predicted costs a step today, every time. Beside it the prompt is shaped
      per model family rather than in one voice for all of them, since the crate now reaches four
      wire shapes and two dozen vendors.

      And the system prompt stops being the crate's private opinion. Today it is a `const` behind a
      private `fn` (`src/run.rs:10188`) — three sentences naming the tools — which an embedder
      cannot read, extend or replace, so a program built on this crate cannot give its agent its own
      voice without forking. It becomes a choice the caller makes: keep today's minimal prompt,
      which stays the default because a library that installs opinions into someone else's product
      is a library that fights its embedder; take an assembled preset by name; append to one; or
      supply the whole thing. Beside it, what `[instructions]` discovers in a repository
      (`src/config.rs:678`) can land as a section of that prompt rather than only as constraints on
      the contract — a repository's own guidance reads as guidance, and a constraint is a different
      thing that the goal is checked against. And it is discovered without being asked for twice:
      `AGENTS.md` is already the sole default (`src/config.rs:158`), but discovery runs only where
      an `[instructions]` table is present, so a repository carrying the file every other agent
      reads and no `io.toml` at all is read by none of it. `Config::discover` finds it by default,
      and an empty `files` list is how a project says no. Nothing becomes implicit that was not
      already: the caller still chooses to read the configuration, once, before the run.

      One rule holds the whole composition together, and it is the reason this release is not simply
      "let the embedder set a string": **an appended or preset prompt may not weaken the rule that
      decides what a turn is.** The sentence that lets a turn answer instead of working
      (`src/run.rs:10217`) produces a crate-level guarantee — a `TurnKind::Reply` stages no step, no
      gate, no checkpoint and no approval — and a program whose own prompt says "always verify with
      tools before answering" would quietly turn every greeting into a run while the crate went on
      documenting otherwise. So the crate's own turn-ending rule is emitted last and stated to be
      un-overridable, and what an embedder supplies sits before it. A composable prompt that can
      contradict its own runtime's contract is not a feature.
    detail: outline
