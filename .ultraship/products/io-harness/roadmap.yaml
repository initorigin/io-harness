  - version: 0.23.0
    outcome: >
      A Rust program whose own dependency tree carries a current `rusqlite` can embed this crate at
      all. `libsqlite3-sys` declares `links = "sqlite3"`, and cargo refuses to link two versions of
      a `links` package into one graph — so today an embedder on `rusqlite` 0.33 or later does not
      get a warning or a duplicate symbol, it gets a build that cannot resolve. This crate has been
      on 0.32 since 0.2.0 and the line has moved eight minors. The upgrade to 0.40 removes that
      wall, keeps every existing database readable and every checkpointed run resumable across the
      version boundary, and changes no schema and no stored format. It ships alone, because a
      regression in a 4,800-line state layer must not be able to hide inside a feature release.
