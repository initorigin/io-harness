      an `Act::Exec` check under the run's sandbox mode, and a server indexes the whole root
      including paths a `deny_read` rule covers, which is stated rather than discovered.
    detail: outline
    status: planned
  - version: 0.53.0
    outcome: >
      An agent can drive a real browser and see what it did: navigate, click, type, scroll, read the
      page, take a screenshot the model looks at, and read the console output and page errors each
      action produced. It is a feature that is off by default, like documents, and it is inside the
      boundary rather than beside it — every navigation is an `Act::Net` check against the host and
      a row in the trace, and under containment it goes through the same egress path as everything
      else. No binary is fetched at runtime: the browser is one already on the machine, named in
      `io.toml` or found on PATH, and its absence is a refusal rather than a download.
    detail: outline
    status: planned
  - version: 0.54.0
    outcome: >
      A read starts before the model has finished speaking. The provider's stream already yields
      tool calls incrementally; once a read-only call's arguments are complete there is no reason to
      wait for the rest of the completion before running it. Read-only only, because a write begun
      on a stream that then fails is not recoverable, and the ordered fold from 0.41.0 keeps the
      trace and the replay identical either way.
    detail: outline
    status: planned
  - version: 0.55.0
    outcome: >
      Whatever a person hands the harness, the harness takes — or says exactly why not. Today an
      image must already be one of four types (`src/provider/mod.rs:218`: JPEG, PNG, GIF, WebP),
      because that is the intersection every provider documents and the crate refuses to guess a
      type a vendor will reject. That rule is right about the wire and wrong about the doorstep: an
      operator hands over an SVG diagram, a BMP from a scanner or a TIFF from a camera, and gets a
      refusal for a reason that is the vendor's rather than theirs. This release decodes what it can
      and re-encodes it to PNG before it reaches a provider, so the accepted set at the door is wide
      while the set on the wire stays exactly the four. What cannot be decoded in pure Rust — a
      format needing a system C library, which the standing rule forbids on any runner — is refused
      by name, with the reason and the conversion that would fix it.

      Beside images, the same doorstep question for files. `read_file` reads any UTF-8 file and
      knows nothing about it, so a binary read returns mojibake rather than a refusal. This release
      gives the read path a type: text with an encoding it detected, a known document routed to its
      decoder, an image routed to attachment, and a binary named as binary instead of decoded into
      nonsense.

      And a file too large to read is **refused rather than shortened**. Today it is cut to the
      per-observation cap and the cut is announced inside the text (`src/tools/mod.rs:303`,
      `src/context.rs:319`) — which is honest and still not enough, because what the model then
      holds reads like a whole file carrying a footnote, and a model that saw twelve thousand
      characters of a four-hundred-thousand-character file goes on to reason as though it saw the
      file. Nothing downstream can tell the difference: the observation has the shape of a
      successful read. So a read whose content will not fit returns **no content at all** — an error
      naming the file, its size, the limit it exceeded and the two ways to proceed. The ways have to
      exist for the refusal to be usable, so `read_file` gains a line range: a partial read the
      model asked for by number is a partial read the model knows about, which is the whole
      difference from one it was handed. The same rule reaches assembly, where a read that fitted
      when it happened can later be squeezed by a narrower budget share: a stored read is either
      whole in the context or replaced by a stub that says to re-read a range, never served as a
      fragment. Bounding stays as it is for the kinds where a fragment is not a lie — a command's
      output and a search's matches were never a document.

      For the refusal to be usable it also has to be predictable, and today's limit is not. It is
      derived from the run's budget — `entry_cap_chars` (`src/context.rs:299`) is half the effective
      token budget in characters, floored at two thousand — and the effective budget is a share of
      what is *left*, so the same file is readable at step three and refused at step forty, and no
      operator can say in advance which files their agent can read. That is tolerable for a
      truncation nobody relied on and wrong for a refusal a run's behaviour now turns on. So the
      ceiling becomes a number the operator sets, in `io.toml` beside the other budgets and
      projected onto the typed API like every other key, with the budget-derived value as its
      default so a caller who sets nothing gets today's behaviour. A read is then refused for one of
      two stated reasons — over the operator's ceiling, or over what this run's remaining budget can
      carry — and the error says which, because they call for different answers.
    detail: outline
    status: planned
  - version: 0.56.0
    outcome: >
      What a run learns is kept for its value rather than for its age, is reachable from more than
      one workspace, and can be unlearned. Three limits meet in one release.

      **Eviction is by age, and the store already knows better.** At sixty-four entries
      (`MEMORY_MAX_ENTRIES`, `src/state.rs:1916`) a write evicts the oldest and reports what it
      dropped — which is curation by clock: a build command learned on the first run and drawn on by
      every run since is dropped for a triviality learned this morning. The information to do better
      is already recorded and consumed by nothing: `MemoryRecall` (`src/state.rs:1274`) says which
      run and which step drew on which key, so recall count and last-recall time are a query away.
      Eviction becomes weighted by what is actually used, with a pinned entry never a candidate and
      the dropped keys still returned so a caller can record the loss.

      **The caps are constants, and the operator should own them.** `MEMORY_MAX_ENTRIES` is 64,
      `MEMORY_MAX_CHARS` is 16,000 for the whole workspace and `MEMORY_MAX_ENTRY_CHARS` is an eighth
      of that. Those numbers were chosen so the *entire* store fits the quarter-of-the-ceiling share
      recall gets (`src/context.rs:436`) at a moderate budget — which is why raising them is not the
      simple win it looks like: past that point recall can no longer carry everything, selection
      starts deciding what the model sees, and selection is recency until this release fixes it. So
      the caps move into `io.toml` beside the other budgets, defaults unchanged, and the guide
      states the coupling plainly: a larger store is only worth having with weighted selection under
      it, and the thing that grows with it is the per-turn bill.

      **A run can learn but not unlearn.** `remember` writes by key and rewriting a key replaces it,
      so an agent that discovers a fact was wrong can only correct it if it recalls the key it used
      — learn the same thing twice under two names and both persist, disagreeing. A `forget` tool
      closes it, refused on a pinned entry for the same reason a write is, and recorded like every
      other tool call.

      **And memory is workspace-scoped, full stop.** `memory_key(root)` (`src/run.rs:9722`) is the
      only scope there is, so a fact true of every repository an operator owns — the package manager
      they use, a convention they never want broken — has to be learned again per workspace or be
      written by hand into each one's instructions. A second scope sits above the workspace: written
      deliberately, recalled by every run, and narrower than it sounds — the workspace entry wins on
      a key collision, because the specific place always knows better than the general one.
    detail: outline
    status: planned
  - version: 0.57.0
    outcome: >
      The notes a turn is handed are the notes that turn needs, and two of them never disagree.

      Recall today is ordered by recency: `render_notes` (`src/context.rs:436`) fills its quarter of
      the ceiling newest-first and stops. That is the right answer only while the whole store fits
      the share, and the moment an operator raises the caps 0.56.0 handed them, the order decides
      what the model sees. So recall is ordered by what the turn is about — the words of the prompt,
      and the paths the run has already read or written — then by how often an entry has actually
      been drawn on, then by recency. Nothing is scored by a model and nothing leaves the process:
      the ordering is a pure function of the store and the turn, so a replayed run recalls in the
      same order it did the first time, which is what lets the criterion be an equality rather than
      a resemblance.

      And a note that contradicts one already held is caught where it is written rather than after
      it has been believed. `remember` writes by key, so the same fact learned twice under two names
      leaves two entries that disagree, both recalled, and the model acts on whichever it read last.
      On a write whose text closely matches an entry already stored, the tool result says which key
      that is and what it holds, so the model resolves it in the same turn — replace the old one, or
      drop the new one — instead of leaving a contradiction for a later run to trip over. The
      comparison is a normalised overlap of the two texts, computed here, on the write path already
      running.
    detail: outline
    status: planned
  - version: 0.58.0
    outcome: >
      An operator can see what a store is holding and decide what it keeps.

      History has no expiry and it never should have one imposed here: the trace lives in the file
      the caller opened, and how long an audit record survives is the embedding program's decision,
      not the library's. But every `DELETE` in this crate today serves an internal purpose — a
      consumed spawn, a replaced plan, a rewind, a forgotten note — and there is no way at all to
      remove a session, a run or a conversation. So a program that wants to keep ninety days has to
      write SQL against a schema this crate owns and versions, and the first release that moves a
      table breaks it. Deferring the policy to the caller is right; handing them no instrument to
      carry it out is what makes it a hole.

      This release gives them the instrument. A session's cost on disk is a question with an answer,
      so growth is visible before it is a problem rather than after. A session can be deleted whole
      — its turns, its runs, and everything the store hangs off them, in one transaction, with the
      count of what went. Sessions older than a date can be swept in one call, since "keep ninety
      days" is the shape almost every retention decision takes. And a session can be **archived**
      rather than erased: the conversation text goes, the run records, the ledger and the accounting
      rows stay, so the answer to "what did this cost and what did it touch" outlives the answer to
      "what exactly was said" — which is the distinction an audit obligation and a privacy
      obligation usually pull in opposite directions on.

      Reclaiming the space is part of the release rather than an afterthought, because SQLite frees
      pages into the file rather than out of it: a prune that leaves the file the size it was has
      not done what the operator asked for, and the compaction that fixes it must be a call they
      make knowingly, since it rewrites the database and wants the room to do it.

      Two rules hold the whole thing together, and both exist because a deletion is the one
      operation this crate cannot take back. A resumable run is not swept by a date: a
      crash-resumable tree that vanished because it was old is the worst failure this release could
      ship, so it is refused and named, and removing it is a decision made per session. And what an
      undo depends on goes when the run does — a restore point without its run is a promise the
      store can no longer keep, and it says so at the time rather than at the moment somebody
      reaches for it.
    detail: outline
    status: planned
