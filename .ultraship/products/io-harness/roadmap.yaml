  - version: 0.27.0
    outcome: >
      One file is the whole configuration, for the crate and for the applications built on it.
      `io.toml` gains the piece it is missing — which provider and model to run, and its fallback
      chain — so an embedder reads a spec rather than writing provider-selection code, and gains a
