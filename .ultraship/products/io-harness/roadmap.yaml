  - version: 0.46.0
    outcome: >
      A run is contained unless its caller says otherwise. 0.40.0 made containment askable; the
      default is still the full privileges of the embedding process, which is the widest thing the
      crate grants and the one grant a reader is most likely to under-read. This release names three
      modes — read-only, workspace-write, full-access — makes workspace-write the default, and gives
      each mode its own enforcement profile rather than one shape and a boolean. The escape hatch is
      spelled at the call site so choosing it is a decision on the page. The detected toolchain's
      own cache directories become writable roots, which is what makes a default-contained build
      survive contact with a real package manager.
    detail: outline
    status: planned
  - version: 0.47.0
    outcome: >
      Containment holds on every platform the crate claims, including the hosts that refuse the
      primitive it reaches for first. The Linux backend needs an unprivileged user namespace and a
      stock modern distribution refuses one, so a run there takes the portable floor: caps only, no
      filesystem confinement, no egress denial. It is reported rather than hidden, and it is still
      the weaker guarantee. This release makes Linux a chain — a namespace-free filesystem and
      syscall restriction first, a mount-namespacing helper where the host has one, the existing
      backend after that, the floor last — and finishes Windows access confinement so a Windows run
      enforces files and network rather than resource caps alone.
    detail: outline
    status: planned
  - version: 0.48.0
    outcome: >
      Everything a run starts is inside the boundary, and the boundary is the one the policy already
      describes. Three gaps close together: a backgrounded `shell_start` handle currently runs at
      full privilege while every foreground command beside it is contained; each tool declares the
      mode it needs so the requirement is resolved before execution rather than discovered by a
      failure; and egress stops being one boolean per run. The policy has carried per-host
      `Act::Net` rules since 0.8.0 while the sandbox backends take a yes-or-no, so a contained
      command permitted one host can reach all of them. Sandboxed egress is routed through a
      loopback proxy the run owns, which enforces the host rules the policy already states and
      records every dial.
    detail: outline
    status: planned
  - version: 0.49.0
    outcome: >
      Agents in one tree can talk. A tree can nest, share one ledger, queue past its concurrency cap
      and hand results up, but a child cannot tell a sibling what it found, and a coordinator cannot
      wait on a named child — it can only spawn and read what comes back. This release adds a
      durable mailbox: send, read, and wait on an agent by name, ordered, checkpointed and replayed
      like every other row. Addressing stays inside the tree, in the same spirit as
      inherit-and-narrow.
    detail: outline
    status: planned
  - version: 0.50.0
    outcome: >
      A parent chooses how a child returns. A child today blocks its parent and pours its whole tool
      output into the parent's context. Three shapes are added: a detached child that reports on
      completion instead of blocking, a forked child whose tool output never enters the parent's
      context at all and only its conclusion does, and an automatic move to the background after a
      stated wall clock so one stuck child cannot hold the tree. On a wide fan-out the forked shape
      is the largest context saving available to the crate.
    detail: outline
    status: planned
  - version: 0.51.0
    outcome: >
      A change becomes a reviewable artifact rather than a pair of counts. Three things land
      together: a patch tool taking unified diff beside `edit_file`, so a multi-hunk change is one
      call anchored to its context; the hunk itself kept in the store, where `Edit::measure`
      (`src/state.rs:2293`) is handed both old and new text and today keeps only `lines_added` and
      `lines_removed`, so a trace can emit a patch a human reviews; and the project's own checker as
      a tool the agent may call before an edit, not only automatically after one. With the hunks
      stored, undo gains a second granularity beside `rewind`'s one-restore-point-per-file: a run
      can be walked back a step at a time rather than only to the state before it first touched a
      file.
    detail: outline
    status: planned
  - version: 0.52.0
    outcome: >
      The agent navigates a codebase the way a language-aware editor does: definitions, references,
      symbols, hover and rename, instead of inferring structure from `grep`. The crate speaks the
      language-server protocol to servers named in `io.toml`, started once per run in the background
      so a cold index is paid once rather than inside a tool call. Diagnostics from a server are a
      third state and never a silent empty — clean, findings, or unknown-and-why — and they augment
      the compiler stream (`src/tools/diagnostics.rs`) rather than replacing it, because a server's
