  - version: 0.26.0
    outcome: >
      The platform table finally reads the same on all three rows. AppContainer is the access half
      0.24.0's Job Object deliberately left: the analogue of macOS's `sandbox-exec` profile and
      Linux's mount and network namespaces, confining what model-produced code may reach on disk and
      off the machine. It closes both missing columns at once, because an AppContainer granted no
      `internetClient` capability has no route out by construction — the same shape as an empty
      network namespace, which is what makes it the right mechanism rather than a filesystem ACL
      scheme with a separate network story bolted beside it. Only with this does Windows say
      *native* and mean by it what the other two rows mean.

      It also closes what `US-IO-HARNESS-0.25.0-I01` deferred: routing a process handle's spawn
      through a Job Object, so that killing a handle on Windows reaches a grandchild whose parent
      has already exited. 0.25.0 shipped that guarantee on unix through process groups and could not
      ship it here, because Windows has no process group and the Job Object needs the child handle
      at the spawn site. Once this release owns `CreateProcessAsUserW`, the assignment is a few
      lines in the same place rather than a second interface change — which is the argument for it
      landing here rather than being forced into the release that discovered it.

      It is a release of its own, and 0.25.0's research is why. The security capabilities reach a
      child through `PROC_THREAD_ATTRIBUTE_SECURITY_CAPABILITIES` on an attribute list, and
      `tokio::process::Command` cannot carry one on stable Rust — `raw_attribute` is still gated
      behind `windows_process_extensions_raw_attribute`. So any AppContainer at all, network-only
      included, means owning `CreateProcessAsUserW` here and re-implementing what the shared runner
      gives free today: inheritable pipes, async draining, kill-on-drop, exit collection and the
      wall-clock timeout. That rewrite is the release, and the filesystem half compounds it — an
      AppContainer is default-deny for reads, so the workspace grant is the easy part and the
      toolchain, the executed binary, the redirected temp directory and every language's install
      tree are the rest. First work is a `windows-latest` smoke test, because viability on the CI
      runner and on Server SKUs is unverified and everything else depends on it.
