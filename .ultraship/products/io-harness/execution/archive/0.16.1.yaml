product: io-harness
version: 0.16.1
execution_state: DEVELOPING
checkpoint: null
blockers: []
constraints:
  time: >
    The owner asked for this release explicitly as a small one and stated its scope in full: drop
    io-eval and website from the README's product table, add a status column, io-harness released
    and linked, io-cli and io-studio in development and unlinked, plus a silent removal of
    CARGO_REGISTRY_TOKEN from .env.example. They also instructed that CI is not waited on for this
    release, on the stated grounds that it is a text change and the matrix will pass. The 2026-07-26
    override stands: PRs, merges, the GitHub Release and `cargo publish` proceed without a stop.
  budget: null
  capacity: >
    Main thread, no subagents. The release is four files and a repository-wide grep; the
    coordination cost of parallelising it would exceed the work. This is the owner's own framing of
    the release as small, not a measurement.
  source: user-estimate
release_fit:
  assessment: high
  reasons:
    - >
      Recorded constraint: the owner scoped this release themselves and called it a text change. The
      contract contains no code, no schema, no dependency and no API surface — the only mechanised
      risk is that `tests/readme.rs` asserts properties of the very file being edited, and the edit
      touches neither the first screen nor any heading it inspects.
    - >
      Recorded constraint: CI is not gated on. That removes the one thing that has made recent
      io-harness releases long — the Windows leg at 17-20 minutes — and it is a safe removal here
      only because there is no code whose platform behaviour could differ.
    - >
      The publication path is the same one 0.16.0 used four days ago and is known good. Nothing
      about it needs to be discovered.
  major_cost_drivers:
    - >
      The repository-wide sweep is the only part that can be done badly. Fixing the README and
      declaring victory would leave `src/lib.rs` — the docs.rs landing page — free to contradict it,
      which is the same class of defect this release is correcting.
  recommended_scope_change: null
