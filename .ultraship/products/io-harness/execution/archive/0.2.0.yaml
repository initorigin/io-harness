product: io-harness
version: 0.2.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
release_fit:
  assessment: probable
  reasons:
    - Five features layer onto a proven, small (746 LOC) 0.1.0 loop, provider, and store — no
      rewrite.
    - Execution-based verification runs `rustc` on the single produced file, so it needs no
      cargo-project scaffolding and no network (self-contained).
    - The rusqlite migration and the public API additions are additive, so 0.1.0 callers keep
      compiling.
    - No user time or budget constraints recorded, so fit is judged on scope alone.
    - fallback_scope (execution-verify + step/time budget + trace) drops cost budget, retry, and
      resume if effort runs short and still ships a coherent outcome.
  major_cost_drivers:
    - The resumable-run state model — deciding what to checkpoint and where to resume.
    - Retry/recovery that neither loops forever nor masks a genuinely failing task.
    - Cost-budget accounting from partial OpenRouter usage data with no separate telemetry.
  recommended_scope_change: null
