product: io-harness
version: 0.57.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
release_fit:
  assessment: probable
  reasons:
    - >
      Both halves are local. The selection half is a sort and a set intersection at one
      crate-internal choke point (`recall_scopes`) that both run loops already pass through; the
      duplicate half is one read method and one branch in a tool arm that already exists.
    - >
      No schema change of any kind. The aggregate this release needs is served by
      `memory_recalls_entry`, added in 0.56.0, so the release that would have had to design the
      index already shipped.
    - >
      The test surfaces exist. `tests/memory_scope.rs` (0.56.0) already owns the `remember` arm and
      the two scopes, and `src/context.rs`'s unit tests already own `render_notes`.
    - >
      No live provider call is required by any criterion, so the release's cost does not scale with
      a vendor.
  major_cost_drivers:
    - >
      F5 is a byte equality, not a set assertion. It forbids the obvious implementation — sort the
      slice and render it — and requires selection and printing to be separated inside
      `render_notes`.
    - >
      `MemoryEntry` carries no row `id`, so the clock tail exists only as the order SQL delivered.
      The sort must be stable and nothing may reorder the slice before it.
    - |
      Two recall call sites plus the sub-agent path, which is where 0.56.0's equivalent cost landed.
  recommended_scope_change: null
