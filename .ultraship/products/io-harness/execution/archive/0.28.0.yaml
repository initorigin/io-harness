product: io-harness
version: 0.28.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
constraints:
  time: A metered 5-hour usage window the owner is watching
  budget: At most two concurrent subagents, no speculative research, no full-suite reruns beyond the gates
  capacity: null
  source: user-estimate
release_fit:
  assessment: probable
  reasons:
    - >
      Neither feature invents a mechanism. Hooks are a projection onto `Observer`, which has existed
      since 0.12.0 and already carries a `Flow` return that can cancel a run, so nothing in any of
      the three run loops changes. Rewind is a projection onto a read the write path already
      performs to measure an edit, so it costs a row rather than a second pass over the file.
    - >
      The owner's recorded constraint is a metered 5-hour usage window with at most two concurrent
      subagents and no speculative research — the user's own estimate of the budget, not anything
      this framework measured. The work fits it because every criterion is locally verifiable on
      macOS: there is no live provider run to pay for, no third machine to wait on, and the gates
      are `cargo test` and `cargo test --all-features --lib --tests`, which is what CI runs.
    - >
      The expensive failure mode of this repository — discovering a documentation or public-surface
      drift after the merge — is caught before the PR by `tests/config.rs`, `tests/public_api.rs`,
      `tests/guide_pages.rs`, `tests/readme.rs` and `tests/changelog.rs`, all of which already fail
      on the omissions this release could make.
  major_cost_drivers:
    - >
      Spawning and bounding a child process from inside a synchronous trait method that is called
      from an async run loop, on three platforms, without reaching for `tokio` or a timer crate. The
      riskiest ten lines in the release, and the reason the contract writes Trigger B against them
      specifically.
    - >
      Replacing the pre-write read at `src/run.rs:5229-5236` without moving a single existing line
      count. It is on the hot path of every edit and its current form loses the distinction between
      an absent file and an unreadable one, which is harmless for a count and data loss for a
      rewind.
    - >
      A new guide page has to be wired into four places or two tests fail, and `docs/CONTRACT.md`
      needs editing from the source rather than from the contract — the defect class that has
      recurred as OP2 in each of the last three releases.
  recommended_scope_change: null
