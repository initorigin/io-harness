product: io-harness
version: 0.46.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
release_fit:
  assessment: probable
  reasons:
    - >
      The mechanism already exists and is not being replaced. 0.40.0 built the backends, the
      workspace-root workdir, the caps and the selection ladder; this release routes a mode through
      them and changes which one a caller gets by default. No new backend, no new primitive.
    - >
      Both writable-root renderings have a place to go. The macOS profile already emits `(allow
      file-write* (subpath …))` after a deny-all (`src/sandbox/macos.rs:60`) and the Linux setup
      already loops binds read-write over a read-only tree (`src/sandbox/linux.rs:150`) — the change
      is a list where there are two fixed entries.
    - >
      The uncertainty is not in the design, it is in the blast radius. Flipping a default reaches
      every test in the suite that runs a command, and each failure has to be read as a decision
      rather than swept with a helper. That is the work this assessment is `probable` rather than
      `high` for.
  major_cost_drivers:
    - >
      Reading the first all-green's failures one at a time, because a test that now fails is usually
      the release working correctly.
    - >
      The cache-directory table, which is invisible when wrong — F4 is the discriminating test and
      is a real package-manager invocation, not a path assertion.
    - |
      `RunSpec`'s break across twelve construction sites, one of which is shipped documentation.
  recommended_scope_change: null
