product: io-harness
version: 0.32.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
release_fit:
  assessment: probable
  reasons:
    - >
      The surface is small and the shape is known: one field rename, one struct, one enum variant,
      one SQLite table and one function restructured. The release adds no dependency and no new
      subsystem.
    - >
      The two hard parts are both already solved elsewhere in this repository. FIFO admission is
      `tokio::sync::Semaphore`, which the `sync` feature already pulls in; a real-crash fixture is
      the pattern `examples/crash_fixture` and `examples/plan_gate_fixture` established, and the
      second one was written last release.
    - >
      The recorded constraint that decides the assessment is the standing "no new runtime
      dependency" limit — `cargo tree` reads 402 lines and a new dependency is a criterion failure
      rather than a trade-off. Nothing in this release needs one, so the constraint costs it
      nothing.
  major_cost_drivers:
    - >
      `spawn_child` in `src/run.rs` has to be restructured so admission sits between the
      spawn-or-adopt lookup and the child's first store write. Both branches share the new code and
      the fresh branch keeps its refusal path ahead of it.
    - >
      Proving restoration rather than re-derivation. The outcome assertion passes either way, so the
      discriminating assertion had to be designed before the code was, and the fixture exists to
      make the queue non-empty at the moment of the kill.
  recommended_scope_change: null
