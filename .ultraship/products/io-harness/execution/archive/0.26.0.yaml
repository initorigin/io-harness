product: io-harness
version: 0.26.0
tasks:
- id: US-IO-HARNESS-0.26.0-T01
  summary: 'windows-latest CI smoke test for AppContainer viability: create a profile, derive its SID,
    spawn a payload into it, print what happened and fail loudly on anything unexpected. Written and run
    before any other line of this release.'
  why_required: The whole release is conditional on this answer and no machine this work can reach runs
    Windows. Its result selects between the full scope and fallback_scope by the triggers the contract
    names.
  status: done
  depends_on: []
  acceptance_criteria:
  - 'F1 — an AppContainer can be created and entered on the CI runner, or this release learns that it
    cannot. A `windows-latest` job creates a profile, derives its SID, spawns a payload into it and reports
    the payload''s exit status and output. Proven by the job''s own output, not by a test that skips:
    a skipped test on the one platform this release is about is indistinguishable from a passing one,
    so the smoke test prints what it found and fails loudly on anything it did not expect. This criterion
    is the first work in the release and gates every other one; its failure is `fallback_scope` Trigger
    A, not a bug to grind on.

    '
  files:
  - src/sandbox/appcontainer.rs
  - src/sandbox.rs
  - Cargo.toml
  evidence:
  - '`src/sandbox/appcontainer.rs` — profile create/adopt/delete, SID derivation, the ACL grant, and the
    `CreateProcessW` spawn with a `PROC_THREAD_ATTRIBUTE_SECURITY_CAPABILITIES` attribute list.'
  - 'The smoke test lives in the module''s own `#[cfg(all(test, windows))]` block rather than in `tests/appcontainer.rs`,
    and needs no `ci.yml` change: `cargo test` already runs lib tests on `windows-latest`. The declared
    `files` list said otherwise and is corrected here.'
  - '`an_appcontainer_can_be_created_and_entered` passed on `windows-latest` first time, CI run 30665329090.
    Trigger A does not fire.'
  - Every Win32 signature was type-checked before any CI round trip, by compiling the module standalone
    against `x86_64-pc-windows-msvc`, so no runner time was spent on compile errors.
- id: US-IO-HARNESS-0.26.0-T02
  summary: 'The owned Windows spawn: CreateProcessW with a STARTUPINFOEXW carrying PROC_THREAD_ATTRIBUTE_SECURITY_CAPABILITIES,
    plus inheritable pipes, draining, kill-on-drop, exit collection and the wall-clock cap re-implemented
    for this backend only.'
  why_required: tokio::process::Command cannot carry an attribute list on stable Rust, and that attribute
    is the only route a container SID has to a child. Without owning the spawn there is no AppContainer
    at all.
  status: done
  depends_on:
  - US-IO-HARNESS-0.26.0-T01
  acceptance_criteria:
  - 'F4 — the owned spawn keeps every guarantee the shared runner gives. The AppContainer backend''s own
    `CreateProcessW` path collects stdout and stderr, reports the real exit code, enforces the wall-clock
    cap, and leaves nothing running when the run ends — each asserted separately against the backend,
    because these are five re-implementations of code that already worked and the way this feature fails
    is that one of them quietly does not. The negative control for the wall clock is a payload that finishes
    inside the ceiling and must report its own exit code rather than a `Cap::Wall`.

    '
  files:
  - src/sandbox/appcontainer.rs
  evidence:
  - 'The owned spawn: inheritable standard handles, output collection, the wall clock and kill-on-drop,
    all for this backend only. `run_capped_hooked` is untouched.'
  - '`the_wall_clock_kills_only_what_overruns` asserts both halves — a payload that overruns is capped,
    one that finishes reports its own exit code.'
  - Output goes to one temporary file rather than two pipes, which is smaller than the runner's mechanism
    and is the argument `tools/handles.rs` already makes. Recorded as a known limitation because the two
    streams then interleave.
- id: US-IO-HARNESS-0.26.0-T03
  summary: 'The boundary itself: an empty capability array, and explicit ACEs on the container SID for
    the named grant set. Proven by a refused read and a refused socket, each against a negative control
    that must succeed outside the container.'
  why_required: This is the release's claim. A container that is created but grants everything is the
    0.9.1 defect again in a worse place, which is why every criterion here carries its negative control.
  status: done
  depends_on:
  - US-IO-HARNESS-0.26.0-T02
  acceptance_criteria:
  - 'F2 — a payload inside an AppContainer cannot read what it was not granted. A file outside the granted
    set is opened by a payload inside the container and the open is refused. **The negative control is
    what makes it a criterion:** the identical payload, identical path, spawned *without* the AppContainer
    must open the file successfully. A refusal that would also have been a refusal outside the container
    — a path that does not exist, a file the operator themselves cannot read — proves nothing about the
    boundary, and this is the exact shape 0.9.1 was paid to learn.

    '
  - 'F3 — a payload inside an AppContainer has no route off the machine. A payload inside the container
    attempts an outbound connection and fails, and the identical payload spawned without the container
    succeeds against the same address. Asserted against a socket the payload opens itself, never against
    the proxy-env strip at `src/sandbox.rs:646-659`, which is documented best-effort and which a payload
    that does not read those variables ignores completely. The capability array is empty and the failure
    is the token''s, not a filter''s.

    '
  files:
  - src/sandbox/appcontainer.rs
  - tests/appcontainer.rs
  evidence:
  - '`a_payload_cannot_read_what_it_was_not_granted` and `a_payload_has_no_route_off_the_machine`, each
    asserting its negative control first: the identical payload outside the container must succeed, or
    the test refuses to conclude.'
  - The capability array is empty, so the network denial is the token's own rather than a filter's.
  - 'Found in passing: an AppContainer refuses loopback as well as egress. Stronger than the criterion
    asked for, and discovered by a test failing for the right reason.'
  - '`a_binary_nothing_blessed_runs_once_its_own_directory_is_granted` passed — the grant mechanism scales
    to real binaries; only enumerating which paths to grant does not. That is the finding behind `US-IO-HARNESS-0.26.0-I02`.'
- id: US-IO-HARNESS-0.26.0-T04
  summary: 'Route a Windows handle''s spawn through a per-handle Job Object with KILL_ON_JOB_CLOSE: each
    stage spawned CREATE_SUSPENDED, assigned, resumed; the job handle held by the registry record so Handles::kill
    closes it. Reuses Job::create/adopt/resume rather than copying them.'
  why_required: It closes US-IO-HARNESS-0.25.0-I01 and a stated known limitation of 0.25.0, and it is
    in the full scope and in both fallbacks because it depends on AppContainer for nothing.
  status: done
  depends_on: []
  acceptance_criteria:
  - 'F5 — killing a process handle on Windows reaches a grandchild whose parent has already exited. The
    fixture is the shape the tool exists for: a command spawns a child which spawns a grandchild, the
    middle process exits, and the handle is killed. All three are gone afterwards, asserted against the
    operating system rather than against the registry''s own bookkeeping — the distinction 0.25.0 paid
    for. **The negative control is the same fixture killed by `taskkill /F /T /PID` alone**, the mechanism
    `src/sandbox.rs:988` uses, which walks parent/child links and must leave the grandchild running. Without
    that control the test passes on any kill that happens to work. *(0.25.0''s F2 Windows clause, withdrawn
    by `US-IO-HARNESS-0.25.0-I01`, carried here.)*

    '
  - 'F6 — the Job Object reaches the handle path by reuse, not by a second implementation. The per-handle
    job is `Job::create`/`Job::adopt`/`resume` from `src/sandbox/windows.rs:249`, `:308` and `:441`, made
    visible outside `mod job` rather than copied, and the `CREATE_SUSPENDED`-assign- resume ordering is
    the one that module already argues for at `:35-47`. Proven by there being one definition: a grep for
    `AssignProcessToJobObject` finds exactly one call site in the crate.

    '
  files:
  - src/sandbox/windows.rs
  - src/sandbox.rs
  - src/tools/shell.rs
  - src/tools/handles.rs
  - tests/handles.rs
  - examples/orphan.rs
  evidence:
  - '`Job::for_handle` added beside the existing `Job::create`; `Job::adopt` and `mod job` made `pub(crate)`.
    Exactly one `AssignProcessToJobObject` in the crate (F6).'
  - '`Capture::on_spawn` now takes `&tokio::process::Child` and returns `Result` — the interface change
    `US-IO-HARNESS-0.25.0-I01` named as the blocker.'
  - '`Containment` type alias keeps `Record` the same shape on every platform: `Option<Arc<Job>>` on Windows,
    `()` elsewhere. `Handles::kill` takes it out of the record and drops it, so closing the job is a line
    someone can point at.'
  - A job that cannot be created refuses the start rather than running the line uncontained, matching
    what `own_process_group` already does on unix.
  - '`killing_a_handle_kills_a_grandchild_whose_parent_already_exited` passes on Windows, with `without_a_job_object_taskkill_leaves_the_grandchild`
    as the control showing `taskkill /F /T` leaves it alive.'
  - '`examples/orphan.rs` gained a Windows half: it cannot watch for reparenting because Windows does
    not reparent, so the leaf waits for the middle to leave the process table.'
- id: US-IO-HARNESS-0.26.0-T05
  summary: 'Prove the unix guarantee is untouched: the existing handle, shell and sandbox suites pass
    unchanged on macOS and Linux, and own_process_group is not edited.'
  why_required: The Windows work reaches src/tools/shell.rs and src/sandbox.rs, which both compile on
    every platform. The way a platform release breaks the other two is by editing something inside a cfg
    that turns out not to be one.
  status: done
  depends_on:
  - US-IO-HARNESS-0.26.0-T04
  acceptance_criteria:
  - 'F7 — the unix guarantee is untouched. Every existing handle, shell and sandbox test passes unchanged
    on macOS and Linux, and the process-group path (`src/sandbox.rs:909`) is not edited. This is a criterion
    rather than an assumption because the Windows work reaches shared files — `src/tools/shell.rs` and
    `src/sandbox.rs` both — and the way a platform release breaks the other two is by editing something
    inside a `cfg` that turns out not to be one.

    '
  - 'NF1 — the full suite passes on macOS, Linux and Windows, with no test skipped, ignored or made conditional
    to get there. The standing exception is `skills::discovery_over_a_32_skill_directory_is_under_50ms`,
    a known wall-clock assertion that fails intermittently on the Windows runner under load and is re-run
    rather than investigated.

    '
  files:
  - src/sandbox.rs
  - src/tools/shell.rs
  evidence:
  - '`test (macos-latest)` and `test (ubuntu-latest)` green in CI run 30666016135; `own_process_group`
    unedited.'
  - '`cargo test` and `cargo test --all-features --lib --tests` both exit 0 on macOS.'
- id: US-IO-HARNESS-0.26.0-T06
  summary: Correct docs/CONTRACT.md's tree-kill limitation and docs/guide/command-execution.md's copy
    of it, and change README.md's platform row only if the release made it true.
  why_required: The contract under-claims a boundary the code already ships on unix, which is 0.25.0's
    OP2 defect class recurring. A doc a consumer cannot trust is the same failure whichever direction
    it errs in.
  status: done
  depends_on:
  - US-IO-HARNESS-0.26.0-T03
  - US-IO-HARNESS-0.26.0-T04
  acceptance_criteria:
  - 'OP2 — `docs/CONTRACT.md`''s tree-kill limitation is corrected to say what the code does: closed on
    unix by process groups, and on Windows either closed by the Job Object (full scope) or still open
    (never, under any fallback — F5 is in both). Checked by reading the file against `src/tools/shell.rs:1261-1264`
    and `src/tools/handles.rs:365`, not from memory. This is 0.25.0''s OP2 recurring, and it recurs because
    the class of defect is a doc that was written from the plan rather than from the code.

    '
  - 'OP3 — `README.md:257`''s platform table row changes **only if the release makes it true**. If Windows
    still lacks a default filesystem and network boundary — either fallback trigger — the row stays as
    it is. A table that describes the intent rather than the build is the defect 0.9.1 and 0.16.1 were
    both spent on, and this criterion exists to stop it recurring a third time.

    '
  files:
  - docs/CONTRACT.md
  - docs/guide/command-execution.md
  - docs/guide/sandbox.md
  - README.md
  - src/lib.rs
  - src/tools/handles.rs
  evidence:
  - '`docs/CONTRACT.md` and `docs/guide/command-execution.md` corrected: tree kill on a handle is a guarantee
    with a mechanism per platform, not best-effort everywhere. The unix half had been closed since 0.25.0
    and both files under-claimed it.'
  - '`src/tools/handles.rs` module rustdoc corrected in the other direction — it described a process group
    with no platform caveat, on a platform that has none.'
  - '`README.md:257`''s platform row deliberately unchanged, per OP3: AppContainer is not the default,
    so the row is still true.'
- id: US-IO-HARNESS-0.26.0-T07
  summary: 'Ship the rest of the documentation in this release: CHANGELOG.md''s 0.26.0 section with a
    migration note per break, docs/public-api.txt hand-edited in sorted position for any new crate-root
    re-export, and the crate rustdoc.'
  why_required: Docs ship in the release that changes the code, never after it. tests/changelog.rs, tests/public_api.rs
    and tests/docs_drift.rs each fail the build otherwise.
  status: done
  depends_on:
  - US-IO-HARNESS-0.26.0-T06
  acceptance_criteria:
  - 'NF2 — **the dependency tree does not move on macOS or Linux.** `cargo tree` on the default feature
    set reads 402 lines after this release as before it. Windows may gain `windows-sys` *features* — they
    are compiled code, not tree lines — and any addition goes under `[target.''cfg(windows)''.dependencies]`
    at `Cargo.toml:173-174` where the existing five already live. No new crate on any platform.

    '
  - 'NF4 — `cargo doc` is warning-free, docs.rs builds with all features, and `cargo clippy --all-targets
    -- -D warnings` is clean, on every platform the matrix runs.

    '
  files:
  - CHANGELOG.md
  - docs/public-api.txt
  - src/lib.rs
  - Cargo.toml
  evidence:
  - '`CHANGELOG.md` 0.26.0 section with an unlabelled opening paragraph and the house category order.
    No entry carries the `**BREAKING` marker: `Backend` is already `#[non_exhaustive]`, so a new variant
    would have been additive, and in the end none was added.'
  - '`docs/public-api.txt` needs no edit — this release adds no crate-root re-export. `tests/public_api.rs`,
    `tests/docs_drift.rs`, `tests/changelog.rs`, `tests/readme.rs` and `tests/guide_pages.rs` all pass.'
  - Crate rustdoc in `src/lib.rs` updated to say what AppContainer is and what it is not the default of.
- id: US-IO-HARNESS-0.26.0-T08
  summary: 'Record the smoke test''s finding as evidence whichever way it went, then the release gates:
    cargo package --locked with the tarball listed rather than trusted, and the MSRV re-checked by hand.'
  why_required: A release that learned AppContainer is not viable on the runner learned something worth
    keeping, and it must survive in the record rather than only in a decision. The package and MSRV gates
    are what the release workflow runs anyway.
  status: done
  depends_on:
  - US-IO-HARNESS-0.26.0-T07
  acceptance_criteria:
  - 'OP1 — the smoke test''s finding is recorded as evidence whichever way it goes, in `evidence/0.26.0/`.
    A release that discovered AppContainer is not viable on the runner has learnt something worth more
    than a release that shipped it, and the finding must survive in the record rather than only in a decision.

    '
  - 'OP4 — `cargo package --locked` exits 0 and the tarball carries no `.env`, no `.ultraship` and no
    `.github`, verified by listing rather than assumed from the `exclude` list at `Cargo.toml:47-54`.

    '
  - 'OP5 — MSRV re-checked and stated. No new dependency is expected to move it; it is checked rather
    than assumed, which is the lesson 0.23.0 paid for.

    '
  - 'NF3 — every `unsafe` block added carries a `// SAFETY:` comment naming why the call is sound, in
    the style the existing Win32 code already holds itself to (`src/sandbox/windows.rs:253`, `:286`, `:318`).
    This release adds more unsafe than any before it, and the comment is the only review surface a reader
    on another platform has.

    '
  files:
  - .ultraship/products/io-harness/evidence
  evidence:
  - '`US-IO-HARNESS-0.26.0-I02` records the finding and its evidence.'
  - '`cargo package --locked` and the MSRV check recorded in the release record.'
