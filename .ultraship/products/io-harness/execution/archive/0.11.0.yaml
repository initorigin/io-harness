product: io-harness
version: 0.11.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
release_fit:
  assessment: probable
  reasons:
    - >
      The user's stated capacity for this session is three releases — 0.10.0, 0.11.0 and 0.12.0 —
      with the instruction to parallelise across subagents and commit constantly. That is a
      user-estimate, not anything measured here. 0.10.0 shipped and published within it, which is
      the only real datum: a release of this shape fits, and the risk is scope discipline rather
      than scope size.
    - >
      Most of this release is correcting defects the audit found rather than inventing features. A
      missing request timeout, a swallowed malformed stream, an unmapped `"escalated"` outcome and
      an unclassified error enum are all small, local changes with obvious right answers — the work
      is in the breadth of the error reshape, not its difficulty.
    - >
      Fallback needs no new architecture. `Provider` is a two-method trait, and a combinator that
      implements it composes with every existing `<P: Provider>` entry point unchanged. The 0.9.0
      `Tool` trait set the precedent for settling a signature against real implementations first.
    - >
      The stall fixture is not invented. The 0.10.0 live evidence records the exact failure twice —
      sixteen turns re-reading four files, ending in `StepCapReached` — so the detection threshold
      can be tuned against a real transcript rather than a guess.
    - >
      The suite is dense where this release is dangerous: 271 tests, with `tests/edit_file.rs`
      already covering retry and escalation and `tests/net.rs` already standing up real servers,
      which is the pattern the stalling-socket fixture needs.
    - >
      0.10.0's own trace surface is reusable. `context_events` and the `ContextEvent::of`
      constructor already exist for exactly this kind of per-step decision row, so the resilience
      rows are new kinds rather than new machinery.
  major_cost_drivers:
    - >
      The `Error::Provider` reshape is wide: every construction site in three providers, and every
      match across the crate and 14 test files. Mechanical, but it is the change most likely to
      produce a long tail of compile errors — and the risk register says the design must be settled
      before the compiler starts leading.
    - >
      Timing-sensitive tests. A backoff lower bound and a deadline upper bound both measure
      wall-clock and both have to hold on a loaded Windows runner. The mitigation is few of them
      with wide margins, which costs judgement rather than code.
    - >
      A real stalling-socket fixture is new test-harness code. `tests/net.rs` and
      `examples/mcp_fixture_server.rs` are precedent, but neither stalls on purpose.
    - >
      The stall signal is a judgement call in the way 0.10.0's compaction rules were: too eager and
      it interrupts a legitimate exploration phase, which would be a regression on healthy runs.
    - |
      Two live runs for the evidence, plus a live provider for each.
  recommended_scope_change: null
