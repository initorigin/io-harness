product: io-harness
version: 0.16.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
constraints:
  time: >
    Continuing the session that shipped 0.15.0. The owner's standing direction is "commit
    constantly, be token-efficient", and the 2026-07-26 override stands: PRs, merges, the GitHub
    Release and `cargo publish` proceed without a stop, and engineering decisions are made and
    stated rather than routed back as questions. The owner has already exercised scope control on
    this release twice — cutting the task-list archiving idea and confirming the archive keeps its
    pre-0.14.0 plan-only structure — so scope refinements are theirs to make and mine to record.
  budget: null
  capacity: >
    Subagents for parallel work on disjoint files, main thread token-efficient. This release
    parallelises better than any before it: a dozen guide pages are a dozen files with no shared
    state, and the worked-example sweep partitions cleanly by module. Both figures below are the
    owner's own estimates, not anything measured here.
  source: user-estimate
release_fit:
  assessment: high
  reasons:
    - >
      Recorded constraint: subagents for disjoint files, token-efficient main thread. This release
      is the best fit for that constraint the roadmap has produced. The guide pages are one file per
      capability, each sourced from one contiguous README section, sharing no state and touching no
      code. The worked-example sweep partitions by module the same way. Only the four checkers are
      sequential work, and they are small.
    - >
      Recorded constraint: disk hot, `target` regrows to roughly 38GB and a full gate run leaves
      under 5GB free. This release adds no dependency in any build — default or featured — so the
      compile cost is exactly 0.15.0's. The only new build work is `cargo doc --all-features` and
      `cargo test --doc --all-features`, which reuse the same artifacts the gate already produces.
      `target` is deleted between phases and `df` checked, per the owner's instruction.
    - >
      The risk profile is the lowest of any release so far. Prose cannot break a consumer's build.
      The single code change is an additive function alongside three existing siblings that already
      do the same thing for the other two loops, so it has a working template
      (`resume_from_stored_policy`) rather than a design problem.
    - >
      The subject matter needs no research. Every fact the documentation states is already in the
      repository — in the code, the fifteen sealed release records, or the existing README. This is
      the rare release where being wrong is a reading failure, not a knowledge gap, and reading is
      cheap.
  major_cost_drivers:
    - >
      Volume, and only volume. 1072 lines of README plus 230 of crate documentation are rewritten
      and redistributed, and roughly seventy public items each need an example that compiles. There
      is no hard problem in any of it; there is a great deal of it, and it is the kind of work that
      degrades quietly when rushed rather than failing loudly.
    - >
      The changelog break audit. Fifteen releases have to be read for contract breaks that were
      never labelled as breaks, because the checker can only be honest about an explicit marker. The
      audit is the task most likely to find something the contract did not anticipate.
    - >
      Four checkers that must be capable of failing. A checker that silently matches nothing passes
      every input and is worse than no checker, because it reports a green claim. Each one costs a
      negative-control fixture, and the fixtures are the part that is easy to skip.
    - >
      The examples are the release's quiet failure mode. Seventy examples that compile and teach
      nothing would pass every check and deliver none of the value. No checker can measure this;
      only review can.
  recommended_scope_change: null
