product: io-harness
version: 0.16.2
execution_state: DEVELOPING
checkpoint: null
blockers: []
constraints:
  time: >
    The owner reported the docs.rs failure directly and asked for it to be fixed from here, then set
    the flow to run the whole UltraShip cycle from plan to complete without a stop. They also
    instructed that CI is not waited on for this release, on the stated grounds that the change is
    minimal and the matrix will be green. The 2026-07-26 override stands: PRs, merges, the GitHub
    Release and `cargo publish` proceed without an approval gate.
  budget: null
  capacity: >
    Main thread, no subagents. The release is one attribute line, a version bump and a CHANGELOG
    entry; the verification is two invocations of the same nightly command. Parallelising it would
    cost more coordination than the work contains. This is the owner's own framing of the change as
    minimal, not a measurement.
  source: user-estimate
release_fit:
  assessment: high
  reasons:
    - >
      Recorded constraint: the owner called this a minimal change and waived the CI wait on that
      basis. The contract agrees — one attribute inside `cfg_attr(docsrs, ...)`, no public item, no
      behaviour, no dependency, no schema. There is nothing for the three-OS matrix to disagree
      about, because no configuration CI builds ever reaches the line.
    - >
      The failure is exactly diagnosed rather than suspected. The docs.rs build log names the file,
      the line, the removed feature, the release that removed it and the upstream PR that merged it
      into `doc_cfg`. Nothing about the fix has to be discovered.
    - >
      The check that proves the fix is reproducible off the builder: nightly `cargo doc` with
      `RUSTDOCFLAGS="--cfg docsrs"` is the docs.rs invocation, and it fails on the pre-fix tree and
      passes on the post-fix one, so the gate discriminates.
    - |
      The publication path is the one 0.16.1 used the same day and is known good.
  major_cost_drivers:
    - >
      Verifying against the configuration that actually failed. Every ordinary command in this
      repository passes on the broken tree — that is why two releases shipped with it — so a fix
      confirmed by stable `cargo doc` would be confirmed by the command that missed the defect
      twice. The nightly `docsrs` reproduction is the release; the rest is a version bump.
    - >
      Confirming `doc_cfg` still performs the automatic labelling after the merge, rather than
      assuming a rename is sufficient. Checked by reading feature labels out of the rendered HTML,
      not by the build exiting 0.
  recommended_scope_change: null
