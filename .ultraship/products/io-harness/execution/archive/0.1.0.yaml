product: io-harness
version: 0.1.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
release_fit:
  assessment: probable
  reasons:
    - One vertical path — task contract, loop, OpenRouter, filesystem tool, verify, stop, rusqlite —
      with no horizontal layering.
    - Rust toolchain present (cargo 1.95); fresh repo with no legacy code to fight.
    - fallback_scope drops rusqlite persistence and publish polish if effort runs short and still
      ships a verified loop.
    - No user time or budget constraints recorded, so fit is judged on scope alone.
  major_cost_drivers:
    - Hand-parsing the OpenRouter SSE stream and tool-call framing without a vendor SDK.
    - A provider-agnostic public API that must survive Anthropic and OpenAI arriving in 0.3.0.
  recommended_scope_change: null
