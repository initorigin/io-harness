product: io-harness
version: 0.52.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
release_fit:
  assessment: probable
  reasons:
    - >
      **No constraints are recorded for this workspace.** `ultraship constraints` reports none — it
      refuses to record any while there is no active release — so this assessment is grounded in the
      repository's own condition, in the release contract's own stated constraints, and in the
      twenty-one releases of measured history behind it, never in a capacity figure, which UltraShip
      has no telemetry to supply.
    - >
      The release adds a protocol, not an architecture. Every structural piece it needs already
      exists and is being reused rather than re-invented: `McpSession` is the session shape,
      `authorize_spawn` is the `Act::Exec` gate, `src/diff.rs` is the patch renderer 0.51.0 built,
      and `diagnostics::Outcome` is the four-state vocabulary. The genuinely new code is one file.
    - >
      The recorded constraint that shapes it most is `no new runtime dependency` — `cargo tree` flat
      at 402 — which forces the framing, the JSON-RPC envelope and six request bodies to be written
      here. That is a few hundred lines of `serde_json` over transport the crate already spawns, and
      it is bounded work rather than uncertain work.
    - >
      The second recorded constraint, `no durable state`, removes the whole class of risk the last
      several releases carried: no DDL, no migration, no cross-version case that does not already
      exist. `git diff main -- src/state.rs` being empty is a criterion rather than a hope.
    - >
      Verification does not depend on an installed language server. The client is written over
      `AsyncRead + AsyncWrite`, so the protocol is driven over `tokio::io::duplex` by a fixture
      server this repository writes and can make misbehave — which is both faster than a real server
      and strictly more discriminating than one.
  major_cost_drivers:
    - >
      The fixture server is real work and is written before the client: it must answer out of order,
      interleave notifications, omit a capability, hang a handshake and record the document text it
      was last sent.
    - >
      Threading a second session through the nine run entry points that already carry `McpSession`,
      where the failure mode is a call site that connects and does not shut down.
    - >
      Rendering a `WorkspaceEdit`'s ranges as a patch series that actually applies through
      `patch_file`, rather than one that merely looks like a patch.
    - >
      Conditional tool registration touches the composed prompt, which several existing suites
      assert byte-identically. That is where the suite will fail first.
  recommended_scope_change: null
