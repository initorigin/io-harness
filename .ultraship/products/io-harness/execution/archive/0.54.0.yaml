product: io-harness
version: 0.54.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
release_fit:
  assessment: probable
  reasons:
    - >
      The concurrent execution machinery already exists and does not move. 0.41.0 built `ReadWork`
      (`src/run.rs:8963`) and `ReadWork::run` (`src/run.rs:8987`) with no `Store`, no `Watch` and no
      run-scoped mutable state, explicitly so read-only work could cross a task boundary. This
      release starts the same futures earlier; it does not write a second executor.
    - >
      The premise was verified in the source before the contract was written rather than assumed
      from the roadmap, so the trait change, the `Record`/`Replay` consequence, the session-only
      scope and the `agent_loop` divergence are all in the contract instead of waiting to surprise
      the implementation. That is the discovery cost this release will not pay.
    - >
      The test technique is established rather than invented. `tests/parallel_reads.rs` already
      proves concurrency with a rendezvous and a bounded failure instead of a clock, which is
      exactly the shape F1 and F2 need, and the standing constraint "never gate CI on a clock" is
      what forces it.
    - >
      The recorded constraint that shapes the design most is **no new runtime dependency, `cargo
      tree` flat at 402**. It is satisfied by construction here: the whole release is `serde_json`
      and `tokio`, both already present, so there is no dependency argument to have.
  major_cost_drivers:
    - >
      The seam between the provider's future — which is not `Send` (`src/provider/mod.rs:1297-1302`)
      — and the run loop's own task, where `Watch` and `Store` live because both are `!Sync`. The
      second sink takes the same `mpsc` route the token sink already takes, but the work it starts
      must be spawned on the loop's side of that channel.
    - >
      Splitting `prepare_read` (`src/run.rs:9092`) so target resolution can happen early while
      gating and recording stay serial, without the speculative path reaching a wider `Policy`
      answer than the serial gate will reach.
    - >
      The scripted providers: one that emits arguments in chosen fragments, one that holds the
      stream open on a barrier, one that fails after emitting complete calls, and one that settles a
      response deliberately disagreeing with what it streamed. None of the existing test doubles can
      do this.
    - >
      The byte-identity assertions (F3, F8, F9), which is where the suite failed first in 0.53.0 and
      where any incidental event or ordering change will surface.
  recommended_scope_change: null
