product: io-harness
version: 0.9.0
execution_state: DEVELOPING
checkpoint: 2026-07-26T00-00-00Z-io-harness-0.9.0.yaml
blockers: []
constraints:
  time: >
    One working session, continuous. The owner asked for the harness to be built out without
    stopping between stages, so 0.9.0 is expected to reach a publishable state in this session
    rather than across several.
  budget: null
  capacity: >
    0.9.0 is the first of four consecutive pillar releases (0.9.0 tool layer, 0.10.0 context and
    memory, 0.11.0 resilience, 0.12.0 observability and evaluation) the owner asked for in one
    stretch. Sprawl here is paid for out of the other three, so this release keeps to its stated
    scope and defers anything that grows it.
  source: user-estimate
release_fit:
  assessment: high
  reasons:
    - >
      The extension point already exists and only needs a second implementation. MCP tools reach the
      model, get an Act::Exec policy check on their name, dispatch through one arm of `dispatch`
      (src/run.rs:1439), and land in the observations. An in-process tool is the same path with a
      different callee — the design work is choosing an object-safe trait shape, not inventing a
      mechanism.
    - >
      No public function signature moves. Registration goes on `TaskContract` beside `with_mcp`, so
      the six run entry points (`run_with`, `run_tree`, `resume`, `resume_tree`, and the two
      `*_with_decision` variants) keep their signatures and NF2 costs nothing to hold.
    - >
      The offline test route is proven. tests/subagents.rs already drives the whole loop with a
      scripted mock provider, including trees and children; F1–F10 are written against that same
      harness with no new infrastructure.
    - >
      Against the recorded capacity constraint above — 0.9.0 as one of four consecutive releases —
      the scope is the smallest of the four and the contract already excludes the two things that
      would grow it (observation-accumulation changes, harness-side skill selection), both of which
      belong to 0.10.0.
  major_cost_drivers:
    - >
      Threading the toolbox through every `Tree` construction site consistently. A resume path that
      silently drops it is a correctness bug that only appears after a crash, so the resume tests
      have to cover it rather than the happy path alone.
    - >
      Settling the object-safe `Tool` signature. `Provider` is generic over `impl Future` and cannot
      be a trait object; `Tool` must be one, and the boxed-future shape has to work for a
      synchronous closure, a stateful async tool, and an erroring tool before it is threaded
      anywhere.
    - >
      Designing F11's negative control so it fails for the intended reason. A task that is
      unsolvable without the tool and the skill, and solvable with them, is the fiddly part of the
      release's headline evidence.
    - >
      The frontmatter reader's edge cases — absent, unterminated, CRLF, multi-line description — are
      each a test, and there is no YAML dependency to lean on because NF1 forbids adding one.
  recommended_scope_change: null
