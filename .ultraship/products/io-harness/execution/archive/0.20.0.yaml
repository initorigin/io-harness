product: io-harness
version: 0.20.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
release_fit:
  assessment: probable
  reasons:
    - >
      The release adds a layer over machinery that already exists and is tested. A turn is a run, so
      durability, budgets, the policy boundary, the sandbox, checkpointing and resume are inherited
      rather than rebuilt — the same reason 0.19.0's config layer was medium rather than large.
    - >
      Two of the three capabilities have an existing seam to hang off. Streaming rides the
      providers' SSE accumulators, which already see each typed delta; interruption rides the
      `Flow::Cancel` path, which already stops a run at a step boundary and keeps it resumable.
    - >
      The uncertainty is concentrated in one file. `src/run.rs` is 6,014 lines with three loops in
      it, and the session seam has to enter exactly one of them. That is where the estimate could be
      wrong.
    - >
      No recorded user constraint exists for this release — `ultraship constraints` reports none,
      and the owner's standing directive is to run the flow end to end without stopping for
      approval. The assessment is therefore grounded in repository condition rather than in a stated
      time or budget limit, and it is qualitative because the framework measures neither.
  major_cost_drivers:
    - Threading a conversation into the context assembler without giving the assembler a second
      compaction rule
    - A `&dyn Fn` token sink crossing an async trait boundary into three provider implementations
      while staying `Send`
    - Fitting a steer read into the one step-boundary that already holds the commit transaction, the
      checkpoint, the stall window and the cancel check
    - A worked example per new public item, each needing a store and a provider to compile
  recommended_scope_change: null
