product: io-harness
version: 0.8.1
execution_state: DEVELOPING
checkpoint: null
blockers:
  - >
    OWNER APPROVAL — the git Release and `cargo publish` to crates.io (target_mode: published) are
    owner-gated and NOT done during develop. Publishing is public and irreversible. Handled at
    /ultraship:complete, after the feat→develop and develop→main PRs the owner merges by hand.
  - >
    DEFERRED LIVE RUN (not a defect) — F7 needs a real provider and real spend, so the live run
    executes at /ultraship:complete, exactly as 0.6.0, 0.7.0, and 0.8.0 did. It is the only
    acceptance criterion expected to be unmet at the end of develop.
  - >
    OWNER DECISION PENDING — the contract's second open question asks whether
    `Verification::describe` keeps rendering the criterion verbatim into the model's prompt. Develop
    proceeds on the proposed answer (yes, unchanged: hiding the gate makes honest agents worse and
    does not stop a determined one, which is why the defense belongs at the compile boundary). No
    code depends on the alternative, so a different decision costs a one-line change — but it is the
    owner's call and is not being taken silently.
  - >
    RESOLVED by US-IO-HARNESS-0.8.1-I01, owner-approved 2026-07-25 — the two scope observations
    raised during develop are now contract truth, not loose findings. The crate-level-attribute
    vector against the execution gates became F8 (already delivered by the two-crate fix, now
    named), and the falsified prediction about `CompilesRust`/`EachCompilesRust` became F9, with the
    fix folded into 0.8.1 rather than documented as a limitation. T06 is reopened to implement it.
    Kept here as the audit trail: develop stopped and asked rather than widening its own scope.
release_fit:
  assessment: high
  reasons:
    - >
      The mechanism question the contract left open — the release's only real uncertainty, and the
      reason it was planned at `uncertainty: medium` — was answered before this assessment rather
      than assumed away. A spike against the harness's exact compile flags confirms the two-crate
      split (subject as its own crate, the criterion as a dependent crate reached through
      `--extern`, with the core/std prelude macros explicitly re-imported so they outrank the glob)
      fails the recorded bypass and still passes an honest implementation. What was uncertain at
      plan time is now measured.
    - >
      The contract's fallback_scope is not going to be needed, and that is the fit question that
      mattered. It exists for the case where isolation forces a caller-visible change to `test_src`
      — which would make an honest patch impossible. The spike shows it does not: `use subject::*;`
      keeps `hello()` unqualified in the criterion, so a 0.8.0 gate compiles and passes on 0.8.1
      untouched. F5 is reachable, so the release stays a patch and `WorkspaceTestPasses` stays in
      scope rather than being dropped to 0.9.0.
    - >
      The blast radius is one function. `compile_source` in src/verify.rs is the single place both
      execution gates compile anything; `passes_guarded` and `passes_in_guarded` both funnel into
      it. The change is to what that function writes into its temp dir and how many times it spawns
      rustc — not to the public API, the policy layer, the sandbox, the trace schema, or the loop.
    - >
      The spawn pattern the fix needs already exists and is already exercised. `ExecGuard::exec`
      runs each argv in the shared tempdir workdir, and the current flow already depends on one
      spawn's artifact persisting into the next (rustc builds the binary, then the binary runs). A
      third spawn in the same workdir is the established pattern, not a new capability, so NF1
      (staying inside the 0.6.0 sandbox) costs no design work.
    - >
      No recorded user constraints exist for this release — `ultraship state` reports no
      `active.constraints` and no blockers — so this assessment is grounded in repository condition
      and the spike rather than in time or budget limits the user supplied. If the user has limits
      in mind they have not been recorded, and none are being invented here.
    - >
      Regression coverage is dense where the change lands. Gate behaviour has been pinned by tests
      since 0.2.0 and the 0.8.0 suite runs 172 tests across 11 binaries, so a fix that quietly
      breaks an honest pass gets caught by tests that already exist rather than by a consumer.
  major_cost_drivers:
    - >
      Re-running and, where necessary, repairing the full 0.8.0 suite against a changed compile
      path. This is the bulk of the work by volume: the gate is load-bearing for tests written since
      0.2.0, so the change touches far more tests than lines.
    - >
      Getting the harness-authored test-crate preamble exactly right — the explicit core/std macro
      re-import has to outrank the glob without shadowing a macro the subject legitimately exports,
      and without emitting unused-import warnings into a criterion the caller wrote.
    - >
      Proving the property generally rather than for `assert`. F3 deliberately requires resistance
      to a macro the fix's author did not enumerate, which is what stops the cheap blocklist answer.
    - >
      Measuring the latency cost of the extra compiler invocation (NF5) on a gate that a 0.5.0
      fan-out multiplies.
  recommended_scope_change: null
