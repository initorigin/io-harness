product: io-harness
version: 0.56.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
release_fit:
  assessment: probable
  reasons:
    - No recorded constraints exist for this release — `ultraship constraints` reports none, so the
      assessment rests on the repository rather than on any figure the user gave.
    - "Every half lands in code this crate already owns: one SQL statement and one index in
      `src/state.rs`, one table in `src/config.rs` beside `[run]`, and two tool arms beside
      `remember` in `src/run.rs`."
    - "The plumbing has a working precedent from the release immediately before it: `max_read_chars`
      went from `io.toml` through `Config::apply_to` onto `TaskContract` and down to the dispatch
      site in 0.55.0, and `MemoryLimits` follows the same path."
    - No new dependency, no new table, no `CHECKPOINT_FORMAT` move, and `TaskContract` has been
      `#[non_exhaustive]` since 0.35.0, so the release carries no compile break.
  major_cost_drivers:
    - The eviction order is one statement that has to be right on five terms at once, and each
      plausible mistake produces a policy that looks reasonable and fails exactly the case the
      release exists for.
    - Both recall sites — the workspace loop and the sub-agent loop — must read both scopes, or the
      global scope works until an agent spawns a child.
    - Recall-history fixtures have to be built by inserting rows directly, because a real run
      produces them one step at a time and F5 needs ten thousand.
  recommended_scope_change: null
