product: io-harness
version: 0.4.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
release_fit:
  assessment: uncertain
  reasons:
    - No constraints are recorded for this release (ultraship constraints was empty at start), so
      this assessment is made against scope and repository condition only, not against any time or
      budget limit the user has stated.
    - The repository is in good condition and small (2270 lines across 13 source files), with an
      established test convention and a green 0.3.0 suite to regress against.
    - dispatch() at src/run.rs:281 is a single choke point every workspace tool call already routes
      through, so path enforcement and the approval gate have one natural home rather than four
      scattered ones.
    - "The scope is the largest yet planned for this product: 30 included items and 43 acceptance
      criteria, against 0.3.0 which was already assessed large. Several items (approve-with-changes,
      approve-and-remember, Defer/resume) each interact with the policy rather than sitting beside
      it."
    - Workspace::resolve at src/tools/workspace.rs:52 is lexical only and does not canonicalise, so
      the symlink and canonical-path criteria are genuinely new correctness work, not a small edit.
    - The contract records an explicit drop order if this runs long (approve-and-remember, then
      approve-with-changes, then Defer/resume). Reaching for it is an /ultraship:iterate decision,
      not a silent narrowing.
  major_cost_drivers:
    - Policy evaluation shared by enforcement, explain, and the trace — one function three callers
      depend on agreeing about, including which layer produced a decision.
    - "Path resolution correctness: canonicalisation plus the deny-matches-symlink-or-target rule,
      replacing the current lexical resolve."
    - Making dispatch() async so an approval can be awaited inside it, without disturbing the 0.3.0
      loop, budgets, retry, or resume behaviour.
    - Approve-with-changes re-evaluation and approve-and-remember as a run-scoped layer — both reach
      back into the policy, so the invariant deny-is-absolute must hold on every path, not just
      tested ones.
    - "Defer persistence fidelity: a resumed approval must perform exactly the action the human saw."
    - 43 acceptance criteria is itself a cost — each is a test that must be written and seen to pass.
  recommended_scope_change: null
