product: io-harness
version: 0.55.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
release_fit:
  assessment: probable
  reasons:
    - >
      Both halves are doorstep changes at points the crate already owns, not new machinery. The
      image door is one constructor beside `Media::image`, which already resolves an extension to a
      media type (`Media::media_type_for`) and already checks a byte ceiling. The read door is one
      classification in front of `Workspace::read_file`, whose whole body today is
      `std::fs::read_to_string(abs).unwrap_or_default()`.
    - >
      The premises were checked against the source before the contract was written rather than taken
      from the roadmap, and one was wrong: a binary read does not return mojibake, it returns an
      empty string, which is worse and changes what F6 has to assert. The other check found that
      `image` is already an optional dependency reached through `barcode`, which is what makes the
      whole image half satisfy the no-new-dependency constraint by construction instead of by
      argument.
    - >
      The recorded constraint that shapes the design most is **no new runtime dependency, `cargo
      tree` flat at 402**. It is what excludes a charset detector and an SVG rasteriser outright, so
      those are scope decisions already made rather than trade-offs to be relitigated during
      implementation.
    - >
      The fallback scope is real and already coherent. The read half alone — typed classification,
      whole-or-refused with a range, the assembly stub and the operator ceiling — carries both
      silent-wrong-answer defects and is the reason the version exists, so running short costs the
      image widening rather than the release.
  major_cost_drivers:
    - >
      The ceiling is derived in six places today — `src/session.rs:882`, `src/run.rs:4281`,
      `src/run.rs:4743`, `src/run.rs:7010`, `src/mcp.rs:748` and `src/context.rs:643` — and an
      operator ceiling that reaches some of them is a limit that moves depending on which path
      produced the read.
    - >
      `bound` (`src/context.rs:452`) is shared by every observation kind, so changing what
      `ObsKind::Read` does is a change to a function four other kinds depend on. The plausible
      mistake is applying the new rule to all of them, which is why F12 carries a negative half.
    - >
      The fixtures are real bytes that must genuinely be the format they claim: BMP, TIFF, ICO, TGA,
      PNM, HEIC, AVIF, SVG, a UTF-16LE/BE pair, a BOM-less UTF-16 file and a non-UTF-8 binary. A
      hand-written stub that fails to decode proves nothing.
    - >
      Every existing test that reads a file through the tool and asserts on the observation header
      is in the blast radius, and the ones asserting on a truncation marker have to change meaning
      rather than wording.
    - >
      The `media` feature's dependency tree changes while the default one must not, so the
      no-new-dependency evidence has to distinguish the two trees explicitly rather than quoting one
      number.
  recommended_scope_change: null
