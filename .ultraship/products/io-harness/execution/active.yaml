product: io-harness
version: 0.37.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
release_fit:
  assessment: probable
  reasons:
    - >
      The recorded constraint that decides the assessment is the standing "no new runtime
      dependency" limit — `cargo tree` reads 402 lines and a new dependency is a criterion failure
      rather than a trade-off. This release cannot violate it by construction: the classification
      reads a `CompletionResponse` the loop already holds in hand, and `Cargo.toml` receives only
      the version bump.
    - >
      The second recorded constraint, "a break is a minor bump and every version stays 0.x", is
      satisfied by the release type: one break is planned, stated, and paid for on a minor.
    - >
      The change is small where the file is large. `src/run.rs` is over 10,500 lines, but the
      classification is one branch taken directly after the first completion returns, in a place the
      loop already special-cases — `response.tool_calls.is_empty()` already pushes the
      `(no tool call)` observation, so the reply's text reaches `Session` through the same
      `last_message` read that serves every turn today. No new channel back from the loop is needed
      and no signature moves.
    - >
      Every absence F1 asserts is an absence of something written *after* the point the branch
      returns from — `commit_step`, the gate, the snapshot, the plan decision — so "a reply writes
      no step" is a property of where the branch sits rather than a set of suppressions that have to
      be kept in step with the loop's eleven exits.
    - >
      The scripted provider in `tests/session.rs` already counts the calls it served
      (`Mock::calls()`), which is F2's discriminating assertion. The counting sabotage this release
      most has to fear is therefore testable with scaffolding that already exists.
  major_cost_drivers:
    - >
      The system-prompt wording. Permitting an answer without weakening the instruction to do the
      work has no compile-time check and affects the first completion of every session turn, not
      only greetings. This is the one part of the release where the first attempt is expected to be
      wrong and where the evidence has to be live rather than scripted.
    - >
      Five negative controls designed before the code: F1's tool-calling arm, F2's re-ask sabotage,
      F3's ceiling arm, F5's no-verification arm, and F7's panicking approver.
    - >
      Three new public items across two surfaces: `docs/public-api.txt` edited by hand, a worked
      example each, and — for the event — the `EVENT_NAMES` entry, `every_kind()` and the
      source-reading census in `src/observe.rs`.
  recommended_scope_change: null
