product: io-harness
version: 0.40.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
release_fit:
  assessment: probable
  reasons:
    - >
      The workspace records no `constraints` (`ultraship state` reports `null`), so this assessment
      is grounded in the contract's own recorded `resource_profile.constraints` rather than in
      user-estimate figures — and it names no number the framework did not measure.
    - >
      The standing "no new runtime dependency" constraint cannot be violated by construction.
      `cargo tree` reads 402 lines; every isolation primitive this release needs — `SandboxConfig`,
      `SandboxLimits`, `RunSpec`, `select`, three native backends and the portable floor — already
      ships and is exercised by the verification gate. `Cargo.toml` receives only the version bump.
    - >
      The second recorded constraint, "two public names, no more; no change to the `Sandbox` trait,
      `RunSpec`, `SandboxConfig` or `SandboxLimits`; no new `EventKind`, table, column or index", is
      checkable before any code is written and stays checkable throughout: the diff of
      `docs/public-api.txt` is the assertion.
    - >
      The capability is not being built, it is being reached. What 0.40.0 adds is a second caller of
      a machine `src/verify.rs:826` has called since 0.6.0. That is why fit is `probable` rather
      than `uncertain` despite the contract recording `uncertainty: high`.
    - >
      Zero breaks by construction. `TaskContract` has been `#[non_exhaustive]` since 0.35.0
      (`src/contract.rs:70`), so the new field costs no caller anything, and the store is untouched —
      no table, no column, no index, `CHECKPOINT_FORMAT` unmoved, `ADDED_SINCE_0_22_0` unchanged — so
      the cross-version job has nothing new to be fed.
    - >
      No live provider is required by any criterion. The evidence is files on disk, stored rows,
      connection failures and which `Cap` came back, none of which needs a vendor.
  major_cost_drivers:
    - >
      The Linux mount work is the driver that decides whether this release ships whole. `unshare` is
      invoked as an argv (`src/sandbox/linux.rs:40`) and populating a mount namespace is not
      something an argv expresses on its own, while three properties of the current backend must
      survive: the probe spawns the exact wrapper the backend builds, a wrapper failure is
      `Error::Sandbox` and never a failed command, and a host that refuses degrades to the floor and
      *reports* the floor. This is the one piece that must be measured on a runner rather than
      reasoned about locally.
    - >
      `shell` parses a line into sub-commands, so containment attaches per sub-command
      (`src/run.rs:7951`) rather than once as it does for `exec` (`src/run.rs:8426`). Two threading
      jobs of different shapes, and F4's hole lives in the second.
    - >
      Mapping a `Policy` rule stack onto one boolean. `Effect::Ask` on `Act::Net` has no honest
      mapping — the sandbox cannot ask — and whichever answer is taken has to be written down rather
      than settled silently in code.
    - >
      The escape tests deliberately write outside the workspace. Each must target a path under a
      `TempDir` it owns and assert cleanup, or a failing run leaves files on the developer's machine
      and on the runner.
    - >
      Trap 45's cost twice — a worked doctest per public item, a hand-edited `docs/public-api.txt`,
      and the guide prose — with doctests linking to `SandboxConfig`, `Sandbox`, `Cap` and `Act`,
      several behind cfg-gated modules, which is the exact shape the nightly docs gate fires on.
  recommended_scope_change: null
