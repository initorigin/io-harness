product: io-harness
version: 0.61.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
release_fit:
  assessment: high
  reasons:
    - >
      No numeric constraint is recorded for this release — `ultraship constraints` reports no active
      release to hold one, and `.ultraship/ultraship.yaml` leaves every figure under
      `resource_profile.available` null. The one recorded preference that bears on the work is
      `minimize_cost: true`, and this release is small by that measure: one slice literal grown by
      eighteen entries, six `#[cfg]` attributes removed, two test functions added, and four prose
      surfaces corrected. No behaviour path changes at all.
    - >
      The defect is fully located and the arithmetic is settled, because the source was read before
      the contract was written. 53 built-in tool names exist against 35 in `RESERVED_TOOL_NAMES`
      (`src/tools/custom.rs:516-552`), and every one of the eighteen missing names was traced to the
      arm that answers it — `src/run.rs:10825`, `11568`, `11672`, `11754`, `11767`, `11791`, `11806`,
      `12984-12985` — or, for the two mailbox names, to the tree-loop interception at
      `src/run.rs:7702`. No task begins with a search.
    - >
      The whole class of risk a feature release carries is absent by construction: no schema, no
      checkpoint format, no configuration key, no new dependency, and no change to any tool's
      behaviour or to any build's offered catalogue. The only surface movement is six name constants
      becoming unconditional, which is the same move 0.17.0 made for `view_image` and the nine
      document names.
    - >
      `tests/custom_tools.rs` already carries the exact pattern both new tests follow —
      `a_registered_tool_may_not_shadow_a_builtin` (247-277), the 0.17.0 gap test over
      `NAMES_0_16_2_MISSED` (286-341) and its negative control at 358 — and `tests/docs_drift.rs`
      (1207-1254) already resolves tool-name constants out of `src/` with the regexes the invariant
      test needs. Nothing here is a new technique.
  major_cost_drivers:
    - >
      **Deriving "every built-in name" without hand-listing it again.** The release exists because a
      hand-maintained list goes stale, so its own test must not be one. The planning read settled the
      exclusion list at exactly one entry — `AT_BEFORE_TOOL` (`src/hooks.rs:61`, value
      `"before_tool"`), a hook stage caught only because its identifier ends in `_TOOL` — and every
      later entry is a place the defect can reopen, so each carries its reason in a comment and is
      named in the record.
    - >
      **The derivation's failure mode is silence.** A regex that resolves nothing passes vacuously
      unless it is made to fail loudly. F3's floor, its named panic and its CRLF fixture exist because
      0.60.2 shipped a checker that windowed a page, found nothing, silently widened to the whole
      file, and was green on Windows while checking nothing.
    - >
      **`src/run.rs` is 16,811 lines** and the dispatch match spans 10,572-13,270. Confirming which
      names the arms answer — rather than which the roadmap says — already produced two corrections at
      planning time, and the same reading is what T03's derivation has to be checked against.
    - >
      **The full suite on a contended machine.** `target/` is 22 G against 34 G free at the start of
      development; `CARGO_PROFILE_DEV_DEBUG=0` is set, disk is re-checked before any full run, and the
      all-features suite goes to the PR matrix rather than being run locally.
    - >
      **Two gates can only be checked after the version bump** — the README dependency pin at
      major.minor, which must go from `0.60` to `0.61`, and
      `the_capabilities_release_table_covers_every_released_version`, which needs a
      `docs/CAPABILITIES.md` row for 0.61.0. Both have cost a red CI round before, in 0.57.0 and
      0.60.2 respectively.
  recommended_scope_change: null
