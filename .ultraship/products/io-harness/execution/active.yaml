product: io-harness
version: 0.25.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
release_fit:
  assessment: probable
  reasons:
  - >
    No constraints are recorded for this release — `ultraship constraints` reports no active release
    to attach them to, and the owner has supplied no time, budget or capacity figure. The assessment
    is therefore grounded in the contract's own `resource_profile` (complexity `large`, uncertainty
    `medium`) and in what the repository actually contains, not in a limit the framework was given.
  - >
    This is deliberately two features rather than the roadmap's three, and the third moved on
    evidence rather than on feel. 0.24.0 was assessed `probable` carrying four subsystems and it
    overran by exactly one of them; the correction is in the scope, not in the estimate. That is the
    single largest reason this sits above 0.24.0's fit rather than at it, despite the handles being
    the same work.
  - >
    The reused half is genuinely reused. `shell_start` shares 0.24.0's `parse`, `plan` and gate loop
    unchanged, and the refusal set it inherits is already proven closed by a property test with
    sabotage runs. The store work copies the `citations` pattern verbatim — an additive table, no
    format bump, a writer and a reader in a shape the file already contains twice. The diagnostics
    pass consumes documented NDJSON with a `serde_json` already in the tree.
  - >
    The genuinely new thing is small but load-bearing: a registry that owns a process beyond the call
    that made it. Nothing in this crate has ever done that — `Shell::run` holds children in a local
    `Vec` with `kill_on_drop(true)` — so the four leak paths (run end, self-exit, cap, resume) are
    new surface rather than new code, and the proving is the cost.
  - >
    One criterion cannot be verified on the development machine. F2's negative control — a grandchild
    that survives a naive kill and does not survive a contained one — is Windows-only, so the
    feedback loop for the least safe code in the release is a CI round trip. Smaller than 0.24.0's
    Windows exposure, which had three such criteria, but not zero.
  - >
    The baseline is green and recent: 49 test binaries, 1039 tests, 0 failures on `develop` at
    `e51e90d` with `--all-features`, run immediately before this release opened. The repository is
    not carrying known breakage into the work.
  major_cost_drivers:
  - A registry that owns a process beyond its call, and the four ways it can leak
  - Routing the handle spawn into containment, which the shell path has never reached
  - Proving orphaning on every resume entry point rather than one
  - Windows-only verification for F2's negative control
  - The diagnostics pass's boundedness — timeout, output cap, and three failure modes
  recommended_scope_change: null
