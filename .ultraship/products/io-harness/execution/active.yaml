product: io-harness
version: 0.36.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
release_fit:
  assessment: probable
  reasons:
    - >
      The git half sits on machinery that already exists and already holds the property the release
      needs. `GitCmd` is a closed enum rendered by one `options`/`paths`/`config` triple, `argv`
      already emits `--` before every model-supplied byte, and `check_path` already refuses a
      leading `-`. Two variants and one name validator is the whole of it. The recorded constraint
      that decides the assessment is the standing "no new runtime dependency" limit — `cargo tree`
      reads 402 lines and a new dependency is a criterion failure, not a trade-off — and a worktree
      is a `git` spawn through the spawner the crate already has.
    - >
      Both argv questions were settled by measurement before any code was written, on git 2.41.0:
      `git switch --create=<name>` is a single argv element so the branch name is never a positional
      that could be read as an option, `git worktree add -b <name> -- <path>` accepts the `--`
      separator so the path stays on the model-supplied side of it, and a trailing `--` with no
      paths is accepted by both. The one shape that does not exist is `--branch=` on `worktree add`,
      which is why the name there is validated rather than fused.
    - >
      The rewind half repeats a shape this repository has already built twice. A memory restore
      point is `snapshots` with a different key, guarded the same way at the first write; the
      rewinds record is an append-only table read by run id. No existing table is altered, so
      `CHECKPOINT_FORMAT` stays 7 and the cross-version work is the `ADDED_SINCE_0_22_0` list, which
      trap 19 already makes routine.
  major_cost_drivers:
    - >
      Per-child worktrees touch `spawn_child`, which hard-codes `TaskContract::workspace(goal,
      &tree.root)`. Rooting a child elsewhere has to survive adoption on resume, FIFO admission and
      a policy whose rules are relative to a root that is now the child's own. `src/run.rs` is over
      9,500 lines and this is its most load-bearing path.
    - >
      Every git criterion needs a real repository rather than a mock, so the fixtures are `git init`
      plus a scripted provider and the assertions read git's own output. Windows is the exposure:
      path joining, line endings, and a `git worktree` never exercised here under a CRLF checkout.
    - >
      `AgentDef` gains `#[non_exhaustive]` and a field in one release. Both are the same break for
      an external struct literal, so paying them together is right — but every in-crate literal
      construction has to grow the field.
    - >
      Five negative controls designed before the code, not after: F1's rejected branch names, F3's
      `worktree = false` collision executed rather than described, F4's file written before a kill,
      F5's no-rewind arm, and F7's delete-the-rows sabotage. F6's guard removal is the subtle one.
  recommended_scope_change: null
