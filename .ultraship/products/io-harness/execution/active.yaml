product: io-harness
version: 0.6.0
execution_state: DEVELOPING
checkpoint: .ultraship/checkpoints/2026-07-24T23-30-00Z-io-harness-0.6.0.yaml
blockers:
  - >
    OWNER APPROVAL — the git Release and `cargo publish` to crates.io (target_mode: published) are
    owner-gated and NOT done. Publishing is public and irreversible. The crate is release-ready and
    all package gates are green (test/clippy/build/dry-run). CARGO_REGISTRY_TOKEN is in .env. This is
    the only remaining implementation step (T10).
  - >
    TEST GAP (minor) — ACCEPTED BY OWNER 2026-07-24. T08's "a child sandbox start-failure does not
    take down siblings" stays proven indirectly (typed start-failure unit test + run_tree's existing
    error isolation shown by the subagents suite); no dedicated tree+start-failure injection test is
    added, as an unspawnable child rustc is not reachable through the public API. No longer a blocker.
release_fit:
  assessment: probable
  reasons:
    - >
      The isolation surface is small and single-chokepoint. Model-produced code executes in exactly
      one place — `compile_source` in verify.rs (rustc metadata compile + the produced test binary) —
      and the agent has no arbitrary-command tool (the fs/workspace tools never exec). So "route all
      execution through a sandbox" reduces to routing one function's two spawns, not a repo-wide
      audit. The `ExecGuard` already threaded to that path carries the policy and the trace handle,
      so the sandbox rides an existing seam rather than a new plumbing pass through run_with/run_tree.
    - >
      No time, budget, or capacity constraint is recorded (`ultraship constraints show` reports none),
      so this assessment is made against the code's condition and product.yaml's constraints (Rust
      crate, tokio, rusqlite, embeddable in-process, local single-user), not against a stated limit.
      If the owner records a tight limit, fallback_scope (portable floor on all three OSes + macOS
      native, windows/linux native to compile-tested stubs, publish held to release-ready) is the
      smaller landing.
    - >
      The portable floor backend (subprocess + ephemeral tempdir + resource caps + network-env strip)
      is pure, self-contained, and testable on this macOS host without any provider — the
      guaranteed-present isolation floor can be proven early, so "isolation on every OS" is real
      before the harder native backends are attempted.
    - >
      The trace/migration pattern is established. AgentEvent + additive `ALTER TABLE`/`CREATE TABLE IF
      NOT EXISTS` migrations already exist for 0.4.0 and 0.5.0; sandbox lifecycle events follow the
      same shape, so the auditable-and-backward-compatible half carries low novelty.
  major_cost_drivers:
    - >
      The macOS `sandbox-exec` profile is the one live-testable native backend, and rustc under a
      restrictive profile must still read its sysroot/toolchain and write the out-dir while network is
      denied. Getting the profile permissive-enough-to-compile yet tight-enough-to-isolate is the
      sharpest uncertainty, and it is the backend the example live-run depends on.
    - >
      Resource caps that KILL rather than throttle, mapped onto rlimits (POSIX pre_exec) with a typed
      cap-hit outcome — a cap that hangs instead of killing turns a runaway into a stuck run, worse
      under 0.5.0 fan-out.
    - >
      Guaranteed teardown on every exit path (success, failure, cap-kill, panic) with no leaked temp
      dir and no orphan process — a drop-guard/RAII guarantee across differing OS process-group/kill
      semantics.
    - >
      The Linux (namespaces+seccomp) and Windows (Job Object+restricted token) native backends cannot
      be live-run on this macOS host; they are compile-gated + unit-tested only, so a runtime bug in
      them could ship undetected. The portable floor being real on all three OSes is the mitigation.
  recommended_scope_change: null
