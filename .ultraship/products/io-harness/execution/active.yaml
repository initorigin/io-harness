product: io-harness
version: 0.43.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
release_fit:
  assessment: probable
  reasons:
    - "Four capabilities, but only two are entangled. Compaction and the overflow recovery are the
      same helper called for two reasons, so building the first and adding the second caller is one
      piece of work rather than two. The transcript and `Session::attach` are independent, small, and
      touch files nothing else in the release touches."
    - "Every capability has an in-tree template. `complete_with_retry` (`src/run.rs:10268`) is the
      single choke point the summarising call goes through; `ledger_observations` (`src/state.rs:2891`)
      is the shape the `summaries` table copies; `Store::session_turns` (`:6456`) already returns the
      whole tree the transcript needs; and `TaskContract::with_images` (`src/contract.rs:510`) already
      carries the media `Session::attach` stages."
    - "The store change is one additive table and one index with `CHECKPOINT_FORMAT` unmoved, which is
      the cheapest migration shape this repository has and the one the cross-version tests already
      assert against for eleven prior additions."
    - "The one public break is a single enum gaining a variant and `#[non_exhaustive]` together — the
      move four previous releases each made on a different type, with a known cost and a one-line
      migration note."
    - "No constraints have been recorded for this release, so this assessment is grounded in the
      repository's own condition rather than in a stated limit."
  major_cost_drivers:
    - "Placing the fold before assembly in both loops without it becoming a fifth elision rule.
      `assemble` (`src/context.rs:413`) has never made a provider call and must not start; the first
      reading of a shared phase was wrong in 0.42.0 and cost an iteration, so both call sites are
      confirmed by reading them rather than by assuming a shared path exists."
    - "Where the summary sits in the ledger. It must survive supersession, must not be staled by
      invalidation, and must not be the first entry the fit rule stubs — three rules that run after
      it and were written without it in mind."
    - "F1's discriminating pair needs a fixture provider that records every request it was handed.
      0.42.0 built one for its recorded prompts; reusing it is cheap and building a second one drifts."
    - "The overflow signature list is a heuristic against wording three vendors control. It must stay
      conservative, and the negative control (F6) is what keeps a false positive from being worse
      than the failure it replaces."
    - "`Session::attach` reaches a `cfg(feature = \"media\")` field from an ungated function, so the
      staging field, the append in `drive` and the clear each need the same gate and the default build
      must stay byte-identical."
  recommended_scope_change: null
