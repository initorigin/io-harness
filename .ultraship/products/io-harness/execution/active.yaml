product: io-harness
version: 0.33.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
release_fit:
  assessment: probable
  reasons:
    - >
      The transport question the release opens is already answered by the repository. `Store::open`
      has set `journal_mode = WAL` and a five-second `busy_timeout` since 0.12.0, and
      `tests/store_open.rs` asserts both, so two processes sharing the file needs no migration and
      no on-disk compatibility argument. That was the one part of this release that could have been
      a schema change with a full cross-version bill, and it is not.
    - >
      Every mechanism the release needs is already compiled in. The event type is `Serialize +
      Deserialize + PartialEq`, the three gates all return `Pin<Box<dyn Future>>` and are therefore
      `Unpin` and usable in a `tokio::select!`, and `tokio`'s `time` and `sync` features are already
      in `Cargo.toml`. The recorded constraint that decides the assessment is the standing "no new
      runtime dependency" limit — `cargo tree` reads 402 lines and a new dependency is a criterion
      failure rather than a trade-off — and this release does not come near it.
    - >
      A real-kill fixture is a solved pattern here, three times over: `examples/crash_fixture`,
      `examples/plan_gate_fixture` and `examples/fleet_fixture`. The fourth is shaped like the
      third.
  major_cost_drivers:
    - >
      Four call sites in `src/run.rs` change from "await the gate" to "await the gate and the store
      row, first one wins", and each needs the durable row moved ahead of the gate. That reorders
      code the write, network, question and plan paths do not share, so it is four edits rather than
      one.
    - >
      Two of the three answer paths were read-then-write and are not atomic across processes.
      Fixing them changes three public signatures from `Result<()>` to `Result<bool>`, which is the
      release's only break and touches every existing caller and their tests.
    - >
      Proving the attached stream is the *same* stream rather than a plausible one. The
      element-wise `RunEvent` equality and its no-`Broadcast` negative control had to be designed
      before the code was written; a length or tag comparison would have passed against a
      reconstruction.
    - >
      Disk. `target/` took this volume to zero during 0.32.0 and three rust-analyzer servers are
      live on the machine, rebuilding into the same tree. The suite is run in separate invocations
      with `df -h .` between them.
  recommended_scope_change: null
