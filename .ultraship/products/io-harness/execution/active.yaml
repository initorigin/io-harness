product: io-harness
version: 0.36.1
execution_state: DEVELOPING
checkpoint: null
blockers: []
release_fit:
  assessment: probable
  reasons:
    - >
      The recorded constraint that decides the assessment is the standing "no new runtime
      dependency" limit — `cargo tree` reads 402 lines and a new dependency is a criterion failure,
      not a trade-off. This release cannot violate it by construction: `cargo-nextest` is a CI tool
      installed by an action, not a manifest entry, and nothing else here touches `Cargo.toml` at
      all. The second recorded constraint, "a patch release changes no public API", is equally safe:
      no task in this release opens `src/`, so `docs/public-api.txt` is byte-identical without
      anyone having to preserve it.
    - >
      The documentation half is bounded by gates that already exist and run in milliseconds.
      `tests/readme.rs` measures the first 60 lines, `tests/docs_drift.rs` checks the MSRV, the
      feature list and every relative link, `tests/guide_pages.rs` guards the page set and
      `tests/changelog.rs` the migration notes. The restructure is therefore a rewrite under
      continuous check rather than a rewrite followed by a discovery.
    - >
      The workflow half is a reorganisation of invocations the file already contains, not a new
      pipeline. Every command in the new graph appears verbatim in the old one; what changes is
      which job runs it and how many run at once. F1's set-cover comparison is a mechanical check
      of that claim rather than a judgement call.
  major_cost_drivers:
    - >
      A workflow file cannot be executed locally. The two levers with genuine uncertainty — whether
      stable MSVC will link with `rust-lld`, and whether nextest's process-per-test model disturbs
      the three known wall-clock-sensitive tests (traps 11, 73, 83) — are answerable only on a
      runner, so each costs a push and a CI round. They are landed as separate commits so a
      regression is attributable to one of them.
    - >
      The measurement is the evidence. Before-and-after per-job and per-step durations have to be
      read from the Actions API for named run ids on a warm dependency cache in both cases, or the
      comparison is between a cold run and a warm one and means nothing.
    - >
      The documentation sweep is the larger half by reading time: 381 README lines, 1,399 in
      `docs/CONTRACT.md`, 110 in `docs/CAPABILITIES.md` and 22 guide pages, against seven releases
      of change.
  recommended_scope_change: null
