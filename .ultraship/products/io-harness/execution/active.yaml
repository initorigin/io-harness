product: io-harness
version: 0.15.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
constraints:
  time: 'Continuing the session that shipped 0.14.0. The owner''s standing direction is "commit constantly,
    be token-efficient", and the 2026-07-26 override stands: PRs, merges, the GitHub Release and `cargo
    publish` proceed without a stop, and engineering decisions are made and stated rather than routed
    back as questions.

    '
  budget: null
  capacity: 'Subagents for disjoint files, main thread token-efficient. Disk is the binding limit this
    release: the owner reports the volume at 87%+ with `io-harness/target` regrowing to roughly 40GB against
    roughly 41GB free, so `target` is deleted after any long build session. Both figures are the owner''s
    own estimates.

    '
  source: user-estimate
release_fit:
  assessment: probable
  reasons:
  - 'Recorded constraint: subagents for disjoint files, token-efficient main thread. This release splits
    cleanly into two independent halves that share no state — the image half (provider boundary, three
    wire bodies, one built-in) and the git half (spawner, five built-ins) — plus three severable carry-overs
    in three separate files. Only T01 and T06 are foundations, and they are foundations for different
    halves, so both halves can proceed at once.

    '
  - 'Recorded constraint: disk at 87%+ with target regrowing to ~40GB against ~41GB free. This release
    adds one small dependency (`base64`, already compiled transitively via reqwest) and no dependency
    at all for the git half, so it does not enlarge the build the way 0.14.0''s five document crates did.
    The feature matrix is two states rather than 0.14.0''s six.

    '
  - 'The templates all exist and were exercised one release ago. The git built-ins are the document built-ins
    with a different payload: same `match` (src/run.rs:2804), same `gate` (src/run.rs:3416), same refusal,
    pause and trace shape. The path-gate work that made 0.14.0 hard is done.

    '
  - 'The provider research the contract rests on is complete: the exact content-part shape for each of
    the three vendors is known, video was cut on that evidence before any code was written, and the request-shape
    change is already handled by the existing recording series gate (src/provider/record.rs:100).

    '
  major_cost_drivers:
  - 'The gated fixed-argv spawner is new infrastructure rather than a wrapper. Nothing in the crate runs
    a binary for the model today, and the one exec path that exists is private, argv-blind and owned by
    verification. None of that cost is visible in the feature list.

    '
  - 'Argument injection and path quoting. The defence is small; being certain of it is not, and it is
    the failure mode that ships silently.

    '
  - 'Git behaviour across the three OSes — `core.autocrlf`, path separators, file-mode bits, case-insensitive
    filesystems. The tests are cheap and the discovery is not.

    '
  - 'Commit idempotency across resume: a small amount of code in a place where being wrong is invisible
    until a crash.

    '
  recommended_scope_change: null
