product: io-harness
version: 0.60.2
execution_state: DEVELOPING
checkpoint: null
blockers: []
release_fit:
  assessment: high
  reasons:
  - >
    No constraint of any kind is recorded for this release — `ultraship constraints` reports no
    active release to hold one, and `.ultraship/ultraship.yaml` leaves every figure under
    `resource_profile.available` null. The one recorded preference that bears on the work is
    `minimize_cost: true`, and this is the cheapest entry on the roadmap: it changes four files of
    prose and adds three assertions to a suite that already exists.
  - >
    Every claim to be corrected is already located by file and line in the contract itself —
    `docs/CONTRACT.md:2536`, `src/contract.rs:405`, `docs/guide/tools-and-skills.md:80`,
    `src/tools/custom.rs:497`. No task begins with a search, which is what separates this from
    0.60.1, whose first task was an eight-project external audit.
  - >
    The whole class of risk a feature release carries is absent by construction: no schema, no
    checkpoint format, no configuration key, no public item, and therefore no cross-version gate to
    satisfy. N1 asserts that by diff and by the unchanged `docs/public-api.txt` snapshot rather than
    trusting it.
  - >
    The three tests extend `tests/docs_drift.rs`, which already reads real files through one `read`
    helper and already carries the checker-plus-control pattern each new assertion follows. Only F2
    is a new shape — an assertion over a rustdoc block inside `src/` rather than over a markdown
    file — and it reads a source file the same way the existing checks read a page.
  major_cost_drivers:
  - >
    Getting the replacement containment paragraph right per platform. The correction is not
    "commands are sandboxed": macOS and Linux confine writes and deny egress, a Windows AppContainer
    does both when asked (0.59.0), and a Windows Job Object and the portable floor apply resource
    caps and have no filesystem facility at all. N3 exists to catch a replacement that flattens
    that, and the platform table already in `docs/CONTRACT.md` is the source it is checked against.
  - >
    The F5 sweep of 2,949 lines for version-numbered assertions. The three contradictions in scope
    were found by grep; the rest of the file is a read, and F5 requires the verdict per claim
    recorded rather than asserted.
  - >
    A docs-only release still runs the whole suite on three platforms, because the suite is where
    the docs gates live — and the nightly rustdoc gate is mandatory here rather than customary,
    since two of the four edits are rustdoc blocks.
  recommended_scope_change: null
