product: io-harness
version: 0.30.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
constraints:
  time: null
  budget: null
  capacity: Parallel agents authorised; `allow_parallel_agents` is already true in the workspace
    resource profile, and the owner reaffirmed a small fan-out is acceptable this session
  source: user-estimate
release_fit:
  assessment: probable
  reasons:
  - >
    Three additive surfaces over code that already exists: a merge that already walks every scope
    key by key, a memory table that already has a unique key per workspace, and a grouping helper
    `src/pricing.rs` already established and `Store::grouped` already implements for spend.
  - >
    The recorded constraint "no new runtime dependency" is met by construction — nothing in the
    release needs anything that is not already linked — and the recorded constraint "no public item
    renamed or removed; no `**BREAKING` changelog entry" is what makes the whole release additive,
    which is the property that keeps it small.
  - >
    The deployment path exists and has been walked 33 times: `feat/0.30.0` off `develop`, two pull
    requests, `release.yml` for the GitHub Release, `cargo publish --locked` by hand last.
  - >
    The one part with no existing shape is the pinned 0.29.0 fixture generator, and even that has a
    working precedent in `tests/fixtures/gen-0.22.0` which this release copies rather than invents.
  major_cost_drivers:
  - >
    Threading the deciding scope through substitution and the `[profile.<name>]` overlay without
    changing what any key resolves to.
  - >
    The cross-version fixtures, whose ordering is the risk rather than whose content is: the pinned
    0.29.0 generator has to run before the schema moves or it measures this tree against itself.
  - >
    Deciding which aggregates the trace can answer honestly. Several plausible ones need attribution
    the trace does not carry, and establishing that costs more than writing the ones that do.
  recommended_scope_change: null
