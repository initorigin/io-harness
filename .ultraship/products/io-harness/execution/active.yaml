product: io-harness
version: 0.19.0
execution_state: DEVELOPING
checkpoint: null
blockers: []
constraints:
  time: >
    The owner's standing direction, restated at the start of this release: carry it to a published
    crate in one pass, without pausing for approval on PRs, merges, the GitHub Release or `cargo
    publish` — all pre-authorised. A criterion that turns out to be wrong about the codebase is
    recorded through `/ultraship:iterate` with evidence rather than reworded to match what was built.
  budget: null
  capacity: >
    The fallback is pre-decided rather than discovered under pressure: if the release does not fit,
    the `[toolchain]`, `[prices]` and `[mcp]` sections and `${file:...}` substitution drop out and
    the four scopes, the merge order, `${env:...}`, unknown-key rejection and the policy, sandbox and
    run-defaults projection ship — which is the contract's own `fallback_scope`. These are the
    owner's own statements of how the session is to be run, not anything measured here.
  source: user-estimate
release_fit:
  assessment: high
  reasons:
    - >
      The recorded time constraint above is the governing one, and unlike the last release it is not
      what holds the assessment down: this release adds one module and one dependency, changes no
      existing behaviour, touches neither the run loop nor the store, and carries no break. There is
      no design decision left open that needs the owner rather than the code.
    - >
      Most of the projection targets were built for exactly this. `Policy`, `SandboxConfig`,
      `SandboxLimits`, `toolchain::Toolchain`, `pricing::PriceTable`, `McpServer` and `McpTransport`
      already derive `Serialize`/`Deserialize`, and `sandbox.rs:260` and `mcp.rs:222` both say in
      their doc comments that the derive exists so a config file can produce one. Four run-shaping
      types need the derive added, which is additive.
    - >
      The merge is one algorithm rather than one per section. Each scope is parsed to a
      `toml::Table`, substituted against its own directory, validated on its own so an error can name
      its file, and then deep-merged key by key — so per-key override, F2's single-cap case, and the
      appending of policy layers are three rules over one walk rather than a partial mirror struct
      per section.
    - >
      `toolchain.rs:30` already carries the sentence "and that 0.19.0 makes it overridable", so the
      shape of the toolchain half was decided when that module was written.
  major_cost_drivers:
    - >
      `deny_unknown_fields` over a nested structure, interacting with `#[serde(default)]` and with
      `McpServer`'s `#[serde(flatten)]` — serde disallows the two together, so the MCP section needs
      its own validation path rather than the derive attribute.
    - >
      Substitution has to run after parsing, before validation, only over strings, resolved against
      the directory of the file that wrote it, and must fail naming the key rather than a byte offset.
    - >
      The user-scope path differs across three platforms and the Windows leg is the one that will
      disagree.
    - >
      `RetryPolicy` holds `Duration` fields, whose derived serde form is `{secs, nanos}` — unusable
      in a hand-written config, so the derive needs a millisecond wire form rather than the default.
  recommended_scope_change: null
