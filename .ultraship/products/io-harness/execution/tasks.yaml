- id: US-IO-HARNESS-0.60.3-T04
  summary: Make a preset a manner appended to a framing (F3, F4, F6).
  why_required: Preset::describe replaces the framing, so an embedder who selected Concise or Careful
    has CONVERSATION_PROMPT thrown away and gets back the two claims 0.49.0 removed on every greeting
    — and on a contained turn loses the guidance that it may spawn. It also retires the duplicated tool
    sentences the collapse forced.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.60.3-T01
  acceptance_criteria:
  - '**F3 — a preset never introduces a success criterion onto a turn that has none.** An end-to-end test
    composes a classifying turn with `SystemPrompt::Preset(Preset::Concise)` and with `Preset::Careful`
    through `Session::turn_bounded`, and asserts the result contains neither "to meet a stated specification"
    nor "checked against the success criterion", contains `CONVERSATION_PROMPT` itself, and still carries
    the preset''s marker clause. It must fail on today''s tree, where `compose` returns `preset.describe()`
    alone. Sabotage: restore the replacing arm in `compose`, under which F3 and F4 fail and no other.

    '
  - '**F4 — a preset on a contained turn keeps the world it is in.** The same claim as F3 over the tree
    loop''s framings: a preset composed over `CONVERSATION_TREE_PROMPT` still carries `spawn_agent` and
    the sentence that a sub-agent inherits its permissions, and one composed over `TREE_PROMPT` keeps
    both as well — which today''s replacement discards in both cases. Asserted as a unit test over `compose`
    in `src/run.rs`''s `mod tests`, because no public entry point can build a contained turn from a caller''s
    contract (`US-IO-HARNESS-0.60.3-I01`). It must fail on today''s tree.

    '
  - '**F6 — the one prompt-text change is stated, not discovered.** Today `Preset::describe`''s bodies
    omit "You may edit several files.", which `WORKSPACE_PROMPT` carries; composing manner onto framing
    restores that sentence for a preset user on the workspace loop. The CHANGELOG says so under the heading
    `docs/CHANGELOG_STRUCTURE.md` gives that class, and a test asserts the composed preset prompt is exactly
    `WORKSPACE_PROMPT` plus the manner clause, so the change is one a reader can reproduce rather than
    one they find in a diff of their own snapshots.

    '
  - '**N1 — no public item moves.** `docs/public-api.txt` is byte-identical to the 0.60.2 snapshot, with
    no regeneration. Asserted by the `public_api` suite staying green and by reading `git diff develop
    -- docs/public-api.txt` as empty. This is what makes 0.60.3 a patch.

    '
  files:
  - src/run.rs
  - src/contract.rs
  - tests/prompt.rs
  evidence: []
