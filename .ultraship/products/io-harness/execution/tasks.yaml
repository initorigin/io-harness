product: io-harness
version: 0.61.0
tasks:
- id: US-IO-HARNESS-0.61.0-T01
  summary: Add the failing refusal assertions over all eighteen names, plus the control over names the
    harness does not own.
  why_required: >-
    F1 is the release's own claim and F5 is what keeps the fix from over-reaching. Both must be written
    and watched to fail before RESERVED_TOOL_NAMES grows, because a test written after a list edit only
    asserts that the list was edited.
  status: done
  depends_on: []
  acceptance_criteria:
  - >
    **F1 — every one of the eighteen is refused, by name, before the provider is called.** A test in `tests/custom_tools.rs`
    parameterised over all eighteen names registers a `Fixed` tool under each and asserts the run fails
    with `Error::Config` whose message contains that name, following the shape of `a_registered_tool_may_not_shadow_a_builtin`
    (`tests/custom_tools.rs:247-277`) and its 0.17.0 sibling over `NAMES_0_16_2_MISSED` (286-341). It
    must fail on today's tree for all eighteen. Sabotage: remove any single name from `RESERVED_TOOL_NAMES`;
    F1 fails for that name and F2 fails, and no other test does.
  - >
    **F5 — a name the harness does not own still validates.** A control registering `browse`, `checker`,
    `lsp`, `git`, `browser` and `my_tool` builds a `Toolbox` that passes `validate` and reaches the provider.
    Without it, "reserve everything that looks built-in" passes F1 and F2 and is wrong. `the_0_16_2_reserved_set_accepted_git_status`
    (`tests/custom_tools.rs:358`) stays green unedited as 0.17.0's own control.
  files:
  - tests/custom_tools.rs
  evidence:
  - >-
    Two tests added to `tests/custom_tools.rs`: `no_name_the_harness_answers_can_be_taken_by_a_registered_tool`
    over a new `NAMES_0_60_3_MISSED` holding all eighteen names, and the F5 control `a_name_the_harness_does_not_answer_is_still_the_callers_to_take`
    over nine near-miss names (`browse`, `browser`, `browser_history`, `checker`, `lsp`, `git`, `forget_me`,
    `message_send`, `my_tool`).
  - >-
    Watched F1 fail on the pre-fix tree. `cargo test --test custom_tools`: `test result: FAILED. 16 passed;
    1 failed`, panicking at the first name — "a tool named after a built-in must be rejected: RunResult
    { outcome: StepCapReached { steps: 1 }, run_id: 1, remembered: [] }". A registered `forget` did not
    merely validate; the whole run completed around it.
  - >-
    The F5 control passed before the fix and must still pass after it — that is what makes F1 a measurement
    of the gap rather than of `validate` in general.
- id: US-IO-HARNESS-0.61.0-T02
  summary: Ungate the six browser name constants and grow RESERVED_TOOL_NAMES to the whole set.
  why_required: >-
    The live defect. The six browser consts are #[cfg(feature = "browser")], so the slice literal cannot
    name them in a default build until they are ungated — the ungate is not cosmetic, it is what makes
    the fix expressible, and it is 0.17.0's own answer for view_image.
  status: done
  depends_on:
  - US-IO-HARNESS-0.61.0-T01
  acceptance_criteria:
  - >
    **F1 — every one of the eighteen is refused, by name, before the provider is called.** A test in `tests/custom_tools.rs`
    parameterised over all eighteen names registers a `Fixed` tool under each and asserts the run fails
    with `Error::Config` whose message contains that name, following the shape of `a_registered_tool_may_not_shadow_a_builtin`
    (`tests/custom_tools.rs:247-277`) and its 0.17.0 sibling over `NAMES_0_16_2_MISSED` (286-341). It
    must fail on today's tree for all eighteen. Sabotage: remove any single name from `RESERVED_TOOL_NAMES`;
    F1 fails for that name and F2 fails, and no other test does.
  - >
    **F4 — the six browser names are reserved in a build that does not compile the browser.** The default
    feature set has no `browser`, so F1's browser rows already assert this — but only if the test is not
    itself gated. F4 is the explicit claim: `tests/custom_tools.rs` carries no `#[cfg( feature = "browser")]`
    on the browser rows, and the same six are refused under `--all-features` too. This is the property
    0.17.0 named as the whole reason for ungating a name: "enabling a feature can never take away a tool
    that was working."
  - >
    **F6 — the two intercepted names are refused for the same reason and by the same path.** `send_message`
    and `read_messages` are refused by `validate` in a **flat** run, where they are not offered and where
    a registered tool of that name works today. That is a behaviour change beyond "already broken, now
    loud", and the test states it: a flat run registering `send_message` fails with `Error::Config`, and
    the record names the precedent — `SPAWN_TOOL` has been reserved in every run shape since 0.17.0 for
    the identical reason.
  files:
  - src/tools/mod.rs
  - src/tools/custom.rs
  evidence:
  - >-
    `src/tools/mod.rs`: the six `#[cfg(feature = "browser")]` attributes removed from the browser name
    constants, with the rustdoc stating the 0.17.0 rule and naming the mechanical reason the reserved
    set could not hold them. The tools stay gated — the dispatch arm at `src/run.rs:11806`, `src/tools/browser.rs`
    and the catalogue are untouched.
  - >-
    `src/tools/custom.rs`: eighteen entries added to `RESERVED_TOOL_NAMES`, which stays a slice literal
    of name constants and stays `pub(crate)`. 35 entries to 53.
  - >-
    `cargo test --test custom_tools`: `test result: ok. 17 passed; 0 failed`. F1 green over all eighteen,
    F5 still green, and 0.17.0's `no_built_in_name_can_be_taken_by_a_registered_tool` plus its `the_0_16_2_reserved_set_accepted_git_status`
    control green unedited.
  - >-
    `cargo check --features browser --lib` finished clean, which is the check that the ungated constants
    do not collide with the gated module that reads them.
- id: US-IO-HARNESS-0.61.0-T03
  summary: Write the source-derived invariant test with its floor and its CRLF parse control.
  why_required: >-
    Without it this release is 0.17.0 again: a list patched by hand that the next built-in reopens. The
    floor and the CRLF control are what stop the derivation passing vacuously, which is the failure mode
    0.60.2 paid for.
  status: done
  depends_on:
  - US-IO-HARNESS-0.61.0-T02
  acceptance_criteria:
  - >
    **F2 — the invariant: a built-in name that is not reserved fails the build's tests.** One test derives
    the built-in name set from `src/` — every `const *_TOOL: &str = "…"`, with the names that are deliberately
    excluded listed explicitly and each carrying its reason in a comment — and asserts set equality with
    the names `RESERVED_TOOL_NAMES` resolves to. Both directions: a dispatched name missing from the set
    fails, and a reserved name whose const no longer exists fails. Sabotage A: add a `const FAKE_TOOL:
    &str = "fake_tool";` to `src/tools/mod.rs` without reserving it — F2 fails and nothing else does.
    Sabotage B: delete a name from the reserved slice — F2 and F1 fail together.
  - >
    **F3 — the derivation cannot pass vacuously.** F2's parse asserts a floor (at least fifty names resolved
    from `src/`, at least fifty in the reserved set) and panics with a named message if either regex matches
    nothing, mirroring `reserved_tool_names`'s own `"RESERVED_TOOL_NAMES is no longer a slice literal"`
    panic (`tests/docs_drift.rs:1223`) and `the_guide_reserved_name_claim_matches_the_source`'s `reserved.len()
    >= 30` floor (`tests/docs_drift.rs:1307`). A separate unit assertion runs the resolver over a fixture
    string with CRLF line endings and asserts it resolves the same names, because a windowing checker
    that silently falls back is the defect 0.60.2 paid for.
  files:
  - tests/custom_tools.rs
  evidence:
  - >-
    `every_name_the_harness_answers_is_reserved` in `tests/custom_tools.rs` derives the built-in set from
    every `const <IDENT>_TOOL: &str = "<name>"` under `src/` and asserts set equality with the names `RESERVED_TOOL_NAMES`
    resolves to, in both directions. The resolvers take the source as an argument rather than reading
    it, which is what lets the control run them over a fixture.
  - >-
    Sabotage A — `pub const FAKE_TOOL: &str = "fake_tool";` appended to `src/tools/mod.rs` and nothing
    else changed: `every_name_the_harness_answers_is_reserved ... FAILED`, message `["fake_tool"] are
    built-in tool names and RESERVED_TOOL_NAMES does not hold them`. **Only that test failed** — 19 filtered
    out, and no run-time test can see a name no dispatch arm answers yet, which is exactly the class the
    invariant exists for and the class a refusal test cannot cover.
  - >-
    Sabotage B — `super::LSP_RENAME_TOOL` deleted from the slice: `test result: FAILED. 18 passed; 2 failed`
    — `every_name_the_harness_answers_is_reserved` and `no_name_the_harness_answers_can_be_taken_by_a_registered_tool`,
    together, as the contract predicted. Both arms reverted with `git checkout`.
  - >-
    F3's guards, asserted rather than assumed: floors of fifty on both parses; `the_derivation_cannot_pass_by_finding_nothing`
    runs both resolvers over a CRLF fixture and asserts a source with no slice literal **panics** rather
    than resolving an empty set; `the_exclusion_list_names_only_non_tools_that_exist` fails if an entry
    in `NOT_A_TOOL_NAME` stops existing or starts carrying a real tool's value.
  - >-
    The exclusion list has exactly one entry — `AT_BEFORE_TOOL` (`src/hooks.rs:61`, value `"before_tool"`),
    a hook stage caught only because its identifier ends in `_TOOL`. 53 tool names resolved against 53
    reserved.
- id: US-IO-HARNESS-0.61.0-T04
  summary: Retire the open-defect prose in the reserved set's rustdoc, the tools guide, docs/CONTRACT.md
    and the CHANGELOG.
  why_required: >-
    Three checked-in surfaces currently describe the gap as open, and the tools guide states the eighteen-name
    count. A release that closes a defect and leaves the documentation saying it is open ships a second
    defect of the class 0.60.2 existed to fix.
  status: done
  depends_on:
  - US-IO-HARNESS-0.61.0-T03
  acceptance_criteria:
  - >
    **F7 — the guide's claim matches the source again.** `the_guide_reserved_name_claim_matches_the_source`
    and its four fixture siblings (`tests/docs_drift.rs:1304-1380`) stay green, and the page no longer
    carries the sentence naming the eighteen-name gap. Sabotage: leave the stale paragraph in place and
    assert the docs gate catches it — if it does not, the gate reads the bullet and not the paragraph,
    which is a finding about the gate and is recorded as one.
  files:
  - src/tools/custom.rs
  - docs/guide/tools-and-skills.md
  - docs/CONTRACT.md
  - CHANGELOG.md
  evidence:
  - >-
    `src/tools/custom.rs`: the doc block on `RESERVED_TOOL_NAMES` no longer declares the defect open.
    It states the rule, names the test that enforces it, records that ungating the browser constants is
    what made the set nameable, and carves out all three intercepted names (`spawn_agent`, `send_message`,
    `read_messages`) instead of only `spawn_agent`.
  - >-
    `docs/guide/tools-and-skills.md`: the paragraph claiming the set omits eighteen names is gone; the
    bullet still defers to `RESERVED_TOOL_NAMES` rather than restating it.
  - >-
    `docs/CONTRACT.md`: the "And it has reopened" section rewritten to the closed form, with the two consequences
    a caller can see — the ungated browser names, and `send_message`/`read_messages` being reserved in
    a flat run that is never offered them.
  - >-
    `CHANGELOG.md`: a `**BREAKING (behaviour)**` entry naming all eighteen with a `*Migration:*` note,
    a Changed entry for the ungated constants, and a Fixed entry for the invariant. `tests/changelog.rs`
    green (5 passed).
  - >-
    **F7's sabotage found a real gap in the gate, exactly as the criterion anticipated.** Restoring the
    stale paragraph verbatim left `cargo test --test docs_drift` at `45 passed; 0 failed`. `guide_defers_to_the_reserved_set`
    catches only 0.17.0's literal sentence and backticked names absent from the set, and the stale claim
    cited `browser_*` and `lsp_*` — which end in a `*` the identifier regex never matches. A page can
    therefore say the set is incomplete and pass every check.
  - >-
    Closed in the gate rather than recorded and left: `guide_defers_to_the_reserved_set` now refuses a
    bullet claiming incompleteness by shape, with `guide_checker_rejects_a_claim_that_the_set_is_incomplete`
    as its fixture sibling. Re-sabotage now fails with `the guide still says the reserved set is incomplete
    ("yet hold")`.
  - >-
    **The first version of that check was itself blind, and this is the lesson worth carrying.** Its needle
    was `"not yet hold"`; the page writes the word as `**not**`, so the phrase never appears as typed
    and the sabotage passed a second time. The needles now skip the emphasised word. A prose checker must
    be tested against the real bytes of the page, not against the sentence as a reader hears it.
  - >-
    `tests/docs_drift.rs:reserved_set_parse_resolves_names_and_not_idents` updated: its 0.60.2 form asserted
    `browser_click` is **not** reserved — a control that pinned the defect in place. It now asserts the
    name resolves and the identifier does not, which is the property it was written to check.
  - >-
    `cargo test --test docs_drift --test changelog --test guide_pages --test readme --test public_api`:
    46 / 5 / 10 / 9 / 8, all green.
- id: US-IO-HARNESS-0.61.0-T05
  summary: Verify the surface, the dependency count, the schema and the offered catalogue did not move.
  why_required: >-
    The ungate is a public-surface addition no gate in this repository can see, so N1 has to be established
    by reading the diff rather than by a green snapshot. N2/N3/N4 are the release's claim that nothing
    else moved.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.61.0-T04
  acceptance_criteria:
  - >
    **N1 — `docs/public-api.txt` does not move, and the reason is a known gap rather than a claim of safety.**
    That snapshot enumerates items re-exported from `src/lib.rs` (`tests/public_api.rs`), and the browser
    name consts are reached as `tools::BROWSER_*` rather than re-exported at the root, so ungating them
    adds nothing to the file. The addition is real all the same: `tools:: BROWSER_NAVIGATE_TOOL` and its
    five siblings become nameable in a default build. This is the A6 gap 0.60.3 recorded — the snapshot
    tracks re-exported names and not the module's own surface — hit a second time, and it is recorded
    as a `known_limitation` with the diff as its evidence, not hidden behind a green snapshot test.
  - >
    **N2 — no new dependency.** `cargo tree | wc -l` stays 402, the number every release since 0.50.0
    has reported.
  - >
    **N3 — no schema, no checkpoint format, no configuration key.** `CHECKPOINT_FORMAT` stays 7, no DDL,
    `tests/cross_version.rs` needs no `ADDED_SINCE_0_22_0` entry.
  - >
    **N4 — the model's offered catalogue is byte-identical.** No tool is added to or removed from any
    build's catalogue, so 0.38.0's cacheable system prefix is unmoved for every configuration. The prompt
    baselines in `tests/prompt.rs` stay green untouched, which is the evidence.
  files:
  - docs/public-api.txt
  evidence: []
- id: US-IO-HARNESS-0.61.0-T06
  summary: Run the suite, the nightly rustdoc gate and the sabotage pass, one arm per functional criterion.
  why_required: >-
    A sabotage arm that fails nothing is a finding about the test, and this release is almost entirely
    tests. The rustdoc gate has caught something in eight of the last eleven releases and this release
    edits seven doc blocks, one of which links a pub(crate) item.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.61.0-T05
  acceptance_criteria:
  - >
    **O1 — the suite is run and its numbers recorded against 0.60.3's.** 0.60.3 measured 89 binaries /
    1,874 passed / 0 failed / 6 ignored on the default features. This release adds tests and no behaviour
    path, so the binary count is expected unchanged and the test count up by the F1 rows; both numbers
    are recorded whatever they are.
  - >
    **O2 — the nightly rustdoc gate is run locally before the PR.** `RUSTDOCFLAGS` with `rustdoc::private_intra_doc_links`
    and the broken-link lints, on the installed nightly. It has caught something in eight of the last
    eleven releases, and this release edits rustdoc on seven constants and one const's doc block — links
    from a `pub` const to a `pub(crate)` item are exactly the class it catches, and `RESERVED_TOOL_NAMES`
    is `pub(crate)`.
  - >
    **O3 — the sabotage pass runs before the record is sealed**, one arm per functional criterion, each
    invoked so that the intended test binary actually runs. `cargo test --test custom_tools <filter>`
    and `cargo test --lib <filter>` are separate invocations: passing one filter to both binaries is what
    let 0.60.3 record a survival for a test that ran zero times. An arm that fails nothing is a finding
    about the test, not a superfluous guard.
  - >
    **O5 — `df -h .` before any full build.** `target/` has stood at 26 G against 29 G free; disk is checked
    and `target/debug/deps`, `build` and `incremental` cleared before a full run, and `CARGO_PROFILE_DEV_DEBUG=0`
    is set.
  files: []
  evidence: []
