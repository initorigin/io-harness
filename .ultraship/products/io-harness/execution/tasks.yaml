    migration note per break, docs/public-api.txt hand-edited in sorted position for any new crate-root
    re-export, and the crate rustdoc.'
  why_required: Docs ship in the release that changes the code, never after it. tests/changelog.rs, tests/public_api.rs
    and tests/docs_drift.rs each fail the build otherwise.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.26.0-T06
  acceptance_criteria:
  - 'NF2 — **the dependency tree does not move on macOS or Linux.** `cargo tree` on the default feature
    set reads 402 lines after this release as before it. Windows may gain `windows-sys` *features* — they
    are compiled code, not tree lines — and any addition goes under `[target.''cfg(windows)''.dependencies]`
