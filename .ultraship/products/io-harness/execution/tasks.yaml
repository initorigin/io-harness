    a parameter added to an existing one (src/lib.rs:271).
  why_required: One of the two ways an image gets in, and the only one that does not involve the model
    choosing. Without it the caller cannot hand the agent the image the task is about, which is the release's
    headline sentence.
  status: done
  depends_on:
  - US-IO-HARNESS-0.15.0-T01
  acceptance_criteria:
  - 'N5 — additive only. No public item renamed or removed, captured as a public-surface diff by the method
    recorded in 0.13.0''s evidence. `CompletionRequest` gains a field, which is what src/provider/mod.rs:150
    says minor releases do, and the migration note for callers who construct it without `..Default::default()`
    is written rather than left to a compile error.

    '
  files:
  - src/run.rs
  - src/lib.rs
  evidence:
  - TaskContract::with_images; tests/media.rs a_provider_that_accepts_images_receives_the_contract_image_every_step
- id: US-IO-HARNESS-0.15.0-T04
  summary: 'The agent attaches an image itself: a built-in that takes a workspace path, dispatched in
    the same `match` as `read_file` (src/run.rs:2804) and gated on `Act::Read` against that path through
    `gate` (src/run.rs:3416), reading bytes through `Workspace::read_bytes`.'
  why_required: 'This is the half that needs the boundary: the model choosing which of the user''s files
    to send to a third party. It is the direct analogue of 0.14.0''s document built-ins and carries F1
    and F2, the release''s first refusal-plus-control pair.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.15.0-T01
  acceptance_criteria:
  - 'F1 — an agent-chosen image read is refused by the path policy on the path it targets. Under a policy
    denying `private/**`, asked to look at `private/badge.png`, the run is refused; no image reaches any
    request; the refusal is in the trace with the act, the real path, and the rule.

    '
  - 'F2 — the negative control for F1. The identical run under a permissive policy attaches the image
    and the request carries it, so F1 measures the boundary rather than a read that would have failed
    anyway.

    '
  files:
  - src/run.rs
  - src/tools/mod.rs
  evidence:
  - tests/media.rs — an_image_the_policy_denies_is_refused_and_never_reaches_the_provider, with its permissive
    control
- id: US-IO-HARNESS-0.15.0-T05
  summary: 'Byte bounds on media at three boundaries: what may enter a request, what is written to the
    trace (a digest, a size and a media type rather than the bytes), and what the 0.10.0 context accounting
    counts.'
  why_required: A long unattended run is what this crate exists for, and it is exactly where an unbounded
    image becomes a rusqlite store growing by megabytes per screenshot and a prompt budget that silently
    ignores the largest thing in it. The failure does not appear in a short test run, so the bound has
    to be built rather than observed.
  status: done
  depends_on:
  - US-IO-HARNESS-0.15.0-T01
  - US-IO-HARNESS-0.15.0-T04
  acceptance_criteria:
  - 'F5 — media is bounded at three boundaries. An image over the cap is refused with a clear error rather
    than truncated into an invalid one; the trace holds a digest, a size and a media type rather than
    the bytes; and the 0.10.0 context accounting sees the attachment rather than ignoring it because it
    is not text.

    '
  files:
  - src/run.rs
  - src/context.rs
  - src/state.rs
  evidence:
  - tests/media.rs — a_viewed_image_rides_one_request_and_is_then_dropped; the_trace_records_the_digest_and_the_size_rather_than_the_bytes
- id: US-IO-HARNESS-0.15.0-T06
  summary: A first-party gated spawner that runs a fixed argv under the policy, enforcing the whole argv
    rather than the program name, and recording the argv, the exit status and a bounded slice of output
    in the trace. `ExecGuard` is not extended to serve it.
  why_required: 'There is no way for a built-in to run a binary under policy today: `ExecGuard::exec`
    is private and reachable only by `compile_source` with an rustc argv (src/verify.rs:679), and `ExecGuard::check`
    enforces only the program name (src/verify.rs:248). Every git built-in runs through this, so the git
    half cannot start without it, and building it on the argv-blind path would reproduce the defect the
    release exists to avoid.'
  status: done
  depends_on: []
  acceptance_criteria:
  - 'F6 — the reachable git surface is fixed, asserted over the argv every built-in constructs. No reachable
    invocation contains `push`, `fetch`, `clone`, `remote`, `reset`, `checkout`, `rebase`, `stash`, `filter-branch`
    or `--force`. This is a test over the argv builders, so a later arm that adds one fails the suite
    rather than shipping.

    '
  files:
  - src/tools/git.rs
  evidence:
  - cargo test --lib tools::git — 11 passed; free-form argv impossible at the type level
- id: US-IO-HARNESS-0.15.0-T07
  summary: 'Git reads: history, working-tree status, and diff, as named built-ins constructing their own
    complete argv, gated on the paths they touch, with machine-readable NUL-separated output and a fixed
    environment — no pager, stable locale, no system or global config.'
  why_required: 'The read half is the smaller one and it proves the whole shape before anything irreversible
    is wired: the argv builders, the gate, the environment and the output parsing are the same ones the
    write half uses. A path with a space or a newline in it becoming two paths is a parsing bug that only
    NUL separation prevents.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.15.0-T06
  acceptance_criteria:
  - 'F12 — the end-to-end outcome. An agent edits several files and commits them; afterwards the log shows
    one commit with the message it was asked for and exactly the files it staged, the working tree is
    clean of those changes, and a file the agent did not stage is still uncommitted.

    '
  - 'N7 — git output parsing is version-stable. The porcelain and format flags used are ones git guarantees
    across versions, output is NUL-separated wherever paths appear, and the assertion runs against whatever
    git version each runner ships rather than against a pinned one.

    '
  files:
  - src/tools/git.rs
  - src/run.rs
  - src/tools/mod.rs
  evidence:
  - tests/git.rs — 9 passed; NUL-safe machine-readable output, fixed child environment
- id: US-IO-HARNESS-0.15.0-T08
  summary: 'Git writes: stage named paths and commit. `git_add` requires `Act::Read` on each path it stages,
    because staging copies the file''s bytes into the object store; `git_commit` requires `Act::Write`
    on the repository. Repository hooks are suppressed on every invocation, and the commit identity is
    explicit rather than inherited.'
  why_required: This is the outcome sentence — a run that ends as a commit. The read gate on staging is
    what stops a policy-denied file reaching a commit, and hook suppression is what stops the repository
    the agent was pointed at executing its own code under the agent.
  status: done
  depends_on:
  - US-IO-HARNESS-0.15.0-T07
  acceptance_criteria:
  - 'F8 — repository hooks do not run. A repository carrying a `.git/hooks/pre-commit` that writes a sentinel
    file is committed to and the sentinel is absent afterwards. The control is that the same hook does
    fire under a plain `git commit`, so the test measures suppression and not a hook that was never executable.

    '
  - 'F9 — the path policy governs staging. `git_add` of a path the policy denies for reading is refused,
    and the file is absent from the index afterwards — not merely unreported. The control is the same
    stage under a permissive policy, which succeeds and appears in the index.

    '
  - 'F12 — the end-to-end outcome. An agent edits several files and commits them; afterwards the log shows
    one commit with the message it was asked for and exactly the files it staged, the working tree is
    clean of those changes, and a file the agent did not stage is still uncommitted.

    '
  files:
  - src/tools/git.rs
  - src/run.rs
  evidence:
  - tests/git.rs — an_agent_stages_its_edits_and_commits_them; staging_a_path_the_policy_denies_for_reading_is_refused
    with its control
- id: US-IO-HARNESS-0.15.0-T09
  summary: 'The reachable git surface, asserted rather than described: a test over the argv every built-in
    constructs, and the argument-injection defence — pathspecs after `--`, a leading `-` refused, and
    a path containing spaces, quotes, newlines or shell metacharacters staged as that exact path.'
  why_required: 'Without this the design is a claim in a doc comment. It is also the release''s worst
    failure mode: a model-named path that becomes a flag converts a path-scoped capability into arbitrary
    git, and it ships looking like a working feature. Asserting over the builders means a later arm that
    adds a subcommand fails the suite instead of passing unnoticed.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.15.0-T08
  acceptance_criteria:
  - 'F6 — the reachable git surface is fixed, asserted over the argv every built-in constructs. No reachable
    invocation contains `push`, `fetch`, `clone`, `remote`, `reset`, `checkout`, `rebase`, `stash`, `filter-branch`
    or `--force`. This is a test over the argv builders, so a later arm that adds one fails the suite
    rather than shipping.

    '
  - 'F7 — a model-named path cannot become an argument. Pathspecs are passed after `--`; a path beginning
    with `-` is refused rather than escaped; a path containing spaces, quotes, a newline or a shell metacharacter
    is staged as that exact path and nothing is interpreted. Asserted for a path literally named `--upload-pack=x`,
    which is a valid filename and a live flag.

    '
  files:
  - src/tools/git.rs
  evidence:
  - every_shape_covers_every_variant; the_subcommand_is_always_one_of_the_five_this_crate_ships; evidence/0.15.0/git_argv_audit.md
- id: US-IO-HARNESS-0.15.0-T10
  summary: 'Commit idempotency across 0.7.0 durable resume: a run killed between the commit and its checkpoint
    resumes without taking the commit twice, following the ordering 0.7.0 established for exec replay.'
  why_required: A commit is the first genuinely irreversible action the crate can take, and 0.7.0's promise
    that an irreversible action already taken is not taken twice has never been tested against one. Being
    wrong here is invisible until a crash.
  status: done
  depends_on:
  - US-IO-HARNESS-0.15.0-T08
  acceptance_criteria:
  - 'F10 — a commit is not taken twice. A run killed between the commit and its checkpoint, then resumed,
    leaves exactly one commit with one parent, and the aggregate budget is not double-charged for the
    step.

    '
  files:
  - src/run.rs
  - src/state.rs
  evidence:
  - tests/git.rs — a_commit_interrupted_before_its_checkpoint_is_not_taken_twice
- id: US-IO-HARNESS-0.15.0-T11
  summary: 'Clean degradation when the `git` binary is absent: the capability reports itself unavailable
    as an observation the model can read and adapt to, and the run continues.'
  why_required: Git is a runtime capability and never a build dependency, so a consumer without it must
    get an error the agent can work around rather than a panic or a failed run. This is the same treatment
    a malformed regex gets from `grep`, and it is what keeps N3 true for consumers rather than only for
    the CI runners.
  status: done
  depends_on:
  - US-IO-HARNESS-0.15.0-T07
  acceptance_criteria:
  - 'F11 — no git binary is a clean absence. On a machine without `git`, the capability reports itself
    unavailable as an observation the model can read and adapt to, and the run continues; it does not
    panic and does not fail the run. The control is the same run where git is present.

    '
  - 'N3 — no system package installed on any of the three runners. `git` is preinstalled on ubuntu-latest,
    macos-latest and windows-latest, so this is satisfied by asserting its presence in CI rather than
    by installing it. A consumer without git gets F11''s clean absence, not a build failure — git is a
    runtime capability, never a build dependency.

    '
  files:
  - src/tools/git.rs
  - src/run.rs
  evidence:
  - tests/git.rs — no_git_binary_is_an_observation_and_the_run_carries_on; src/tools/git.rs a_missing_git_binary_is_an_unavailable_outcome_not_a_run_failure
- id: US-IO-HARNESS-0.15.0-T12
  summary: MCP image content passthrough, retiring the comment at src/mcp.rs:453 that discards non-text
    content because media is 0.11.
  why_required: An MCP tool that returns an image currently returns the string "(no text content)", which
    is a silent drop of exactly the kind this release exists to remove. The comment is a promise the crate
    has carried unfulfilled for four minors.
  status: done
  depends_on:
  - US-IO-HARNESS-0.15.0-T01
  acceptance_criteria:
  - 'F15 — an MCP tool returning image content passes it through to the model instead of returning "(no
    text content)", and the comment at src/mcp.rs:453 that promises this for 0.11 is gone rather than
    re-dated.

    '
  files:
  - src/mcp.rs
  evidence:
  - 'cargo test --features media --lib mcp:: — 11 passed; default build no-regression control passes'
- id: US-IO-HARNESS-0.15.0-T13
  summary: 'Resume from the stored policy: a new named entry point that recovers the policy a run was
    started under instead of requiring the caller to pass one.'
  why_required: 'Carried from 0.13.0 by the owner''s decision, and this release is why it now matters:
    a crashed run may already have committed under a policy the resuming caller cannot reconstruct, so
    resuming without it means an irreversible action was taken under a boundary that no longer applies.'
  status: done
  depends_on: []
  acceptance_criteria:
  - 'F13 — resume from the stored policy. A run started under a restrictive policy and killed is resumed
    through the new entry point without the caller passing a policy, and the action the original policy
    denied is still refused. The control is the same resume of a run started permissive, which is allowed
    — so the test shows the policy was recovered rather than that everything is denied on resume.

    '
  files:
  - src/run.rs
  - src/lib.rs
  evidence:
  - tests/policy.rs — a_run_resumed_from_its_stored_policy_is_still_bounded_by_it, its permissive control,
    and the no-recorded-policy refusal
- id: US-IO-HARNESS-0.15.0-T14
  summary: '`fill_form` generates real appearance streams rather than setting `/NeedAppearances` and deleting
    the stale `/AP`.'
  why_required: 'Carried from 0.14.0 by the owner''s decision as that release''s weakest claim: a value
    a viewer shows blank is not a filled form. `lopdf` is already in the tree and no rasterisation is
    involved, so the fix stays inside the no-system-package constraint.'
  status: done
  depends_on: []
  acceptance_criteria:
  - 'F14 — `fill_form` generates an appearance stream. A filled field carries an `/AP` normal appearance
    whose content stream contains the value, rather than only `/V` and a `/NeedAppearances` request to
    the viewer. The control: filling a field with an empty value leaves no stale appearance behind claiming
    the old one.

    '
  files:
  - src/tools/documents/pdf.rs
  evidence:
  - 'cargo test --features pdf --lib tools::documents::pdf:: — 22 passed; appearance stream asserted on
    decoded bytes with an empty-value control'
- id: US-IO-HARNESS-0.15.0-T15
  summary: 'Release surface: doc comments stating each capability''s limits where a caller meets them,
    the CHANGELOG entry including why video was cut from the roadmap, README and crate-docs discoverability
    for the `media` feature, the default dependency-tree assertion, the migration note for `CompletionRequest`,
    and the evidence set under `evidence/0.15.0/`.'
  why_required: The dependency-tree assertion is the constraint the whole release is held to, and the
    video cut is the thing a reader who remembers the roadmap will look for and, not finding it, read
    as an oversight. Neither is documentation about the work; both are acceptance criteria.
  status: done
  depends_on:
  - US-IO-HARNESS-0.15.0-T05
  - US-IO-HARNESS-0.15.0-T09
  - US-IO-HARNESS-0.15.0-T11
  - US-IO-HARNESS-0.15.0-T12
  - US-IO-HARNESS-0.15.0-T13
  - US-IO-HARNESS-0.15.0-T14
  acceptance_criteria:
  - 'N1 — the default build is unchanged. `cargo tree` for a default `cargo build` is asserted at 401
    lines, identical to 0.13.0 and 0.14.0. The image half is behind a feature because it adds `base64`
    as a direct dependency; the git half adds no crate at all.

    '
  - 'N2 — the msrv leg passes at the declared 1.88 floor with every feature enabled. If the floor moves
    it moves deliberately, is stated in `Cargo.toml` and the CHANGELOG, and is not discovered by a red
    CI run.

    '
  - 'N4 — five-leg CI green with the git tests running on all three OSes. This is load-bearing rather
    than routine: `core.autocrlf` defaults differently on Windows, path separators differ, and a file-mode
    change is a diff on one platform and not on another. A Linux-only pass would not be evidence.

    '
  - 'O1 — each capability''s doc comment states its limits where a caller meets them: images only, no
    video and no audio; git is local-only with a reachable surface that is fixed and enumerated; git requires
    the binary at runtime; commits land on the current branch; hooks do not run, and that this is deliberate.

    '
  - 'O2 — the CHANGELOG says video was cut from the roadmap and why, with the provider evidence. A reader
    who remembers the roadmap promised it should find the reason in the release notes rather than infer
    an oversight.

    '
  - 'O3 — the media feature is discoverable: named in the README and the crate docs with the one line
    a consumer needs to enable it.

    '
  - 'O4 — the live-run transcript, the public-surface diff, the default-dependency-tree comparison and
    the git argv audit are stored under `evidence/0.15.0/`.

    '
  files:
  - CHANGELOG.md
  - README.md
  - Cargo.toml
  - .github/workflows/ci.yml
