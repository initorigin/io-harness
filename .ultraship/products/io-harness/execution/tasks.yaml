product: io-harness
version: 0.16.2
tasks:
  - id: US-IO-HARNESS-0.16.2-T01
    summary: >
      Reproduce the docs.rs failure locally on nightly with the `docsrs` cfg set, before changing
      anything, and record the toolchain version alongside the output.
    why_required: >
      The defect exists because no command this repository runs can see it. Fixing it without first
      reproducing it would mean the fix is verified by the same stable `cargo doc` that passed on
      the broken tree for two releases. This task is also the release's negative control: without
      the pre-fix failure on this exact toolchain, a passing post-fix build proves nothing.
    status: done
    depends_on: []
    acceptance_criteria:
      - >
        F3 — the same command on the pre-fix tree fails with "feature has been removed", establishing
        that the check discriminates rather than passing on everything. This is the negative control
        the crate requires of every gate it ships.
    files:
      - src/lib.rs
    evidence:
      - >
        rustc 1.99.0-nightly (09ee43b2d 2026-07-27), recorded in evidence/0.16.2/toolchain.txt —
        after 1.92.0, so the removal is in effect and the control is not vacuous.
      - >
        `RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features --no-deps` on the pre-fix line
        fails with `error[E0557]: feature has been removed` at src/lib.rs:220:29, noting "removed in
        1.92.0" and "merged into `doc_cfg`" — the docs.rs build log's error, reproduced verbatim off
        the builder. Output at evidence/0.16.2/doc-nightly-negative-control.txt.
  - id: US-IO-HARNESS-0.16.2-T02
    summary: >
      Replace `feature(doc_auto_cfg)` with `feature(doc_cfg)` in the crate root's `cfg_attr(docsrs,
      ...)` gate, and extend the comment above it to record why the name changed.
    why_required: >
      This line is the release. It is the only reason docs.rs has no page for 0.16.0 or 0.16.1, and
      without the change 0.16.2 would fail its build for the third consecutive time.
    status: done
    depends_on:
      - US-IO-HARNESS-0.16.2-T01
    acceptance_criteria:
      - >
        F1 — `src/lib.rs` contains `#![cfg_attr(docsrs, feature(doc_cfg))]` and no occurrence of
        `doc_auto_cfg` anywhere in the repository outside CHANGELOG.md and the sealed release records.
      - >
        F2 — `RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features --no-deps` exits 0 on a
        nightly at or after 1.92.0, emitting no warning and no `unexpected_cfg` diagnostic.
    files:
      - src/lib.rs
    evidence:
      - >
        src/lib.rs:220 is `#![cfg_attr(docsrs, feature(doc_cfg))]`, with three comment lines above it
        naming the removal, the upstream PR, and the 0.16.1 build that failed on the old name.
      - >
        The same nightly command now exits 0 with no warning (evidence/0.16.2/doc-nightly.txt) — the
        only difference from T01 being the feature name.
      - >
        The labelling still happens, which is what the gate is for: the rendered HTML under
        target/doc/io_harness carries "Available on crate feature `x` only" for barcode, docx, media,
        pdf, pptx and xlsx. `doc_cfg` performs the automatic labelling itself since the merge, so no
        per-item `#[doc(cfg(...))]` attribute was needed.
  - id: US-IO-HARNESS-0.16.2-T03
    summary: >
      Bump the version to 0.16.2 in Cargo.toml and Cargo.lock, and write the CHANGELOG `[0.16.2]`
      section under Fixed.
    why_required: >
      A published version's sources are immutable, so the only way this fix reaches docs.rs is a new
      version. The CHANGELOG entry is where a reader learns that the missing 0.16.0 and 0.16.1 pages
      are not coming back, which is the one thing about this release they cannot infer.
    status: done
    depends_on:
      - US-IO-HARNESS-0.16.2-T02
    acceptance_criteria:
      - >
        F4 — CHANGELOG.md has a `[0.16.2]` section under `Fixed` that names `doc_auto_cfg`, links
        rust-lang/rust#138907, states there is no behaviour change, and states that 0.16.0 and 0.16.1
        remain unbuildable on docs.rs.
    files:
      - Cargo.toml
      - Cargo.lock
      - CHANGELOG.md
    evidence:
      - >
        Cargo.toml and Cargo.lock both read 0.16.2. The CHANGELOG `[0.16.2]` section opens by stating
        there is no breaking and no behaviour change, explains under Fixed that the build failed for
        both 0.16.0 and 0.16.1, names the removed feature and links the upstream PR, and closes by
        saying the two published versions stay unbuildable and 0.16.2 is the first 0.16 with a page.
  - id: US-IO-HARNESS-0.16.2-T04
    summary: >
      Run the standing release gates on stable — the full suite including the five checkers, clippy,
      fmt, `cargo package`, the public-surface diff and the dependency-tree line count.
    why_required: >
      The CI wait is waived for this release, so the local run is the only evidence that the change
      broke nothing. A one-line change is the easiest kind to ship untested and the cheapest kind to
      verify.
    status: done
    depends_on:
      - US-IO-HARNESS-0.16.2-T03
    acceptance_criteria:
      - >
        NF1 — no public API change. `git diff origin/main -- src/ | grep -E "^[-+]\s*pub "` is empty
        for the whole branch, and `tests/public_api.rs` passes against the unchanged snapshot.
      - >
        NF2 — the five 0.16.0 checkers stay green with no test edited to accommodate the change:
        `readme`, `public_api`, `docs_drift`, `changelog`, `guide_pages`. `changelog` is the one this
        release could plausibly break, since it inspects the file being edited.
      - >
        NF3 — `cargo test`, `cargo clippy --all-targets -- -D warnings`, and `cargo fmt --check` all
        exit 0 on stable, MSRV stays 1.88, and the default `cargo tree` stays at 401 lines.
      - >
        NF4 — `cargo package` succeeds and the packaged `.crate` is inspected for a `.env`, a
        secret-shaped path, or any file the `exclude` list should have caught.
    files: []
    evidence:
      - >
        cargo test — 603 passed, 0 failed across every target including the doctests, exit 0
        (evidence/0.16.2/tests-default.txt). Same total as 0.16.1, as expected of a release that adds
        no test and changes no behaviour.
      - >
        NF2 — the five checkers pass with no test file edited: changelog 5/5, docs_drift 10/10,
        guide_pages 7/7, public_api 9/9, readme 8/8. `changelog` inspects the file this release
        edits and passes on the new `[0.16.2]` section unmodified.
      - >
        cargo clippy --all-targets -- -D warnings — exit 0 (evidence/0.16.2/clippy.txt).
        cargo fmt --check — exit 0 (evidence/0.16.2/fmt.txt).
      - >
        NF1 — `git diff origin/main -- src/ | grep -E "^[-+]\s*pub "` returns nothing for the whole
        branch, and the public-surface snapshot is untouched. NF3 — default `cargo tree` is 401
        lines, the standing constraint, unchanged.
      - >
        cargo package — io-harness-0.16.2.crate, 118 files, 564 KiB compressed, verification build
        exit 0 (evidence/0.16.2/package.txt, package-list.txt). Inspected: no `.env`, no
        `.ultraship/`, no `.github/`, no secret-shaped path.
      - >
        Secrets gate — `.env` is matched by `.gitignore:10` and untracked, and the branch diff
        contains no secret-shaped assignment.
