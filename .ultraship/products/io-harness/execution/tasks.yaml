product: io-harness
version: 0.24.0
tasks:
- id: US-IO-HARNESS-0.24.0-T01
  summary: Make the task contract's success criterion optional. `TaskContract::workspace` drops its
    third positional `Verification` and defaults to `Verification::None`; a `with_verification` builder
    joins the seventeen already on the type. Every call site in `src/`, `tests/`, `examples/` and the
    compiled doctests moves. README's first example and `docs/guide/permissions.md`'s first example
    lead with `Session` rather than `run_with`.
  why_required: 'The positioning fix is the one piece of this release whose cost doubles if it moves:
    shipping an API break now and this break later makes every consumer migrate twice. It is also the
    smallest and most mechanical task in the release, so it goes first and is never what drops.'
  status: done
  depends_on: []
  acceptance_criteria:
  - 'F11 — the positioning fix compiles and defaults correctly. `TaskContract::workspace(goal, root)`
    takes two arguments and yields `Verification::None`; `.with_verification(v)` sets it; the README''s
    first example and `docs/guide/permissions.md`''s first example both lead with `Session`. **Amended
    by `US-IO-HARNESS-0.24.0-I01`:** the original clause also required both to "compile as doctests",
    which is false of this repository — there is no `include_str!` of the README into the crate root
    and `cargo test --doc` compiles only `///` and `//!` comments under `src/`. The markdown is checked
    as text by `tests/readme.rs`, `tests/guide_pages.rs` and `tests/docs_drift.rs`. Making the clause
    true would mean changing how the crate documents itself, which is not this release''s work.

    '
  files:
  - src/contract.rs
  - README.md
  - docs/guide/permissions.md
  - docs/guide/sessions.md
  evidence:
  - '`TaskContract::workspace(goal, root)` is two-argument and defaults to `Verification::None`; `with_verification`
    added. 173 call sites converted across src/, tests/, examples/, docs/ and README.md; zero three-argument
    call sites remain outside the pinned 0.22.0 fixture and the changelog''s own history.'
  - README.md and docs/guide/permissions.md both lead with `Session`; `run_with` kept and documented
    as the one-shot form.
  - 'F11 is only PARTLY met: its clause ''both compile as doctests'' cannot be satisfied — the README
    and guide fences are not compiled doctests in this crate (no `include_str!` of README into the crate
    root; `cargo test --doc` covers only `///` and `//!` in src/). Both examples were made correct Rust
    and verified by the text-level tests that do exist. Raised for /ultraship:iterate.'
- id: US-IO-HARNESS-0.24.0-T02
  summary: 'Add the `list_dir` tool: one directory, one level, entries with type and size, path-resolved
    and checked against `Act::Read` through `Workspace::check_path`. Registered in `workspace_tools()`,
    dispatched in `run.rs`, and added to `RESERVED_TOOL_NAMES`.'
  why_required: Without it there is no way to ask what is in a directory — `find` walks the whole tree
    against a glob, which is a different question. It is the first thing anyone does in an unfamiliar
    repository and the release's outcome names it.
  status: done
  depends_on: []
  acceptance_criteria:
  - 'F10 — `list_dir` lists one level and no more. A directory containing a subdirectory containing
    a file returns the subdirectory and not the file; a path outside the workspace is refused; a directory
    the policy denies reading is refused by path.

    '
  files:
  - src/tools/workspace.rs
  - src/tools/mod.rs
  - src/run.rs
  - tests/
  evidence:
  - '`list_dir` lists one directory one level deep, path-resolved through the same `Act::Read` check
    `read_file` uses; `find` unchanged.'
  - '`cargo test --test list_dir` — 12 passed, 0 failed, covering all three clauses of F10 at both the
    `Workspace` level and through a real run, plus symlink-not-followed, deterministic ordering and
    the truncation bound.'
- id: US-IO-HARNESS-0.24.0-T03
  summary: 'The shell lexer and parser, pure — no execution. An allowlist lexer where any byte outside
    the permitted set for the current state is a refusal, over a conservative POSIX subset: quoted and
    escaped words, `|`, `;`, `&&`, `||`, and the `>` `>>` `<` `2>` `2>>` `2>&1` redirects. Every excluded
    construct refused by name with a reason. Depth and length caps. Property test over generated input
    plus the sabotage runs that prove it non-vacuous.'
  why_required: This is the release's entire security argument. A line that parses to a different set
    of sub-commands than it executes means the harness checked something other than what ran, which
    is worse than having no shell at all because the trace would assert a boundary that was never applied.
    Nothing downstream can be trusted until this is closed.
  status: done
  depends_on: []
  acceptance_criteria:
  - 'F4 — the refusal set is complete and fails closed, and this is the load-bearing criterion of the
    release. Every construct in the excluded grammar has a test asserting it is refused, that the reason
    names the construct, and that no process was spawned. Beyond the enumerated list, a property test
    over generated input asserts the invariant directly: **any input containing a byte outside the lexer''s
    permitted set for its state is refused**. Non-vacuity is proven the way 0.23.0 proved its cross-version
    tests — by sabotage: the allowlist is widened by one byte, the property test must fail, and the
    change is reverted.

    '
  - 'NF3 — the parser terminates on adversarial input within a bound. Nesting depth is capped, input
    length is capped, and both refusals are ordinary refusals with reasons. No input causes unbounded
    recursion, unbounded allocation, or a stack overflow — asserted by the property test in F4 running
    against deeply nested and pathologically long inputs.

    '
  files:
  - src/tools/shell.rs
  - tests/
  evidence:
  - '`cargo test --lib tools::shell` — 19 passed, 0 failed. Two sweep the entire ASCII range: every
    character outside the permitted set is refused, and no character silently creates a sub-command.'
  - 'Non-vacuity proven by eight sabotage runs, each caught by a NAMED test, evidence in `.ultraship/evidence/0.24.0/shell-parser-sabotage.txt`.
    Two of them found defects in the TESTS rather than the parser: the property test''s oracle was written
    as `is_bare_word_char(c)` — the function under test — so widening the allowlist widened the expectation
    with it and a parser permitting an unquoted `$` passed everything. The oracle is now a literal character
    list.'
  - 'Zero new dependencies: the parser is written in-crate. `yash-syntax` from the roadmap is GPL-3.0-or-later
    and unusable in an Apache-2.0 crate designed to be linked into another program; `brush-parser` measured
    at +37 crates on the default feature set.'
- id: US-IO-HARNESS-0.24.0-T04
  summary: 'The `shell` tool: parse, then check every sub-command''s resolved program and argv against
    `Act::Exec` and every redirect target against `Act::Write` or `Act::Read` — all before any spawn
    — then execute, wiring the pipeline between argv-spawned children with no host shell anywhere. `cd`
    handled as the one builtin, path-resolved and unable to escape the root.'
  why_required: This is the outcome the release is named for. Without it the parser is unreachable and
    the capability gap that blocks non-coding work stays open.
  status: done
  depends_on:
  - US-IO-HARNESS-0.24.0-T03
  acceptance_criteria:
  - 'F1 — a real command line runs under a checked boundary. `cd infra && kubectl get pods | grep CrashLoop`
    executes under a policy allowing `kubectl*` and `grep*`, and the trace afterwards carries one policy
    decision per sub-command naming the rule and layer that allowed it — read back through the public
    `Store` API, not from logs.

    '
  - 'F2 — a denied stage refuses the whole line and nothing executes. The same pipeline under a policy
    that denies `grep*` is refused before any process is spawned, the refusal names the stage and the
    rule, and the negative control is observable rather than argued: a first stage with a side effect
    on disk — `kubectl get pods > out.txt | grep x` shaped so the first stage would write — leaves no
    file behind. Every check happens before any spawn.

    '
  - 'F3 — redirect targets are checked by path, not by name. `cmd > ../outside.txt` is refused by the
    workspace path rules even when `cmd` is allowed; `cmd > allowed/out.txt` succeeds; `cmd < secrets/key`
    is refused as a read. Each goes through `Workspace::check_path`, proven by a policy whose deny rule
    is a path pattern that no name match would catch.

    '
  files:
  - src/tools/shell.rs
  - src/run.rs
  - src/tools/mod.rs
  - tests/
  evidence:
  - '`cargo test --test shell` — 10 passed, 0 failed, covering F1, F2 and F3.'
  - 'F2''s negative control is the load-bearing one: a first stage with a side effect on disk leaves
    no file when a later stage is denied, and the same line under a permissive policy does create it.'
  - Paths are resolved once into a plan and the runner opens exactly what was checked. Resolving at
    run time would have had the policy check `out.txt` while the process wrote `src/out.txt` after a
    `cd`.
- id: US-IO-HARNESS-0.24.0-T05
  summary: The `#[non_exhaustive]` rider on `CompletionRequest`, `CompletionResponse`, `EventKind` and
    `Backend`, none of which carries it and none of which has any use of the attribute in `src/` today.
    Regenerate `docs/public-api.txt`; add a `BREAKING` entry with a `*Migration:*` note per break, the
    pairing enforced by the existing `tests/changelog.rs`.
  why_required: 0.22.0 already broke literals of three of these and this release adds `EventKind` variants
    and gives `Backend` a value it has never returned. This is the cheapest moment the attribute will
    ever cost, and 0.25.0's AppContainer variant is the next thing that would otherwise break an exhaustive
    match.
  status: done
  depends_on:
  - US-IO-HARNESS-0.24.0-T01
  acceptance_criteria:
  - 'F12 — the four types carry `#[non_exhaustive]` and the breaks are documented to the same standard
    0.23.0 held. `docs/public-api.txt` reflects the surface, `tests/public_api.rs` passes against it,
    and the changelog carries a `BREAKING` entry with a `*Migration:*` note per break — pairing enforced
    by the existing `tests/changelog.rs`.

    '
  files:
  - src/provider/mod.rs
  - src/observe.rs
  - src/sandbox.rs
  - docs/public-api.txt
  - CHANGELOG.md
  evidence:
  - 'DONE: `#[non_exhaustive]` on `EventKind`, `Backend` and `Cap` (the enums), which applied with zero
    breakage inside the crate. The `Cap` doctest carries the wildcard arm the change requires.'
  - '`CompletionRequest` and `CompletionResponse` removed from the rider by `US-IO-HARNESS-0.24.0-I01`,
    owner-approved, with the measured evidence recorded there. `Cap` added to it in their place, since
    `Cap::Processes` breaks it this release anyway.'
  - '`cargo test --doc` — 239 passed, 0 failed. The `Cap` doctest carries the wildcard arm the attribute
    requires, so it is the migration note as well as the test.'
- id: US-IO-HARNESS-0.24.0-T08
  summary: The Windows Job Object resource backend. `windows-sys` under `[target.'cfg(windows)'.dependencies]`,
    job creation, child assignment before the child runs, memory / CPU / active-process limits from
    the existing `JobLimits` mapping, kill-on-close, and `Backend::WindowsJobObject` reported where
    `PortableFloor` is reported today. Every `unsafe` block carries a safety comment.
  why_required: '`shell_kill` on Windows without a job leaks grandchildren, so the handle feature from
    T06 is not correct on that platform without this — which is why the two are one release rather than
    two. It also makes Windows the first backend anywhere to enforce `SandboxLimits::max_processes`.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.24.0-T06
  acceptance_criteria:
  - 'F6 — killing kills the tree, including on Windows. A sandboxed run whose command spawns a child
    that spawns a grandchild is stopped, and all three are gone. The negative control is the one that
    makes the Job Object worth its cost: the same test with the job disabled must leave the grandchild
    running on Windows, so the criterion proves containment rather than coincidence. **Amended by `US-IO-HARNESS-0.24.0-I01`:**
    originally written in terms of killing a process *handle*; handles are deferred to 0.25.0, so this
    is asserted through the sandbox''s own spawn path, which closes the same job handle by the same
    mechanism. The handle-initiated form of this criterion goes to 0.25.0 with the handles.

    '
  - 'F8 — `max_processes` is enforced on Windows, for the first time on any platform. A command that
    attempts to exceed the configured active-process limit is stopped by the job rather than by the
    wall clock, and the failure is attributed to the process limit in the trace. `Backend:: WindowsJobObject`
    is what the sandbox reports on that platform, replacing `PortableFloor`.

    '
  - 'F9 — memory and CPU are real bounds on Windows. A child exceeding its CPU allotment is terminated
    by the job. A child exceeding the job''s memory limit is refused the memory: **amended by `US-IO-HARNESS-0.24.0-I01`**,
    because `JOB_OBJECT_LIMIT_PROCESS_MEMORY` makes the offending allocation fail rather than terminating
    the process, and the original wording described something the Win32 API does not do. What must be
    shown is unchanged in force — the process is never permitted to hold more than the cap, and the
    outcome is asserted against the recorded cap reason so a wall-clock timeout cannot pass as either.

    '
  files:
  - Cargo.toml
  - src/sandbox/windows.rs
  - src/sandbox.rs
  - tests/
  evidence:
  - Job created, child assigned while `CREATE_SUSPENDED` then resumed, limits set from the existing
    `JobLimits`, `Backend::WindowsJobObject` reported. Every `unsafe` block carries a SAFETY comment.
  - 'NF2 verified on the host: `cargo tree` is 402 lines and contains no `windows` crate at all. `windows-sys`
    is under `[target.''cfg(windows)''.dependencies]`.'
  - 'NOT VERIFIED BY EXECUTION: no Win32 path has run. `cargo check --target x86_64-pc-windows-msvc`
    cannot pass `libsqlite3-sys`''s build script on macOS, so the sandbox module was mirrored into a
    scratch crate to type-check every Win32 signature, the feature set and the `Send` bound under that
    target. F6, F8 and F9 rest on the first CI Windows run.'
  - 'F9''s memory clause does not match Windows semantics: `JOB_OBJECT_LIMIT_PROCESS_MEMORY` makes an
    allocation FAIL rather than terminating the process. Documented as such rather than claimed as a
    kill. Raised for /ultraship:iterate.'
- id: US-IO-HARNESS-0.24.0-T09
  summary: 'Documentation and dependency accounting. The README platform table''s Windows row states
    native resource containment — memory, CPU, process count, tree kill — and no filesystem or network
    boundary, in the same row. `docs/CONTRACT.md` updated in both directions: `max_processes` is no
    longer enforced by nothing, and the shell''s refusal set becomes part of the public contract. `cargo
    tree` line counts recorded per platform.'
  why_required: The Windows row is a claim about a security boundary that does not exist; shortened
    to "Native" it says the opposite of the truth. And the refusal set is something a consumer needs
    before they write a policy, so it is contract rather than implementation detail.
  status: in-progress
  depends_on:
  - US-IO-HARNESS-0.24.0-T04
  - US-IO-HARNESS-0.24.0-T08
  acceptance_criteria:
  - 'OP3 — the README platform table''s Windows row states native resource containment (memory, CPU,
    process count, tree kill) **and** no filesystem or network boundary, in the same row. Reviewed as
    a criterion because the shortened version — "Native" — is the failure mode, and it is a claim about
    a security boundary that does not exist.

    '
  - 'OP4 — `docs/CONTRACT.md` updated in both directions: `SandboxLimits::max_processes` is no longer
    "enforced by nothing" and says which platform enforces it, and the shell tool''s refusal set is
    documented as part of the public contract rather than as an implementation detail, because a consumer
    needs to know what their agent cannot express.

    '
  - 'NF2 — **the macOS and Linux dependency trees do not move.** `cargo tree` on the default feature
    set reads the same 402 lines after this release as before it. The only new dependency is `windows-sys`
    under `[target.''cfg(windows)''.dependencies]`, and its transitive cost is reported separately as
    a Windows-only figure. This is checkable and it is the strongest single argument for the in-crate
    parser, so it is a criterion rather than a note.

    '
  files:
  - README.md
  - docs/CONTRACT.md
  - CHANGELOG.md
  evidence:
  - Platform table corrected in all three places it appears — crate root, README.md, docs/CONTRACT.md
    — each stating resource containment only, with no filesystem or network boundary.
  - '`docs/guide/command-execution.md` documents the `shell` tool; `docs/guide/tools-and-skills.md`
    reserved-name list updated.'
  - CHANGELOG 0.24.0 section written with a BREAKING entry and a `*Migration:*` note per break; `cargo
    test --test changelog` passes.
  - 'REMAINING: `docs/CONTRACT.md` still needs the shell refusal set recorded as part of the public
    contract (OP4).'
- id: US-IO-HARNESS-0.24.0-T10
  summary: 'The release gates: full suite on macOS, Linux and Windows; `cargo fmt --check`; `cargo clippy
    --all-targets -- -D warnings` with `unsafe_op_in_unsafe_fn` denied; the nightly all-features doc
    build; `cargo package --locked` with the tarball listed rather than assumed; the MSRV re-checked
    by hand against whatever `windows-sys` requires; and the live provider run in which the model composes
    a shell line itself.'
  why_required: The release is `published` mode. Every one of these is a refusal `release.yml` will
    make on `main` anyway, and the live run is the only evidence that the feature works against a real
    model rather than against tests written by the same hand that wrote the code.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.24.0-T05
  - US-IO-HARNESS-0.24.0-T07
  - US-IO-HARNESS-0.24.0-T09
  acceptance_criteria:
  - 'NF1 — the full suite passes on macOS, Linux and Windows. No test skipped, ignored or made conditional
    to get there. Windows carries more new code than either other platform in this release and is where
    the Job Object tests live, so a Windows-only failure is a release blocker rather than a flake to
    re-run — with the standing exception of `skills::discovery_over_a_32_skill_directory_is_under_50ms`,
    a known wall-clock assertion.

    '
  - 'NF4 — `cargo doc` is warning-free and docs.rs builds with all features, checked by the existing
    nightly job before publication rather than after.

    '
  - 'NF5 — every `unsafe` block added for the Win32 calls carries a safety comment stating the invariant
    it relies on, and `cargo clippy --all-targets -- -D warnings` is clean with `unsafe_op_in_unsafe_fn`
    denied. This crate has no Win32 FFI today; the standard it enters at is set here.

    '
  - 'OP1 — a real end-to-end run against a live provider in which the model composes a shell line itself,
    it is parsed, checked and executed, and the trace is read back afterwards. One run, one workspace,
    one verified outcome. Evidence is OpenRouter unless another key exists, per the standing credential
    position.

    '
  - 'OP2 — MSRV re-checked and stated. If `windows-sys` or anything it pulls raises the floor above
    1.95, the new number goes in `Cargo.toml` with the same honest comment the existing floor carries,
    naming the dependency that set it — and it is checked by hand rather than trusted from a manifest,
    which is the lesson 0.23.0 paid for.

    '
  - 'OP5 — `cargo package --locked` exits 0 and the tarball carries no `.env`, no `.ultraship` and no
    `.github`, verified by listing rather than assumed from the `exclude` list.

    '
  files:
  - .github/workflows/
  - Cargo.toml
  - examples/
  evidence: []
