product: io-harness
version: 0.12.0
tasks:
- id: US-IO-HARNESS-0.12.0-T01
  summary: 'Close three shipped-but-unreachable defects, each one site. `Store::open` sets `journal_mode=WAL`
    and a `busy_timeout` so a store the crate hands out is safe for a second reader without that reader
    configuring the file behind the API''s back. The request deadline becomes overridable by a caller:
    `REQUEST_TIMEOUT` and `http_client_with_timeout` (`src/net.rs:40,62`) and the three `pub(crate) fn
    at` provider constructors are unreachable, so 0.11.0''s O4 shipped as documentation of a capability
    nobody has. `Containment.max_total_duration` (`src/containment.rs:40`) becomes enforced.'
  why_required: Three defects that make the crate's own documentation false. 0.11.0's record claims the
    deadline is overridable and every path to it is `pub(crate)`; a tree can be given a duration ceiling
    that is silently ignored, which is a containment hole on a 24-hour run; and a store the crate opens
    cannot safely be read by anything else, which is the coupling the observer exists to remove. None
    depends on any feature in this release, so they land first.
  status: done
  depends_on: []
  acceptance_criteria:
  - 'F6 — a store the crate opens is safe for a second reader. `Store::open` sets WAL and a busy timeout;
    asserted by a concurrent reader on the same file that neither blocks the writer nor aborts, using
    no pragmas of its own.

    '
  - 'F17 — the request deadline is overridable by a caller. Asserted from an integration test, which is
    the only place that proves the item is actually public — the 0.11.0 criterion that claimed this was
    satisfied by a `pub(crate)` path reachable only from inside the crate.

    '
  - 'F16 — a tree halts on its duration ceiling. `Containment.max_total_duration` is enforced; asserted
    by a tree that crosses it and stops. It is silently ignored today.

    '
  files:
  - src/state.rs
  - src/net.rs
  - src/provider/openrouter.rs
  - src/provider/anthropic.rs
  - src/provider/openai.rs
  - src/containment.rs
  - tests/net.rs
  evidence:
  - Store::open sets WAL + public BUSY_TIMEOUT (5s); tests/store_open.rs 4 passed. WAL asserted from a
    plain second connection with no pragmas of its own.
  - with_timeout(Duration) added public on OpenRouter/Anthropic/OpenAi; REQUEST_TIMEOUT public at the
    crate root and per provider module. tests/deadline.rs 2 passed, as an INTEGRATION test because that
    is the only thing that proves the item is reachable from outside the crate -- the exact mistake 0.11.0's
    O4 made.
  - Containment::max_total_duration enforced against the ROOT run's started_at; max_total_cost documented
    as inert with the reason (no price telemetry). tests/subagents.rs 12 passed, including a tree with
    no ceiling still reaching its step cap unchanged.
- id: US-IO-HARNESS-0.12.0-T02
  summary: Make an outcome terminal and an audit table readable. `finish_run(run_id, "refused")` (`src/run.rs:1801`)
    gains a `RunOutcome` variant and a `terminal_outcome` mapping (`src/run.rs:630-651`), so resuming
    a network-refused run reports what happened instead of falling back into the loop. `AgentEvent` and
    `SpawnRow` are re-exported from `src/lib.rs`, so `Store::agent_events` stops returning a `Vec` of
    a type no external caller can name.
  why_required: '`"refused"` is the same defect 0.11.0 fixed for `"escalated"` — an outcome string with
    no variant and no mapping, so a resumed run silently re-runs. And `agent_events` is the only audit
    of per-step budget draws; an observability release cannot ship leaving it unreadable through the public
    API.'
  status: done
  depends_on: []
  acceptance_criteria:
  - 'F14 — a refused run is terminal on resume. `"refused"` (`src/run.rs:1801`) maps through `terminal_outcome`
    to its own outcome, so resuming reports what happened instead of re-entering the loop. A regression
    test that fails against 0.11.0, in the shape of 0.11.0''s own F10.

    '
  - 'F15 — `agent_events` is readable through the public API. `AgentEvent` and `SpawnRow` are nameable,
    so an external consumer can read the per-step budget-draw audit without opening the SQLite file. Asserted
    from an integration test, which is where the public surface is visible.

    '
  files:
  - src/run.rs
  - src/lib.rs
  - src/state.rs
  - tests/checkpoint.rs
  evidence:
  - 'RunOutcome::Refused added and mapped in terminal_outcome. Regression proven by deleting the arm:
    the resumed run reported Success { steps: 1 } because resume() substitutes Policy::permissive() +
    ApproveAll, so a human-refused run was resumed under a permissive policy and completed. tests/net.rs
    10 passed; the test counts approver calls, since ''not asked twice'' is not observable from the outcome.'
  - AgentEvent and SpawnRow re-exported from src/lib.rs, so the agent_events budget-draw audit is readable
    through the public API.
- id: US-IO-HARNESS-0.12.0-T03
  summary: Remove the determinism leaks and the trace dishonesty the audit found. `run_id` comes out of
    the rendered memory note (`src/context.rs:545-549`), which today sends different prompt bytes for
    the same case because `run_id` is an `AUTOINCREMENT`. Sub-agent results compose in spawn order rather
    than `buffer_unordered` completion order (`src/run.rs:1401-1408`). The single-file loop back-fills
    `reported_tokens` as the other two loops do. `context_events` stops conflating a replan and a terminal
    stall under one `stalled` kind. The documented-but-never-emitted `sandbox_events` `net_deny` kind
    is emitted or removed from the docs.
  why_required: A replay that returns the recorded responses but still varies the prompt bytes or the
    child ordering would look like it worked and would silently invalidate every measurement built on
    it. These fixes must precede the replay work, not follow it, or the replay tests will be written against
    a moving target.
  status: done
  depends_on:
  - US-IO-HARNESS-0.12.0-T02
  acceptance_criteria:
  - 'NF6 — no regression. All 341 tests shipped at 0.11.0 pass unless one asserted a behaviour this release
    deliberately changes, and each such test is named in the record with why its old assertion was wrong.
    The likely casualties are tests asserting the memory note''s rendered text, which currently contains
    `run_id`, and any test asserting child-result order.

    '
  files:
  - src/context.rs
  - src/run.rs
  - src/state.rs
  - tests/context.rs
  - tests/memory.rs
  - tests/subagents.rs
  evidence:
  - 'Children composed in spawn order: buffer_unordered -> buffered. Negative control in tests/subagents.rs
    shows the old code returning child 5,4,3,2 for a spawn order of 0,1,2,3.'
  - run_id removed from the rendered memory note (src/context.rs), so the same case sends the same prompt
    bytes twice. step kept -- it is a stored column, stable across replays. New test asserts the rendered
    block is byte-identical across run_ids 1, 2 and 9999.
  - context_events splits replan from stalled; four stall assertions replaced with the stronger cross-kind
    sequence assertion.
  - 'sandbox_events ''net_deny'' removed from the docs: documented since 0.6.0, never constructed, never
    emitted. A sandbox denies egress structurally, so there is no attempt to observe.'
  - 'NOT A DEFECT after all: the contract''s claim that the single-file loop leaves assembled rows with
    a NULL reported_tokens was wrong. assemble() is called only from the workspace loop (src/run.rs:864)
    and the sub-agent loop (:1324); the single-file loop uses bound() and records no assembled row at
    all, so there is nothing to back-fill. Reported rather than silently dropped.'
- id: US-IO-HARNESS-0.12.0-T04
  summary: 'Settle the event surface before threading it anywhere: a serde-serialisable `RunEvent` covering
    every kind of thing the run records, and an `Observer` trait shaped on the crate''s existing inversion-of-control
    precedent — `Send + Sync`, `&self` methods, passed as `&dyn Observer` the way `Approver` is at `src/run.rs:143`.
    `&self` rather than `&mut self` is what makes it safe under `buffer_unordered`''s concurrent children.
    Provider types gain serde derives, which is also the prerequisite for T08.'
  why_required: The enum is public and covers fourteen kinds across roughly forty emission sites; getting
    it wrong is expensive and permanent. 0.11.0 settled its error kind and 0.9.0 its `Tool` trait before
    touching a call site, for the same reason. Nothing else in the release can be built until this shape
    exists.
  status: done
  depends_on:
  - US-IO-HARNESS-0.12.0-T03
  acceptance_criteria:
  - 'F3 — every event serialises and round-trips. Each `RunEvent` variant survives `serde_json` to value
    and back to an equal value, and one test pins the rendered shape of each variant so a consumer reading
    the JSON is reading something a future release cannot change silently.

    '
  - 'NF1 — no new runtime dependency. `serde` is already a dependency and is already derived on `Containment`,
    `Policy` and the sandbox types; the observer needs no channel and therefore no `tokio` `sync` feature.
    `[dependencies]` is unchanged against 0.11.0 except for serde derive coverage.

    '
  files:
  - src/observe.rs
  - src/lib.rs
  - src/provider/mod.rs
  - tests/observe.rs
  evidence:
  - 'src/observe.rs: Observer (Send + Sync, &self, &dyn -- the Approver precedent), RunEvent, 17-variant
    EventKind, Flow, Ignore. One method returning Flow rather than Result: an observer is a spectator
    and must not be able to fail a run.'
  - Wire shape flat and internally tagged, pinned by test because it is a contract. every_kind() carries
    a compiler-enforced exhaustiveness guard so a new variant cannot escape the round-trip and distinct-tag
    tests. 5 lib tests passed.
  - 'Provider types derive serde + PartialEq: the prerequisite for recording, since there was previously
    no format to record into.'
- id: US-IO-HARNESS-0.12.0-T05
  summary: Unify the step boundary. The commit point is duplicated at `src/run.rs:743`, `:962` and `:1455`,
    each with its own inline `StepRecord` construction and its own differently-named `info!` ("loop step"
    / "workspace step" / "agent step"). One emission path for all three loops, with the sub-agent loop's
    deliberately uncommitted step — a step paused by a child so that resume replays it (`src/run.rs:1442-1456`)
    — handled explicitly rather than silently dropped.
  why_required: Three copies of the boundary will drift the moment an event is emitted from them, and
    the uncommitted-step case is exactly where a naive "one commit, one event" rule reintroduces the double-execution
    bug 0.7.0 exists to prevent.
  status: done
  depends_on:
  - US-IO-HARNESS-0.12.0-T04
  acceptance_criteria:
  - 'F4 — the step boundary is emitted once, from one place, for all three loops. Asserted by driving
    the single-file, workspace and sub-agent loops and observing the same event shape from each; and the
    sub-agent loop''s step that is deliberately left uncommitted when a child defers (`src/run.rs:1442-1456`)
    is asserted to behave as the release specifies rather than to silently emit nothing.

    '
  files:
  - src/run.rs
  - tests/checkpoint.rs
  - tests/subagents.rs
  evidence:
  - commit_step is the single boundary for all three loops, replacing three inline StepRecord constructions
    and three differently-named info! lines.
  - 'The paused-by-child case is passed IN as a `commit: bool` argument rather than branched around, so
    the uncommitted step is an argument at the one commit point rather than a second quieter commit path.
    No Step event is emitted for it. Pinned by a_step_left_uncommitted_for_replay_is_not_announced_as_a_step.'
- id: US-IO-HARNESS-0.12.0-T06
  summary: 'Thread the observer through every entry point and emit every event kind from the sites the
    audit enumerated: committed steps, tool calls, policy refusals, approval requests and decisions, spend
    draws, retries, fallbacks, stalls, replans, spawns, memory writes, sandbox lifecycle events, MCP calls,
    and the terminal outcome. Registration is opt-in on all seven entry points, and a run without an observer
    must behave exactly as it does under 0.11.0.'
  why_required: 'This is the release''s headline: an embedding application is called as the run happens
    instead of polling a file. The zero-cost-when-absent half is not optional — a visibility feature that
    changes what an unobserved run does is a regression however well it reports.'
  status: in-progress
  depends_on:
  - US-IO-HARNESS-0.12.0-T05
  acceptance_criteria:
  - 'F1 — a registered observer is called for every kind of thing the run records. One run exercising
    steps, tool calls, refusals, an approval decision, a spend draw, a retry, a fallback, a stall, a replan,
    a spawn, a memory write, a sandbox event, an MCP call and a terminal outcome delivers one event per
    occurrence. Asserted against the trace the same run wrote: the two surfaces report the same facts
    in the same order. An event stream that disagrees with the durable trace is worse than none.

    '
  - 'F2 — the observer costs nothing when absent. A run with no observer produces a byte-identical canonicalised
    trace and the same provider call count as 0.11.0, asserted by a call counter on the existing mock
    providers. No new allocation per step on the unobserved path.

    '
  - 'NF2 — the observer does not change the run''s concurrency model. `Store` stays `Send + !Sync`, the
    tree stays `buffer_unordered` on one task, and `run_agent`''s future stays non-`Send`. An `Observer:
    Send + Sync` with `&self` methods is compatible with all three; a `&mut self` observer would not be,
    under concurrent children.

    '
  files:
  - src/run.rs
  - src/verify.rs
  - src/net.rs
  - src/mcp.rs
  - src/context.rs
  - src/observe.rs
  - tests/observe.rs
  evidence:
  - Seven *_observed twins, originals become one-line wrappers passing &Ignore -- 0.11.0 code compiles
    unchanged and there is one code path, not an Option branch per site.
  - 'Ten of fifteen event kinds emitted. The headline test compares the event stream against the trace
    the same run wrote and found a real asymmetry: the trace records prose, the event carries Replan {
    window: 3 }. Corrected to assert the sequence agrees AND the number matches the prose, rather than
    demanding the event repeat a sentence it deliberately does not carry.'
  - an_unobserved_run_writes_the_same_trace_and_makes_the_same_provider_calls covers F2/NF2.
  - 'OPEN: ToolCall, Refused, ApprovalRequested, ApprovalDecided, MemoryWrote, Sandbox and Mcp were declared
    but never emitted -- the enum promised more than the run delivered. In progress; the sites are in
    dispatch()/gate() in run.rs plus verify.rs and mcp.rs.'
- id: US-IO-HARNESS-0.12.0-T07
  summary: Cancellation the caller asks for. The observer's return value can stop the run, which ends
    as a terminal outcome, records it, leaves `runs.status` not `running`, and stays resumable. Today
    the only way to stop a run in flight is to drop its future, which leaves the run row `running` forever
    — `Store::set_status` (`src/state.rs:1227`) exists and is never called from `src/run.rs`, so `RunStatus::Failed`
    is a variant nothing writes.
  why_required: A 24-hour unattended run with no way to ask it to stop is not operable, and the observer
    is the only place the request can come from. Without this the release ships a surface that can watch
    a run but not act on what it sees.
  status: done
  depends_on:
  - US-IO-HARNESS-0.12.0-T06
  acceptance_criteria:
  - 'F5 — a run can be cancelled by its observer. The run stops within one step of the request, records
    a terminal outcome, leaves `runs.status` not `running`, and is resumable. Contrasted with a dropped
    future, which is asserted to be the thing that leaves a run wedged today.

    '
  files:
  - src/run.rs
  - src/state.rs
  - src/observe.rs
  - tests/observe.rs
  evidence:
  - 'RunOutcome::Cancelled, outcome string cancelled, mapped in terminal_outcome. Watch latches the request;
    honoured at the top of each loop iteration, so a cancel costs at most one more step and never lands
    mid-step. The run is finished rather than abandoned: status completed, summary written, resume a faithful
    no-op.'
  - 'Known edge, reported rather than hidden: a cancel requested on the last step of the budget has no
    next boundary, so that run reports StepCapReached. It stopped anyway.'
- id: US-IO-HARNESS-0.12.0-T08
  summary: 'A recording provider and a replaying provider, both combinators that are themselves `Provider`,
    following `Fallback`''s pattern (`src/provider/fallback.rs:87`) so every existing generic entry point
    takes them unchanged. Recording is lossless where the trace is not: `CompletionResponse.text` survives
    alongside tool calls (discarded today at `src/run.rs:892-905`), both `prompt_tokens` and `completion_tokens`
    survive (dropped today at `src/run.rs:714`), and tool-call arguments containing a `|` survive (corrupted
    today by the `" | "`-joined format at `src/run.rs:909`). Replay is keyed on the request, never on
    a counter.'
  why_required: Nothing in the crate records a provider response, so no case can be re-run against what
    the model said. Request-keying rather than counter-keying is the whole difference between replay that
    composes with 0.7.0's resume and replay that breaks it — `tests/checkpoint.rs:63-66` already documents
    why.
  status: done
  depends_on:
  - US-IO-HARNESS-0.12.0-T04
  acceptance_criteria:
  - 'F7 — a recording provider captures a call losslessly. Request and response round-trip through the
    recording, including `CompletionResponse.text` when tool calls are also present (discarded today at
    `src/run.rs:892-905`), both `Usage.prompt_tokens` and `completion_tokens` (dropped today at `src/run.rs:714`),
    and tool-call arguments containing a `|` character, which the current `" | "`-joined trace format
    corrupts.

    '
  - 'NF7 — replay is not a second engine. The replaying provider is a `Provider` and nothing else; no
    entry point, no loop and no store method branches on whether a run is a replay. If the loops have
    to know, the design is wrong and is reconsidered rather than special-cased.

    '
  files:
  - src/provider/record.rs
  - src/provider/replay.rs
  - src/provider/mod.rs
  - src/state.rs
  - tests/replay.rs
  evidence:
  - Record<P> and Replay as Fallback-shaped combinators. Recordings go to a JSON file, not the store --
    forced by the type system, since Provider::complete's future must be Send and rusqlite::Connection
    is !Sync, so a &Store captured in a recorder's future does not compile. The contract's open question
    is settled by the compiler.
  - Replay keys on request content, never a counter. a_counter_keyed_mock_diverges_where_a_replay_does_not
    is the negative control proving the difference is real.
  - 'A missing recording is a typed non-retryable error, not a default: CompletionResponse::default()
    reads exactly like ''the model chose not to call a tool'', so a silent default would make a diverged
    replay look successful. Recordings carry the harness version and refuse a different major.minor series.
    8 tests passed.'
- id: US-IO-HARNESS-0.12.0-T09
  summary: 'Define and prove "identical twice": a canonicalised projection of the trace naming which tables
    and columns are compared and which fields are excluded as inherently variable, then the tests. One
    case recorded once and run twice compares equal. The negative controls must fail: reintroducing `run_id`
    into the memory note breaks it, and composing children in completion order breaks it. And a recorded
    case killed mid-run and resumed produces the same trace as the uninterrupted replay.'
  why_required: The determinism claim is what every future measurement rests on, and a comparison that
    cannot fail proves nothing. The negative controls are the criterion, not a nicety — they are the only
    thing standing between a real guarantee and a test that passes because it asserts nothing.
  status: blocked
  depends_on:
  - US-IO-HARNESS-0.12.0-T08
  - US-IO-HARNESS-0.12.0-T03
  acceptance_criteria:
  - 'F8 — a case replays identically. One case recorded once and run twice produces the same canonicalised
    trace, compared byte for byte. The replaying provider makes no network call, asserted rather than
    assumed.

    '
  - 'F9 — the determinism tests can fail. The F8 comparison FAILS when `run_id` is reintroduced into the
    rendered memory note, and FAILS when child results are composed in `buffer_unordered` completion order
    rather than spawn order. Both are asserted as explicit negative controls, because a determinism test
    that cannot fail proves nothing and this release''s whole measurement claim rests on it.

    '
  - 'F10 — replay survives resume. A recorded case killed mid-run and resumed produces the same canonicalised
    trace as the uninterrupted replay. This is the criterion the existing fixtures would fail: all ten
    scripted mocks in `tests/` key on an `AtomicUsize`, and a resumed step re-calls `complete` and would
    consume the next recording.

    '
  files:
  - tests/replay.rs
  - tests/determinism.rs
  - src/state.rs
  evidence:
  - '6 tests. Positive: one case replayed twice into fresh stores compares equal, and separately matches
    the run it was recorded from -- two replays could agree while both differing from reality.'
  - Two negative controls (run_id in the prompt, children in completion order) must break equality, plus
    a control-on-controls asserting identically-built traces DO compare equal. Without these the positive
    test would pass through a reintroduction of either bug.
  - Store::canonical_trace defines the comparison, with every excluded field and its reason documented
    -- equality could not be row identity, since a retry shares a step number with the commit that follows.
  - 'BLOCKED, needs /ultraship:iterate: F10 as written is false. A resumed run does not reproduce the
    uninterrupted one, because ContextLedger is in-memory (src/run.rs:1183, :1758) and 0.7.0''s resume
    never restores it, so the resumed run re-assembles context from the workspace and sends a prompt the
    recording never saw. Replay is not the cause. Fixing it means checkpointing the ledger, which this
    contract excludes. The test now pins the true boundary behaviour -- the replay reports divergence
    as a typed error rather than inventing an answer.'
- id: US-IO-HARNESS-0.12.0-T10
  summary: 'The per-run outcome record: an additive table written by `finish_run`, carrying whether the
    run succeeded, its step count, its token spend and its duration — the last requiring an end stamp,
    since no end timestamp exists anywhere in the schema and `elapsed_secs` (`src/state.rs:1249`) is live
    and keeps growing after the run finishes. A public reader on `Store`, and the record reaching the
    caller through `RunResult` (`src/run.rs:84`), whose private constructors mean the added field breaks
    only an exhaustive struct pattern.'
  why_required: A finished run currently reports an outcome discriminant and a `run_id`. Spend needs a
    follow-up query and latency is not recorded at all, so the fourth field of the deliverable is the
    one genuinely new write. Written by `finish_run` rather than assembled by the caller because an escalated
    run returns `Err` and never reaches a `RunResult`.
  status: in-progress
  depends_on:
  - US-IO-HARNESS-0.12.0-T02
  acceptance_criteria:
  - 'F11 — a finished run has a record, and its numbers are right. For each outcome kind, the record''s
    success flag, step count, token spend and duration are asserted against independently computed values
    — duration as a bound, never an equality. `steps` is asserted to mean what the release documents it
    to mean, given that retry rows share a step number so `COUNT(*)` over the table is not a step count.

    '
  - 'F12 — the record exists for a run that never returns a `RunResult`. An escalated run returns `Err`,
    so its record must be written by `finish_run` rather than assembled by the caller. Asserted by reading
    the record back for a run that escalated.

    '
  - 'F13 — the record reaches the caller. `RunResult` carries the summary, so spend and latency are available
    without a follow-up store query. The added fields are asserted against the stored record so the two
    cannot drift.

    '
  - 'NF8 — additive migration only. Any new table is `CREATE TABLE IF NOT EXISTS` in `Store::from_conn`,
    `CHECKPOINT_FORMAT` stays 7, and no existing table is renamed or reshaped. A 0.11.0 store opens and
    a 0.11.0 checkpoint resumes, matching the precedent set twice in 0.10.0 (`src/state.rs:807-809`, `:826-828`).

    '
  - 'NF5 — the public break is deliberate and documented. Adding fields to `RunResult` breaks an exhaustive
    struct pattern; that is the only intended break. The CHANGELOG carries the migration note, the public-surface
    diff against the 0.11.0 tag is recorded in the evidence, and no other public item is renamed or removed.

    '
  files:
  - src/state.rs
  - src/run.rs
  - src/lib.rs
  - tests/outcome_record.rs
  evidence:
  - run_outcomes table, additive CREATE TABLE IF NOT EXISTS, CHECKPOINT_FORMAT still 7, no existing table
    reshaped. Written by finish_run so a run that escalates or is refused -- returning Err and never reaching
    a RunResult -- still gets one.
  - 'finished_at is the genuinely new fact: nothing recorded when a run ENDED, and elapsed_secs measures
    against now so it keeps growing afterwards. Both stamps from the database clock.'
  - A paused run gets no summary until it really ends. A pre-0.12.0 run reports None rather than zeroes.
    7 tests, every field asserted against an independently computed value, duration as a bound.
  - 'OPEN: RunResult does not yet carry the summary (F13).'
- id: US-IO-HARNESS-0.12.0-T11
  summary: Correct every false claim in `README.md` — its structure is 0.15.0's subject, its accuracy
    is this release's. No `git` tool (built-ins are `write_file`, `grep`, `find`, `read_file`, `remember`,
    `read_skill`, `spawn_agent`); Office/PDF/OCR/media no longer listed as capabilities without a status
    marker beside shipped siblings; the current version in the dependency snippet rather than `0.3`; `Act::Net`
    in the policy defaults table, where it defaults to Deny (`src/policy.rs:167-175`); `remember` in the
    reserved tool names; all nine `RunOutcome` variants; no "everything else is roadmap" assertion when
    ten listed items have shipped; no instruction to override a deadline before T01 makes that possible.
    Plus the leaked rustdoc hidden lines that render as stray text and the top-of-file pseudo-field block
    that collapses into one line. `docs/CAPABILITIES.md` marks all twelve pillars held.
  why_required: The crate is published. A README claiming a tool that does not exist and pinning a version
    eight minors stale is not a formatting preference — it is the page every prospective user reads first,
    and it is currently wrong about what the crate can do.
  status: done
  depends_on:
  - US-IO-HARNESS-0.12.0-T01
  - US-IO-HARNESS-0.12.0-T02
  acceptance_criteria:
  - 'O5 — the README''s corrected claims are accurate against the source, verified by re-running the audit
    that found them rather than by inspection. Every claim about a tool, a capability, a default or a
    public item is checked against the code it describes.

    '
