- id: US-IO-HARNESS-0.8.1-T09
  summary: Make a gate failure caused by the hardening distinguishable in the trace from an ordinary
    failed criterion, without adding a public error variant (which would be an API change in a patch).
    An operator whose run stopped passing after upgrading can tell which of the two happened from the
    store alone.
  why_required: The contract's observability entry. A silent behaviour change is the one thing that
    turns an honest correctness fix into a support problem — this release deliberately makes some previously-passing
    runs fail, so the trace has to say why.
  status: done
  depends_on:
  - US-IO-HARNESS-0.8.1-T03
  acceptance_criteria:
  - 'O3 — the reproduction and the live run are stored as release evidence, so the claim "the bypass
    fails" is a recorded observation rather than an assertion.

    '
  files:
  - src/verify.rs
  evidence:
  - SandboxEvent::gate_phase_failed records subject-compile / criterion-compile / test-run. A new `kind`
    VALUE on the existing sandbox_events table — not a new table or column — so the contract's 'no schema
    change' holds and a 0.8.0 store needs no migration.
  - 'O3 green: the_trace_distinguishes_a_closed_bypass_from_an_ordinary_failure asserts all three phases
    land in a reopened Store.'
  - 'HONEST BOUND, recorded in the test''s doc comment: a NEUTRALISED macro shadow reports test-run,
    not criterion-compile — once ::core::assert! wins, assert!(false, ...) is simply a false assertion
    and the run has become an ordinary failure rather than merely resembling one. The phase marker separates
    the three places a gate can die; it does not reconstruct which 0.8.0 bypass a run used to rely on.
    The contract''s observability line is met in substance, narrower than a literal reading.'
