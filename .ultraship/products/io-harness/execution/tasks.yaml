product: io-harness
version: 0.29.0
tasks:
- id: US-IO-HARNESS-0.29.0-T01
  summary: 'Provider plumbing: ModelInfo, PriceSource, the defaulted Provider::models(), the two new
    module declarations and the crate-root re-exports.'
  why_required: 'Every other task in the release names one of these types or is compiled by one of these
    declarations. The defaulted method is also the release''s one break risk: a required method here
    would break the crate''s only extension point.'
  status: todo
  depends_on: []
  acceptance_criteria:
  - 'F3 — `Provider::models()` defaults to an empty list, and the default is what keeps the crate''s
    extension point open. A `Provider` implementation that overrides nothing but `complete` compiles
    and returns an empty catalogue — written as the minimal out-of-tree implementer, which is the exact
    shape `src/provider/mod.rs:674` documents. **The negative control is `Compatible::models()` against
    a socket serving a real catalogue body, returning a non-empty list** — without it the test passes
    against an implementation whose `models()` returns empty for everyone.

    '
  - 'NF5 — no existing public item changes. `OpenRouter`, `Anthropic` and `OpenAi` keep every method
    and every behaviour; `Provider` gains one defaulted method and no required one; `ProviderSpec` gains
    one variant behind the `#[non_exhaustive]` 0.27.0 put there for it. `Price` gains no field and keeps
    `Copy`, so `..Price::ZERO` and `PriceTable::price` are untouched and tiers are a `PriceTable` method
    rather than a change to the value type. A `PriceTable` with no tier registered returns exactly the
    figure 0.28.0 returned, asserted rather than argued. A program written against 0.28.0 compiles and
    behaves identically.

    '
  files:
  - src/provider/mod.rs
  - src/lib.rs
  evidence: []
- id: US-IO-HARNESS-0.29.0-T10
  summary: 'Price tiers in src/pricing.rs: PriceTier, PriceTable::with_tiers/tiers, and tier selection
    in cost_micros.'
  why_required: Forty-four of the catalogue's models price by prompt length and the rate typically doubles
    past 200k, so a catalogue that fetches a real price and applies the wrong tier under-reports a long
    run by half — the confident wrong number this release exists to prevent. See iterations/US-IO-HARNESS-0.29.0-I01.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.29.0-T01
  acceptance_criteria:
  - 'F11 — a tiered price is billed at the tier the prompt actually reached, and a flat one is unchanged.
    A model with a 200,000-token tier at double its base rate costs the base rate at 199,999 prompt
    tokens and the tier rate at 200,000 and at 400,000 — the boundary asserted on both sides, because
    an off-by-one on a floor is the whole defect. A two-tier model (32,000 and 128,000) selects the
    **highest** floor it reaches and not the first, asserted with the tiers registered in reverse order
    so the answer cannot come from input ordering. And an override that names only some keys inherits
    the rest from its base row, asserted on a dimension the override omits. **Three negative controls:**
    a model with no tiers priced identically to how 0.28.0 priced it, so the selection cannot have changed
    the flat path; a prompt below every floor yielding the base row rather than the lowest tier; and
    the same usage priced against a table with the tiers **removed**, which must produce a *different
    and smaller* figure — without it the test would pass against an implementation that ignored tiers
    entirely.

    '
  files:
  - src/pricing.rs
  evidence: []
- id: US-IO-HARNESS-0.29.0-T02
  summary: 'The reference catalogue reader: Reference, the exact decimal-string to micro-unit conversion,
    and the match rule.'
  why_required: Without it the release prices nothing for the vendors that publish no prices, which
    is the half of the outcome the fallback trigger is written against. The conversion is also the only
    place a defect in this release becomes money rather than an error.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.29.0-T10
  acceptance_criteria:
  - 'F4 — a decimal price string becomes an exact integer, and no `f64` is on the path. `"0.0000002574"`
    becomes exactly `257_400` micro-units per million tokens, and a table of hand-computed cases covers
    a value with fewer fraction digits than the shift, one with more (rounded half-up at the twelfth
    place), `"0"`, an integer with no point, and a malformed string that yields `None` rather than a
    zero. **The named negative control is `f4_the_conversion_is_not_a_float_multiply`: the same inputs
    run through an `f64` multiply must produce a value that differs from the exact result for at least
    one case in the table**, so the test proves the implementation is not the float one rather than
    merely agreeing with it on easy inputs. A second control asserts a malformed price is `None` and
    never `Some(0)`.

    '
  - 'F5 — a reference price is matched exactly or by one documented normalisation, and a miss stays
    `None`. An exact slug matches; `deepseek/deepseek-chat` matches a vendor id of `deepseek-chat` by
    dropping the single leading segment, case-insensitively. **Three negative controls:** a vendor id
    the reference does not carry under either rule is `None` and never a nearest entry — asserted with
    the roadmap''s own example, a reference carrying `deepseek/deepseek-chat` and a vendor asking for
    `deepseek-v4-flash`; two reference entries normalising to the same key make that key ambiguous and
    therefore `None`, not first-wins; and a two-segment vendor id is not matched against a one-segment
    reference entry by stripping in the other direction, because one normalisation means one.

    '
  files:
  - src/provider/catalog.rs
  evidence: []
- id: US-IO-HARNESS-0.29.0-T03
  summary: 'The Compatible provider: the base URL and auth style, the preset table and its named constructors,
    models(), and the opt-in reference lookup in endpoints().'
  why_required: It is the release. Twenty-one vendors are reachable without writing a provider, or the
    outcome sentence is false.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.29.0-T02
  acceptance_criteria:
  - 'F1 — one `Compatible` reaches a vendor''s chat endpoint through the real HTTP and SSE path, and
    the preset decides the URL and the auth. A `Compatible` pointed at a local socket completes a streamed
    response with text and a tool call, asserted through `Compatible::at`, and the request the socket
    received carries `Authorization: Bearer <key>` and a path ending `/chat/completions`. **Two negative
    controls:** an `Auth::None` provider''s request carries **no** `Authorization` header at all, asserted
    on the received head rather than on the constructor — so "auth style" is proven to reach the wire
    and not merely to be stored; and a base URL already ending in a path segment (`/openai/v1`, `/api/paas/v4`)
    produces that segment plus `/chat/completions` rather than a URL with the segment lost, which is
    the failure mode a scheme-and-host field would have had.

    '
  - 'F2 — every preset in the table names a distinct vendor with a well-formed absolute base, and the
    named constructors and the table cannot disagree. Each entry''s `base_url` parses as an absolute
    `https`/`http` URL with a host, no entry''s name repeats, and each of the twenty-one named constructors
    is asserted to produce the base and the auth style its table row states. **The negative control
    is the check run against a table with one row''s base replaced by a relative path and another row
    duplicated, which must report exactly those two rows** — a validator that always answers "fine"
    is the failure mode, and it must be seen answering otherwise.

    '
  - 'F6 — a price carries its provenance, and the two fields cannot disagree. A model priced from the
    vendor''s own catalogue is `PriceSource::Vendor`; the same model filled from the reference is `PriceSource::Reference(host)`
    naming the host that was dialled. Across a whole parsed catalogue, `price.is_some()` and `price_source.is_some()`
    are asserted **equal for every entry**. **The negative control is a vendor catalogue with no pricing
    object at all** — every entry `None` on both, which is the state that must not be reported as a
    free model.

    '
  - 'F7 — the reference lookup is off by default, and when on its host is governed like every other
    endpoint. A `Compatible` built normally reports exactly one endpoint and makes no second request,
    asserted by a reference server that records whether it was ever connected to. With `with_reference_prices`,
    `endpoints()` reports both, and a run under a policy that denies the reference host **fails** rather
    than proceeding with prices missing — asserted on the run''s error through the existing authorisation
    at `src/run.rs:4630`. **Two negative controls:** the byte-identical run under a policy that allows
    the host reaches its own ending, so the refusal is proven to be about the policy and not about the
    feature being broken; and the default-off provider under the same denying policy still runs, so
    the deny is proven to be about the second host and not about the provider''s own.

    '
  files:
  - src/provider/compatible.rs
  evidence: []
