- id: US-IO-HARNESS-0.47.0-T06
  summary: 'Select the AppContainer on Windows: derive the grant set, spawn into the container, assign
    to the Job Object.'
  why_required: Windows has never had a filesystem boundary and the mechanism has been built and unselected
    since 0.26.0. This is the whole of the Windows half; without it the platform table's Windows row does
    not change.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.47.0-T01
  acceptance_criteria:
  - '**F7 — a Windows run is access-confined and resource-contained at the same time.** Driven from `TaskContract::workspace`:
    a read of a path outside the grant set is refused, a socket to the outside is refused, a write inside
    the workspace lands, `select(&config).backend()` reports `windows-appcontainer`, and the Job Object''s
    own `max_processes` cap still fires on the same run. The last clause is the control: a backend that
    traded resource containment for access containment would pass the first four. Sabotage: spawn into
    the container without assigning the process to the job, under which the cap arm fails and only this
    fails.

    '
  - '**F8 — the Windows grant set is derived from the run''s resolved facts.** A pure test over the grant-list
    builder: the workspace root, the temp directory and each existing writable root appear as `Full`;
    under `ReadOnly` the workspace appears as `ReadExecute` instead; the program''s directory and `%SystemRoot%`
    appear as `ReadExecute`; and a writable root that does not exist appears not at all. Sabotage: grant
    the workspace `Full` under `ReadOnly`, under which that arm fails and only this fails.

    '
  - '**F10 — every degradation completes the run and reports the weaker backend.** A Windows host where
    the container path is made to fail runs to completion and reports `windows-job-object`; a Linux host
    with no rung above the floor runs to completion and reports `portable-floor`; `EventKind::Contained`
    carries the backend that was applied in both cases, and `FullAccess` still reports `full-access` with
    no container and no ruleset. Sabotage: return an error from the backend instead of degrading, under
    which the run fails and only this fails.

    '
  files:
  - src/sandbox/windows.rs
  - src/sandbox/appcontainer.rs
  - src/sandbox.rs
  - tests/sandbox_job_object.rs
  evidence: []
- id: US-IO-HARNESS-0.47.0-T07
  summary: Map the run's egress answer onto the container's capability array.
  why_required: An empty capability array denies the network, which is the release's Windows egress boundary,
    but it also breaks every run whose policy permits egress. Without the mapping the backend would be
    selected and immediately have to be turned off.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.47.0-T06
  acceptance_criteria:
  - '**F9 — a Windows run whose network is permitted still reaches the network.** The same run with a
    policy permitting egress requests `internetClient` and connects to the test''s own listener; with
    egress denied it requests nothing and is refused. Both arms in one test so the second is a control
    rather than a separate claim — an empty capability array that broke every network-permitting run would
    be a regression this release could otherwise ship green. Sabotage: request the capability unconditionally,
    under which the denied arm connects and only this fails.

    '
  files:
  - src/sandbox/appcontainer.rs
  - src/sandbox/windows.rs
  - tests/net.rs
  evidence: []
