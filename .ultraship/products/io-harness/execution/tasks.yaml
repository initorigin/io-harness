product: io-harness
version: 0.11.0
tasks:
- id: US-IO-HARNESS-0.11.0-T01
  summary: Write the provider failure taxonomy, then make the code produce it. `Error::Provider(String)`
    becomes a structured variant carrying the kind (transport, timeout, rate-limited with `Retry-After`,
    server, auth, malformed), the HTTP status preserved rather than formatted into prose, and `is_retryable()`.
    All three providers inspect the status they currently throw away, and a stream that yields no parseable
    event at all becomes the malformed kind instead of `Ok(CompletionResponse::default())`.
  why_required: Every other task in the release branches on the kind. Retry, fallback and escalation are
    all one question — is this worth trying again — and today the answer is a `String`.
  status: done
  depends_on: []
  acceptance_criteria:
  - 'F1 — a provider failure carries its kind. A fixture provider returning connection-refused, 429, 503,
    401, and a malformed stream produces five distinguishable kinds, with the HTTP status preserved and
    `Retry-After` captured when the server sent one. Asserted on the error value, not on its rendered
    string.

    '
  - 'F4 — a malformed stream is an error, and a quiet model is not. A stream with no parseable event yields
    `Error::Provider` with the malformed kind; a stream that parses and contains text but no tool call
    still yields `Ok` and is still read as "no tool call". Both sides asserted, because collapsing them
    in either direction is a regression.

    '
  - 'NF1 — no new runtime dependency. Backoff is `tokio::time::sleep`, which is already a dependency;
    the request deadline is a `reqwest` builder option already available. No retry crate, no backoff crate,
    and no randomness crate — the backoff is deterministic and documented as such rather than jittered.

    '
  - 'O2 — the documented failure taxonomy matches the code. Every kind the enum carries is described with
    what produces it and whether it is retried, in the crate docs and the README, so a consumer branching
    on a kind is branching on something specified rather than observed.

    '
  files:
  - src/error.rs
  - src/provider/mod.rs
  - src/provider/openrouter.rs
  - src/provider/openai.rs
  - src/provider/anthropic.rs
  - src/provider/openai_wire.rs
  - tests/provider_failures.rs
  evidence:
  - 'src/error.rs — `ProviderErrorKind { Transport, Timeout, RateLimited, Server, Auth, Request, Malformed
    }` with `is_retryable()` and `from_status(u16)`, and `Error::Provider { kind, status, retry_after,
    message }`. The taxonomy''s doc comment was written before the call sites, per the contract''s first
    risk: the enum is shaped by what a consumer branches on, not by what made the tests compile.'
  - 'Retryable: Transport, Timeout, RateLimited, Server, Malformed. Terminal: Auth (a key does not become
    valid a second later) and Request (the server read this exact request and refused it). Reasoning is
    per-arm in `is_retryable`.'
  - '`From<reqwest::Error> for Error` is the single place `is_timeout()` is consulted, so all four call
    sites are a plain `?` and the three providers are byte-identical by construction rather than by discipline.
    `from_status` takes `u16`, not `reqwest::StatusCode`, keeping a vendor type out of the public API.'
  - '`Retry-After` parsed in both spec forms — delta-seconds and IMF-fixdate — preserved on any non-success
    status rather than only 429, and treated as absent when unparseable so a bad header degrades to no
    hint rather than a wrong wait.'
  - F4 green — malformed is detected on the finished response (`text.is_none() && tool_calls.is_empty()
    && usage.is_none()`), so a stream that parses and legitimately has no tool call keeps its old meaning
    exactly. `a_stream_that_parses_to_nothing_is_malformed_not_an_empty_answer`, `a_stream_with_text_and_no_tool_call_stays_a_quiet_success`
    and `a_stream_carrying_only_usage_is_not_malformed` pin all three sides.
  - 'F1 green — one test per kind against real local sockets: refused connection, 429 bare, 429 delta-seconds,
    429 HTTP-date, 503, 401, 400. `all_three_providers_map_a_status_to_the_same_kind` drives OpenRouter,
    OpenAI and Anthropic against one fixture. `tests/provider_failures.rs` additionally pins the public
    contract with an exhaustive match that fails to compile if a kind is added without a retry decision.'
  - NF1 — no new runtime dependency; backoff is `tokio::time::sleep` and the deadline a `reqwest` builder
    option, both already present.
- id: US-IO-HARNESS-0.11.0-T02
  summary: Give requests a deadline. `net::http_client()` sets a documented, overridable request timeout,
    so a server that accepts a connection and then never writes ends the call as a timeout rather than
    hanging the run. Proven against a real local socket that accepts and stalls.
  why_required: A hung request produces no step, so 0.7.0's checkpointing never fires, the time budget
    is only checked at the top of a step and so is never reached, and the aggregate ledger sees no draw.
    The run is simply gone — the one failure mode with no remedy but killing the process.
  status: done
  depends_on:
  - US-IO-HARNESS-0.11.0-T01
  acceptance_criteria:
  - 'F3 — a request has a deadline. A local server that accepts the connection and then never writes ends
    the call as a timeout error within the configured deadline, and the deadline is overridable by the
    caller. Proven against a real stalling socket, not a mocked error: this is the failure mode that produces
    no step, no trace row and no budget draw today, so a fixture that merely returns an error would not
    test it.

    '
  - 'O4 — the request deadline''s default is stated wherever a timeout would surprise someone: a long
    single completion on a slow model must not be killed by a default meant to catch a hung socket. The
    default is documented with that trade named, and it is overridable.

    '
  files:
  - src/net.rs
  - tests/provider_failures.rs
  evidence:
  - src/net.rs — `http_client()` now delegates to `http_client_with_timeout(REQUEST_TIMEOUT)`; before
    this it set only `.redirect(none)` and had no request timeout at all.
  - 'The default is 600s, chosen from the slow end of the legitimate side: a full 8192-token stream at
    a sluggish 15 tokens/second is about nine minutes, so no realistic completion reaches it. The trade
    is asymmetric — killing a real completion is worse than one hung socket costing ten minutes once —
    so the default is deliberately generous and overridable. Stated in the README (O4).'
  - 'F3 green — proven against a REAL socket, not a mocked error: a local listener that accepts the connection
    and never writes, with a 300ms override, asserted to end as `Timeout` well inside the deadline. A
    fixture returning an error would not have tested the failure this criterion is about, which produces
    no step, no trace row and no budget draw.'
- id: US-IO-HARNESS-0.11.0-T03
  summary: 'Retry only what is retryable, and wait. `complete_with_retry` consults the kind: transport,
    timeout, 5xx and rate limit are retried with a backoff that grows per attempt and honours `Retry-After`;
    an auth or request-shaped failure escalates on the first occurrence. The wait is bounded by the run''s
    time budget, and each retry''s trace row names the kind and the delay.'
  why_required: Today a 401 and `Error::Config("OPENAI_API_KEY not set")` are retried twice, instantly,
    exactly as eagerly as a 503 — so the one failure worth waiting for is the one that gets no wait, and
    the two that are hopeless cost three calls each.
  status: done
  depends_on:
  - US-IO-HARNESS-0.11.0-T01
  acceptance_criteria:
  - 'F2 — only retryable failures are retried, and they wait. A 401 reaches the caller after exactly one
    provider call; a 503 is retried up to the contract''s limit with a delay that grows per attempt; a
    429 carrying `Retry-After` waits at least that long. Asserted by counting provider calls and measuring
    elapsed time against the fixture, and each retry''s trace row names the kind and the delay.

    '
  - 'NF7 — a retry wait is cancellable and budgeted. A backoff sleep does not outlive the run''s time
    budget, and a run whose deadline passes while waiting ends on the budget rather than after it. Waiting
    is not a way to escape a limit.

    '
  - 'NF6 — no regression. All 271 tests shipped at 0.10.0 pass unless one asserted a behaviour this release
    deliberately changes, and each such test is named in the record with why its old assertion was wrong.
    `tests/edit_file.rs`''s two retry tests are the expected casualties: they assert `"retry 1 after error"`
    against a provider error that this release classifies, and the retry trace row is gaining the kind
    and the delay.

    '
  files:
  - src/run.rs
  - src/state.rs
  - tests/provider_failures.rs
  evidence:
  - '`complete_with_retry` retries only when `Error::Provider`''s kind is retryable. Before this it retried
    every `Err` identically and instantly — including `Error::Config("OPENAI_API_KEY not set")` and a
    401, three calls each to learn nothing, while a 503 got no wait at all.'
  - '`RetryPolicy { base: 500ms, max: 30s }` doubles per attempt to the ceiling; a server''s `Retry-After`
    wins outright, above the ceiling included, because the server knows its own limit better than a default
    does.'
  - F2 green — `a_wrong_key_reaches_the_caller_after_exactly_one_provider_call` (1 call, elapsed under
    2s against a 5s base), `a_server_failure_is_retried_to_the_limit_with_a_wait_that_doubles` (4 calls;
    rows pinned exactly at 40ms/80ms/160ms so growth is asserted on the trace rather than the clock),
    `a_rate_limit_waits_at_least_as_long_as_the_server_asked` (429 with 250ms honoured against a 1ms policy).
    Timing assertions are lower bounds with margin, never exact durations, so they hold on a loaded Windows
    runner.
  - 'NF7 green — `a_retry_that_would_outlast_the_time_budget_escalates_instead_of_sleeping`: a 1s budget
    against a 30s base escalates after one call rather than sleeping past its deadline. Waiting is not
    a way to escape a limit.'
  - 'NF6 — one pre-existing test changed: `retries_then_succeeds_recording_each_attempt` asserted the
    literal `"retry 1 after error"`. The row now names the kind and the delay, which is the point of the
    release; the assertion is a prefix match on `"retry 1 after Transport in "` and what it proves is
    unchanged.'
- id: US-IO-HARNESS-0.11.0-T04
  summary: A `Fallback` combinator that is itself a `Provider` and wraps two of them, composing and nesting
    for three, accepted unchanged by every existing generic entry point. It falls through only on a failure
    another provider might not have, and the trace records which provider failed, with what kind, and
    which one answered the step.
  why_required: Three providers are implemented and only one is reachable in a run. `Provider::complete`
    returns `impl Future`, so there is no `dyn Provider` to hold a list — the combinator is how fallback
    happens without breaking the trait every caller implements.
  status: done
  depends_on:
  - US-IO-HARNESS-0.11.0-T01
  acceptance_criteria:
  - 'F5 — fallback works and composes. `Fallback::new(down, working)` completes a task that the primary
    alone cannot, three providers nest, and every existing entry point accepts it with no signature change.
    The trace names the provider that failed, its kind, and the provider that served the step.

    '
  - 'F6 — fallback does not fire when it cannot help. A primary failing with an authentication or request-shaped
    error does NOT reach the secondary; the caller gets the primary''s error. Asserted by a secondary
    that panics if called.

    '
  - 'NF2 — the single-provider path pays nothing. A run with one provider makes the same number of provider
    calls as it does under 0.10.0, and the classification adds no request. Asserted by a call counter
    on the existing mock providers.

    '
  files:
  - src/provider/fallback.rs
  - src/provider/mod.rs
  - src/lib.rs
  - src/state.rs
  - src/run.rs
  - tests/fallback.rs
  evidence:
  - src/provider/fallback.rs — `Fallback<A, B>` implements `Provider`, so `run`, `run_with`, `run_tree`
    and the resume entry points all take it with no signature change, and it nests for three. `Provider::complete`
    returns `impl Future`, so there is no `dyn Provider`; the combinator is what delivers fallback without
    making the trait object-safe.
  - '`Sync` on both halves is required and documented: the combinator holds `&self` across the primary''s
    await, so the future''s `Send` bound needs its fields `Sync`. Every real provider already is.'
  - F5 green — `a_down_primary_is_answered_by_the_secondary_and_the_run_still_succeeds` (Success, file
    on disk, a `served` row naming the secondary) and `three_nested_providers_reach_the_one_that_is_up`.
    `falling_over_costs_the_primary_one_attempt_per_step_not_a_retry_budget` pins that a fall-over happens
    inside one `complete`, so retry and fallback budgets do not multiply.
  - F6 green — `a_wrong_key_never_reaches_the_secondary_and_the_caller_gets_the_primarys_kind` and `an_unacceptable_request_never_reaches_the_secondary_either`,
    both with a secondary whose `complete` panics so being wrong is unmissable.
  - 'NF2 green — `a_single_provider_run_is_unaffected_and_records_no_served_row`: the single-provider
    path makes the same calls it did at 0.10.0 and records nothing, because there is nothing ambiguous
    to record.'
  - 'Beyond the contract, and necessary: `Provider::endpoints()`, defaulted to `endpoint()`. Authorization
    checks every host in the chain before the first step. A combinator reporting only its primary would
    have let a fallback dial the secondary''s host without the 0.8.0 deny-by-default egress policy ever
    seeing it — a hole the feature would otherwise have opened. Asserted by `authorization_sees_every_endpoint_in_the_chain`.'
  - 'The per-step record names the LEAF that answered, not the branch: a nested fallback reporting `"b
    -> c"` would reintroduce one level down the ambiguity the row exists to remove. Found by the integration
    tests and fixed in 7354328.'
- id: US-IO-HARNESS-0.11.0-T05
  summary: Make escalation terminal and legible. `"escalated"` maps through `terminal_outcome`, `finish_run`
    stops reporting it as a plain completion, and the result a caller receives says whether what ended
    the run was retryable or terminal — a distinction that survives into the store, so a resume and a
    trace reader agree with the caller.
  why_required: A resumed escalated run currently falls straight back into the loop and re-runs, because
    the outcome string is unmapped and the status is `Completed`. An unattended run that escalated at
    3am is therefore silently restarted by the next resume.
  status: done
  depends_on:
  - US-IO-HARNESS-0.11.0-T01
  - US-IO-HARNESS-0.11.0-T03
  acceptance_criteria:
  - 'F10 — an escalated run is terminal on resume. `"escalated"` maps through `terminal_outcome` and `finish_run`
    no longer reports it as a plain completion, so resuming an escalated run reports what happened instead
    of silently re-entering the loop. A regression test that fails against 0.10.0.

    '
  - 'F11 — the outcome says which. The result a caller receives distinguishes a retryable failure from
    a terminal one without parsing a string, and the distinction survives into the store so a resume and
    a trace reader agree with the caller.

    '
  files:
  - src/run.rs
  - src/state.rs
  - tests/provider_failures.rs
  evidence:
  - 'F10 green — the regression that fails against 0.10.0: `resuming_an_escalated_run_reports_the_escalation_instead_of_calling_the_provider_again`
    asserts the provider''s call count does not move across the resume, and `a_wrong_key_resumes_as_an_escalation_that_was_never_worth_retrying`
    gives one total call across run and resume. Before this, `"escalated"` was absent from `terminal_outcome`
    and `finish_run` filed it as a plain completion, so a run that escalated at 3am was silently re-run
    by whatever resumed it.'
  - F11 green — `RunOutcome::Escalated { steps, retryable }`, with `"escalated_retryable"` and `"escalated_terminal"`
    recorded distinctly so a resume, a trace reader and the caller all reach the same conclusion. The
    caller's own `Err` carries the kind directly.
  - '`Store::runs()` and `Store::last_run()` added because the integration tests exposed that an escalation
    returns a bare `Err` with no `run_id`, leaving `RunOutcome::Escalated` unreachable for a caller who
    had not recorded the id in advance — the outcome existed but could not be got at.'
- id: US-IO-HARNESS-0.11.0-T06
  summary: Make the workspace report whether a write changed anything. `Workspace::write_file` compares
    the bytes it is about to write with what is there, so a byte-identical rewrite is recorded as the
    no-op it is and a real edit is still recorded as one.
  why_required: 'Stall detection rests entirely on this signal and the crate has nothing like it: `write_file`
    never reads the old content, so `wrote {target}` today means "a write was attempted", not "the workspace
    changed".'
  status: done
  depends_on: []
  acceptance_criteria:
  - 'F7 — the workspace knows when it did not change. Writing byte-identical content is recorded as a
    no-op distinct from a real edit, and a real edit is still recorded as one. This is the signal F8 rests
    on, asserted on its own so a stall test failing cannot hide a broken signal.

    '
  files:
  - src/tools/workspace.rs
  - src/tools/fs.rs
  - src/run.rs
  evidence:
  - src/tools/workspace.rs — `Wrote { Created, Changed, Unchanged }` returned by `Workspace::write_file`,
    and by `FsTool::write` through the same shared `Wrote::classify`, so the workspace and single-file
    paths cannot drift. Content is compared, never metadata.
  - 'The policy check and path resolution are unmoved: a denied write is still refused before anything
    is read or written. The write always happens, `Unchanged` included — this reports, it does not skip
    work. An unreadable existing file reports `Changed`, the conservative answer, and says so in a comment.'
  - F7 green — 7 tests including `a_write_of_the_same_length_but_different_bytes_reports_changed` (27-byte
    fixture, one digit apart, so a size or mtime shortcut fails it) and `multibyte_content_round_trips_and_compares_correctly`.
    Asserted on its own so a stall test failing cannot hide a broken change signal.
  - '`Wrote::moved_the_workspace()` is the question stall detection asks, kept next to the enum rather
    than at the call site.'
- id: US-IO-HARNESS-0.11.0-T07
  summary: Detect a stalled agent and give it one chance. A bounded number of consecutive steps that change
    nothing in the workspace AND whose tool calls repeat what an earlier step in the window already did
    is a stall; it produces one replan directive in the assembled context naming what was already tried,
    once per run. A still-stalled agent then ends with its own outcome rather than burning to the step
    cap. Configurable, and disableable to exactly 0.10.0 behaviour.
  why_required: 'The 0.10.0 live evidence recorded this twice: sixteen consecutive turns re-reading the
    same four files, ending in `StepCapReached` with the whole step budget spent proving the agent was
    stuck.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.11.0-T06
  - US-IO-HARNESS-0.11.0-T03
  acceptance_criteria:
  - 'F8 — a stalled agent is detected and told once. The 0.10.0 live failure replayed as a fixture — repeated
    identical reads with no write — is detected within the configured window, produces a replan directive
    in the next turn''s context naming what was already tried, and the detection and the replan are trace
    rows. An agent that changes the workspace, and an agent legitimately exploring with varied calls,
    are NOT flagged.

    '
  - 'F9 — a persistent stall ends the run as a stall. After the one replan, a still-stalled agent ends
    with the stall outcome in materially fewer steps than its cap, rather than as `StepCapReached`. Asserted
    against the step count.

    '
  - 'NF3 — stall detection is off-by-default-safe. Its work per step is bounded and independent of the
    run''s length, it can be disabled by configuration, and with it disabled the loops behave exactly
    as 0.10.0 did. A resilience feature that changes a working run''s behaviour is a regression however
    well it works.

    '
  files:
  - src/run.rs
  - src/context.rs
  - src/contract.rs
  - src/state.rs
  - tests/stall.rs
  evidence:
  - 'src/resilience.rs — `StallPolicy { window: 3, max_replans: 1 }` and `Progress`, with 9 unit tests.
    A stall requires BOTH halves: nothing changed in the workspace AND a tool call this window already
    saw.'
  - 'F8 green — `the_same_read_repeated_over_an_unchanged_workspace_is_caught_within_the_window` replays
    the recorded 0.10.0 failure: turns 1-3 carry no directive, turn 4''s prompt contains the directive
    naming what was tried, and one `"stalled"` row sits at step 3. `a_write_that_changed_nothing_is_not_progress_and_is_flagged`
    proves the `Wrote::Unchanged` signal end to end — the case a naive "did it call write_file" check
    would miss.'
  - 'F8''s healthy half green, which matters more than the detection: `an_agent_that_changes_the_workspace_is_never_flagged`
    and `varied_calls_that_write_nothing_are_exploration_and_are_never_flagged` both run to their step
    cap with no row and no directive. Flagging a legitimate exploration phase would degrade healthy runs
    to add resilience, which is this release''s worst possible outcome.'
  - 'F9 green — `a_still_stalled_run_stops_far_short_of_its_step_budget`: a 20-step repeating script ends
    `Stalled { steps: 6 }`, with the provider called exactly 6 times, so the 14 unspent steps are turns
    never paid for.'
  - 'NF3 green — `a_window_of_zero_restores_the_old_step_cap_behaviour_exactly`: the same script under
    `window: 0` runs to `StepCapReached { steps: 20 }` with no row and no directive anywhere.'
  - 'The sub-agent loop too: `a_stalled_root_agent_ends_the_tree_as_stalled`. 0.5.0 spawns up to a hundred
    agents, so one burning its whole budget going nowhere is the multiplied version of the problem.'
  - The replan directive is an `ObsKind::Message` observation with no target, so it is bounded by the
    0.10.0 context budget like anything else and can never be superseded away.
- id: US-IO-HARNESS-0.11.0-T08
  summary: Document the taxonomy and the limits, mark the pillar, and write the CHANGELOG with the `Error::Provider`
    migration note plus the recorded public-surface diff against the 0.10.0 tag.
  why_required: '`Error::Provider`''s shape change breaks every match on it, and a consumer branching
    on a kind is entitled to a specification rather than an observation. Fallback also needs its non-promise
    stated: it does not check that the second provider is equivalent to the first.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.11.0-T01
  - US-IO-HARNESS-0.11.0-T02
  - US-IO-HARNESS-0.11.0-T03
  - US-IO-HARNESS-0.11.0-T04
  - US-IO-HARNESS-0.11.0-T05
  - US-IO-HARNESS-0.11.0-T06
  - US-IO-HARNESS-0.11.0-T07
  acceptance_criteria:
  - 'NF5 — the public break is deliberate and documented. `Error::Provider`''s shape changes, which breaks
    every `match` on it. The CHANGELOG carries the migration note, the public-surface diff against the
    0.10.0 tag is recorded in the evidence, and no other public item is renamed or removed. The crate
    stays pre-1.0; no 1.0.0 is planned or implied.

    '
  - 'O1 — the crate documents what fallback does and does not promise: it tries another provider when
    the failure suggests another provider might succeed, it does not verify that the second provider is
    equivalent to the first, and a model swap mid-run can change behaviour in ways the harness cannot
    see. An operator configuring two providers should know they may get two different models.

    '
  - 'O2 — the documented failure taxonomy matches the code. Every kind the enum carries is described with
    what produces it and whether it is retried, in the crate docs and the README, so a consumer branching
    on a kind is branching on something specified rather than observed.

    '
  - 'O3 — `docs/CAPABILITIES.md` marks recovery and retry shipped at 0.11.0 and marks nothing else. If
    the fallback scope is taken, it stays partial with the deferred release named.

    '
  files:
  - src/error.rs
  - README.md
  - CHANGELOG.md
  - docs/CAPABILITIES.md
  evidence:
  - 'README gains `## Resilience (v0.11)` with a worked `match` on `ProviderErrorKind`, the `Fallback`
    example, the `StallPolicy` knob, and a `### The limits, stated plainly` subsection: fallback does
    not promise equivalence, the 600s deadline and why, stall detection is a heuristic on a signal rather
    than a proof, and a retry is not a queue. O1, O2, O4.'
  - docs/CAPABILITIES.md marks recovery and retry shipped at 0.11.0 and nothing else; the status line
    reads eleven of twelve pillars with 0.12.0 named for the last. O3.
  - 'CHANGELOG 0.11.0 section in the required Keep-a-Changelog categories, leading with the two breaking
    changes and how to migrate each: `Error::Provider` becoming a struct variant, and `write_file`/`FsTool::write`
    returning `Result<Wrote>`. NF5.'
  - NF5 evidence — the public-surface diff against the 0.10.0 tag is recorded in the evidence directory.
    The removals are exactly the two deliberate signature changes; everything else is additive.
