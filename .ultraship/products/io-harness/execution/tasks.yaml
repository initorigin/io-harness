product: io-harness
version: 0.13.0
tasks:
- id: US-IO-HARNESS-0.13.0-T01
  summary: Persist the policy a run was started under. A `run_policies` table created with `CREATE TABLE
    IF NOT EXISTS` in `Store::from_conn` (src/state.rs:757, alongside `context_events` at :934), holding
    the run id, whether the caller enforced a boundary, and the serialised `Policy`. A `record_run_policy`
    writer and a `run_policy(run_id)` reader in the `record_*`/`*_events(run_id)` shape the store already
    uses (src/state.rs:1200, :1229). Written from `run_with_observed`, which already computes the fact
    at src/run.rs:246 as `caller_enforces` and currently throws it away. `Layer` and `Defaults` are added
    to the `pub use policy::{...}` at src/lib.rs:244 so a caller who reads the policy back can name the
    types inside it.
  why_required: F1 and F2 both need a durable answer to "was this run started under a boundary", and nothing
    in the crate persists a `Policy` today — the closest, `spawns.deny_write`, stores glob strings only.
    Without this table the resume path has nothing to consult and can only guess, which is the defect.
    Nothing else in the release can be built first.
  status: todo
  depends_on: []
  acceptance_criteria:
  - 'F4 — the persisted policy round-trips. The policy a run was started under is recoverable from the
    store and equal to the one supplied, including its layers, for a layered policy and for a single-layer
    one. A permissive policy is stored as such and is distinguishable from no record at all.

    '
  - 'N1 — no schema break. `CHECKPOINT_FORMAT` stays 7, asserted by a test. Every new table is created
    with `CREATE TABLE IF NOT EXISTS` in `Store::from_conn`; no existing table is renamed, reshaped or
    has a column removed. A store written by 0.12.0 opens under 0.13.0 and every 0.12.0 test that reads
    the schema still passes.

    '
  - 'O3 — the persisted policy is readable for an audit: a finished run can answer what rules it ran under,
    from the crate''s own API rather than by opening the SQLite file.

    '
  files:
  - src/state.rs
  - src/lib.rs
  - tests/policy.rs
  evidence: []
- id: US-IO-HARNESS-0.13.0-T02
  summary: 'A policy-bearing resume, and a bare `resume` that refuses rather than downgrades. `resume_with`
    and `resume_with_observed` take `policy: &Policy` and `approver: &dyn Approver` in the positions `run_with`/`run_with_observed`
    use (src/run.rs:200-218), threading them into `run_workspace_from` (src/run.rs:1207) and `McpSession::connect`
    where `resume_observed` currently substitutes `Policy::permissive()` and `&ApproveAll` (src/run.rs:336,
    :346). `resume` and `resume_observed` keep their signatures and gain one behaviour: a run whose stored
    record says the caller enforced a policy returns a typed error naming the run and `resume_with`, before
    any provider call. Both new functions join the `pub use run::{...}` at src/lib.rs:254.'
  why_required: This is the defect. A caller who ran under a deny-by-default policy and resumed after
    a crash got an agent with no boundary and no warning. `resume_with` alone would not close it — every
    existing `resume` call site would stay silently permissive — so the refusal is half the fix, not a
    nicety.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.13.0-T01
  acceptance_criteria:
  - 'F1 — a resumed run enforces the caller''s policy. A workspace run started under a deny-by-default
    policy, interrupted, and resumed through `resume_with` refuses the denied action, records the refusal
    in the trace under the original `run_id`, and does not perform it. The negative control is an acceptance
    criterion, not an extra: the same scenario driven through today''s code path must show the action
    performed, so the test is proven able to fail on exactly the defect it guards.

    '
  - 'F2 — the bare `resume` refuses a policy-bearing run. A run started through `run_with` under a non-permissive
    policy and resumed through `resume` returns a typed error that names the run and `resume_with`, performs
    no provider call, and leaves the run resumable. Asserted by the absence of a new step row and by a
    provider call counter at zero.

    '
  - 'F3 — the bare `resume` is unchanged for every run that had no boundary. A run started through `run`,
    `run_observed` or `run_with` with a permissive policy resumes through `resume` with a canonicalised
    trace byte-identical to 0.12.0''s. 0.7.0''s resume contract holds for everyone whose behaviour was
    already correct.

    '
  files:
  - src/run.rs
  - src/lib.rs
  - tests/policy.rs
  - tests/checkpoint.rs
  evidence: []
- id: US-IO-HARNESS-0.13.0-T03
  summary: Serde on the context ledger types, with a total kind mapping. `Serialize`/`Deserialize` on
    `context::Ledger` (src/context.rs:119), `Observation` (:92) and `ObsKind` (:34) — none of the three
    has any today and the module does not import serde at all. `ObsKind` already carries a variant-to-string
    `label` (:74) with no inverse; the mapping becomes total in both directions and is pinned variant
    by variant, so an eleventh variant cannot be added without the mapping following it.
  why_required: The ledger cannot be made durable until its types can cross the store boundary. Splitting
    this from T04 keeps the derive-and-mapping decision — which is where the silent-truncation risk lives
    — separate from the schema and the restore path.
  status: todo
  depends_on: []
  acceptance_criteria:
  - 'F9 — every observation kind survives the round trip. All ten `ObsKind` variants (src/context.rs:34-54)
    persist and restore to an equal value, asserted variant by variant so adding an eleventh without extending
    the mapping fails the build or the test rather than shortening a ledger at runtime. A row whose kind
    does not parse is an error, not a skipped entry.

    '
  files:
  - src/context.rs
  evidence: []
- id: US-IO-HARNESS-0.13.0-T04
  summary: A durable observation ledger, restored in both loops. A table in the `context_events` shape
    holding each `Observation`'s `step`, `kind` and `target` — the typed triple that supersession reads
    (`target_is_the_subject`, src/context.rs:65) and that is lost today; the text itself is already durable
    in `steps.result` via `text_for_step` (src/run.rs:1401, :2041), so whether the text is stored again
    or joined back is the one design call to settle here. Written on the path that already commits a step,
    and restored at both construction sites — `run_workspace_from` (src/run.rs:1242) and `run_agent` (src/run.rs:1821)
    — which build a fresh empty ledger after `start_step` is already known.
  why_required: A resumed run currently re-derives its context instead of restoring it, so it asks the
    model a different question than the process before it would have. Both construction sites are named
    because a fix that lands in one leaves the same defect at a depth where it is harder to see.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.13.0-T03
  acceptance_criteria:
  - 'F5 — the ledger is restored, not re-derived. A resumed workspace run''s ledger equals the ledger
    the uninterrupted run held at the same step: the same observations, in the same order. Asserted on
    the ledger itself, not only on the resulting trace, so a coincidental match cannot pass.

    '
  - 'F6 — the same holds for the sub-agent loop, at depth. A sub-agent run interrupted and resumed restores
    its own ledger, and the parent''s ledger is unaffected by the child''s restore.

    '
  - 'N3 — the ledger persistence costs at most one write per step boundary, on the path that already commits
    a step. No new write on a step that does not commit, and no read of the ledger table outside resume.

    '
  files:
  - src/state.rs
  - src/run.rs
  - src/context.rs
  - tests/context.rs
  evidence: []
- id: US-IO-HARNESS-0.13.0-T05
  summary: Replay survives an interruption in every loop. With the ledger restored, the workspace and
    sub-agent replay paths reproduce their own requests across a resume, so 0.12.0's divergence report
    (tests/determinism.rs:307) becomes an equality assertion of the kind the single-file case already
    passes (:375). The refusal 0.12.0 shipped stays reachable for a request that genuinely was never recorded.
  why_required: 0.12.0's F10 shipped with its second half unmet and iterations/US-IO-HARNESS-0.12.0-I01
    recorded it as unfixable without checkpointing the ledger. This task is the promise coming due; an
    evaluation harness that cannot survive an interruption cannot measure a 24-hour run.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.13.0-T04
  acceptance_criteria:
  - 'F7 — a recorded case replays identically across an interruption, in the workspace loop and the sub-agent
    loop. The canonicalised trace of the interrupted-then-resumed replay equals the uninterrupted replay''s,
    which is 0.12.0''s F10 second half, recorded as unmet in iterations/US-IO-HARNESS-0.12.0-I01. The
    single-file case that already passes must keep passing, asserted in the same test file.

    '
  - 'F8 — replay''s refusal path stays honest where it is still correct. A replay asked for a request
    that genuinely was never recorded still fails loudly with 0.12.0''s non-retryable error. The release
    removes the cause of the false refusals, not the refusal.

    '
  files:
  - tests/determinism.rs
  - src/run.rs
  evidence: []
- id: US-IO-HARNESS-0.13.0-T06
  summary: A 0.12.0 store and a 0.12.0 checkpoint still work. `CHECKPOINT_FORMAT` stays 7 (src/state.rs:16)
    under a test that asserts it, every new table is `CREATE TABLE IF NOT EXISTS` and no existing table
    is reshaped, and a run checkpointed by 0.12.0 — which has no policy record and no ledger rows — resumes
    with 0.12.0 behaviour and a recorded reason rather than failing or inventing a boundary. The public-surface
    diff is captured as evidence in the shape 0.10.0 used.
  why_required: Absence in the store and "permissive" are different facts, and conflating them would invent
    a permission decision nobody made. This is also the task that proves the release kept the additive-schema
    constraint rather than asserting it did.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.13.0-T02
  - US-IO-HARNESS-0.13.0-T04
  acceptance_criteria:
  - 'N1 — no schema break. `CHECKPOINT_FORMAT` stays 7, asserted by a test. Every new table is created
    with `CREATE TABLE IF NOT EXISTS` in `Store::from_conn`; no existing table is renamed, reshaped or
    has a column removed. A store written by 0.12.0 opens under 0.13.0 and every 0.12.0 test that reads
    the schema still passes.

    '
  - 'N2 — a 0.12.0 checkpoint still resumes. A run checkpointed by 0.12.0 has no persisted policy and
    no persisted ledger; resuming it under 0.13.0 behaves as 0.12.0 did — it does not refuse for a missing
    policy record, and it re-derives its context — and the degradation is recorded rather than silent.
    Absence must read as absence, never as "permissive" or "empty ledger asserted".

    '
  - 'N5 — the additive API does not break a single existing caller. Every 0.12.0 entry point keeps its
    signature; the public-surface diff shows additions and no removals or changes, captured as evidence
    the way 0.10.0''s was.

    '
  files:
  - tests/checkpoint.rs
  - src/state.rs
  evidence: []
- id: US-IO-HARNESS-0.13.0-T07
  summary: The boundary, documented where a developer meets it. Every resume entry point's doc comment
    says what it preserves and what it does not, and `resume`'s names `resume_with` — so the answer is
    at the call site, not in a changelog. The CHANGELOG carries the migration note for the one behaviour
    that changes for an existing caller, with the reason the error is the safer default.
  why_required: The error message and the doc comment are what a developer meets at the moment their production
    resume stops working. O2 is an acceptance criterion rather than a courtesy for that reason.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.13.0-T02
  - US-IO-HARNESS-0.13.0-T04
  acceptance_criteria:
  - 'O1 — every resume entry point documents what it preserves and what it does not, in the doc comment,
    so the answer is at the call site rather than in the changelog. `resume`''s comment says it is for
    runs that had no policy and names `resume_with`.

    '
  - 'O2 — the CHANGELOG carries a migration note for the one behaviour that changes for an existing caller:
    `resume` on a policy-bearing run now errors. It names the fix (`resume_with`) and states why the error
    is the safer default.

    '
  files:
  - src/run.rs
  - CHANGELOG.md
  evidence: []
- id: US-IO-HARNESS-0.13.0-T08
  summary: The live run and the release gates. One workspace run against a real provider under a real
    policy, killed mid-run and resumed — the evidence 0.12.0 owed and never produced — with the transcript,
    the public-surface diff and the determinism comparison stored under evidence/0.13.0/. Full suite,
    clippy, rustfmt, and the five-leg CI matrix green, with no new runtime dependency and no new feature
    flag.
  why_required: Every functional criterion in this release runs against fixtures and recordings. A live
    run is the only thing that exercises the observer, the recording and the restored resume together
    on a path no fixture covers, and 0.12.0 shipped without it.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.13.0-T05
  - US-IO-HARNESS-0.13.0-T06
  - US-IO-HARNESS-0.13.0-T07
  acceptance_criteria:
  - 'O4 — the live-run transcript, the public-surface diff and the determinism comparison are stored under
    evidence/0.13.0/ in the shape previous releases used.

    '
  - 'N4 — no new runtime dependency, and no new feature flag on an existing one.

    '
  - 'N6 — five-leg CI green on the three-OS matrix plus msrv and lint, with the determinism leg included,
    since a trace comparison is the leg most sensitive to platform differences.

    '
