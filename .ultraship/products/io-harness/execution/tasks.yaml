product: io-harness
version: 0.51.0
tasks:
- id: US-IO-HARNESS-0.51.0-T01
  summary: Render a whole-file unified diff, and reverse-apply one, as pure functions in this crate.
  why_required: Every other piece of the release reads or writes a hunk. Without a differ that round-trips
    there is nothing to store, nothing to render and nothing to revert, and a fragment-anchored diff is
    the failure F1 exists to catch.
  status: done
  depends_on: []
  acceptance_criteria:
  - '**F1 — a stored hunk is anchored to the file and reverse-applies byte for byte.** A run edits a file
    at a known line with `edit_file`; `Store::edits(run)` returns that edit with a `hunk` whose `@@` header
    names the **file''s** line numbers, and applying it in reverse to the file''s after text reproduces
    the before text byte for byte, trailing newline included. Asserted for a change at the start of a
    file, in the middle, at the end, and in a file with no final newline — four positions, because a fragment-anchored
    diff is right by accident at the start and wrong everywhere else. Sabotage: compute the hunk from
    `search`/`replacement` rather than from the file''s two texts, under which every position but the
    first fails and nothing else here does.

    '
  - '**N1 — no new dependency.** `cargo tree` for the default feature set is unchanged at **402** crates
    on macOS and Linux. The differ is the head-and-tail walk `Edit::measure` already performs; the unified-diff
    parser and applier are written in this crate. A diff or patch crate is a criterion failure, not a
    trade-off.

    '
  files:
  - src/diff.rs
  - src/lib.rs
  evidence:
  - '17 unit tests in src/diff.rs pass: cargo test --lib diff:: — 17 passed, 0 failed.'
  - 'generated_pairs_round_trip_in_both_directions drives 2000 generated (old, new) pairs through render
    -> parse -> apply and render -> parse -> reverse -> apply, requiring both to reproduce the other side
    byte for byte. It failed on case 106 and the failure was a real defect, not a fixture: a line''s identity
    includes whether it is terminated, so comparing text alone made an unterminated last line equal to
    the identically-spelled terminated one. Fixed by comparing (text, is-unterminated-last-line) as the
    unit, which also deleted the special case the hand-written tests had needed.'
  - 'Two defects the hand-written cases found first: str::lines() strips a trailing carriage return, so
    parsing a CRLF patch silently deleted the \r from every line and wrote back mixed endings — parse
    now splits on \n by hand; and a file that only gained or lost its final newline rendered a hunk of
    pure context lines that changed nothing.'
  - 'No dependency added: the differ is the common-head/common-tail walk Edit::measure already performs,
    and the parser and applier are ~200 lines in src/diff.rs.'
- id: US-IO-HARNESS-0.51.0-T02
  summary: Store the hunk on every edit, without moving the line counts.
  why_required: The release's outcome is that a change stops being a pair of counts. The counts themselves
    have meant 'the size of the replacement' since 0.18.0 and rewriting them silently is the release's
    largest own-goal, so the two computations must be separate.
  status: done
  depends_on:
  - US-IO-HARNESS-0.51.0-T01
  acceptance_criteria:
  - '**F1 — a stored hunk is anchored to the file and reverse-applies byte for byte.** A run edits a file
    at a known line with `edit_file`; `Store::edits(run)` returns that edit with a `hunk` whose `@@` header
    names the **file''s** line numbers, and applying it in reverse to the file''s after text reproduces
    the before text byte for byte, trailing newline included. Asserted for a change at the start of a
    file, in the middle, at the end, and in a file with no final newline — four positions, because a fragment-anchored
    diff is right by accident at the start and wrong everywhere else. Sabotage: compute the hunk from
    `search`/`replacement` rather than from the file''s two texts, under which every position but the
    first fails and nothing else here does.

    '
  - '**F2 — the line counts do not move, and this is the negative control the release rests on.** Over
    a corpus of `edit_file` and `write_file` calls covering replacement, insertion, deletion and a rewrite
    with identical content, `lines_added` and `lines_removed` are identical to this build''s for every
    row. Sabotage: measure the counts from the whole-file texts the hunk is computed from — the natural
    tidy-up — under which at least one count moves and F1 still passes.

    '
  - '**N4 — the DDL is exactly two additive columns and nothing else.** `git diff main -- src/state.rs`
    shows `ALTER TABLE edits ADD COLUMN hunk TEXT` and `ALTER TABLE rewinds ADD COLUMN undid_step INTEGER`,
    each by the established `let _ = conn.execute(..)` line, and no `CREATE TABLE`, no `CREATE INDEX`
    and no `CHECKPOINT_FORMAT` movement — it stays at 7.

    '
  files:
  - src/state.rs
  - src/run.rs
  - tests/hunks.rs
  - tests/cross_version.rs
  evidence:
  - 'tests/hunks.rs: 5 passed. a_stored_hunk_is_anchored_to_the_file_and_reverse_applies drives edit_file
    at the start, the middle and the end of a file plus a file with no final newline, and reverse-applies
    each stored hunk with a hand-rolled applier in the test — deliberately not the crate''s own, which
    would pass for a renderer and an applier wrong in the same direction.'
  - 'F1 SABOTAGE: computing the hunk from search/replace instead of the file''s two texts. Fails a_stored_hunk_is_anchored_to_the_file_and_reverse_applies
    and nothing else — 4 passed, 1 failed.'
  - 'F2 SABOTAGE FAILED NOTHING ON THE FIRST ATTEMPT, AND THAT IS A FINDING. Measuring the counts from
    the whole-file texts passed the whole corpus, because for a tidy whole-line edit the two measures
    agree: trimming the common head and tail of the fragment finds the same changed span as trimming them
    over the file. A brute-force search over 400,000 single-substring replacements found the class that
    diverges — a replacement that does not begin and end on a line boundary. Deleting a substring INSIDE
    a line is (0 added, 1 removed) to the fragment and (1, 1) to the file, because the file still has
    a line there. Two such cases were added to the corpus and the sabotage then failed the named test
    and only it — 4 passed, 1 failed, left (1, 1) right (0, 1).'
  - 'Line counts unchanged: the corpus asserts this build''s numbers for replacement, insertion, whole-line
    deletion, in-line deletion, an off-boundary split, a whole-file write and a write of identical content.'
  - DDL is one ALTER TABLE edits ADD COLUMN hunk TEXT, and the column is deliberately NOT named in the
    CREATE TABLE. SQLite appends an added column to the statement it keeps in sqlite_master, so declaring
    it in both would put it mid-table for a fresh store and last for a migrated one — the same shape memory.kind
    and runs.turn_kind already use.
  - 'tests/cross_version.rs caught the addition before any of this was declared: ''a statement 0.22.0
    wrote is gone or altered''. Declared in COLUMNS_ADDED_SINCE_0_22_0 and the suite is green — 5 passed.'
  - 'Neighbouring suites unchanged: edit_file 9, edit_tool 8, multi_file 3, rewind 13, review_change 2,
    accounting 15, cross_version 5, cross_version_0_29_0 2, store_open 4 — all passed.'
- id: US-IO-HARNESS-0.51.0-T03
  summary: Render a run's whole change as a step-ordered patch series.
  why_required: 'It is the operator-facing half of the fallback scope: a trace that holds hunks and cannot
    show them has not made the change reviewable.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.51.0-T02
  acceptance_criteria:
  - '**F1 — a stored hunk is anchored to the file and reverse-applies byte for byte.** A run edits a file
    at a known line with `edit_file`; `Store::edits(run)` returns that edit with a `hunk` whose `@@` header
    names the **file''s** line numbers, and applying it in reverse to the file''s after text reproduces
    the before text byte for byte, trailing newline included. Asserted for a change at the start of a
    file, in the middle, at the end, and in a file with no final newline — four positions, because a fragment-anchored
    diff is right by accident at the start and wrong everywhere else. Sabotage: compute the hunk from
    `search`/`replacement` rather than from the file''s two texts, under which every position but the
    first fails and nothing else here does.

    '
  files:
  - src/state.rs
  - tests/hunks.rs
  evidence:
  - 'a_runs_change_renders_as_a_step_ordered_patch_series passes: two edits to one file render two ---
    a/ +++ b/ header pairs, in step order.'
  - Rendered as a SERIES and documented as one. Two edits to the same file take their line numbers from
    that file as it stood at each of them, so the second hunk is only correct once the first has been
    applied. Joining the hunks under one pair of headers would look like a patch and not apply.
  - An edit with no stored hunk contributes a comment line naming the step, tool, path and counts rather
    than nothing — asserted by a_write_that_changes_nothing_stores_no_hunk, so a series never silently
    omits a change.
- id: US-IO-HARNESS-0.51.0-T04
  summary: 'Add patch_file: parse a unified diff, match every hunk against the original, write once.'
  why_required: A multi-hunk change costs one call per hunk today, and the all-or-nothing rule is what
    makes a patch safe rather than a way to half-write a file.
  status: done
  depends_on:
  - US-IO-HARNESS-0.51.0-T01
  acceptance_criteria:
  - '**F3 — `patch_file` applies a multi-hunk change in one call.** A patch with three hunks at separated
    line ranges is applied by one tool call; the file afterwards is byte-identical to the result of applying
    the same three changes as three `edit_file` calls, one `edits` row is written for the patch, and one
    snapshot row. Sabotage: apply the hunks in sequence against the file as it is being rewritten rather
    than at their own offsets against the original, under which the second and third hunks land at moved
    lines and the byte-identity assertion fails.

    '
  - '**F4 — a patch that does not fit changes nothing.** A patch whose first hunk fits and whose second
    does not leaves the file byte-identical to what it was, writes **no** `edits` row and **no** snapshot
    row, and produces an observation naming the failing hunk''s index and the line it expected. Asserted
    as an absence and a presence together, because a build that stops at the first failure after writing
    the first hunk passes any assertion that reads only the message. Sabotage: apply each hunk as it is
    validated, under which the byte-identity assertion fails and only this fails.

    '
  - '**N7 — the tool catalogue grows by exactly two schemas and no protocol.** `patch_file` and `check`
    are added; no existing tool''s schema changes, so 0.38.0''s cacheable system prefix moves by those
    two schemas'' own bytes and nothing else. Asserted by the composed system prompt differing from this
    build''s only in the added schemas.

    '
  files:
  - src/tools/mod.rs
  - src/tools/workspace.rs
  - src/run.rs
  - tests/patch_tool.rs
  evidence:
  - 'tests/patch_tool.rs: 6 passed. a_three_hunk_patch_is_one_call_and_lands_where_three_edits_would drives
    the same three changes twice — once as three edit_file calls, once as one patch_file — and asserts
    the resulting files are byte-identical, one edits row, tool patch_file, observation ''applied 3 hunks''.'
  - F3 SABOTAGE, and the FIRST FIXTURE WAS TOO WEAK TO CATCH IT. Locating each hunk in the file as the
    previous hunks have already rewritten it — a running rewrite, the obvious spelling — passed, because
    every hunk in the first fixture replaced one line with one line and there was no drift for the wrong
    implementation to accumulate. The fixture now adds a line in its first hunk and removes one in its
    third; the sabotage then failed the named test and nothing else. Recorded in the test's own doc comment
    so the next person does not weaken it back.
  - 'F4 SABOTAGE: apply and write each hunk as it validates, stopping at the first that does not fit.
    Fails a_patch_whose_second_hunk_does_not_fit_changes_nothing AND a_three_hunk_patch_is_one_call —
    two named tests rather than one, both about the same write path, which is honest rather than over-broad:
    a per-hunk write breaks both the all-or-nothing claim and the offset claim.'
  - 'All-or-nothing asserted as an absence AND a presence: the file byte-identical, no edits row, rewind
    reporting Rewind::NotRecorded (so no snapshot row either), and the observation naming hunk 2 and the
    line it expected.'
  - patch_file cannot create a file and says to use write_file; a patch to a denied path is refused by
    the same Act::Write gate and the file is untouched.
  - Added to workspace_tools() only, so single-file mode is untouched. patch_file falls to Mutating in
    tool_effect, as everything outside the read-only trio does.
- id: US-IO-HARNESS-0.51.0-T05
  summary: 'Add check: the project''s own checker as an Act::Exec-gated tool that speaks its skips.'
  why_required: Without it the checker only ever answers after the write. The gate is not optional — a
    model-callable path to the project's build command must be refusable by the policy that refuses exec.
  status: done
  depends_on:
  - US-IO-HARNESS-0.51.0-T01
  acceptance_criteria:
  - '**F5 — the checker answers a question the model asked, including when it has nothing to say.** In
    a workspace whose ecosystem has a check command, `check` on a clean tree returns an observation saying
    so; on a broken tree it returns the checker''s findings; and in a workspace with **no** detected ecosystem
    it returns an observation naming the skip. The third is the discriminating one: the automatic post-edit
    path maps `Outcome::Skipped` to the empty string (`src/run.rs:11166-11168`) and the tool must not.
    Sabotage: route the tool through `diagnostics_after_write`''s mapping, under which the skip arm returns
    nothing and only this fails.

    '
  - '**F6 — the checker tool is policy-gated and the automatic path is not.** Under a policy denying `Act::Exec`
    on the detected checker''s program, a `check` call is refused, **no process is spawned**, and the
    refusal names the rule — while an `edit_file` under that same policy still succeeds and still carries
    its automatic post-edit diagnostics, because that path is the crate''s own reflex after a write the
    policy already allowed. Both halves asserted in one test, since the release''s claim is the distinction
    between them. Sabotage: call `diagnostics::after_edit` directly from the tool arm without the gate,
    under which the no-process assertion fails and only this fails.

    '
  - '**N7 — the tool catalogue grows by exactly two schemas and no protocol.** `patch_file` and `check`
    are added; no existing tool''s schema changes, so 0.38.0''s cacheable system prefix moves by those
    two schemas'' own bytes and nothing else. Asserted by the composed system prompt differing from this
    build''s only in the added schemas.

    '
  files:
  - src/tools/mod.rs
  - src/tools/diagnostics.rs
  - src/run.rs
  - tests/patch_tool.rs
  evidence:
  - 'tests/patch_tool.rs the_checker_answers_clean_findings_and_no_checker_at_all passes all three shapes:
    a clean crate says it found nothing, a crate with a type error returns the checker''s own findings
    (mismatched types / E0308), and a workspace with no project marker names the skip.'
  - 'F5 SABOTAGE: route the tool through diagnostics_after_write''s mapping, where Outcome::Skipped is
    the empty string. Fails the named test and only it. The distinction is the point — silence costs nothing
    when nobody asked, and reads as ''your project is clean'' when somebody did.'
  - 'F6 SABOTAGE: run the checker without the Act::Exec gate. Fails the_check_tool_is_exec_gated_while_the_automatic_check_is_not
    and only it.'
  - The gate checks the same two targets exec checks — the program alone and the joined argv — so both
    deny_exec("cargo") and deny_exec("cargo check*") reach it. No process spawned under a denying policy,
    asserted by the absence of target/, which cargo always creates.
  - 'The automatic post-edit checker stays UNGATED, and both halves are asserted in one test in two separate
    runs. Two runs and not two steps: target/ is the evidence a checker ran, so one run doing both would
    let the edit''s own check create it before the refusal could be asserted as an absence.'
  - diagnostics::checker(tc) resolves the argv without running it, so the policy can be asked about a
    command rather than about the word 'check'. after_edit is now that plus Checker::run.
- id: US-IO-HARNESS-0.51.0-T06
  summary: 'Add rewind_step and Reverted: undo one step by reverse-applying its stored hunks.'
  why_required: Undo has one granularity today, so a twenty-step run with one wrong step is thrown away
    whole. Reverse-application is order-sensitive, and reporting Stale rather than forcing an apply is
    what keeps it from corrupting a file.
  status: done
  depends_on:
  - US-IO-HARNESS-0.51.0-T02
  acceptance_criteria:
  - '**F7 — a newest-first walk restores every intermediate state exactly.** A run writes one file at
    steps 2, 4 and 6; reverting step 6, then 4, then 2 leaves the file byte-identical, after each revert,
    to what it held at the end of the preceding step, and byte-identical after the last to what `rewind`
    for that run produces. Asserted at each intermediate state rather than only at the end, because a
    build that reverse-applies in the wrong order can still arrive at the right final text when the changes
    do not overlap. Sabotage: apply the hunk forward instead of in reverse, under which the first intermediate
    assertion fails.

    '
  - '**F8 — an out-of-order revert reports `Stale` and touches nothing.** Reverting step 2 while steps
    4 and 6 still stand, where step 4 changed the same lines, returns `Reverted::Stale` and leaves the
    file byte-identical; no write is attempted, so a read-only path under the policy is not refused —
    it is not reached. Sabotage: skip the context match and apply anyway, under which the byte-identity
    assertion fails and only this fails.

    '
  - '**F9 — an edit with no stored hunk is reported, not treated as empty.** A run whose edit predates
    this release — a 0.50.0 store opened by this build, so `hunk` is NULL — reports `Reverted::NoHunk`
    for that path and leaves the file byte-identical. The same answer for an edit whose before text was
    `Kept::Unkept`. Sabotage: treat a NULL hunk as an empty patch, under which the revert reports success
    having done nothing and the assertion that it reported `NoHunk` fails.

    '
  files:
  - src/run.rs
  - src/lib.rs
  - docs/public-api.txt
  - tests/hunks.rs
  evidence:
  - 'tests/hunks.rs: 9 passed. reverting_newest_first_restores_every_intermediate_state drives three edits
    at three steps and asserts the file byte-identical after EACH revert, not only at the end — a build
    that reverse-applies in the wrong order can still arrive at the right final text when the changes
    do not overlap.'
  - 'F7 SABOTAGE: apply the hunk forward instead of in reverse. Fails reverting_newest_first_restores_every_intermediate_state
    and a_step_revert_and_a_run_rewind_are_different_rows — two named tests, both of which assert that
    a revert put something back.'
  - 'F8 SABOTAGE: skip the context match and splice the hunk''s old lines in at its stated position. Fails
    reverting_out_of_order_reports_stale_and_changes_nothing and only it. That test''s two edits overlap
    deliberately, so the older hunk''s context is gone and a fuzzy match would ''succeed''.'
  - 'F9 SABOTAGE: treat a NULL hunk as an empty patch. Fails an_edit_with_no_stored_hunk_is_reported_rather_than_skipped
    and only it. The absence is produced the way production produces it — a file whose previous contents
    were not UTF-8, so read_before kept no restore text.'
  - 'Reverted is #[non_exhaustive] with three variants, because ''it did not happen'' has two causes an
    operator must tell apart: Stale (the file has moved on — revert the later steps first) and NoHunk
    (there is nothing to undo it with, and never will be).'
  - 'docs/public-api.txt gains THREE enumerated lines, not the two the contract named: enum Reverted,
    fn rewind_step and fn rewind_step_observed. The observed variant exists because that is the shape
    rewind_run/rewind_run_observed already has and the event needs an observer. Stated rather than glossed.'
- id: US-IO-HARNESS-0.51.0-T07
  summary: Record a step revert in the trace, distinguishably from a run rewind.
  why_required: Store::rewinds would otherwise report 'something was undone' for two different acts, and
    an event stream that cannot tell them apart cannot be audited.
  status: done
  depends_on:
  - US-IO-HARNESS-0.51.0-T06
  acceptance_criteria:
  - '**F10 — a step revert is distinguishable in the trace from a run rewind.** `Store::rewinds` reports
    `undid_step: Some(4)` for a step revert and `None` for a `rewind_run` on the same run, and exactly
    one `EventKind::Reverted { undid_step, files }` is emitted per `rewind_step` call carrying the count
    from the value being returned rather than from a second query. The event round-trips through `serde`
    with no duplicate key, which is asserted rather than assumed. Sabotage: leave `undid_step` NULL for
    both, under which the distinguishability assertion fails and only this fails.

    '
  - '**N4 — the DDL is exactly two additive columns and nothing else.** `git diff main -- src/state.rs`
    shows `ALTER TABLE edits ADD COLUMN hunk TEXT` and `ALTER TABLE rewinds ADD COLUMN undid_step INTEGER`,
    each by the established `let _ = conn.execute(..)` line, and no `CREATE TABLE`, no `CREATE INDEX`
    and no `CHECKPOINT_FORMAT` movement — it stays at 7.

    '
  files:
  - src/state.rs
  - src/run.rs
  - src/observe.rs
  - tests/hunks.rs
  evidence:
  - 'F10: a_step_revert_and_a_run_rewind_are_different_rows passes — Store::rewinds reports undid_step:
    Some(step) for the revert and None for the rewind_run on the same run, and exactly one EventKind::Reverted
    fires with its count taken from the value being returned.'
  - 'F10 SABOTAGE: leave undid_step NULL for both acts. Fails the named test and only it.'
  - 'The event field is undid_step and NOT step. The kind is #[serde(flatten)]ed into RunEvent, which
    already carries a step, and a duplicate key compiles, serialises and fails only on the way back —
    decided while writing the contract rather than while implementing it. every_variant_round_trips covers
    it.'
  - 'Three census sites the enum has, all found by their own guards rather than by reading: the exhaustive
    match at src/observe.rs:1776, the round-trip sample set, and the event_names list. Each named the
    omission precisely.'
- id: US-IO-HARNESS-0.51.0-T08
  summary: Prove the null-column case in both directions across versions.
  why_required: Two additive columns mean every row an earlier release wrote has no hunk. Treating an
    absent hunk as an empty one would revert nothing and report success, which is the one way this release
    can silently lose an operator's work.
  status: done
  depends_on:
  - US-IO-HARNESS-0.51.0-T02
  - US-IO-HARNESS-0.51.0-T06
  acceptance_criteria:
  - '**O2 — cross-version is proven in both directions, including the NULL case.** A 0.50.0 store opened
    by this build gains both columns by `ALTER TABLE` and reports `hunk: None` and `undid_step: None`
    for every row it already held; a 0.51.0 store opened by 0.50.0 ignores both columns and reads every
    other field unchanged. Asserted by the existing cross-version suites plus the F9 case, which is the
    one an existing suite cannot cover because it is about a column that did not exist.

    '
  - '**F9 — an edit with no stored hunk is reported, not treated as empty.** A run whose edit predates
    this release — a 0.50.0 store opened by this build, so `hunk` is NULL — reports `Reverted::NoHunk`
    for that path and leaves the file byte-identical. The same answer for an edit whose before text was
    `Kept::Unkept`. Sabotage: treat a NULL hunk as an empty patch, under which the revert reports success
    having done nothing and the assertion that it reported `NoHunk` fails.

    '
  files:
  - tests/cross_version.rs
  - tests/rewind.rs
  evidence:
  - 'tests/cross_version.rs: 7 passed (was 5). an_edit_written_before_0_51_0_has_no_hunk_and_is_reported_as_having_none
    opens the committed 0.22.0 fixture — a database written by a real io-harness 0.22.0 from crates.io
    — whose edits table has one row and no hunk column at all. Opening it adds both columns by ALTER TABLE;
    the row reads back hunk: None, its 0.22.0 counts unchanged at (1, 0), rewind_step reports Reverted::NoHunk
    and the file is byte-identical, and Store::patch names the change as unrenderable rather than omitting
    it.'
  - This is the case no other suite can cover, because it is about a column that did not exist. Reproducing
    it inside tests/hunks.rs would mean writing NULL over a row this build wrote, which tests the reader
    against a state the writer cannot produce.
  - the_queries_a_0_50_0_binary_makes_still_answer_against_a_0_51_0_store runs the exact five-column SELECTs
    a 0.50.0 binary makes against edits and rewinds, against a store this release wrote. Asserted by running
    them rather than by arguing from the fact that the columns are nullable.
  - the_schema_this_release_creates_adds_to_0_22_0s_and_alters_none_of_it and the_checkpoint_format_is_still_7
    both pass with hunk declared in COLUMNS_ADDED_SINCE_0_22_0; CHECKPOINT_FORMAT is unmoved at 7.
- id: US-IO-HARNESS-0.51.0-T09
  summary: Bring every checked-in documentation surface to 0.51.0, including the comment that named it.
  why_required: src/verify.rs says computing a unified diff is 0.51.0's work. Shipping the release while
    the source still calls it future work is a surface that contradicts the code, and docs_drift, changelog,
    readme, guide_pages and public_api are gates that fail on it.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.51.0-T03
  - US-IO-HARNESS-0.51.0-T04
  - US-IO-HARNESS-0.51.0-T05
  - US-IO-HARNESS-0.51.0-T07
  acceptance_criteria:
  - '**N3 — the break is exactly two fields on two read-only types, and it is stated rather than discovered.**
    `Edit` gains `hunk: Option<String>` and `RewindRecord` gains `undid_step: Option<u32>`. Both derive
    `Default` and both are produced by the store and consumed by a caller, never constructed by one in
    any doc example, test or example in this repository — so `..Default::default()` keeps working and
    only an exhaustive struct literal outside the crate breaks, which is the same cost `media` (0.15.0)
    and `effort` (0.31.0) were counted at. Neither takes `#[non_exhaustive]`: the attribute forbids functional
