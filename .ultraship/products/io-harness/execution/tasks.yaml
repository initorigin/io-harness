product: io-harness
version: 0.53.0
tasks:
- id: US-IO-HARNESS-0.53.0-T01
  summary: Write the CDP client — NUL framing, id correlation, an event route that stays live while a
    request is outstanding — over AsyncRead + AsyncWrite, with the fixture browser that misbehaves on
    purpose.
  why_required: Every other task in the release sends a request through this client. A client that correlates
    by arrival order deadlocks the moment a page emits events mid-request, which every real page does,
    so the fixture that floods events and answers out of order is written before the client it tests.
  status: todo
  depends_on: []
  acceptance_criteria:
  - '**F1 — the client frames on NUL and survives arbitrary chunking.** The bytes the client writes for
    a known request are asserted exactly: one JSON object followed by a single `0x00`, with no length
    header and no newline framing. Reading is asserted symmetrically over a stream that delivers three
    messages in chunks split mid-object and mid-multi-byte-character, and over one message arriving in
    a single chunk with two others. Sabotage: frame on newline instead of NUL, under which the chunked
    cases and a message whose payload contains a newline fail, and nothing else here does.

    '
  - '**F2 — a response is matched to its request by `id` while events flood in.** Two requests are outstanding;
    the fixture sends a burst of unsolicited events, answers the **second** request, more events, then
    the first. Each call receives its own answer, neither event is returned as one, and the events still
    reach the console drain. Sabotage: take the next message as the answer, under which both calls receive
    the wrong value and only this fails.

    '
  files:
  - src/browser.rs
  - tests/browser.rs
  - examples/browser_fixture.rs
  evidence: []
- id: US-IO-HARNESS-0.53.0-T02
  summary: 'Launch the browser over a pipe pair on descriptors 3 and 4: binary resolution, the Act::Exec
    spawn gate, kill-on-drop, the temporary profile, and the typed Windows refusal.'
  why_required: The client is useless without a child to speak to, and the ways a child goes wrong — never
    started, started and denied, outliving its run — are the release's safety claims rather than its plumbing.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.53.0-T01
  acceptance_criteria:
  - '**F8 — no browser process survives the run.** After a run that started a browser ends — normally,
    and by being dropped mid-action — the child process is gone, asserted on the process rather than on
    a shutdown call having been issued, and the temporary user-data directory is removed. Sabotage: remove
    the kill-on-drop, under which the dropped-run arm fails and only this fails.

    '
  - '**F9 — a browser that is not installed is a refusal naming it, never a download.** A configured binary
    that does not exist produces a typed configuration error naming the binary, no process is spawned,
    and no network request of any kind is made by the crate. Sabotage: fall back to the first name on
    the PATH list when the configured binary is missing, under which the naming assertion fails and only
    this fails.

    '
  - '**F11 — on Windows the feature refuses cleanly.** Every entry point returns a typed configuration
    error naming the platform, no process is spawned, and the rest of the crate is unaffected. Asserted
    on the Windows leg of the matrix, which is the only place it can be.

    '
  files:
  - src/browser.rs
  - src/error.rs
  - tests/browser.rs
  evidence: []
- id: US-IO-HARNESS-0.53.0-T03
  summary: Gate every document navigation at the paused request against the run's own Policy, and wire
    browser_navigate on top of it.
  why_required: This is the release's central claim. A browser that reaches any host the policy denies
    is not a bounded capability, and the gate has to sit at the request for the claim to survive a navigation
    the model did not type.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.53.0-T02
  acceptance_criteria:
  - '**F3 — a navigation to a denied host is stopped at the request and the run is told why.** Under a
    policy permitting one host and denying another, `browser_navigate` at the denied host produces a refusal
    observation naming the act, the target and the rule, the fixture records that the request was **failed
    rather than continued**, and a `BrowserNavigated { permitted: false }` event is written. The permitted
    host in the same run continues and loads. Both halves in one test, since the claim is the distinction.
    Sabotage: continue every paused request, under which the denied half fails and only this fails.

    '
  - '**F4 — a navigation the model did not type is gated by the same mechanism.** A click on a link whose
    target is a denied host, and a script-initiated navigation to one, are both stopped at the request
    with the same event and the same refusal, with no `browser_navigate` call anywhere in the run. Sabotage:
    gate the `browser_navigate` argument instead of the paused request — under which **F4 fails and F3
    still passes**, which is the point of having both.

    '
  files:
  - src/browser.rs
  - src/tools/browser.rs
  - src/run.rs
  - tests/browser.rs
  evidence: []
- id: US-IO-HARNESS-0.53.0-T04
  summary: browser_read, and the console and page-error capture that rides every action's observation.
  why_required: Reading the rendered page is the outcome's first half, and an action whose console output
    is discarded tells the model nothing about why the page did not change.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.53.0-T03
  acceptance_criteria:
  - '**F6 — console output and uncaught page errors reach the observation of the action that produced
    them.** An action that causes a console message and an uncaught error produces an observation containing
    both, labelled by kind, with the error''s readable description rather than the bare word `Uncaught`;
    an action that causes neither says so rather than omitting the section. Sabotage: drop the exception
    route and keep the console route, under which the error arm fails and the console arm passes — the
    two arms are separately asserted for exactly this reason.

    '
  files:
  - src/browser.rs
  - src/tools/browser.rs
  - tests/browser.rs
  evidence: []
- id: US-IO-HARNESS-0.53.0-T05
  summary: browser_screenshot, staged through the existing media path so the model actually looks at the
    image.
  why_required: The screenshot is the evidence the text cannot give, and an image that is recorded but
    never reaches the provider is the failure that looks like success.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.53.0-T04
  acceptance_criteria:
  - '**F7 — a screenshot reaches the model as an image.** `browser_screenshot` stages a PNG through the
    existing media path and the next request carries it as image content, asserted on the outbound request
    rather than on a stored row, because staging and sending are different bugs and only the first leaves
    a row. The observation names the viewport. Sabotage: return the base64 as observation text instead
    of staging it, under which the outbound-request assertion fails and only this fails.

    '
  files:
  - src/browser.rs
  - src/tools/browser.rs
  - src/run.rs
  - tests/browser.rs
  evidence: []
- id: US-IO-HARNESS-0.53.0-T06
  summary: browser_click, browser_type and browser_scroll — trusted input events at a resolved element,
    and a typed failure when the selector matches nothing.
  why_required: 'Without these the agent can look at a page and not use it. The no-match case is the one
    that must fail loudly: a model that believes it clicked reasons forward from a state that never happened.'
  status: todo
  depends_on:
  - US-IO-HARNESS-0.53.0-T05
  acceptance_criteria:
  - '**F5 — a selector that matches nothing fails and names itself.** `browser_click` and `browser_type`
    against a selector matching no element each return a typed failure naming the selector, no input event
    is dispatched — asserted on the fixture never being asked to dispatch one — and the run continues.
    A selector that matches produces a dispatched input event at the resolved box. Sabotage: treat a missing
    element as a no-op success, under which both no-match assertions fail and only these do.

    '
  files:
  - src/browser.rs
  - src/tools/browser.rs
  - tests/browser.rs
  evidence: []
- id: US-IO-HARNESS-0.53.0-T07
  summary: The [browser] config table with its project-scope refusal, the cargo feature, and tool registration
    conditional on a configured browser.
  why_required: The release is off by default twice over, and the negative control — a run that configures
    nothing is byte-identical to the previous release — is what protects every existing consumer's cached
    prompt prefix and trace.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.53.0-T06
  acceptance_criteria:
  - '**F10 — a run with no browser configured is this build''s run, byte for byte.** No tool schema in
    the catalogue, no child process, no event, and a composed prompt byte-identical to the same run on
    0.52.0. Asserted on the bytes, since this is the negative control the whole release rests on. Sabotage:
    register the schemas unconditionally, under which the byte-identity assertion fails and only this
    fails.

    '
  - '**N2 — the default build is unchanged.** With no features, the compiled tool catalogue, the composed
    prompt and the dependency tree are byte-identical to 0.52.0''s, and `src/browser.rs` is not compiled
    at all.

    '
  - '**N6 — the six schemas are the only prompt-byte change, and only for a configured run.** The difference
    between a configured and an unconfigured run''s composed prompt is exactly those six schemas, asserted
    as a diff rather than as a size.

    '
  files:
