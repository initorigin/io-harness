product: io-harness
version: 0.35.0
tasks:
- id: US-IO-HARNESS-0.35.0-T01
  summary: 'The manifest and the loader: `src/plugin.rs` with `Manifest`, `Plugin`, `Dropped` and `Plugins`.
    A plugin.toml is parsed into the types `io.toml` already deserializes, its id is validated `[a-z0-9][a-z0-9-]{0,31}`,
    `${cmd:}` is refused in every scope, and every failure becomes a `Dropped` rather than an error
    — there is no error path out of loading.'
  why_required: Nothing else in the release exists without a loaded plugin. Every other task either
    feeds this one its declarations or consumes what it produced.
  status: todo
  depends_on: []
  acceptance_criteria:
  - '**F6 — a broken bundle costs exactly itself.** Four plugins declared: one valid, one with no `plugin.toml`,
    one whose TOML does not parse, one whose manifest carries an unknown key. The run reaches its normal
    outcome, `Plugins::dropped()` has exactly three entries whose errors name three different causes,
    exactly three `EventKind::PluginDropped` events reach the observer, and every contribution of the
    valid one is present. The control is the same four directories with every manifest repaired: `dropped()`
    is empty and four `PluginLoaded` events fire. A duplicate id and a malformed id (`Rust_Review`,
    `a__b`, 33 characters) are asserted the same way, each dropping only its own plugin.

    '
  - '**F8 — `${cmd:}` is refused in a manifest from every scope.** A manifest carrying `${cmd:...}`
    in any value is dropped whether it was declared from the user file, `io.local.toml` or `io.toml`,
    with the error naming the substitution. Asserted for all three scopes, because the rule that makes
    this different from `io.toml`''s own `${cmd:}` rule is precisely that it does not depend on the
    scope.

    '
  - '**N1 — no new dependency.** `cargo tree` on macOS and Linux still reads 402 lines. A manifest is
    parsed by the `toml` and `serde` already present, into the `AgentDef`, `McpServer`, `Hook` and `Layer`
    types already deserialized from `io.toml`.

    '
  files:
  - src/plugin.rs
  - src/lib.rs
  - tests/plugin.rs
  evidence: []
- id: US-IO-HARNESS-0.35.0-T02
  summary: '`[[plugin]] path = "..."` in the configuration file, `plugin` added to `APPENDING`, the
    declaring scope captured per entry as each scope is read, `Config::plugins()`, and the trust rule:
    a project-scoped plugin contributes no `[[hook]]` and no `[[mcp]]`, and plugin policy may carry
    deny rules only.'
  why_required: The trust rule is the reason a bundle can be pointed at a cloned repository at all,
    and the per-entry scope it rests on is unrecoverable after the merge concatenates the arrays.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.35.0-T01
  acceptance_criteria:
  - '**F4 — the trust rule, both arms, whole-plugin.** The same plugin directory, whose manifest declares
    a `[[hook]]`, is declared once from `io.toml` and once from `io.local.toml`. From `io.toml` it is
    dropped, `Dropped::error` names the `hook` key and the scope, and the discriminating assertion is
    that **none** of its other contributions is present — no skill, no agent, no layer — because a half-applied
    stranger''s manifest is the failure this rule exists to prevent. From `io.local.toml` it loads and
    the hook fires on a real event. The same pair is run for `[[mcp]]`. Trap 51 applies: one sabotage
    per arm.

    '
  - '**F5 — plugin policy may only narrow, asserted by effect.** A manifest whose layer carries an `allow_write`
    for a path the application''s policy denies. The plugin is dropped naming the rule, **and the write
    is still refused** — the assertion is the run''s outcome and the stored refusal, not the error text.
    A loader that validated after merging the layer fails this and passes an error-text assertion. The
    same pair for a manifest carrying `[policy.defaults]`.

    '
  - '**N6 — `[[hook]]`''s existing project-scope refusal is untouched.** The 0.28.0 rule that a project-scoped
    `io.toml` may declare no `[[hook]]` at all, inside a `[profile]` too, still holds with the same
    error, asserted by the pre-existing tests passing unchanged. This release adds a rule beside it
    and weakens nothing.

    '
  files:
  - src/config.rs
  - src/plugin.rs
  - tests/plugin.rs
  - tests/config.rs
  evidence: []
- id: US-IO-HARNESS-0.35.0-T03
  summary: 'Namespacing as attribution: every contributed skill, agent, policy layer and MCP server
    id becomes `<plugin>__<name>` at load, plus `Plugins::apply_to` and `Plugins::templates`.'
  why_required: Attribution is the half of the roadmap outcome that makes a bundle auditable, and it
    is the reason no new table is needed — without it a refusal or a spend draw names nothing.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.35.0-T01
  - US-IO-HARNESS-0.35.0-T02
  acceptance_criteria:
  - '**F2 — a refusal names the plugin that introduced the rule.** A plugin layer denying `secrets/**`;
    the run attempts the write. The discriminating assertion is the stored `PolicyEvent.layer` for that
    refusal, which must equal `<plugin>__<layer>` — not that a refusal occurred, because every deny
    rule refuses. The control is the same layer declared by the application instead of the plugin, whose
    event carries the bare layer name, proving the prefix is written by the loader and not by the policy.

    '
  - '**F3 — an MCP call and a spawned child are attributed the same way.** A plugin-contributed MCP
    server is called: the stored `McpEvent.server` reads `<plugin>__<server>` and the tool the model
    was offered is `mcp__<plugin>__<server>__<tool>`, and `bare_name` round-trips it back to the server-side
    name — a namespacing scheme that broke the existing strip would fail here rather than in production.
    A plugin-contributed agent is spawned: its run row and its ledger entry name `<plugin>__<agent>`,
    so the tokens it spent are attributable to the bundle.

    '
  - '**F7 — namespacing makes collision impossible rather than unlikely.** Two plugins each contributing
    a skill named `review`, plus a contract-level skills directory that also holds `review`. All three
    are offered, under `a__review`, `b__review` and `review`; `Skills::discover`''s duplicate-name refusal
    does not fire; and the catalogue the model is handed contains all three names. The negative control
    is the same tree with namespacing removed, under which the run fails on the duplicate — the failure
    proving the property is load-bearing.

    '
  files:
  - src/plugin.rs
  - src/mcp.rs
  - src/skills.rs
  - src/agent.rs
  - src/policy.rs
  - tests/plugin.rs
  evidence: []
- id: US-IO-HARNESS-0.35.0-T04
  summary: '`TaskContract` gains `#[non_exhaustive]` and a `plugins` field with `with_plugins`, and
    `discover_skills` merges every plugin''s skills directory with the contract''s own.'
  why_required: A run whose skills come from a contract directory and three bundles needs more than
    the one `Option<PathBuf>` the contract has carried since 0.14.0. This is the release's one break
    and the path by which every contribution reaches a run.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.35.0-T03
  acceptance_criteria:
  - '**F1 — a bundle''s contributions reach a run, and their absence is asserted too.** One plugin directory
    contributing a skill, a template, an agent, an MCP server and a deny layer, declared from `io.local.toml`.
    The run''s discovered skill catalogue, the contract''s agent roster, its MCP server list and its
    policy layer stack each contain the contribution under its namespaced name. The control is the identical
    tree with the `[[plugin]]` entry removed: all five are absent, and every other assertion in the
    test is unchanged. A loader that discovered nothing passes the second half only.

    '
  - '**N2 — the break is exactly one, and it is stated as loudly as it is small.** `TaskContract` gains
    `#[non_exhaustive]` and one field. An external struct literal or exhaustive destructuring stops
    compiling; every `TaskContract::new`, `TaskContract::workspace` and `with_*` call site is untouched,
    which is how every documented caller builds one. `CompletionRequest` and `CompletionResponse` are
    not touched, so no `E0639` is owed. `tests/changelog.rs` finds the `*Migration:*` note under a `**BREAKING`
    entry and `tests/public_api.rs` passes against a hand-edited `docs/public-api.txt`.

    '
  files:
  - src/contract.rs
  - src/run.rs
  - src/skills.rs
  - tests/plugin.rs
  evidence: []
- id: US-IO-HARNESS-0.35.0-T05
  summary: '`EventKind::PluginLoaded { plugin, contributions }` and `EventKind::PluginDropped { plugin,
    why }`, their `EVENT_NAMES` entries, their round trip through `every_kind()` and the source-reading
    census.'
  why_required: A plugin that is dropped and reported on no channel an operator watches is a plugin
    that was silently ignored, which is the failure mode the drop-not-fatal rule creates.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.35.0-T01
  acceptance_criteria:
  - '**F6 — a broken bundle costs exactly itself.** Four plugins declared: one valid, one with no `plugin.toml`,
    one whose TOML does not parse, one whose manifest carries an unknown key. The run reaches its normal
    outcome, `Plugins::dropped()` has exactly three entries whose errors name three different causes,
    exactly three `EventKind::PluginDropped` events reach the observer, and every contribution of the
    valid one is present. The control is the same four directories with every manifest repaired: `dropped()`
    is empty and four `PluginLoaded` events fire. A duplicate id and a malformed id (`Rust_Review`,
    `a__b`, 33 characters) are asserted the same way, each dropping only its own plugin.

    '
  files:
  - src/observe.rs
  - src/plugin.rs
  - tests/plugin.rs
  evidence: []
- id: US-IO-HARNESS-0.35.0-T06
  summary: 'The compatibility and cost evidence: `ADDED_SINCE_0_22_0` asserted unchanged, both cross-version
    directions executed, and the source-reading test that no function reachable from the per-step loop
    calls into `plugin::`, with its splice-in control.'
  why_required: A release that quietly added a table and forgot the guard is exactly what the 0.22.0
    schema guard exists to catch, and a loader creeping into the step loop is how a bundle becomes a
    per-step file read.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.35.0-T04
  acceptance_criteria:
  - '**F9 — cross-version compatibility, both directions, with nothing to migrate.** No table, column
    or index is added, so `tests/cross_version.rs`''s `ADDED_SINCE_0_22_0` list is **unchanged** — asserted
    rather than assumed, since a release that quietly added a table and forgot the list is exactly what
    that guard exists to catch. A database written by the pinned 0.29.0 generator opens, resumes and
    replays under 0.35.0; a 0.35.0 store is read by that binary. `CHECKPOINT_FORMAT` stays 7.

    '
  - '**N3 — plugin loading is bounded by what was declared and the run loop never touches it.** Discovery
    is one manifest read plus one directory listing per skills or templates directory, per declared
    plugin, performed once by the caller before the run starts — the same shape `Config::discover` and
    `Skills::discover` already have. The assertion is a source-reading test in the shape 0.33.0 used
    for its ownership boundary: no function reachable from the per-step loop in `src/run.rs` calls into
    `plugin::`, with a splice-in control that makes the test fail when such a call is added. A configuration
    declaring no plugin performs no plugin I/O at all, asserted by a plugins directory that does not
    exist and a run that neither fails nor drops anything.

    '
  files:
  - tests/cross_version.rs
  - tests/plugin.rs
  - src/run.rs
  evidence: []
- id: US-IO-HARNESS-0.35.0-T07
  summary: 'Documentation as part of the release: `docs/guide/plugins.md`, its `docs/CAPABILITIES.md`
    entry, the honest limits in `docs/CONTRACT.md`, `README.md`, `CHANGELOG.md` with the `*Migration:*`
    note the break owes, and `docs/public-api.txt` edited by hand.'
  why_required: Four checked-in surfaces have tests that fail without them, and the release workflow
    refuses a version with no CHANGELOG section.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.35.0-T04
  - US-IO-HARNESS-0.35.0-T05
  acceptance_criteria:
  - '**N4 — every added public item carries a worked example**, enforced by the existing `every_public_item_has_a_worked_example`
    surface test: `Plugins`, `Plugin`, `Dropped`, `Config::plugins`, `Plugins::apply_to`, `Plugins::templates`,
    `Plugins::dropped`, `TaskContract::with_plugins` and the manifest''s own module documentation.

    '
  - '**N5 — the honest limits are where a reader finds them.** `docs/CONTRACT.md` states: a plugin is
    a directory the operator chose to point at and the crate verifies nothing about its origin; a hook
    or MCP server contributed from a trusted scope runs a program with this process''s privileges and
    is not sandboxed by the fact that a plugin declared it; namespacing changes the names a model sees,
    so a prompt naming a skill by its bare name after it moves into a bundle stops matching; and the
    standing `[[mcp]]` gap in `io.toml` itself is unchanged.

    '
  files:
