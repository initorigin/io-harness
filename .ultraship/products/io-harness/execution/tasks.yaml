  - src/run.rs
  - tests/prompt.rs
  evidence: []
- id: US-IO-HARNESS-0.45.0-T08
  summary: Prove the prompt is composed once and that the four prior releases are unaffected.
  why_required: A system prompt that varies between steps converts 0.38.0's cache read into a cache write
    on every step of every run on both marked wires, and fails nothing else in the suite.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.45.0-T01
  - US-IO-HARNESS-0.45.0-T02
  - US-IO-HARNESS-0.45.0-T03
  - US-IO-HARNESS-0.45.0-T05
  - US-IO-HARNESS-0.45.0-T06
  - US-IO-HARNESS-0.45.0-T07
  acceptance_criteria:
  - '**F10 — the prompt is composed once and never varies between steps.** Over a run of at least four
    steps against a fixture provider that records every request: every `system` string is byte-identical
    to the first, including on a run that writes a memory note and a run that folds (0.43.0 compaction
    on). The criterion exists because 0.38.0''s cache breakpoint sits at the end of this block: a prompt
    that varies bills a cache write per step on both marked wires. Sabotage: re-probe `select` per step
    and re-read the instructions file per step, under which the strings still *usually* match — so the
    test drives a run where the file is rewritten mid-run and asserts the composed prompt did not follow
    it.

    '
  - '**N1 — no new dependency.** `cargo tree` for the default feature set has the same number of crates
    as 0.44.0 (**402**). Composition is `format!`; classification is `str::starts_with` and `str::contains`.

    '
  - '**N2 — MSRV unmoved.** The crate builds on 1.95 with the toolchain gate CI already runs.

    '
  - '**N6 — 0.41.0''s batch, 0.42.0''s gate, 0.43.0''s fold and 0.44.0''s boundary are unaffected.** Three
    read-only tools still rendezvous inside the bound and fold back in the model''s call order; a `before_tool`
    hook is still consulted exactly once per call; the fold still fires at `at_share` and writes exactly
    one `summaries` row; and 0.44.0''s transcript `cache_boundary` is still offered on the same steps
    with the same guard — the composed prompt is longer, and the boundary is an offset into `user`, which
    this release does not touch. Asserted rather than assumed, because a change to every prompt in the
    crate is exactly where a regression to any of them would hide.

    '
  - '**O1 — the full suite passes on all three platforms**, which the standing CI matrix already runs.
    F2 is the platform-shaped criterion and branches on `select()`''s answer rather than asserting a backend,
    so a Windows Job Object, a macOS `sandbox-exec` and a Linux namespace each assert their own truth
    and the floor arm asserts the degraded case everywhere.

    '
  - '**O2 — cross-version is unaffected and proven so.** No DDL, so a 0.44.0 store and a 0.45.0 store
    are the same store; `ADDED_SINCE_0_22_0` and `COLUMNS_ADDED_SINCE_0_22_0` (`tests/cross_version.rs`)
    are **unchanged**, which is itself the assertion.

    '
  files:
