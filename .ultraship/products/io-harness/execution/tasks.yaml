product: io-harness
version: 0.50.0
tasks:
- id: US-IO-HARNESS-0.50.0-T01
  summary: A child returns its conclusion instead of a Debug-printed outcome.
  why_required: Without it the parent learns that a child succeeded and nothing it found, which is the
    release's outcome and the whole of its fallback scope.
  status: done
  depends_on: []
  acceptance_criteria:
  - '**F1 — a child''s conclusion reaches its parent.** A child whose final completion says a marker string
    produces a parent observation containing that string, and the parent''s next `CompletionRequest` contains
    it. The marker is produced by the child''s provider only, so nothing else in the run can have written
    it. Asserted together with the report''s other fields — the child''s run id, its outcome and its step
    count are all still present, because the release adds to what the parent learns and removes nothing.
    Sabotage: restore `compose_child`''s `{outcome:?}` line, under which the marker assertion fails and
    every other criterion here still passes.

    '
  - '**F2 — an adopted child''s conclusion is read from the store and is the same text.** A tree interrupted
    mid-flight and resumed, whose child had already reached a terminal outcome, composes a report whose
    conclusion is byte-identical to the one the in-process path produced for the same child. Asserted
    as equality between the two renderings rather than against a literal, because two sources of one fact
    drifting is the failure this criterion exists to catch. Sabotage: have the store path return the run''s
    goal instead of its last untooled text, under which the equality fails and only this fails.

    '
  files:
  - src/run.rs
  - tests/subagents.rs
  evidence:
  - 'F1 — a_child_reports_what_it_concluded_to_its_parent (tests/subagents.rs) passes. Watched it fail
    first against the shipped composition, which the panic quoted verbatim: the parent''s ledger held
    "[child 2 \"investigate\" -> Success { steps: 1 }]" and nothing else.'
  - 'F2 — an_adopted_child_reports_the_same_conclusion (tests/subagents.rs) passes: a parent whose spawn
    step was left uncommitted by a sibling''s approval pause replays it on resume, and the already-finished
    child is composed from the store with the same words.'
  - Both paths read one source — the child's "said" rows in agent_events — so the two renderings cannot
    drift; there is one rendering.
  - 'cargo test --test subagents --test agents --test checkpoint --test fleet --test session_fanout --test
    custom_tools: exit 0, 78 passed across six binaries, no existing tree assertion needed changing.'
- id: US-IO-HARNESS-0.50.0-T02
  summary: spawn_agent takes wait and background_after_secs, and a conflicting pair is a typed observation.
  why_required: Both later shapes are selected per call through these arguments; without the schema and
    its refusal path there is no way for a parent to choose how a child returns.
  status: done
  depends_on:
  - US-IO-HARNESS-0.50.0-T01
  acceptance_criteria:
  - '**F9 — a malformed spawn is a typed observation, not a failure.** `wait: false` together with `background_after_secs`
    produces an error observation naming the conflict, no child is created, no slot is taken, no `spawns`
    row is written, and the parent''s run continues. Asserted as an absence (no new row, no ledger movement)
    and a presence (the observation) together. Sabotage: treat the conflict as the detached case, under
    which the absence assertion fails and only this fails.

    '
  files:
  - src/run.rs
  - tests/subagents.rs
  evidence:
  - 'F9 — a_conflicting_spawn_costs_nothing_and_the_parent_carries_on (tests/subagents.rs) passes: the
    parent is told which two arguments conflict, no child run exists, no spawn event was recorded, and
    the run reached Success { steps: 2 }.'
  - The conflict is answered before register_agent, try_admit and record_spawn, which is what makes "it
    costs nothing" true rather than hoped for.
  - 'A zero-second wall clock is Detach and not an error: "wait zero seconds" and "do not wait" are the
    same request.'
- id: US-IO-HARNESS-0.50.0-T03
  summary: A detached child runs in the parent's in-flight set and reports at a later step.
  why_required: This is the detached shape itself; F4's byte-identity control on the blocking path is
    what proves it did not change every existing tree run.
  status: done
  depends_on:
  - US-IO-HARNESS-0.50.0-T02
  acceptance_criteria:
  - '**F3 — a detached child does not block its parent, and its report arrives later.** A parent that
    spawns with `wait: false` commits the spawning step **without** the child''s report, takes at least
    one further step, and receives the report at a strictly later step. Asserted as three facts together
    — the report is absent from step *n*, the parent''s step count advanced, and the report is present
    at step *m > n* — because any one alone passes for a build that merely reordered the fold. Sabotage:
    await the detached child inline, under which the "absent from step *n*" assertion fails and the blocking
    control (F4) still passes.

    '
  - '**F4 — a blocking spawn is unchanged, and this is the negative control the release rests on.** A
    spawn with neither new argument folds its report into **its own** step, in the model''s call order,
    with the tree''s trace — `steps.decision` and `steps.result` for every step — byte-identical to this
    build''s apart from the conclusion text F1 adds. Two children whose completion order is forced to
    differ from their call order produce the same trace either way, which is 0.12.0''s determinism claim
    asserted again because this release touches that stream. Sabotage: make `wait: false` the default,
    under which this fails and F3 still passes.

    '
  files:
  - src/run.rs
  - src/observe.rs
  - tests/subagents.rs
  evidence:
  - 'F3 — a_detached_child_reports_at_a_later_step passes: the report is absent from the spawning step,
    the parent took further steps of its own, and the report arrives at a strictly later step.'
  - 'F4 — a_blocking_spawn_folds_into_its_own_step_in_call_order passes: two waited-for children fold
    into step 1 in call order, and nothing was detached.'
  - children_are_composed_in_spawn_order_not_completion_order (0.12.0's own determinism test) still passes
    unchanged.
  - The in-flight set is a FuturesUnordered on the parent's own task, driven against the parent's completion
    by  — a detached child cannot be a spawned task because &Store is Send and not Sync.
- id: US-IO-HARNESS-0.50.0-T04
  summary: background_after_secs races the child against a sleep and keeps the loser.
  why_required: A stuck child is unbounded from the parent's side today; without the race there is nothing
    between a child's step cap and halting the whole tree.
  status: done
  depends_on:
  - US-IO-HARNESS-0.50.0-T03
  acceptance_criteria:
  - '**F5 — a wall clock moves a child to the background and does not kill it.** A spawn carrying `background_after_secs`
    whose child is parked past that clock ends the parent''s step with a "moved to the background" observation
    naming the child, **and** the child subsequently completes and delivers its report to a later step.
    Both halves are asserted, because an implementation built on `tokio::time::timeout` passes the first
    and silently drops the child. Sabotage: replace the race with `timeout`, under which the second half
    fails and only this fails; and separately, set the clock past the child''s own duration, under which
    the child must report in its own step and no background observation is emitted.

    '
  files:
  - src/run.rs
  - src/observe.rs
  - tests/subagents.rs
  evidence:
  - 'F5 — a_wall_clock_backgrounds_a_child_without_killing_it passes both halves: the parent is told at
    the step it asked, and the child (parked 1.5s against a 1s clock) still completes, lands its file
    and reports.'
  - 'F5''s other arm — a_wall_clock_the_child_beats_is_an_ordinary_spawn passes: a 10s clock against an
    instant child never reports a background move and folds into step 1.'
  - 'The race keeps the loser: futures_util::select over the child and a sleep, never tokio::time::timeout,
    which drops the future and cancels the child mid-step.'
- id: US-IO-HARNESS-0.50.0-T05
  summary: The parent drains every in-flight child before it returns.
  why_required: 0.48.0's rule is that everything a run starts is inside the boundary; a parent that returns
    while a child runs is a leak the crate has never had.
  status: done
  depends_on:
  - US-IO-HARNESS-0.50.0-T03
  acceptance_criteria:
  - '**F6 — a tree never returns with a child still running.** A parent that detaches a child and then
    reaches its own ending — verification passed, step cap, or a stall — drains before it returns: the
    returned outcome is accompanied by every detached child in a terminal state, the tier''s `Fleet` tally
    reports zero working, and every report is in the trace. Sabotage: return without draining, under which
    the terminal-state assertion fails and only this fails.

    '
  files:
  - src/run.rs
  - tests/subagents.rs
  evidence:
  - 'F6 — a_tree_drains_the_children_it_stopped_waiting_for passes: a parent that detaches and finishes
    in the same step still leaves the child successful, its file on disk, and its report durable under
    the parent''s run id.'
  - The drain sits at run_agent's single return rather than at agent_loop's twelve endings, and it runs
    before the  so a run ending in an error drains too.
- id: US-IO-HARNESS-0.50.0-T06
  summary: A resumed parent re-adopts every child it detached and left unfinished.
  why_required: A detached spawn's step commits, so the replay never re-enters spawn_child for it and
    the child would be orphaned across a restart.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.50.0-T05
  acceptance_criteria:
  - '**F7 — an in-flight detached child survives a process death and is re-adopted.** A tree killed while
    a detached child is mid-run, then resumed, re-adopts that child from its own last committed step (not
    from step 1, and not as a second child), completes it, and folds its report. Asserted on the child''s
    run id being the same row and its step count continuing rather than restarting — the same properties
    the existing adopt-on-resume tests assert for a blocking child. Sabotage: skip the re-adoption walk
    on resume, under which the child is never completed and F6''s drain finds nothing to drain, failing
    this and not F6''s own test.

    '
  files:
  - src/run.rs
  - tests/checkpoint.rs
  evidence: []
- id: US-IO-HARNESS-0.50.0-T07
  summary: TaskContract carries the operator's default wall clock and its refusal of detachment.
  why_required: The operator has to be able to narrow what the model may ask for, in the direction every
    other spawn argument already travels.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.50.0-T04
  acceptance_criteria:
  - '**F8 — the operator''s knobs narrow and never widen.** A `TaskContract` that refuses detachment turns
    a `wait: false` call into a blocking spawn with a stated observation, not into an error and not into
    a silent detachment; a contract default wall clock applies to a spawn naming none and is **not** raised
    by a spawn naming a longer one. Asserted in both directions. Sabotage: let the model''s `background_after_secs`
    override the contract''s, under which the narrowing assertion fails and only this fails.

    '
  files:
  - src/contract.rs
  - src/run.rs
  - tests/subagents.rs
  evidence: []
