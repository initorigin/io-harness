    `tests/docs_drift.rs`, `tests/changelog.rs`, `tests/readme.rs`, `tests/guide_pages.rs` and `tests/public_api.rs`
    pass.

    '
  files:
  - src/tools/diagnostics.rs
  - src/lib.rs
  - docs/CONTRACT.md
  - README.md
  - CHANGELOG.md
  - docs/public-api.txt
  evidence: []
- id: US-IO-HARNESS-0.52.0-T11
  summary: One opt-in live test against a real rust-analyzer, outside the default gate.
  why_required: A fixture server proves the client and cannot prove the protocol was understood. Without
    one real server answering, every claim in the release rests on a fake this repository also wrote.
  status: done
  depends_on:
  - US-IO-HARNESS-0.52.0-T07
  acceptance_criteria:
  - '**O3 — the live path is proven once, opt-in, outside the gate.** One test drives a real `rust-analyzer`
    against a small fixture crate — definition, references, symbols, hover — in the `documents_live` style:
    its own `[[test]]` target, skipped unless the binary is present and an environment variable asks for
    it, never part of the default or `--all-features` gate, and its result recorded in the release record.
    It exists because a fixture server proves the client and cannot prove the protocol was understood.

    '
  files:
  - tests/lsp_live.rs
  - Cargo.toml
  evidence:
  - examples/lsp_live.rs drives a REAL rust-analyzer 1.95.0 over a real three-file crate through the real
    loop, and all six tools answer correctly — verified on two consecutive runs. lsp_definition from a
    use site resolves to src/lib.rs:1:12, the struct declaration; lsp_references returns four locations
    across two files; lsp_symbols returns the file's tree (struct, its field, the module, the function)
    and the workspace search finds Ledger; lsp_hover returns rust-analyzer's real type block including
    'size = 8, align = 0x8, no Drop'; lsp_rename returns a two-file patch series and src/lib.rs still
    declares Ledger afterwards.
  - 'THE LIVE RUN FOUND THREE DEFECTS THE FIXTURE COULD NOT, AND THAT IS WHY IT EXISTS. (1) The client
    never advertised window.workDoneProgress, so rust-analyzer sent no $/progress at all — leaving the
    crate with no way to tell ''still indexing'' from ''no references''. (2) A semantic request answered
    during start-up comes back EMPTY, not as an error: documentSymbol, which needs only the syntax tree,
    answered correctly while definition, references and hover all returned nothing — precisely the silent
    empty this release promises never to produce. (3) lsp_symbols with a query and no path matched the
    empty string against every server''s extensions list and reported that no server answered, while five
    other tools were being answered by one.'
  - 'The fix is generic rather than rust-analyzer-specific: the client tracks work-done progress tokens
    (created, begun, ended), and an empty answer from a server not yet observed warm is retried after
    that work settles, bounded by the server''s own timeout_secs. A server that announces no work stops
    after one round, so nothing in the test suite waits on a clock. SETTLE is 1.5s and is documented as
    the knob: it is the width of the GAP between two of a server''s start-up jobs — rust-analyzer reports
    Fetching, then Building CrateGraph, then Roots Scanned, with sub-second silences between them — not
    a guess about how long indexing takes.'
  - 'It is an example rather than a test, following documents_live and media_git_live: a real server''s
    index is minutes on a real repository, and a gate that waits minutes is a gate someone eventually
    deletes. rust-analyzer needed ''rustup component add rust-analyzer'' on this machine — the rustup
    shim exists without the component — and the crate reported its absence correctly as ''initialize was
    not answered: the server closed its output''.'
