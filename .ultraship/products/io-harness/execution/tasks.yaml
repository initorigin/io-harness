product: io-harness
version: 0.60.0
tasks:
- id: US-IO-HARNESS-0.60.0-T01
  summary: The store half — `agent_messages`, `AgentMessage`, the three `Store` methods, and `spawns.as_name`.
  why_required: 'Every other task in this release reads or writes these rows. It is also where the two
    properties that cannot be retrofitted live: the read and the mark happen in one transaction, and
    the new table is in `RUN_TABLES` so a session delete accounts for it. A table missed by that list
    produces a silent orphan and no error — 0.58.0 paid for that lesson.'
  status: done
  depends_on: []
  acceptance_criteria:
  - '**F5 — reads are ordered, exactly-once, and marked in the same transaction as they are returned.**
    Ten messages from three senders are read back in row-id order; a second read returns nothing; and
    a read that fails after selecting leaves every message still unread. Sabotage: mark read in a separate
    statement outside the transaction and fail between them, under which the messages are lost and only
    F5 fails.

    '
  - '**N1 — one additive table and one additive column, and no `CHECKPOINT_FORMAT` move.** `agent_messages`
    with its index, and `spawns.as_name`. `git diff main -- src/state.rs` shows a `CREATE TABLE IF NOT
    EXISTS`, a `CREATE INDEX IF NOT EXISTS` and one `ALTER TABLE ADD COLUMN`, and `CHECKPOINT_FORMAT`
    is still 7. No checkpoint layout changes, so a bump would refuse a store this release can read.

    '
  - '**N2 — the cross-version gate passes with both declared.** `agent_messages` and its index join
    `ADDED_SINCE_0_22_0`, and `as_name` joins `COLUMNS_ADDED_SINCE_0_22_0` under `spawns`, in `tests/cross_version.rs`.
    A real 0.29.0 binary opens a store this build wrote and never names either, executed rather than
    asserted on paper. This criterion is written down because 0.58.0''s additive index was refused by
    this same gate.

    '
  - '**N3 — the new table is accounted for by every run-keyed operation.** `agent_messages` is in `RUN_TABLES`,
    and deleting a whole tree''s session leaves **zero** rows in it — asserted by counting the table
    directly after the delete, not by enumerating `sqlite_master`, which 0.58.0 proved cannot fail.
    A message has two run columns and only one may key the list; the criterion asserts both ends are
    gone.

    '
  - '**N5 — the cost of a read is measured and stated, and it is the mailbox that is measured.** Median
    of 20 on this machine, stores on disk, for a drain at 1 / 100 / 1,000 unread messages and for a
    bounded wait that returns on the first message. The read must be an index seek on `(to_run_id, id)`
    rather than a scan: `EXPLAIN QUERY PLAN` over the statement the crate actually issues asserts the
    index by name, and the recipient column is the leading one.

    '
  evidence:
  - 'F5, first two clauses — `messages_are_delivered_oldest_first_across_interleaved_senders`, `a_message_is_delivered_exactly_once`,
    `a_from_filter_delivers_only_that_senders_messages`, `an_audit_read_does_not_deliver` and `a_body_survives_being_arbitrary_text`
    in `tests/mailbox.rs` — 6 passed (the sixth is N5''s measurement, ignored by default). The ordering
    test round-robins three senders so no sender''s messages are adjacent: a per-sender order would
    pass a contiguous fixture and reorder a real tree.'
  - F5, third clause — `a_read_that_fails_after_selecting_marks_nothing` in `src/state.rs`, 491 lib
    tests passed. It lives in the crate rather than in `tests/` because the only lever that fails the
    write half while the read half succeeds is `PRAGMA query_only`, and the connection is private. A
    read-then-mark in two statements loses the batch here.
  - 'N1 — one `CREATE TABLE IF NOT EXISTS agent_messages`, one `CREATE INDEX IF NOT EXISTS agent_messages_to`,
    one `ALTER TABLE spawns ADD COLUMN as_name`. `CHECKPOINT_FORMAT` unmoved at 7: no checkpoint layout
    changed, and a bump would make `check_resumable` refuse every 0.59.0 store over a table it does
    not read.'
  - N2 — `agent_messages` and `agent_messages_to` in `ADDED_SINCE_0_22_0`, and `spawns` with `as_name
    TEXT NOT NULL DEFAULT ''` in `COLUMNS_ADDED_SINCE_0_22_0`. `cargo test --test cross_version` — 7
    passed. The real-0.29.0-binary half runs in T07 with the generator built.
  - N3 — `a_deleted_session_leaves_no_message_at_either_end` in `tests/mailbox.rs`. Messages are sent
    in BOTH directions before the delete, so a cascade covering only the recipient end still fails,
    and the count is taken straight off `agent_messages` through a second connection rather than through
    either run id — a row orphaned by a missed cascade is exactly a row no run id reaches.
  - 'N5, plan half — `a_mailbox_read_reaches_its_rows_through_the_recipient_index` in `src/state.rs`.
    The statement asserted is the one `read_messages` prepares, copied rather than paraphrased. Asserts
    the index by name, no fallback scan, and no `TEMP B-TREE`: delivery order is the index''s own order
    rather than a sort built per read. The fixture writes traffic addressed elsewhere too, so seeking
    to one recipient''s rows is a real saving rather than the whole table under another name.'
  - N5, measurement half — `n5_what_a_drain_costs`, release build, on-disk stores, median of 20. **0.152
    / 0.727 / 3.612 ms at 1 / 100 / 1,000 unread.** A thousandfold more messages for about twenty-four
    times the cost, because the transaction commit is paid once per read whatever the size and only
    the per-row `UPDATE` scales.
  files:
  - src/state.rs
  - src/lib.rs
  - tests/mailbox.rs
  - tests/cross_version.rs
- id: US-IO-HARNESS-0.60.0-T02
  summary: The address — an instance name per agent, assigned at spawn, durable, unique in the tree.
  why_required: 'There is no mailbox without an address, and the roadmap''s `by name` did not name one:
    a roster name is a role two children share. Nothing in this crate has ever identified one agent.
    Every send and every read resolves through what this task builds.'
  status: todo
  depends_on:
  - US-IO-HARNESS-0.60.0-T01
  acceptance_criteria:
  - '**F2 — a name addresses one agent, not a role.** Two children of the *same* roster definition,
    spawned in the same step with `as` names `a` and `b`, receive only their own messages. Sabotage:
    resolve an address by the roster definition''s name instead of the instance name, under which both
    children read both messages and only F2 fails. This criterion exists because it is the premise the
    roadmap entry got wrong.

    '
  - '**F3 — a duplicate name is refused before anything is allocated.** A spawn asking for a name already
    held in this tree produces a typed observation naming it, and the tree''s run count, slot tally
    and queue depth are all unchanged afterwards — asserted as three numbers taken before and after,
    not as the absence of a child. Sabotage: allocate the run row before the name is checked, under
    which the counts move and only F3 fails.

    '
  - '**F4 — `root` is reserved.** A spawn asking for `as: "root"` is refused the same way. Sabotage:
    drop the reserved-name check, under which a child shadows the root''s address and messages intended
    for the root reach the child; only F4 fails.

    '
  evidence: []
  files:
  - src/run.rs
  - src/state.rs
  - tests/mailbox.rs
- id: US-IO-HARNESS-0.60.0-T03
  summary: The two tools, non-blocking — `send_message`, `read_messages` as a drain, and the refusals
    that name what is addressable.
  why_required: 'This is the release''s vertical slice and its declared fallback scope: after it a child
    can tell a sibling what it found and the sibling reads it on its next step. Everything after it
    is about when a read returns, not about whether the channel exists.'
  status: todo
  depends_on:
  - US-IO-HARNESS-0.60.0-T02
  acceptance_criteria:
  - '**F1 — a child tells a sibling what it found, and the sibling could not have found it otherwise.**
    A two-child fan-out where the `scout` locates a line and the `author` is denied every means of locating
    it itself, and the author''s edit lands on the line the scout named. Sabotage: make `send_message`
    append nothing while still reporting success, under which the author''s read is empty and only F1
    fails.

    '
  - '**F10 — an unknown address is refused with the names that are addressable.** The observation lists
    them, so the model recovers in one step. Sabotage: refuse without listing, under which only F10
    fails.

    '
  - '**F11 — an address resolves inside this tree and nowhere else.** Two independent trees over one
    store, each with a child named `worker`; neither can address the other''s, and the refusal reads
    the same as any unknown name rather than leaking that a `worker` exists elsewhere. Sabotage: resolve
    by name over the whole store, under which the cross-tree send succeeds and only F11 fails.

    '
  - '**F15 — a flat run has neither tool.** `workspace_tools()` offers no mailbox tool, and a run outside
    a tree that calls one gets the ordinary unknown-tool observation. Sabotage: add the tools to `workspace_tools`,
    under which a flat run''s tool count moves and only F15 fails.

    '
  - '**N7 — a run that never sends a message is byte-identical in what it costs.** The tools are two
    more `ToolSpec`s in a tree''s request and nothing else: no prompt block, no fold, no per-step query.
    Asserted as a step''s assembled prompt being unchanged against the same run on the release base
    except for the two tool schemas.

    '
  evidence: []
  files:
  - src/run.rs
  - src/observe.rs
  - tests/mailbox.rs
- id: US-IO-HARNESS-0.60.0-T04
  summary: The bounded wait — `wait_secs`, the operator's `max_wait_secs` ceiling, and the early return
    for a sender that cannot answer.
  why_required: Without it the third verb the entry names is missing and a coordinator still cannot
    wait on a named child. It is also the release's one genuinely open shape, so it is built after the
    slice that survives without it.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.60.0-T03
  acceptance_criteria:
  - '**F6 — a bounded wait returns on the message.** An agent reading with `wait_secs: 30` returns as
    soon as a sibling sends, not at the clock, and the elapsed time is asserted as *less than* the clock
    rather than as a duration. Sabotage: sleep the full clock before checking the mailbox, under which
    the read still succeeds but takes the whole clock and only F6 fails.

    '
  - '**F7 — a bounded wait returns at the clock when nothing arrives, and says so.** The observation
    distinguishes "nothing was sent" from "nothing was sent yet and I stopped waiting", because a model
    that cannot tell them apart cannot decide whether to wait again. Sabotage: return the same text
    for both, under which only F7 fails.

    '
  - '**F8 — a wait on an agent that has already finished and said nothing returns immediately.** Asserted
    on elapsed time against a clock of 30 seconds, and on the text naming that the agent finished. Sabotage:
    remove the terminal check, under which the read burns the full clock and only F8 fails.

    '
  - '**F13 — the operator''s cap narrows the agent''s request, and the agent is told.** A run with `max_wait_secs
    = 5` and an agent asking for 60 waits at most 5 and reads a line saying its request was narrowed.
    The boundary pair is asserted **exactly**: a request of 5 is not narrowed and a request of 6 is,
    so `>` in place of `>=` fails. Sabotage: apply the cap silently, under which the wait is correct
    and the notice is absent; only F13''s second half fails, which is the point of asserting both.

    '
  - '**F14 — a project scope cannot widen the cap.** `max_wait_secs` in a `Project`-scoped `io.toml`
    takes the lower of the two values. Sabotage: omit the key from `NARROWING`, under which the project
    scope raises the ceiling and only F14 fails.

    '
  evidence: []
  files:
  - src/run.rs
  - src/config.rs
  - src/contract.rs
  - tests/mailbox.rs
- id: US-IO-HARNESS-0.60.0-T05
  summary: The terminal post to the parent, and exactly-once delivery across a resume.
  why_required: 'These are one task because they are the same claim from two sides: a wait unblocks
    on the sender terminating, and a resumed tree must not re-deliver what it already delivered. Both
    are properties of the `read_at` column rather than of anything in memory.'
  status: todo
  depends_on:
  - US-IO-HARNESS-0.60.0-T04
  acceptance_criteria:
  - '**F9 — a terminating agent posts to its parent, and the report is not duplicated.** After a child
    finishes, its parent''s mailbox holds exactly one row from it, that row is the short terminal line
    and not the composed report, and the composed report still reaches the parent through 0.50.0''s
    path. Sabotage: post the whole report as the message body, under which the parent reads the report
    twice and only F9 fails.

    '
  - '**F12 — a resumed tree reads the same messages in the same order, once.** A tree killed with messages
    sent and unread, resumed in a new process, delivers each exactly once in row-id order; and a message
    already read before the kill is not delivered again. Sabotage: key delivery on an in-process set
    rather than the `read_at` column, under which the resume re-delivers and only F12 fails.

    '
  evidence: []
  files:
  - src/run.rs
  - src/state.rs
  - tests/mailbox.rs
- id: US-IO-HARNESS-0.60.0-T06
  summary: The surfaces — guide page, CONTRACT, CHANGELOG, README, `docs/public-api.txt`, rustdoc.
  why_required: The contract's own risk register says the role/address confusion lives in the prose
    more than in the code, and the standing rule is that documentation ships in the release that changes
    the behaviour, never later.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.60.0-T05
  acceptance_criteria:
  - '**N4 — `docs/public-api.txt` gains exactly one line**, `struct AgentMessage`. The store methods
    and the contract builder are methods on existing types, and that file tracks root-level types —
    which is why 0.59.0''s prediction of movement there was wrong.

    '
  - '**N6 — no new runtime dependency.** `cargo tree` is still 402 on this machine. The wait is `tokio::time`
    and a poll of a table this crate already opens; nothing is added for it.

    '
