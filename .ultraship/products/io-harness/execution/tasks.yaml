product: io-harness
version: 0.22.0
tasks:
  - id: US-IO-HARNESS-0.22.0-T01
    summary: >
      The vendor-neutral declaration and its two response types: `src/web.rs` with `WebAccess` and
      `Citation`, `CompletionRequest::web`, `CompletionResponse::citations`, `TaskContract::with_web`,
      and the re-exports. Everything off by default, so the types existing changes no run.
    why_required: >
      Every other task in this release either fills these types or reads them. Without one neutral
      declaration the three providers would each grow their own configuration, which is the divergence
      the release exists to prevent.
    status: done
    depends_on: []
    acceptance_criteria:
      - >
        F9 — an out-of-tree provider is unaffected. A `Provider` implementation written before
        0.22.0 that ignores `request.web` compiles and runs unchanged, its responses carry no
        citations, and the run completes — a provider that cannot search is honestly non-searching,
        not an error.
      - >
        NF2 — exactly three break sites, each marked, and no others. `CompletionRequest` gains `web:
        Option<WebAccess>`; `CompletionResponse` gains both `citations: Vec<Citation>` and
        `server_tools: Vec<ServerToolCall>`, because a call that failed inside an HTTP 200 cannot be
        represented by the citations it did not produce; `EventKind` gains `ServerToolUsed`. Nothing
        is removed or renamed, no existing signature changes, and every other item in
        `docs/public-api.txt` keeps its meaning. Each break is fixed by `..Default::default()` or a
        `_` arm, and the changelog carries a migration snippet for each.
    files:
      - src/web.rs
      - src/provider/mod.rs
      - src/contract.rs
      - src/lib.rs
    evidence:
      - >
        src/web.rs — `WebAccess`, `Citation` and `ServerToolCall`, all `Default`-off, all
        with worked examples. `CompletionRequest::web`, `CompletionResponse::citations` and
        `CompletionResponse::server_tools`, `TaskContract::with_web`, and the three re-
        exports in `src/lib.rs` with their lines in `docs/public-api.txt`.
      - >
        DEVIATION, recorded in US-IO-HARNESS-0.22.0-I01: `CompletionResponse` gained TWO
        fields, not one. A call that failed inside an HTTP 200 cannot be represented by the
        citations it did not produce, so `server_tools: Vec<ServerToolCall>` carries it.
        Still three break sites; NF2 was amended to say four items across three sites.
      - >
        tests/web.rs::a_provider_that_ignores_the_declaration_still_runs — a 0.21.0-shaped
        `Provider` that never mentions `web` compiles, runs and completes with no citations.
        Passing.
  - id: US-IO-HARNESS-0.22.0-T02
    summary: >
      The Anthropic translation and parse: `web_search_20250305` and `web_fetch_20250910` entries in
      `tools` carrying `max_uses` and both domain lists, the `web-fetch-2025-09-10` beta header sent
      only when fetch is asked for, citations read off text blocks, and
      `web_search_tool_result_error` recognised as a failure with its error code.
    why_required: >
      Anthropic is the provider whose server-tool shape is richest and whose failure-inside-a-200
      object is the one the roadmap names. If this parse is naive the release ships the quiet failure
      it was written to avoid.
    status: done
    depends_on: [US-IO-HARNESS-0.22.0-T01]
    acceptance_criteria:
      - >
        F1 — a declaration reaches each vendor in that vendor's own shape, and a declaration a
        vendor cannot carry is refused rather than trimmed. A `WebAccess` with search, fetch,
        `max_uses` and both domain lists produces an Anthropic body carrying a `web_search_20250305`
        and a `web_fetch_20250910` tool entry with those fields; a search-only declaration with an
        allow-list produces an OpenAI body carrying `web_search_options` with that filter; a
        search-only declaration with a cap produces an OpenRouter body carrying the `web` plugin
        with its `max_results`. Asked for what it does not have — fetch on either OpenAI-wire
        vendor, a block-list on OpenAI, any domain list on OpenRouter — the provider returns an
        `Error::Config` naming itself and what it cannot do, before a request is sent. Asserted
        against the built bodies and the refusals, not a live call. The negative control is `web:
        None`, which produces bodies byte-identical to 0.21.0's for all three.
      - >
        F2 — the Anthropic fetch beta header is sent when fetch is asked for and not otherwise. A
        request with `fetch: true` carries `anthropic-beta: web-fetch-2025-09-10`; a search-only
        request carries no beta header at all.
      - >
        F4 — a failed search is a failure, not an empty result. A 200 response carrying a
        `web_search_tool_result_error` with `error_code: max_uses_exceeded` produces a
        `server_tool_calls` row marked failed with that code, an observation to the model naming the
        failure, and an `EventKind::ServerToolUsed { ok: false }`. The negative control is a
        successful search with zero results, which is recorded as a successful call — the two are
        different facts and the trace tells them apart. This test fails on 0.21.0's parser, which
        has no concept of either.
    files:
      - src/provider/anthropic.rs
      - src/web.rs
    evidence:
      - >
        src/provider/anthropic.rs — `web_tools` building `web_search_20250305` /
        `web_fetch_20250910` entries from one declaration, the `web-fetch-2025-09-10` beta
        header sent only when fetch is asked for, and the `Accumulator` extended with
        `server_tool_use`, `*_tool_result`, `citations_delta` and `citations` handling.
      - >
        6 unit tests in `provider::anthropic::web_wire`, all passing: the dated tool entries
        with their fields; a block-list alone; the 0.21.0 body when nothing is declared; the
        beta header on and off, asserted by capturing the real request head over a local
        socket; citations from both a result block and a delta, deduplicated by url and
        enriched by the later mention; and the failure inside a 200 with its negative
        control — a search that succeeded and found nothing.
  - id: US-IO-HARNESS-0.22.0-T03
    summary: >
      The two OpenAI-wire translations and their parse: `web_search_options` with its domain filter on
      the OpenAI body, a `web` `plugins` entry with `max_results` on the OpenRouter body, and
      `annotations` with `url_citation` read into `CompletionResponse::citations` — with the shared
      `openai_wire::body` staying shared while the two web keys stay apart.
    why_required: >
      The release promises the declaration works across all three providers. Two of them share a body
      builder and differ in exactly this key, so the split has to be made deliberately rather than by
      copying the builder.
    status: done
    depends_on: [US-IO-HARNESS-0.22.0-T01]
    acceptance_criteria:
      - >
        F1 — a declaration reaches each vendor in that vendor's own shape, and a declaration a
        vendor cannot carry is refused rather than trimmed. A `WebAccess` with search, fetch,
        `max_uses` and both domain lists produces an Anthropic body carrying a `web_search_20250305`
        and a `web_fetch_20250910` tool entry with those fields; a search-only declaration with an
        allow-list produces an OpenAI body carrying `web_search_options` with that filter; a
        search-only declaration with a cap produces an OpenRouter body carrying the `web` plugin
        with its `max_results`. Asked for what it does not have — fetch on either OpenAI-wire
        vendor, a block-list on OpenAI, any domain list on OpenRouter — the provider returns an
        `Error::Config` naming itself and what it cannot do, before a request is sent. Asserted
        against the built bodies and the refusals, not a live call. The negative control is `web:
        None`, which produces bodies byte-identical to 0.21.0's for all three.
      - >
        NF3 — a run that uses none of this behaves exactly as it did. A 0.21.0-shaped run with `web:
        None` produces the identical event sequence, the identical step count, the identical outcome
        and — for all three providers — a byte-identical request body, proven by comparing the built
        body against the literal 0.21.0 shape rather than against itself.
    files:
      - src/provider/openai_wire.rs
      - src/provider/openai.rs
      - src/provider/openrouter.rs
    evidence:
      - >
        src/provider/openai_wire.rs — `WebFlavor`, `web_key` adding `web_search_options` for
        OpenAI and a `web` `plugins` entry for OpenRouter to the shared body,
        `ensure_web_supported` refusing what a vendor cannot carry, and `annotations` /
        `url_citation` parsing plus the mid-stream `error` object.
      - >
        DEVIATION, recorded in US-IO-HARNESS-0.22.0-I01: the three vendors do not accept the
        same declaration. OpenAI has no fetch tool and an allow-list-only filter; OpenRouter
        has neither fetch nor any domain filter. Unsupported combinations are refused with
        `Error::Config` before a request is sent rather than trimmed to fit, and F1 was
        amended to assert each vendor's supported subset plus the refusals.
      - >
        6 unit tests in `provider::openai_wire::web_wire`, all passing, including
        `no_declaration_adds_no_key_to_either_body`, which asserts the built body's key set
        is exactly the five keys 0.21.0 sent.
  - id: US-IO-HARNESS-0.22.0-T04
    summary: >
      The trace and the loop: the `citations` and `server_tool_calls` tables with their writers and
      readers, `EventKind::ServerToolUsed`, the failure observation handed to the model, and
      `pause_turn` treated as a continuation rather than an ending.
    why_required: >
      An answer whose sources are not recorded is the same answer a scraper would have produced, and a
      paused turn that ends the run is a defect the release would ship on its first long search. This
      is the task that makes the feature auditable and the loop correct.
    status: done
    depends_on: [US-IO-HARNESS-0.22.0-T02, US-IO-HARNESS-0.22.0-T03]
    acceptance_criteria:
      - >
        F3 — citations survive to SQLite. A scripted response carrying each vendor's citation shape
        produces `CompletionResponse::citations` with the url, title and cited text, rows in the
        `citations` table keyed by run and step, and the same rows readable from a fresh `Store`
        over the same file after the writing process is gone. The negative control is an answer with
        no citations, which produces no rows rather than one empty row.
      - >
        F5 — a paused turn continues. A response with `stop_reason: "pause_turn"` and partial text
        does not end the run: the text becomes an observation, the step's usage is drawn from the
        ledger once, and the loop takes another step. The negative control is `end_turn`, which ends
        the run as it does today. Asserted through the real loop against a scripted provider.
      - >
        F10 — the observer sees it. A run that searches emits `ServerToolUsed` with the provider
        name, the tool and `ok: true` in the same place `Refused` is emitted, and a failing search
        emits the same variant with `ok: false`. A consumer that matches `_` is unaffected, which is
        what the changelog's migration snippet says.
      - >
        F13 — a spawned child inherits the root's declaration and cannot ask for its own. A tree
        whose root declared web access spawns a child whose every request carries that same
        declaration, read from the requests the provider actually received; a spawn call whose
        arguments ask for web access, or for a wider domain list, changes nothing — the spawn tool
        never reads one, exactly as it never reads a toolbox, a skills directory or an agent roster
        from the model.
      - >
        NF1 — no store format bump and no new dependency. `CHECKPOINT_FORMAT` stays 7, `citations`
        and `server_tool_calls` are `CREATE TABLE IF NOT EXISTS`, the diff carries no `ALTER TABLE`,
        a 0.21.0 database opens, resumes and is queried against 0.22.0 unchanged, and the default
        `cargo tree` line count is still the 407 lines inherited from `develop`.
    files:
      - src/state.rs
      - src/run.rs
      - src/observe.rs
      - tests/web.rs
    evidence:
      - >
        src/state.rs — `citations` and `server_tool_calls` as `CREATE TABLE IF NOT EXISTS`
        with their indexes, `Store::record_citations` / `citations` /
        `record_server_tool_calls` / `server_tool_calls`. `CHECKPOINT_FORMAT` untouched at
        7.
      - >
        src/run.rs — `record_web_activity` writing both tables and emitting
        `EventKind::ServerToolUsed` beside the existing `provider_calls` row; `paused_turn`
        making a `pause_turn` stop reason a continuation rather than an ending;
        `web_failure_note` handing a failed provider call to the model as an observation in
        both the flat and the tree loop; the root declaration carried on `Tree` and copied
        onto every spawned child by `spawn_child`.
      - >
        tests/web.rs — 10 tests, all passing: citations readable from a fresh `Store` after
        the writing process is gone, with a no-citation negative control; the failed search
        recorded, evented with `ok: false` and reaching the next step's prompt; the found-
        nothing control recorded as a success with nothing told to the model; the paused
        turn continuing to step 2 with both turns charged, and an `end_turn` control ending
        at step 1; and a spawned child inheriting the root's declaration while a spawn
        argument asking for `evil.test` is ignored.
      - >
        `cargo tree` is 407 lines, unchanged.
  - id: US-IO-HARNESS-0.22.0-T05
    summary: >
      One declaration, two boundaries: `WebAccess::from_policy` projecting `Act::Net` allow- and
      deny-rules onto the vendor domain filter with an allow-everything rule projecting to no filter,
      and `[web]` in `io.toml` layering onto `WebAccess` through the existing config machinery.
    why_required: >
      Without the projection an operator states the same boundary twice and the two drift; without
      `[web]` the feature is unreachable from configuration and io-cli and io-studio each write their
      own. The inverting case is the release's worst silent failure and is decided here.
    status: done
    depends_on: [US-IO-HARNESS-0.22.0-T01]
    acceptance_criteria:
      - >
        F6 — the policy projects onto the vendor filter. A policy allowing `docs.rs:443` and
        `crates.io:443` and denying `*.example.com` yields a `WebAccess::from_policy` whose
        `allowed_domains` are the two hosts without their ports and whose `blocked_domains` carry
        the denied pattern. A policy allowing `*` yields no allow-list rather than an empty one —
        the inversion that would silently allow nothing — and a rule the filter cannot express is an
        `Error::Config` naming the rule.
      - >
        F7 — `[web]` reaches a run from configuration. An `io.toml` carrying `[web]` with search,
        fetch, `max_uses` and both domain lists projects onto a `WebAccess` equal to the
        programmatic one, an unknown key inside `[web]` is an error naming the key and the file, and
        a local scope turning `search` off overrides a project scope that turned it on — the
        existing layering, asserted for the new table rather than assumed.
    files:
      - src/web.rs
      - src/config.rs
      - tests/config.rs
    evidence:
      - >
        src/web.rs — `WebAccess::from_policy` projecting `Act::Net` rules onto the vendor
        filter, with the inverting case handled explicitly: an allow-everything rule yields
        NO allow-list rather than an empty one. An `Ask` rule and a pattern carrying a
        scheme or a path are `Error::Config` naming the rule, because neither can be
        honoured by a filter the provider enforces.
      - >
        src/config.rs — `[web]` as a top-level table merged key by key through the existing
        scope layering, with unknown keys rejected by the type's own `deny_unknown_fields`
        and reported by the existing per-scope validation that names the file. No new public
        item, so `docs/public-api.txt` is unchanged.
      - >
        3 unit tests in `web::tests` and 3 in tests/config.rs, all passing, including a
        local scope switching `search` off over a project scope that turned it on, asserting
        the project's `max_uses` and domain list survive the override.
  - id: US-IO-HARNESS-0.22.0-T06
    summary: >
      The meter moves: `server_tool_requests` reaching the ledger from a run, the per-request price
      charged on top of tokens, and the accounting guide's "always zero" sentence removed.
    why_required: >
      0.18.0 built the counter, the column and the price against this release. If the money is not
      charged and asserted, the release adds a per-request cost the operator cannot see, which is the
      failure the accounting tables were built to prevent.
    status: done
    depends_on: [US-IO-HARNESS-0.22.0-T04]
    acceptance_criteria:
      - >
        F8 — the meter moves where the vendor reports one, and the money is charged. A run whose
        responses report two `server_tool_requests` is priced at the per-request charge twice on top
        of its tokens, the `provider_calls` rows carry the count, and `Store` reads it back. The
        negative control is the identical run reporting zero, which is charged for tokens alone.
        This is the first non-zero `server_tool_requests` in the crate's history and the test says
        so. The counter is the vendor's: Anthropic reports it and the crate reads it; the OpenAI
        wire reports no such member today, so a run that demonstrably searched there records a zero
        rather than a count this crate derived for itself. The `server_tool_calls` row is the
        vendor-independent record that the call happened.
      - >
        NF6 — no key, no host and no query is logged that was not already. Citations hold URLs the
        model was given and the run recorded; the API key never enters a `server_tool_calls` row;
        and a query is stored only where the vendor discloses it in the response, never
        reconstructed from the prompt.
    files:
      - src/pricing.rs
      - src/run.rs
      - docs/guide/accounting.md
      - tests/accounting.rs
    evidence:
      - >
        No code change was needed: `pricing.rs::cost_micros` has charged
        `server_tool_requests * per_server_tool_request` since 0.18.0, and `run.rs` never
        prices anything — money reaches a caller through `Store::spend_by_*(&PriceTable)`.
        Verified by reading the path and then pinning it with tests rather than editing it.
      - >
        tests/accounting.rs — 3 tests, all passing: the same recorded trace priced twice,
        once with a zero per-request price and once with 10_000, differing by exactly two
        charges; the negative control charging the identical amount under both tables when
        the counter is zero, which a flat per-run search charge would fail; and NF6, which
        puts a credential-shaped string and a distinctive phrase in the goal and asserts
        neither reaches any column of either web table, while the provider's own url does.
      - >
        DEVIATION, recorded in US-IO-HARNESS-0.22.0-I01: the counter is the vendor's.
        Anthropic reports it; the OpenAI wire reports no such member, so a run that
        demonstrably searched there records a zero rather than a count this crate derived.
        F8 was amended to say so.
  - id: US-IO-HARNESS-0.22.0-T07
    summary: >
      Documentation and the public surface: `docs/guide/web.md`, `docs/public-api.txt` by hand, the
      `CHANGELOG.md` entry with all three migration snippets, the `docs/CONTRACT.md` amendments
      including removing the 0.18.0 "always zero" sentence, and the README / CAPABILITIES / crate-root
      links.
    why_required: >
      The release's central honesty — the domain filter is enforced by the vendor and not by this
      process — lives in the contract and the guide. Shipping the code without it ships a false sense
      of containment, which the contract names as the release's first risk.
    status: done
    depends_on: [US-IO-HARNESS-0.22.0-T04, US-IO-HARNESS-0.22.0-T05]
    acceptance_criteria:
      - >
        OP1 — `docs/public-api.txt` is updated by hand, `tests/public_api.rs` passes against the
        live surface, and every added public item carries a fenced worked example, enforced by the
        existing docs test.
      - >
        OP2 — `docs/guide/web.md` exists, is listed in `tests/guide_pages.rs` with its limits block,
        and is linked from `README.md`, `docs/CAPABILITIES.md` and the crate root.
      - >
        OP3 — `docs/CONTRACT.md` states, in its own voice: a provider-executed fetch is dialled by
        the provider, so `Act::Net` never sees it and the domain filter is enforced by the vendor,
        not by this process; a citation is what the provider returned and is not verified by the
        crate; a paused turn resumes as a fresh request and may repeat a search; and the 0.18.0
        sentence saying `server_tool_requests` is always zero is **removed**, because this release
        makes it non-zero.
      - >
        OP4 — `CHANGELOG.md` carries all three breaks with migration snippets and the new capability
        in the user-facing voice the changelog test enforces.
    files:
      - docs/guide/web.md
      - docs/public-api.txt
      - docs/CONTRACT.md
      - docs/CAPABILITIES.md
      - CHANGELOG.md
      - README.md
      - src/lib.rs
      - tests/guide_pages.rs
    evidence:
      - >
        docs/guide/web.md — the declaration, the three vendors and what each refuses, the
        policy projection and its inverting case, citations and what a citation is not, the
        failure inside a 200, the paused turn and its repeat-cost, the price, `[web]`,
        reading it back, and a limits block. Listed in tests/guide_pages.rs and linked from
        README.md and docs/CAPABILITIES.md.
      - >
        docs/CONTRACT.md — the provider dials the URL so `Act::Net` never sees it and the
        filter is the vendor's; a mismatched declaration is refused, not narrowed; a
        citation is unverified; a paused turn may repeat a search; a child inherits the
        root's declaration and cannot ask for its own. The 0.18.0 sentence saying
        `server_tool_requests` is zero until 0.22.0 is gone, replaced by the truthful per-
        vendor statement.
      - >
        CHANGELOG.md — the 0.22.0 entry with all three break sites and a migration snippet
        each. README.md carries `io-harness = "0.22"`, the capability and the guide link;
        `Cargo.toml` is at 0.22.0.
      - >
        One correction after the fact: the docs first described children as NOT inheriting
        the declaration, which was true of the code at the time. The code was fixed to
        inherit and both pages were corrected — the guide and CONTRACT now describe what T04
        actually does.
  - id: US-IO-HARNESS-0.22.0-T08
    summary: >
      The gate and the live evidence: `cargo fmt --check`, both clippy legs, `cargo doc --all-features`,
      the full suite on three platforms via CI, and a hand-run live example that asserts a citation, a
      non-zero `server_tool_requests` and the per-request charge.
    why_required: >
      The suite proves the translation this crate wrote; only a live call proves a vendor accepts the
      body it builds. Every release since 0.9.0 has been gated this way and OP5 makes it a criterion.
    status: done
    depends_on: [US-IO-HARNESS-0.22.0-T07]
    acceptance_criteria:
      - >
        NF4 — the full suite passes on macOS, Linux and Windows with the Windows leg's
        `timeout-minutes` unchanged at 40. Every new test is offline: bodies are asserted as JSON
        and responses are scripted, so nothing in CI depends on a vendor being up, on a key
        existing, or on what a search returns today.
      - >
        NF5 — `cargo fmt --check`, `cargo clippy --all-targets -- -D warnings`, `cargo clippy
        --all-targets --all-features -- -D warnings` and `cargo doc --all-features` all pass with
        zero warnings.
      - >
        OP5 — a live run against a real provider is performed by hand before the release is cut and
        its output kept as evidence: a question answered from current information, at least one
        citation read back from SQLite, and a `server_tool_calls` row for the call that produced it
        — plus a non-zero `server_tool_requests` where the vendor reports one, which of the three is
        Anthropic alone. The suite proves the translation; only a live run proves a vendor accepts
        the body this crate builds.
    files:
      - examples/web_search.rs
      - .ultraship/products/io-harness/evidence
    evidence:
      - >
        Gate, all green on this machine after a `cargo clean` (the disk was full at 140 MiB
        free with `target/` at 31 GiB, which surfaced as a linker failure — the known
        machine fact, not a code defect): `cargo fmt --check`; `cargo clippy --all-targets
        -- -D warnings`; `cargo clippy --all-targets --all-features -- -D warnings`; `cargo
        doc --all-features --no-deps`; `cargo test` (45 test binaries, 0 failures, including
        237 doc tests); `cargo test --all-features --lib --tests`.
      - >
        OP5 — live run on OpenRouter, kept at evidence/0.22.0/live-web-search.txt. The
        vendor accepted the body this crate builds, ran a search, and the run cited two
        sources newer than the model: docs.rs showing io-harness 0.21.0 and the CHANGELOG on
        GitHub. One `server_tool_calls` row, `ok`. The vendor-reported
        `server_tool_requests` is 0, because OpenRouter's chat-completions response carries
        no such counter.
      - >
        LIMITATION, recorded in US-IO-HARNESS-0.22.0-I01: a live non-zero counter needs an
        Anthropic key, and the `.env` in this workspace holds placeholders for both
        `ANTHROPIC_API_KEY` and `OPENAI_API_KEY`. The Anthropic path is therefore proven by
        its wire tests and not by a live call.
