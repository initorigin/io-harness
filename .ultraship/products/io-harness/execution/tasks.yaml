product: io-harness
version: 0.8.1
tasks:
- id: US-IO-HARNESS-0.8.1-T01
  summary: Reproduce the defect as failing tests before changing any implementation. Add the I01 case
    to tests/verify_gate.rs for RustTestPasses (a subject defining `#[macro_export] macro_rules! assert`
    plus `pub fn hello() -> u32 { 0 }`, gated by `assert!(false, "this gate can never pass")`), the
    same attack routed through WorkspaceTestPasses, and a second-macro case shadowing `assert_eq!`.
    Each asserts the gate returns false. All three must FAIL against the current implementation first,
    and that failure is recorded as evidence.
  why_required: The release exists to close a bypass. A test written after the fix proves the fix compiles,
    not that the bypass was ever open — and the WorkspaceTestPasses leg was never demonstrated at all,
    only expected. Watching all three fail first is what makes F1, F2, and F3 evidence rather than assertion.
  status: done
  depends_on: []
  acceptance_criteria:
  - 'F1 — the recorded bypass fails. A subject file containing `#[macro_export] macro_rules! assert
    { ($c:expr $(, $r:tt)*) => {{ let _ = &$c; }}; }` and `pub fn hello() -> u32 { 0 }`, verified by
    `RustTestPasses { test_src: "#[test] fn gate() { assert!(false, \"this gate can never pass\"); }"
    }`, returns false. Asserted by a test, with no model in the loop.

    '
  - 'F2 — the same attack through `WorkspaceTestPasses` fails: the shadowing definition placed in any
    one of the listed files does not make a `assert!(false, ...)` gate report a pass.

    '
  - 'F3 — shadowing resistance is not name-specific. A subject shadowing a second prelude macro used
    by the criterion (for example `assert_eq!`) also fails to force a pass.

    '
  files:
  - tests/verify_gate.rs
  evidence:
  - 'All three reproductions FAILED against the pre-fix implementation, recorded in evidence/0.8.1/repro-before-fix.txt:
    the I01 case, the WorkspaceTestPasses leg (never previously demonstrated, only expected), and the
    assert_eq! case. 3 honest-behaviour tests in the same file passed, so the failures were the bypass,
    not a broken harness.'
  - tests/verify_gate.rs — 10 tests, all green after the fix.
- id: US-IO-HARNESS-0.8.1-T02
  summary: 'Fix the single-file gate structurally. The two-crate design this task originally specified
    — subject as its own crate, criterion as a separate crate depending on it via `--extern subject=`
    — was implemented, then REVERTED after the F7 live run: privacy is a wall between crates, so an
    honest non-`pub` implementation became unpassable (US-IO-HARNESS-0.8.1-I02). Shipped instead: the
    criterion is appended as a child module of the subject''s own crate, opening with an explicit
    re-import of the core/std prelude macros and `use super::*`. The explicit import makes a macro the
    subject defines AMBIGUOUS with the prelude name (E0659) rather than authoritative, so a shadowing
    subject fails to compile; `use super::*` keeps the subject''s private items in scope, which is what
    the two-crate design lost. Crate-level attributes are handled by the probe, not by this structure.'
  why_required: This is the fix. Without it F1 and F3 fail. The two-crate split is the only identified
    mechanism that closes the class rather than a case — `mod`-wrapping is recorded in I01 as ineffective
    because `#[macro_export]` hoists to the crate root, and rewriting the criterion's macro calls to
    `::core::` paths is fragile against a criterion the harness did not write.
  status: done
  depends_on:
  - US-IO-HARNESS-0.8.1-T01
  acceptance_criteria:
  - 'F1 — the recorded bypass fails. A subject file containing `#[macro_export] macro_rules! assert
    { ($c:expr $(, $r:tt)*) => {{ let _ = &$c; }}; }` and `pub fn hello() -> u32 { 0 }`, verified by
    `RustTestPasses { test_src: "#[test] fn gate() { assert!(false, \"this gate can never pass\"); }"
    }`, returns false. Asserted by a test, with no model in the loop.

    '
  - 'F3 — shadowing resistance is not name-specific. A subject shadowing a second prelude macro used
    by the criterion (for example `assert_eq!`) also fails to force a pass.

    '
  - 'F4 — honest passes are unaffected. An implementation that genuinely satisfies its criterion still
    passes both `RustTestPasses` and `WorkspaceTestPasses`, and a genuinely failing implementation still
    fails with the same observable outcome as 0.8.0.

    '
  - 'NF2 — verification stays deterministic and hermetic: no network, temp dirs removed on drop, and
    no dependence on the caller''s toolchain layout beyond the `rustc` already required.

    '
  - 'F8 — a crate-level attribute in the subject cannot delete the criterion. A subject beginning `#![cfg(any())]`
    must not make `RustTestPasses` or `WorkspaceTestPasses` report a pass by leaving a test binary with
    zero tests that exits 0. Added by US-IO-HARNESS-0.8.1-I01: the vector was found while reproducing
    F1 and is already closed by the delivered two-crate fix, but no criterion named it, and an unnamed
    guarantee is one a later release can remove without noticing.

    '
  files:
  - src/verify.rs
  evidence:
  - 'src/verify.rs compile_source, shipped shape: the subject plus PROBE_ITEM is compiled with --crate-type
    lib --crate-name subject to an rlib (classifies subject-compile); PROBE_CRATE type-checks a reference
    to the probe (catches subject-emptied); then subject + CRITERION_OPEN + test_src + CRITERION_CLOSE
    is written as one file and built with --test, and the binary is run. Four spawns.'
  - The criterion module's explicit `use ::core::{assert, assert_eq, ...}` / `use ::std::{...}` is what
    stops a subject-defined macro capturing a name the criterion invokes. Against a subject defining
    `macro_rules! assert_eq` — `#[macro_export]` or plain — rustc reports E0659 "ambiguous name" and
    the build fails, which fails the gate. Verified directly with rustc across five cases before
    implementing (honest private, honest pub, wrong answer, exported shadow, plain shadow).
  - 'F1 and F3 green: a_subject_shadowing_assert_cannot_pass_an_impossible_gate, a_subject_shadowing_a_second_prelude_macro_cannot_pass_either.'
  - 'F4 green, and this is the criterion the revert turned on: a_private_implementation_still_passes_the_gate
    covers a non-`pub` implementation on both RustTestPasses and WorkspaceTestPasses. The two-crate build
    failed it, and no test in the suite caught that because every one of them wrote `pub fn hello`.'
  - 'F8 (added by US-IO-HARNESS-0.8.1-I01, previously unnamed): the crate-level-attribute vector is
    closed by the probe step, not by crate separation — subject and criterion share a crate again.
    Pinned by a_subject_cannot_delete_the_criterion_with_a_crate_level_cfg, which covers both the
    single-file and workspace gates and failed against the pre-fix build. The trace phase for it is
    now `subject-emptied` rather than `criterion-compile`, since the probe catches it before the
    criterion is appended.'
