product: io-harness
version: 0.40.0
tasks:
- id: US-IO-HARNESS-0.40.0-T01
  summary: Add `TaskContract::exec_sandbox` and `with_contained_exec`, and route `exec` through the
    selected backend with the workspace root as its working directory.
  why_required: 'This is the release''s vertical slice and everything else attaches to it: the opt-in
    the caller sets, the dispatch that reads it, the `RunSpec` that carries the workspace root, and
    a file that does or does not appear outside the root. Without it there is no containment to cap,
    deny egress from, or audit. The negative control lands here too, because the moment `exec` can be
    contained is the moment it can be contained by accident.'
  status: todo
  depends_on: []
  acceptance_criteria:
  - '**F1 — a contained command cannot write outside the workspace, and an uncontained one still can.**
    A contract with a workspace root and `with_contained_exec(SandboxConfig::new())`; the model calls
    `exec` with an argv that writes a file to a path outside the root. Afterwards the file does not
    exist, and the tool result the model was handed says the command failed rather than reporting success.
    **The negative control, on the same contract, the same policy, the same store and the same argv,
    with the field absent:** the file exists. This pair is the release in one assertion. An implementation
    that contained every `exec` unconditionally passes the first half and fails the second, and that
    failure is every existing embedder''s build silently changing where it may write. Asserted on the
    filesystem, not on the model''s narration.

    '
  - '**F5 — the workspace is the working directory and is not discarded.** Within one contained run,
    a first `exec` writes a file under the workspace root and a second `exec` reads it back and finds
    it. Then, after the run: the file is on disk in the workspace, and no `TempDir` was created for
    it. This is the criterion that proves 0.17.0''s objection is answered rather than argued with —
    an implementation that reused `sandbox::workdir()` passes nothing here.

    '
  files:
  - src/contract.rs
  - src/run.rs
  - src/tools/exec.rs
  - tests/exec_contained.rs
  evidence: []
- id: US-IO-HARNESS-0.40.0-T02
  summary: Carry `SandboxOutcome.cap_hit` into the observation the model reads and the step the store
    records, and keep the sandbox wall cap distinct from the contract's `exec_timeout`.
  why_required: 'A command killed by the sandbox and a command that exited non-zero are different events
    with different fixes, and today the model would be told only the second. The two ceilings are the
    sharper half: `exec_timeout` is the contract''s wedged-command ceiling and `max_wall_secs` is the
    sandbox''s, and collapsing them sends whoever reads the trace to the wrong one.'
  status: todo
  depends_on:
  - US-IO-HARNESS-0.40.0-T01
  acceptance_criteria:
  - '**F2 — a cap kills, and the trace names which cap.** Two arms, one sabotage each. **(a)** Under
    a `SandboxLimits` with a low `max_memory_bytes`, a command that allocates past it is killed; the
    recorded step and the observation the model reads name `Cap::Memory` (`src/sandbox.rs:140`), not
    a bare exit status. **(b)** Under a low `max_wall_secs` a spinning command is killed naming `Cap::Wall`,
    and is distinguishable from `ExecOutcome::TimedOut` (`src/tools/exec.rs:91`), which is the *contract''s*
    `exec_timeout` and a different ceiling with a different meaning. Sabotage (a): drop `cap_hit` on
    the way to the observation, under which the kill still happens and the named test fails because
    the model is told only that something exited. Sabotage (b): map the sandbox wall cap onto `TimedOut`,
    which fails the named test that distinguishes them.

    '
  files:
  - src/tools/exec.rs
  - src/run.rs
  - tests/exec_contained.rs
  evidence: []
- id: US-IO-HARNESS-0.40.0-T03
  summary: Derive `allow_network` from the run's `Policy`, decide what `Effect::Ask` on `Act::Net` means,
    and document the coarseness.
  why_required: 'Without this the containment either denies every contained command a network it was
    granted, or grants one it was denied — and the policy is the only thing in the crate that already
    knows. The coarseness is not incidental: the backends take one boolean while `Act::Net` is per host,
    so a claim of per-host filtering under containment would be false and has to be asserted as false.'
  status: todo
  depends_on:
  - US-IO-HARNESS-0.40.0-T01
  acceptance_criteria:
  - '**F3 — egress follows the policy, both arms.** **(a)** A policy whose `Act::Net` default is `Deny`
    with no allowing rule: a contained command that dials a host fails to connect, on macOS and on Linux.
    **(b)** A policy that allows a host: the same command connects. Sabotage: hard-code `allow_network:
    false`, under which (b) fails; hard-code `true`, under which (a) fails. Both arms are needed because
    a single-armed test passes an implementation that never reads the policy at all. The coarseness
    is asserted rather than glossed: with one host allowed, a command reaching a *different* host also
    connects, and that assertion is the executable form of the limitation `docs/CONTRACT.md` states.

    '
  files:
  - src/run.rs
  - src/policy.rs
  - src/tools/exec.rs
  - tests/exec_contained.rs
  evidence: []
- id: US-IO-HARNESS-0.40.0-T04
  summary: Contain every sub-command `shell` parses out of a line, not the first.
  why_required: '`shell` is in scope and it is the tool whose containment is easiest to half-implement:
    a line''s first stage wrapped and its later stages spawned free passes any test written against
    a one-stage line, while leaving the escape the release exists to close.'
  status: todo
  depends_on:
  - US-IO-HARNESS-0.40.0-T01
  acceptance_criteria:
  - '**F4 — `shell` contains every sub-command, not the first.** A `shell` line whose first stage is
    harmless and whose second stage writes outside the workspace root: the second stage''s file does
    not exist afterwards. Sabotage: wrap only the first parsed sub-command, under which the file lands
    and this named test fails. This is the arm most likely to be quietly missing, because a `shell`
    implementation that contains its first stage passes any test written against a one-stage line.

    '
  files:
  - src/run.rs
  - src/tools/shell.rs
  - tests/shell_contained.rs
  evidence: []
- id: US-IO-HARNESS-0.40.0-T05
  summary: Populate the mount namespace `LinuxSandbox` already unshares, so writes outside the workdir
    fail on Linux, and keep the probe, the wrapper-failure path and the floor fallback intact.
  why_required: Filesystem confinement is macOS-only today while `src/lib.rs:279` tells a reader Linux
    does the same, so the crate over-reads its own boundary on the platform most of its CI runs on.
    This is the task the contract's `fallback_scope` drops if it does not converge, which is why it
    is isolated rather than folded into T01.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.40.0-T01
  acceptance_criteria:
  - '**F6 — Linux confines writes, on Linux.** F1''s escape assertion runs on `ubuntu-latest` in the
    matrix, not only on macOS, and passes. If the host refuses namespaces, the backend reports `Backend::PortableFloor`
    and the test asserts *that* rather than asserting confinement that was never applied — a skip that
    reads as a pass is the failure mode here. Sabotage: revert the mount population to 0.39.0''s `unshare`
    argv, under which the write lands on Linux and this named test fails while every macOS test still
    passes, which is the whole point of running it there.

    '
  files:
  - src/sandbox/linux.rs
  - tests/exec_contained.rs
  evidence: []
- id: US-IO-HARNESS-0.40.0-T06
  summary: Write the `SandboxEvent` lifecycle rows for a contained `exec` or `shell`, carrying the backend
    that actually applied.
  why_required: A run that silently took `PortableFloor` because the host refused the native primitive
    is otherwise indistinguishable from one that was contained as asked. The rows already exist and
    the verification gate already writes them; a contained command that does not is a boundary claim
    with no audit behind it.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.40.0-T01
  - US-IO-HARNESS-0.40.0-T04
  acceptance_criteria:
  - '**F7 — the audit says which backend actually ran.** After a contained `exec`, the store holds the
    `SandboxEvent` lifecycle rows for that run and step carrying `Backend::as_str()` (`src/sandbox.rs:98`),
    the same rows the verification gate writes (`src/verify.rs:826`). On a host that refused the native
    primitive the recorded backend is `PortableFloor`, so a run that was contained less than the caller
    asked for is legible afterwards instead of being indistinguishable from one that was not. Asserted
    against stored rows.

    '
  files:
  - src/run.rs
  - src/tools/exec.rs
  - tests/exec_contained.rs
  evidence: []
- id: US-IO-HARNESS-0.40.0-T07
  summary: Documentation, the per-platform table, the public-API surface and the release bookkeeping.
  why_required: 'The release''s honesty is the deliverable. `src/tools/exec.rs`''s ''What this does
    not bound'' section currently states a bound this release changes the conditions of, and `src/lib.rs:279`
    states a Linux property that is not true until T05 lands. Both are read by people deciding what
    to trust the crate with. The public-API file, the changelog and the roadmap withdrawal are the same
    job: the record matching the tree.'
  status: todo
  depends_on:
  - US-IO-HARNESS-0.40.0-T01
  - US-IO-HARNESS-0.40.0-T02
  - US-IO-HARNESS-0.40.0-T03
  - US-IO-HARNESS-0.40.0-T04
  - US-IO-HARNESS-0.40.0-T05
  - US-IO-HARNESS-0.40.0-T06
  acceptance_criteria:
  - '**N1 — no new dependency.** `cargo tree` on macOS and Linux still reads **402** lines. Any platform
    primitive is reached through what is already there, or behind `[target.''cfg(...)''.dependencies]`,
    which leaves the count untouched.

    '
  - '**N2 — zero breaks, and the assertion is the diff of `docs/public-api.txt`.** The file gains the
    lines for `TaskContract::exec_sandbox` and `TaskContract::with_contained_exec` and loses none. No
    existing signature moves, no type gains `#[non_exhaustive]` it did not have, `SandboxConfig`, `RunSpec`,
    `SandboxLimits` and `Verification` are untouched, and `tests/changelog.rs` finds no `**BREAKING`
    entry for this version. If the implementation needs a field on `RunSpec` or a change to the `Sandbox`
    trait to work, the design is wrong for this release.

    '
  - '**N3 — no store change.** No table, no column, no index; `CHECKPOINT_FORMAT` unmoved at **7**;
    `ADDED_SINCE_0_22_0` unchanged; `tests/cross_version.rs` and the pinned 0.29.0 generator job pass
    in both directions with no new name fed to the guard. Every row a contained command writes goes
    to tables the sandbox events have used since 0.6.0.

    '
  - '**N4 — the uncontained path is behaviour-identical to 0.39.0.** With `exec_sandbox` absent, `exec`
    and `shell` spawn exactly as they did: same workdir, same timeout, same truncation, same policy
    checks in the same order, no `SandboxEvent` written and no backend selected. The existing `exec`,
    `shell` and verification suites pass **unmodified** — no test in them is edited to accommodate this
    release — and F1''s negative control covers the escape half.

    '
  - '**N5 — the per-platform truth is written where a reader finds it, and nothing over-reads.** `docs/CONTRACT.md`
    carries a table of what each backend actually enforces for a contained command: macOS — caps, writes
    confined, egress denied; Linux — caps, writes confined, egress denied, degrading to the floor where
    namespaces are refused; Windows — caps only, no filesystem and no network facility in a Job Object.
    `src/lib.rs:279`''s claim that "Linux does the same through mount and network namespaces" is true
    after this release or is corrected. A grep for the old sentence is part of the check, because a
    corrected doc that leaves the original claim two files away is the defect this criterion exists
    to catch.

    '
  - '**N6 — the honest costs are stated, not discovered.** `docs/CONTRACT.md` and the field''s own doc
    state: egress is a single boolean and a policy allowing one host permits all of them under containment;
    `shell_start` handles are **not** contained; a contained command on macOS may write only under the
    workspace and `/private/var/folders` (`src/sandbox/macos.rs:46`), so a build that writes to `~/.cargo/registry`
    or `~/.npm` — a cold `cargo fetch`, an `npm install` populating its user cache — **fails under containment
    on macOS** and is the concrete price of the confinement, with the workaround being to leave the
    field unset or to point the toolchain''s cache inside the workspace; and on Windows nothing but
    the resource caps applies.

    '
  - '**O5 — the removal of the 0.41.0 roadmap entry rides this release''s branch.** It is an uncommitted
    working-tree deletion at the time this contract is written, and the owner decided on 2026-08-07
    that it is a genuine withdrawal to be committed on `feat/0.40.0` rather than restored or carried
    indefinitely. It lands as its own roadmap commit, not folded into a feature commit, and `ultraship
    views` is regenerated so `master-roadmap.md` matches.

    '
  files:
