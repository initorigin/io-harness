- id: US-IO-HARNESS-0.49.0-T12
  summary: Run the release gates and measure the live caching figure.
  why_required: Every non-functional claim in the contract is a number or an exit code, and none of them
    is true until it has been seen.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.49.0-T11
  acceptance_criteria:
  - '**N1 — no new dependency.** `cargo tree` for the default feature set is unchanged at **402** crates
    on macOS and Linux. Messages are `serde_json` values built by hand, exactly as both wire bodies are
    built today.

    '
  - '**N2 — MSRV unmoved.** The crate builds on 1.95 with the toolchain gate CI already runs.

    '
  - '**N4 — no durable state moves.** `git diff main -- src/state.rs` shows **no DDL**: no table, column
    or index, and `CHECKPOINT_FORMAT` unmoved at 7. This is a consequence of minting ids rather than storing
    them, and it is asserted rather than assumed.

    '
  - '**N5 — prompt caching does not regress, and the number is re-measured.** A live run through OpenRouter
    against a pinned model repeats 0.44.0''s measurement — system breakpoint alone, then system plus transcript
    — and the cache-read figure is recorded in the release record beside 0.44.0''s 13,093 of 13,113. A
    reshape that quietly stops caching would cost money and fail no test, which is why this is a criterion
    and not a hope.

    '
  - '**N6 — 0.41.0''s batch, 0.42.0''s gate, 0.43.0''s fold, 0.44.0''s boundary, 0.45.0''s prompt, 0.46.0''s
    default, 0.47.0''s chain and 0.48.0''s containment are unaffected.** Their suites pass unchanged.
    Specifically: the composed system prompt is still byte-identical across the steps of a run and still
    composed once, and 0.43.0''s context-overflow retry still folds and re-asks once per step with the
    messages rebuilt from the folded ledger.

    '
  - '**O1 — the full suite passes on all three platforms**, on the standing CI matrix including 0.47.0''s
    `contained (ubuntu, userns restricted)` leg.

    '
  - '**O2 — cross-version is unaffected and proven so.** No DDL, so a 0.48.0 store and a 0.49.0 store
    are the same store in both directions, asserted by the existing cross-version suites.

    '
  files:
  - docs/public-api.txt
  evidence: []
