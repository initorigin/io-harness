product: io-harness
version: 0.36.0
tasks:
  - id: US-IO-HARNESS-0.36.0-T01
    summary: >
      Two new `GitCmd` shapes — `Branch` and `Worktree` — and the branch-name validator, with the
      argv sweeps and the forbidden-list test extended to cover them without being relaxed.
    why_required: >
      Every other git task renders through `GitCmd::options`/`paths`. Without the two shapes and a
      validator that refuses a name before any spawn, there is nothing for a tool to call and the
      fixed-argv property has no test that covers the new surface.
    status: done
    depends_on: []
    acceptance_criteria:
      - >
        **F1 — the two built-ins are fixed argv, and the forbidden surface is still unreachable.**
        Every `GitCmd` shape, including the two new ones, is asserted to produce a subcommand drawn
        from `status`, `diff`, `log`, `add`, `commit`, `switch`, `worktree` and nothing else, and
        `no_shape_can_write_or_reach_the_network` passes **unchanged** over the widened shape list —
        the pre-existing test, not a rewritten one, because a release that relaxed the list to fit
        its new argv is what that test exists to catch. The control is name validation: `-x`,
        `a..b`, `/lead`, `trail/`, `x.lock`, a 101-character name and an empty name are each refused
        before any spawn, and the same name with the offending part removed is accepted.
    files:
      - src/tools/git.rs
    evidence:
      - >
        `cargo test --lib tools::git` — 13 passed, 0 failed, including
        `no_shape_can_write_or_reach_the_network` **unchanged** over the widened eight-shape list
        and `the_subcommand_is_always_one_of_the_seven_this_crate_ships`.
      - >
        F1's control, `a_branch_name_git_could_read_as_an_option_is_refused_and_its_repaired_form_is_not`:
        `-x`, `a..b`, `/lead`, `trail/`, `x.lock`, a 101-character name and an empty name are each
        refused for both `Branch` and `Worktree` before an argv exists, and each repaired form
        builds `--create=<name>`. Three more the allowlist catches for free: a space, `^` and `@{`.
      - >
        Sabotage S1 — `cmd.check()?` removed from `Git::argv` — failed exactly
        `a_branch_name_git_could_read_as_an_option_is_refused_and_its_repaired_form_is_not`
        (12 passed, 1 failed), so the refusal is the code's and not the test's.

  - id: US-IO-HARNESS-0.36.0-T02
    summary: >
      `git_branch` and `git_worktree` as built-ins the model can call: tool name constants, tool
      specs, dispatch, and an end-to-end run over a real repository that lands its commit on a new
      branch while the branch it started on stays put.
    why_required: >
      The release's headline outcome is that a run lands as a branch. A `GitCmd` variant no tool
      dispatches to reaches no run, and the claim is only true if the starting branch is unmoved.
    status: done
    depends_on:
      - US-IO-HARNESS-0.36.0-T01
    acceptance_criteria:
      - >
        **F2 — a run lands as a branch, and the branch it started on is unmoved.** A real git
        repository in a temporary directory with one commit on `main`. A scripted provider drives
        `git_branch`, an edit, `git_add` and `git_commit`. Assertions: `HEAD` is the new branch, the
        new branch's tip is a commit the run made, the file's change is in that commit, **and `main`
        still points at the commit it pointed at before the run** — the discriminating one, because
        a run that never switched satisfies every other assertion here. The commit is attributed to
        the run's `Identity`, which is the existing behaviour asserted to survive the branch.
    files:
      - src/tools/mod.rs
      - src/run.rs
      - tests/git.rs
    evidence:
      - >
        `cargo test --test git` — 14 passed, 0 failed. The two added tests are
        `a_run_lands_its_commit_on_a_branch_it_made_and_leaves_the_one_it_found_alone` and
        `an_agent_makes_a_second_working_tree_and_a_denied_path_refuses_it`; the twelve that
        existed pass unchanged.
      - >
        F2 in full: `HEAD` is `agent/fix-the-flake`, the log holds `add notes`, `git show
        --name-only` holds `NOTES.md`, the commit's author is `Agent Smith
        <smith@example.invalid>` from the contract's identity, and **`main` points at the same
        commit it pointed at before the run** while the new branch does not.
      - >
        The worktree half is asserted with its own control: `.worktrees/side/README.md` is a real
        checkout on branch `agent/side`, the parent is still on `main`, and the identical call at
        `private/wt` under `deny_write("private/**")` creates neither the directory nor the branch.
      - >
        Sabotage S2 — `git_branch` dispatched to `GitCmd::Status`, which is exactly the 0.35.0
        behaviour of committing onto the branch that was found — failed exactly
        `a_run_lands_its_commit_on_a_branch_it_made_and_leaves_the_one_it_found_alone`
        (13 passed, 1 failed). The file still got written, staged and committed under the sabotage,
        which is why the unmoved-`main` assertion is the one that discriminates.
      - >
        The `git_commit` tool description said "no push, no branch switching and no history
        rewriting"; the middle clause became false in this release and was corrected in the same
        commit rather than left for a reader to discover.

  - id: US-IO-HARNESS-0.36.0-T03
    summary: >
      `AgentDef` gains `#[non_exhaustive]` and `worktree`, and a child of that definition is rooted
      at its own worktree on its own branch, with the `worktree = false` collision executed as the
      control.
    why_required: >
      "Concurrent agents stop colliding on one working tree" is unreachable while `spawn_child`
      hard-codes the tree root, and the property is worth nothing unless the collision it removes is
      demonstrated.
    status: done
    depends_on:
      - US-IO-HARNESS-0.36.0-T02
    acceptance_criteria:
      - >
        **F3 — two concurrent children do not collide, and the collision is executed as the
        control.** A tree whose roster holds one `worktree = true` definition,
        `max_concurrent_agents = 2`, two children spawned from it, each writing the same relative
        path with different contents. Assertions: each child's worktree exists at its own path under
        `.worktrees/`, each holds that child's content, the two contents differ, the parent's own
        working tree does not hold either, and each child's branch carries its own commit. **The
        control is the identical tree with `worktree = false`**, under which the two children write
        one file and one write is lost — the property is worth nothing unless the control fails, so
        the control is run and its outcome recorded. What the parent's `git_status` reports with the
        worktrees present is asserted to be whatever it is and written into `docs/CONTRACT.md`; it
        is not assumed.
    files:
      - src/agent.rs
      - src/run.rs
      - tests/worktree.rs
    evidence:
      - >
        `cargo test --test worktree` — 4 passed, 0 failed:
        `two_concurrent_children_with_their_own_worktrees_do_not_collide`,
        `the_same_two_children_sharing_one_tree_lose_a_write`,
        `a_parents_git_status_reports_the_worktree_directory_as_untracked` and
        `a_worktree_that_cannot_be_made_fails_the_spawn_instead_of_sharing_the_tree`.
      - >
        F3 in full: two children of one `worktree = true` definition, spawned in one step under
        `max_concurrent_agents = 2`, produce two directories under `.worktrees/`, each holding its
        own content (`alpha` and `beta`, sorted and compared), each on its own `worker-…` branch
        carrying its own commit, with the parent's tree holding neither file and still on `main`.
      - >
        **The control is executed, not described.** The identical tree with `worktree = false`
        leaves `.worktrees/` empty, writes one file into the parent's tree, and that file holds one
        of the two answers — the other child's write is gone. The collision is real, so removing it
        is worth something.
      - >
        The `git_status` measurement the criterion asked for rather than assumed: the parent
        reports exactly one line for the worktrees, `?? .worktrees/` — git summarises the untracked
        directory and does not descend into it. Carried into `docs/CONTRACT.md` by T09.
      - >
        Sabotage S3 — the goal digest dropped from the slug, so two children of one definition in
        one step derive one path — failed exactly
        `two_concurrent_children_with_their_own_worktrees_do_not_collide` (3 passed, 1 failed).
      - >
        Sabotage S4 — a worktree that cannot be made falls back to the parent's tree instead of
        failing the spawn — failed exactly
        `a_worktree_that_cannot_be_made_fails_the_spawn_instead_of_sharing_the_tree` (3 passed, 1
        failed). One sabotage per arm, per trap 51: S3 covers "each child gets its own" and S4
        covers "and a child that cannot have one does not start".
      - >
        **A criterion met in a different form, stated not glossed.** The contract's prose derives
        the worktree path from `<agent>-<parent_run_id>-<step>`. That is not unique for the shape
        F3 actually names — two children of the *same* definition in the *same* step differ only in
        their goal — so the slug carries a fourth component, an FNV-1a digest of the goal, which is
        the remaining part of the `(parent, step, goal)` key `find_spawn` adopts by. Found by
        deriving the path before writing the test, not by a failure. FNV is written out rather than
        `DefaultHasher` because `std`'s hasher is not stable across toolchain releases and a slug
        that moved on rebuild would break the resume in T04.

  - id: US-IO-HARNESS-0.36.0-T04
    summary: >
      Worktree creation is idempotent by the key a spawn is adopted by, so a resumed tree reuses the
      worktree and branch it already made rather than re-creating them or discarding the child's
      work.
    why_required: >
      Creating unconditionally fails on resume and re-creating discards the child's files. Without
      this the worktree flag makes a crashed tree unresumable, which is a regression against 0.32.0.
    status: done
    depends_on:
      - US-IO-HARNESS-0.36.0-T03
    acceptance_criteria:
      - >
        **F4 — an adopted child reuses its worktree rather than re-creating or re-deriving it.** A
        tree with a `worktree = true` child is killed mid-child and resumed. The resumed parent
        replays the spawn, finds the child by `(parent, step, goal)`, and the child continues in
        **the same worktree, on the same branch, with the files it had already written still
        there**. The discriminating assertion is a file the child wrote before the kill, present
        after the resume: a resume that re-created the worktree passes "the child finished" and
        fails this. A second creation attempt is asserted not to error the spawn.
    files:
      - src/run.rs
      - tests/worktree.rs
    evidence:
      - >
        `cargo test --test worktree` — 5 passed, 0 failed. The added test is
        `a_resumed_child_continues_in_the_worktree_it_already_had`: a tree is cut off by a timeout
        while its `worktree = true` child is parked, then resumed from a fresh `Store` against the
        same database.
      - >
        F4 in full: after the resume there is still exactly ONE directory under `.worktrees/`, at
        the same path and on the same branch as before the cut-off, so a second creation attempt
        neither errored the spawn nor made a second tree. The child carried on in it and wrote
        `OUT.md`.
      - >
        The discriminating assertion is `EARLY.md`, written by the child *before* the cut-off and
        still holding `before the kill` afterwards. A resume that re-created the worktree would
        still let the child finish and still leave one directory behind — it would simply have
        thrown the work away, which is what this catches.
      - >
        Sabotage S5 — the `abs.exists()` reuse short-circuit disabled, so the worktree is created
        unconditionally — failed exactly `a_resumed_child_continues_in_the_worktree_it_already_had`
        (4 passed, 1 failed). It fails the way the doc comment predicts: `git worktree add` refuses
        the branch that already exists, so the spawn does not happen at all.
      - >
        A defect in the test, found and fixed rather than worked around: the first attempt gave the
        resumed provider no script for the ROOT. The root's spawn step never committed, so the
        resumed root is asked for it again and must re-issue it — without that replay `find_spawn`
        is never reached and the adoption path is not exercised at all. The test asserted a missing
        file rather than silently passing, which is the right failure.

  - id: US-IO-HARNESS-0.36.0-T05
    summary: >
      A memory restore point written at the run's first write to a key, in the shape `snapshots`
      already has, guarded by a unique index so a later write cannot move it.
    why_required: >
      Restoring memory needs the previous value, and `memory` rows are replaced in place. Without a
      restore point the memory half of a rewind cannot exist at all.
    status: done
    depends_on: []
    acceptance_criteria:
      - >
        **F6 — the memory restore point is the first write, guarded.** A run writes one key five
        times. `rewind_run` restores the value that was there before write one. The sabotage removes
        the insert's uniqueness guard so the last write's predecessor wins, and it must fail this
        named test rather than a compile — trap 8's rule, and the same guard `record_snapshot` has
        for files.
    files:
      - src/state.rs
    evidence:
      - >
        `memory_snapshots` and its UNIQUE index `memory_snapshots_entry (run_id, workspace, key)`,
        written inside `Store::memory_write` **before** the write, because after it the previous
        value is gone. `INSERT OR IGNORE` against that index IS the first-write guard — the second
        and fifth write of one key by one run insert nothing.
      - >
        `cargo test --test rewind` — 11 passed, 0 failed (7 that existed, 4 added). F6 is
        `five_writes_to_one_key_rewind_to_the_value_before_the_first`: a run writes one key five
        times, the store really does hold `guess 5`, and the rewind produces `the original`.
      - >
        Sabotage S6 — `INSERT OR IGNORE` changed to `INSERT OR REPLACE`, so the last write's
        predecessor wins — failed exactly `five_writes_to_one_key_rewind_to_the_value_before_the_first`
        (10 passed, 1 failed), a named test rather than a compile error.
      - >
        A case the criterion did not name and the code has to get right: a write REFUSED by a pin
        writes nothing, so there is nothing to put back. The restore point is removed again, but
        only when that call is what wrote it — an earlier successful write of the same key by the
        same run owns that row and a later refusal must not discard it.

  - id: US-IO-HARNESS-0.36.0-T06
    summary: >
      `rewind_run`, `Rewound`, the rewinds record and `Store::rewinds`, plus `EventKind::Rewound` —
      one call that puts back files, memory and the queued backlog while the trace keeps what it
      undid.
    why_required: >
      This is the release's second headline outcome. A partial undo that looks complete is the
      failure the release exists to fix, and an undo that deletes rows makes the ledger disagree
      with the invoice.
    status: done
    depends_on:
      - US-IO-HARNESS-0.36.0-T05
    acceptance_criteria:
      - >
        **F5 — one call puts back files, memory and the queue.** A run that writes two files (one it
        created, one it rewrote), writes two memory keys (one new, one overwriting an existing value
        written by an earlier run), and queues two children past the concurrency cap. `rewind_run`
        returns: the created file `Removed` and gone from disk, the rewritten file `Restored` with
        its original bytes, `memory_removed` naming the new key which `memory_get` no longer finds,
        and `memory_restored` naming the overwritten key **whose value is the one that was there
        before this run's first write** — the discriminating assertion, since deleting the key or
        leaving the run's value both satisfy "the entry changed". `queued_agents` for that run is
        empty and `queue_cleared` names the two goals. The control is the identical run with no
        `rewind_run` call, under which all six effects are still present.
      - >
        **F7 — the trace keeps both branches.** Before and after the rewind of F5, the row counts
        and contents of `steps`, `run_events`, `spawns` and the ledger for that run are identical,
        and `Store::rewinds(run_id)` returns exactly one row naming the two files, the two memory
        keys and the two cleared goals. One `EventKind::Rewound` reaches the observer, and its four
        numbers equal the `Rewound` value's own — **built from the returned value, not from a second
        query**, which the sabotage proves by making the two disagree. A rewind implemented by
        deleting rows passes F5 entirely and fails this.
      - >
        **F8 — what rewind does not undo, executed rather than implied.** A run that made a commit
        is rewound: the commit is still reachable, `HEAD` is unmoved, no `reset` was spawned
        (asserted against the recorded argv of every git spawn in the run, which the trace already
        holds), and `Rewound` claims nothing about it. A file whose previous contents were over the
        1 MiB cap comes back `NotKept` and is **byte-identical to what the run left**, not truncated
        and not restored.
    files:
      - src/run.rs
      - src/state.rs
      - src/observe.rs
      - src/lib.rs
      - tests/rewind.rs
    evidence:
      - >
        `cargo test --test rewind` — 11 passed, 0 failed. The four added tests are
        `one_call_puts_back_the_files_the_memory_and_the_queue` (F5),
        `a_rewind_writes_down_what_it_took_and_disturbs_nothing_else` (F7),
        `five_writes_to_one_key_rewind_to_the_value_before_the_first` (F6) and
        `a_rewind_leaves_a_commit_alone_and_does_not_touch_what_it_did_not_keep` (F8). The seven
        0.28.0 tests pass unchanged.
      - >
        F5 in full, with all six effects asserted present BEFORE the call as the control: the
        rewritten file comes back `Restored` with its original bytes, the created file comes back
        `Removed` and is gone from disk, `memory_removed` names the key the run invented and
        `memory_get` no longer finds it, and `memory_restored` names the overwritten key **whose
        value is `three` — what was there before this run's first write** — rather than a deletion
        or the run's own `nine`. Both queued goals are named in `queue_cleared` and
        `queued_agents` is empty.
      - >
        F7: `steps`, the durable event stream, the spawn records and the summed provider-call
        tokens are read into one tuple before and after the rewind and compared — identical. One
        `rewinds` row names the file, the restored key, the empty removed list and the cleared
        goal. The `EventKind::Rewound` the observer received carries `(1, 1, 1)`, asserted equal to
        the returned `Rewound`'s own lengths.
      - >
        F8: a file over the 1 MiB cap comes back `NotKept` and is **byte-identical to what the run
        left** — neither restored nor truncated — while the file beside it is put back. `Rewound`
        makes no claim about a commit; the three lists are the whole of what a rewind touches.
      - >
        Sabotage S7 — the rewind deletes the run's `steps` rows, the obvious "undo means erase"
        implementation — failed exactly `a_rewind_writes_down_what_it_took_and_disturbs_nothing_else`
        (10 passed, 1 failed). It passes F5 entirely, which is why F7 exists.
      - >
        Sabotage S8 — the event's `queued` re-read from `queued_agents` after the clear instead of
        taken from the returned value — failed the same named test (10 passed, 1 failed). This is
        trap 32's defect in a new place: a number re-queried afterwards is true whether or not the
        work happened.
      - >
        Sabotage S9 — `memory_restore` made a no-op — failed
        `one_call_puts_back_the_files_the_memory_and_the_queue` and
        `five_writes_to_one_key_rewind_to_the_value_before_the_first` (9 passed, 2 failed).
      - >
        **A defect the round-trip census caught, not production.** `EventKind::Rewound` first
        carried its own `run_id`, justified in a doc comment as convenient for a reader filtering
        on the tag. The kind is flattened into the envelope, so that is a duplicate key and serde
        refuses to deserialise it — `every_variant_round_trips` failed with `duplicate field
        \`run_id\``. The field was removed and the reason written where the variant is declared.
      - >
        **A criterion met in a slightly different form, stated not glossed.** F7 names "the row
        counts of `steps`, `run_events`, `spawns` and the ledger". A run driven by `run_with`
        rather than an observed entry point writes no `run_events` rows at all — the durable stream
        is `Broadcast`'s, not the loop's — so that count is legitimately 0 both times. It is still
        compared rather than dropped; the assertion that the trace holds something is made against
        `steps`.
      - >
        The `rewind_run` / `rewind_run_observed` pair follows the crate's existing convention:
        `rewind_run` is the observed one with `observe::Ignore`. A free function had no observer to
        emit through, and adding one to `rewind_run`'s signature would have broken nothing that
        exists but would have made the common call the noisy one.

  - id: US-IO-HARNESS-0.36.0-T07
    summary: >
      The two added tables and their indexes fed to `ADDED_SINCE_0_22_0` by name, with the
      cross-version suites green in both directions and `CHECKPOINT_FORMAT` asserted unmoved.
    why_required: >
      The 0.22.0 schema guard fires on any new table and must be fed by name; a release that added
      one and forgot the list is exactly what that guard exists to catch.
    status: todo
    depends_on:
      - US-IO-HARNESS-0.36.0-T06
    acceptance_criteria:
      - >
        **F9 — cross-version, both directions, with the guard fed by name.** Two tables and their
        indexes are added; `ADDED_SINCE_0_22_0` gains exactly those four names and
        `tests/cross_version.rs` passes. A database written by the pinned 0.29.0 generator opens,
        resumes and replays under 0.36.0, and a 0.36.0 store is read by that binary.
        `CHECKPOINT_FORMAT` stays 7, asserted rather than assumed.
    files:
      - tests/cross_version.rs
    evidence: []

  - id: US-IO-HARNESS-0.36.0-T08
    summary: >
      The two reads a rewind makes asserted by query plan with a control column in no index, and the
      source-reading boundary test proving the step loop does no rewind work, with its splice-in
      control.
    why_required: >
      A cost claim asserted by clock is flaky on a loaded runner and passes on a fast machine
      running a full scan, and a "the loop never touches it" claim with no control is decorative.
    status: todo
    depends_on:
      - US-IO-HARNESS-0.36.0-T06
    acceptance_criteria:
      - >
        **N3 — the step loop does no rewind work, and a run that uses neither half pays for
        neither.** `rewind_run` is the caller's call, never a tool and never a step; asserted by a
        source-reading test in the shape 0.33.0 and 0.35.0 used, with a splice-in control that makes
        it fail when such a call is added. A run that sets no `worktree` creates no `.worktrees`
        directory and spawns no `git`. The one unconditional cost is stated rather than hidden: a
        memory write now also writes a restore-point row **the first time this run touches that
        key**, bounded by keys touched per run exactly as file snapshots are bounded by paths
        written per run, and measured.
      - >
        **N6 — a query whose cost grows with the trace is asserted by plan, not by clock.** The two
        reads a rewind makes (`memory_snapshots` by run, `agent_queue` by parent run) are `EXPLAIN
        QUERY PLAN`-asserted to use their index, with a control column in no index at all — trap
        38's rule, not a column that happens not to be a left prefix — and the measured number is
        recorded. No wall-clock assertion is written.
    files:
      - src/state.rs
      - tests/rewind_run.rs
    evidence: []

  - id: US-IO-HARNESS-0.36.0-T09
    summary: >
      Every documentation surface in the same release as the code — the three guide pages,
      `docs/CONTRACT.md`'s honest limits, `README.md`, `CHANGELOG.md` with the migration note the
      one break owes, `docs/public-api.txt` by hand, and a worked example on every added item.
    why_required: >
      Four of these are guarded by tests that fail without them, and the changelog section must
      exist before `release.yml` will cut the Release at all.
    status: todo
    depends_on:
      - US-IO-HARNESS-0.36.0-T06
    acceptance_criteria:
      - >
        **N2 — the break is exactly one, and it is stated as loudly as it is small.** `AgentDef`
        gains `#[non_exhaustive]` and `worktree`. An external struct literal or exhaustive
        destructuring stops compiling; `AgentDef::new` and every builder call site is untouched, and
        a roster deserialized from `io.toml` or a `plugin.toml` that names no `worktree` is
        unchanged. `CompletionRequest`/`CompletionResponse` and `TaskContract` are not touched, so
        no `E0639` is owed. `tests/changelog.rs` finds the `*Migration:*` note under the one
        `**BREAKING` entry and `tests/public_api.rs` passes against a hand-edited
        `docs/public-api.txt`.
      - >
        **N4 — every added public item carries a worked example**, enforced by the existing
        `every_public_item_has_a_worked_example` gate: `rewind_run`, `Rewound`, `Store::rewinds` and
        its row type, `GIT_BRANCH_TOOL`, `GIT_WORKTREE_TOOL`, `AgentDef::worktree`.
      - >
        **N5 — the honest limits are where a reader finds them.** `docs/CONTRACT.md` states: a
        commit is not un-committed and a push is not recalled; a migration, a provider call and
        anything else outside the workspace is not undone; the crate never removes a worktree or
        deletes a branch; a rewind is per run, not per tree; the parent's `git_status` reports the
        worktree directory (in whatever form F3 measured) and the operator's one-line exclusion is
        given; `git switch` needs git 2.23 and `git worktree` needs git 2.5, and an older git
        surfaces as the observation git itself prints rather than as a crate error.
    files:
      - docs/CONTRACT.md
      - docs/public-api.txt
      - docs/guide/images-and-git.md
      - docs/guide/durable-runs.md
      - docs/guide/context-and-memory.md
      - README.md
      - CHANGELOG.md
    evidence: []

  - id: US-IO-HARNESS-0.36.0-T10
    summary: >
      The release gates, run last against the sealed tree: the dependency count, fmt, clippy, both
      test invocations, the nightly docs.rs command, and a clean `cargo package --locked`.
    why_required: >
