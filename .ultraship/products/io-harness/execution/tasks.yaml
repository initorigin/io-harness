  - Cargo.toml
  - src/lib.rs
  - src/run.rs
  - tests/config.rs
  - tests/prompt.rs
  evidence: []
- id: US-IO-HARNESS-0.53.0-T08
  summary: The two events, the checked-in doc surfaces, the public-API snapshot, and the no-durable-state
    assertion.
  why_required: A boundary nobody can audit is not a boundary, and this repository's doc surfaces are
    gated by tests that fail the build when a release changes behaviour without changing what the docs
    claim.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.53.0-T07
  acceptance_criteria:
  - '**N3 — no durable state.** `git diff main -- src/state.rs` is empty, `CHECKPOINT_FORMAT` is 7, and
    a 0.52.0 store and a 0.53.0 store are the same store in both directions.

    '
  - '**N4 — the public surface addition is stated in advance and met exactly.** `docs/public-api.txt`
    gains the crate-root re-exports this release adds and no others; the number is named in the record
    and any difference is explained rather than absorbed. The file tracks crate-root re-exports only,
    so methods on existing types add no line — a fact this criterion states rather than rediscovers.

    '
  - '**O4 — the checked-in doc surfaces are updated in this release.** `docs/CONTRACT.md` gains the gate,
    the interception boundary and the platform row; the README''s feature list and platform table move;
    a `docs/guide/` page exists and `docs/CAPABILITIES.md` names it; the changelog entry exists; every
    new public item carries a worked example. The four doc tests and `tests/public_api.rs` pass.

    '
  files:
  - src/observe.rs
  - docs/CONTRACT.md
  - docs/CAPABILITIES.md
  - docs/guide/browser.md
  - docs/public-api.txt
  - README.md
  - CHANGELOG.md
  - src/lib.rs
  evidence: []
- id: US-IO-HARNESS-0.53.0-T09
  summary: examples/browser_live.rs against the real installed browser, and the release's own measurement.
  why_required: A fixture proves the client and cannot prove the protocol was understood — the previous
    release found three defects this way, every one invisible to a green suite.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.53.0-T08
  acceptance_criteria:
  - '**N5 — the release''s own measurement, recorded and not asserted.** For one real page: its text through
    `browser_read` in bytes, the same page''s screenshot in base64 bytes, the browser''s launch time,
    and the per-action round-trip time. The point of the number is operator guidance on when a screenshot
    is worth its bytes, and it is recorded in the release record and `docs/MEASUREMENTS.md` with the machine
    named. **No clock is a pass/fail gate**, per the standing rule.

    '
  - '**O3 — `examples/browser_live.rs` is run against the real installed browser before the record is
    sealed**, driving navigation, a click, typing, a scroll, a read, a screenshot and the console capture,
    and what it found is written into the record. This is a gate of this release, not an optional extra:
    0.52.0''s three live-run defects were all invisible to a green fixture suite.

    '
  files:
  - examples/browser_live.rs
  - Cargo.toml
  - docs/MEASUREMENTS.md
  evidence: []
- id: US-IO-HARNESS-0.53.0-T10
  summary: 'The gate set: both suites, the dependency count, the nightly rustdoc gate, the three-platform
    matrix and the sabotage pass.'
  why_required: The release's claims are only worth what the gates that checked them are worth, and a
    sabotage that fails nothing is a finding this release has to report rather than discover later.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.53.0-T09
  acceptance_criteria:
  - '**N1 — no new dependency.** `cargo tree` is 402 lines on macOS and Linux with the feature off and
    with it on, because the feature adds only `base64` through `media`, which the count already carries
    when that feature is enabled. Asserted by the existing dependency test and stated with the number
    in the record.

    '
  - '**O1 — the three-platform matrix is green**, with the browser suite running its fixture-driven tests
    on macOS and Linux and its refusal test on Windows. A green macOS gate alone is not evidence for this
    release: the transport is the platform-specific half.

    '
  - '**O2 — nothing in the suite gates on a wall clock.** Every settle is on a protocol signal or a bounded
    timeout whose expiry is a typed outcome, never an assertion that something happened within N milliseconds.
    This release adds a process spawn and a page load, which are the two slowest things the suite will
    contain, on the runner that is roughly three times slower than the development machine.

    '
  - '**O5 — the nightly rustdoc gate passes with `-D warnings`.** Run before the release PR. A brand-new
    `pub mod` is the shape that trips the private-intra-doc-links rule, which this release adds and which
    caught something in five of the last six releases.

    '
  files:
  - tests/browser.rs
  - src/browser.rs
  evidence: []
