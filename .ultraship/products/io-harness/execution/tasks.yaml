- id: US-IO-HARNESS-0.47.0-T11
  summary: Measure each rung's per-command overhead and record the figures.
  why_required: The Landlock rung's claim is that it avoids a wrapper spawn, which is a claim about a
    number. An unmeasured regression in a default every run now pays would be discovered by an embedder
    rather than by this release.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.47.0-T02
  - US-IO-HARNESS-0.47.0-T05
  acceptance_criteria:
  - '**N5 — each rung''s per-command overhead is measured, not asserted to be small.** The same fixed
    command is timed under `FullAccess`, under the Landlock rung and under the existing namespace rung
    on a Linux host, and under the Job Object and the AppContainer on a Windows runner, over the same
    30-iteration shape 0.46.0 used to record ~6.25 ms for `sandbox-exec`. Every figure goes into the release
    record. The Landlock rung''s claim is that it avoids a wrapper spawn entirely, which is a claim about
    a number and is therefore measured rather than argued.

    '
  files:
  - tests/sandbox.rs
  evidence: []
- id: US-IO-HARNESS-0.47.0-T12
  summary: 'Run the standing gates: no new dependency, MSRV, cross-version, and the five prior releases
    unaffected.'
  why_required: The release adds enforcement to paths every existing test drives. Without the regression
    gate a green suite would prove only that the new code compiles.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.47.0-T10
  acceptance_criteria:
  - '**N1 — no new dependency.** `cargo tree` for the default feature set is unchanged at **402** crates
    on macOS and Linux. Landlock and seccomp are `libc::syscall` with hand-written constants against the
    existing `cfg(unix)` `libc`; the AppContainer path uses the `windows-sys` features already listed
    in `Cargo.toml` (`Win32_Security_Isolation`, `Win32_Security_Authorization`). No `landlock`, no `seccompiler`,
    no `libseccomp`, no `nix`.

    '
  - '**N2 — MSRV unmoved.** The crate builds on 1.95 with the toolchain gate CI already runs.

    '
  - '**N6 — 0.41.0''s batch, 0.42.0''s gate, 0.43.0''s fold, 0.44.0''s boundary, 0.45.0''s prompt and
    0.46.0''s default are unaffected.** Their suites pass unchanged. Specifically: the composed system
    prompt is still byte-identical across the steps of a run, and still composed once — the boundary section
    names the selected backend, and a rung re-probed inside the step loop would convert 0.38.0''s cache
    read into a cache write on every step of every run and fail no other test.

    '
  - '**O2 — cross-version is unaffected and proven so.** No DDL, so a 0.46.0 store and a 0.47.0 store
    are the same store in both directions, asserted by the existing cross-version suites.

    '
  files:
  - Cargo.toml
  - Cargo.lock
  evidence: []
