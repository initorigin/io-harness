  - US-IO-HARNESS-0.47.0-T05
  - US-IO-HARNESS-0.47.0-T06
  acceptance_criteria:
  - '**F10 — every degradation completes the run and reports the weaker backend.** A Windows host where
    the container path is made to fail runs to completion and reports `windows-job-object`; a Linux host
    with no rung above the floor runs to completion and reports `portable-floor`; `EventKind::Contained`
    carries the backend that was applied in both cases, and `FullAccess` still reports `full-access` with
    no container and no ruleset. Sabotage: return an error from the backend instead of degrading, under
