product: io-harness
version: 0.60.1
tasks:
- id: US-IO-HARNESS-0.60.1-T01
  summary: Re-verify the compared harnesses against their current sources, and record the citations.
  why_required: The comparison table is the one part of this release that makes a public claim about someone
    else's project, and the 2026-07-28 audit in `product.yaml` is three weeks old and was never written
    for publication. Without a current, cited claim set there is no table to write, and the release falls
    back to a capability table naming nobody. It runs first because it is the longest pole and the only
    task whose outcome can change the shape of another.
  status: done
  depends_on: []
  acceptance_criteria:
  - '**F6 — every comparison row is sourced and dated.** A test asserts each row of the comparison table
    carries a link and a check date in ISO form, and that no date is older than this release''s own work.
    Sabotage: remove one row''s citation, under which only F6 fails. A claim about another project with
    no source is the one thing on this page that could be actionably wrong.

    '
  files:
  - .ultraship/products/io-harness/evidence/0.60.1/comparison-audit.md
  evidence:
  - Eight projects re-verified against their own current documentation or repository on 2026-08-16 — Claude
    Code, Codex CLI, opencode, Goose, pi, rig, swiftide, langchain-rust — recorded with per-claim citations
    in .ultraship/products/io-harness/evidence/0.60.1/comparison-audit.md
  - 'The audit corrected two claims the 2026-07-28 record in product.yaml had too strong: Claude Code
    does have a checkpoint (per user prompt, over files and conversation, not per step) and does have
    a real sandbox with network allow-listing. Both corrections are carried into the published table rather
    than the older, easier claim.'
  - Every cell that a project does not state reads 'not documented' rather than 'no'; pi is the only project
    that documents the absence itself.
- id: US-IO-HARNESS-0.60.1-T02
  summary: Rewrite README.md in the present tense, and add the three README drift tests.
  why_required: This is the release. Every other task closes a gap the audit found beside it; this one
    is the outcome the contract states. The tests are written in the same task because F2 and F3 must
    fail against today's README — a docs test that passes before the fix checks nothing, and writing it
    afterwards is how that happens.
  status: done
  depends_on:
  - US-IO-HARNESS-0.60.1-T01
  acceptance_criteria:
  - '**F1 — the README carries no release-version reference outside the two pinned lines.** A test scans
    README.md for a `\d+\.\d+\.\d+` literal and for the `X.YY.0` form the prose uses, and fails on any
    occurrence outside the `[dependencies]` snippet and the MSRV sentence that `tests/docs_drift.rs` already
    pins. Sabotage: reinstate one removed sentence — "**0.47.0 closed the Linux hole in this table**"
    — under which only F1 fails. The control the same test carries: the two permitted lines, present,
    must not trip it.

    '
  - '**F2 — every guide page has a README row.** A test reads `docs/guide/*.md` and asserts each file
    name appears in a table row of README.md, which is the check `guide_pages.rs` performs against `docs/CAPABILITIES.md`
    and has never performed against the README. It must fail on today''s README, which is missing `browser.md`
    — a test that passes before the fix is a test that checks nothing. Sabotage: delete a different row,
    `mailbox.md`, under which only F2 fails and names it.

    '
  - '**F3 — the README links the measurements.** A test asserts README.md contains a relative link to
    `docs/MEASUREMENTS.md`. It must fail on today''s README, which contains zero. Sabotage: remove the
    link, under which only F3 fails.

    '
  - '**F6 — every comparison row is sourced and dated.** A test asserts each row of the comparison table
    carries a link and a check date in ISO form, and that no date is older than this release''s own work.
    Sabotage: remove one row''s citation, under which only F6 fails. A claim about another project with
    no source is the one thing on this page that could be actionably wrong.

    '
  - '**F7 — every relative link in the README and `docs/` resolves.** The existing `relative_links_in_readme_and_docs_resolve`
    stays green across a rewrite that moves most of the links on the page. No new test; this is the criterion
    that the rewrite did not break what was already checked.

    '
  - '**N3 — no claim is widened.** Every capability sentence surviving into the rewritten README is at
    most as strong as what `docs/CONTRACT.md` says about the same capability. Evidenced by the review,
    page against contract, section by section — this is the criterion a test cannot carry and the one
    a rewrite most easily fails.

    '
  - '**N4 — the page renders.** The README renders correctly on GitHub and on crates.io: every table,
    every relative link resolved against the raw URL crates.io uses rather than a repo path, and the logo
    image still loading. crates.io does not resolve repository-relative links the way GitHub does, which
    is why the current README already uses an absolute raw URL for the logo.

    '
  files:
  - README.md
  - tests/docs_drift.rs
  - tests/guide_pages.rs
  evidence:
  - 'README.md rewritten: 618 -> 695 lines, present tense, table of contents, capability matrix above
    the prose, measured-cost section, two sourced comparison tables, and a guide table carrying all 25
    pages.'
  - 'F1 green: `readme_states_no_release_version_outside_the_pinned_lines` passes, and `grep -nE ''\b[0-9]+\.[0-9]+\.[0-9]+\b''
    README.md` returns nothing. The control test `present_tense_checker_rejects_a_reinstated_sentence`
    reinstates the real 0.47.0 sentence verbatim and is reported.'
  - 'F2 green: `every_guide_page_has_a_readme_row` passes. Its control `control_a_page_linked_only_from_prose_is_reported`
    reproduces the exact defect — browser.md linked in a sentence, absent from the table — and reports
    it.'
  - 'F3 green: `readme_links_the_measurements` passes; `measurements_link_checker_reports_silence` rejects
    a README with no link.'
  - 'F7 green: `relative_links_in_readme_and_docs_resolve` still passes across a rewrite that moved most
    of the links on the page.'
  - 'cargo test --test docs_drift --test guide_pages: 24 passed, 1 failed, the failure being F5''s release
    table, which task T05 writes.'
- id: US-IO-HARNESS-0.60.1-T03
  summary: Correct the AppContainer claim in docs/CONTRACT.md, sweep the file for other outlived claims,
    and add the F4 test.
  why_required: '`docs/CONTRACT.md` is what a caller may depend on, and it currently tells a reader that
    nothing selects the Windows AppContainer — false since 0.59.0 shipped `SandboxConfig::with_access_confinement()`.
    A contract that is wrong about the security boundary is worse than one that is silent, because a reader
    who checks is misinformed rather than uninformed.'
  status: done
  depends_on: []
  acceptance_criteria:
  - '**F4 — the contract no longer claims the AppContainer is unselected.** A test asserts `docs/CONTRACT.md`
    contains `with_access_confinement` and does not contain the phrase "nothing selects it". Sabotage:
    restore the 0.26.0-era sentence, under which only F4 fails. This is the narrow, checkable half of
    the manual sweep; the sweep itself is evidenced by the review.

    '
  files:
  - docs/CONTRACT.md
  - tests/docs_drift.rs
  evidence:
  - 'docs/CONTRACT.md:233 no longer says the AppContainer is built with nothing selecting it; it names
    `SandboxConfig::with_access_confinement()` as the selector. F4''s test `contract_states_the_appcontainer_selector`
    passes: the file contains `with_access_confinement` 4 times and `nothing selects it` 0 times.'
  - 'The sweep found eight further outlived claims beyond the known defect, each corrected against the
    source rather than the CHANGELOG''s prose: the browser''s ''Windows is not supported'' bullet, the
    platform table''s single Windows row (now two backends), the unqualified ''sandboxed on Windows means
    resource-capped'', the 0.47.0 rescheduling note, two open questions that 0.59.0 answered, the per-platform
    enforcement table, the ExecMode ''enforces nothing for the filesystem'' claim, and the proxy-per-backend
    table which had no AppContainer row.'
  - 'One claim was verified in the source by the main thread rather than taken from the agent: `Sandbox::select`
    at src/sandbox.rs:1112 selects the AppContainer only when `config.access_confinement && config.mode
    != ExecMode::FullAccess`. That bound is narrower than the CHANGELOG''s prose, and the README was corrected
    to carry it so N3 holds — no claim on the landing page is stronger than the contract''s.'
  - 'Four items were found suspicious and deliberately left, with reasons recorded: a forward-looking
    removal note for `user`, an unslotted `rusqlite::Error` variant, a ''named roadmap work'' phrase,
    and a spawn-argument count that may have drifted by one. None is false today.'
- id: US-IO-HARNESS-0.60.1-T04
  summary: Bump the version to 0.60.1 and write the CHANGELOG section.
  why_required: 'F5 requires the new release table to cover every version CHANGELOG.md declares, 0.60.1
    included, so the CHANGELOG section must exist before that table can be complete. It also carries the
    gate that most easily goes wrong on a patch: the README install snippet is pinned to major.minor and
    must NOT move while Cargo.toml does.'
  status: done
  depends_on: []
  acceptance_criteria:
  - '**F8 — the existing docs gates stay green.** `msrv_is_stated_and_matches_cargo_toml`, `readme_dependency_version_matches_cargo_toml`,
    `documented_feature_list_matches_cargo_toml`, `every_capability_has_a_guide_page`, `no_guide_page_is_orphaned_from_the_index`,
    `the_guide_directory_holds_nothing_unlisted`, and the `public_api` and `changelog` suites. The dependency-version
    gate is the one to watch, and on a patch it is the side that must **not** move: it pins the README''s
    install snippet to Cargo.toml''s major.minor precisely so a patch does not churn it, so `io-harness
    = "0.60"` stays exactly as it is while Cargo.toml goes to 0.60.1. A rewrite that "helpfully" writes
    `"0.60.1"` into that snippet fails the gate, which is what the gate was written for after the line
    sat at `"0.25"` for eleven releases.

    '
  - '**N2 — the version moves in exactly two files.** `Cargo.toml` and `Cargo.lock`, 0.60.0 → 0.60.1.

    '
  files:
  - Cargo.toml
  - Cargo.lock
  - CHANGELOG.md
  evidence:
  - 'Cargo.toml:3 and the io-harness entry in Cargo.lock both read 0.60.1; `grep 0.60.0 Cargo.toml Cargo.lock`
    returns nothing. N2 satisfied: the version moved in exactly two files.'
  - CHANGELOG.md gained `## [0.60.1] - 2026-08-16` between Unreleased and 0.60.0, written against docs/CHANGELOG_STRUCTURE.md
    — categories in the mandated order with the empty ones omitted per its rule 3, and no breaking marker,
    so tests/changelog.rs has nothing to enforce. The file keeps no bottom link-reference section, so
    none was added.
  - 'F8''s sharpest half green: `readme_dependency_version_matches_cargo_toml` passes with Cargo.toml
    at 0.60.1 and the README snippet still reading `io-harness = "0.60"` — the patch did not churn the
    install line, which is what that gate exists for.'
- id: US-IO-HARNESS-0.60.1-T05
  summary: 'Refresh docs/CAPABILITIES.md: the capabilities shipped since it was last touched, the pillars
    table carried forward, the release table, and the F5 test.'
  why_required: This is where the release-anchored facts removed from the README land, so the README rewrite
    is only lossless if this task lands with it. The file also stops short of the browser, LSP and the
    mailbox, which means the index a reader arriving at `docs/` is pointed at does not know about three
    shipped capabilities.
  status: done
  depends_on:
  - US-IO-HARNESS-0.60.1-T04
  acceptance_criteria:
  - '**F5 — the capabilities release table covers every released version.** A test parses the version
    column of the new table in `docs/CAPABILITIES.md` and asserts it holds every version CHANGELOG.md
    declares a `## [x.y.z]` section for, 0.60.1 included. Sabotage: drop the 0.53.0 row, under which only
    F5 fails and names the missing version. This is what makes the table a list rather than a snapshot.

    '
  files:
  - docs/CAPABILITIES.md
  - tests/guide_pages.rs
  evidence:
  - 'docs/CAPABILITIES.md 125 -> 239 lines. New `## What shipped when` table: CHANGELOG.md declares 66
    versions (0.1.0 through 0.60.1, the five historical patch releases included) and the table has 66
    rows, verified set-equal in both directions with zero missing and zero extra.'
  - 'F5 green: `the_capabilities_release_table_covers_every_released_version` passes. Its control `release_table_checker_reports_a_dropped_row`
    names the dropped version, and `release_table_checker_does_not_count_a_version_named_in_prose` proves
    a table row is required rather than a mention.'
  - 'Eight capabilities added to ''Beyond the pillars'', each verified against its own guide page rather
    than against the CHANGELOG: sessions, the mailbox, speculative read-ahead, the browser, LSP navigation,
    configuration, hooks and undo.'
  - The twelve-pillars table was deliberately NOT advanced. 0.58.0 (retention), 0.59.0 (Windows browser
    and access confinement) and 0.60.0 (the mailbox) each extend a beyond-pillar capability rather than
    a pillar, and no release contract for those versions claims one. The newest citation stays 0.57.0,
    which is the honest answer rather than the flattering one.
  - Every relative link in the file resolves, and the CHANGELOG anchors were generated by the GitHub rule
    and machine-checked against each heading's real text.
- id: US-IO-HARNESS-0.60.1-T06
  summary: 'Run the full gate: the suite on all three platforms, the nightly rustdoc gate, and the documentation-only
    diff assertion.'
  why_required: N1 is the criterion that keeps this release what it says it is, and it can only be asserted
    once every other task has landed its diff. The docs gates live inside the suite, so a documentation
    release is exactly the one that must run all of it rather than less of it.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.60.1-T02
  - US-IO-HARNESS-0.60.1-T03
  - US-IO-HARNESS-0.60.1-T04
  - US-IO-HARNESS-0.60.1-T05
  acceptance_criteria:
  - '**F8 — the existing docs gates stay green.** `msrv_is_stated_and_matches_cargo_toml`, `readme_dependency_version_matches_cargo_toml`,
    `documented_feature_list_matches_cargo_toml`, `every_capability_has_a_guide_page`, `no_guide_page_is_orphaned_from_the_index`,
    `the_guide_directory_holds_nothing_unlisted`, and the `public_api` and `changelog` suites. The dependency-version
    gate is the one to watch, and on a patch it is the side that must **not** move: it pins the README''s
    install snippet to Cargo.toml''s major.minor precisely so a patch does not churn it, so `io-harness
    = "0.60"` stays exactly as it is while Cargo.toml goes to 0.60.1. A rewrite that "helpfully" writes
    `"0.60.1"` into that snippet fails the gate, which is what the gate was written for after the line
    sat at `"0.25"` for eleven releases.

    '
  - '**N1 — nothing under `src/` changes except documentation.** `git diff main -- src/` shows only lines
    inside `//!` or `///` comments, and `docs/public-api.txt` is byte-identical to the 0.60.0 snapshot.
    Asserted by reading the diff, and by `public_api.rs` staying green with no snapshot regeneration.
    This is what makes 0.60.1 a documentation release rather than a feature one, and it is the criterion
    the release fails on if a "small fix" is smuggled in beside the docs.

    '
  - '**O1 — CI is green on all three platforms** on the feature branch and again on the merge to develop.
    A docs-only release still runs the whole suite, because the suite is where the docs gates live.

    '
  - '**O2 — the nightly rustdoc gate is green.** `RUSTDOCFLAGS` under nightly catches what stable `cargo
    doc` cannot see, and it has caught something in four of the last five releases. A release that edits
    doc comments is precisely the one that should not skip it.

    '
  files:
  - docs/public-api.txt
  evidence: []
