product: io-harness
version: 0.55.0
tasks:
- id: US-IO-HARNESS-0.55.0-T01
  summary: 'Give the read path a type: classify a file before decoding it, and stop swallowing the UTF-8
    failure in `Workspace::read_file`.'
  why_required: 'It is the release''s first defect: `std::fs::read_to_string(abs).unwrap_or_default()`
    (`src/tools/workspace.rs:419`) hands a model an empty string for any file that is not valid UTF-8,
    which reads exactly like a file that does not exist. Every other read change in this release sits
    on top of the classification this task introduces.'
  status: done
  depends_on: []
  acceptance_criteria:
  - '**F6 — a binary file is named as binary, not read as empty.** A file of bytes that are not valid
    UTF-8 produces an observation naming the path, the byte size and the sniffed kind, and containing
    **no file content**. `Workspace::read_file` on the same path returns `Err`. The control is the same
    file on 0.54.0, where the observation is an empty read — asserted here as a regression test with the
    old behaviour written out, so the fix cannot silently revert. Sabotage: restore `unwrap_or_default()`,
    under which the observation is empty and only F6 fails.

    '
  - '**F7 — UTF-16 is decoded and named; UTF-16 without a BOM is binary.** A UTF-16LE file and a UTF-16BE
    file, each with a byte-order mark, read as their exact text with the encoding named in the observation
    header. The same content with the BOM removed is refused as binary, by name. Sabotage: decode UTF-16
    by pairing bytes without checking the mark, under which the BOM-less case reads as text and only F7
    fails.

    '
  - '**F8 — an image or a document read by `read_file` is routed, not decoded.** `read_file` on a PNG
    names `view_image`; on an `.xlsx`, `.docx`, `.pptx` or `.pdf` it names that format''s tool. The observation
    carries no content in either case. Under a build without the `documents` feature the document message
    still names the tool and says the feature is not compiled in, because a model told nothing retries
    the same call. Sabotage: fall through to the binary message for these extensions, under which the
    tool names are absent and only F8 fails.

    '
  files:
  - src/tools/workspace.rs
  - src/tools/mod.rs
  - src/run.rs
  - tests/read_typing.rs
  evidence:
  - '`cargo test --test read_typing` — 15 passed, 0 failed. F6: `a_binary_file_is_named_with_its_size_and_kind`,
    `the_text_reader_now_fails_where_it_used_to_return_an_empty_string` (the old `Ok("")` behaviour written
    out as the thing that must fail), `through_the_loop_a_binary_read_carries_no_content`.'
  - 'F7: `utf16_is_decoded_and_the_encoding_is_named`, `utf16_without_a_byte_order_mark_is_binary_rather_than_guessed`,
    `through_the_loop_a_utf16_read_says_which_encoding_it_was`.'
  - 'F8: `an_image_is_routed_to_the_tool_that_can_look_at_it`, `a_document_names_the_tool_that_reads_it`,
    `an_svg_is_text_because_it_is_text`, `through_the_loop_an_image_read_carries_no_content_and_names_the_route`.'
  - Existence is checked before the extension table, so a missing `.xlsx` still reads as empty — the pre-existing
    `a_missing_byte_read_is_an_error_not_an_empty_document` unit test passes unchanged.
- id: US-IO-HARNESS-0.55.0-T02
  summary: Refuse an oversized read whole instead of truncating it, and give `read_file` an `offset`/`limit`
    line range so the refusal has somewhere to point.
  why_required: 'The refusal is the release''s reason for existing — a truncated read has the shape of
    a whole one and nothing downstream can tell them apart — and it is only usable because the range exists.
    Neither half ships alone: a refusal with no remedy is a stuck run.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.55.0-T01
  acceptance_criteria:
  - '**F9 — a read that will not fit returns no content.** A file whose text exceeds the effective ceiling
    produces an error observation containing the path, the size in chars, the ceiling, and both remedies
    — and containing **none of the file''s bytes**, asserted by searching the whole observation for a
    sentinel string placed at the file''s head, its middle and its tail. Sabotage: keep `bound`''s tail-preserving
    behaviour for `ObsKind::Read`, under which the tail sentinel appears and only F9 fails.

    '
  - '**F11 — a range read is served and legible as a range.** `read_file` with `offset` 10 and `limit`
    5 on a 100-line file returns exactly lines 10 to 14, and the observation header states the range and
    the total line count. An `offset` past the end is an error naming the total, not an empty success.
    A range that still exceeds the ceiling is refused by F9''s rule. Sabotage: treat `offset` as 0-based,
    under which the returned lines are off by one and only F11 fails.

    '
  files:
  - src/run.rs
  - tests/read_typing.rs
  evidence:
  - 'F9: `a_read_that_will_not_fit_returns_none_of_the_file` — a 14,046-char file against the default
    12,000-char ceiling; all three sentinels (head, middle, tail) absent from the observation; the refusal
    names the size, the ceiling, `offset`/`limit` and `max_read_chars`.'
  - 'F9''s remedy proven usable rather than merely offered: `the_offered_range_actually_works_on_the_file_that_was_refused`
    refuses the whole file and then serves `offset: 1, limit: 1` from the same file in the next step.'
  - 'F11: `a_range_read_returns_exactly_the_lines_asked_for` (lines 10-14 of 100, one-based, nothing on
    either side, header states `lines 10-14 of 100`) and `a_range_beyond_the_end_is_an_error_naming_the_total`.'
- id: US-IO-HARNESS-0.55.0-T03
  summary: 'Make the read ceiling an operator key: `[run] max_read_chars` in `io.toml`, projected onto
    `Contract`, defaulting to the budget-derived value.'
  why_required: A refusal a run's behaviour turns on has to be predictable, and today's limit is a share
    of what budget is left — the same file is readable at step three and refused at step forty. The refusal
    must also be able to say which of the two ceilings bound it, which requires both to exist as distinct
    numbers.
  status: done
  depends_on:
  - US-IO-HARNESS-0.55.0-T02
  acceptance_criteria:
  - '**F10 — the refusal names which ceiling it hit.** The same file is refused under a small `max_read_chars`
    with a run budget that would have allowed it, and refused again under the budget-derived ceiling with
    no `max_read_chars` set. The two texts differ and each names its own limit. Sabotage: report one message
    for both, under which the two assertions collide and only F10 fails.

    '
  - '**F13 — the ceiling is an operator key that travels the ordinary path.** `[run] max_read_chars` in
    an `io.toml` reaches `Contract` through `Config`, an unknown key beside it is still refused by `deny_unknown_fields`,
    a project-scoped file may narrow it and may not widen it, and a contract with nothing set behaves
    exactly as 0.54.0 did — asserted by an unset run and a set run over the same file. Sabotage: read
    the key straight from the config in the run loop instead of projecting it onto the contract, under
    which the typed-API assertion fails and only F13 fails.

    '
  files:
  - src/config.rs
  - src/contract.rs
  - src/run.rs
  - tests/config.rs
  - tests/read_typing.rs
  evidence:
  - 'F13: `cargo test --test config` — 54 passed, 0 failed. `max_read_chars_reaches_the_contract_through_the_ordinary_projection`
    (the key reaches `TaskContract` through `Config::apply_to`, and unset stays `None` = 0.54.0 behaviour),
    `a_key_misspelled_beside_it_is_still_refused_by_name` (`deny_unknown_fields` still bites), `a_project_scoped_file_may_lower_the_read_ceiling_and_may_not_raise_it`.'
  - 'The narrowing rule needed a mechanism the crate did not have: the four existing project-scope refusals
    reject a widening *value* (`exec = "allow"`), and a number has none. Added `NARROWING` in `src/config.rs`
    — for `run.max_read_chars` the lower number wins over the later scope, but only when the incoming
    scope is `Project`; `io.local.toml` and the user scope set it outright, asserted as the control in
    the same test.'
  - 'F10: `the_two_ceilings_produce_two_different_refusals` — one file refused under `with_max_read_chars(50)`
    names "50-char ceiling set by `[run] max_read_chars`", the other under no operator key names the turn''s
    remaining context budget, and neither observation carries content.'
  - 'Widening beyond the derived ceiling is structurally impossible whatever the config says: the read
    is refused when it exceeds *either* ceiling, so the budget-derived one always still applies.'
- id: US-IO-HARNESS-0.55.0-T04
  summary: Replace a no-longer-fitting stored read with a stub in assembly, and leave every other observation
    kind bounded exactly as it is.
  why_required: A read that fitted when it happened can be squeezed later by a narrower budget share,
    and serving the model a fragment then is the same lie the truncation was. The negative half — grep,
    find and exec still bounded — is what keeps the change from becoming a general rule that hides a command's
    output.
  status: done
  depends_on:
  - US-IO-HARNESS-0.55.0-T03
  acceptance_criteria:
  - '**F12 — a stored read is whole in the prompt or a stub, never a fragment.** An assembled prompt under
    a share too narrow for a read that fitted when it happened contains the stub — path, size, and the
    range to re-read — and **no** content from that read, asserted on the same three sentinels as F9.
    In the same assembly a `Grep` and an `Exec` entry are still bounded with their existing marker, which
    is the negative half of the claim. Sabotage: apply the stub rule to every `ObsKind`, under which the
    grep assertion fails and only F12 fails.

    '
  files:
  - src/context.rs
  - tests/context.rs
  evidence:
  - 'F12: `cargo test --test context` — 23 passed, 1 failed, and the failure is `an_mcp_result_is_bounded_where_it_enters_the_context`,
    which panics with `fixture server not built ... cargo test builds examples` — an invocation artefact
    of `--test context`, not a regression. `a_read_that_no_longer_fits_is_a_stub_and_not_a_tail` asserts
    all three sentinels absent and the stub naming the file and `offset`.'
  - 'Negative half: `a_search_and_a_command_are_still_bounded_rather_than_refused` — `Grep` and `Tool`
    keep the head plus the `truncated` marker.'
  - Assembly already replaced a non-fitting entry with a stub; the fragment came from two other places.
    `refresh` (`src/context.rs`) bounded a re-read to its tail under a header saying the file had been
    re-read — it now returns a stub reason naming the size and the range remedy. And the stub text for
    `ObsKind::Read` now says to re-read with `offset`/`limit` instead of `re-run`, because only a read
    has a range to ask for.
  - 'Two pre-existing tests asserted the old behaviour and changed meaning rather than wording: `every_observation_kind_is_bounded_where_it_enters_the_context`
    now asserts the read is refused whole (the other five kinds are unchanged and are the control), and
    `a_sub_agent_loops_prompt_stays_inside_the_ceiling` uses files that fit a single read, since a file
    no read could carry is F9''s claim rather than that test''s.'
  - Document reads (`xlsx_read`, `pdf_read`, ...) are still bounded with the tail rule; they were not
    in the release's included scope and are recorded as a known limitation.
- id: US-IO-HARNESS-0.55.0-T05
  summary: 'Add the wide door for images: a `Media` constructor that passes the four wire types through
    byte-identically and decodes BMP, TIFF, ICO, TGA and PNM to PNG, with `image` moved under the `media`
    feature.'
  why_required: It is the whole image half of the outcome. It has to be a second constructor rather than
    a widened `Media::image`, because the four-type set is a fact about vendors that the wire gate must
    keep enforcing, and the byte-identity of the pass-through is what stops a JPEG being silently re-encoded.
  status: done
  depends_on:
  - US-IO-HARNESS-0.55.0-T04
  acceptance_criteria:
  - '**F1 — a format the wire refuses is accepted at the door and arrives as a PNG.** For each of BMP,
    TIFF, ICO, TGA and PNM, a fixture image of known dimensions goes through the new `Media` constructor
    and yields a `Media` whose media type is `image/png`, whose bytes decode as a PNG of those same dimensions,
    and whose first eight bytes are the PNG signature. Asserted per format, not on one representative.
    Sabotage: pass the source bytes through with the media type rewritten to `image/png`, under which
    the signature and the decode assertions fail and only F1 fails.

    '
  - '**F2 — the four wire types are passed through byte-identically.** A PNG, a JPEG, a GIF and a WebP
    through the same constructor come out with their own media type and **byte-identical** bytes — no
    decode, no re-encode, no digest change. A JPEG that survived a round trip through the decoder would
    be a silent quality loss on the common path. Sabotage: re-encode every input to PNG unconditionally,
    under which the JPEG and WebP byte-identity assertions fail and only F2 fails.

    '
  - '**F4 — `Media::image` is unchanged.** Its four-type set, its refusal text and its doctest are byte-identical
    to 0.54.0, asserted by `git diff` over the function in review and by the existing `tests/media.rs`
    cases passing unmodified. The new door is a second constructor, not a widened one.

    '
  - '**N5 — transcoding is bounded before it is attempted.** A decode is refused before it allocates when
    the source''s declared dimensions would exceed a stated pixel bound, and the re-encoded PNG is checked
    against `MAX_IMAGE_BYTES` with the same message the four-type path gives. A 40,000 × 40,000 BMP header
    is a refusal, not an out-of-memory. Measured and recorded, not clock-gated: the decode-and-re-encode
    time for each format''s fixture on a named machine.

    '
  - '**N1 — no new dependency, and the default tree is unmoved.** `cargo tree` is **402** lines. No new
    entry in `[dependencies]`. `cargo tree --features media` gains only `image` and its pure-Rust format
    crates; the exact added list is recorded in the record, and it contains no `-sys` crate and nothing
    requiring a C toolchain — asserted by the three-platform matrix building `--all-features` without
    a system package.

    '
  files:
  - Cargo.toml
  - src/provider/mod.rs
  evidence:
  - 'F1: `a_format_the_wire_refuses_is_accepted_at_the_door_and_arrives_as_a_png` — BMP, TIFF, ICO, TGA
    and PNM each asserted separately: media type `image/png`, the eight-byte PNG signature, and a 3x2
    round trip.'
  - 'F2: `the_four_wire_types_are_passed_through_byte_identically` — PNG and JPEG round-tripped through
    real fixtures, GIF and WebP asserted on opaque bytes (the stronger claim: the door does not look at
    them).'
  - 'F4: `the_wire_gate_still_refuses_everything_but_the_four` — `Media::image` unchanged, its four-type
    refusal intact; the pre-existing `tests/media.rs` cases pass unmodified.'
  - 'N5: `a_declared_size_over_the_pixel_bound_is_refused_before_decoding` — a BMP header rewritten to
    40000x40000 is refused from the header parse, naming the dimensions and the pixel bound; `MAX_IMAGE_PIXELS`
    is 50,000,000.'
  - 'N1: `cargo tree` on the default build is **402**, unchanged. `cargo tree --features media` is 438
    — 21 crates added (image, png, tiff, zune-jpeg, weezl, fax, flate2, miniz_oxide, fdeflate, adler2,
    simd-adler32, crc32fast, bytemuck, byteorder-lite, half, moxcms, pxfm, quick-error, zerocopy, zerocopy-derive,
    zune-core), none of them a `-sys` crate and none needing a C toolchain.'
  - '`image` gained the `bmp`, `tiff`, `ico`, `tga` and `pnm` features and moved under `media`; no new
    entry in `[dependencies]`.'
  - 'Fixture finding: `image` writes an ICO as an embedded PNG and its own ICO decoder refuses one that
    is not RGBA, so the fixture is encoded RGBA. A property of encoding a fixture with this library, not
    of ICO files an operator has.'
- id: US-IO-HARNESS-0.55.0-T06
  summary: Refuse SVG, HEIC and AVIF by name with a reason and a conversion, route a PDF to `pdf_read`,
    and make `view_image` use the wide door after the policy gate.
  why_required: A refusal that recites the vendor's four-type list is the failure the release is fixing
    at the doorstep; naming the format and the fix is the deliverable. The sniff has to sit inside the
    gated branch, or a classification becomes a way to probe for a file outside the policy boundary.
  status: done
  depends_on:
  - US-IO-HARNESS-0.55.0-T05
  acceptance_criteria:
  - '**F3 — an undecodable format is refused by its own name, with a remedy.** SVG, HEIC and AVIF inputs
    — each recognised both by extension and, where it has one, by magic bytes with a misleading extension
    — are refused with an `Error::Config` whose text contains the format''s name, the reason, and a conversion
    command producing a PNG. The text does **not** consist of the four-type list alone. A PDF is refused
    with a message naming `pdf_read`. Asserted on substrings for each of the four. Sabotage: fall back
    to `Media::image`''s existing message for anything not decodable, under which the name-and-remedy
    assertions fail and only F3 fails.

    '
  - '**F5 — `view_image` accepts what the constructor accepts and says what it did.** A `view_image` call
    on a BMP under a permitting policy attaches one `Media` of type `image/png` to the next request, and
    its observation names the source type, the PNG byte count and the digest. A `view_image` on an SVG
    produces F3''s refusal through the tool, and attaches nothing. Sabotage: keep `view_image`''s extension
    pre-check as the only gate, under which the BMP is refused before the gate and only F5 fails.

    '
  files:
  - src/provider/mod.rs
  - src/run.rs
  - tests/media.rs
  evidence:
  - 'F3: `an_undecodable_format_is_refused_by_name_with_a_remedy` — SVG/HEIC/AVIF/PDF each refused with
    the format''s name and a conversion (`resvg`, `heif-convert`, `avifdec`, `pdf_read`), and asserted
    NOT to contain `expected one of`.'
  - 'F5: `a_bmp_reaches_the_provider_as_a_png_and_the_trace_says_it_was_converted` — one `Media` of type
    `image/png` on the request, and the trace carries `image/bmp converted to image/png`; `an_svg_is_refused_by_name_through_the_tool_and_attaches_nothing`
    — zero images on every request and the refusal names SVG and resvg.'
  - '`cargo test --test media --features media` — 9 passed, 0 failed.'
  - 'The sniff/decode is inside the gated branch: `view_image`''s pre-gate check is still extension-only
    and reads nothing, so it cannot probe for a file outside the policy.'
  - The transcode note carries source type, wire type, PNG bytes and digest — not the decoded dimensions
    the scope prose mentioned, which would have meant changing what `Media::attach` returns. Recorded
    rather than glossed.
- id: US-IO-HARNESS-0.55.0-T07
  summary: Update the checked-in documentation surfaces and the changelog for both halves, including the
    two behaviour changes an embedder can see.
  why_required: '`docs/CONTRACT.md` currently states truncation as what happens to an oversized read and
    states the four-type set as the whole story about images. Shipping the new behaviour with those sentences
    standing would be shipping a documented lie, and the two behaviour changes are only discoverable if
    the changelog names them.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.55.0-T06
  acceptance_criteria:
  - '**O3 — `docs/CONTRACT.md` is amended in this release, by name.** The read-tool section and the observation-bounding
    section both describe truncation as what happens to an oversized read; both change, and the new rule
    — whole, asked-for range, or refusal, with the stub in assembly — is written where the old one stood.
    The media section gains the door-versus-wire distinction and the refused-by-name list. A release that
    changed this behaviour and left those sentences standing would be shipping a documented lie.

    '
  - '**O4 — the checked-in doc surfaces are updated in this release.** The README''s feature list, `docs/guide/tools-and-skills.md`
    (`read_file`''s type, its range, and the two ceilings), `docs/guide/configuration.md` (`max_read_chars`),
    `docs/CAPABILITIES.md`, `docs/MEASUREMENTS.md` (the transcode timings and the added-crate list) and
    the changelog entry. Every new public item carries a worked example. The doc tests and `tests/public_api.rs`
    pass.

    '
  - '**N2 — the public surface addition is stated in advance and met exactly.** `docs/public-api.txt`
    tracks crate-root re-exports. The prediction is **+1 line** for the new read-classification type if
    it is re-exported at the root, and **+0** otherwise; the new `Media` constructor, `Contract::with_max_read_chars`
    and the new `read_file` parameters add no line. Any difference is explained in the record rather than
    absorbed.

    '
  - '**N3 — the read behaviour change is a break, and it is named.** `Workspace::read_file` returns `Err`
    where it returned `Ok("")`, and a read over the ceiling returns an error observation where it returned
    a truncated one. No signature changes and nothing fails to compile; what changes is behaviour, which
    is stated in `migrations` and in the changelog rather than left to be discovered.

    '
  files:
  - README.md
  - docs/CONTRACT.md
  - docs/CAPABILITIES.md
  - docs/MEASUREMENTS.md
  - docs/guide/tools-and-skills.md
  - docs/guide/configuration.md
  - docs/guide/images-and-git.md
  - CHANGELOG.md
  - Cargo.toml
  - src/lib.rs
  - examples/transcode_cost.rs
  evidence:
  - 'O3: `docs/CONTRACT.md` gains two 0.55.0 sections — ''What a read returns, and what it will not return
    instead'' and ''What the image door accepts, and what the wire still refuses''. Both state the rule
    where the old one stood, including the two ceilings, the stub rule, and the explicit carve-out that
    every other observation kind is still bounded.'
  - 'O4: README (feature table + the loop paragraph), `src/lib.rs` crate prose and feature table, `docs/CAPABILITIES.md`
    (built-in tools and images bullets), `docs/guide/tools-and-skills.md` (a new ''What read_file gives
    back'' section), `docs/guide/configuration.md` (`max_read_chars` in the `[run]` block plus why its
    absence is not simply a default and why it is the one key a project file may only lower), `docs/guide/images-and-git.md`
    (door vs wire, the refused-by-name list, the pixel bound), `docs/MEASUREMENTS.md` (the transcode table),
    and the CHANGELOG entry with Added/Changed/Fixed and both behaviour changes named under Changed and
    Fixed rather than left in a bullet list.'
  - 'N2: `docs/public-api.txt` is **unchanged**, which is the `+0` branch the criterion predicted. `FileContent`
    and `TextEncoding` are re-exported from `tools`, not from the crate root, and the file tracks crate-root
    re-exports only; `MAX_IMAGE_PIXELS` sits beside `MAX_IMAGE_BYTES`, which is likewise not a root re-export.
    `cargo test --test public_api` — 9 passed.'
  - 'N3: no signature changed and nothing fails to compile; the two behaviour changes are named in the
    changelog under headings and in `docs/CONTRACT.md`.'
  - 'Measurement: `examples/transcode_cost.rs`, new, `required-features = ["media"]`. On an Apple M1,
    release, 512x512: pass-through 0.01-0.14 ms; BMP 2.55, TIFF 1.75, TGA 2.18, PNM 2.06 ms. Recorded,
    never asserted.'
  - '`examples/media_git_live` dropped its `barcode` requirement, which existed only to pull `image` in;
    `media` now carries it.'
  - 'Gates: `cargo test --test docs_drift --test guide_pages --test changelog` — 15 + 7 + 5 passed. `cargo
    test --doc --features media` — 437 passed after fixing one new doctest whose ''binary'' fixture was
    accidentally valid UTF-8.'
