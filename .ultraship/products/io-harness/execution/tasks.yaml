product: io-harness
version: 0.5.0
tasks:
  - id: US-IO-HARNESS-0.5.0-T01
    summary: Containment merge — a child inherits the parent policy and can only narrow it.
    why_required: >
      Without inherit-and-narrow the whole release is unsafe: a spawned agent could grant itself
      read, write, or execute the parent lacked. This is the one new permission rule and everything
      that spawns depends on it, so it comes first and is proven with pure unit tests.
    status: done
    depends_on: []
    acceptance_criteria:
      - A child whose overlay allows a path the parent denies does not gain that path — a write the child attempts there is refused exactly as it would be for the parent, proving allows intersect downward.
      - A child whose overlay adds a deny the parent lacked is refused on that path, proving denies union downward and that a child may narrow.
    files:
      - src/policy.rs
      - src/lib.rs
    evidence:
      - "cargo test --lib policy (15 pass): allow_cannot_reach_a_parent_deny, allow_cannot_widen_a_parent_default, deny_narrows_the_parent, containment_holds_downward_through_depth"

  - id: US-IO-HARNESS-0.5.0-T02
    summary: Containment value (caps + serde) and the tree-wide aggregate spend ledger.
    why_required: >
      The spend ceiling and agent/depth caps are the operator-held boundary a swarm cannot vote
      itself past. The ledger is pure, single-threaded-testable logic; building it before the spawn
      path lets the ceiling be proven before concurrency is involved.
    status: done
    depends_on:
      - US-IO-HARNESS-0.5.0-T01
    acceptance_criteria:
      - A tree whose combined token draw crosses the aggregate `max_total_tokens` halts as a whole with the halt attributed to the containment budget, and no single child had individually exceeded its own contract budget — proving the ceiling is tree-wide, not per-agent.
      - A child `TaskContract` setting a larger `max_tokens` than the tree has remaining does not get the larger budget — the effective budget is the tree's remaining, proving a contract cannot raise the ceiling.
    files:
      - src/containment.rs
      - src/lib.rs
    evidence:
      - "cargo test --lib containment (5 pass): the_ceiling_is_tree_wide_not_per_agent, a_contract_cannot_raise_the_ceiling, concurrent_draws_never_overspend_the_ceiling"
      - "cargo test --test subagents: the_aggregate_ceiling_halts_the_whole_tree"

  - id: US-IO-HARNESS-0.5.0-T03
    summary: Graph trace — parent_run_id, spawn events, and budget-draw records, migrated additively.
    why_required: >
      A composed tree that cannot be reconstructed after the fact is unauditable; the graph trace is
      how an operator sees what the fleet did and what it spent. Additive migration keeps 0.4.0
      databases opening.
    status: done
    depends_on:
      - US-IO-HARNESS-0.5.0-T02
    acceptance_criteria:
      - Every spawn, refusal, and budget draw is recorded so the tree is reconstructable from the store alone after the process ends — a test rebuilds the parent/child graph from a reopened store.
    files:
      - src/state.rs
    evidence:
      - "cargo test --lib state (10 pass): the_tree_is_reconstructable_from_a_reopened_store, a_pre_0_5_database_migrates_and_keeps_its_rows"

  - id: US-IO-HARNESS-0.5.0-T04
    summary: spawn_agent tool and the child loop, reused from the single-agent loop, with compose-back (sequential).
    why_required: >
      This is the release's core outcome — a parent decomposes a task into contained children over a
      shared workspace and continues from what they produced. Sequential first so the boundary and
      compose-back are correct before concurrency is added.
    status: done
    depends_on:
      - US-IO-HARNESS-0.5.0-T03
    acceptance_criteria:
      - A parent contract that spawns three children over a shared workspace reaches a verified success; each child's edit is present, the parent's compose-back used the children's results, and the trace contains the parent, all three children, and the parent/child edges.
      - "`spawn_agent` returns the child's outcome and a result summary to the parent, proven by a test where the parent's success depends on a value only a child produced."
    files:
      - src/run.rs
      - src/lib.rs
    evidence:
      - "cargo test --test subagents: a_parent_spawns_three_children_over_a_shared_workspace, spawn_agent_composes_the_childs_result_back"
  - id: US-IO-HARNESS-0.5.0-T05
    summary: Spawn refusal semantics — agent-count and depth caps, depth counted from the root.
    why_required: >
      Caps without enforcement are decoration. A spawn past a cap must be refused as a typed tool
      result the parent can adapt to, and depth must count from the root so a chain cannot reset it.
    status: done
    depends_on:
      - US-IO-HARNESS-0.5.0-T04
    acceptance_criteria:
      - A spawn beyond `max_total_agents` is refused as a typed tool result while the children spawned within the cap still complete to success; the refusal is in the trace attributed to the agent cap.
      - A spawn beyond `max_depth` is refused, and depth is counted from the root so a chain of children cannot reset it — a test drives a nesting chain to the cap and asserts the next spawn is refused.
    files:
      - src/run.rs
    evidence:
      - "cargo test --test subagents: a_spawn_beyond_the_agent_cap_is_refused_but_the_rest_complete, a_spawn_beyond_max_depth_is_refused_and_depth_counts_from_the_root"
  - id: US-IO-HARNESS-0.5.0-T06
    summary: Concurrent fan-out to 100+ under max_concurrent, with the aggregate-ledger race closed.
    why_required: >
      The 100+ concurrent target is the throughput property that makes composition worth doing at
      scale; the ledger must stay correct under concurrent draws or the ceiling is a lie. This is the
      first fallback drop, so it lands after the sequential boundary is proven.
    status: done
    depends_on:
      - US-IO-HARNESS-0.5.0-T05
    acceptance_criteria:
      - With `max_concurrent` set below the number of children requested in one step, no more than `max_concurrent` children run at once (asserted by an observed concurrency counter) and all requested children eventually complete.
      - A run configured at the 100+ concurrent target spawns and completes within its containment caps without deadlock or overspend, proving the fan-out target is real and bounded.
      - Concurrent draws on the aggregate budget by many children do not overspend past the ceiling — a stress test with many small concurrent children asserts total recorded spend never exceeds `max_total_tokens`, proving the ledger race is closed.
    files:
      - src/run.rs
      - src/containment.rs
    evidence:
      - "cargo test --test subagents: concurrent_fanout_to_over_100_stays_bounded_and_completes (120 children, peak <= 16)"
      - "cargo test --lib containment: concurrent_draws_never_overspend_the_ceiling (64 threads x 100 draws)"

  - id: US-IO-HARNESS-0.5.0-T07
    summary: One approver serves the whole tree; a child's defer persists and resumes unchanged.
    why_required: >
      Containment and human approval must compose rather than become two gates. A sensitive action in
      any child routes to the root's approver, and 0.4.0's defer/resume still holds inside the tree.
    status: done
    depends_on:
      - US-IO-HARNESS-0.5.0-T04
    acceptance_criteria:
      - A sensitive action inside a child reaches the same `Approver` the root was given; `ApproveAll` lets it proceed and `DenyAll` stops that child, with the decision recorded against the child's run, proving one approver serves the tree.
      - A child that defers a sensitive action persists an `AwaitingApproval` pending action resumable by `resume_with_decision`, unchanged from 0.4.0.
    files:
      - src/run.rs
    evidence:
      - "cargo test --test subagents: one_approver_serves_the_whole_tree_approve, one_approver_serves_the_whole_tree_deny"
      - "cargo test --test subagents: a_child_defer_persists_and_resumes_via_resume_with_decision (tree pauses surfacing request_id; resume_with_decision on the child run performs the write and finishes it)"
  - id: US-IO-HARNESS-0.5.0-T08
    summary: Backward compatibility — sub-agents are strictly opt-in and additive.
    why_required: >
      A 0.4.0 caller that constructs no Containment must see the exact 0.4.0 surface and behaviour;
      if spawning leaks into a plain run, the release breaks existing callers.
    status: done
    depends_on:
      - US-IO-HARNESS-0.5.0-T04
    acceptance_criteria:
      - A 0.4.0 single-agent run constructed without a `Containment` exposes no `spawn_agent` tool and reaches the same verified success it did in 0.4.0, proving sub-agents are opt-in and additive.
    files:
      - src/run.rs
      - src/lib.rs
    evidence:
      - "cargo test --test subagents: sub_agents_are_opt_in_a_plain_run_never_exposes_spawn"
  - id: US-IO-HARNESS-0.5.0-T09
    summary: Docs, example binary, and a live end-to-end run; package for 0.5.0.
    why_required: >
      The release is release-ready only when a caller can learn the surface and one live run proves
      compose-back and a containment refusal end to end against a real provider.
    status: done
    depends_on:
      - US-IO-HARNESS-0.5.0-T06
      - US-IO-HARNESS-0.5.0-T07
      - US-IO-HARNESS-0.5.0-T08
    acceptance_criteria:
      - "`cargo test` passes, including the containment merge units, spawn/compose-back integration, the agent-count/depth/budget refusal tests, the concurrency and overspend-race tests, the graph-trace test, and the unchanged 0.1.0–0.4.0 suite."
      - "`cargo clippy --all-targets` reports zero warnings."
      - "`cargo publish --dry-run` succeeds with complete crate metadata for 0.5.0."
      - "README and crate docs document `spawn_agent`, `Containment` and every cap, the containment merge versus 0.4.0 layer merge, and the tree-wide spend ceiling, with a runnable example."
      - An example binary drives one live run where a parent spawns children over a shared workspace under a `Containment`, showing compose-back and one containment refusal end to end.
    files:
      - README.md
      - examples/subagents.rs
      - Cargo.toml
    evidence:
      - "cargo test: 99 passing, 0 failing (58 unit + 9 subagents + 3 multi_file + 1 parity + 17 policy + 10 edit_file + 1 doctest), unchanged 0.1.0-0.4.0 suite green."
      - "cargo clippy --all-targets: 0 warnings."
      - "cargo publish --dry-run: packaged io-harness v0.5.0 (43 files), verify-compiled, upload aborted (dry run)."
      - "README + crate docs: v0.5 section on spawn_agent, Containment caps, contain vs merge, tree-wide ceiling; examples/subagents.rs runnable."
      - "LIVE RUN (cargo run --example subagents, OpenRouter openai/gpt-5.6-luna): outcome Success{steps:7}; parent spawned child runs 2 & 3 (a.txt=ALPHA, b.txt=BETA), composed summary.txt=DONE; agent cap refused the model's extra spawns (spawn REFUSED cap agents); budget draws traced. Evidence: evidence/0.5.0/live_run.txt"
