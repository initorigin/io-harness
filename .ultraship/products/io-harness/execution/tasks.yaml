  acceptance_criteria:
  - '**N1 — no new dependency.** `cargo tree` for the default feature set has the same number of crates
    as 0.45.0 (**402**). The home directory is read from `HOME` / `USERPROFILE` through `std::env::var_os`,
    and every cache path is `PathBuf::from` plus `join` — no `dirs`, no `home`, no `directories`.

    '
  - '**N2 — MSRV unmoved.** The crate builds on 1.95 with the toolchain gate CI already runs.

    '
  - '**N5 — the default''s cost in wall time is measured, not asserted to be small.** The same fixed command
    is timed under `FullAccess` and under `WorkspaceWrite` on the development host, and both figures go
    into the release record. Wrapping every command in `sandbox-exec` or `unshare` is not free, the default
    now pays it on every run, and an unmeasured regression here would be discovered by an embedder rather
    than by this release.

    '
  - '**N6 — 0.41.0''s batch, 0.42.0''s gate, 0.43.0''s fold, 0.44.0''s boundary and 0.45.0''s prompt are
    unaffected.** Their own suites pass unchanged; specifically the read batch still rendezvouses inside
    its bound, a `before_tool` hook is still consulted exactly once per call, and the composed prompt
    still varies only by the containment line this release changes. Asserted rather than assumed, because
    flipping a default that every run now takes is exactly where a regression to any of them would hide.

    '
  - '**O1 — the full suite passes on all three platforms**, which the standing CI matrix already runs.
    F1, F3, F6 and F8 are the platform-shaped criteria and each branches on `select().backend()`, so a
    macOS `sandbox-exec`, a Linux namespace, a Windows Job Object and the portable floor each assert their
    own truth. The Linux legs keep the `kernel.apparmor_restrict_unprivileged_userns=0` line in **both**
    `ci.yml` and `release.yml` (trap 87), without which the Linux arms assert the floor''s behaviour and
    report success.

    '
