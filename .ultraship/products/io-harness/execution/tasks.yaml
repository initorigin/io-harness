product: io-harness
version: 0.16.0
tasks:
- id: US-IO-HARNESS-0.16.0-T01
  summary: The public-surface enumerator and its snapshot test. One module that resolves every item
    re-exported from `lib.rs` to its kind, name, and defining file, a checked-in snapshot of that
    surface, and a test comparing the two. Negative controls prove the comparison catches a removal
    and a rename, not only an addition.
  why_required: The deprecation cycle is the half of this release that is a promise rather than a
    page, and a promise with no mechanism is what the release exists to stop shipping. This is the
    mechanism. It is also the foundation for T02, which needs the same enumeration to ask a
    different question of each item, so building it twice is the alternative to building it first.
  status: done
  depends_on: []
  acceptance_criteria:
  - >
    F8 — the public surface matches its checked-in snapshot. The negative control is the checker run
    against a snapshot with one item removed and one renamed, which reports both — a removal and a
    rename are the two things the deprecation cycle exists to catch, and a checker that catches only
    additions would pass every release that broke something.
  files:
  - tests/public_api.rs
  - tests/support/surface.rs
  - docs/public-api.txt
  evidence:
  - >
    tests/public_api.rs and docs/public-api.txt; 106 items enumerated, all resolved;
    public_surface_matches_snapshot passes; controls cover a removal, a rename, an addition and an
    unresolvable export (784258b)
- id: US-IO-HARNESS-0.16.0-T02
  summary: The worked-example checker. Over T01's enumeration, assert every public item's
    documentation carries a fenced code block, failing with the list of items that do not. Its
    negative control is a fixture item that is documented and exampleless, which the checker must
    report.
  why_required: '"Every public item carries a worked example" is the release''s most checkable claim
    and the one that decays fastest — the next added function is the one nobody notices. The checker
    is what converts it from a sentence into a build failure. It lands before the sweep so the sweep
    has a failing test to drive it, which is the ordering test-driven development asks for and also
    the only way to know the sweep is finished.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.16.0-T01
  acceptance_criteria:
  - >
    F5 — every public item re-exported from `lib.rs` carries a fenced example. A test enumerates the
    public surface and fails naming each item whose documentation has no fenced code block.
  - >
    F6 — the negative control for F5. The checker run over a fixture with a documented-but-
    exampleless item reports that item, so F5 measures presence rather than the checker returning an
    empty list on every input.
  files:
  - tests/public_api.rs
  - tests/support/surface.rs
  evidence:
  - >
    every_public_item_has_a_worked_example fails listing 105 of the 106 items, which is the work-
    list T11 and T12 are driven by; the control reports a documented-but-exampleless fixture item
    (784258b)
- id: US-IO-HARNESS-0.16.0-T03
  summary: The drift checkers. The MSRV stated in the README, the crate root, and `CONTRACT.md` is
    asserted equal to `Cargo.toml`'s `rust-version`; the documented feature list is asserted equal to
    the `[features]` keys in both directions; every relative link in the README and under `docs/`
    resolves to a file that exists. Each carries a negative-control fixture.
  why_required: The three facts most likely to be retyped and left stale are the MSRV, the feature
    list, and the links — and the link half becomes a live hazard the moment T05 splits one file into
    a dozen. Writing the checkers before the split means the split is verified as it happens rather
    than audited afterwards, when a dangling link reads like a deliberate omission.
  status: done
  depends_on: []
  acceptance_criteria:
  - >
    F4 — every relative link in the README and in every `docs/` page resolves to a file that exists.
    The negative control is a link to a deliberately absent path inside the checker's own fixture,
    which the checker reports.
  - >
    F9 — the documented MSRV equals `Cargo.toml`'s `rust-version`, asserted for the README, the
    crate root, and `CONTRACT.md`. The negative control is the same assertion against a fixture
    stating a different version, which fails.
  - >
    F10 — the documented feature list equals the `[features]` table's keys. A feature added to
    `Cargo.toml` and not documented fails the test, and so does a documented feature that does not
    exist. The negative control covers both directions, because a one-directional check passes
    forever after the first stale entry.
  files:
  - tests/docs_drift.rs
  - tests/support/docs.rs
  evidence:
  - >
    tests/docs_drift.rs, 10 tests; MSRV, feature-list in both directions, and relative-link
    checkers, each with a negative-control fixture (2d44290)
- id: US-IO-HARNESS-0.16.0-T04
  summary: The changelog break audit and its checker. Read 0.2.0 through 0.15.0 for changes that
    broke the public contract, mark each with an explicit token, write the migration note saying what
    to write instead, and add the test that fails on a marked-breaking entry with no note. Update
    `docs/CHANGELOG_STRUCTURE.md` so the next release inherits the format.
  why_required: A migration note is the only part of the pre-1.0 promise a consumer actually consumes
    — the deprecation cycle helps whoever upgrades next, but the notes help everyone upgrading across
    the fifteen releases already shipped. The audit is also the task most likely to discover a break
    the contract did not anticipate, so it runs early enough that the discovery is still cheap.
  status: done
  depends_on: []
  acceptance_criteria:
  - >
    F11 — every 0.x minor that broke the public contract carries a migration note in the changelog
    saying what to write instead. Asserted by a test over `CHANGELOG.md` that finds every entry
    marked as breaking and fails on any without a migration note. The negative control is a fixture
    entry marked breaking with no note, which the checker reports.
  files:
  - CHANGELOG.md
  - docs/CHANGELOG_STRUCTURE.md
  - tests/changelog.rs
  evidence:
  - >
    CHANGELOG.md: 49 breaking entries marked across 16 versions, each carrying a Migration note. The
    audit ran against the git tags rather than the prose, because three releases claim in prose to
    break nothing and do (0.5.0, 0.9.0, 0.14.0)
  - >
    tests/changelog.rs, 5 tests, fence-aware; the control reports a marked-and-unmigrated fixture
    entry (92ca065)
  - >
    docs/CHANGELOG_STRUCTURE.md states the marker and the migration-note requirement so the next
    release inherits the format
- id: US-IO-HARNESS-0.16.0-T05
  summary: The README as a landing page. What the crate is, badges, the MSRV, a quickstart inside the
    first screen, and a capability list describing what the harness does today, ending in links to
    the guide pages and the standing license and attribution blocks. No heading named after a
    release. The tests for the shape of the first 60 lines and for the absence of version-scoped
    headings land with it, the second with the 0.15.0 file as its negative control.
  why_required: This is the release's headline and the page a new reader lands on from crates.io. It
    is sequenced before the guide pages because the split is decided by what the landing page keeps —
    writing the guides first would mean guessing at the boundary and moving prose twice.
  status: done
  depends_on:
  - US-IO-HARNESS-0.16.0-T03
  acceptance_criteria:
  - >
    F1 — the README opens as a landing page. Within its first 60 lines it states what the crate is,
    shows a runnable quickstart code fence, and names the MSRV. Asserted by a test over the file, so
    a later edit that pushes the quickstart below a new section of prose fails the suite.
  - >
    F2 — no heading in the README or the crate root is named after a release. A test asserts no
    heading matches `\(v?\d+\.\d+`, and that the crate-root documentation contains no `v0.N adds`
    line. The negative control is the current file: the same test run against the 0.15.0 README and
    crate root fails, which is what makes F2 a measurement rather than a tautology.
  files:
  - README.md
  - tests/readme.rs
  evidence:
  - >
    README.md rewritten as a landing page: quickstart inside the first screen, MSRV stated, no
    version-named heading (503d676)
  - >
    tests/readme.rs, 8 tests; the controls use the real 0.15.0 headings, checked in as a fixture so
    they survive a shallow clone
- id: US-IO-HARNESS-0.16.0-T06
