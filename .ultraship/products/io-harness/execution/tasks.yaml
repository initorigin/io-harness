        `skills::discovery_over_a_32_skill_directory_is_under_50ms` wall-clock test is also a known
        intermittent on that runner — re-run before investigating, and check the failing test name
        first.
      - >
        Machine note acted on rather than rediscovered: `target/` plus the three fixture crates' own
        target directories took the disk to 10 GiB free, which is the condition that has twice
        surfaced as a linker error reading like a toolchain bug. Cleaned before the release steps —
        35.2 GiB freed, 38 GiB available.

  - id: US-IO-HARNESS-0.23.0-T09
    summary: >
      Measure store write throughput either side of the boundary and record the numbers in the
      changelog.
    why_required: >
      The engine moved seven point releases and the contract asks for the number rather than an
      assumption. Recording it is also how a later regression gets a baseline to fail against.
    status: done
    depends_on: [US-IO-HARNESS-0.23.0-T01]
    acceptance_criteria:
      - >
        NF4 — no measurable regression in store write throughput on the existing benchmark path. The
        engine moved seven point releases; the expectation is neutral-to-better, and a regression is a
        finding to record, not a reason to stop.
    files:
      - CHANGELOG.md
    evidence:
      - >
        NF4 — measured, not assumed, and the criterion's premise was wrong: there is no "existing
        benchmark path" in this repository. No `benches/`, no criterion, no `[[bench]]`. Both sides
        were built instead — `examples/store_throughput.rs` on the new line and
        `tests/fixtures/throughput-0.22.0/` pinned `io-harness =0.22.0` on the old one, running a
        workload whose executable code is byte-identical between the two.
      - >
        `Store::checkpoint_step` is the timed call: the hot durable path, two inserts inside a
        committed transaction, so every iteration pays the WAL commit the resume path depends on.
        `record` was rejected as the subject because it writes one row without committing a
        transaction of its own, which would flatter the engine. File-backed store, release profile,
        20,000 and 100,000 iterations, 33 samples per side.
      - >
        Result: **within noise, no regression.** Order-balanced batch medians differ by +0.06%, -0.99%
        and +1.65% — the sign flips across batches, which is what rules out a systematic effect —
        against a paired per-round spread of 11 to 21%. The measurement rules out a regression above
        roughly 5% and does not claim to resolve anything smaller.
      - >
        Recorded rather than buried: an earlier unbalanced batch that ran the new side first in every
        round produced an apparent 18% regression from scheduling alone. It is reported because
        discarding the one batch that looked bad without saying so would be dishonest, and because it
        is the reason the reported batches alternate order.
      - >
        No CI job for it. On shared runners the noise floor is worse than the one measured here, and a
        throughput gate against a 20% noise floor is a flake generator rather than a guard.

  - id: US-IO-HARNESS-0.23.0-T10
    summary: >
      One real end-to-end run against a live provider, on a store already upgraded, with the trace read
      back afterwards.
    why_required: >
      Every other check in this release is offline. A store that satisfies the unit tests and fails a
      real run would still be a broken release.
    status: done
    depends_on: [US-IO-HARNESS-0.23.0-T08]
    acceptance_criteria:
      - >
        OP2 — a real end-to-end run against a live provider completes on the upgraded store, so the
        release is not accepted on unit tests alone. One run, one workspace, one verified outcome, with
        the trace read back afterwards.
    files:
      - examples/durable_run.rs
      - examples/live_accounting.rs
    evidence:
      - >
        OP2 — `cargo run --example durable_run` against OpenRouter on the upgraded store: one run, one
        workspace, a verified outcome under the `rustc` gate, and the trace read back from a reopened
        file-backed `Store`. Output: `[process 1] stopped: Success { steps: 1 }`,
        `[process 2] resumed to: Success { steps: 1 }`, `[process 2] final status = Completed`.
      - >
        `cargo run --example live_accounting` was run as well, because it is the example that exercises
        the exact surface this release changed. Three live provider calls, and all seven `u64` `Usage`
        counters written and read back through the `fallible_uint` path against real vendor numbers:
        prompt 1345/1355/3086, completion 51/118/55, reasoning 29/45/29, cache-read 0/1250/1250,
        totals 1396/1473/3141, 6010 tokens across the run. The edit is recorded (`step 3 write_file
        NOTES.md (+1 -0)`) and spend prices correctly at two different rates from the same stored
        trace, confirming no cost is stored. This is the strongest single piece of live evidence in the
        release: the one code path the migration touched, exercised end to end against a real provider.
      - >
        The `.env` here carries real credentials for OpenRouter only, so the live evidence is
        OpenRouter-only. The Anthropic and OpenAI paths rest on their wire tests, unchanged by this
        release.
