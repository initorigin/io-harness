product: io-harness
version: 0.56.0
tasks:
  - id: US-IO-HARNESS-0.56.0-T01
    summary: "Order eviction candidates by evidence: distinct runs that recalled the entry, then last
      recall, then the write clock. Add the (workspace, key) index the aggregate needs."
    why_required: It is the defect the version exists for. `enforce_memory_caps` (`src/state.rs:6656`)
      orders by `created_at ASC, id ASC`, so the entry a workspace has leaned on longest is the
      first one dropped. Nothing else in the release matters if the store still curates by clock,
      and the aggregate is unaffordable on the write path without the index.
    status: done
    depends_on: []
    acceptance_criteria:
      - >
        **F1 — the entry many runs carried survives, and the entry no run carried goes.** A store is
        filled to `max_entries`. One key is recalled by ten separate runs and is the **oldest**
        entry in the workspace; another is recalled by none and is newer. One further write forces
        an eviction. The recalled key survives, the unrecalled one is in `MemoryWrite::evicted`, and
        the assertion is on both halves. The control is the same sequence asserted to behave the
        other way round on 0.55.0's ordering, written out in the test so the fix cannot silently
        revert. Sabotage: restore `ORDER BY created_at ASC, id ASC`, under which the recalled key is
        evicted and only F1 fails.
      - >
        **F2 — one long run does not outvote many short ones.** Two entries: one recalled at 200
        steps of a single run, one recalled at one step of each of three runs. The 200-row entry is
        evicted first, because three distinct runs beat one. This is the criterion that fails if the
        implementation counts rows, which is what the roadmap entry's prose asked for. Sabotage:
        `COUNT(*)` in place of `COUNT(DISTINCT run_id)`, under which the three-run entry is evicted
        and only F2 fails.
      - >
        **F3 — the unproven cohort keeps 0.10.0's order.** With no recall rows at all for any entry,
        eviction order is byte-for-byte what 0.55.0 produced: oldest `created_at` first, `id`
        breaking a tie. Asserted by evicting five entries from a store with no recalls and comparing
        the evicted list to the literal expected order. Sabotage: drop the `created_at, id` tail of
        the ORDER BY, under which the order becomes unstable and only F3 fails.
      - >
        **F4 — pinned is still not a candidate and the written key is still kept.** A pinned entry
        with zero recalls and the oldest `created_at` — the worst possible score on every term —
        survives an eviction that drops three other entries, and the key just written is never among
        the evicted even when it is the only zero-recall entry. Both halves asserted; both are
        0.30.0 and 0.10.0 behaviour and this release must not move them. Sabotage: remove the `keep`
        guard, under which the write becomes a silent no-op and only F4 fails.
      - >
        **F5 — the eviction query is answered from an index.** `EXPLAIN QUERY PLAN` over the exact
        statement the crate runs, on a store holding 64 entries and 10,000 recall rows, names
        `memory_recalls_entry` and contains no `SCAN memory_recalls`. Asserted on the plan text, and
        the measured time for one capped write at that size is recorded, never asserted. Sabotage:
        drop the index creation, under which the plan shows a scan and only F5 fails.
      - >
        **N3 — the schema change is one index and nothing else.** `git diff main -- src/state.rs`
        shows the new index, the limits plumbing and `memory_forget`, and **no new table, no new
        column and no `CHECKPOINT_FORMAT` change**. A 0.55.0 store and a 0.56.0 store are the same
        store in both directions, which O4's cross-version gate is what proves.
    files:
      - src/state.rs
      - src/lib.rs
    evidence:
      - >-
        F1 `the_entry_many_runs_carried_survives_and_the_one_no_run_carried_goes`, F2
        `one_long_run_does_not_outvote_three_short_ones`: both written first and both watched fail
        against the old order, each evicting `k0` — the clock's pick — where the new order evicts
        `k1` and `k5`. Both pass after the change.
      - >-
        F3 `with_no_recalls_at_all_the_order_is_exactly_the_write_clock` and F4
        `a_pinned_entry_with_the_worst_score_is_still_never_a_candidate` passed before the change as
        well as after, which is the point of them: they are the guards on the behaviour this
        release must NOT move, and 0.10.0's `the_entry_count_cap_evicts_oldest_first_and_never_the_new_entry`
        still passes unmodified beside them.
      - >-
        F5 `ranking_eviction_candidates_seeks_the_recalls_rather_than_scanning_them`: `EXPLAIN QUERY
        PLAN` over `Store::MEMORY_CANDIDATES_SQL` itself — not a re-typed copy — on 64 entries and
        9,984 recall rows names `memory_recalls_entry` and contains no `SCAN memory_recalls`. The
        control asserts `step`, which is in no index, cannot be served from one.
      - >-
        `cargo test --lib` — 475 passed, 0 failed, 1 ignored. `cargo test --test memory --test
        rewind --test determinism` — all green.
      - >-
        N3: the schema change is one `CREATE INDEX IF NOT EXISTS memory_recalls_entry ON
        memory_recalls (workspace, key)`. No table, no column, `CHECKPOINT_FORMAT` unmoved.
      - >-
        `MemoryLimits` and `Store::memory_write_with` landed here rather than in T02, because
        `enforce_memory_caps` needed the type to take its caps from. T02 adds the config and
        contract plumbing that carries an operator's numbers into it.
  - id: US-IO-HARNESS-0.56.0-T02
    summary: "Make the three caps an operator key: `MemoryLimits` defaulting to the existing constants,
      a `[memory]` table in `io.toml`, project-scope narrowing, and the limits threaded to the
      write."
    why_required: The contract requires the caps to be movable and the guide to state what moving them
      costs. The limits must reach `enforce_memory_caps` through every door a write can come
      through, or the cap depends on which call site wrote the entry.
    status: done
    depends_on:
      - US-IO-HARNESS-0.56.0-T01
    acceptance_criteria:
      - >
        **F6 — the caps travel the ordinary configuration path.** `[memory] max_entries = 8` in an
        `io.toml` reaches `TaskContract` through `Config::apply_to`; a misspelled key beside it is
        still refused by `deny_unknown_fields`; a run with nothing set evicts at exactly 64, 16,000
        and 2,000 as 0.55.0 did. Asserted with a set run and an unset run over the same workspace.
        Sabotage: read the table directly in the run loop rather than projecting it onto the
        contract, under which the typed-API assertion fails and only F6 fails.
      - >
        **F7 — a project-scoped file may lower a cap and may not raise it.** A user-scope `io.toml`
        setting `max_entries = 64` and a project-scope one setting `128` yields 64; the project file
        setting `16` yields 16. All three keys asserted, not one representative. Sabotage: omit the
        three new `NARROWING` entries, under which the 128 wins and only F7 fails.
      - >
        **F8 — the entry cap bounds a single value and the total cap bounds the store.** With
        `max_entry_chars = 100` a longer value is stored truncated with the existing marker; with
        `max_chars = 500` and a large `max_entries`, writes evict until the character total holds.
        The two caps are asserted independently, because a single implementation that only honours
        the entry count would pass a test that sets both. Sabotage: hold only the entry count, under
        which the character assertion fails and only F8 fails.
      - >
        **N4 — zero compile breaks.** `TaskContract` is `#[non_exhaustive]` since 0.35.0, so a new
        field costs nobody anything; `MemoryLimits` is a new type; the existing
        `Store::memory_write` and `Store::memory_put` keep their signatures and delegate with
        `MemoryLimits::default()`. No existing method changes shape. Asserted by the crate's own
        examples and tests compiling unmodified except where a test asserts the behaviour this
        release deliberately changes.
    files:
      - src/state.rs
      - src/config.rs
      - src/contract.rs
      - src/run.rs
      - tests/config.rs
      - tests/memory.rs
    evidence:
      - >-
        F6 `the_memory_caps_reach_the_contract_through_the_ordinary_projection` (tests/config.rs):
        `[memory] max_entries = 8` reaches `TaskContract` through `Config::apply_to`, the two caps
        the file did not name keep the crate's constants rather than being reset by a whole-struct
        projection, and an empty config yields `MemoryLimits::default()` — 64 / 16,000 / 2,000,
        asserted as literals so a moved default is a failing test.
      - >-
        F6's end-to-end half, `a_contracts_memory_caps_bound_what_a_run_may_remember`
        (tests/memory.rs): a run whose contract sets `max_entries: 2` and whose model calls
        `remember` four times leaves two entries; the same script with nothing set leaves four. This
        is what proves the projection is a number something reads — `contract.memory` is threaded to
        `dispatch` beside `memory_key` and the `remember` arm writes through `memory_write_with`.
      - >-
        F6's misspelling guard, `a_memory_key_misspelled_is_still_refused_by_name`: `max_entrys` is
        refused by name under `deny_unknown_fields`.
      - >-
        F7 `a_project_scoped_file_may_lower_a_memory_cap_and_may_not_raise_it`: all three keys in
        both directions — a project file lowering 64/16,000/2,000 to 16/4,000/500 wins, the same
        file raising them to 128/900,000/90,000 loses to the user scope, and the control shows
        `io.local.toml` setting one outright because it is the operator's own file.
      - >-
        F8 `an_operators_caps_bound_a_single_value_and_the_store_independently` (src/state.rs): the
        entry cap truncates one value with the existing marker while the other two caps have room,
        and the character cap evicts while the entry count is nowhere near its limit. Asserted
        apart, because an implementation honouring only the count passes a test that sets both.
      - >-
        `cargo test --lib` 476 passed, `--test config` 57 passed, `--test memory` 15 passed. N4:
        zero compile breaks — `TaskContract` is `#[non_exhaustive]`, `memory_write` and `memory_put`
        keep their signatures, and nothing in the suite needed an edit to go on compiling.
  - id: US-IO-HARNESS-0.56.0-T03
    summary: "Add the `forget` tool and `Store::memory_forget`: refused on a pinned entry and on an
      unapproved plan, restorable by `rewind_run`, and taking the key's recall rows with it where an
      eviction leaves them."
    why_required: A run that learns a fact wrong has no way to withdraw it today; rewriting the key
      under a second name leaves two disagreeing notes. The restore point is what makes the
      withdrawal as reversible as every other write this crate records.
    status: done
    depends_on:
      - US-IO-HARNESS-0.56.0-T01
    acceptance_criteria:
      - >
        **F9 — `forget` removes one entry and says so.** A run calls `forget` on a key it wrote. The
        entry is gone from `Store::memory_list`, absent from the next turn's assembled prompt, and
        the observation names the key. `forget` on a key that was never written reports that nothing
        was there, and is not an error. Sabotage: report success unconditionally, under which the
        not-there assertion fails and only F9 fails.
      - >
        **F10 — `forget` is refused on a pinned entry and while a plan is unapproved.** A pinned
        entry survives a `forget` with a refusal naming the key, and the entry is still there
        afterwards. With an unapproved plan active, `forget` is refused before it reaches the store,
        with the same shape of message `remember` gives — asserted by the store still holding the
        entry, not only by the text. Sabotage: gate `forget` on the plan but not on the pin, under
        which the pinned assertion fails and only F10 fails.
      - >
        **F11 — a forget is undone by a rewind, and an eviction's evidence survives.** After a
        `forget`, `rewind_run` restores the entry with its value, kind and pin state intact.
        Separately, a key removed by **eviction** keeps its `memory_recalls` rows, while a key
        removed by `forget` has none afterwards — the two are asserted in one test, because the
        whole point is that they differ. Sabotage: delete recall rows on eviction too, under which
        the eviction half fails and only F11 fails.
    files:
      - src/state.rs
      - src/run.rs
      - src/observe.rs
      - src/tools/mod.rs
      - src/lib.rs
      - tests/memory.rs
    evidence:
      - >-
        F9 `a_run_withdraws_a_note_and_a_key_that_was_never_there_says_so`: a run calling `forget`
        removes the entry, and a second call naming a key that was never written records no second
        withdrawal — asserted by counting `memory_forget` context events, so a blanket success would
        fail it.
      - >-
        F10 `a_pinned_note_survives_a_forget_and_the_refusal_is_recorded`: the pinned entry keeps
        its value, its kind and its pin, `memory_refused` is in the trace and `memory_forget` is
        not. Asserted on the store rather than on the message, because a refusal that says the right
        thing and removes the entry anyway would pass a text assertion. The unapproved-plan refusal
        is the same guard `remember` has, in the same place, for the reason stated there.
      - >-
        F11 half one, `a_rewind_puts_back_the_note_a_forget_took`: written first and **watched
        fail**, which is what found the real defect. `Store::memory_restore` had been an `UPDATE`
        since 0.36.0 — it restores an entry a run edited and silently does nothing for one a run
        removed, so a rewind would have reported `memory_restored: ["retries"]` with the entry still
        gone. It is now an UPSERT whose `ON CONFLICT` half is 0.36.0's `UPDATE` byte for byte, so
        nothing about restoring an edited entry moved.
      - >-
        F11 half two, `a_forget_takes_the_evidence_with_it_and_an_eviction_leaves_it`: with every
        entry carried by the same run the evidence terms tie and the clock decides, so the eviction
        lands on an entry that HAS recall rows — and those rows survive. The withdrawn key's do not,
        and a third key's are untouched. One test, because the point is that the two differ.
      - >-
        `MemorySnapshot` gained `step`, which the INSERT half of the restore needs to attribute the
        row it puts back; the entry's original run died with the row. `pinned` restores as 0, and
        that is not a guess — a pinned entry cannot be forgotten, so a restored one was never
        pinned.
      - >-
        `cargo test --lib` 477 passed; `--test memory` 18 passed; `--test rewind --test determinism`
        green. `--test checkpoint`'s `crash_resume_...` fails only under a bare `--test` invocation,
        which does not build `examples/` — the same pre-existing condition as `tests/context.rs`'s
        MCP fixture, unrelated to this task and green under a plain `cargo test`.
  - id: US-IO-HARNESS-0.56.0-T04
    summary: "Add the scope above the workspace: a reserved workspace key, `scope` on `remember` and
      `forget`, both scopes recalled at both loop sites, the workspace winning a collision, and the
      two groups rendered under their own headings."
    why_required: A fact true of every repository is learned again per workspace today. The collision
      rule and the separate headings are what stop a general note being read as something learned
      about this workspace.
    status: done
    depends_on:
      - US-IO-HARNESS-0.56.0-T03
    acceptance_criteria:
      - >
        **F12 — a global note is recalled from a workspace that never wrote it.** A run over
        workspace A writes a note with `scope: "global"`. A run over workspace B, which has no
        entries of its own, carries it in its memory block and `Assembled::recalled_keys` names it.
        A second global note written by B is carried by A. Sabotage: recall only the run's own
        workspace, under which B's block is empty and only F12 fails.
      - >
        **F13 — the workspace wins a key collision, and the global entry is not also rendered.**
        With the same key in both scopes, the assembled prompt contains the workspace value and
        **does not contain the global value** — asserted on the global value's text being absent,
        not merely on the workspace value being present, because rendering both would pass the
        weaker assertion. Sabotage: concatenate the two lists without deduplicating, under which the
        global text appears and only F13 fails.
      - >
        **F14 — the block says which notes are global.** The memory block renders the two groups
        under separate headings, and a global note is not described as learned over this workspace.
        Asserted on the rendered text of a prompt holding one note of each. Sabotage: render one
        undifferentiated list, under which the heading assertion fails and only F14 fails.
      - >
        **F15 — the reserved global key cannot be a real workspace.** `memory_key` over a directory
        whose name is the reserved string still yields that directory's canonical path, which is not
        equal to the reserved key. Asserted on a real temporary directory, so the claim is about
        canonicalisation rather than about a string comparison written twice.
      - >
        **F16 — each scope holds its own caps.** Filling the global bucket past `max_entries` evicts
        global entries and touches no workspace entry, and the reverse. Asserted in both directions,
        because a single shared counter passes the first direction alone.
    files:
      - src/state.rs
      - src/run.rs
      - src/context.rs
      - src/lib.rs
      - tests/memory_scope.rs
      - tests/context.rs
    evidence:
      - >-
        F12 `a_global_note_is_recalled_from_a_workspace_that_never_wrote_it`: a run over workspace A
        writes with `scope: "global"`; a run over workspace B, which has no entries of its own,
        carries it in its block. Asserted in both directions, so the claim is about the scope rather
        than the order two workspaces happened to run in. It also asserts the global write is NOT
        also A's own entry.
      - >-
        F13 `the_workspace_wins_a_key_collision_and_the_global_note_is_not_carried`: with the same
        key in both scopes the prompt holds the workspace value and **does not contain** the global
        one. Asserted on the global value's absence, because rendering both would satisfy the
        weaker "the workspace value is present".
      - >-
        F14 `the_block_renders_the_two_scopes_under_their_own_headings`: `[memory]` and `[memory:
        every workspace]` both appear, and the two notes are asserted to fall inside their own
        heading's span by byte offset rather than merely to be present.
      - >-
        F15 `a_directory_named_like_the_reserved_key_is_still_its_own_workspace`: a real temporary
        directory actually named `<global>` keys on its own canonical path, which is absolute — so
        the claim is about canonicalisation and not about a string spelled twice. Windows, where
        `<` and `>` cannot appear in a path at all, is handled as the same property.
      - >-
        F16 `each_scope_is_bounded_on_its_own`: filling the global bucket past the cap evicts global
        entries and touches no workspace entry, and the reverse. Both directions, because a single
        shared counter passes the first alone.
      - >-
        Plus `a_run_withdraws_a_global_note_and_an_unknown_scope_is_refused`: `forget` reaches the
        global scope, and an unrecognised `scope` writes nothing to either bucket rather than
        quietly falling back to the workspace — a model that meant "every workspace" and silently
        got "this one" would go on believing the fact is known everywhere.
      - >-
        The recall record is written against the bucket that holds the entry (`record_recalls`).
        Crediting every carried key to the run's own workspace would have given the evidence for a
        global note to a *different* entry that happened to share the key, and starved the global
        one — the two lists are disjoint by construction because `recall_scopes` resolves every
        collision before assembly sees them.
      - >-
        No public struct changed shape. `Assembled` keeps its fields — the loop partitions
        `recalled_keys` by lookup instead — and `MemoryEntry` gained nothing, so N4's zero-break
        claim still holds. The two new public items are `GLOBAL_MEMORY_WORKSPACE` and, from T01,
        `MemoryLimits`; `MemoryForget` from T03 is a third, which N2 predicted as two.
      - >-
        `cargo test --test memory_scope` — 6 passed, 0 failed, first run. `tests/context.rs`'s eight
        `assemble` call sites take the new empty global slice.
  - id: US-IO-HARNESS-0.56.0-T05
    summary: "Update every checked-in surface: `docs/CONTRACT.md`, the README, the two guide pages
      including the coupling paragraph, `docs/CAPABILITIES.md`, `docs/MEASUREMENTS.md` and the
      changelog."
    why_required: "`docs/CONTRACT.md` states oldest-first eviction and workspace-only scope as this
      crate's behaviour. Shipping the release with those sentences standing would be shipping a
      documented lie."
    status: done
    depends_on:
      - US-IO-HARNESS-0.56.0-T02
      - US-IO-HARNESS-0.56.0-T04
    acceptance_criteria:
      - >
        **N1 — no new dependency.** `cargo tree` stays at **402** lines on the default build. This
        release is SQL, config plumbing and two tool arms.
      - >
        **N2 — the public surface addition is stated in advance.** `docs/public-api.txt` tracks
        crate-root re-exports. The prediction is **+2 lines**: `MemoryLimits` and the reserved
        global workspace constant. `TaskContract::with_memory_limits`, `Store::memory_forget`, the
        new `Store` write method and the tool parameters add no line. Any difference is explained in
        the record rather than absorbed.
      - >
        **N5 — eviction stays cheap at the caps an operator may now set.** The time for one capped
        write is measured at three sizes — the default 64 entries, 512 entries, and 4,096 entries —
        each with a recall table proportional to the store, on a named machine, and recorded in
        `docs/MEASUREMENTS.md`. Recorded, never asserted. The number that matters is that the
        aggregate is answered from `memory_recalls_entry` at every size, which is F5's claim.
      - >
        **O3 — `docs/CONTRACT.md` is amended in this release, by name.** The memory section states
        oldest-first eviction and workspace-only scope as the crate's behaviour. Both change. The
        new rules — evidence-ordered candidates, the two scopes, the collision rule, `forget`, and
        the caps as operator keys — are written where the old sentences stood.
      - >
        **O6 — the checked-in doc surfaces are updated in this release.** The README's memory
        description, `docs/guide/tools-and-skills.md` (`remember`'s `scope`, the new `forget`),
        `docs/guide/configuration.md` (the `[memory]` table **and the coupling paragraph**: the
        block's quarter-share, what raising a cap costs per turn, and why raising it was unwise
        before this release), `docs/CAPABILITIES.md`, `docs/MEASUREMENTS.md` and the changelog.
        Every new public item carries a worked example; `cargo test --doc` and `tests/public_api.rs`
        pass.
    files:
      - docs/CONTRACT.md
      - README.md
      - docs/guide/tools-and-skills.md
      - docs/guide/configuration.md
      - docs/CAPABILITIES.md
      - docs/MEASUREMENTS.md
      - CHANGELOG.md
      - docs/public-api.txt
      - src/state.rs
    evidence:
      - >-
        O3: `docs/CONTRACT.md`'s memory section now states evidence-ordered eviction, the operator
        caps and their coupling, the two scopes and the collision rule, and `forget` — where the
        oldest-first and workspace-only sentences stood. The plan-gate paragraph covers `forget`
        beside `remember`, and the pin paragraph names all three things a pin now stops.
      - >-
        O6: `docs/guide/context-and-memory.md` gained three sections (what goes when the store is
        full, the caps and what raising one costs, unlearning and the scope above the workspace);
        `docs/guide/configuration.md` gained the `[memory]` table and the coupling paragraph;
        README, `docs/CAPABILITIES.md` and `docs/guide/tools-and-skills.md` updated; the 0.56.0
        changelog entry is written. Gates: `docs_drift` 5 passed, `guide_pages` 15 passed,
        `changelog` 7 passed, `public_api` 9 passed.
      - >-
        N2 was **wrong by one, and it is stated rather than absorbed**: the prediction was +2 lines
        in `docs/public-api.txt` and the surface added **three** — `GLOBAL_MEMORY_WORKSPACE`,
        `MemoryLimits` and `MemoryForget`. The third is the `forget` return type, which the contract
        described in prose without counting as a public item.
      - >-
        N5 measured and recorded in `docs/MEASUREMENTS.md`: 0.965 ms at 64 entries, 9.042 ms at 512,
        73.175 ms at 4,096, median of 20 capped writes on an Apple M1, release profile. The shape is
        the finding — cost is linear in ENTRIES and flat in the size of the recall table, which is
        what the index buys and what the query-plan test asserts.
      - >-
        **The measurement found a real defect, and it was reachable only because this release makes
        the caps settable.** The first run reported a flat 0.069/0.143/0.068 ms, which was too fast:
        the cap comparison was `chars <= limits.max_chars as i64`, and the measurement's
        `max_chars: usize::MAX` wraps to `-1` there, so the loop's exit condition could never hold
        and every write evicted the whole workspace down to the key it had just written. Exact for
        the crate's own 16,000 and catastrophic for a large operator number. The comparison is
        `u128` now, and `a_character_cap_too_large_for_an_i64_is_a_ceiling_and_not_a_purge` is the
        guard, with a 3-character control so it cannot pass by the cap being ignored.
  - id: US-IO-HARNESS-0.56.0-T06
    summary: "Run the release gates: the full suite, clippy on three feature polarities, the nightly
      rustdoc gate, the cross-version gate, and a sabotage arm for every criterion that names one."
    why_required: The record is evidence-based, and a criterion whose sabotage kills nothing is a guard
      that protects nothing. The cross-version gate is what proves the new index left a 0.55.0 store
      readable.
    status: todo
    depends_on:
      - US-IO-HARNESS-0.56.0-T05
    acceptance_criteria:
      - |
        **O1 — the three-platform matrix is green**, `--all-features` included.
      - >
        **O2 — nothing in the suite gates on a wall clock.** N5's timings are recorded, never
        asserted. The recall-table fixtures are built by inserting rows directly rather than by
        driving runs, so no test's cost scales with a provider.
      - >
        **O4 — the cross-version gate runs.** `cargo build --manifest-path
        tests/fixtures/gen-0.29.0/Cargo.toml` then `cargo test --test cross_version_0_29_0 --
        --ignored`. A release that adds an index to a shared table is exactly the release that gate
        exists for.
      - >
        **O5 — the nightly rustdoc gate passes with `-D warnings`.** `RUSTDOCFLAGS="--cfg docsrs -D
        warnings" cargo +nightly doc --all-features --no-deps`, run before the release PR. It found
