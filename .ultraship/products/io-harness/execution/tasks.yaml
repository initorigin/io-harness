product: io-harness
version: 0.38.0
tasks:
- id: US-IO-HARNESS-0.38.0-T01
  summary: >
    The Anthropic half: `system` becomes a one-element array of a text block carrying
    `cache_control: {"type": "ephemeral"}`, with the body test that pins exactly one breakpoint in
    the whole body and none on the tools array.
  why_required: >
    This is the release. Anthropic orders a request's cacheable prefix tools-then-system, so this
    single marker is what makes the tool schemas and the instructions stop being re-billed on every
    call. Without it there is nothing to measure in F4 and nothing to price in F5.
  status: done
  depends_on: []
  acceptance_criteria:
  - >
    **F1 — the Anthropic body carries exactly one breakpoint, in the right place.** A body test on a
    request with a system string, a user string and two tools. Assertions: `body["system"]` is an
    array of one object whose `type` is `text`, whose `text` equals `request.system` unchanged, and
    which carries `cache_control.type == "ephemeral"`; the `tools` array carries **no**
    `cache_control` on any entry; the count of `cache_control` occurrences anywhere in the body is
    exactly **one**. The last assertion is the one that matters — it fails both the implementation
    that marks nothing and the one that marks everything it can reach.
  - >
    **N1 — no new dependency.** `cargo tree` on macOS and Linux still reads **402** lines. The marker
    is two `serde_json` objects built where the body is already built.
  files:
  - src/provider/anthropic.rs
  evidence:
  - >
    F1, written before the implementation and watched fail: `cargo test --lib
    provider::anthropic::tests::body_` on the unmodified body panicked at
    `src/provider/anthropic.rs:737` with "a system block array" — `body["system"]` was still the bare
    string 0.37.0 sent, so there was nothing for a breakpoint to hang off. That failure is the
    sabotage for this criterion: the marker removed is exactly the tree the test ran against.
  - >
    F1 after the implementation: `cargo test --lib provider::anthropic` — **19 passed, 0 failed**.
    `body_marks_one_cache_breakpoint_at_the_end_of_system` asserts the system array has length 1, the
    block's `type` is `text`, its `text` is the request's own string unaltered, its
    `cache_control.type` is `ephemeral`, that **no** entry of `tools` carries a `cache_control`, and
    that the whole serialised body contains the string `cache_control` exactly **once**. The last
    assertion is what fails a marker sprayed across every block the wire would accept.
  - >
    F1, the neighbours that had to keep passing and did:
    `no_declaration_sends_the_0_21_0_body`, `no_effort_leaves_the_anthropic_body_exactly_as_it_was`,
    `the_effort_tier_becomes_a_thinking_budget_below_max_tokens` and the two web-tool body tests are
    all green, so the 0.22.0 and 0.31.0 body keys are untouched by this change.
    `body_maps_tools_to_input_schema_and_system_top_level` was updated in the same commit to read the
    block array — an in-crate test edit, not a public change.
  - >
    N1, no new dependency: `cargo tree` reads **402** lines on this tree, unchanged, and
    `cargo tree --all-features` reads 829. `Cargo.toml` was not touched by this task. The marker is
    two `serde_json` objects built inside the `json!` literal that already builds the body.

- id: US-IO-HARNESS-0.38.0-T02
  summary: >
    The shared-wire half: a flavour-gated marker in `openai_wire::body` that rewrites the system
    message's content into a one-part array for `WebFlavor::OpenRouter` and leaves
    `WebFlavor::OpenAi` byte-identical, in the shape `web_key` and `effort_key` already use.
  why_required: >
    OpenRouter is the only provider in this checkout with working credentials, so it is the route
    the live evidence takes — and `WebFlavor::OpenAi` serves both OpenAI and the 21 endpoints
    reached through `Compatible`, where an unknown body key is a 400 this crate would have caused.
    The gate and its negative control are the same piece of work.
  status: done
  depends_on:
  - US-IO-HARNESS-0.38.0-T01
  acceptance_criteria:
  - >
    **F2 — the OpenAI and `Compatible` bodies did not move.** The body built by
    `openai_wire::body(model, &request, WebFlavor::OpenAi)` is asserted equal, as a whole JSON value,
    to the body 0.37.0 built for the same request — the top-level key set is already pinned this way
    at `src/provider/openai_wire.rs:740`, and this extends it to the message contents. `"content"`
    for the system message is asserted to still be a bare string, not a parts array. **This is the
    negative control for F3**: an implementation that marks the shared body unconditionally passes
    F3 and fails here, and it is the failure that would put an unknown key in front of 21 endpoints.
  - >
    **F3 — the OpenRouter body carries the marker in that wire's shape.** Same request,
    `WebFlavor::OpenRouter`. Assertions: the system message's `content` is an array of one part whose
    `type` is `text`, whose `text` equals `request.system` unchanged, carrying
    `cache_control.type == "ephemeral"`; the user message's content is untouched; and — the
    discriminating pair with F2 — the two flavours' bodies differ **only** in that one value, asserted
    by comparing them with the system message removed from both.
  - >
    **N5 — the request is unchanged for everything that does not ask.** A body built for OpenAI, for
    `Compatible`, or by any `Provider` implemented outside this crate is what 0.37.0 built, which F2
    asserts for the two in-tree cases and which holds for the out-of-tree case because no trait
    method and no request field changed.
  files:
  - src/provider/openai_wire.rs
  evidence:
  - >
    F3, written before the implementation and watched fail: `cargo test --lib provider::openai_wire`
    on the unmarked body failed `cache_wire::the_openrouter_body_carries_one_breakpoint_on_its_system_part`
    at `src/provider/openai_wire.rs:669` ("a parts array" — the content was still a bare string) and
    `web_wire::no_effort_leaves_both_bodies_exactly_as_they_were` at `:797`. F2's test passed at that
    point, correctly: nothing was being sent to either flavour yet.
  - >
    F2 and F3 after the implementation: `cargo test --lib provider::openai_wire` — **18 passed, 0
    failed**. `the_openai_body_carries_no_breakpoint_and_keeps_its_bare_system_string` asserts the
    system content is still a bare string and that `cache_control` appears **zero** times anywhere in
    an OpenAI-flavoured body. `the_openrouter_body_carries_one_breakpoint_on_its_system_part` asserts
    a one-element parts array whose `text` is the request's own string, `cache_control.type` is
    `ephemeral`, the **user** turn is untouched, and the marker appears exactly once.
  - >
    F3's discriminating comparison, which is what makes the pair mean something: both bodies are
    rebuilt with the system message stripped and asserted **equal**. An implementation that reshapes
    the shared body for one flavour and quietly changes anything else fails there rather than
    passing on the one key it was asked about.
  - >
    F2's sabotage, executed rather than described. `cached_system` was changed to
    `WebFlavor::OpenAi | WebFlavor::OpenRouter => Some(...)` — the marker sprayed at both wires, which
    is the failure that would put an unknown body key in front of the 21 endpoints reached through
    `Compatible`. Result: **2 failed, 16 passed**, and the two that failed were exactly
    `cache_wire::the_openai_body_carries_no_breakpoint_and_keeps_its_bare_system_string` and
    `web_wire::no_effort_leaves_both_bodies_exactly_as_they_were`. The file was restored from a copy
    taken before the sabotage and re-run: 18 passed, 0 failed.
  - >
    N5, the shape rather than a promise: the marker is applied by `cached_system(flavor, &request.system)`,
    a `match` on the flavour that returns `None` for `WebFlavor::OpenAi`. It is the third
    per-vendor difference resolved inside the shared builder, after `web_key` (0.22.0) and
    `effort_key` (0.31.0), and it is absent from the body entirely rather than sent as a default —
    which is what keeps every non-asking request byte-identical. No `Provider` trait method and no
    field on `CompletionRequest` changed, so an out-of-tree provider sends what it sent in 0.37.0.

- id: US-IO-HARNESS-0.38.0-T03
  summary: >
    The live arm: an `examples/` fixture behind `required-features` that makes two consecutive
    OpenRouter completions with an over-minimum system block, once with the marker and once with it
    suppressed, records the model that actually answered, and prices the stored rows through the
    existing table.
  why_required: >
    A body test proves what this crate sent, never what a vendor did with it. F4 is the only
    criterion that can distinguish a marker that was honoured from one that was accepted and
    ignored, and F5 is the first time the cache branch of `src/pricing.rs` executes against a
    non-zero count — which is the product-level claim this release exists to make true.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.38.0-T02
  acceptance_criteria:
  - >
    **F4 — the vendor honours it, measured live, with the control that makes the measurement mean
    something.** Through OpenRouter, against a model whose vendor caches, with a system block
    deliberately over the vendor's minimum cacheable length: two consecutive completions with an
    identical system block. Assertions on the second: `cache_read_tokens` greater than zero and
    covering the bulk of the block. **The control is the identical pair with the marker suppressed**,
    which must report zero on both calls — without it, a run against an OpenAI-family model that
    caches automatically would "prove" a marker that was never read. The model that actually answered
    is recorded from `CompletionResponse::model` rather than assumed from the slug requested, and
    both runs' raw counts go into the record as measured numbers. This is a live check, so it is an
    `examples/` fixture with `required-features`, in the shape `documents_live` and `media_git_live`
    already use — never a test the three-OS matrix runs, and never a wall-clock assertion.
  - >
    **F5 — the cached tokens are priced as cached.** F4's stored `provider_calls` rows are read back
    through `Store::provider_calls` and priced through `src/pricing.rs` against a table entry with
    distinct input and `cache_read` rates. Assertion: the derived cost of the second call is strictly
    below the first, and equals the figure computed by hand from the stored counts. The sabotage sets
    the table's `cache_read` equal to its `input`, under which the two costs match and this named test
    fails — which proves the assertion reads the cache rate rather than merely reading a smaller
    number.
  files:
  - examples/cache_live.rs
  - Cargo.toml
  - tests/pricing_cache.rs
  evidence: []

- id: US-IO-HARNESS-0.38.0-T04
  summary: >
    The did-not-move gates: assert `docs/public-api.txt` byte-identical, `ADDED_SINCE_0_22_0`
    unchanged, `CHECKPOINT_FORMAT` unmoved, cross-version green both directions, and no `**BREAKING`
    changelog entry for this version.
  why_required: >
    "Zero breaks and zero schema change" is the whole reason this release costs a consumer nothing,
    and it is a claim about absence — which is worth nothing unless it is asserted rather than
    described. Every other task can pass while this one fails.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.38.0-T01
  acceptance_criteria:
  - >
    **F6 — nothing else moved, asserted rather than assumed.** `docs/public-api.txt` is byte-identical
    to 0.37.0's and `tests/public_api.rs` passes; `ADDED_SINCE_0_22_0` is unchanged and
    `tests/cross_version.rs` passes in both directions against the pinned 0.29.0 generator;
    `CHECKPOINT_FORMAT` is asserted unmoved; `tests/changelog.rs` finds no `**BREAKING` entry for
    this version.
  - >
    **N2 — zero breaks, and the assertion is the byte-identical `docs/public-api.txt`.** No public
    type gains a field, no signature moves, no item is removed. `CompletionRequest` and
    `CompletionResponse` are untouched, which matters more than it looks: verified at
    `src/provider/mod.rs:450` and `:675`, **neither carries `#[non_exhaustive]`** — they are plain
    `Default`-deriving structs, so an exhaustive struct literal or exhaustive destructuring outside
    this crate compiles today and would break the moment either gained a field, with an ordinary
    missing-field error rather than the `E0639` a non-exhaustive type would raise. Leaving both alone
    is therefore what makes this release cost a consumer nothing, and any implementation that reaches
    for a field on the request has turned a zero-break release into a breaking one.
  files:
  - tests/cross_version.rs
  evidence: []

- id: US-IO-HARNESS-0.38.0-T05
  summary: >
    Documentation and the version bump: the caching section in `docs/guide/providers.md` with the
    break-even arithmetic and the per-vendor table, the bound in `docs/CONTRACT.md`, the changelog
    entry with no migration note, `README.md` where it describes what a request carries, and
    `Cargo.toml` to 0.38.0.
  why_required: >
    Every limit this release accepts — the silent minimum length, the vendor's own expiry clock, the
    one-call write premium, and the counter OpenRouter does not report — is invisible in the API and
    discoverable only in an invoice. A release that changes what an operator is billed and does not
    say so in `docs/CONTRACT.md` has hidden its own cost.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.38.0-T03
  acceptance_criteria:
  - >
    **N3 — the honest limits are where a reader finds them.** `docs/CONTRACT.md` states: a prefix
    below the vendor's minimum cacheable length is silently not cached and the marker is inert; a
    cache entry expires on the vendor's clock and a miss is reported only as the absence of
    `cache_read_tokens`; a prefix used exactly once is billed at the write premium rather than the
    input rate, with the break-even stated from the crate's own price table (1.25 + 0.1 against 2.0,
    so from the second use); OpenAI and `Compatible` send no marker and rely on whatever the endpoint
    does by itself; and this crate declares a cache, it does not operate one.
  - >
    **N4 — a counter this crate cannot see is stated, not inferred.** `openai_wire` sets
    `cache_write_tokens` to zero by construction (`src/provider/openai_wire.rs:310`) because that
    wire reports no write counter. If F4's live evidence shows OpenRouter charging a write premium
    the crate records as zero, the resulting under-report of a cached run's cost is written into
    `known_limitations` with the measured figures and into `docs/CONTRACT.md` — it is not closed by
    estimating the write from the prompt length.
  files:
  - docs/guide/providers.md
  - docs/CONTRACT.md
  - CHANGELOG.md
  - README.md
  - Cargo.toml
  evidence: []

- id: US-IO-HARNESS-0.38.0-T06
  summary: >
    The release gates: the three-OS matrix green on the released commit, the nightly docs.rs command
    run by hand before the release PR, and `cargo package --locked` on a clean tree after a
    `cargo clean`.
  why_required: >
    These are the gates that have caught a defect in four of the last five releases, and they are
    the last thing that may touch the tree before the record is sealed. A release that runs them
    before its final edit has proven nothing about what it shipped.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.38.0-T05
  acceptance_criteria:
  - >
    **O1 — the three-OS matrix is green** on the commit being released, including the MSRV 1.95 job,
    with no test skipped silently on Windows and no live fixture on the matrix path. Any
    source-reading test normalises line endings, and no path is joined from a slash-bearing literal.
  - >
    **O2 — docs.rs builds**, proven by running the nightly job's exact command
    (`RUSTDOCFLAGS="--cfg docsrs -D warnings" cargo +nightly doc --all-features --no-deps`) before
    the release PR is opened, never inferred from a stable `cargo doc`. It has caught something in
    four of the last five releases.
  - >
    **O3 — `cargo package --locked` succeeds** on a clean tree and the packaged crate compiles, run
    after a `cargo clean`. Every local build and test runs with `CARGO_PROFILE_DEV_DEBUG=0
    CARGO_PROFILE_TEST_DEBUG=0`, with `df -h .` before and between build steps, and
    `cargo build --all-features --examples` before any `--lib --tests` run or sabotage.
  files:
  - .ultraship/products/io-harness/execution/tasks.yaml
  evidence: []
