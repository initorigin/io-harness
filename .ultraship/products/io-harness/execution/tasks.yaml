product: io-harness
version: 0.20.0
tasks:
  - id: US-IO-HARNESS-0.20.0-T01
    summary: >
      The `session` module's spine: the `sessions` and `session_turns` tables, `Session::open` /
      `Session::reopen` / `id` / `head` / `history`, a turn driven as a run through the existing
      workspace loop, and the crate-internal seam that assembles the path root->head into the turn's
      request through the existing context assembler.
    why_required: >
      Every other task acts on a session that exists and a turn that runs. Without the tables and the
      turn-as-a-run seam there is no conversation to branch, stream into, or steer, and the release's
      whole claim — that a session is durable for the same reason a run is — rests here.
    status: done
    depends_on: []
    acceptance_criteria:
      - >
        F1 — a session outlives its process. Two turns are taken against a file-backed store, the
        `Session` is dropped and the store closed, `Session::reopen` picks it up by id in a fresh
        `Store`, and the third turn's request carries what the first two established. The negative
        control is a second session opened over the same root, whose first turn carries none of it.
      - >
        F2 — a turn is a run, with everything a run has. Each turn produces its own `runs` row reachable
        from `session_turns`, its own steps, and its own `RunSummary`; a policy denial inside a turn is
        recorded in `policy_events` attributed to the rule and layer exactly as in a one-shot run; and
        `Store::run_status` reports the turn's run.
      - >
        F4 — a turn may be bounded or unbounded. `Session::turn` runs with `Verification::None` and
        stops on an assistant turn that calls no tool, reported as `RunOutcome::Finished`;
        `Session::turn_bounded` with a `Verification::Command` succeeds only when that command passes
        and reports `RunOutcome::Success`. A step cap set on one bounded turn does not bound the next
        turn.
      - >
        NF1 — no store format bump and no new dependency. `CHECKPOINT_FORMAT` stays 7, the two new
        tables are `CREATE TABLE IF NOT EXISTS` and nothing existing is altered, a 0.19.0 database
        opens, resumes and is queried against 0.20.0 unchanged, and the default `cargo tree` line count
        is still the 407 lines inherited from `develop`.
    files:
      - src/session.rs
      - src/state.rs
      - src/run.rs
      - src/context.rs
      - src/lib.rs
      - tests/session.rs
    evidence:
      - >
        tests/session.rs F1/F2/F4 and the store unit tests: a session reopened in a second `Store`
        over the same file carries its first two turns into the third, with a second session over
        the same root as the negative control; a turn's run row, summary, refusal attribution and
        `run_status` are a run's; an unbounded turn ends `Finished` and a bounded one `Success`.
      - >
        src/state.rs unit test `a_pre_session_database_gains_the_session_tables_and_keeps_its_rows`
        — a database with the two tables dropped opens, keeps its runs, and gains them;
        CHECKPOINT_FORMAT still 7.
  - id: US-IO-HARNESS-0.20.0-T02
    summary: >
      Branching: any turn id may parent the next turn, `Session::branch_from` moves the head, and the
      tree stays append-only so an abandoned branch is still readable.
    why_required: >
      Without it a session is a list, and the outcome promises a tree — coming back and taking a
      different path from an earlier turn rather than starting over is half of what makes a
      conversation durable rather than merely persisted.
    status: done
    depends_on:
      - US-IO-HARNESS-0.20.0-T01
    acceptance_criteria:
      - >
        F3 — the tree branches and nothing is lost. A branch taken from turn 1 produces a turn whose
        request carries turn 1 and not turn 2, turn 2 remains readable and unmodified afterwards, and
        `history` from each head returns its own path. The negative control is the unbranched head,
        which still sees turn 2.
    files:
      - src/session.rs
      - src/state.rs
      - tests/session.rs
    evidence:
      - >
        tests/session.rs F3: a branch from turn 1 carries turn 1 and not turn 2 into the request;
        turn 2 is unmodified afterwards with its own reply and run; both heads return their own
        path; a turn from another session is refused.
      - >
        src/state.rs unit test `two_turns_may_share_a_parent_and_neither_is_rewritten`.
  - id: US-IO-HARNESS-0.20.0-T03
    summary: >
      Token streaming: `Provider::complete_streaming` as a defaulted trait method, overridden by the
      three built-in providers to emit each text delta as its SSE event arrives, surfaced as
      `EventKind::Token { text }` through the existing observer channel and only on a session turn
      that was given an observer.
    why_required: >
      This is the release's named blocker: until deltas leave the provider there is nothing for a
      terminal or a desktop window to render while the model is typing, which is the reason the
      roadmap says this release is what makes those products possible.
    status: done
    depends_on:
      - US-IO-HARNESS-0.20.0-T01
    acceptance_criteria:
      - >
        F5 — tokens arrive before the answer does. Against a scripted SSE provider, the deltas an
        observer receives concatenate exactly to the response's final text, in order, and the first
        `Token` event is observed strictly before `complete_streaming` returns. Asserted on recorded
        instants, not on a sleep.
      - >
        F6 — streaming is opt-in and existing behaviour is untouched. A `run_with_observed` run against
        the same streaming provider emits zero `Token` events and the identical event sequence it emits
        on 0.19.0; the negative control is the same provider driven through a session turn, which does
        emit them.
      - >
        F7 — a provider that does not implement streaming still works. A `Provider` implementing only
        `complete` drives a session turn to completion and produces exactly one `Token` event carrying
        the whole text, so a UI written against the event renders something rather than nothing.
      - >
        NF2 — one break, marked, and no other. `EventKind` gains `Token { text }`; nothing else in
        `docs/public-api.txt` changes meaning, no item is removed or renamed, and the changelog carries
        the migration note (`match` on `EventKind` needs a `Token` arm or a `_` arm).
      - >
        NF3 — streaming costs nothing when nobody is listening. A session turn with no observer performs
        no per-delta allocation beyond what 0.19.0 did, asserted by the streaming path being entered
        only when a sink exists rather than by a timing measurement.
    files:
      - src/provider/mod.rs
      - src/provider/anthropic.rs
      - src/provider/openai_wire.rs
      - src/provider/openrouter.rs
      - src/provider/openai.rs
      - src/observe.rs
      - src/session.rs
      - tests/session_streaming.rs
    evidence:
      - >
        tests/session_streaming.rs F5/F6/F7/NF3: the deltas concatenate to the response's final text
        in order, every delta of a step is observed before that step commits, and the first is
        observed before the stream ends; a `run_with_observed` run over the same provider emits zero
        Token events and the identical 0.19.0 sequence (started, step, finished); a `complete`-only
        provider yields one delta carrying the whole text; a turn with no observer never enters the
        streaming path.
      - >
        Live: 13 deltas over a real OpenRouter turn, the step's text arriving before that step
        committed. evidence/0.20.0/live-run-session.txt.
  - id: US-IO-HARNESS-0.20.0-T04
    summary: >
      Steering and interruption: `Steer::channel`, `Steer::say` delivering an operator message at the
      next step boundary as an observation the next request carries, and `Steer::interrupt` stopping
      the turn through the existing cancel path — with the policy unchanged by either.
    why_required: >
      Without it the only way to change course is to kill the process, which abandons a run mid-step
      and leaves `runs.status` at `running` forever. It is also where the release could do real harm:
      an operator's chat message must not read as an authorization, and that has to be proven rather
      than asserted.
    status: done
    depends_on:
      - US-IO-HARNESS-0.20.0-T01
    acceptance_criteria:
      - >
        F8 — steering reaches the model at the next step boundary. A `Steer::say` issued during a turn
        appears in the next request and changes what the agent does; the negative control is the same
        turn with no steering, which does the original thing. Asserted through the real loop against a
        scripted provider that branches on whether the message is present.
      - >
        F9 — an interrupt stops the turn cleanly and the session goes on. `Steer::interrupt()` ends the
        turn at the next step boundary with `RunOutcome::Cancelled`, the turn's last step is whole in
        the store (no half-committed step), the turn is present in `history` marked with its outcome,
        and the next turn on the same session proceeds normally.
      - >
        F10 — steering is not authorization. A turn under a policy denying a write, steered with an
        operator message explicitly asking for that write, still refuses it, with the refusal attributed
        to the same rule and layer. The negative control is a policy that allows the write, where the
        same steered message results in the write happening.
      - >
        NF6 — an interrupted or cancelled turn never leaves `runs.status` at `running`, and neither does
        a dropped `Session`. The state a crash leaves is the state a resume already understands.
    files:
      - src/session.rs
      - src/run.rs
      - tests/session_steering.rs
    evidence:
      - >
        tests/session_steering.rs F8/F9/F10/NF6: a steer changes the next step's action with the
        unsteered turn as control; an interrupt after one committed step ends the turn `Cancelled`
        with `runs.status` completed, one whole step in the workspace, the turn in the tree marked
        `cancelled`, and the session continuing; a steered request for a denied write is refused by
        the rule that denies it and the secret is byte-identical, with the deny lifted as the
        control.
      - >
        Live: the operator's message reached the model at step 2 of 6 and the trace carries the
        `steered` row. evidence/0.20.0/live-run-session.txt.
  - id: US-IO-HARNESS-0.20.0-T05
    summary: >
      Documentation and the surface record: `docs/guide/sessions.md`, a worked example on every added
      public item, `docs/public-api.txt` by hand, the `EventKind` break and its migration note in
      `CHANGELOG.md`, and the `docs/CONTRACT.md` section on what a session does and does not
      guarantee.
    why_required: >
      The crate's own tests enforce it — a public item with no worked example, an unlisted guide page
      or an unmarked break fails the suite. It is also where the honest limits of the release are
      stated: streamed text is provisional, steering is not authorization, and one session driven by
      two processes at once is unsupported.
    status: done
    depends_on:
      - US-IO-HARNESS-0.20.0-T01
      - US-IO-HARNESS-0.20.0-T02
      - US-IO-HARNESS-0.20.0-T03
      - US-IO-HARNESS-0.20.0-T04
    acceptance_criteria:
      - >
        OP1 — `docs/public-api.txt` is updated by hand, `tests/public_api.rs` passes against the live
        surface, and every added public item carries a fenced worked example, enforced by the existing
        docs test.
      - >
        OP2 — `docs/guide/sessions.md` exists, is linked from the README and the crate root, and is
        covered by the existing guide-pages test.
      - >
        OP3 — `docs/CONTRACT.md` states what a session is and is not: a turn is a run and carries a
        run's guarantees; the tree is append-only; streamed text is provisional until the completion
        returns and a caller must not act on a partial delta; steering is text and not authorization;
        and one session driven by two processes at once is unsupported.
      - >
        OP4 — `CHANGELOG.md` carries the break with its migration note and the new capability in the
        user-facing voice the changelog test enforces.
      - >
        NF5 — `cargo clippy --all-targets --all-features -- -D warnings` and `cargo fmt --check` pass,
        and `cargo doc --all-features` is warning-free.
    files:
      - docs/guide/sessions.md
      - docs/public-api.txt
      - docs/CONTRACT.md
      - CHANGELOG.md
      - README.md
      - src/lib.rs
      - src/session.rs
    evidence:
      - >
        OP1: docs/public-api.txt updated by hand with the five added items; tests/public_api.rs
        passes, including the worked-example check over all 116 items.
      - >
        OP2: docs/guide/sessions.md written, listed in tests/guide_pages.rs with a limits block,
        linked from docs/CAPABILITIES.md, README.md and the crate root; tests/guide_pages.rs,
        tests/readme.rs and tests/docs_drift.rs pass.
      - >
        OP3/OP4: docs/CONTRACT.md carries the eight session limits and the newly found refused-git
        defect; CHANGELOG.md carries the `EventKind` break with its migration snippet and
        tests/changelog.rs passes.
      - >
        NF5: cargo fmt --check, clippy --all-targets --all-features -D warnings, and cargo doc
        --all-features all clean.
  - id: US-IO-HARNESS-0.20.0-T06
    summary: >
      The live session example kept as evidence, and the three-OS suite: a real session against a real
      provider that streams tokens ahead of the completion, steers mid-turn, branches, and reopens
      across a process boundary, asserting each itself.
    why_required: >
      The suite proves the mechanism against a scripted provider; only a live session proves an
      operator can hold a conversation with the crate. The three-OS leg is where a store- and channel-
      bound feature historically disagrees.
    status: done
    depends_on:
      - US-IO-HARNESS-0.20.0-T01
      - US-IO-HARNESS-0.20.0-T02
      - US-IO-HARNESS-0.20.0-T03
      - US-IO-HARNESS-0.20.0-T04
    acceptance_criteria:
      - >
        OP5 — a live session against a real provider is run by hand before the release is cut and its
        output kept as evidence: streamed deltas timestamped ahead of the completion, a mid-turn steer
        that changes the agent's next action, a branch, and a reopen across a process boundary. The
        suite proves the mechanism; only a live run proves an operator can hold a conversation with it.
      - >
        NF4 — the full suite passes on macOS, Linux and Windows with the Windows leg's `timeout-minutes`
        unchanged at 40. The session tests are store- and channel-bound, which is where the Windows leg
        historically disagrees.
    files:
      - examples/session_live.rs
      - .ultraship/evidence/0.20.0/
    evidence:
      - >
        OP5: examples/session_live.rs run against OpenRouter end to end — streamed 13 deltas ahead
        of the step, the steer delivered and traced, a branch whose path is root -> branch with the
        abandoned turn intact, and a reopen in a second connection that recalled the conversation's
        first prompt. 28,461 tokens over four turns. evidence/0.20.0/live-run-session.txt.
      - >
        NF4: the three-OS suite is CI's on the PR; everything here ran on macOS.
