product: io-harness
version: 0.40.0
tasks:
- id: US-IO-HARNESS-0.40.0-T01
  summary: Add `TaskContract::exec_sandbox` and `with_contained_exec`, and route `exec` through the
    selected backend with the workspace root as its working directory.
  why_required: 'This is the release''s vertical slice and everything else attaches to it: the opt-in
    the caller sets, the dispatch that reads it, the `RunSpec` that carries the workspace root, and
    a file that does or does not appear outside the root. Without it there is no containment to cap,
    deny egress from, or audit. The negative control lands here too, because the moment `exec` can be
    contained is the moment it can be contained by accident.'
  status: done
  depends_on: []
  acceptance_criteria:
  - '**F1 — a contained command cannot write outside the workspace, and an uncontained one still can.**
    A contract with a workspace root and `with_contained_exec(SandboxConfig::new())`; the model calls
    `exec` with an argv that writes a file to a path outside the root. Afterwards the file does not
    exist, and the tool result the model was handed says the command failed rather than reporting success.
    **The negative control, on the same contract, the same policy, the same store and the same argv,
    with the field absent:** the file exists. This pair is the release in one assertion. An implementation
    that contained every `exec` unconditionally passes the first half and fails the second, and that
    failure is every existing embedder''s build silently changing where it may write. Asserted on the
    filesystem, not on the model''s narration.

    '
  - '**F5 — the workspace is the working directory and is not discarded.** Within one contained run,
    a first `exec` writes a file under the workspace root and a second `exec` reads it back and finds
    it. Then, after the run: the file is on disk in the workspace, and no `TempDir` was created for
    it. This is the criterion that proves 0.17.0''s objection is answered rather than argued with —
    an implementation that reused `sandbox::workdir()` passes nothing here.

    '
  files:
  - src/contract.rs
  - src/run.rs
  - src/tools/exec.rs
  - tests/exec_contained.rs
  evidence:
  - '`TaskContract::exec_sandbox: Option<SandboxConfig>` and `TaskContract::with_contained_exec` landed
    in `src/contract.rs`, defaulting to `None` in both constructors. `Exec` gained a `sandbox` field
    and an `Exec::contained(Option<&SandboxConfig>)` builder rather than a fourth argument to `new`,
    so every pre-0.40.0 construction reads exactly as it did. `dispatch` carries `exec_sandbox` beside
    `exec_timeout` and both call sites pass `contract.exec_sandbox.as_ref()`.'
  - 'A contained command''s `RunSpec.workdir` is `ws.root()` — the workspace — and `sandbox::workdir()`
    and `copy_back` are not called on this path at all. That is the whole of the answer to `US-IO-HARNESS-0.17.0-I02`:
    nothing is copied in, nothing is copied out, nothing is discarded.'
  - 'F1 and F5, `cargo test --test exec_contained` — **3 passed, 0 failed**. F1''s two arms are separate
    tests: a contained `touch` of a path outside the workspace leaves the file absent and the trace
    does not say `exit 0`; the identical argv on the identical contract with the field absent leaves
    the file present.'
  - 'F5 is also F1''s control, and it is why the escape denial means containment rather than breakage:
    within one contained run a first `exec` writes a relative path and a second reads it back, both
    `exit 0`, and the file is in the workspace after the run.'
  - Sabotage **S1** — `Exec::contained` ignores the config and stores `None`. `a_contained_command_cannot_write_outside_the_workspace`
    FAILED; the other two passed. Reverted.
  - Sabotage **S2** — `RunSpec.workdir` set to `sandbox::workdir()`'s `TempDir`, the shape 0.17.0 refused.
    `a_contained_command_writes_into_the_workspace_and_the_next_one_reads_it` FAILED; the other two
    passed. Reverted. Two sabotages, two different named tests, neither silent.
  - '**A measured fact that decided the test design, 2026-08-07 on this host.** The macOS profile (`src/sandbox/macos.rs`,
    `profile_for`) denies writes under `/` and re-allows the workdir *and the whole of `/private/var/folders`*
    — where `tempfile::tempdir()` puts everything. Probed directly with `sandbox-exec`: a write inside
    the workspace succeeded, a write into a **second temp directory succeeded**, and a write to `$HOME`
    was refused `Operation not permitted`. An escape test using a second `tempdir()` would therefore
    have passed on Linux and proven nothing on macOS. The escape target is a directory under the crate''s
    own `target/`, removed by a `Drop` guard. N6 already commits to stating this allowance, so it is
    a test-design constraint rather than a scope change.'
  - 'N4''s first instalment: `cargo test --test exec_tool --test shell --test sandbox` — **12 + 8 +
    11 = 31 passed, 0 failed**, with no test in any of those three files edited.'
- id: US-IO-HARNESS-0.40.0-T02
  summary: Carry `SandboxOutcome.cap_hit` into the observation the model reads and the step the store
    records, and keep the sandbox wall cap distinct from the contract's `exec_timeout`.
  why_required: 'A command killed by the sandbox and a command that exited non-zero are different events
    with different fixes, and today the model would be told only the second. The two ceilings are the
    sharper half: `exec_timeout` is the contract''s wedged-command ceiling and `max_wall_secs` is the
    sandbox''s, and collapsing them sends whoever reads the trace to the wrong one.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.40.0-T01
  acceptance_criteria:
  - '**F2 — a cap kills, and the trace names which cap.** Two arms, one sabotage each. **(a)** Under
    a `SandboxLimits` with a low `max_memory_bytes`, a command that allocates past it is killed; the
    recorded step and the observation the model reads name `Cap::Memory` (`src/sandbox.rs:140`), not
    a bare exit status. **(b)** Under a low `max_wall_secs` a spinning command is killed naming `Cap::Wall`,
    and is distinguishable from `ExecOutcome::TimedOut` (`src/tools/exec.rs:91`), which is the *contract''s*
    `exec_timeout` and a different ceiling with a different meaning. Sabotage (a): drop `cap_hit` on
    the way to the observation, under which the kill still happens and the named test fails because
    the model is told only that something exited. Sabotage (b): map the sandbox wall cap onto `TimedOut`,
    which fails the named test that distinguishes them.

    '
  files:
  - src/tools/exec.rs
  - src/run.rs
  - tests/exec_contained.rs
  evidence:
  - '`ExecOutcome::Capped { cap, code, stdout, stderr, elided }` added — `ExecOutcome` is `pub(crate)`,
    so the variant costs no public surface. `Exec::run_contained` reads `SandboxOutcome.cap_hit` and
    returns `Capped` rather than `Ran`; the cap is read from what the backend returned, never inferred
    from the exit status, because a process shot by `RLIMIT_CPU` and one that chose to exit 137 are
    indistinguishable by status.'
  - '`dispatch` gained the arm: the decision reads `exec <program> hit the <cap> cap` and the observation
    the model reads says the sandbox stopped it because it crossed that limit **rather than because
    the command failed**, with whatever it printed first kept.'
  - '`src/tools/diagnostics.rs` gained the arm too. It is unreachable today — diagnostics build their
    own uncontained `Exec` — and is handled rather than `unreachable!()` so that pointing that path
    at a sandbox later is a compile error instead of a panic in someone''s run.'
  - 'F2, `cargo test --test exec_contained` — **5 passed, 0 failed in 0.09s**. Both arms are deterministic
    by construction rather than by waiting: `max_wall_secs: Some(0)` fires on the first check and `exec_timeout:
    Duration::ZERO` elapses on the first poll, so nothing sleeps for real and **no duration is asserted
    anywhere** (O1).'
  - 'Arm (a): a contained `sleep 5` under a zero wall ceiling is killed, the step decision contains
    `hit the wall cap`, and the *next turn''s prompt* contains `killed by the wall cap` — the claim
    is that the model is told which resource ran out, so it is asserted where the model reads.'
  - 'Arm (b): the same contained command under the contract''s `exec_timeout` instead reports `timed
    out` and the decision does **not** contain `cap`. The two ceilings are raised in different places
    — `with_exec_timeout` and `SandboxLimits` — so a trace that called both the same would send a reader
    to the wrong one.'
  - Sabotage **S3** — `cap_hit` dropped on the way to the observation (matched against `None`). `a_command_killed_by_a_cap_is_reported_as_that_cap`
    FAILED, the other four passed. Reverted.
  - 'Sabotage **S4** — `Cap::Wall` mapped onto the contract''s `TimedOut`, which is the collapse the
    criterion exists to forbid. The same named test FAILED and the other four passed, including the
    timeout test, which is the point: S4 is invisible to every assertion except the one that distinguishes
    the ceilings. Reverted.'
  - '**Deviation from F2(a)''s example, substance met, wording not.** The criterion names `max_memory_bytes`;
    the arm was executed with `max_wall_secs` instead. Memory on macOS is enforced by a **polling RSS
    monitor**, so a memory-cap test is timing-dependent — exactly what O1 forbids in this release, and
    this release is unusually exposed to it. The claim F2 makes is that a cap kills and the trace names
    *which* cap, and that is what was asserted, on a ceiling that fires deterministically. Owed to `known_limitations`.'
- id: US-IO-HARNESS-0.40.0-T03
  summary: Derive `allow_network` from the run's `Policy`, decide what `Effect::Ask` on `Act::Net` means,
    and document the coarseness.
  why_required: 'Without this the containment either denies every contained command a network it was
    granted, or grants one it was denied — and the policy is the only thing in the crate that already
    knows. The coarseness is not incidental: the backends take one boolean while `Act::Net` is per host,
    so a claim of per-host filtering under containment would be false and has to be asserted as false.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.40.0-T01
  acceptance_criteria:
  - '**F3 — egress follows the policy, both arms.** **(a)** A policy whose `Act::Net` default is `Deny`
    with no allowing rule: a contained command that dials a host fails to connect, on macOS and on Linux.
    **(b)** A policy that allows a host: the same command connects. Sabotage: hard-code `allow_network:
    false`, under which (b) fails; hard-code `true`, under which (a) fails. Both arms are needed because
    a single-armed test passes an implementation that never reads the policy at all. The coarseness
    is asserted rather than glossed: with one host allowed, a command reaching a *different* host also
    connects, and that assertion is the executable form of the limitation `docs/CONTRACT.md` states.

    '
  files:
  - src/run.rs
  - src/policy.rs
  - src/tools/exec.rs
  - tests/exec_contained.rs
  evidence:
  - '`Policy::permits_any_egress()` added in `src/policy.rs` — `true` when `defaults.net` is `Allow`
    or any layer carries an `Act::Net` rule with `Effect::Allow`, `false` otherwise. `dispatch` builds
    the contained config with `allow_network` from it.'
  - '**The `Ask` question is answered and the answer is `not permitted`**, which closes one of the contract''s
    `open_questions`. The reason is structural rather than a preference: an approver answers a question
    about one action at the moment it is attempted, while a namespace is built before the command starts
    and cannot be renegotiated once it is running. Treating `Ask` as permission would hand a blanket
    route out on the strength of a rule that asked for a human. Documented on the method and owed to
    `docs/CONTRACT.md`.'
  - '**Two sources of `allow_network` resolved to one authority per path.** `SandboxConfig::allow_network`
    is what the verification gate uses, because that path has no policy to consult; a run has one, and
    it is the run''s own statement about reaching the network. The config''s flag is therefore not consulted
    for contained `exec`, which is what F3 specifies and is documented rather than left to be inferred.'
  - 'F3, `cargo test --test exec_contained` — **8 passed, 0 failed in 0.12s**. Offline by construction:
    the probe is a `tokio::net::TcpListener` on loopback rather than a live host. Loopback is a real
    test of both boundaries — a fresh network namespace has only a down `lo`, and the macOS profile''s
    `(deny network*)` covers local sockets — and it is the only probe that can assert the *allow* arm
    without depending on somebody else''s uptime.'
  - 'Arm (a): under `Policy::default()` (net at `Ask`, no allowing rule) a contained `curl` to the listener
    does not reach it. Guarded by a backend check — a Job Object and the portable floor claim no network
    boundary, and asserting a denial they never promised is how a suite starts lying about what it proved.'
  - 'Arm (b): under a permissive policy the identical command connects and the step reads `exit 0`.'
  - 'The coarseness is asserted, not glossed: under a policy allowing exactly `example.com:443`, a contained
    command reaching a **different** host still connects. The assertion carries its own reversal instruction
    — if it ever fails, per-host egress has been implemented and `docs/CONTRACT.md` must stop saying
    it has not.'
  - Sabotage **S5** — `allow_network` hard-coded `false`. The allow arm and the coarseness test FAILED;
    the deny arm passed. Sabotage **S6** — hard-coded `true`. The deny arm FAILED; the other two passed.
    Each sabotage fails the opposite arm, which is why a single-armed test would have proven nothing
    here. Both reverted.
- id: US-IO-HARNESS-0.40.0-T04
  summary: Contain every sub-command `shell` parses out of a line, not the first.
  why_required: '`shell` is in scope and it is the tool whose containment is easiest to half-implement:
    a line''s first stage wrapped and its later stages spawned free passes any test written against
    a one-stage line, while leaving the escape the release exists to close.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.40.0-T01
  acceptance_criteria:
  - '**F4 — `shell` contains every sub-command, not the first.** A `shell` line whose first stage is
    harmless and whose second stage writes outside the workspace root: the second stage''s file does
    not exist afterwards. Sabotage: wrap only the first parsed sub-command, under which the file lands
    and this named test fails. This is the arm most likely to be quietly missing, because a `shell`
    implementation that contains its first stage passes any test written against a one-stage line.

    '
  files:
  - src/run.rs
  - src/tools/shell.rs
  - tests/shell_contained.rs
  evidence:
  - '`shell` cannot hand an argv to `Sandbox::run` at all — its stages are piped into one another, so
    the tool owns every `Child` and cannot delegate the spawn. Containment therefore attaches by **wrapping
    each stage''s argv** with the backend''s own wrapper (`sandbox-exec -p <profile>` on macOS, `unshare`
    on Linux) plus the same rlimits the sandbox''s runner applies.'
  - 'Two crate-internal helpers were extracted in `src/sandbox.rs` so there is one definition rather
    than two copies: `apply_rlimits(&mut Command, &SandboxLimits)` — lifted out of `run_capped_hooked`,
    which now calls it — and `wrap_argv(config, workdir, allow_network, argv) -> (Backend, Vec<String>)`.
    Two copies of a `pre_exec` block is two places for a cap to lapse, and the lapse is silent because
    an uncapped child runs fine.'
  - '`wrap_argv` returns the backend that **actually applied**, not the one asked for, so a host whose
    primitive failed its probe returns `PortableFloor` with an unwrapped argv and the caller records
    what really happened.'
  - 'The extraction is behaviour-neutral, proven before `shell` used any of it: `cargo test --test sandbox`
    — **8 passed, 0 failed** — with no test in that file edited.'
  - 'F4, `cargo test --test exec_contained` — **10 passed, 0 failed in 0.13s**. The line is `echo contained
    | tee <path outside the workspace>`: stage one is harmless and must succeed, stage two is the one
    that tries to leave. Contained, the file does not appear. The negative control — the identical line
    with the field absent — still writes it.'
  - Sabotage **S7** — wrap only stage 0 (`self.sandbox.as_ref().filter(|_| i == 0)`), which is the cheapest
    wrong implementation and the one a one-stage test cannot see. `a_contained_shell_line_contains_its_later_stages_too`
    FAILED and the other nine passed. Reverted.
  - '`cargo test --test shell --test handles` — **14 + 11 = 25 passed, 0 failed**, neither file edited.
    The `shell_start` handles are untouched and uncontained by design: a handle outlives the call that
    made it, and `Shell::contained` is set only for a foreground line.'
  - '**A limit this task creates and owes to `docs/CONTRACT.md` (T07).** A contained `shell` stage gets
    filesystem confinement, egress denial and the CPU/open-files rlimits, but **not** the memory RSS
    monitor and **no cap attribution** — those live in the sandbox''s own runner, which a piped line
    does not go through. So a `shell` stage killed by a cap is not reported as `Capped` the way an `exec`
    command is. Stated rather than discovered.'
- id: US-IO-HARNESS-0.40.0-T05
  summary: Populate the mount namespace `LinuxSandbox` already unshares, so writes outside the workdir
    fail on Linux, and keep the probe, the wrapper-failure path and the floor fallback intact.
  why_required: Filesystem confinement is macOS-only today while `src/lib.rs:279` tells a reader Linux
    does the same, so the crate over-reads its own boundary on the platform most of its CI runs on.
    This is the task the contract's `fallback_scope` drops if it does not converge, which is why it
    is isolated rather than folded into T01.
  status: done
  depends_on:
  - US-IO-HARNESS-0.40.0-T01
  acceptance_criteria:
  - '**F6 — Linux confines writes, on Linux.** F1''s escape assertion runs on `ubuntu-latest` in the
    matrix, not only on macOS, and passes. If the host refuses namespaces, the backend reports `Backend::PortableFloor`
    and the test asserts *that* rather than asserting confinement that was never applied — a skip that
    reads as a pass is the failure mode here. Sabotage: revert the mount population to 0.39.0''s `unshare`
    argv, under which the write lands on Linux and this named test fails while every macOS test still
    passes, which is the whole point of running it there.

    '
  files:
  - src/sandbox/linux.rs
  - tests/exec_contained.rs
  evidence:
  - '`unshare_argv` now takes the workdir and populates the mount namespace `--mount` creates. Before
    this it created a namespace and remounted **nothing** into it, so the filesystem view was identical
    to the host''s and a write outside the workdir landed — only `--net` was doing real work, while
    `src/lib.rs` told a reader Linux confined writes the way macOS does.'
  - 'The setup remounts the tree read-only and binds back exactly two places: the run''s workdir and
    the system temporary directory. The second is not a convenience — it is the same allowance the macOS
    profile already makes for `/private/var/folders`, and without it most toolchains fail on their first
    temporary file. Both are owed to `docs/CONTRACT.md` (T07).'
  - '`sh` in the wrapper is not a shell for the payload. The command arrives as positional parameters
    and leaves through `exec "$@"`, so nothing re-parses it — the property `src/tools/exec.rs` is built
    on. Asserted by a unit test that passes `; rm -rf /` as an argument and checks it never reaches
    the script text and is still the final argv element.'
  - '**The probe was changed with it, and that is the load-bearing part.** `unshare_works` now spawns
    the *exact* wrapper including the mount setup, against a real temp dir. A kernel can permit the
    namespace and still refuse the remounts; a probe that only tried `unshare` would have reported `LinuxNamespaces`
    for runs confining nothing. The fail-safe is unchanged in shape: a host that refuses degrades to
    `Backend::PortableFloor` and reports the floor.'
  - 'Three unit tests in `src/sandbox/linux.rs` cover the argv shape and run on **any** host, including
    this macOS one: `cargo test --lib` — **388 passed, 0 failed**. One pre-existing test was rewritten
    rather than accommodated: it asserted the payload was adjacent to `--`, which 0.40.0 deliberately
    changes by putting the setup in between; it now asserts the payload is the untouched tail.'
  - 'F6 is written so the dangerous outcome fails rather than passes. If the backend is not `LinuxNamespaces`
    the test skips **only when `CI` is unset** and fails outright on CI, because a silent fall back
    to the floor would let the confinement assertion pass having confined nothing. It also carries an
    in-run control: a write *inside* the workspace must still succeed and report `exit 0`, or ''confined''
    would just mean ''broken''.'
  - '**Not verifiable on this host, and that is stated rather than papered over.** This build machine
    is macOS, so the Linux behaviour claim rests on the `ubuntu-latest` matrix job. The argv shape,
    the non-interpolation property and the probe change are proven locally; whether the remounts are
    permitted by the runner''s kernel is proven on the runner or not at all. If CI reports the floor
    or a wrapper failure, the contract''s `fallback_scope` drops exactly this task and the release ships
    macOS-only with the per-platform table saying so — that decision goes to the owner via `/ultraship:iterate`,
    not taken here.'
- id: US-IO-HARNESS-0.40.0-T06
  summary: Write the `SandboxEvent` lifecycle rows for a contained `exec` or `shell`, carrying the backend
    that actually applied.
  why_required: A run that silently took `PortableFloor` because the host refused the native primitive
    is otherwise indistinguishable from one that was contained as asked. The rows already exist and
    the verification gate already writes them; a contained command that does not is a boundary claim
    with no audit behind it.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.40.0-T01
  - US-IO-HARNESS-0.40.0-T04
  acceptance_criteria:
  - '**F7 — the audit says which backend actually ran.** After a contained `exec`, the store holds the
    `SandboxEvent` lifecycle rows for that run and step carrying `Backend::as_str()` (`src/sandbox.rs:98`),
    the same rows the verification gate writes (`src/verify.rs:826`). On a host that refused the native
    primitive the recorded backend is `PortableFloor`, so a run that was contained less than the caller
    asked for is legible afterwards instead of being indistinguishable from one that was not. Asserted
    against stored rows.

    '
  files:
  - src/run.rs
  - src/tools/exec.rs
  - tests/exec_contained.rs
  evidence: []
- id: US-IO-HARNESS-0.40.0-T07
  summary: Documentation, the per-platform table, the public-API surface and the release bookkeeping.
  why_required: 'The release''s honesty is the deliverable. `src/tools/exec.rs`''s ''What this does
    not bound'' section currently states a bound this release changes the conditions of, and `src/lib.rs:279`
    states a Linux property that is not true until T05 lands. Both are read by people deciding what
    to trust the crate with. The public-API file, the changelog and the roadmap withdrawal are the same
    job: the record matching the tree.'
  status: todo
  depends_on:
  - US-IO-HARNESS-0.40.0-T01
  - US-IO-HARNESS-0.40.0-T02
  - US-IO-HARNESS-0.40.0-T03
  - US-IO-HARNESS-0.40.0-T04
  - US-IO-HARNESS-0.40.0-T05
  - US-IO-HARNESS-0.40.0-T06
  acceptance_criteria:
  - '**N1 — no new dependency.** `cargo tree` on macOS and Linux still reads **402** lines. Any platform
    primitive is reached through what is already there, or behind `[target.''cfg(...)''.dependencies]`,
    which leaves the count untouched.

    '
  - '**N2 — zero breaks, and the assertion is the diff of `docs/public-api.txt`.** The file gains the
    lines for `TaskContract::exec_sandbox` and `TaskContract::with_contained_exec` and loses none. No
    existing signature moves, no type gains `#[non_exhaustive]` it did not have, `SandboxConfig`, `RunSpec`,
    `SandboxLimits` and `Verification` are untouched, and `tests/changelog.rs` finds no `**BREAKING`
    entry for this version. If the implementation needs a field on `RunSpec` or a change to the `Sandbox`
    trait to work, the design is wrong for this release.

    '
  - '**N3 — no store change.** No table, no column, no index; `CHECKPOINT_FORMAT` unmoved at **7**;
    `ADDED_SINCE_0_22_0` unchanged; `tests/cross_version.rs` and the pinned 0.29.0 generator job pass
    in both directions with no new name fed to the guard. Every row a contained command writes goes
    to tables the sandbox events have used since 0.6.0.

    '
  - '**N4 — the uncontained path is behaviour-identical to 0.39.0.** With `exec_sandbox` absent, `exec`
    and `shell` spawn exactly as they did: same workdir, same timeout, same truncation, same policy
    checks in the same order, no `SandboxEvent` written and no backend selected. The existing `exec`,
    `shell` and verification suites pass **unmodified** — no test in them is edited to accommodate this
    release — and F1''s negative control covers the escape half.

    '
  - '**N5 — the per-platform truth is written where a reader finds it, and nothing over-reads.** `docs/CONTRACT.md`
    carries a table of what each backend actually enforces for a contained command: macOS — caps, writes
    confined, egress denied; Linux — caps, writes confined, egress denied, degrading to the floor where
    namespaces are refused; Windows — caps only, no filesystem and no network facility in a Job Object.
    `src/lib.rs:279`''s claim that "Linux does the same through mount and network namespaces" is true
    after this release or is corrected. A grep for the old sentence is part of the check, because a
    corrected doc that leaves the original claim two files away is the defect this criterion exists
    to catch.

    '
  - '**N6 — the honest costs are stated, not discovered.** `docs/CONTRACT.md` and the field''s own doc
    state: egress is a single boolean and a policy allowing one host permits all of them under containment;
    `shell_start` handles are **not** contained; a contained command on macOS may write only under the
    workspace and `/private/var/folders` (`src/sandbox/macos.rs:46`), so a build that writes to `~/.cargo/registry`
    or `~/.npm` — a cold `cargo fetch`, an `npm install` populating its user cache — **fails under containment
    on macOS** and is the concrete price of the confinement, with the workaround being to leave the
    field unset or to point the toolchain''s cache inside the workspace; and on Windows nothing but
    the resource caps applies.

    '
  - '**O5 — the removal of the 0.41.0 roadmap entry rides this release''s branch.** It is an uncommitted
    working-tree deletion at the time this contract is written, and the owner decided on 2026-08-07
    that it is a genuine withdrawal to be committed on `feat/0.40.0` rather than restored or carried
    indefinitely. It lands as its own roadmap commit, not folded into a feature commit, and `ultraship
    views` is regenerated so `master-roadmap.md` matches.

    '
  files:
  - src/lib.rs
  - src/tools/exec.rs
  - src/contract.rs
  - docs/CONTRACT.md
