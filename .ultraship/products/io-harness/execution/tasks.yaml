- id: US-IO-HARNESS-0.45.0-T09
  summary: Bring the shipped documentation to 0.45.0 and clear the sentences it contradicts.
  why_required: Two doc surfaces state that discovered instructions become constraints, and the composition
    guarantee is only a guarantee if `docs/CONTRACT.md` states it.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.45.0-T08
  acceptance_criteria:
  - '**N3 — zero compile breaks, and `docs/public-api.txt` gains exactly two lines.** `SystemPrompt` and
    `PromptFamily` are crate-root re-exports and the checker (`tests/docs_drift.rs`) enumerates exactly
    those, so two lines are added and none is removed or changed: `TaskContract::prompt`/`::instructions`
    are fields on an already-listed type, `Provider::prompt_family` is a method on one, and `EventKind::PromptComposed`
    is a variant of one. **The number is stated at plan time** because "met in a different form" has cost
    a `known_limitations` line in four of the last seven releases.

    '
  - '**O3 — the documentation gates pass**: the nightly rustdoc gate, the two intra-doc link rules, and
    the checked-in doc surfaces (`docs/public-api.txt`, `CAPABILITIES.md`, the guide index, `CHANGELOG.md`
    including its behaviour-change note) consistent with the code in the same commit range. Specifically
    included: **no surviving sentence anywhere in the crate or the docs says that discovered instructions
    become constraints**, asserted by grep over `src/` and `docs/`, because at least two such sentences
    exist today and one of them is the doc comment on `Config::instructions` (`src/config.rs:1019`).

    '
