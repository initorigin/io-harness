product: io-harness
version: 0.32.0
tasks:
- id: US-IO-HARNESS-0.32.0-T01
  summary: 'Split the two caps in `Containment` and give `Ledger` a per-tier FIFO admission queue: `max_concurrent`
    becomes `max_concurrent_agents`, one `tokio::sync::Semaphore` per tier, and per-tier working/queued/done
    counters behind the new `FleetTally`.'
  why_required: Every other task calls this API. Until the ledger can admit, queue and count, `spawn_child`
    has nothing to wait on and the observer has nothing to report — and the rename is the release's
    one break, so it lands first and everything downstream is written against the final name.
  status: done
  depends_on: []
  acceptance_criteria:
  - '**F2 — the total cap still refuses, and the two caps are independent.** `max_total_agents: 8` with
    `max_concurrent_agents: 64` refuses at eight; `max_total_agents: 200` with `max_concurrent_agents:
    1` refuses nothing and runs strictly one child at a time (measured peak exactly one). Two named
    tests. A single test moving both numbers together could not tell which cap produced the behaviour.

    '
  - '**N1 — no new dependency.** `cargo tree` on macOS and Linux still reads 402 lines. The queue is
    `tokio::sync::Semaphore`, which the `sync` feature already in `Cargo.toml` provides, and one SQLite
    table.

    '
  - '**N4 — the break is exactly one, and it is in the changelog with a migration.** `Containment::max_concurrent`
    becomes `max_concurrent_agents`. A caller who wrote a struct literal renames one field; a caller
    who deserialises stored configuration changes nothing, because `#[serde(alias = "max_concurrent")]`
    keeps the old key readable. `EventKind` gains a variant, which is free under its `#[non_exhaustive]`.
    No public item is removed, so no deprecation cycle is owed. `tests/changelog.rs` and `tests/public_api.rs`
    both pass.

    '
  - '**N5 — every added public item carries a worked example**, enforced by the existing surface test:
    `FleetTally` and the renamed field both appear in compiling doctests.

    '
  - '**N6 — the wait graph is acyclic by construction, stated where a reader will find it.** The per-tier
    semaphore and the reason for it are documented on `Containment::max_concurrent_agents` and in `docs/CONTRACT.md`,
    including the honest consequence: the ceiling is per tier, so a tree of depth *d* can hold up to
    `max_concurrent_agents * d` agents working at once. A reader must not have to derive that from the
    source.

    '
  files:
  - src/containment.rs
  - src/lib.rs
  - src/run.rs
  - src/observe.rs
  evidence:
  - '`Containment::max_concurrent` is now `max_concurrent_agents`, carrying `#[serde(alias = "max_concurrent")]`.
    `a_stored_config_written_before_the_rename_still_loads` deserializes a 0.31.0 JSON body and reads
    7 back out of the new field, so the break costs a struct literal one rename and costs a stored configuration
    file nothing.'
  - '`Ledger` gained one `tokio::sync::Semaphore` per tier — `MAX_TIERS` clamps the allocation at 64
    so a `max_depth` of `u32::MAX` cannot be a denial of service written by the API — plus `try_admit`,
    `admit`, `mark_queued`, `restore_queue` and the public `tally`. `register_agent` is untouched and
    still refuses on the total, depth and budget caps only; `the_concurrency_cap_queues_where_the_total_cap_refuses`
    asserts both halves in one test: `try_admit` returns `None` while `register_agent` returns `Ok`.'
  - 'The deadlock argument is executed rather than written down. `each_tier_holds_its_own_slots` fills
    tier 1 with the single available slot and then admits at tier 2; a tree-global pool returns `None`
    there and the tree hangs. `a_queued_child_waits_and_then_runs` drives the real async path: the waiter
    stays queued across a `yield_now` while the slot is held, is admitted the moment it is dropped,
    and the tally moves working -> done on `AgentSlot::drop` rather than on a happy-path call.'
  - 'Negative control for the release''s load-bearing distinction: `mark_queued` was sabotaged to ignore
    its `newly_recorded` flag and count every re-queue. `a_restored_backlog_is_not_counted_twice_by_the_replay`
    failed by name and the other nine tests passed, which is what shows the assertion discriminates
    a restored depth from a re-derived one rather than merely being present.'
  - '`FleetTally` is exported from `src/lib.rs` with a worked example; the crate-root prose about composition
    now names both caps and says which one queues.'
- id: US-IO-HARNESS-0.32.0-T02
  summary: 'Make the queue durable: an `agent_queue` table keyed uniquely by `(parent_run_id, step,
    goal)`, `Store::enqueue_agent` / `dequeue_agent` / `queued_agents`, and the indexed read that answers
    a tree''s backlog in FIFO order.'
  why_required: A backlog that lives only in a dead process's memory is not a backlog anyone can act
    on. This is also the release's only schema change, so it lands before the code that writes to it
    and the cross-version evidence is taken against something that has stopped moving.
  status: done
  depends_on:
  - US-IO-HARNESS-0.32.0-T01
  acceptance_criteria:
  - '**N2 — reading a tree''s backlog is an indexed lookup per parent, not a scan of the queue.** `EXPLAIN
    QUERY PLAN` for `Store::queued_agents` must name `agent_queue_entry` for the `agent_queue` access,
    with a control statement filtering on `goal` alone — not a left prefix of that index — which must
    not use it. The cost''s shape is one index seek per run in the tree plus the recursive walk of `runs`
    the tree queries already pay, and the measured wall time at the backlog sizes this release cares
    about is recorded in the record rather than asserted, for the reason 0.30.0''s N2 recorded: a wall-clock
    threshold is flaky on a loaded runner and green on a fast one running a full scan.

    '
  - '**F9 — cross-version compatibility, both directions.** A database written by a real 0.31.0 build
    opens, resumes and replays under 0.32.0 with nothing to migrate; and a 0.32.0 store carrying `agent_queue`
    rows is read by a 0.31.0 build, which never names the table. Proven with the pinned-generator technique
    `tests/cross_version.rs` already uses. The 0.22.0 schema guard is fed `agent_queue` and `agent_queue_entry`
    by name.

    '
  files:
  - src/state.rs
  - tests/cross_version.rs
  evidence:
  - '`agent_queue` lands beside `plans` — `(parent_run_id, step, goal, depth, queued_at)` with a UNIQUE
    index `agent_queue_entry` on the same `(parent_run_id, step, goal)` key `spawns` is adopted by.
    `CHECKPOINT_FORMAT` does not move: a 0.31.0 binary never names the table, so bumping it would make
    `check_resumable` refuse a database that is in fact readable. Both objects are declared in `ADDED_SINCE_0_22_0`,
    which the 0.22.0 schema guard requires by name.'
  - '`Store::enqueue_agent` returns whether the row is new — `INSERT OR IGNORE` against the unique index
    — which is what lets the ledger tell a fresh wait from a replayed one without guessing. `a_replayed_wait_reuses_its_row_rather_than_adding_one`
    asserts the second and third enqueue of the same key return `false` and leave one row, while a different
    step or a different goal is a different wait.'
  - 'N2, and it moved the implementation. The natural `FROM agent_queue q JOIN tree` reads `SCAN q`:
    a recursive CTE is a co-routine SQLite cannot seek into, so the planner scans every tree''s backlog
    and probes the CTE instead. `queued_agents` is `FROM tree CROSS JOIN agent_queue q INDEXED BY agent_queue_entry`,
    and `reading_a_backlog_reaches_its_rows_through_an_index` asserts the plan contains `SEARCH q USING
    INDEX agent_queue_entry` over a 32-tree fixture. Measured over 200 trees of 100 waiting children:
    0.057 ms seeking against 0.593 ms scanning, a 10x difference that only appears once the file holds
    more than one tree.'
  - 'Deviation from N2 as written, stated rather than quietly worked around: the criterion named a control
    filtering on `goal` alone. `goal` is the index''s last column and SQLite still uses the index for
    it, skip-scanning `ANY(parent_run_id) AND ANY(step) AND goal=?` — a full read wearing an index''s
    name. The control is `queued_at`, which is in no index at all and therefore genuinely cannot use
    one. The criterion''s substance (a control that proves the check discriminates an index from a scan)
    is met; its example column was wrong.'
  - '`a_queued_child_has_no_run_and_therefore_no_spend` asserts the charge claim against the durable
    rows: with one admitted child that spent 250 tokens and one waiting, `children` holds exactly the
    admitted run, `queued_agents` holds exactly the waiting goal, `spent_tokens_tree` is 250 and `agent_count_tree`
    is 2. Three doctests on `enqueue_agent`, `dequeue_agent` and `queued_agents` cover the FIFO order,
    the reach into the tree, and the idempotent delete the never-queued fast path calls.'
- id: US-IO-HARNESS-0.32.0-T03
  summary: Wire admission into `spawn_child` for fresh and adopted children alike, widen the per-step
    `buffered()` so the tree-wide throttle is the only bound, emit `EventKind::Fleet` per tier, and
    restore the backlog from the store on resume before the provider is touched.
  why_required: 'This is the release: without it the ledger throttles nothing, the store rows are never
    written, and the counters never reach an observer. The resume path is also where `record_run_policy`
    was never called, and this task is already inside that function.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.32.0-T02
  acceptance_criteria:
  - '**F1 — the concurrency cap throttles and does not refuse.** A 120-child fan-out under `Containment
    { max_total_agents: 200, max_concurrent_agents: 8, .. }`: all 120 children run to completion, `store.children(root)`
    holds 120 rows, no `EventKind::SpawnRefused` is emitted, and an in-flight probe''s measured peak
    is greater than one and never above eight. Its negative control is the same fan-out under `max_total_agents:
    8`, which must refuse 112 spawns with `SpawnRefusal::AgentCap` — without it the test would pass
    against a harness that had simply stopped enforcing anything.

    '
  - '**F5 — a replayed spawn does not double the backlog.** After the resume in F4 completes, no two
    `agent_queue` rows share a `(parent_run_id, step, goal)` — structurally impossible under the unique
    index, so the assertion is on the *counter*: the ledger''s queued tally after the replay equals
    the restored depth rather than twice it. The re-queue path is what is being tested, and it is the
    one place where "restored" and "re-derived" produce different numbers.

    '
  - '**F6 — the counters reach the observer per tier and are internally consistent.** A recording `Observer`
    over a two-tier fan-out receives `EventKind::Fleet` for tier 1 and tier 2 with distinct `tier` values;
    for every event, `working` never exceeds `max_concurrent_agents`; and the final event for each tier
    has `queued == 0` and `done` equal to the number of children that tier ran. The last one is what
    catches a counter that is decremented on the happy path only.

    '
  - '**F7 — `EVENT_NAMES` still equals the enum.** The census test in `src/observe.rs` passes with `Fleet`
    added, and `every_kind()` still produces one of every tag and no others. The added variant makes
    that test fail unless `EVENT_NAMES` gains its entry, which is the point of it.

    '
  - '**F8 — an adopted child takes a slot.** A tree resumed with one mid-flight child and a `max_concurrent_agents`
    of one: the adopted child runs, and the fresh siblings queue behind it rather than running alongside
    it. Without this the throttle would be a different number before and after a restart, which is the
    failure a durable queue exists to prevent.

    '
  - '**N3 — enqueue and admit cost one statement each, and neither is on the per-step path.** A child
    that is admitted immediately writes nothing: the `agent_queue` row exists only for a child that
    actually waits. Asserted by running a fan-out that never queues and requiring `agent_queue` to be
    empty throughout and afterwards.

    '
  files:
  - src/run.rs
  - src/observe.rs
  evidence:
  - '`spawn_child` is restructured around admission. The spawn-or-adopt lookup now decides only what
    kind of spawn this is; the containment refusal still runs ahead of admission, so a child the tree
    will never let exist does not first spend time in a queue; and admission sits between that decision
    and the child''s first store write, which is what makes "queued and never started" mean "no run
    row, no step rows, no tokens". Adopted children take a slot too, so the throttle is the same number
    before and after a restart.'
  - The slot is released with `drop(slot)` placed before the `?` on `run_agent` and before both early
    returns, so a child that finished, a child that paused on a human and a child whose error is propagating
    all free the slot and report the tier. A release on the happy path only is a fleet that stops draining
    the first time something goes wrong.
  - 'The per-step `.buffered(max_c)` becomes `.buffered(spawn_calls.len())`. That width was the old
    cap''s only teeth and it was a property of one parent''s step: two parents fanning out at once got
    twice the concurrency they asked for, and a child past the width was never queued — it just did
    not start, invisibly. Every spawn now reaches the ledger. `children_are_composed_in_spawn_order_not_completion_order`
    still passes, so `buffered` rather than `buffer_unordered` still holds the determinism 0.12.0 bought.'
  - '`EventKind::Fleet { tier, working, queued, done }` is emitted on enqueue, on admission and on completion,
    attributed to the parent''s run and the parent''s own `depth` with the tier in the payload — so
    `RunEvent::depth` keeps meaning "who emitted this" everywhere. `EVENT_NAMES` gained `"fleet"` and
    the source-reading census in `src/observe.rs` passes; `every_kind()` produces one of every tag and
    no others.'
  - Three tree-resume sites shared four lines of ledger restoration; they now share `restore_tree_ledger`,
    which also reads the backlog back and seeds the ledger with it, and `emit_backlog`, which reports
    it. In `resume_tree_observed` the backlog reaches the observer after `Started` and before `authorize_provider`,
    so it is emitted before the provider is authorised, let alone called.
  - 'The standing defect is fixed while this release was already in the function: `resume_tree_observed`
    now calls `record_run_policy`, recording the caller''s policy before the provider layer is merged
    in, exactly as `run_tree_observed` has always done. A tree resumed in a second process previously
    left no record of the boundary it was actually resumed under.'
  - '`cargo clippy --all-targets --all-features -- -D warnings` is clean (the `type_complexity` warning
    the two-value return raised is resolved by the `Backlog` alias, not by allowing the lint), and all
    14 existing `tests/subagents.rs` tests pass unchanged — including `concurrent_fanout_to_over_100_stays_bounded_and_completes`,
    whose 120-child fan-out under a cap of 16 now runs through the tier queue and still measures a peak
    at or below 16.'
- id: US-IO-HARNESS-0.32.0-T04
  summary: 'The evidence: `examples/fleet_fixture` for a real SIGKILL with a non-empty queue, and the
    tests that read the backlog back — including the deletion that discriminates a restored depth from
    a re-derived one, and the spend-row assertion that a queued child was never charged.'
  why_required: Every outcome assertion in this release passes whether the queue was restored or silently
    rebuilt from the replayed spawn calls. Without the absence assertion the durability claim is unproven,
    and an unproven durability claim is the one this contract must not make.
  status: done
  depends_on:
  - US-IO-HARNESS-0.32.0-T03
  acceptance_criteria:
  - '**F1 — the concurrency cap throttles and does not refuse.** A 120-child fan-out under `Containment
    { max_total_agents: 200, max_concurrent_agents: 8, .. }`: all 120 children run to completion, `store.children(root)`
    holds 120 rows, no `EventKind::SpawnRefused` is emitted, and an in-flight probe''s measured peak
    is greater than one and never above eight. Its negative control is the same fan-out under `max_total_agents:
    8`, which must refuse 112 spawns with `SpawnRefusal::AgentCap` — without it the test would pass
    against a harness that had simply stopped enforcing anything.

    '
  - '**F2 — the total cap still refuses, and the two caps are independent.** `max_total_agents: 8` with
    `max_concurrent_agents: 64` refuses at eight; `max_total_agents: 200` with `max_concurrent_agents:
    1` refuses nothing and runs strictly one child at a time (measured peak exactly one). Two named
    tests. A single test moving both numbers together could not tell which cap produced the behaviour.

    '
  - '**F3 — a queued child is not charged.** After a fan-out is killed mid-flight with the queue non-empty:
    every goal named in `Store::queued_agents` has no row in `runs` — asserted as a set difference against
    `Store::children`, so a queued goal appearing there fails — and `Store::spent_tokens_tree` equals
    the sum of the `steps.tokens` rows of the children that actually started, computed independently
    in the test. Asserted against the spend rows, not against the ledger counter, because the counter
    and the rows are two different claims and only the rows outlive the process.

    '
  - '**F4 — the queue survives a real restart at the depth it had, and the depth comes from the store.**
    `examples/fleet_fixture` runs a fan-out under `max_concurrent_agents: 1` whose admitted child parks
    forever, then parks itself; the test kills it with SIGKILL and opens the store in its own process.
    `Store::queued_agents` returns the waiting children, at their tier, in the order they queued.

    The discriminating assertion is an absence. Before resuming, the test deletes exactly one `agent_queue`
    row. The resumed run''s first `EventKind::Fleet` must report a backlog one smaller than the fixture
    left — and it must arrive before the resumed provider has been handed a single `CompletionRequest`.
    A depth silently re-derived from the replayed spawn calls would be unchanged by the deletion and
    could not exist before the first provider call; both facts are asserted, because either alone passes
    on a re-derivation.

    '
  - '**F5 — a replayed spawn does not double the backlog.** After the resume in F4 completes, no two
    `agent_queue` rows share a `(parent_run_id, step, goal)` — structurally impossible under the unique
    index, so the assertion is on the *counter*: the ledger''s queued tally after the replay equals
    the restored depth rather than twice it. The re-queue path is what is being tested, and it is the
    one place where "restored" and "re-derived" produce different numbers.

    '
  - '**F6 — the counters reach the observer per tier and are internally consistent.** A recording `Observer`
    over a two-tier fan-out receives `EventKind::Fleet` for tier 1 and tier 2 with distinct `tier` values;
    for every event, `working` never exceeds `max_concurrent_agents`; and the final event for each tier
    has `queued == 0` and `done` equal to the number of children that tier ran. The last one is what
    catches a counter that is decremented on the happy path only.

    '
  - '**F8 — an adopted child takes a slot.** A tree resumed with one mid-flight child and a `max_concurrent_agents`
    of one: the adopted child runs, and the fresh siblings queue behind it rather than running alongside
    it. Without this the throttle would be a different number before and after a restart, which is the
    failure a durable queue exists to prevent.

    '
  - '**F9 — cross-version compatibility, both directions.** A database written by a real 0.31.0 build
    opens, resumes and replays under 0.32.0 with nothing to migrate; and a 0.32.0 store carrying `agent_queue`
    rows is read by a 0.31.0 build, which never names the table. Proven with the pinned-generator technique
    `tests/cross_version.rs` already uses. The 0.22.0 schema guard is fed `agent_queue` and `agent_queue_entry`
    by name.

    '
  - '**N3 — enqueue and admit cost one statement each, and neither is on the per-step path.** A child
    that is admitted immediately writes nothing: the `agent_queue` row exists only for a child that
    actually waits. Asserted by running a fan-out that never queues and requiring `agent_queue` to be
    empty throughout and afterwards.

    '
  files:
  - examples/fleet_fixture.rs
  - tests/fleet.rs
  - tests/cross_version.rs
  evidence:
  - '`examples/fleet_fixture` is shaped so the kill lands with the queue full and keeps it full: one
    slot per tier, five children asked for in one step, and the child that wins the slot commits one
    real 90-token step and then parks forever. Verified against the store while it ran — two `runs`
    rows (the root and child-0), four `agent_queue` rows for child-1..4, and one `steps` row.'
  - 'Nine tests in `tests/fleet.rs`, ten with the fast-path case. F1 (120 children under a cap of 8:
    all 120 ran, zero refusals, measured peak 2..=8) is paired with its control (the same fan-out under
    `max_total_agents: 8` refuses 113 spawns with cap `agents`), and F2 adds the independent axis (`max_total_agents:
    200` with concurrency 1: nothing refused, measured peak exactly 1).'
  - 'F3 asserts the charge claim against the durable rows after a real SIGKILL: `children` holds one
    run, `queued_agents` holds exactly `child-1..4` in FIFO order at tier 1, `spent_tokens_tree` equals
    the admitted child''s own step tokens computed independently, and `agent_count_tree` is 2.'
  - F4 is the absence assertion. One `agent_queue` row is deleted from the killed fixture's store before
    the resume; the resumed run's first `EventKind::Fleet` must report 3 rather than the 4 the fixture
    left or the 5 the model is about to ask for, and it must precede the first `EventKind::Step`. A
    re-derived depth is unchanged by the deletion and cannot exist before the first provider call; both
    are asserted because either alone passes on a re-derivation.
  - Eight sabotages, each run against the whole file. S1 adoption takes another tier's slot -> 5 named
    tests fail. S2 the replay counts a restored wait as fresh -> F5 fails. S3 the backlog is never seeded
    into the ledger -> F4 and F5 fail. S4 `done` is never incremented -> F6 fails. S5 a restored row
    admitted immediately is never cleared -> the fast-path test fails. S6 an admitted child's row is
    never deleted -> F5 fails. S7 the per-step buffered width caps the fan-out again -> 5 named tests
    fail. S8 the slot is never released -> the 120-child fan-out under 8 slots never completes, which
    CI detects as a timeout rather than an assertion.
  - 'Two of those sabotages were run BEFORE the tests were finished and passed everything, and both
    exposed a real defect rather than a weak test. S3 passing was trap 23 landing exactly as the brief
    predicted: `emit_backlog` was reporting the row count it had just read instead of the restored ledger,
    so the event was true whether or not the ledger had been seeded. S5 passing exposed a genuine bug
    — a restored wait admitted through the immediate path never cleared its row, so a fully drained
    tree left rows behind and the reported backlog never reached zero. Both are fixed and both now have
    a named test that fails without the fix.'
  - '`ADDED_SINCE_0_22_0` in `tests/cross_version.rs` names `agent_queue` and `agent_queue_entry`, which
    the 0.22.0 schema guard requires by name — there is deliberately no prefix rule.'
- id: US-IO-HARNESS-0.32.0-T05
  summary: 'Documentation as part of the release: the changelog section the workflow reads verbatim,
    the rename and its semantic change in `docs/CONTRACT.md` and the guides, the per-tier ceiling stated
    where a reader will find it, the public-API snapshot, and the manifest version.'
  why_required: '`release.yml` refuses a version with no changelog section, and the per-tier ceiling
    is a limitation a reader must not have to derive from the source. The public-API snapshot is a build
    failure until `FleetTally` is in it.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.32.0-T04
  acceptance_criteria:
  - '**N4 — the break is exactly one, and it is in the changelog with a migration.** `Containment::max_concurrent`
    becomes `max_concurrent_agents`. A caller who wrote a struct literal renames one field; a caller
    who deserialises stored configuration changes nothing, because `#[serde(alias = "max_concurrent")]`
    keeps the old key readable. `EventKind` gains a variant, which is free under its `#[non_exhaustive]`.
    No public item is removed, so no deprecation cycle is owed. `tests/changelog.rs` and `tests/public_api.rs`
    both pass.

    '
  - '**N5 — every added public item carries a worked example**, enforced by the existing surface test:
    `FleetTally` and the renamed field both appear in compiling doctests.

    '
  - '**N6 — the wait graph is acyclic by construction, stated where a reader will find it.** The per-tier
    semaphore and the reason for it are documented on `Containment::max_concurrent_agents` and in `docs/CONTRACT.md`,
    including the honest consequence: the ceiling is per tier, so a tree of depth *d* can hold up to
    `max_concurrent_agents * d` agents working at once. A reader must not have to derive that from the
    source.

    '
  - '**O1 — the three-OS matrix is green** on the commit being released, including the MSRV 1.95 job.
    The SIGKILL fixture is Unix-shaped; its test is gated so Windows runs the store-level assertions
    rather than being skipped silently.

    '
  - '**O2 — docs.rs builds**, checked by the nightly job rather than inferred from a local `cargo doc`.

    '
  - '**O3 — `cargo package --locked` succeeds** and the packaged crate compiles.

    '
  files:
  - CHANGELOG.md
  - README.md
  - docs/CONTRACT.md
  - docs/public-api.txt
  - docs/guide/composition.md
  - docs/guide/observability.md
  - Cargo.toml
  - Cargo.lock
  evidence:
  - 'The changelog section for 0.32.0 exists, which `release.yml` requires before it will cut anything,
    and states the break twice over: the rename, and the semantic change underneath it. A caller relying
    on several parents each getting the full per-step width will now see a LOWER effective concurrency,
    and the entry says so and says to raise the number — a rename applied mechanically while the meaning
    moves is the worse half of this break.'
  - '`docs/CONTRACT.md` gains three entries under `Limits that hold today`: the per-tier ceiling with
    `max_concurrent_agents * d` spelled out, the queue''s total absence of policy beyond FIFO, and what
    a queued child costs in visibility (`Store::children` and `Store::agent_events` will not show it).
    The standing `resume_tree` defect is rewritten as fixed rather than deleted, so the history of the
    claim is still readable.'
  - '`docs/guide/composition.md` gains the two-caps-different-in-kind section and a fleet-watching section;
    `docs/guide/observability.md` gains the `Fleet` row in the event table and corrects `SpawnRefused`,
    which claimed `concurrency` was one of the caps that refuses. README''s composition paragraph names
    both caps and the durable queue.'
  - '`docs/public-api.txt` gains `struct FleetTally src/containment.rs`, without which `public_surface_matches_snapshot`
