product: io-harness
version: 0.19.0
tasks:
  - id: US-IO-HARNESS-0.19.0-T01
    summary: >
      The `config` module's spine: the four scopes and where each is found, TOML parsing through the
      new `toml` dependency, per-file validation so an error names its file, and the deep merge that
      resolves them key by key with the later scope winning.
    why_required: >
      Every other task projects a value out of the merged result. Without the scopes and the merge
      there is nothing to project from, and the merge rule is what the outcome actually promises —
      a project file a collaborator inherits and a local file that overrides one key of it.
    status: todo
    depends_on: []
    acceptance_criteria:
      - >
        F1 — the four scopes merge in order. A fixture with all four present, each setting the same
        scalar to a different value, resolves to the local file's value; removing the local file
        resolves to the project's; removing that resolves to the user's; removing that resolves to
        the crate default. Asserted as four loads over the same directory, so the test measures
        precedence rather than one file being read.
      - >
        F2 — a later scope overrides one key and nothing else. A local file naming a single sandbox
        cap leaves every other cap and every other section at the project file's value. The negative
        control is the same load with the local file absent, which must differ in exactly that one
        key.
      - >
        F10 — no config file is no error. A workspace with no `io.toml`, no local file and no user
        file loads the crate's defaults and produces exactly what the typed API produces with no
        config at all, so adding this release to an existing consumer changes nothing until they
        write a file.
    files:
      - src/config.rs
      - src/lib.rs
      - Cargo.toml
    evidence: []
  - id: US-IO-HARNESS-0.19.0-T02
    summary: >
      Unknown-key rejection and `${env:...}` / `${file:...}` substitution, both failing the load with
      an error that names the key and the file rather than a byte offset, and neither ever producing
      an empty string.
    why_required: >
      A config that silently ignores a misspelled permission rule leaves an operator believing in a
      boundary that is not there, and a substitution that quietly empties turns a rule into one that
      matches nothing. These two are the difference between a config layer that can be trusted with
      a boundary and one that cannot.
    status: todo
    depends_on:
      - US-IO-HARNESS-0.19.0-T01
    acceptance_criteria:
      - >
        F5 — an unknown key fails the load. A file carrying a misspelled key is rejected with an
        error naming the key and the file. The negative control is the correctly spelled key, which
        loads and reaches its typed field — so the test proves rejection of the unknown rather than
        rejection in general.
      - >
        F6 — substitution resolves or fails, never empties. `${env:SET_VAR}` reaches the typed field
        with the variable's value; `${env:UNSET_VAR}` fails the load naming the key;
        `${file:./secret}` reaches the field with the file's trimmed contents; `${file:./missing}`
        fails the load naming the key. An empty string is never the result of a failed substitution.
    files:
      - src/config.rs
    evidence: []
  - id: US-IO-HARNESS-0.19.0-T03
    summary: >
      Projection onto `Policy` and `SandboxConfig`: policy layers append in scope order under the
      type's own layering rule, sandbox caps merge per key, and a run driven from the file enforces
      the same boundary as the identical policy built in Rust.
    why_required: >
      The boundary is the part of the outcome that matters most and the part a wrong merge damages
      silently. A layer that replaced rather than appended, or a cap that fell back whole, would
      leave the file describing a boundary the run does not have.
    status: todo
    depends_on:
      - US-IO-HARNESS-0.19.0-T01
    acceptance_criteria:
      - >
        F3 — the boundary a file describes is the boundary a run enforces. A run driven from a config
        whose policy denies a write refuses that write with the same refusal, recorded the same way
        in the trace, as the identical policy built in Rust. Asserted through a real run, not by
        comparing two `Policy` values.
      - >
        F4 — policy layers append rather than replace. A project file's layer and a local file's
        layer are both present after the merge, in scope order, and the type's own rule that a later
        layer cannot re-allow an earlier deny still holds across the seam. The negative control is a
        local layer attempting to re-allow a project deny, which must not take effect.
    files:
      - src/config.rs
      - tests/config.rs
    evidence: []
  - id: US-IO-HARNESS-0.19.0-T04
    summary: >
      The run-shaping half: `Serialize`/`Deserialize` on `RetryPolicy`, `StallPolicy`,
      `ContextBudget` and `Identity` with a readable wire form for the `Duration` fields, and
      `Config::apply_to`, which sets those and the budgets, the exec timeout, the skills directory
      and the MCP servers on a `TaskContract`.
    why_required: >
      Budgets and retry behaviour are the settings an operator changes most often and the ones they
      currently have to recompile to change. They also have to land as a method on `Config` rather
      than a new `TaskContract` field, because a field is a break and this release carries none.
    status: todo
    depends_on:
      - US-IO-HARNESS-0.19.0-T01
    acceptance_criteria:
      - >
        F7 — every key reaches a typed field. A fixture naming every supported key loads and each
        projected value is asserted non-default: policy defaults and rules, every sandbox cap and
        both flags, every run-shaping default, a toolchain override, a price entry, and an MCP
        server. The negative control is a build of the same fixture with one key removed, which must
        leave that one field at its default.
    files:
      - src/config.rs
      - src/resilience.rs
      - src/context.rs
      - src/tools/git.rs
    evidence: []
  - id: US-IO-HARNESS-0.19.0-T05
    summary: >
      The `[toolchain]` and `[prices]` sections: an override merged onto a detected `Toolchain` by
      ecosystem, and a `PriceTable` built from the file with the file's own `as_of` date.
    why_required: >
      These are the two tables the previous two releases shipped as types with no way to fill them.
      `PriceTable` ships deliberately empty, so cost is zero out of the box until someone types a
      price in, and a file is the only place that price was ever going to come from.
    status: todo
    depends_on:
      - US-IO-HARNESS-0.19.0-T01
    acceptance_criteria:
      - >
        F8 — the file fills the two tables the previous releases could not. A `[prices]` section
        produces a `PriceTable` whose `as_of` is the file's own stated date and whose entry costs a
        fixture trace at the hand-computed figure, and a `[toolchain]` section overrides one
        ecosystem's test command while leaving the other ecosystems' shipped defaults intact.
    files:
      - src/config.rs
      - tests/config.rs
    evidence: []
  - id: US-IO-HARNESS-0.19.0-T06
    summary: >
      The two honesty criteria: a config file written by the agent mid-run cannot widen the boundary
      the run is under, and nothing is read from disk for configuration once the caller has loaded it.
    why_required: >
      The one guarantee this release can actually make about an agent and a config file is that the
      file is read once, by the caller, before the run. If that is not true, the whole feature is a
      way for an agent to grant itself permissions.
    status: todo
    depends_on:
      - US-IO-HARNESS-0.19.0-T03
    acceptance_criteria:
      - >
        F9 — an agent cannot widen its own boundary. A run under a config-derived restrictive policy,
        in which the agent writes an `io.local.toml` granting itself the denied write, still refuses
        the write. The negative control is the same file present *before* the caller loads the
        config, which must take effect — the difference between the two is the whole guarantee.
      - >
        NF3 — nothing is read at run time. Config loading happens in the caller's explicit call; the
        run loop performs no file read for configuration, asserted by a run that deletes both config
        files after loading and completes unaffected.
    files:
      - tests/config.rs
    evidence: []
  - id: US-IO-HARNESS-0.19.0-T07
    summary: >
      Documentation and the public surface: the configuration guide page, the CONTRACT.md boundary
      statements, the changelog with the new dependency and the new `cargo tree` baseline, the
      hand-updated `docs/public-api.txt`, the README and crate-root links, and `io.local.toml` in
      `.gitignore`.
    why_required: >
      A config format nobody can read the key reference for is a format nobody can use, and the
      scope split fails outright if a team commits the local file. The public-surface snapshot is a
      build failure until it is updated by hand, which is the mechanism, not a formality.
    status: todo
    depends_on:
      - US-IO-HARNESS-0.19.0-T04
      - US-IO-HARNESS-0.19.0-T05
    acceptance_criteria:
      - >
        OP1 — `docs/public-api.txt` is updated by hand and `tests/public_api.rs` passes against the
        live surface, and every added public item carries a fenced worked example, enforced by the
        existing docs test.
      - >
        OP2 — `docs/guide/configuration.md` exists, is linked from the README and the crate root,
        lists every key with its typed destination, and is covered by the existing guide-pages test.
      - >
        OP3 — `docs/CONTRACT.md` states what configuration is: the typed API is the authority and
        the file is a projection onto it; the file is read once, by the caller, before the run, and
        never again; an unknown key is an error; a failed substitution is an error; and a config file
        is not a security boundary against the agent — the boundary is the `Policy` the caller loaded
        before the run started.
      - >
        OP4 — `.gitignore` carries `io.local.toml` and the guide says plainly which of the two
        project files is meant to be committed, because the whole scope split fails if a team commits
        the local one.
      - >
        NF6 — no public item is removed or renamed, so `docs/public-api.txt` grows and nothing in it
        changes meaning. This release carries no break and no `#[deprecated]`.
    files:
      - docs/guide/configuration.md
      - docs/CONTRACT.md
      - docs/public-api.txt
      - CHANGELOG.md
      - README.md
      - src/lib.rs
      - .gitignore
    evidence: []
  - id: US-IO-HARNESS-0.19.0-T08
    summary: >
      The release gates: the full suite on every feature combination, clippy, fmt, a warning-free
      `cargo doc`, the measured `cargo tree` baseline before and after, and the store and
      checkpoint-format assertions.
    why_required: >
      The dependency growth is the one cost this release imposes on every consumer, and a number
      discovered by a consumer rather than stated by the changelog is the failure the constraint
      exists to prevent.
    status: todo
    depends_on:
      - US-IO-HARNESS-0.19.0-T07
    acceptance_criteria:
      - >
        NF1 — the dependency growth is stated, not discovered. The default `cargo tree` line count is
        measured before and after, the new number recorded in the contract's evidence, the constraint
        updated from 401 to that number, and the crates it adds are named in the changelog. `toml` is
        the only new dependency this release adds.
      - >
        NF2 — no store change and no format bump. `CHECKPOINT_FORMAT` stays 7, no `CREATE TABLE` and
        no `ALTER TABLE` is added, and a 0.18.0 database opens, resumes and is queried against 0.19.0
        unchanged.
      - >
        NF5 — `cargo clippy --all-targets --all-features -- -D warnings` and `cargo fmt --check`
        pass, and `cargo doc --all-features` is warning-free.
    files:
      - .ultraship/evidence/0.19.0
    evidence: []
  - id: US-IO-HARNESS-0.19.0-T09
    summary: >
      The live run: a real task against a real provider, driven entirely from an `io.toml` rather
      than from Rust, with its trace kept as evidence.
    why_required: >
      The suite proves the projection against fixtures. Only a live run proves that an operator can
      actually drive this harness from a file, which is the sentence the release is for.
    status: todo
    depends_on:
      - US-IO-HARNESS-0.19.0-T08
    acceptance_criteria:
      - >
        OP5 — a live run against a real provider, driven from an `io.toml` rather than from Rust, is
        performed by hand before the release is cut and its trace kept as evidence. The suite proves
        the projection; only a live run proves an operator can actually drive the harness from a file.
    files:
      - examples/config_live.rs
    evidence: []
