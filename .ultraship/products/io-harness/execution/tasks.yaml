product: io-harness
version: 0.58.0
tasks:
  - id: US-IO-HARNESS-0.58.0-T01
    summary: The size half — `SessionSize`, `StoreSize`, and the one additive index every retention
      call enters through.
    why_required: >
     Two later criteria are equalities against these numbers rather than assertions of their own —
     `Pruned::bytes` is checked against the size read immediately before the deletion, and the
     compaction is proved by three reads of the same store size. If the size call is wrong the
     deletion and the compaction cannot be proved at all. It is also the half that delivers "an
     operator can see what a store is holding" on its own.
    status: done
    depends_on: []
    acceptance_criteria:
      - >
        **F13 — the size call is exact about what it counts.** For a store built with known content,
        `SessionSize::bytes` equals the summed `length()` of the seeded values, computed independently in
        the test, and `rows` equals the seeded row count. `StoreSize::file_bytes` equals
        `page_size × page_count` read directly. Sabotage: count only the tables with an obvious text
        column, under which the independent sum disagrees and only F13 fails.
    evidence:
    - "`the_size_of_a_session_is_the_bytes_of_its_own_rows`,
      `the_size_of_a_store_is_the_files_own_page_arithmetic`,
      `the_size_of_a_session_that_is_not_there_is_none` and
      `a_seeded_run_can_be_put_into_every_status_the_sweep_reads` in `tests/retention.rs` — 4 passed."
    - "The independence F13 claims is real on the dimension that can actually go wrong: the crate sums
      over a static `RUN_TABLES` list, and the test sums over `sqlite_master`, so a table missing from
      the crate's list makes the two disagree. Both read columns from `PRAGMA table_info`, which is
      what keeps a column added by a later release counted without anyone remembering to."
    - "`dbstat` answers on this build, as the premise check predicted — the per-table breakdown is
      non-empty and sums to no more than the file's own bytes."
    files:
      - src/state.rs
      - src/lib.rs
      - tests/retention.rs

  - id: US-IO-HARNESS-0.58.0-T02
    summary: Deletion — the transitive run set, the cascade over every table, one transaction, and
      the schema-driven guard that a table was not missed.
    why_required: >
     This is the instrument the release exists for, and the guard is the release's central risk:
     the schema declares one foreign key and never enables `PRAGMA foreign_keys`, so a forgotten
     table produces unreachable rows and no error at all.
    status: done
    depends_on:
      - US-IO-HARNESS-0.58.0-T01
    acceptance_criteria:
      - >
        **F1 — a deleted session leaves no row anywhere, and the check is driven from the schema.** A
        store holding three sessions loses one. Every table named by
        `SELECT name FROM sqlite_master WHERE type='table'` is then queried for rows belonging to that
        session's runs, and every one is empty. The test enumerates the schema at run time, so a table
        added by a later release fails this test until its deletion is written. Sabotage: drop any one
        table from the cascade, under which only F1 fails — and it must fail for that table by name.
      - >
        **F2 — the sibling sessions are untouched, row for row.** Before and after the deletion, a
        per-table row count for the surviving sessions is identical, and `Store::session_size` returns
        the same numbers for them. Sabotage: delete by run id without constraining to the session's own
        run set, under which the siblings lose rows and only F2 fails.
      - >
        **F3 — a spawned child goes with the parent that spawned it.** A session whose turn drove a run
        that spawned two children, one of which spawned a third, loses all four runs and every row under
        them. Asserted on the run ids from the tree rather than on a count. Sabotage: take the run set
        from `session_turns.run_id` alone without the recursive walk, under which the three children
        survive as orphans and only F3 fails.
      - >
        **F4 — the deletion is one transaction.** A failure injected partway through the cascade leaves
        the store exactly as it was — every table's row count unchanged, the session still readable.
        Asserted by driving the failure, not by reading the code for a `tx`. Sabotage: commit per table,
        under which the store is left half-deleted and only F4 fails.
      - >
        **F5 — `Pruned` reports what actually went.** Its counts equal the row counts measured before
        the deletion, and its `bytes` equals the `SessionSize::bytes` read immediately before. The
        restore-point count equals the `snapshots` rows the session held. Sabotage: report the number of
        tables touched rather than the rows removed, under which the equality fails and only F5 fails.
      - >
        **F14 — a session that is not in the store is `None`, not an error and not a zero.** A size call
        for an unknown id returns `None`; a deletion for an unknown id returns a `Pruned` whose counts
        are all zero and does not fail. The two answers differ on purpose: asking the size of nothing has
        no answer, and deleting nothing succeeds. Sabotage: return `Some` with zeroes, under which the
        distinction collapses and only F14 fails.
    evidence:
    - "`a_deleted_session_leaves_no_row_in_any_table_the_schema_names` (F1),
      `deleting_one_session_leaves_the_others_row_for_row` (F2),
      `a_spawned_child_goes_with_the_parent_that_spawned_it` (F3),
      `a_deletion_that_fails_partway_leaves_the_store_exactly_as_it_was` (F4),
      `the_pruned_report_equals_what_the_store_held_a_moment_earlier` (F5) and
      `deleting_a_session_that_is_not_there_succeeds_and_reports_nothing` (F14) in
      `tests/retention.rs` — 10 passed with T01's four."
    - "F4 injects its failure with a `BEFORE DELETE` trigger on `summaries` that RAISEs — a real abort
      from inside the cascade rather than a mock, and the store is asserted whole afterwards."
    - "F5 caught a real inconsistency before it shipped: `Pruned` counted the session row and
      `SessionSize` did not, so the two figures for one session differed by one. They are now the same
      measure, which is the only way F5's equality means anything."
    - "F3 drives real spawned children through `start_child_run`, two levels deep, and asserts on the
      run ids from the tree rather than on a count."
    files:
      - src/state.rs
      - src/lib.rs
      - tests/retention.rs

  - id: US-IO-HARNESS-0.58.0-T03
    summary: The sweep — one cutoff, one pass over the schema, and a resumable run refused by name.
    why_required: >
     "Keep ninety days" is the shape the retention decision actually takes, and the refusal is the
     rule that stops this release destroying a crash-resumable tree because it was old. The
     one-pass requirement forbids the natural implementation, so it has to be built in rather than
     optimised later.
    status: todo
    depends_on:
      - US-IO-HARNESS-0.58.0-T02
    acceptance_criteria:
      - >
        **F6 — a sweep refuses a session holding a resumable run and names it.** Three sessions older
        than the cutoff, one of which holds a run in `Paused` and another a run in `Running`. Both are
        in `Pruned::refused`, both are still readable afterwards with identical row counts, and the third
        is gone. A session holding only `Completed` and `Failed` runs is swept. Sabotage: filter on
        `Running` alone, under which the paused session is deleted and only F6 fails.
      - >
        **F7 — a session newer than the cutoff is not swept, and the boundary is asserted exactly.** A
        session whose `created_at` equals the cutoff string survives, because the comparison is strictly
        before. Asserted with a pair of sessions one millisecond apart around the cutoff, not with a
        pair a day apart. Sabotage: `<=`, under which the boundary session goes and only F7 fails.
      - >
        **F8 — a sweep of many sessions is one pass over the schema.** Asserted structurally, not on a
        clock: the number of `DELETE` statements executed for a sweep of ten sessions equals the number
        executed for a sweep of one, counted through the connection's own trace hook. This is the
        criterion that forbids the natural implementation — loop over the sessions calling
        `delete_session` — and it is the reason `Pruned` accumulates rather than being returned per
        session. Sabotage: loop per session, under which the statement count scales with the sessions
        and only F8 fails.
    evidence: []
    files:
      - src/state.rs
      - tests/retention.rs

  - id: US-IO-HARNESS-0.58.0-T04
    summary: Archiving — every row kept, every column holding words emptied, and a restore point that
      says so instead of writing an empty file.
    why_required: >
     This is the half that cannot be assembled from outside the crate, because it needs to know
     which of a hundred and forty columns hold words. It is also the half with a way to destroy
     something outside the database, which F11 is the guard against.
    status: todo
    depends_on:
      - US-IO-HARNESS-0.58.0-T02
    acceptance_criteria:
      - >
        **F9 — an archived session keeps every row and every number, and holds no words.** After
        archiving: the per-table row counts are unchanged; `provider_calls` still answers the same token
        and cost totals; `edits` still names the same paths with the same line counts; `run_outcomes`
        still holds the same verdicts. Then a needle sweep — for every table and every `TEXT` or `BLOB`
        column named by `PRAGMA table_info`, no value contains any of the fixture's distinctive phrases,
        which are seeded into the prompt, the reply, a tool result, a summary, a snapshot's content and
        an edit's hunk. Sabotage: empty `session_turns` only, under which the needles survive in
        `steps.prompt` and only F9's second half fails.
      - >
        **F10 — archiving is idempotent and reports honestly the second time.** Archiving an
        already-archived session clears zero rows and zero bytes and returns without error. Sabotage:
        report the same counts on both calls, under which the second assertion fails and only F10 fails.
      - >
        **F11 — an archived restore point says so rather than restoring nothing.** A run whose snapshot
        content was archived, reached by a restore path, reports `Reverted::Stale` with a reason naming
        the archive, and the file on disk is byte-identical to what it was before the attempt. This is
        the criterion that makes archiving safe to offer at all: writing an empty string over a real
        file is the one way this release could destroy something outside the database. Sabotage: leave
        `snapshots.state` unchanged on archive, under which the empty content is written and only F11
        fails.
    evidence: []
    files:
      - src/state.rs
      - src/lib.rs
      - src/run.rs
      - tests/retention.rs

  - id: US-IO-HARNESS-0.58.0-T05
    summary: Compaction — `VACUUM` as a call an operator makes knowingly, returning what the file
      actually shrank by.
    why_required: >
     SQLite frees pages into the file rather than out of it, so a prune that leaves the file the
     size it was has not done what the operator asked. Without this the release's own instrument
     looks broken to the person using it.
    status: todo
    depends_on:
      - US-IO-HARNESS-0.58.0-T02
    acceptance_criteria:
      - >
        **F12 — a prune alone does not shrink the file and a compaction does.** `Store::store_size` read
        three times: before the deletion, after it, and after `Store::compact`. The file's bytes are
        unchanged by the deletion and the free bytes rise; after the compaction the file's bytes have
        fallen and the free bytes are near zero. `Store::compact` returns the difference. This is the
        assertion that justifies compaction being in the release rather than a note in the guide.
        Sabotage: return the freelist figure instead of the measured difference, under which the returned
        value disagrees with the two reads and only F12 fails.
    evidence: []
    files:
      - src/state.rs
      - tests/retention.rs

  - id: US-IO-HARNESS-0.58.0-T06
    summary: The checked-in surfaces, the measurements, and every gate the release is judged on.
    why_required: >
     The contract makes the docs and the gates part of this release rather than the next one, and
     two of them are load-bearing this time: the cross-version gate is what proves an index and
     thirty-three cascades did not break a binary reading the same file, and the doc gates have to
     run again after the version bump because 0.57.0 shipped five red jobs by not doing that.
    status: todo
    depends_on:
      - US-IO-HARNESS-0.58.0-T03
      - US-IO-HARNESS-0.58.0-T04
      - US-IO-HARNESS-0.58.0-T05
    acceptance_criteria:
      - >
        **N1 — no new dependency.** `cargo tree` stays at **402** lines on the default build. This
        release is SQL, one recursive CTE the crate already writes, and `dbstat`, which is compiled into
        the bundled SQLite the crate already links.
      - >
        **N2 — the public surface addition is stated in advance.** `docs/public-api.txt` tracks
        crate-root re-exports. The prediction is **+4 lines** — `SessionSize`, `StoreSize`, `Pruned`,
        `Archived`. The six methods are on `Store`, which is already exported, and add nothing to the
        snapshot. Any difference is explained in the record rather than absorbed.
      - >
        **N3 — the schema change is one index and nothing else.** `git diff main -- src/state.rs` shows
        `CREATE INDEX IF NOT EXISTS session_turns_session ON session_turns (session_id)` and **no new
        table, no new column, no dropped column and no `CHECKPOINT_FORMAT` movement**. A 0.57.0 binary
        reads a 0.58.0 store and a 0.58.0 binary reads a 0.57.0 store.
      - >
        **N4 — zero compile breaks.** Four new types, six new methods, one new index, one new value in an
        existing `TEXT` column. No existing signature changes shape and no enum gains a variant —
        `Reverted::Stale` already carries a `String`, which is what F11 rests on.
      - >
        **N5 — the cost of a deletion is measured and recorded, never asserted.** The time to delete one
        session is measured at three store sizes — a session of 10, 100 and 1,000 steps, in a store
        holding ten such sessions — on a named machine, in `docs/MEASUREMENTS.md` with the method. The
        shape to expect is stated in advance: **linear in the rows removed and linear in the number of
        tables, with a full scan of each table that carries no `run_id` index**, which is most of them.
        A timing that does not move when the rows grow tenfold is a defect report and not a pass — the
        standing lesson of 0.56.0's N5. The sweep is measured at ten sessions beside it, and F8 is what
        makes that number meaningful rather than accidental.
      - >
        **N6 — the compaction's cost and its space requirement are recorded.** The time to `VACUUM` a
        store of a stated size, and the peak extra disk the operation takes, measured and written where
        the operator decides whether to call it. This is a number an operator needs before running it on
        a large file, and it is the reason the call is separate.
      - >
        **O1 — the three-platform matrix is green**, `--all-features` included.
      - >
        **O2 — nothing in the suite gates on a wall clock.** N5 and N6 are recorded, never asserted. F8
        asserts a statement count rather than a duration, which is the whole reason it is written that
        way. Stores are built by construction rather than by driving providers.
      - >
        **O3 — the cross-version gate runs, and it is the gate that matters most this release.**
        `cargo build --manifest-path tests/fixtures/gen-0.29.0/Cargo.toml` then
        `cargo test --test cross_version_0_29_0 -- --ignored`. A release that deletes rows across
        thirty-three tables and adds an index is exactly the shape that breaks a binary reading the same
        file, and the gate is what proves it did not.
      - >
        **O4 — `docs/CONTRACT.md` gains a retention section, by name.** What a deletion takes, what it
        leaves (notes, and anything reachable from no session), what an archive keeps, what refuses to
        be swept, and the statement that nothing expires on its own. The contract has never spoken about
        removal because there was nothing to say.
      - >
        **O5 — the nightly rustdoc gate passes with `-D warnings`.**
        `RUSTDOCFLAGS="--cfg docsrs -D warnings" cargo +nightly doc --all-features --no-deps`, run
        **after** the version bump as well as before it. It has found something in seven of the last
        nine releases.
      - >
        **O6 — the checked-in doc surfaces are updated in this release.** A retention page in
        `docs/guide/`, `docs/CAPABILITIES.md`, `docs/MEASUREMENTS.md`, `docs/CONTRACT.md`, the README's
        description of what the store holds, and the changelog. Every new public item carries a worked
        example; `cargo test --doc` and `tests/public_api.rs` pass.
      - >
        **O7 — clippy on all three feature polarities**, default, one feature on, and `--all-features`.
      - >
        **O8 — the doc gates are re-run after the version bump.** 0.57.0 shipped a first CI round with
        five red jobs because `readme_dependency_version_matches_cargo_toml` compares the README's pin to
        `Cargo.toml` and the bump happens during `complete`, after the doc gates ran. The gates run
        again on the bumped tree before the PR is opened.
    evidence: []
    files:
      - docs/CONTRACT.md
      - docs/CAPABILITIES.md
      - docs/MEASUREMENTS.md
      - docs/public-api.txt
      - docs/guide/retention.md
      - README.md
      - CHANGELOG.md
