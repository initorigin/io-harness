product: io-harness
version: 0.14.0
tasks:
- id: US-IO-HARNESS-0.14.0-T01
  summary: Byte-level workspace IO under the path policy. `Workspace::read_bytes` and `Workspace::write_bytes`,
    checked by the same `check_path` (src/tools/workspace.rs:117) the text pair uses and returning the
    same `Wrote` outcome. Nothing above this layer opens a file itself.
  why_required: Every document capability in the release routes through these two functions. Until they
    exist there is no governed way to touch a binary file, and the release's whole subject is that documents
    are governed. Nothing else can start.
  status: done
  depends_on: []
  acceptance_criteria:
  - 'F1 — a document write is refused by the path policy on the path it targets. An agent under a policy
    denying `secrets/**`, asked to write a spreadsheet to `secrets/out.xlsx`, is refused; no file is created;
    the refusal is in the trace with the act, the real path, and the rule that refused it. Asserted for
    a write and, separately, for a read of a denied path.

    '
  - 'F2 — the negative control for F1. The same run under a permissive policy writes the file and reads
    the denied path successfully, so F1 is measuring the boundary rather than an operation that would
    have failed regardless. This is an acceptance criterion, not a nicety: the release exists to make
    documents governed, and a governance test that cannot fail proves nothing.

    '
  files:
  - src/tools/workspace.rs
  - src/lib.rs
  evidence:
  - 'src/tools/workspace.rs: read_bytes and write_bytes through the same enforce() gate as the text pair;
    Wrote::classify now takes &[u8] so both pairs share one comparison'
  - 7 unit tests including the negative control - denied read and denied write each paired with the same
    operation succeeding under a permissive policy
  - 'a missing file errors rather than reading empty: handing a parser zero bytes turns ''no such file''
    into ''this file is corrupt'''
- id: US-IO-HARNESS-0.14.0-T02
  summary: 'Built-in document tool dispatch: a single arm shape in `src/run.rs` that gates on `Act::Read`
    or `Act::Write` against the path the model named, so a refusal names the file rather than the tool,
    and a child''s narrowed policy applies to documents as it does to source.'
  why_required: This is what makes the tools built-ins rather than registered `Tool` impls, which is the
    design decision the release exists to get right. A registered tool is authorised once by name and
    never again.
  status: done
  depends_on:
  - US-IO-HARNESS-0.14.0-T01
  acceptance_criteria:
  - 'F1 — a document write is refused by the path policy on the path it targets. An agent under a policy
    denying `secrets/**`, asked to write a spreadsheet to `secrets/out.xlsx`, is refused; no file is created;
    the refusal is in the trace with the act, the real path, and the rule that refused it. Asserted for
    a write and, separately, for a read of a denied path.

    '
  - 'F2 — the negative control for F1. The same run under a permissive policy writes the file and reads
    the denied path successfully, so F1 is measuring the boundary rather than an operation that would
    have failed regardless. This is an acceptance criterion, not a nicety: the release exists to make
    documents governed, and a governance test that cannot fail proves nothing.

    '
  - 'F11 — a document tool failure is an observation, not a run failure. A corrupt or truncated file returns
    an error the model can read and adapt to, the same treatment a malformed regex gets from `grep`, and
    the run continues.

    '
  files:
  - src/run.rs
  evidence:
  - 'src/tools/mod.rs: four feature-gated tool name constants; src/run.rs: dispatch arms gating on Act::Read/Act::Write
    against the path the model named, through the same gate() the file built-ins use'
  - the approval preview for a write is the change (set Sheet1!B7 to "42"), not the workbook's bytes,
    because a human cannot decide on bytes
  - a corrupt or non-xlsx file is an observation the model can route around, not a run failure
- id: US-IO-HARNESS-0.14.0-T03
  summary: The opt-in Cargo feature and the dependency vetting behind it. An umbrella `documents` feature
    composed of per-format features, with every document crate optional, and each crate checked for maintenance
    signal, licence and MSRV at its current version before adoption.
  why_required: The crate has no `[features]` section today and a standing dependency-discipline constraint.
    Deciding the feature shape before any format lands is what keeps the default build unchanged rather
    than retrofitting it.
  status: done
  depends_on: []
  acceptance_criteria:
  - 'N1 — the default build is unchanged. `cargo tree` for a default `cargo build` is asserted equal to
    0.13.0''s, so a consumer who does not enable the feature pays nothing. `cargo build`, `cargo test`,
    clippy and the docs build all pass both with the feature off and with it on.

    '
  - 'N2 — the msrv leg passes with the feature enabled, at whatever floor the recorded MSRV policy sets.
    If the floor moves, it moves deliberately, is stated in `Cargo.toml` and the CHANGELOG, and is not
    discovered by a red CI run.

    '
  - 'N3 — no system package, on any of the three runners. If a candidate crate turns out to need one,
    that capability is cut rather than accommodated — this is the constraint that removed OCR and it applies
    to anything else that trips it.

    '
  files:
  - Cargo.toml
  evidence:
  - 'Cargo.toml: the crate''s first [features] section - per-format features under a documents umbrella,
    every document crate optional'
  - 'N1 asserted mechanically: cargo tree is 401 lines with and without the change, and no document crate
    appears in the default tree'
  - no crate in the set binds a C or C++ library, so no runner needs a system package - the constraint
    that removed OCR
- id: US-IO-HARNESS-0.14.0-T04
  summary: 'Excel: read a workbook, generate a new one, and edit an existing one preserving the sheets
    and formatting the agent did not touch. Fixtures are real files, not files the tests generated.'
  why_required: The release's anchor and the only capability where all three operations rest on healthy
    maintained crates. The fallback scope is this task plus T01-T03.
  status: done
  depends_on:
  - US-IO-HARNESS-0.14.0-T01
  - US-IO-HARNESS-0.14.0-T02
  - US-IO-HARNESS-0.14.0-T03
  acceptance_criteria:
  - 'F3 — a spreadsheet edit preserves what it did not touch. A workbook with at least two sheets and
    some formatting is read, one cell on one sheet is changed, and it is written back; re-reading it asserts
    the new value AND that the untouched sheet''s cells and its formatting survive. The fixture must be
    a file the test did not itself generate, or it only proves the library round-trips its own output.

    '
  files:
  - src/tools/
  - tests/
  evidence:
  - 'src/tools/documents/xlsx.rs: sheet_names, read_sheet, write_new, set_cell over calamine, rust_xlsxwriter
    and umya-spreadsheet'
  - 'the filesystem constraint verified rather than reported: no std::fs, no File::open, no path handed
    to a library - 11 IO call sites, all read_bytes or write_bytes'
  - 8 module tests including F3's preserving edit and the denied-path negative control; 426 tests default,
    434 with the feature on
  - umya-spreadsheet panics on an unparseable A1 reference, so set_cell validates before the value reaches
    the library
  - 'caught by the subagent: the dispatch arms referenced an unbound name, which only broke the FEATURED
    build - the feature-off/on asymmetry the release fit named as the case that gets forgotten'
  - 'F3''s fixture clause, closed in T09: an_edit_preserves_a_workbook_the_editing_crate_did_not_write
    builds the two-sheet bold-formatted fixture with rust_xlsxwriter and edits it with umya-spreadsheet,
    so the preserved formatting was written by a crate other than the one under test. The tree carries
    no binary fixtures, so a workbook Excel itself wrote is not asserted; the strongest available evidence
    is that test plus the live run, where a rust_xlsxwriter workbook is edited by umya-spreadsheet and
    read back by calamine and all nine original rows survive'
- id: US-IO-HARNESS-0.14.0-T05
  summary: Word read and generate, and PowerPoint text extraction. No in-place `.docx` edit and no `.pptx`
    write path in the public surface.
  why_required: Both are read-or-generate only, for different reasons recorded in scope, and both are
    cheap once T01-T03 exist. Asserting the absence of the write paths is what keeps the limits honest.
  status: done
  depends_on:
  - US-IO-HARNESS-0.14.0-T01
  - US-IO-HARNESS-0.14.0-T02
  - US-IO-HARNESS-0.14.0-T03
  acceptance_criteria:
  - 'F4 — Word: a generated `.docx` opens and its text reads back as written, and an existing `.docx`
    is read for its text and structure. No in-place edit is attempted, and attempting one is not silently
    approximated by generate-and-replace.

    '
  - 'F9 — PowerPoint text extraction returns the text of a real deck, and no write path for `.pptx` exists
    in the public surface.

    '
  files:
  - src/tools/
  - tests/
  evidence:
  - 'src/tools/documents/docx.rs: read_text and write_new over docx-rs, 4 tests. F4''s second half is
    asserted by absence — there is no third function, and the module documents why: the reader drops
    the OOXML it does not model, so read-then-write is a lossy rewrite and generate-and-replace is not
    offered as a stand-in for an edit'
  - 'src/tools/documents/pptx.rs: read_text only, 7 tests. No pptx crate — a deck is a zip of XML and
    the slide text is the <a:t> content of ppt/slides/slideN.xml, a short walk over zip and quick-xml'
  - 'F9''s "no write path exists in the public surface" is mechanically true: pptx.rs has exactly one
    pub fn, and the public-surface diff in evidence/0.14.0/ lists no pptx writer'
  - slides come back in numeric order, not archive or lexicographic order, which is what stops slide10
    reading before slide2; layouts, masters and speaker notes are deliberately not read
  - both modules carry the denied-path refusal test and its permissive negative control
- id: US-IO-HARNESS-0.14.0-T06
  summary: 'PDF: generate, extract text, watermark every page, and fill AcroForm fields including appearance-stream
    regeneration or `NeedAppearances`.'
  why_required: 'The widest of the capabilities and the one with a known trap: a filled field whose value
    no viewer renders is not a filled form.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.14.0-T01
  - US-IO-HARNESS-0.14.0-T02
  - US-IO-HARNESS-0.14.0-T03
  acceptance_criteria:
  - 'F5 — PDF generate and extract: a generated PDF''s text extracts back to what was written, and the
    text of a real existing PDF is extracted. Reading order is asserted loosely, as best-effort, because
    the extraction crate''s quality does not support a strict claim and the docs say so.

    '
  - 'F6 — PDF watermark: every page of a multi-page PDF carries the stamp after watermarking, and the
    document''s existing content is still present and still extractable. A watermark that flattened the
    original would pass a naive "the stamp is there" check.

    '
  - 'F7 — PDF form fill: a filled AcroForm field holds its value AND renders it. Asserted on the appearance
    stream or `NeedAppearances`, not only on the field''s `/V`, because a value a viewer shows blank is
    not a filled form.

    '
  files:
  - src/tools/
  - tests/
  evidence:
  - 'src/tools/documents/pdf.rs: write_new, read_text, watermark and fill_form over lopdf and pdf-extract,
    17 tests — the widest module and the widest test set'
  - 'F6 is asserted the way it has to be: watermarking APPENDS to the page rather than replacing its
    content, watermarking twice leaves both stamps and the body, and a page with inherited resources
    keeps its own font reachable. A watermark that flattened the original would pass a naive "the stamp
    is there" check and fails these'
  - 'F7 — fill_form sets /V and /NeedAppearances and deletes the stale /AP, so a viewer redraws the field
    rather than showing the old appearance. Asserted on the flag and the deletion, not only on /V. LIMIT
    RECORDED: it does not generate appearance streams itself and has not been opened in a real viewer,
    so the claim is "asks the viewer to redraw it", which is what the test is named'
  - a batch with one unknown field writes none of it, and naming a field that is not there lists the
    ones that are — a failure the model can act on rather than a partial write it cannot see
  - 'F5 — reading order is asserted loosely on purpose; read_text''s doc comment states the extraction
    is best-effort, that a scanned page returns empty text, and that pdf-extract panics on input it does
    not understand so the call catches the unwind. That guard is a no-op under panic = "abort", and the
    doc says so'
  - denied-path refusal for both reading and writing, each with its permissive negative control
- id: US-IO-HARNESS-0.14.0-T07
  summary: Barcode and QR decoding from a workspace image, with a clean not-found result rather than an
    error that ends the run.
  why_required: Self-contained, healthy dependency, and the not-found path is the one a real run hits
    most.
  status: done
  depends_on:
  - US-IO-HARNESS-0.14.0-T01
  - US-IO-HARNESS-0.14.0-T02
  - US-IO-HARNESS-0.14.0-T03
  acceptance_criteria:
  - 'F8 — barcode and QR decode: a QR code and at least one 1D symbology decode to their known payloads
    from images in the workspace, and an image containing no code returns a clean "nothing found" rather
    than an error that ends the run.

    '
  files:
  - src/tools/
  - tests/
  evidence:
  - 'src/tools/documents/barcode.rs: decode over rxing, 6 tests. Every 1D and 2D symbology the port supports,
    without the caller naming one first — a model that had to name the symbology before reading the label
    would need to already know the answer'
  - 'F8 — a QR code and a 1D symbology each decode to the payload they were written with, and an image
    with no code in it returns Ok(vec![]) rather than an error: "I looked and there was nothing there"
    is an observation the model can act on, while an Err invites a retry of the identical call'
  - an image that cannot be decoded as an image IS an error, which is the other thing entirely
  - 'the path is read through Workspace::read_bytes and decoded in memory: rxing ships detect_in_file
    helpers that take a path and call image::open themselves, and they are deliberately not used — a
    path handed to a library is a read that never passes the policy gate'
  - denied-path refusal before a pixel is decoded, with its permissive negative control
- id: US-IO-HARNESS-0.14.0-T08
  summary: The document-aware verification criterion, gating on extracted text rather than file bytes.
  why_required: Without it a document task has no stop condition, and `FileContains` on a `.docx` matches
    zip bytes.
  status: done
  depends_on:
  - US-IO-HARNESS-0.14.0-T01
  - US-IO-HARNESS-0.14.0-T05
  acceptance_criteria:
  - 'F10 — the document verification criterion passes when the extracted text contains the needle, fails
    when it does not, and FAILS on a document whose raw bytes contain the needle while its extracted text
    does not. Without the third case it is `FileContains` wearing a costume.

    '
  - 'N6 — a document read of a large file is bounded by the same context caps as any other observation,
    so a 200-page PDF cannot blow the prompt budget that 0.10.0 exists to hold.

    '
  files:
  - src/verify.rs
  - tests/
  evidence:
  - 'src/verify.rs: Verification::DocumentContains, reader chosen by extension (.xlsx/.docx/.pptx/.pdf),
    an unknown extension an error rather than a fallback to matching raw bytes'
  - 'F10 — three tests: passes on text the document shows, fails on text it does not, and the decisive
    one — the same document read both ways, where WorkspaceFileContains says no and DocumentContains
    says yes. That test corrected the premise: read_to_string(..).unwrap_or_default() on a zip yields
    the empty string, so the byte criterion is a silent permanent false FAIL on every document, not a
    false pass'
  - the variant exists in every build; without the feature it returns a typed Error::Config naming the
    feature rather than vanishing from the enum and breaking a consumer's exhaustive match
  - 473 featured / 428 default tests pass, clippy clean both ways
- id: US-IO-HARNESS-0.14.0-T09
  summary: 'Documentation, the live run, and the release gates: per-capability limits in the doc comments,
    a CHANGELOG that says what was cut and why, the feature named in the README, and one real-provider
    run over a real spreadsheet under a policy.'
  why_required: The cuts are the part a reader will otherwise mistake for an oversight, and no fixture
    exercises what a live model does with a document.
  status: done
  depends_on:
  - US-IO-HARNESS-0.14.0-T04
  - US-IO-HARNESS-0.14.0-T05
  - US-IO-HARNESS-0.14.0-T06
  - US-IO-HARNESS-0.14.0-T07
  - US-IO-HARNESS-0.14.0-T08
  acceptance_criteria:
  - 'O1 — each capability''s doc comment states its limits where a caller meets them: Word is generate-and-read,
    PowerPoint is read-only, PDF extraction is best-effort on reading order, spreadsheet preserving-edit
    is not guaranteed for chart and drawing heavy workbooks.

    '
  - 'O2 — the CHANGELOG says what was cut and why. A reader who remembers the roadmap promised OCR and
    PowerPoint should find the reason in the release notes, not infer an oversight.

    '
  - 'O3 — the feature is discoverable: named in the README and in the crate docs, with the one line a
    consumer needs to enable it.

    '
  - 'O4 — the live-run transcript, the public-surface diff and the default-dependency-tree comparison
    are stored under `evidence/0.14.0/`.

    '
  - 'N4 — five-leg CI green, with the document tests running on all three OSes. Path handling and line
    endings both reach these formats, so a Linux-only pass would not be evidence.

    '
  - 'N5 — no existing public item is renamed or removed; every addition is additive. Captured as a public-surface
    diff using the corrected method recorded in 0.13.0''s evidence.

    '
  files:
  - README.md
  - CHANGELOG.md
  - examples/
  evidence:
  - 'O1 — limits stated where a caller meets them: xlsx::set_cell now carries "What preserving is worth"
    (not a guarantee on chart/drawing/pivot/macro-heavy workbooks); docx module and write_new state
    generate-and-read and why no in-place edit; pptx states read-only with no write path; pdf::read_text
    states best-effort reading order and the panic guard''s limit under panic = "abort"'
  - 'O2 — CHANGELOG 0.14.0 carries a "What was cut, and why" block: OCR and PowerPoint authoring off
    the roadmap by owner decision 2026-07-27 (not deferred), plus barcode generation, the in-place Word
    edit, document delete and PDF rasterisation, each with what was promised and why it is absent'
  - 'O3 — README: Status through 0.14.0, the capability line rewritten to what shipped and what was cut,
    and a new "Documents (v0.14)" section carrying the one enabling line, the twelve built-ins, DocumentContains
    and "The limits, stated plainly". src/lib.rs has the v0.14 paragraph; docs/CAPABILITIES.md and docs/CONTRACT.md
    updated for the feature-gated surface'
  - 'O4 — evidence/0.14.0/: live_run_0.14.0_documents.txt (OpenRouter, openai/gpt-5.6-luna, both arms),
    public_surface_diff.md with added/removed lists, dependency_tree_default.txt and dependency_tree_documents.txt'
  - 'the live run, both arms: permissive — Success in 3 steps, xlsx_set_cell wrote C12=218454, all nine
    original rows still readable and the number in the cell it was asked for; denied — the same write
    refused twice by rule ledger.xlsx, workbook bytes identical before and after (a589c65bc0171e87).
    The negative control is the release''s actual claim, that a document tool is governed'
  - 'N4 — CI is five legs (three OSes, msrv, lint) and each now covers the features: cargo test --features
    documents on all three OSes, the MSRV leg builds featured so an optional dependency cannot raise
    the 1.88 floor invisibly (verified locally with cargo +1.88), and lint runs clippy both ways'
  - 'N5 — no public item renamed or removed. 389 items at v0.13.0, 420 now, empty removals list. The
    grep cannot see enum variants, so DocumentContains is recorded in the diff prose rather than counted'
  - default cargo tree still 401 lines; 837 with all five formats enabled
