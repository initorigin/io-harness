product: io-harness
version: 0.23.0
tasks:
  - id: US-IO-HARNESS-0.23.0-T01
    summary: >
      Move the dependency: `rusqlite` 0.32 to 0.40.1 with `bundled`, plus the `fallible_uint` feature
      that carries the `u64` `ToSql`/`FromSql` impls from 0.38.0 onward. Record the `cargo tree` line
      count either side and re-check the MSRV against the 1.88 floor.
    why_required: >
      This is the release. Everything else in it exists to prove this move changed no behaviour, and
      nothing else can be attempted until the crate compiles against the new line.
    status: todo
    depends_on: []
    acceptance_criteria:
      - >
        NF2 — no new direct dependency. Whatever the tree gains transitively through `rusqlite` is
        recorded as a `cargo tree` line count before and after, in the changelog, per the discipline this
        project has kept since 0.1.0.
      - >
        OP1 — MSRV is re-checked and stated. If `rusqlite` 0.40 or anything it pulls raises the floor
        above 1.88, the new number goes in `Cargo.toml` with the same honest comment the existing floor
        carries, naming which dependency set it.
    files:
      - Cargo.toml
      - Cargo.lock
    evidence: []

  - id: US-IO-HARNESS-0.23.0-T02
    summary: >
      Prove a database written by 0.22.0 is fully readable by 0.23.0, through the public `Store` API,
      with a fixture generated by a genuinely pinned 0.22.0 build rather than written by this release
      and labelled.
    why_required: >
      The engine moves seven point releases and the compiler cannot check any of it. Reading back a
      previous release's stored rows is the only evidence that the move preserved what is on disk.
    status: todo
    depends_on: [US-IO-HARNESS-0.23.0-T01]
    acceptance_criteria:
      - >
        F2 — a database written by the previous release is fully readable by this one. A store populated
        by 0.22.0 with runs, steps, refusals, approvals, budget draws, citations and server-tool calls is
        opened by 0.23.0 and every row read back identical, through the public `Store` API rather than by
        inspecting the file. The negative control is a store this release creates from scratch, which
        must be byte-comparable in schema to one 0.22.0 creates.
    files:
      - tests/cross_version.rs
      - tests/fixtures/store-0.22.0/
    evidence: []

  - id: US-IO-HARNESS-0.23.0-T03
    summary: >
      Resume a run across the version boundary: interrupted under 0.22.0 mid-tree, finished under
      0.23.0, with no completed step re-run, the ledger totalling what the two halves drew, and no
      irreversible action taken twice. The 0.7.0 kill-9 test re-pointed, not rewritten.
    why_required: >
      This is the one failure shape the release can produce that compiles, passes the unit tests, and
      still damages a user's data. Review cannot catch it; only this can.
    status: todo
    depends_on: [US-IO-HARNESS-0.23.0-T02]
    acceptance_criteria:
      - >
        F3 — a run checkpointed by the previous release resumes across the boundary. A run interrupted
        under 0.22.0 mid-tree, with a completed sub-agent, an in-flight step and a partially drawn
        budget, is resumed by 0.23.0 to completion: no completed step re-runs, the ledger's total matches
        what the two halves drew between them, and an irreversible action already taken is not taken
        twice. This is the 0.7.0 crash test with the two halves on either side of the version boundary,
        which is the only form of it that proves anything here.
    files:
      - tests/cross_version.rs
      - examples/crash_fixture.rs
    evidence: []

  - id: US-IO-HARNESS-0.23.0-T04
    summary: >
      Resolve, under 0.23.0, an approval that 0.22.0 deferred past process exit, and let the run
      continue.
    why_required: >
      The approval record is the crate's one durable human decision. If it does not survive a dependency
      upgrade the permission boundary is not durable, whatever the trace says.
    status: todo
    depends_on: [US-IO-HARNESS-0.23.0-T02]
    acceptance_criteria:
      - >
        F4 — a pending approval survives the boundary. An approval deferred past process exit under
        0.22.0 is resolved under 0.23.0 and the run continues, because a durable decision that does not
        survive a dependency upgrade is not durable.
    files:
      - tests/cross_version.rs
    evidence: []

  - id: US-IO-HARNESS-0.23.0-T05
    summary: >
      The consumer-side build check: a fixture crate depending on both `io-harness` and `rusqlite` 0.40
      that must build against 0.23.0 and must fail against 0.22.0 with cargo's `links` diagnostic, kept
      in the repository and run in CI.
    why_required: >
      The wall this release exists to remove is a resolver error in someone else's build, which nothing
      inside this crate's own test suite can observe. Without this the release's central claim is
      asserted rather than checked.
    status: todo
    depends_on: [US-IO-HARNESS-0.23.0-T01]
    acceptance_criteria:
      - >
        F1 — the collision is gone, and its absence is checkable rather than asserted. A fixture crate
        declaring both `io-harness 0.23.0` and `rusqlite 0.40` builds and runs a trivial harness call.
        The negative control is the same fixture against `io-harness 0.22.0`, which must fail with
        cargo's own `links` diagnostic naming `sqlite3`, and that diagnostic is quoted verbatim in the
        changelog so a reader knows the exact error this release retires.
      - >
        OP3 — the fixture crate from F1 is committed and runs in CI, so the property survives the next
        dependency bump instead of being re-discovered by a consumer.
    files:
      - tests/fixtures/links-consumer/
      - .github/workflows/ci.yml
      - Cargo.toml
    evidence: []

  - id: US-IO-HARNESS-0.23.0-T06
    summary: >
      Assert directly that `CHECKPOINT_FORMAT` is still 7 and that no migration runs on a store the
      previous release wrote.
    why_required: >
      A silent format bump would let a broken upgrade present itself as a successful one. The existing
      assertion covers a fresh store; this release needs it against a 0.22.0 store.
    status: todo
    depends_on: [US-IO-HARNESS-0.23.0-T02]
    acceptance_criteria:
      - >
        F5 — `CHECKPOINT_FORMAT` is still 7 and no migration runs. Asserted directly, so that a silent
        format bump cannot pass as a successful upgrade.
    files:
      - tests/cross_version.rs
      - tests/checkpoint.rs
    evidence: []

  - id: US-IO-HARNESS-0.23.0-T07
    summary: >
      Document the one break: the `BREAKING` changelog entry with a migration note for
      `Error::State(#[from] rusqlite::Error)`, the `docs/public-api.txt` check, the `CONTRACT.md` entry
      stating the intent to wrap `rusqlite::Error` in a later release, and the quoted `links`
      diagnostic.
    why_required: >
      The break is real for any consumer matching `Error::State(e)`, and the release notes are taken
      verbatim from the changelog. An undocumented break is the same thing as an unannounced one.
    status: todo
    depends_on: [US-IO-HARNESS-0.23.0-T05]
    acceptance_criteria:
      - >
        F6 — the break is exactly one and it is documented. `Error::State` carries the 0.40 error type;
        the changelog carries a `BREAKING` entry with a migration note saying what to write instead; and
        the enumerated public API in `docs/public-api.txt` reflects it. Any second break discovered
        during development is either eliminated or documented to the same standard — not absorbed
        quietly.
    files:
      - CHANGELOG.md
      - docs/CONTRACT.md
      - docs/public-api.txt
    evidence: []

  - id: US-IO-HARNESS-0.23.0-T08
    summary: >
      The full suite green on macOS, Linux and Windows including the bundled compile, and the nightly
      docs.rs job warning-free with all features, both before publication.
    why_required: >
      Windows is where the bundled SQLite is a C compile and the runner is slowest, and docs.rs failing
      after publication cannot be fixed without another version.
    status: todo
    depends_on: [US-IO-HARNESS-0.23.0-T03, US-IO-HARNESS-0.23.0-T04, US-IO-HARNESS-0.23.0-T06]
    acceptance_criteria:
      - >
        NF1 — the full suite passes on macOS, Linux and Windows, including the bundled SQLite compile on
        each. No test is skipped, marked ignored or made conditional to get there.
      - >
        NF3 — `cargo doc` is warning-free and docs.rs builds with all features, checked by the nightly
        job before publication rather than after.
    files:
      - .github/workflows/ci.yml
    evidence: []

  - id: US-IO-HARNESS-0.23.0-T09
    summary: >
      Measure store write throughput either side of the boundary and record the numbers in the
      changelog.
    why_required: >
      The engine moved seven point releases and the contract asks for the number rather than an
      assumption. Recording it is also how a later regression gets a baseline to fail against.
    status: todo
    depends_on: [US-IO-HARNESS-0.23.0-T01]
    acceptance_criteria:
      - >
        NF4 — no measurable regression in store write throughput on the existing benchmark path. The
        engine moved seven point releases; the expectation is neutral-to-better, and a regression is a
        finding to record, not a reason to stop.
    files:
      - CHANGELOG.md
    evidence: []

  - id: US-IO-HARNESS-0.23.0-T10
    summary: >
      One real end-to-end run against a live provider, on a store already upgraded, with the trace read
      back afterwards.
    why_required: >
      Every other check in this release is offline. A store that satisfies the unit tests and fails a
      real run would still be a broken release.
    status: todo
    depends_on: [US-IO-HARNESS-0.23.0-T08]
    acceptance_criteria:
      - >
        OP2 — a real end-to-end run against a live provider completes on the upgraded store, so the
        release is not accepted on unit tests alone. One run, one workspace, one verified outcome, with
        the trace read back afterwards.
    files:
      - examples/durable_run.rs
    evidence: []
