- id: US-IO-HARNESS-0.25.0-T07
  summary: Run the project's own checker after a successful edit and attach its diagnostics to the observation.
    Ecosystem comes from `toolchain::detect`; for cargo the command is `cargo check --message-format=json`
    and each `compiler-message`'s `rendered` field is appended. Bounded by a timeout and an output cap,
    skipped when no ecosystem is detected or the pass is disabled, and never able to fail an edit.
  why_required: Without it a type error costs a step, a build and a provider call to discover, on a loop
    where those compound. This is the feature that replaces the roadmap's LSP client, and it delivers
    more for Rust because it carries borrow-check and clippy diagnostics that rust-analyzer's pull path
    does not.
  status: done
  depends_on:
  - US-IO-HARNESS-0.25.0-T01
  acceptance_criteria:
  - 'F7 — a diagnostic reaches the model attached to the edit that caused it. An `edit_file` that introduces
    a type error into a cargo project returns an observation containing the rendered compiler error, its
    file, its line and its error code, with no intervening tool call by the model. The negative control
    is an edit introducing no error, whose observation carries no diagnostics section at all.

    '
  - 'F8 — the diagnostics pass never turns a good edit into a failed one. With the checker absent from
    `PATH`, with it timing out, and with it failing for an unrelated reason, the edit still succeeds,
    the observation still reports the edit, and the failure of the pass is recorded rather than raised.
    Three cases, three tests, because this is the way an information feature becomes an availability bug.

    '
  - 'F9 — the pass is genuinely off when it is off. A project with no detected ecosystem, and a configuration
    that disables it, both produce an edit with no checker process spawned at all — asserted by process
    observation, not by an absent diagnostics section, since an empty section and a skipped pass are indistinguishable
    from the output alone.

    '
  - 'NF4 — the diagnostics pass costs nothing measurable on a warm tree and is bounded on a cold one.
    Its timeout is enforced and its output cap is enforced, both asserted; an edit in a project whose
    check is slow returns within the bound with the pass recorded as timed out.

    '
  files:
  - src/run.rs
  - src/toolchain.rs
  - src/config.rs
  evidence:
  - 'src/tools/diagnostics.rs: after_edit returns Found/Clean/Skipped/Failed, so "ran and found nothing"
    is distinguishable from "never ran" (F9). Reuses toolchain::detect and the existing Exec timeout and
    head_and_tail cap. Cargo parses --message-format=json for the rendered error; five ecosystems have
    checkers and the rest are skipped because their type-check step is their build. 8 unit tests, no test
    compiles a crate. ZERO new dependencies.'
  - Wired after both edit_file and write_file through one shared helper.
- id: US-IO-HARNESS-0.25.0-T08
  summary: 'Correct the two stale documentation claims 0.24.0 left behind — `docs/CONTRACT.md` and `docs/guide/sandbox.md`
    both still say `SandboxLimits::max_processes` is enforced by nothing and that the Windows Job Object
    is not wired up — and update every doc surface this release touches: the README tool list, `docs/CONTRACT.md`
    for the handle lifecycle and the orphaning rule, `docs/guide/command-execution.md`, `docs/guide/language-support.md`,
    and the crate rustdoc.'
  why_required: 'A contract document that under-claims a shipped boundary is the same class of defect
    as one that over-claims it: either way a consumer cannot trust the file. The orphaning rule in particular
    is a contract, not an implementation detail — it is the difference between this crate and one that
    would re-attach to a recorded PID.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.25.0-T05
  - US-IO-HARNESS-0.25.0-T07
  acceptance_criteria:
  - 'OP2 — the two stale documentation claims are corrected and checked by reading the files: `docs/CONTRACT.md`
    no longer says `max_processes` is enforced by nothing, and `docs/guide/sandbox.md` agrees with it
    and with `src/sandbox.rs:26`. Reviewed as a criterion because a contract document that under-claims
    a shipped boundary is as much a defect as one that over-claims it.

    '
  - 'OP3 — every doc surface this release touches is updated in this release: the README tool list, `docs/CONTRACT.md`
    for the handle lifecycle and the orphaning rule, `docs/guide/command-execution.md`, `docs/guide/language-support.md`
    for the check command, and the crate rustdoc. Checked by grepping the docs for each API this release
    adds or changes rather than from memory.

    '
  - 'OP4 — `docs/CONTRACT.md` states the orphaning rule as a contract, not an implementation detail: a
    consumer needs to know that a handle does not survive a resume and that no recorded PID is ever signalled,
    because that is the difference between this crate and one that would re-attach.

    '
  files:
  - docs/CONTRACT.md
  - docs/guide/sandbox.md
  - docs/guide/command-execution.md
  - docs/guide/language-support.md
  - README.md
  - src/lib.rs
  evidence:
  - README, docs/CONTRACT.md, docs/guide/command-execution.md and docs/guide/language-support.md updated
    for the three tools and the diagnostics pass; the orphaning rule is stated as a contract.
  - The two stale max_processes claims 0.24.0 left behind are corrected, plus three further stale Windows
