product: io-harness
version: 0.44.0
tasks:
- id: US-IO-HARNESS-0.44.0-T01
  summary: Add `CompletionRequest::cache_boundary`, skipped when `None`.
  why_required: Nothing else in the release can be built until the request can carry the offset. The serde
    attribute matches the three optional fields before it, and the criterion that guards it is the only
    thing in the suite that can see it change.
  status: done
  depends_on: []
  acceptance_criteria:
  - '**F9 — an unmarked request keys as it always has, and a marked one is a different question.** An
    unmarked request''s serialised form carries no `cache_boundary` key at all; a marked one carries it;
    and a recording made by the unmarked request refuses to answer the marked one. The second half is
    the load-bearing one — the key is the exact request content, and the two are not the same request.
    Sabotage: drop `skip_serializing_if`, under which `"cache_boundary":null` enters every key and this
    test fails while **every other test in the replay suite still passes**, which is the finding that
    justifies the criterion: one build records and replays through the same serialiser, so nothing else
    here can see it.

    '
  files:
  - src/provider/mod.rs
  - tests/replay.rs
  evidence:
  - '`CompletionRequest::cache_boundary: Option<usize>` added at `src/provider/mod.rs` with `#[serde(default,
    skip_serializing_if = "Option::is_none")]`, like `model`, `web` and `effort` before it. `cargo fmt
    --check` clean, `cargo clippy --all-targets -- -D warnings` clean, and the field''s own worked doctest
    passes (2 passed / 0 failed).'
  - '`a_boundary_is_absent_from_an_unmarked_key_and_present_in_a_marked_one` (`tests/replay.rs`): the
    replay suite is 9 passed / 0 failed.'
  - 'Sabotage — drop `skip_serializing_if` — gives 8 passed / 1 failed, failing that named test and NOTHING
    else. Reported as a finding: one build serialises both sides of a recording the same way, so no pre-existing
    test can see it. This is what disproved the contract''s cassette claim (`US-IO-HARNESS-0.44.0-I01`).'
  - '`#[non_exhaustive]` was applied, measured and reverted: E0639 at `tests/replay.rs:136`, `:392`, `:428`,
    the first being `..Default::default()`. Removed from scope by `US-IO-HARNESS-0.44.0-I01`; the reason
    is recorded in a comment at the type.'
- id: US-IO-HARNESS-0.44.0-T02
  summary: Anthropic splits the user turn at the boundary and refuses it when images are present.
  why_required: Anthropic is the vendor the second breakpoint is designed against, and the one where image
    ordering means the boundary cannot always be honoured. Without this the field is inert on the wire
    it matters most on.
  status: done
  depends_on:
  - US-IO-HARNESS-0.44.0-T01
  acceptance_criteria:
  - '**F1 — a marked request is two text blocks that reassemble exactly.** Anthropic''s and OpenRouter''s
    body builders, called directly with a `CompletionRequest` whose `cache_boundary` is `Some(n)`. Three
    assertions: `content` is an array of two `text` blocks; the first carries `cache_control: {"type":"ephemeral"}`
    and the second carries none; and **the two texts concatenated are byte-identical to `request.user`**.
    The third is the discriminating one. Sabotage: split with `trim()` on either half, under which the
    first two assertions pass and only the concatenation fails.

    '
  - '**F2 — `None` is 0.43.0''s body, byte for byte.** The same builders with `cache_boundary: None`,
    asserted against the serialised body 0.43.0 produced for the same request — the whole body, not the
    user field. Separately, an offset past `user.len()`, an offset landing inside a multi-byte character,
    and `Some(0)` each produce that same body and no error. Sabotage: treat an out-of-range offset as
    a clamp to the end, under which one block becomes two and this fails while F1 still passes.

    '
  - '**F6 — media decides the boundary per wire, and the two wires differ.** One request carrying an image
    and `cache_boundary: Some(n)`: Anthropic''s body has images first and **one** text block with no `cache_control`;
    OpenRouter''s has **two** marked-then-unmarked text blocks followed by the image blocks. Both assertions
    in one test, because the point is the difference. Sabotage: honour the boundary on Anthropic with
    media present, under which the marked block is not a prefix of the message and the cache entry can
    never be hit.

    '
  files:
  - src/provider/anthropic.rs
  evidence:
  - '`Anthropic::text_content` splits `user` at the boundary into two text blocks, `cache_control: ephemeral`
    on the first only; `user_content` returns it whenever `media` is empty. The validity rule is `provider::split_at_boundary`,
    one helper both wires call, so `0`, an offset at or past the end, and a non-character-boundary offset
    are ignored rather than sliced.'
  - '`body_splits_the_user_turn_at_the_boundary_and_marks_only_the_first_half` asserts two text blocks,
    the marker on the first and absent from the second, the two texts concatenating byte-identically to
    `request.user`, and exactly TWO `cache_control` occurrences in the whole body — 0.38.0''s system breakpoint
    plus this one.'
  - '`an_unusable_boundary_sends_the_body_that_has_always_been_sent` asserts the whole body is byte-identical
    to the unmarked one for `None`, `Some(0)`, `Some(len+1)`, `Some(usize::MAX)` and an offset inside
    a two-byte `é`.'
  - '`an_image_suppresses_the_boundary_because_the_images_come_first` (media feature) asserts one image
    block, one WHOLE unmarked text block, one `cache_control` in the body, and byte-identity with the
    same request carrying no boundary at all.'
  - '`cargo test --lib --features media provider::anthropic`: 24 passed / 0 failed.'
  - 'Sabotages, one per arm. `rest.trim_start()` and `prefix.trim_end()` each fail the F1 test and nothing
    else. Suppression removed (`user_content` always splitting) fails TWO named media tests. FINDING:
    the first `trim_start` run failed NOTHING — the fixture''s remainder began with a letter, so the sabotage
    was a no-op. The fixture now carries whitespace on both sides of the split and both arms bite; the
    test was only half discriminating until that was found.'
- id: US-IO-HARNESS-0.44.0-T03
  summary: Split the same way on the OpenRouter flavour, send nothing on the OpenAI flavour, and keep
    image blocks after the text.
  why_required: OpenRouter is the wire the live measurement is taken on, and `WebFlavor::OpenAi` fronts
    21 `Compatible` endpoints whose bodies must not change at all. Both halves are one change to one shared
    body builder.
  status: done
  depends_on:
  - US-IO-HARNESS-0.44.0-T01
  acceptance_criteria:
  - '**F1 — a marked request is two text blocks that reassemble exactly.** Anthropic''s and OpenRouter''s
    body builders, called directly with a `CompletionRequest` whose `cache_boundary` is `Some(n)`. Three
    assertions: `content` is an array of two `text` blocks; the first carries `cache_control: {"type":"ephemeral"}`
    and the second carries none; and **the two texts concatenated are byte-identical to `request.user`**.
    The third is the discriminating one. Sabotage: split with `trim()` on either half, under which the
    first two assertions pass and only the concatenation fails.

    '
  - '**F2 — `None` is 0.43.0''s body, byte for byte.** The same builders with `cache_boundary: None`,
    asserted against the serialised body 0.43.0 produced for the same request — the whole body, not the
    user field. Separately, an offset past `user.len()`, an offset landing inside a multi-byte character,
    and `Some(0)` each produce that same body and no error. Sabotage: treat an out-of-range offset as
    a clamp to the end, under which one block becomes two and this fails while F1 still passes.

    '
  - '**F5 — `WebFlavor::OpenAi` never sends a boundary.** The shared body builder at that flavour, with
    `cache_boundary: Some(n)`, media present and absent, fold and no fold: the user message content is
    the bare string in every case and the whole body is byte-identical to 0.43.0''s. The negative control
    that must not move, and the one that covers 21 endpoints this crate does not control. Sabotage: honour
    the boundary for every flavour, under which a `Compatible` endpoint receives a content shape nobody
    asked it for.

    '
  - '**F6 — media decides the boundary per wire, and the two wires differ.** One request carrying an image
    and `cache_boundary: Some(n)`: Anthropic''s body has images first and **one** text block with no `cache_control`;
    OpenRouter''s has **two** marked-then-unmarked text blocks followed by the image blocks. Both assertions
    in one test, because the point is the difference. Sabotage: honour the boundary on Anthropic with
    media present, under which the marked block is not a prefix of the message and the cache entry can
    never be hit.

    '
  files:
  - src/provider/openai_wire.rs
  evidence:
  - '`cached_user(flavor, request)` added beside `cached_system`, the fourth per-vendor difference resolved
    in the shared body builder after `web_key` (0.22.0), `effort_key` (0.31.0) and `cached_system` (0.38.0).
    `WebFlavor::OpenAi` returns `None`; `WebFlavor::OpenRouter` splits through the shared `provider::split_at_boundary`.
    The image part builder was factored out as `image_part` so the marked and unmarked paths cannot render
    an image two ways.'
  - '`the_openrouter_body_splits_the_user_turn_at_the_boundary`: two text blocks, marker on the first
    only, byte-exact reassembly, exactly two `cache_control` in the body.'
  - '`the_openai_body_ignores_a_boundary_entirely`: for `Some(len)`, `Some(0)` and `Some(usize::MAX)`
    the user turn stays a bare string, the body holds zero `cache_control`, and the whole body is byte-identical
    to the unmarked one. This is the control covering OpenAI plus all 21 `Compatible` endpoints.'
  - '`an_unusable_boundary_leaves_the_openrouter_user_turn_alone`: `Some(0)`, `Some(len)`, `Some(len+1)`,
    `Some(usize::MAX)` and an offset inside a two-byte `é` all produce the unmarked body.'
  - '`an_image_still_leaves_a_markable_prefix_because_the_text_comes_first`: three parts — marked prefix,
    remainder, image — because this wire puts text first. The same request is UNMARKED on Anthropic (T02),
    and the pair is the criterion: one request, two vendors, two correct answers.'
  - '`cargo test --lib --features media provider::`: 104 passed / 0 failed. fmt clean, clippy --all-targets
    --features media -D warnings clean.'
  - Sabotages. Honouring the boundary on the OpenAi flavour fails `the_openai_body_ignores_a_boundary_entirely`
    and nothing else. Dropping the images from the marked path fails the media test and nothing else —
    which matters because a silently discarded image is a request the model answers without seeing what
    it was asked about.
- id: US-IO-HARNESS-0.44.0-T04
  summary: Compute the frozen prefix in one helper called from both assembly sites, and mark only when
    the candidate repeated byte-identically.
  why_required: This is the release. The wire can carry a boundary and nothing produces one until the
    loop locates the summary in the assembled prompt and the guard decides it has been sent once already.
  status: done
  depends_on:
  - US-IO-HARNESS-0.44.0-T02
  - US-IO-HARNESS-0.44.0-T03
  acceptance_criteria:
  - '**F3 — the boundary is offered only after a fold, and only once the prefix has repeated.** A run
    driven past the compaction threshold over a fixture provider that records every request. The request
    on the step the fold happens carries `cache_boundary: None`; the next carries `Some(n)`; and `user[..n]`
    **ends with the summary''s own text** and contains the memory block and the prompt header ahead of
    it. Sabotage: mark whenever the ledger holds a fold, under which the fold step is marked and only
    this fails.

    '
  - '**F4 — a moved prefix withdraws the marker for exactly one step.** The same run, with a memory note
    written on a step after the marker started being offered: that step''s request carries `None`, the
    step after it carries `Some(m)`, and `m != n` — the prefix that came back is a different one. Four
    steps, four different answers. Sabotage: compare the summary text instead of the whole candidate prefix,
    under which the note never withdraws the marker and the crate asks a vendor to cache bytes it has
    not sent.

    '
  - '**N5 — a run that never folds is 0.43.0 exactly.** With compaction off (`at_share: 1.0`) and over
    a run too short to fold, every request the fixture provider receives carries `cache_boundary: None`
    and the assembled prompts are byte-identical to 0.43.0''s for the same script. The cost of this release
    to a short run is zero, asserted rather than reasoned.

    '
  - '**N6 — 0.41.0''s batch, 0.42.0''s gate and 0.43.0''s fold are unaffected.** With the boundary on,
    three read-only tools still rendezvous inside the bound and are folded back in the model''s call order,
    a `before_tool` hook is still consulted exactly once per call, and the fold still fires at `at_share`
    and writes exactly one `summaries` row. The boundary is computed after assembly and changes no decision
    any of the three makes. Asserted rather than assumed, because a helper inserted into both loops is
    exactly where a regression to any of them would hide.

    '
  files:
  - src/run.rs
  - tests/cache_boundary.rs
  evidence:
  - '`frozen_prefix(user, ledger)` locates the fold''s summary — the ledger''s first entry, `ObsKind::Message`
    targeted `summary` — inside the assembled prompt by its own text, and returns everything through it.
    A summary assembly STUBBED rather than carried is not found, and not being found is exactly the no-frozen-prefix
    case, so the search is its own correctness check. No field was added to `Assembled`, which is not
    `#[non_exhaustive]` and would have been a second public break.'
  - '`cache_boundary_for(user, ledger, &mut last)` is the guard: it marks only when this step''s candidate
    is byte-identical to the previous step''s, and clears the state when there is no candidate. Run-scoped
    `marked_prefix` in BOTH loops — per agent in the tree loop, since each agent assembles from its own
    ledger.'
  - '`the_boundary_appears_only_after_a_fold_and_only_once_the_prefix_repeats`: no request before the
    fold is marked, the fold''s OWN step is not marked, the next step is, the marked span ends with the
    summary sentence and is a real prefix of `user`.'
  - '`a_note_written_mid_run_withdraws_the_marker_for_one_step`: a `remember` call mid-run withdraws the
    marker for exactly one step; the prefix that returns differs from the earlier one and contains the
    note. This is the criterion that exists because the memory block renders AHEAD of the summary and
    is re-read every turn.'
  - '`the_boundary_is_one_helper_that_both_loops_call`: one definition each of `cache_boundary_for` and
    `frozen_prefix`, >=2 call sites, and exactly two `marked_prefix` declarations — one per loop.'
  - '`a_run_that_never_folds_marks_nothing` (N5): with `at_share: 1.0` no request carries a boundary and
    none carries a summary.'
  - 'N6 neighbours re-run and unaffected: compaction 11 passed, parallel_reads 8 passed, tool_hooks 6
    passed.'
  - Sabotages, one per arm. Dropping the guard (mark whenever a fold exists) fails BOTH F3 and F4. Comparing
    only the summary instead of the whole candidate prefix fails both as well — that is the shape that
    would ask a vendor to cache bytes never sent. Removing the tree loop's call site fails the shape test
    and nothing else, which is the drift the test exists for.
- id: US-IO-HARNESS-0.44.0-T05
  summary: Add `EventKind::CacheMarked`, emitted when the marked prefix changes and not per step.
  why_required: The marker is conditional, so an operator whose run gets no cache reads cannot otherwise
    tell whether it was never offered, withheld by the guard, or ignored by the vendor. It is the release's
    only new public surface after the break.
  status: done
  depends_on:
  - US-IO-HARNESS-0.44.0-T04
  acceptance_criteria:
  - '**F8 — `CacheMarked` fires on change and not per step.** Over the F3/F4 run: exactly two `CacheMarked`
    events for four marked steps across two distinct prefixes, each carrying the `through_step` it was
    marked at and `prefix_bytes` equal to the offset that was sent, and a run that never folds emits none.
    Sabotage: emit on every marked step, under which the count is four and only this fails — 0.34.0''s
    `Routed` defect, reproduced deliberately.

    '
  files:
  - src/observe.rs
  - src/run.rs
  - tests/cache_boundary.rs
  evidence:
  - '`EventKind::CacheMarked { through_step, prefix_bytes }` added to an enum `#[non_exhaustive]` since
    0.24.0, so it is additive. `EVENT_NAMES` gained `cache_marked` and the `every_kind` census gained
    the variant plus its arm in the exhaustiveness guard — the bookkeeping trap 45 records. `through_step`
    rather than `step`, matching `Compacted` beside it; `run_id` would have been trap 77''s duplicate
    key.'
  - Emitted on the TRANSITION into marking, via `PrefixGuard { last, marking }`. The one extra bit is
    what tells a first mark from a repeat; every change of marked prefix passes through an unmarked step,
    so 'newly marking' and 'the marked prefix changed' are the same event and no previous offset need
    be kept.
  - '`cache_marked_fires_on_change_and_not_once_per_step`: marked steps strictly outnumber events, exactly
    2 events across the F4 run (the first prefix and the one the note moved it to), each `prefix_bytes`
    equal to an offset actually sent, and the two differing from each other.'
  - '`a_run_that_never_folds_emits_no_cache_marked`: the negative control. The absence of the event is
    the documented signal that nothing was marked.'
  - '`cargo test --lib observe::` 7 passed / 0 failed; `--test cache_boundary` 6 passed / 0 failed. fmt
    clean, clippy --all-targets -D warnings clean.'
  - 'Sabotage: emit on every marked step — 0.34.0''s `Routed` defect reproduced — fails `cache_marked_fires_on_change_and_not_once_per_step`
    and nothing else.'
- id: US-IO-HARNESS-0.44.0-T06
  summary: Measure the saving once against a real vendor, with the no-marker control.
  why_required: The entire benefit of this release is vendor-side. Every other criterion proves the crate
    asks correctly; only this one proves anything was cached.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.44.0-T04
  acceptance_criteria:
  - '**F7 — a real vendor honours it, measured once and controlled.** Two consecutive requests over an
    identical frozen prefix through OpenRouter against a pinned Anthropic model: the second reports non-zero
    `cache_read_tokens` covering materially more than the `system` block alone. The control — the same
    endpoint and model through `Compatible`, which sends no marker — reports zero on both calls. `CompletionResponse::model`
    is recorded on every call and is the Anthropic model that was pinned. If the vendor is unreachable
    at development time this becomes a `known_limitations` line naming what was not observed, never a
    silent pass.

    '
  files:
  - tests/cache_boundary.rs
  evidence: []
- id: US-IO-HARNESS-0.44.0-T07
  summary: Document the second breakpoint, correct the two shipped sentences that deny it, and write the
    changelog entry with its migration note.
  why_required: Two places in the shipped crate currently state that the transcript deliberately carries
    no breakpoint, one of them a doc comment on a function this release edits. Shipping the code without
    them is shipping documentation that contradicts it.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.44.0-T05
  acceptance_criteria:
  - '**N3 — exactly one public break, and `docs/public-api.txt` is byte-identical.** `CompletionRequest`
    gains `cache_boundary` and **no** `#[non_exhaustive]`, so the break is what a new field on this type
    has always been — an exhaustive literal outside the crate — and `..Default::default()` still compiles,
    asserted by every out-of-crate construction site building unchanged. `EventKind::CacheMarked` sits
    on an enum `#[non_exhaustive]` since 0.24.0. Neither adds a line the checker can see: it enumerates
    crate-root re-exports (`tests/docs_drift.rs`), and both `CompletionRequest` and `EventKind` are already
    listed — a field and a variant are members of already-listed items. **Byte-identical is the claim,
    stated at plan time**, because "met in a different form" has cost a `known_limitations` line in four
    of the last six releases (traps 114, the 0.41.0 N3 note, and 0.39.0''s).

    '
  - '**O3 — the documentation gates pass**: the nightly rustdoc gate, the two intra-doc link rules, and
    the checked-in doc surfaces (`docs/public-api.txt`, `CAPABILITIES.md`, the guide index, `CHANGELOG.md`
    including its `*Migration:*` note) consistent with the code in the same commit range. Specifically
    included: **no surviving sentence anywhere in the crate or the docs says the transcript carries no
    breakpoint.** Asserted by grep over `src/` and `docs/`, because two such sentences exist today and
    one of them is a doc comment on the function being changed.

    '
  files:
  - docs/CONTRACT.md
  - docs/guide/accounting.md
  - docs/guide/providers.md
  - CHANGELOG.md
  - src/provider/openai_wire.rs
  evidence: []
- id: US-IO-HARNESS-0.44.0-T08
  summary: Run the release gates and record their output as evidence.
  why_required: The additive-nothing claims — no dependency, no store change, byte-identical public surface
    — are only true once measured, and each has been met in a different form in a past release when it
    was assumed instead.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.44.0-T07
  acceptance_criteria:
  - '**N1 — no new dependency.** `cargo tree` for the default feature set has the same number of crates
    as 0.43.0 (**402**). Splitting a string needs `std`; the marker is `serde_json`, already there.

    '
  - '**N2 — MSRV unmoved.** The crate builds on 1.95 with the toolchain gate CI already runs.

    '
  - '**N4 — no durable state moves.** `git diff main -- src/state.rs` is **empty**: no table, column,
    index or reader, and `CHECKPOINT_FORMAT` unmoved at 7. The cache columns this release''s value is
    measured in have existed since 0.18.0 (`src/state.rs:2991`) and are read, not written to.

    '
  - '**O1 — the full suite passes on all three platforms**, which the standing CI matrix already runs.
    Nothing here is process-spawning or path-shaped, so this is the routine bar; the `media` arm of the
    matrix is what covers F6.

    '
  - '**O2 — cross-version is unaffected and proven so.** No DDL, so a 0.43.0 store and a 0.44.0 store
    are the same store; `ADDED_SINCE_0_22_0` and `COLUMNS_ADDED_SINCE_0_22_0` (`tests/cross_version.rs`)
    are **unchanged**, which is itself the assertion.

    '
  files:
  - Cargo.toml
  evidence: []
