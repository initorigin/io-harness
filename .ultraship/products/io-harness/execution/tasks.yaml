- id: US-IO-HARNESS-0.36.1-T11
  summary: '`CHANGELOG.md` gains its `## [0.36.1]` section, and the release''s own honesty criteria are
    settled: no criterion asserts a duration, the durations are read from the Actions API by run id and
    recorded, `cargo tree` still reads 402, and every lever''s actual contribution is stated including
    any that did not help.'
  why_required: '`release.yml` refuses a version with no changelog section and the Release notes are that
    section verbatim, so the section is a precondition of the release rather than a courtesy. The recorded
    numbers are the release''s only evidence of its own outcome.'
  status: todo
  depends_on:
  - US-IO-HARNESS-0.36.1-T03
  - US-IO-HARNESS-0.36.1-T04
  - US-IO-HARNESS-0.36.1-T05
  - US-IO-HARNESS-0.36.1-T09
  - US-IO-HARNESS-0.36.1-T10
  acceptance_criteria:
  - '**N1 - no acceptance criterion asserts a duration.** Not one. This repository has three traps for
    wall-clock assertions failing on loaded machines (11, 73, 83), and CI is the place with the least
    control over its own hardware. Durations are **recorded**: the per-job and per-step numbers for the
    0.36.1 CI run and release run are read from the GitHub Actions API by run id and written into the
    release record beside the 0.36.0 baseline (run 30834723995: Windows 17m51s / Linux 8m23s / macOS 8m51s,
    workflow wall clock 17m51s; run 30834005895: release 7m18s). The comparison is evidence a reader can
    check, not a gate a runner can flake.

    '
  - '**N2 - no runtime dependency, and no public API change at all.** `cargo tree` still reads **402**
    lines. `docs/public-api.txt` is unedited and `tests/public_api.rs` passes untouched. `cargo-nextest`
    and any install action are CI tooling, not crate dependencies; every new `uses:` is pinned to a full-length
    commit SHA with its version in a trailing comment, resolved with `gh api` and never guessed (trap
    13), and Dependabot''s `develop` targeting is unchanged.

    '
  - '**N3 - the reason for every change is in the file.** `ci.yml` is a 383-line file that is mostly argument:
    why `feat/**` is not a push trigger, why the timeout is 40 minutes and what it was measured against,
    why `--all-features` is one leg and not two, why `--lib --tests` excludes the doctests, why `links-consumer`
    and `cross-version` exist at all. Every change here carries the same: what it was, what it is, what
    the measurement was, and what would make it wrong. A future release must be able to undo this deliberately
    rather than by accident - the note at `ci.yml:102-121`, recording that a naive `--all-features` leg
    cost 612s on Windows against 146s, is exactly the artifact that stops someone re-introducing it, and
    this release owes the same.

    '
  - '**N4 - the release is honest about what it did not achieve.** The recorded numbers are whatever they
    are. If the Windows leg lands at 11 minutes rather than the 6-8 this plan reasons toward, that is
    what the record says, with what each lever actually contributed. A lever that turned out not to help
    is reported as a finding, not quietly left in (trap 58''s rule, applied to optimisation instead of
    sabotage).

    '
  files:
  - CHANGELOG.md
  evidence: []
