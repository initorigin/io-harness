    and confirm the MSRV toolchain gate still builds.
  why_required: A scheduling change is where a platform-specific defect hides, so a green matrix is load-bearing
    here rather than routine, and the release claims no store migration — a claim only the cross-version
    job can settle.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.41.0-T05
  acceptance_criteria:
  - '**O1 — the full suite passes on all three platforms**, which is what the standing CI matrix already
    runs. Concurrency changes the plausible failure set on Windows specifically, so a green matrix is
    load-bearing here rather than routine.

    '
  - '**O2 — no store migration.** `CHECKPOINT_FORMAT` unmoved, no table, column or index added, and a
    0.40.0 store opens and resumes under 0.41.0 unchanged, asserted by the cross-version tests that already
    read the 0.22.0 and 0.29.0 fixture stores.

    '
  - '**N2 — MSRV unmoved.** The crate builds on 1.95 with the toolchain gate CI already runs. Nothing
    here reaches for a newer std API.

    '
