product: io-harness
version: 0.15.0
tasks:
- id: US-IO-HARNESS-0.15.0-T01
  summary: Media on the provider boundary. A `Media` value carrying image bytes and their media type,
    a `media` field on `CompletionRequest`, and a capability declaration on `Provider` whose default is
    that images are not accepted. A request carrying media for a provider that does not accept it is refused
    before the request body is built. Behind a new `media` feature with `base64` as its only new direct
    dependency.
  why_required: Nothing but text has ever crossed the provider boundary — `CompletionRequest` is three
    flat fields (src/provider/mod.rs:118). Every other task in the image half sends or gates a `Media`,
    so none of them can start until the type and the refusal exist. The default-refuses capability declaration
    is what makes F3 true for an out-of-tree provider rather than only for the three built-ins.
  status: done
  depends_on: []
  acceptance_criteria:
  - 'F3 — a provider that does not accept images refuses a request carrying one before the request is
    built: no HTTP call, no spend, an error the caller can act on, and the refusal in the trace. The control
    is the same media on a provider that does accept images, which sends it. The default for the capability
    declaration is "does not accept", so an out-of-tree provider inherits F3 rather than a silent drop.

    '
  - 'N1 — the default build is unchanged. `cargo tree` for a default `cargo build` is asserted at 401
    lines, identical to 0.13.0 and 0.14.0. The image half is behind a feature because it adds `base64`
    as a direct dependency; the git half adds no crate at all.

    '
  - 'N5 — additive only. No public item renamed or removed, captured as a public-surface diff by the method
    recorded in 0.13.0''s evidence. `CompletionRequest` gains a field, which is what src/provider/mod.rs:150
    says minor releases do, and the migration note for callers who construct it without `..Default::default()`
    is written rather than left to a compile error.

    '
  files:
  - src/provider/mod.rs
  - Cargo.toml
  evidence:
  - cargo test --features media --lib provider::media_tests — 8 passed
  - cargo tree default 401 lines, --features media 402 (base64 only)
- id: US-IO-HARNESS-0.15.0-T02
  summary: 'Wire encoding per provider: the Anthropic base64 image content block (src/provider/anthropic.rs:100)
    and the `image_url` data URL in the shared body at src/provider/openai_wire.rs:38. The fallback, record
    and replay providers forward media without inspecting it, and 0.14.x recordings are refused rather
    than replayed against the new request shape.'
  why_required: The media type is inert until it reaches a wire body. These are the only three places
    a request becomes JSON, and each vendor's shape is different, so an image that is not encoded per
    vendor is an image the model never receives.
  status: done
  depends_on:
  - US-IO-HARNESS-0.15.0-T01
  acceptance_criteria:
  - 'F4 — the wire shape matches each provider''s documented format: an Anthropic base64 image content
    block, and an `image_url` data URL for the OpenAI and OpenRouter bodies. Asserted against the serialised
    body, not against a helper''s return value.

    '
  - 'N6 — 0.14.x provider recordings are refused rather than replayed against the new request shape. The
    `series()` gate at src/provider/record.rs:100 should already do this across a minor bump; the release
    asserts it rather than assuming it.

    '
  files:
  - src/provider/anthropic.rs
  - src/provider/openai_wire.rs
  - src/provider/fallback.rs
  - src/provider/record.rs
  - src/provider/replay.rs
  evidence:
  - cargo test --features media --lib media_wire — 5 passed, wire shape asserted against the serialised
    body for both vendors
- id: US-IO-HARNESS-0.15.0-T03
