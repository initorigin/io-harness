product: io-harness
version: 0.47.0
tasks:
- id: US-IO-HARNESS-0.47.0-T01
  summary: Name the three new backends and decide the chain in one pure function.
  why_required: Every rung below reports one of these labels and is reached through this decision. Until
    the variants exist and the chain is a testable function, no rung can be selected, reported or ordered.
  status: done
  depends_on: []
  acceptance_criteria:
  - '**F3 — the chain''s order is a table, decided without a host.** A pure test over the decision function
    for every combination of the four probe answers, the three modes and both egress answers: the strongest
    serviceable rung is returned; `PortableFloor` only when nothing above it can serve; and the ABI-3
    Landlock host on an egress-denying run returns the next rung down rather than Landlock. Sabotage:
    order bubblewrap ahead of Landlock, under which the Landlock-available rows return the wrong rung
    and only this fails.

    '
  - '**N3 — zero compile breaks, and `docs/public-api.txt` is byte-identical.** The only public additions
    are three `Backend` variants and their `as_str` arms, and the checker (`tests/docs_drift.rs`) enumerates
    items rather than variants — `enum Backend src/sandbox.rs` is one line at `docs/public-api.txt:69`
    whether the enum has four variants or seven. **The number is stated at plan time as "unchanged"**
    because a criterion promising a line count has been met in a different form in four of the last nine
    releases, and because byte-identical is the stronger claim.

    '
  files:
  - src/sandbox.rs
  - tests/sandbox.rs
  evidence:
  - '`Backend::LinuxLandlock`, `Backend::LinuxBubblewrap` and `Backend::WindowsAppContainer` added with
    the labels `linux-landlock`, `linux-bubblewrap` and `windows-appcontainer`. `Backend` was already
    `#[non_exhaustive]`, and no internal match needed a new arm beyond `as_str` — the crate compiles and
    clippy is clean with `--all-targets`.'
  - 'F3 — `sandbox::linux::rung(Rungs, deny_egress) -> Backend` decides the chain as a pure function over
    the four probe answers. Three named tests pass on the macOS development host: `the_chain_takes_the_strongest_rung_that_can_serve_the_run`
    (15-row table), `the_mode_does_not_decide_which_rung_a_host_takes`, `the_chain_only_ever_returns_a_linux_rung_or_the_floor`.
    29 of 29 `sandbox::` unit tests pass.'
  - 'F3 sabotage — ordering bubblewrap ahead of Landlock in `rung` failed `the_chain_takes_the_strongest_rung_that_can_serve_the_run`
    by assertion (`left: LinuxBubblewrap, right: LinuxLandlock` at `src/sandbox/linux.rs:331`), not by
    compile error. Reverted by hand and re-run green.'
  - The sabotage also failed `the_mode_does_not_decide_which_rung_a_host_takes`, which meant that test
    was incidentally asserting the chain's order. Its probe set was narrowed to Landlock alone so each
    criterion's failure names one cause. Reported rather than left as over-determination.
  - N3 — `docs/public-api.txt` is byte-identical (`git diff --stat` empty) and `tests/docs_drift.rs` passes
    15 of 15. The checker enumerates items, not variants, exactly as the contract stated at plan time.
- id: US-IO-HARNESS-0.47.0-T02
  summary: 'Build the Landlock rung: a filesystem ruleset applied between fork and exec, with no wrapper
    process.'
  why_required: This is the rung that turns a stock Ubuntu host from enforcing nothing into confining
    writes. Without it the chain has nothing above the existing namespace backend and the release delivers
    nothing on the hosts it exists for.
  status: in-progress
  depends_on:
  - US-IO-HARNESS-0.47.0-T01
  acceptance_criteria:
  - '**F1 — on a host with the Ubuntu default restriction in place, a contained run confines its writes.**
    Driven end to end from `TaskContract::workspace(goal, root)` with no builder call: a command writing
    to an absolute path outside the granted roots is refused and the file does not exist afterwards; a
    command writing inside the workspace root succeeds; and `select(&config).backend()` reports `linux-landlock`.
    Run on a CI leg that does **not** set `kernel.apparmor_restrict_unprivileged_userns=0`. On today''s
    build the same test reports `portable-floor` and the outside write lands. Sabotage: return the floor
    from the chain when the namespace probe fails, which is today''s behaviour, under which both arms
    fail and only this fails.

    '
  - '**F4 — every rung is proven to enforce, with the rung pinned.** For each of Landlock, bubblewrap
    and the existing namespace rung, on a host that has it: a write outside the granted roots is refused,
    a write inside lands, and the run''s own outcome carries the failure to the model rather than erroring
    the run. Pinned for the test rather than left to the host''s answer, so a host that would have chosen
    a different rung still asserts the one under test, and skipped with a stated reason — never silently
    — where the primitive is absent. Sabotage: build each rung''s rule set from an empty root list, under
    which the inside write is refused too and each arm fails on its own.

    '
  - '**F5 — `ReadOnly` withholds the workspace on every new rung.** A command writing into the workspace
    root fails and a command reading the same file succeeds, under Landlock and under bubblewrap, with
    the system temporary directory still writable in both. This is the mode whose entire difference is
    one directory, so it is asserted per rung rather than once. Sabotage: include the workdir in the writable
    set unconditionally, under which the write lands and only this fails.

    '
  - '**F6 — the Landlock rung installs no wrapper, and that is asserted rather than described.** The argv
    the backend spawns is byte-identical to the argv the caller asked for — no `unshare`, no `sh`, no
    `bwrap` — and `SandboxOutcome::argv` records exactly that. A payload that does not exist on `PATH`
    therefore fails as a missing program rather than as the wrapper''s non-zero exit, and a `shell` stage
    whose own `cd` is expressed through `Command::current_dir` runs in the directory it named. The second
    half is 0.46.0''s defect asserted at its root cause on the rung where it cannot recur. Sabotage: wrap
    the payload in `sh -c` on this rung, under which the argv assertion and the missing-program assertion
    both fail and only this fails.

    '
  files:
  - src/sandbox/linux.rs
  - src/sandbox/landlock.rs
  - src/sandbox.rs
  - tests/sandbox.rs
  - tests/exec_contained.rs
  evidence:
  - '`src/sandbox/landlock.rs` added. The rule *plan* is portable data with no descriptor in it — `fs_rights_for`,
    `net_rights_for`, `plan` — and the syscalls that create and apply a rule set are `cfg(target_os =
    "linux")`, following the same split `linux.rs` and `windows.rs` already use.'
  - 'The rung installs its restriction in the child through the shared runner''s existing `configure`
    hook (`tokio::process::Command::pre_exec`), so it spawns **no wrapper**: `Ruleset::build` does every
    allocating step in the parent and what runs between fork and exec is `prctl(PR_SET_NO_NEW_PRIVS)`
    plus one `landlock_restrict_self`.'
  - 'F4/F5 host-free half proven on the macOS development host: `the_plan_grants_the_same_list_the_mount_setup_binds`,
    `read_only_withholds_the_workdir_and_keeps_the_temp_directory`, `each_abi_gets_exactly_the_rights_its_kernel_knows`,
    `no_rule_asks_for_a_right_the_ruleset_does_not_handle`. 34 of 34 `sandbox::` unit tests pass; `cargo
    clippy --lib --all-targets -- -D warnings` reports nothing; `cargo fmt --check` clean.'
  - '**The Linux-only half was type-checked against `x86_64-unknown-linux-gnu` without a matrix round.**
    `cargo check --target` is blocked by rusqlite''s bundled C needing a cross `gcc` — the environment
    limit already recorded in `src/sandbox.rs` — so the module was compiled standalone with `rustc --target
    x86_64-unknown-linux-gnu --emit=metadata --test` against the target''s own `liblibc` rmeta, with a
    shim supplying `ExecMode` and `LANDLOCK_NET_ABI`. Exit 0, tests included. This is a technique worth
    reusing: it costs seconds and it is the only local evidence available for a `cfg(linux)` body.'
  - '`landlock_path_beneath_attr` is `#[repr(C, packed)]` and asserted to be 12 bytes with alignment 1.
    A `#[repr(C)]` version is 16 bytes with `parent_fd` after four bytes of padding, so the kernel would
    read the descriptor out of padding and fail `EINVAL` on a call whose every line reads correctly.'
  - '**Not yet proven, and this is the honest state of the task**: F1, F4''s Landlock arm, F5''s Landlock
    arm and F6 all need a Linux host. Nothing on this rung''s enforcement — that a write outside the granted
    roots is actually refused — can be evaluated on the macOS development host, exactly as the contract''s
    `resource_profile` predicted. Marked `in-progress` rather than `done` until the matrix says so.'
- id: US-IO-HARNESS-0.47.0-T03
  summary: Restrict outbound TCP on the Landlock rung where the kernel has the network rules, and enforce
    the egress honesty rule.
  why_required: A run that denies egress must not be handed a rung that cannot deny egress. Without the
    network access flags and the ABI negotiation that masks them down, the chain would either claim a
    denial it never applied or fail ruleset creation on an older kernel.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.47.0-T02
  acceptance_criteria:
  - '**F2 — the Landlock rung refuses `connect` when the run denies egress and the kernel has the network
    rules.** A contained command dialling a listener the test itself started on loopback is refused with
    a connection error, while the same command under a run whose policy permits egress connects. On a
    kernel whose negotiated ABI is below 4 the test asserts instead that the rung was **not** taken for
    the egress-denying run — the honesty rule, asserted rather than skipped, which is 0.40.0''s lesson
    about a test that steps over a fallback. Sabotage: request the network access flags unconditionally
    rather than dropping them below ABI 4, under which the ruleset creation fails on an older kernel and
    the rung wrongly reports success; and separately, allow the rung for an egress-denying run below ABI
    4, under which the loopback dial succeeds and only this fails.

    '
  files:
  - src/sandbox/landlock.rs
  - src/sandbox.rs
  - tests/net.rs
  - tests/sandbox.rs
  evidence: []
- id: US-IO-HARNESS-0.47.0-T04
  summary: Install the seccomp deny-list on the Landlock rung, per architecture, returning EPERM.
  why_required: The roadmap entry names a namespace-free filesystem AND syscall restriction. Without it
    the rung leaves a payload able to undo its own confinement, and the crate's standing confession that
    it installs no filter would still be true.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.47.0-T02
  acceptance_criteria:
  - '**F11 — the seccomp deny-list refuses a named syscall and refuses it with `EPERM`.** On the Landlock
    rung, a contained command invoking one of the denied syscalls directly fails with `EPERM` and the
    process is **not** killed — the distinction matters, because a filter that killed would be indistinguishable
    from a crash in the payload and would tell the model nothing. A command invoking a syscall that is
    not on the list, and every command the crate''s own gates run, completes normally. On an architecture
    with no syscall table the test asserts that the rung was taken **without** the filter and that this
    is what the backend reports, rather than skipping. Sabotage: return `SECCOMP_RET_KILL_PROCESS` instead
    of the errno, under which the first arm sees a signal rather than a failed call and only this fails.

    '
  files:
  - src/sandbox/seccomp.rs
  - src/sandbox/landlock.rs
  - tests/sandbox.rs
  evidence: []
