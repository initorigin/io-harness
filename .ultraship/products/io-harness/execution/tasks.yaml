product: io-harness
version: 0.48.0
tasks:
- id: US-IO-HARNESS-0.48.0-T01
  summary: Declare the mode each spawning tool needs and resolve it before the spawn.
  why_required: Every later task runs a command under a mode, and until the declaration and the narrower-of-two
    resolution exist there is nothing for the git built-ins or the handles to be contained under. It is
    also the only task that adds a public trait method, so it settles the break surface first.
  status: done
  depends_on: []
  acceptance_criteria:
  - '**F5 — a call runs under the narrower of what it needs and what it was granted.** A git reader dispatched
    under a run granting `WorkspaceWrite` is spawned under `ReadOnly`: the mode on its `SandboxEvent`
    and `EventKind::Contained` reads `"read-only"` while the same run''s `exec`, in the same step, reads
    `"workspace-write"` and writes into the workspace successfully. A spawn pinned to the resolved `ReadOnly`
    mode is refused a write inside the workspace, which is what makes the resolution an enforcement and
    not a label. Under a `FullAccess` grant nothing is narrowed and nothing is wrapped. Sabotage: resolve
    to the granted mode rather than the narrower one, under which the git reader records `workspace-write`
    and only this fails. **`US-IO-HARNESS-0.48.0-I01`**: this arm replaced one asserting a refused write
    from a read-declared built-in, because no such built-in attempts a write and making one do so would
    have regressed `git_status`.

    '
  - '**N3 — zero compile breaks, and `docs/public-api.txt` is unchanged.** The public additions are a
    defaulted trait method, one `EventKind` variant, and one `RunSpec` builder — and the checker (`tests/docs_drift.rs`)
    enumerates crate-root items rather than methods or variants, so the file is byte-identical. **The
    number is stated at plan time as "unchanged"**, because a criterion promising a line count has been
    met in a different form in four of the last ten releases and byte-identical is the stronger claim.

    '
  files:
  - src/tools/custom.rs
  - src/tools/mod.rs
  - src/run.rs
  - tests/exec_mode.rs
  evidence:
  - '`cargo test --test exec_mode` — exit 0, 5 passed. Includes the mode algebra decided without a host.'
  - 'Sabotage: resolve to the granted mode rather than the narrower one — `a_git_reader_is_narrowed_to_read_only_inside_a_writing_run`
    FAILED, 4 others passed.'
  - 'Sabotage: drop the pre-spawn refusal — `a_git_write_under_read_only_is_refused_before_anything_spawns`
    FAILED, 4 others passed.'
- id: US-IO-HARNESS-0.48.0-T02
  summary: Contain the six git built-ins under their declared mode.
  why_required: '`Git::run` spawns `git` directly with no rung, so a run''s boundary today depends on
    which tool the model picked. The release''s claim that everything a run starts is inside the boundary
    is false until this spawn site is inside it.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.48.0-T01
  acceptance_criteria:
  - '**F4 — the git built-ins are contained, and `git_commit` under a mode that withholds the workspace
    is refused before it spawns.** Under `ExecMode::WorkspaceWrite` a `git_commit` succeeds and its `SandboxEvent`
    rows name the backend that applied; under `ExecMode::ReadOnly` the call is refused with an observation
    naming the tool, the mode it needs and the mode the run grants, **and no `git` process is spawned**
    — asserted by the absence of an `"exec"` sandbox row for it, not by the refusal text alone. Sabotage:
    resolve the declared mode after the spawn rather than before, under which the row exists and the refusal
    arrives as an errno, and only this fails.

    '
  files:
  - src/tools/git.rs
  - src/run.rs
  - tests/exec_mode.rs
  evidence:
  - '`cargo test --test exec_mode` — exit 0, 5 passed; a commit lands under containment and the repository
    is untouched under ReadOnly.'
  - '`cargo test --test git` — exit 0, 5 passed, after the argv positions were re-asserted for `--no-optional-locks`.'
  - '`cargo test` (default features) — exit 0, 415 lib tests and every integration suite green.'
- id: US-IO-HARNESS-0.48.0-T03
  summary: Contain a `shell_start` handle, per stage, with the resource caps and not the wall clock.
  why_required: This is the execution path the release is named for and the one `docs/CONTRACT.md` documents
    as uncontained. Without it an agent contains `exec` and escapes with `shell_start`.
  status: done
  depends_on:
  - US-IO-HARNESS-0.48.0-T01
  acceptance_criteria:
  - '**F1 — a `shell_start` handle cannot write outside its granted roots.** Driven end to end from `TaskContract::workspace(goal,
    root)` with no builder call: a line started through `shell_start` that writes to an absolute path
    outside the workspace leaves no file, `shell_poll` shows the failure, and the same line started under
    `with_full_access()` writes it. Asserted on the filesystem, never on the presence of a `ShellSandbox`.
    Sabotage: pass `None` for the handle''s sandbox, which is today''s behaviour, under which the outside
    file appears and only this fails.

    '
  - '**F2 — every stage of a handle is contained, not only the first.** A two-stage line whose *second*
    stage writes outside the granted roots leaves no file, and the same line''s first stage still reaches
    the second — the pipe is intact. This is asserted separately from F1 because a one-stage test passes
    for an implementation that wraps only the head. Sabotage: wrap the first stage only, under which the
    second stage''s write lands and only this fails.

    '
  - '**F3 — a handle takes the resource caps a foreground `shell` stage takes, and the wall clock reaches
    neither.** Under a `SandboxConfig` whose `max_wall_secs` is one second, a handle started and polled
    well after that deadline is still running, while the same run''s `exec` of a sleeping command is killed
    and reported as a cap hit naming `Cap::Wall` — the wall clock is enforced by the sandbox''s own runner,
    which `exec` uses and no `shell` path does. The caps a handle *does* take are asserted to apply: on
    unix, a stage under `max_cpu_secs = 1` that spins is killed by `RLIMIT_CPU`. Sabotage: drop `apply_rlimits`
    from the handle''s spawn, under which the spinning stage runs on and only this fails. **`US-IO-HARNESS-0.48.0-I02`**:
    the control was a wall-capped foreground `shell` line, which no release has ever produced — `max_wall_secs`
    lives in `run_capped` and the `shell` tool does not reach it.

    '
  files:
  - src/tools/shell.rs
  - src/run.rs
  - tests/handles.rs
  evidence:
  - '`cargo test --test contained_handles` — exit 0, 5 passed.'
  - 'Sabotage: pass `None` for the handle''s sandbox (0.47.0''s behaviour) — F1, F2 and F3''s caps arm
    all FAILED by name; both negative controls still passed.'
  - 'Finding: the first draft of F1 and F2 passed against a handle that had been killed before it could
    act. `Handles` kills on drop at run end, and a contained stage pays `sandbox-exec`''s startup while
    an uncontained one does not, so the confinement assertions were satisfied by a dead process. Every
    confinement assertion is now paired with a write that must land.'
- id: US-IO-HARNESS-0.48.0-T04
  summary: Build the loopback egress proxy the run owns, and record every dial.
  why_required: Per-host egress has no mechanism at all until a component exists that can be asked about
    a host. It is also the release's only new long-lived resource, so its lifetime and shutdown are settled
    before anything depends on it.
  status: done
  depends_on: []
  acceptance_criteria:
  - '**F6 — a contained command reaches a permitted host and is refused a denied one, through the proxy.**
    Two loopback listeners the test starts, a policy permitting one and not the other, and one contained
    command dialling both: the first returns the listener''s bytes, the second is refused, `policy_events`
    carries a `net` row per dial with the effect and the deciding layer, and a `SandboxEvent` of kind
    `"dial"` names each `host:port`. On a host with no proxy-capable rung the test asserts instead that
    the run took the boolean and that `EventKind::Contained` reported the backend that applied — the honesty
    rule asserted rather than skipped, which is 0.40.0''s lesson about a test that steps over a fallback.
    Sabotage: answer every `CONNECT` with `200` without consulting the policy, under which the denied
    host is reached and only this fails.

    '
  - '**O3 — no test leaves a handle, a listener or a proxy running.** The proxy''s task ends with the
    run that owns it, asserted by a test that starts a run with a proxy, ends it, and finds the port closed.
    This is the same class of leak the handle registry exists to prevent and it gets the same treatment.

    '
  files:
  - src/sandbox/proxy.rs
  - src/sandbox.rs
  - src/observe.rs
  - src/state.rs
  - src/run.rs
  - tests/egress.rs
  evidence:
  - '`cargo test --lib sandbox::proxy` — exit 0, 7 passed: the request forms, a permitted host tunnelled
    and a denied one refused by name, the decisions drained once, the policy read per dial so a mid-run
    narrowing reaches it, and the listener ending with the run (O3).'
  - '`cargo tree` — 402, unchanged: tokio''s net and io-util features were already enabled transitively
    by reqwest, so N1 holds.'
  - 'Run-level: 0.40.0''s `egress_under_containment_is_all_hosts_or_none_and_never_the_named_host` FAILED
    on the proxy''s first run, exactly as its own failure message predicted, and was inverted to assert
    that a host the policy never named is refused.'
- id: US-IO-HARNESS-0.48.0-T05
  summary: Scope the sandbox to the proxy and nothing else, and put it in the command's environment.
  why_required: A proxy a payload can dial past is a convention, not a boundary. This task is what makes
    the difference, and F7 is the only criterion that can tell the two apart.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.48.0-T04
  acceptance_criteria:
  - '**F7 — the proxy is the only route out.** Under a run whose policy names hosts, a contained command
    dialling a permitted host **directly**, with the proxy environment stripped from its own environment,
    is refused by the sandbox rather than connecting — on a rung that can be address-scoped or port-scoped.
    This is the criterion that separates a boundary from a convention, and on a rung that can enforce
    neither it asserts the run did not take that rung for a per-host policy. Sabotage: emit `(allow network*)`
    alongside the loopback rule, under which the direct dial succeeds and only this fails.

    '
  files:
  - src/sandbox/macos.rs
  - src/sandbox/linux.rs
  - src/sandbox.rs
  - tests/egress.rs
  evidence: []
- id: US-IO-HARNESS-0.48.0-T06
  summary: Prefer a proxy-capable rung for a run whose policy names hosts.
  why_required: The namespace rungs cannot reach the host's loopback, so without this a per-host run is
    silently given a rung that cannot serve it. This is the honesty rule of the release and it is decided
    in one pure function.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.48.0-T05
  acceptance_criteria:
  - '**F8 — the rung preference is a table, decided without a host.** A pure test over the decision function
    for every combination of probe answers, mode, egress answer and *whether the policy names hosts*:
    a per-host run returns a proxy-capable rung where one exists, returns the boolean rung with the flattened
    answer where none does, and a run with no per-host rules returns exactly what 0.47.0''s table returned
    — the negative control that must not move. Sabotage: prefer the namespace rung for a per-host run,
    under which the per-host rows return a rung that cannot reach the proxy and only this fails.

    '
  files:
  - src/sandbox/linux.rs
  - src/sandbox.rs
  - tests/egress.rs
  evidence: []
- id: US-IO-HARNESS-0.48.0-T07
  summary: Report the proxy as advisory where it is advisory.
  why_required: On the portable floor and on Windows the proxy is an environment variable and nothing
    more. A boundary that is reported as enforced where it is not is the defect 0.40.0 shipped, and this
    release must not repeat it.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.48.0-T05
  acceptance_criteria:
  - '**F9 — on the floor and on Windows the proxy is reported as advisory.** The run completes, the environment
    carries the proxy variables, `EventKind::Contained` names the backend that applied, and the crate''s
    own report says the egress boundary is advisory on that backend rather than enforced. A payload that
    ignores the variables reaches the network, and the test asserts that this is what the crate says will
    happen. Sabotage: report the per-host boundary as enforced on the floor, under which the assertion
    on the reported wording fails and only this fails.

    '
  files:
  - src/sandbox.rs
  - src/run.rs
  - tests/egress.rs
  evidence: []
- id: US-IO-HARNESS-0.48.0-T08
  summary: Bring every documentation surface to what the code now does.
  why_required: '`docs/CONTRACT.md` states that handles are uncontained and `src/state.rs:809` states
    that there is no dial to observe. Both become false in this release, and a checked-in surface that
    contradicts the code is a defect the drift tests exist to catch.'
  status: todo
  depends_on:
  - US-IO-HARNESS-0.48.0-T03
  - US-IO-HARNESS-0.48.0-T07
  acceptance_criteria:
  - '**O4 — the documentation surfaces agree with the code, in the same release.** `docs/CONTRACT.md`
    no longer states that handles are uncontained, states what a handle''s caps are and are not, states
    per rung what the proxy proves and what it does not, and uses the word "advisory" where it is advisory.
    `src/lib.rs`, the README table and `CHANGELOG.md` agree, and `tests/docs_drift.rs` and `tests/changelog.rs`
    pass.

    '
  - '**N4 — no durable state moves.** `git diff main -- src/state.rs` shows **no DDL**: no table, column
    or index, and `CHECKPOINT_FORMAT` unmoved at 7. The only change to that file is the corrected `kind`
    documentation and the new value it now describes. Every other release since 0.44.0 has produced an
    empty diff there and this one states the exception rather than letting a reader find it.

    '
  files:
  - docs/CONTRACT.md
  - src/lib.rs
  - src/state.rs
  - README.md
  - CHANGELOG.md
  evidence: []
- id: US-IO-HARNESS-0.48.0-T09
  summary: Run every gate and measure what the release claims about numbers.
  why_required: The release claims a flat dependency count, an unchanged public API, no DDL, and an affordable
    per-dial overhead. Each is a claim about a number and none of them is true until it has been measured
    on this tree.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.48.0-T08
  acceptance_criteria:
  - '**N1 — no new dependency.** `cargo tree` for the default feature set is unchanged at **402** crates
    on macOS and Linux. The proxy is `tokio::net::TcpListener` plus a hand-parsed request line; no `hyper`,
    no `http`, no `tower`, no TLS crate.

    '
  - '**N2 — MSRV unmoved.** The crate builds on 1.95 with the toolchain gate CI already runs.

    '
  - '**N5 — the proxy''s per-dial overhead is measured, not asserted to be small.** The same fixed request
    is timed direct, through the proxy on a permitted host, and refused on a denied one, over the 30-iteration
    shape 0.46.0 used to record ~6.25 ms of containment overhead. Every figure goes into the release record.
    A proxy is a hop and the claim that the hop is affordable is a claim about a number.

    '
  - '**N6 — 0.41.0''s batch, 0.42.0''s gate, 0.43.0''s fold, 0.44.0''s boundary, 0.45.0''s prompt, 0.46.0''s
    default and 0.47.0''s chain are unaffected.** Their suites pass unchanged. Specifically: the composed
    system prompt is still byte-identical across the steps of a run and still composed once — the proxy
    is started once per run and the boundary section names the backend `select` returned, and a per-step
    re-resolution would turn 0.38.0''s cache read into a cache write on every step and fail no other test.

    '
  - '**O1 — the full suite passes on all three platforms**, on the standing CI matrix including 0.47.0''s
    `contained (ubuntu, userns restricted)` leg, which is the leg where the Landlock rung and therefore
    the Linux proxy path is the one actually taken.

    '
  - '**O2 — cross-version is unaffected and proven so.** No DDL, so a 0.47.0 store and a 0.48.0 store
    are the same store in both directions, asserted by the existing cross-version suites.

    '
  files:
  - docs/public-api.txt
  evidence: []
- id: US-IO-HARNESS-0.48.0-T10
  summary: Ask a classifying turn one question instead of two that disagree.
  why_required: The system block tells the first step of a conversational turn to answer and call no tool
    while the user block in the same completion tells it to start by grepping and to call a tool. The
    model resolves the contradiction in its reply, which is what an embedder reported from the field.
    It is wrong on every conversational turn shipping today (US-IO-HARNESS-0.48.0-I03).
  status: done
  depends_on: []
  acceptance_criteria:
  - '**F10 — a classifying turn is asked one question, not two that disagree** (`US-IO-HARNESS-0.48.0-I03`).
    The first request of a turn whose contract carries `Verification::None` contains no imperative to
    call a tool and no success-criterion scaffolding: the strings "Call a tool to make progress toward
    the success criterion", "(nothing yet — start by grepping or finding)" and "Success criterion:" are
    all absent from its `user` block, while the operator''s own words are present. The negative controls
    are what make it a change of one thing: **step 2 of a promoted turn is byte-identical to what this
    build sends today**, and so is step 1 of a turn under any other `Verification`. And 0.44.0''s boundary
    marks the same prefix on a classifying turn as on a promoted one — asserted rather than assumed, because
    `cache_boundary_for` is handed this very string and a second user-prompt shape could silently change
    what is cached while nothing fails. Sabotage: send the workspace user prompt on the classifying step,
    which is today''s behaviour, under which the imperative reappears and only this fails; and separately,
    send the conversational prompt on **every** step, under which the promoted turn''s byte-identity control
    fails and only that fails.

    '
  files:
  - src/run.rs
  - tests/prompt.rs
  evidence:
  - '`cargo test --test prompt` — exit 0, 16 passed, including the four new arms.'
  - 'Sabotage: send the workspace user prompt on the classifying step (0.47.0''s behaviour) — `a_classifying_turn_is_not_told_to_call_a_tool`
    and `a_promoted_turns_later_step_is_asked_as_it_always_was` both FAILED by name.'
  - 'Sabotage: send the conversational prompt on every step — `a_promoted_turns_later_step_is_asked_as_it_always_was`
    FAILED alone; the two openings still passed.'
  - '`cargo test --test session --test context --test cache_boundary` — exit 0, 7 + 16 + 5 passed.'
  - 'The cache-boundary arm is met as an ORDER INVARIANT, not a fold: with no compaction in a two-turn
    session there is no boundary to compare, so the test asserts the property the boundary rests on —
    the operator''s words precede the conversation, as the goal precedes the observations. Stated rather
    than glossed.'
