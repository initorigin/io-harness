product: io-harness
version: 0.57.0
tasks:
  - id: US-IO-HARNESS-0.57.0-T01
    summary: One normaliser and one overlap measure, written once and called by both halves of the
      release.
    why_required: Both halves ask "how much do these two texts have in common", and two answers to
      that question is how the ranking and the duplicate check come to disagree about what a word
      is. The measure also has to be exact at its own threshold, which a float comparison is not.
    status: done
    depends_on: []
    acceptance_criteria:
      - >
        **F13 — the overlap measure is symmetric, exact and immune to word order.** Unit-level: the
        same two texts compared in either direction give the same answer; two texts with the same
        words in a different order are maximally similar; a text and its own copy with one word
        added is not; and the threshold comparison is made on integers, asserted by a pair whose
        float ratio lands on the threshold exactly. Sabotage: compare with `as f64` division, under
        which the exact-boundary case flips and only F13's last assertion fails.
    files:
      - src/context.rs
    evidence:
    - "`the_overlap_measure_is_symmetric_exact_and_immune_to_word_order` and
      `the_normaliser_reduces_a_path_and_a_sentence_to_the_same_words` in `src/state.rs` — 2 passed."
    - "F13's parenthetical was wrong and is recorded rather than dropped: an exactly-60% ratio divides
      to the same f64 the literal 0.6 parses to, so a float comparison does NOT flip the boundary. The
      boundary is asserted in both directions instead, which `>` in place of `>=` breaks (arm S13)."

  - id: US-IO-HARNESS-0.57.0-T02
    summary: The draws aggregate — distinct runs per key — as a `pub(crate) const` beside
      `MEMORY_CANDIDATES_SQL`, with its query plan asserted.
    why_required: The ranking's second term needs it, and it runs once per scope per turn on a table
      that grows by one row per carried key per step for the life of the store. Unindexed it is a
      full scan on the turn's hot path, which is the failure 0.56.0 already paid to learn about.
    status: done
    depends_on: []
    acceptance_criteria:
      - >
        **F8 — the draws aggregate is answered from an index.** `EXPLAIN QUERY PLAN` over the exact
        statement the crate runs, on a store holding 64 entries and 10,000 recall rows, names
        `memory_recalls_entry` and contains no `SCAN memory_recalls`. Asserted on the plan text of
        the `const` itself rather than a copy of it, as 0.56.0's F5 is. Sabotage: query by `run_id`
        instead, under which the plan shows a scan and only F8 fails.
    files:
      - src/state.rs
    evidence:
    - "`ranking_recall_draws_seeks_the_recalls_rather_than_scanning_them` — the plan of
      `Store::MEMORY_DRAWS_SQL` names `memory_recalls_entry` and contains no `SCAN memory_recalls`,
      over 10,048 rows, with a column in no index as the control."
    - "`the_draws_count_is_of_runs_and_not_of_rows` — 200 rows from one run rank below 3 rows from
      three runs."
    - "The row-count guard caught the fixture: 64 keys over 156 steps is 9,984 rows, not the 10,000
      the criterion names. 0.56.0's sibling plan test has been sixteen short of its own claim since it
      shipped; this one asserts the count rather than leaving it as arithmetic in a loop bound."

  - id: US-IO-HARNESS-0.57.0-T03
    summary: Rank at `recall_scopes` from the turn's signals, and split `render_notes` into
      best-first selection and chronological printing.
    why_required: This is the release. Without it recall still curates by the write clock, which is
      the policy 0.56.0's raisable caps made unsafe. The split is what makes a fitting store render
      byte-identically, which is what keeps 0.44.0's cache boundary.
    status: done
    depends_on:
      - US-IO-HARNESS-0.57.0-T01
      - US-IO-HARNESS-0.57.0-T02
    acceptance_criteria:
      - >
        **F1 — a turn about one subject is handed the notes about that subject.** A store holds notes
        on several subjects, sized so the block cannot fit them all. A turn whose goal names one
        subject carries that subject's notes in `Assembled::recalled_keys`, and the notes of the
        other subjects are the ones elided. The same store and the same turn on 0.56.0's ordering
        carry the most recently written notes instead, and that control is written out in the test.
        Sabotage: return the entries in `memory_list` order, under which the recency set is carried
        and only F1 fails.
      - >
        **F2 — a path the run has already read counts as a signal.** With a goal that names nothing
        in the store, a run whose ledger holds an `Observation` targeting `src/state.rs` carries the
        note whose value mentions `src/state.rs` over a newer note that mentions nothing the run has
        touched. Asserted on the carried keys, from a ledger built directly rather than by driving a
        provider. Sabotage: build the signal set from the goal alone, under which the newer note is
        carried and only F2 fails.
      - >
        **F3 — draws break a signal tie, and the write clock breaks a draw tie.** Two entries with an
        identical overlap against the turn are separated by the number of distinct runs that carried
        them; two entries equal on both are separated by `created_at, id`, which is the order
        `memory_list` delivered. Both halves asserted in one test. Sabotage: drop the draws term,
        under which the pair orders by clock alone and only F3's first half fails.
      - >
        **F4 — one long run does not outvote many short ones.** The draws term is
        `COUNT(DISTINCT run_id)`, so an entry carried at two hundred steps of one run ranks below one
        carried at one step of each of three runs. This is 0.56.0's F2 asserted on the other side of
        the same table, and it exists because the obvious spelling of "how often has this been drawn
        on" is a row count. Sabotage: `COUNT(*)`, under which the 200-row entry wins and only F4
        fails.
      - >
        **F5 — a store that fits its share renders byte-for-byte what 0.56.0 rendered.** With every
        note inside the block's quarter-share, the assembled text is identical to the text produced
        with the ranking disabled — asserted as a string equality of the whole memory block, not on
        the set of keys, because the caching claim in `outcome.user_can` is about bytes. Sabotage:
        sort the kept set by rank before printing, under which the block's line order moves and only
        F5 fails.
      - >
        **F6 — the same store and the same turn select the same notes twice.** Two consecutive
        assemblies over one store with one goal and one ledger produce equal `recalled_keys` and
        equal block text. A third assembly after one further note is written produces a selection
        that is still a pure function of the new store — asserted by computing it twice. Sabotage:
        seed the ranking with anything not derived from the store and the turn, under which the two
        runs differ and only F6 fails.
    files:
      - src/context.rs
      - src/run.rs
      - tests/memory_recall.rs
    evidence:
    - "`tests/memory_recall.rs` — 6 passed: F1 (`a_turn_about_one_subject_carries_the_notes_about_that_subject`,
      with the newest-cohort control asserted rather than described), F2
      (`a_path_the_run_has_read_is_a_signal_the_next_turn_recalls_by`, two turns of one run), F3
      (`draws_break_a_signal_tie_and_the_store_order_breaks_a_draw_tie`, evidence earned by real runs
      rather than inserted rows), F5 (`the_block_is_printed_in_the_stores_order_however_the_turn_moves`),
      F6 (`the_same_store_and_the_same_turn_select_the_same_notes_twice`)."
    - "`Store::memory_list` tie-breaks on the key rather than the row id, which is what makes the
      printed order reconstructible from an entry alone. `MemoryEntry` carries no `id`."
    - "The elision line no longer says the dropped notes are `older`. They are dropped for being about
      something else. This is a stated deviation from `scope.included`, which said the elision line was
      unchanged: the substance of that line was kept and one word that had become false was not."

  - id: US-IO-HARNESS-0.57.0-T04
    summary: Build the turn's signals at the tree loop's recall site too, and prove a child agent
      recalls under the same ordering.
    why_required: A release that fixes the workspace loop and not the sub-agent one delivers a
      feature that works until an agent spawns a child. `run_tree_with_extras` is a separate call
      site and has been the place a rule lapses before.
    status: done
    depends_on:
      - US-IO-HARNESS-0.57.0-T03
    acceptance_criteria:
      - >
        **F7 — the ranking reaches the sub-agent loop.** A child agent spawned by a tree run recalls
        under the same ordering as the flat loop over the same store and the same goal — asserted by
        driving a spawn and reading the child's assembled block, not by asserting that one function
        has two callers. Sabotage: rank in `run_workspace_from` rather than in `recall_scopes`, under
        which the child falls back to recency and only F7 fails.
    files:
      - src/run.rs
      - tests/memory_recall.rs
    evidence:
    - "`a_spawned_child_recalls_under_the_same_ordering_as_the_flat_loop` — a real spawn, asserted on
      the child's own prompt, with the parent as the control."
    - "Sabotage run at the time of writing: replacing the tree loop's signals with an empty set failed
      this test and nothing else across all 29 memory tests."
    - "Found while sizing the fixture: a child's `TaskContract` is built fresh by the spawn and does
      NOT inherit the root's `ContextBudget`, so a child always assembles under the default 24,000
      tokens however tightly the root was bounded. Pre-existing and outside this release."

  - id: US-IO-HARNESS-0.57.0-T05
    summary: "`Store::memory_similar`, and the `remember` arm reporting the entry a new note
      restates."
    why_required: "`remember` writes by key, so the same fact under two names leaves two entries
      that disagree and both are carried. The write is the only moment the writer's own intent is
      still available to resolve it."
    status: done
    depends_on:
      - US-IO-HARNESS-0.57.0-T01
    acceptance_criteria:
      - >
        **F9 — a near-duplicate write names the key already held and what it holds.** A run writes
        `build-command: "cargo test --all-features"` and then, under a different key, a value
        restating it. The second call's tool result names the first key and contains its value; the
        observation recorded in the ledger contains the same text. Sabotage: report only that a
        duplicate exists without naming the key, under which the assertion on the key's presence
        fails and only F9 fails.
      - >
        **F10 — an unrelated note is not flagged, and a rewrite of the same key is not flagged.** A
        second note sharing no subject with anything stored produces the plain `[remember <key>]`
        result with no second line; rewriting an existing key with a value nearly identical to its
        own current value is a replacement and is not flagged either. Both halves asserted on the
        absence of the flag text, because an implementation that flags everything passes any test
        that only checks the positive case. Sabotage: drop the same-key exclusion, under which the
        rewrite is flagged and only F10's second half fails.
      - >
        **F11 — the write still lands, and the entry is bounded and quoted with its cut marked.**
        After a flagged write, `Store::memory_list` holds both entries: the harness reports and does
        not refuse. A flagged entry whose value exceeds the quoting bound is quoted truncated with
        the existing marker, so a 2,000-character note cannot push the turn's other observations out.
        Sabotage: refuse the write on a hit, under which the two-entry assertion fails and only F11
        fails.
      - >
        **F12 — the check is per scope.** A workspace write that restates a **global** note is not
        flagged, because the workspace overriding a global note is 0.56.0's designed correction path;
        a workspace write that restates another **workspace** note is. Both directions asserted, and
        the global-write side asserted too, so the rule is "within the scope being written" rather
        than "within the workspace bucket". Sabotage: compare against both scopes, under which the
        override case is flagged and only F12's first half fails.
    files:
      - src/state.rs
      - src/run.rs
      - tests/memory_scope.rs
    evidence:
    - "`tests/memory_scope.rs` — 10 passed, 4 of them new: F9
      (`a_note_that_restates_one_already_held_names_the_key_that_holds_it`), F10
      (`an_unrelated_note_and_a_rewrite_of_one_key_are_not_flagged`, both halves on the ABSENCE of the
      report), F11 (`a_flagged_write_still_lands_and_the_quote_is_bounded`), F12
      (`the_duplicate_check_is_within_the_scope_being_written`, all three directions)."
    - "F11's first fixture padded the held value with a new sentence and put the pair at exactly 50%
      overlap — the measure working, not failing. Padding by repeating the same sentence is what a
      restatement actually looks like."

  - id: US-IO-HARNESS-0.57.0-T06
    summary: Measure the per-turn ranking cost and the added write-path cost at three store sizes,
      and record them.
    why_required: Both costs are paid on paths a turn runs every step, and both are bounded by caps
      an operator sets. A release that hands an operator a knob without saying what pulling it costs
      is the failure 0.56.0's own coupling paragraph exists to prevent — and its N5 is where that
      release found a defect no review had.
    status: done
    depends_on:
      - US-IO-HARNESS-0.57.0-T03
      - US-IO-HARNESS-0.57.0-T05
    acceptance_criteria:
      - >
        **N5 — the per-turn cost of ranking is measured and recorded, never asserted.** The time to
        rank one scope is measured at three store sizes — 64, 512 and 4,096 entries, each with a
        recall table proportional to the store and a ledger of 200 observations — on a named machine,
        in `docs/MEASUREMENTS.md` with the method. The shape to expect is linear in entries × signal
        tokens, stated as such; a timing that does not move when the input grows is a defect report
        and not a pass, which is the standing lesson of 0.56.0's N5.
      - >
        **N6 — the write path's added cost is measured at the caps an operator may set.** The time
        for one `remember` call including `memory_similar` is measured at the same three sizes and
        recorded beside N5. `memory_similar` reads at most `max_entries` rows, so the cost is bounded
        by a cap the operator chose and is stated in the guide where that decision is made.
    files:
      - src/run.rs
      - docs/MEASUREMENTS.md
    evidence:
    - "`memory_recall_cost` in `src/run.rs`, ignored by default. Apple M1, release profile,
      2026-08-15, medians of 20, over a 200-observation ledger (208 signal tokens): ranking one scope
      is 1.106 / 11.088 / 119.171 ms at 64 / 512 / 4,096 entries; a `remember` including the duplicate
      check is 1.946 / 21.172 / 201.369 ms."
    - "Linear in entries and flat in the recall table — the timings moved by ~10x for an 8x input, so
      0.56.0's flat-timing defect shape did not recur. Recorded in `docs/MEASUREMENTS.md` with the
      method, the machine and the upgrade path if a store that large becomes ordinary."

  - id: US-IO-HARNESS-0.57.0-T07
    summary: Update every checked-in doc surface and the changelog to the behaviour this release
      ships.
    why_required: "`docs/CONTRACT.md`, the guide and the README all state that recall carries the
      newest notes that fit, and 0.56.0 added a coupling paragraph whose conclusion this release
      changes. A contract that describes the previous release is worse than no contract."
    status: done
    depends_on:
      - US-IO-HARNESS-0.57.0-T03
      - US-IO-HARNESS-0.57.0-T05
      - US-IO-HARNESS-0.57.0-T06
    acceptance_criteria:
      - >
        **O3 — `docs/CONTRACT.md` is amended in this release, by name.** Its memory section states
        that recall carries the newest notes that fit. That changes. The new rules — selection by the
        turn's signals then by draws then by the clock, the rendered order staying chronological and
        why, and the near-duplicate report — are written where the old sentences stood.
      - >
        **O6 — the checked-in doc surfaces are updated in this release.**
        `docs/guide/context-and-memory.md` (what decides which notes are carried, and that the
        printed order is chronological), `docs/guide/tools-and-skills.md` (`remember`'s duplicate
        report), `docs/guide/configuration.md` (the coupling paragraph 0.56.0 added, which now says
        what selection does past the share), `docs/CAPABILITIES.md`, `docs/MEASUREMENTS.md`, the
        README's memory description and the changelog. Every new public item carries a worked
        example; `cargo test --doc` and `tests/public_api.rs` pass.
    files:
      - docs/CONTRACT.md
      - docs/CAPABILITIES.md
      - docs/guide/context-and-memory.md
      - docs/guide/tools-and-skills.md
      - docs/guide/configuration.md
      - CHANGELOG.md
      - README.md
    evidence:
    - "`docs/CONTRACT.md` — two new rules written where the memory section's own sentences stood, and
      0.56.0's coupling paragraph now says raising a cap costs time rather than relevance."
    - "`CHANGELOG.md` 0.57.0 section: 2 Added, 4 Changed."
    - "`docs/guide/context-and-memory.md`, `docs/guide/tools-and-skills.md`,
      `docs/guide/configuration.md`, `docs/CAPABILITIES.md`, `README.md` and the `render_notes`
      rustdoc."
    - "Doc gates: `changelog` 5 passed, `docs_drift` 15 passed, `public_api` 9 passed —
      `public_surface_matches_snapshot` green with `docs/public-api.txt` UNCHANGED, which is N2's
      predicted +0 lines met exactly."
