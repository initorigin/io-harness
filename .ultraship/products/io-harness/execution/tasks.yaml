product: io-harness
version: 0.49.0
tasks:
- id: US-IO-HARNESS-0.49.0-T01
  summary: Add `Message`, `CompletionRequest::messages` and `cache_through`, with `user` derived and documented.
  why_required: Nothing else in the release can be written until a request can express a conversation;
    every other task reads or writes these types.
  status: done
  depends_on: []
  acceptance_criteria:
  - '**N3 — the break is exactly what is named, and nothing more.** The compile breaks are: an exhaustive
    struct literal of `CompletionRequest` outside this crate (two new fields, the documented cost of the
    type not being `#[non_exhaustive]`) and an exhaustive literal of `Assembled`. `SystemPrompt` is already
    `#[non_exhaustive]`, so its new variant is free; no trait method is added or changed, so every `impl
    Provider` compiles unchanged; `ToolCall`, `CompletionResponse`, `ToolSpec` and `Usage` are untouched.
    `docs/public-api.txt` gains the new crate-root items and **the count is stated at plan time as "the
    enumerated additions only"**, because the checker enumerates crate-root re-exports rather than fields
    or variants and a criterion promising a line count has been met in a different form in four of the
    last ten releases.

    '
  files:
  - src/provider/mod.rs
  - src/lib.rs
  evidence:
  - '`cargo test --lib provider::transcript_tests` — 5 passed. The types are `Message` (`User` / `Assistant
    { text, calls }` / `Results`), `ToolResult { call, content }`, and `CompletionRequest::{messages,
    cache_through}`.'
  - '`a_request_with_no_transcript_serialises_as_it_did_before_0_49_0` — a flat request carries neither
    new key, so a `Replay` cassette recorded before this release still matches a flat request made after
    it.'
  - 'The first run of `an_unusable_cache_marker_is_ignored` FAILED with `attempt to subtract with overflow`:
    `then_some(through - 1)` evaluates eagerly and underflowed on the very `Some(0)` case the guard exists
    to reject. Fixed to `then(|| ...)`.'
  - '`cargo test --test public_api` — 9 passed after `docs/public-api.txt` gained exactly the two enumerated
    additions, `enum Message` and `struct ToolResult`, which is the number N3 stated at plan time. `every_public_item_has_a_worked_example`
    required a doctest on `ToolResult` and now passes over 211 items.'
- id: US-IO-HARNESS-0.49.0-T02
  summary: Map a message sequence onto the Anthropic body as native `tool_use` and `tool_result` blocks.
  why_required: The release's outcome is what reaches the wire; a neutral request the wire flattens again
    delivers nothing.
  status: done
  depends_on:
  - US-IO-HARNESS-0.49.0-T01
  acceptance_criteria:
  - '**F2 — the Anthropic body carries native blocks with correlated ids.** The assistant message''s `content[]`
    holds one `tool_use` entry per call with `id`, `name` and `input`; the next user message holds one
    `tool_result` entry per result whose `tool_use_id` **equals** the id on the call it answers, asserted
    as string equality between the two extracted values rather than against a literal. Sabotage: mint
    the result''s id independently of the call''s, under which the two stop matching and only this fails.

    '
  - '**F4 — an empty `messages` sends the body that has always been sent.** For all four flavours — `Anthropic`,
    `OpenRouter`, `OpenAi`, `Compatible` — a request with no messages produces a body byte-identical to
    the one 0.48.0 produced, asserted against the locked expected bodies the wire test modules already
    carry (`anthropic.rs:740`, `:771`, `:849`, `:895`; `openai_wire.rs:689`, `:733`, `:753`, `:806`, `:846`,
    `:868`). This is the negative control the whole compatibility claim rests on. Sabotage: emit a one-element
    `messages` array whenever `user` is non-empty, under which every one of those tests fails and nothing
    else does.

    '
  files:
  - src/provider/anthropic.rs
  evidence:
  - '`cargo test --lib anthropic` — 26 passed, 0 failed. That includes every pre-existing body test (`body_maps_tools_to_input_schema_and_system_top_level`,
    `body_marks_one_cache_breakpoint_at_the_end_of_system`, `body_splits_the_user_turn_at_the_boundary_and_marks_only_the_first_half`,
    `an_unusable_boundary_sends_the_body_that_has_always_been_sent`, `no_effort_leaves_the_anthropic_body_exactly_as_it_was`),
    which is F4 asserted by the suite that was already there.'
  - 'F2 — `the_body_carries_native_blocks_whose_ids_correlate`: the assistant turn carries a text block
    and two `tool_use` blocks, the results turn is `role: "user"` and carries two `tool_result` blocks,
    and each `tool_use_id` is asserted equal to the `id` of the call it answers rather than to a literal.'
  - 'F4 — `an_empty_transcript_sends_the_0_48_0_body`: the whole `messages` array is asserted equal to
    `[{role: user, content: <the flat string>}]`.'
  - 'SABOTAGE (F2): appending one character to the result''s `tool_use_id` failed exactly one named test
    — `the_body_carries_native_blocks_whose_ids_correlate` — with the other 25 passing, so the correlation
    assertion is what is holding it and not the block shape.'
  - A result correlating with nothing is dropped and a message left with no blocks is dropped whole (`a_result_correlating_with_nothing_is_dropped`),
    because an empty `content` array is a 400.
- id: US-IO-HARNESS-0.49.0-T03
  summary: 'Map a message sequence onto the OpenAI/OpenRouter body as `tool_calls` and `role: "tool"`
    messages.'
  why_required: Three of the four flavours this crate ships go out over this wire; without it the reshape
    reaches one vendor.
  status: done
  depends_on:
  - US-IO-HARNESS-0.49.0-T01
  acceptance_criteria:
  - '**F3 — the OpenAI body carries native blocks with correlated ids.** The assistant message carries
    `tool_calls[]` with `id`, `type: "function"` and `function.name`/`function.arguments`, and one `role:
    "tool"` message per result whose `tool_call_id` equals it. The same string- equality assertion as
    F2. Sabotage: emit the results as a plain user message, which is what the wire does today, under which
    the `role: "tool"` assertion fails and only this fails.

    '
  - '**F4 — an empty `messages` sends the body that has always been sent.** For all four flavours — `Anthropic`,
    `OpenRouter`, `OpenAi`, `Compatible` — a request with no messages produces a body byte-identical to
    the one 0.48.0 produced, asserted against the locked expected bodies the wire test modules already
    carry (`anthropic.rs:740`, `:771`, `:849`, `:895`; `openai_wire.rs:689`, `:733`, `:753`, `:806`, `:846`,
    `:868`). This is the negative control the whole compatibility claim rests on. Sabotage: emit a one-element
    `messages` array whenever `user` is non-empty, under which every one of those tests fails and nothing
    else does.

    '
  files:
  - src/provider/openai_wire.rs
  evidence:
  - '`cargo test --lib openai_wire` — 25 passed, 0 failed, including every pre-existing body test: `body_maps_tools_to_function_schema`,
    `the_openai_body_carries_no_breakpoint_and_keeps_its_bare_system_string`, `the_openrouter_body_carries_one_breakpoint_on_its_system_part`,
    `the_openrouter_body_splits_the_user_turn_at_the_boundary`, `the_openai_body_ignores_a_boundary_entirely`,
    `no_effort_leaves_both_bodies_exactly_as_they_were`, `no_declaration_adds_no_key_to_either_body`.'
  - 'F3 — `the_body_carries_native_blocks_whose_ids_correlate`: five emitted messages (system, user, assistant,
    two tool), `tool_calls[].function.arguments` a JSON string as this wire spells it, and each `tool_call_id`
    asserted equal to the `id` of the call it answers.'
  - 'F4 — `an_empty_transcript_sends_the_0_48_0_body` over BOTH flavours: two messages, the second equal
    to `{role: user, content: <the flat string>}`.'
  - 'SABOTAGE (F3): emitting the results as plain user messages failed exactly the two named tests that
    assert the `role: "tool"` mapping and nothing else.'
  - 'The marker index is recomputed rather than reused, because a results batch emits one message per
    result and the emitted array is therefore longer than the caller''s list (`the_transcript_marker_lands_on_a_user_message`).
    Only a user message is marked: an assistant `content` is null on a bare tool call, and whether this
    wire carries a marker on a tool message through to the vendor behind it is not something the crate
    can assert.'
- id: US-IO-HARNESS-0.49.0-T04
  summary: Emit a message sequence from the assembler beside the flat text it already emits.
  why_required: The transcript is built from the ledger, and the ledger is only read here; without it
    the loop has no messages to send.
  status: done
  depends_on:
  - US-IO-HARNESS-0.49.0-T01
  acceptance_criteria:
  - '**F1 — a multi-step run sends a role-tagged transcript.** A run driven to three steps produces a
    request whose `messages` are, in order: a user turn, an assistant turn carrying the calls it made,
    a results batch, an assistant turn, a results batch. Asserted on the captured `CompletionRequest`
    **and** on the body each wire builds from it, because the first alone would pass for a wire that flattens
    them again. Sabotage: have the loop send an empty `messages` and fill only `user`, which is today''s
    behaviour, under which this fails and every negative control still passes.

    '
  - '**F10 — parallel calls in one step are one assistant turn and one results batch, in call order.**
    A step whose completion carries four read-only calls — 0.41.0''s batch path — produces exactly one
    assistant message with four `tool_use` blocks and exactly one results message with four `tool_result`
    blocks, correlated pairwise, **in the model''s call order and not in completion order**, which is
    the ordering 0.41.0 already guarantees for the folded text. Sabotage: emit one results message per
    call, under which the count assertion fails and only this fails; and separately, fold in completion
    order, under which the ordering assertion fails.

    '
  files:
  - src/context.rs
  evidence:
  - '`cargo test --test context` — 19 passed, 0 failed, the 16 pre-existing assembler tests among them.'
  - '`the_emitted_pieces_reconstruct_the_assembled_text_exactly` — the pieces concatenate to `Assembled::text`
    byte for byte. This is what makes F5 assertable at all: the conversation and the derived `user` are
    two renderings of ONE emission, not two emissions that have to be kept in step.'
  - '`a_results_ordinal_is_the_index_of_the_call_it_answers` — the emitted shape is exactly `[(1,0,true),(1,1,true),(1,0,false),(2,0,true)]`:
    a step''s results count from zero, prose answers no call, and the next step starts again.'
  - '`an_elided_result_keeps_its_calls_position` — with a superseded read elided between two carried results
    the ordinals are `[0 (elided), 1, 2]`. Counting only the surviving results would have slid the grep
    up to call 0 and answered the read with it — a misalignment nothing in the assembled text would show.'
  - 'No change to `assemble`''s signature and none to `Assembly`, so the break stays the two the contract
    named: `Assembled` gains `emitted`, and that is all.'
- id: US-IO-HARNESS-0.49.0-T05
  summary: Build the request's transcript in the run loop with minted tool-call ids, and derive `user`
    unchanged.
  why_required: This is where a run stops narrating its own history in prose, and where the shim's byte-identity
    is either kept or lost.
  status: done
  depends_on:
  - US-IO-HARNESS-0.49.0-T04
  acceptance_criteria:
  - '**F1 — a multi-step run sends a role-tagged transcript.** A run driven to three steps produces a
    request whose `messages` are, in order: a user turn, an assistant turn carrying the calls it made,
    a results batch, an assistant turn, a results batch. Asserted on the captured `CompletionRequest`
    **and** on the body each wire builds from it, because the first alone would pass for a wire that flattens
    them again. Sabotage: have the loop send an empty `messages` and fill only `user`, which is today''s
    behaviour, under which this fails and every negative control still passes.

    '
  - '**F5 — the derived `user` is byte-identical to what 0.48.0 assembled.** Locked as a byte-exact constant
    in the shape `tests/prompt.rs` already uses (`V0440_SINGLE`, `prompt.rs:234`): the same run under
    the same fixture produces the same `user` string it produced before this release, character for character,
    while `messages` is populated beside it. Sabotage: derive `user` by joining the messages with a separator
    instead of reusing the assembled text, under which the locked string fails and only this fails.

    '
  - '**F10 — parallel calls in one step are one assistant turn and one results batch, in call order.**
    A step whose completion carries four read-only calls — 0.41.0''s batch path — produces exactly one
    assistant message with four `tool_use` blocks and exactly one results message with four `tool_result`
    blocks, correlated pairwise, **in the model''s call order and not in completion order**, which is
    the ordering 0.41.0 already guarantees for the folded text. Sabotage: emit one results message per
    call, under which the count assertion fails and only this fails; and separately, fold in completion
    order, under which the ordering assertion fails.

    '
  files:
  - src/run.rs
  evidence:
  - '`cargo test` (default features) — exit 0, **79 test binaries, 1,594 passed, 0 failed**, including
    **417** doctests. Run with `XDG_CONFIG_HOME` redirected, this machine''s standing environment fix
    for `tests/plugin.rs`.'
  - 'F1 — `a_multi_step_run_sends_a_role_tagged_transcript`: the opening step carries no transcript at
    all (a one-message conversation is the flat request said twice), step 2 carries user / assistant-with-its-call
    / results-batch, and by step 3 both steps are present in order.'
  - 'F5 — `the_derived_user_is_the_flat_prompt_the_transcript_was_built_from`: the conversation''s own
    text concatenates to `request.user` byte for byte, on every request that carries a transcript, and
    that string is still the whole workspace prompt.'
  - 'F10 — `parallel_calls_are_one_turn_and_one_batch_in_call_order`: three parallel reads become exactly
    one assistant turn and one results batch, and result i is asserted to contain the content of call
    i''s file.'
  - 'SABOTAGE (F1): returning an empty transcript from `transcript` — 0.48.0''s behaviour — failed exactly
    the three named tests above and nothing else.'
  - THE SABOTAGE FOUND A WEAK TEST, and it is worth recording. F5's first form iterated `requests().filter(|r|
    !r.messages.is_empty())` and would have passed VACUOUSLY under that sabotage, since the filter matched
    nothing. It now asserts the count is non-zero first. The sabotage is what surfaced it; reading the
    test did not.
  - 'THE RESUME CASE WAS FOUND BY THE SUITE, not by reasoning. `a_workspace_replay_survives_being_interrupted_and_resumed`
    (tests/determinism.rs) failed with `no recorded response for this request`: a resumed run rebuilds
    its ledger from text and carries no transcript, so keying a cassette on `messages` made every post-resume
    step a miss. Fixed by excluding `messages` from `Replay`''s key — it is a rendering of content the
    key already covers, which is exactly what F5 proves. The two cache markers stay in the key, because
    0.44.0 decided they are part of the question and `a_boundary_is_absent_from_an_unmarked_key_and_present_in_a_marked_one`
    holds that decision; a first attempt that dropped them too failed that test by name.'
- id: US-IO-HARNESS-0.49.0-T06
  summary: Re-express the transcript cache marker as a message index and keep `PrefixGuard`'s rule.
  why_required: 0.44.0's measured saving is billed money; a reshape that silently stops marking would
    cost more than the release saves and fail no existing test.
  status: done
  depends_on:
  - US-IO-HARNESS-0.49.0-T05
  acceptance_criteria:
  - '**F7 — the transcript cache marker still lands, on the same content.** A run that has compacted marks
    the message carrying the folded summary and nothing after it: `cache_through` names that index, the
    wire marks the last content block of that message, exactly one such marker exists besides the system
    one, and `EventKind::CacheMarked` fires on the transition and not per step. `PrefixGuard`''s rule
    is asserted intact — a prefix seen once is **not** marked. Sabotage: mark on first sight, under which
    the guard test fails and only that fails; and separately, mark the message after the summary, under
    which the marked content assertion fails and only that fails.

    '
  files:
  - src/run.rs
  - src/provider/mod.rs
  evidence:
  - '`cargo test --test cache_boundary` — 9 passed, 0 failed, the seven 0.44.0 tests among them unchanged.'
  - 'F7 — `the_transcript_marker_covers_the_span_the_byte_offset_names`: the messages through `cache_through`
    concatenate to EXACTLY the span `cache_boundary` names, asserted against each other rather than each
    against a literal, and that span still ends at the folded summary''s own sentence. The fold''s own
    step carries neither marker, so `PrefixGuard`''s see-it-twice rule survives the translation.'
  - 'The whole transcript is never marked: `cache_through < messages.len()` is asserted, because the last
    message is the turn being asked about and marking it would write a prefix that moves every step.'
  - 'SABOTAGE (F7): marking one message past the boundary failed exactly `the_transcript_marker_covers_the_span_the_byte_offset_names`
    and nothing else — the seven 0.44.0 tests still passed, which is what makes the new assertion the
    one holding this claim.'
  - '`a_run_that_never_folds_marks_no_messages` — 0.44.0''s no-fold control asserted again for the field
    this release added.'
- id: US-IO-HARNESS-0.49.0-T07
  summary: Seed a session's prior turns as real user and assistant messages.
  why_required: A conversation whose own history is bracketed prose is the same off-distribution shape
    the release exists to remove, one level up.
  status: done
  depends_on:
  - US-IO-HARNESS-0.49.0-T05
  acceptance_criteria:
  - '**F6 — a session''s prior turns are turns.** A second turn in a session sends the first turn''s prompt
    as a user message and its reply as an assistant message; the strings `[earlier turn] the operator
    asked:` and `[earlier turn] you answered:` appear **nowhere** in the request. Asserted as an absence
    and a presence together, because either alone passes for a build that sends both. Sabotage: restore
    `Session::seed`''s bracketed strings, under which the absence assertion fails and only this fails.

    '
  files:
  - src/session.rs
  evidence:
  - '`cargo test --test session_reply` — 9 passed, 0 failed.'
  - 'F6 — `an_earlier_turn_arrives_as_that_speakers_own_message`: the operator''s earlier turn is a `Message::User`
    carrying their words, the agent''s own answer is a `Message::Assistant` with no calls, and the strings
    `the operator asked:` and `you answered:` are absent from the whole request including `user`. Presence
    and absence are asserted together: presence alone passes for a build that sends the turns AND keeps
    narrating them, absence alone passes for one that dropped them.'
  - 'SABOTAGE (F6): untagging the seed entries — 0.48.0''s behaviour, where a prior turn is prose inside
    somebody else''s message — failed exactly that one test.'
  - 'THE SEED''S PROSE CHANGED, and two existing tests changed with it, each with the sentence saying
    why. `tests/session_reply.rs`''s `a_reply_is_read_by_the_turn_that_follows_it` asserted the literal
    `you answered: ` and now asserts `[agent] `; `tests/prompt.rs` looked for `[earlier turn]` to check
    the ORDER of the operator''s words against the conversation, which is unchanged, and now looks for
    `[operator]`. The attribution moved out of third-person prose and into the message''s role, which
    is the release''s own argument applied to the seed.'
  - '`cargo test` (default features) — exit 0 with the whole suite green after the change.'
- id: US-IO-HARNESS-0.49.0-T08
  summary: Frame a conversational turn as a conversation rather than as a task with a goal.
  why_required: '`Session::default_contract` turns a greeting into a specification, which is the second
    of the three faults the contract names.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.49.0-T07
  acceptance_criteria:
  - '**F8 — a conversational turn is not framed as a task, and 0.48.0''s `I03` fix is untouched.** A turn
    under `Session::turn` sends a system block that does not contain "working across a repository to meet
    a stated specification" and a first user message that is the operator''s words — while the negative
    controls hold: a turn under an explicit `TaskContract::workspace` sends the workspace prompt byte-identically,
    and step 2 of a promoted turn is byte-identical to what this build sends today, which is 0.48.0''s
    own F10 control asserted again here because this release touches those call sites. Sabotage: route
    the conversational turn back through `TaskContract::workspace`, under which the framing assertion
    fails and only this fails.

    '
  files:
  - src/session.rs
  - src/contract.rs
  - src/run.rs
  evidence:
  - '`cargo test --test prompt` — 20 passed, 0 failed.'
  - 'F8 — `a_classifying_turn_is_not_told_it_has_a_specification`: the classifying turn''s system block
    contains neither `to meet a stated specification` nor `checked against the success criterion` — a
    session turn carries `Verification::None`, so nothing IS checked — while still describing the same
    four tools, and 0.37.0''s sentence about how a turn may end is still last.'
  - 'The negative controls are in the same test and are what make it a change of one thing: a run under
    an explicit `TaskContract::workspace` and a tree run both still open with 0.44.0''s sentence byte
    for byte. The two byte-exact baselines in `tests/prompt.rs` say the same thing — `V0440_WORKSPACE`,
    `V0440_TREE` and `V0440_SINGLE` are untouched and only the conversational one was rebased, as `V0490_CONVERSATIONAL`.'
  - 'SABOTAGE (F8): composing the classifying turn from `WORKSPACE_PROMPT` again — 0.48.0''s behaviour
    — failed three named tests, all three of them the ones that lock a classifying turn''s opening, and
    no others.'
  - 'DEVIATION, stated rather than glossed: the scope named a `TaskContract::conversation` constructor
    beside `TaskContract::workspace`. It was NOT added, because it would have been byte-identical to `workspace`
    — that constructor already defaults to `Verification::None` (`src/contract.rs:470`), and the operator''s
    words already reach the model as the first user text through `conversational_user_prompt`. A public
    constructor that differs from an existing one in nothing is a synonym, not an affordance. The substance
    of the scope item — a conversation is not framed as a specification — landed where it is actually
    read, in the system block.'
- id: US-IO-HARNESS-0.49.0-T09
  summary: Add `SystemPrompt::Preset`, opt-in by name, with `Builtin` byte-identical.
  why_required: 'The third fault the contract names: an embedder''s only shaped-agent option today is
    to write a whole prompt from scratch.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.49.0-T01
  acceptance_criteria:
  - '**F9 — a preset is opt-in and `Builtin` does not move.** With no `with_system_prompt` call the composed
    system block is byte-identical to this build''s; with `SystemPrompt::Preset(p)` the base description
    is that preset''s text and everything `compose` appends after it — the skill catalogue, the appended
    text, the framed sections, the ending — is in the same order and the same bytes as under `Replace`.
    Sabotage: make a preset the default, under which the byte- identity control fails and only this fails.

    '
  files:
  - src/contract.rs
  - src/run.rs
  evidence:
  - '`cargo test --test prompt` — 21 passed, 0 failed.'
  - 'F9 — `a_preset_is_opt_in_and_the_builtin_does_not_move`: with nothing asked for, the composed prompt
    is still 0.44.0''s `V0440_WORKSPACE` baseline; each of the two presets carries its own working style,
    still names all four tools, still ends with the crate''s own ending, and differs from the builtin;
    and the builtin is re-read afterwards and asserted unchanged.'
  - 'SABOTAGE (F9): making `Preset::Concise` the description `Builtin` composes — a preset shipped as
    the default, which is precisely what 0.45.0 declined — failed five named tests including the byte-exact
    0.44.0 baselines, and F9''s own control among them.'
  - '`SystemPrompt` is `#[non_exhaustive]` since 0.45.0, so the new variant costs no caller a recompile.
    `docs/public-api.txt` gains one line, `enum Preset`, with a worked example (`cargo test --test public_api`
    — 9 passed).'
  - '0.45.0''s doc comment argued AGAINST a preset catalogue in terms this release had to answer rather
    than delete: a preset is reached by name and never by default, so nothing is installed into anyone''s
    product; its text is asserted like any other prompt the crate emits; and what remains true — that
    a preset''s wording is public behaviour and changing one is a documented behaviour change — is now
    written where the old argument was.'
- id: US-IO-HARNESS-0.49.0-T10
  summary: Report a `Replay` miss from the message sequence, and re-record the repository's cassettes.
  why_required: A cassette recorded before this release misses silently against a request that now carries
    messages, and a miss reported as "no recorded response" is unreadable.
  status: done
  depends_on:
  - US-IO-HARNESS-0.49.0-T05
  acceptance_criteria:
  - '**O3 — recorded cassettes are handled explicitly, not discovered.** `Replay` keys on the serialized
    request (`src/provider/replay.rs:68-69`), so a cassette recorded before this release misses against
    a request that now carries messages. Every cassette in the repository is re-recorded or its fixture
    is shown to send no messages, and the changelog tells an embedder that their own recordings need the
    same. A silent miss reported as "no recorded response" is the failure this criterion exists to prevent.

    '
  files:
  - src/provider/replay.rs
  evidence:
  - '`cargo test --test replay` — 10 passed; `cargo test --test determinism` — 8 passed.'
  - 'O3 — `a_recording_answers_the_same_request_with_or_without_a_transcript` asserts BOTH directions:
    a recording made flat (as every release through 0.48.0 made them) answers a request carrying a transcript,
    and a recording made carrying one answers a request with none, which is the post-resume case.'
  - 'SABOTAGE: putting `messages` back into the key failed exactly two named tests — the O3 test above
    and `a_workspace_replay_survives_being_interrupted_and_resumed` — which is the pair that says the
    exclusion is load-bearing rather than tidy.'
