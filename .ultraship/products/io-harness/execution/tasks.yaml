product: io-harness
version: 0.51.0
tasks:
- id: US-IO-HARNESS-0.51.0-T01
  summary: Render a whole-file unified diff, and reverse-apply one, as pure functions in this crate.
  why_required: Every other piece of the release reads or writes a hunk. Without a differ that round-trips
    there is nothing to store, nothing to render and nothing to revert, and a fragment-anchored diff is
    the failure F1 exists to catch.
  status: done
  depends_on: []
  acceptance_criteria:
  - '**F1 — a stored hunk is anchored to the file and reverse-applies byte for byte.** A run edits a file
    at a known line with `edit_file`; `Store::edits(run)` returns that edit with a `hunk` whose `@@` header
    names the **file''s** line numbers, and applying it in reverse to the file''s after text reproduces
    the before text byte for byte, trailing newline included. Asserted for a change at the start of a
    file, in the middle, at the end, and in a file with no final newline — four positions, because a fragment-anchored
    diff is right by accident at the start and wrong everywhere else. Sabotage: compute the hunk from
    `search`/`replacement` rather than from the file''s two texts, under which every position but the
    first fails and nothing else here does.

    '
  - '**N1 — no new dependency.** `cargo tree` for the default feature set is unchanged at **402** crates
    on macOS and Linux. The differ is the head-and-tail walk `Edit::measure` already performs; the unified-diff
    parser and applier are written in this crate. A diff or patch crate is a criterion failure, not a
    trade-off.

    '
  files:
  - src/state.rs
  evidence:
  - '17 unit tests in src/diff.rs pass: cargo test --lib diff:: — 17 passed, 0 failed.'
  - 'generated_pairs_round_trip_in_both_directions drives 2000 generated (old, new) pairs through render
    -> parse -> apply and render -> parse -> reverse -> apply, requiring both to reproduce the other side
    byte for byte. It failed on case 106 and the failure was a real defect, not a fixture: a line''s identity
    includes whether it is terminated, so comparing text alone made an unterminated last line equal to
    the identically-spelled terminated one. Fixed by comparing (text, is-unterminated-last-line) as the
    unit, which also deleted the special case the hand-written tests had needed.'
  - 'Two defects the hand-written cases found first: str::lines() strips a trailing carriage return, so
    parsing a CRLF patch silently deleted the \r from every line and wrote back mixed endings — parse
    now splits on \n by hand; and a file that only gained or lost its final newline rendered a hunk of
    pure context lines that changed nothing.'
  - 'No dependency added: the differ is the common-head/common-tail walk Edit::measure already performs,
    and the parser and applier are ~200 lines in src/diff.rs.'
- id: US-IO-HARNESS-0.51.0-T02
  summary: Store the hunk on every edit, without moving the line counts.
  why_required: The release's outcome is that a change stops being a pair of counts. The counts themselves
    have meant 'the size of the replacement' since 0.18.0 and rewriting them silently is the release's
    largest own-goal, so the two computations must be separate.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.51.0-T01
  acceptance_criteria:
  - '**F1 — a stored hunk is anchored to the file and reverse-applies byte for byte.** A run edits a file
    at a known line with `edit_file`; `Store::edits(run)` returns that edit with a `hunk` whose `@@` header
    names the **file''s** line numbers, and applying it in reverse to the file''s after text reproduces
    the before text byte for byte, trailing newline included. Asserted for a change at the start of a
    file, in the middle, at the end, and in a file with no final newline — four positions, because a fragment-anchored
    diff is right by accident at the start and wrong everywhere else. Sabotage: compute the hunk from
    `search`/`replacement` rather than from the file''s two texts, under which every position but the
    first fails and nothing else here does.

    '
  - '**F2 — the line counts do not move, and this is the negative control the release rests on.** Over
    a corpus of `edit_file` and `write_file` calls covering replacement, insertion, deletion and a rewrite
    with identical content, `lines_added` and `lines_removed` are identical to this build''s for every
    row. Sabotage: measure the counts from the whole-file texts the hunk is computed from — the natural
    tidy-up — under which at least one count moves and F1 still passes.

    '
  - '**N4 — the DDL is exactly two additive columns and nothing else.** `git diff main -- src/state.rs`
    shows `ALTER TABLE edits ADD COLUMN hunk TEXT` and `ALTER TABLE rewinds ADD COLUMN undid_step INTEGER`,
    each by the established `let _ = conn.execute(..)` line, and no `CREATE TABLE`, no `CREATE INDEX`
    and no `CHECKPOINT_FORMAT` movement — it stays at 7.

    '
  files:
  - src/state.rs
  - src/run.rs
  - tests/edit_file.rs
  evidence: []
