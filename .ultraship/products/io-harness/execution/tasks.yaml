    section.
  why_required: Shipping an LSP client while a module doc says an LSP client was rejected is a surface
    contradicting the code — the mistake 0.51.0 caught in verify.rs. The docs gates fail the build without
    this, and the record cannot claim the surfaces agree.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.52.0-T07
  - US-IO-HARNESS-0.52.0-T08
  acceptance_criteria:
  - '**O5 — the documentation surfaces agree with the code, in the same release.** `docs/CONTRACT.md`,
    `src/lib.rs`, the README, the guide pages and `CHANGELOG.md` describe what a server is gated on, that
    rename returns a patch and writes nothing, that diagnostics augment and are pull-only, and the `deny_read`
