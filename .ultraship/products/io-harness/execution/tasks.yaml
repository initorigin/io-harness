product: io-harness
version: 0.60.2
tasks:
- id: US-IO-HARNESS-0.60.2-T01
  summary: Rewrite the pre-0.45.0 exec paragraph in docs/CONTRACT.md, and add F1.
  why_required: >-
    This is the reason the release is first and the half the fallback scope refuses to drop. The contract
    currently tells a reader that a command runs outside the sandbox with the embedding program's privileges,
    which stopped being true at 0.45.0 and is contradicted 1,300 lines earlier in the same file. Without
    this the release closes nothing that matters.
  status: todo
  depends_on: []
  acceptance_criteria:
  - >
    **F1 — the contract states one exec boundary.** A test asserts `docs/CONTRACT.md` does not contain
    the phrase "outside the sandbox" in the command-execution section, and does contain a statement
    naming `ExecMode::WorkspaceWrite` as the default. It must fail on today's file, which contains the
    phrase at line 2536. Sabotage: restore the pre-0.45.0 sentence, under which only F1 fails.
  - >
    **N3 — no claim is widened.** Every containment sentence surviving the rewrite is at most as strong
    as what `src/sandbox.rs` and `src/run.rs` implement, per platform. The correction being made here
    is a claim that was too weak in one place and too strong in another; the failure mode of fixing
    it is overshooting into a guarantee the portable floor cannot keep. Evidenced by the review, section
    against source.
  files:
  - docs/CONTRACT.md
  - tests/docs_drift.rs
  evidence: []
- id: US-IO-HARNESS-0.60.2-T02
  summary: Drop the retired sentence from the exec_sandbox rustdoc, and add F2.
  why_required: >-
    The same false boundary in the second place a caller reads it, and the only one that renders on
    docs.rs. `TaskContract::exec_sandbox` still carries the clause `docs/CONTRACT.md:1222` names as
    the one 0.48.0 retired, so a caller who reads the API docs rather than the contract is told the
    shell handles escape containment.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.60.2-T01
  acceptance_criteria:
  - >
    **F2 — the `exec_sandbox` rustdoc does not carry the retired sentence.** A test asserts `src/contract.rs`
    does not contain "not contained" within the `exec_sandbox` doc block. It must fail on today's source,
    which contains it at line 406. Sabotage: restore the 0.47.0-era clause, under which only F2 fails.
    This is a doc-comment assertion over a source file, which `tests/docs_drift.rs` does not currently
    do for `src/` — the one genuinely new shape of check in this release.
  - >
    **N1 — nothing under `src/` changes except documentation.** `git diff develop -- src/` shows only
    lines inside `//!` or `///` comments, and `docs/public-api.txt` is byte-identical to the 0.60.1
    snapshot. Asserted by reading the diff and by `public_api.rs` staying green with no snapshot regeneration.
    This is what makes 0.60.2 a patch, and it is the criterion the release fails on if the eighteen
    reserved names are smuggled in beside the doc comment that describes them.
  files:
  - src/contract.rs
  - tests/docs_drift.rs
  evidence: []
- id: US-IO-HARNESS-0.60.2-T03
  summary: >-
    Correct the reserved-name claims in the guide, in the contract and in the set's own doc comment,
    and add F3.
  why_required: >-
    The guide's bullet is wrong in both directions at once — it says the feature-gated built-ins are
    not reserved, which 0.17.0 made false, and its hand-typed list names `forget`, which is not reserved,
    while omitting seven names that are. The doc comment over `RESERVED_TOOL_NAMES` and the 0.17.0 paragraph
    in `docs/CONTRACT.md` make the same over-strong claim from the other side. One class of claim, three
    places, one task.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.60.2-T01
  acceptance_criteria:
  - >
    **F3 — the guide's reserved-name claim matches the source.** A test asserts `docs/guide/tools-and-skills.md`
    does not contain the phrase "are *not* in the reserved set", and does not hand-list reserved names
    that `RESERVED_TOOL_NAMES` does not hold. It must fail on today's file, which claims the opposite
    of the source and names `forget`. Sabotage: reinstate `forget` in the guide's list, under which
    only F3 fails and names it.
  - >
    **N1 — nothing under `src/` changes except documentation.** `git diff develop -- src/` shows only
    lines inside `//!` or `///` comments, and `docs/public-api.txt` is byte-identical to the 0.60.1
    snapshot. Asserted by reading the diff and by `public_api.rs` staying green with no snapshot regeneration.
    This is what makes 0.60.2 a patch, and it is the criterion the release fails on if the eighteen
    reserved names are smuggled in beside the doc comment that describes them.
  files:
  - docs/guide/tools-and-skills.md
  - docs/CONTRACT.md
  - src/tools/custom.rs
  - tests/docs_drift.rs
  evidence: []
- id: US-IO-HARNESS-0.60.2-T04
  summary: >-
    Sweep docs/CONTRACT.md for every version-numbered assertion and record the verdict per claim.
  why_required: >-
    F5 is satisfied by the recorded output, not by the reading. This release exists because 0.60.1's
    sweep over the same file did not reach three contradictions; a sweep whose evidence is 'I looked'
    is the thing that lets a fourth survive into 0.63.0.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.60.2-T01
  - US-IO-HARNESS-0.60.2-T02
  - US-IO-HARNESS-0.60.2-T03
  acceptance_criteria:
  - >
    **F5 — the sweep is recorded, not just performed.** Every version-numbered assertion checked in
    `docs/CONTRACT.md` is listed in the release evidence with the release it was checked against and
    the verdict: current, corrected here, or recorded as a finding. A sweep whose output is "I looked"
    is not evidence, and this is the criterion that distinguishes the two.
  files:
  - .ultraship/products/io-harness/evidence/0.60.2/contract-sweep.md
  - docs/CONTRACT.md
  evidence: []
- id: US-IO-HARNESS-0.60.2-T05
  summary: >-
    Run every docs gate, the lint polarities and the nightly rustdoc gate, and record the sabotage arms.
  why_required: >-
    Three new tests that must each fail on today's tree and each be killed by exactly one sabotage arm,
    plus the existing suites that read the same files. F4 and O2 are this task; without it the release
    ships three assertions nobody has watched fail.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.60.2-T01
  - US-IO-HARNESS-0.60.2-T02
  - US-IO-HARNESS-0.60.2-T03
  acceptance_criteria:
  - >
    **F4 — every existing docs gate stays green.** `tests/docs_drift.rs`, `tests/guide_pages.rs`, `tests/readme.rs`,
    and the `public_api` and `changelog` suites. Two to watch specifically. `readme_dependency_version_matches_cargo_toml`
    pins the README install snippet to Cargo.toml's major.minor precisely so a patch does not churn
    it, so `io-harness = "0.60"` stays exactly as it is while Cargo.toml goes to 0.60.2. And `tests/readme.rs`
    requires the MSRV inside the first 60 lines — the gate 0.60.1's rewrite tripped because nobody had
    read it — so any edit that moves the README's opening re-trips it.
  - >
    **O1 — CI is green on all three platforms** on the feature branch and again on the merge to develop.
    A docs-only release still runs the whole suite, because the suite is where the docs gates live.
  - >
    **O2 — the nightly rustdoc gate is green.** `RUSTDOCFLAGS` under nightly catches what stable `cargo
    doc` cannot see, and it has caught something in four of the last five releases. This release edits
    two rustdoc blocks, so it is exactly the one that must not skip it.
  files:
  - .ultraship/products/io-harness/evidence/0.60.2/gates.md
  evidence: []
