- id: US-IO-HARNESS-0.29.0-T08
  summary: 'The convergence files: public-api.txt in sorted position, the CONTRACT divergence section,
    the changelog entry and the manifest version.'
  why_required: tests/public_api.rs fails on a public name with no line and no worked example, and the
    divergence section is the release's most important documentation obligation — a caller pointed at
    vLLM without a parser flag gets no tool calls and no error at all.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.29.0-T04
  - US-IO-HARNESS-0.29.0-T05
  - US-IO-HARNESS-0.29.0-T06
  - US-IO-HARNESS-0.29.0-T07
  acceptance_criteria:
  - 'OP1 — `docs/public-api.txt` is hand-edited in sorted position for every new crate-root name — `Compatible`,
    `Auth`, `ModelInfo`, `PriceSource` and `Reference` — and each carries a doc comment with a worked
    example, because `tests/public_api.rs` fails otherwise and there is deliberately no `--bless`. This
    is real work rather than a formality: five items, five examples that compile as doctests. The preset
    table is `pub(crate)` and adds no line; a named constructor is a method and adds none either. `PriceTier`
    lives in `pricing`, which is a public module rather than a crate-root re-export, so like `Price`
    and `PriceTable` beside it it carries a worked example and takes no line in the snapshot.

    '
  - 'OP2 — **`docs/CONTRACT.md` states the vendor divergences plainly, from primary sources, and this
    is the release''s most important documentation obligation.** A new section names each: Zhipu emits
    `finish_reason` values outside the OpenAI set (`sensitive`, `network_error`, `model_context_window_exceeded`)
    which this crate records verbatim because the field is an open `String`; Groq returns 400 on `messages[].name`;
    Mistral requires tool-call ids matching `^[a-zA-Z0-9]{9}$` and names its schema field `schema_definition`;
    DeepSeek returns 400 if `reasoning_content` is not replayed on a request carrying tools; Ollama
    accepts and silently drops `tool_choice`.

    **And the sentence that matters most: vLLM and SGLang emit no tool calls at all unless the server
    was started with a tool-call parser flag, which a client cannot set.** A caller who points `Compatible`
    at a vLLM server started without `--tool-call-parser` gets a run that quietly never calls a tool
    and never errors — the agent simply talks. That must be findable in the contract by someone searching
    for "vLLM" or "no tool calls", not discovered after an afternoon of debugging. It is stated in those
    words, in the section a reader reaches before writing the base URL.

    '
  files:
  - docs/public-api.txt
  - docs/CONTRACT.md
  - CHANGELOG.md
  - Cargo.toml
  evidence: []
- id: US-IO-HARNESS-0.29.0-T09
  summary: 'The gates: the suite on the default and all-features sets, clippy, fmt, doc, cargo tree,
    cargo package, and the live reference-catalogue check.'
  why_required: Every non-functional and operational criterion is proven here or is unproven, and a
    parser written against a shape nobody checked is the failure F10 exists to prevent.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.29.0-T08
  acceptance_criteria:
  - 'F10 — the live reference host serves the shape the parser was written against. A keyless `GET https://openrouter.ai/api/v1/models`
    from the release machine, parsed by the shipped parser, yielding a non-empty catalogue in which
    at least one model carries a price in every one of the five dimensions the mapping claims **and
    at least one carries a tier**, with the count of tiered models recorded. Run once, at completion,
    and recorded as a health check with what it actually returned. It is not a unit test and does not
    gate CI — a network test in the suite is a flaky suite — but a parser written against a shape nobody
    checked is the failure this criterion exists to prevent, and `.env` carries real OpenRouter credentials,
    so the check is genuinely available rather than aspirational.

    '
  - 'NF1 — the full suite passes on macOS, Linux and Windows with no test skipped, ignored or made conditional.
    The standing exception is `skills::discovery_over_a_32_skill_directory_is_under_50ms`, a wall-clock
    assertion that fails intermittently on the Windows runner under load and is re-run rather than investigated.
    No test in this release reaches the network.

    '
  - 'NF2 — **no new dependency, on any platform.** `cargo tree` on the default feature set reads 402
    lines after this release as before it. The provider is `reqwest` and `openai_wire`, both present;
    the catalogue parse is `serde_json`, present; the decimal shift is `std` string handling and `u64`.
    This is the constraint the product now states, so it is a criterion and it is checked rather than
    asserted.

    '
  - 'NF3 — **`CHECKPOINT_FORMAT` stays 7 and no store schema changes at all.** This release creates
    no table, which is the direct consequence of the catalogue being cached on the provider instance
    rather than in the store. `tests/cross_version.rs` passes unchanged, and it passes without anything
    being added to `ADDED_SINCE_0_22_0`.

    '
  - 'NF4 — `cargo doc` is warning-free, docs.rs builds with all features, `cargo fmt --check` is clean,
    and `cargo clippy --all-targets -- -D warnings` is clean on every platform in the matrix. Doc examples
    use literals rather than `${env:HOME}`, which is unset on `windows-latest` and cost 0.27.0 a CI
    round. Any test that reads this crate''s own source normalises line endings, because a Windows checkout
    is CRLF and that cost 0.28.0 a round.

    '
  - 'OP5 — `cargo package --locked` exits 0 and the tarball is verified by **listing** rather than by
    trusting the `exclude` list: no `.env`, no `.ultraship`, no `.github`. MSRV 1.95 re-checked in both
    directions rather than read off the manifest, which is the lesson 0.23.0 paid for. `df -h .` is
    read before packaging and before publishing, because a full disk on this machine surfaces as `ld:
    cc failed` or an `ENOSPC` in a query-cache write and reads like a toolchain bug — 0.28.0 took `target/`
    to 23 GiB.

    '
  files: []
  evidence: []
