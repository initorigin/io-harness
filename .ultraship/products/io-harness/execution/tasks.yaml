    and containment, the execution sandbox, and durable unattended runs. Each is one page under
    `docs/guide/`, carrying the depth the README shed, with its "the limits, stated plainly" block
    intact.
  why_required: 'These four are the capabilities a reader most often needs in full and least often
    gets from a summary: they are the ones with real boundaries, and a boundary described loosely is
    worse than one not described at all. Without the pages the README rewrite is a deletion.'
  status: done
  depends_on:
