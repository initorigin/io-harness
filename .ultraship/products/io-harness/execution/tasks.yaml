product: io-harness
version: 0.7.0
tasks:
  - id: US-IO-HARNESS-0.7.0-T01
    summary: >
      Durable checkpoint schema + typed resume error + transactional step commit. Add runs.status
      and runs.started_at; a checkpoint_events table (kind: checkpoint/resume/skipped); a
      PRAGMA user_version checkpoint-format marker; Error::Resume{reason}; and make the per-step
      write (step row + checkpoint event) one rusqlite transaction so a step is done iff its
      checkpoint committed. Store helpers: set_status/status, started_at, record_checkpoint_event,
      checkpoint_events, spent_tokens(run)/spent_tokens_tree, agent_count_tree. Additive DDL keeps a
      0.6.0 DB readable.
    why_required: >
      Nothing downstream can be crash-consistent, idempotent, or auditable without a transactional
      completion marker, a durable run status, a corrupt-checkpoint typed failure, and the read-back
      helpers. This is the seam every other 0.7.0 task hangs off.
    status: done
    depends_on: []
    acceptance_criteria:
      - >-
        The step checkpoint (step result, budget draw, trace record) is written as one rusqlite
        transaction, so a crash leaves either a fully-committed step or none of it — never a partial
        step recorded as done. A test asserts atomicity by crashing mid-commit and checking the prior
        checkpoint stands.
      - >-
        A resume against a corrupt or version-incompatible checkpoint returns a typed error the caller
        handles; the run does not panic and does not half-resume, and a crash mid-commit leaves the
        prior consistent checkpoint intact.
      - >-
        Checkpoints record loop state, agent ids, budget counters, and pending-action metadata only —
        never file contents or API keys — consistent with the 0.4.0 and 0.6.0 trace discipline.
    files:
      - src/state.rs
      - src/error.rs
      - src/lib.rs
    evidence:
      - >-
        src/state.rs: checkpoint_step (unchecked_transaction wraps step + checkpoint event),
        checkpoint_events table, CHECKPOINT_FORMAT (PRAGMA user_version), check_resumable (typed
        Error::Resume on newer-format / missing run), status/started_at columns + helpers. src/error.rs:
        Error::Resume{reason}.
      - >-
        Unit tests (cargo test --lib state, 16 pass): a_rolled_back_step_leaves_the_prior_checkpoint_intact
        (atomicity/mid-commit), check_resumable_refuses_a_newer_format_and_a_missing_run (typed failure),
        checkpoint_step_commits_the_step_and_its_event_together (NF4: no content in events),
        status_round_trips_and_a_pre_0_7_database_migrates (additive migration).
  - id: US-IO-HARNESS-0.7.0-T02
    summary: >
      Durable budget across restart for the single-file and workspace loops. On resume reconstruct
      tokens spent from SUM(steps.tokens), reconstruct wall-clock elapsed from runs.started_at
      (real elapsed, not process uptime), and drive status running→completed/failed. Expose a public
      RunStatus enum + Store::run_status(run_id) as the additive checkpoint/run-status type.
    why_required: >
      The headline promise is a continuous 24h ceiling and no double-charge across a crash. Today
      tokens_used/started are stack locals reset to zero on restart, so without reloading spend and
      elapsed time the budget silently resets — the release's core guarantee fails.
    status: done
    depends_on: [US-IO-HARNESS-0.7.0-T01]
    acceptance_criteria:
      - >-
        After a crash-and-resume, the aggregate budget (steps, tokens, cost, time) equals the budget of
        the same run with no crash — proving no step's spend is charged twice.
      - >-
        The wall-clock/time component of the aggregate budget accounts for real elapsed time across a
        restart (checkpointed timestamp based), not just the current process's uptime, so a 24h ceiling
        is not silently reset by a restart.
      - >-
        The new durable-run/resume entry point and the checkpoint/run-status type are part of the
        documented public API under SemVer; existing 0.6.0 callers compile unchanged and no rusqlite- or
        OS-specific type leaks into the public signatures.
    files:
      - src/run.rs
      - src/state.rs
      - src/lib.rs
    evidence:
      - >-
        run_from/run_workspace_from seed tokens_used from store.spent_tokens(run_id) and check the time
        budget against store.elapsed_secs (julianday-based, durable). RunStatus enum + Store::run_status
        exported from lib.rs (OS/rusqlite-free); finish_run derives status.
      - >-
        tests/checkpoint.rs: no_double_charge_across_a_crash_resume (resumed total spend == uninterrupted
        30, no reset/double), the_time_budget_is_wall_clock_and_durable_across_a_restart (elapsed grows
        across Store reopen). Unchanged 0.1.0–0.6.0 suite green (136 pass total).
  - id: US-IO-HARNESS-0.7.0-T03
    summary: >
      Crash-resume a single/workspace run to the same verified success, with idempotent replay.
      resume() restores the T02 budget, skips already-committed steps (last_step cursor) recording a
      skipped event, orders the irreversible effect before the step commit so an uncommitted step
      replays and re-applies idempotently by re-observing current file state, and re-running resume
      twice yields the same completed run.
    why_required: >
      This is the first end-to-end vertical slice a user can see: kill the process mid-run, resume,
      reach the same verified result with the edit present exactly once and no step re-run. Without
      it there is no crash recovery at all.
    status: done
    depends_on: [US-IO-HARNESS-0.7.0-T02]
    acceptance_criteria:
      - >-
        The harness process is killed with SIGKILL partway through a multi-step run; a fresh process
        constructed against the same rusqlite store resumes the run and reaches the same verified
        success the uninterrupted run reaches — the produced artifact is correct and no completed step
        is re-run.
      - >-
        A crash immediately after a file edit is applied but before that step's checkpoint commits
        resumes with the edit present exactly once — not doubled, not lost — proving the step is the
        idempotency unit and the transactional commit is the completion marker.
      - >-
        Resume is idempotent by construction: re-running the same resume twice from the same store
        yields the same completed run and the same budget, so a resume that itself crashes and is retried
        does not compound.
      - >-
        A 0.6.0 caller's existing code compiles unchanged and reaches the same verified success with
        checkpointing default on, proving the durable-run surface is additive.
    files:
      - src/run.rs
    evidence:
      - >-
        resume(): check_resumable, terminal_outcome short-circuit for finished runs (idempotent),
        record_resume_markers (resume + per-step skipped events). Effect applied before checkpoint_step,
        so an uncommitted step replays and overwrites idempotently.
      - >-
        tests/checkpoint.rs: crash_resume_after_a_real_sigkill_reaches_verified_success (REAL tokio
        Child::kill SIGKILL of examples/crash_fixture, resume to Success, edit occurs exactly once, no
        duplicate step numbers), edit_applied_exactly_once_and_resume_is_idempotent (resume x2 = no-op).
        Existing 0.2.0 resume test still green.
  - id: US-IO-HARNESS-0.7.0-T04
    summary: >
      Whole-tree crash-resume. resume reconstructs the 0.5.0 tree (parent/child edges, depth, shared
      workspace, shared trace) from the store, restores the Ledger (spent_tokens = SUM over the tree,
      agents = COUNT of run rows), and re-drives every unfinished agent from its own last_step —
      spawn_child gains a child-resume path instead of always starting at step 1. Per-agent
      independent commits keep the fan-out from serializing on one write lock.
    why_required: >
      A run that crashes with children in flight must resume the whole tree, not just the root, or
      0.5.0's fan-out cannot be left unattended at all. resume/resume_with_decision never touch
      run_agent today, so this path does not exist.
    status: done
    depends_on: [US-IO-HARNESS-0.7.0-T03]
    acceptance_criteria:
      - >-
        A run with a parent and several children in flight is crashed and resumed; every agent continues
        from its own checkpoint and the whole tree completes, proving resume reconstructs the 0.5.0 tree
        and not just a single agent.
      - >-
        After-every-step checkpointing does not serialize the 0.5.0 concurrent fan-out — each agent
        commits its own checkpoint independently and 100+ agents do not contend on a single global write
        lock to make progress; a concurrency test asserts fan-out stays bounded with checkpointing on.
    files:
      - src/run.rs
      - src/state.rs
    evidence:
      - >-
        resume_tree() reconstructs the Ledger via Ledger::from_state(spent_tokens_tree, agent_count_tree)
        and re-drives run_agent from the root's last step. spawn_child is now spawn-or-adopt: find_spawn
        (persisted spawns table, keyed parent+step+goal) adopts an existing child and resumes it from its
        own last_step; new children still register/persist. Per-agent checkpoint_step (independent
        unchecked_transaction), no global lock added.
      - >-
        tests/checkpoint.rs: a_tree_crash_resumes_every_agent_from_its_checkpoint (tokio::timeout drops
        run_tree mid-fan-out, reopen Store, resume_tree completes; agent_count_tree unchanged → adopted
        not duplicated; a.txt/b.txt correct). Existing subagents suite (10) still green — fan-out
        unchanged.
  - id: US-IO-HARNESS-0.7.0-T05
    summary: >
      Approval that survives a full process restart, including a paused child in a tree. Extend
      resume_with_decision so a persisted pending action resumes the whole tree from a fresh process
      (route through run_agent/tree reconstruction, not only run_workspace_from), keeping the 0.4.0
      in-process Approver path unchanged.
    why_required: >
      Unattended means the run pauses for a human only when policy demands and continues once a
      decision arrives — across a restart. Today a paused child cannot be resumed at all
      (resume_with_decision calls run_workspace_from directly), so the pause and resume paths do not
      meet for a tree.
    status: done
    depends_on: [US-IO-HARNESS-0.7.0-T04]
    acceptance_criteria:
      - >-
        A sensitive action pauses the whole tree; the process exits entirely; a new process delivers the
        decision via `resume_with_decision`; the tree resumes from the persisted pending action and
        continues — proving 0.4.0 approval survives a full restart.
    files:
      - src/run.rs
    evidence:
      - >-
        New resume_tree_with_decision performs the approved action once, resolves the pending, then
        resumes the whole tree. run_agent leaves a step paused-by-a-child UNCOMMITTED (paused_by_child
        flag) so on resume the parent replays it and re-adopts the paused child; the child continues past
        the now-applied action. resume_with_decision (single/workspace) unchanged.
      - >-
        tests/checkpoint.rs: a_tree_approval_survives_a_full_restart (ask_write policy on a.txt, Defer
        approver pauses tree, drop Store, reopen, resume_tree_with_decision(Approve) → Success, a.txt/b.txt
        correct). Existing 0.4.0 policy suite (17) still green.
  - id: US-IO-HARNESS-0.7.0-T06
    summary: >
      Sandbox re-creation on resume. Confirm and test that an in-flight 0.6.0 sandboxed execution at
      crash time re-runs inside a fresh sandbox on resume (its result was never committed) while a
      committed sandboxed step is skipped — no sandbox state is ever checkpointed and no code is
      double-executed once committed.
    why_required: >
      0.6.0 sandboxes are ephemeral and die with the process; resume must re-create them safely, or a
      crash mid-verification either loses the run or double-executes model-produced code.
    status: done
    depends_on: [US-IO-HARNESS-0.7.0-T03]
    acceptance_criteria:
      - >-
        A sandboxed execution in flight at crash time is re-run inside a fresh 0.6.0 sandbox on resume
        and the run still reaches verified success, while a completed sandboxed step is skipped — proving
        ephemeral sandboxes are re-created, never resumed, and never double-executed once committed.
    files:
      - src/run.rs
      - tests/checkpoint.rs
    evidence:
      - >-
        No sandbox state is persisted (the checkpoint stores only step trace + budget); an uncommitted
        verify step replays and the ExecGuard creates a fresh sandbox per call, so re-creation falls out
        of T03's replay with no special-casing.
      - >-
        tests/checkpoint.rs: a_sandboxed_verification_is_recreated_on_resume (Verification::CompilesRust,
        crash before it compiles, resume compiles in a fresh sandbox → Success, resumed step > crash step
        so committed steps are not re-run).
  - id: US-IO-HARNESS-0.7.0-T07
    summary: >
      The full 0.7.0 test suite in tests/checkpoint.rs plus an example crash-fixture binary. Real
      SIGKILL crash-and-resume (file-backed store + tokio::process kill), no-double-charge,
      edit-exactly-once, tree-crash-resume, approval-across-restart, sandbox-recreated, a time-scaled
      long unattended run standing in for 24h, a corrupt-checkpoint typed failure, and a multi-crash
      history reconstructable from a reopened store. The unchanged 0.1.0–0.6.0 suite stays green with
      checkpointing default on.
    why_required: >
      Every acceptance criterion in this release is a crash/resume/idempotency claim that is only
      credible with an executable proof; the operational gate is the whole suite passing.
    status: done
    depends_on: [US-IO-HARNESS-0.7.0-T05, US-IO-HARNESS-0.7.0-T06]
    acceptance_criteria:
      - >-
        A time-scaled long unattended run drives the loop through a large number of steps with no user
        input (clock advanced), checkpoints throughout, and stops only on completion or a policy pause —
        standing in for the 24h horizon.
      - >-
        Every checkpoint, resume, and skipped-because-already-done event is recorded so a multi-crash
        run's full history (what ran, where each crash happened, what replayed) is reconstructable from a
        reopened store alone.
      - >-
        `cargo test` passes, including the SIGKILL crash-and-resume test, the no-double-charge budget
        test, the edit-exactly-once idempotency test, the tree-crash-and-resume test, the
        approval-across-restart test, the sandbox-recreated-on-resume test, the time-scaled long-run
        test, the corrupt-checkpoint typed-failure test, and the unchanged 0.1.0–0.6.0 suite with
        checkpointing default on.
    files:
      - tests/checkpoint.rs
      - examples/crash_fixture.rs
    evidence:
      - >-
        tests/checkpoint.rs (10 tests, all pass): the real-SIGKILL test, no-double-charge, wall-clock
        durability, edit-exactly-once + resume-idempotent, unknown-run typed error,
        multi-crash-history-reconstructable, a 250-step long unattended run (all 250 checkpointed),
        tree-crash-resume, tree-approval-across-restart, and sandbox-recreated. examples/crash_fixture.rs
        is the killable offline fixture.
      - >-
        cargo test: 136 passed, 0 failed across 9 binaries (77 lib + 10 checkpoint + 9 edit_file + 3
        multi_file + 1 parity + 17 policy + 8 sandbox + 10 subagents + 1 doctest). Evidence:
        evidence/0.7.0/tests.txt (gitignored).
  - id: US-IO-HARNESS-0.7.0-T08
    summary: >
      Docs, live example, and packaging. README + crate docs for durable checkpointing, whole-tree
      resume, the idempotency/crash-consistency guarantees and their boundary, approval across
      restart, and the accelerated-plus-crash evidence model (with the literal-24h note). An
      examples/durable_run.rs live unattended run against OpenRouter killed mid-run and resumed. Bump
      Cargo.toml to 0.7.0, CHANGELOG entry, cargo clippy --all-targets clean, cargo publish --dry-run
      green. (Actual git Release + cargo publish are owner-gated, at /ultraship:complete.)
    why_required: >
      The release target_mode is published; the crate must be documented, versioned, and package-clean
      with a runnable example before the owner-gated publish, or completion has nothing to ship.
    status: done
    depends_on: [US-IO-HARNESS-0.7.0-T07]
    acceptance_criteria:
      - >-
        `cargo clippy --all-targets` reports zero warnings on the macOS build host.
      - >-
        `cargo publish --dry-run` succeeds with complete crate metadata for 0.7.0.
      - >-
        README and crate docs document durable step-level checkpointing, whole-tree resume, the
        idempotency and crash-consistency guarantees and their boundary, approval across restart, and
        the accelerated-plus-crash evidence model with the literal-24h note, with a runnable example.
      - >-
        An example binary drives one live unattended run against OpenRouter that is killed mid-run and
        resumed in a fresh process to a verified result, showing checkpoints, the crash point, and
        skipped completed steps on resume.
    files:
      - README.md
      - CHANGELOG.md
      - Cargo.toml
      - examples/durable_run.rs
    evidence:
      - >-
        Cargo.toml bumped to 0.7.0; lib.rs crate docs + README gain a durable/unattended section;
        CHANGELOG [0.7.0] - 2026-07-25 written (the source for release notes). examples/durable_run.rs
        added (compiles; live run deferred to complete).
      - >-
        cargo clippy --all-targets: 0 warnings. cargo publish --dry-run --allow-dirty: Packaged 52 files,
        verify-compiled io-harness v0.7.0. Evidence: evidence/0.7.0/builds.txt (gitignored).
      - >-
        The live OpenRouter run of examples/durable_run.rs is NOT executed here (owner-gated, needs the
        API key + spend) — it compiles clean and runs at /ultraship:complete, like sandbox_run at 0.6.0.
        The literal 24h wall-clock run is out of scope by design (contract excluded scope).
