- id: US-IO-HARNESS-0.8.1-T04
  summary: Prove the caller-facing contract did not move. test_src keeps its 0.8.0 shape — the criterion
    calls `hello()` unqualified, not `subject::hello()` — a legitimate macro exported by the subject
    still reaches the criterion through the glob, and Verification's public API, variant shapes, and
    Debug/Clone derivations are untouched. Assert no new public item and no signature change.
  why_required: F5 is what keeps this release a patch. If the structural fix forced a path qualification
    in test_src, that is a break in a patch and the contract's fallback_scope applies instead — this
    task is the check that decides which of the two happened, rather than discovering it after publication.
  status: done
  depends_on:
  - US-IO-HARNESS-0.8.1-T02
  - US-IO-HARNESS-0.8.1-T03
  acceptance_criteria:
  - 'F5 — no public API break. A 0.8.0 caller''s `Verification` values compile against 0.8.1 unchanged,
    and a `Verification` round-trips through serde with the same representation as 0.8.0. If the fallback
    path is taken and `test_src` must change shape, this criterion is what forces that to be reported
    as a break rather than shipped quietly.

    '
  files:
  - tests/verify_gate.rs
  - src/verify.rs
  evidence:
  - F5 green. a_macro_the_subject_legitimately_exports_still_reaches_the_criterion proves the glob still
    carries the subject's own macros, so the fix protects the prelude names without restricting what
    a caller may write.
  - 'test_src shape unchanged: every criterion in the suite still calls hello() unqualified, not subject::hello().
    The contract''s fallback_scope was therefore NOT needed and WorkspaceTestPasses stayed in scope.'
  - 'No public API change: no new public item, no signature change, no serde surface touched. The one
    public addition is SandboxEvent::gate_phase_failed (T09), which is additive.'
- id: US-IO-HARNESS-0.8.1-T05
  summary: 'Confirm the hardening runs inside the 0.6.0 sandbox under the 0.4.0 exec policy and stays
    hermetic: every rustc invocation and the test binary still go through ExecGuard::check and ExecGuard::exec,
    argv stays harness-constructed, the added spawn is policy-checked like the others, denying TEST_BINARY
    still gives compile-only verification, and the temp dir is still removed on drop. Measure whether
    the extra compiler invocation regresses verification latency and state the figure.'
  why_required: 'NF1 and NF2 are the guardrails on the fix itself: isolating macro resolution by stepping
    outside the sandbox would trade a verification hole for a worse isolation hole. NF5 exists because
    the gate is on the hot path of a 0.5.0 fan-out, so a per-gate cost multiplies.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.8.1-T03
  acceptance_criteria:
  - 'NF1 — the fix does not weaken the 0.6.0 sandbox boundary. Whatever compile or run structure the
    hardening uses, every `rustc` invocation and every test binary still executes inside the ephemeral
    sandbox under the 0.4.0 exec policy, with argv still harness-constructed. A fix that isolates macro
    resolution by escaping the sandbox has traded one hole for a worse one.

    '
  - 'NF2 — verification stays deterministic and hermetic: no network, temp dirs removed on drop, and
    no dependence on the caller''s toolchain layout beyond the `rustc` already required.

    '
  - 'NF5 — verification latency does not regress materially. If the fix means two compiler invocations
    where there was one, that cost is measured and stated rather than discovered by a caller running
    a 100-agent 0.5.0 fan-out.

    '
  files:
  - src/verify.rs
  - tests/verify_gate.rs
  evidence:
  - 'NF1 green: the_added_subject_compile_is_still_policy_checked — with rustc denied the gate returns
    a typed Error::Refused rather than compiling. Both rustc spawns run through ExecGuard::check then
    ExecGuard::exec, so they are sandboxed by the same default and argv stays harness-constructed.'
  - The pre-existing verify.rs unit tests denying_the_test_binary_type_checks_without_running_it and
    the deny-rustc test both still pass, so compile-only verification still works on the new flow.
  - 'NF5 measured: 120 ms/gate single-crate vs 137 ms/gate two-crate, +17 ms (~14%). Recorded in evidence/0.8.1/latency.txt,
    stated as a wall-clock bound on one machine, not a controlled benchmark. Re-measured after T06 to
    cover the compile-only gates, which doubled their spawns too: 34 ms/gate to 60 ms/gate, +26 ms (~76%)
    — cheaper than the test path in absolute terms, larger relatively, and paid per file by EachCompilesRust.'
- id: US-IO-HARNESS-0.8.1-T06
  summary: 'Harden CompilesRust and EachCompilesRust. The review this task originally required falsified
    its own premise: both are defeatable without any criterion to shadow, because the subject is compiled
    AS the crate root and can therefore delete the items the gate exists to compile — `#![cfg(any())]`
    plus a body that does not type-check compiles clean. The `include!`-root fix this task originally
    specified was rejected during implementation — it rejects every crate-level inner attribute, so an
    honest `#![allow(dead_code)]` file would fail. Shipped instead: append a reserved probe item to the
    subject, compile the subject as a crate, then type-check a probe crate that references it — a subject
    that strips its own items strips the probe. Record the finding either way.'
  why_required: 'F9, and O4 for the finding. Shipping a release whose headline is a closed verification
    bypass while leaving a bypass it found — and could close with the indirection it already built —
    would be the same overstatement this release exists to remove. The compile-only gates are not a
    side path: EachCompilesRust is what a caller reaches for when each edited file only needs to compile
    on its own.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.8.1-T02
  acceptance_criteria:
  - 'F9 — the compile-only gates reject a subject that deletes itself. `CompilesRust` and `EachCompilesRust`
    must fail a file whose body does not type-check but which compiles clean because a crate-level attribute
    stripped it — specifically `#![cfg(any())]` followed by `pub fn hello() -> u32 { "not a u32" }`.
    A file that genuinely compiles must still pass, and `EachCompilesRust` must still fail the whole
    set when any one file fails.

    '
  - 'O4 — the conclusion about `CompilesRust` and `EachCompilesRust` is recorded in the release record
    whether or not they needed a change.

    '
  files:
  - src/verify.rs
  evidence:
  - 'FINDING (recorded, O4): CompilesRust passes code that does not type-check. Subject `#![cfg(any())]`
    + `pub fn hello() -> u32 { "not a u32" }` compiles clean, rustc exit 0, because the crate-level
    cfg strips the item before it is type-checked. EachCompilesRust routes each file through the same
    compile_source(src, None, guard) path and shares it.'
  - 'REMEDY VERIFIED before scheduling, THEN REJECTED in implementation: a root of `include!("subject.rs")`
    makes rustc reject the construct outright — "error: an inner attribute is not permitted in this
    context" — but it rejects EVERY crate-level inner attribute, including the honest ones. A subject
    opening `#![allow(dead_code)]` failed to compile under it, which violates the half of F9 requiring
    a file that genuinely compiles to still pass.'
  - 'SHIPPED REMEDY: append a reserved `__io_harness_probe` item to the subject, compile the subject as
    its own crate, then type-check a second crate referencing that probe. A crate-level attribute that
    strips the subject''s items strips the probe with them and the reference fails to resolve; a subject
    with a legitimate crate-level attribute keeps its items and passes. Reuses the two-crate structure
    T02 already built rather than adding a third mechanism.'
  - 'F9 green: three tests in tests/verify_gate.rs. a_compile_gate_rejects_a_subject_that_deletes_its_own_items
    — the cfg-stripped subject fails both CompilesRust and EachCompilesRust. an_honest_file_still_passes_the_compile_gates
    — a plain file passes, an `#![allow(dead_code)]` file passes (the case that falsified the include!
    remedy), and one broken file still fails the whole EachCompilesRust set. the_trace_names_a_subject_that_deleted_its_own_items
    — the failure records `subject-emptied`, distinct from `subject-compile` for a file that merely
    does not compile, and an honest file records no phase failure.'
  - Scope taken into 0.8.1 by US-IO-HARNESS-0.8.1-I01, owner-approved. Develop stopped rather than widening
    scope on its own.
- id: US-IO-HARNESS-0.8.1-T07
  summary: 'State the bound in the crate''s own documentation: rustdoc on Verification, RustTestPasses,
    and WorkspaceTestPasses saying what a passing gate proves and what it does not, and naming the shadowing
    class this release closes; the same statement in prose in README; and a CHANGELOG entry describing
    the defect, the fix, and the intended behaviour change that a dishonest 0.8.0 pass now fails.'
  why_required: O1 and O2. The release tightens the gate, which is exactly when a reader is most likely
    to over-read it as proof of correctness — the documentation has to move in the opposite direction
    in the same version, or the next consumer inherits the overstatement product.yaml already corrected.
  status: done
  depends_on:
  - US-IO-HARNESS-0.8.1-T06
  acceptance_criteria:
  - 'O1 — rustdoc on `Verification`, `RustTestPasses`, and `WorkspaceTestPasses` states what a passing
    gate proves and what it does not, and names the shadowing class of attack this release closes. README
    carries the same statement in prose.

    '
  - 'O2 — the CHANGELOG entry describes the defect, the fix, and the intended behaviour change (dishonest
    0.8.0 passes now fail), with a migration line if one is needed.

    '
  files:
  - src/verify.rs
  - README.md
  - CHANGELOG.md
  evidence:
  - Verification gained a type-level 'What a passing gate proves' section stating the bound, plus per-variant
    notes on RustTestPasses and WorkspaceTestPasses; verify.rs and lib.rs module docs carry the 0.8.1
    narrative.
  - README 'Execution-based verification' gained the same statement in prose, both attack shapes, and
    the gate_phase_failed pointer for a run that stopped passing on upgrade.
  - 'CHANGELOG 0.8.1 section: the defect, both vectors, the fix, and the intended behaviour change stated
    plainly (''a gate that passed dishonestly on 0.8.0 fails on 0.8.1'').'
