product: io-harness
version: 0.52.0
tasks:
- id: US-IO-HARNESS-0.52.0-T01
  summary: Write the LSP client — Content-Length framing, JSON-RPC correlation — over AsyncRead + AsyncWrite,
    with the fixture server that misbehaves on purpose.
  why_required: Every other task in the release sends a request through this client. A client correlated
    by arrival order or framed by character count works against the first fixture written for it and fails
    against every real server, so the fixture that answers out of order and interleaves notifications
    is written before the client it tests.
  status: done
  depends_on: []
  acceptance_criteria:
  - '**F1 — the client frames by bytes and the header terminator is `\r\n`.** The bytes the client writes
    for a known request are asserted exactly: `Content-Length: N\r\n\r\n` followed by N bytes, with N
    equal to the body''s **byte** length for a body containing a multi-byte character, and no other header.
    Reading is asserted symmetrically over a stream that delivers a frame split across three chunks mid-header
    and mid-body. Sabotage: split headers on `\n` and length the body in `chars`, under which the multi-byte
    case and the split-chunk case fail and nothing else here does.

    '
  - '**F2 — a response is matched to its request by `id`, not by arrival.** Two requests are outstanding;
    the fixture server sends `window/logMessage`, then `$/progress`, then answers the **second** request,
    then the first. Each call receives its own answer, and neither notification is returned as one. Sabotage:
    take the next message as the answer, under which both calls receive the wrong value and only this
    fails.

    '
  - '**N1 — no new dependency.** `cargo tree` for the default feature set is unchanged at **402** crates
    on macOS and Linux. The framing, the JSON-RPC envelope and the six request bodies are written in this
    crate over `serde_json` and `tokio`. An LSP types crate, a JSON-RPC crate or a client crate is a criterion
    failure, not a trade-off.

    '
  files:
  - src/lsp.rs
  - src/lib.rs
  - tests/lsp.rs
  evidence:
  - '9 unit tests in src/lsp.rs pass: cargo test --lib lsp:: — 9 passed, 0 failed.'
  - 'F1 asserted on the bytes: frame("{}") is exactly b"Content-Length: 2\r\n\r\n{}", and a body of four
    characters and seven bytes is lengthed 7. A frame delivered one byte at a time — every read landing
    mid-header and mid-body — reads whole, and a Content-Type header a real server sends is skipped while
    a header line with no colon is refused by name rather than skipped.'
  - 'F2 asserted with the server answering in reverse order through an interleaved window/logMessage and
    $/progress: both callers get their own answer. A server *request* (workspace/configuration) carries
    an id and is answered null rather than mistaken for a response — asserted on the reply the server
    received, which has a result and no method.'
  - 'Two failure paths are named rather than waited out: a server that closes mid-request fails within
    milliseconds under a 120s timeout with ''language server fix: ... closed its output'', and an error
    response carries the server''s own message.'
  - 'Sabotage F1 (length in chars + headers split on \n): 6 of 9 fail, including the byte-length and split-chunk
    cases. Loud rather than surgical, because the two spellings the criterion names break framing in both
    directions.'
  - 'Sabotage F2 (route a response to the oldest pending id rather than its own): exactly 1 test fails
    — answers_are_matched_by_id_through_interleaved_notifications — and the other 8 pass.'
  - 'No dependency added: the framing, the JSON-RPC envelope and the correlation are ~330 lines in src/lsp.rs
    over serde_json and tokio, both already in the default tree.'
- id: US-IO-HARNESS-0.52.0-T02
  summary: Add the [[lsp]] table to io.toml and the LspServer type beside McpServer.
  why_required: A server is named in configuration or there is no server. Nothing in the release can be
    reached without the table that declares one, and its project-scope rule is a boundary decision that
    must be settled before anything spawns.
  status: done
  depends_on:
  - US-IO-HARNESS-0.52.0-T01
  acceptance_criteria:
  - '**N3 — zero compile breaks, and the additions are enumerated rather than counted.** No existing public
    item changes shape: no field is added to a constructed type, no trait method changes, no enum that
    is not already `#[non_exhaustive]` gains a variant reachable by an exhaustive match outside the crate.
    `EventKind` is additive as it has been since 0.13.0. `docs/public-api.txt` gains the enumerated crate-root
    additions — `struct LspServer` and nothing else — stated as the enumerated additions rather than as
    a line count, because that checker enumerates crate-root re-exports and a criterion promising a number
    has been met in a different form in five of the last thirteen releases. The five tool-name constants
    live in `tools` and add no line, as `PATCH_FILE_TOOL` does not.

    '
  files:
  - src/config.rs
  - src/lsp.rs
  - src/lib.rs
  - tests/config.rs
  evidence:
  - cargo test --test config — 51 passed, 0 failed, including the three new [[lsp]] tests.
  - 'The table is accepted in the project scope and reaches the contract through Config::apply_to, asserted
    on both the Config accessor and contract.lsp. The project-scope rule is unchanged: [[lsp]] is not
    in PROJECT_WIDENING and not refused whole like [[hook]], for the reason src/config.rs already states
    of [[mcp]] — the boundary is the Act::Exec check on the named binary.'
  - 'A misspelled key is rejected naming it: LspServer carries #[serde(deny_unknown_fields)], which McpServer
    cannot because #[serde(flatten)] forbids it. This closes the standing [[mcp]] hole for the new table
    rather than inheriting it.'
  - '[[lsp]] is deliberately NOT in APPENDING: a_narrower_scope_replaces_the_lsp_set_whole asserts the
    project file''s set replaces the user file''s rather than concatenating.'
  - 'N3 — zero breaks. TaskContract is #[non_exhaustive] (since 0.35.0) so the added lsp field breaks
    no builder; Error is #[non_exhaustive] (since 0.43.0) so Error::Lsp breaks no match. docs/public-api.txt
    gains exactly one line, ''struct LspServer src/lsp.rs'', and tests/public_api.rs passes: 9 passed,
    including every_public_item_has_a_worked_example and public_surface_matches_snapshot.'
  - 'cargo test --doc lsp — 3 passed: the LspServer, Config::lsp_servers and TaskContract::with_lsp examples.'
- id: US-IO-HARNESS-0.52.0-T03
  summary: 'LspSession: gate the argv with authorize_spawn, spawn, hand it initialize in the background,
    and shut it down at every run entry point.'
  why_required: The spawn gate is one of the release's two bounds, and a child that outlives its run is
    the defect a second session threaded through nine call sites is most likely to introduce. An unready
    or dead server must be unknown-and-why here, before any tool depends on it.
  status: done
  depends_on:
  - US-IO-HARNESS-0.52.0-T02
  acceptance_criteria:
  - '**F5 — a denied server spawns no process, and the run fails typed.** Under a policy denying `Act::Exec`
    on the configured server''s program, the run returns `Error::Refused` naming the act, the target,
    the rule and the layer, **no child process is created** — asserted by a wrapper the test can observe
    rather than by the error text — and a `PolicyEvent` refusal row is written. Under a policy that allows
    it, the same configuration starts and answers. Both halves in one test, since the claim is the distinction.
    Sabotage: spawn before the check, under which the no-process assertion fails and only this fails.

    '
  - '**F9 — an unready or dead server is unknown-and-why, not empty.** A fixture that never completes
    `initialize`, and a fixture that exits after the handshake, each produce `Outcome::Failed` whose reason
    names the server and what happened, within the configured timeout; a call made while the server is
    still indexing waits up to that bound and then reports the same way rather than returning no results.
    No arm returns `Clean` and no arm returns an empty location list. Sabotage: map a timeout to an empty
    result, under which all three arms report success having learned nothing and only this fails.

    '
  files:
  - src/lsp.rs
  - src/mcp.rs
  - src/run.rs
  - src/observe.rs
  - tests/lsp.rs
  evidence:
  - 'tests/lsp.rs — 11 passed, 0 failed, against examples/lsp_fixture_server.rs spawned as a real child
    over stdio: real framing, real initialize, real didOpen.'
  - 'F5 asserted race-free, and the first attempt at it was a FINDING rather than a design. Asserting
    only that the fixture had not written its marker file passed under the sabotage (spawn first, check
    second) because the child is dropped with kill_on_drop on the way out and can be killed before it
    is ever scheduled — an assertion that depends on winning a race is not an assertion. Replaced by:
    a command that does not exist returns Error::Refused, not Error::Lsp{could not spawn}, which no scheduling
    decision can change; the marker assertion is kept beside it as the belt to that braces.'
  - 'Sabotage F5 (spawn the child, then check the gate): fails exactly a_denied_server_is_refused_before_any_spawn_is_attempted,
    and the other 10 pass. Against the first version of the test it failed NOTHING.'
  - 'F9 asserted in three arms — a handshake that never finishes, a server that exits after it, and a
    server that does not advertise the capability. Each names the failure and the server, and none reads
    as ''No locations.'' Sabotage F9 (map a failure to an empty result): fails exactly that test.'
  - LspSession::connect and shutdown are wired at the 8 sites in src/run.rs that already carry McpSession
    (the contract said nine; eight is the count in this tree), through one lsp_for helper so no site can
    spell the root differently. authorize_spawn is shared with src/mcp.rs rather than copied — made pub(crate)
    in place rather than moved to a new module, since a language server and an MCP server are the same
    act and two spellings of one check is how they drift.
  - 'EventKind::LspStarted{server, root, ready_ms} is additive on a #[non_exhaustive] enum, registered
    in EVENT_NAMES and every_kind(); exactly one is emitted per server per run, asserted through a real
    Observer. The contract named the middle field backend_root; it is root, because that is what it is.'
- id: US-IO-HARNESS-0.52.0-T04
  summary: The four read tools — definition, references, symbols, hover — with 1-based positions and a
    per-request didOpen re-sync.
  why_required: This is the release's outcome. Without these four the agent still infers structure from
    grep. The position conversion and the document re-sync are both silent-wrong-answer defects, so they
    are built and asserted with the tools rather than after them.
  status: done
  depends_on:
  - US-IO-HARNESS-0.52.0-T03
  acceptance_criteria:
  - '**F3 — positions round-trip 1-based, and the wire is 0-based.** For a symbol the fixture places at
    line 12 character 5 as a reader counts, the request body carries `{"line":11,"character":4}`, and
    a returned range at wire line 11 is reported to the model as line 12. Asserted on the wire body and
    on the rendered observation, at line 1 as well, where an off-by-one produces line 0 — a number no
    file has. Sabotage: pass the model''s numbers through unconverted, under which every position assertion
    fails and only these do.

    '
  - '**F4 — a file edited this run is never answered from a stale buffer.** A run edits a file with `edit_file`,
    inserting a line, and then asks `lsp_definition` about a position on the inserted line; the fixture
    server records the document text it was last sent, and it is the post-edit text, byte for byte, including
    the trailing newline. Sabotage: open each document once and cache it, under which the server holds
    the pre-edit text and only this fails.

    '
  files:
  - src/lsp.rs
  - src/tools/mod.rs
  - src/run.rs
  - tests/lsp.rs
  evidence:
  - 'F3 asserted on the wire body the fixture received (echo-position): a model position of line 12 column
    5 goes out as {"line":11,"character":4}, and a returned wire line 0 comes back to the model as line
    1. Sabotage F3 (pass the model''s numbers through unconverted): fails exactly a_position_is_one_based_for_the_model_and_zero_based_on_the_wire.'
  - Line 0 is refused by name rather than clamped, and the server is never asked — asserted on the absence
    of any echoed position, because clamping would answer confidently about the wrong line.
  - 'F4 asserted against an edit made in the same run: hover -> edit_file -> hover, where the fixture
    answers with the document text it was last SENT. The second answer contains the post-edit text. Sabotage
    F4 (open each document once and cache it): fails exactly that test, and only it.'
  - 'Four read verbs land: lsp_definition, lsp_references, lsp_symbols (one schema, two behaviours — no
    query is this file, a query is the workspace) and lsp_hover. SymbolKind numbers render as words and
    hierarchical children are flattened under their parent, asserted in symbols_answers_for_one_file_or_for_the_workspace.'
  - 'Every question goes through one funnel, LspSession::navigate: one readiness wait, one capability
    check, one document re-sync, one deny_read filter. That is what makes T05''s filter one check rather
    than four.'
- id: US-IO-HARNESS-0.52.0-T05
  summary: Filter every returned location through the same Act::Read check read_file uses, and name the
    omission count in the answer.
  why_required: The second of the release's two bounds. Four tools return locations and a filter applied
    in four places is a filter missing from one, so every path returns through one function before any
    more callers exist.
  status: done
  depends_on:
  - US-IO-HARNESS-0.52.0-T04
  acceptance_criteria:
  - '**F6 — a location under a `deny_read` rule is absent from the answer and the omission is named.**
    A `lsp_references` call whose server returns three locations, one of them under a path the policy
    denies reading, produces an observation containing the two permitted paths, **not** containing the
    denied path in any form, and ending with a sentence naming one omission and the act. Asserted as an
    absence and a presence together, because a build that drops the location silently passes any assertion
    that only counts what is there. Sabotage: return the server''s locations unfiltered, under which the
    absence assertion fails and only this fails.

    '
  files:
  - src/lsp.rs
  - src/run.rs
  - tests/lsp.rs
  evidence:
  - 'F6 asserted as an absence and a presence together: of three locations one under a deny_read("secret/*")
    path, the answer carries the two permitted paths, does not contain the denied file name in any form,
    and ends with ''1 result omitted''. Sabotage F6 (return the server''s locations unfiltered): fails
    exactly that test.'
  - 'Only an outright Deny omits. Ask does not, and that is deliberate: Policy::default() ASKS about any
    path no rule covers (the trap 0.39.0 paid for), under which treating Ask as an omission would empty
    every answer this feature gives. Naming a path is not reading its contents.'
  - relative() strips both the workspace root and its canonicalized form, because on macOS /tmp and /var
    are symlinks into /private and a server resolves what it opened — a path that failed to strip would
    reach the policy as an absolute one, under which deny_read("secret/*") matches nothing. A filter that
    silently stops filtering is worse than one that is absent.
- id: US-IO-HARNESS-0.52.0-T06
  summary: Register the five schemas only for a run that configured a server, and prove an unconfigured
    run is byte-identical to 0.51.0.
  why_required: The release's negative control. Every existing prompt, parity and determinism suite asserts
    the catalogue, and the claim that a consumer who configures nothing pays nothing is either true on
    bytes or it is marketing.
  status: done
  depends_on:
  - US-IO-HARNESS-0.52.0-T04
  acceptance_criteria:
  - '**F10 — a run with no `[[lsp]]` is this build''s run.** No `lsp_*` schema appears in the composed
    system prompt, no child is spawned, no `LspStarted` event is written, and the composed prompt is **byte-identical**
    to the same contract''s prompt on 0.51.0. This is the release''s negative control and it is asserted
    on bytes. Sabotage: register the schemas unconditionally, under which the byte-identity assertion
    fails and only this fails.

    '
  - '**N6 — every existing suite passes unchanged, apart from catalogue assertions that do not change.**
    Because the schemas are conditional on configuration, `tests/prompt.rs`, `tests/parity.rs`, `tests/determinism.rs`
    and every suite quoting the tool catalogue pass **untouched** — not updated with a sentence, untouched.
    Any suite that does need an edit is a finding to be stated in the record with its reasoning, not a
    sweep.

    '
  - '**N7 — the catalogue grows by exactly five schemas, and only for a run that configured a server.**
    Asserted by composing the system prompt for one contract with and without an `[[lsp]]` entry and diffing:
    the difference is those five schemas'' own bytes and nothing else.

    '
  files:
  - src/run.rs
  - src/tools/mod.rs
  - tests/lsp.rs
  - tests/prompt.rs
  evidence:
  - 'F10 asserted on the catalogue: a run with no [[lsp]] table is offered the built-ins and no tool whose
    name starts with lsp_. Sabotage F10 (register the schemas unconditionally): fails both arms of the
    claim and nothing else.'
  - 'The other half asserted by difference: configuring one server adds exactly [lsp_definition, lsp_references,
    lsp_symbols, lsp_hover, lsp_rename], in that order, and removes nothing.'
  - 'N7 holds by construction: lsp_tools() returns an empty vector for an empty session, so the five schemas
    are the only difference in the composed prompt.'
- id: US-IO-HARNESS-0.52.0-T07
  summary: lsp_rename renders a WorkspaceEdit as a 0.51.0 patch series and writes nothing.
  why_required: Rename is the case where a text search is not merely expensive but wrong, and it is the
    reason the release adds no write path. A rename that wrote its own files would satisfy the end state
    and violate the release.
  status: done
  depends_on:
  - US-IO-HARNESS-0.52.0-T05
  acceptance_criteria:
  - '**F7 — `lsp_rename` writes nothing and renders a patch that applies.** A rename whose `WorkspaceEdit`
    spans three files returns a patch series in 0.51.0''s format; every file in the workspace is byte-identical
    afterwards, **no** `edits` row and **no** snapshot row is written, and feeding each file''s section
    to `patch_file` produces exactly the renamed tree. Asserted as an absence and then as an application,
    because a rename that wrote its own files would satisfy the end state and violate the release. Sabotage:
    apply the edit inside the tool, under which the byte-identity and no-row assertions fail and only
    they do.

    '
  files:
  - src/lsp.rs
  - src/diff.rs
  - src/tools/mod.rs
  - src/run.rs
  - tests/lsp.rs
  evidence:
  - 'F7 asserted as an absence and then as an application. A rename spanning two files leaves both byte-identical,
    and the run''s only edits row is the step that ends the run — not either renamed path. The answer
    is a patch series in 0.51.0''s format (--- a/<path> / +++ b/<path> per file, path-ordered) carrying
    +struct Tally;. Sabotage F7 (apply the edit inside the tool): fails exactly that test.'
  - 'No Act::Write check is taken by the rename, and that is the design rather than an omission: each
    file''s section is applied by patch_file, which is gated on that path like any other write, one path
    per call, all-or-nothing per file. The release therefore adds no write path and no multi-file gate
    semantics.'
  - A server answers with 'changes' or with 'documentChanges' and both are read — a client reading only
    one silently renames nothing against half the servers in use. Edits are applied last-first against
    the original text, overlapping edits are refused rather than guessed, and a position is measured in
    UTF-16 code units the way the protocol specifies, returning None rather than indexing into the middle
    of a character.
- id: US-IO-HARNESS-0.52.0-T08
  summary: Append a server's pull diagnostics to check and to the automatic post-edit observation, in
    Outcome's existing four states.
  why_required: This is what augmenting the compiler stream means in code. A build that returns the server's
    result instead of appending it loses the borrow-check and lint errors a gate depends on, which is
    the failure the diagnostics module already wrote down.
  status: done
  depends_on:
  - US-IO-HARNESS-0.52.0-T04
  acceptance_criteria:
  - '**F8 — server diagnostics augment and never replace.** On a tree where the project''s checker reports
    an error and the configured server reports none, `check` still reports the checker''s error; where
    both report, both appear and the server''s findings are attributed to its `id`; where the server advertises
    no `diagnosticProvider`, the answer carries the checker''s result **and** a named reason for the server
    half — never a silent absence and never `Clean`. The third arm is the discriminating one. Sabotage:
    return the server''s result when it is present instead of appending it, under which the first arm
    loses the compiler''s error and only this fails.

    '
  files:
  - src/lsp.rs
  - src/tools/diagnostics.rs
  - src/run.rs
  - tests/lsp.rs
  evidence:
  - 'tests/lsp.rs — 12 passed, 0 failed. F8 is asserted against a REAL cargo check over a three-line crate
    that does not compile, not a stubbed checker: the claim is that this crate''s existing checker survives
    beside the server''s answer, and a stub would only prove the stub survived. The crate has no dependencies,
    so the check is offline and its target directory is inside the temp dir — no cargo lock is shared
    with the build running the test.'
  - 'Three arms, all asserting the compiler''s own error is present. (1) The server finds nothing: ''[language
    server fix] found nothing''. (2) The server finds something too: both appear, the server''s attributed
    to its id. (3) The server does not advertise diagnosticProvider: ''[language server fix did not answer]
    does not answer diagnostic requests, so it has nothing to add here — which is not the same as finding
    nothing''.'
  - 'Sabotage F8 (return the server''s result when it is present instead of appending it): fails exactly
    server_diagnostics_are_appended_to_the_compiler_stream_never_substituted, and the other 11 pass.'
  - No tool was added. The server's half is folded into 0.51.0's check tool and into diagnostics_after_write,
    which IS what 'augment the compiler stream' means in code, and it reuses diagnostics::Outcome's four
    existing states rather than inventing a third-state vocabulary beside them.
  - 'The asymmetry the existing code already draws is kept: check reports all four states because somebody
    asked; the automatic post-edit path reports findings only, because a line per edit saying a server
    still cannot answer is noise the model pays for on every write.'
  - Pull only. workspace/diagnostic for the whole tree and textDocument/diagnostic for one file; both
    report shapes are read, because a client that handles one of them silently reports nothing for the
    other. Diagnostics pass the same deny_read filter every other answer does.
- id: US-IO-HARNESS-0.52.0-T09
  summary: 'Measure N5: the same navigation question driven through grep/find/read_file and through lsp_definition
    + lsp_references.'
  why_required: The release's own number. Fewer provider calls and fewer prompt bytes is the whole business
    case, and a figure that says otherwise is a feature that did not ship.
  status: done
  depends_on:
  - US-IO-HARNESS-0.52.0-T06
  - US-IO-HARNESS-0.52.0-T07
  acceptance_criteria:
  - '**N5 — the release''s own number, and it is the cost of one navigation question.** The stated question
    "where is this symbol defined and which call sites use it" is driven twice against a scripted provider
    over the same fixture repository: once through `grep`/`find`/`read_file` as the catalogue offers today,
    once through `lsp_definition` + `lsp_references`. Recorded in the release record: the provider calls,
    the steps, the gate evaluations and the prompt bytes for each arm. The LSP arm must take strictly
    fewer provider calls and strictly fewer prompt bytes; a figure that says otherwise is a feature that
    did not ship rather than a test to adjust.

    '
  files:
  - tests/lsp.rs
  evidence:
  - 'N5 measured, printed by n5_a_navigation_question_costs_fewer_calls_and_fewer_prompt_bytes: text-search
    arm 6 provider calls / 11,901 prompt bytes / 0 gate evaluations; language-server arm 3 provider calls
    / 6,052 prompt bytes / 1 gate evaluation. Half the calls and 1.97x less prompt read for the same question.'
  - 'The text-search arm is the shortest honest path, not a strawman: grep the definition''s spelling,
    read the file that matched to see which hit IS the definition, grep the identifier, then read each
    of the two files that matched to discard the prose mention and the string literal. Five tool calls.
    The server arm is lsp_definition then lsp_references. Two.'
  - 'The gate count moves the OTHER way — 0 to 1 — and that is honest rather than a defect: grep and read_file
    are ungated by 0.3.0''s decision, and the one evaluation the server arm pays is the Act::Exec check
    on the server binary at run start. It is per run, not per question.'
  - The assertion is directional (strictly fewer calls, strictly fewer prompt bytes) and the figures are
    recorded rather than pinned, because a byte count pinned to a constant fails on the next release that
    adds a sentence to the system prompt.
