product: io-harness
version: 0.11.0
tasks:
- id: US-IO-HARNESS-0.11.0-T01
  summary: Write the provider failure taxonomy, then make the code produce it. `Error::Provider(String)`
    becomes a structured variant carrying the kind (transport, timeout, rate-limited with `Retry-After`,
    server, auth, malformed), the HTTP status preserved rather than formatted into prose, and `is_retryable()`.
    All three providers inspect the status they currently throw away, and a stream that yields no parseable
    event at all becomes the malformed kind instead of `Ok(CompletionResponse::default())`.
  why_required: Every other task in the release branches on the kind. Retry, fallback and escalation are
    all one question — is this worth trying again — and today the answer is a `String`.
  status: todo
  depends_on: []
  acceptance_criteria:
  - 'F1 — a provider failure carries its kind. A fixture provider returning connection-refused, 429, 503,
    401, and a malformed stream produces five distinguishable kinds, with the HTTP status preserved and
    `Retry-After` captured when the server sent one. Asserted on the error value, not on its rendered
    string.

    '
  - 'F4 — a malformed stream is an error, and a quiet model is not. A stream with no parseable event yields
    `Error::Provider` with the malformed kind; a stream that parses and contains text but no tool call
    still yields `Ok` and is still read as "no tool call". Both sides asserted, because collapsing them
    in either direction is a regression.

    '
  - 'NF1 — no new runtime dependency. Backoff is `tokio::time::sleep`, which is already a dependency;
    the request deadline is a `reqwest` builder option already available. No retry crate, no backoff crate,
    and no randomness crate — the backoff is deterministic and documented as such rather than jittered.

    '
  - 'O2 — the documented failure taxonomy matches the code. Every kind the enum carries is described with
    what produces it and whether it is retried, in the crate docs and the README, so a consumer branching
    on a kind is branching on something specified rather than observed.

    '
  files:
  - src/error.rs
  - src/provider/mod.rs
  - src/provider/openrouter.rs
  - src/provider/openai.rs
  - src/provider/anthropic.rs
  - src/provider/openai_wire.rs
  - tests/provider_failures.rs
  evidence: []
- id: US-IO-HARNESS-0.11.0-T02
  summary: Give requests a deadline. `net::http_client()` sets a documented, overridable request timeout,
    so a server that accepts a connection and then never writes ends the call as a timeout rather than
    hanging the run. Proven against a real local socket that accepts and stalls.
  why_required: A hung request produces no step, so 0.7.0's checkpointing never fires, the time budget
    is only checked at the top of a step and so is never reached, and the aggregate ledger sees no draw.
    The run is simply gone — the one failure mode with no remedy but killing the process.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.11.0-T01
  acceptance_criteria:
  - 'F3 — a request has a deadline. A local server that accepts the connection and then never writes ends
    the call as a timeout error within the configured deadline, and the deadline is overridable by the
    caller. Proven against a real stalling socket, not a mocked error: this is the failure mode that produces
    no step, no trace row and no budget draw today, so a fixture that merely returns an error would not
    test it.

    '
  - 'O4 — the request deadline''s default is stated wherever a timeout would surprise someone: a long
    single completion on a slow model must not be killed by a default meant to catch a hung socket. The
    default is documented with that trade named, and it is overridable.

    '
  files:
  - src/net.rs
  - tests/provider_failures.rs
  evidence: []
- id: US-IO-HARNESS-0.11.0-T03
  summary: 'Retry only what is retryable, and wait. `complete_with_retry` consults the kind: transport,
    timeout, 5xx and rate limit are retried with a backoff that grows per attempt and honours `Retry-After`;
    an auth or request-shaped failure escalates on the first occurrence. The wait is bounded by the run''s
    time budget, and each retry''s trace row names the kind and the delay.'
  why_required: Today a 401 and `Error::Config("OPENAI_API_KEY not set")` are retried twice, instantly,
    exactly as eagerly as a 503 — so the one failure worth waiting for is the one that gets no wait, and
    the two that are hopeless cost three calls each.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.11.0-T01
  acceptance_criteria:
  - 'F2 — only retryable failures are retried, and they wait. A 401 reaches the caller after exactly one
    provider call; a 503 is retried up to the contract''s limit with a delay that grows per attempt; a
    429 carrying `Retry-After` waits at least that long. Asserted by counting provider calls and measuring
    elapsed time against the fixture, and each retry''s trace row names the kind and the delay.

    '
  - 'NF7 — a retry wait is cancellable and budgeted. A backoff sleep does not outlive the run''s time
    budget, and a run whose deadline passes while waiting ends on the budget rather than after it. Waiting
    is not a way to escape a limit.

    '
  - 'NF6 — no regression. All 271 tests shipped at 0.10.0 pass unless one asserted a behaviour this release
    deliberately changes, and each such test is named in the record with why its old assertion was wrong.
    `tests/edit_file.rs`''s two retry tests are the expected casualties: they assert `"retry 1 after error"`
    against a provider error that this release classifies, and the retry trace row is gaining the kind
    and the delay.

    '
  files:
  - src/run.rs
  - src/state.rs
  - tests/provider_failures.rs
  evidence: []
- id: US-IO-HARNESS-0.11.0-T04
  summary: A `Fallback` combinator that is itself a `Provider` and wraps two of them, composing and nesting
    for three, accepted unchanged by every existing generic entry point. It falls through only on a failure
    another provider might not have, and the trace records which provider failed, with what kind, and
    which one answered the step.
  why_required: Three providers are implemented and only one is reachable in a run. `Provider::complete`
    returns `impl Future`, so there is no `dyn Provider` to hold a list — the combinator is how fallback
    happens without breaking the trait every caller implements.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.11.0-T01
  acceptance_criteria:
  - 'F5 — fallback works and composes. `Fallback::new(down, working)` completes a task that the primary
    alone cannot, three providers nest, and every existing entry point accepts it with no signature change.
    The trace names the provider that failed, its kind, and the provider that served the step.

    '
  - 'F6 — fallback does not fire when it cannot help. A primary failing with an authentication or request-shaped
    error does NOT reach the secondary; the caller gets the primary''s error. Asserted by a secondary
    that panics if called.

    '
  - 'NF2 — the single-provider path pays nothing. A run with one provider makes the same number of provider
    calls as it does under 0.10.0, and the classification adds no request. Asserted by a call counter
    on the existing mock providers.

    '
  files:
  - src/provider/fallback.rs
  - src/provider/mod.rs
  - src/lib.rs
  - src/state.rs
  - src/run.rs
  - tests/fallback.rs
  evidence: []
- id: US-IO-HARNESS-0.11.0-T05
  summary: Make escalation terminal and legible. `"escalated"` maps through `terminal_outcome`, `finish_run`
    stops reporting it as a plain completion, and the result a caller receives says whether what ended
    the run was retryable or terminal — a distinction that survives into the store, so a resume and a
    trace reader agree with the caller.
  why_required: A resumed escalated run currently falls straight back into the loop and re-runs, because
    the outcome string is unmapped and the status is `Completed`. An unattended run that escalated at
    3am is therefore silently restarted by the next resume.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.11.0-T01
  - US-IO-HARNESS-0.11.0-T03
  acceptance_criteria:
  - 'F10 — an escalated run is terminal on resume. `"escalated"` maps through `terminal_outcome` and `finish_run`
    no longer reports it as a plain completion, so resuming an escalated run reports what happened instead
    of silently re-entering the loop. A regression test that fails against 0.10.0.

    '
  - 'F11 — the outcome says which. The result a caller receives distinguishes a retryable failure from
    a terminal one without parsing a string, and the distinction survives into the store so a resume and
    a trace reader agree with the caller.

    '
  files:
  - src/run.rs
  - src/state.rs
  - tests/provider_failures.rs
  evidence: []
- id: US-IO-HARNESS-0.11.0-T06
  summary: Make the workspace report whether a write changed anything. `Workspace::write_file` compares
    the bytes it is about to write with what is there, so a byte-identical rewrite is recorded as the
    no-op it is and a real edit is still recorded as one.
  why_required: 'Stall detection rests entirely on this signal and the crate has nothing like it: `write_file`
    never reads the old content, so `wrote {target}` today means "a write was attempted", not "the workspace
    changed".'
  status: todo
  depends_on: []
  acceptance_criteria:
  - 'F7 — the workspace knows when it did not change. Writing byte-identical content is recorded as a
    no-op distinct from a real edit, and a real edit is still recorded as one. This is the signal F8 rests
    on, asserted on its own so a stall test failing cannot hide a broken signal.

    '
  files:
  - src/tools/workspace.rs
  - src/tools/fs.rs
  - src/run.rs
  evidence: []
- id: US-IO-HARNESS-0.11.0-T07
  summary: Detect a stalled agent and give it one chance. A bounded number of consecutive steps that change
    nothing in the workspace AND whose tool calls repeat what an earlier step in the window already did
    is a stall; it produces one replan directive in the assembled context naming what was already tried,
    once per run. A still-stalled agent then ends with its own outcome rather than burning to the step
    cap. Configurable, and disableable to exactly 0.10.0 behaviour.
  why_required: 'The 0.10.0 live evidence recorded this twice: sixteen consecutive turns re-reading the
    same four files, ending in `StepCapReached` with the whole step budget spent proving the agent was
    stuck.'
  status: todo
  depends_on:
  - US-IO-HARNESS-0.11.0-T06
  - US-IO-HARNESS-0.11.0-T03
  acceptance_criteria:
  - 'F8 — a stalled agent is detected and told once. The 0.10.0 live failure replayed as a fixture — repeated
    identical reads with no write — is detected within the configured window, produces a replan directive
    in the next turn''s context naming what was already tried, and the detection and the replan are trace
    rows. An agent that changes the workspace, and an agent legitimately exploring with varied calls,
    are NOT flagged.

    '
  - 'F9 — a persistent stall ends the run as a stall. After the one replan, a still-stalled agent ends
    with the stall outcome in materially fewer steps than its cap, rather than as `StepCapReached`. Asserted
    against the step count.

    '
  - 'NF3 — stall detection is off-by-default-safe. Its work per step is bounded and independent of the
    run''s length, it can be disabled by configuration, and with it disabled the loops behave exactly
    as 0.10.0 did. A resilience feature that changes a working run''s behaviour is a regression however
    well it works.

    '
  files:
  - src/run.rs
  - src/context.rs
  - src/contract.rs
  - src/state.rs
  - tests/stall.rs
  evidence: []
- id: US-IO-HARNESS-0.11.0-T08
  summary: Document the taxonomy and the limits, mark the pillar, and write the CHANGELOG with the `Error::Provider`
    migration note plus the recorded public-surface diff against the 0.10.0 tag.
  why_required: '`Error::Provider`''s shape change breaks every match on it, and a consumer branching
    on a kind is entitled to a specification rather than an observation. Fallback also needs its non-promise
    stated: it does not check that the second provider is equivalent to the first.'
  status: todo
  depends_on:
  - US-IO-HARNESS-0.11.0-T01
  - US-IO-HARNESS-0.11.0-T02
  - US-IO-HARNESS-0.11.0-T03
  - US-IO-HARNESS-0.11.0-T04
  - US-IO-HARNESS-0.11.0-T05
  - US-IO-HARNESS-0.11.0-T06
  - US-IO-HARNESS-0.11.0-T07
  acceptance_criteria:
  - 'NF5 — the public break is deliberate and documented. `Error::Provider`''s shape changes, which breaks
    every `match` on it. The CHANGELOG carries the migration note, the public-surface diff against the
    0.10.0 tag is recorded in the evidence, and no other public item is renamed or removed. The crate
    stays pre-1.0; no 1.0.0 is planned or implied.

    '
  - 'O1 — the crate documents what fallback does and does not promise: it tries another provider when
    the failure suggests another provider might succeed, it does not verify that the second provider is
    equivalent to the first, and a model swap mid-run can change behaviour in ways the harness cannot
    see. An operator configuring two providers should know they may get two different models.

    '
  - 'O2 — the documented failure taxonomy matches the code. Every kind the enum carries is described with
    what produces it and whether it is retried, in the crate docs and the README, so a consumer branching
    on a kind is branching on something specified rather than observed.

    '
  - 'O3 — `docs/CAPABILITIES.md` marks recovery and retry shipped at 0.11.0 and marks nothing else. If
    the fallback scope is taken, it stays partial with the deferred release named.

    '
  files:
  - src/error.rs
  - README.md
  - CHANGELOG.md
  - docs/CAPABILITIES.md
  evidence: []
