product: io-harness
version: 0.9.0
tasks:
- id: US-IO-HARNESS-0.9.0-T01
  summary: 'Introduce the in-process extension point: an object-safe `Tool` trait (spec + boxed-future
    invoke), a `Toolbox` holding registered tools, `TaskContract::with_tools(...)` beside `with_mcp(...)`,
    and the name arbitration that rejects a tool shadowing a built-in, using the reserved `mcp__` prefix,
    or duplicating another registered name. Arbitration runs at run start, before the provider is called.
    Settle the trait signature against three reference implementations first — a synchronous closure,
    a stateful async tool, and one that returns an error — as the contract''s first risk requires.'
  why_required: Nothing else in the release can be built against a trait shape that is not object-safe
    or that a real implementer cannot satisfy, and a registered tool that silently shadows `write_file`
    would hand a caller a way to replace the harness's own file writer without the policy ever seeing
    it.
  status: done
  depends_on: []
  acceptance_criteria:
  - 'F3 — a registered tool may not shadow anything. Registering `write_file`, `grep`, `find`, `read_file`,
    or `spawn_agent`, or a name starting `mcp__`, or two tools sharing one name, returns `Error::Config`
    naming the offending tool, and it does so before the provider is called even once (asserted by a completion
    counter that stays at zero).

    '
  - 'NF1 — no new runtime dependency. `cargo tree --edges normal` for the crate is unchanged against 0.8.1:
    the frontmatter reader is written in-crate against the standard library, and the `dyn`-safe trait
    uses `std::pin::Pin<Box<dyn Future>>` as `run_agent` already does. A new dev-dependency is permitted;
    a new runtime one is not.

    '
  - 'NF2 — additive public API. The 0.8.1 doc example and every existing example compile against 0.9.0
    with no edit beyond the version. No public item is renamed, removed, or has its signature changed;
    `with_tools` and `with_skills` are new builder methods and `Tool`, `Toolbox`, and `Skill` are new
    exports. Asserted by a test that builds a 0.8.1-shaped contract and runs it.

    '
  files:
  - src/tools/custom.rs
  - src/tools/mod.rs
  - src/contract.rs
  - src/lib.rs
  - tests/custom_tools.rs
  evidence:
  - 'src/tools/custom.rs — the `Tool` trait (object-safe: `spec()` plus `invoke()` returning a boxed `ToolFuture`),
    `Toolbox` with `with`/`with_arc`/`specs`/`owns`/`get`/`validate`, a manual `Debug` listing registered
    names (a `Tool` is caller code with no `Debug` bound and `TaskContract` derives it), and `RESERVED_TOOL_NAMES`.'
  - 'The signature was settled against three reference implementations in tests/custom_tools.rs before
    being threaded anywhere, as the contract''s first risk required: `Echo` (synchronous work behind the
    async signature), `Ledger` (holds state, awaits inside `invoke`, records that it ran), and `Broken`
    (returns `Err`). All three satisfy the trait unchanged.'
  - '`TaskContract::with_tools` added beside `with_mcp`; `tools: Toolbox` on the struct. No public signature
    changed anywhere — F3''s arbitration is reached from the existing entry points.'
  - '`Toolbox::validate()` is called at the top of all six entry points (`run_with`, `run_tree`, `resume`,
    `resume_tree`, `resume_with_decision`, `resume_tree_with_decision`) before a run row exists and before
    the provider is reached.'
  - 'F3 — 4 tests green: shadowing each of the six built-ins (`write_file`, `grep`, `find`, `read_file`,
    `spawn_agent`, `read_skill`), the `mcp__` prefix, a duplicate name, and an empty name each return
    `Error::Config` naming the offender, with the mock provider''s completion counter asserted at 0.'
  - NF2 — `a_contract_with_no_registered_tools_behaves_as_before` builds a 0.8.1-shaped contract and runs
    it to `Success`. All 207 tests in the suite pass, including the 197 that predate this release.
  - NF1 — no runtime dependency added. The trait uses `std::pin::Pin<Box<dyn Future>>`; Cargo.toml's [dependencies]
    section is untouched.
- id: US-IO-HARNESS-0.9.0-T02
  summary: 'Dispatch a registered tool through the orchestration loop on the same terms as an MCP tool:
    offered in the request''s tool list and named in the system prompt, gated by an `Act::Exec` policy
    check on its name with refusals recorded as `PolicyEvent`s and surfaced as observations, an `Effect::Ask`
    verdict routed through the `Approver`, a failing `invoke()` turned into an observation rather than
    a run failure, the result truncated at the context boundary, and the whole call recorded in the trace.'
  why_required: This is the release's central behaviour. Without it a registered tool is a type the model
    never sees, and every claim that extension is governed by the same policy and visible in the same
    trace is unproven.
  status: done
  depends_on:
  - US-IO-HARNESS-0.9.0-T01
  acceptance_criteria:
  - 'F1 — a caller-registered tool reaches the model and runs. A contract registering a tool whose `spec()`
    names it `lookup_order` offers it in the request''s tool list, and a scripted provider calling `lookup_order`
    causes `invoke()` to run with the parsed arguments and its returned string to appear in the next turn''s
    observations. Asserted offline with the mock provider.

    '
  - 'F2 — a registered tool is governed by the policy, not trusted by registration. Under a policy denying
    `Act::Exec` on `lookup_order`, the call is refused, `invoke()` is never entered (asserted by a flag
    the fake tool sets), a `PolicyEvent` naming the rule and layer is in the trace, the model receives
    a refusal observation, and the run continues rather than failing.

    '
  - 'F4 — a failing tool is an observation, not a failed run. A tool whose `invoke()` returns an error
    produces an error observation the agent can act on, the step is committed, and the run continues to
    its next turn — the same treatment `grep` gives a bad regex.

    '
  - 'F5 — a registered tool cannot flood the context. A tool returning far more than the result cap has
    its output truncated with a visible marker before it enters the observations, and the truncated form
    is what the trace records.

    '
  - 'O1 — a run is reconstructable from the trace alone. For every registered-tool call the trace holds
    the tool name, the arguments, the decision, and the observation; for every skill load it holds which
    skill was read. An auditor reading the trace can say which skills shaped the run and which caller-supplied
    tools it depended on, without the caller''s source.

    '
  files:
  - src/run.rs
  - src/tools/custom.rs
  - tests/custom_tools.rs
  evidence:
  - src/run.rs — a `name if custom.owns(name)` arm in `dispatch`, placed after the built-ins and before
    the MCP arm. It gates on `Act::Exec` through the existing `gate()` (so `Effect::Ask` routes to the
    `Approver` and a `Decision::Defer` still returns `Dispatched::Pause`), then awaits `tool.invoke()`.
  - '`dispatch` gained a `custom: &Toolbox` parameter; both call sites pass it (`run_workspace_from` from
    `contract.tools`, `run_agent` from `tree.tools`). Registered specs are added to the request''s tool
    list and named in the system prompt through the existing `with_extra_tools`, so a model that trusts
    the prose over the schema still learns the tool exists.'
  - 'F1 green — `a_registered_tool_is_offered_called_and_its_result_observed`: the spec is in the request''s
    tool list, the name is in the system prompt, `invoke` ran with the model''s arguments (`A-17`), and
    `A-17=shipped` appears in the next turn''s user prompt.'
  - 'F2 green — `a_registered_tool_is_refused_by_the_policy_without_being_entered`: under `deny_exec("lookup_order")`
    the tool''s own call log stays empty, the trace holds a refusal with act=exec, rule=lookup_order,
    layer=base, the model sees a refusal observation, and the run ends `StepCapReached` rather than erroring.'
  - 'F4 green — `a_failing_tool_becomes_an_observation_not_a_failed_run`: the tool''s own error text reaches
    the model, the step is still committed (2 step rows), and the run continues.'
  - 'F5 green — `an_oversized_tool_result_is_truncated_before_it_enters_the_context`: a 200,000-char result
    reaches the model truncated, with the word ''truncated'' visible, and the trace records the truncated
    form.'
  - 'The cap is now defined once for the whole tool layer: `tools::TOOL_RESULT_CAP` and `tools::cap_result`,
    which `mcp.rs` now calls instead of carrying its own copy. Placing it in the tool layer rather than
    in `mcp` resolves the contract''s third open question and keeps 0.10.0''s consolidation to one move.'
  - 'O1 green (partial — the skill half is T05''s): the trace records the tool name, the arguments, and
    the decision for a registered-tool call, asserted in F1.'
  - 'Incidental correctness fix in `gate()`: exec and net targets are now checked with `ws.policy().check(...)`
    rather than `ws.check_path(...)`. An exec target is a *name*, and resolving it against the workspace
    root meant a file sharing a tool''s name could change what the policy said about calling it. No existing
    caller was affected — `gate()` was only ever reached with Read and Write.'
- id: US-IO-HARNESS-0.9.0-T03
  summary: Thread the toolbox through every `Tree` construction site so a 0.5.0 child inherits its parent's
    registered tools and calls them under its own narrowed policy — `run_with`, `run_tree`, `resume`,
    `resume_tree`, and both `*_with_decision` variants — and cover the resume paths, not only the happy
    path, so a toolbox silently lost across a restart fails a test.
  why_required: A child that cannot reach an inherited tool makes the extension point useless for the
    decomposed tasks 0.5.0 exists for, and a resume that drops the toolbox is a correctness bug that surfaces
    only after a crash — exactly the class 0.7.0 was released to eliminate.
  status: done
  depends_on:
  - US-IO-HARNESS-0.9.0-T02
  acceptance_criteria:
  - 'F6 — a 0.5.0 child inherits the toolbox. In a `run_tree` where the parent spawns a child, the child''s
    request carries `lookup_order` and a child calling it runs the same implementation, with the call
    attributed to the child''s `run_id` in the trace.

    '
  files:
  - src/run.rs
  - tests/custom_tools.rs
  evidence:
  - 'The threading itself is done, because T02 could not compile without it: `Tree` carries `tools: &''a
    Toolbox`, and all four `Tree` construction sites pass `&contract.tools` — including the two on the
    resume-with-decision paths and the one in `resume_tree`. The field is documented as read from the
    *root* contract rather than each agent''s, so a spawned child (whose contract the model writes) cannot
    register a tool its parent never had.'
  - 'F6 green — `a_spawned_child_inherits_the_toolbox_and_the_call_is_its_own`: the child''s `CompletionRequest.tools`
    carries `lookup_order` and its system prompt names it, the child runs the *parent''s* single registered
    instance (asserted on the `Arc` the parent holds, not a copy), the result reaches the child''s next
    turn, and the call is in the child''s `store.steps(child_run)` and absent from the parent''s.'
  - 'The resume path is covered too, as the contract''s cost-driver note required — `a_toolbox_survives_a_tree_resume_and_still_reaches_a_child`:
    leg 1 stops at a step cap, leg 2 re-registers the same tool through `Toolbox::with_arc` as a restarted
    caller would and calls `resume_tree`, and the resumed root''s child still reaches the tool with the
    call traced under its own run.'
  - 'Both tests were watched failing before being relied on: in a scratch copy of the crate with `run_agent`''s
    `tree.tools` use broken, each fails with the built-in-only tool list and the other 10 tests in the
    file stay green — proving they were not already covered. `cargo test --test custom_tools`: 12 passed,
    0 failed.'
- id: US-IO-HARNESS-0.9.0-T04
  summary: 'Discover skills from a directory: `<dir>/<name>.md` and `<dir>/<name>/SKILL.md`, an in-crate
    frontmatter reader for optional `name`/`description` with fallback to the file stem and first prose
    line, `TaskContract::with_skills(dir)`, and the hard caps — a missing or non-directory path and an
    over-cap directory are both `Error::Config` at run start rather than a silently partial set. Cover
    the reader''s edge cases: absent frontmatter, unterminated frontmatter, CRLF line endings, a multi-line
    description, and a non-ASCII body.'
  why_required: Skills are half the release, and a discovery step that silently truncates or silently
    accepts a malformed file would give a caller a set they believe is complete and is not.
  status: done
  depends_on:
  - US-IO-HARNESS-0.9.0-T01
  acceptance_criteria:
  - 'F7 — skills are discovered from both layouts. A directory containing `alpha.md` and `beta/SKILL.md`
    yields exactly two skills named `alpha` and `beta`; frontmatter `name:` and `description:` override
    the derived values when present; a file with no frontmatter takes the file stem as name and its first
    non-empty prose line as description. Both names and both descriptions appear in the system prompt
    and neither body does.

    '
  - 'F9 — a bad skills directory fails honestly. A `with_skills` path that does not exist, or is not a
    directory, is an `Error::Config` at run start naming the path. A directory holding more than the discovery
    cap is an `Error::Config` too, rather than a silently truncated set the caller believes is complete.

    '
  - 'NF1 — no new runtime dependency. `cargo tree --edges normal` for the crate is unchanged against 0.8.1:
    the frontmatter reader is written in-crate against the standard library, and the `dyn`-safe trait
    uses `std::pin::Pin<Box<dyn Future>>` as `run_agent` already does. A new dev-dependency is permitted;
    a new runtime one is not.

    '
  files:
  - src/skills.rs
  - src/contract.rs
  - src/lib.rs
  - tests/skills.rs
  evidence:
  - 'src/skills.rs written and compiled into the crate (`pub mod skills`, exporting `Skill` and `Skills`):
    `Skills::discover` accepts both `<dir>/<name>.md` and `<dir>/<name>/SKILL.md`, sorts by name so the
    prompt is byte-identical across runs on one directory, canonicalises each path, and returns `Error::Config`
    for a missing path, a non-directory path, more than `MAX_SKILLS` (64), or two skills sharing a name.
    `catalog()` renders the name/description lines for the prompt; no body is held.'
  - 'The frontmatter reader is in-crate against the standard library — no YAML dependency, holding NF1.
    10 unit tests green covering every edge case the contract named: plain frontmatter, CRLF line endings,
    a `>`-folded multi-line description, a plain continuation line, a later key (`metadata:`) not absorbing
    the description, absent frontmatter, unterminated frontmatter (treated as no frontmatter, whole file
    is body), heading-derived fallback description, a non-ASCII body, and clamping a long description
    at a char boundary.'
  - '`TaskContract::with_skills(dir)` added, storing `skills: Option<PathBuf>` — the path, not the discovered
    set. `with_tools` can store a whole `Toolbox` because `validate()` is a separate fallible call; a
    builder method cannot return `Result`, and for skills the fallible step *is* discovery, so `pub(crate)
    fn discover_skills()` is the exact analogue of `Toolbox::validate()`: same call site, same error type,
    same before-a-run-row-exists guarantee.'
  - '`contract.discover_skills()?` is called immediately after `contract.tools.validate()?` at all six
    entry points (`run_with`, `resume`, `resume_with_decision`, `resume_tree_with_decision`, `run_tree`,
    `resume_tree`).'
  - 'F7 green (discovery half) — 3 tests in tests/skills.rs: `alpha.md` + `beta/SKILL.md` yield exactly
    two skills (a `notes.txt` and a `SKILL.md`-less subdirectory ignored), derived name/description fall
    back to the stem/dirname and first prose line, frontmatter `name:`/`description:` override both, and
    `catalog()` carries the two lines and never a body. The prompt half is T05''s.'
  - 'F9 green — 4 tests driving `run_with` with a counting mock provider: a missing path, a path that
    is not a directory, and a directory of `MAX_SKILLS + 1` files each return `Error::Config` naming the
    path with the provider''s call count at 0, plus a positive control proving a usable directory lets
    the run start (calls == 1) — a gate, not a wall.'
  - NF1 held — no runtime dependency added; tests reuse the existing `tempfile` and `tokio`. Full suite
    216 passed / 0 failed, clippy `-D warnings` clean, `cargo fmt --check` exit 0.
- id: US-IO-HARNESS-0.9.0-T05
  summary: Put skill names and descriptions — and not bodies — into the system prompt, and offer a built-in
    `read_skill` tool that loads exactly one body into the observations on demand, as a policy-checked
    read of that file's path, recorded in the trace. Offer the tool only when skills are configured.
  why_required: A skill nobody can read is inert, and a body injected without being asked for is the unbounded-prompt
    failure this release's own risk register names and 0.10.0 exists to fix.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.9.0-T04
  acceptance_criteria:
  - 'F8 — a skill body loads on demand. A scripted provider calling `read_skill` with `{"name": "beta"}`
    puts beta''s body — and only beta''s — into the observations; a call naming an unknown skill yields
    an observation listing what does exist, not an error.

    '
  - 'F10 — reading a skill is a policy-governed read. Under a policy denying `Act::Read` on the skills
    directory, `read_skill` is refused with a `PolicyEvent` in the trace and the body never enters the
    observations, while the skill''s name and description remain in the system prompt.

    '
  - 'O1 — a run is reconstructable from the trace alone. For every registered-tool call the trace holds
    the tool name, the arguments, the decision, and the observation; for every skill load it holds which
    skill was read. An auditor reading the trace can say which skills shaped the run and which caller-supplied
    tools it depended on, without the caller''s source.

    '
  files:
  - src/run.rs
  - src/skills.rs
  - tests/skills.rs
  evidence: []
- id: US-IO-HARNESS-0.9.0-T06
  summary: 'Measure and record the two performance claims: per-call dispatch overhead for a registered
    tool that returns immediately, across 1000 calls, against calling the same closure directly; and skill
    discovery over a 32-skill directory, confirmed to run once per run rather than once per step.'
  why_required: NF3 is a stated acceptance criterion with numbers in it. Unmeasured, it is an assertion,
    and the release would be claiming a bound nobody checked.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.9.0-T03
  - US-IO-HARNESS-0.9.0-T05
  acceptance_criteria:
  - 'NF3 — the harness is not the cost. Dispatching a registered tool that returns immediately adds under
    1 ms per call over calling the same closure directly, measured across 1000 calls and recorded in evidence/0.9.0/latency.txt.
    Skill discovery over a 32-skill directory completes in under 50 ms and happens once per run, not once
    per step.

    '
  files:
  - tests/custom_tools.rs
  - .ultraship/products/io-harness/evidence/0.9.0/latency.txt
  evidence: []
