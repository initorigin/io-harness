product: io-harness
version: 0.16.1
tasks:
  - id: US-IO-HARNESS-0.16.1-T01
    summary: >
      Rewrite the README's "Part of initorigin" table. Three rows with a status column — io-harness
      Released and linked, io-cli and io-studio in development and named without a link — and a
      sentence under it stating that io-harness is the only public repository today and that the
      other two open when they release.
    why_required: >
      This table is the release. It is the last section of the crates.io landing page for a published
      crate, it links four repositories that return 404 to every reader who is not the owner, and two
      of the five products it names have not been built. Without this task there is no 0.16.1.
    status: done
    depends_on: []
    acceptance_criteria:
      - >
        F1 — the README's product table has exactly three rows (io-harness, io-cli, io-studio),
        carries a status column, and contains no occurrence of `io-eval` or `website`.
      - >
        F2 — the only link in that table is io-harness's. Neither io-cli nor io-studio is a markdown
        link to any URL, and the table is followed by a sentence stating that io-harness is the only
        public repository today.
    files:
      - README.md
    evidence:
      - >
        README.md "Part of initorigin" now has three rows and a Status column: io-harness Released
        and linked, io-cli and io-studio "In development" with bare names. `io-eval` and `website`
        are gone from the file entirely. The table is followed by "io-harness is the only public
        repository today, which is why it is the only one linked."
  - id: US-IO-HARNESS-0.16.1-T02
    summary: >
      Sweep the repository for anything else that presents an unbuilt or private initorigin product
      as available — `io-eval`, `initorigin/website`, `initorigin/io-cli`, `initorigin/io-studio` —
      across README.md, src/lib.rs, docs/, CONTRIBUTING.md and Cargo.toml, and correct what is
      found. Sealed release records, product.yaml, roadmap.yaml and past CHANGELOG entries are
      historical and are left alone.
    why_required: >
      The crate has two landing pages, not one: crates.io renders the README and docs.rs opens on
      src/lib.rs. Fixing one and not the other reproduces the exact defect 0.16.0 shipped its
      `readme` checker to prevent, and there is no mechanised check for this table, so the sweep is
      the only thing standing in for one.
    status: done
    depends_on:
      - US-IO-HARNESS-0.16.1-T01
    acceptance_criteria:
      - >
        F3 — a repository-wide grep for `io-eval`, `initorigin/website`, `initorigin/io-cli` and
        `initorigin/io-studio` returns hits only in files that are historical by design:
        CHANGELOG.md's past entries, the sealed `.ultraship/products/io-harness/releases/*.yaml`
        records, and `product.yaml`/`roadmap.yaml`. No hit in README.md, `src/lib.rs`, `docs/`,
        CONTRIBUTING.md, or Cargo.toml.
    files:
      - README.md
      - src/lib.rs
    evidence:
      - >
        Repository-wide grep for `io-eval`, `initorigin/website`, `initorigin/io-cli`,
        `initorigin/io-studio` over README.md, src/, docs/, CONTRIBUTING.md, Cargo.toml, SECURITY.md,
        CODE_OF_CONDUCT.md, NOTICE, examples/, tests/ and .github/ returns exactly one hit:
        src/state.rs:1507, a `//` implementation comment explaining why `runs.finished_at` exists
        ("io-eval would have been coupled to internals from its first line"). It is not a doc
        comment, renders nowhere, and states a design rationale rather than an availability claim, so
        it was left alone. Every other hit is in a historical file — the sealed
        `.ultraship/.../releases/*.yaml` records, product.yaml, roadmap.yaml, the iterations, the
        generated views, and past CHANGELOG entries.
  - id: US-IO-HARNESS-0.16.1-T03
    summary: >
      Remove `CARGO_REGISTRY_TOKEN` and its comment from `.env.example`, leaving only the provider
      variables a contributor running the suite actually sets. No CHANGELOG entry.
    why_required: >
      The template tells every contributor to obtain a crates.io publish token. It is the
      maintainer's credential, it is not needed to build or test the crate, and asking for it in a
      public template misstates what the project requires of a contributor.
    status: done
    depends_on: []
    acceptance_criteria:
      - >
        F4 — `.env.example` contains no `CARGO_REGISTRY_TOKEN` line and no comment referring to a
        publish token, and every remaining variable in it is one a contributor running the suite
        actually sets.
    files:
      - .env.example
    evidence:
      - >
        `.env.example` no longer contains CARGO_REGISTRY_TOKEN or its comment. The six remaining
        variables are the three provider key/model pairs the suite and the examples read via
        `OpenRouter::from_env` / `Anthropic::from_env` / `OpenAi::from_env`. No CHANGELOG entry was
        written for this, per the contract.
  - id: US-IO-HARNESS-0.16.1-T04
    summary: >
      Bump the version to 0.16.1 in Cargo.toml and Cargo.lock, and write the CHANGELOG `[0.16.1]`
      section covering the README correction only — stating that there is no breaking change and no
      code change, and saying nothing about `.env.example`.
    why_required: >
      An unbumped manifest cannot be published, and the CHANGELOG is this project's stated single
      source of truth for release notes: the GitHub Release body is taken from it verbatim, so a
      missing section means a Release with no notes.
    status: done
    depends_on:
      - US-IO-HARNESS-0.16.1-T01
    acceptance_criteria:
      - >
        F5 — CHANGELOG.md has a `[0.16.1]` section that describes the README correction, states there
        are no breaking changes, and does NOT mention the `.env.example` change.
    files:
      - Cargo.toml
      - Cargo.lock
      - CHANGELOG.md
    evidence:
      - >
        Cargo.toml version = "0.16.1"; Cargo.lock updated via `cargo update -p io-harness --precise
        0.16.1`. CHANGELOG.md gained a `[0.16.1] - 2026-07-28` section under Changed describing the
        table correction, opening with "There are no breaking changes and no code change in this
        release", and making no mention of .env.example.
  - id: US-IO-HARNESS-0.16.1-T05
    summary: >
      Run the gates: the full test suite including the five 0.16.0 checkers, clippy, fmt, the
      public-surface diff, and `cargo package` with an inspection of the resulting `.crate`.
    why_required: >
      CI is not being waited on for this release, which makes the local run the only verification
      there is. `tests/readme.rs` asserts properties of the file T01 edits, so this is also the one
      place the release could fail unexpectedly rather than a formality.
    status: done
    depends_on:
      - US-IO-HARNESS-0.16.1-T01
      - US-IO-HARNESS-0.16.1-T02
      - US-IO-HARNESS-0.16.1-T03
      - US-IO-HARNESS-0.16.1-T04
    acceptance_criteria:
      - >
        NF1 — no public API change. `git diff origin/main -- src/ | grep -E "^[-+]\s*pub "` is empty
        for the whole branch, and `tests/public_api.rs` passes against the unchanged snapshot.
      - >
        NF2 — the five 0.16.0 checkers stay green with no test edited to accommodate the change:
        `readme`, `public_api`, `docs_drift`, `changelog`, and `guide_pages`. `readme` is the one this
        release could plausibly break, since it asserts properties of the file being edited; it must
        pass unmodified.
      - >
        NF3 — `cargo test`, `cargo clippy --all-targets -- -D warnings`, and `cargo fmt --check` all
        exit 0, MSRV stays 1.88, and the default `cargo tree` stays at 401 lines.
      - >
        NF4 — `cargo package` succeeds and the crate description stays under the crates.io
        1000-character cap. The packaged `.crate` is inspected for a `.env`, a secret-shaped path, or
        any file the `exclude` list should have caught.
    files: []
    evidence:
      - >
        cargo test — 203 lib tests + every integration target + 116 doctests, all passed, 0 failed.
        The five 0.16.0 checkers pass unmodified: changelog 5/5, docs_drift 10/10, guide_pages 7/7,
        public_api 9/9, readme 8/8.
      - >
        `cargo clippy --all-targets -- -D warnings` exit 0. `cargo fmt --check` exit 0. `cargo tree`
        401 lines, unchanged. `git diff origin/main -- src/ | grep -E "^[-+]\s*pub "` empty for the
        whole branch. Cargo.toml description is 290 characters, well under the crates.io 1000 cap.
      - >
        `cargo package` produced io-harness-0.16.1.crate, 577 KB. Inspected: no `.env`, no
        `.ultraship/`, no `.github/`, no secret-shaped path. `.env.example` ships as intended and now
        carries no publishing credential.
