- id: US-IO-HARNESS-0.12.0-T12
  summary: Document the three contracts this release creates, and record the correction it makes. What
    order events arrive in, that they are in-process and synchronous, that an event is not a transaction,
    and that the durable trace stays authoritative. Exactly what determinism guarantees — what is compared,
    what is excluded and why, under what conditions two runs are expected to match. What each field of
    the outcome record means, including that spend is tokens and not currency, that duration is wall-clock
    including time the process was down, and what "steps" counts given that retry rows share a step number.
    Plus the CHANGELOG, carrying the `RunResult` migration note and attributing 0.11.0's O4 miss rather
    than quietly fixing it.
  why_required: A consumer branching on an event or relying on a determinism guarantee needs it specified
    rather than observed, and an over-broad determinism claim is worse than a narrow one because it will
    be relied on. The 0.11.0 record is immutable, so the correction has to be recorded somewhere a reader
    will find it.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.12.0-T07
  - US-IO-HARNESS-0.12.0-T09
  - US-IO-HARNESS-0.12.0-T10
  acceptance_criteria:
  - 'O1 — the observer''s contract is documented: what order events arrive in, that they are emitted in-process
    and synchronously with the run, that an event is not a transaction and a caller must not assume one
    event equals one committed row, and that the durable trace remains the record of what happened. A
    consumer needs to know which surface is authoritative.

    '
  - 'O2 — the determinism guarantee is documented precisely: what is compared, what is excluded and why,
    and under what conditions two runs are expected to match — same recording, same workspace isolation,
    memory state stated. An over-broad determinism claim is worse than a narrow one, because it will be
    relied on.

    '
  - 'O3 — the outcome record''s fields are documented with what each means and where it comes from, including
    that spend is tokens and not currency, that duration is wall-clock including time the process was
    down, and exactly what "steps" counts given that retry rows share a step number.

    '
  - 'O6 — the 0.11.0 O4 miss is recorded honestly: the request deadline was documented as overridable
    and was not, the record for 0.11.0 is immutable and stays as sealed, and the correction is attributed
    in this release''s CHANGELOG entry rather than quietly fixed.

    '
  - 'NF3 — a trace failure does not become a run failure through a new path, and neither does an observer.
    A panicking or erroring observer must not corrupt the trace or leave a run wedged, and the chosen
    behaviour is documented rather than incidental.

    '
