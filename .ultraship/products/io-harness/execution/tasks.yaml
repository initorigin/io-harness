product: io-harness
version: 0.25.0
tasks:
- id: US-IO-HARNESS-0.25.0-T01
  summary: Add the handle registry and the `shell_start` tool, sharing 0.24.0's parser and gate. `shell_start`
    runs the line through `parse` and `plan`, walks the same per-stage `Act::Exec` and redirect checks
    the `SHELL_TOOL` arm walks, and only then spawns and registers. The registry owns the children beyond
    the dispatch that made them, which is the guarantee this release gives up on purpose.
  why_required: 'Every other handle task needs something to start. This is also where the release stops
    being like every previous one: the registry is the first thing in the crate that owns a process beyond
    the call that created it, so it is the task that defines what the rest must prove.'
  status: done
  depends_on: []
  acceptance_criteria:
  - 'F4 — the handle path is checked by the same machinery as the foreground path, proven rather than
    asserted. Every refusal case in `tests/shell.rs` runs again through `shell_start` and refuses identically,
    spawning nothing and registering no handle — driven from one shared table through the existing `run_line`
    harness (`tests/shell.rs:88`) parameterised over the tool, so a refusal added to one path cannot be
    missing from the other. A line whose second stage is denied starts no first stage.

    '
  files:
  - src/tools/shell.rs
  - src/tools/mod.rs
  - src/run.rs
  - src/tools/custom.rs
  evidence:
  - check_shell_line extracted at src/run.rs so shell and shell_start share one check pass rather than
    two copies; shell, exec_tool and policy unchanged after the extraction.
  - 'src/tools/handles.rs: the registry, 8 unit tests covering the cap refusing rather than queueing,
    a poll returning only what is new, a poll over the window reporting its gap, and an orphan never re-using
    a live id.'
  - shell_start, shell_poll and shell_kill wired into dispatch, workspace_tools and RESERVED_TOOL_NAMES;
    registry created per run in the flat loop and per agent in the tree loop.
  - 'tests/handles.rs, 5 end-to-end tests through the run loop with a scripted provider: a handle starts,
    polls and is killed; no output is delivered by two polls; every construct shell refuses shell_start
    refuses; a denied later stage starts no handle and writes no file; the ninth start against a cap of
    8 is refused.'
  - examples/tick.rs added as the fixture — nothing that ships on all three platforms both keeps running
    and keeps printing.
- id: US-IO-HARNESS-0.25.0-T02
  summary: 'Add the handle lifecycle tables to `src/state.rs` and their `Store` reader and writer, copying
    the `citations` pattern: additive `CREATE TABLE IF NOT EXISTS` at the end of `from_conn`, a public
    row struct, a transactional writer, an `ORDER BY id` reader, and a rustdoc example against `Store::memory()`.
    `CHECKPOINT_FORMAT` stays 7.'
  why_required: 'A handle outlives its poll and must outlive its step: the trace has to answer what a
    dev server did after the process that started it is gone. It is also what makes the incremental-poll
    decision safe, since the whole stream is recoverable from the store when a poll result is lost.'
  status: todo
  depends_on:
  - US-IO-HARNESS-0.25.0-T01
  acceptance_criteria:
  - 'NF3 — a handle that is never polled cannot exhaust memory. Output accumulates to the store with a
    bounded in-memory buffer, and a process producing unbounded output while nothing polls it is bounded
    by that policy rather than by the host''s memory. Asserted with a generator process, not argued.

    '
  files:
  - src/state.rs
  evidence: []
- id: US-IO-HARNESS-0.25.0-T03
  summary: Add `shell_poll` and `shell_kill`. `shell_poll` returns output produced since the last poll
    from a per-stream byte cursor, bounded by the existing `head_and_tail` elision, while every byte read
    goes to the store. `shell_kill` ends the process and its tree and records the terminal status. Add
    the per-run cap on live handles, and kill every live handle when a run ends.
  why_required: 'A handle that cannot be read or ended is not a capability, it is a leak. The cap and
    the kill-on-run-end are not extras: they are two of the four ways the registry can leak a process
    onto the operator''s machine.'
  status: in-progress
  depends_on:
  - US-IO-HARNESS-0.25.0-T01
  - US-IO-HARNESS-0.25.0-T02
  acceptance_criteria:
  - 'F1 — a process handle starts, polls and dies. A command producing output over time is started, polled
    twice returning incremental output with no duplication and no loss across the two polls, then killed;
    the handle''s terminal state and its full output are readable from the store afterwards. A handle
    left live when its run ends is killed, not leaked, and that is asserted by checking the process is
    gone rather than by trusting the code path. *(0.24.0''s F5, deferred by `US-IO-HARNESS-0.24.0-I01`,
    carried here unchanged.)*

    '
  - 'F6 — the live-handle cap refuses rather than queues. Starting one handle past the configured cap
    is refused with a reason naming the cap, no process is spawned, and the handles already live are untouched.

    '
  files:
  - src/tools/shell.rs
  - src/run.rs
  - src/state.rs
  evidence:
  - shell_poll and shell_kill are implemented and tested end to end, including the incremental-output
    claim and killing an already-ended handle being reported rather than failed.
  - 'INCOMPLETE: the other half of F1 — that a handle still live when the run ends is killed rather than
    leaked — is implemented (Handles::kill_all plus a Drop backstop) but NOT yet asserted against the
    operating system. The assertion needs the pid, which the store tables in T02 record; there is no route
    from an integration test to it until those land. Noted in tests/handles.rs rather than dropped.'
- id: US-IO-HARNESS-0.25.0-T04
  summary: Route the handle spawn into the platform's containment — `Job::create`/`Job::adopt` on Windows,
    the recorded containment and `kill_tree` on unix — so `shell_kill` ends a tree rather than a parent.
    `shell` and `exec` keep the spawn path they shipped with.
  why_required: 'The roadmap assumed handles inherited 0.24.0''s Job Object. They do not: `src/tools/shell.rs`
    references `Sandbox` nowhere, and the job is on the verification path. Without this task `shell_kill`
    leaks grandchildren on the one platform with no process group, which is the exact failure 0.24.0 shipped
    the Job Object to prevent.'
  status: todo
  depends_on:
  - US-IO-HARNESS-0.25.0-T03
  acceptance_criteria:
  - 'F2 — killing kills the tree. A handle whose command spawns a child that spawns a grandchild is killed,
    and all three are gone, on all three platforms. The negative control is what makes containment worth
    its cost: the same test with the job disabled must leave the grandchild running on Windows, so the
    criterion proves containment rather than coincidence. *(the handle half of 0.24.0''s F6, which that
    release could only assert through the sandbox''s own spawn path.)*

    '
  - 'F5 — a handle''s processes are contained by the run''s sandbox, which is the claim the code does
    not support today. The spawn reaches `Job::adopt` on Windows and the recorded containment on unix,
    verified against the cap reason rather than against the child dying — a child that dies is not evidence
    that anything contained it. This is a criterion and not a note because `src/tools/shell.rs` references
    `Sandbox` nowhere, so inheriting containment is work rather than a consequence.

    '
  files:
  - src/tools/shell.rs
  - src/sandbox.rs
  - src/sandbox/windows.rs
  evidence: []
- id: US-IO-HARNESS-0.25.0-T05
  summary: Orphan every pre-existing handle on resume, once, where all four call sites reach it — in or
    immediately beside `record_resume_markers`. An orphaned handle is marked with a reason, is readable
    from the store, is never re-attached, polled or signalled, and no recorded PID is signalled on any
    resume path.
  why_required: This is the only way this crate can damage something outside its own workspace. A PID
    recorded before a crash may have been reused, and signalling it kills a stranger's program. It goes
    at the single funnel rather than per path because being right on three of four paths is the same as
    being wrong.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.25.0-T03
  acceptance_criteria:
  - 'F3 — handles do not survive a process boundary, and say so. A run with a live handle is checkpointed
    and the process exits; on resume the handle is reported orphaned with a reason, is never polled or
    killed, and no PID is signalled. The negative control is a resumed run whose recorded PID has been
    reused by an unrelated live process, which must not be touched. *(0.24.0''s F7, carried unchanged.)*
    Asserted on every resume entry point, not one — the criterion is that the pass sits where all four
    call sites reach it.

    '
  files:
  - src/run.rs
  - src/state.rs
  evidence: []
