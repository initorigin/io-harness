- id: US-IO-HARNESS-0.50.0-T09
  summary: Run the release gates and record the measured numbers.
  why_required: Every non-functional and operational claim in the contract is a number or an exit status
    that has to be seen rather than asserted, and the record quotes them.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.50.0-T08
  acceptance_criteria:
  - '**N1 — no new dependency.** `cargo tree` for the default feature set is unchanged at **402** crates
    on macOS and Linux. `FuturesUnordered` and `select` come from `futures_util`, which is already a dependency
    and already imported at the spawn site (`src/run.rs:6476`).

    '
  - '**N2 — MSRV unmoved.** The crate builds on 1.95 with the toolchain gate CI already runs.

    '
  - '**N3 — zero compile breaks, and it is asserted rather than intended.** `TaskContract` is `#[non_exhaustive]`
    with builders (`src/contract.rs:186-188`) and `EventKind` has been `#[non_exhaustive]` since 0.24.0,
    so both additions are free; `Containment`, `RunOutcome`, `RunResult`, `CompletionRequest`, `ToolCall`
    and every `Provider` method are untouched. Proven by the cross-version fixture generator, which is
    an out-of-tree crate compiled against this build. `docs/public-api.txt` gains **the enumerated crate-root
    additions only** — stated as "the enumerated additions" rather than as a line count, because that
    checker enumerates crate-root re-exports and a criterion promising a number has been met in a different
    form in four of the last eleven releases.

    '
  - '**N4 — no durable state moves.** `git diff main -- src/state.rs` shows **no DDL**: no table, column
    or index, and `CHECKPOINT_FORMAT` unmoved at 7. `Store::children` and `find_spawn` are read paths
    that already exist and are called, not altered.

    '
  - '**N5 — the parent works while a detached child runs, measured.** With a child parked for a stated
    interval, the parent''s completed step count over that interval is recorded for a blocking spawn and
    for a detached one, in the release record. This is the release''s own number: it must be greater than
    zero for the detached arm and zero for the blocking arm, and a figure that says otherwise is a feature
    that did not ship rather than a test to adjust.

    '
  - '**N6 — a run that detaches nothing is byte-identical in trace to this build.** Every existing tree
    suite — `tests/subagents.rs`, `tests/agents.rs`, `tests/checkpoint.rs`, `tests/session_fanout.rs`,
    `tests/custom_tools.rs` — passes unchanged apart from assertions that quote the composed child line,
    each of which is updated with a sentence saying the composition deliberately changed. 0.32.0''s queue,
    0.36.0''s worktrees, 0.39.0''s contained turns and 0.41.0''s read batch are unaffected.

    '
  - '**N7 — the tree prompt does not grow a protocol.** `spawn_agent` gains two optional properties and
    no tool is added, so the tool catalogue''s shape — and therefore 0.38.0''s cacheable system prefix
    — moves by the schema''s own bytes and nothing else. Asserted by the composed system prompt differing
    from this build''s only inside the `spawn_agent` schema.

    '
  - '**O1 — the full suite passes on all three platforms**, on the standing CI matrix including 0.47.0''s
    `contained (ubuntu, userns restricted)` leg. Concurrency changes are exactly the kind that pass on
    one host and fail on a loaded runner, so a green macOS gate is not evidence here.

    '
  - '**O2 — cross-version is unaffected and proven so.** No DDL, so a 0.49.0 store and a 0.50.0 store
    are the same store in both directions, asserted by the existing cross-version suites.

    '
  - '**O3 — no test gates on a wall clock it does not own.** F5''s clock is the test''s own (milliseconds,
    against a provider the test parks deliberately) and F3''s ordering is asserted on step numbers rather
    than on elapsed time. A criterion that would fail on a busy runner is a flake this repository has
    paid for seven times, and the standing rule applies: assert the structure, record the timing.

    '
  files:
  - Cargo.toml
  - Cargo.lock
  evidence: []
