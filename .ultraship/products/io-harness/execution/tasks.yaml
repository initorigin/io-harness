    it named in EVERY_KEY.
  why_required: An operator has configured the harness in a file rather than in Rust since 0.19.0, and
    a provider kind the file cannot name is a provider io-cli and io-studio cannot select.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.29.0-T03
  acceptance_criteria:
  - 'F9 — the config variant reaches a typed field, is exactly-one about its base, and rejects what
    it does not know. `EVERY_KEY` (`tests/config.rs:233`) gains a `kind = "compatible"` entry covering
    every key, and `f7_every_key_reaches_a_typed_field` (`:362`) asserts each lands. **The negative
    control is its existing twin** (`:525`), extended to one new key, so the fixture proves the field
    is read rather than defaulted. Plus: an entry with **neither** `base_url` nor `preset`, and one
    with **both**, are each refused naming the entry''s index; an unknown `preset` name is refused listing
    the names that exist; and an unknown key inside the entry is rejected naming it, modelled on `an_unknown_key_inside_the_web_table_is_rejected_naming_it`
    (`:1242`).

    '
