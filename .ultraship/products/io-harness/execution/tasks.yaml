product: io-harness
version: 0.33.0
tasks:
- id: US-IO-HARNESS-0.33.0-T01
  summary: 'The durable event stream: a `run_events` table and its `(run_id, id)` index, `Store::put_event`
    / `events_since` / `tree_events_since` / `event_cursor`, and `observe::Broadcast` — the `Observer`
    decorator that writes the same `RunEvent` it passes on. The tree read is written `FROM tree CROSS
    JOIN run_events INDEXED BY run_events_run` from the first line, not corrected later.'
  why_required: Nothing a second process can see exists until the events are durable, and every later
    task reads them back. Writing the tree query the wrong way first and fixing it after is how the recursive-CTE
    trap gets shipped.
  status: todo
  depends_on: []
  acceptance_criteria:
  - '**F1 — the attached stream is the same stream, not a reconstruction.** A run executes under `Broadcast::new(&store,
    &recorder)` where `recorder` collects every `RunEvent`. A reader opened on the same store afterwards,
    with `Attach::to(&store, run_id)` at cursor 0, must return a `Vec<RunEvent>` **equal** to what `recorder`
    collected — `assert_eq!` on the values, since `RunEvent` is `PartialEq`, not a comparison of lengths
    or of tags. Its negative control is a run under the bare `recorder` with no `Broadcast`: the attached
    read must return empty, proving the equality above was not satisfied by a reader that reconstructs
    events from the trace.

    '
  - '**N3 — the tail read is an index seek per run, not a scan of the event log.** `EXPLAIN QUERY PLAN`
    for `Store::tree_events_since` must name `run_events_run` for the `run_events` access and must **not**
    contain `SCAN run_events`. The control statement filters on `kind`, a column in no index at all —
    not merely absent from a left prefix, because SQLite skip-scans a trailing composite column — and
    must not use `run_events_run`. The measured numbers over 200 trees × 100 events are recorded in the
    release record; no wall-clock threshold is asserted, for the reason 0.30.0''s N2 recorded.

    '
  - '**N4 — the durable stream costs one INSERT per event and nothing when it is not asked for.** A run
    with no `Broadcast` writes zero `run_events` rows, asserted. A run with one writes exactly as many
    rows as its observer received events, asserted by count against the recorder.

    '
  files:
  - src/state.rs
  - src/observe.rs
  - src/lib.rs
  - tests/attach.rs
  evidence: []
- id: US-IO-HARNESS-0.33.0-T02
  summary: 'The read-and-decide surface: `src/attach.rs` with `Attach` (per run and per tree, cursor from
    zero / from now / from a caller''s id), `Waiting`, and `Store::unresolved_approvals` behind it. No
    method that starts, resumes or steps a run, with a source-reading test that proves it.'
  why_required: This is the type the outcome names. The ownership boundary is enforced by what the type
    does not have, so the type has to exist before the boundary can be tested.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.33.0-T01
  acceptance_criteria:
  - '**F2 — the cursor is the caller''s to choose, and it advances.** Three named tests over one run:
    `Attach::to` from 0 returns the whole backlog; `Attach::to(..).from_now()` returns nothing already
    emitted and then returns exactly the events emitted after it was constructed; `from_cursor(n)` returns
    exactly the events with id greater than `n`. After each `poll`, `cursor()` equals the id of the last
    event returned, and a second `poll` with no new events returns empty rather than repeating.

    '
  - '**F8 — ownership cannot be taken, structurally.** A source-reading test over `src/attach.rs`, in
    the technique `tests/public_api.rs` has used since 0.16.0: no `impl` block on `Attach` may name `run_`,
    `resume_` or `Provider`. Its control is the same check run against a copy of the source with one such
    method spliced in, which must fail and name it — a check that passes immediately has not been shown
    to discriminate.

    '
  files:
  - src/attach.rs
  - src/state.rs
  - src/lib.rs
  - tests/attach.rs
  evidence: []
- id: US-IO-HARNESS-0.33.0-T03
  summary: First answer wins, by compare-and-swap. `Store::resolve_pending`, `Store::answer_question`
    and `Store::decide_plan` become a single conditional `UPDATE` returning `Result<bool>`; the read-then-write
    in the last two, which two processes interleave through, is removed. `Attach`'s three answer methods
    return that bool.
  why_required: Silent double-answering is the defect class the release exists to prevent, and two of
    the three write paths had it before the release started. Every later task depends on the run being
    able to ask the store who won.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.33.0-T02
  acceptance_criteria:
  - '**F5 — first answer wins, and the loser is told.** Two `Attach` handles over one store answer the
    same `request_id`. Exactly one returns `true` and the other `false` — `assert_ne!(a, b)` plus `assert!(a
    || b)`, so a mechanism that answered `true` twice or `false` twice fails. The decision the run acts
    on must be the winner''s, asserted from the run''s own reported outcome and not from either caller''s
    return value. The same test exists for a question and for a plan, because the three had three different
    write shapes before this release and two of them were read-then-write.

    '
  - '**N5 — the breaks are exactly three, all in `Store`, and all in the changelog.** `resolve_pending`,
    `answer_question` and `decide_plan` return `Result<bool>` instead of `Result<()>`, and the last two
    return `Ok(false)` where they used to return `Err(Error::Resume)` for an already-answered row. A caller
    writing `store.answer_question(id, a, by)?;` as a statement recompiles unchanged; a caller matching
    on the error must move to the bool. No public item is removed. `CompletionRequest` and `CompletionResponse`
    are untouched, so no `E0639` is owed. `tests/changelog.rs` and `tests/public_api.rs` both pass.

    '
  files:
  - src/state.rs
  - src/run.rs
  - src/attach.rs
  - tests/attach.rs
  evidence: []
- id: US-IO-HARNESS-0.33.0-T04
  summary: 'The wait becomes answerable at all four places a live run parks: the write/exec approval in
    `gate_path`, the network authorization in `authorize_net`, `ask_question` and `propose_plan`. The
    durable row moves ahead of the in-process gate, the run awaits the gate and the store row together
    with `tokio::select!`, and the decision it reports is read back from the row in both arms.'
  why_required: Without this the store rows are a place to write an answer nothing reads. This is the
    whole of 'a second process can answer the thing it is holding'.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.33.0-T03
  acceptance_criteria:
  - '**F3 — a second process answers a live approval and the owner carries on.** `examples/attach_fixture`
    starts a run under an `Approver` that never returns, prints its run id, and does not exit. The test
    opens the store file in its own process, attaches, waits for `Waiting::Approval` to appear, calls
    `answer_approval(request_id, Decision::approve())` and reads the fixture''s exit. The fixture must
    exit 0 having completed the write it was asking about, without being killed and without any `resume_*`
    call. The discriminating assertion is that the fixture''s own stdout reports the decision it acted
    on, and that it says `approve` — the same test run with `Decision::deny` must see `deny`, so a fixture
    that ignores the answer and proceeds fails one of the two.

    '
  - '**F4 — a live question and a live plan are answerable too, and the plan is not an omission.** Two
    more named tests over the same fixture shape: a run parked in `ask_question` is answered by `Attach::answer_question`
    and the answer text reaches the model as the observation the in-process `Responder` path produces;
    a run parked in `propose_plan` is answered by `Attach::answer_plan(plan_id, PlanVerdict::Approve)`
    and the run leaves its planning phase and writes. Both assert the run continued in the *same* process,
    never resumed.

    '
  - '**F9 — the reported decision comes from the store row, in both arms.** After the race resolves, the
    emitted `EventKind::ApprovalDecided` and the `policy_events` row are built from a fresh `Store::pending(request_id)`
    read, not from the value the race returned. Asserted by answering with an approval that the store
    then holds and requiring the event to carry it, and — the part that discriminates — by running the
    same assertion on the **fast path**, where the in-process `Approver` answers immediately and the store
    poll never fires. A read that only exists in the attached arm passes the first and fails the second.

    '
  files:
  - src/run.rs
  - src/attach.rs
  - examples/attach_fixture.rs
  - tests/attach.rs
  evidence: []
- id: US-IO-HARNESS-0.33.0-T05
  summary: 'The bounded failure modes, executed: SIGKILL the attaching process and the owner runs to completion
    with a stream continuous across the kill; SIGKILL the owner and what is left is exactly the unresolved
    row `resume_with_decision` has consumed since 0.7.0.'
  why_required: '''The failure modes are bounded'' is the outcome''s central claim and the one most easily
    believed without evidence. Both halves are kills, not assertions on paper.'
  status: todo
  depends_on:
  - US-IO-HARNESS-0.33.0-T04
  acceptance_criteria:
  - '**F6 — the observer dying changes nothing.** The attaching process is SIGKILLed while polling a live
    fixture run. The fixture then receives an answer from a *third* process and completes normally, and
    the event stream the third process reads is continuous across the kill — no gap in `id`, no duplicate.
    Nothing about the owner''s run row, step rows or outcome differs from the same run with no observer
    ever attached, asserted by comparing the two runs'' `steps` rows.

    '
  - '**F7 — the owner dying leaves exactly the resumable run 0.7.0 guaranteed.** The fixture is SIGKILLed
    while parked on an approval. The store then holds an unresolved `pending_approvals` row, and `resume_with_decision(request_id,
    Decision::approve())` completes the run — the exact 0.7.0 path, unchanged. The discriminating assertion
    is an absence, in the shape 0.31.0''s F-gate should have used: the row must be *unresolved*, checked
    before the resume, because a run whose pending row was resolved up front by the new write-before-gate
    ordering and then abandoned would resume into a decision nobody made.

    '
  files:
  - examples/attach_fixture.rs
  - tests/attach.rs
  evidence: []
- id: US-IO-HARNESS-0.33.0-T06
  summary: Cross-version evidence in both directions and the 0.22.0 schema guard fed `run_events` and
    `run_events_run` by name; `CHECKPOINT_FORMAT` unmoved; the no-migration claim asserted rather than
    assumed.
  why_required: A new table fires the schema guard, and a release that touches the store owes both directions
    of the compatibility story. The WAL claim is the release's transport argument and has to be a criterion,
    not a sentence.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.33.0-T01
  acceptance_criteria:
  - '**N2 — no migration, because WAL is already the file''s mode.** `Store::open` has set `journal_mode
    = WAL` and `busy_timeout = BUSY_TIMEOUT` since 0.12.0, both asserted by `tests/store_open.rs`. This
    release opens no second connection mode, sets no new pragma and does not change `user_version`. Recorded
    as a criterion rather than assumed, because a release that *had* needed to turn WAL on would have
    owed the full cross-version evidence F10 provides.

    '
  - '**F10 — cross-version compatibility, both directions.** A database written by a real 0.32.0 build
    opens, resumes and replays under 0.33.0 with nothing to migrate; a 0.33.0 store carrying `run_events`
    rows is read by a 0.32.0 build, which never names the table. `CHECKPOINT_FORMAT` does not move. The
    0.22.0 schema guard in `tests/cross_version.rs` is fed `run_events` and `run_events_run` by name.

    '
  files:
  - tests/cross_version.rs
  - tests/cross_version_0_29_0.rs
  - tests/store_open.rs
  evidence: []
- id: US-IO-HARNESS-0.33.0-T07
  summary: 'Documentation shipped with the code: the `attach` module page, `Broadcast`''s and `Attach`''s
    worked examples, `README.md`, `docs/CONTRACT.md` including the four honest limitations, and the `CHANGELOG.md`
    section the release workflow reads verbatim.'
  why_required: '`release.yml` refuses a version with no changelog section, and the crate''s surface test
    refuses a public item with no compiling example. Documentation is part of this release, not after
    it.'
  status: todo
  depends_on:
  - US-IO-HARNESS-0.33.0-T05
  acceptance_criteria:
  - '**N6 — every added public item carries a worked example**, enforced by the existing surface test:
    `Broadcast`, `Attach`, `Waiting`, and the four new `Store` methods all appear in compiling doctests.

    '
  - '**N7 — the honest limitations are stated where a reader finds them.** `docs/CONTRACT.md` says plainly
    that the crate does not detect whether the owning process is alive, that `run_events` is never pruned,
    that `Attach::poll` is a poll and its latency is the caller''s interval plus the owner''s, and that
    the run picks up an attached answer at the gate''s poll interval rather than instantly. Under the
    `known_limitations` discipline, not implied.

    '
  - '**N1 — no new dependency.** `cargo tree` on macOS and Linux still reads 402 lines. The transport
    is the `rusqlite` store both processes already open, the wait is `tokio::time`, and the race is `tokio::select!`
    — every one of them already compiled into every build.

    '
  files:
  - README.md
  - docs/CONTRACT.md
  - CHANGELOG.md
  - src/attach.rs
  - src/observe.rs
  - Cargo.toml
  evidence: []
