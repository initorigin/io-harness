    `cargo package --locked` verified by listing the tarball.'
  why_required: 'The release cannot be cut without them: `release.yml` refuses a version the manifest
    does not declare or that has no changelog section, and `cargo publish` is irreversible.'
  status: todo
  depends_on:
  - US-IO-HARNESS-0.25.0-T08
  acceptance_criteria:
  - 'NF2 — **the dependency tree does not move on any platform.** `cargo tree` on the default feature
