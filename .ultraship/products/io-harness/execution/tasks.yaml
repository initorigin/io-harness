- id: US-IO-HARNESS-0.16.0-T14
  summary: '`resume_tree_from_stored_policy` and `resume_tree_from_stored_policy_observed` — the tree
    loop''s stored-policy resume, built on the template `resume_from_stored_policy` already provides
    for the single-file and workspace loops. A tree with no stored policy is a typed error, never a
    silent fall back to `Policy::permissive`.'
  why_required: 'The release documents the public contract, and the resume surface currently
    contradicts itself: two loops can be resumed under the policy they were started with and the
    third cannot, which would have to be written down as a caveat in the guide page for durable runs.
    Fixing it is smaller than documenting it, and 0.15.0 made it sharper by letting the agent take
    irreversible commits under a policy.'
  status: done
  depends_on: []
  acceptance_criteria:
  - >
    F12 — `resume_tree_from_stored_policy` resumes a tree under the policy it was started with. A
    tree run started under a policy denying a path, killed mid-run, and resumed through the new
    entry point without the caller passing a policy, still refuses that path — and the refusal is in
    the trace attributed to the original rule and layer.
  - >
    F13 — the negative control for F12. The same tree started under a permissive policy and resumed
    the same way performs the action, so F12 measures a restored boundary rather than a resume that
    fails everything. And a tree resumed through the new function that has no stored policy is a
    typed error, never a silent fall back to `Policy::permissive` — which is the exact defect 0.13.0
    was written to close in the other two loops.
  files:
  - src/run.rs
  - src/lib.rs
  - tests/checkpoint.rs
  evidence:
  - >
    resume_tree_from_stored_policy and its observed twin added; no existing signature changed; a
    tree with no stored policy is Error::Resume and never a permissive fallback (d8dfad5)
  - >
    tests/checkpoint.rs, 18 passed: F12 asserts the refusal and its rule and layer attribution, F13
    covers both the permissive control and the no-stored-policy error
