product: io-harness
version: 0.30.0
tasks:
- id: US-IO-HARNESS-0.30.0-T01
  summary: >
    Pin a 0.29.0 fixture generator and record its output, before any schema change: a
    known-composition aggregates store, a resumable interrupted tree, and a `read` mode the
    reverse-direction check execs.
  why_required: >
    The release's one ordering risk. If the generator is built after the schema moves, the
    cross-version evidence measures this tree against itself and passes for the wrong reason. It is
    the first commit of the release for that reason alone.
  status: todo
  depends_on: []
  acceptance_criteria:
  - >
    **F8 — cross-version compatibility, both directions.** A database written by a real 0.29.0 build
    opens, resumes and replays under 0.30.0 with nothing to migrate; and a 0.30.0 store is read by a
    0.29.0 build, which never queries the new table. Proven with a pinned 0.29.0 fixture generator,
    the way `tests/cross_version.rs` already proves it for the 0.22.0 boundary — never with a
    database this tree wrote and labelled.
  files:
  - tests/fixtures/gen-0.29.0/Cargo.toml
  - tests/fixtures/gen-0.29.0/Cargo.lock
  - tests/fixtures/gen-0.29.0/src/main.rs
  - tests/fixtures/store-0.29.0
  - Cargo.toml
  evidence: []

- id: US-IO-HARNESS-0.30.0-T02
  summary: >
    Per-key configuration provenance: an `Origin` recorded for every leaf key as each scope is
    merged, surviving substitution and the `[profile.<name>]` overlay, read back by
    `Config::origin` and `Config::origins`.
  why_required: >
    Without it the release does not answer the first of the three questions, and it is the only one
    of the three whose absence makes a settings screen actively misleading rather than merely
    absent.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.30.0-T01
  acceptance_criteria:
  - >
    **F1 — provenance across four scopes.** A fixture setting the same key in defaults, user,
    project and local resolves to the local value and reports the local scope and that file's path.
    Removing the local file makes it report project, and so on down. Asserted at each of the four
    steps, so the test discriminates between "reports the last scope" and "reports the deciding
    scope" — which are the same answer only when the key is set everywhere.
  - >
    **F2 — provenance through substitution.** A key whose value came from `${env:}` reports the file
    the substitution was written in, not the environment variable and not the process environment.
    A key whose value came from `${cmd:}` does the same. The negative control is the same key
    written literally, which must report the identical origin — if it does not, the implementation
    is reporting the mechanism rather than the source.
  - >
    **F3 — a project scope that narrowed a user's setting is visible.** The case 0.27.0's trust rule
    creates: a boundary set in the user scope and narrowed in the project scope resolves to the
    project value and reports the project file. This is the specific question the whole feature
    exists to answer and it gets its own named test.
  files:
  - src/config.rs
  - src/lib.rs
  - tests/config.rs
  evidence: []

- id: US-IO-HARNESS-0.30.0-T03
  summary: >
    `MemoryEntry` gains a `#[non_exhaustive]` kind and a pinned flag, with a pinned entry refusing an
    overwrite by a run and the refusal recorded as an observable event.
  why_required: >
    The second question. A human who cannot correct what the agent has learned, and cannot make the
    correction stick, has a memory they can only read.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.30.0-T01
  acceptance_criteria:
  - >
    **F4 — kinds round-trip.** A decision written and read back is a decision; a fact is a fact. The
    enum is `#[non_exhaustive]`, and a test asserts an exhaustive census of its variants against the
    source the way `EVENT_NAMES` is asserted against `EventKind` — the 0.28.0 lesson that a match
    arm proves exhaustiveness and a hand-written list does not.
  - >
    **F5 — a pinned entry survives a run that tries to overwrite it.** After the run, the value is
    the pinned one, and the attempt is in the trace as an observable event. Both halves are
    asserted: a silent refusal would leave the agent believing it had corrected something.
  files:
  - src/state.rs
  - src/observe.rs
  - src/run.rs
  - src/lib.rs
  - tests/memory.rs
  evidence: []

- id: US-IO-HARNESS-0.30.0-T04
  summary: >
    The per-run recall record: a new table, a write at recall time, and an accessor answering which
    entries a given run actually drew on.
  why_required: >
    "What does the agent know" and "what did this run use" are different questions, and only the
    second tells a reader whether a memory entry was load-bearing.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.30.0-T03
  acceptance_criteria:
  - >
    **F6 — the recall record names the run.** A run that recalls three of six entries produces a
    record naming those three and that run, and a second run over the same workspace produces its
    own record without disturbing the first.
  files:
  - src/state.rs
  - src/context.rs
  - tests/memory.rs
  evidence: []

- id: US-IO-HARNESS-0.30.0-T05
  summary: >
    Outcome, gate and recovery aggregates on `Store`, in the shape `src/pricing.rs` established:
    grouped rows out, no rendering, and no accessor for a number the trace cannot answer honestly.
  why_required: >
    The third question, and the one every consumer currently re-derives from raw rows — which is the
    duplication the 0.18.0 cost grouping exists to prevent.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.30.0-T01
  acceptance_criteria:
  - >
    **F7 — the aggregates are right against a known trace.** A fixture store built with a known
    composition — a fixed number of runs, a known number of first-try passes, a known distribution
    of gate failures, and a known count of fallbacks, replans and resumes — produces exactly those
    numbers. The expected values come from the fixture's construction, never from running the
    accessor and recording what it said.
  - >
    **N2 — the aggregates do not scale with the trace.** Each is one indexed query, not a table
    scan the caller pays for on every render. Measured against a store with a large trace and the
    number recorded; the point is that a panel refreshing does not get slower as history grows.
  files:
  - src/state.rs
  - tests/accounting.rs
  evidence: []

- id: US-IO-HARNESS-0.30.0-T06
  summary: >
    The cross-version test over the committed 0.29.0 fixtures — read-back, resume, and the reverse
    direction where a 0.29.0 binary reads a store this tree wrote — plus the CI job that runs it.
  why_required: >
    Without it the additive-migration claim is an assertion. Both directions have to be executed by
    the release that makes the claim, and one of them can only be executed by the previous binary.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.30.0-T04
  - US-IO-HARNESS-0.30.0-T05
  acceptance_criteria:
  - >
    **F8 — cross-version compatibility, both directions.** A database written by a real 0.29.0 build
    opens, resumes and replays under 0.30.0 with nothing to migrate; and a 0.30.0 store is read by a
    0.29.0 build, which never queries the new table. Proven with a pinned 0.29.0 fixture generator,
    the way `tests/cross_version.rs` already proves it for the 0.22.0 boundary — never with a
    database this tree wrote and labelled.
  files:
  - tests/cross_version_0_29_0.rs
  - .github/workflows/ci.yml
  evidence: []

- id: US-IO-HARNESS-0.30.0-T07
  summary: >
    Documentation: the three guide pages, `docs/CONTRACT.md`, `CHANGELOG.md`, `docs/public-api.txt`,
    the version bump, and a worked example on every added public item.
  why_required: >
    A capability documented only in rustdoc is a capability only a reader who already knows it exists
    will find, and the public-surface snapshot is enforced by a test rather than by habit.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.30.0-T02
  - US-IO-HARNESS-0.30.0-T04
  - US-IO-HARNESS-0.30.0-T05
  acceptance_criteria:
  - >
    **N3 — nothing breaks.** No public item is renamed or removed, no signature changes, no default
    changes. `docs/public-api.txt` gains lines and loses none, and the changelog carries no
    `**BREAKING` entry. If one becomes necessary the release is wrong, not the rule.
  - >
    **N4 — every added public item carries a worked example**, enforced by the existing test that
    enumerates the surface re-exported from `lib.rs` and fails on any item whose docs carry no
    fenced example.
  files:
  - docs/guide/configuration.md
  - docs/guide/context-and-memory.md
  - docs/guide/accounting.md
  - docs/CONTRACT.md
  - docs/public-api.txt
  - CHANGELOG.md
  - Cargo.toml
  evidence: []

- id: US-IO-HARNESS-0.30.0-T08
  summary: >
    The release gates: `cargo fmt --check`, clippy `-D warnings`, the three test invocations,
    `cargo tree` unchanged, `cargo package --locked`, and the three-OS matrix green on the commit
    being released.
  why_required: >
    Every one of these is a refusal `release.yml` performs anyway; failing them here costs a re-run,
    failing them there costs a release.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.30.0-T06
  - US-IO-HARNESS-0.30.0-T07
  acceptance_criteria:
  - >
    **N1 — no new dependency.** `cargo tree` on macOS and Linux is unchanged. This release is three
    accessors, two fields and a table; anything it needs is already here.
  - >
    **O1 — the three-OS matrix is green** on the commit being released, including the MSRV job.
  - >
    **O2 — docs.rs builds.** Checked by the nightly job, because a stable `cargo doc` passing is not
    evidence that docs.rs does — the 0.16.2 lesson, which cost two releases without a rendered page.
  - >
    **O3 — `cargo package --locked` succeeds**, and the packaged crate's tests compile.
  files:
  - .ultraship/evidence/0.30.0
  evidence: []
