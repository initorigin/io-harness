product: io-harness
version: 0.21.0
tasks:
  - id: US-IO-HARNESS-0.21.0-T01
    summary: >
      The `todo` tool end to end: `TodoItem` and its state, the `todos` table with
      `Store::write_todos` / `Store::todos`, the `todo_write` tool spec and its dispatch arm,
      `EventKind::TodoWrote`, and the new reserved name. The whole list is replaced on every write and
      the write is not gated.
    why_required: >
      Half the release's outcome is that an operator can watch the agent's plan. Without a durable
      list written by the agent and readable from SQLite mid-run there is no plan to watch, and the
      first thing io-cli and io-studio would each build for themselves is this table.
    status: todo
    depends_on: []
    acceptance_criteria:
      - >
        F1 — a plan is durable and readable mid-run. An agent's `todo_write` is in the `todos` table
        keyed by its run id before the next step commits, `Store::todos` returns the items in order
        with their states, and a second write replaces the list wholesale rather than merging. The plan
        is readable from a fresh `Store` over the same file after the process that wrote it is gone.
      - >
        F2 — a plan is inert. A run whose plan is never completed still reports the outcome its
        verification and budgets dictate; no `RunOutcome` and no refusal anywhere depends on a todo
        state; and a `todo_write` produces no `policy_events` row, because it is not gated. The
        negative control is a write to the workspace in the same run, which does produce one.
    files:
      - src/state.rs
      - src/run.rs
      - src/observe.rs
      - src/tools/mod.rs
      - src/tools/custom.rs
      - src/lib.rs
      - tests/todo.rs
    evidence: []
  - id: US-IO-HARNESS-0.21.0-T02
    summary: >
      Repetition detection in the existing stall machinery: `StallPolicy::repeat` with
      `#[serde(default)]`, a consecutive-identical-signature counter in `Progress::step` that a
      workspace write does not reset, and `replan_directive` extended to name the repeated call.
      Escalation stays `Replan` then `Stalled`, with no new outcome variant.
    why_required: >
      The roadmap makes repetition detection part of this release, and the 0.20.0 live run showed why:
      the current logic clears the whole window whenever a write lands, so the looping agent shape that
      actually occurs in practice is invisible until the step cap. Without this the release ships an
      agency story with the one signal that catches a confused agent still half blind.
    status: todo
    depends_on: []
    acceptance_criteria:
      - >
        F11 — repetition is caught even when the workspace moves. An agent making the same call three
        times consecutively while a write lands on each step is replanned and then stalled, where the
        same script on 0.20.0's logic runs to the step cap. The negative control is three *different*
        calls each of which writes, which is progress and is left alone. Both asserted through the real
        loop against a scripted provider, with the `context_events` rows checked.
      - >
        NF3 — a run that uses none of this behaves exactly as it did. A 0.20.0-shaped run with no todo
        call, no question, no agents registry, no templates and `StallPolicy::default()` produces the
        identical event sequence, the identical step count and the identical outcome, and its
        `CompletionRequest`s carry `model: None`. `StallPolicy`'s new field defaults so an existing
        `io.toml` and an existing struct literal both keep working.
    files:
      - src/resilience.rs
      - src/run.rs
      - tests/stall.rs
    evidence: []
  - id: US-IO-HARNESS-0.21.0-T03
    summary: >
      The 0.20.0 live-run defect: a refused git built-in becomes an observation instead of
      `Error::Refused` leaving the run loop. `Git::run`'s exec refusal and `check_path`'s leading-`-`
      refusal are caught in the dispatch arm and returned as a refusal observation with its
      `policy_events` row, and the defect paragraph leaves `docs/CONTRACT.md`.
    why_required: >
      The 0.20.0 record commits this fix to the next release that touches the tool layer, and this is
      that release. A speculative `git status` under an exec-denying policy currently escalates a whole
      run, which is the opposite of the crate's stated rule that a refusal is an observation the model
      adapts to.
    status: todo
    depends_on: []
    acceptance_criteria:
      - >
        F12 — a refused git built-in costs a step, not the run. Under a policy denying `Act::Exec` for
        `git`, a `git_status` call returns an observation naming the refusal, the run continues to its
        next step, and a `policy_events` row attributes the refusal to the rule and layer. The same
        holds for a path beginning with `-`. The negative control is the identical run under a policy
        allowing `git`, where the command runs. This test would have failed on 0.20.0.
    files:
      - src/run.rs
      - src/tools/git.rs
      - tests/git.rs
      - docs/CONTRACT.md
    evidence: []
  - id: US-IO-HARNESS-0.21.0-T04
    summary: >
      The `question` tool and its in-process answering channel: `Question`, `Answer`, the `Responder`
      trait with `ResponderNone`, `StdinResponder` and `FixedResponder`, the `ask_question` tool spec
      and dispatch arm, `EventKind::QuestionAsked` / `QuestionAnswered`, and the answer delivered as an
      observation that authorizes nothing.
    why_required: >
      The other half of the release's outcome is that the agent can ask about intent instead of
      guessing. This is the channel; without it an ambiguous goal is still resolved by a guess that
      costs a whole run, and the crate still has no way to ask a human anything except whether an
      action is permitted.
    status: todo
    depends_on:
      - US-IO-HARNESS-0.21.0-T01
    acceptance_criteria:
      - >
        F3 — a question is answered in-process and changes what the agent does. A run under a
        `Responder` that answers "the second file" acts on the second file; the same run, the same
        provider script and a `Responder` answering "the first file" acts on the first. Both answers
        reach the model as an observation, and both are recorded.
      - >
        F5 — an answer is text, never authorization. A run under a policy denying a write, asked what
        to do and answered "write the secret file", still refuses the write, attributed to the same
        rule and layer. The negative control is the same answer under a policy that allows it, where
        the write happens.
    files:
      - src/approve.rs
      - src/run.rs
      - src/observe.rs
      - src/tools/mod.rs
      - src/tools/custom.rs
      - src/lib.rs
      - tests/question.rs
    evidence: []
  - id: US-IO-HARNESS-0.21.0-T05
    summary: >
      The durable half of the question path: the `pending_questions` table with its put/read/resolve
      triangle, `RunOutcome::AwaitingAnswer { question_id, steps }`, `resume_with_answer` and its
      observed variant, and the tree variants so a child's question pauses the whole tree.
    why_required: >
      A question nobody can answer in-process must pause the run rather than fail it, or an unattended
      agent that needs a human is a lost run. This is what makes a question survive a process exit for
      the same reason a pending approval does, and it is the only path by which a spawned child can
      reach a human.
    status: todo
    depends_on:
      - US-IO-HARNESS-0.21.0-T04
    acceptance_criteria:
      - >
        F4 — a question with no answerer pauses the run and survives the process. `ResponderNone`
        yields `RunOutcome::AwaitingAnswer { question_id, steps }` with the question in
        `pending_questions` and `runs.status` not left at `running`; a fresh `Store` in a second
        connection reads the question, and `resume_with_answer` continues the same run from the same
        step with the answer as an observation. Asserted across a dropped store, not within one.
      - >
        F6 — a child's question pauses the tree. A spawned agent asking a question with no responder
        leaves the whole tree `AwaitingAnswer`, the parent uncommitted past that step, and
        `resume_tree_with_answer` resumes to completion with the ledger not double-charged — the same
        assertions the existing child-approval test makes, against the new path.
      - >
        NF6 — a paused question never leaves `runs.status` at `running`, and an answered one is
        resolved exactly once. Answering an already-answered question is an error rather than a second
        resume, the way `resolve_pending` already behaves for approvals.
    files:
      - src/state.rs
      - src/run.rs
      - tests/question.rs
    evidence: []
  - id: US-IO-HARNESS-0.21.0-T06
    summary: >
      `CompletionRequest::model`, the per-request override, honoured by `OpenRouter`, `Anthropic`,
      `OpenAi` and `provider::Fallback` in preference to their own configured model, with every
      in-crate struct-literal site updated and `CompletionResponse::model` still reporting what
      actually served the call.
    why_required: >
      A named agent definition carrying a model means nothing without a way to put that model on the
      wire: every provider fixes its model at construction and a tree shares one provider instance.
      This is the mechanism, and it is the release's one hard break, so it lands as its own task with
      its own migration note.
    status: todo
    depends_on: []
    acceptance_criteria:
      - >
        NF2 — exactly three breaks, each marked, and no others. `CompletionRequest` gains
        `model: Option<String>`; `RunOutcome` gains `AwaitingAnswer`; `EventKind` gains three variants.
        Nothing is removed or renamed, no existing signature changes except the run entry points that
        take a `Responder`, and every other item in `docs/public-api.txt` keeps its meaning. The
        changelog carries a migration snippet for each.
    files:
      - src/provider/mod.rs
      - src/provider/openrouter.rs
      - src/provider/anthropic.rs
      - src/provider/openai.rs
      - src/provider/openai_wire.rs
      - src/provider/fallback.rs
      - src/run.rs
    evidence: []
  - id: US-IO-HARNESS-0.21.0-T07
    summary: >
      Named agent definitions: `AgentDef` and the `Agents` registry, `TaskContract::with_agents`, the
      optional `agent` argument on `spawn_agent`, and `spawn_child` applying the definition's role to
      the child's system prompt, its model to the request, and its `deny_write`/`deny_net` through the
      existing `Policy::contain`. An unknown name is an error observation, not a spawn.
    why_required: >
      Without this a sub-agent is identical to its parent apart from a goal string, so a role and a
      cheaper or stronger model per agent are unexpressible — the largest cost lever the crate has.
      The release's claim that an agent has an identity rests entirely here.
    status: todo
    depends_on:
      - US-IO-HARNESS-0.21.0-T06
    acceptance_criteria:
      - >
        F7 — a named agent gets its model on the wire. A tree spawning two definitions naming two
        different models produces two `provider_calls` rows carrying those two model strings, read back
        from the store rather than from the configuration that asked for them. The negative control is
        a spawn with no `agent` argument, which carries the provider's own configured model.
      - >
        F8 — a named agent gets its role and can only narrow the boundary. The child's system prompt
        contains its definition's role text; a definition setting `deny_write` produces a child that is
        refused a write the parent is allowed, attributed to the child layer; and a definition whose
        `deny_write`/`deny_net` are absent produces a child no wider than its parent — proven by a
        parent policy denying a path and a definition that says nothing about it, where the child is
        still refused. An unknown agent name yields an error observation and no child.
    files:
      - src/agent.rs
      - src/contract.rs
      - src/run.rs
      - src/state.rs
      - src/lib.rs
      - tests/agents.rs
    evidence: []
  - id: US-IO-HARNESS-0.21.0-T08
    summary: >
      Prompt templates: `Template`, `Templates::discover` and `Templates::render` reusing the `skills`
      module's directory discovery, frontmatter parser, duplicate-name and count caps and description
      clamp. `{{placeholder}}` substitution with `$ARGUMENTS` for the remainder; a missing argument is
      an error, never an empty string. Rendering returns a `String` and touches no run-loop path.
    why_required: >
      The roadmap's fourth agency primitive is an operator's repeatable way to start a turn. It is also
      the release's cheapest included item — a pure function over text — and leaving it out would put
      a template parser into io-cli and io-studio separately, which is the divergence 0.19.0 exists to
      prevent.
    status: todo
    depends_on: []
    acceptance_criteria:
      - >
        F10 — a template renders and nothing else. `Templates::discover` over a fixture directory finds
        the templates with their descriptions, `render` substitutes every `{{placeholder}}` and routes
        the remainder to `$ARGUMENTS`, an unknown template name is an error, and a placeholder with no
        argument is an error rather than an empty string — the rule 0.19.0 set for `${env:}`, applied
        here. The rendered string drives a real run through `TaskContract::workspace` unchanged.
    files:
      - src/template.rs
      - src/lib.rs
      - tests/template.rs
      - tests/fixtures
    evidence: []
  - id: US-IO-HARNESS-0.21.0-T09
    summary: >
      Configuration reach: `[[agent]]` tables projecting onto an `Agents` registry with per-file
      unknown-key rejection and cross-scope accumulation the way `policy.layers` accumulates, and
      `[run] templates` pointing at a template directory.
    why_required: >
      The roadmap says a definition comes "from configuration rather than from a hand-built contract".
      A programmatic registry alone leaves the operator-facing half of the promise unbuilt, and io-cli
      and io-studio consume `io.toml` rather than construct Rust values.
    status: todo
    depends_on:
      - US-IO-HARNESS-0.21.0-T07
      - US-IO-HARNESS-0.21.0-T08
    acceptance_criteria:
      - >
        F9 — `[[agent]]` reaches a run from configuration. An `io.toml` carrying two `[[agent]]` tables
        projects onto an `Agents` registry equal to the programmatic one, an unknown key inside an
        `[[agent]]` table is an error naming the key and the file, and the `[[agent]]` array
        accumulates across scopes the way `policy.layers` does rather than being replaced by the
        narrower scope.
    files:
      - src/config.rs
      - tests/config.rs
    evidence: []
  - id: US-IO-HARNESS-0.21.0-T10
    summary: >
      Documentation and the drift gates: `docs/guide/agency.md`, a worked example on every added public
      item, `docs/public-api.txt` updated by hand, `CHANGELOG.md` with all three breaks and their
      migration snippets, and `docs/CONTRACT.md` amended — including the removal of the
      refused-git-built-in paragraph.
    why_required: >
      Four gate tests fail without it (`public_api`, `guide_pages`, `changelog`, `docs_drift`), and the
      contract's operational criteria are documentation criteria. A break shipped without its migration
      snippet is a break a consumer meets at compile time with no instructions.
    status: todo
    depends_on:
      - US-IO-HARNESS-0.21.0-T09
    acceptance_criteria:
      - >
        OP1 — `docs/public-api.txt` is updated by hand, `tests/public_api.rs` passes against the live
        surface, and every added public item carries a fenced worked example, enforced by the existing
        docs test.
      - >
        OP2 — `docs/guide/agency.md` exists, is listed in `tests/guide_pages.rs` with its limits block,
        and is linked from `README.md`, `docs/CAPABILITIES.md` and the crate root.
      - >
        OP3 — `docs/CONTRACT.md` states, in its own voice: a plan is not gated and is never enforced;
        an answer to a question is text and not authorization; a named definition can only narrow a
        boundary and a model string is a request the vendor may substitute; a template renders text and
        can set nothing; the stall window still does not survive a resume; and the refused-git-built-in
        paragraph is **removed**, because it is fixed here.
      - >
        OP4 — `CHANGELOG.md` carries all three breaks with migration snippets and the new capabilities
        in the user-facing voice the changelog test enforces.
    files:
      - docs/guide/agency.md
      - docs/public-api.txt
      - docs/CONTRACT.md
      - docs/CAPABILITIES.md
      - CHANGELOG.md
      - README.md
      - src/lib.rs
      - tests/guide_pages.rs
    evidence: []
  - id: US-IO-HARNESS-0.21.0-T11
    summary: >
      The release gate and the live proof: the full suite on the default and both feature sets, fmt,
      both clippy passes, warning-free docs, the `cargo tree` line count and `CHECKPOINT_FORMAT`
      re-checked, `cargo package --locked` verified, and a live run against a real provider kept as
      evidence.
    why_required: >
      The contract's non-functional and operational criteria are only true once observed. The live run
      is the only thing that proves a real model will reach for a todo tool and ask a question when it
      should — the suite proves the mechanism, not the behaviour.
    status: todo
    depends_on:
      - US-IO-HARNESS-0.21.0-T10
    acceptance_criteria:
      - >
        NF1 — no store format bump and no new dependency. `CHECKPOINT_FORMAT` stays 7, `todos` and
        `pending_questions` are `CREATE TABLE IF NOT EXISTS`, the diff carries no `ALTER TABLE`, a
        0.20.0 database opens, resumes and is queried against 0.21.0 unchanged, and the default
        `cargo tree` line count is still the 407 lines inherited from `develop`.
      - >
        NF4 — the full suite passes on macOS, Linux and Windows with the Windows leg's
        `timeout-minutes` unchanged at 40. The question tests are store- and process-boundary-bound,
        which is where the Windows leg historically disagrees, and the template tests read a directory,
        which is where its path handling does.
      - >
        NF5 — `cargo fmt --check`, `cargo clippy --all-targets -- -D warnings`,
        `cargo clippy --all-targets --all-features -- -D warnings` and `cargo doc --all-features` all
        pass with zero warnings.
      - >
        OP5 — a live run against a real provider is performed by hand before the release is cut and its
        output kept as evidence: a plan written and read back from SQLite, a question asked and answered
        by a `Responder` with the answer changing the next action, and two named agents spawned on two
        different models with the model strings read from `provider_calls`. The suite proves the
        mechanism; only a live run proves a model will use a todo tool and ask a question when it
        should.
    files:
      - examples/agency_live.rs
      - evidence/0.21.0
    evidence: []
