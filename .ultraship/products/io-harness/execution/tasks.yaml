product: io-harness
version: 0.10.0
tasks:
- id: US-IO-HARNESS-0.10.0-T01
  summary: 'Replace the append-only `observations: String` with a structured context ledger and a budget-aware
    assembler. Adds a `context` module holding `Observation`/`Ledger`, an in-crate token estimate, and
    a `ContextBudget` on `TaskContract` (absolute ceiling plus a share of the remaining token budget,
    the lower binding). The workspace loop pushes typed entries instead of `push_str` and calls the assembler
    to build the user prompt. Records what assembly did as trace rows: entries carried, entries stubbed,
    estimated tokens, and the provider-reported count for the same request.'
  why_required: Every other criterion in the release is a rule the assembler applies. Without the ledger
    there is nothing to apply a rule to, and the prompt keeps growing whatever else is built.
  status: done
  depends_on: []
  acceptance_criteria:
  - 'F1 — the prompt is assembled, not accumulated. For a run whose raw observation text exceeds the configured
    share, a test asserts the assembled prompt is within the share on every turn while the trace still
    holds every observation in full. The `observations: String` at `src/run.rs:950` no longer exists as
    an append-only buffer that is re-sent whole.

    '
  - 'F2 — per-turn prompt size does not grow linearly with steps. A test drives a run over many turns
    whose tool results are individually small but cumulatively over the share, and asserts the assembled
    size stabilises rather than tracking step count.

    '
  - 'NF1 — the token estimate is honest and measurable. There is no estimator in the crate today: every
    token number is post-hoc provider-reported usage, and a provider that reports none is counted as zero
    (`src/run.rs:674`, `806`, `1148`), so assembly cannot be built on reported usage at all. The new estimate''s
    method is documented in the crate as an estimate rather than a count, is computed before the request
    from the text being sent, and every turn''s trace row carries both it and the provider-reported usage
    when the provider supplies any, so drift is a recorded number and a silent provider does not make
    the assembler blind. The default share is set below 1.0 of the budget by enough margin that estimator
    drift cannot push a real request past a provider''s context limit; a provider context-length rejection
    is surfaced as a named error, not laundered into a generic retry.

    '
  - 'NF2 — no new runtime dependency. Assembly, estimation, compaction and memory are built on the existing
    dependency set; `[dependencies]` gains nothing. A dev-dependency for a fixture is acceptable; a tokenizer
    is not.

    '
  - 'NF3 — assembly is not a new hot spot. The per-turn assembly cost is measured and bounded by a test,
    in the manner 0.9.1 bounded policy dispatch, so the fix for a token cost is not paid for in wall-clock
    on every step.

    '
  - 'NF7 — the loop gains direct test coverage. `src/run.rs` is 2,193 lines with zero unit tests today;
    the assembler introduced here is unit-tested at its own boundary rather than only through an integration
    mock provider, because a context rule that can only be observed end to end is one nobody will tune.

    '
  files:
  - src/context.rs
  - src/run.rs
  - src/contract.rs
  - src/state.rs
  - src/lib.rs
  - tests/context.rs
  evidence:
  - 'src/context.rs (new, ~640 lines) — `Ledger` of typed `Observation`s (append-only history), `ObsKind`,
    `ContextBudget { max_tokens: 24_000, share: 0.5 }` with `effective_tokens` (min of the ceiling and
    the share of the unspent budget, floored at 2_000), `estimate_tokens` (chars/4, marked `ponytail:`
    as an estimate with a tokenizer as the upgrade path), `entry_cap_chars` (an eighth of the budget),
    `bound` (visible elision marker, head kept except for a read where the tail is), and `assemble`.'
  - 'src/run.rs — the workspace loop''s `observations: String` is gone; it pushes typed observations and
    calls `assemble` once per turn. `dispatch` carries the kind and target with each result and takes
    the derived cap.'
  - src/state.rs — additive `context_events` table and `ContextEvent`/`record_context_event`/`record_context_reported`/`context_events`.
    One `assembled` row per turn carrying the estimate and the provider's reported number for the same
    request, plus one row per re-read. `CHECKPOINT_FORMAT` untouched.
  - 'src/contract.rs — `pub context: ContextBudget` and `with_context_budget`, beside `with_token_budget`.'
  - 'F1 green — `the_assembled_prompt_stays_inside_the_ceiling_while_the_trace_keeps_everything`: the
    assembled section stays within the ceiling while the trace rows still concatenate to every observation
    in full.'
  - 'F2 green — `prompt_size_stabilises_across_many_turns_instead_of_tracking_step_count`: the log grows
    more than 2x while the assembled section grows less than 1.5x.'
  - NF2 — no new runtime dependency; `[dependencies]` is byte-identical to 0.9.1. NF3 — `assembling_one_turn_costs_a_bounded_amount_of_time`
    bounds per-turn assembly over a 200-entry log at 25 ms.
  - NF7 — src/run.rs still has no unit tests, but the assembler is unit-tested at its own boundary in
    src/context.rs (11 unit tests) rather than only end to end.
- id: US-IO-HARNESS-0.10.0-T02
  summary: Compact superseded observations. Where two entries observe the same target, the later is carried
    whole and the earlier becomes a one-line stub naming what it was and which step superseded it.
  why_required: Re-sending two reads of the same file is the single largest source of the repetition this
    release exists to remove, and a stub the model can see is what keeps compaction recoverable rather
    than lossy.
  status: done
  depends_on:
  - US-IO-HARNESS-0.10.0-T01
  acceptance_criteria:
  - 'F3 — a superseded observation is compacted, not duplicated. Two observations of the same target in
    one run yield an assembled prompt containing the later text once and a stub for the earlier that names
    it and the superseding step. Asserted on the assembled prompt, not on an internal counter.

    '
  files:
  - src/context.rs
  - tests/context.rs
  evidence:
  - 'Supersession: an entry is superseded when a later entry has the same kind and the same target; the
    later is carried whole and the earlier becomes a one-line stub naming the superseding step.'
  - Scoped by `ObsKind::target_is_the_subject` — true for read, grep, find, write and skill, false for
    a registered or MCP tool, whose target is its NAME. A tool called twice with different arguments gave
    two answers, and the first version of this stubbed one of them away.
  - F3 green — `a_read_superseded_by_a_later_read_of_the_same_path_becomes_a_stub` and `two_calls_to_one_tool_keep_both_answers_while_two_reads_of_a_path_collapse`,
    plus the unit test `only_a_target_that_is_the_subject_supersedes`.
- id: US-IO-HARNESS-0.10.0-T03
  summary: Re-read an observation invalidated by a later write. A read entry whose path is written later
    in the run is re-read at assembly time through the policy; if the path is gone or the read is refused,
    the entry becomes a stub naming the invalidating step and the reason, and the refusal is a trace row.
  why_required: An agent reasoning over content the workspace no longer has is the failure mode that makes
    a long run wrong rather than merely expensive, and it is the one thing bounding size alone cannot
    fix.
  status: done
  depends_on:
  - US-IO-HARNESS-0.10.0-T01
  acceptance_criteria:
  - 'F4 — an observation invalidated by a later write is never presented as current. Read path X (content
    A), write X (content B); the next assembled prompt contains B and does not contain A as a current
    read. If the re-read is refused by policy or the path is gone, the prompt carries a stub naming the
    invalidating step and the reason, and the refusal is a trace row.

    '
  files:
  - src/context.rs
  - src/run.rs
  - tests/context.rs
  evidence:
  - A read whose path a later write touches is stale. A stale read that would otherwise be carried is
    re-read at assembly time; a refusal, a missing path or a read error becomes a stub naming the invalidating
    step and the reason.
  - The re-read goes through `Workspace::read_file`, so it passes the same `resolve` containment and the
    same `Act::Read` policy check as the read it replaces. The first version joined the root and called
    `std::fs` directly — the policy half without the containment half.
  - '`Effect::Ask` is a refusal here: assembly has no approver and no turn to spend on one.'
  - F4 green — `a_read_invalidated_by_a_later_write_is_re_read_not_trusted`, the policy-refused variant
    asserting the stub text and a `reread_refused` row, and `a_re_read_cannot_escape_the_workspace_root`.
- id: US-IO-HARNESS-0.10.0-T04
  summary: Give every observation kind a coherent cap at context entry, derived from the same budget and
    expressed in one unit, replacing `TOOL_RESULT_CAP`, `OBS_READ_CAP` and `OBS_GREP_CAP` as independent
    constants and closing the two kinds that have no cap at all (`find`, `write_file`). Elision stays
    visible to the model; the trace row stays unbounded.
  why_required: An unbounded `find` over a large repository can exhaust the context in one step, which
    defeats the assembler before it runs; and four unrelated constants are how the two missing caps went
    unnoticed.
  status: done
  depends_on:
  - US-IO-HARNESS-0.10.0-T01
  acceptance_criteria:
  - 'F5 — every observation is bounded where it enters the context, including the two that are not bounded
    today. A `find` result with thousands of matches and a large `write_file` observation each produce
    a bounded, explicitly-elided context entry and a full, unelided trace row. A test asserts both sides
    for each observation kind — read, grep, find, write, skill body, registered tool, MCP tool, child
    result — so no kind is unbounded by omission again.

    '
  files:
  - src/context.rs
  - src/run.rs
  - src/tools/mod.rs
  - src/mcp.rs
  - tests/context.rs
  evidence:
  - '`TOOL_RESULT_CAP` (8_000), `OBS_READ_CAP` (4_000) and the bare per-tool bounds are gone. Every observation
    kind enters the context under `entry_cap_chars(budget)`; `cap_result` takes the cap as an argument,
    and `McpSession::call` takes it too, so the transport bound comes from the same budget.'
  - '`find` and `write_file` had no cap at all and now do. `OBS_GREP_CAP`''s 50-hit ceiling stays as what
    it always was — a relevance choice — with the char cap on top.'
  - F5 green — `every_observation_kind_is_bounded_where_it_enters_the_context` covers read, grep, find,
    write, skill body, registered tool and MCP tool, asserting the bound on the context entry and the
    full text in the trace row.
  - Closes the `// ponytail:` marker that stood at src/run.rs:38 since 0.9.0 — "fixed char caps; make
    them budget-aware if long files starve the loop".
- id: US-IO-HARNESS-0.10.0-T05
  summary: Route the sub-agent loop and the single-file loop through the same assembler, so a composed
    child result and a re-sent file body are bounded by the same rules as a tool result. The 0.7.0 resume
    and 0.5.0 composition suites run unmodified.
  why_required: The sub-agent loop has its own copy of the accumulator, so 0.5.0's hundred concurrent
    children keep the unbounded behaviour unless it is routed too; and resume rebuilds the prompt from
    the store, so an assembler the resume path does not use is an assembler that silently stops applying
    after a crash.
  status: done
  depends_on:
  - US-IO-HARNESS-0.10.0-T01
  - US-IO-HARNESS-0.10.0-T02
  - US-IO-HARNESS-0.10.0-T03
  - US-IO-HARNESS-0.10.0-T04
  acceptance_criteria:
  - 'F8 — the migration is invisible to a 0.9.1 consumer. A store written by 0.9.1 opens under 0.10.0,
    and a 0.9.1 checkpoint resumes to completion under 0.10.0 with no step re-run and no budget double-charge
    — the 0.7.0 crash-resume test suite passes unmodified against the new schema.

    '
  - 'NF6 — no regression in the existing suite. All ~258 tests shipped at 0.9.1 (~138 integration across
    `tests/`, ~120 unit) pass unmodified unless a test asserted the old accumulate-and-resend behaviour,
    and each such test that is changed is named in the record with why the old assertion was wrong. `tests/checkpoint.rs`
    and `tests/subagents.rs` in particular pass untouched, since they cover the two features that read
    the observation buffer indirectly.

    '
  files:
  - src/run.rs
  - src/context.rs
  - tests/checkpoint.rs
  - tests/subagents.rs
  evidence:
  - The sub-agent loop (`run_agent`) has its own ledger and its own per-turn assembly, with its ceiling
    taken from the tree's remaining budget rather than the contract alone. A child's composed result enters
    as `ObsKind::Child`.
  - The single-file loop re-sent the whole current file every turn with no bound; it is now bounded on
    the same terms, keeping the tail because the end of a file is what a writer needs.
  - '`OBS_READ_CAP` and the `tail` helper are both deleted — the last fixed cap in the crate was the tree
    loop''s.'
  - F8 / NF6 — tests/checkpoint.rs (10) and tests/subagents.rs (10) pass UNMODIFIED, so 0.7.0 resume and
    0.5.0 composition are unaffected. `a_sub_agent_loops_prompt_stays_inside_the_ceiling` asserts the
    tree loop's own ceiling and that its trace still holds the whole log.
  - 'Only one pre-existing test changed anywhere in the release: src/mcp.rs''s `an_oversized_result_is_cut_on_a_char_boundary_and_says_so`
    read the cap from the deleted constant and now derives the same number from the budget. What it asserts
    is unchanged.'
- id: US-IO-HARNESS-0.10.0-T06
  summary: 'Add durable memory to the store: workspace-keyed tables created idempotently in `Store::from_conn`
    with `CHECKPOINT_FORMAT` untouched, a public API to put, list, read and delete entries, attribution
    to the writing run and step, and count and total-size caps with oldest-first eviction recorded in
    the trace.'
  why_required: 'Memory is the second pillar this release closes, and it is the half that must not disturb
    the first: a schema change that broke `check_resumable` would trade 0.7.0''s durability for a feature
    that never needed it.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.10.0-T01
  acceptance_criteria:
  - 'F7 — memory is attributed, bounded and operator-controlled. Every entry names the run and step that
    wrote it; the count and total size caps evict by the documented rule when exceeded; and the public
    API lists, reads and deletes entries for a workspace. A test asserts eviction happens and that a deleted
    entry does not reappear in a later run''s context.

    '
  - 'F8 — the migration is invisible to a 0.9.1 consumer. A store written by 0.9.1 opens under 0.10.0,
    and a 0.9.1 checkpoint resumes to completion under 0.10.0 with no step re-run and no budget double-charge
    — the 0.7.0 crash-resume test suite passes unmodified against the new schema.

    '
  files:
  - src/state.rs
  - src/lib.rs
  - tests/memory.rs
  evidence:
  - src/state.rs — `memory` table (workspace, key, value, run_id, step, created_at; UNIQUE(workspace,
    key)) created idempotently in `Store::from_conn` beside the other nine. `MemoryEntry`, `MEMORY_MAX_ENTRIES`
    = 64, `MEMORY_MAX_CHARS` = 16_000, `MEMORY_MAX_ENTRY_CHARS` = 2_000.
  - '`memory_put` upserts and re-attributes, truncates an oversized value with a visible marker rather
    than refusing it, then evicts oldest-first until both caps hold, never evicting the entry just written,
    and returns the evicted keys for the caller to record.'
  - '`memory_list` / `memory_get` / `memory_delete` / `memory_clear` are the operator''s surface; `run_id`
    is `i64` like every other table, matching `runs.id`.'
  - F7 green — 7 store tests in tests/memory.rs and 4 unit tests in src/state.rs covering both caps, oldest-first
    eviction, the never-evict-the-new-entry rule, isolation, overwrite, delete and clear.
  - 'F8 green — `a_0_9_1_store_opens_unchanged_and_still_resumes`: a 0.9.1-shaped database (memory table
    dropped) reopens with `PRAGMA user_version` byte-identical, `check_resumable` accepting it, and all
    nine pre-existing tables intact. `CHECKPOINT_FORMAT` is still 7.'
- id: US-IO-HARNESS-0.10.0-T07
  summary: Give the agent the `remember` tool and recall its entries. A written fact is attributed and
    stored against the workspace; a later run over that workspace receives the entries in its assembled
    context, rendered as agent-authored notes rather than instructions.
  why_required: 'Without the tool and the recall path, memory is a table nothing writes to and nothing
    reads: this is the task that makes the second run cheaper than the first, which is the outcome the
    release promises.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.10.0-T06
  acceptance_criteria:
  - 'F6 — durable memory survives a run. An agent writes a fact in run 1; run 2 over the same workspace
    with a different `run_id` receives it in its assembled context. Asserted end to end across two real
    runs against a fixture provider, and the second run''s trace shows the tool calls that established
    the fact were not re-executed.

    '
  files:
  - src/tools/mod.rs
  - src/run.rs
  - src/context.rs
  - tests/memory.rs
  evidence:
  - A built-in `remember` tool (`REMEMBER_TOOL`) with `{key, value}`, offered in the workspace tool list
    and added to `RESERVED_TOOL_NAMES` so a registered tool cannot shadow it. It writes to the harness
    store, not the workspace, so it is not a path act.
  - Dispatch records one `memory_write` row and one `memory_evict` row per evicted key. The observation
    is `[remember <key>]` with no target, because a note is not an observation OF anything that could
    go stale.
  - 'Recall: `assemble` opens with the workspace''s notes, capped at a quarter of the turn''s ceiling,
    newest kept, the number dropped stated, and one `memory_recall` row per turn. Notes are re-read every
    turn rather than once at run start, so a note written this run — or cleared by the operator — is reflected
    immediately.'
  - The workspace key is the canonicalised root (the given path as fallback), in one function so writer
    and reader cannot disagree. Children share their parent's workspace and therefore its memory.
  - 'F6 green — `a_second_run_over_the_workspace_recalls_what_the_first_wrote`: two runs, different run
    ids, the second opens with the note, the block says "not instructions", the note names the run that
    wrote it, and the second run''s trace shows it did not re-run the `remember` call. Plus `a_deleted_note_does_not_come_back_in_a_later_run`,
    `two_workspaces_do_not_share_memory_through_one_store`, `an_over_long_memory_block_is_cut_with_a_marker`,
    and an empty memory rendering no block at all.'
- id: US-IO-HARNESS-0.10.0-T08
  summary: Document what assembly guarantees and what it does not, what memory is and how to inspect or
    clear it, mark the two pillars in `docs/CAPABILITIES.md`, and write the CHANGELOG entry with a migration
    note for every added, renamed or removed public item plus the recorded public-surface diff against
    the 0.9.1 tag.
  why_required: 0.8.1 exists because a guarantee io-cli and io-studio inferred was one this crate had
    never made; an assembler that decides what a model sees is exactly the kind of thing a consumer will
    infer relevance from.
  status: done
  depends_on:
  - US-IO-HARNESS-0.10.0-T01
  - US-IO-HARNESS-0.10.0-T02
  - US-IO-HARNESS-0.10.0-T03
  - US-IO-HARNESS-0.10.0-T04
  - US-IO-HARNESS-0.10.0-T05
  - US-IO-HARNESS-0.10.0-T06
  - US-IO-HARNESS-0.10.0-T07
  acceptance_criteria:
  - 'NF5 — a public API change is permitted (0.x minor) but must be deliberate and documented: every added,
    renamed or removed public item is listed in the CHANGELOG with a migration note, and the diff of the
    public surface against the 0.9.1 tag is recorded in the evidence. The crate stays pre-1.0; no 1.0.0
    is planned or implied.

    '
  - 'O1 — the crate documents what context assembly does and does not guarantee, including the staleness
    rules it applies and the relevance it does not promise, so io-cli and io-studio do not inherit an
    unmade guarantee.

    '
  - 'O2 — `docs/CAPABILITIES.md` marks context construction and state-and-memory shipped at 0.10.0, and
    marks nothing this release did not accept. If the fallback scope is taken, state and memory stays
    partial with the deferred release named.

    '
  - 'O3 — memory is documented as agent-authored, attributed content that a later run reads. The documentation
    states plainly that an entry written by one run influences a later one, how to inspect and clear entries,
    and that entries are rendered to the model as notes rather than as instructions.

    '
  files:
  - src/context.rs
  - src/lib.rs
  - README.md
  - CHANGELOG.md
  - docs/CAPABILITIES.md
  evidence:
  - 'README gains a `## Context and memory (v0.10)` section with a worked `with_context_budget` example,
    the operator''s memory API, and a `### The limits, stated plainly` subsection: assembly bounds size
    and applies the two staleness rules, it does not promise the model sees everything relevant; the token
    figure is an estimate with its drift recorded; memory entries are agent-authored notes a later run
    reads, inspectable and clearable. O1 and O3.'
  - docs/CAPABILITIES.md marks context construction and state-and-memory shipped at 0.10.0 and nothing
    else; the status line now reads ten of twelve pillars with 0.11.0 and 0.12.0 named for the rest. O2.
  - 'CHANGELOG 0.10.0 section in the required Keep-a-Changelog categories, leading with the breaking change:
    `TaskContract` gained a public `context` field, which affects only a struct-literal caller, with the
    fix stated. NF5.'
  - 'NF5 evidence — `git diff origin/main -- src/ | grep -E ''^-\s*pub ''` is EMPTY: no public item was
    removed or renamed. The additions are the `context` module''s items, `ContextEvent`, `MemoryEntry`,
    the three memory caps, `Store`''s five memory methods and three context methods, and `TaskContract::context`
    / `with_context_budget`.'
