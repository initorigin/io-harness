product: io-harness
version: 0.30.0
tasks:
- id: US-IO-HARNESS-0.30.0-T01
  summary: >
    Pin a 0.29.0 fixture generator and record its output, before any schema change: a
    known-composition aggregates store, a resumable interrupted tree, and a `read` mode the
    reverse-direction check execs.
  why_required: >
    The release's one ordering risk. If the generator is built after the schema moves, the
    cross-version evidence measures this tree against itself and passes for the wrong reason. It is
    the first commit of the release for that reason alone.
  status: done
  depends_on: []
  acceptance_criteria:
  - >
    **F8 — cross-version compatibility, both directions.** A database written by a real 0.29.0 build
    opens, resumes and replays under 0.30.0 with nothing to migrate; and a 0.30.0 store is read by a
    0.29.0 build, which never queries the new table. Proven with a pinned 0.29.0 fixture generator,
    the way `tests/cross_version.rs` already proves it for the 0.22.0 boundary — never with a
    database this tree wrote and labelled.
  files:
  - tests/fixtures/gen-0.29.0/Cargo.toml
  - tests/fixtures/gen-0.29.0/Cargo.lock
  - tests/fixtures/gen-0.29.0/src/main.rs
  - tests/fixtures/store-0.29.0
  - .gitattributes
  - Cargo.toml
  evidence:
  - >
    `tests/fixtures/gen-0.29.0` resolves `io-harness =0.29.0` from crates.io and builds clean. It is
    the previous release compiling, not this tree: it failed first against
    `TaskContract::workspace(goal, root, verify)` and against `io_harness::state::{..}`, because
    0.29.0 takes two arguments there and re-exports those types at the crate root. Both are facts
    about 0.29.0's API that the current tree could not have told me.
  - >
    `gen-0-29-0 write ../store-0.29.0` produced `aggregates.sqlite3` (six finished runs — four
    successes of which two have no gate failure, one step cap, one stall; gate phases 2 test-run /
    1 criterion-compile / 1 compile; 3 fallbacks, 2 replans, 2 resumes; three memory entries) and
    `interrupted.sqlite3` with its workspace (root stopped at the step cap, child 2 finished having
    written `a.txt` = ALPHA, child 3 out of steps with `b.txt` = DRAFT, tree spend 400 tokens).
  - >
    Each sidecar carries `composition` — the literals this generator chose, which is where F7's
    expectations come from — beside `read_back`, which is what 0.29.0's own API returned from the
    finished store and is what the forwards half of F8 compares against.
  - >
    A defect found and fixed while committing: `.gitattributes` matched `tests/fixtures/**` as
    `text eol=lf`, so `git add` rewrote `0D 0A` to `0A` inside a database file. Both new fixtures
    tripped it. `tests/fixtures/**/*.sqlite3 binary` now overrides it, and the staged blobs are
    byte-identical to the working files (155,648 = 155,648 for both). The 0.22.0 fixtures survived
    only because no page of theirs contained that byte pair.

- id: US-IO-HARNESS-0.30.0-T02
  summary: >
    Per-key configuration provenance: an `Origin` recorded for every leaf key as each scope is
    merged, surviving substitution and the `[profile.<name>]` overlay, read back by
    `Config::origin` and `Config::origins`.
  why_required: >
    Without it the release does not answer the first of the three questions, and it is the only one
    of the three whose absence makes a settings screen actively misleading rather than merely
    absent.
  status: done
  depends_on:
  - US-IO-HARNESS-0.30.0-T01
  acceptance_criteria:
  - >
    **F1 — provenance across four scopes.** A fixture setting the same key in defaults, user,
    project and local resolves to the local value and reports the local scope and that file's path.
    Removing the local file makes it report project, and so on down. Asserted at each of the four
    steps, so the test discriminates between "reports the last scope" and "reports the deciding
    scope" — which are the same answer only when the key is set everywhere.
  - >
    **F2 — provenance through substitution.** A key whose value came from `${env:}` reports the file
    the substitution was written in, not the environment variable and not the process environment.
    A key whose value came from `${cmd:}` does the same. The negative control is the same key
    written literally, which must report the identical origin — if it does not, the implementation
    is reporting the mechanism rather than the source.
  - >
    **F3 — a project scope that narrowed a user's setting is visible.** The case 0.27.0's trust rule
    creates: a boundary set in the user scope and narrowed in the project scope resolves to the
    project value and reports the project file. This is the specific question the whole feature
    exists to answer and it gets its own named test.
  files:
  - src/config.rs
  - tests/config.rs
  evidence:
  - >
    `Origin { scope, path }` and a `BTreeMap<String, Vec<Origin>>` on `Config`, filled by
    `record_origins` walking each scope's own table *before* `merge` folds it into everything read
    so far — after the merge there is nothing left to say which file a key came from. The walk
    mirrors `merge`'s own notion of a leaf (a table recurses, anything else is a leaf), so the two
    cannot disagree about what a key is.
  - >
    F1 — `origin_reports_the_deciding_scope_at_every_step_down` walks the same four steps
    `f1_the_four_scopes_merge_in_order` walks, asserting the origin at each: local, then project,
    then user, then empty. Taken at every step because "the last scope read" and "the deciding
    scope" agree only while the key is set everywhere.
    `origin_of_a_key_only_one_file_sets_is_that_file_not_the_last_one_read` is the sharper half: a
    later file exists and names something else, and an implementation reporting the last file read
    answers wrong.
  - >
    F2 — `origin_of_a_substituted_value_is_the_file_it_was_written_in` runs `${env:}`, `${cmd:}` and
    the same key written literally through the same file and asserts all three report an identical
    `Origin`. It needed no implementation work, and that is the finding worth keeping: `parse`
    substitutes per file before anything merges, so a substituted value's origin is the declaring
    file by construction. `${cmd:}` is written in the local scope because the project scope refuses
    it — 0.27.0's rule, unchanged.
  - >
    F3 — `origin_shows_the_project_file_that_narrowed_a_user_setting` sets `policy.defaults.exec` to
    allow in the user scope and deny in the project scope, and asserts both that the origin is the
    project file and that `Policy::check` still returns `Deny`: the origin describes the resolution,
    it does not alter it.
  - >
    Two cases the criteria did not name and the implementation had to decide. `policy.layers` and
    `agent` append across scopes, so `origin` returns *every* contributing file in order rather than
    inventing a winner — `origin_of_an_appending_key_lists_every_file_that_contributed`. And
    `with_profile` moves each `profile.<name>.<key>` origin onto the key it now decides and drops
    the `profile.` entries, since the returned configuration carries no `[profile]` section —
    `origin_after_a_profile_overlay_names_the_file_the_profile_came_from`.
  - >
    The open question in the contract — provenance on demand or a map built once — is decided as a
    map built at load, because the known consumer renders a whole settings list and a per-key walk
    would re-read the tables once per row. `Config::origin(key)` and `Config::origins()` are both
    lookups into it.
  - >
    `cargo test --test config origin_` 6 passed, 0 failed. `cargo test --doc config::` 24 passed, 0
    failed, which includes the two new worked examples. `Config::from_toml` records nothing, exactly
    as `sources()` returns nothing there: parsed text has no file behind it, and naming `io.toml`
    for it would name a file that was never read.

- id: US-IO-HARNESS-0.30.0-T03
  summary: >
    `MemoryEntry` gains a `#[non_exhaustive]` kind and a pinned flag, with a pinned entry refusing an
    overwrite by a run and the refusal recorded as an observable event.
  why_required: >
    The second question. A human who cannot correct what the agent has learned, and cannot make the
    correction stick, has a memory they can only read.
  status: done
  depends_on:
  - US-IO-HARNESS-0.30.0-T01
  acceptance_criteria:
  - >
    **F4 — kinds round-trip.** A decision written and read back is a decision; a fact is a fact. The
    enum is `#[non_exhaustive]`, and a test asserts an exhaustive census of its variants against the
    source the way `EVENT_NAMES` is asserted against `EventKind` — the 0.28.0 lesson that a match
    arm proves exhaustiveness and a hand-written list does not.
  - >
    **F5 — a pinned entry survives a run that tries to overwrite it.** After the run, the value is
    the pinned one, and the attempt is in the trace as an observable event. Both halves are
    asserted: a silent refusal would leave the agent believing it had corrected something.
  files:
  - src/state.rs
  - src/run.rs
  - src/lib.rs
  - tests/memory.rs
  evidence:
  - >
    `MemoryKind` (`#[non_exhaustive]`, `Fact` by default), `MemoryEntry::kind` and
    `MemoryEntry::pinned`, `MemoryWrite`, `Store::memory_write` and `Store::memory_pin`. Two
    nullable columns on `memory` rather than a rewrite: `NULL` kind reads as `Fact` and `NULL`
    pinned as false, which is what every pre-0.30.0 entry actually was. `memory_put` is now a
    wrapper over `memory_write` with the kind fixed to `Fact`, so its signature and behaviour are
    unchanged and there is one write path rather than two that can drift.
  - >
    The guard is `WHERE memory.pinned IS NOT 1` inside the upsert, not a read-then-write in the
    caller, so two writers on one store cannot interleave between the check and the write. `IS NOT`
    rather than `!=` is load-bearing: `NULL != 1` is `NULL`, which SQLite reads as false, and that
    comparison would have refused every entry written before this release.
  - >
    F4 — `state::tests::memory_kind_names_is_a_census_of_the_enum_rather_than_a_list_someone_maintained`
    parses `pub enum MemoryKind` out of `src/state.rs` (CRLF normalised first, the 0.28.0 Windows
    lesson) and asserts the variants equal the list `from_stored` reads back, then round-trips each
    one through a real store. A variant added without a `from_stored` arm would round-trip to `Fact`
    silently, which is the 0.25.0 `every_kind()` defect in a different table.
  - >
    F5 — `a_pinned_entry_survives_a_run_that_tries_to_overwrite_it` runs the real loop with a
    scripted `remember` call against a pinned entry: the value is still the operator's, the kind is
    still `Decision`, `memory_refused` is in the trace and `memory_write` is not. Its control,
    `the_same_write_lands_when_the_entry_is_not_pinned`, runs the identical script against an
    unpinned entry and asserts the write lands — without it the first test passes against an
    implementation that refuses everything.
  - >
    The refusal also reaches the model as an observation rather than only the trace, so the agent
    learns its correction did not take. It is a `ContextEvent` kind rather than a new `EventKind`
    variant, because the question it answers — did my pin hold — is asked after the run by somebody
    reading the store, and the contract's observability note says this release adds no event kind.
  - >
    A pinned entry is also exempt from cap eviction, which the criteria did not name and the feature
    requires: a correction that survives an overwrite and then disappears because the agent wrote
    twenty notes afterwards has not survived. It still counts towards the caps, so pinning
    everything fails loudly instead of quietly raising the ceiling.

- id: US-IO-HARNESS-0.30.0-T04
  summary: >
    The per-run recall record: a new table, a write at recall time, and an accessor answering which
    entries a given run actually drew on.
  why_required: >
    "What does the agent know" and "what did this run use" are different questions, and only the
    second tells a reader whether a memory entry was load-bearing.
  status: done
  depends_on:
  - US-IO-HARNESS-0.30.0-T03
  acceptance_criteria:
  - >
    **F6 — the recall record names the run.** A run that recalls three of six entries produces a
    record naming those three and that run, and a second run over the same workspace produces its
    own record without disturbing the first.
  files:
  - src/state.rs
  - src/context.rs
  - tests/memory.rs
  evidence:
  - >
    A `memory_recalls` table indexed on `run_id`, `Store::record_memory_recall` (crate-internal, so
    only the assembler writes it) and `Store::memory_recalls` with a `MemoryRecall` row. One row per
    key per recall rather than a flag on the entry: an entry recalled by two runs is two facts, and
    a flag keeps only the later one.
  - >
    `render_notes` now returns the keys it kept rather than a count, `Assembled` gains
    `recalled_keys`, and both run loops — single-workspace and tree — record the recall for their
    own run. `Assembled` already derives `Default`, which is the type shape the contract's migration
    note names as safe to add a field to; `Assembly` was deliberately left alone, since it has no
    `Default` and a new field there would break a struct literal.
  - >
    F6 — `the_recall_record_names_which_entries_a_run_actually_used` writes six entries where the
    three oldest are each `MEMORY_MAX_ENTRY_CHARS` long, runs with a 2,000-token prompt ceiling, and
    asserts the record names exactly `small-0..2` for that run. "Three of six" is a property of the
    sizes and the newest-first fit rule, not of a token estimate the test would otherwise be pinned
    to. A second run over the same workspace produces its own identical record with the first
    untouched, and a run id that never existed recalls nothing.
  - >
    First attempt failed for the right reason: with the default 24,000-token budget every note fit
    and the assertion read six of six. The fix was to shrink the contract's context budget, not to
    weaken the assertion.

- id: US-IO-HARNESS-0.30.0-T05
  summary: >
    Outcome, gate and recovery aggregates on `Store`, in the shape `src/pricing.rs` established:
    grouped rows out, no rendering, and no accessor for a number the trace cannot answer honestly.
  why_required: >
    The third question, and the one every consumer currently re-derives from raw rows — which is the
    duplication the 0.18.0 cost grouping exists to prevent.
  status: done
  depends_on:
  - US-IO-HARNESS-0.30.0-T01
  acceptance_criteria:
  - >
    **F7 — the aggregates are right against a known trace.** A fixture store built with a known
    composition — a fixed number of runs, a known number of first-try passes, a known distribution
    of gate failures, and a known count of fallbacks, replans and resumes — produces exactly those
    numbers. The expected values come from the fixture's construction, never from running the
    accessor and recording what it said.
  - >
    **N2 — the aggregates do not scale with the trace.** Each is one indexed query, not a table
    scan the caller pays for on every render. Measured against a store with a large trace and the
    number recorded; the point is that a panel refreshing does not get slower as history grows.
  files:
  - src/state.rs
  - src/lib.rs
  - tests/accounting.rs
  evidence:
  - >
    Five accessors and three row types: `runs_by_outcome`, `runs_by_day`, `gate_failures_by_phase`
    (all returning `Tally`), `first_try` (`FirstTry`) and `recovery` (`Recovery`). Each is one SQL
    `GROUP BY` or count — unlike the 0.18.0 spend groupings, which read every call row into Rust
    because the price table is a Rust value the SQL cannot see. Rows out, no rendering, no rate.
  - >
    Two things are deliberately NOT shipped, which is the honest half of the task. `first_try`
    returns three counts and no rate, because *first_try / succeeded* and *first_try / runs* are
    both legitimate and picking one silently would decide for the caller. And `Recovery` has no
    escalation count: nothing records an escalation as an event, and an escalation is the opposite
    of a rescue anyway — the contract's open question is answered "its own row, and not until
    something records it".
  - >
    F7 — `f7_the_aggregates_are_right_against_a_known_composition` reads the committed 0.29.0
    fixture, on a copy, and asserts every accessor against the `composition` literals in its
    sidecar. The fixture is built so runs (6), succeeded (4) and first_try (2) all differ, and the
    test asserts they differ: with any two equal it would pass against an accessor that confused
    them. `the_aggregates_over_an_empty_store_are_empty_rather_than_absent` is the other end — zero
    rows and zeroed counts, not an error and not a plausible number.
  - >
    N2 — `state::tests::every_aggregate_reaches_its_rows_through_an_index` asserts the *query plan*
    of all seven statements names an index, with a control that must NOT (a `COUNT(*)` over
    `runs.goal`, which has no index) so the check can be seen answering no. A wall-clock assertion
    was rejected on purpose: it is flaky on a loaded runner and it passes on a fast machine running
    a full scan. Five indexes were added — `run_outcomes (outcome)`, `run_outcomes (finished_at)`,
    `sandbox_events (kind, detail)`, `sandbox_events (run_id, kind)`, `context_events (kind)`,
    `checkpoint_events (kind)` — created after every table, since the first attempt declared them
    beside the memory table and named `run_outcomes` before it existed.
  - >
    N2's measurement, recorded rather than asserted. Store built in memory, macOS, debug build.
    At 1,000 finished runs: runs_by_outcome 325µs, gate_failures_by_phase 135µs, first_try 353µs,
    recovery 79µs. At 20,000 runs: 1.81ms, 2.47ms, 7.64ms, 1.19ms.
  - >
    **N2's wording over-claims and the measurement is what shows it.** "The aggregates do not scale
    with the trace" is not achievable for an aggregate over full history — counting every row is
    what the answer *is*, so the cost is linear in rows no matter which index serves it. Twenty
    times the runs cost roughly five times (runs_by_outcome) to twenty times (first_try) as long.
    What IS true, and is what the criterion's own second sentence asks for, is that each is one
    indexed query rather than a table scan, at roughly 90–380ns per run. Raising it for the owner
    rather than quietly reading the criterion as satisfied; making it literally true would need
    materialised counters, which is a different release.
  - >
    One optimisation attempt was measured and reverted: rewriting `first_try`'s correlated
    `NOT EXISTS` as a LEFT JOIN onto a `DISTINCT` subquery made it **25 seconds** at 20,000 runs
    against 7.6ms, because the subquery materialises without an index and every outcome row then
    probes it linearly. The comment beside the query records the number so nobody re-proposes it.
  - >
    `gate_failures_by_phase` groups on `detail` directly rather than on a `COALESCE` of it — a
    function in the GROUP BY makes the (kind, detail) index unusable and SQLite falls back to a scan
    plus a temp B-tree, which the plan test caught. The NULL is handled in `tally`, where it costs
    nothing, as the key `(none)`.

- id: US-IO-HARNESS-0.30.0-T06
  summary: >
    The cross-version test over the committed 0.29.0 fixtures — read-back, resume, and the reverse
    direction where a 0.29.0 binary reads a store this tree wrote — plus the CI job that runs it.
  why_required: >
    Without it the additive-migration claim is an assertion. Both directions have to be executed by
    the release that makes the claim, and one of them can only be executed by the previous binary.
  status: done
  depends_on:
  - US-IO-HARNESS-0.30.0-T04
  - US-IO-HARNESS-0.30.0-T05
  acceptance_criteria:
  - >
    **F8 — cross-version compatibility, both directions.** A database written by a real 0.29.0 build
    opens, resumes and replays under 0.30.0 with nothing to migrate; and a 0.30.0 store is read by a
    0.29.0 build, which never queries the new table. Proven with a pinned 0.29.0 fixture generator,
    the way `tests/cross_version.rs` already proves it for the 0.22.0 boundary — never with a
    database this tree wrote and labelled.
  files:
  - tests/cross_version_0_29_0.rs
  - .github/workflows/ci.yml
  evidence:
  - >
    F8 forwards — `a_0_29_0_store_reads_back_identically_under_0_30_0` opens a copy of the
    0.29.0-written `aggregates.sqlite3` and asserts every memory entry, run summary, gate event and
    context event against the sidecar's `read_back`, which is what 0.29.0's own API returned. The
    two new fields arrive at their documented defaults — every entry is `MemoryKind::Fact` and
    unpinned, which is what those entries actually were — and `PRAGMA user_version` on the file is
    still 7, so no format bump slipped in.
  - >
    F8 forwards, the half rows cannot cover — `a_0_29_0_tree_resumes_under_0_30_0` resumes the tree
    0.29.0 stopped at its step cap and drives it to verified success. No run in the tree gains a
    duplicate step number, the child that had already finished gains neither a step nor a token, the
    tree total is exactly what 0.29.0 drew plus what this release drew, and `a.txt` still holds one
    `ALPHA`.
  - >
    F8 backwards — `a_0_30_0_store_is_read_by_a_0_29_0_binary` writes a store using every 0.30.0
    surface (a pinned decision, a plain fact, a finished run) and then execs the pinned 0.29.0
    binary's `read` mode over it. Ran locally: exit 0, `"reader": "io-harness 0.29.0"`, both keys and
    both values read back, attribution intact. What it does not see is the kind and the pinned flag,
    which is the point — those are columns its queries never name.
  - >
    That test is `#[ignore]` by default, because it needs `tests/fixtures/gen-0.29.0` built and a
    test that silently passes when its subject is missing is worse than one visibly not run. CI's
    new `cross-version-0.29.0` job builds the generator and runs it with `-- --ignored --exact`.
  - >
    The job carries a control of its own: it greps `tests/fixtures/gen-0.29.0/Cargo.toml` for
    `io-harness = "=0.29.0"` and fails if the pin has drifted. That is the one way this job could
    quietly stop proving anything — an "older binary" that is not older — and the failure would
    otherwise be silent by construction. Same instinct as the `links-consumer` job's negative
    control.
  - >
    `cargo test --test cross_version_0_29_0` 2 passed, 1 ignored; with `-- --ignored`, 1 passed.
    The CI file parses and its job list is test, msrv, lint, links-consumer, cross-version-0.29.0,
    docs.

- id: US-IO-HARNESS-0.30.0-T07
  summary: >
    Documentation: the three guide pages, `docs/CONTRACT.md`, `CHANGELOG.md`, `docs/public-api.txt`,
    the version bump, and a worked example on every added public item.
  why_required: >
    A capability documented only in rustdoc is a capability only a reader who already knows it exists
    will find, and the public-surface snapshot is enforced by a test rather than by habit.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.30.0-T02
  - US-IO-HARNESS-0.30.0-T04
  - US-IO-HARNESS-0.30.0-T05
  acceptance_criteria:
  - >
    **N3 — nothing breaks.** No public item is renamed or removed, no signature changes, no default
    changes. `docs/public-api.txt` gains lines and loses none, and the changelog carries no
    `**BREAKING` entry. If one becomes necessary the release is wrong, not the rule.
  - >
    **N4 — every added public item carries a worked example**, enforced by the existing test that
    enumerates the surface re-exported from `lib.rs` and fails on any item whose docs carry no
    fenced example.
  files:
  - docs/guide/configuration.md
  - docs/guide/context-and-memory.md
  - docs/guide/accounting.md
  - docs/CONTRACT.md
  - docs/public-api.txt
  - CHANGELOG.md
  - Cargo.toml
  evidence: []

- id: US-IO-HARNESS-0.30.0-T08
  summary: >
    The release gates: `cargo fmt --check`, clippy `-D warnings`, the three test invocations,
    `cargo tree` unchanged, `cargo package --locked`, and the three-OS matrix green on the commit
    being released.
  why_required: >
    Every one of these is a refusal `release.yml` performs anyway; failing them here costs a re-run,
    failing them there costs a release.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.30.0-T06
  - US-IO-HARNESS-0.30.0-T07
  acceptance_criteria:
  - >
    **N1 — no new dependency.** `cargo tree` on macOS and Linux is unchanged. This release is three
    accessors, two fields and a table; anything it needs is already here.
  - >
    **O1 — the three-OS matrix is green** on the commit being released, including the MSRV job.
  - >
    **O2 — docs.rs builds.** Checked by the nightly job, because a stable `cargo doc` passing is not
    evidence that docs.rs does — the 0.16.2 lesson, which cost two releases without a rendered page.
  - >
    **O3 — `cargo package --locked` succeeds**, and the packaged crate's tests compile.
  files:
  - .ultraship/evidence/0.30.0
  evidence: []
