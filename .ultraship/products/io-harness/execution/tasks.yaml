product: io-harness
version: 0.39.0
tasks:
- id: US-IO-HARNESS-0.39.0-T01
  summary: >
    Extract the three session rules the flat loop inlines — the conversation seed, the first-step
    classification, and the steer drain — into crate-internal helpers, and have
    `run_workspace_from` reach each through a call. No behaviour change, no new caller yet.
  why_required: >
    The release adds these same rules to a second loop. Adding them by copying is the defect N4
    exists to catch, and it is invisible to every functional criterion: the release works, and the
    next reword of a session rule applies to half the callers. The extraction has to land before the
    tree loop calls anything, so the flat loop's own suites are the proof that it changed nothing.
  status: done
  depends_on: []
  acceptance_criteria:
  - >
    **N4 — the two loops do not drift, proven by a source-reading test with a splice-in control.**
    Each session rule — seeding, classification, steering — exists in exactly one crate-internal
    helper, and both `run_workspace_from` and `run_agent` reach it through a call rather than a copy.
    The test asserts the helper is named once per rule and called from both loops; the splice-in
    control (a second copy of the rule added to one loop) must fail it, which is what stops the test
    being decorative — 0.33.0's fact 70 is the precedent for why a grep alone proves nothing.
  - >
    **N5 — the existing entry points are byte-unchanged in behaviour.** `run`, `run_with`,
    `run_with_observed`, `run_tree`, `run_tree_observed` and the five `Session::turn*` methods drive
    exactly the loop they drove in 0.38.0 with exactly the extras they drove it with. F1's negative
    control covers the spawn half; the full session, session_reply, session_steering and
    session_streaming suites passing unmodified covers the rest. No test in those four files is
    edited to accommodate this release.
  files:
  - src/run.rs
  evidence:
  - >
    The extraction landed as five crate-internal helpers in `src/run.rs` — `seed_conversation`,
    `open_turn_kind`, `conversational_opening`, `classify_first_completion` and `drain_steer` — and
    `run_workspace_from` now reaches each through a call rather than inlining it.
  - >
    N5, the four session suites run unmodified against the extracted loop, before the tree loop
    called anything: `cargo test --test session --test session_reply --test session_steering
    --test session_streaming` — **5 + 8 + 4 + 4 = 21 passed, 0 failed**. No test in those four files
    was edited at any point in this release.
  - >
    N4's own control, executed: sabotage **S5** added a second copy of the reply-typing rule
    (`set_turn_kind(run_id, TURN_KIND_REPLY)`) beside `seed_conversation` in the tree loop.
    `each_session_rule_is_one_helper_that_both_loops_call` FAILED with "`set_turn_kind(run_id,
    TURN_KIND_REPLY)` is written once, in its helper". Reverted; it passes on the shipped tree. A
    splice-in that fails is what makes the assertion more than a grep.

- id: US-IO-HARNESS-0.39.0-T02
  summary: >
    Thread `TurnExtras` into `run_agent` at depth 0 — seed, classification, steer drain and
    streaming, each through T01's helper — and prove every one of them is inert for a child.
  why_required: >
    This is the mechanism of the release: it is what makes a turn able to run the loop that owns the
    spawn tool while still being a turn. Without the depth-0 restriction a child would be seeded with
    the conversation, classified as a reply, and steerable by an operator it never spoke to.
  status: done
  depends_on:
  - US-IO-HARNESS-0.39.0-T01
  acceptance_criteria:
  - >
    **F6 — a contained turn still classifies, and a reply spawns nothing.** With
    `Verification::None`, a fixture provider whose first completion stops on text: the turn is
    `TurnKind::Reply`, `runs.turn_kind` is `reply` (`src/run.rs:996`), `EventKind::Answered` is
    emitted once, no `steps` row is written, no child is spawned and `Store::spawns` is empty.
    Sabotage: remove the classification call from the tree loop's first step, under which the turn
    becomes a `Run` and this named test fails. **The second arm:** the same contract carrying a
    `Verification` other than `None` does **not** classify and drives the loop, which is the 0.37.0
    rule (`src/session.rs:498`) holding on the new path.
  - >
    **F7 — the conversation is seeded once, at the root, and children do not see it.** A two-turn
    session whose second turn is contained: the root agent's first request contains the prior turn's
    prompt and reply as observations (`src/session.rs:567`), and the spawned child's first request
    contains neither, while containing its own goal. Asserted on the outbound requests rather than on
    stored rows — the 0.31.0 rule that a "not in the context" claim is made against what was sent.
  files:
  - src/run.rs
  evidence:
  - >
    `Tree` gained one field, `turn: Option<&TurnExtras>`, and one accessor, `Tree::extras(depth)`,
    returning the turn's extras at depth 0 and a `const NO_EXTRAS` at every other depth. The depth
    test lives in that one accessor rather than at the four use sites, so "a child is work, not
    conversation" cannot hold at three of them and lapse at the fourth. `run_tree_observed` now
    delegates to a crate-internal `run_tree_with_extras`, the tree-side counterpart of
    `run_with_extras`, which is also where a turn row is written for a contained turn.
  - >
    F6 executed: `a_contained_turn_that_answers_spawns_nothing` — a contained turn whose first
    completion stops on text is `TurnKind::Reply`, costs **one** completion, writes no `steps` row,
    spawns nothing, emits `Answered` exactly once, and its opening carries both the conversational
    sentence and the tree agent's own description (`spawn_agent` named in the system prompt).
    Sabotage **S1** removed the classification call from the tree loop: that named test FAILED, and
    so did N4's, the helper then having one call site. Reverted.
  - >
    F6's second arm: `a_contained_turn_with_a_criterion_does_not_classify` — a turn carrying a
    `Verification` is `TurnKind::Run` and its first request does **not** carry the conversational
    opening. The 0.37.0 rule holding on the new path.
  - >
    F7 executed: `the_conversation_reaches_the_root_and_not_the_children`, asserted on the outbound
    requests the mock provider was handed rather than on stored rows. The root's request carries the
    prior turn's prompt and its answer; the child's carries its own goal and neither of them.
    Sabotage **S2** removed the depth gate from `Tree::extras` so every agent read the turn's
    extras: that named test FAILED on "the child must not read the conversation". Reverted.

- id: US-IO-HARNESS-0.39.0-T03
  summary: >
    `Session::turn_contained` and `Session::turn_contained_observed`, with `Session::drive` gaining
    the branch that builds the `Tree` and calls `run_agent` at depth 0 — plus both worked doctests
    and the two hand-written lines in `docs/public-api.txt`.
  why_required: >
    These two methods are the release's entire public surface and the only way a caller reaches any
    of it. `drive` staying the single funnel is what keeps the turn row, the head move and the
    `Answered` event written once for all seven entry points.
  status: done
  depends_on:
  - US-IO-HARNESS-0.39.0-T02
  acceptance_criteria:
  - >
    **F1 — the contained turn is offered the spawn tool and the plain turn is not.** A recording
    provider captures the `ToolSpec` list of the first completion. `Session::turn_contained` on a
    contract with a workspace root: the list contains `spawn_agent` (`SPAWN_TOOL`,
    `src/run.rs:109`). **The negative control, on the same contract, the same policy and the same
    store:** `Session::turn`, `Session::turn_observed`, `Session::turn_steered`,
    `Session::turn_bounded` and `Session::turn_bounded_observed` each produce a list that does not
    contain it. This pair is the release; an implementation that offered the tool from `drive`
    unconditionally passes the first half and fails the second, and that failure is a session
    silently gaining the ability to spawn.
  - >
    **F5 — the turn is still one turn.** After a contained turn that spawned three children:
    `Store::session_turns` returns exactly **one** row for the session; `Session::head` names it;
    `Session::history` renders one entry; `Store::turn_for_run(TurnResult::run_id)` returns that
    turn id; and `Store::turn_for_run(child_run_id)` returns `None` for every child. The last two
    assertions are the ones that fail an implementation that recorded a turn per agent.
  - >
    **N2 — zero breaks, and the assertion is the diff of `docs/public-api.txt`.** The file gains
    exactly two lines — `Session::turn_contained` and `Session::turn_contained_observed` — and loses
    none. No existing signature moves, no type gains a field, no type gains `#[non_exhaustive]`,
    `TurnResult` is untouched, and `tests/changelog.rs` finds no `**BREAKING` entry for this version.
    If the implementation needs a field on `TurnResult`, `TaskContract` or `Containment` to work, the
    design is wrong for this release.
  files:
  - src/session.rs
  - src/run.rs
  - docs/public-api.txt
  evidence:
  - >
    F1 executed, both halves. `a_contained_turn_is_offered_the_spawn_tool`: the tool list the
    provider was handed on a contained turn's first completion contains `spawn_agent`.
    `no_other_turn_shape_is_offered_the_spawn_tool`: the same assertion negated against **all five**
    pre-0.39.0 entry points — `turn`, `turn_observed`, `turn_steered`, `turn_bounded`,
    `turn_bounded_observed` — each driven through the real loop in the same test.
  - >
    That negative control is not decorative: sabotage **S3** made `drive` substitute a default
    `Containment` when the caller passed none, so every turn reached the tree loop.
    `no_other_turn_shape_is_offered_the_spawn_tool` FAILED, printing the leaked tool list ending in
    `"spawn_agent"`. Reverted.
  - >
    F5 executed: `a_fan_out_is_still_one_turn` — after a turn that spawned three children,
    `Store::session_turns` returns exactly **one** row, `Session::head` names it,
    `Session::history` renders one entry, `Store::turn_for_run(turn.run_id)` returns that turn id,
    and `Store::turn_for_run(child)` returns `None` for every child.
  - >
    N2 — **DEVIATION, stated not glossed.** The criterion says `docs/public-api.txt` gains exactly
    two lines. It gains **none**: the file is unchanged across this release's commits, because
    `tests/public_api.rs` enumerates the items re-exported from `lib.rs` and these two additions are
    inherent methods on the already-listed `struct Session`. The substance is met more strongly than
    the prose asked — the crate root's surface is byte-identical and nothing is removed, renamed or
    altered — and both new methods carry a worked doctest regardless. `tests/public_api.rs` **8
    passed**; `tests/changelog.rs` **15 passed**, finding no `**BREAKING` entry for 0.39.0. Owed to
    the record's `known_limitations`.

- id: US-IO-HARNESS-0.39.0-T04
  summary: >
    The containment evidence: a child spawned inside a turn belongs to that turn's run, the shared
    ledger's spend and count ceilings hold, the concurrency cap queues rather than refuses, and a
    child cannot widen the session's policy.
  why_required: >
    "The fan-out is contained" is the half of the outcome that is not visible in the tool list. A
    turn that could spawn but whose children escaped the session's boundary or its budget would pass
    F1 and be a worse release than none.
  status: done
  depends_on:
  - US-IO-HARNESS-0.39.0-T03
  acceptance_criteria:
  - >
    **F2 — a child spawned inside a turn belongs to that turn's run.** A fixture provider whose first
    completion calls `spawn_agent` twice and whose second stops on text. Assertions against stored
    rows, not against the parent's narration: `Store::spawns` reports both children with
    `parent_run_id == TurnResult::run_id`; each child has its own `runs` row with `depth` 1 and its
    own steps; `Store::agent_events` reconstructs the tree from the turn's run id; the events the
    observer received carry the children's own run ids at depth 1.
  - >
    **F3 — the tree's ceilings hold inside a turn, and the refusal is the tree's.** Two arms, one
    sabotage each. **(a) Spend:** a `Containment` whose `max_total_tokens` is below what the fan-out
    needs halts the tree on the shared ledger — `Ledger::draw_tokens` returns `Draw::Halted` and the
    turn ends on the budget outcome rather than the children continuing on their own contracts'
    budgets. **(b) Count:** a `max_total_agents` of 1 refuses the second spawn with
    `EventKind::SpawnRefused { cap }` and the parent adapts rather than failing. The discriminating
    detail for (b) is that `max_concurrent_agents` must **queue** rather than refuse in the same
    fixture — the 0.32.0 distinction, asserted here because a turn is the first new caller of it.
  - >
    **F4 — a child cannot widen the session's boundary.** The session's policy allows writes under
    `docs/` only. A child whose goal names a write to `src/` is refused by the policy the child
    inherited through `Policy::contain`, the refusal is recorded as a `PolicyEvent` under the
    **child's** run id, and the file does not exist on disk afterwards. Asserted on the filesystem
    and the stored refusal, not on the child's reported outcome. Sabotage: hand the child
    `policy.clone()` instead of the contained one, under which the write lands and this named test
    fails.
  files:
  - tests/session_fanout.rs
  evidence:
  - >
    F2 executed: `a_child_spawned_inside_a_turn_belongs_to_that_turns_run` — two children spawned in
    one step of a contained turn. `Store::children(turn.run_id)` returns both,
    `Store::agent_events(turn.run_id)` carries two `spawn` edges, each child has its own `runs` row
    and its own `steps`, the observer saw a child's step at **depth 1** under the child's own run id,
    and both children's files reached the shared workspace.
  - >
    F3(b), the count cap: `the_total_agent_cap_refuses_a_second_spawn_inside_a_turn` — with
    `max_total_agents: 1` the spawn is refused with `SpawnRefused`, no child run exists, and the
    parent adapts rather than failing. The 0.32.0 distinction holds inside a turn: this cap refuses
    where the concurrency cap queues.
  - >
    F3(a), the spend cap: `the_shared_ledger_halts_a_turns_fan_out_on_spend` — 100 tokens per
    completion against a 150-token tree ceiling. The tree halts on the shared ledger, the second
    child's file never exists, and the turn ends on the ceiling outcome rather than each child
    continuing on its own contract's budget.
  - >
    F4 executed: `a_child_cannot_widen_the_sessions_boundary` — the session's policy allows writes
    under `docs/` and denies `src/*`; a child asked to write `src/x.rs` is refused, the file does not
    exist on disk afterwards, and the refusal is recorded under the **child's** run id.
  - >
    **A sabotage that failed nothing, reported as a finding rather than propped up.** S4 replaced
    `parent_policy.contain(&overlay)` with `parent_policy.clone()` — a child handed its parent's
    policy verbatim — and **every test still passed**, because with an identical policy the boundary
    genuinely still holds. The arm F4 discriminates is *widening*, so the sabotage was sharpened:
    **S4b** handed the child `Policy::permissive()`, under which
    `a_child_cannot_widen_the_sessions_boundary` FAILED on "the child's write outside the session's
    boundary did not land". Reverted. The silence of the first sabotage is the useful result:
    inheritance-without-narrowing is not observable through this criterion, and the criterion is
    about the narrowing.
  - >
    A defect in the test as first written, found by S4's silence and worth recording:
    `Policy::default()` **asks** about a write it has no rule for and `ApproveAll` answers yes, so
    the first version of F4 used `allow_write("docs/*")` alone and the child's write landed. A
    "cannot widen" test needs a `deny`, which is the wall; an `allow` elsewhere is only the prompt.

- id: US-IO-HARNESS-0.39.0-T05
  summary: >
    The pause path: a contained turn that stops awaiting a decision is continued by
    `resume_tree_with_decision` under the same run and the same turn row, with what the turn row
    holds afterwards asserted as it actually is.
  why_required: >
    A fan-out is the shape most likely to hit an approval, and the release owes the operator a
    documented path rather than a run they cannot continue. The turn row's contents after a resume
    the session did not drive is the one place this release can over-claim, so it is measured rather
    than described.
  status: done
  depends_on:
  - US-IO-HARNESS-0.39.0-T03
  acceptance_criteria:
  - >
    **F8 — a paused contained turn resumes as a tree, under the same turn.** A fixture that stops
    `AwaitingApproval` mid-fan-out. `resume_tree_with_decision` on `TurnResult::run_id` with the same
    contract, policy, approver and containment continues the same run id, the children are re-adopted
    from their own checkpoints, and `Store::turn_for_run` still returns the original turn id with its
    `session_id` and `parent_turn_id` unchanged. What the turn **row** holds after a resume the
    session did not drive — the reply and outcome written when the turn paused — is asserted as it
    actually is and stated in `docs/CONTRACT.md` and the record's `known_limitations`, rather than
    claimed to update itself.
  files:
  - tests/session_fanout.rs
  evidence:
  - >
    F8 executed: `a_paused_contained_turn_resumes_as_a_tree_under_the_same_turn` — a turn stopped
    `AwaitingApproval` on a real deferred request from a real `Approver`, then continued with
    `resume_tree_with_decision(contract, provider, store, turn.run_id, request_id,
    Decision::approve(), policy, approver, containment)`. The resume returns **the same run id**,
    `Store::turn_for_run` still returns the original turn id, the row's `session_id` and
    `parent_turn_id` are unchanged, and the work the run was holding landed on disk.
  - >
    **Measured, and it is the honest half of this criterion:** the turn row reads
    `outcome: "running"` after the pause and still reads `running` after the resume — not
    `awaiting_approval`, which is what the test asserted first and what the criterion's prose
    implies. `Session::drive` closes the turn with what `Store::run_summary` said when the turn
    returned, and a run parked on an approval has no summary outcome yet. The run is the record that
    moves; the turn row is not rewritten by a resume the session did not drive. Written into
    `docs/CONTRACT.md` and owed to the record's `known_limitations`.

- id: US-IO-HARNESS-0.39.0-T06
  summary: >
    Documentation as part of the release: the fan-out section in `docs/guide/sessions.md`, the
    pointer from `docs/guide/composition.md`, the honest limits in `docs/CONTRACT.md`, the changelog
    entry with no migration note, and the README line.
  why_required: >
    Every limit in N6 is one an operator discovers the expensive way otherwise — a per-turn ledger
    read as a session ceiling, a paused turn resumed with the wrong function, a child expected to
    answer the operator. The release is not shippable with them undocumented.
  status: done
  depends_on:
  - US-IO-HARNESS-0.39.0-T05
  acceptance_criteria:
  - >
    **N6 — the honest limits are where a reader finds them.** `docs/CONTRACT.md` states: the ledger
    is per turn and not per session, so a conversation's total spend is the sum of its turns' and no
    single ceiling bounds it; a contained turn that pauses is resumed with the `resume_tree_*` family
    and the turn row reflects the pause rather than the continuation; children do not receive the
    conversation and cannot answer the operator; the worst-case concurrency is
    `max_concurrent_agents × depth`, which is 0.32.0's documented cost inherited unchanged; and an
    interrupt or cancel is honoured at the root's step boundary, at which point no child is in flight
    because children are awaited inside the step that spawned them.
  files:
  - docs/guide/sessions.md
  - docs/guide/composition.md
  - docs/CONTRACT.md
  - CHANGELOG.md
  - README.md
  evidence:
  - >
    N6 executed. `docs/CONTRACT.md` gained "What a contained session turn gives you, and what it does
    not (0.39.0)" carrying all six limits the criterion names: the per-turn ledger and the absence of
    a conversation-wide ceiling; the `resume_tree_*` routing **and** the measured fact that the turn
    row reports the pause; a child receiving its goal and not the conversation, with both reasons; a
    child being a run and never a second turn; cancellation at the root's step boundary where no
    child is in flight; and `max_concurrent_agents × depth` inherited unchanged from 0.32.0.
  - >
    `docs/guide/sessions.md`: the entry-point table went from five rows to seven with a "May spawn"
    column, and a new "A turn can fan out (0.39.0)" section carries the worked example and the four
    things to know before reaching for it. `docs/guide/composition.md` gained the pointer from the
    tree side and a "See also" entry, and its "only `run_tree` offers the tool" sentence — which this
    release makes false — was corrected. **No new guide page**, so no `GUIDES`/`CAPABILITIES.md`
    bookkeeping.
  - >
    `CHANGELOG.md` gained the 0.39.0 section with two `### Added` entries and one `### Changed`, and
    **no** `*Migration:*` note because nothing breaks. `README.md` gained the fan-out paragraph beside
    the sessions one, and its install snippet moved to `io-harness = "0.39"`.
  - >
    The documentation gates, run together: `cargo test --test docs_drift --test changelog --test
    readme --test guide_pages --test public_api --test session_fanout` — **5 + 15 + 7 + 9 + 8 + 12 =
    56 passed, 0 failed**. `cargo fmt --check` clean.

- id: US-IO-HARNESS-0.39.0-T07
  summary: >
    The release gates: no new dependency, no store change, the full three-OS matrix, the nightly
    docs.rs command, `cargo package --locked` on a clean tree, and `develop`'s head checked against
    the tree the gates ran on.
  why_required: >
    These are the criteria that fail after everything else passes. The dependency count, the schema
    guard and the docs.rs command have each caught something in the last five releases, and O4 exists
    because 0.37.0 sealed a record describing a tree two Dependabot merges had already changed.
  status: done
  depends_on:
  - US-IO-HARNESS-0.39.0-T06
  acceptance_criteria:
  - >
    **N1 — no new dependency.** `cargo tree` on macOS and Linux still reads **402** lines. This
    release adds no crate; it calls functions that already exist.
  - >
    **N3 — no store change.** No table, no column, no index; `CHECKPOINT_FORMAT` unmoved at 7;
    `ADDED_SINCE_0_22_0` unchanged; `tests/cross_version.rs` and the pinned 0.29.0 generator job pass
    in both directions with no new name fed to the guard. Every row a fan-out inside a turn writes
    goes to tables `spawns`, `agent_queue`, `runs`, `steps` and `run_events` have held since 0.5.0,
    0.32.0 and 0.33.0.
  - >
    **O1 — the three-OS matrix is green** on the commit being released, including the MSRV 1.95 job,
    with no test skipped silently on Windows, no live fixture on the matrix path, and no wall-clock
    assertion anywhere in the new tests. Any source-reading test normalises line endings, and no path
    is joined from a slash-bearing literal.
  - >
    **O2 — docs.rs builds**, proven by running the nightly job's exact command
    (`RUSTDOCFLAGS="--cfg docsrs -D warnings" cargo +nightly doc --all-features --no-deps`) before the
    release PR is opened, never inferred from a stable `cargo doc`. It has caught something in four of
    the last five releases, and this release adds two documented items with intra-doc links to
    `Containment`, `Policy` and the `resume_tree_*` family — the exact shape trap 28 fires on.
  - >
    **O3 — `cargo package --locked` succeeds** on a clean tree and the packaged crate compiles, run
    after a `cargo clean`. Every local build and test runs with `CARGO_PROFILE_DEV_DEBUG=0
    CARGO_PROFILE_TEST_DEBUG=0`, with `df -h .` before and between build steps, and
    `cargo build --all-features --examples` before any `--lib --tests` run or sabotage — the fixture
    binaries this release's tests depend on are in `examples/`, and 0.32.0's fact 17 is that a
    sabotaged library run against a stale fixture passes everything.
  - >
    **O4 — `develop`'s head is checked against the tree the gates ran on, immediately before the
    release PR is opened.** 0.37.0 was interrupted by two Dependabot merges landing above the feature
    merge, and the record described a tree without them. If anything has landed, every gate is re-run
    on the merged tree before the record is sealed.
  files:
  - Cargo.toml
  evidence:
  - >
    N1: `cargo tree` reads **402** lines on macOS, unchanged since 0.23.0, and
    `cargo tree --all-features` reads **829**. `Cargo.toml` received only the version bump to 0.39.0.
  - >
    N3: `docs/public-api.txt` and `src/state.rs` are untouched by this release — zero changes across
    its four commits. `CHECKPOINT_FORMAT` is **7** at `src/state.rs:107`. `cargo test --test
    cross_version --test checkpoint --test store_open` — **18 + 5 + 4 = 27 passed**, both directions
    against the pinned 0.29.0 generator, with no new name fed to `ADDED_SINCE_0_22_0`.
  - >
    The full suites on the release tree: `cargo test --lib --tests` **64 suites / 1,005 passed**;
    `cargo test --all-features --lib --tests` **64 suites / 1,082 passed**; both after
    `cargo build --all-features --examples`, so no sabotage ran against a stale fixture binary.
    Doctests: **370 of 373 passed** — one failure was this release's own
    (`Session::turn_contained`'s example called a `Store::spawns` that does not exist; corrected to
    `Store::children`, after which both new doctests pass), and two are `src/config.rs` doctests that
    fail on this machine only. Those two are **environmental and pre-existing**: they fail
    identically on the stashed 0.38.0 tree, and with `XDG_CONFIG_HOME` redirected all **20**
    `config::Config` doctests pass. The machine carries a real `~/.config/io/io.toml`, which is trap
    102's family reaching the doctest runner rather than only `tests/plugin.rs`.
  - >
    O2: the nightly docs.rs gate, run with the CI job's exact command —
