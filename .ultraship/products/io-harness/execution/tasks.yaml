- id: US-IO-HARNESS-0.9.0-T08
  summary: 'Document the release and the boundary it draws: the v0.9 paragraph in lib.rs stating plainly
    that a registered tool runs in the harness''s own process with the embedding program''s privileges
    and that the policy governs whether it is called rather than what it does once running, the same bound
    0.8.0 already states for a stdio MCP server; that a skill is instructions with no execution of its
    own; plus the README section, the CHANGELOG entry, and the CAPABILITIES tool-layer row moved to shipped.'
  why_required: The contract's third risk is a developer reading registration as a grant, or believing
    the policy sandboxes what their tool does. That misreading is prevented by documentation or not at
    all.
  status: done
  depends_on:
  - US-IO-HARNESS-0.9.0-T05
  acceptance_criteria:
  - 'O2 — the crate documents the boundary it is drawing. lib.rs states plainly that a registered tool
    runs in the harness''s own process with the embedding program''s privileges, that the policy governs
    whether it is *called* and not what it does once running — the same bound 0.8.0 already states for
    a stdio MCP server — and that a skill is instructions with no execution of its own.

    '
  files:
  - src/lib.rs
  - README.md
  - CHANGELOG.md
  - docs/CAPABILITIES.md
  evidence:
  - 'O2 green. src/lib.rs gained three paragraphs after the v0.8 refusal note, matching the existing per-version
    shape: the in-process tool layer, skills, and the boundary. The boundary paragraph opens with the same
    "What it does **not** govern:" framing v0.8 uses and states that a registered tool runs in the harness''s
    own process with the embedding program''s privileges, that the policy governs whether it is *called*
    and not what it does once running (no sandbox, no path scoping, no egress control), that this is exactly
    the bound v0.8 states for a stdio MCP server, and that a skill is instructions with no execution of
    its own.'
  - CHANGELOG.md carries the 0.9.0 section (Added / Changed / Fixed / Security) with the privilege bound
    under Security; README.md gained the v0.9 section with a sample per extension point and the same boundary
    wording; docs/CAPABILITIES.md moves the tool-layer row to shipped.
  - '`cargo test --doc` stays at 3 passing doc-tests; `cargo doc --no-deps` adds no new warning (the two
    it reports are pre-existing private-link warnings in the provider modules).'
- id: US-IO-HARNESS-0.9.0-T09
  summary: 'Ship both extension points as runnable examples in the style of the existing ones: `examples/custom_tool.rs`
    registering a tool whose answer exists nowhere on disk, and `examples/skills_run.rs` pointing at a
    small skills directory, each driven by a real provider from an API key in the environment.'
  why_required: Every prior release of this crate ships an example per capability, and the examples are
    what the two downstream products will copy from. A feature with no runnable example is a feature adopted
    by reading the source.
  status: done
  depends_on:
  - US-IO-HARNESS-0.9.0-T05
  acceptance_criteria:
  - 'O3 — both extension points ship with a runnable example. `examples/custom_tool.rs` and `examples/skills_run.rs`
    run against a real provider from an API key in the environment, in the style of the existing examples.

    '
  files:
  - examples/custom_tool.rs
  - examples/skills_run.rs
  evidence:
  - 'O3 green — `examples/custom_tool.rs` registers a `Shipments` tool through `Toolbox::new().with(...)`
    and `TaskContract::with_tools`. The workspace on disk holds only a list of ids; the status line the
    task needs exists solely inside the tool and appears in neither the goal nor the verification criterion,
    so the post-run check (the produced file contains a datum only the tool knows) is real evidence rather
    than a needle already in the prompt. The policy allows exec on the tool name with a comment noting
    that dropping that line leaves the tool offered but refused on every call.'
  - '`examples/skills_run.rs` points `with_skills` at a directory written at run time (the pattern `policy_run.rs`
    already uses), shipping both layouts: `release-notes.md` with `name:`/`description:` frontmatter and
    `commit-style/SKILL.md` with none. The required output shape is stated only inside the release-notes
    body and the goal merely says the style is a skill, so the shape check proves the body was read; `commit-style`
    is a deliberate irrelevant second entry, since selection is the model''s judgement and not the harness''s.'
  - Both run against a real provider from an API key in the environment via `OpenRouter::from_env()`,
    in the style of the existing examples. Compile-verified with `cargo build --examples` (clean); running
    them live is T10's job.
- id: US-IO-HARNESS-0.9.0-T10
  summary: 'Run the headline evidence against a real model: a workspace task whose required output shape
    is stated only in a skill and whose required datum is available only from a registered tool, plus
    the negative control with `with_tools` and `with_skills` removed. Confirm the negative control fails
    for the intended reason and not an unrelated one before recording either run.'
  why_required: F11 is the only acceptance criterion produced by a model rather than by the suite. The
    0.8.1 release shipped 186 passing offline tests against a build a real run rejected in four steps;
    the live run is what catches that class of defect.
  status: done
  depends_on:
  - US-IO-HARNESS-0.9.0-T07
  - US-IO-HARNESS-0.9.0-T09
  acceptance_criteria:
  - 'F11 — live run, real model. Contract: a workspace task whose required output shape is stated only
    in a skill, and whose required datum is available only from a registered tool. The run succeeds, the
    trace shows the `read_skill` call and the tool call, and the produced file carries both the shape
    and the datum. The same contract with `with_tools` and `with_skills` removed reaches its step cap.
    Both runs recorded in evidence/0.9.0/live_run.txt.

    '
  files:
  - examples/custom_tool.rs
  - examples/skills_run.rs
  - .ultraship/products/io-harness/evidence/0.9.0/live_run.txt
  evidence:
  - 'F11 green on the first attempt, both halves, two live API calls total. `examples/live_f11.rs` runs
    either half from argv, matching the repo''s convention that live evidence comes from an example.'
  - 'The design isolates the two extension points: the datum (quay `Kattegat`, draft `11.6`, window `0430`)
    exists only inside `BerthTable::invoke()` — not on disk, not in the goal, not in the criterion — and
    the required shape (three labelled fields in a fixed order) exists only inside the `berth-record` skill
    body, whose catalogue description deliberately withholds the format. A second skill is a distractor;
    its body was never read.'
  - 'The contract''s own risk register called the criterion the fiddly part, and it was: `Verification::describe()`
    is fed to the model verbatim, so any literal needle in it is a needle the CONTROL could copy, which
    would make the control pass and the evidence worthless. The criterion is therefore an FNV-1a digest
    of `record()` over alphanumerics only — one-way, so the constant discloses neither datum nor shape,
    and case/punctuation-insensitive, so it pins the values, labels and order without becoming a whitespace
    quiz. Verified offline with `rustc --test` before any money was spent.'
  - 'Positive run: `Success { steps: 3 }`. Step 1 carries both extension points — `read_skill:{"name":"berth-record"}`
    and `lookup_berth:{"id":"BRT-2291"}` — and step 3 wrote `quay=Kattegat; draft=11.6; window=0430`,
    the skill''s shape filled with the tool''s values character for character, not merely inside the digest''s
    tolerance. No refusals.'
  - 'Negative control: `StepCapReached { steps: 6 }`, and the trace says why it failed. It searched for
    exactly the two things removed and found neither — `grep "skill"` 0 hits, `find "*skill*"` 0 paths
    (`read_skill` is not offered when no skills are configured), and `grep` for `lookup_berth`, `BRT-2291`,
    `BRT` and `berth` all 0 hits. Told to invent neither, it never wrote the file. Ruled out: no crash
    (six committed steps, ordinary cap), no refusal (empty refusal set in both runs), not an unsatisfiable
    criterion (the same criterion and model passed minutes earlier), not a malformed prompt (goal byte-identical).
    The single difference is `with_tools`/`with_skills`.'
  - 'Both runs recorded in .ultraship/products/io-harness/evidence/0.9.0/live_run.txt with provider, model,
    date, the full contract, both traces and both produced files. No harness defect found; one example-hygiene
    note (the examples open `runs.db` inside the workspace the agent may read, which cost the control two
    steps of noise) is recorded there.'
