    files:
      - .github/workflows/ci.yml
    evidence:
      - >
        NF1 locally on macOS (arm64, rustc 1.95.0): `cargo test` green — 45 test binaries plus 237
        doctests, 0 failed, 0 ignored — including the real-SIGKILL crash-resume test and the five new
        cross-version tests. `cargo test --all-features --lib --tests` green; `cargo test --all-features
