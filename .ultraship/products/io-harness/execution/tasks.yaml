    text in `tests/docs_drift.rs`, run against the real `README.md` by one test, with a negative control
    fixture carrying the current `io-harness = "0.25"` line that the checker must report. Fed the corrected
    README it reports nothing. `tests/readme.rs`''s two existing properties still hold: the first 60 lines
    say what the crate is, show a runnable fence and name the MSRV, and no heading is named after a release.

