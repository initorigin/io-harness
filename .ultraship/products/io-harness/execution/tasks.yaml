        No test was skipped, ignored or made conditional to get there.
      - >
        NF3 — `RUSTDOCFLAGS="--cfg docsrs -D warnings" cargo +nightly doc --all-features --no-deps`
        builds clean, which is the exact command and flags the nightly `docs` job runs. The job's
        second assertion was checked too: the rendered pages under `target/doc/io_harness/` carry
        `Available on crate feature`, so the feature labelling that job exists to protect is intact.
        Checked before publication, as the criterion requires, not after.
      - >
        Linux and Windows are CI's to confirm on the pull request. Windows is the one to watch: the
        bundled SQLite is a C compile there, 3.53.2 is a larger translation unit than 3.46.0, and the
