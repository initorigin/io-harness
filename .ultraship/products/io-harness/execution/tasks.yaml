    gains **the enumerated crate-root additions only** — `enum Reverted` and `fn rewind_step` — stated
    as the enumerated additions rather than as a line count, because that checker enumerates crate-root
    re-exports and a criterion promising a number has been met in a different form in four of the last
    twelve releases. `PATCH_FILE_TOOL` and `CHECK_TOOL` live in `tools` and add no line, as `EDIT_FILE_TOOL`
    does not.

    '
  - '**O4 — the documentation surfaces agree with the code, in the same release.** `docs/CONTRACT.md`,
    `src/lib.rs`, the README and `CHANGELOG.md` describe what is stored per edit, what a patch may and
    may not do, what the checker tool is gated on, and the newest-first ordering rule for step reverts.
    `src/verify.rs`''s comment naming this release as future work is corrected in this release. `tests/docs_drift.rs`,
    `tests/changelog.rs`, `tests/readme.rs`, `tests/guide_pages.rs` and `tests/public_api.rs` pass.

    '
