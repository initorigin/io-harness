product: io-harness
version: 0.8.0
tasks:
  - id: US-IO-HARNESS-0.8.0-T01
    summary: >
      Dependency baseline. Add rmcp 2.2.0 with default-features off and features
      client + transport-child-process + transport-streamable-http-client-reqwest; bump reqwest
      0.12 → 0.13 (feature rustls-tls → rustls) because rmcp 2.2.0 requires reqwest 0.13.2; give
      every built-in provider's reqwest client an explicit no-redirect policy so a 3xx cannot move a
      request to a host the policy never saw. Crate builds and the whole existing suite stays green.
    why_required: >
      rmcp pins reqwest 0.13. Staying on 0.12 means two reqwest versions and two TLS stacks in a
      published crate, and — decisively — the streamable-HTTP transport would refuse our own
      reqwest::Client, so redirect control on the MCP path would be lost and the egress guarantee
      would have a documented hole. Nothing else in the release can be built until the dependency
      floor is settled.
    status: done
    depends_on: []
    acceptance_criteria:
      - >
        NF1 — MCP is implemented via the rmcp crate. No hand-rolled JSON-RPC framing or protocol
        version negotiation in this repo.
      - >
        NF5 — the crate compiles on macOS, Linux, and Windows. Stdio server spawning uses portable tokio
        process APIs; no unix-only path in the MCP layer.
    files:
      - Cargo.toml
      - src/provider/openrouter.rs
      - src/provider/anthropic.rs
      - src/provider/openai.rs
    evidence:
      - >-
        Cargo.toml: rmcp 2.2.0 (default-features off; client + transport-child-process +
        transport-streamable-http-client-reqwest), reqwest 0.12 -> 0.13 (feature rustls-tls -> rustls),
        rust-version 1.75 -> 1.87 (process-wrap needs 1.87, reqwest 0.13 needs 1.85 — the old floor would
        have been a false claim).
      - >-
        src/net.rs: http_client() is now the crate's only reqwest::Client constructor, built with
        redirect::Policy::none() so a 3xx cannot move a request to a host the policy never checked. All
        three providers (openrouter/openai/anthropic) construct through it.
      - >-
        cargo test after the bump: 136 passed, 0 failed, across all 9 binaries — the dependency change
        needed no source change beyond the feature rename.

  - id: US-IO-HARNESS-0.8.0-T02
    summary: >
      The network act in the permission model. Add `Act::Net`, a `net` field on `Defaults` defaulting
      to Deny, and `allow_net`/`deny_net`/`ask_net` builders. Targets are `host` or `host:port`,
      matched by the existing glob matcher against both forms (so `api.openai.com` and
      `api.openai.com:443` both match). `Policy::default()` denies network; `Policy::permissive()`
      allows it. `Defaults` gains serde defaults so a 0.7.0-era policy JSON deserializes with network
      Deny rather than failing.
    why_required: >
      Every other egress task checks against this act. Without it there is nothing to enforce, nothing
      to contain, and nothing to attribute in the trace.
    status: done
    depends_on: []
    acceptance_criteria:
      - >
        F10 — a `Policy` carrying network rules round-trips through serde unchanged, and an MCP server
        configuration round-trips through serde unchanged.
      - >
        NF6 — adding a network variant to the public `Act` enum and a field to `Defaults` is a breaking
        change under strict SemVer and is taken deliberately in a 0.x minor, which cargo already treats
        as incompatible. It is stated in the CHANGELOG as a breaking change with the one-line migration,
        not glossed as additive.
    files:
      - src/policy.rs
      - tests/policy.rs
    evidence:
      - >-
        src/policy.rs: Act::Net; Defaults.net with #[serde(default = "deny")]; allow_net/deny_net/ask_net;
        Policy::default() denies net, Policy::permissive() allows it, is_permissive() accounts for it;
        merge/contain tighten net like every other act; explain() has the Act::Net default arm.
      - >-
        Host matching: explain() tries the target as given and with a numeric :port stripped, so
        allow_net("api.example.com") covers any port while allow_net("api.example.com:443") means that port
        only. Wildcards work as on paths.
      - >-
        src/policy.rs unit tests (6 new): net_is_denied_by_default_and_allowed_only_where_a_rule_says_so,
        a_net_rule_matches_with_or_without_the_port, net_narrows_downward_and_never_widens,
        a_pre_0_8_policy_deserialises_with_network_denied (the owner-decided Deny for 0.7.0-era JSON),
        net_rules_survive_a_serde_roundtrip, permissive_still_enforces_nothing_including_the_network.

  - id: US-IO-HARNESS-0.8.0-T03
    summary: >
      One checked entry point for outbound connections. Add a `NetGuard` that evaluates a host (or a
      URL's host) against a policy, records the verdict to the store, and returns `Error::Refused` on
      Deny. Add `Provider::endpoint_host()` (defaulting to `None`, like `name()`) implemented by the
      three built-in providers, and check it in the run loop before every completion so a denied
      provider host fails the run as a refusal before any request is built.
    why_required: >
      A check spread across call sites is a policy that looks enforced and is not. Funnelling every
      outbound call through one guard is what makes "no connection is opened" testable instead of
      assumed, and it is the single largest correctness risk named in the contract.
    status: done
    depends_on:
      - US-IO-HARNESS-0.8.0-T01
      - US-IO-HARNESS-0.8.0-T02
    acceptance_criteria:
      - >
        F4 — under a policy whose network default is Deny, a connection to an unlisted host is refused:
        the call returns a typed error, no connection is opened (asserted against a listener that
        records connection attempts), and the refusal is in the trace with the deciding layer.
    files:
      - src/net.rs
      - src/provider/mod.rs
      - src/run.rs
      - tests/net.rs
    evidence:
      - >-
        src/net.rs: NetGuard { policy, trace } mirroring ExecGuard — check(url) / check_target(host:port),
        Deny returns Error::Refused (not a verdict the caller can ignore), Allow/Ask return the Verdict.
        target(url) normalises to host:port, filling the port from the scheme, handling userinfo and IPv6
        literals; an unparseable URL is refused rather than waved through.
      - >-
        src/provider/mod.rs: Provider::endpoint() -> Option<&str>, defaulting to None ("opens no
        connection") so every existing implementer still compiles; the three built-ins return their
        ENDPOINT. Named endpoint() rather than the endpoint_host() of this task's summary — the guard
        does the host normalisation, so one parser exists rather than three.
      - >-
        src/run.rs: authorize_provider() runs once per run in run_with / run_tree / resume_tree, records
        the verdict at step 0, and returns the effective policy. Every verdict — allow, ask, refusal —
        goes to policy_events, so no new DDL was needed for the network half of O1.
      - >-
        tests/net.rs: a_refusal_is_recorded_in_the_trace (layer and rule attributed). The no-socket proof
        is asserted by a real TcpListener that counts accepts, against a provider that really dials TCP.

  - id: US-IO-HARNESS-0.8.0-T04
    summary: >
      The provider-host layer. The harness merges the configured provider's host as one named policy
      layer ("provider") beneath the caller's layers, so a run under a network-deny base reaches its
      model and `explain` attributes the allowance to that named layer. An explicit caller Deny of
      that host still wins (Deny is absolute) and the run fails fast as a refusal, not a hang.
    why_required: >
      Without it, deny-by-default network makes every existing caller's run fail against its own
      provider, and the release ships a feature nobody can turn on. Making the allowance a visible
      named layer rather than a hidden exemption is what keeps the trace honest.
    status: done
    depends_on:
      - US-IO-HARNESS-0.8.0-T03
    acceptance_criteria:
      - >
        F8 — a run under a base policy that denies all network still reaches its configured provider,
        via the named provider layer, and `explain` attributes the allowance to that layer. A caller
        rule that explicitly denies the provider host wins and the run fails as a refusal, not a hang.
    files:
      - src/net.rs
      - src/run.rs
      - tests/net.rs
    evidence:
      - >-
        src/net.rs: provider_layer(target) + PROVIDER_LAYER ("provider"). Merged BEFORE the check, not
        consulted after it: the net default denies, the layer's allow rule beats a default, and a caller's
        explicit deny_net still beats the allow because deny is absolute across layers.
      - >-
        tests/net.rs: a_deny_all_base_still_reaches_its_provider_through_the_provider_layer (Success, the
        socket really opened, and the trace attributes the allowance to layer "provider"), and
        denying_your_own_provider_is_legal_and_fails_as_a_refusal (Error::Refused, zero connections).
      - >-
        Bug found and fixed while wiring this: merging the provider layer turned a permissive caller's
        policy non-permissive, which pushed single-file runs into run_with's "policy requires workspace
        mode" refusal. The guard now reads the caller's policy before the merge (caller_enforces).

  - id: US-IO-HARNESS-0.8.0-T05
    summary: >
      Network `Ask` through the existing approval gate, and durably across a restart. An Ask verdict
      on a network action builds a `Request` for `Act::Net`, consults the `Approver`, performs the
      call exactly once on Approve, blocks on Deny, and on Defer persists the pending action so
      `resume_with_decision` / `resume_tree_with_decision` on a fresh process performs it.
    why_required: >
      Ask is one of the three effects the contract promises for network, and 0.7.0's durable pause is
      what makes it usable for an unattended run. Without this, network policy is only allow/deny and
      the release under-delivers its stated outcome.
    status: done
    depends_on:
      - US-IO-HARNESS-0.8.0-T03
    acceptance_criteria:
      - >
        F5 — a network rule with effect Ask routes to the approval gate: a Deny decision blocks the call
        and a run continues or fails per the existing gate semantics; an Allow decision performs it
        exactly once.
      - >
        F6 — a network Ask survives a full process restart: the tree pauses, the process exits, and
        `resume_with_decision` on a fresh process against the same store performs the approved call and
        completes the run.
    files:
      - src/net.rs
      - src/run.rs
      - src/state.rs
      - tests/net.rs
    evidence:
      - >-
        src/run.rs: an Ask on the provider host consults the Approver at step 0. Approve proceeds, Deny
        returns Error::Refused and finishes the run, Defer persists the pending action (act "net") and
        returns RunOutcome::AwaitingApproval { steps: 0 }.
      - >-
        resume_with_decision and resume_tree_with_decision gained a pending.act == "net" branch. This was
        a real defect the Pending path opened: the existing code maps any non-"read" pending to Act::Write,
        so an approved network action would have been re-checked against the path policy and then written
        to disk as a file named after the host. The net branch grants the host and starts the loop, which
        is correct because the pause happens before the first step and has no effect to replay.
      - >-
        tests/net.rs: an_ask_on_the_network_is_approved_and_dials (exactly one dial),
        an_ask_denied_at_the_gate_never_dials (zero), and a_deferred_network_decision_persists_and_resumes
        — which pauses under one Store handle, drops it, reopens the file, reads the persisted pending, and
        delivers the decision to a fresh provider, so it crosses a real process-shaped boundary.

  - id: US-IO-HARNESS-0.8.0-T06
    summary: >
      Containment of network under 0.5.0. Confirm and pin that `Policy::contain` treats network rules
      like every other act — a child inherits its parent's network rules and can only narrow them —
      and that a child task contract attempting to widen is refused and recorded.
    why_required: >
      A sub-agent that could reach a host its parent cannot would make the containment boundary a
      claim rather than a boundary, and 0.5.0's whole safety story rests on narrow-only.
    status: done
    depends_on:
      - US-IO-HARNESS-0.8.0-T02
    acceptance_criteria:
      - >
        F7 — a 0.5.0 child inherits its parent's network rules; a child task contract that tries to
        allow a host its parent denies is refused by containment, and the refusal is recorded. A child
        that narrows (denies more) is honoured.
    files:
      - src/containment.rs
      - src/policy.rs
      - tests/subagents.rs
    evidence:
      - >-
        src/policy.rs: Policy::contain already treats every act uniformly, so net inheritance and
        narrow-only fell out of existing code. Pinned by net_narrows_downward_and_never_widens (a child
        allow of a host the parent denies grants nothing; a child deny binds).
      - >-
        src/run.rs: the spawn tool gained a deny_net argument beside deny_write, so a parent can narrow a
        child's reachable hosts and not only its writable paths. Widening is structurally impossible: the
        spawn tool exposes no allow of any kind, so a child cannot even express the request.
      - >-
        Not yet proven at run level: the only thing a child can dial is an MCP server, so the end-to-end
        child-refused-a-host test belongs with T09 and is not claimed here.

  - id: US-IO-HARNESS-0.8.0-T07
    summary: >
      MCP client over stdio. Add `McpServer` config (serde: id, transport, command/args/env, timeout)
      and a session that connects over `TokioChildProcess`, initializes, lists tools, calls a tool,
      and shuts down. Spawning the server binary is an `Act::Exec` check; discovered tools convert to
      `ToolSpec` under `mcp__<server>__<tool>` with their JSON Schema passed through unchanged.
    why_required: >
      This is the release's capability half. Without a connected server offering tools there is
      nothing for the agent to invoke and nothing for the egress policy to be interesting about.
    status: done
    depends_on:
      - US-IO-HARNESS-0.8.0-T01
      - US-IO-HARNESS-0.8.0-T02
    acceptance_criteria:
      - >
        F1 — with a stdio MCP server configured, a run discovers its tools, the model is offered them
        under `mcp__<server>__<tool>` names, the agent invokes one, and the result reaches the next loop
        step. Asserted by a test using a fixture server and by the live run.
      - >
        F3 — a server advertising a tool named `write_file` does not shadow the built-in: both are
        callable, the built-in keeps its name, and the server's is reachable only under its namespaced
        name.
    files:
      - src/mcp.rs
      - src/lib.rs
      - tests/mcp.rs
    evidence:
      - >-
        src/mcp.rs: McpServer / McpTransport (serde, stdio + http, per-call timeout), McpSession::connect /
        tool_specs / owns / call / shutdown over rmcp 2.2.0. Stdio spawn is an Act::Exec check on the
        server binary; discovered tools become ToolSpec named mcp__<server>__<tool> with the server's JSON
        Schema passed through unchanged. src/error.rs: Error::Mcp { server, reason }.
      - >-
        examples/mcp_fixture_server.rs: a real MCP server process (echo, write_file, boom, sleep, die) the
        tests spawn over stdio. An example, not a bin, so it never ships as an installable binary; the
        tests locate it from the test binary's own path, which is profile-agnostic.
      - >-
        tests/mcp.rs (10 tests, all green): a_stdio_server_is_discovered_called_and_its_result_reaches_the_
        loop proves F1 end to end — namespaced tool offered beside grep/write_file, invoked, result into
        the loop, and connect/discover/call/disconnect all in mcp_events with latency.
      - >-
        a_server_tool_named_like_a_builtin_does_not_shadow_it proves F3: the fixture advertises write_file,
        both names are offered, the built-in appears exactly once, and the file on disk shows the built-in
        did the writing while the server's namesake wrote nothing.
      - >-
        Bug found and fixed here: McpEvent::connected set detail to the transport and a chained with_detail
        immediately overwrote it with a tool count, so the connect event lost the one fact only it records.
        The discovered events already carry the tools; the count is gone and the transport stays.
  - id: US-IO-HARNESS-0.8.0-T08
    summary: >
      MCP client over streamable HTTP. Same session API, dialling a URL with a caller-supplied
      no-redirect `reqwest::Client`, with the URL's host checked through `NetGuard` before the
      transport is constructed.
    why_required: >
      An HTTP MCP server is the case where the egress act does real work — it is the first
      configurable arbitrary host the harness dials — and the contract includes both transports.
    status: done
    depends_on:
      - US-IO-HARNESS-0.8.0-T03
      - US-IO-HARNESS-0.8.0-T07
    acceptance_criteria:
      - >
        F2 — with a streamable-HTTP MCP server configured, the same holds end to end against a test HTTP
        server.
    files:
      - src/mcp.rs
      - tests/mcp.rs
    evidence:
      - >-
        src/mcp.rs: the Http transport builds StreamableHttpClientTransport::with_client over net::
        http_client() (redirects off) after NetGuard checks the URL's host, so the connection is authorized
        before the transport exists.
      - >-
        tests/mcp.rs: an_http_server_is_discovered_called_and_its_result_reaches_the_loop proves F2 against
        a real HTTP server — rmcp's StreamableHttpService mounted on hyper, serving the SAME fixture handler
        the stdio test uses (tests/mcp.rs includes examples/mcp_fixture_server.rs), so the two transports
        cannot drift apart.
      - >-
        an_unlisted_mcp_host_is_refused_before_anything_is_dialled completes F4's remaining leg — the case
        deferred at the last checkpoint. An MCP host is not the provider host, so nothing grants it
        implicitly: under the default deny the run fails with Error::Refused, a live TcpListener records
        zero accepts, the refusal is in the trace, and mcp_events is empty.
      - >-
        dev-dependencies: hyper (server, http1) + hyper-util (tokio, service, server) and rmcp's
        transport-streamable-http-server feature. Dev-only — the shipped crate stays client-side.

  - id: US-IO-HARNESS-0.8.0-T09
    summary: >
      MCP tools in the agent loop. Offer discovered tools alongside the built-ins, dispatch
      `mcp__*` calls through an `Act::Exec` gate on the namespaced tool name, fold the result into the
      observation log under a documented size cap (truncation recorded), and share one session per run
      across the whole 0.5.0 tree without serializing the fan-out.
    why_required: >
      Connecting to a server the agent cannot call is not a feature. This is the task that makes
      `outcome.user_can` true.
    status: done
    depends_on:
      - US-IO-HARNESS-0.8.0-T07
    acceptance_criteria:
      - >
        F1 — with a stdio MCP server configured, a run discovers its tools, the model is offered them
        under `mcp__<server>__<tool>` names, the agent invokes one, and the result reaches the next loop
        step. Asserted by a test using a fixture server and by the live run.
      - >
        F3 — a server advertising a tool named `write_file` does not shadow the built-in: both are
        callable, the built-in keeps its name, and the server's is reachable only under its namespaced
        name.
    files:
      - src/run.rs
      - src/mcp.rs
      - tests/mcp.rs
    evidence:
      - >-
        src/contract.rs: TaskContract.mcp + with_mcp(), empty by default so a 0.7.0-era contract is
        unchanged. src/run.rs: sessions are connected and shut down around every workspace entry point
        (run_with, resume, both resume_with_decision branches, run_tree, resume_tree, both
        resume_tree_with_decision branches); Tree carries one session for the whole fan-out.
      - >-
        dispatch() gained an mcp.owns(name) branch: the call is gated as Act::Exec on the namespaced tool
        name, the result is size-capped (truncation recorded), and a refusal is an observation rather than a
        run failure. a_single_mcp_tool_can_be_denied_while_the_server_is_allowed proves the split — the
        server starts, one of its tools is denied by a named layer, the run still succeeds, and mcp_events
        shows the denied tool was never called.
  - id: US-IO-HARNESS-0.8.0-T10
    summary: >
      MCP failure handling on the 0.2.0 recovery path. A server binary that will not start, a server
      killed mid-run, a tool returning an error, and a call exceeding its timeout each produce a typed
      error the loop treats as a recoverable step failure, recorded in the trace, never a panic and
      never a silently dropped tool.
    why_required: >
      MCP servers are third-party processes the harness does not control; without this a dead server
      takes down a run that 0.2.0 already knows how to recover.
    status: done
    depends_on:
      - US-IO-HARNESS-0.8.0-T09
    acceptance_criteria:
      - >
        F9 — MCP server failure paths: a server whose binary does not start, a server killed mid-run,
        a tool returning an error, and a tool call exceeding its timeout each produce a typed error
        handled by the 0.2.0 retry/recovery path, with the failure in the trace and no panic.
    files:
      - src/mcp.rs
      - src/run.rs
      - tests/mcp.rs
    evidence:
      - >-
        tests/mcp.rs covers all four F9 legs: a_server_that_cannot_start_fails_the_run_with_a_typed_error
        (Error::Mcp), a_tool_that_reports_an_error_does_not_end_the_run (is_error -> ok=false observation,
        run still succeeds), a_tool_that_never_returns_times_out_and_the_run_continues (per-call timeout),
        and a_server_that_dies_mid_run_becomes_an_observation_not_a_crash (the fixture's `die` tool exits
        the process; the next call fails cleanly and the agent finishes with a built-in).
      - >-
        DEVIATION FROM F9 AS WRITTEN, for the owner to accept or reject at iterate: F9 says a server whose
        binary does not start is "handled by the 0.2.0 retry/recovery path". It is not — connecting happens
        before step 1, so it fails the run with a typed Error::Mcp instead. Retrying a missing binary would
        not make it appear, and continuing without a configured capability is the worse failure. The other
        three legs DO go through the loop as recoverable observations.

  - id: US-IO-HARNESS-0.8.0-T11
    summary: >
      Trace and schema. Additive rusqlite events for MCP (server connect/disconnect with transport,
      tools discovered, each tool call with latency and outcome) and for every network verdict (target,
      act, effect, deciding layer) including allows, refusals, and asks, all queryable from a reopened
      store. A 0.7.0 database migrates in place and a 0.7.0 binary still reads a migrated one.
    why_required: >
      An egress boundary that is not auditable cannot be trusted after the fact, and the contract's
      operational criteria are all read-backs from the store.
    status: done
    depends_on:
      - US-IO-HARNESS-0.8.0-T03
      - US-IO-HARNESS-0.8.0-T07
    acceptance_criteria:
      - >
        O1 — the trace records, for each run: every MCP server connect and disconnect with its
        transport, the tool list discovered per server, each MCP tool call with latency and outcome, and
        each network verdict with target, effect, and deciding layer. All queryable from a reopened
        store.
      - >
        O2 — the rusqlite migration is additive; a database written by 0.7.0 opens and migrates in
        place, and a 0.7.0 binary still reads a migrated database. Asserted by a migration test.
    files:
      - src/state.rs
      - tests/mcp.rs
      - tests/net.rs
    evidence:
      - >-
        src/state.rs: McpEvent (connected / discovered / called / disconnected, with transport, latency, ok,
        truncation note) and the mcp_events table — new table only. Store::record_mcp / mcp_events read it
        back; asserted from a reopened store in tests/mcp.rs.
      - >-
        Network verdicts deliberately do NOT get their own table: they go to policy_events beside every
        other permission decision, so one query answers "what was this run allowed to do". That is why the
        egress half of O1 needed no DDL at all.
      - >-
        O2: a_pre_0_8_database_migrates_in_place_and_keeps_its_rows builds a 0.7.0-shaped store (steps,
        checkpoints, policy events; mcp_events dropped), reopens it, and asserts the old rows and run status
        are intact, the new table is empty and then usable — additive, no rewrite.
  - id: US-IO-HARNESS-0.8.0-T12
    summary: >
      Back-compatibility and concurrency. A 0.7.0-era caller that configures no MCP servers compiles
      against 0.8.0 and reaches the same verified success; the existing 0.5.0 fan-out suite runs green
      with the network act enabled, proving the egress check introduced no global lock.
    why_required: >
      0.8.0 already takes one deliberate compile break (the `Act` variant); a silent behavioural break
      or a serialized fan-out on top of it would make the upgrade unaffordable for io-cli and
      io-studio.
    status: done
    depends_on:
      - US-IO-HARNESS-0.8.0-T09
    acceptance_criteria:
      - >
        F11 — a 0.7.0-era caller that configures no MCP servers compiles against 0.8.0 and reaches the
        same verified success, with network governed by whatever its policy says (permissive policies
        stay permissive).
      - >
        NF2 — the network check is a policy lookup on the existing matcher and introduces no new global
        lock. The 0.5.0 fan-out suite runs green with the network act enabled, so containment of egress
        does not serialize concurrent agents.
    files:
      - tests/subagents.rs
      - tests/parity.rs
    evidence:
      - >-
        F11: a_contract_without_mcp_offers_exactly_the_builtin_tools (no connection, no mcp_events, no
        mcp__ tool offered) and tests/net.rs a_provider_with_no_endpoint_runs_under_a_network_deny_policy
        (an endpoint-less provider is not exempt — it has nothing to govern — so every offline test in the
        suite runs under deny-by-default egress unchanged).
      - >-
        NF2: the whole pre-existing suite runs green with the network act live, including the 0.5.0 fan-out
        suite (tests/subagents.rs, 17 passed). The net check is a lookup on the existing glob matcher and
        adds no lock; the MCP session is shared by reference through Tree rather than per agent. This is
        indirect evidence — there is no dedicated timing benchmark asserting non-serialization, same
        limitation 0.7.0 recorded for checkpointing.
      - >-
        Whole suite after the release work: 171 tests passed, 0 failed, across 11 binaries.

