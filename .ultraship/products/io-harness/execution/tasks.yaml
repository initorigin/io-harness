product: io-harness
version: 0.42.0
tasks:
- id: US-IO-HARNESS-0.42.0-T01
  summary: Add `ApprovalContext`, the defaulted `Approver::decide_in_context` and `Approver::model`, and
    route both approval sites through one crate-internal helper that builds the context from the policy's
    own `Verdict`.
  why_required: Every approval claim in the release rests on the approver being handed the rule and the
    layer that flagged the call, and neither is on `Request` today. Without this the model approver is
    as blind as an out-of-crate one, and the two loops would each grow their own copy of the context.
  status: done
  depends_on: []
  acceptance_criteria:
  - '**F3 — an approver that overrides nothing is unaffected.** `ApproveAll`, `DenyAll` and a hand-written
    approver implementing only `decide` are each run through the tool path and the pre-run net authorization,
    and each decides exactly as it does on 0.41.0 — same outcome, same stored rows. Sabotage: make `decide_in_context`
    return `Decision::Defer` instead of forwarding to `decide`, under which all three arms stop at an
    approval nobody asked for.

    '
  files:
  - src/approve.rs
  - src/lib.rs
  - src/run.rs
  - tests/model_approver.rs
  evidence:
  - '`ApprovalContext { goal, rule, layer }` landed in `src/approve.rs` as a `#[non_exhaustive]` struct
    with `new` and `flagged_by`, re-exported from `src/lib.rs`. `Approver` gained two defaulted methods:
    `decide_in_context`, which forwards to `decide` and ignores the context, and `model`, which returns
    `None`.'
  - Both approval sites go through one helper. `fn approval_context(goal, verdict)` in `src/run.rs` is
    called by `gate` (the tool path) and by `authorize_provider` (the pre-run provider authorization);
    the latter now keeps the asking host's `Verdict` beside its target rather than the target alone, because
    only that verdict is the answer to "which rule asked".
  - The goal reaches the tool path by parameter, threaded through `dispatch`, `prepare_read`, `read_batch`,
    `check_shell_line` and all eleven `gate` call sites, from `contract.goal` at both loops' entry.
  - '`cargo test --test model_approver` exit 0, 2 passed: F3''s three arms (`ApproveAll` writes, `DenyAll`
    does not, and an approver implementing only `decide` is asked exactly once and its reason reaches
    the model''s observations), and the structural test — one definition of `approval_context`, at least
    two call sites, zero `.decide(&request)` call sites left in the loop and exactly two `decide_in_context(`
    ones.'
  - 'Regression, same invocation: `net` 9 passed, `policy` 24 passed, `shell` 11 passed. The net suite
    is the one that exercises the second approval site end to end.'
- id: US-IO-HARNESS-0.42.0-T02
  summary: Add `ModelApprover<P>` with `new`, `allow_self_approval`, the verdict prompt and parse, defer
    on an unparseable verdict, and an always-empty `remember`.
  why_required: 'This is the release''s headline: the thing that lets an unattended run answer the grey
    tier at all. It is also where F1 and F2 become provable, because a fixture provider can record the
    prompt it was handed and return each of the three answers.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.42.0-T01
  acceptance_criteria:
  - '**F1 — a model approver is handed the rule and the layer that flagged the call.** A policy whose
    Ask tier comes from a **named** layer with a named glob; a fixture provider standing in for the approving
    model that records the request it was given and returns an approving verdict. The recorded prompt
    contains the layer''s name and the rule''s pattern, and the run''s goal. Asserted against the same
    `Verdict` the policy produced, not against a literal. Sabotage: build the context with `rule: None,
    layer: None`, under which the assertion fails while every other approval test still passes.

    '
  - '**F2 — the three answers, each with its own stored consequence.** The same completion — one `write_file`
    the policy marks `Ask` — run three times against a `ModelApprover` whose fixture provider returns
    approve, deny and defer. Approve: one `Edit` row and the file on disk holds the new bytes. Deny: **no**
    `Edit` row, the file is byte-identical to before, and the model''s next observation carries the reason
    the verdict gave. Defer: `RunOutcome::AwaitingApproval`, an unresolved row in `pending`, and `resume_with_decision`
    with an approving decision then lands exactly the persisted write. Sabotage: map an unparseable verdict
    to approve instead of defer, under which the malformed-verdict arm lands a write it must not.

    '
  files:
  - src/approve.rs
  - src/lib.rs
  - tests/model_approver.rs
  evidence:
  - '`ModelApprover<P>` landed in `src/approve.rs` with `new`, `allow_self_approval` and `self_approval_allowed`,
    re-exported from `src/lib.rs`. It overrides both `decide` and `decide_in_context`, so it works with
    or without the context and prompts with whatever it was given.'
  - 'The three answers plus a fourth case: `approve` and `deny` map to their `Decision`s, `defer` and
    **anything unreadable** map to `Decision::Defer` — including a provider error, because a decision
    nobody gave must park the question rather than answer it. `modified` is always `None` and `remember`
    is always empty, so a model can neither rewrite the action nor widen the run''s boundary.'
  - 'One scanner, not two. `parse_verdict`''s balanced-object walk moved to `verify::first_json_object`
    / `json_object_from` and both readers use it; `parse_verdict` still tries each candidate in turn,
    so a model writing `{"note": …} {"passed": true}` is still read as before.'
  - F1 — `the_approving_model_is_told_which_rule_and_which_layer_asked` passes. The approving provider
    keeps every prompt; the assertion is against the `Verdict` the policy itself produced (`ops-baseline`,
    `out.*`), plus the run's goal and the target. A decision alone could not show the model was told anything,
    which is why the prompt is what is asserted.
  - 'F2 — `approve_deny_and_defer_each_leave_their_own_trace` passes. Approve: one `Edit` row, the bytes
    on disk. Deny: no `Edit` row, no file, and the model''s own observation carries the verdict''s reason.
    Defer, run twice — once for `{"decision": "defer"}` and once for a verdict with no JSON in it at all:
    `RunOutcome::AwaitingApproval`, an unresolved `pending` row, and `resume_with_decision` then lands
    exactly the persisted write.'
  - '`cargo test --test model_approver` exit 0, 4 passed; `--test review` 11 passed, which is the regression
    on the scanner the two now share.'
- id: US-IO-HARNESS-0.42.0-T03
  summary: Refuse a `ModelApprover` whose model is the model under it, in `preflight_review_and_routing`,
    before the first request is built.
  why_required: A model approving its own call reports what the run already believes. The contract states
    the refusal costs zero completions, and only a check in the preflight can be that.
  status: done
  depends_on:
  - US-IO-HARNESS-0.42.0-T02
  acceptance_criteria:
  - '**F4 — a model cannot approve its own call, and the refusal costs nothing.** A `ModelApprover` whose
    model equals the run''s model, over a counting provider: the run fails at start with `Error::Config`,
    and the counter shows **zero** completions on both providers. With `allow_self_approval(true)` and
    nothing else changed, the same run proceeds and the approval is answered. Sabotage: move the check
    after the first completion, under which the counter is non-zero and this fails.

    '
  files:
  - src/run.rs
  - tests/model_approver.rs
  evidence:
  - '`refuse_self_approval(contract, provider, approver)` landed in `src/run.rs`, comparing `Approver::model()`
    against the contract''s `Routing` models and `Provider::model_hint()` — the same two answers 0.34.0''s
    review refusal compares — and returning `Error::Config` naming the model and how to say you meant
    it.'
  - 'Called from BOTH loops, which is why it is a helper rather than a fourth arm of the preflight: `preflight_review_and_routing`
    covers the flat and session loops, and `run_tree_with_extras` calls it directly because a tree entry
    never preflights. An unattended tree is where a self-approving model would do the most damage.'
  - '`Approver::self_approval_allowed` was added as a third defaulted method (`false`), read only when
    `model()` names one, so the knob stays on the approver the caller built rather than on the contract.'
  - 'F4 — `a_model_cannot_approve_its_own_call` passes both arms. Refused: the error names `one-model`,
    the approving provider recorded **zero** completions and the run''s own provider recorded **zero**
    as well, and nothing was written. Control, same models with `allow_self_approval(true)`: the run proceeds,
    the approver is asked exactly once, the file lands. The zero-count is the discriminating assertion
    — a refusal implemented after the response arrives would produce the same message and one call each.'
  - '`cargo test --test model_approver` exit 0, 7 passed; `--test agents` 5 passed, the regression on
    the tree entry the refusal was added to.'
- id: US-IO-HARNESS-0.42.0-T04
  summary: Add `at` and `tools` to the `[[hook]]` table with exactly-one-of `at`/`on` validation and a
    named value list, add `OnFailure::Refuse`, and keep the project-scope refusal covering the new keys
    inside a `[profile]` too.
  why_required: A lifecycle hook has to be expressible and validated before anything can consult it, and
    the trust rule has to be extended in the same change that creates the thing it must cover.
  status: todo
  depends_on: []
  acceptance_criteria:
  - '**F6 — the trust rule is extended, never weakened.** The same table in a project-scoped `io.toml`
    fails to load with the existing "may not declare hooks" error — and so does the same table nested
    inside a `[profile]`, which is where the boundary has been widened by accident before. The identical
    file at user or local scope loads. Sabotage: accept `at` tables at project scope on the grounds that
    they only *stop* things, under which both refusal arms fail.

    '
  files:
  - src/hooks.rs
  - src/config.rs
  - tests/tool_hooks.rs
  evidence: []
- id: US-IO-HARNESS-0.42.0-T05
  summary: Consult a matching `before_tool` hook in `prepare_read` before the call executes, capture its
    first line of stdout as the refusal reason, report the refusal through `EventKind::Refused`, and install
    the tables with `TaskContract::with_tool_hooks`.
  why_required: 'This is the capability itself: without the consult in the shared serial policy phase,
    an operator''s table is a file nothing reads. It is also where the release''s interaction with 0.41.0''s
    batch is settled.'
  status: todo
  depends_on:
  - US-IO-HARNESS-0.42.0-T04
  acceptance_criteria:
  - '**F5 — a `before_tool` hook refuses a call, from a config file, with no Rust written.** An `io.local.toml`
    carrying `at = "before_tool"`, `tools = ["write_file"]` and a `run` argv that exits non-zero, installed
    with `TaskContract::with_tool_hooks(config.hooks())`. The completion''s `write_file` leaves the target
    byte-identical on disk and **no** `Edit` row; the model''s observation carries the hook''s own first
    line of stdout as the reason; the run continues to its next step rather than ending. Sabotage: consult
    the hook after the tool has run, under which the file has changed and this fails.

    '
  - '**F7 — `on_failure` decides the consequence, and a `before_tool` hook defaults to refusing.** Four
    tables identical but for `on_failure`: absent and `"refuse"` both leave no `Edit` row and the run
    continuing; `"cancel"` ends the run `RunOutcome::Cancelled` at the step boundary with the earlier
    calls'' rows intact; `"continue"` lets the call execute despite the non-zero exit and the `Edit` row
    appears. Sabotage: default a `before_tool` hook to `Continue`, under which the first arm''s write
    lands.

    '
  - '**N4 — 0.41.0''s batch survives the gate.** With a `before_tool` hook whose `tools` filter names
    `read_file`, three read-only tools sharing a barrier still rendezvous inside the bound — the hook
    is spawned in the serial policy phase and the read work still runs concurrently. And with a hook filtered
    to `write_file`, a completion of twenty reads spawns the hook **zero** times, counted by the hook
    itself. Sabotage: run the gate inside the concurrent phase, or ignore the `tools` filter, and one
    arm each fails.

    '
  - '**N5 — a hook cannot hang a run.** A `before_tool` hook whose argv sleeps past its `timeout_ms` is
    killed at the deadline and takes its `on_failure` path, exactly as an event hook does. The test asserts
    the run finishes inside a bound comfortably under the sleep. The existing `wait_bounded` poll is what
    makes this true; it is asserted rather than assumed because a hook on the tool path is spawned far
    more often than one on an event.

    '
  files:
  - src/hooks.rs
  - src/contract.rs
  - src/run.rs
  - src/lib.rs
  - tests/tool_hooks.rs
  evidence: []
- id: US-IO-HARNESS-0.42.0-T06
  summary: Add `FileChange`, `ChangeReview` and the defaulted `Reviewer::review_change`, build the change
    from the 0.28.0 restore points, and override it in `ModelReviewer` so the reviewing prompt carries
    the change.
  why_required: The review criterion answers from post-change contents today, which cannot show a deletion.
    Without this the release's third capability does not exist, and the criterion keeps being answered
    from the wrong evidence.
  status: todo
  depends_on: []
  acceptance_criteria:
  - '**F8 — the reviewer is handed the change, and the change contains what was deleted.** A recorded
    case whose run deletes a distinctive line from an existing file and adds another, with a fixture reviewing
    provider that records its prompt. The prompt contains **the deleted line**, which the file''s current
    contents provably do not; it contains the added line; a file the run created appears with no before;
    and a file the run never touched does not appear at all. Sabotage: build `before` from a second read
    of the current contents, under which the deleted line is absent and only this criterion fails.

    '
  - '**F9 — a reviewer that overrides nothing still receives the outcome.** A `Reviewer` impl byte-identical
    to one written against 0.41.0 — `review` only — is called for a `Verification::Review` criterion and
    receives a `ReviewRequest` whose `files` are the written files with their current contents, exactly
    as today, and its verdict decides the gate. Sabotage: make the default `review_change` return a failing
    verdict instead of forwarding, under which this fails while F8 passes.

    '
  files:
  - src/verify.rs
  - src/state.rs
  - src/run.rs
  - src/lib.rs
  - tests/review_change.rs
  evidence: []
- id: US-IO-HARNESS-0.42.0-T07
  summary: 'Bump to 0.42.0 and bring the checked-in doc surfaces with it: `docs/CONTRACT.md`, the tool
    and approval guide pages, `CHANGELOG.md` and `docs/public-api.txt`, each new public item carrying
    a worked doctest.'
  why_required: The documentation is part of the release rather than an afterthought, and three of the
    release's guarantees — what a model approver may decide, where a lifecycle hook is refused, and which
    reviewers see the change — exist for an embedder only if they are written down.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.42.0-T03
  - US-IO-HARNESS-0.42.0-T05
  - US-IO-HARNESS-0.42.0-T06
  acceptance_criteria:
  - '**N3 — no public break.** Every item is added; none is removed or altered. `ReviewRequest`, `Request`
    and `Decision` are untouched, both new trait methods are defaulted, and the new `TaskContract` field
    sits on a `#[non_exhaustive]` struct. A consumer that upgrades and changes nothing compiles and behaves
    identically. `docs/public-api.txt` gains the lines **its checker can see** — the crate-root re-exports
    `ApprovalContext`, `ModelApprover`, `ChangeReview` and `FileChange` — and not the trait methods or
    the struct field, which are members of already-listed items. Stated this way at plan time because
    the same criterion has been met "in a different form" three releases running.

    '
  - '**O3 — the documentation gates pass**: the nightly rustdoc gate, the intra-doc link rules, and the
    checked-in doc surfaces (`docs/public-api.txt`, `CAPABILITIES.md`, the guide index, `CHANGELOG.md`)
    consistent with the code in the same commit range.

    '
  files:
  - Cargo.toml
  - Cargo.lock
  - CHANGELOG.md
  - README.md
  - docs/CONTRACT.md
  - docs/public-api.txt
  - docs/guide/tools-and-skills.md
  evidence: []
- id: US-IO-HARNESS-0.42.0-T08
  summary: 'Run the release''s own gates: the full suite in both feature polarities, clippy, fmt, the
    nightly rustdoc gate, MSRV 1.95, `cargo tree`, the cross-version stores, and one sabotage per arm
    of every two-armed claim.'
  why_required: A criterion nobody tried to break is a criterion nobody has tested. The sabotage pass
    and the platform matrix are what turn the contract's claims into evidence the record can cite.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.42.0-T07
  acceptance_criteria:
  - '**N1 — no new dependency.** `cargo tree` for the default feature set has the same number of crates
    as 0.41.0. The approver needs a `Provider`, which is the crate''s own trait; the hook needs `std::process`,
    which 0.28.0 already spawns through.

    '
  - '**N2 — MSRV unmoved.** The crate builds on 1.95 with the toolchain gate CI already runs.

    '
  - '**O1 — the full suite passes on all three platforms**, which is what the standing CI matrix already
    runs. Load-bearing rather than routine here: the hook spawns a child per matching call, and the fixture
    hook must be an argv that exists on macOS, Ubuntu **and** Windows — the same portability problem 0.28.0''s
    hook tests solved, solved the same way rather than with a shell script that silently skips.

    '
  - '**O2 — no store migration.** `CHECKPOINT_FORMAT` unmoved, no table, column or index added or altered,
    `git diff main -- src/state.rs` confined to whatever making `Store::snapshot` reachable from the review
    path requires and containing no DDL. A 0.41.0 store opens and resumes under 0.42.0 unchanged, asserted
    by the cross-version tests that already read the 0.22.0 and 0.29.0 fixture stores.

    '
  files:
  - tests/model_approver.rs
  - tests/tool_hooks.rs
  - tests/review_change.rs
  evidence: []
