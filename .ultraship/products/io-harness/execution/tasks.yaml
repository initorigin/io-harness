  - '**F9 - the documentation sweep is against the releases, not against a feeling.** Every capability
    shipped by 0.30.0 through 0.36.0 is checked for a mention on its guide page and in `docs/CAPABILITIES.md`,
    and every `known_limitations` entry in `docs/CONTRACT.md` is checked against the release that would
