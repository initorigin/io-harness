  - id: US-IO-HARNESS-0.17.0-T13
    summary: >
      Hold the standing non-functional constraints: the default dependency tree, no new system
      package, an untouched store, the full suite green on three platforms, and a clean clippy,
      fmt and doc build.
    why_required: >
      Each of these is a promise a consumer already relies on. A release that adds a TOML parser,
      bumps the checkpoint format, or leaves Windows red breaks something nobody asked to have
      broken, and none of it is visible from the functional criteria.
    status: done
    depends_on:
      - US-IO-HARNESS-0.17.0-T02
      - US-IO-HARNESS-0.17.0-T05
      - US-IO-HARNESS-0.17.0-T09
    acceptance_criteria:
      - >
        NF1 — the default dependency tree does not grow. `cargo tree` on the default build stays at 401
        lines. The toolchain table is shipped as Rust data or as JSON parsed by the `serde_json` already
        in the tree, because adding a TOML parser here would break the standing constraint a release
        early, and the configuration release is where that dependency belongs.
      - >
        NF2 — no new system package on any CI runner. The suite runs on the toolchains GitHub's runners
        already provide and skips, with a stated reason, any ecosystem check whose toolchain is absent,
        rather than installing one.
      - >
        NF3 — the store is untouched. No table is added or altered, and `CHECKPOINT_FORMAT` stays 7, so
        a 0.16.2 database opens and resumes against 0.17.0 unchanged.
      - >
        NF4 — the full suite passes on macOS, Linux, and Windows. `exec` has a Windows path and its
        tests either run there or are skipped with a stated reason; the Windows leg's `timeout-minutes`
        stays at the 40 set in 0.16.0.
      - >
        NF5 — `cargo clippy --all-targets --all-features -- -D warnings` and `cargo fmt --check` pass,
        and `cargo doc --all-features` is warning-free.
    files:
      - Cargo.toml
      - .github/workflows/ci.yml
    evidence:
      - >
        NF1 — `cargo tree | wc -l` on the default build is 401, unchanged. The toolchain table is
        Rust data and the only new code depends on tokio::process and serde, both already in the
        tree; no TOML parser was added.
      - >
        NF2 — no system package is installed by any job. F8 uses node and npm, preinstalled on all
        three runner images, and skips with a stated reason where they are absent. F1-F5 use rustc,
        which is present wherever cargo test runs. The nightly docs job installs a toolchain, not a
        package.
      - >
        NF3 — no CREATE TABLE, no ALTER, and CHECKPOINT_FORMAT is still 7 (src/state.rs:74). The
        one trace addition is a new `kind` VALUE in the existing sandbox_events table, which a
        0.6.0-era store takes with no migration.
      - >
        NF4 — GitHub Actions run 30415977056 on feat/0.17.0: test (ubuntu-latest), test
        (macos-latest) and test (windows-latest) all green, alongside msrv, lint and the new docs
        job. The Windows leg's timeout-minutes is still the 40 set in 0.16.0. exec's Windows path
        is the same tokio::process code; its timeout test spells the sleep as `ping -n` there.
      - >
        NF5 — `cargo clippy --all-targets --all-features -- -D warnings` and `cargo fmt --check`
        both exit 0, and `cargo doc --all-features` is warning-free. 35 test suites pass, 0 fail.
  - id: US-IO-HARNESS-0.17.0-T14
    summary: >
      Perform a live run against a real non-Rust project before the release is cut, and keep its
      trace as evidence.
    why_required: >
      The suite proves the mechanism; only a live run proves the claim in
      `outcome.evidence_of_value`. Every previous release of this crate that skipped a live run
      shipped a defect only a live run would have found — 0.8.0's macro-shadowing bypass and
      0.8.1's private-item regression were both found this way.
    status: done
    depends_on:
      - US-IO-HARNESS-0.17.0-T03
      - US-IO-HARNESS-0.17.0-T04
      - US-IO-HARNESS-0.17.0-T05
      - US-IO-HARNESS-0.17.0-T10
    acceptance_criteria:
      - >
        OP5 — a live run against a real non-Rust project is performed by hand before the release is cut,
        and its trace is kept as evidence. The suite proves the mechanism; only a live run proves the
        claim in `outcome.evidence_of_value`.
    files:
      - examples/exec_live.rs
    evidence:
      - >
        OP5 — examples/exec_live.rs, with the full trace kept at
        .ultraship/evidence/0.17.0/live-run-node-project.txt. A JavaScript package with one real
        npm dependency and one real bug, a model told nothing about the toolchain, and the
        project's own `npm test` as the gate.
      - >
        The run (openrouter, openai/gpt-5.6-luna, node v24.15.0, npm 11.12.1): explored with find,
        read the three files, ran `npm install` through exec against the real registry, ran `npm
        test` and got exit 1, re-read the file, then fixed it with a one-line edit_file replacement
        — `let total = 1;` to `let total = 0;`. Success in 6 steps, 8,951 tokens. No Rust is on
        that path anywhere, which is the claim in outcome.evidence_of_value.
      - >
        The gate is not gameable in this run: test.js is denied by the policy, and the example
        asserts after the fact that the suite it was judged against is byte-identical to the one it
        started with.
      - >
        The first attempt found a real defect in the shipped toolchain table — `npm ci` as the
        install default, which fails without a lockfile — which is exactly what a live run is a
        release criterion for. Fixed, and the re-run installs first try.
