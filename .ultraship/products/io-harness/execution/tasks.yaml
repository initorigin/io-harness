product: io-harness
version: 0.23.0
tasks:
  - id: US-IO-HARNESS-0.23.0-T01
    summary: >
      Move the dependency: `rusqlite` 0.32 to 0.40.1 with `bundled`, plus the `fallible_uint` feature
      that carries the `u64` `ToSql`/`FromSql` impls from 0.38.0 onward. Record the `cargo tree` line
      count either side and re-check the MSRV against the 1.88 floor.
    why_required: >
      This is the release. Everything else in it exists to prove this move changed no behaviour, and
      nothing else can be attempted until the crate compiles against the new line.
    status: done
    depends_on: []
    acceptance_criteria:
      - >
        NF2 — no new direct dependency. Whatever the tree gains transitively through `rusqlite` is
        recorded as a `cargo tree` line count before and after, in the changelog, per the discipline this
        project has kept since 0.1.0.
      - >
        OP1 — MSRV is re-checked and stated. If `rusqlite` 0.40 or anything it pulls raises the floor
        above 1.88, the new number goes in `Cargo.toml` with the same honest comment the existing floor
        carries, naming which dependency set it.
    files:
      - Cargo.toml
      - Cargo.lock
    evidence:
      - >
        `rusqlite` 0.32 to 0.40.1, `libsqlite3-sys` 0.30.1 to 0.38.1, bundled SQLite 3.46.0 to 3.53.2.
        0.40.1 was the newest published when development started, per the owner's newest-at-development
        decision; 0.40 was the floor, not the target.
      - >
        The migration is two manifest lines and **no change in `src/state.rs`**. The bump produced 28
        compile errors, all one root cause: `u64`'s `ToSql`/`FromSql` impls moved behind a new
        `fallible_uint` feature in `rusqlite` 0.38.0. Enabling it restores the same macro-generated
        impls, so the checked conversions are preserved exactly rather than replaced by a cast.
        `cargo check --all-targets` is clean.
      - >
        NF2 — no new direct dependency. `cargo tree` 407 lines before, **402 after**. `ahash`,
        `hashbrown` 0.14.5, `zerocopy` and the `version_check` build dependency drop out; `foldhash`
        0.2.0 arrives; `hashlink` 0.9.1 to 0.12.1. Measured on the same machine by stashing the
        manifest, not quoted from a previous release.
      - >
        OP1 — the MSRV moved and is stated. `libsqlite3-sys` 0.38.1's build script and `rusqlite`
        0.40's source call the std `cfg_select!` macro, stabilised in 1.95.0, and neither crate
        publishes a `rust-version`. Verified by hand rather than assumed: `cargo +1.93` and
        `cargo +1.94` both fail inside the build script with
        `cannot find macro cfg_select in this scope`, `cargo +1.95` builds. `rust-version = "1.95"` in
        `Cargo.toml` with the reason and the dependency that set it, and matching text in `README.md`,
        `src/lib.rs` crate-root docs and `docs/CONTRACT.md` — all three checked by
        `tests/docs_drift.rs::msrv_is_stated_and_matches_cargo_toml`, which passes.
      - >
        No `rusqlite` at or above the contract's 0.40 floor avoids the MSRV move, so the choice was the
        floor or the release. Recorded because it is the one place this release makes a consumer's life
        harder, and the contract's `risks` anticipated it.

  - id: US-IO-HARNESS-0.23.0-T02
    summary: >
      Prove a database written by 0.22.0 is fully readable by 0.23.0, through the public `Store` API,
      with a fixture generated by a genuinely pinned 0.22.0 build rather than written by this release
      and labelled.
    why_required: >
      The engine moves seven point releases and the compiler cannot check any of it. Reading back a
      previous release's stored rows is the only evidence that the move preserved what is on disk.
    status: done
    depends_on: [US-IO-HARNESS-0.23.0-T01]
    acceptance_criteria:
      - >
        F2 — a database written by the previous release is fully readable by this one. A store populated
        by 0.22.0 with runs, steps, refusals, approvals, budget draws, citations and server-tool calls is
        opened by 0.23.0 and every row read back identical, through the public `Store` API rather than by
        inspecting the file. The negative control is a store this release creates from scratch, which
        must be byte-comparable in schema to one 0.22.0 creates.
    files:
      - tests/cross_version.rs
      - tests/fixtures/store-0.22.0/
    evidence:
      - >
        The fixtures are genuinely the previous release's. `tests/fixtures/gen-0.22.0` is pinned
        `io-harness =0.22.0` and its committed lockfile resolves `rusqlite` 0.32.1 and `libsqlite3-sys`
        0.30.1. All three `.sqlite3` headers read `SQLite version 3046000` — 3.46.0, the old engine,
        not the 3.53.2 this release links. `PRAGMA integrity_check` is `ok` on all three and no WAL
        sidecar was left behind.
      - >
        F2 — `a_0_22_0_store_reads_back_row_for_row_through_the_public_api` passes. It builds a value
        from the public `Store` readers alone and compares key-by-key against the sidecar 0.22.0 wrote:
        outcome, status, step count, last step, spent tokens, checkpoint events, every step
        (number/decision/tokens), every provider call (step, attempt, provider, model, finish reason,
        failure and all seven `Usage` counters), every observation, the edit, both policy events
        including the refusal, the resolved pending approval, both citations — including the one with
        two NULL columns — and both server-tool calls. The comparison is driven by the sidecar's own
        key set and counts are checked both ways, so a table added later fails the test rather than
        going unread.
      - >
        F2 negative control — `the_schema_this_release_creates_is_identical_to_the_one_0_22_0_created`
        passes. `sqlite_master` from a store this release creates equals the fixture's normalised
        `CREATE TABLE`/`CREATE INDEX` set, with a length guard so an empty set cannot match an empty
        set.
      - >
        Two values are not asserted and the omission is checked rather than silent: `runs.goal` has no
        public reader and `RunSummary` carries no `goal`, and the sidecar's `workspace` is the
        generator's own relative directory, which is not where the test's copy lives. Both sit in a
        named constant in the test so they cannot be forgotten.

  - id: US-IO-HARNESS-0.23.0-T03
    summary: >
      Resume a run across the version boundary: interrupted under 0.22.0 mid-tree, finished under
      0.23.0, with no completed step re-run, the ledger totalling what the two halves drew, and no
      irreversible action taken twice. The 0.7.0 kill-9 test re-pointed, not rewritten.
    why_required: >
      This is the one failure shape the release can produce that compiles, passes the unit tests, and
      still damages a user's data. Review cannot catch it; only this can.
    status: done
    depends_on: [US-IO-HARNESS-0.23.0-T02]
    acceptance_criteria:
      - >
        F3 — a run checkpointed by the previous release resumes across the boundary. A run interrupted
        under 0.22.0 mid-tree, with a completed sub-agent, an in-flight step and a partially drawn
        budget, is resumed by 0.23.0 to completion: no completed step re-runs, the ledger's total matches
        what the two halves drew between them, and an irreversible action already taken is not taken
        twice. This is the 0.7.0 crash test with the two halves on either side of the version boundary,
        which is the only form of it that proves anything here.
    files:
      - tests/cross_version.rs
      - examples/crash_fixture.rs
    evidence:
      - >
        F3 — `a_0_22_0_interrupted_tree_resumes_without_re_running_or_double_charging` passes. The
        pre-resume state is asserted against `interrupted.json` first (tree ids 1/2/3, agent count 3,
        root step-capped at step 1, child 2 completed at 80 tokens, child 3 step-capped at 160, tree
        total 400, and both workspace file contents), so the test is anchored to what 0.22.0 stored
        rather than to whatever it finds.
      - >
        After `resume_tree`: verified success; no run in the tree has a duplicate step number; the
        child that had already finished gained neither a step nor a token; the tree total equals
        `400 + served * 25`, where `served` is the resume provider's own call counter living outside
        the database, so the ledger is checked against an external witness rather than against itself;
        `a.txt` still holds exactly one copy of `ALPHA`; `b.txt` reaches `BETA`; and a `resume`
        checkpoint event exists.
      - >
        Non-vacuity proven, not assumed. A provider rewired to report double tokens fired
        `the tree's total must be what 0.22.0 drew plus exactly what this release drew` (500 against
        450), and bumping the finished child's step baseline fired
        `the child that had already finished gained a step on resume`. Both were reverted and the file
        re-confirmed green.
      - >
        Gap recorded rather than glossed: 0.22.0 committed the step-capped root step, so on resume the
        coordinator replans instead of replaying the fan-out, and `Store::find_spawn` has nothing to
        adopt at that step. This fixture therefore does NOT exercise the adopt-a-completed-child path.
        It makes the no-re-run assertions stronger — the finished child is proven untouched by its own
        rows and its own file rather than by trusting adoption to skip it — but it is a different
        proof. `tests/checkpoint.rs` covers adoption within a single release.

  - id: US-IO-HARNESS-0.23.0-T04
    summary: >
      Resolve, under 0.23.0, an approval that 0.22.0 deferred past process exit, and let the run
      continue.
    why_required: >
      The approval record is the crate's one durable human decision. If it does not survive a dependency
      upgrade the permission boundary is not durable, whatever the trace says.
    status: done
    depends_on: [US-IO-HARNESS-0.23.0-T02]
    acceptance_criteria:
      - >
        F4 — a pending approval survives the boundary. An approval deferred past process exit under
        0.22.0 is resolved under 0.23.0 and the run continues, because a durable decision that does not
        survive a dependency upgrade is not durable.
    files:
      - tests/cross_version.rs
    evidence:
      - >
        F4 — `a_0_22_0_deferred_approval_is_resolved_here_and_the_run_continues` passes. Before the
        resume, `Store::pending(1)` returns the row 0.22.0 left behind with `resolved == None` and the
        act, target, content and step from the sidecar, and `out.txt` does not exist — the deferred
        write genuinely did not happen. It is then resolved through `resume_with_decision` with
        `Decision::Approve` under the generator's own `ask_write("out.txt")` policy: the run reaches
        `Success`, the pending row reads `resolved == Some("approve")`, `out.txt` holds `DONE\n`, and
        the run's status is `completed`.
      - >
        Non-vacuity proven: flipping the decision to `Decision::deny(...)` fired
        `the run must continue to a terminal outcome once the approval is resolved: Denied { steps: 1 }`.
        Reverted and re-confirmed green.

  - id: US-IO-HARNESS-0.23.0-T05
    summary: >
      The consumer-side build check: a fixture crate depending on both `io-harness` and `rusqlite` 0.40
      that must build against 0.23.0 and must fail against 0.22.0 with cargo's `links` diagnostic, kept
      in the repository and run in CI.
    why_required: >
      The wall this release exists to remove is a resolver error in someone else's build, which nothing
      inside this crate's own test suite can observe. Without this the release's central claim is
      asserted rather than checked.
    status: done
    depends_on: [US-IO-HARNESS-0.23.0-T01]
    acceptance_criteria:
      - >
        F1 — the collision is gone, and its absence is checkable rather than asserted. A fixture crate
        declaring both `io-harness 0.23.0` and `rusqlite 0.40` builds and runs a trivial harness call.
        The negative control is the same fixture against `io-harness 0.22.0`, which must fail with
        cargo's own `links` diagnostic naming `sqlite3`, and that diagnostic is quoted verbatim in the
        changelog so a reader knows the exact error this release retires.
      - >
        OP3 — the fixture crate from F1 is committed and runs in CI, so the property survives the next
        dependency bump instead of being re-discovered by a consumer.
    files:
      - tests/fixtures/links-consumer/
      - .github/workflows/ci.yml
      - Cargo.toml
    evidence:
      - >
        F1 positive — `tests/fixtures/links-consumer` declares `rusqlite = "0.40"` with `bundled` AND
        `io-harness` by path. `cargo run` in it prints
        `links-consumer OK: rusqlite 0.40 and io-harness share one libsqlite3-sys (sqlite 3.53.2)`.
        It is run rather than only built, because coexistence is a claim about one process: the binary
        opens a connection through its own `rusqlite` and a `Store` through the crate's, over the same
        linked `libsqlite3-sys`.
      - >
        F1 negative control — the same fixture against `io-harness = "=0.22.0"` fails at resolution,
        exit 101, before anything compiles, with cargo naming `libsqlite3-sys` links to the native
        library `sqlite3`, but it conflicts with a previous package which links to `sqlite3` as well.
        The diagnostic is quoted verbatim in the 0.23.0 changelog entry, as the contract requires.
      - >
        OP3 — a `links-consumer` job added to `.github/workflows/ci.yml`, ubuntu-latest, 20 minutes.
        It runs the positive control, then rebuilds the fixture against 0.22.0 in `RUNNER_TEMP` and
        **fails the job if that build succeeds**. It also refuses to accept any failure: cargo's output
        must name both `links` and `sqlite3`, so a network blip or a yanked version cannot pass as the
        expected failure. YAML parses; jobs are test, msrv, lint, links-consumer, docs. All 15 `uses:`
        lines resolve to the three full 40-character SHAs already present in the file — no new action
        and no new SHA was introduced.

  - id: US-IO-HARNESS-0.23.0-T06
    summary: >
      Assert directly that `CHECKPOINT_FORMAT` is still 7 and that no migration runs on a store the
      previous release wrote.
    why_required: >
      A silent format bump would let a broken upgrade present itself as a successful one. The existing
      assertion covers a fresh store; this release needs it against a 0.22.0 store.
    status: done
    depends_on: [US-IO-HARNESS-0.23.0-T02]
    acceptance_criteria:
      - >
        F5 — `CHECKPOINT_FORMAT` is still 7 and no migration runs. Asserted directly, so that a silent
        format bump cannot pass as a successful upgrade.
    files:
      - tests/cross_version.rs
      - tests/checkpoint.rs
    evidence:
      - >
        F5 — `the_checkpoint_format_is_still_7_and_opening_a_0_22_0_store_migrates_nothing` passes.
        `CHECKPOINT_FORMAT == 7`, and for each of the three 0.22.0 fixtures `PRAGMA user_version` reads
        7 before `Store::open` and 7 after, with `sqlite_master` captured either side of the open and
        required to be unchanged. That pair is what "no migration ran" has to mean here: not that the
        constant is still 7, but that opening an old store did not quietly rewrite it.
      - >
        No schema change anywhere in the release. `from_conn`'s `CREATE TABLE IF NOT EXISTS` batches
        are untouched, and the F2 negative control independently requires the schema this release
        creates to equal 0.22.0's.
      - >
        Non-vacuity proven twice. Stamping a fixture copy to `user_version = 6` fired the pre-check
        (`populated.sqlite3 was stamped at 6 by 0.22.0`); stamping it to 6 *and* relaxing the pre-check
        so the open really would migrate fired
        `opening populated.sqlite3 changed its checkpoint format — a migration ran`. Both reverted.

  - id: US-IO-HARNESS-0.23.0-T07
    summary: >
      Document the one break: the `BREAKING` changelog entry with a migration note for
      `Error::State(#[from] rusqlite::Error)`, the `docs/public-api.txt` check, the `CONTRACT.md` entry
      stating the intent to wrap `rusqlite::Error` in a later release, and the quoted `links`
      diagnostic.
    why_required: >
      The break is real for any consumer matching `Error::State(e)`, and the release notes are taken
      verbatim from the changelog. An undocumented break is the same thing as an unannounced one.
    status: done
    depends_on: [US-IO-HARNESS-0.23.0-T05]
    acceptance_criteria:
      - >
        F6 — the break is exactly one and it is documented. `Error::State` carries the 0.40 error type;
        the changelog carries a `BREAKING` entry with a migration note saying what to write instead; and
        the enumerated public API in `docs/public-api.txt` reflects it. Any second break discovered
        during development is either eliminated or documented to the same standard — not absorbed
        quietly.
    files:
      - CHANGELOG.md
      - docs/CONTRACT.md
      - docs/public-api.txt
    evidence:
      - >
        F6 — the break is exactly one, and it is the one the contract predicted: `Error::State` carries
        `rusqlite` 0.40's error type. No second break was discovered. The 28 compile errors were all
        the `fallible_uint` feature move and none of them reached a public signature; `src/` is
        unchanged apart from the MSRV sentence in the crate-root docs, and `tests/public_api.rs` passes
        against an unedited `docs/public-api.txt`.
      - >
        The changelog carries the `**BREAKING**` entry with a `*Migration:*` note showing both the
        manifest change and the two match shapes — the one that is unaffected and the one that is not —
        plus a second `**BREAKING (MSRV)**` entry for the 1.88 to 1.95 move with its own migration note
        saying plainly that there is no opt-out and no version of the dependency that avoids it.
        `tests/changelog.rs` passes, which is what enforces that every marked break carries a note.
      - >
        `docs/public-api.txt` needed no edit, and the reason is recorded rather than left as an
        apparent omission: the snapshot enumerates re-exported *names* as `<kind> <name> <file>`, so it
        holds `enum Error src/error.rs` and stops there. A variant's payload type is not a line in that
        file and never will be. Writing one in would have corrupted the format the drift test checks.
      - >
        So the fact went where it can actually be read. `docs/CONTRACT.md`'s "What is public" now
        states outright that `rusqlite` is a **public dependency** of this crate and that a `rusqlite`
        major bump is therefore a public API change here whether or not behaviour moves — which is
        exactly what 0.23.0 was. "Limits that hold today" carries the intent to wrap the type in a
        later release, with the two match shapes spelled out so a consumer writing code today knows
        which one survives.

