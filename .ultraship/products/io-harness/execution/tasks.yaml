product: io-harness
version: 0.43.0
tasks:
- id: US-IO-HARNESS-0.43.0-T01
  summary: Add the `summaries` table, its `(run_id, through_step)` index, `Summary`, `Store::put_summary`
    and `Store::summaries`, and extend the cross-version lists.
  why_required: 'Every compaction claim rests on the summary being durable: a resumed run must re-read
    it rather than pay for it again, and the transcript renders it. The row must exist before anything
    writes one, and the additive-migration criterion is asserted against this DDL and no other.'
  status: done
  depends_on: []
  acceptance_criteria:
  - '**O2 — the store migration is additive and proven so.** One new table and one new index, `CHECKPOINT_FORMAT`
    unmoved at 7, no existing table, column or index created or altered, `git diff main -- src/state.rs`
    containing exactly that DDL and its reader. A 0.42.0 store opens, resumes and rewinds under 0.43.0,
    and a 0.43.0 store opens under a 0.42.0 binary, asserted by the cross-version tests that already read
    the 0.22.0 and 0.29.0 fixture stores. `ADDED_SINCE_0_22_0` and `COLUMNS_ADDED_SINCE_0_22_0` (`tests/cross_version.rs:149`,
    `:233`) updated in the same commit as the DDL.

    '
  files:
  - src/state.rs
  - src/lib.rs
  - tests/cross_version.rs
  - tests/summaries.rs
  evidence:
  - '`summaries (id, run_id, through_step, kept_from, text, est_tokens, at)` and `CREATE INDEX summaries_run
    ON summaries (run_id, through_step)` added in `Store::open`''s DDL batch, immediately before the
    `CHECKPOINT_FORMAT` stamp. `text` is deliberately in no index — the control column, the same shape
    `gate_attempts.detail` and `runs.finish_reason` use.'
  - '`Summary` is `#[non_exhaustive]` in `src/state.rs`, re-exported from `src/lib.rs`, with `Store::put_summary`,
    `Store::summary_at` (newest row at a boundary wins) and `Store::summaries` (per run, oldest first).'
  - '`ADDED_SINCE_0_22_0` (`tests/cross_version.rs`) gains `summaries` and `summaries_run`. `COLUMNS_ADDED_SINCE_0_22_0`
    is unchanged: no table is altered.'
  - '`cargo test --test summaries` exit 0, 6 passed: round trip, a neighbouring step is not the boundary,
    a corrected fold reads back as the correction while both rows survive, per-run isolation and ordering,
    an unfolded run is empty, and `CHECKPOINT_FORMAT == 7`.'
  - '`cargo test --test cross_version` exit 0, 5 passed — including `the_schema_this_release_creates_adds_to_0_22_0s_and_alters_none_of_it`
    and `the_checkpoint_format_is_still_7_and_opening_a_0_22_0_store_alters_nothing`, which are O2''s
    migration half and pass over the new DDL.'
- id: US-IO-HARNESS-0.43.0-T02
  summary: Add `Compaction`, `TaskContract::compaction` and `with_compaction`, and `EventKind::Compacted`,
    with the event census and `EVENT_NAMES` updated in the same commit.
  why_required: The knob decides when a fold happens and is the one-line return to 0.42.0's behaviour
    the changelog promises; the event is how an operator sees a fold at all. Both are needed before the
    helper that reads them exists.
  status: done
  depends_on:
  - US-IO-HARNESS-0.43.0-T01
  acceptance_criteria:
  - '**F2 — under the threshold, nothing happens and nothing is spent.** The same run with `at_share:
    1.0`, and separately with a ledger that never crosses the share: zero `summaries` rows, zero `Compacted`
    events, and the counting provider records exactly the completions the steps required. Byte-for-byte,
    the requests are 0.42.0''s. Sabotage: fold every turn, under which the completion count is wrong and
    this fails while F1 still passes.

    '
  files:
  - src/context.rs
  - src/contract.rs
  - src/observe.rs
  - src/lib.rs
  - tests/compaction.rs
  evidence:
  - '`Compaction { at_share, keep_recent }` landed in `src/context.rs` beside `ContextBudget`, with
    `Default` (0.8 / 8), `enabled()`, `threshold_tokens(effective_tokens)` and `keep()`. Re-exported
    from `src/lib.rs`.'
  - 'Deliberately NOT `#[non_exhaustive]`, and the reason is recorded at the type: it is `ContextBudget`''s
    sibling and every caller and doctest writes `Compaction { .. ..default() }`, which `#[non_exhaustive]`
    refuses outside the crate with `E0639`. Found by the tests, not by reasoning — `tests/compaction.rs`
    failed to compile three times against the first version.'
  - '`TaskContract::compaction` + `with_compaction` added to the `#[non_exhaustive]` struct; both
    constructors default it, so an existing caller is unchanged in source and folds by default in
    behaviour.'
  - '`EventKind::Compacted { through_step, before_tokens, after_tokens }` added before `Finished`, with
    `EVENT_NAMES` gaining `"compacted"`, the `every_kind()` sample vector gaining an instance and the
    compile-time census arm naming it — the three-file bookkeeping a new variant owes.'
  - '`cargo test --test compaction` exit 0, 6 passed: the default folds and reaches a contract built the
    ordinary way; `at_share: 1.0` is 0.42.0 exactly and its threshold is unreachable; NaN, infinity,
    negative and zero all read as never rather than always; the threshold is derived from the same
    `effective_tokens` the assembler uses; `keep_recent: 0` floors at 1; and the config-file round trip
    refuses a misspelled key. This is F2''s threshold half — the run-level half is T03.'
  - '`cargo test --lib` exit 0, 388 passed, including `event_names_is_a_census_of_the_enum_rather_than_a_list_someone_maintained`
    and `every_variant_round_trips`, which are what prove the new variant''s bookkeeping complete rather
    than merely written.'
- id: US-IO-HARNESS-0.43.0-T03
  summary: Add the fold helper — threshold, summarising prompt, ledger edit and stored-row re-read — and
    call it from both loops immediately before `assemble`.
  why_required: This is the release's headline capability. It is also the shape most at risk of landing
    in one loop and not the other, or inside assembly, which is why it is one definition with two asserted
    call sites.
  status: done
  depends_on:
  - US-IO-HARNESS-0.43.0-T02
  acceptance_criteria:
  - '**F1 — a fold replaces the oldest observations with a written summary, and the next request carries
    it.** A run driven past the threshold with a fixture provider that records every request it receives.
    Two assertions, and the pair is what discriminates: the summarising request contains the text of an
    observation being folded, and the **next step''s** request contains a distinctive sentence from the
    summary while **not** containing a distinctive string that appeared only in a folded observation.
    Sabotage: fold by stubbing instead of summarising (today''s behaviour), under which the second assertion
    fails and every weaker one passes.

    '
  - '**F3 — the summary is stored once and re-read.** A run that compacts, is interrupted, and is resumed
    under the same run id: the counting provider shows the summarising model was called **once in total**,
    one `summaries` row exists with the `through_step` it covers, and the resumed run''s next request
    carries the same summary text. Sabotage: read the row but write a fresh summary anyway, under which
    the counter is two and only this fails.

    '
  - '**N4 — a fold costs one provider call and is visible where spend already is.** The summarising completion
    lands exactly one `provider_calls` row for the step it happened in, attributed to the run, and its
    tokens are inside `Store::spent_tokens` and inside the run''s token budget. Asserted by row count
    and by a budget tight enough that the summarising call is what exhausts it — a fold that spent money
    invisibly would be the one defect this release could ship without noticing.

    '
  - '**N5 — 0.41.0''s batch and 0.42.0''s gate are unaffected.** With compaction on, three read-only tools
    still rendezvous inside the bound and are still folded back in the model''s call order, and a `before_tool`
    hook is still consulted exactly once per call. The fold is in the serial phase before assembly and
    touches neither. Asserted rather than assumed, because a helper inserted into both loops is exactly
    where a regression to either would hide.

    '
  files:
  - src/context.rs
  - src/run.rs
  - tests/compaction.rs
  evidence:
  - '`compact_ledger` in `src/run.rs` is the one definition, called from both loops immediately before
    `assemble` — the flat workspace loop and the tree loop — and never from inside `assemble`, which
    still makes no provider call. It compares the ledger''s estimated tokens against `at_share ×
    effective_tokens`, folds all but `keep_recent` from the front, and returns the tokens it spent.'
  - 'The summarising call goes through `complete_with_retry`, the single choke point every completion
    uses, with `SUMMARY_SYSTEM` and no tools — so it lands one ordinary `provider_calls` row and is
    retried, traced and billed like everything else. Never streamed.'
  - 'A fold may only replace observations the store already holds: `count = (len - keep).min(written)`,
    where `written` is the durable watermark. Found by the tests, not by reasoning — the first version
    panicked in `persist_ledger` with "range start index 5 out of range for slice of length 4", because
    folding shrank the vector the watermark indexes into. The watermark moves with the fold.'
  - '`US-IO-HARNESS-0.43.0-I01`: the row is keyed on `folded` rather than on the step, and
    `restore_ledger` replays the stored folds. Both corrections came from F3 failing three different
    ways; see the iteration record.'
  - 'N4 caught the invisible spend it was written for. `Store::spent_tokens` sums `steps.tokens`, so a
    fold billed only in `provider_calls` was money the run''s own token budget never saw — 96 against
    120. The fold''s tokens now join the step''s total in both loops.'
  - 'An empty summary is not a fold: a summariser that returns no text leaves the ledger alone rather
    than replacing the notes with nothing. The call still happened and is still billed.'
  - '`cargo test --test compaction` exit 0, 11 passed. F1 is the discriminating pair — the summarising
    request contains the folded observation, and a later working request contains the summary''s own
    sentence and no longer contains a marker that appeared only in the folded text. F3 parks a
    completion forever, drops the run mid-step (the only interruption that leaves a run resumable —
    every clean stop, cancellation included, is terminal to `resume` by design) and resumes: the
    summarising model is called once in total and the paragraph is still in the request. N4 asserts one
    extra `provider_calls` row per fold, filed under the step it happened in, and `spent_tokens` equal
    to the sum over those rows.'
  - 'N5: the whole corpus is the control, because compaction is on by default and every suite now runs
    with it. `cargo test --tests --no-fail-fast` — 68 suites green, including `parallel_reads`
    (0.41.0''s batch) and `tool_hooks` (0.42.0''s gate). One existing test needed a line:
    `tests/context.rs`''s prompt-stabilisation test drives a positional script under a 1,000-token
    budget, where the fold now fires and inserts a completion the script cannot see coming — it sets
    `at_share: 1.0` and says why, because it is 0.13.0''s elision claim and the fold''s own
    stabilisation is asserted in `tests/compaction.rs`.'
  - '`cargo test --doc` exit 0, 388 passed; `cargo test --lib` exit 0, 388 passed;
    `cargo test --test public_api` exit 0 after `docs/public-api.txt` gained `Compaction` and
    `Summary` by hand.'
- id: US-IO-HARNESS-0.43.0-T04
  summary: Add `ProviderErrorKind::ContextOverflow` and `#[non_exhaustive]` to the enum, add `from_response`,
    and route the three built-in providers through it.
  why_required: An overflow is indistinguishable from any other 4xx today, so the recovery has nothing
    to branch on. This is the release's one public break and it is paid here, once, with the conservative
    classifier and its negative control.
  status: done
  depends_on: []
  acceptance_criteria:
  - '**F6 — classification is conservative and does not swallow a real 400.** A 400 with a message carrying
    none of the signatures stays `Request`, terminal, with no fold and no second attempt — the negative
    control that must not move. A 401 stays `Auth`, a 429 stays `RateLimited`, a 500 stays `Server`; `from_status`
    is asserted byte-identical in behaviour to 0.42.0''s over the whole status range it maps. Sabotage:
    classify any 400 as an overflow, under which the control run compacts and re-asks a request the server
    had already read and refused.

    '
  files:
  - src/error.rs
  - src/provider/mod.rs
  - src/provider/openai_wire.rs
  - src/provider/anthropic.rs
  - tests/overflow.rs
  evidence:
  - '`ProviderErrorKind::ContextOverflow` added, and `#[non_exhaustive]` on the enum in the same
    release — one break, paid once, the move four previous releases each made on a different type.
    `is_retryable()` returns false for it, and the doc says why that is the right answer rather than a
    compromise: re-sending bytes a server called too many cannot work, and the recovery is a different
    request.'
  - '`ProviderErrorKind::from_response(status, message)` added beside `from_status`, which keeps its
    exact signature and behaviour. Only a 400 or a 413 is eligible; the seven vendor signatures are a
    short list matched case-insensitively, documented as conservative on purpose.'
  - 'No per-vendor edit was needed. Every built-in provider builds its status failures through
    `Error::provider_status`, which is the single funnel — so OpenRouter, OpenAI and Anthropic cannot
    drift apart on what an over-window rejection is, and `src/provider/` is untouched by this task.'
  - '`cargo test --test overflow` exit 0, 6 passed. F6''s negative control is
    `an_ordinary_400_is_left_exactly_where_it_was` (four ordinary 400s, including an empty message,
    stay `Request`); `a_status_that_means_something_else_is_not_reclassified_by_its_wording` proves a
    429 carrying a signature verbatim is still a rate limit; and `from_status_behaves_exactly_as_it_did_on_0_42_0`
    asserts the old mapping over the whole 400..600 range rather than at a few points.'
- id: US-IO-HARNESS-0.43.0-T05
  summary: Answer a `ContextOverflow` by folding unconditionally and re-asking once, bounded at one recovery
    per step, in the same helper both loops call.
  why_required: Classification without recovery leaves the run dying exactly as it does today. The bound
    is what stops a pathological request looping, and it is the second caller the fold helper was built
    for.
  status: done
  depends_on:
  - US-IO-HARNESS-0.43.0-T03
  - US-IO-HARNESS-0.43.0-T04
  acceptance_criteria:
  - '**F4 — a context overflow is classified, and the run survives it.** A fixture provider that refuses
    any request over a byte threshold with the vendor wording, and serves one under it. The run finishes;
    the trace holds exactly one `Compacted` event and the failing attempt; and the request that succeeded
    is provably shorter than the one that failed. `ProviderErrorKind` on the failing attempt''s recorded
    error is `ContextOverflow` and not `Request`. Sabotage: re-ask without compacting, under which the
    second attempt hits the same refusal and the run escalates.

    '
  - '**F5 — the recovery happens once.** A provider that refuses **every** request whatever its size:
    the run escalates with `RunOutcome::Escalated { retryable: false, .. }` after exactly two completion
    attempts for that step and one fold, not a loop. The step row names both. Sabotage: remove the once-per-step
    bound, under which the attempt count grows past two.

    '
  files:
  - src/run.rs
  - tests/overflow.rs
  evidence:
  - 'Both loops now make at most two attempts at a step''s completion: the fold, the assembly, the
    request and the call are inside a `loop`, and a `ContextOverflow` on the first attempt sets
    `recovered` and continues. The recovery fold is unconditional — the threshold was guessing at what
    the vendor has now stated — and bounded at one per step.'
  - '`complete_with_retry` gained a `may_compact` parameter. Without it the recovery was unreachable:
    on a non-retryable failure the function records the escalation *and calls `finish`*, so the run was
    already marked escalated before the loop saw the error. With `may_compact`, an overflow the caller
    can answer is recorded as a step row and handed back without finishing the run; every other
    failure, and a second overflow, escalate exactly as on 0.42.0.'
  - 'The loop''s recovery arm and `may_compact` are guarded by the same condition, `!recovered &&
    contract.compaction.enabled()`. The first version guarded only the loop, so a caller with folding
    off got a second attempt on a run `complete_with_retry` had already finished — caught by
    `with_folding_off_an_overflow_is_terminal_at_once`, which counted two refusals where 0.42.0 makes
    one.'
  - 'The summarising call passes `may_compact: false`: a fold cannot be answered by folding. The
    single-file loop passes `false` too — it has no ledger, so an over-window request there is terminal
    exactly as it was.'
  - '`record_memory_recall` moved below the loop in both, so a recovered step writes one recall row
    rather than two.'
  - '`cargo test --test overflow` exit 0, 10 passed. F4 uses a provider that refuses any user block
    over a byte ceiling and serves anything under it, so the request that succeeded is provably smaller
    than the one refused — a recovery, not a re-send that got lucky — with a negative-control run under
    the ceiling that never folds. F5''s provider refuses every request whatever its size: exactly two
    refusals for the step, one fold, then an escalated run.'
  - '`cargo test --tests --no-fail-fast` — 72 suites green. Four `fleet` failures and one `plan_gate`
    failure on the way were a stale `target/debug/examples/` binary carrying the pre-rename `summaries`
    DDL under `CREATE TABLE IF NOT EXISTS`; `cargo build --examples` fixed them, which is the standing
    trap that `--tests` does not rebuild examples.'
  - '`cargo clippy --all-features --all-targets` clean. `tests/provider_failures.rs` needed the
    wildcard arm the `#[non_exhaustive]` break now requires — the same one-line migration a consumer
    writes — and it panics rather than defaulting, so a kind added later still cannot slip in without a
    decision about retrying it.'
- id: US-IO-HARNESS-0.43.0-T06
  summary: Add `Session::transcript`, `Transcript`, `TranscriptTurn` and `Transcript::to_markdown`, built
    from the whole session tree.
  why_required: A summary that replaces fifty observations is only honest if the fifty stay reachable,
    and today reading a conversation back means writing the SQL yourself. The whole tree rather than the
    head path is the half that cannot be recovered any other way.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.43.0-T01
  acceptance_criteria:
  - '**F7 — a transcript renders the whole tree, including what the model can no longer see.** A session
    of three turns, branched from the first, then one more turn. `Session::history` returns three; `Session::transcript`
    returns **four**, in id order, with the branched-away turn present and `on_path: false`. The markdown
    contains both turns'' prompts, and marks where a summary stands in for folded steps. Sabotage: build
    the export from `history()`, under which the fourth turn is missing and only this criterion fails.

    '
  - '**F8 — a transcript is a read.** The same export run against a counting provider that must record
    **zero** completions, on a session whose runs have already finished. Sabotage: summarise anything
    at export time, under which the counter is non-zero.

    '
  files:
  - src/session.rs
  - src/lib.rs
  - tests/transcript.rs
  evidence: []
- id: US-IO-HARNESS-0.43.0-T07
  summary: 'Add `Session::attach` under the `media` feature: stage images for the next turn, append them
    in `drive`, and clear the staging whatever the outcome.'
  why_required: The one path an operator would hand a screenshot to is the only one that cannot take it.
    One staging method covers all six turn shapes without a signature change or a seventh entry point.
  status: todo
  depends_on: []
  acceptance_criteria:
  - '**F9 — an image reaches the wire through a conversational turn.** `Session::attach` then `Session::turn`,
    over a fixture provider that records the `CompletionRequest` it received: the media is on the request.
    The same through `turn_observed`. The **next** turn, with no second `attach`, carries none — the staging
    is cleared. A `turn_bounded` whose contract already carries an image of its own carries both. Sabotage:
    keep the staging across turns, under which the second turn''s request carries an image nobody attached.

    '
  - '**F10 — a provider that does not accept images still refuses, and before anything is sent.** A turn
    with staged images over a provider whose `accepts_images` is false fails with the existing error from
    `ensure_media_accepted` (`src/run.rs:10286`), and the counting provider records zero completions.
    The refusal is 0.42.0''s, reached through a new door. Sabotage: attach after the media check, under
    which a request is sent that must not be.

    '
  files:
  - src/session.rs
  - tests/session_media.rs
  evidence: []
- id: US-IO-HARNESS-0.43.0-T08
  summary: 'Documentation: the four `docs/CONTRACT.md` guarantees, the guide pages, the `CHANGELOG.md`
    entry with its `*Migration:*` note, `docs/public-api.txt` by hand, and a worked doctest on every new
    public item.'
  why_required: The release notes are taken verbatim from the changelog, the migration note is the only
    warning a consumer matching `ProviderErrorKind` exhaustively gets, and the checked-in doc surfaces
    are gates that fail the build when they drift.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.43.0-T05
  - US-IO-HARNESS-0.43.0-T06
  - US-IO-HARNESS-0.43.0-T07
  acceptance_criteria:
  - '**N3 — exactly one public break, and it is the one named.** `ProviderErrorKind` gains `ContextOverflow`
    and `#[non_exhaustive]` together. Everything else is additive: `Compaction`, `Summary`, `Transcript`,
    `TranscriptTurn` are new; `EventKind::Compacted` sits on an already-`#[non_exhaustive]` enum; the
    `TaskContract` field and builder sit on a `#[non_exhaustive]` struct; `Session::attach`, `Session::transcript`,
    `Store::summaries`, `Transcript::to_markdown` and `ProviderErrorKind::from_response` are added and
    nothing is removed or altered. `docs/public-api.txt` gains the lines **its checker can see** — the
    crate-root re-exports `Compaction`, `Summary`, `Transcript` and `TranscriptTurn` — and not the methods,
    the enum variant or the struct field, which are members of already-listed items. Stated this way at
    plan time because the same criterion has been met "in a different form" four releases running (traps
    114 and the 0.41.0 N3 note).

    '
  - '**O3 — the documentation gates pass**: the nightly rustdoc gate, the two intra-doc link rules, and
    the checked-in doc surfaces (`docs/public-api.txt`, `CAPABILITIES.md`, the guide index, `CHANGELOG.md`
    including its `*Migration:*` note) consistent with the code in the same commit range.

    '
  files:
  - docs/CONTRACT.md
  - docs/public-api.txt
  - docs/guide
  - CHANGELOG.md
  - src/context.rs
  - src/error.rs
  - src/session.rs
  - src/state.rs
  evidence: []
- id: US-IO-HARNESS-0.43.0-T09
  summary: 'Run the release gates: dependency count, MSRV, the full suite in both feature polarities,
    and the three-platform matrix.'
  why_required: These are the criteria that fail late and cheaply-avoidably. A dependency added without
    noticing or an MSRV drift is found here or on a release run, and the second is far more expensive.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.43.0-T08
  acceptance_criteria:
  - '**N1 — no new dependency.** `cargo tree` for the default feature set has the same number of crates
    as 0.42.0 (**402**). Summarising needs a `Provider`, which is the crate''s own trait; the transcript
    needs `std::fmt`; the table needs `rusqlite`, already there.

    '
