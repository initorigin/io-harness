    is not wired up — and update every doc surface this release touches: the README tool list, `docs/CONTRACT.md`
    for the handle lifecycle and the orphaning rule, `docs/guide/command-execution.md`, `docs/guide/language-support.md`,
    and the crate rustdoc.'
  why_required: 'A contract document that under-claims a shipped boundary is the same class of defect
    as one that over-claims it: either way a consumer cannot trust the file. The orphaning rule in particular
    is a contract, not an implementation detail — it is the difference between this crate and one that
    would re-attach to a recorded PID.'
  status: todo
