product: io-harness
version: 0.6.0
tasks:
  - id: US-IO-HARNESS-0.6.0-T01
    summary: >
      Sandbox trait + SandboxOutcome + SandboxLimits/SandboxConfig (serde) + portable floor backend +
      backend selection. The floor runs on all three OSes as the guaranteed-present isolation.
    why_required: >
      Without the trait and a floor backend there is no sandbox at all and no OS-neutral surface;
      every later task (wiring, caps, native backends, trace) hangs off this seam.
    status: done
    depends_on: []
    acceptance_criteria:
      - >-
        `Sandbox`, `SandboxLimits`, `SandboxConfig`, and `SandboxOutcome` are part of the documented
        public API under SemVer; existing 0.5.0 callers still compile unchanged, and no OS-specific or
        provider-specific type leaks into the trait's signature — the surface is OS-neutral.
    files:
      - src/sandbox.rs
      - src/lib.rs
      - Cargo.toml
    evidence:
      - >-
        src/sandbox.rs defines the public `Sandbox` trait (RPITIT, no OS type in its signature),
        `SandboxLimits`/`SandboxConfig` (serde, round-trip test), `SandboxOutcome`, `FloorSandbox`,
        and `select`; re-exported from lib.rs. Whole 0.1.0–0.5.0 suite still compiles unchanged
        (evidence/0.6.0/tests.txt). clippy 0 warnings.
  - id: US-IO-HARNESS-0.6.0-T02
    summary: >
      Wire compile_source (verify.rs) to run rustc + the produced test binary through the selected
      sandbox by default; opt-out (no SandboxConfig) restores exact 0.5.0 direct-host execution.
    why_required: >
      Isolation is only real once the one exec chokepoint routes through the sandbox; the opt-out is
      the additive/reversible guarantee that keeps 0.5.0 callers working.
    status: done
    depends_on: [US-IO-HARNESS-0.6.0-T01]
    acceptance_criteria:
      - >-
        A task driven through the execution-based verification gate with the sandbox on reaches the
        same verified success the un-sandboxed 0.2.0 path reaches, proving isolation is transparent to
        verification — stdout, exit status, and produced files are captured identically.
      - >-
        A 0.5.0 caller who opts the sandbox off gets the exact 0.5.0 direct-host execution behaviour
        and the same verified success, proving the sandbox is additive and reversible.
    files:
      - src/verify.rs
      - src/sandbox.rs
    evidence:
      - >-
        compile_source now routes rustc + the produced test binary through ExecGuard::exec →
        sandbox::select. tests/sandbox.rs::sandbox_on_reaches_the_same_verified_success_as_direct and
        ::sandbox_on_runs_the_produced_test_binary_transparently prove sandbox-on and .no_sandbox()
        give identical verdicts; the unchanged edit_file/multi_file/parity/policy/subagents suites all
        pass with the sandbox default on (evidence/0.6.0/tests.txt).
  - id: US-IO-HARNESS-0.6.0-T03
    summary: >
      Resource caps (CPU time, memory, procs, fds) that kill and return a typed cap-hit outcome
      naming the breached cap, applied by the portable floor via rlimit (unix pre_exec).
    why_required: >
      A cap that throttles instead of killing turns a runaway into a hang; the kill-and-typed-cap-hit
      is the core isolation guarantee under fan-out.
    status: done
    depends_on: [US-IO-HARNESS-0.6.0-T02]
    acceptance_criteria:
      - >-
        A sandboxed command that exceeds the CPU-time cap is killed and returns a typed cap-hit
        outcome naming the CPU cap, not a hang; a second test does the same for the memory cap.
    files:
      - src/sandbox.rs
    evidence:
      - >-
        CPU cap via RLIMIT_CPU (pre_exec) → SIGXCPU → Cap::Cpu; memory cap via an RSS poll-and-kill
        monitor (macOS does not enforce RLIMIT_AS/RLIMIT_DATA — verified empirically). Unit tests
        sandbox::tests::cpu_cap_kills_a_busy_loop_and_names_the_cpu_cap and
        ::memory_cap_kills_a_heap_hog_and_names_the_memory_cap both pass on the macOS host.
  - id: US-IO-HARNESS-0.6.0-T04
    summary: >
      Per-run lifecycle: default-deny network, guaranteed teardown (no leaked dir / no orphan
      process) on every exit path, and copy-back of produced files filtered through the 0.4.0 write
      policy.
    why_required: >
      Network deny, teardown, and policy-filtered copy-back are the remaining isolation guarantees
      that make "created, run, captured, destroyed per run" true and composed with the permission
      layer.
    status: done
    depends_on: [US-IO-HARNESS-0.6.0-T03]
    acceptance_criteria:
      - >-
        Sandboxed code that attempts an outbound network connection is denied under default-deny and
        the command observes the failure, proving the network boundary is enforced by the sandbox, not
        the prompt.
      - >-
        After a run (successful, failed, or cap-killed), the sandbox working directory is gone and no
        process it spawned survives — a teardown test asserts no directory and no orphan process leak,
        including on the error path.
      - >-
        Files the sandboxed command produces are copied back to the task workspace only where the
        0.4.0 write policy allows, proving sandbox capture composes with the permission layer rather
        than bypassing it.
    files:
      - src/sandbox.rs
    evidence:
      - >-
        Network deny proven live: tests/sandbox.rs::the_selected_backend_denies_outbound_network_by_default
        (curl blocked by the native macOS backend, exit != 0). Teardown via tempfile::TempDir drop
        (sandbox::tests::workdir_is_removed_on_drop) + kill_on_drop. Copy-back honours the write policy
        (sandbox::tests::copy_back_honours_the_write_policy). Live example shows teardown leaves nothing
        (evidence/0.6.0/live_run.txt).
  - id: US-IO-HARNESS-0.6.0-T05
    summary: >
      macOS native backend (sandbox-exec profile confining writes to the workdir + denying network,
      plus setrlimit) and backend selection preferring native on this host.
    why_required: >
      The macOS native backend is the one native path live-testable on this build host and the one the
      example live-run uses; without it the release ships only the floor on macOS.
    status: done
    depends_on: [US-IO-HARNESS-0.6.0-T04]
    acceptance_criteria:
      - >-
        On the macOS build host the native `sandbox-exec` backend is selected and recorded; when the
        native backend is disabled by config, the portable floor is selected and recorded, proving the
        selection ladder is real and observable.
    files:
      - src/sandbox.rs
      - src/sandbox/macos.rs
    evidence:
      - >-
        src/sandbox/macos.rs: sandbox-exec profile (allow default, deny network*, writes confined to
        the workdir) + TMPDIR=workdir + shared rlimit/RSS caps. Profile validated live (rustc compiles,
        curl blocked). tests/sandbox.rs::selection_picks_native_on_this_host_and_floor_when_forced
        asserts MacosSandboxExec by default and PortableFloor under force_floor. Live run selected
        macos-sandbox-exec (evidence/0.6.0/live_run.txt).
  - id: US-IO-HARNESS-0.6.0-T06
    summary: >
      Linux (namespaces+seccomp+rlimit over tmpfs) and Windows (Job Object + restricted token)
      native backends behind cfg, compiled and unit-tested on the macOS host.
    why_required: >
      OS-neutral means a real native backend per OS; these two must compile and unit-test under cfg so
      the surface holds on linux and windows even without live hardware here.
    status: done
    depends_on: [US-IO-HARNESS-0.6.0-T05]
    acceptance_criteria:
      - >-
        The Linux native backend and the Windows native backend compile under their `cfg` on the macOS
        build host and pass their backend unit tests, proving the OS-neutral surface holds even though
        those backends are not live-run here.
    files:
      - src/sandbox/linux.rs
      - src/sandbox/windows.rs
    evidence:
      - >-
        src/sandbox/linux.rs (unshare user/mount/pid/net namespaces) and src/sandbox/windows.rs (Job
        Object limit mapping) compile and their unit tests run on the macOS host — linux::tests
        (net-namespace argv), windows::tests (JobLimits maps memory/procs/CPU-ticks, kill-on-close).
        Full target-triple cross-check is additionally blocked only by rusqlite's bundled-C cross
        toolchain (environment), not by the sandbox code; noted honestly. Not live-run on real
        Linux/Windows hardware (excluded scope).
  - id: US-IO-HARNESS-0.6.0-T07
    summary: >
      Sandbox trace: additive rusqlite schema for lifecycle events (create, argv+backend, cap hit,
      denied network, destroy), recorded per run and reconstructable from a reopened store.
    why_required: >
      Auditing where each piece of code ran is a named outcome; the events must be additive so a 0.5.0
      database migrates in place.
    status: done
    depends_on: [US-IO-HARNESS-0.6.0-T04]
    acceptance_criteria:
      - >-
        Every sandbox lifecycle event (create, argv + backend, cap hit, denied network where
        observable, destroy) is recorded so the run's execution history is reconstructable from a
        reopened store alone.
    files:
      - src/state.rs
      - src/sandbox.rs
      - src/verify.rs
    evidence:
      - >-
        src/state.rs adds an additive sandbox_events table + SandboxEvent (create/exec/cap_hit/destroy)
        with record/read; ExecGuard::exec records them. tests/sandbox.rs::sandbox_lifecycle_is_recorded_and_reconstructable
        rebuilds create/exec(backend+argv)/destroy from a reopened store; ::a_cap_hit_in_the_gate_is_recorded
        shows a cap_hit event. Migration follows the 0.4.0/0.5.0 additive pattern (a 0.5.0 db opens
        unchanged). Live trace printed in evidence/0.6.0/live_run.txt.
  - id: US-IO-HARNESS-0.6.0-T08
    summary: >
      Sandbox in the 0.5.0 tree — each child's verification runs in its own sandbox under the same
      caps/deny-network; a sandbox that fails to start returns a typed failure without taking down
      siblings.
    why_required: >
      Composition with containment is the point of doing this after 0.5.0; a start failure must be a
      typed result the agent adapts to, matching 0.4.0/0.5.0 refusal-as-result.
    status: done
    depends_on: [US-IO-HARNESS-0.6.0-T05, US-IO-HARNESS-0.6.0-T07]
    acceptance_criteria:
      - >-
        A sandbox that fails to start returns a typed failure outcome the calling agent adapts to; the
        run does not panic, and in a 0.5.0 tree the failure does not take down sibling agents — proven
        by a test injecting a start failure.
      - >-
        In a 0.5.0 tree, each child's execution runs inside its own sandbox under the same caps and
        default-deny network, proving isolation stacks on top of containment for every agent in the
        tree.
    files:
      - src/run.rs
      - src/sandbox.rs
    evidence:
      - >-
        Typed start failure: Error::Sandbox; tests/sandbox.rs::a_sandbox_that_cannot_start_returns_a_typed_failure
        proves a bad program yields Err(Error::Sandbox), not a panic. Children are sandboxed by the
        same default-on gate — the 10-test subagents suite passes with the sandbox on, and each child's
        workspace verify runs through the sandboxed ExecGuard.
      - >-
        GAP (flagged, not hidden): the sibling-independence-under-a-child-start-failure is covered
        indirectly — run_tree already isolates a child that returns Err from its siblings (subagents
        suite), and the typed start-failure is unit-proven — but there is NO single test that injects a
        sandbox start failure into one child of a live tree, because making one child's rustc unspawnable
        is not reachable through the public API. Recommend the owner accept this or request a test hook.
  - id: US-IO-HARNESS-0.6.0-T09
    summary: >
      README + crate docs (Sandbox trait, each backend's isolation strength, portable floor as the
      guaranteed minimum, selection, caps, default-deny with allow-list deferred to 0.8.0) and a live
      sandboxed example binary.
    why_required: >
      The docs and a runnable live example are release-critical acceptance; the example is the live
      proof of the macOS native backend end to end.
    status: done
    depends_on: [US-IO-HARNESS-0.6.0-T08]
    acceptance_criteria:
      - >-
        README and crate docs document the `Sandbox` trait, each backend and its isolation strength,
        the portable floor as the guaranteed minimum, backend selection, resource caps, and
        default-deny network with the allow-list deferral to 0.8.0, with a runnable example.
      - >-
        An example binary drives one live sandboxed run against OpenRouter on the macOS native backend
        showing a cap hit and the network denial, with teardown leaving nothing behind.
    files:
      - README.md
      - src/lib.rs
      - examples/sandbox_run.rs
    evidence:
      - >-
        README gains a v0.6 status line, capability tick, and an "Execution sandbox (v0.6)" section
        with a per-backend isolation-strength table and the 0.8.0 allow-list deferral; lib.rs gains a
        v0.6 crate-doc paragraph. examples/sandbox_run.rs live-run against OpenRouter (openai/gpt-5.6-luna):
        Success{steps:1}, backend macos-sandbox-exec, create/exec/destroy trace, Cap::Cpu on a runaway,
        network default-deny, teardown clean — evidence/0.6.0/live_run.txt.
  - id: US-IO-HARNESS-0.6.0-T10
    summary: >
      Package gates + publish: Cargo.toml to 0.6.0, cargo test / clippy --all-targets / build
      --release / publish --dry-run green, then git Release, then cargo publish to crates.io.
    why_required: >
      target_mode is published; the release is not complete until the crate is tested, packaged, and
      (owner-approved) uploaded via git-release-then-publish.
    status: blocked
    depends_on: [US-IO-HARNESS-0.6.0-T09]
    acceptance_criteria:
      - >-
        `cargo test` passes, including the sandbox-transparent verification test, the CPU and memory
        cap-kill tests, the network-deny test, the teardown/no-leak test, the copy-back-under-policy
        test, the backend-selection test, the Linux/Windows backend compile+unit tests under cfg, the
        sandbox trace test, and the unchanged 0.1.0–0.5.0 suite with the sandbox default on.
      - '`cargo clippy --all-targets` reports zero warnings on the macOS build host.'
      - '`cargo publish --dry-run` succeeds with complete crate metadata for 0.6.0.'
      - >-
        0.6.0 is tagged as a git Release and then published to crates.io with `cargo publish`; the
        uploaded crate matches the release-ready artifact and the published version resolves from
        crates.io.
    files:
      - Cargo.toml
    evidence:
      - >-
        GREEN gates (evidence/0.6.0/): cargo test — 120 passed, 0 failed (71 lib + 9 edit_file + 3
        multi_file + 1 parity + 17 policy + 8 sandbox + 10 subagents + 1 doctest); clippy --all-targets
        0 warnings; build --release ok; publish --dry-run packaged 49 files, verify-compiled io-harness
        v0.6.0, upload aborted (dry run). Secrets + excluded-scope gates PASS (gates.txt).
      - >-
        PENDING owner approval (blocked): the actual git Release and `cargo publish` to crates.io are
        NOT done — publishing is public and irreversible and is an owner-gated human decision
        (dependencies.human_approvals). CARGO_REGISTRY_TOKEN is available in .env. This is the only
