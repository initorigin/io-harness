product: io-harness
version: 0.29.0
tasks:
- id: US-IO-HARNESS-0.29.0-T01
  summary: 'Provider plumbing: ModelInfo, PriceSource, the defaulted Provider::models(), the two new
    module declarations and the crate-root re-exports.'
  why_required: 'Every other task in the release names one of these types or is compiled by one of these
    declarations. The defaulted method is also the release''s one break risk: a required method here
    would break the crate''s only extension point.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.29.0-T10
  acceptance_criteria:
  - 'F3 — `Provider::models()` defaults to an empty list, and the default is what keeps the crate''s
    extension point open. A `Provider` implementation that overrides nothing but `complete` compiles
    and returns an empty catalogue — written as the minimal out-of-tree implementer, which is the exact
    shape `src/provider/mod.rs:674` documents. **The negative control is `Compatible::models()` against
    a socket serving a real catalogue body, returning a non-empty list** — without it the test passes
    against an implementation whose `models()` returns empty for everyone.

    '
  - 'NF5 — no existing public item changes. `OpenRouter`, `Anthropic` and `OpenAi` keep every method
    and every behaviour; `Provider` gains one defaulted method and no required one; `ProviderSpec` gains
    one variant behind the `#[non_exhaustive]` 0.27.0 put there for it. `Price` gains no field and keeps
    `Copy`, so `..Price::ZERO` and `PriceTable::price` are untouched and tiers are a `PriceTable` method
    rather than a change to the value type. A `PriceTable` with no tier registered returns exactly the
    figure 0.28.0 returned, asserted rather than argued. A program written against 0.28.0 compiles and
    behaves identically.

    '
  files:
  - src/provider/mod.rs
  - src/lib.rs
  - src/provider/catalog.rs
  - src/provider/compatible.rs
  evidence:
  - 'F3 — `provider::catalogue_default::a_provider_that_overrides_nothing_reports_an_empty_catalogue`
    implements `Provider` with `complete` and nothing else, which is exactly the shape the trait''s
    own doc example ships and exactly what an out-of-tree implementation written before 0.29.0 looks
    like. It is a compile-time assertion as much as a runtime one: making `models()` required stops
    this file compiling.'
  - '`Provider::models()` is defaulted to `async { Ok(Vec::new()) }` and carries a worked example that
    is itself the minimal out-of-tree implementer. The negative control — a non-empty catalogue from
    a provider pointed at a real body — lands with T03.'
  - '`ModelInfo` and `PriceSource` added to `src/provider/mod.rs`. Every field but `id` is an Option
    or an empty Vec and `None` means the vendor did not say; the doc example contrasts a local runtime''s
    stated `Price::ZERO` against a hosted vendor''s `None` for the same apparent ''no cost'', which
    is the distinction the type exists for. `price_source` is `#[non_exhaustive]`.'
  - The socket harness at `src/provider/mod.rs::failures` is now `pub(crate)` with `serve`, `stream_response`,
    a new `json_response` for length-delimited catalogue bodies, and a new `serve_recording` that returns
    the request heads it was sent — so a test can assert what went onto the wire rather than what the
    constructor stored, and an empty log proves no request was made. `drain_request` returns the head
    verbatim and lowercases only for parsing the length.
  - NF5 — `cargo test --doc` 261 passed, 0 failed (254 before), and `cargo build` clean. No existing
    public item changed.
- id: US-IO-HARNESS-0.29.0-T02
  summary: 'The reference catalogue reader: Reference, the exact decimal-string to micro-unit conversion,
    and the match rule.'
  why_required: Without it the release prices nothing for the vendors that publish no prices, which
    is the half of the outcome the fallback trigger is written against. The conversion is also the only
    place a defect in this release becomes money rather than an error.
  status: done
  depends_on:
  - US-IO-HARNESS-0.29.0-T01
  acceptance_criteria:
  - 'F4 — a decimal price string becomes an exact integer, and no `f64` is on the path. `"0.0000002574"`
    becomes exactly `257_400` micro-units per million tokens, and a table of hand-computed cases covers
    a value with fewer fraction digits than the shift, one with more (rounded half-up at the twelfth
    place), `"0"`, an integer with no point, and a malformed string that yields `None` rather than a
    zero. **The named negative control is `f4_the_conversion_is_not_a_float_multiply`: the same inputs
    run through an `f64` multiply must produce a value that differs from the exact result for at least
    one case in the table**, so the test proves the implementation is not the float one rather than
    merely agreeing with it on easy inputs. A second control asserts a malformed price is `None` and
    never `Some(0)`.

    '
  - 'F5 — a reference price is matched exactly or by one documented normalisation, and a miss stays
    `None`. An exact slug matches; `deepseek/deepseek-chat` matches a vendor id of `deepseek-chat` by
    dropping the single leading segment, case-insensitively. **Three negative controls:** a vendor id
    the reference does not carry under either rule is `None` and never a nearest entry — asserted with
    the roadmap''s own example, a reference carrying `deepseek/deepseek-chat` and a vendor asking for
    `deepseek-v4-flash`; two reference entries normalising to the same key make that key ambiguous and
    therefore `None`, not first-wins; and a two-segment vendor id is not matched against a one-segment
    reference entry by stripping in the other direction, because one normalisation means one.

    '
  files:
  - src/provider/catalog.rs
  evidence:
  - 'F4 — `f4_a_decimal_rate_becomes_an_exact_integer` runs a 19-case hand-computed table: deepseek/deepseek-chat''s
    own 0.0000002574 -> 257_400, gemini-2.5-pro''s base and its 200k override, fewer fraction digits
    than the shift, an integer with no point, a stated zero, and half-up rounding at the twelfth place
    asserted on both sides.'
  - F4's named negative control — `f4_the_conversion_is_not_a_float_multiply` — earned its keep. The
    first discriminating case chosen (0.0000006000000000000001) turned out to survive an f64 round trip,
    so the control FAILED and the table did not discriminate. Ten live catalogue values were then found
    where `(s.parse::<f64>()? * 1e12) as u64` truncates one micro-unit low — 0.00000003 is qwen/qwen3.7-flash's
    own prompt rate — and the control now asserts the disagreeing set equals `FLOAT_TRAPS` exactly and
    that `naive + 1 == exact` for each. A control that discriminates on nothing now fails.
  - '`f4_a_malformed_rate_is_absent_rather_than_free` — a negative rate, an unparseable string and an
    empty one all yield 0 at the digit level, while `Pricing::price()` returns None when no dimension
    was named at all and `Some(Price::ZERO)` when exactly one was stated as zero. The rule is ''nothing
    was named'', not ''everything came out zero''.'
  - 'F5 — exact slug, case-insensitive; the one normalisation (drop a single leading `vendor/` segment)
    proven on deepseek/deepseek-chat -> deepseek-chat. Three named negative controls: the roadmap''s
    own `deepseek-v4-flash` miss stays None; two entries normalising to one key make it ambiguous and
    therefore None rather than first-wins, while both stay reachable by exact slug; and the normalisation
    is not applied in the other direction.'
  - '`the_live_shape_parses_into_model_info` parses a body trimmed verbatim from the live response.
    gemini-2.5-pro''s 200k override carries no `input_cache_write`, and the tier is asserted to keep
    the base 375_000 rather than zero — the sparse-merge half of F11, and the difference between a tier
    and a truncation. A row that priced nothing is None on both price and price_source.'
  - F6's catalogue half — `every_price_carries_its_provenance_and_the_two_cannot_disagree` asserts `price.is_some()
    == price_source.is_some()` across every entry, and that a reference price names the host it came
    from. `the_catalogue_is_read_once_per_instance` pins the instance cache; `the_host_is_knowable_before_any_request_is_made`
    pins the property the egress boundary rests on.
  - '`cargo test --lib provider::catalog` — 14 passed, 0 failed. No new dependency: serde_json and reqwest
    only, and the decimal shift is std string handling.'
- id: US-IO-HARNESS-0.29.0-T03
  summary: 'The Compatible provider: the base URL and auth style, the preset table and its named constructors,
    models(), and the opt-in reference lookup in endpoints().'
  why_required: It is the release. Twenty-one vendors are reachable without writing a provider, or the
    outcome sentence is false.
  status: done
  depends_on:
  - US-IO-HARNESS-0.29.0-T02
  acceptance_criteria:
  - 'F1 — one `Compatible` reaches a vendor''s chat endpoint through the real HTTP and SSE path, and
    the preset decides the URL and the auth. A `Compatible` pointed at a local socket completes a streamed
    response with text and a tool call, asserted through `Compatible::at`, and the request the socket
    received carries `Authorization: Bearer <key>` and a path ending `/chat/completions`. **Two negative
    controls:** an `Auth::None` provider''s request carries **no** `Authorization` header at all, asserted
    on the received head rather than on the constructor — so "auth style" is proven to reach the wire
    and not merely to be stored; and a base URL already ending in a path segment (`/openai/v1`, `/api/paas/v4`)
    produces that segment plus `/chat/completions` rather than a URL with the segment lost, which is
    the failure mode a scheme-and-host field would have had.

    '
  - 'F2 — every preset in the table names a distinct vendor with a well-formed absolute base, and the
    named constructors and the table cannot disagree. Each entry''s `base_url` parses as an absolute
    `https`/`http` URL with a host, no entry''s name repeats, and each of the twenty-one named constructors
    is asserted to produce the base and the auth style its table row states. **The negative control
    is the check run against a table with one row''s base replaced by a relative path and another row
    duplicated, which must report exactly those two rows** — a validator that always answers "fine"
    is the failure mode, and it must be seen answering otherwise.

    '
  - 'F6 — a price carries its provenance, and the two fields cannot disagree. A model priced from the
    vendor''s own catalogue is `PriceSource::Vendor`; the same model filled from the reference is `PriceSource::Reference(host)`
    naming the host that was dialled. Across a whole parsed catalogue, `price.is_some()` and `price_source.is_some()`
    are asserted **equal for every entry**. **The negative control is a vendor catalogue with no pricing
    object at all** — every entry `None` on both, which is the state that must not be reported as a
    free model.

    '
  - 'F7 — the reference lookup is off by default, and when on its host is governed like every other
    endpoint. A `Compatible` built normally reports exactly one endpoint and makes no second request,
    asserted by a reference server that records whether it was ever connected to. With `with_reference_prices`,
    `endpoints()` reports both, and a run under a policy that denies the reference host **fails** rather
    than proceeding with prices missing — asserted on the run''s error through the existing authorisation
    at `src/run.rs:4630`. **Two negative controls:** the byte-identical run under a policy that allows
    the host reaches its own ending, so the refusal is proven to be about the policy and not about the
    feature being broken; and the default-off provider under the same denying policy still runs, so
    the deny is proven to be about the second host and not about the provider''s own.

    '
  files:
  - src/provider/compatible.rs
  evidence:
  - 'F1 — `f1_a_streamed_completion_arrives_through_the_real_http_and_sse_path` drives the whole HTTP+SSE
    path against a local socket via `Compatible::at`, and asserts on the request head the socket actually
    received: the bearer token and a path ending `/chat/completions`. Two named negative controls: `f1_an_auth_none_provider_sends_no_authorization_header_at_all`
    proves the auth style reaches the wire rather than merely being stored, and `f1_a_base_that_already_carries_a_path_keeps_every_segment_of_it`
    proves a nested base survives — the failure a scheme-and-host field would have had against four
    presets.'
  - '`a_failure_is_classified_exactly_as_the_three_original_providers_classify_it` — a 429 through Compatible
    is RateLimited/Some(429), the same as the other three, because it funnels through the same `ensure_success`.
    Asserted rather than assumed, since ''it shares the wire module'' is the release''s structural claim.'
  - 'F2 — `f2_every_preset_names_a_distinct_vendor_with_a_well_formed_base` over 21 rows (13 hosted,
    8 local). `f2_the_table_check_reports_a_broken_row_rather_than_always_passing` is the named negative
    control: the validator run over a table with one relative base and one duplicated name must report
    exactly those two. `f2_every_named_constructor_agrees_with_its_table_row` drives all 21 constructors
    and asserts base, auth and trace label against the table, which is also what proves `Compatible::known`''s
    expect unreachable.'
  - '`f2_a_local_runtime_takes_no_key_and_a_hosted_one_takes_a_bearer` splits the table against a named
    list of the eight runtimes rather than guessing from the URL. `f2_an_unknown_preset_is_refused_naming_the_ones_that_exist`
    — ''grok'' is refused listing ''groq'' and ''ollama'' among the rest, with the accepted name as
    the control.'
  - F3's negative control — `f3_a_connected_provider_returns_a_non_empty_catalogue` returns 2 models
    from a real body, so the defaulted-empty assertion in `provider::catalogue_default` cannot pass
    against an implementation whose models() is empty for everyone. A vendor publishing identifiers
    and no cost is None on price and price_source, never free.
  - 'F7 — `f7_the_reference_lookup_is_off_until_it_is_asked_for` uses a recording reference server:
    a provider that did not opt in leaves its log EMPTY (one endpoint, no second request), and one that
    opted in reports two endpoints and dials it exactly once. An empty log is proof a return value alone
    cannot give.'
  - 'F6 — `f6_a_reference_price_fills_a_gap_and_says_it_is_a_reference_price`: deepseek-chat matches
    deepseek/deepseek-chat by the one normalisation and is marked PriceSource::Reference; llama3.2,
    which the reference does not carry, is left None rather than guessed; and price.is_some() == price_source.is_some()
    across the whole list.'
  - '`a_price_table_carries_the_moment_it_was_read_rather_than_a_typed_date` — price_table() dates itself
    YYYY-MM-DD from the fetch. `crate::net::today_utc` was added rather than ungating the test-only
    `http_date`, using Hinnant''s civil-from-days; `the_civil_date_is_exact_across_leap_years_and_century_rules`
    covers the epoch, 2000-02-29 and the 2100 non-leap boundary. A model nobody priced is absent from
    the table, never entered at zero.'
  - '`cargo test --lib` — 356 passed, 0 failed. `cargo clippy --all-targets -- -D warnings` — clean.'
- id: US-IO-HARNESS-0.29.0-T04
  summary: ProviderSpec::Compatible in the file format, its exactly-one base rule, and every key of
    it named in EVERY_KEY.
  why_required: An operator has configured the harness in a file rather than in Rust since 0.19.0, and
    a provider kind the file cannot name is a provider io-cli and io-studio cannot select.
  status: done
  depends_on:
  - US-IO-HARNESS-0.29.0-T03
  acceptance_criteria:
  - 'F9 — the config variant reaches a typed field, is exactly-one about its base, and rejects what
    it does not know. `EVERY_KEY` (`tests/config.rs:233`) gains a `kind = "compatible"` entry covering
    every key, and `f7_every_key_reaches_a_typed_field` (`:362`) asserts each lands. **The negative
    control is its existing twin** (`:525`), extended to one new key, so the fixture proves the field
    is read rather than defaulted. Plus: an entry with **neither** `base_url` nor `preset`, and one
    with **both**, are each refused naming the entry''s index; an unknown `preset` name is refused listing
    the names that exist; and an unknown key inside the entry is rejected naming it, modelled on `an_unknown_key_inside_the_web_table_is_rejected_naming_it`
    (`:1242`).

    '
  files:
  - src/config.rs
  - tests/config.rs
  evidence:
  - 'F9 — `EVERY_KEY` (tests/config.rs) gains a `kind = "compatible"` entry naming all seven keys, and
    `f7_every_key_reaches_a_typed_field` asserts the whole `ProviderSpec::Compatible` value including
    `auth: Some(Auth::None)`, `name`, and `reference_prices: true` — so each key is proven to reach
    a typed field rather than being accepted and dropped.'
  - 'The negative-control twin `f7_a_key_removed_from_that_file_leaves_exactly_that_field_at_its_default`
    is extended to `reference_prices`: with the key removed the flag falls back to false while its neighbour
    `auth` does not. That is the difference between a provider that dials a second host and one that
    does not, so the fixture proves the key is read.'
  - 'Exactly-one enforced in code, reported by entry index: `a_compatible_provider_naming_neither_base_nor_preset_is_refused_by_index`
    (names #1, both key names, and lists the presets), `a_compatible_provider_naming_both_base_and_preset_is_refused`
    (#0, and says one would be silently ignored), `an_unknown_preset_is_refused_listing_the_ones_that_exist`
    (''grok'' surfaces ''groq'').'
  - '`each_valid_shape_of_a_compatible_provider_loads` is the named negative control for all three refusals:
    a preset alone, a base_url alone, and a second preset name all load, and the three original kinds
    still load unchanged — so the rule cannot be satisfied by an implementation that refused every compatible
    entry or refused [[provider]] wholesale, which is the shape 0.27.0''s F4 control exists to catch.'
  - '`an_unknown_key_inside_a_compatible_provider_is_rejected_naming_it` — `reference_price` (singular)
    is rejected naming the key and the file. Exactly-one is enforced in code rather than through a nested
    tagged enum precisely so `deny_unknown_fields` survives; a `#[serde(flatten)]` for the shared keys
    would have inherited the standing [[mcp]] hole.'
  - Validation runs at both load paths — `Config::from_toml` and `read_scope` — through one `check_providers`
    helper beside `Hooks::check`, so a scope-merged file and a single-string file are held to the same
    rule.
  - '`cargo test --test config` — 42 passed, 0 failed (37 before).'
