product: io-harness
version: 0.41.0
tasks:
- id: US-IO-HARNESS-0.41.0-T01
  summary: Add `ToolEffect` and the defaulted `Tool::effect`, `TaskContract::max_parallel_reads` with
    `with_max_parallel_reads`, the built-in read-only classification, and the partition, bounded `JoinSet`
    and order-preserving fold in the workspace step loop.
  why_required: This is the release's vertical slice and every other task attaches to it. Without the
    partition there is nothing concurrent to bound, nothing to fold in call order, and nothing for a cap
    to limit. The negative control lands here too, because the same code path that makes reads concurrent
    is the one `with_max_parallel_reads(1)` must return to 0.40.0's execution shape.
  status: done
  depends_on: []
  acceptance_criteria:
  - '**F1 — read-only calls in one completion run concurrently, and with the cap at 1 they do not.** Three
    registered `Tool` implementations returning `ToolEffect::ReadOnly`, each of which waits on a shared
    barrier of three and then returns. A fixture provider emits one completion calling all three. With
    the default cap the step completes; the barrier can only be crossed if all three are in flight. **The
    negative control, on the same contract, same policy, same store, same completion, with `with_max_parallel_reads(1)`:**
    the step does not complete and the bounded timeout that guards the test fires, proving the serial
    path is genuinely serial. This pair is the release in one assertion, and it contains no clock. Sabotage:
    make the partition treat `ReadOnly` as `Mutating`, under which the first half must fail.

    '
  - '**F6 — the cap bounds calls in flight.** A completion carrying twenty read-only calls under a cap
    of 3: a counter incremented on entry and decremented on exit never observes more than 3 concurrently,
    and all twenty complete with twenty observations in call order. Sabotage: drop the `JoinSet` bound,
    under which the counter exceeds 3.

    '
  - '**N1 — no new dependency.** `cargo tree` for the default feature set has the same number of crates
    as 0.40.0. The join is `tokio`''s, which is already there.

    '
  - '**N5 — no leaked task.** A run that ends while a batch is in flight — cancelled, budget-exhausted
    or errored — leaves no detached task writing to the store afterwards. Asserted by dropping the run
    and confirming the store is unchanged after a bounded wait. The `JoinSet` is what makes this true
    rather than hopeful, and it is the reason for choosing it over spawning loose tasks.

    '
  files:
  - src/tools/custom.rs
  - src/tools/mod.rs
  - src/lib.rs
  - src/contract.rs
  - src/run.rs
  - tests/parallel_reads.rs
  evidence:
  - '`ToolEffect { ReadOnly, Mutating }` and the defaulted `Tool::effect` landed in `src/tools/custom.rs`,
    re-exported from `src/tools/mod.rs` and `src/lib.rs`. The default is `Mutating`, so every `Tool` implementation
    written before 0.41.0 compiles and is still called one at a time — asserted by `a_tool_that_says_nothing_is_mutating`
    as well as by the doctest.'
  - '`TaskContract::max_parallel_reads` and `with_max_parallel_reads` landed in `src/contract.rs`, defaulting
    to 10 in both constructors and clamping 0 to 1 rather than rejecting it. `TaskContract` has been `#[non_exhaustive]`
    since 0.35.0, so the field costs no caller anything.'
  - The step loop partitions each completion by `tool_effect(name, &contract.tools)` and dispatches each
    maximal run of read-only calls through the new `read_batch`. Everything below the partition folds
    a `Dispatched` exactly as it did in 0.40.0, in the model call order, whether that result came from
    a batch or from a lone `dispatch`. A cap of 1 never enters the batch path at all.
  - 'The concurrency is split in two so the store never crosses a task boundary: `prepare_read` consults
    the policy on the loop own thread, in call order, and `ReadWork::run` performs the read against a
    cloned `Workspace` and the tool own `Arc`. `rusqlite::Connection` is `Send` and not `Sync`, so this
    is the only shape available, and it is also what makes a pause honest.'
  - The three built-in read arms and the registered-tool arm in `dispatch` were rewritten to call the
    same `prepare_read` + `ReadWork::run` pair the batch uses, so a batched read and a lone read are the
    same code reached from two places and cannot drift.
  - F1 — `three_read_only_tools_rendezvous_and_at_cap_one_they_cannot` passes. Three registered `ReadOnly`
    tools each wait on a `tokio::sync::Barrier` of three; under the default cap the step completes within
    the 60s bound, and on the same contract, policy, store and completion with `with_max_parallel_reads(1)`
    the run does not finish inside 5s. No clock is asserted, only whether a rendezvous can be met.
  - 'F6 — `the_cap_bounds_calls_in_flight_and_all_of_them_still_land_in_order` passes. Twenty read-only
    calls under a cap of 3: the peak in-flight count is 3 (asserted <= 3, and >= 2 so the bound cannot
    pass by being serial), all twenty complete, and the twenty observation targets equal the call order
    exactly.'
  - N5 — `dropping_a_run_mid_batch_leaves_nothing_running` passes. Three read-only calls that sleep 400ms
    and then park; the run is dropped at 100ms, and 900ms later none has reached its own completion and
    the store step count is unchanged.
  - N1 — `cargo tree` reads 402 lines, the same figure as 0.40.0. The bound is `tokio::task::JoinSet`,
    from a dependency the crate has had since 0.1.0.
  - 'Three sabotages, one per arm, each failing a NAMED test and none silent. S1 — `tool_effect` returns
    `Mutating` for everything: F1 first half fails (Elapsed) and F6 peak drops to 1. S2 — the `JoinSet`
    bound removed (`set.len() < usize::MAX`): F6 fails with a peak of 20 and F1 still passes, so it isolates
    the bound. S3 — each task detached through `tokio::spawn` instead of being a `JoinSet` child: N5 fails
    with 3 completions after the drop, which is exactly why the contract names `JoinSet` rather than loose
    tasks.'
- id: US-IO-HARNESS-0.41.0-T02
  summary: 'Prove the trace is identical whether or not a batch ran concurrently: one recorded case replayed
    at cap 10 and cap 1 into two stores, compared row for row, and repeated twenty times in one job.'
  why_required: The release is only worth having if concurrency is an execution detail and not a semantic
    one. An ordering slip that survives a single comparison is exactly the once-in-twenty defect that
    would surface later as an unreproducible trace, so the repeat count is part of the criterion rather
    than a nicety.
  status: done
  depends_on:
  - US-IO-HARNESS-0.41.0-T01
  acceptance_criteria:
  - '**F2 — the trace is identical whether or not it ran concurrently.** One recorded case (`src/provider/record.rs`
    / `replay.rs`) exercising a completion of eight reads mixed with two writes, replayed twice into two
    stores: once at cap 10, once at cap 1. The stored steps, observations in the ledger, decision strings,
    `Edit` rows, ledger draws and the final `RunOutcome` compare equal row for row. Not a subset and not
    a normalisation — equality of what the store holds. Sabotage: fold results in completion order instead
    of call order, under which this must fail while F1 still passes.

    '
  - '**N4 — determinism under the crate''s own replay.** The F2 comparison is run twenty times in one
    CI job and is equal every time. Concurrency that is deterministic nineteen times out of twenty is
    a defect this release must not ship, and one run cannot see it.

    '
  files:
  - tests/parallel_reads.rs
  evidence:
  - 'F2 and N4 — `a_batched_run_and_a_serial_run_leave_identical_traces_every_time` passes. One case recorded
    through `provider::Record` over a completion of eight `read_file` calls split by two `write_file`
    calls, then replayed twice per round through `provider::Replay` — cap 10 and cap 1 — into two fresh
    in-memory stores. The comparison is a tuple of the whole `RunOutcome`, `store.steps`, `store.observations`,
    `store.edits` and `store.spent_tokens`, compared with `assert_eq!`: equality of what the store holds,
    not a normalisation.'
  - 'The workspace is re-seeded before every run, so all three runs make byte-identical requests. That
    is load-bearing rather than tidiness: `Replay` keys on the request content, so a run whose prompt
    differed at all would fail to be answered rather than diverge quietly.'
  - N4 — the comparison runs twenty times in one test. Each round also asserts that the case really wrote
    (2 `Edit` rows) and really read (8 `ObsKind::Read` observations), so an empty comparison cannot pass
    for a clean one.
  - 'Sabotage S4 — fold results in completion order rather than call order (assign each joined result
    to the earliest free slot): fails `the_cap_bounds_calls_in_flight_and_all_of_them_still_land_in_order`
    with the twenty targets scrambled inside each wave.'
  - 'FINDING, recorded rather than propped up: S4 fails NOTHING against F2 on its own. Eight built-in
    `read_file` calls are synchronous, so they complete in the order they were spawned and call order
    and completion order are the same answer. The ordering claim is therefore carried by F6, whose fixture
    sleeps for longer the earlier a tool appears in the completion so that the two orders genuinely differ.
    F2 remains worth having — it is what proves the two caps produce identical stored rows — but it is
    not the discriminating test for the fold.'
- id: US-IO-HARNESS-0.41.0-T03
  summary: Prove a mutating call is never overlapped or reordered against a read, and that a pause inside
    a batch leaves no observation, step or ledger draw behind for the calls after it.
  why_required: These are the two safety halves of the partition. Without the first, a read after a write
    could observe pre-write content and context assembly would reason from it silently; without the second,
    an operator could be shown work that was recorded before they approved it.
  status: done
  depends_on:
  - US-IO-HARNESS-0.41.0-T01
  acceptance_criteria:
  - '**F3 — a mutating call is never overlapped, and never reordered against a read.** A completion of
    `[read a, read b, write a, read a]`: the fourth call''s observation contains what the third call wrote,
    and the third does not begin until the first two have folded. Asserted from the stored observations,
    not from timing. Sabotage: include `Mutating` calls in a batch, under which the fourth read may see
    the pre-write content and this fails.

    '
  - '**F4 — a pause inside a batch leaves no partial work behind.** A completion of five read-only calls
    where the policy marks the third `Ask` and the approver defers. The run stops with `AwaitingApproval`;
    the store holds observations for the two calls before it and **none** for the two after it; the ledger
    shows no draw for them; and resuming on approval proceeds from the deferred call. Asserted on stored
    rows. Sabotage: start the whole batch before checking policy, under which observations for the trailing
    calls appear and this fails.

    '
  files:
  - tests/parallel_reads.rs
  - src/run.rs
  evidence:
  - 'F3 — `a_write_is_not_overlapped_and_a_read_after_it_sees_what_it_wrote` passes. One completion of
    [read a, read b, write a, read a]: four observations in call order, the first reads `before`, the
    fourth reads `after` and not `before`, and exactly one `Edit` row landed. Asserted from the stored
    observations, not from timing.'
  - 'F4 — `a_pause_in_a_batch_records_nothing_for_the_calls_after_it` passes. Five read-only calls with
    `Effect::Ask` on the third and a deferring approver: the run stops `AwaitingApproval`, the store holds
    two observations and no more, spent tokens are 0, and the two calls after the pause were never entered.
    Resuming with `resume_with_decision` and an approving approver runs all three of the released calls.'
  - 'Sabotage S5 — batch every read-only call in the completion, gathering them across the mutating ones:
    fails F3 (the fourth call observes `before`) and fails F2 as well. This is the defect the maximal-run
    partition exists to prevent and it is caught in two places.'
  - 'FINDING that changed the test: the sabotage the contract names for F4 — start the whole batch before
    checking the policy — failed NOTHING against five `read_file` calls. A file read has no side effect,
    and the fold stops at the pause, so work started past it leaves no trace at all. F4 was rewritten
    to use five registered read-only tools that record their own entry; the same sabotage then fails it
    at once, with look_4 and look_5 in the entered list. An assertion about work not starting needs a
    fixture that can observe starting.'
- id: US-IO-HARNESS-0.41.0-T04
  summary: Prove a registered tool's `effect()` is respected in both directions, and that the public surface
    grows by exactly the three new items and nothing else.
  why_required: 'The trait method is the extension point the release exists to offer, and a default that
    is ignored in either direction is worse than not having it: a `Mutating` tool run concurrently breaks
    an embedder''s own invariants, and a `ReadOnly` one left serial delivers none of the gain it opted
    into.'
  status: done
  depends_on:
  - US-IO-HARNESS-0.41.0-T01
  acceptance_criteria:
  - '**F5 — a registered tool''s effect is respected in both directions.** Two registered tools, identical
    but for `effect()`. The `ReadOnly` one is batched with a built-in read; the `Mutating` one is not
    — proven by F1''s barrier technique in the first case and by a rendezvous that must *fail* in the
    second. Sabotage: ignore the trait method and treat every custom tool as read-only, under which the
    second arm fails.

    '
  - '**N3 — no public break.** Three items added, none removed or altered. `docs/public-api.txt` diffs
    by exactly those three lines. A consumer who never calls the new method and never sets the new field
    compiles unchanged.

    '
  files:
  - tests/parallel_reads.rs
  - src/tools/custom.rs
  - docs/public-api.txt
  evidence:
  - 'F5 — `a_registered_tools_declared_effect_decides_whether_it_is_batched` passes both arms. Two registered
    tools identical but for `effect()`, sharing a barrier of two, with a built-in `read_file` between
    them in the completion: declaring `ReadOnly` they are one batch and the rendezvous is met inside the
    60s bound; declaring `Mutating` — same tools, same barrier, same completion — the run cannot finish
    inside 5s. The built-in read between them is load-bearing: were it treated as mutating it would split
    the run and the first arm would fail too.'
  - 'Sabotage S7 — ignore the trait method and treat every registered tool as read-only: fails F5''s second
    arm, ''the rendezvous cannot be met — it was, which means the declaration was ignored''.'
  - '`ToolEffect` was moved above the `Tool` trait so the trait keeps its own doc block: inserting it
    mid-block left `trait Tool` with a doc comment carrying no fence and `every_public_item_has_a_worked_example`
    reported it. Both public-surface gates now pass over 198 items.'
  - 'DEVIATION on N3, the same shape as 0.39.0''s fact 114: `docs/public-api.txt` diffs by exactly ONE
    line, `enum ToolEffect src/tools/custom.rs`, not three. The checker enumerates the names re-exported
    from `src/lib.rs`; `Tool::effect` is a method on an already-listed trait and `TaskContract::max_parallel_reads`
    / `with_max_parallel_reads` are members of an already-listed struct, so neither adds a line. The break
    budget the criterion meant to bound is unchanged — three items added, none removed or altered — and
    the file is the assertion for the part of it the file can see.'
- id: US-IO-HARNESS-0.41.0-T05
  summary: 'Document the guarantee: `docs/CONTRACT.md`, `ToolEffect` in `docs/guide/tools-and-skills.md`,
    the changelog entry with no migration note, and the version bump.'
  why_required: An embedder cannot rely on ordering they were never told about, and a tool author cannot
    know that `effect()` is a promise their tool makes about itself unless it is written down. The checked-in
    doc surfaces are gated in CI, so a release that skips them does not merge.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.41.0-T04
  acceptance_criteria:
  - '**O3 — the documentation gates pass**: the nightly rustdoc gate, the intra-doc link rules, and the
    checked-in doc surfaces (`docs/public-api.txt`, `CAPABILITIES.md`, the guide index, `CHANGELOG.md`)
    consistent with the code in the same commit range.

    '
  files:
  - docs/CONTRACT.md
  - docs/guide/tools-and-skills.md
  - CHANGELOG.md
  - Cargo.toml
  - Cargo.lock
  evidence: []
- id: US-IO-HARNESS-0.41.0-T06
  summary: Run the full suite on all three platforms, confirm a 0.40.0 store opens and resumes unchanged,
    and confirm the MSRV toolchain gate still builds.
  why_required: A scheduling change is where a platform-specific defect hides, so a green matrix is load-bearing
    here rather than routine, and the release claims no store migration — a claim only the cross-version
    job can settle.
  status: todo
  depends_on:
  - US-IO-HARNESS-0.41.0-T05
  acceptance_criteria:
  - '**O1 — the full suite passes on all three platforms**, which is what the standing CI matrix already
    runs. Concurrency changes the plausible failure set on Windows specifically, so a green matrix is
    load-bearing here rather than routine.

    '
  - '**O2 — no store migration.** `CHECKPOINT_FORMAT` unmoved, no table, column or index added, and a
    0.40.0 store opens and resumes under 0.41.0 unchanged, asserted by the cross-version tests that already
    read the 0.22.0 and 0.29.0 fixture stores.

    '
  - '**N2 — MSRV unmoved.** The crate builds on 1.95 with the toolchain gate CI already runs. Nothing
    here reaches for a newer std API.

    '
