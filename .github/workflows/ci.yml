name: CI

# NF4: the crate builds on macOS, Linux and Windows, holds its declared MSRV,
# and stays clean under `cargo fmt --check` and `cargo clippy -D warnings`.

# `feat/**` is deliberately NOT a push trigger. Every feature branch reaches
# `develop` through a pull request, and a PR already runs this workflow, so
# listing `feat/**` here ran the whole three-OS matrix **twice for every commit**
# — once for the push and once for the PR. The two runs land in different
# `concurrency` groups (`refs/heads/feat/x` vs `refs/pull/N/merge`), so neither
# cancels the other; they just compete for runners and double the wall clock. The
# release flow's own pushes to `develop` and `main` still run, which is what the
# release gate reads.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Every action is pinned to a full-length commit SHA with its human-readable
# version in a trailing comment. A tag is mutable — `v4` is a pointer its owner
# can move, and a compromised or force-pushed tag would run someone else's code
# with this workflow's token. The SHA is not movable, so what ran yesterday is
# what runs today. Dependabot bumps these (see .github/dependabot.yml, which
# targets `develop`) and rewrites the trailing comment with the new version.
#
# Least privilege: every job here only reads the checkout. Nothing publishes,
# comments, or writes back, and no job takes a secret — so a fork PR running
# under this workflow has nothing to exfiltrate and nothing to escalate to.
permissions:
  contents: read

# A superseded run stops immediately rather than muddying the status checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Full debuginfo is the single most expensive thing about a debug build, and on
  # Windows it dominates link time — 345s for `cargo build --all-targets` against
  # 135s for the same step on Linux. `line-tables-only` keeps what CI actually
  # reads out of a failure: a panic already carries its own file and line, and a
  # backtrace keeps frame file/line, which is how the 0.21.0 Windows CRLF failure
  # was diagnosed. What it drops is variable and type debuginfo, useful under a
  # debugger and never available on a runner anyway. Set for both profiles because
  # `test` inherits `dev` in the manifest but not through this env var.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # The three-OS matrix. fail-fast is off on purpose: Linux and Windows have
  # never been built, so one platform failing must not hide the other two.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A cap that never fires means a process that is never killed, so a hung
    # test must not burn a six-hour default.
    #
    # 20 minutes was NOT "well above" a cold Windows build plus the suite, as
    # this comment used to claim. The 0.15.0 run on develop took 19m14s against
    # it — a 46-second margin nobody had measured. 0.16.0 gave all 106 public
    # items a worked example, and a doctest is its own rustc invocation and its
    # own link, which on Windows is the slow part. That spent the margin, and
    # the job was cancelled mid-suite with every test to that point passing.
    #
    # 40 minutes, with the measurement that justifies it written down so the
    # next person to trim it knows what it was sized against.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      # rmcp and a bundled rusqlite are the expensive part of a cold build.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # --all-targets also builds examples/: the mcp and checkpoint tests spawn
      # examples/mcp_fixture_server and examples/crash_fixture as child processes.
      # The default build. It is not redundant with the `--all-features` leg
      # below: eleven `#[cfg(not(feature = ..))]` sites across src/ only compile
      # when a feature is OFF, so the two legs cover the two polarities and
      # neither alone covers both.
      - run: cargo build --all-targets
      - run: cargo test
      # 0.15.0: the git built-ins are in the default build but need the binary.
      # Git is preinstalled on all three runners — asserted rather than
      # installed, because "no system package on any runner" is the constraint
      # that removed OCR and it applies here too.
      - run: git --version
      # 0.14.0: the document and media formats are optional, so the default legs
      # above do not compile a line of them. They run on all three OSes rather
      # than on Linux alone because path separators and line endings both reach
      # these formats — a zip entry name is `/`-separated on every platform, and
      # the text a reader hands back is compared against needles a test wrote —
      # so a Linux-only pass would not be evidence for the other two.
      #
      # One `--all-features` leg, not one per feature. Until 0.21.0 this was
      # `--features documents --lib --tests` followed by `--features media`, and
      # every feature flip recompiles the crate and that feature's dependency
      # tree from scratch: 135s and then 205s on Linux, for 340s of the job's
      # 9 minutes. `--all-features` compiles that superset once. It keeps the
      # doctests, which the old `media` leg needed for the two public items gated
      # on that feature, and the default leg above has already run the
      # default-build doctests, so nothing is run twice.
      #
      # What this leg no longer proves is that each feature compiles *in
      # isolation* — `documents` without `media`, and so on. That coverage moved
      # to the `lint` job, which clippy-compiles each feature set separately in
      # 6-10 seconds each on a warm cache, rather than costing minutes per OS here.
      #
      # `--lib --tests`, so this leg does not re-run the 251 doctests the default
      # leg above already ran on this same OS. A doctest is its own rustc
      # invocation and its own link, which is the slow part on Windows: the first
      # `--all-features` leg written without this flag cost 612s there, against
      # 146s for the whole default `cargo test`.
      - run: cargo test --all-features --lib --tests
      # The doctests that only exist with a feature on — two public items are
      # gated on `media` and their examples only compile with it. Linux only, and
      # once: a doctest is a compile-and-link of an example, and nothing about
      # these two is platform-specific. The cross-platform doctest proof is the
      # default `cargo test` leg above, which runs all 251 on all three OSes.
      # This step reuses the artifacts the step above just built.
      - run: cargo test --all-features --doc
        if: matrix.os == 'ubuntu-latest'

  # The MSRV is read from Cargo.toml rather than hardcoded, so the declared
  # rust-version and the version actually proven to build cannot drift apart.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    # A cap that never fires means a process that is never killed, so a hung
    # test must not burn a six-hour default. 20 minutes is well above a cold
    # Windows build plus the suite.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: rv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rv.outputs.version }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # `check`, not `build`. This job answers one question — does the declared
      # `rust-version` compile this crate — and that is a front-end question.
      # Codegen and linking cannot fail for a reason that is about the compiler
      # version, and the three-OS matrix above builds and runs the real artifacts
      # anyway. Until 0.21.0 this job ran three sequential `cargo build
      # --all-targets` invocations at 178s, 284s and 177s: 10.6 minutes, which
      # made the MSRV job the critical path of the whole workflow.
      #
      # Two `check` invocations, one per feature polarity, for the same reason the
      # test job keeps two legs: eleven `#[cfg(not(feature = ..))]` sites only
      # compile with a feature off, so `--all-features` alone would not see them.
      - run: cargo check --all-targets
      # The declared MSRV has to hold for the crate a consumer actually enables,
      # not only for the default build: an optional dependency raising the floor
      # would otherwise be invisible here and land on them. `--all-features` is
      # the superset of what any consumer can turn on, so it covers `documents`
      # and `media` in one pass instead of one pass each.
      - run: cargo check --all-targets --all-features

  # Lints are platform-independent, so they run once instead of per-OS.
  lint:
    name: lint
    runs-on: ubuntu-latest
    # A cap that never fires means a process that is never killed, so a hung
    # test must not burn a six-hour default. 20 minutes is well above a cold
    # Windows build plus the suite.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Both ways, because the feature gates change which code exists: an unused
      # import behind `#[cfg(feature = ..)]` is only a warning in the build that
      # compiles it.
      #
      # These two steps are also where per-feature *isolation* is proven, since
      # 0.21.0 collapsed the test job's two feature legs into one
      # `--all-features` run. A feature that only compiles when another is also
      # enabled fails here, on a warm cache, in single-digit seconds.
      - run: cargo clippy --all-targets --features documents -- -D warnings
      - run: cargo clippy --all-targets --features media -- -D warnings

  # 0.23.0 — the `links` wall, proven gone. This job exists because of a defect
  # no other job in this file could see, for the same reason the `docs` job
  # below does: it is invisible from inside this crate.
  #
  # `libsqlite3-sys` declares `links = "sqlite3"`, and cargo will not put two
  # versions of a `links` package into one dependency graph. Up to 0.22.0 this
  # crate pinned `rusqlite` 0.32 (`libsqlite3-sys` 0.30), so a program already on
  # `rusqlite` 0.33 or later could not add io-harness **at all** — not a warning,
  # not a duplicate symbol at link time, but a hard resolver error and no build.
  # Every job above passed on that tree, because nothing above ever asks cargo to
  # resolve io-harness *alongside* another `rusqlite`. Only a second package can
  # ask that, which is what `tests/fixtures/links-consumer` is.
  #
  # Linux only. This is a resolver question, and the resolver does not vary by
  # OS; the three-OS matrix above already builds the bundled `libsqlite3-sys` on
  # all three.
  links-consumer:
    name: links-consumer (rusqlite 0.40 coexistence)
    runs-on: ubuntu-latest
    # A cap that never fires means a process that is never killed. 20 minutes,
    # in line with the other single-OS jobs: this compiles the crate twice over
    # (once per fixture) with a bundled SQLite each time.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # The positive control: the fixture depends on `rusqlite` 0.40 directly AND
      # on io-harness by path, so this resolving at all is the claim. It is run,
      # not merely built, because coexistence is about one process — the binary
      # opens a connection through its own `rusqlite` and a `Store` through the
      # crate's, over the same linked `libsqlite3-sys`.
      - name: the fixture builds and runs against this tree
        working-directory: tests/fixtures/links-consumer
        run: cargo run
      # The negative control, and the reason this job is worth its runtime: a
      # proof that only ever passes proves nothing. The same fixture, pointed at
      # the published 0.22.0 instead of this tree, MUST fail — and must fail *at
      # resolution*, before a line is compiled.
      #
      # Copied to RUNNER_TEMP rather than edited in place, so the checkout the
      # step above just used is left untouched and the two builds cannot share a
      # target directory.
      #
      # A build failure is not enough on its own: a network blip, a yanked
      # version or an unrelated compile error would all fail too, and would sail
      # through as "the expected failure". So cargo's output has to name both the
      # `links` conflict and `sqlite3` before this counts as the wall we mean.
      - name: the same fixture must NOT resolve against io-harness 0.22.0
        run: |
          set -uo pipefail
          scratch="$RUNNER_TEMP/links-consumer-0.22.0"
          rm -rf "$scratch"
          cp -R tests/fixtures/links-consumer "$scratch"
          sed -i 's|^io-harness = .*|io-harness = "=0.22.0"|' "$scratch/Cargo.toml"
          if out=$(cd "$scratch" && cargo build 2>&1); then
            echo "::error::io-harness 0.22.0 resolved next to rusqlite 0.40."
            echo "That build is supposed to be impossible — libsqlite3-sys sets"
            echo "links = \"sqlite3\" and 0.22.0 pins rusqlite 0.32. If cargo has"
            echo "started allowing this, or the pin in the fixture drifted, this"
            echo "job no longer proves anything and needs rewriting."
            echo "$out"
            exit 1
          fi
          echo "$out"
          if ! grep -q 'links' <<<"$out" || ! grep -q 'sqlite3' <<<"$out"; then
            echo "::error::0.22.0 failed to build, but not for the links reason."
            echo "Expected cargo to name the links conflict on sqlite3. Something"
            echo "else broke this step and would otherwise pass as the expected"
            echo "failure — read the output above."
            exit 1
          fi
          echo "0.22.0 rejected at resolution, on the links conflict, as expected."

  # 0.30.0 — the store migration is additive, proven backwards. The forward half
  # (a 0.29.0-written database opens, reads and resumes here) runs in the ordinary
  # test job, because the fixtures are committed and this crate is the reader.
  # The BACKWARD half cannot: it needs a real 0.29.0 binary to open a database
  # this tree wrote, and no job above ever compiles the previous release.
  #
  # Without it "additive" is an assertion. 0.30.0 adds two nullable columns to
  # `memory` and a `memory_recalls` table; the claim that an older binary still
  # reads such a store is only evidence when the older binary says so.
  #
  # Linux only, like `links-consumer`: this is a schema question and the schema
  # does not vary by OS, and the three-OS matrix above already runs the forward
  # half everywhere.
  # The id is hyphenated because a job id may not contain a dot — GitHub rejects
  # the whole workflow file at parse time, which is a 0-second run and not a test
  # failure. The displayed name carries the version.
  cross-version-0-29-0:
    name: cross-version-0.29.0 (0.29.0 reads a store this tree wrote)
    runs-on: ubuntu-latest
    # Compiles the previous release from crates.io with a bundled SQLite, then
    # this tree's test binary. 20 minutes, in line with the other single-OS jobs.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # The pinned generator: `io-harness = "=0.29.0"` from crates.io, in its own
      # workspace with its own target directory, so it never drags a second
      # `libsqlite3-sys` into this crate's build.
      - name: build the pinned 0.29.0 binary
        working-directory: tests/fixtures/gen-0.29.0
        run: cargo build
      # `--ignored` because that test is ignored by default — it needs the binary
      # the step above just produced, and a test that silently passes when its
      # subject is missing is worse than one that is visibly not run.
      - name: a 0.29.0 binary reads a store this tree wrote
        run: cargo test --test cross_version_0_29_0 -- --ignored --exact a_current_store_is_read_by_a_0_29_0_binary
      # The control. The generator is supposed to be the PREVIOUS release, and the
      # one way this job quietly stops proving anything is that pin drifting to a
      # version that already knows about the new schema. Checked here rather than
      # trusted, because the failure is silent by construction.
      - name: the generator is still pinned to 0.29.0
        run: |
          set -uo pipefail
          if ! grep -q '^io-harness = "=0.29.0"$' tests/fixtures/gen-0.29.0/Cargo.toml; then
            echo "::error::tests/fixtures/gen-0.29.0 is no longer pinned to =0.29.0."
            echo "That pin is what makes this job evidence rather than a label:"
            echo "with it drifted, the 'older binary' is not older and the"
            echo "backwards-compatibility claim is unproven."
            exit 1
          fi
          echo "still pinned to =0.29.0"

  # OP1 — the docs.rs build, reproduced. This job exists because of a defect no
  # other job in this file could see.
  #
  # 0.16.0 added `#![cfg_attr(docsrs, feature(doc_auto_cfg))]`. Rust removed
  # `doc_auto_cfg` in 1.92.0 and merged it into `doc_cfg`, so docs.rs — which
  # builds on nightly, with `--cfg docsrs`, which nothing else sets — failed with
  # `error[E0557]: feature has been removed`. **0.16.0 and 0.16.1 have no docs.rs
  # page, permanently**: published sources are immutable, so only a forward
  # release can fix it, and 0.16.2 was that release. Every command above passed
  # on the broken tree for two releases, because `docsrs` is set by docs.rs and
  # by nothing else.
  #
  # `doc_cfg` is itself unstable and can go the same way. This is what will catch
  # it before publication rather than after.
  docs:
    name: docs.rs (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # The exact build docs.rs performs: nightly, every feature, `--cfg docsrs`
      # set, dependencies skipped. `-D warnings` because a broken intra-doc link
      # is a page that ships with a dead link on it.
      - name: build the docs the way docs.rs does
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: cargo +nightly doc --all-features --no-deps
      # Exit zero is NOT the check. `doc_auto_cfg` was silently doing nothing for
      # a while before it was removed outright, and a rustdoc that ignores an
      # unknown feature gate exits 0 having produced pages with no feature labels
      # on them — which is the failure this job is really about, since a reader
      # then sees an item with no indication that it needs a feature to exist.
      #
      # So the rendered HTML is grepped for the string rustdoc emits when it
      # labels a gated item. `Media` is gated on `media` and is re-exported from
      # the crate root, so its page must carry one.
      - name: the rendered pages must actually carry the feature labels
        run: |
          set -euo pipefail
          if ! grep -rql "Available on crate feature" target/doc/io_harness/; then
            echo "::error::cargo doc exited 0 but rendered no feature labels."
            echo "The doc_cfg gate in src/lib.rs is not taking effect — see the"
            echo "comment above it. Reproduce locally with:"
            echo "  RUSTDOCFLAGS=\"--cfg docsrs\" cargo +nightly doc --all-features --no-deps"
            exit 1
          fi
          echo "feature labels present in $(grep -rlc "Available on crate feature" \
            target/doc/io_harness/ | wc -l) page(s)"
