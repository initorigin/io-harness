name: CI

# NF4: the crate builds on macOS, Linux and Windows, holds its declared MSRV,
# and stays clean under `cargo fmt --check` and `cargo clippy -D warnings`.

# `feat/**` is deliberately NOT a push trigger. Every feature branch reaches
# `develop` through a pull request, and a PR already runs this workflow, so
# listing `feat/**` here ran the whole three-OS matrix **twice for every commit**
# — once for the push and once for the PR. The two runs land in different
# `concurrency` groups (`refs/heads/feat/x` vs `refs/pull/N/merge`), so neither
# cancels the other; they just compete for runners and double the wall clock. The
# release flow's own pushes to `develop` and `main` still run, which is what the
# release gate reads.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Every action is pinned to a full-length commit SHA with its human-readable
# version in a trailing comment. A tag is mutable — `v4` is a pointer its owner
# can move, and a compromised or force-pushed tag would run someone else's code
# with this workflow's token. The SHA is not movable, so what ran yesterday is
# what runs today. Dependabot bumps these (see .github/dependabot.yml, which
# targets `develop`) and rewrites the trailing comment with the new version.
#
# Least privilege: every job here only reads the checkout. Nothing publishes,
# comments, or writes back, and no job takes a secret — so a fork PR running
# under this workflow has nothing to exfiltrate and nothing to escalate to.
permissions:
  contents: read

# A superseded run stops immediately rather than muddying the status checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Full debuginfo is the single most expensive thing about a debug build, and on
  # Windows it dominates link time — 345s for `cargo build --all-targets` against
  # 135s for the same step on Linux. `line-tables-only` keeps what CI actually
  # reads out of a failure: a panic already carries its own file and line, and a
  # backtrace keeps frame file/line, which is how the 0.21.0 Windows CRLF failure
  # was diagnosed. What it drops is variable and type debuginfo, useful under a
  # debugger and never available on a runner anyway. Set for both profiles because
  # `test` inherits `dev` in the manifest but not through this env var.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # The three-OS matrix, over both feature polarities. fail-fast is off on
  # purpose: Linux and Windows have never been built, so one platform failing
  # must not hide the other two.
  #
  # 0.36.1 — why this is a matrix over `os` x `features` rather than one job per
  # OS running both polarities in sequence.
  #
  # Measured on run 30834723995 (`develop`, 0.36.0's merge), with the dependency
  # cache hitting: the workflow's wall clock was 17m51s and effectively all of it
  # was one leg. `test (windows-latest)` took 17m51s against 8m51s on macOS and
  # 8m23s on Linux; every other job in the file finished inside 90 seconds and
  # then waited. Inside the Windows leg the four steps were `cargo build
  # --all-targets` 317s, `cargo test` 295s, `git --version` 1s, and `cargo test
  # --all-features --lib --tests` 400s.
  #
  # The two polarities are independent questions, and running them one after the
  # other in one job is what makes the leg serial: the feature flip invalidates
  # every artifact the default half just produced, so the 400s step is largely
  # the 317s step done again. Split, they compute at the same time. Each leg
  # takes its own `rust-cache` key, which is what makes this a real saving
  # rather than the same recompile in two places — one shared key would have the
  # two legs overwriting each other's cache every run.
  #
  # What this does NOT do is reduce what is proven. Both polarities still run on
  # all three operating systems, which is the point of the `--all-features` leg
  # existing per-OS at all: path separators and line endings reach the document
  # and media formats, so a Linux-only pass would not be evidence for the other
  # two. Buying wall clock with coverage is the one trade this release refuses.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    # A cap that never fires means a process that is never killed, so a hung
    # test must not burn a six-hour default.
    #
    # 20 minutes was NOT "well above" a cold Windows build plus the suite, as
    # this comment used to claim. The 0.15.0 run on develop took 19m14s against
    # it — a 46-second margin nobody had measured. 0.16.0 gave all 106 public
    # items a worked example, and a doctest is its own rustc invocation and its
    # own link, which on Windows is the slow part. That spent the margin, and
    # the job was cancelled mid-suite with every test to that point passing.
    #
    # 40 minutes, with the measurement that justifies it written down so the
    # next person to trim it knows what it was sized against.
    timeout-minutes: 40
    # 0.36.1, F4 — `rust-lld` links on Windows, and it is proven rather than
    # hoped. `cargo rustc -- --print link-args` on a `windows-latest` runner
    # reported `link.exe` unmodified and `"rust-lld" "-flavor" "link"` with this
    # flag set, and the link completed. That is the toolchain's own account of
    # which linker ran; a flag that is present and silently ignored is exactly
    # the 0.16.0 `doc_auto_cfg` failure, where the setting was there, every
    # command exited 0, and docs.rs had been broken for two releases.
    #
    # Windows only. It is the platform where linking dominates — roughly 95
    # linked executables per polarity, plus 366 doctests that are each their own
    # compile and their own link — and `rust-lld` is the MSVC-flavour linker the
    # toolchain already ships at
    # lib/rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe, so nothing is
    # installed. Linux and macOS keep their default linkers: neither is the
    # critical path, and `rust-lld` for ELF and Mach-O is a separate question
    # with a separate answer.
    #
    # RUSTFLAGS is part of the cache key, so the first run after this lands
    # rebuilds dependencies once and every run after it hits.
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-Clinker=rust-lld' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: [default, all]
        include:
          - features: default
            flags: ""
          - features: all
            flags: "--all-features"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      # rmcp and a bundled rusqlite are the expensive part of a cold build. The
      # key is per-polarity: the two legs compile different dependency sets and a
      # shared key would have them overwrite each other's cache on every run.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.features }}
      # nextest, installed from a prebuilt binary by a SHA-pinned action like
      # every other `uses:` in this file. Not a crate dependency.
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-nextest
      # `--tests` plus the fixture examples by name, NOT `--all-targets`.
      #
      # `--all-targets` linked all 35 examples, on three operating systems, for
      # each of two polarities — 300s of the Windows leg's 317s build step was
      # this crate's own targets, roughly 95 rustc invocations each producing a
      # linked executable. Thirty of those examples are demonstrations no test
      # ever executes; linking them proved only that they compile, which the
      # `examples` job below proves once without linking anything.
      #
      # The five remaining are fixtures a test spawns as a child process, and
      # `--lib --tests` does not build `examples/` — a fact this repository has
      # rediscovered four times, each as a confusing failure about a missing
      # file. `tests/ci_workflow.rs` now derives the spawned set from `tests/`
      # and fails as a named test if this list and that set ever disagree, which
      # is the only reason it is safe to stop building all 35. Do not edit this
      # list by hand against a guess; run the test and it will say what to add.
      - run: >
          cargo build ${{ matrix.flags }} --tests
          --example attach_fixture
          --example crash_fixture
          --example fleet_fixture
          --example flood
          --example lsp_fixture_server
          --example mcp_fixture_server
          --example orphan
          --example plan_gate_fixture
          --example tick
      # 0.53.0: the browser fixture cannot join the line above. It is behind the
      # `browser` feature, so naming it on the default polarity fails outright —
      # cargo refuses a `--example` whose `required-features` are not enabled.
      # It is built on the all-features leg only, which is the leg whose tests
      # spawn it: `tests/browser.rs` is `#![cfg(feature = "browser")]` and
      # compiles to nothing without the feature. Since 0.59.0 that gate carries
      # no platform half, so this step matters on all three operating systems
      # rather than on the two that had a transport.
      #
      # `tests/ci_workflow.rs` scans this whole file for `--example`, so this
      # step is what keeps that guard satisfied — and the guard is what caught
      # the omission in the first place rather than a missing-file failure on a
      # runner.
      - if: matrix.features == 'all'
        run: cargo build --all-features --example browser_fixture
      # 0.15.0: the git built-ins are in the default build but need the binary.
      # Git is preinstalled on all three runners — asserted rather than
      # installed, because "no system package on any runner" is the constraint
      # that removed OCR and it applies here too.
      - run: git --version
      # 0.14.0: the document and media formats are optional, so the default
      # polarity does not compile a line of them. Both polarities run on all
      # three OSes rather than on Linux alone because path separators and line
      # endings both reach these formats — a zip entry name is `/`-separated on
      # every platform, and the text a reader hands back is compared against
      # needles a test wrote — so a Linux-only pass would not be evidence for
      # the other two. Eleven `#[cfg(not(feature = ..))]` sites across src/ only
      # compile when a feature is OFF, so neither polarity alone covers both.
      #
      # One `--all-features` leg, not one per feature. Until 0.21.0 this was
      # `--features documents --lib --tests` followed by `--features media`, and
      # every feature flip recompiles the crate and that feature's dependency
      # tree from scratch: 135s and then 205s on Linux, for 340s of the job's
      # 9 minutes. `--all-features` compiles that superset once.
      #
      # What this leg no longer proves is that each feature compiles *in
      # isolation* — `documents` without `media`, and so on. That coverage moved
      # to the `lint` job, which clippy-compiles each feature set separately in
      # 6-10 seconds each on a warm cache, rather than costing minutes per OS here.
      #
      # `--lib --tests`, so no leg here runs a doctest. A doctest is its own
      # rustc invocation and its own link, which is the slow part on Windows:
      # 251 of them were 172s of the 295s `cargo test` step on run 30834723995,
      # and they share nothing with running the test binaries. They are the
      # `doctest` job below, on the same three operating systems.
      #
      # `cargo nextest run`, not `cargo test`. 59 test binaries were executed
      # sequentially — 122s of the Windows leg's 295s `cargo test` step, with
      # the rest being the doctests that are now their own job. nextest runs
      # them concurrently, process-per-test.
      #
      # It is CI tooling installed by an action, NOT a crate dependency:
      # `cargo tree` still reads 402 lines and Cargo.toml is untouched by this
      # release. nextest does not run doctests at all, which is the second
      # reason the doctests are a job of their own rather than a flag here.
      #
      # The count is the discriminator, not the wall clock. A run that quietly
      # filtered or skipped a binary would look like a speed-up and fail
      # nothing, so the number of tests executed per leg is compared with the
      # number `cargo test` executed for that leg on run 30834723995: 967 in
      # the default polarity and 1044 with every feature on.
      # 0.40.0: let the Linux legs actually exercise the namespaces backend.
      #
      # Ubuntu 24.04 ships `kernel.apparmor_restrict_unprivileged_userns=1`, so
      # an unprivileged `unshare --user` fails, `LinuxSandbox` degrades to the
      # portable floor and reports it, and every containment assertion on this
      # runner would be testing the floor. That is honest behaviour and it is
      # also no evidence at all for the claim that Linux confines writes — a
      # test that passes by taking the fallback is 0.32.0's fact 17 wearing a
      # kernel setting.
      #
      # This does not weaken what is being tested. It restores the setting that
      # is the default on most distributions, so the leg exercises the backend a
      # user without Ubuntu's hardening gets. The degraded path keeps its own
      # coverage: the escape tests branch on the backend that actually applied,
      # so if this step is ever removed or stops working they assert the floor
      # rather than silently proving nothing.
      #
      # `|| true` because the failure mode that matters is the sysctl being
      # absent, not the tests being unable to run: on a runner without it the
      # backend reports the floor and the tests assert the floor.
      - name: permit unprivileged user namespaces so the Linux backend is real
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # `--no-fail-fast`, added in 0.47.0 and it is a lesson about round trips
      # rather than about testing. nextest stops the run on the first failures,
      # and on a platform the development host cannot run at all that turns one
      # defect into one matrix round: four `verify` tests failed here and 698
      # tests — including the ones written to say *why* — never ran. A leg that
      # is going to be red anyway costs nothing extra by finishing, and it
      # answers the next question in the same round.
      - run: cargo nextest run ${{ matrix.flags }} --lib --tests --no-fail-fast
      # 0.47.0 — N5. The Windows backends' per-command cost, printed rather than
      # asserted: the measurement tests carry no threshold, because a wall-clock
      # number on a shared runner is not something a merge should turn on. The
      # release record quotes this step's log.
      #
      # `--success-output immediate` because nextest captures the output of a
      # passing test, and the whole point of these is what they print.
      # Not macOS: 0.46.0 measured `sandbox-exec` and the figure is in its record.
      # The Linux leg here is the one that *restores* unprivileged user
      # namespaces, so it is where the namespace rung can be timed at all — the
      # `contained-linux` leg leaves the restriction in place by design and
      # reports that rung as not measurable.
      - name: measure the per-command containment overhead (N5)
        if: matrix.flags == '' && runner.os != 'macOS'
        run: >
          cargo nextest run --lib
          --run-ignored ignored-only
          --success-output immediate
          -E 'test(n5_)'

  # 0.47.0 — the Linux leg that does NOT touch the sysctl, which is the leg this
  # release exists for.
  #
  # Every leg above restores unprivileged user namespaces so the namespace
  # backend is exercised rather than the fallback. That was right in 0.40.0 and
  # it is still right — but it means the configuration a real user is actually
  # in, a stock Ubuntu 24.04 with `kernel.apparmor_restrict_unprivileged_userns=1`,
  # was tested nowhere. On that host every release up to 0.46.0 took the portable
  # floor: a contained run got resource caps, an ephemeral working directory and
  # a proxy-environment strip, and the filesystem confinement the crate documents
  # was applied on no machine anywhere.
  #
  # So this job leaves the setting alone. `IO_HARNESS_EXPECT_BACKEND` states which
  # rung is expected, and `tests/sandbox.rs` fails if the chain answers with
  # anything else — a test-only assertion, read by no code in the crate. On
  # today's kernels that rung is Landlock, which needs no namespace at all.
  #
  # If this job ever reports `portable-floor`, the release regressed to 0.46.0's
  # behaviour on the commonest Linux CI image in the world, and it will say so
  # rather than passing.
  contained-linux:
    name: contained (ubuntu, userns restricted)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: contained
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-nextest
      # Deliberately no `sysctl` step. Reported so a reader of the log can see
      # which state the leg ran in rather than inferring it from an absence.
      - name: report the host's namespace and Landlock state
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          cat /sys/kernel/security/lsm || true
      # `--lib --tests` does not build `examples/`, and five of the fixtures are
      # spawned as child processes by tests this leg runs. Trap 86: splitting a
      # job removes an ordering nothing declared, and this leg is a split of the
      # `test` job above. The list is the same one, guarded by
      # `tests/ci_workflow.rs` against the set the tests actually spawn.
      - run: >
          cargo build --tests
          --example attach_fixture
          --example crash_fixture
          --example fleet_fixture
          --example flood
          --example lsp_fixture_server
          --example mcp_fixture_server
          --example orphan
          --example plan_gate_fixture
          --example tick
      - run: cargo nextest run --lib --tests --no-fail-fast
        env:
          IO_HARNESS_EXPECT_BACKEND: linux-landlock
      # 0.47.0 — N5, on the leg where the rung under measurement is the one a
      # real user gets. Printed, never asserted: see the note on the Windows
      # twin in the `test` job.
      - name: measure the per-command containment overhead (N5)
        run: >
          cargo nextest run --lib
          --run-ignored ignored-only
          --success-output immediate
          -E 'test(n5_)'

  # 0.36.1 — the doctests, as a job of their own, per operating system.
  #
  # They were 172s of the Windows `cargo test` step's 295s and they are not test
  # binaries: rustdoc compiles and links each one separately, so this work
  # overlaps with nothing the matrix does. Split out, it runs at the same time
  # as both polarities instead of in front of one of them.
  #
  # All 251 still run on all three operating systems. That is deliberate and it
  # is paid for: a doctest using `${env:HOME}` failed on `windows-latest` and
  # nowhere else, which is why doc examples here prefer a literal. This release
  # does not spend coverage to buy time.
  doctest:
    name: doctest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # See the note on the `test` job: 366 doctests are 366 separate links, which
    # is the single place `rust-lld` has the most to do.
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-Clinker=rust-lld' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: doctest
      - run: cargo test --doc
      # The doctests that only exist with a feature on — two public items are
      # gated on `media` and their examples only compile with it. Linux only,
      # and once: nothing about those two is platform-specific, and the
      # cross-platform doctest proof is the step above, which runs all 251 on
      # all three OSes.
      - run: cargo test --all-features --doc
        if: matrix.os == 'ubuntu-latest'

  # 0.36.1 — the thirty demonstration examples, compile-checked rather than
  # linked.
  #
  # Until this release they were built by `--all-targets` in every matrix leg:
  # three operating systems, twice each, six linked copies of thirty binaries
  # that no test executes, to prove they compile. `cargo check` proves exactly
  # that and stops before codegen and linking, which is what the proof was made
  # of on Windows.
  #
  # Both polarities, and the second is not redundant. `documents_live` and
  # `media_git_live` carry `required-features` in Cargo.toml, so a default-only
  # check SKIPS them entirely and would silently stop compiling two examples the
  # old `--all-targets` leg compiled. Linux only: which examples compile is a
  # front-end question and does not vary by OS, and the eight fixtures that do
  # vary by OS are built and executed on all three by the matrix above.
  examples:
    name: examples (compile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: examples
      - run: cargo check --examples
      - run: cargo check --examples --all-features

  # The MSRV is read from Cargo.toml rather than hardcoded, so the declared
  # rust-version and the version actually proven to build cannot drift apart.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    # A cap that never fires means a process that is never killed, so a hung
    # test must not burn a six-hour default. 20 minutes is well above a cold
    # Windows build plus the suite.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: rv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rv.outputs.version }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # `check`, not `build`. This job answers one question — does the declared
      # `rust-version` compile this crate — and that is a front-end question.
      # Codegen and linking cannot fail for a reason that is about the compiler
      # version, and the three-OS matrix above builds and runs the real artifacts
      # anyway. Until 0.21.0 this job ran three sequential `cargo build
      # --all-targets` invocations at 178s, 284s and 177s: 10.6 minutes, which
      # made the MSRV job the critical path of the whole workflow.
      #
      # Two `check` invocations, one per feature polarity, for the same reason the
      # test job keeps two legs: eleven `#[cfg(not(feature = ..))]` sites only
      # compile with a feature off, so `--all-features` alone would not see them.
      - run: cargo check --all-targets
      # The declared MSRV has to hold for the crate a consumer actually enables,
      # not only for the default build: an optional dependency raising the floor
      # would otherwise be invisible here and land on them. `--all-features` is
      # the superset of what any consumer can turn on, so it covers `documents`
      # and `media` in one pass instead of one pass each.
      - run: cargo check --all-targets --all-features

  # Lints are platform-independent, so they run once instead of per-OS.
  lint:
    name: lint
    runs-on: ubuntu-latest
    # A cap that never fires means a process that is never killed, so a hung
    # test must not burn a six-hour default. 20 minutes is well above a cold
    # Windows build plus the suite.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Both ways, because the feature gates change which code exists: an unused
      # import behind `#[cfg(feature = ..)]` is only a warning in the build that
      # compiles it.
      #
      # These two steps are also where per-feature *isolation* is proven, since
      # 0.21.0 collapsed the test job's two feature legs into one
      # `--all-features` run. A feature that only compiles when another is also
      # enabled fails here, on a warm cache, in single-digit seconds.
      - run: cargo clippy --all-targets --features documents -- -D warnings
      - run: cargo clippy --all-targets --features media -- -D warnings

  # 0.23.0 — the `links` wall, proven gone. This job exists because of a defect
  # no other job in this file could see, for the same reason the `docs` job
  # below does: it is invisible from inside this crate.
  #
  # `libsqlite3-sys` declares `links = "sqlite3"`, and cargo will not put two
  # versions of a `links` package into one dependency graph. Up to 0.22.0 this
  # crate pinned `rusqlite` 0.32 (`libsqlite3-sys` 0.30), so a program already on
  # `rusqlite` 0.33 or later could not add io-harness **at all** — not a warning,
  # not a duplicate symbol at link time, but a hard resolver error and no build.
  # Every job above passed on that tree, because nothing above ever asks cargo to
  # resolve io-harness *alongside* another `rusqlite`. Only a second package can
  # ask that, which is what `tests/fixtures/links-consumer` is.
  #
  # Linux only. This is a resolver question, and the resolver does not vary by
  # OS; the three-OS matrix above already builds the bundled `libsqlite3-sys` on
  # all three.
  links-consumer:
    name: links-consumer (rusqlite 0.40 coexistence)
    runs-on: ubuntu-latest
    # A cap that never fires means a process that is never killed. 20 minutes,
    # in line with the other single-OS jobs: this compiles the crate twice over
    # (once per fixture) with a bundled SQLite each time.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # The positive control: the fixture depends on `rusqlite` 0.40 directly AND
      # on io-harness by path, so this resolving at all is the claim. It is run,
      # not merely built, because coexistence is about one process — the binary
      # opens a connection through its own `rusqlite` and a `Store` through the
      # crate's, over the same linked `libsqlite3-sys`.
      - name: the fixture builds and runs against this tree
        working-directory: tests/fixtures/links-consumer
        run: cargo run
      # The negative control, and the reason this job is worth its runtime: a
      # proof that only ever passes proves nothing. The same fixture, pointed at
      # the published 0.22.0 instead of this tree, MUST fail — and must fail *at
      # resolution*, before a line is compiled.
      #
      # Copied to RUNNER_TEMP rather than edited in place, so the checkout the
      # step above just used is left untouched and the two builds cannot share a
      # target directory.
      #
      # A build failure is not enough on its own: a network blip, a yanked
      # version or an unrelated compile error would all fail too, and would sail
      # through as "the expected failure". So cargo's output has to name both the
      # `links` conflict and `sqlite3` before this counts as the wall we mean.
      - name: the same fixture must NOT resolve against io-harness 0.22.0
        run: |
          set -uo pipefail
          scratch="$RUNNER_TEMP/links-consumer-0.22.0"
          rm -rf "$scratch"
          cp -R tests/fixtures/links-consumer "$scratch"
          sed -i 's|^io-harness = .*|io-harness = "=0.22.0"|' "$scratch/Cargo.toml"
          if out=$(cd "$scratch" && cargo build 2>&1); then
            echo "::error::io-harness 0.22.0 resolved next to rusqlite 0.40."
            echo "That build is supposed to be impossible — libsqlite3-sys sets"
            echo "links = \"sqlite3\" and 0.22.0 pins rusqlite 0.32. If cargo has"
            echo "started allowing this, or the pin in the fixture drifted, this"
            echo "job no longer proves anything and needs rewriting."
            echo "$out"
            exit 1
          fi
          echo "$out"
          if ! grep -q 'links' <<<"$out" || ! grep -q 'sqlite3' <<<"$out"; then
            echo "::error::0.22.0 failed to build, but not for the links reason."
            echo "Expected cargo to name the links conflict on sqlite3. Something"
            echo "else broke this step and would otherwise pass as the expected"
            echo "failure — read the output above."
            exit 1
          fi
          echo "0.22.0 rejected at resolution, on the links conflict, as expected."

  # 0.30.0 — the store migration is additive, proven backwards. The forward half
  # (a 0.29.0-written database opens, reads and resumes here) runs in the ordinary
  # test job, because the fixtures are committed and this crate is the reader.
  # The BACKWARD half cannot: it needs a real 0.29.0 binary to open a database
  # this tree wrote, and no job above ever compiles the previous release.
  #
  # Without it "additive" is an assertion. 0.30.0 adds two nullable columns to
  # `memory` and a `memory_recalls` table; the claim that an older binary still
  # reads such a store is only evidence when the older binary says so.
  #
  # Linux only, like `links-consumer`: this is a schema question and the schema
  # does not vary by OS, and the three-OS matrix above already runs the forward
  # half everywhere.
  # The id is hyphenated because a job id may not contain a dot — GitHub rejects
  # the whole workflow file at parse time, which is a 0-second run and not a test
  # failure. The displayed name carries the version.
  cross-version-0-29-0:
    name: cross-version-0.29.0 (0.29.0 reads a store this tree wrote)
    runs-on: ubuntu-latest
    # Compiles the previous release from crates.io with a bundled SQLite, then
    # this tree's test binary. 20 minutes, in line with the other single-OS jobs.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # The pinned generator: `io-harness = "=0.29.0"` from crates.io, in its own
      # workspace with its own target directory, so it never drags a second
      # `libsqlite3-sys` into this crate's build.
      - name: build the pinned 0.29.0 binary
        working-directory: tests/fixtures/gen-0.29.0
        run: cargo build
      # `--ignored` because that test is ignored by default — it needs the binary
      # the step above just produced, and a test that silently passes when its
      # subject is missing is worse than one that is visibly not run.
      - name: a 0.29.0 binary reads a store this tree wrote
        run: cargo test --test cross_version_0_29_0 -- --ignored --exact a_current_store_is_read_by_a_0_29_0_binary
      # The control. The generator is supposed to be the PREVIOUS release, and the
      # one way this job quietly stops proving anything is that pin drifting to a
      # version that already knows about the new schema. Checked here rather than
      # trusted, because the failure is silent by construction.
      - name: the generator is still pinned to 0.29.0
        run: |
          set -uo pipefail
          if ! grep -q '^io-harness = "=0.29.0"$' tests/fixtures/gen-0.29.0/Cargo.toml; then
            echo "::error::tests/fixtures/gen-0.29.0 is no longer pinned to =0.29.0."
            echo "That pin is what makes this job evidence rather than a label:"
            echo "with it drifted, the 'older binary' is not older and the"
            echo "backwards-compatibility claim is unproven."
            exit 1
          fi
          echo "still pinned to =0.29.0"

  # The same job for 0.72.0's own boundary, and a second one rather than a step
  # added to the first: the two pins are independent evidence about different
  # schema changes, and folding them together would mean one crates.io outage
  # taking out both claims. No dots in the job id — that is a parse-time failure
  # of the whole workflow, which is a 0-second run and not a test failure.
  cross-version-0-71-0:
    name: cross-version-0.71.0 (0.71.0 reads a store this tree wrote)
    runs-on: ubuntu-latest
    # Compiles the previous release from crates.io with a bundled SQLite, then this
    # tree's test binary. 20 minutes, in line with the other single-OS jobs.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # The pinned generator: `io-harness = "=0.71.0"` from crates.io, in its own
      # workspace with its own target directory, so it never drags a second
      # `libsqlite3-sys` into this crate's build.
      - name: build the pinned 0.71.0 binary
        working-directory: tests/fixtures/gen-0.71.0
        run: cargo build
      # `--ignored` because that test is ignored by default — it needs the binary the
      # step above just produced, and a test that silently passes when its subject is
      # missing is worse than one that is visibly not run.
      - name: a 0.71.0 binary reads a store this tree wrote
        run: cargo test --test cross_version_0_71_0 -- --ignored --exact a_current_store_is_read_by_a_0_71_0_binary
      # The control. The generator is supposed to be the PREVIOUS release, and the one
      # way this job quietly stops proving anything is that pin drifting to a version
      # that already knows about the new columns. Checked here rather than trusted,
      # because the failure is silent by construction.
      - name: the generator is still pinned to 0.71.0
        run: |
          set -uo pipefail
          if ! grep -q '^io-harness = "=0.71.0"$' tests/fixtures/gen-0.71.0/Cargo.toml; then
            echo "::error::tests/fixtures/gen-0.71.0 is no longer pinned to =0.71.0."
            echo "That pin is what makes this job evidence rather than a label:"
            echo "with it drifted, the 'older binary' is not older and the"
            echo "backwards-compatibility claim is unproven."
            exit 1
          fi
          echo "still pinned to =0.71.0"

  # OP1 — the docs.rs build, reproduced. This job exists because of a defect no
  # other job in this file could see.
  #
  # 0.16.0 added `#![cfg_attr(docsrs, feature(doc_auto_cfg))]`. Rust removed
  # `doc_auto_cfg` in 1.92.0 and merged it into `doc_cfg`, so docs.rs — which
  # builds on nightly, with `--cfg docsrs`, which nothing else sets — failed with
  # `error[E0557]: feature has been removed`. **0.16.0 and 0.16.1 have no docs.rs
  # page, permanently**: published sources are immutable, so only a forward
  # release can fix it, and 0.16.2 was that release. Every command above passed
  # on the broken tree for two releases, because `docsrs` is set by docs.rs and
  # by nothing else.
  #
  # `doc_cfg` is itself unstable and can go the same way. This is what will catch
  # it before publication rather than after.
  docs:
    name: docs.rs (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # The exact build docs.rs performs: nightly, every feature, `--cfg docsrs`
      # set, dependencies skipped. `-D warnings` because a broken intra-doc link
      # is a page that ships with a dead link on it.
      - name: build the docs the way docs.rs does
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: cargo +nightly doc --all-features --no-deps
      # Exit zero is NOT the check. `doc_auto_cfg` was silently doing nothing for
      # a while before it was removed outright, and a rustdoc that ignores an
      # unknown feature gate exits 0 having produced pages with no feature labels
      # on them — which is the failure this job is really about, since a reader
      # then sees an item with no indication that it needs a feature to exist.
      #
      # So the rendered HTML is grepped for the string rustdoc emits when it
      # labels a gated item. `Media` is gated on `media` and is re-exported from
      # the crate root, so its page must carry one.
      - name: the rendered pages must actually carry the feature labels
        run: |
          set -euo pipefail
          if ! grep -rql "Available on crate feature" target/doc/io_harness/; then
            echo "::error::cargo doc exited 0 but rendered no feature labels."
            echo "The doc_cfg gate in src/lib.rs is not taking effect — see the"
            echo "comment above it. Reproduce locally with:"
            echo "  RUSTDOCFLAGS=\"--cfg docsrs\" cargo +nightly doc --all-features --no-deps"
            exit 1
          fi
          echo "feature labels present in $(grep -rlc "Available on crate feature" \
            target/doc/io_harness/ | wc -l) page(s)"
