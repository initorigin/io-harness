# Throwaway diagnostic for 0.59.0's Windows spawn. Never merged.
#
# `ci.yml` triggers on pushes to `main`/`develop` and on pull requests, so a
# `diag/**` branch runs only what is written here.
#
# **Push-triggered, and that is not the default choice.** An interactive session
# would be dispatched by hand — but `workflow_dispatch` is not available for a
# workflow file that is not on the default branch, which is the trap 0.48.0
# recorded. So the probes run on a push and the job ends when they do, which is
# also the shape that cannot strand a runner. The interactive shell is opt-in on
# the commit message (`[tmate]`), for the case a round comes back ambiguous.
#
# Every experiment is built inside the test binary rather than typed at the
# prompt: the tmate shell on Windows is MSYS2 bash, which rewrites path-shaped
# arguments — and one of the two open questions *is* a question about absolute
# paths, so a hand-typed repro there could manufacture the symptom.
name: diag
on:
  push:
    branches: ["diag/**"]

permissions:
  contents: read

# **Not the default.** Cancelling in progress kills a live diagnostic session and
# takes the finding with it; a diag round is the one thing worth finishing even
# when a newer commit exists.
concurrency:
  group: diag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: diag (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # 19 GiB of `target/` against 159 MiB on this crate. Runner disk is finite
      # and cannot be extended mid-job.
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTFLAGS: "-Clinker=rust-lld"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      # A restored cache rewrites `CARGO_HOME` as the runner user — the very tree
      # one of the two questions is about. The first round on this key is cold by
      # construction, and that is recorded with the answer rather than assumed.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: diag

      - name: a place for findings that survives the runner
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path diagnostics | Out-Null

      # What is actually on this runner, before anything is concluded from a
      # failure to find it. The image label goes in the file: the hosted image is
      # versioned and moves between sessions.
      - name: what this runner has
        shell: pwsh
        run: |
          "image: $env:ImageOS $env:ImageVersion" | Tee-Object -FilePath diagnostics/runner.txt
          Get-ChildItem Env: |
            Where-Object { $_.Name -match 'CARGO|RUSTUP|TEMP|USERPROFILE|USERNAME|ImageVersion' } |
            Format-Table -AutoSize | Out-String | Tee-Object -FilePath diagnostics/runner.txt -Append
          foreach ($p in @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe")) {
            "{0} -> {1}" -f $p, (Test-Path $p) | Tee-Object -FilePath diagnostics/runner.txt -Append
          }
          whoami /all | Out-String | Tee-Object -FilePath diagnostics/whoami.txt

      # Built before anything interactive: landing in a shell and then waiting out
      # a cold build spends session time on what the job could have done alone.
      - name: build the probes
        run: cargo build --lib --tests --test diag_windows

      # The browser half's spike: three hypotheses for the two transport handles,
      # scored by whether a real browser answers `Browser.getVersion`.
      - name: browser transport hypotheses
        continue-on-error: true
        shell: pwsh
        run: cargo test --test diag_windows -- --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath diagnostics/browser.txt

      # The access half: which grants this host refuses and why, and what exactly
      # `cmd.exe` refuses by absolute path, with the outside-the-container control
      # beside every case.
      - name: appcontainer grants and the absolute-path refusal
        continue-on-error: true
        shell: pwsh
        run: cargo test --lib -- --nocapture --test-threads=1 diag_which_grants_this_host_refuses_and_why diag_what_exactly_cmd_refuses_by_absolute_path diag_what_the_capability_array_actually_buys_this_container 2>&1 | Tee-Object -FilePath diagnostics/grants.txt

      # The instrument 0.47.0 left behind, run on this same tree so the table and
      # the two probes above are read from one round.
      - name: the capability table as it stands today
        continue-on-error: true
        shell: pwsh
        run: cargo test --lib -- --nocapture what_the_container_actually_permits_on_this_host 2>&1 | Tee-Object -FilePath diagnostics/capability-table.txt

      # Opt-in, because a shell nobody opens holds a runner for its whole timeout.
      # Restricted to the actor: a session is not something anyone with the log
      # URL can walk into.
      - name: an interactive session, only when the commit asks for one
        if: contains(github.event.head_commit.message, '[tmate]')
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        with:
          limit-access-to-actor: true

      # Scrollback dies with the runner; an artifact does not.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: diagnostics
          path: diagnostics/
