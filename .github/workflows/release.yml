name: release

# Cuts the GitHub Release for a version. It does NOT publish to crates.io.
#
# Built to the same shape as the other initorigin repos' release workflows, with
# one difference that follows from what this repo is: semlith ships a binary, so
# its build matrix cross-compiles executables and attaches the archives. This is
# a library — no `[[bin]]`, nothing to cross-compile — so the artifact it
# attaches is the crate tarball `cargo package` already produces, with the same
# `SHA256SUMS` beside it. A reader can verify what was released without trusting
# the registry, which is the point of attaching anything at all.
#
# Two ways in. They differ only in which one creates the tag:
#
#   * push a `v*` tag  — the tag names the version, and the Release is cut from
#     the commit the tag points at
#   * workflow_dispatch — give the version as an input, and the workflow creates
#     the tag itself, pinned to the commit that passed the gate
#
# Either way the same `verify` job has to pass first. A tag trigger used to be
# refused here on the grounds that a tag is too easy to create by accident to be
# the trigger for something irreversible. That reasoning applied to
# `cargo publish`, which this workflow no longer does — a tag and a Release are
# both deletable, so the objection went with the publish job.
#
# The order is the point and it is preserved exactly:
#
#   1. verify   — the version, the commit's branch, the Release, the changelog,
#                 the full gate, and the packaged crate
#   2. release  — checksums, then the Release, notes verbatim from the CHANGELOG
#
# **`cargo publish` is deliberately not here, and must not be added.** The
# owner's standing decision: the Release is automated, the publish stays in a
# human's hands. It is the one step of a release that cannot be recalled — a
# version can never be re-uploaded, and the only remedy is a forward patch plus
# `cargo yank` — so it is run by hand, from a checkout of `main`, and it is
# ALWAYS the last thing that happens. A workflow that could publish is a
# workflow that can publish by mistake.
#
# So the full sequence is: this workflow, then `cargo publish --locked` by hand,
# then sync `develop` with `main`. Never the other way round.
#
# No secret and no environment is required to run this. That is a consequence of
# the above, not an oversight: nothing here talks to a registry.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.19.0). Must equal Cargo.toml's version."
        required: true
        type: string

# Least privilege, per job rather than per workflow: `verify` only reads, and
# only `release` may write to the repository. Nothing here uses the token to
# comment, approve, or change a branch.
permissions:
  contents: read

# Two releases of the same version at once is not a thing anyone wants halfway
# through. Never cancel in progress: an interrupted tag-and-Release is worse
# than a queued one. Keyed on the ref rather than the version input, because on
# a tag push there is no input to key on.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # See the same pair in ci.yml: full debuginfo is the most expensive part of a
  # debug build and nothing on a runner can use it. A panic still names its file
  # and line, and a backtrace still names its frames'.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # ---------------------------------------------------------------------------
  # 1. Everything that can say no, before anything has happened.
  # ---------------------------------------------------------------------------
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.resolve.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changelog section is read from the checkout, and the branch and
          # release checks below need the history and the tags themselves.
          fetch-depth: 0

      # One number, derived once, used by every step after this and by the
      # release job. On a tag push the tag IS the statement of which version this
      # is; on a dispatch the input is. Nothing else in the file re-derives it.
      - name: Resolve the version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            number="${{ inputs.version }}"
          else
            number="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$number" ]; then
            echo "::error::could not determine a version to release."
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "releasing $number"

      # A tag is the only thing that says which version a tag-triggered release
      # is, and nothing else checks it against the crate. Without this, a v0.24.0
      # tag on a tree still declaring 0.23.0 would cut a Release labelled with a
      # version it was not built from.
      - name: Version matches Cargo.toml
        env:
          VERSION: ${{ steps.resolve.outputs.number }}
        run: |
          declared=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "Cargo.toml: $declared"
          echo "release:    $VERSION"
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::Cargo.toml declares $declared, this release is $VERSION."
            exit 1
          fi

      # Replaces an older "the ref must be main" check, which could only ever
      # work on a dispatch: a tag push arrives as refs/tags/vX.Y.Z. Asking
      # whether the COMMIT is on main is the same question and it can be asked
      # either way round. main takes nothing but a develop -> main release PR, so
      # a release cut from a commit that never landed there is a release of
      # something that was never reviewed as one.
      - name: The commit must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/main."
            echo "::error::Releases are cut from commits that reached main through a"
            echo "::error::develop -> main pull request, and nothing else."
            exit 1
          fi

      # On a dispatch the tag must not exist, because the release job is about to
      # create it. On a tag push it necessarily exists — the push is what started
      # this — so the equivalent question is whether a Release has already been
      # cut for it.
      - name: The release must not exist yet
        env:
          VERSION: ${{ steps.resolve.outputs.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if git rev-parse "v$VERSION" >/dev/null 2>&1; then
              echo "::error::tag v$VERSION already exists. Re-run this workflow from the"
              echo "::error::tag instead, or pick the next version — a published version"
              echo "::error::cannot be replaced; the forward fix is the next patch."
              exit 1
            fi
          else
            if gh release view "v$VERSION" >/dev/null 2>&1; then
              echo "::error::a Release for v$VERSION already exists."
              echo "::error::Delete it first if you meant to re-cut it."
              exit 1
            fi
          fi

      # The notes are taken verbatim from the changelog, so a missing section is
      # a release with nothing to say — caught here rather than after the tag.
      # Link-reference definitions are dropped: they resolve inside the file and
      # render as stray `[x]: url` lines in a Release body.
      - name: Notes
        env:
          VERSION: ${{ steps.resolve.outputs.number }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && !/^\[[^]]*\]:/ { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ] || ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no non-empty '## [$VERSION]' section."
            exit 1
          fi
          # The install footer is generated, not typed: the MSRV comes from the
          # manifest so it cannot drift from what the crate actually requires.
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          cat >> release-notes.md <<EOF

          ### Install

          \`\`\`toml
          [dependencies]
          io-harness = "$VERSION"
          \`\`\`

          Or \`cargo add io-harness@$VERSION\`. Requires Rust $msrv or later.

          The \`.crate\` tarball attached below is the exact artifact published to
          crates.io for this version. Verify a download against \`SHA256SUMS\`
          before trusting it.
          EOF
          echo "--- release notes ---"
          cat release-notes.md

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # The same gate ci.yml runs, run again here against the exact commit being
      # released. CI having been green on the PR is not the same claim.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      # One `--all-features` leg rather than one per feature: a feature flip
      # recompiles the crate and that feature's dependency tree from scratch, so
      # two legs cost two recompiles to prove what the superset proves in one.
      # `--lib --tests` because the default `cargo test` above already ran the
      # doctests. Per-feature isolation is the `lint` job's clippy steps in
      # ci.yml, and the default leg above is what covers the
      # `#[cfg(not(feature = ..))]` code that `--all-features` cannot reach.
      - run: cargo test --all-features --lib --tests

      # The package, built and compiled standalone from its own sources — the
      # one check that catches a file the manifest forgot to include. Its output
      # is also the artifact the Release attaches, so this step is doing two jobs
      # and neither is a rebuild of the other.
      - run: cargo package --locked

      - name: Keep the notes for the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

      - name: Keep the packaged crate for the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: target/package/io-harness-${{ steps.resolve.outputs.number }}.crate
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. The tag and the GitHub Release. Reversible: both can be deleted.
  # ---------------------------------------------------------------------------
  release:
    name: release ${{ needs.verify.outputs.version }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Two downloads to two places on purpose: everything under `dist/` is
      # attached to the Release, and the notes are the Release body rather than a
      # file hanging off it.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: dist

      # `*.crate` rather than `*`: globbing over everything would race with the
      # redirect that creates SHA256SUMS, and a checksum file listing itself is
      # a puzzle nobody needs at 3am.
      - name: Checksums
        run: |
          cd dist
          sha256sum *.crate > SHA256SUMS
          cat SHA256SUMS

      # Title is the bare `<repo> X.Y.Z`, no tagline — the house format across
      # every initorigin repo.
      #
      # `target_commitish` only on a dispatch, where the tag does not exist yet
      # and this is what pins it to the commit that passed the gate rather than
      # to whatever main points at by then. On a tag push the tag already names
      # its commit and the field is left unset.
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          name: io-harness ${{ needs.verify.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          target_commitish: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
          fail_on_unmatched_files: true

      # The workflow stops here on purpose. What follows is a human's, and the
      # order below is not a suggestion — publishing before the Release exists
      # is a mistake this repository has actually made.
      - name: What is left for a human
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          echo "::notice::Released io-harness $VERSION. Remaining by hand, in this order:"
          echo "::notice::  1. cargo publish --locked   (from a checkout of main; IRREVERSIBLE, and always last)"
          echo "::notice::  2. sync develop with main   (git merge --ff-only main, then push)"
          echo "::notice::  3. check docs.rs built the page"
          echo "::notice::The UltraShip release record should already be sealed on the feat branch."
