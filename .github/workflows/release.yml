name: release

# Cuts the GitHub Release. `cargo publish` is deliberately not here and must not
# be added: it cannot be recalled, so it is run by hand from main, after the
# Release exists, and always last.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.19.0). Must equal Cargo.toml's version."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # A tag is the only thing that says which version this release is, and nothing
  # else checks it against the crate. Without this a v0.24.0 tag on a tree still
  # declaring 0.23.0 would cut a Release labelled with a version it was not
  # built from.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.resolve.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The tag names the version on a push; the input does on a dispatch.
      - name: Version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            number="${{ inputs.version }}"
          else
            number="${GITHUB_REF_NAME#v}"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Version matches Cargo.toml
        env:
          VERSION: ${{ steps.resolve.outputs.number }}
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "Cargo.toml: $cargo_version"
          echo "release:    $VERSION"
          if [ "$cargo_version" != "$VERSION" ]; then
            echo "::error::tag $VERSION does not match Cargo.toml $cargo_version"
            exit 1
          fi

      # An ancestor test, not a ref test: a tag push arrives as refs/tags/*.
      - name: Commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/main"
            exit 1
          fi

      # A dispatch is about to create the tag, so it must not exist. A tag push
      # already has one, so the question is the Release instead.
      - name: Release does not exist
        env:
          VERSION: ${{ steps.resolve.outputs.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if git rev-parse "v$VERSION" >/dev/null 2>&1; then
              echo "::error::tag v$VERSION already exists; re-run from the tag"
              exit 1
            fi
          elif gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::a Release for v$VERSION already exists"
            exit 1
          fi

      # The release body is this version's CHANGELOG section verbatim, so the
      # notes say what changed instead of linking to it. Link-reference lines are
      # dropped; they would render as stray `[x]: url`.
      - name: Notes
        env:
          VERSION: ${{ steps.resolve.outputs.number }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && !/^\[[^]]*\]:/ { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no non-empty '## [$VERSION]' section"
            exit 1
          fi
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          cat >> release-notes.md <<EOF

          ### Install

          \`\`\`toml
          [dependencies]
          io-harness = "$VERSION"
          \`\`\`

          Or \`cargo add io-harness@$VERSION\`. Requires Rust $msrv or later.

          The \`.crate\` tarball below is the artifact published to crates.io for
          this version. Verify it against \`SHA256SUMS\`.
          EOF
          cat release-notes.md

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # The same gate CI runs, against the exact commit being released.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo test --all-features --lib --tests

      # Catches a file the manifest forgot, and produces the attached artifact.
      - run: cargo package --locked

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: target/package/io-harness-${{ steps.resolve.outputs.number }}.crate
          retention-days: 7
          if-no-files-found: error

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Two paths: everything in dist/ is attached, the notes are the body.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum *.crate > SHA256SUMS
          cat SHA256SUMS

      # Release titles drop the tag's leading "v": "io-harness 0.23.0".
      # `target_commitish` only on a dispatch, where the tag does not exist yet.
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          name: io-harness ${{ needs.verify.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          target_commitish: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
          fail_on_unmatched_files: true

      - name: What is left for a human
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          echo "::notice::Released io-harness $VERSION. By hand, in this order:"
          echo "::notice::  1. cargo publish --locked   (from main; IRREVERSIBLE, always last)"
          echo "::notice::  2. git merge --ff-only main on develop, then push"
          echo "::notice::  3. check docs.rs built the page"
