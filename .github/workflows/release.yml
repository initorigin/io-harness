name: Release

# Cuts the GitHub Release for a version. It does NOT publish to crates.io.
#
# This exists to remove the typing from the Release step of
# docs/RELEASE_PROCESS.md, not to remove the judgement. It is
# `workflow_dispatch` only: nothing here fires on a push, a merge or a tag,
# because a tag is too easy to create by accident to be the trigger for cutting
# a public Release. A human decides a version is ready, presses the button on
# `main`, and the workflow does the same steps in the same order a human would.
#
# The order is the point and it is preserved exactly:
#
#   1. verify   — the version, the branch, the tag, the changelog, and the gate
#   2. release  — tag `main` and publish the GitHub Release, notes from CHANGELOG
#
# **`cargo publish` is deliberately not here, and must not be added.** The
# owner's standing decision: the Release is automated, the publish stays in a
# human's hands. It is the one step of a release that cannot be recalled — a
# version can never be re-uploaded, and the only remedy is a forward patch plus
# `cargo yank` — so it is run by hand, from a checkout of `main`, and it is
# ALWAYS the last thing that happens. A workflow that could publish is a
# workflow that can publish by mistake.
#
# So the full sequence is: this workflow, then `cargo publish --locked` by hand,
# then sync `develop` with `main`. Never the other way round.
#
# No secret and no environment is required to run this. That is a consequence of
# the above, not an oversight: nothing here talks to a registry.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.19.0). Must equal Cargo.toml's version."
        required: true
        type: string

# Least privilege, per job rather than per workflow: `verify` only reads, and
# only `release` may write to the repository. Nothing here uses the token to
# comment, approve, or change a branch.
permissions:
  contents: read

# Two releases of the same version at once is not a thing anyone wants halfway
# through. Never cancel in progress: an interrupted tag-and-Release is worse
# than a queued one.
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # See the same pair in ci.yml: full debuginfo is the most expensive part of a
  # debug build and nothing on a runner can use it. A panic still names its file
  # and line, and a backtrace still names its frames'.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # ---------------------------------------------------------------------------
  # 1. Everything that can say no, before anything has happened.
  # ---------------------------------------------------------------------------
  verify:
    name: verify ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changelog section is read from the checkout, and the tag check
          # below needs the tags themselves.
          fetch-depth: 0

      - name: The ref must be main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::this workflow runs on main only; got ${GITHUB_REF}."
            echo "::error::main takes nothing but a develop -> main release PR, so a"
            echo "::error::release cut from anywhere else is a release of something"
            echo "::error::that was never reviewed as one."
            exit 1
          fi

      - name: The manifest must declare this version
        run: |
          declared=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$declared" != "${{ inputs.version }}" ]; then
            echo "::error::Cargo.toml declares $declared, the run asked for ${{ inputs.version }}."
            exit 1
          fi

      - name: The tag must not exist yet
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::tag v${{ inputs.version }} already exists. A published version"
            echo "::error::cannot be replaced; the forward fix is the next patch."
            exit 1
          fi

      # The notes are taken verbatim from the changelog, so a missing section is
      # a release with nothing to say — caught here rather than after the tag.
      - name: The changelog must carry this version's section
        id: notes
        run: |
          python3 - <<'PY'
          import os, re, sys
          version = os.environ["VERSION"]
          body = open("CHANGELOG.md", encoding="utf-8").read()
          # From this version's heading to the next `## ` heading, exclusive.
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)",
              body,
              re.S | re.M,
          )
          if not match or not match.group(1).strip():
              sys.exit(f"CHANGELOG.md has no non-empty '## [{version}]' section")
          notes = match.group(1).strip()
          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(notes + "\n")
          print(f"{len(notes.splitlines())} lines of notes")
          PY
        env:
          VERSION: ${{ inputs.version }}

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # The same gate ci.yml runs, run again here against the exact commit being
      # released. CI having been green on the PR is not the same claim.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      # One `--all-features` leg rather than one per feature: a feature flip
      # recompiles the crate and that feature's dependency tree from scratch, so
      # two legs cost two recompiles to prove what the superset proves in one.
      # `--lib --tests` because the default `cargo test` above already ran the
      # doctests. Per-feature isolation is the `lint` job's clippy steps in
      # ci.yml, and the default leg above is what covers the
      # `#[cfg(not(feature = ..))]` code that `--all-features` cannot reach.
      - run: cargo test --all-features --lib --tests

      # The package, built and compiled standalone from its own sources — the
      # one check that catches a file the manifest forgot to include.
      - run: cargo package --locked

      - name: Keep the notes for the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. The tag and the GitHub Release. Reversible: both can be deleted.
  # ---------------------------------------------------------------------------
  release:
    name: release ${{ inputs.version }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes

      # Title is the bare `<repo> X.Y.Z`, no tagline — the house format across
      # every initorigin repo. `--target` pins the Release to the commit that
      # passed the gate rather than to whatever main points at by then.
      - name: Cut the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "io-harness ${{ inputs.version }}" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}"

      # The workflow stops here on purpose. What follows is a human's, and the
      # order below is not a suggestion — publishing before the Release exists
      # is a mistake this repository has actually made.
      - name: What is left for a human
        run: |
          echo "::notice::Released io-harness ${{ inputs.version }}. Remaining by hand, in this order:"
          echo "::notice::  1. cargo publish --locked   (from a checkout of main; IRREVERSIBLE, and always last)"
          echo "::notice::  2. sync develop with main   (git merge --ff-only main, then push)"
          echo "::notice::  3. check docs.rs built the page"
          echo "::notice::The UltraShip release record should already be sealed on the feat branch."
