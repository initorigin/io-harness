name: release

# Cuts the GitHub Release. `cargo publish` is deliberately not here and must not
# be added: it cannot be recalled, so it is run by hand from main, after the
# Release exists, and always last.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.19.0). Must equal Cargo.toml's version."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # 0.36.1 — the gates that were one serial `verify` job are now five jobs that
  # run at once. Measured at 7m18s on run 30834005895, of which `cargo test` was
  # 222s and `cargo test --all-features --lib --tests` was 155s, one after the
  # other, with fmt, clippy and `cargo package` in the same queue behind them.
  #
  # What must NOT change is the ordering that matters: nothing is tagged and no
  # Release is cut until every check has passed. That is preserved by `release`
  # naming every gate in its `needs:`, not by the gates being sequential — a
  # parallel split that let `release` start on a partial `needs:` would cut a
  # Release for a tree that failed a gate, which is the one way this change can
  # do real damage.
  #
  # `checks` stays first and alone because it is the cheap half and everything
  # else is pointless without it: a tag that does not match the manifest, a
  # commit that is not on main, a Release that already exists, or a version with
  # no changelog section. It also resolves the version every other job reads.
  #
  # A tag is the only thing that says which version this release is, and nothing
  # else checks it against the crate. Without this a v0.24.0 tag on a tree still
  # declaring 0.23.0 would cut a Release labelled with a version it was not
  # built from.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The tag names the version on a push; the input does on a dispatch.
      - name: Version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            number="${{ inputs.version }}"
          else
            number="${GITHUB_REF_NAME#v}"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Version matches Cargo.toml
        env:
          VERSION: ${{ steps.resolve.outputs.number }}
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "Cargo.toml: $cargo_version"
          echo "release:    $VERSION"
          if [ "$cargo_version" != "$VERSION" ]; then
            echo "::error::tag $VERSION does not match Cargo.toml $cargo_version"
            exit 1
          fi

      # An ancestor test, not a ref test: a tag push arrives as refs/tags/*.
      - name: Commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/main"
            exit 1
          fi

      # A dispatch is about to create the tag, so it must not exist. A tag push
      # already has one, so the question is the Release instead.
      - name: Release does not exist
        env:
          VERSION: ${{ steps.resolve.outputs.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if git rev-parse "v$VERSION" >/dev/null 2>&1; then
              echo "::error::tag v$VERSION already exists; re-run from the tag"
              exit 1
            fi
          elif gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::a Release for v$VERSION already exists"
            exit 1
          fi

      # The changelog has to carry this version before anything is tagged. The
      # notes themselves are built in the release job.
      - name: Changelog has a section
        env:
          VERSION: ${{ steps.resolve.outputs.number }}
        run: |
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi

  # The lint gate: the same commands CI runs, against the exact commit being
  # released.
  lint:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-lint
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # The default polarity, including the doctests. `cargo test` unqualified, as
  # it was in the old verify job: this is the release gate and it is deliberately
  # the plain invocation, not CI's split one.
  test-default:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-default
      # 0.40.0, and it is here because a guard written for ci.yml does not cover
      # this file — trap 87, paid for in 0.36.1 when release.yml's all-features
      # job inherited an ordering nothing declared. Ubuntu 24.04 restricts
      # unprivileged user namespaces, which makes LinuxSandbox degrade to the
      # portable floor and report it; without this the release gate would test
      # the floor and pass, which is worse than failing.
      - name: permit unprivileged user namespaces so the Linux backend is real
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: cargo test

  # 0.47.0 — the release gate's copy of the leg that leaves the sysctl alone.
  #
  # It is a separate job rather than a step because trap 87 is exactly this: a
  # guard written for ci.yml does not cover this file, and the leg that matters
  # most is the one asserting the rung a real user gets. Every other Linux job
  # here restores unprivileged user namespaces; this one does not, and states
  # which rung it expects.
  contained-linux:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-contained
      - name: report the host's namespace and Landlock state
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          cat /sys/kernel/security/lsm || true
      # See the note in ci.yml: `--lib --tests` does not build `examples/`, and
      # this leg runs tests that spawn five of them.
      - run: >
          cargo build --tests
          --example attach_fixture
          --example crash_fixture
          --example fleet_fixture
          --example flood
          --example lsp_fixture_server
          --example mcp_fixture_server
          --example orphan
          --example plan_gate_fixture
          --example tick
      - run: cargo test --lib --tests
        env:
          IO_HARNESS_EXPECT_BACKEND: linux-landlock

  # The other polarity. 155s on run 30834005895, run after the 222s above it
  # rather than beside it, and the feature flip invalidated the artifacts that
  # step had just produced. Its own job and its own cache key for the same
  # reason the CI matrix split.
  test-all-features:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-all
      # `--lib --tests` does not build `examples/`, and four tests spawn an
      # example binary as a child process. Until 0.36.1 this job did not need
      # the step: it lived inside the serial `verify` job, where `cargo test`
      # ran first and built every example as a side effect. Splitting the two
      # invocations into separate jobs removed that accident and the attach
      # tests failed on the 0.36.1 release run — traps 2, 18, 35 and 54, in the
      # one place four previous discoveries had not looked.
      #
      # `--examples` rather than the fixture list CI names: this job is a
      # release gate and not the wall-clock target, and a list here would be a
      # second list to keep in step with `tests/ci_workflow.rs`'s.
      - run: cargo build --all-features --examples
      # The same reason as the sibling job above. Both release-gate legs run on
      # ubuntu-latest, so both need it or the gate is half-blind.
      - name: permit unprivileged user namespaces so the Linux backend is real
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: cargo test --all-features --lib --tests

  # Catches a file the manifest forgot, and produces the attached artifact.
  package:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-package
      - run: cargo package --locked
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: target/package/io-harness-${{ needs.checks.outputs.version }}.crate
          retention-days: 7
          if-no-files-found: error

  # Every gate is named here. This list is the ordering the split had to keep:
  # a Release is cut only when all five have passed.
  release:
    needs: [checks, lint, test-default, test-all-features, contained-linux, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum *.crate > SHA256SUMS
          cat SHA256SUMS

      # The release body is this version's CHANGELOG section verbatim, so the
      # notes say what changed instead of linking to it. Link-reference lines are
      # dropped; they would render as stray `[x]: url`.
      - name: Notes
        env:
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && !/^\[[^]]*\]:/ { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no non-empty '## [$VERSION]' section"
            exit 1
          fi
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          cat >> notes.md <<EOF

          ### Install

          \`\`\`toml
          [dependencies]
          io-harness = "$VERSION"
          \`\`\`

          Or \`cargo add io-harness@$VERSION\`. Requires Rust $msrv or later.

          The \`.crate\` tarball below is the artifact published to crates.io for
          this version. Verify it against \`SHA256SUMS\`.
          EOF
          cat notes.md

      # Release titles drop the tag's leading "v": "io-harness 0.23.0".
      # `target_commitish` only on a dispatch, where the tag does not exist yet.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.checks.outputs.version }}
          name: io-harness ${{ needs.checks.outputs.version }}
          body_path: notes.md
          files: dist/*
          target_commitish: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
          fail_on_unmatched_files: true

      - name: What is left for a human
        env:
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          echo "::notice::Released io-harness $VERSION. By hand, in this order:"
          echo "::notice::  1. cargo publish --locked   (from main; IRREVERSIBLE, always last)"
          echo "::notice::  2. git merge --ff-only main on develop, then push"
          echo "::notice::  3. check docs.rs built the page"
